# A PostgreSQL the suite CONNECTS to, never one it starts
# (REQ-TEST-095 criteria 1 and 4). The distinction is the point: the
# suite takes a connection string for a database that already exists,
# and this file is one way of making sure one does. A suite that
# started its own would be testing a database nobody deploys.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      db:
        # NOT just `depends_on: [db]`. A started container is not an
        # accepting one, and the suite refuses to run without a
        # reachable database rather than skipping - so waiting for the
        # health check is what makes a fresh container's first test run
        # work instead of failing on a race.
        condition: service_healthy

  db:
    # The same major CI runs. See devcontainer.json's own note.
    image: postgres:16
    restart: unless-stopped
    # NO POSTGRES_DB: the database the image would make, `supply`, belongs
    # to no asset since the split. Each asset's own, supply_<asset>, is made
    # by create-asset-databases.sh from the asset folders mounted read-only
    # beside it (Keith, 2026-11-15), once, when the volume is first
    # initialised - an existing volume needs `docker compose down -v` first.
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../assets:/mothman-assets:ro
      - ./create-asset-databases.sh:/docker-entrypoint-initdb.d/create-asset-databases.sh:ro
    healthcheck:
      # OVER TCP, not the socket: while the init scripts run, the image's
      # temporary server listens on the socket only, so this is not healthy
      # until they have finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
