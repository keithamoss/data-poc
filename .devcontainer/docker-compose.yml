# A PostgreSQL the suite CONNECTS to, never one it starts
# (REQ-TEST-095 criteria 1 and 4). The distinction is the point: the
# suite takes a connection string for a database that already exists,
# and this file is one way of making sure one does. A suite that
# started its own would be testing a database nobody deploys.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      db:
        # NOT just `depends_on: [db]`. A started container is not an
        # accepting one, and the suite refuses to run without a
        # reachable database rather than skipping - so waiting for the
        # health check is what makes a fresh container's first test run
        # work instead of failing on a race.
        condition: service_healthy

  db:
    # The same major CI runs. See devcontainer.json's own note.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: supply
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d supply"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
