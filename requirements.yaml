  - id: REQ-DOCS-014
    title: A live requirements register, tied to real tests
    story: >
      As a product owner, I want real user stories tracked with MoSCoW
      priority, implementation status, and a real (not decorative) tie
      back to the tests that verify them, so that I have a genuine,
      trustworthy view of what's actually been delivered.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-18 (plans/qa-pipeline.md item 75, and
      plans/running-thoughts.md #7 for its dashboard panel): "having
      like actual requirements... user stories, requirements, and
      acceptance criteria... track MoSCoW status... have we implemented
      them yet... tie them back to the actual tests"
    acceptance_criteria:
      - Every requirement's linked_tests are validated to actually
        exist in CI, not just asserted in prose.
      - A "built" requirement can't ship with zero real linked tests.
    linked_tests:
      - tests/test_validate_requirements.py
      - tests/test_requirements_yaml.py
    evidence:
      - >
        2026-09-20: yamllint's key-duplicates rule run across every
        hand-authored YAML file in the repo reports zero findings, and
        catches a deliberately planted duplicate at the exact line. On
        its default ruleset the same files report 230 findings, 220 of
        them line-length, which is why every style rule is disabled.
      - >
        2026-09-20: 27 requirements validate with zero errors, every
        linked_tests and implemented_by entry resolving to a real file or a
        real AST-verified symbol.
    decisions:
      - >
        Linkage to tests is enforced by CI against a real AST parse rather than a string match, because a decorative reference to a test that does not exist is the exact failure this register was built to prevent.
      - >
        A duplicate mapping key is rejected outright rather than left to
        PyYAML's last-one-wins. It cost 5 real decisions before the check
        existed, and nothing in the Python stack noticed - safe_load, the
        check-yaml hook and the whole test suite all passed.
      - >
        Used yamllint rather than a hand-written checker or ruamel.yaml.
        Keith's challenge - "can't we use a library rather than these
        hacky scripts" - was right, and a first attempt did hand-roll a
        PyYAML node walk. ruamel also detects duplicates, but soda-core
        pins it below 0.18 so this repo is stuck on a 2023 release
        chosen by a QA tool. yamllint is purpose-built, has no such
        entanglement, and makes it a named rule rather than a side
        effect of a stricter parser.
      - >
        Rejected doing this with a schema, verified rather than assumed.
        Schema validation runs on the already-parsed object, and a
        duplicate key does not make the key MISSING - it leaves it
        present with truncated content. A jsonschema model requiring a
        non-empty decisions list PASSED on the exact failing input.
      - >
        Runs in CI as well as pre-commit, because hooks only fire for
        people who ran `pre-commit install`.
      - >
        The register describes the PRODUCT, not this project's own working process, so conventions about how we work stay in plans files rather than becoming pseudo-requirements.
    implemented_by:
      - requirements.yaml
      - .yamllint
      - .pre-commit-config.yaml
      - .github/workflows/test.yml
      - dashboard/requirements_yaml.py::parse_requirements
      - qa_tools/common/validate_requirements.py::validate

  - id: REQ-PIPE-068
    title: One database, and every read of supply data goes through a per-run view schema
    date_written: "2026-09-24"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: >
      As whoever maintains this pipeline, I want one durable database
      and one place where a logical table name becomes a physical
      table, so that staging has somewhere to stage into and a check
      can never read a table that is half-loaded, ambiguous or simply
      the wrong version.
    moscow: must
    status: built
    source: >
      SPLIT OUT OF REQ-PIPE-035 on 2026-09-24 (Keith), which covered
      three separable things under one signed id - period schemas, the
      per-run view schema, and one database. REQ-PIPE-060's build-order
      decision moved "the single-database half" forward to delivery
      sprint 8, but sprint 8 needs the VIEW SCHEMA too and neither half
      of that split named it. See plans/supply-model.md, "Batch 3's
      pre-build review".
    acceptance_criteria:
      - THE SYSTEM SHALL resolve each logical table name a check uses to
        exactly one physical table, through a per-run schema containing
        only views, and SHALL discard that schema once the run
        completes.
      - THE SYSTEM SHALL route every read of supply data through that
        per-run schema, and SHALL NOT query a physical table directly
        from any check, tool invocation or downstream reader.
      - WHERE a logical name has more than one candidate physical table
        and no basis on which to choose, THE SYSTEM SHALL NOT create a
        view for it, and SHALL treat that name as absent for the run
        rather than selecting one of the candidates.
      - THE SYSTEM SHALL treat a table as present for the run only where
        it resolves to exactly one version, and SHALL NOT treat the mere
        existence of files claiming that name as presence.
      - THE SYSTEM SHALL record, for every QA run, which physical
        version of each table it read, in committed history that
        outlives the discarded per-run schema.
      - THE SYSTEM SHALL name a per-run schema so that one left behind
        by an interrupted run is identifiable and removable without
        reference to any other record.
      - THE SYSTEM SHALL hold all period schemas, the staging schema and
        the rejected schema in one database, and SHALL NOT create a
        database per run.
    non_functional_requirements:
      - >
        This is what delivery sprint 8 cannot start without. Staging has
        nowhere to stage into without a durable database, and
        REQ-PIPE-060 criterion 7's guarantee - a staged table is visible
        to a check only once its load record exists - is delivered by
        the view, not by the table. Without criteria 11-14 of the
        original REQ-PIPE-035, the honest implementation of that
        criterion is the whole-delivery transaction Keith rejected on
        scale.
      - >
        CI and any read-committed-history path may never open or query
        any database, including this one.
      - >
        Test isolation must be arranged deliberately rather than falling
        out of a database per run, which this requirement removes. One
        database per test worker is the shape REQ-PIPE-060's own
        decisions assume.
      - >
        A per-run schema left behind by an interrupted run must be
        identifiable and removable on its own terms, because at ~30
        datasets with years of history an accumulating set of orphaned
        schemas is a real operational cost rather than untidiness.
    dependencies: []
    decisions:
      - >
        SPLIT SETTLED 2026-09-24 (Keith), option (a) of four: split
        REQ-PIPE-035 in two along the corrected line rather than three
        ways, whole, or with an IOU. Three ways was rejected because two
        of the three would be signed and built together anyway; building
        035 whole now contradicts its own build-order decision that
        period schemas here are "shelves years before anything decides
        what goes on them"; and an IOU against a partially-built
        requirement is the exact shape CLAUDE.md already records as a
        failure.
      - >
        The line moved from where REQ-PIPE-060's decision first drew it.
        That decision split sprint 13 into "the single-database half"
        and "the schema-per-period half", which is two pieces where
        there are three. The per-run VIEW SCHEMA is named by neither,
        and sprint 8 needs it: REQ-PIPE-060 criterion 7 depends on it,
        and REQ-PIPE-059's own decision states that two duplicated
        datasets "get no view, because REQ-PIPE-035 now forbids choosing
        between candidates" - which is criterion 13 of that requirement,
        now criterion 3 here.
      - >
        WHY THE SPLIT IS SAFE, carried over from REQ-PIPE-060 rather
        than restated loosely: moving the single-database half forward
        leaves a window with one database and no per-run isolation,
        survivable ONLY because nothing runs QA between sprint 8 and
        sprint 15. The same reason disposes of the verified
        one-process-per-database blocker: dbt is the concurrent writer
        and does not run until QA does. If QA ever moves earlier than
        sprint 15, this stops holding.
      - >
        SETTLED 2026-09-24 (Keith): criterion 5 here is the single copy,
        and REQ-PIPE-038's criterion 9 was DROPPED. The two stated one
        obligation - record which physical table each run read - across
        two signed requirements. It belongs with the mechanism that does
        the resolving, which is this requirement; 038 owns re-keying
        committed history and merely restated it.
      - >
        Decided dbt gets a SCRATCH DATABASE PER RUN and ATTACHes this
        one read-only - Keith, 2026-09-25, over two alternatives he was
        shown. Serialising the whole QA fan-out is the literal reading
        and costs the parallel default he chose on 2026-09-19 (measured
        ~83s to ~220s on the suite); leaving today's QA on per-run
        databases until sprint 15 ships the requirement with criterion 2
        unmet across the whole pipeline. The distinction that makes this
        legitimate rather than a dodge: criterion 7 forbids a database
        per run for SUPPLY DATA, which now lives in one database and
        nowhere else, and dbt's scratch holds only its own materialised
        views and test results - a tool artefact sprint 15 removes.
      - >
        The writer problem is real and was VERIFIED BY EXPERIMENT before
        anything was designed around it: many processes may open one
        DuckDB file read-only at once, and a single writer excludes
        everyone, readers included. duckdb.org was blocked at the time;
        Keith allow-listed it the same day and its own documentation
        says the same thing in as many words. Recorded because the
        cheap reading - "we already have --sequential, we are done" -
        silently costs the parallel default for the whole suite.
      - >
        Decided the per-run VIEWS ARE BUILT IN THE LOAD PHASE and
        discarded after the fan-out, rather than by the tools that read
        them. Both are writes. A tool that built its own view, or tidied
        up after itself, would take the exclusive lock and stall every
        other worker - a failure that surfaces as somebody else's crash.
      - >
        Decided candidates are SCOPED TO THE RUN. Found by running the
        real pipeline: asking for candidates across the whole staging
        schema meant the forty-second run saw forty-two versions of one
        logical name, the ambiguity rule correctly refused to choose,
        and dbt failed to find a table sitting right there. The rule was
        right and the question was wrong - and the symptom reads like a
        missing table, not a scoping mistake. Ambiguity within ONE run,
        which is REQ-PIPE-059's two-files-for-one-dataset case, is what
        it is really for.
      - >
        Decided the resolution is RECORDED AT STAGING TIME rather than
        reconstructed later. Staging is the only moment it is an
        observed fact; re-deriving it afterwards against a staging
        schema that has moved on answers a different question and looks
        like the same one.
    open_questions: []
    unmet_criteria:
      - criterion: >-
          Criterion 2, in part - datacontract-cli and Evidently read
          supply CSVs straight off disk rather than through the per-run
          view schema, so two of the four tools are outside "every read
          of supply data".
        why: >-
          Neither tool touches DuckDB at all today: datacontract-cli is
          pointed at a CSV path and Evidently is handed a dataframe read
          from one. Moving them is a real piece of work rather than a
          repoint, and delivery sprint 15 rebuilds how QA is invoked
          anyway. Flagged rather than quietly counted as done.
        owner: Keith, to place at sprint 15 or sooner
    linked_tests:
      - tests/test_supply_db.py
      - tests/test_build_warehouses_rebuild.py
      - tests/test_run_dbt_bdm.py
      - tests/test_run_soda_bdm.py
      - tests/test_orchestrate_single_run.py
    implemented_by:
      - qa_tools/common/supply_db.py::create_run_views
      - qa_tools/common/supply_db.py::candidates_in
      - qa_tools/common/supply_db.py::record_resolution
      - qa_tools/common/supply_db.py::drop_orphan_run_schemas
      - qa_tools/common/supply_db.py::connect_dbt_scratch
      - qa_tools/bdm/build_per_run_warehouses.py::build_one
      - qa_tools/cp/build_cp_warehouses.py::add_table_to_run
    evidence:
      - >-
        2026-09-25: the migration was proved BEHAVIOUR-PRESERVING
        against real data rather than argued. A full pipeline run over
        both collections - 42 Birth Registrations runs and 18 Child
        Protection ones, parallel by default - was diffed against the
        committed history it replaced: 6545 recorded check verdicts,
        every one identical, and no run with a different set of checks
        except one whose Soda check was added to the contract the day
        after that history was last regenerated.
      - >-
        2026-09-25: it also found a real latent bug it did not cause.
        Twelve value aggregates came back in a different ORDER, because
        the query ordered by count with no tie-break, so the same data
        stored differently aggregated differently - and with a LIMIT
        under it that does not merely reorder a list, it decides which
        value a reader sees. This repo is seeded so that regenerating
        and diffing is a real correctness check, which that quietly took
        away. Reproduced deterministically, fixed with a secondary sort,
        and covered by a test that fails against the old query.
      - >-
        2026-09-25: the concurrency the whole design rests on is
        asserted, not assumed - a test starts three real processes
        against one database and confirms they may all read it at once.
        The failing half was found the same way: dbt's staging models
        are VIEWS over the attached database, so reading them from a
        connection that has not attached it raises `Catalog "supply"
        does not exist` at bind time.
      - >-
        2026-09-25: criteria 1 and 6 are visible in a real run's own
        output - "discarded 42 per-run view schema(s)" and "discarded 18
        per-run view schema(s)" - and the database has none left
        afterwards. Criterion 5 is a committed `tables_read.json` beside
        each run's results, naming the physical table each logical name
        resolved to.
      - >-
        2026-09-25: all nine mothman gates green, 1438 Python tests and
        294 JS tests. The test suite moved off a directory of per-run
        databases onto one database per test WORKER, which is the
        isolation this requirement's own NFR asks for in as many words -
        isolation used to fall out of a database per run, and this
        removes that.

  - id: REQ-PIPE-069
    title: Every delivery is recorded as its own committed file, written once at recognition
    date_written: "2026-09-24"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: >
      As whoever reads this history years from now, I want what arrived
      and what it was attributed to recorded beside the QA results and
      never rewritten, so that the record of an arrival outlives the
      warehouse that held it and can be queried without one.
    moscow: must
    status: built
    source: >
      SPLIT OUT OF REQ-PIPE-038 on 2026-09-24 (Keith), which covered two
      separable things under one signed id - re-keying committed QA
      history per dataset, and the delivery log. The delivery log moves
      forward to sit with recognition (delivery sprint 7), because
      RECOGNITION IS WHAT WRITES IT, and because REQ-PIPE-058's
      collision gate has no corpus without it. See
      plans/supply-model.md, "Blocker 2 resolved - the delivery log is
      the corpus".
    acceptance_criteria:
      - THE SYSTEM SHALL record every delivery as its own committed
        file, written once when the delivery is recognised, and SHALL
        NOT append to, edit or re-write a delivery's file afterwards.
      - THE SYSTEM SHALL store those files outside the per-dataset QA
        results, in a location of their own, because a delivery spans
        datasets and is not a QA result.
      - THE SYSTEM SHALL record, in a delivery's own file, every file it
        carried by the name it arrived under, and the dataset each was
        attributed to where one was, and SHALL NOT record in it any
        outcome that is not known at recognition time.
      - THE SYSTEM SHALL make the delivery record queryable as SQL
        directly from the committed files, and SHALL NOT maintain a
        second copy of it in the warehouse.
      - THE SYSTEM SHALL preserve the recorded offset of every instant
        read back out of a delivery file, and SHALL NOT let it be
        inferred as a naive or UTC-normalised value.
      - THE SYSTEM SHALL regenerate the delivery log from scratch
        alongside the QA results, under the same delete-and-regenerate
        rule, and SHALL NOT leave delivery records describing a history
        that no longer exists.
    non_functional_requirements:
      - >
        This is REQ-PIPE-058 criterion 8's corpus. That criterion gates
        "any filename in the committed delivery history", and no such
        history exists today - data/deliveries/ is gitignored and no
        committed dataset_stats.json contains a filename at all. Without
        this requirement the gate reads data/ and passes vacuously in CI
        and on every fresh clone, which is the failure REQ-PIPE-057's
        own NFR names.
      - >
        The record is read on the read-committed-history path, which may
        never open data/. That is what makes it usable by the gate in
        deploy-pages.yml at all, and it is why the record must be
        committed rather than held in the warehouse.
      - >
        This repo is public, so a recorded filename becomes a published
        string, and REQ-PIPE-057's own NFR states that a filename can
        itself identify a person in a Birth Registrations or Child
        Protection context. Today's are synthetic; the real-deployment
        judgement should be made on real-deployment terms rather than
        inherited from this PoC.
      - >
        Written once at recognition and never rewritten. Anything known
        only after loading belongs to REQ-PIPE-060's processing log, not
        here.
    dependencies: [REQ-PIPE-057]
    decisions:
      - >
        SETTLED 2026-09-24 (Keith): THE DELIVERY LOG IS THE CORPUS for
        REQ-PIPE-058's collision gate. He arrived at it by asking
        whether the warehouse is committed - it is not, zero files under
        data/ are tracked - and then what the delivery log would give us
        if it were not gitignored. It already records exactly the
        attribution pairs the gate needs.
      - >
        It beats the committed fixture corpus this session had
        recommended, because it is the REAL history rather than examples
        somebody thought to add - which was that option's whole
        weakness. Also rejected: reading data/deliveries/ directly,
        which would put a data/ read into the deploy path and break the
        standing rule outright rather than merely being vacuous; and
        running the gate in test.yml where generated data exists, which
        leaves it outside mothman check, which REQ-PIPE-058 criterion 13
        requires.
      - >
        Queryability was verified by real experiment rather than
        assumed, and the finding is carried over from REQ-PIPE-038:
        DuckDB reads the committed JSON files straight into a SQL view
        via read_json_auto over a glob, joinable against the staging and
        period schemas, with nothing synced and nothing duplicated. A
        second copy of the log in the warehouse was rejected as two
        records that can drift for no gain.
      - >
        The moment matters and was got wrong once already, in
        REQ-PIPE-038 before this split: RECOGNITION HAPPENS BEFORE
        LOADING, so a file written at recognition cannot carry load
        outcomes. That contradiction was found on 2026-09-24 and
        resolved by REQ-PIPE-060's processing log - the delivery file
        holds RECOGNITION facts, the processing log holds LOAD facts,
        two files, two moments, neither ever rewritten.
      - >
        DUPLICATION FLAGGED, not resolved: REQ-PIPE-038's surviving
        criterion 8 (record each table's LOAD OUTCOME as its own
        committed record) restates REQ-PIPE-060 criterion 13. Two signed
        requirements own the processing log between them.
      - >
        SETTLED 2026-09-24 (Keith): criterion 3 records EVERY FILE BY
        THE NAME IT ARRIVED UNDER, not every table. As drafted it said
        "every table it carried", which fails twice. REQ-PIPE-058's
        collision gate checks filename-to-dataset pairs, and a logical
        table name is not what attribution reads - a file's NAME is. And
        a JUNK FILE - a Word document, a PDF, somebody's test PNG - is
        not a table and has no dataset, so it would not have been
        recorded at all.
      - >
        The junk-file half is the sharper one and Keith raised it
        directly. REQ-PIPE-057 criterion 14 requires the system to
        record every artefact it declined to act on "alongside the
        delivery it came in, so that a supplier changing their extract
        is visible rather than silent" - and THIS FILE is what
        "alongside the delivery" means. Without the rewording the
        WARNING fires once at recognition and the durable record loses
        it, which defeats that criterion's stated purpose: a supplier
        drifting over time is invisible if only the current run
        remembers.
      - >
        CONFIRMED, rather than re-decided: the TABLE-vs-LOAD split Keith
        questioned at sign-off is the one already settled earlier the
        same day - the delivery file holds RECOGNITION facts, the
        processing log holds LOAD facts. ATTRIBUTION (this file is
        cp_clients) is a recognition fact, decided by pattern match
        before any load is attempted; the PHYSICAL TABLE it became
        (staging.cp_clients_...) is a load fact and belongs to
        REQ-PIPE-060's processing log.
      - >
        Two reasons attribution stays here rather than moving to the
        load record, beyond it being already settled. NOT EVERYTHING
        ATTRIBUTED REACHES A LOAD - a file matching two datasets is held
        and attributed to neither, an unloadable file gets no table at
        all - so a supply recognised but never loaded would otherwise
        have no record of what we thought it was. And REQ-PIPE-058's
        gate wants PAIRS: keeping both here makes it one read, splitting
        them across two logs makes it a join.
      - >
        PRIVACY, worth going in with eyes open rather than discovering
        later: a junk filename is the sharpest case of this
        requirement's own public-repo NFR. A systematic extract name
        like birth_registrations_2026-08-28.csv is impersonal; a stray
        notes_for_jenny_re_case_4471.docx is not, and it is exactly the
        kind of file that lands in a delivery by accident. Contents are
        still never read or recorded (REQ-PIPE-057), but the NAME is now
        durably committed rather than fleeting. Keith accepted this
        knowingly on 2026-09-24; redaction was raised as an alternative
        and not taken.

      - >
        CRITERION 6 IS BUILT AS A PRUNE RATHER THAN A WIPE, and the
        narrowing is a real incident rather than a preference. The
        first version cleared the whole log at the top of `mothman
        pipeline run`, on the reasoning that the run would rewrite it.
        The test suite invokes exactly that command with the real work
        STUBBED OUT - so the next gate run deleted sixty committed
        records and nothing rewrote them, because the thing that would
        have was the part being stubbed.
      - >
        Why pruning is not a weaker version of the same thing: records
        are write-once by criterion 1, so a record for a delivery still
        present IS what a regeneration would write again. The only
        records a wipe removes and a rebuild does not restore are the
        ones for deliveries that are gone, which is exactly what the
        prune removes. Same end state for every case that can arise,
        with no window in which committed history does not exist.
      - >
        The general shape is worth more than the fix, and it is now a
        test: a command that destroys committed state before recreating
        it is only correct when the recreation actually happens, and a
        test suite is precisely the place where it does not.
      - >
        Decided the log records EVERY delivery, not only those for the
        collection being run. A delivery is a transport unit and is not
        owned by a collection - one may span two - so filing the log by
        collection would mean choosing one for a delivery precisely
        where it has more than one. Write-once makes this idempotent:
        whichever orchestrator reaches a delivery first records it, and
        the rest no-op.
    linked_tests:
      - tests/test_delivery_log.py
      - tests/test_cli_pipeline.py
      - tests/test_arrival_patterns.py
    implemented_by:
      - qa_tools/common/delivery_log.py::record
      - qa_tools/common/delivery_log.py::prune
      - qa_tools/common/delivery_log.py::records
      - qa_tools/common/delivery_log.py::sql
      - qa_tools/common/validate_arrival_patterns.py::committed_filenames
    evidence:
      - >-
        2026-09-25: REQ-PIPE-058's collision gate now has a REAL
        CORPUS. It reported "no delivery has been logged yet, so
        nothing to check" before this landed and reports "38 recorded
        filename(s)" after, read from committed files rather than from
        data/ - which is what lets it run in CI at all.
      - >-
        2026-09-25: criterion 4 was verified by real experiment rather
        than asserted. DuckDB reads the committed JSON straight off
        disk via read_json_auto over a glob, and the filename-to-dataset
        pairs the gate wants come out of an UNNEST over the same view -
        nothing synced, nothing duplicated, no second copy in the
        warehouse. Run against the real 60-record log as well as in a
        test.
      - >-
        2026-09-25: a full pipeline run wrote 60 delivery records,
        covering 42 Birth Registrations deliveries and 18 Child
        Protection ones, and a second run rewrote none of them - which
        is criterion 1 holding in practice rather than in principle.
      - >-
        2026-09-25: the destructive first version of criterion 6 was
        caught by the gate run that followed it, which found the log
        empty. Both halves are now covered by tests that fail against
        that version - one asserting a record for a delivery still
        present survives a run that rewrote nothing.
      - >-
        2026-09-25: all ten gates green, with 1521 Python tests and 294
        JS tests, and the 60 committed records intact after the full
        suite - which is the assertion that matters, since the suite
        is what destroyed them the first time.
  - id: REQ-DASH-070
    title: Supply anomalies and outstanding decisions have one presentation, aggregated and never a data verdict
    date_written: "2026-09-24"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: >
      As a data engineer with thirty datasets to watch, I want everything
      that needs a person presented in one place with a count, and
      everything that merely happened presented as what happened, so that
      an anomaly cannot hide behind a tier's status rollup and a warning
      cannot read as a verdict on somebody's data.
    moscow: must
    status: built
    source: >
      Batch 3's pre-build review, 2026-09-24. delivery-dashboard-ux found
      that the eleven requirements of delivery sprints 7-10 emit at least
      fourteen dashboard-facing obligations and NOT ONE CRITERION NAMES
      THE DASHBOARD - every sentence describing the UI lives in an NFR or
      a decision, none of which is checkable. delivery-architect found the
      same gap independently. Keith's call, option (a) of two: one
      requirement owns the presentation, drafted now rather than at
      delivery sprint 22. See plans/supply-model.md, "Batch 3's pre-build
      review".
    acceptance_criteria:
      - "THE SYSTEM SHALL present everything requiring a human decision - a held supply, a failed load, an assignment made under ambiguity, and a slot closed but unfilled - in ONE element carrying a total count, and SHALL NOT render one element per item or one element per producing rule."
      - "THE SYSTEM SHALL render that element whatever a tier's status rollup says, and SHALL carry a per-scope count on each affected agency and collection, so that a rollup cannot absorb it."
      - "THE SYSTEM SHALL distinguish, within that element, items that BLOCK a supply from items that merely need review, so that a non-blocking item cannot read as blocking work."
      - "THE SYSTEM SHALL keep an item in that element until it is resolved, and SHALL NOT clear it because a later run passed over it."
      - "THE SYSTEM SHALL present event severity - informational, warning, needs-action - distinctly from data-quality status, and SHALL NOT render event severity using the status vocabulary a check's verdict uses."
      - "THE SYSTEM SHALL distinguish every severity by label as well as by appearance, and SHALL NOT rely on colour alone."
      - "THE SYSTEM SHALL render a slot closed by monotonic filling and left unfilled as an obligation awaiting a decision, and SHALL NOT render it as a red data verdict."
      - "THE SYSTEM SHALL name, for an item needing a decision, the responses available to a person, and SHALL NOT present a response that cannot yet be taken as a control."
      - "WHERE an assignment was made under ambiguity, THE SYSTEM SHALL render that qualifier everywhere the assignment itself is rendered, and SHALL NOT render it only in the feed."
      - "THE SYSTEM SHALL NOT render an absent, unfiled or uncertain arrival classification as a punctuality verdict, and SHALL render a classification it does not recognise as unknown."
      - "THE SYSTEM SHALL state, where a reader meets a recomputed arrival classification, that it follows the supply's current filing."
      - "THE SYSTEM SHALL explain an event in terms of what happened and whose task it is, and SHALL NOT attribute fault to the reader."
      - "WHERE nothing requires a person, THE SYSTEM SHALL say so rather than rendering an empty element."
    non_functional_requirements:
      - >
        This exists because six producers - REQ-PIPE-057, 058, 059, 060,
        064 and 065 - each carry their own "report it as needing action /
        at WARNING / as informational" criterion, while the rule governing
        how those COMBINE sat in two NFRs on two of the six. Built
        independently, each honours its own criterion and the aggregate
        obligation is met by nobody. That is the unowned-IOU shape
        CLAUDE.md already records from the batch-3 failure.
      - >
        At ~30 datasets the aggregation is the whole requirement, not a
        refinement of it. REQ-PIPE-059's and REQ-PIPE-064's own NFRs say
        it: "a banner per dataset is how people learn to ignore the whole
        class". There is no cross-dataset view of any of this today - the
        exec and agency tiers roll up STATUS ONLY - so without this
        requirement every fact those eleven produce is reachable only by
        drilling into one dataset at a time, which at 30 means nobody
        sees them.
      - >
        The resolution path does not exist until delivery sprint 12, so
        for a period this element shows work nobody can clear. That is
        accepted for build order and is exactly why criterion 8 forbids
        rendering a response as a control before it can be taken -
        REQ-PIPE-064's own NFR warns that "a hold nobody can clear is
        indistinguishable from a bug", and repeated unhelpful states
        teach people to stop reading the thing that teaches them.
      - >
        Reuse the existing idioms rather than inventing a second visual
        language. REQ-PIPE-053's own trio is the closest precedent and is
        already the right shape: a count-led notice with no dismiss
        control ("a dismissible notice about a task nobody has done is a
        notice about a task nobody will do"), a per-tier marker so a
        rollup cannot absorb it, and a pill deliberately unlike the four
        status pills - solid border, square marker - "because this is the
        one state that is OUR task undone rather than a verdict on
        anybody's data", never distinguished by colour alone.
      - >
        This is a dashboard-build concern and may never open data/. Every
        fact it renders is already committed by the producing requirement.
      - >
        The dashboard is the ONLY way to see a hold (REQ-PIPE-057's own
        decision), and it is rebuilt by CI on push - so the latency
        between a hold appearing and a person seeing it is a deploy.
    dependencies: [REQ-PIPE-057, REQ-PIPE-059, REQ-PIPE-060, REQ-PIPE-063, REQ-PIPE-064, REQ-PIPE-065, REQ-PIPE-066]
    linked_tests:
      - tests/test_outstanding.py
      - tests-js/outstanding.test.js
      - tests/test_dashboard_e2e.py
    implemented_by:
      - qa_tools/common/outstanding.py::survey
      - qa_tools/common/outstanding.py::Outstanding
      - qa_tools/common/outstanding.py::Item
      - dashboard/embed_dashboard_data.py::embed
    evidence:
      - >
        2026-09-25: the aggregation is asserted as ONE element, not as a
        count of items. Four items from four different producers - a
        held supply, a failed load, a contested file and an unrecognised
        one - render exactly one .notice-queue carrying three queue-item
        rows, because the failure this requirement exists to prevent is
        six correct banners and no total.
      - >
        2026-09-25: criterion 10 was a REAL DEFECT in built code, not a
        gap. arrivalStatusLabel()/arrivalPill() mapped anything that was
        not "early" or "late" to a green "On time" pill, so
        REQ-PIPE-066's "unfiled" - which means there is no slot to be
        punctual against at all - would have rendered as a confident
        punctuality verdict in three places: the Tier 2 dataset table,
        the Latest arrival tile and the supply-history Timing column.
        Three regression tests were written first and CONFIRMED FAILING
        against the pre-fix template (checked out from HEAD and run):
        "expected 'On time' not to be 'On time'", "expected '<span
        class=\"pill green \">...' not to contain 'pill green'", and
        "expected 'On time' to be 'Unknown'". Both maps are exhaustive
        now and an unrecognised value renders as unknown.
      - >
        2026-09-25: severity is asserted to share NO vocabulary with a
        data verdict - every severity pill is checked for the absence of
        green/amber/red, and each is checked to carry its own label in
        words, because colour alone was never the distinction this could
        rely on. An unrecognised severity renders at the LOUDEST weight
        rather than the quietest, so a new producer's needs-action item
        cannot arrive looking like a footnote.
      - >
        2026-09-25: criterion 8 is asserted as the ABSENCE of a control.
        The rendered queue contains no <button> and no <a>, and says in
        words that the responses are recorded rather than offered -
        because REQ-PIPE-064's own NFR warns that a hold nobody can
        clear is indistinguishable from a bug, and a dead button teaches
        a reader that the whole panel is dead.
      - >
        2026-09-25: the empty state is asserted in a REAL browser at two
        tiers, not in a unit test, because it is the state a reader
        actually meets today - the real committed history has nothing
        outstanding, and "nothing is waiting" must not look like "this
        panel is broken".
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    unmet_criteria:
      - criterion: >
          Criterion 1, in part - a supply HELD BY THE ASSIGNMENT RULE
          (REQ-PIPE-064) does not reach the queue. REQ-PIPE-059's
          delivery-level hold does, from delivery_log/, and so do failed
          loads, contested files and unrecognised artefacts.
        why: >
          supply_holds.holds_in() takes a run's decisions in memory and
          deliberately writes nothing, because the resolution path that
          would read a store does not exist and a store invented now
          would have to be unpicked. So there is no committed record for
          this to read, and this requirement may never open data/ or
          re-run the rule. Re-check when filings are recorded.
        owner: the promotion sprint (batch 4)
      - criterion: >
          Criterion 1, in part - a slot closed by monotonic filling and
          left unfilled produces no item. The derivation is built and
          criterion 7's framing is written, but it is structurally empty.
        why: >
          Only a PROMOTION fills a slot, and nothing closes until a later
          one is filled. filing.filled_slots() returns an empty set on
          purpose until promotion exists, so no slot can be closed and
          none can therefore be closed-and-unfilled. Built against the
          real rule rather than stubbed, so it lights up on its own.
        owner: the promotion sprint (batch 4)
      - criterion: >
          Criterion 9, in part - the uncertain-filing qualifier is
          rendered at all three sites an assignment appears (the Tier 2
          arrival cell, the Latest arrival tile and the supply-history
          Timing column) and is covered by tests, but no real supply
          carries it today.
        why: >
          REQ-PIPE-062's filings are deliberately not recorded until
          promotion exists (Keith, 2026-09-25), so filings/ is empty and
          the reader finds nothing. The reader is built now rather than
          later for the reason REQ-PIPE-065's rule was: a reader written
          when the writer turns on is written by somebody who has
          forgotten why the shape is what it is.
        owner: the promotion sprint (batch 4)
    decisions:
      - >
        SETTLED 2026-09-24 (Keith), option (a) of two: ONE REQUIREMENT
        OWNS THE PRESENTATION, drafted now rather than left to delivery
        sprint 22. Rejected leaving it to sprint 22 with each pipeline
        requirement carrying its own presentational criteria, because six
        independent builds would land before anything reconciled them.
        The eleven keep only the obligation to RECORD the fact and its
        severity; how those combine on screen is here.
      - >
        Recorded because it is the finding that produced this
        requirement: the eleven emit at least fourteen dashboard-facing
        obligations and not one criterion names the dashboard. Every
        sentence that actually describes the UI - "a banner per dataset is
        how people learn to ignore the whole class", "say so where a
        reader will meet it", "the dashboard will show a permanently red
        slot nobody can close" - lives in an NFR or a decision. A critic
        verifies against acceptance_criteria, so none of it was checkable.
      - >
        TWO SURFACES, NOT ONE, and the requirements themselves force it.
        REQ-PIPE-064's NFR asks for both "re-presented on every run until
        resolved" and "must not become thirty banners at 30 datasets",
        which one time-ordered feed cannot do at once: a feed is scanned
        and discarded, a queue is drained. Put a persistent state in a
        feed and you get either wallpaper or a hold that scrolls away.
        This requirement owns the QUEUE; the activity feed stays a feed
        and remains sprint 22's.
      - >
        REJECTED rendering event severity with the status pill
        vocabulary, which is criterion 5's reason for existing: an
        unrecognised artefact at WARNING must not make a reader think the
        dataset is amber, and REQ-PIPE-057 criterion 9 says explicitly it
        does not fail the delivery. Event severity and data-quality
        verdict are different claims about different things.
      - >
        A REAL COLLISION WITH BUILT CODE, which criterion 10 exists to
        close: arrivalStatusLabel() in the template maps anything that is
        not early or late to green "On time", so REQ-PIPE-066's new
        unfiled value would render as a confident punctuality verdict on
        the Tier 2 dataset table, the Latest arrival tile and the
        supply-history Timing column. That is item 74's exact failure
        mode at the last transform before the user, and REQ-PIPE-066's
        own criteria 10 and 11 do not reach it - it is neither a
        derivation nor a deletion, it is a permissive fallback.
      - >
        Criterion 9 uses the qualifier-chip idiom REQ-PIPE-063's sign-off
        already established for the carried-forward case, deliberately
        rather than inventing a second one. An assignment marked
        uncertain in the feed but rendered as a confident verdict on the
        dataset page is the false-confidence problem REQ-PIPE-065's
        MoSCoW was raised to MUST over.
      - >
        SETTLED 2026-09-24 (Keith), resolving pre-build Q7: an uncertain
        assignment SHARES the one element with the blocking states, with
        criterion 3's visible distinction carrying the difference.
        Rejected a separate review surface. The total is what a person
        acts on - "six things waiting for me" is the number - and two
        surfaces means nobody knows it. The distinction carries what
        kind; the count carries the urgency.
      - >
        The risk that argues for a separate surface is real and is what
        criterion 3 exists to manage: REQ-PIPE-065's uncertain
        assignment is genuinely NON-BLOCKING - the supply was filed,
        just uncertainly - and mixing a non-blocking item into a work
        queue with a weak distinction is how people learn to ignore the
        queue, which is the failure both aggregation NFRs already name.
      - >
        SETTLED 2026-09-24 (Keith), resolving pre-build Q10: the
        in-flight delivery is rendered from a committed RUN-LEVEL
        observation, framed as at the last regeneration. Neither drafted
        option was buildable - see REQ-PIPE-057's own decisions for the
        gap underneath the question and for why the record's subject had
        to change from the delivery to the run.

  - id: REQ-GHUB-015
    title: GitHub Issues as the QA remediation ticketing system
    story: >
      As a QA analyst, I want a real ticket opened automatically when a
      dataset needs follow-up, so that remediation work is tracked
      somewhere real rather than living only in someone's head.
    moscow: should
    status: not_started
    source: >
      plans/running-thoughts.md #1, Keith's own voice-dictated batch of
      2026-09-18. A decision rather than an idea by the time it landed -
      GitHub Issues rather than a separate tool, "that's a really good
      solution, it's an easy integration".
    acceptance_criteria:
      - A real GitHub Issue is opened/updated/commented on accurately
        by the pipeline for real QA events.
    linked_tests: []

