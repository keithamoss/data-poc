  - id: REQ-DASH-013
    title: "Time travel: point-in-time dashboard snapshots"
    story: >
      As a data engineer, I want fully self-contained, gzip-archived
      snapshots of the dashboard at points in time, so that "what did
      the whole page look like on this date" is answerable years later
      with nothing but a browser.
    moscow: could
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/dashboard.md #5, 2026-09-16. Keith's own framing up front -
      "think big, think architecturally, and consider this solution will
      run for years" - and built through several explicit rounds of
      scoping questions before any code, at his request.
    acceptance_criteria:
      - Each snapshot opens standalone, with no dependency on the live
        site or any other file.
    linked_tests:
