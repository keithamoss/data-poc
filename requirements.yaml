  - id: REQ-DOCS-014
    title: A live requirements register, tied to real tests
    story: >
      As a product owner, I want real user stories tracked with MoSCoW
      priority, implementation status, and a real (not decorative) tie
      back to the tests that verify them, so that I have a genuine,
      trustworthy view of what's actually been delivered.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-18 (plans/qa-pipeline.md item 75, and
      plans/running-thoughts.md #7 for its dashboard panel): "having
      like actual requirements... user stories, requirements, and
      acceptance criteria... track MoSCoW status... have we implemented
      them yet... tie them back to the actual tests"
    acceptance_criteria:
      - Every requirement's linked_tests are validated to actually
        exist in CI, not just asserted in prose.
      - A "built" requirement can't ship with zero real linked tests.
    linked_tests:
      - tests/test_validate_requirements.py
      - tests/test_requirements_yaml.py
    evidence:
      - >
        2026-09-20: yamllint's key-duplicates rule run across every
        hand-authored YAML file in the repo reports zero findings, and
        catches a deliberately planted duplicate at the exact line. On
        its default ruleset the same files report 230 findings, 220 of
        them line-length, which is why every style rule is disabled.
      - >
        2026-09-20: 27 requirements validate with zero errors, every
        linked_tests and implemented_by entry resolving to a real file or a
        real AST-verified symbol.
    decisions:
      - >
        Linkage to tests is enforced by CI against a real AST parse rather than a string match, because a decorative reference to a test that does not exist is the exact failure this register was built to prevent.
      - >
        A duplicate mapping key is rejected outright rather than left to
        PyYAML's last-one-wins. It cost 5 real decisions before the check
        existed, and nothing in the Python stack noticed - safe_load, the
        check-yaml hook and the whole test suite all passed.
      - >
        Used yamllint rather than a hand-written checker or ruamel.yaml.
        Keith's challenge - "can't we use a library rather than these
        hacky scripts" - was right, and a first attempt did hand-roll a
        PyYAML node walk. ruamel also detects duplicates, but soda-core
        pins it below 0.18 so this repo is stuck on a 2023 release
        chosen by a QA tool. yamllint is purpose-built, has no such
        entanglement, and makes it a named rule rather than a side
        effect of a stricter parser.
      - >
        Rejected doing this with a schema, verified rather than assumed.
        Schema validation runs on the already-parsed object, and a
        duplicate key does not make the key MISSING - it leaves it
        present with truncated content. A jsonschema model requiring a
        non-empty decisions list PASSED on the exact failing input.
      - >
        Runs in CI as well as pre-commit, because hooks only fire for
        people who ran `pre-commit install`.
      - >
        The register describes the PRODUCT, not this project's own working process, so conventions about how we work stay in plans files rather than becoming pseudo-requirements.
    implemented_by:
      - requirements.yaml
      - .yamllint
      - .pre-commit-config.yaml
      - .github/workflows/test.yml
      - dashboard/requirements_yaml.py::parse_requirements
      - qa_tools/common/validate_requirements.py::validate

