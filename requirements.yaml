  - id: REQ-GEN-044
    title: Every injected scenario exists in the generated history
    date_written: "2026-09-22"
    story: >
      As Keith, I want the awkward supply shapes we spent two days
      designing for to be present in the real generated data, so that I
      can see the model working on the real dashboard rather than take a
      green test run's word for it.
    moscow: must
    status: not_started
    source: >
      Keith's second standing obligation on the test scenario register,
      2026-09-22 - "the scenarios KEITH PROPOSED get INJECTED into
      generated deliveries, so they are visible in the real dashboard
      rather than only green in a test run". plans/supply-model.md
      delivery sprint 2. Scoped by delivery-scoper, batch 1+2 pass,
      2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL generate, into the committed synthetic history,
        a real instance of every scenario the test scenario register
        marks for injection.
      - THE SYSTEM SHALL generate each one under a schedule
        configuration that makes that scenario's stated outcome the
        correct one, and SHALL state that configuration alongside it.
      - THE SYSTEM SHALL place injected scenarios deterministically, so
        that the same seed and the same configuration place the same
        scenario in the same dataset and the same period.
      - IF an injected scenario cannot be placed under the configured
        schedule, THEN THE SYSTEM SHALL fail loudly naming that
        scenario, and SHALL NOT emit a history silently missing it.
      - THE SYSTEM SHALL NOT mark an injected scenario as a scenario
        anywhere in the rendered dashboard.
      - THE SYSTEM SHALL generate only the arrival shapes each scenario
        needs, and SHALL NOT generate the verdict that scenario expects.
      - THE SYSTEM SHALL record, for each injected scenario, the dataset,
        the period and the supplies it produced, for the scenario map to
        read.
      - THE SYSTEM SHALL express the differing schedule configurations its
        scenarios require as effective-dated versions of the same
        calendar, each in force over the part of the history its
        scenarios occupy.
      - THE SYSTEM SHALL generate at least one schedule version change
        within the committed history, so that the
        evaluate-each-period-against-the-version-in-force rule is
        exercised against real data.
      - WHEN a schedule version changes, THE SYSTEM SHALL leave every
        earlier generated supply's verdict unchanged.
      - THE SYSTEM SHALL NOT generate two scenarios requiring
        incompatible schedule configurations within the same version's
        period of effect.
    non_functional_requirements:
      - Injected scenarios add deliveries to a history whose generation
        already builds a 70,000-person population per run. Derive the
        injected deliveries from the base population rather than
        rebuilding it, and measure generation runtime before and after.
      - At 30 datasets this set of permanent red would be noise. At two
        it is the point. The requirement is honest about being a PoC
        demonstration device, and it should not be generalised into a
        production deployment where the data is real.
      - Injected scenarios must not make the normal history unreadable.
        The bulk of the generated history should still look like an
        ordinary, healthy feed, or the dashboard stops demonstrating
        what a healthy feed looks like.
      - Seeded and deterministic, so a regenerate-and-diff stays a real
        correctness check.
      - The generated history now contains schedule changes, which makes
        the daily feed's story busier than a textbook one. That is
        realistic, but it should not make the ordinary healthy feed hard
        to recognise - a reader should still be able to see what normal
        looks like.
      - Regenerating the synthetic history rewrites past-dated calendar
        versions, which is exactly the act Thread E says must never
        happen quietly. Nothing automated stops it - REQ-PIPE-050's A4
        decision rejected building any such guard - so this is governed
        by review, like every other retrospective config edit. A
        regeneration that moves a past date should say so in its commit
        message.
    dependencies: [REQ-GEN-040, REQ-GEN-042, REQ-GEN-043, REQ-PIPE-049, REQ-PIPE-051]
    decisions:
      - Decided against a scenario label on the injected runs (Keith,
        2026-09-22 - "this is still just a proof of concept remember").
        A first draft argued for one, to stop the dashboard growing
        permanent red that looks like a defect. For a PoC that is
        over-building - the red IS the point and the audience knows the
        data is synthetic. The scenario map carries the "which one is
        this" information instead.
      - "Decided every scenario must state its CONFIG. Found during
        Keith's own review of the register, and it invalidated two
        expected results as first written (TS-3, TS-5): an outcome like
        \"files as a resupply of Wednesday\" is meaningless without the
        cadence, the due time and the claim-window size, because a
        different window gives a different and equally correct answer."
      - Decided the generator emits shapes, not verdicts. TS-3b's
        expected answer ("fills May, 79 days late") is a claim about
        slot assignment, which is batch 3. Generating the verdict here
        would make batch 3's own tests assert that the pipeline agrees
        with the generator rather than with the rule.
      - "Recorded because it is what makes this sprint urgent rather
        than merely useful: most of the injected set cannot be generated
        at all today. The generator emits whole deliveries only and
        never partial, produces ZERO early supplies (measured 0 early /
        240 on time / 112 late), and run_id still carries dates. This is
        why the sprint moved from 6 to 2."
      - "[B4] Decided the three incompatible daily configurations TS-1,
        TS-2 and TS-3c require - due 12:00, due ~22:00, and due 22:00 the
        evening before - are hosted by EFFECTIVE-DATED SCHEDULE VERSIONS
        across the generated history, each scenario sitting in the
        version that makes its stated outcome correct (Keith,
        2026-09-22). It exercises TS-26 for free and demonstrates a real
        capability rather than working around a limitation."
      - "[B4] Rejected relaxing the scenarios to whatever one configured
        due time allows. Keith's own review of the register established
        that a scenario's outcome is meaningless without its config -
        files as a resupply of Wednesday depends entirely on the cadence,
        the due time and the window size - so changing the config
        changes what each scenario proves, silently."
      - "[B4] Rejected adding a third synthetic daily dataset purely to
        host the other configurations. Adding datasets is explicitly
        sequenced AFTER this work (plans/running-thoughts.md #23),
        because it is what makes the file-architecture question
        answerable and it needs this model to be real first."
      - "CORRECTED 2026-09-22, after delivery-architect found a direct
        contradiction between two SIGNED requirements. This requirement
        carried an NFR requiring REQ-PIPE-050's retrospective-edit guard
        by name - recorded content records plus a changelog entry, or
        every regeneration fails the gate. REQ-PIPE-050's [A4] decision
        rejects building that mechanism outright, naming it as rejected
        option (1). The NFR was written before Keith answered A4 and was
        never revisited when the answer landed. The NFR gives way,
        because A4 is the later and explicit decision; regenerating the
        synthetic calendar is governed by review like any other
        retrospective config edit."
      - "Recorded because the shape will recur: the contradiction was
        introduced by the main session, not by scoping. An NFR referring
        to another requirement BY NAME is a cross-reference nothing
        validates - requirements.yaml's own gate checks that a
        dependencies: entry names a real requirement, and checks nothing
        about prose that cites one. When a decision on one requirement
        changes, every other requirement naming it has to be re-read by
        hand, and this one was not."
  - id: REQ-GEN-045
    title: A generated scenario map says where each scenario can be seen
    date_written: "2026-09-22"
    story: >
      As Keith showing this to someone, I want a list saying which
      scenario is which and where to look at it, so that a deliberately
      broken supply reads as a demonstration rather than as a defect
      somebody forgot about.
    moscow: must
    status: not_started
    source: >
      Keith, 2026-09-22, on the test scenario register - "if I click on a
      test, it takes me to the relevant as-of date and then the relevant
      page for the check, the dataset or the data collection".
      plans/supply-model.md test scenario register. Scoped by
      delivery-scoper, batch 1+2 pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL generate a map naming, for each injected
        scenario, the dataset, the supplies it produced, the period and
        the as-of date at which that scenario can be seen.
      - THE SYSTEM SHALL generate the map from the generator's own
        record of where each scenario actually landed, and SHALL NOT
        require anyone to maintain it by hand.
      - WHEN the synthetic history is regenerated, THE SYSTEM SHALL
        regenerate the map in the same act, so that the two cannot
        disagree.
      - THE SYSTEM SHALL commit the map as markdown, so that anything
        reading it reads a committed file and never touches data/.
      - THE SYSTEM SHALL emit coordinates only, and SHALL NOT emit a
        dashboard URL or anything that encodes the dashboard's routing
        scheme.
      - WHERE a scenario has no generated data behind it, THE SYSTEM
        SHALL say so rather than emitting a coordinate that leads
        nowhere.
      - THE SYSTEM SHALL expose map regeneration as a mothman
        subcommand.
      - THE SYSTEM SHALL write the map so that it reads as a complete,
        self-explanatory document on its own, without a dashboard to
        render it.
      - THE SYSTEM SHALL state, for each entry, what the scenario is
        meant to demonstrate, not only where it landed.
    non_functional_requirements:
      - The map is committed and read by the dashboard build, so it must
        contain no row-level data and no failing values. In a real
        deployment those would be real Birth Registrations or Child
        Protection records.
      - A hand-written map drifts the first time seeded data is
        regenerated. Generating it is the mitigation, and the same-act
        regeneration criterion is what makes that mitigation real rather
        than aspirational.
      - Same pattern plans/INDEX.md already uses - a generated, committed
        index rather than a live query. No new machinery.
    dependencies: [REQ-GEN-044]
    decisions:
      - Decided the map carries COORDINATES and the dashboard constructs
        the LINK (Keith's own framing, 2026-09-22). The generator knows
        the dataset, the supplies, the as-of date and the check; it does
        not, and should not, know the dashboard's routing scheme.
        Emitting URLs from the generator would couple the two and break
        silently the next time a route changes.
      - Decided the target is an AS-OF DATE, not a snapshot. Keith
        floated both. The live dashboard defaults to as-corrected, so an
        as-of link shows the scenario as we now understand it, whereas a
        snapshot shows what was published at the time - a different
        question, and the wrong one for "show me this scenario working".
      - Decided a unit-only scenario appears in the map saying it has no
        data behind it, rather than being omitted. A map missing entries
        invites someone to conclude a scenario was never built.
      - "[B2] Decided the map must stand alone as a document, because
        Keith's answer to B2 holds all dashboard rendering to batch 6 -
        so for several sprints the committed markdown on GitHub is the
        ONLY way anyone sees it. A coordinates-only list would have been
        adequate with a renderer and is not adequate without one."

