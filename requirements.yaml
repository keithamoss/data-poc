  - id: REQ-DASH-022
    title: Dashboard gamification for QA turnaround
    story: >
      As a manager, I want staff who turn QA around quickly or
      consistently produce clean data celebrated somehow on the
      dashboard, so that good QA practice is visibly recognized.
    moscow: could
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/running-thoughts.md #3, same 2026-09-18 batch - staff who
      turn QA around quickly or consistently produce clean data being
      visibly recognised.
    acceptance_criteria:
      - THE SYSTEM SHALL show, per person, a streak of consecutive QA
        ticket resolutions that were never reopened.
      - WHEN a resolved ticket is later reopened, THE SYSTEM SHALL treat
        that resolution as not clean and SHALL NOT count it toward the
        streak.
      - THE SYSTEM SHALL list everyone with recorded resolutions, not
        only the highest-scoring few.
    linked_tests:
      - tests/test_leaderboard.py
    implemented_by:
      - qa_tools/common/leaderboard.py::build_leaderboard
      - qa_tools/common/leaderboard.py::compute_resolution_streaks
      - qa_tools/common/leaderboard.py::build_resolution_episodes
      - dashboard/qa-reporting-dashboard.template.html::renderLeaderboardPanel
    evidence:
      - >
        2026-09-20: 18 tests cover the streak logic, including that a
        closed ticket later reopened is a dirty episode and breaks the
        streak rather than counting toward it.
    decisions:
      - >
        The metric counts clean TICKET RESOLUTIONS, not clean QA runs.
        The original design credited whoever ran QA, which stops meaning
        anything the moment running is automated - there is no human left
        to credit. Closing a ticket is the one action in this system
        guaranteed to need a person.
      - >
        A reopened ticket breaks the streak. Counting a close that did
        not hold would reward closing tickets rather than fixing data.
      - >
        Everyone with resolutions appears, not only the top few - a
        leaderboard that shows only winners tells most people nothing
        about their own work.

  - id: REQ-QAC-023
    title: Check metadata comes from data, never from prose
    date_written: "2026-09-20"
    story: >
      As someone maintaining these checks, I want a check's column and
      name to be stated as data rather than recovered by parsing its
      description, so that rewording an explanation can never silently
      move a check to the wrong place on the dashboard.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Found by delivery-architect while checking technical fit for
      REQ-QAC-024, verified at source, scoped with Keith 2026-09-20.
      Priority inherited from REQ-QAC-024, which cannot be done safely
      until this lands.
    acceptance_criteria:
      - WHEN a contract quality rule concerns a single column, THE SYSTEM
        SHALL express it as a property-level rule under that column, and
        SHALL determine its column from the contract's own schema
        structure rather than from the rule's description text.
      - THE SYSTEM SHALL hold a hand-authored short name for every
        SQL-type quality rule, and SHALL NOT derive any check's name from
        its description text.
      - THE SYSTEM SHALL define the check_id grammar in exactly one
        place as a pattern, and SHALL resolve any check_id segment
        through it rather than by ad hoc string splitting.
      - WHEN check-lifecycle validation runs, IF a check_id does not
        match that grammar, THEN THE SYSTEM SHALL exit non-zero and name
        every offending check_id.
      - WHEN check-lifecycle validation runs, IF a check_id's column
        segment names a column other than the one its rule is attached
        to, THEN THE SYSTEM SHALL exit non-zero and name it.
      - WHEN check-lifecycle validation runs, IF two checks on the same
        dataset and column share the final check_id segment, THEN THE
        SYSTEM SHALL exit non-zero and name both, since that segment
        alone identifies a check in a dashboard URL.
      - THE SYSTEM SHALL report every check against the same column it
        reports today, except the three cross-column business rules,
        which SHALL move from table level to the column their own
        check_id already names.
    non_functional_requirements:
      - Every check's config_hash must be byte-identical before and
        after. This repo is seeded and deterministic, so that is a real
        correctness proof rather than a smoke test.
      - Nothing here needs a live connection to data/ or any warehouse.
      - KNOWN GAP, deliberately not resolved here - the grammar this
        defines has no collection segment, while a dashboard URL is
        /agency/X/collection/Y/dataset/Z. The identifier skips a level
        the rest of the system models, so a check's collection cannot be
        derived from its own id. That is the first piece of work under
        plans/publishing-and-history.md item 6 and may change this
        grammar. Build the module so the pattern is a single definition
        that can absorb a new segment, rather than assuming today's
        shape is final.
      - The tail-uniqueness rule exists because global check_id
        uniqueness does NOT imply it. Two checks could differ only in
        their table segment, be globally unique, and still collide in a
        URL that carries no table segment - whichever one the lookup
        found first would win, silently, which is the failure this work
        exists to remove. That cannot happen today only because every
        dataset maps to exactly one table, which nothing enforces, so
        the guarantee is stated directly rather than inherited from a
        coincidence of the current data model.
      - The rule is expressed in the same terms the URL keys on, and
        lives in the same module as the grammar, so the two cannot drift
        apart. A collision is a hard failure at authoring time - not a
        fallback to the full check_id for the colliding check, which
        would put two URL shapes on one page and hide the problem.
    dependencies: []
    linked_tests:
      - tests/test_check_id.py
      - tests/test_run_datacontract_cp.py::test_every_sql_rule_routes_to_a_real_column
      - tests/test_run_datacontract_cp.py::test_a_sql_rules_name_is_authored_not_taken_from_its_description
      - tests/test_run_datacontract_cp.py::test_a_range_check_is_not_labelled_referential_integrity
      - tests/test_run_datacontract_bdm.py::test_every_sql_rule_has_its_own_authored_name
      - tests/test_run_datacontract_bdm.py::test_sql_rules_get_their_shared_label_from_structure_not_prose
    implemented_by:
      - qa_tools/common/check_id.py::parse
      - qa_tools/common/check_id.py::validate_grammar
      - qa_tools/common/check_id.py::validate_column_matches
      - qa_tools/common/check_id.py::validate_tail_uniqueness
      - qa_tools/common/check_lifecycle.py::contract_rule_attachments
      - qa_tools/common/check_lifecycle.py::name_by_check_id
      - qa_tools/common/validate_check_lifecycle.py::_check_id_errors
      - qa_tools/cp/run_datacontract_cp.py::evaluate_datacontract_cp
      - qa_tools/bdm/run_datacontract_bdm.py::evaluate_datacontract_bdm
      - contract/child-protection-contract.yaml
      - contract/bdm-birth-registrations-contract.yaml
    evidence:
      - >
        2026-09-20: all 258 check config_hashes byte-identical before and
        after, captured before the first edit and re-compared after the
        last. This repo is seeded and deterministic, so that is a real
        correctness proof rather than a smoke test.
      - >
        2026-09-20: the real datacontract-cli run over all 62 Child
        Protection checks, diffed before and after the 10 rules moved to
        property level - status, metric value, row counts, thresholds and
        dimension identical on every one. The only difference is column
        attribution, on exactly the 3 business rules AC7 names. That
        settles this requirement's own open question: the tool runs a
        property-level sql rule identically to a model-level one.
      - >
        2026-09-20: all 258 real check_ids parse under the grammar, with
        zero tail collisions and zero column mismatches against the
        contracts' real attachments. Each of the three new gates was then
        confirmed to bite against a deliberately broken input rather than
        trusted on a green run.
    decisions:
      - >
        Took the column from the contract's own schema structure rather
        than adding a new hand-authored property - considered and
        rejected once the contract was confirmed able to express it
        natively (Keith, 2026-09-20).
      - >
        Rejected a check_id BUILDER in favour of a validator only. Keith
        raised it, then declined it on the real numbers: 254 check_ids
        are authored in YAML where a Python constructor cannot help,
        against 3 in production Python and 32 in test fixtures.
        Correctness everywhere comes from validation, not from a
        constructor serving 1% of cases. The argument that nearly
        carried it was not call-count but drift-proofing - one module
        exposing build, parse and validate can be property-tested so the
        three cannot disagree - so this is worth revisiting if
        Python-authored check definitions ever stop being a rounding
        error.
      - >
        Rejected two earlier shapes before moving the rules under their
        column. Reading the column out of the check_id was rejected as
        still being string-parsing; adding an explicit `column` property
        was rejected once Keith asked whether the contract could simply
        say it natively - which it can, because a property-level
        `type: sql` rule already worked here.
      - >
        The three business rules had check_ids naming notification_id,
        investigation_id and carer_id while the dashboard rendered them
        as (table). The id said one thing and the page another, and
        nothing noticed - which is why the new gate cross-checks the two
        rather than only fixing the attribution once.
      - >
        Moved the 10 table-level sql rules under their column rather than
        keeping a lookup from check_id to column. The contract can
        express the attachment natively, so structure carries it and
        there is nothing to keep in step.
      - >
        Put the authored name in customProperties rather than in the rule
        body, which keeps it outside the config hash - renaming a check
        for readability is not a change to what it does, and the 258
        unchanged hashes are the proof.
      - >
        Kept the three new gates inside the existing check-lifecycle
        command instead of adding a fourth mothman subcommand. A
        contributor who breaks one has broken the same class of thing the
        existing rules protect, and finding that out in two places is
        worse than one.
      - >
        Made the test fixtures' check_ids real-shaped rather than
        exempting them from the grammar. Two lifecycle tests failed on
        ids like "a.b.c.not_null" that could never exist in the real
        repo; a gate the tests exercising it are excused from is not a
        gate.
      - >
        Fixed a real pre-existing bug found while rewriting the label
        logic, rather than reproducing it faithfully. The old helper
        labelled anything that was not a business rule as "Referential
        integrity", so a date-of-birth range check was grouped across
        tools with the FK checks. The label now comes from the check_id
        tail, and only relationships_* is an FK check.

  - id: REQ-QAC-024
    title: Plain-English explanation of what every QA check does
    date_written: "2026-09-20"
    story: >
      As a data engineer who doesn't know dbt, Soda or Evidently, I want
      every check to say in plain English what it looks for and what it
      means if it fails, so that I can tell what's actually wrong with
      my data without asking the person who built the pipeline.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, flagged as near-term work in plans/qa-pipeline.md item 25,
      2026-09-18; scoped via delivery-scoper 2026-09-19 and walked
      through fork by fork with Keith 2026-09-20.
    acceptance_criteria:
      - THE SYSTEM SHALL hold, for every active check across all four
        tools and both real datasets, a hand-authored plain-English
        statement of what that check verifies, in the check's own
        definition alongside its existing check_id and category.
      - THE SYSTEM SHALL hold, separately addressable from that
        statement, either a hand-authored plain-English statement of
        what a failure most likely indicates has happened upstream, or
        an explicit declaration that this check's failure cause is
        self-evident from what it verifies.
      - WHERE that second statement is authored, THE SYSTEM SHALL say
        what a failure indicates rather than restate what the check
        verifies in other words.
      - THE SYSTEM SHALL express both statements without naming any
        tool, macro or statistical method, and without cross-referencing
        another check or file that a reader cannot follow.
      - THE SYSTEM SHALL permit real column and table names in either
        statement where they are the clearest way to say what is being
        checked.
      - THE SYSTEM SHALL NOT state what a reader should do about a
        failure; remediation belongs to the ticket, not to the check
        definition.
      - THE SYSTEM SHALL provide a third, explicitly-named field for
        contributor-facing rationale, distinct from both plain-English
        statements, and SHALL preserve any superseded technical wording
        there rather than discard it.
      - THE SYSTEM SHALL confine that third field to standing facts a
        contributor needs and a viewer must not see - cross-references
        between checks, and notes explaining why a check behaves as it
        does by construction.
      - THE SYSTEM SHALL NOT use that third field for dated definition
        changes, which belong in the check's own changelog.
      - WHEN an existing description contains dated definition-change
        history, THE SYSTEM SHALL move that history into the check's
        changelog rather than into the contributor-rationale field.
      - WHEN any of a check's three authored text fields is edited with
        no change to that check's own config, THE SYSTEM SHALL NOT
        report the check as changed and SHALL NOT require a changelog
        entry.
    non_functional_requirements:
      - Three authored text fields per check (Keith, 2026-09-19/20). The
        existing `description` becomes by definition the plain-English
        "what"; the other two are new. Names settled by Keith on
        2026-09-20 - `description` (existing, repurposed),
        `failure_indicates` (new), `technical_note` (new).
      - The contributor-rationale field is sparse by design - on the
        order of 8 distinct texts across 258 checks - which is why it
        stays optional and CI never requires it.
      - The boundary against `changelog` is load-bearing and was tested
        against the real text before the field was kept. A changelog
        entry carries a date, an author and a breaking flag. A standing
        fact has none of those, so forcing one into the changelog means
        inventing a date and an author for something that never
        happened, corrupting the one field whose job is who changed what
        when.
      - No authoring standard (Keith's explicit call) - no reading-age
        target, no length cap, no external guideline. The bar is "sounds
        right to a non-technical colleague" and the check's own
        maintainer authors it, with no review step.
      - No audit trail when wording changes (Keith's explicit call) -
        out of the config hash, out of the changelog, however material.
        Committed dashboard/snapshots/*.html.gz become the de facto
        record of what wording was live when.
      - Where two tools genuinely check the same thing, their statements
        MAY be identical. Per-engine wording is permission to differ
        where the checks differ, not a requirement to diverge (Keith,
        2026-09-20).
      - None of the three fields may alter any check's config_hash.
        VERIFIED TRAP - Evidently's parser excludes config-hash fields
        by an explicit name list (check_lifecycle.py:415-417), unlike
        dbt/Soda which exclude the whole metadata block, so that list
        must be updated or every Evidently check's hash changes.
      - All three fields must be plumbed through all four parsers and
        both dashboard builders, not just the one they were first
        authored in.
      - Authoring hazard, with real evidence. This adds two prose fields
        to ~258 checks, most of them hand-edited into YAML, and plain
        English carries apostrophes, colons and hashes that terse
        technical text does not. Two real breakages happened in a single
        morning just writing this register - a continuation line
        beginning with a hash parsed as a comment, and a colon-space
        inside a plain scalar. Use block scalars for the new fields. The
        check-yaml pre-commit hook catches unparseable YAML but NOT a
        mangled-but-still-valid string, which is the more dangerous
        outcome and has bitten this project before.
      - Text is published on a public site. Keith's explicit, informed
        decision - no limit on what a failure's consequence may say,
        made with that consequence named. If this is ever pointed at
        real production data, that is a decision to revisit
        deliberately, not an unexamined default.
    decisions:
      - >
        The plain-English authoring rules live in
        docs/check-authoring-rules.md, not here. They were settled with
        Keith over 25 real checks reviewed three at a time on
        2026-09-20, each one from him rejecting a specific draft - but
        they are a standing standard governing every check authored from
        here on, across every tool and every dataset, not a record of
        this requirement's own build. A one-off migration pass is the
        wrong owner for a rule that outlives it: this requirement goes
        `built` and is never opened again, while the next person adding
        a check needs the rules and has no reason to look here. The doc
        carries each rule together with the draft it replaced, and this
        field deliberately does not restate any of it, so there is only
        ever one copy to keep true.
      - >
        Decided a standing docs/ reference rather than leaving the rules
        as decisions on this requirement, or putting them in
        check_lifecycle.py's CheckMetadata comment. docs/ is an existing,
        proven third category the 2026-09-20 "requirements are permanent,
        plans are ephemeral" rule never traded away - docs/components.md
        is the precedent, a standing convention doc read at authoring
        time and kept honest by a real CI test. CheckMetadata was
        rejected as the home because someone editing a contract YAML is
        not reading a Python dataclass; it keeps the field mechanics,
        which is what code can actually express.
      - >
        Nothing enforces the wording rules, and that was accepted with
        the consequence named. The lifecycle gate can only check that
        failure_indicates is present - it cannot tell whether a
        description names an agency or lists allowed values. This
        project has already proved that a field with no forcing function
        stays empty (`evidence` at 0/27 uses with a better spec than
        most), so the mitigation is discoverability rather than
        enforcement: the gate's own failure message names the doc, and
        so do the contract files' header comments.
      - >
        A measured correction to this requirement's own reasoning: the
        NFR claiming "on the order of 8 distinct texts" justified the
        third field was counted from the real descriptions and is
        wrong. 7 of those 8 are generator/synthetic prose, which Keith
        then ruled out; 0 are non-generator "by construction" notes;
        4 are cross-references, of which 2 exist only because wording
        is duplicated. Two genuine uses, not eight. Kept anyway on
        Keith's call - "we'll see how we go as we do more checks and
        other sets" - so nobody re-proposes dropping it without this
        context, or re-proposes it on the original, disproven count.
      - >
        The dominant shape of THIS pass is splitting, not writing. Many
        existing descriptions carry the failure meaning welded on with
        no statement of what the check verifies at all, so the work is
        mostly moving approved wording into the right field rather than
        authoring fresh prose - faster and lower-risk than it looked
        when scoped. The rule that falls out of it (a description states
        what the check verifies; the failure meaning belongs in
        failure_indicates) is in the doc.
      - >
        Measured before starting, as the real scale of the pass: 257
        active checks, 140 distinct description texts, 6 with no
        description at all, and 182 of 257 sharing description text with
        a sibling. That last number is why "shared wording is permission,
        not obligation" needed to be a rule - most of the corpus is
        shared text, and some of it papers over a real difference in
        what the sibling checks actually ask.
      - >
        The gate enforces over the WORKING TREE only, never over the
        previous commit, which `validate_check_lifecycle.py` also
        parses. Enforcing at parse time instead would have made the
        commit before this one unparseable and broken CI on the very
        push that introduced the fields - flagged as a trap while
        scoping, and the reason the check lives beside `validate()`'s
        own results rather than inside the parser. It also removed the
        only real argument for a warn-first rollout.
      - >
        Rewriting a description must never move the check. That is what
        REQ-QAC-023 fixed - name and column used to be recovered from
        the description prose - and it is the dependency that made this
        requirement safe to attempt at all.
      - >
        RESOLVED (Keith, 2026-09-20), the open question that blocked
        this pass: measured verification prose in a description is
        DROPPED, not rehomed. Rejected three alternatives, each of
        which would have kept it: `evidence:` on REQ-QAC-001 (the right
        shape - that field was narrowed to measured analysis the same
        day - but it puts the justification a level above the check it
        justifies, where nobody reading the check will find it);
        `technical_note` (would have meant reopening the
        no-synthetic-data ruling); and a new requirement invented
        mainly to give the measurements an owner. What survives is the
        tolerance itself - "tolerated null up to ~5%" is the rule and
        stays in the description - and the observed ranges are
        recomputable from committed `dataset_stats.json` whenever
        anyone wants them, so nothing is actually lost, only un-written.
      - >
        The `self-evident` sentinel renders as nothing, and is resolved
        in the template rather than at the dashboard builders (Keith,
        2026-09-20, both calls). Rendering nothing matches what an
        absent value already did and what the template's own comment
        always claimed, so the "What a failure means" heading only ever
        appears with something real under it - which matters because
        roughly half of all checks are expected to carry the sentinel.
        Resolving it in the template rather than at the builders was
        the fork: it keeps the authored value travelling through to the
        page intact, so a check definition and the data built from it
        never diverge, and changing what the sentinel LOOKS like later
        is a template edit rather than a data rebuild. Rejected
        stripping it at the builders, which would have been the same
        posture `technical_note` gets - but that exclusion exists
        because a viewer must not see contributor prose, and an
        authoring marker in page source is harmless.
      - >
        The CI gate ships OFF, as a count rather than a gate, behind an
        explicit `--require-failure-indicates` flag on `mothman
        dashboard validate-check-lifecycle`. It cannot be switched on
        until all 257 active checks are authored, and the alternatives
        for bridging that gap were worse: an allowlist that shrinks
        needs maintaining and goes stale, and not building it until the
        end means writing the gate under time pressure. Meanwhile the
        count is the useful half - it turns "257 checks to write" into a
        number that visibly moves. Flipping it on at the end is one flag
        on deploy-pages.yml's own step.
      - >
        A second, narrower rule was added to that gate once writing its
        tests exposed the hole: a near-miss spelling of the sentinel
        ("self evident", "Self_Evident") is rejected outright. The gate
        proper accepts any non-empty value, so a typo would satisfy it
        and then render verbatim under a heading on the published page -
        the same leak the template's own normalisation prevents for the
        correct spelling, and the gate is the only layer that can tell a
        typo from prose someone meant. Found because a test written to
        cover the folded-block-scalar case passed with the normalisation
        deliberately removed, which meant it was not testing what its
        own name claimed.
      - >
        Found while wiring that up, and it would have shipped: the
        render layer omitted the failure block only when the value was
        ABSENT, so the first authored sentinel would have put the
        literal words "self-evident" under a heading on a public page.
        The plumbing was written before the sentinel was approved, and
        the template's own comment already described the intended
        behaviour, so this was the sentinel arriving late rather than a
        disagreement. Two tests added and confirmed failing against the
        unfixed template first - including the folded-block-scalar
        spelling, since the authoring doc tells authors to use `>` and
        a folded scalar is not `===` the sentinel.
      - >
        The prose the open question was about is really TWO kinds, and
        only one of them was ever open. Counted against the real
        checks: 7 carry it, 7 distinct texts. Four are measured
        tolerance evidence ("real observed range: 0.9-3.3%", two
        distinct measurements shared across Soda/datacontract sibling
        pairs) - those are what the decision above settles. The other
        three are generator-construction notes on CP contract checks
        ("Passes 0/0 on every clean run - child_protection.py only ever
        assigns an Approved carer"), which need no new decision at all:
        they are the synthetic-generator prose already ruled out of
        technical_note, welded onto a real description that was never
        stated separately. They are the splitting case, not the
        rehoming one.
    open_questions:
      - >
        Should a check's real-world CONSEQUENCE weight show anywhere?
        Raised against the carer-approval check - a child placed with
        an unapproved carer is a compliance failure, not a
        data-tidiness one - and never answered. The category and red
        status may already carry it, or a data engineer triaging several
        reds at once may have no way to tell which one matters most. Not
        scoped; it would be a new field or a UI treatment, not something
        the prose can fix.
    dependencies: [REQ-QAC-023]
    implemented_by:
      - docs/check-authoring-rules.md
      - qa_tools/common/check_lifecycle.py::is_self_evident
      - qa_tools/common/check_lifecycle.py::_lifecycle_fields
      - qa_tools/common/validate_check_lifecycle.py::_explanation_errors
      - qa_tools/common/validate_check_lifecycle.py::_looks_like_sentinel
      - pipeline/build_dashboard_data.py::build
      - pipeline/build_cp_dashboard_data.py::build_one_table
      - dashboard/qa-reporting-dashboard.template.html::openCheckPanel
    linked_tests:
      - tests/test_check_lifecycle.py::test_parse_contract_check_metadata_reads_failure_indicates_and_technical_note
      - tests/test_validate_check_lifecycle.py::test_an_active_check_with_no_failure_indicates_is_an_error
      - tests/test_validate_check_lifecycle.py::test_the_self_evident_sentinel_satisfies_the_gate
      - tests/test_validate_check_lifecycle.py::test_a_near_miss_spelling_of_the_sentinel_is_rejected
      - tests/test_validate_check_lifecycle.py::test_real_prose_is_never_mistaken_for_a_near_miss
      - tests/test_validate_check_lifecycle.py::test_the_gate_is_off_by_default_and_fatal_only_when_asked
      - tests-js/check-drawer-prose.test.js
    evidence:
      - >
        2026-09-20: all 257 active checks across four tools and both
        datasets carry an authored description and a failure_indicates,
        measured by parsing the real check definitions. The CI gate is
        switched on (deploy-pages.yml runs
        validate-check-lifecycle --require-explanations), so the count
        cannot silently regress. The flag was named
        --require-failure-indicates when this was first written and is
        recorded under its real name here; re-measured at the end of the
        day, 258 checks parse with zero errors, the one retired check
        included.
      - >
        2026-09-20: 213 of the 257 use the self-evident sentinel rather
        than authored prose - 83% - with 44 carrying authored failure
        prose. This entry first recorded 129 and 50%, which was true
        when taken but was taken BEFORE the final pass authoring the
        remaining 113 checks, most of which landed on the sentinel. The
        requirement predicted "roughly half" before any check was
        written; the real answer is four in five.
      - >
        2026-09-20: all 258 check config_hashes byte-identical before
        and after the pass, captured from a git worktree at the
        pre-pass commit and compared against the working tree. 105
        prose edits in one batch, zero hash changes.
      - >
        2026-09-20: a mechanical audit of all 257 authored texts
        against the rules returned zero violations - no tool, macro or
        statistical method named; no check naming its own column; no
        figure in any description; no agency name; no run, extract or
        cadence mechanics.
      - >
        2026-09-20: 257 of 257 reach the built dashboard carrying their
        description, and technical_note reaches it zero times as data -
        its only occurrences in the built page are this register's own
        prose about the field. This entry first recorded 244 of 257: the
        13 missing were table-level checks with no column to render
        under, and routing them to the two supply/table-level pseudo-
        columns the same day closed that gap.

  - id: REQ-QAC-025
    title: No check ships without a plain-English explanation
    date_written: "2026-09-20"
    story: >
      As the person maintaining this pipeline, I want CI to refuse a
      check that has no plain-English explanation, so that coverage
      can't quietly rot the way it would if the field stayed optional.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      delivery-scoper, gap found while scoping plans/qa-pipeline.md item
      25; mechanism and exemptions settled with Keith 2026-09-20.
    acceptance_criteria:
      - WHEN check-lifecycle validation runs, IF any check is missing its
        plain-English statement of what it verifies, THEN THE SYSTEM
        SHALL exit non-zero and name every offending check_id.
      - WHEN check-lifecycle validation runs, IF any check neither states
        what a failure indicates nor explicitly declares that its failure
        cause is self-evident, THEN THE SYSTEM SHALL exit non-zero and
        name every offending check_id.
      - THE SYSTEM SHALL apply these rules to retired checks on the same
        terms as active ones.
      - THE SYSTEM SHALL treat the contributor-rationale field as
        optional and SHALL NOT report its absence as an error.
      - THE SYSTEM SHALL report every offending check in one run rather
        than stopping at the first.
      - THE SYSTEM SHALL evaluate these rules only against the checks in
        the current working tree, never against those parsed from an
        earlier commit.
      - THE SYSTEM SHALL NOT substitute a generated, inferred or
        placeholder explanation for a missing one.
    non_functional_requirements:
      - Hard failure from day one, no warning phase. The only argument
        for softening was the HEAD~1 parse problem, which the validate()
        placement removes.
      - VERIFIED TRAP - validate_check_lifecycle.py parses both the
        working tree and HEAD~1, so making these fields mandatory at
        PARSE time would make the previous commit's own files
        unparseable and break the gate on the very push that introduces
        it. Enforcement belongs in validate(), over new checks only.
      - No category-based rule. CI does not refuse the self-evident
        declaration on any category; the check's author decides
        (Keith's explicit call, 2026-09-20, declining a proposed veto on
        consistency/timeliness checks).
      - This gate is the only thing between the register and unusable
        explanations, since there is deliberately no authoring standard
        and no audit trail. It can enforce that an explanation is
        present and that a "why" was consciously decided; by design it
        cannot enforce that either is good.
      - Runs inside the existing CI gate rather than as a new workflow.
    implemented_by:
      - qa_tools/common/validate_check_lifecycle.py::_explanation_errors
      - qa_tools/common/validate_check_lifecycle.py::_looks_like_sentinel
      - qa_tools/common/check_lifecycle.py::is_self_evident
      - cli/dashboard.py::validate_check_lifecycle_command
      - .github/workflows/deploy-pages.yml
    linked_tests:
      - tests/test_validate_check_lifecycle.py::test_a_check_with_no_description_is_an_error
      - tests/test_validate_check_lifecycle.py::test_an_active_check_with_no_failure_indicates_is_an_error
      - tests/test_validate_check_lifecycle.py::test_the_self_evident_sentinel_satisfies_the_gate
      - tests/test_validate_check_lifecycle.py::test_a_near_miss_spelling_of_the_sentinel_is_rejected
      - tests/test_validate_check_lifecycle.py::test_a_retired_check_is_held_to_the_same_terms
      - tests/test_validate_check_lifecycle.py::test_both_halves_are_reported_in_one_run
      - tests/test_validate_check_lifecycle.py::test_the_gate_is_off_by_default_and_fatal_only_when_asked
    evidence:
      - >
        2026-09-20: the gate passes over all 258 checks with
        --require-explanations on, and is live in deploy-pages.yml, so
        the result cannot silently regress. Removing one check's
        description in memory produces exactly 1 error naming that
        check_id, confirming the rule bites rather than passing
        vacuously.
      - >
        2026-09-20: 1 of the 258 is retired, and it was authored rather
        than excused - the count of checks exempt from these rules is
        zero.
    decisions:
      - >
        Shipped OFF first, as a count rather than a gate, and switched
        on only once REQ-QAC-024's authoring pass reached 257 of 257.
        The counting half was what made that pass tractable - "257
        checks to write" became a number that visibly moved - and it
        still runs for anyone invoking the command locally mid-change.
      - >
        Retired checks are held to the same terms as active ones, which
        reverses how this was first built. The first version exempted
        them on the reasoning that they are history nobody reads in
        anger. That is wrong twice over: this requirement says
        otherwise in as many words, and a retired check still renders
        behind the dashboard's own retired-checks toggle, so a reader
        can still meet its prose. There was exactly one, and it was
        authored.
      - >
        The gate checks the WORKING TREE only, never the previous
        commit that validate_check_lifecycle.py also parses. Enforcing
        at parse time would have made the commit before this one
        unparseable and broken CI on the very push introducing the
        fields.
      - >
        A near-miss spelling of the sentinel is rejected outright
        ("self evident", "Self_Evident"). The rule proper accepts any
        non-empty value, so a typo would satisfy it and then render
        verbatim under a heading on the published page - the gate is
        the only layer that can tell a typo from prose someone meant.
      - >
        Named --require-explanations rather than
        --require-failure-indicates, which is what it shipped as. The
        original name described half the rule, and the half it named
        was the half this requirement did NOT originally enforce.
    dependencies: [REQ-QAC-024]

  - id: REQ-DASH-026
    title: Plain English as a check's primary headline
    date_written: "2026-09-20"
    story: >
      As a data engineer using this dashboard during a refresh, I want
      each check to lead with what it checks in plain English rather
      than with the name of the tool that ran it, so that I can tell
      what's wrong without decoding three tools' vocabularies first.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, plans/qa-pipeline.md item 25's third scoping question;
      answered 2026-09-19 and detailed with delivery-dashboard-ux's note
      2026-09-20. Amended and signed off 2026-09-20 evening, after three
      of its criteria were found to predate the fields they describe.
    acceptance_criteria:
      - WHEN a check is displayed, THE SYSTEM SHALL use its hand-authored
        name as the primary headline, in every place a check's technical
        name is rendered today.
      - THE SYSTEM SHALL render the check's description on the card,
        directly beneath the headline.
      - THE SYSTEM SHALL render the check's tool and terse identifier as
        secondary information on the same view, derived from its
        check_id and formatted "tool:terse_name", not hidden behind a
        further click.
      - THE SYSTEM SHALL NOT render the shared category label on a check
        card.
      - WHEN a viewer opens a check's detail panel, THE SYSTEM SHALL show
        what a failure indicates under its own heading, in the same
        position and with the same styling whether the check currently
        passes or fails.
      - IF a check declares its failure cause self-evident, THEN THE
        SYSTEM SHALL omit that section and SHALL NOT render the
        declaration itself as viewer-facing text.
      - IF a check has no hand-authored name, THEN THE SYSTEM SHALL fall
        back to its existing technical name rather than render an
        untitled card.
      - THE SYSTEM SHALL key a check's URL segment on its check_id, and a
        deep link captured before a wording edit SHALL still resolve
        after it.
      - THE SYSTEM SHALL render a check card as a real link, so that
        middle-click, modifier-click and copy-link-address behave as they
        do for any other link on the page.
      - THE SYSTEM SHALL clamp the card description to at most two
        rendered lines, with the full text rendered unclamped in the
        detail panel, and the status pill SHALL sit at the same position
        regardless of description length.
      - THE SYSTEM SHALL set every hand-authored check field on a card as
        element text rather than as interpolated markup, so that a value
        containing a quote or an angle bracket cannot alter the card's
        structure.
      - WHEN the dashboard is opened directly from the filesystem, THE
        SYSTEM SHALL render every explanation from embedded content with
        no network request.
    non_functional_requirements:
      - The real cost here is layout, not payload - descriptions are
        already embedded for the detail panel, so putting them on the
        card adds rendering rather than bytes, and cards render only
        inside an open column drawer, never at the executive, agency or
        dataset tiers.
      - There is deliberately no authored length cap, so the UI cannot
        assume short descriptions and "keep them short" is not available
        as a mitigation.
      - The render and e2e fixtures must include at least one check whose
        description exceeds 250 characters, or the clamp and
        panel-header criteria are untestable - the longest real
        description today is 156.
      - Two audiences read the same page at different depths, so
        promoting the plain-English headline must not cost the pipeline
        maintainer the tool trace they use to find a root cause.
      - Must keep the zero-console-errors bar and the existing Playwright
        e2e suite green.
    dependencies: [REQ-QAC-024]
    linked_tests:
      - tests/test_dashboard_check_labels.py::test_tool_ref_moves_the_tool_token_to_the_front
      - tests/test_dashboard_check_labels.py::test_tool_ref_reuses_the_grammars_own_tool_list_rather_than_a_copy
      - tests/test_dashboard_e2e.py::TestCheckCardReadsAsPlainEnglish
      - tests/test_dashboard_e2e.py::TestCheckCardIsARealLink
      - tests/test_dashboard_e2e.py::TestLongDescriptionsAreClampedOnTheCardOnly
      - tests/test_dashboard_e2e.py::TestAuthoredProseCannotAlterTheCard
    implemented_by:
      - pipeline/dashboard_check_labels.py::tool_ref
      - pipeline/build_dashboard_data.py::build
      - pipeline/build_cp_dashboard_data.py::build
      - dashboard/qa-reporting-dashboard.template.html
    evidence:
      - >
        2026-09-20: all 42 distinct tool_ref values across both datasets
        carry a tool prefix, longest 37 characters - against 20 of 54
        raw tool check names exceeding 40, and datacontract's longest
        reaching 200.
      - >
        2026-09-20: a 310-character description renders as exactly 2
        lines on the card and 4 unclamped in the detail panel, measured
        in a real browser against computed line-height. The longest real
        description today is 156, so the clamp is verified against a
        case the corpus cannot yet produce.
      - >
        2026-09-20: the status pill sits at an identical offset from the
        top of every card in a column when every description is over the
        clamp - one distinct value across all 9 cards.
      - >
        2026-09-20: a plain left-click is intercepted (defaultPrevented
        true) while meta-, ctrl- and shift-click are all left to the
        browser (false), measured on the real built page.
      - >
        2026-09-20: a name of 'Quote " and <b>bold</b>' injects 1 real
        <b> element through the pre-change renderer and truncates its
        aria-label to 'View details for Quote '; through the current one
        it renders as literal text, 0 injected elements, and the full
        string in the aria-label. 6 of 257 real checks contain an
        apostrophe and none contain a quote or angle bracket, so this is
        latent rather than live.
    decisions:
      - Decided the headline is the check's short hand-authored `name`
        rather than its fuller `description`. The criterion originally
        said "plain-English statement", written at 09:04 on 2026-09-20
        when `description` was the only plain-English field a check had;
        `name` arrived at 13:17 that day and rule 19 of
        docs/check-authoring-rules.md made it the heading that evening.
        Measured over all 257 checks - `name` runs 9-36 characters,
        `description` 27-156 - so the criterion was pointing at the
        wrong one of two fields rather than being wrong in intent.
      - Decided the description goes on the card under the headline
        rather than staying in the detail panel (Keith, 2026-09-20,
        choosing between the two). Leaving it in the panel would put the
        plain English one click away from the reader this requirement
        exists for.
      - Decided the secondary line is derived mechanically from the
        check_id tail as "tool:terse_name", rejecting three alternatives.
        Printing each tool's own check name raw was rejected because 20
        of 54 exceed 40 characters - datacontract's SQL rules reach 200,
        restating the description in tool-speak. Truncating to
        "tool:kind" alone was rejected because eleven different SQL rules
        would all read "datacontract:sql". Hand-authoring 20 short names
        (Keith's own proposal) was rejected once the check_id tails
        turned out to already be exactly that - hand-written, 23
        characters median, and already CI-gated unique per column by
        REQ-QAC-023's validate_tail_uniqueness(). A second set would be
        a mapping that rots.
      - Decided the card line and the URL segment resolve to the same
        string, so what a reader sees is what they can deep-link to and
        grep the contract for.
      - Decided hand-authored fields are set as element text rather than
        escaped on their way into an HTML string. An esc() helper only
        works where someone remembers to call it, which is the same
        silent-omission shape as the gap it would be fixing; textContent
        cannot be bypassed by a field added later.
      - Decided the primary user is a data engineer working a refresh,
        not a data steward (Keith, 2026-09-20 - stewards never look at
        this dashboard, so that user does not exist). A team lead
        glancing at it between other work is the real secondary reader,
        and is what the two-line clamp and the scannable headline are
        for.
    open_questions:
      - The card-as-real-link criterion closes half of
        plans/dashboard.md item 15. The rest of that item - per-view
        document.title, focus handling after a route change, an ARIA
        live region - stays its own work.
  - id: REQ-GHUB-027
    title: Check explanations in the tickets raised from a failure
    date_written: "2026-09-20"
    story: >
      As whoever picks up a QA remediation ticket, I want the ticket
      itself to say in plain English what is failing and why it matters,
      so that I can act on it without first going back to the dashboard.
    moscow: could
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-19; parked 2026-09-20 until the core landed, after
      delivery-architect found the drafted premise did not match the
      real ticket model. Rescoped against that model and signed off the
      same evening, once REQ-QAC-024 and REQ-DASH-026 had both landed
      and the real sentences could be judged in place.
    acceptance_criteria:
      - WHEN a ticket is opened for a dataset, THE SYSTEM SHALL name in
        its body every check on that dataset that is not green, grouped
        so that checks sharing a name and description appear once.
      - THE SYSTEM SHALL separate the checks matching the ticket's own
        status from the rest, so that a reader can tell what is driving
        the status from what is merely also not green.
      - WHERE checks are grouped, THE SYSTEM SHALL state how many checks
        and which columns that group covers.
      - THE SYSTEM SHALL present each group as the check's hand-authored
        name and its plain-English description, unaltered and
        unsupplemented.
      - THE SYSTEM SHALL link every check in a group to that check's own
        page on the live dashboard, as generated metadata alongside the
        authored prose rather than woven into it.
      - THE SYSTEM SHALL NOT include the contributor-facing technical
        note anywhere in a ticket.
      - WHEN a run posts a comment on an already-open ticket, THE SYSTEM
        SHALL include the list as it stands at that run, and SHALL post
        it even when it is identical to the previous comment's.
      - THE SYSTEM SHALL NOT edit a ticket's body after the ticket is
        opened.
      - THE SYSTEM SHALL list every group, with no cap and no
        truncation.
      - WHEN a dataset resolves to green, THE SYSTEM SHALL post its
        existing resolved comment with no check list.
      - THE SYSTEM SHALL NOT list a placeholder row standing for a
        column that no tool defines a rule against.
      - THE SYSTEM SHALL strip surrounding whitespace from every
        hand-authored check text at the point it is parsed, so that no
        consumer can fail to recognise the self-evident sentinel.
      - THE SYSTEM SHALL derive the list solely from the already-built
        dashboard JSON, never from data/ or a live warehouse
        connection.
    non_functional_requirements:
      - No new exposure - every sentence this adds is already published
        on the dashboard. What is new is that a ticket ties it to a
        named dataset and a date, which is where the public-repo
        consequence of the "no sensitivity limit" decision actually
        lands.
      - Comment volume is the real cost and is accepted deliberately - a
        dataset broken for weeks accumulates a long, near-identical list
        on every run.
      - Grouping must not depend on the order checks arrive in.
      - ticket-sync.yml is the only write-permitted workflow and stays
        that way; nothing here goes near deploy-pages.yml.
      - Normalising authored text must not change any check's
        config_hash, or every check in the repo would report as changed
        and demand a changelog entry.
    dependencies: [REQ-QAC-024, REQ-DASH-026]
    linked_tests:
      - tests/test_ticket_check_summary.py
      - tests/test_ticket_sync.py::test_a_new_tickets_body_names_what_is_actually_failing
      - tests/test_ticket_sync.py::test_every_still_red_comment_carries_the_current_list
      - tests/test_ticket_sync.py::test_the_list_is_posted_again_even_when_it_has_not_changed
      - tests/test_ticket_sync.py::test_a_dataset_resolved_to_green_gets_no_list
      - tests/test_ticket_sync.py::test_an_amber_check_is_listed_under_a_red_ticket
    implemented_by:
      - qa_tools/common/ticket_check_summary.py::build_check_summary
      - qa_tools/common/ticket_check_summary.py::check_url
      - qa_tools/common/ticket_sync.py::_check_section
      - qa_tools/common/check_lifecycle.py::_authored
    evidence:
      - >
        2026-09-20: cp-placements, the worst real dataset, renders 17
        failing and 4 warning checks as 5 and 2 grouped entries. Birth
        Registrations renders 3 checks as 1 entry, cp-carers 2 as 1.
        Measured against the real committed dashboard JSON.
      - >
        2026-09-20: every deep link the builder generates resolves to a
        check key that really exists in that dataset, asserted across
        all three non-green datasets rather than sampled.
      - >
        2026-09-20: zero of the 258 config_hashes change when authored
        text is stripped at parse time, compared against the same parse
        from HEAD. Zero values reach the dashboard JSON with stray
        whitespace afterwards, against 210 sentinels and 40 contract
        descriptions before.
      - >
        2026-09-20: 11 placeholder rows exist across the six Child
        Protection tables, carrying no key, name or description. All 11
        are green today, so a status filter alone would exclude them;
        they are excluded explicitly regardless.
    decisions:
      - Decided every not-green check is listed, not only those matching
        the ticket's status (Keith, 2026-09-20, amending his own earlier
        answer). An amber check under a red ticket is worth seeing while
        somebody is already looking. They go under a separate heading,
        because a flat list answers neither "why is this red" nor "what
        else should I know".
      - Decided against a cap with "and N more" (Keith). A genuinely
        broken dataset produces a long ticket, and that is the honest
        outcome - hiding the tail hides it from the one person who
        opened the ticket to fix it.
      - Decided the body is written once and each run comment carries
        the current list, rather than rewriting the body each run. The
        thread becomes a real record of the failure set shrinking; the
        cost, stated and accepted, is repetition on a long-running
        ticket.
      - Decided the list repeats even when identical to the previous
        comment (Keith, resolving the open question this shipped with).
        Skipping unchanged lists was the only real lever on volume and
        would have traded away the every-run-on-the-record property.
      - Decided to show name and description only, not the failure-cause
        statement. That removed a live trap rather than merely
        simplifying - 210 of 213 self-evident sentinels reached the
        dashboard JSON as "self-evident\n", and only the template's
        own .trim().toLowerCase() stopped it rendering. A ticket builder
        comparing exactly would have printed the literal word
        "self-evident" into 210 GitHub issues.
      - Decided to fix that whitespace at _lifecycle_fields(), the one
        place every parser reads authored text from, rather than at each
        consumer. Safe because _NON_CONFIG_FIELDS is derived from that
        function's own keys, so those values are excluded from
        config_hash by construction - verified across all 258 rather
        than assumed. A second source was missed on the first attempt,
        the ODCS rules' own native description:, and was caught only by
        re-measuring the built JSON.
      - Decided to grow ticket_sync's dataset mapping to carry a
        collection id rather than consolidating the four copies of that
        mapping now. This is the fourth copy, which is the exact
        condition the module's own comment set for consolidating - the
        refactor is real and does not belong inside a ticket-body
        change.
      - Rejected rewriting a ticket's body on each run. It would always
        be accurate, but loses what the ticket looked like on day one,
        and the per-run comments already carry the current truth.
    open_questions:
      - Whether the run comment should be skipped when its list is
        identical to the previous one was asked and answered - do not
        skip. Worth revisiting only after watching a real long-running
        ticket, since it is the only lever on comment volume.
  - id: REQ-PIPE-031
    title: A check's identity is its check_id, never its display name
    date_written: "2026-09-20"
    story: >
      As a data engineer reading a check's history, I want each check's
      results to belong to that check alone, so that a tile I am looking
      at is not silently blending two different checks' numbers.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Found 2026-09-20 while fixing the table-level rendering gap
      below; recorded until now only in plans/running-thoughts.md #20,
      which is why this entry exists - the most serious defect found
      that day had no requirement at all.
    acceptance_criteria:
      - THE SYSTEM SHALL key each check's accumulated per-run values on
        its check_id, never on a display name or a tool-reported check
        name.
      - IF two checks on the same column would share a tool-reported
        name, THEN THE SYSTEM SHALL still report each one's own values
        separately.
    non_functional_requirements:
      - The fix must not alter any check's config_hash, or every check
        in the repo would report as changed.
      - Must hold for both dataset builders, not only the one where the
        collision was observed.
    dependencies: [REQ-QAC-023]
    linked_tests:
      - tests/test_build_dashboard_data.py
      - tests-js/table-level-checks.test.js
    implemented_by:
      - pipeline/build_dashboard_data.py::build
      - pipeline/dashboard_check_labels.py::url_key
    evidence:
      - >
        2026-09-20: the two colliding Birth Registrations checks
        genuinely disagree on 166 of 352 committed runs, so the
        published "plausible range" tile had been showing a blend of a
        range check and a freshness check. Measured against the real
        committed qa_results history.
      - >
        2026-09-20: zero collisions across both datasets after the fix,
        with the regression test confirmed failing against the
        pre-fix builder first.
    decisions:
      - The Birth Registrations builder keyed its slots on (engine,
        check_name). datacontract-cli reports every sql-type rule as
        `datacontract:custom_sql`, so date_of_birth's range check and
        its freshness check shared one key - one vanished from the page
        and both kept writing into the survivor's values. This was live
        on the published site, not a latent risk.
      - Decided to key on check_id, whose grammar and per-column tail
        uniqueness REQ-QAC-023 already gates in CI, rather than making
        the tool-reported name unique. A display name is not an
        identity, which is the same lesson REQ-DASH-026 applies to
        URLs.
      - Child Protection was never affected - its builder is per-table
        and scoping by dataset_id gives zero collisions - so the fix
        was applied to the Birth Registrations builder only.

  - id: REQ-DASH-032
    title: Supply- and table-level checks reach the dashboard
    date_written: "2026-09-20"
    story: >
      As a data engineer checking an arriving supply, I want the checks
      that apply to the whole supply rather than to one column to appear
      on the page, so that "is this supply the right size" is a question
      the dashboard can answer at all.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Found 2026-09-20 by verifying that REQ-QAC-024's first authored
      batch actually rendered rather than assuming the builders carried
      it; recorded only in plans/running-thoughts.md #20 until now.
    acceptance_criteria:
      - THE SYSTEM SHALL render every active check, including those that
        apply to a whole supply or table rather than to one column.
      - THE SYSTEM SHALL separate checks about the size and timeliness
        of a supply from checks about whether tables agree with each
        other.
      - THE SYSTEM SHALL NOT exclude a check from the page on the
        grounds of a status-calculation bug that no longer exists.
    non_functional_requirements:
      - Must be verified in a real browser rather than at the data
        layer - a correct builder says nothing about a render layer with
        its own transform.
    dependencies: [REQ-QAC-024]
    linked_tests:
      - tests-js/table-level-checks.test.js
      - tests/test_build_dashboard_data.py
    implemented_by:
      - pipeline/build_dashboard_data.py::SUPPLY_LEVEL_PSEUDO_COLUMN
      - pipeline/build_cp_dashboard_data.py::build_one_table
      - dashboard/qa-reporting-dashboard.template.html
    evidence:
      - >
        2026-09-20: 244 of 257 active checks reached the page before
        this; 257 of 257 after. The 13 were 7 rowCount_datacontract, 5
        row_count_soda and 1 freshness_datacontract.
      - >
        2026-09-20: verified in a real browser - Birth Registrations
        shows 1 supply-level column and Child Protection 6, 12 checks
        between them, every one green, zero console errors.
    decisions:
      - Three separate causes, not the one structural quirk first
        diagnosed - a bare `continue` on the "(table)" column name, a
        deliberate row-count exclusion, and the identity collision that
        is now REQ-PIPE-031.
      - The row-count exclusion was guarding a bug that no longer
        existed. Its own comment gave the reason - a warning-severity
        check has no fail threshold, a missing one defaulted to 0, and
        the status rule read any healthy positive row count as red.
        That was fixed at source when checkStatus() started preferring
        the tool's own verdict, so the workaround outlived its bug by
        long enough to hide 12 real checks.
      - Decided on two pseudo-columns rather than one (Keith,
        2026-09-20) - "(supply-level checks)" for row-count and
        freshness, "(table-level checks)" for cross-table rules. Is
        this supply the right size is a different question from do
        these tables agree, and Child Protection already used the
        second name, so it was reused rather than invented.
      - Decided to fix this after the authoring loop finished rather
        than during it (Keith). Two consequences followed - the 13 kept
        being authored like every other check, since the prose was
        correct and would simply start rendering; and the explanation
        gate did not exempt them, which would have been the wrong way
        round with a fix already coming.

  - id: REQ-DASH-033
    title: Supply-level checks get their own section, not a pseudo-column
    date_written: "2026-09-20"
    story: >
      As a data engineer opening a dataset, I want the checks about the
      supply as a whole presented as their own part of the page, so that
      the first question I ask about an arriving supply is not filed as
      one more row in a list of columns.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      The one fork REQ-DASH-032 left open, carried out of
      plans/running-thoughts.md #20 and settled by Keith on 2026-09-20 -
      "table level checks do deserve their own dataset level section".
    acceptance_criteria:
      - WHEN a viewer opens a dataset, THE SYSTEM SHALL present
        supply-level checks and table-level checks as two sections of
        their own, each distinct from the list of columns.
      - THE SYSTEM SHALL place those sections above the column grid.
      - WHERE a dataset has no checks of one kind, THE SYSTEM SHALL omit
        that section rather than render it empty.
      - THE SYSTEM SHALL give each section its own status, by the same
        rule a column tile already uses.
      - THE SYSTEM SHALL NOT render either pseudo-column among the real
        columns once those sections exist.
      - THE SYSTEM SHALL address a check in those sections by a readable
        URL segment rather than by the current bracketed pseudo-column
        name.
      - THE SYSTEM SHALL continue to fold those checks into the
        dataset's own status exactly as it does today.
    non_functional_requirements:
      - Must be verified in a real browser, same as REQ-DASH-032 - a
        correct builder says nothing about a render layer with its own
        transform.
      - Birth Registrations has supply-level checks and no table-level
        ones, so the omit-when-empty case is real on the current data
        and must be covered, not hypothetical.
    dependencies: [REQ-DASH-032]
    linked_tests:
      - tests-js/table-level-checks.test.js
      - tests/test_dashboard_e2e.py::TestSupplyAndTableLevelSections
    implemented_by:
      - pipeline/build_dashboard_data.py::COLUMN_SCOPE_KEY
      - pipeline/build_cp_dashboard_data.py::build_one_table
      - dashboard/qa-reporting-dashboard.template.html::columnKey
      - dashboard/qa-reporting-dashboard.template.html::scopedColumns
    evidence:
      - >
        2026-09-20: cp-placements renders both sections above the grid,
        supply green and table red - independently rolled up, not both
        echoing the dataset. Birth Registrations renders one, the table
        section absent rather than empty. Measured in a real browser.
      - >
        2026-09-20: the column grid drops from 10 tiles to 8 on
        cp-placements and 14 to 13 on Birth Registrations, with no tile
        named for either section.
      - >
        2026-09-20: a check URL in those sections is
        /column/table/check/placement_carer_approval_dbt, against
        /column/%28table-level%20checks%29/... before.
    decisions:
      - Decided each row opens its check's own panel directly rather
        than the column drawer in between. The drawer exists to pick one
        check out of a column's many; a section holding one to three has
        already done that, and the extra click was part of what made
        these read as one more column.
      - Decided every transform between a builder and the page spreads
        the object it receives and overrides what it means to change,
        rather than listing the fields to copy. Recorded here because it
        had lived only in a code comment and a plans item, and this
        requirement is what it bit. An allowlist has one failure mode -
        add a field to a builder, forget the transform, and it vanishes
        with no error - and this project has now paid for it twice. Once
        when a check's own tool verdict was dropped and a check with 14
        real violations rendered GREEN, and again when REQ-DASH-033's
        `key` and `scope` were dropped and two whole sections silently
        never rendered. The fix for the first was applied to the check
        map and not to the column map one line below, which is exactly
        how the second happened.
      - Each row carries its tool reference, for the same reason a check
        card does - three tools ask cp-placements' carer-approval
        question and share one name by design, so without it the
        section reads as three identical rows.
      - Decided the sections sit ABOVE the column grid (Keith,
        2026-09-20). Whether the right amount of recent data turned up
        gates whether any column detail is worth reading, so it is
        asked first.
      - Decided on two separate sections rather than one with two
        groups (Keith), keeping "is this supply the right size" and "do
        these tables agree" as visibly different questions - the same
        reasoning that produced two pseudo-columns rather than one in
        REQ-DASH-032.
      - Decided each section carries its own status rollup, matching
        what every column tile already does.
      - Decided to rename the URL segment rather than preserve the
        bracketed pseudo-column names. The draft carried a criterion to
        keep existing deep links working and it was dropped, on two
        grounds. The narrow one - those URLs came into existence the
        same day, so nothing can have bookmarked one - would expire in a
        week. Keith's own is the standing one, 2026-09-20 - "no one has
        bookmarked those, this is not production". URL stability is a
        cost this PoC does not have to pay yet, and a criterion
        protecting it buys nothing real. That changes the day this
        becomes something people depend on, and not before.

  - id: REQ-PIPE-034
    title: Each dataset has its own arrival history
    date_written: "2026-09-21"
    story: >
      As an agency data owner watching one table, I want that table's
      arrivals recorded as its own history, so that a file my agency
      resent on Tuesday appears on its own timeline rather than folded
      into a delivery of five other tables that did not change.
    moscow: must
    status: not_started
    source: >
      Keith, plans/publishing-and-history.md item 6 - "per dataset runs
      against a shared warehouse composed of the current good version of
      every table, because that's just the reality of how it works",
      2026-09-20. Scoped by delivery-scoper, forks settled with Keith
      2026-09-21.
    signed_off:
      by: Keith
      date: "2026-09-23"
    acceptance_criteria:
      - THE SYSTEM SHALL record each arrival of a dataset's data as an
        arrival of that dataset alone, carrying its own identifier and
        its own arrival timestamp.
      - THE SYSTEM SHALL hold, for every dataset, the identity of its
        most recently ARRIVED supply, including one that could not be
        loaded.
      - THE SYSTEM SHALL hold, for every dataset, the identity of its
        most recently PROMOTED supply, and SHALL NOT report a supply
        that has arrived but not been promoted as the promoted one.
      - THE SYSTEM SHALL derive both from append-only records, and
        SHALL NOT maintain a mutable pointer to either.
      - WHERE a supply could not be loaded at all, THE SYSTEM SHALL
        still record its arrival, and SHALL NOT create a table for it.
      - WHEN one dataset in a collection receives an arrival, THE SYSTEM
        SHALL NOT create or imply an arrival for any other dataset.
      - THE SYSTEM SHALL NOT require the datasets in a collection to
        share an arrival identifier.
      - WHERE several datasets arrived together as one delivery, THE
        SYSTEM SHALL record the delivery they shared, so that a whole-
        collection delivery stays distinguishable from several
        coincidental ones.
      - THE SYSTEM SHALL present a dataset's arrival history without
        reference to any other dataset's arrivals.
    non_functional_requirements:
      - Birth Registrations must come out behaviourally unchanged - one
        table, one dataset, and its 352 committed runs are the control
        proving this model generalises rather than special-casing Child
        Protection.
      - No read-committed-history path may need a live connection to
        anything under data/ to answer "when did this dataset last
        arrive".
      - Must stay cheap once a dataset has years of arrivals rather than
        today's 18. Answering either question must not cost a walk of
        every arrival ever received, and must not be bought by keeping
        a stored pointer in step.
      - Any new entry point gets a mothman subcommand in the same change.
    dependencies: [REQ-GEN-040]
    decisions:
      - Decided each arrival carries both its own per-dataset identifier
        AND the delivery it came in, rather than per-dataset ids alone
        (Keith, 2026-09-21). "The agency sent all six on Tuesday" cannot
        be reconstructed later if it is not recorded now, and without it
        a real whole-collection delivery is indistinguishable from six
        coincidental arrivals.
      - >
        Decided "current version" SPLITS into most recently ARRIVED and
        most recently PROMOTED (Keith, 2026-09-23, at sign-off). The
        single criterion this replaces was written 2026-09-21, before
        staging and promotion were settled, and the two diverge exactly
        when it matters: a supplier sends a broken file on Tuesday, so
        it is the latest arrival, while the warehouse still holds
        Monday's good one and should. The dashboard needs the first for
        an arrival timeline; a cross-table check needs the second.
        Conflating them reads fine until a red supply arrives.
      - >
        Decided both are DERIVED from append-only records rather than
        stored as a pointer (Keith, 2026-09-23, who asked for an option
        not needing a second set of state). The two have different
        natural sources, which is what makes it free.
        Most-recently-promoted is the FILING itself - the newest table
        for the dataset in the newest period schema holding one, found
        by walking periods newest-first from config (REQ-PIPE-051) and
        stopping at the first hit, so it is bounded by periods since
        that dataset last supplied rather than by total arrivals.
        Most-recently-arrived comes from the committed arrival record.
        Rejected a mutable pointer: it is state that can drift from what
        is actually true, whereas an append-only log with a max over it
        cannot.
      - >
        Decided most-recently-arrived must NOT be derived from the
        warehouse catalogue, and the unloadable-file case is why. Such a
        supply is red with no table anywhere (Keith, 2026-09-23: there is
        no point creating an empty one when the delivery log already
        records that something arrived and could not be read). Derive
        arrival from the catalogue and a supplier sending garbage on
        Tuesday becomes invisible - the timeline would show Monday. This
        is forced rather than merely preferable: the dashboard build may
        never touch data/, so it cannot read the catalogue at all.
      - >
        Context, settled the same day but recorded in
        plans/supply-model.md Thread B rather than here because it
        belongs to the warehouse sprint: staged data lives IN the
        warehouse, in ONE GLOBAL staging schema, with a separate global
        rejected schema. Both depart deliberately from Keith's
        operational system, which runs staging per quarter and leaves
        rejected tables sitting in it.
      - >
        Decided the COMMITTED arrival record is the source of truth and
        the warehouse's own delivery log is written from it (Keith,
        2026-09-23). He had assumed a delivery log in the warehouse,
        which is right - QA and SQL query it there - but it cannot be
        the only copy, for two independent reasons: the warehouse is
        gitignored and regenerated while arrival history must survive
        for years, and the dashboard build may never touch data/ so it
        could never read that table. Same pattern
        qa_tools/*/dataset_stats.py already uses.

  - id: REQ-PIPE-035
    title: QA runs against one period's schema, with the staged delivery overlaid
    date_written: "2026-09-21"
    story: >
      As whoever maintains this pipeline, I want a QA run to read one
      period's schema with the delivery under test overlaid on it, so
      that a check comparing placements to carers reads both tables as
      they stand for that period, and a check whose dependency never
      arrived says so instead of quietly reading a different period's
      data.
    moscow: must
    status: not_started
    source: >
      Keith, plans/publishing-and-history.md item 6, 2026-09-20,
      REWRITTEN 2026-09-22 against plans/supply-model.md Threads B and
      J. The original specified a warehouse COMPOSED across periods
      from every table's current version; Thread J dropped cross-period
      composition entirely. What survives is picking the newest version
      WITHIN one period, which is a different and much smaller thing.
    signed_off:
      by: Keith
      date: "2026-09-23"
    acceptance_criteria:
      - THE SYSTEM SHALL execute a QA run against a single period's
        schema - the period whose slot the delivery under test claims -
        and SHALL NOT assemble a warehouse spanning more than one
        period.
      - WHERE a delivery's tables claim slots in more than one period,
        THE SYSTEM SHALL execute one QA run per period, each reading
        that period's schema alone, and SHALL NOT compose tables from
        different periods into a single run.
      - THE SYSTEM SHALL overlay the staged delivery's own tables on
        that period's promoted state, so that a check reads the
        candidate under test alongside the tables already promoted into
        that period.
      - WHERE a period's schema holds more than one version of a table,
        a supply and its resupplies, THE SYSTEM SHALL read the newest.
      - THE SYSTEM SHALL hold every dataset in the data asset for a
        given period in that one period schema, across agencies and
        collections, so that a cross-agency check is an ordinary
        same-schema query rather than an assembly step.
      - IF a table a check depends on has no filled slot in the period
        under evaluation and is not present in the staged delivery,
        THEN THE SYSTEM SHALL report that check RED, naming the missing
        table, and SHALL NOT evaluate it against an absent table and
        SHALL NOT report it as having no data.
      - IF a check declares a temporal reference and the referenced
        period was owed but has no filled slot, THEN THE SYSTEM SHALL
        report that check RED, naming the referenced period.
      - IF a check declares a temporal reference and no prior period was
        ever owed, because the dataset is new, THEN THE SYSTEM SHALL
        report that check as having no data rather than red.
      - THE SYSTEM SHALL resolve a temporal reference as a cross-schema
        read within the same database, and SHALL NOT copy a reference
        period into a separate database to evaluate it.
      - THE SYSTEM SHALL load every table in a delivery into staging
        before running QA over that delivery, so that a check is never
        evaluated against a table still mid-load.
      - THE SYSTEM SHALL resolve each logical table name a check uses to
        exactly one physical table, through a per-run schema containing
        only views, and SHALL discard that schema once the run
        completes.
      - THE SYSTEM SHALL record, for every QA run, which physical
        version of each table it read, in committed history that
        outlives the discarded per-run schema.
      - THE SYSTEM SHALL name a per-run schema so that one left behind
        by an interrupted run is identifiable and removable without
        reference to any other record.
      - THE SYSTEM SHALL evaluate a check once, against the state
        current at that moment, and SHALL NOT recompute it for a
        historical arrival.
      - THE SYSTEM SHALL hold all period schemas, the staging schema and
        the rejected schema in one database, and SHALL NOT create a
        database per run.
    non_functional_requirements:
      - CI must never open or query a warehouse. This is real-run-time
        work only, the same rule dataset_stats.py follows - anything a
        later read needs is computed once while a legitimate live
        connection exists, and committed.
      - Test isolation must be arranged deliberately rather than
        inherited. The per-run databases were incidentally isolating
        parallel test workers; one shared database puts several xdist
        workers in one file. One database per worker via
        tmp_path_factory, the pattern the other tools' fixtures already
        use.
      - Seeded and deterministic, so a regenerate-and-diff stays a real
        correctness check rather than noise.
      - A period schema holding the whole data asset is the single most
        sensitive artefact this design creates - in a real deployment it
        holds Birth Registrations and Child Protection records
        together. Today the data is synthetic; the requirement should
        say plainly what it would be otherwise.
    dependencies: [REQ-PIPE-034]
    decisions:
      - Decided AGAINST cross-period composition, and this requirement
        was rewritten on 2026-09-22 to remove it (plans/supply-model.md
        Thread J). Red-for-unrun is what killed it - a cross-table check
        only runs when every participating table has a filled slot for
        the period, so the query reads ONE schema, and carry-forward was
        the only reason cross-period assembly existed. Walking the
        consumers confirmed it - QA of a staged candidate is one schema
        or it is red; backfilling a new check is one period's schema;
        the dashboard's "as at T" filters qa_results by time and never
        touches the warehouse at all, which had been conflated with
        composing data throughout the original entry.
      - Decided schema-per-period replaces the per-run warehouses
        (Keith, 2026-09-21). The per-run databases existed because dbt
        and Soda have no run_id-scoped WHERE, so a per-run verdict
        needed a database holding exactly one run. Schema-per-period
        gives the same isolation AND matches the real operational
        system, instead of being a test-only construct that exists
        nowhere in production.
      - Decided checks are evaluated once against the state current at
        the time, never recomputed point-in-time (Keith, 2026-09-21).
        Closest to how a real pipeline behaves. The cost, accepted - a
        rebuild from committed history can replay recorded results but
        cannot re-derive them.
      - Decided loading completes before QA runs, whether a human or an
        automation triggers it (Keith, 2026-09-21). This resolves the
        ordering tension a tool-does-the-loading world creates, where
        placements could otherwise be QA'd before carers has been
        loaded. It does not remove the never-arrived case, which is a
        table with no filled slot at all - that case is red, per
        red-for-unrun.
      - Decided the period schema may span the whole data asset rather
        than being fenced per collection or per agency (Keith,
        2026-09-21). It is the only option supporting a check that spans
        agencies, which is arguably the point of a multi-agency data
        asset. Rejected per-collection, which covers every cross-table
        check that exists today and would have kept the sensitive
        surface smallest.
      - Decided a missing dependency reads RED, not nodata (Keith,
        2026-09-22). A check that could not run is not a check with
        nothing to say. Nodata is reserved for "nothing was owed",
        which is why a brand-new dataset's drift checks are the one
        case that keeps it - without that carve-out every new dataset
        starts life red on all its drift checks, which is how people
        learn to ignore a signal.
      - >
        VERIFIED BY EXPERIMENT, 2026-09-23, because a session claimed the
        opposite to Keith and he pushed back: dbt and Soda BOTH read
        across schemas perfectly well, so criterion 8 is not asking for
        anything exotic. A real soda.scan.Scan over a two-schema DuckDB
        resolved bare table names via `SET search_path =
        'staging,promoted'` AND ran a fully-qualified cross-schema join
        in a `fail query`, correctly failing it; a real `dbt run` with
        two sources on different schemas compiled to `from
        "wh"."staging"."placements" left join "wh"."promoted"."carers"`.
        The constraint this repo actually recorded is a DIFFERENT one -
        dbt and Soda have no `run_id`-scoped WHERE to filter ROWS by,
        which is why per-run databases existed - and the two were
        conflated. Worth keeping because the mistaken version is
        load-bearing if believed: it would rule out composing a staged
        candidate with promoted tables at all.
      - >
        Decided a mixed-period delivery FANS OUT into one QA run per
        period, rather than composing tables from different periods
        into one run (Keith, 2026-09-23). Keith's own first instinct
        was table-by-table composition, picking a different underlying
        period schema per table; he changed to fan-out on the argument
        that cross-period composition is exactly what Thread J killed,
        and that the composed run produces a meaningless comparison -
        a cross-table check reading August's clients against November's
        notifications. His words: "we don't want to be munging things
        across period schemas." Fan-out leaves the single-period
        criterion above intact rather than weakening it.
      - >
        Decided the period is NEVER read from the file, which is what
        dissolves the question of how a mixed-period delivery is even
        recognised (Keith asked this directly, 2026-09-23). Thread B
        rejected deriving the period from content as circular - it
        would infer the filing decision from the very data whose
        correctness is about to be tested, so a bad extract files
        itself wrongly and is then QA'd against the wrong period,
        failing silently. The period comes from arrival time plus
        PER-DATASET slot state, so a mixed-period delivery arises with
        nothing read from any file: two tables land at the same instant
        and claim different periods because their slots were in
        different states.
      - >
        Decided a mixed-period delivery NEVER auto-promotes, even when
        green (Keith, 2026-09-23, restating Thread H's gate and
        accepting it). His words: it is "a weird enough situation that
        I'd rather a human makes a call". The promotion rule itself
        belongs to the promotion sprint rather than here; recorded so
        it is carried across when that batch is scoped. Thread H's
        TS-33b warning travels with it: the gate's condition is
        different PERIODS, not different SLOTS - an implementation
        keyed on slots blocks auto-promotion on every healthy
        multi-table delivery, since per-table slots mean an ordinary
        six-table delivery already spans six slots in one period.
      - >
        Decided the overlay is an EPHEMERAL per-run view schema (Keith,
        2026-09-23), one view per logical table pointing at the one
        physical table that run should read, dropped when the run
        completes. His words: "that feels nicer than littering the
        database with a bunch of views for every single QA run."
        Two WRONG justifications were given for it first and are
        recorded so they are not repeated. It is not because dbt and
        Soda cannot read across schemas - verified false. It is not
        because composition needs it - `search_path` handles that. The
        REAL reason is that logical and physical names differ here:
        Thread A settled that physical table names carry the arrival
        timestamp, so neither staging nor a period schema contains a
        table literally named `placements`, and staging can hold
        several versions of one at once. Something has to bridge a
        stable name to one version per run, and that need exists even
        if everything lived in one schema.
      - >
        Consequence of the views being ephemeral, caught only after
        agreeing to it: the view definitions CANNOT be the record of
        which version was read. That was claimed a message earlier and
        is wrong - dropping the schema drops the record. So the
        resolution map is written into committed history during the
        run, the same dataset_stats.py pattern of computing once while
        a legitimate live connection exists. The view is the mechanism;
        it is not also the audit trail.
      - >
        Rejected templating sources.yml and the SodaCL checks file per
        run with fully-qualified physical table names, which would work
        and needs no views. It breaks a property this project
        deliberately has and the README states explicitly - that the
        schema/checks files do not need to change to run the real
        tools.
      - >
        Note for whoever builds the overlay: the mechanism verified
        alongside the above is an EPHEMERAL per-run view schema. A view
        in a third schema composing staging and a period schema works, a
        staged table SHADOWS a promoted one of the same name, and DROP
        SCHEMA ... CASCADE leaves both real schemas untouched - the
        views hold no data, so nothing is lost by discarding them after
        the run. Keith's own constraint, 2026-09-23: it must not hang
        around clogging up the database. Not yet a criterion; recorded
        so the experiment does not have to be repeated.
      - NOT decided here - "current version versus good version", ie
        whether a downstream consumer reads a red table or the last
        green one. The original wording of this requirement answered it
        (current version always, status reported rather than acted on)
        but that question is about the DOWNSTREAM OPERATIONAL
        warehouse, which is out of this tool's scope, and Keith's
        "latest version available of each table" referred to that
        warehouse rather than to this one. It is parked to be settled
        alongside plans/conceptual-design.md Thread A's amber
        accept/reject governance, since both ask what the pipeline may
        do on a human's behalf about data quality. Inside this tool the
        question does not arise - promotion decides what is in a period
        schema, and a red supply is never auto-promoted.

  - id: REQ-PIPE-036
    title: A delivery triggers one QA run, and each dataset's results stand alone
    date_written: "2026-09-21"
    story: >
      As the data team leader in the central agency whose team manages
      every incoming supply, I want QA to run as a delivery lands and to
      report on each dataset as soon as that dataset has been checked,
      so that I am not waiting on the other tables in the same supply,
      or on another agency's tables entirely, before I see any result at
      all - and so that a normal delivery does not flash red while its
      own tables are still landing.
    moscow: must
    status: not_started
    source: >
      Keith, plans/publishing-and-history.md item 6, 2026-09-20 - "per
      dataset QA runs, each triggered by its own table's arrival".
      REVISED 2026-09-22 against plans/supply-model.md Thread B - the
      per-dataset INDEPENDENCE survives, the per-TABLE trigger does
      not. The trigger is now the delivery.
    acceptance_criteria:
      - WHEN a delivery has been loaded into staging, THE SYSTEM SHALL
        run QA once over that delivery, per period that delivery's
        tables claim slots in - which for an ordinary delivery is
        exactly one.
      - THE SYSTEM SHALL NOT trigger a separate QA run per table within
        a delivery.
      - THE SYSTEM SHALL NOT trigger a QA run on a clock, and SHALL NOT
        require a periodic sweep to resolve a table that never arrived.
      - THE SYSTEM SHALL scope each tool invocation to one dataset, so
        that the tool's raw output describes that dataset alone and
        needs neither duplicating nor filtering to be stored per
        dataset.
      - THE SYSTEM SHALL NOT require every table in a collection to have
        arrived before running an arriving dataset's own single-table
        checks.
      - IF a table in a delivery cannot be loaded, THEN THE SYSTEM SHALL
        still stage and QA the rest of the delivery, and SHALL report
        the failed table as a red finding rather than refusing the
        delivery.
      - WHEN a table missing from an earlier delivery arrives later, THE
        SYSTEM SHALL treat it as its own delivery and run QA over it.
      - WHEN a table arrives, THE SYSTEM SHALL evaluate that table's own
        checks together with every check in the same period that
        declares a dependency on it, and SHALL NOT re-evaluate a check
        that does not depend on it.
      - THE SYSTEM SHALL NOT re-evaluate a check belonging to a period
        other than the one the arriving table claims, even where that
        check declares a temporal reference to the arriving table's
        period.
      - IF a QA run fails partway through, THEN THE SYSTEM SHALL fail
        loudly, naming the dataset and the tool, and SHALL NOT record a
        partial run as a complete one.
      - THE SYSTEM SHALL keep each tool's raw output genuinely
        unmodified, exactly as it does today.
    non_functional_requirements:
      - What constitutes a delivery must be stated per source. The
        boundary is load-bearing and it comes from the transport - one
        folder drop, one prefix, one session. A source that cannot
        express a boundary needs one arranged operationally, and that
        should be explicit rather than assumed.
      - Whole-pipeline runtime must not materially regress from today's
        ~45s for both datasets. Per-dataset scoping multiplies the
        number of invocations, which is the obvious place for this to
        go wrong.
      - Parallel per-dataset runs must not collide on shared scratch
        paths. The dbt target_path race is the worked precedent, and
        per-dataset runs create more of exactly that shape.
      - Removing raw_output duplication is a measurable outcome -
        raw_output is ~75% of each run's bytes today. Measure committed
        size before and after rather than assuming.
      - Invoked through mothman only.
    dependencies: [REQ-PIPE-034, REQ-PIPE-035, REQ-GEN-040]
    decisions:
      - Decided the trigger is the DELIVERY, not the table (Keith,
        2026-09-22), which is why this requirement was revised rather
        than built as written. Under per-table triggering, six CP tables
        landing seconds apart make "Client reference" read red at
        09:00:00 and green at 09:00:04 - transiently true and
        practically useless. At 30 datasets a red appearing on every
        normal delivery is how people learn to ignore red. Loading the
        delivery as one package and running QA once over it makes a
        genuinely missing table durably red instead.
      - Rejected a clock-driven trigger (Keith, 2026-09-22, in his own
        words "would rather not add a clock driven trigger"). An earlier
        attempt the same day defined readiness over EXPECTED tables and
        so needed a periodic sweep to resolve one that never showed.
        Delivery-triggering removes the clock from the model entirely -
        there is nothing to resolve, because the sixth table's slot is
        simply unfilled, and overdue is a computed property rather than
        an event.
      - Decided a delivery is an OBSERVED TRANSPORT UNIT, which is what
        distinguishes it from the supplier-declared manifest rejected in
        Thread B. A supplier declaring which period their data is for is
        a judgment we would have to trust and cannot enforce across a
        varied supplier base. A delivery is a physical fact about how
        the data landed that we can see for ourselves - nobody is
        asserting anything, we are noticing what arrived together.
      - Decided a delivery is not atomic in the roll-back sense. Five
        tables landing and one failing requires the five to be staged
        and QA'd; a failed sixth does not refuse the delivery.
      - >
        Decided a late-arriving table re-evaluates its own checks plus
        the checks that DEPEND on it, rather than triggering a full run
        for its period (Keith, 2026-09-23). This session had flagged the
        full run as a cost to accept; Keith proposed the narrower rule
        and worked it through on clients and placements - placements
        arrives green and promotes, clients arrives red, clients is
        resupplied, and the resupply has to re-run the cross-table
        checks tied to clients even though placements itself did not
        change. Narrower, cheaper, and it scales at 30 datasets where a
        full-period run per dribbling table would not.
      - >
        Boundary drawn explicitly because the obvious implementation of
        the rule above breaks a criterion already signed off: "every
        check that depends on it" must mean within the SAME PERIOD. A
        drift check in a later period declares a temporal reference to
        this one, so a naive dependency walk would recompute history,
        which REQ-PIPE-035 forbids - checks are evaluated once against
        the state current at the time and never recomputed for a
        historical arrival.
      - >
        Note on why this makes REQ-QAC-037 load-bearing rather than
        merely tidy. Re-running a cross-table check when clients arrives
        would otherwise change a result on PLACEMENTS' history on a day
        placements did not change - the exact complaint REQ-QAC-037's
        own story is written about. Filing cross-table checks in the
        cross-table scope is what makes this refinement safe, so the two
        have to land together rather than in either order.

  - id: REQ-QAC-037
    title: A cross-table check belongs to the cross-table scope, not to one dataset
    date_written: "2026-09-21"
    story: >
      As a data engineer looking at carers, I want a check about the
      relationship between placements and carers filed with the checks
      that span tables, so that I never see a check change on my
      dataset's history on a day my dataset did not change.
    moscow: must
    status: not_started
    source: >
      Keith, plans/publishing-and-history.md item 6 answer 2,
      2026-09-20 - rejected recording against the triggering dataset,
      and rejected duplicating against every table a check touches.
    acceptance_criteria:
      - THE SYSTEM SHALL record a check spanning more than one dataset
        against a cross-table scope of its own, not against any one of
        the datasets it touches.
      - THE SYSTEM SHALL NOT duplicate a cross-table check's result
        against each dataset it touches.
      - THE SYSTEM SHALL evaluate cross-table checks against the
        composed warehouse, so that both sides are real current data.
      - WHEN a dataset a cross-table check depends on receives an
        arrival, THE SYSTEM SHALL re-evaluate that check, and SHALL NOT
        re-evaluate cross-table checks that do not depend on it.
      - THE SYSTEM SHALL record, against each cross-table result, which
        version of each participating dataset it was evaluated against.
      - WHEN a cross-table check's result changes without the dataset a
        viewer is looking at having changed, THE SYSTEM SHALL name the
        arrival that caused the re-evaluation.
      - THE SYSTEM SHALL continue to present cross-table checks in the
        section of their own that REQ-DASH-033 gives them.
    non_functional_requirements:
      - A cross-table result stops being a pure function of one arrival.
        Its record must carry enough to reconstruct which versions it
        saw, or the history becomes unreadable after the fact.
      - No live data access from any path that reads this history back.
      - This changes the shape of a stored result, so enumerate every
        consumer mechanically and assert at the last transform before
        the user - CLAUDE.md's standing lesson from item 74, where a
        green data layer hid a false green in the render layer.
    dependencies: [REQ-PIPE-035, REQ-PIPE-036, REQ-QAC-039]
    decisions:
      - Decided a cross-table result belongs to its own scope (Keith,
        2026-09-20). Rejected recording it against the triggering
        dataset, since a viewer of carers would never see a check
        concerning carers change; and rejected duplicating it against
        every table it touches, which means two records to keep in step
        and a result appearing in a dataset's history without that
        dataset changing.
      - Decided re-evaluation is triggered by an arrival of a table the
        check actually depends on, not by any arrival in the collection
        and not on its own cadence (Keith, 2026-09-21). Precise, with no
        re-evaluations recorded that nothing caused.
    open_questions:
      - Where the cross-table scope physically lives in qa_results/ and
        what it is called. Left for delivery-architect - a storage-shape
        question, with the thing that matters already settled.

  - id: REQ-PIPE-038
    title: qa_results is keyed per dataset, and today's history is regenerated
    date_written: "2026-09-21"
    story: >
      As whoever reads this QA history years from now, I want every
      run's files under the dataset they actually describe, so that
      finding one table's history is opening a directory rather than
      opening a collection-level file and filtering it through a map
      somebody maintained by hand.
    moscow: must
    status: not_started
    source: >
      Keith, plans/publishing-and-history.md item 6, 2026-09-20 -
      "qa_results/ keyed per dataset, which is where this item started".
      Narrowed 2026-09-21 once he settled that the existing history is
      deleted and regenerated rather than migrated.
    acceptance_criteria:
      - THE SYSTEM SHALL store every committed QA result under the
        dataset it describes.
      - THE SYSTEM SHALL store a cross-table result under its own
        cross-table scope rather than under a dataset.
      - THE SYSTEM SHALL key Child Protection and Birth Registrations by
        the same rule, with no per-dataset special case.
      - THE SYSTEM SHALL regenerate the committed history from scratch
        under the new model, and SHALL NOT migrate, reshape or patch the
        existing files.
      - WHEN regeneration has completed, THE SYSTEM SHALL leave no
        committed results in the old shape.
      - THE SYSTEM SHALL perform regeneration locally, and CI SHALL NOT
        regenerate, open or query any data.
      - THE SYSTEM SHALL expose regeneration as a mothman subcommand
        rather than a bare script.
    non_functional_requirements:
      - Deleting today's committed qa_results/ is a one-off exception to
        CLAUDE.md's rule that nothing in it is ever regenerated away. It
        is granted because this PoC's history is synthetic and two days
        old, and it generalises to nothing - the requirement should say
        so in as many words, because the next session will read the
        precedent rather than the permission. In a real deployment the
        history could not be regenerated at all, which is the whole
        reason the rule exists.
      - The dashboard's activity feed derives "who QA'd what, when" from
        run_by/run_timestamp plus git history. After regeneration it
        will show one burst rather than the current spread. Inspect the
        feed rather than assuming it survives.
      - Measure committed size and file count before and after. Today it
        is 1,850 files and 129MB - 1,760/118MB of it Birth
        Registrations. raw_output is ~78% of a file's bytes and stops
        being duplicated, while CP's 18 collection-level run directories
        become a per-dataset shape, so the net is a real question rather
        than an obvious win.
      - Regeneration must be idempotent and re-runnable, since it will
        be got wrong at least once.
      - Seeded and deterministic, so regenerating twice produces the
        same history and a diff stays a real correctness check.
    dependencies: [REQ-PIPE-034, REQ-PIPE-036, REQ-QAC-037]
    decisions:
      - Decided to DELETE and regenerate rather than migrate (Keith,
        2026-09-21, in as many words - "because the current data is all
        synthetic, I'm happy to delete it all and regenerate it. We
        don't need to do any migration or patching, just nuke it and
        regenerate"). This is a PoC reset, not a migration pattern.
      - That resolves a contradiction the earlier draft could not have
        met. A CP run's raw_output is ONE scan document describing all
        six tables - scanStartTimestamp, hasErrors and the rest apply to
        the whole invocation - and it is 78% of the file. Splitting it
        per dataset means either copying it into six files, each then
        claiming a raw output that is not its own, or filtering a
        document whose fields describe one invocation, which breaks the
        genuinely-unmodified guarantee that makes raw_output worth
        keeping. `verified` splits cleanly (12/13/11/10/7/6 for Soda);
        raw_output does not.
      - Rejected re-running the old runs to reshape them while calling
        it a migration. That only works because the data is seeded and
        synthetic - in a real deployment you cannot re-run a 2023
        delivery - and a pipeline that is only safe because today's data
        happens to be synthetic is the exact thing Keith rejected for
        deploy-pages.yml. Deleting and regenerating is the same act
        stated honestly, which is why it is acceptable and re-running-
        as-migration would not have been.
      - Note what regeneration is NOT doing. Birth Registrations' 1,760
        files do not need re-keying - they are already under their own
        dataset. What they need is the check_id rename from
        REQ-QAC-039, which regeneration delivers for free rather than as
        a rewrite of committed files.

  - id: REQ-DASH-055
    title: The dashboard shows real datasets only
    date_written: "2026-09-23"
    story: >
      As someone changing how the dashboard works, I want every tile on
      it to be a real dataset, so that a structural change has one kind
      of dataset to work against rather than two.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-23"
    source: >
      Keith, 2026-09-23, mid-sprint - "I think it might be worthwhile if
      we just get rid of all the illustrative data from the dashboard. I
      think that's probably going to cause us more pain than we need."
      Logged as plans/running-thoughts.md #28 with his own timing:
      after sprint 1's build step, which REQ-GEN-042 completed the same
      day. Pairs with #29, which replaces the invented breadth with real
      breadth once the sprints are done.
    acceptance_criteria:
      - THE SYSTEM SHALL present only datasets backed by real pipeline
        history, and SHALL NOT present invented agencies, collections or
        datasets alongside them.
      - THE SYSTEM SHALL NOT retain a generator for mock check results,
        columns, datasets or value pools.
      - WHERE a real dataset has no history at or before the selected
        as-of date, THE SYSTEM SHALL say so on that dataset's own tile
        rather than omitting the dataset.
      - THE SYSTEM SHALL keep every rollup, navigation and as-of
        behaviour it has today for the datasets that remain.
      - THE SYSTEM SHALL NOT carry a second statement of the
        agency/collection/dataset tree once the illustrative one is
        gone.
      - WHEN the template is opened with no data embedded, THE SYSTEM
        SHALL render without console errors and SHALL make plain that
        nothing is embedded, rather than appearing to show real
        content.
    non_functional_requirements:
      - The "Illustrative mock data" label is the page's own honesty
        mechanism and disappears with the thing it labels. Nothing that
        remains may read as illustrative, and nothing illustrative may
        remain unlabelled - there is no third state.
      - Removal must be verified by what the page RENDERS, not by what
        the source no longer contains. CLAUDE.md's standing lesson -
        assert at the last transform before the user.
      - Real coverage exists for the raw, unembedded template
        (tests/test_dashboard_e2e.py) and for its inline JS against
        mock data (tests-js/navigation.test.js). Both change meaning
        here and must be re-pointed deliberately, not deleted to make a
        suite go green.
      - Config only and render only - nothing here touches data/, a
        warehouse, or committed history.
    linked_tests:
      - tests-js/navigation.test.js
      - tests-js/dashboard-loads.test.js
      - tests/test_dashboard_e2e.py::test_raw_template_renders_with_zero_console_errors
      - tests/test_check_dashboard_renders.py
    implemented_by:
      - dashboard/qa-reporting-dashboard.template.html
      - tests-js/support/loadDashboard.js
    evidence:
      - >
        2026-09-23: the procedural mock generator is gone - a check
        library, genCheck/genColumn/genDataset and the column pools,
        85 lines - along with the three invented agencies, the two
        invented siblings beside Birth Registrations, and the
        "Illustrative mock data" pill that labelled them. 24
        genDataset() call sites, now zero.
      - >
        2026-09-23: buildData() builds the whole tree from HIERARCHY
        and carries no literals at all, so the template is a pure
        renderer. Verified in a real browser both ways: the built file
        renders 2 agencies with zero console errors, the raw template
        renders 0 and says "No data embedded" rather than "0 agencies".
      - >
        2026-09-23: A REAL BUG FOUND BY DOING THIS, and it was always
        reachable rather than introduced here. renderAgency() and
        renderDataset() dereferenced whatever find() returned without
        checking, so a URL pointing at a renamed or removed dataset
        threw an uncaught TypeError and rendered a blank page. Removing
        fourteen datasets at once is what made it easy to hit. Three
        tests were written first and confirmed failing against the
        bug - they also took an existing passing test down with them -
        then the not-found state was added and all four passed.
      - >
        2026-09-23: only ONE JS test genuinely depended on the mock
        data, fewer than the plans entry predicted. Both it and
        tests-js/navigation.test.js were re-pointed deliberately rather
        than deleted: navigation now embeds a minimal tree through the
        same const substitution the real build uses, so it still
        asserts that a real deep link resolves.
      - >
        2026-09-23: 980 Python tests, 166 JS tests, all eight mothman
        gates.
    dependencies: [REQ-QAC-039]
    decisions:
      - >
        Decided the trigger is the COST OF TWO KINDS OF DATASET, not
        tidiness (Keith, 2026-09-23). The page was already honest -
        every invented tile carries an "Illustrative mock data" label
        and none claims to be real - so nothing here fixes a lie. What
        it removes is that every structural change has to work against
        both a real dataset and a generated one, which is the pain his
        own words name.
      - >
        Decided this pairs with plans/running-thoughts.md #29 and is
        not a standalone shrink. The point is to replace invented
        breadth with REAL breadth - a few small datasets across several
        agencies, with genuinely different column shapes, once the
        sprints are done. Recorded because reading this requirement
        alone would suggest shipping a permanently two-dataset
        dashboard, which is not what was asked for.
      - >
        Recorded because it is the non-obvious consequence, found while
        building REQ-QAC-039 rather than while scoping this: the
        template's HIERARCHY fallback exists PRECISELY BECAUSE the raw,
        unembedded template has to render with illustrative data. Take
        the illustrative tree away and that justification goes with it,
        so the fallback is not something to preserve out of caution -
        it is the open question below.
      - >
        ANSWERED 2026-09-23 by Keith, taking the fuller change: the
        raw, unembedded template renders NOTHING until HIERARCHY is
        embedded. That removes the last literal copy of the
        agency/collection/dataset tree and finishes what REQ-QAC-039
        started - every node now comes from contract/data-asset.yaml
        with no exceptions, so a rename there cannot leave a stale
        fallback behind. Rejected keeping the two real agencies as
        literal fallbacks showing no-data tiles, which was the smaller
        change and kept tests-js/navigation.test.js working as written,
        but would have preserved in the template exactly the duplicate
        this project spent 2026-09-23 removing everywhere else. The
        cost accepted: the raw-template render check now asserts a
        different thing, and one JS test file embeds a minimal tree
        before driving the page.

  - id: REQ-QAC-039
    title: One hierarchy, stated once, including in a check's own identity
    date_written: "2026-09-21"
    story: >
      As someone adding the next dataset, I want agency, collection and
      dataset to mean one thing stated in one place, so that a check's
      id, its dashboard URL and its stored results agree instead of each
      carrying a different half of the truth.
    moscow: must
    status: built
    source: >
      Keith's own question, 2026-09-20 - "what is it that actually
      groups Child Protection data together as a collection?" - and the
      four inconsistencies the answer turned up, all re-verified against
      real code. plans/publishing-and-history.md item 6. AMENDED
      2026-09-22 against plans/supply-model.md Threads F and K, in the
      batch 1+2 scoper pass: the hierarchy definition is now also what
      the schedule config's dataset references are validated against,
      and Thread F settles the dataset/table collapse this requirement
      left open.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL define each dataset's place in the hierarchy in
        exactly one place, and SHALL resolve every consumer's need for
        those identifiers through it.
      - THE SYSTEM SHALL model a collection for Birth Registrations by
        the same mechanism Child Protection uses, rather than skipping
        the level or restating it in each tool module.
      - THE SYSTEM SHALL carry exactly one identifier and one display
        name for a collection, and SHALL NOT leave the contract's own
        id, name and domain disagreeing with it.
      - THE SYSTEM SHALL NOT retain a hand-maintained table-to-dataset
        map.
      - THE SYSTEM SHALL carry a collection segment in a check's own
        identity, so that a check's collection is derivable from it.
      - THE SYSTEM SHALL drop the separate table segment from a check's
        identity, and SHALL NOT carry the data-asset segment in a
        dashboard URL.
      - WHEN check-lifecycle validation runs, IF a check's identity
        disagrees with the single hierarchy definition, THEN THE SYSTEM
        SHALL exit non-zero and name every offending check.
      - THE SYSTEM SHALL change every affected check identity exactly
        once, in the same change as the history rebuild, and SHALL NOT
        leave two id shapes in committed history.
      - THE SYSTEM SHALL resolve every reference to a dataset made by
        schedule or asset configuration, including the calendar a
        dataset names, through that same single hierarchy definition, so
        that a dataset named in one and absent from the other is a
        detectable error rather than a silent mismatch.
      - THE SYSTEM SHALL keep a check identity resolvable to exactly one
        dataset, so that a check's identity and a slot's identity name
        the same thing.
    non_functional_requirements:
      - Renaming a check_id needs its own explicit, recorded exception
        to the 2026-09-16 rule that a check_id is permanently unique and
        must never be changed - on the same terms as the qa_results
        rebuild, not inherited from it by implication. 1,850 committed
        history files, 129MB, carry today's ids.
      - Every check's config_hash must be accounted for. REQ-QAC-023's
        bar was byte-identical hashes; if a rename changes them, say so
        up front rather than discovering it as "every check in the repo
        reports as changed".
      - check_id.py builds its regex from _SEGMENTS precisely so a
        grammar change is one edit that propagates. Keep that property.
      - Retiring the table-to-dataset map removes real ongoing upkeep -
        the point, not a side effect.
      - Nothing here needs a live connection to data/ or any warehouse.
    dependencies: []
    linked_tests:
      - tests/test_hierarchy.py
      - tests/test_validate_hierarchy.py
      - tests/test_check_id.py
      - tests/test_validate_check_lifecycle.py
      - tests/test_check_lifecycle.py
      - tests/test_dashboard_e2e.py::TestTheRenderedTreeComesFromTheHierarchy
    implemented_by:
      - qa_tools/common/hierarchy.py::Dataset
      - qa_tools/common/hierarchy.py::all_datasets
      - qa_tools/common/hierarchy.py::dataset
      - qa_tools/common/hierarchy.py::dataset_for_table
      - qa_tools/common/hierarchy.py::datasets_in_collection
      - qa_tools/common/validate_hierarchy.py::validate
      - qa_tools/common/check_id.py::validate_hierarchy_agreement
      - qa_tools/common/check_id.py::validate_tail_uniqueness
      - qa_tools/common/check_lifecycle.py::migrate_pre_039_check_id
      - qa_tools/bdm/bdm_common.py::DATASET
      - qa_tools/cp/cp_common.py::TABLES
      - contract/data-asset.yaml
      - dashboard/qa-reporting-dashboard.template.html
      - cli/dashboard.py::_validate_hierarchy
    evidence:
      - >
        2026-09-23: the tree is stated once in contract/data-asset.yaml
        and resolved through one module. Twelve Python files carried
        hierarchy literals before this; the count is now zero, and the
        two that remain (cp_common.COLLECTION_ID,
        bdm_common.DATASET_ID) each name WHICH part of the tree their
        scripts are for, which is a reference rather than a restatement.
      - >
        2026-09-23: all six contract fields that had drifted were
        corrected, and validate_hierarchy.py was verified against the
        real pre-fix files FIRST - it catches all six and exits 1.
        tests/test_validate_hierarchy.py reproduces the three real
        drifts rather than describing them.
      - >
        2026-09-23: all 258 check ids were renamed in one change,
        gaining a collection segment and losing the table one. Measured
        against the real previous commit rather than reasoned about:
        258 before, 258 after, one-to-one, and ZERO config_hash changes
        - every parser excludes the metadata block carrying the id
        (dbt's meta, Soda's attributes, the ODCS rule's
        customProperties) and Evidently's id is a dict key that never
        enters its config. The NFR asking this to be said up front is
        answered: no check reports as changed.
      - >
        2026-09-23: zero grammar errors, zero tail collisions and zero
        hierarchy disagreements across all 258 checks, and across the
        257 distinct ids in the regenerated committed history. The tail
        check mattered here - dropping the table segment is exactly
        what could have collided two ids into one URL.
      - >
        2026-09-23: the rendered dashboard tree genuinely comes from
        the config, proved by changing a collection's display name in
        contract/data-asset.yaml, rebuilding, and reading the new name
        back out of a real browser - not by reading the code. Before
        this the two real agency and collection nodes were literals in
        the template.
      - >
        2026-09-23: 875 Python tests and 162 JS tests pass, all eight
        mothman gates green, and the CI-safe rebuild works from
        committed history alone.
    decisions:
      - >
        REVERSED 2026-09-23, with Keith, and recorded as a reversal
        rather than a quiet rewrite: the committed qa_results/ tree is
        rewritten THREE times, not twice. The decision below tied this
        requirement's regeneration to REQ-GEN-042's so they would land
        as one. Building it turned up the reason that does not work -
        REQ-GEN-042's own criterion that the generator reads its
        schedule from the same configuration the pipeline reads depends
        on REQ-PIPE-049's named calendars, which are not built, and
        both requirements declare dependencies: [] as though
        independent. Keith chose the third rewrite over either signing
        REQ-PIPE-049 in early or deferring a signed criterion. What it
        costs is one extra full-tree commit; what it buys is that
        neither the sign-off gate nor a signed criterion is bent to
        save one.
      - >
        Found while building, and worth keeping because the fix is not
        obvious from the criterion: dropping the table segment made
        validate_tail_uniqueness() a restatement of global check_id
        uniqueness. Its key was (data_asset, agency, collection,
        dataset, column, tail), which after the change is every segment
        of the id, so no two distinct ids could collide and the rule
        could never fire. It is now keyed on exactly what a dashboard
        URL carries and nothing else - data_asset excluded, since the
        URL does not carry it. That restores real force for the one
        case that remains: two assets sharing one set of configuration
        files, which is the whole reason that segment stays. Found by a
        test that stopped being able to construct a collision, not by
        reading the code.
      - >
        Decided the one-time rename exception is spent in CODE, next to
        the rule it excepts, as a self-expiring TRANSFORM rather than a
        hand-listed dict of 258 pairs
        (check_lifecycle.migrate_pre_039_check_id). A list could be
        wrong in a way nobody would check; a transform states the same
        rule the rename applied, so an old id that does not map onto a
        real new one still fails the permanence gate. It only ever
        rewrites an id matching the OLD grammar, which nothing authored
        after this commit can do, and from the next commit no such id
        exists in history - so it is dead code that changes nothing.
        Kept rather than deleted so the exception is visible where the
        error is raised, instead of only in a requirement nobody reads
        at the moment they hit it.
      - >
        Decided the dashboard template keeps its literals as the raw,
        unembedded fallback while the real agency and collection nodes
        take their id and name from an embedded HIERARCHY const (Keith,
        2026-09-23). The template must render standalone with
        illustrative data, so something has to be written there; what
        this removes is the copy that anything a reader ever sees would
        use. Rejected building the real nodes entirely from HIERARCHY,
        which is cleanest against the criterion but changes what the
        raw template demo shows and what several tests-js navigation
        tests assert. Rejected leaving the template alone, which would
        have let a collection rename break the real tiles' URLs
        silently.
      - >
        Decided the changelog feed labels Birth Registrations' scope by
        its collection, "Civil Registration", rather than special-casing
        a single-dataset collection to keep the old label (Keith,
        2026-09-23). A feed entry is a collection-level publish event
        now that both scopes are collection-level, and the
        special-casing would have reintroduced the asymmetry this
        requirement removes.
      - Decided to rename check_ids once, carrying BOTH the new
        collection segment and running-thoughts item 22's own changes -
        dropping the table segment and the data-asset prefix from the
        URL (Keith, 2026-09-21). The history rebuild is the only moment
        a rename is cheap, so doing it once beats justifying a second
        rename later when it is not. Rejected renaming for collection
        alone, and rejected leaving ids untouched and resolving
        collection through the hierarchy definition - which would keep
        the permanence rule intact but leave the id skipping a level the
        rest of the system models.
      - Recorded because the prose it replaces got it wrong - Birth
        Registrations does NOT lack a collection in code. All four
        qa_tools/bdm/run_*_bdm.py modules declare
        COLLECTION_ID = "civil-registration", copy-pasted four times,
        while orchestrate_bdm.py and build_results_from_history.py
        declare only agency and dataset. BDM names its collection and
        never passes it to write_qa_result, which is why it vanishes at
        the storage layer. A duplication problem as much as an omission.
      - "Decided dataset and table collapse safely, which is what the open
        question here used to ask. Thread F settles that a SUPPLY is one
        table version and a slot is one (table, period) pair, so
        dataset-to-table is 1:1 BY CONSTRUCTION under this model rather
        than by today's accident. validate_tail_uniqueness() therefore
        keeps real force - the /check/ URL keys on the tail - and its own
        docstring's caveat, that it cannot happen today only because
        every dataset maps to exactly one table and nothing enforces
        that, is answered: the supply model enforces it."
      - "Decided this requirement is the single place the supply model's
        vocabulary attaches to a dataset. Everything batch 2 derives - a
        period, a slot, a delivery's file-to-dataset mapping - names a
        dataset, and three of them validating against three different
        notions of what a dataset is would reintroduce exactly the
        disagreement this requirement exists to remove."
      - "APPROVED BY KEITH, 2026-09-22, as its own explicit exception to
        the 2026-09-16 rule that a check_id, once introduced, is
        PERMANENTLY unique and must never be changed or deleted
        (plans/publishing-and-history.md). Recorded here on its own
        terms rather than inherited by implication from the qa_results
        rebuild, because that is what the NFR asked for and because an
        exception nobody can find is the same as a rule nobody kept.
        1,850 committed history files, 129MB, carry today's ids, and
        they are rewritten in the same change. The exception is narrow:
        it licenses THIS one grammar change, not a general freedom to
        renumber check ids later."
      - "Decided the data_asset segment STAYS in a check_id, deliberately,
        even though it is a constant in any single deployment and
        therefore looks redundant (Keith, 2026-09-22). His reasoning, and
        it is the part worth keeping: this repo may end up holding one
        set of shared configuration files for SEVERAL data assets, which
        will probably carry the same table names and some of the same
        checks. The segment is what keeps a check_id globally unique
        across them. Recorded because a future session looking to
        simplify the grammar would see a segment with one value and
        remove it, and the cost of that only appears later, when a
        second asset arrives."
      - "Recorded to correct a misreading rather than to settle anything
        new: this requirement never proposed dropping data_asset from the
        check_id, only from a dashboard URL - and the URL does not carry
        it in any case. A URL keys a check on its TAIL, check_name_tool,
        under /agency/<id>/collection/<id>/dataset/<id>/column/<name>/
        check/<tail>. That criterion is a guard against the segment being
        added to a URL later, not a removal. Keith confirmed the URL
        shape is what he wants: agency, collection, dataset, column and
        check all present and explicit, so a link never needs a lookup to
        resolve."
      - "Decided the table segment goes, and noted WHY the current one is
        worse than merely redundant: it names the dbt STAGING MODEL, not
        the table. stg_cp_clients is a real dbt model doing select * from
        the raw cp_clients source, following dbt's own naming convention
        - so every check carries dbt's vocabulary, including Soda,
        datacontract-cli and Evidently checks that have no staging model
        and read the real table. One tool's implementation detail in an
        identity meant to be tool-neutral. Keith found this from the name
        alone, 2026-09-22, asking why a table started with stg_."
      - "Decided dataset-to-table is 1:1 BY CONSTRUCTION under the supply
        model, which is what makes dropping the table segment safe rather
        than merely tidy. check_id.py's own docstring records that tails
        cannot collide today only because every dataset happens to map to
        one table and nothing enforces it. Thread F enforces it: a supply
        IS one table version and a slot is one (table, period) pair, so a
        dataset mapping to two tables has no coherent slot and the model
        cannot express it. Note the precision - a dataset is 1:1 with one
        LOGICAL table, which has many physical versions, since a period
        schema holds a supply plus its resupplies with arrival timestamps
        in their physical names (Thread A)."
      - "SUPERSEDED 2026-09-23 - see the reversal recorded on
        REQ-QAC-039. These requirements turned out not to be independent
        of REQ-PIPE-049 the way this assumed, so the two regenerations
        happen separately after all and the tree is rewritten three
        times. Kept rather than edited, because the reasoning below is
        still what a third rewrite has to be weighed against.
        Decided the committed qa_results/ tree is rewritten TWICE, not
        three times (Keith, 2026-09-23). REQ-QAC-039 (check identity)
        and REQ-GEN-042 (dateless run_id, which renames every directory)
        land as ONE combined regeneration; unsigned REQ-PIPE-038
        (re-keying per dataset) waits for its own read-back and
        sign-off, and rewrites the tree a second time when batch 3
        reaches it. Found by delivery-architect: all three declared
        dependencies: [] as though independent, and each is individually
        coherent."
      - "Rejected doing all three at once, which needs no second rewrite
        and leaves no half-migrated state at all - but requires signing
        REQ-PIPE-038 now, unread, to save a commit. Rejected three
        separate rewrites, the shape as written, which leaves two
        windows where committed history has path segments in one shape
        and run ids in another. The cost accepted is one extra
        full-tree commit later; what it buys is that the sign-off gate
        stays honest."
      - "Consequence for whoever builds these: they are one change even
        though they are two requirements. REQ-QAC-039's own criterion
        already says every check identity changes exactly once, in the
        same change as the history rebuild - that now means REQ-GEN-042's
        run_id change too. Re-run pytest --durations=30 afterwards:
        CLAUDE.md records a real ~13x suite regression from git-history
        walking that scaled with commit count AND diff size, and a
        full-tree rewrite commit is exactly that growth."
  - id: REQ-GEN-040
    title: The generator can deliver one table at a time, and can deliver early
    date_written: "2026-09-21"
    story: >
      As whoever is testing this, I want the synthetic generator able to
      resupply two of six tables and leave the other four alone, and able
      to land a supply before it was due, so that the partial resupply
      and the early arrival this whole model exists for can actually be
      exercised rather than only described.
    moscow: must
    status: built
    source: >
      Keith, plans/publishing-and-history.md item 6, 2026-09-20 - "yes,
      that should be part of this work", on generate_cp_runs.py emitting
      a whole delivery's worth of tables at once. AMENDED 2026-09-22 in
      the batch 1+2 scoper pass: reworded into the settled vocabulary
      (supply = one table version, delivery = one physical arrival), and
      widened to cover early arrival, which plans/running-thoughts.md
      #27 measured the generator as never producing.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL generate a supply for one dataset without
        generating one for any other dataset in the same collection.
      - THE SYSTEM SHALL generate at least one delivery in which some of
        a collection's tables are resupplied and the rest are not.
      - WHERE a whole-collection delivery is what is being simulated,
        THE SYSTEM SHALL still be able to generate one, as one delivery
        rather than as several.
      - THE SYSTEM SHALL be able to generate a supply whose receipt
        instant falls before its slot's due instant.
      - THE SYSTEM SHALL be able to generate a supply whose receipt
        instant falls after its slot's due instant by an arbitrary
        interval, including intervals spanning later slots.
      - THE SYSTEM SHALL NOT decide, record or emit which slot a
        generated supply fills - it SHALL only decide when that supply
        was received.
      - THE SYSTEM SHALL keep generation seeded and reproducible - the
        same seed produces the same supplies, with the same receipt
        instants, in the same order.
      - THE SYSTEM SHALL keep Birth Registrations' own daily generation
        behaviourally unchanged except where this requirement, or the
        vocabulary change in REQ-GEN-042, changes it deliberately.
    non_functional_requirements:
      - Determinism is the correctness check for this whole repo. A
        change to arrival scheduling must keep a regenerate-and-diff
        meaningful rather than turning every run into noise.
      - The per-table dirty-injection presets must keep working when
        only some tables are generated - the CP presets run over all six
        on an amber or red run today, and a sibling call site has
        already drifted out of step with that signature once.
      - Generation runtime should not blow out - CP builds a
        70,000-person population once per run today.
      - Invoked through mothman only.
    dependencies: [REQ-GEN-042, REQ-GEN-043]
    decisions:
      - "Decided the generator produces ARRIVAL SHAPES, never filing
        decisions. It says what landed and when; which slot that fills is
        derived later from arrival plus slot state (Thread E). A
        generator that emitted the intended slot would make every
        assignment test tautological - it would be testing that the
        pipeline can read what the generator already decided."
      - "Decided early arrival needs no new generator field. Every
        manifest entry already carries both the period a supply belongs
        to and when it actually landed, and they are already allowed to
        differ - that is how a late resupply is represented today. An
        early arrival is the same two values with the inequality the
        other way round (plans/running-thoughts.md #27). Measured
        2026-09-21 against the real generated history: 0 early, 240 on
        time, 112 late, and every one of the 112 is a resupply."
      - "Resolved the open question this requirement used to carry -
        whether the resupply chain model becomes per-table. It does not
        become anything: is_resupply, supersedes_run_id and
        attempt_number are REMOVED rather than renamed or reshaped
        (Keith, 2026-09-22), so there is no chain in the generator left
        to make per-table. A resupply is observed - an arrival landing in
        an already-filled slot - with nothing to infer. See REQ-GEN-042."
      - "[B4] Decided the generator's ability to place a supply
        arbitrarily late or early is what makes schedule-version hosting
        work. A scenario sitting in the version that makes it correct
        still needs its supply landing at the right instant relative to
        that version's due time."
      - "[BUILD] Decided the CAPABILITY ships now and the generated
        history follows later (Keith, 2026-09-23, asked directly). A
        partial Child Protection delivery cannot be loaded by today''s
        warehouse builder - verified, not assumed: it reads all six
        tables out of the delivery directory and raises FileNotFoundError
        on the first one missing. Emitting one into the committed
        history would take CP''s whole pipeline down, not just turn a
        check red, until the staging overlay exists (REQ-PIPE-035/036).
        So partial_resupply is off in the real run, on in the tests, and
        REQ-GEN-044 already carries the obligation to put these shapes
        into the history once something can consume them."
      - "[BUILD] Rejected a stopgap carry-forward in build_cp_warehouses
        that would have kept everything green - REQ-PIPE-035 already
        specifies how the overlay works, and inventing a second answer
        ahead of it would either be thrown away or quietly disagree
        with it."
      - "[BUILD] Decided a resupply sends back a SUBSET of what failed,
        not the whole failed set (Keith, 2026-09-23). The simpler rule -
        resend exactly what broke - can never produce a single-dataset
        supply, because _pick_dirty_tables never picks fewer than two of
        six by construction. Criterion 1 asks for exactly that shape, so
        the subset rule is what meets it, and it models the real
        behaviour of a supplier fixing what they can and sending the
        rest later."
      - "[BUILD] Decided WHAT IS RESENT is chosen BEFORE what is wrong
        with it. The obvious ordering - dirty the payload, then trim it -
        lets a provider that dirties a subset of what it is handed mark
        only tables the trim then drops, producing an arrival the chain
        calls red whose files are clean. Found while writing the test
        for it, and the test was confirmed to catch the wrong ordering
        before the right one was kept."
      - "[BUILD] Decided what-failed is RECOMPUTED from the seed that
        dirtied the previous arrival, never remembered on the provider.
        A provider instance is shared across every slot in a run, so
        per-chain state on it works only while slots happen to be walked
        one at a time to completion - correct today, and the kind of
        thing that holds until it silently does not."
      - "[BUILD] Decided Birth Registrations IMPLEMENTS the subset hook
        and returns its payload unchanged, rather than leaving the
        method off. One CSV is indivisible, and a dataset that says so
        is different from one nobody asked."
      - "[BUILD] Decided early and arbitrarily-late arrivals get the
        same treatment as partial ones - capability and tests now, the
        generated history later. An arrival landing a day before its
        slot was due would be classified against its own receipt date''s
        cycle today, so putting one in the history before periods are
        derived properly (REQ-PIPE-051/052) would file it wrongly rather
        than demonstrate anything."
    linked_tests:
      - tests/test_resupply.py
      - tests/test_generate_cp_runs.py
      - tests/test_generate_runs.py
      - tests/test_arrivals.py
    implemented_by:
      - generator/resupply.py::run_slot_chain
      - generator/resupply.py::DatasetProvider
      - generator/generate_cp_runs.py::ChildProtectionProvider
      - generator/generate_cp_runs.py::_pick_dirty_tables
      - generator/generate_runs.py::BirthRegistrationsProvider
    evidence:
      - >
        2026-09-23: the generator emits all three delivery shapes, shown
        end to end through the real delivery format and the real
        recogniser rather than at the provider in isolation - six
        whole-collection supplies, and resupplies carrying three, two
        and exactly one dataset. Every one still places as Child
        Protection from its filenames alone, and none is unplaceable: a
        partial delivery is a recognised supply, not a drop needing a
        human.
      - >
        2026-09-23: NONE of that is in the committed history, stated
        plainly because it would be easy to read the above as more than
        it is. Partial deliveries are off in the real generator run
        until REQ-PIPE-035/036 can load one - Keith's own sequencing
        call - so today's generated history is still whole-collection
        throughout. The same holds for early and arbitrarily-late
        arrivals.
      - >
        2026-09-23: the real generated history is BYTE-IDENTICAL across
        this change - 210 files across the delivery and receipt trees,
        plus the bookkeeping file, fingerprinted before and after and
        again after a full regeneration. That is criterion 8 measured
        rather than argued: Birth Registrations' daily generation, and
        Child Protection's whole-collection one, do exactly what they
        did.
      - >
        2026-09-23: a supply can arrive BEFORE it was due, which this
        generator could not previously produce at all - the measurement
        that motivated the requirement was 0 early against 240 on time
        and 112 late. The lever is a plain calendar-day offset on the
        first arrival, negative for early; arbitrarily late is the same
        lever plus the delay curve, tested at 200 days so the resupply
        lands after two later quarterly slots have already been filled.
      - >
        2026-09-23: what is RESENT is decided before what is wrong with
        it, and the test for that was confirmed to fail against the
        other ordering before the right one was kept. Dirty-then-trim
        produces an arrival labelled red whose files are clean, which
        no QA run would contradict and no reader would question.
      - >
        2026-09-23: the generator still decides only WHEN a supply
        arrived, never which slot it fills - asserted against the real
        Delivery dataclass's own fields rather than left to reading,
        because the tempting shortcut for every downstream filing test
        is to have the generator just say.
      - >
        2026-09-23: 1068 Python tests, 166 JS tests, all eight mothman
        gates.

  - id: REQ-DASH-041
    title: Supply history and as-of viewing hold up under per-dataset arrivals
    date_written: "2026-09-21"
    story: >
      As a data owner using the as-of picker, I want the supply history
      to still read correctly when each table arrives on its own
      schedule, so that the feature that survived a chain-building test
      in the lab also survives on the page.
    moscow: must
    status: not_started
    source: >
      The stated limit of item 6's own verification, 2026-09-20 -
      buildSupplyHistory was driven in a real browser against a doctored
      dataset and held up, but whether the as-of picker and the rendered
      supply-history UI also hold up is untested.
    acceptance_criteria:
      - WHEN a collection's datasets have different arrival histories,
        THE SYSTEM SHALL render each dataset's supply history from that
        dataset's own arrivals alone.
      - THE SYSTEM SHALL offer as-of viewing across datasets whose
        arrival dates do not line up.
      - WHEN a viewer picks an as-of date, THE SYSTEM SHALL show each
        dataset as at its own most recent arrival on or before that
        date.
      - IF a dataset has no arrival on or before the chosen as-of date,
        THEN THE SYSTEM SHALL say so plainly rather than render an empty
        or stale panel.
      - THE SYSTEM SHALL render all of this with zero console errors in
        a real browser.
    non_functional_requirements:
      - Verify at the render layer in a real browser, not at the data
        layer. A correct builder says nothing about a template with its
        own transform - the lesson REQ-DASH-032 and item 74 both landed
        on, and the reason this requirement exists separately at all.
      - Covered by both toolchains - tests-js for the template's inline
        logic, tests/test_dashboard_e2e.py for the built page.
      - The dashboard build path must stay a pure function of committed
        qa_results history, with no live data access.
      - A collection whose tables arrive on six different schedules
        should not look like a bug.
    dependencies: [REQ-PIPE-034, REQ-PIPE-038]
    decisions:
      - The chain-building half was verified before this was written -
        buildSupplyHistory reads only the dataset object it is handed,
        and cp-placements cut to 9 of its 18 runs produced 7 well-formed
        chains carrying all 9 entries, zero console errors. This
        requirement covers what that check did not reach.

  - id: REQ-DOCS-028
    title: A "What's New" feed written for the people who use the tool
    date_written: "2026-09-20"
    story: >
      As a director, manager or someone in client services, I want to
      read what changed in plain language, so that I can stay across the
      tool without having to understand how it is built.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-20, modelled on his own keithamoss/mapa repo's
      in-app "What's New" page (frontend/src/features/whatsNew).
    acceptance_criteria:
      - THE SYSTEM SHALL hold its own development history as structured
        data rather than prose, grouped by day, newest first, with no
        version or release names.
      - THE SYSTEM SHALL state, for each day, a single summary sentence
        that a reader can stop at.
      - WHERE a change is listed, THE SYSTEM SHALL give it a headline and
        a description of one or two sentences, and SHALL tag it with one
        or more of the project's own seven components.
      - WHEN the publishing CI gate runs, IF any component tag is not one
        of those seven, THEN THE SYSTEM SHALL exit non-zero and name it.
      - WHEN the publishing CI gate runs, IF a day has no summary, an item
        has no headline or description, a category is outside the closed
        vocabulary, or a date appears twice, THEN THE SYSTEM SHALL exit
        non-zero and name the offending entry.
      - THE SYSTEM SHALL render the feed without a per-component emoji,
        while continuing to render the component tags themselves.
    non_functional_requirements:
      - Nothing here needs a live connection to data/ or any warehouse -
        the feed is a committed file read at build time, like every other
        embedded const.
      - The voice standard (second person, outcome-only, no file paths,
        tool names or measurements) is stated in CHANGELOG.yaml's own
        header and is deliberately NOT machine-checked. A proxy for it
        would be gamed within a week and wrong more often than right.
      - The component vocabulary is taken from validate_requirements.py's
        own codes rather than restated, so adding a component to the
        taxonomy cannot leave this gate behind.
    decisions:
      - >
        YAML rather than Mapa's JSON. This repo already hand-authors
        prose in YAML with block scalars, which handle multi-sentence
        text far better than JSON's escaped strings; the check-yaml
        pre-commit hook already validates every staged .yaml; and
        comments are possible at all. Mapa used JSON because its reader
        is TypeScript - ours is Python, which reads YAML natively.
      - >
        Categories are New/Improved/Fixed - plain words rather than Keep
        a Changelog's Added/Changed/Fixed, which read as a spec for a
        maintainer. Closed and validated, because an open vocabulary
        drifts into six near-synonyms within a month.
      - >
        The existing ~100 Markdown entries were scrapped outright rather
        than migrated (Keith: "that's fine"). Only safe because the
        engineering detail in them now lives in evidence: and decisions:
        on the requirements, both CI-enforced - a week earlier the same
        deletion would have destroyed the only record.
      - >
        Emojis were dropped from this feed only, not from the Plans tab's
        filter chips. On a filter chip an icon helps you re-find one you
        have used before in a row of seven; in a release note it
        decorated a tag that already said the same thing in words. It
        also keeps COMPONENT_ICON alive, so the taxonomy CI check keeps
        all three representations it cross-references.
      - >
        Per-item timestamps went. Day-grouping is the point, and a
        to-the-minute time is detail this audience does not need. The
        field survives as optional in the shape so the renderer needs no
        change if one item ever wants one.
      - >
        Release names were considered and declined. Mapa names its
        releases ("Cradle of Fur"); Keith's call was to keep grouping by
        day, so the date is the only key and there is no version field.
      - >
        The authoring standard lives in `CHANGELOG.yaml`'s own header
        comment, not in a standalone doc (Keith, 2026-09-20, asked
        directly whether it should move out alongside
        docs/check-authoring-rules.md). The two cases look identical and
        are not: check definitions live across six files and none of
        them could own the rules, which is why those needed a doc; a
        changelog entry cannot be written without opening the one file
        those rules already sit at the top of, which is better placement
        than a doc rather than worse. What did get fixed is the real
        second copy - CLAUDE.md had been restating the voice rules and
        the mechanics in 45 lines while saying in the same breath that
        the header "states the standard in full", and is now cut back to
        whether and when an entry is owed, which is genuinely its own
        job. The one thing CLAUDE.md held that the header did not - add
        to a day's existing block rather than opening a second one -
        moved into the header rather than being dropped.
      - >
        One feed, with per-tier mapping explicitly deferred rather than
        declined - six real user tiers exist (plans/running-thoughts.md
        #2) and an executive plainly wants different entries from a data
        engineer, but splitting the feed before anyone has read a single
        entry would be designing for a problem nobody has reported.
    linked_tests:
      - tests/test_changelog_yaml.py
      - tests/test_dashboard_e2e.py::TestReleaseNotesPanel::test_it_reads_as_a_whats_new_page_not_an_engineering_log
    implemented_by:
      - CHANGELOG.yaml
      - dashboard/changelog_yaml.py::parse_changelog
      - qa_tools/common/validate_changelog.py::validate
      - dashboard/embed_dashboard_data.py::embed
      - dashboard/qa-reporting-dashboard.template.html::renderChangelogPanel
      - cli/dashboard.py::validate_changelog_command
      - .github/workflows/deploy-pages.yml
    evidence:
      - >
        2026-09-20: the rewrite replaced 1 file of ~100 hand-written
        Markdown entries with 1 structured feed of 5 items across 1 day,
        and deleted 2 modules (the Markdown parser and its tests). The
        validator reports 1 day, 5 items, zero errors.
      - >
        2026-09-20: the rendered panel measured in a real browser -
        zero console errors, zero emoji characters, and the Plans tab
        re-checked in the same run to confirm its own 10 chip icons
        survived, since the emoji removal was deliberately scoped to one
        surface of two.

  - id: REQ-TEST-030
    title: One command that runs every gate this repo has
    date_written: "2026-09-20"
    story: >
      As someone about to push a change, I want a single command that
      runs every check this repo has, so that a suite I did not think to
      run is not mistaken for a suite that passed.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-20, after a session found that the JavaScript suite
      does not exercise what CI exercises and kept being skipped -
      "happy to add in npm test as a default thing that we run", and,
      on the obvious alternative, "I don't want to maintain file lists
      and so forth. That's messy."
    acceptance_criteria:
      - THE SYSTEM SHALL provide a single command that runs the Python
        linter, the YAML linter, both register gates, the JavaScript
        suite and the Python suite.
      - WHEN a gate fails, THE SYSTEM SHALL continue running the
        remaining gates and then name every gate that failed.
      - WHEN a required toolchain is not installed, THE SYSTEM SHALL
        report that gate as not run, and SHALL NOT report the overall
        result as a pass.
      - WHERE the Python suite has already been run selectively, THE
        SYSTEM SHALL offer a way to skip it WHILE still running every
        other gate.
      - THE SYSTEM SHALL show each gate's own output as it runs, not
        only a summary afterwards.
    non_functional_requirements:
      - Runs the same gates CI runs, so a green result here is real
        evidence about CI rather than a different set of checks that
        shares some names.
      - Adding a gate is one edit in one place.
      - Skipping the Python suite leaves a pass that still completes in
        seconds, so the cheap path stays worth taking.
    decisions:
      - >
        Rejected the obvious mechanism - a rule mapping changed files to
        the suites they affect - on Keith's explicit instruction. Such a
        list is wrong the moment someone adds a file and nothing tells
        you it has gone stale, which is the same rot this project
        already watched happen to the `touches:` lines in plans/*.md.
        A command that always runs everything has nothing to keep up to
        date.
      - >
        Every gate runs even after one fails, rather than stopping at
        the first. Fixing four things you were told about at once is one
        pass; finding them one command at a time is four, and the last
        three are invisible while the first is unfixed.
      - >
        A missing toolchain reports as "not run" and suppresses the
        all-passed line entirely. Found by its own test, which caught
        the first version printing "incomplete" and "Every gate passed"
        one after the other - a summary that overstates its coverage is
        the exact failure this command exists to prevent.
      - >
        Gate output streams rather than being captured for the summary.
        A table saying the Python suite failed, with the failure itself
        discarded, would be worse than no command at all.
      - >
        Ordered cheapest-first with the Python suite last, so the fast
        gates report while the slow one is still ahead of you.
      - >
        Not a substitute for checking the real CI run. CI's environment
        can diverge from local on things no local command can see, which
        this project has already been bitten by - the command's own
        docstring says so rather than letting a green table imply
        otherwise.
    dependencies: [REQ-TEST-011]
    linked_tests:
      - tests/test_cli_check.py
    implemented_by:
      - cli/check.py::check_command
      - cli/check.py::_GATES
      - cli/app.py::cli
    evidence:
      - >
        2026-09-20: a real run reports six gates - linter, YAML linter,
        both register gates, 140 JavaScript tests and the Python suite -
        from one command.
      - >
        2026-09-20: a deliberately failing gate was confirmed not to
        stop the ones after it, and a missing toolchain was confirmed to
        suppress the all-passed line rather than being counted as a
        pass.

  - id: REQ-DOCS-029
    title: Declared schemas and a standard linter for this repo's own YAML
    date_written: "2026-09-20"
    story: >
      As someone maintaining this project's hand-authored YAML, I want
      its shape declared as a spec and its parse-level hazards caught by
      a standard tool, so that a typo or a duplicated key fails loudly
      instead of being silently accepted.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-20 - "can't we use a YAML schema validation library
      and give it a spec for this kind of stuff rather than writing these
      hacky scripts?", after a hand-rolled duplicate-key checker.
    acceptance_criteria:
      - THE SYSTEM SHALL declare the shape of requirements.yaml and
        CHANGELOG.yaml as a schema rather than as hand-written field
        checks.
      - WHEN a hand-authored YAML file contains a duplicate mapping key,
        THE SYSTEM SHALL fail and name the key and its line.
      - WHEN a record carries a field name the schema does not define,
        THE SYSTEM SHALL reject it rather than ignore it.
      - WHERE a value is rejected, THE SYSTEM SHALL name the offending
        value, not only what was expected.
      - THE SYSTEM SHALL continue to verify every linked_tests and
        implemented_by entry against a real parse of the code it names,
        and every dependency against a real id in the same file.
      - THE SYSTEM SHALL run the duplicate-key check in CI as well as at
        commit time.
      - THE SYSTEM SHALL validate both files against the same declared
        schema whether they are being gated or being rendered.
      - WHEN an optional field is written with a blank or whitespace-only
        value, THE SYSTEM SHALL reject it, WHILE continuing to accept
        the field being absent.
      - THE SYSTEM SHALL require every requirement to record where it
        came from, and SHALL reject a blank or whitespace-only value
        for it.
      - WHEN a file fails the schema, THE SYSTEM SHALL report every
        problem in the file in one run rather than stopping at the
        first.
    non_functional_requirements:
      - No behaviour change to what is accepted, beyond the two
        deliberate ones recorded in decisions - every rule the previous
        validators enforced still fires.
      - The closed vocabularies have one home, so adding a component or
        a category stays a single edit and the existing taxonomy
        consistency check keeps working.
    decisions:
      - >
        Used yamllint for duplicate keys rather than a hand-written
        checker or ruamel.yaml. ruamel detects them too, but soda-core
        pins it below 0.18, so this repo is stuck on a 2023 release
        chosen by a QA tool. yamllint is purpose-built, standalone, and
        makes it a named rule rather than a side effect of a stricter
        parser.
      - >
        Rejected solving the duplicate-key problem with a schema, tested
        rather than assumed. Schema validation runs on the parsed
        object, and a duplicate does not make a key MISSING - it leaves
        it present with truncated content. A jsonschema model requiring
        a non-empty list PASSED on the exact input that had already cost
        five decisions.
      - >
        Every yamllint style rule is disabled. On its default ruleset
        this repo reports 230 findings, 220 of them line-length - these
        files are hand-authored prose that wraps to suit the sentence,
        and leaving those on would bury the one rule that matters.
      - >
        The schemas are used by the dashboard's own parsers as well as
        by the validators - one declaration of each file's shape, not
        two. The first cut kept them apart on the grounds that a parser
        should render whatever is really there and never raise, so a
        half-written file still shows. Keith overruled it ("I don't mind
        if the parsers would choke and throw an error") and the
        reasoning holds: a requirement missing its story rendered as a
        requirement whose story is the empty string, which a reader
        cannot tell apart from one that genuinely has nothing to say.
        The parsers' own _DEFAULTS dicts were a second, hand-maintained
        statement of the same shape, free to drift from the real one.
      - >
        The requirements gate now reads the raw YAML itself instead of
        going through the parser, which it had always done. Necessary
        once the parser raises: a gate that stops at the first problem
        makes an author fix a batch one run at a time. It is also a
        better gate - the parser used to fill in every missing field
        before the gate saw it, so an absent required field arrived as
        an empty one and was reported as the wrong kind of error.
      - >
        Kept the cross-reference checks in Python, as Keith expected. A
        schema can say linked_tests is a list of strings; only an AST
        parse can say that tests/x.py::TestY::test_z names a method that
        exists, which is the difference between a decorative reference
        and an enforced one.
      - >
        Added an error formatter rather than accepting pydantic's
        wording. Pydantic states what a field should be but not what was
        written; the hand-written validators always named the offending
        value, and losing that would have made the errors worse in
        exchange for tidier code.
      - >
        A field written with nothing in it is rejected, for every
        optional field rather than just `source`. An earlier cut of this
        work accepted it, reasoning that the stripped value is identical
        to an absent one so the intent must be identical too. Keith
        disagreed and was right: a blank key is someone who started
        filling it in and stopped, and that is worth being able to tell
        apart. Accepting it is the same silent shape as the duplicate
        mapping key that prompted this work - text that looks written
        down and is not. Implemented as a before-validator, since with
        whitespace stripping an after-validator cannot tell a blank
        value from an empty one.
      - >
        `source` is required, not optional. It is the only field nobody
        can rebuild later - what a requirement does is in the code, what
        verifies it is in the tests, why it was decided that way is in
        `decisions`, but where it came from exists only if someone wrote
        it down. It had been optional because backfilling the 22
        pre-2026-09-19 entries was judged to mean guessing; that was
        answered by going and looking instead of guessing.
      - >
        21 of those 22 trace to a real plans/*.md item, Thread, Phase or
        quoted ask. The 22nd, REQ-DASH-012, records that its origin was
        never written down - kept as an honest statement rather than a
        plausible-sounding reconstruction, because the reader who most
        needs that field is the one deciding whether to go looking.
      - >
        Three entries (REQ-GHUB-015, REQ-GHUB-016, REQ-GEN-019) were
        found still marked not_started while the code they describe
        exists - the same staleness four others had already been caught
        with. Left alone here deliberately: correcting a status pulls in
        linked_tests, implemented_by, evidence and decisions for each,
        which is real work and not what this change is.
    dependencies: [REQ-DOCS-014]
    linked_tests:
      - tests/test_schemas.py
      - tests/test_validate_requirements.py
      - tests/test_changelog_yaml.py
      - tests/test_requirements_yaml.py
      - tests/test_component_taxonomy_consistency.py
    implemented_by:
      - qa_tools/common/schemas.py::Requirement
      - qa_tools/common/schemas.py::Changelog
      - qa_tools/common/schemas.py::format_error
      - qa_tools/common/vocab.py::COMPONENT_CODES
      - qa_tools/common/validate_requirements.py::validate
      - qa_tools/common/validate_requirements.py::main
      - qa_tools/common/validate_changelog.py::validate
      - dashboard/requirements_yaml.py::parse_requirements
      - dashboard/changelog_yaml.py::parse_changelog
      - .yamllint
      - .pre-commit-config.yaml
      - .github/workflows/test.yml
    evidence:
      - >
        2026-09-20: the two validators fell from 487 lines to 366 while
        gaining a guarantee they never had - an unknown field is now
        rejected rather than silently ignored. All 28 requirements and
        the whole changelog validate unchanged.
      - >
        2026-09-20: 11 requirement rules and 9 changelog rules were each
        re-confirmed to fire after the rewrite, by feeding a
        deliberately broken record to the real validator rather than
        trusting that the schema covered them.
      - >
        2026-09-20: yamllint reports zero findings across this repo's
        own YAML with key-duplicates enabled, and catches a planted
        duplicate at the exact line.
      - >
        2026-09-20: all 30 requirements carry a non-blank source, and
        the gate was confirmed to report both an absent one and a
        whitespace-only one against the requirement that carries it.

  - id: REQ-GEN-042
    title: The generator speaks the supply model's vocabulary
    date_written: "2026-09-22"
    story: >
      As whoever builds arrival recognition next, I want the generator to
      use "delivery" and "slot" to mean what the model says they mean, so
      that reading the generator to learn how a delivery works teaches me
      the right concept rather than the opposite one.
    moscow: must
    status: built
    source: >
      plans/supply-model.md concept inventory, "The collision: delivery
      already means something else", found 2026-09-22 by reading the real
      code rather than by design work, and settled with Keith the same
      day. Delivery sprint 2. Scoped by delivery-scoper, batch 1+2 pass,
      2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL name the logical obligation a supply fills a
        SLOT, and SHALL NOT use the word delivery for it.
      - THE SYSTEM SHALL use the word DELIVERY only for one physical
        arrival of one or more files.
      - THE SYSTEM SHALL carry the period a supply is intended for, and
        that supply's own receipt instant, in place of the single
        delivery date it carries today.
      - THE SYSTEM SHALL remove is_resupply, supersedes_run_id and
        attempt_number from everything it emits, and SHALL NOT
        reintroduce them under slot-prefixed names.
      - THE SYSTEM SHALL issue a run identifier that carries no date.
      - THE SYSTEM SHALL issue run identifiers deterministically from
        configuration and seed, so that regenerating overwrites the
        existing history in place.
      - THE SYSTEM SHALL derive the generated schedule from a fixed,
        committed anchor date rather than from the day it is run.
      - WHEN the generator is re-run on a different calendar day with
        unchanged configuration, THE SYSTEM SHALL produce an identical
        history, and SHALL NOT add a second copy of it alongside the
        first.
      - THE SYSTEM SHALL use the same vocabulary in every generator
        module, and SHALL NOT leave one module using the old sense of a
        word another module has changed.
      - THE SYSTEM SHALL read its schedule from the same configuration the
        pipeline reads, and SHALL NOT carry its own copy of the cadence,
        due times or calendar.
    non_functional_requirements:
      - Rewriting today's committed qa_results/ history is explicitly a
        non-issue - Keith, 2026-09-22, "I don't care. This is all just
        fake data. We can nuke it from orbit". He does that BEFORE the
        build rather than as part of it, so no migration over the ~352
        committed run directories is in scope, and none should be
        designed. In a real deployment this would be impossible, which
        is the whole reason the no-regenerating rule exists.
      - "Every reader of the removed fields must be enumerated
        mechanically, not by memory. Real consumers found 2026-09-22 -
        qa_tools/cp/build_cp_warehouses.py,
        qa_tools/cp/run_evidently_cp.py, qa_tools/cp/dataset_stats.py
        (which embeds the whole manifest entry into committed results),
        qa_tools/common/acceptance_sync.py, tests-js/supply-
        history.test.js, and the dashboard template's own supply-history
        logic. CLAUDE.md's standing shape-change lesson: assert at the
        last transform before the user, not the first one after the
        source."
      - A vocabulary change is exactly the kind that half-lands. Nothing
        in the repo should be able to use the retired sense of
        "delivery" after this - a grep for the old field names should
        come back empty, and that is a cheap thing to verify.
      - Invoked through mothman only.
    linked_tests:
      - tests/test_resupply.py
      - tests/test_generate_runs.py
      - tests/test_generate_cp_runs.py
      - tests/test_anchor_date.py
      - tests/test_schedule.py
    implemented_by:
      - generator/resupply.py::Delivery
      - generator/resupply.py::run_slot_chain
      - generator/anchor_date.py::get_anchor_date
      - generator/generate_runs.py::_manifest_entries_for_slot
      - generator/generate_runs.py::_received_at
      - generator/generate_cp_runs.py::_cp_manifest_entries_for_slot
      - generator/generate_cp_runs.py::_cp_received_at
      - qa_tools/common/asset_time.py::local_date
      - pipeline/build_dashboard_data.py::_run_date
      - pipeline/build_cp_dashboard_data.py::_run_date
    evidence:
      - >
        2026-09-23: the vocabulary is reversed where it was wrong. A
        SLOT is the logical obligation and run_slot_chain walks it; a
        DELIVERY is one physical arrival and is what that chain yields.
        The word survives unchanged in
        qa_tools/cp/completion_tracker.py and qa_tools/common/
        s3_source.py, checked rather than swept - there it already
        meant one arrival, which is the sense the model keeps.
      - >
        2026-09-23: is_resupply, supersedes_run_id and attempt_number
        are GONE from everything the generator emits, not renamed, and
        two tests assert that against real generated output rather than
        leaving it to a grep somebody remembers to run - including that
        they have not returned under slot_-prefixed names. The chain
        keeps an internal arrival counter, which is the bookkeeping it
        needs to stop at MAX_ATTEMPTS, not an authority on the record.
      - >
        2026-09-23: the dashboard needed NO change to survive that
        removal. It was already deriving resupply-ness from position in
        the chain rather than from the flags - the comments naming them
        were the only trace, and they are now updated. Confirmation
        that the retirement was safe came from the JS and e2e suites
        passing untouched.
      - >
        2026-09-23: every run_id is dateless and derived from the
        manifest position - run_001 rather than
        run_006_2026-09-14_resupply1. Regenerating twice in a row
        produced BYTE-IDENTICAL output (md5 over every generated file),
        and no second copy. Before pinning the anchor, a regeneration
        left 84 BDM run directories where there should have been 42 -
        the doubling, reproduced live.
      - >
        2026-09-23: the generator contains no call to date.today() or
        datetime.now() at all any more, so the generated schedule
        cannot depend on the day it is run. Verified by grep over
        generator/, and by a test that freezes date.today() to
        2099-12-31 and asserts the anchor does not move.
      - >
        2026-09-23: both generators read their schedule from
        contract/data-asset.yaml's calendars (REQ-PIPE-049), not from a
        private copy of the cadence. BDM takes the last 30 daily
        periods up to the anchor, CP the last 15 quarterly ones, so the
        generator places a supply against exactly the schedule the
        pipeline judges it by.
      - >
        2026-09-23: the rebuild changed identity and vocabulary and
        NOTHING ELSE, measured rather than asserted - the arrival
        verdict distribution came back identical across it, 131 onTime
        / 16 early / 3 late over the same 150 arrivals and 7 datasets.
        That is REQ-PIPE-048's own pin doing the job it was written
        for, one requirement later.
      - >
        2026-09-23: 980 Python tests, 162 JS tests, all eight mothman
        gates.
    dependencies: [REQ-PIPE-048, REQ-PIPE-049]
    decisions:
      - >
        CORRECTED 2026-09-23, with Keith: this requirement declared
        dependencies: [] and that was simply wrong. It depends on
        REQ-PIPE-048 and REQ-PIPE-049, and the register saying
        otherwise is what let the "one combined regeneration" plan be
        made and then reversed a day later. Recorded as a correction
        rather than edited silently, because a dependency nothing
        validates is exactly the failure being fixed.

        WHY, concretely, from the real stored record rather than from
        reading the criteria: all three requirements rewrite the SAME
        object - the manifest entry inside every run's
        dataset_stats.json. This one removes delivery_id,
        delivery_date, attempt_number, is_resupply and
        supersedes_run_id and changes run_id, which is also the
        directory name. Its "carry the period a supply is intended for,
        and that supply's own receipt instant" replaces delivery_date
        and arrived_date - and arrived_date/run_date are the same
        fields REQ-PIPE-048's "every stored timestamp carries its own
        UTC offset" changes. REQ-PIPE-049 is what makes a period mean
        anything at all; without it the generator would have to invent
        period names, which this requirement's own last criterion
        forbids.

        The practical consequence, and the reason it is worth stating:
        every way of splitting these costs an extra full-tree rewrite
        of committed qa_results/ history. Building 048, then 049, then
        this one - code and config first, ONE regeneration at the end -
        costs a single rewrite. Splitting this requirement's
        independent criteria from its blocked ones costs two.
      - Decided the GENERATOR adopts the model's vocabulary, not the
        reverse (Keith, 2026-09-22 - "the generator should be using the
        new names around slot and delivery and so forth. We shouldn't be
        changing the concepts we've agreed on"). The design does not
        bend to the code. Rejected the alternative of giving the new
        concept a different word to avoid touching the generator, which
        would have left the repo with two words for one thing and one
        word for two things.
      - Decided is_resupply, supersedes_run_id and attempt_number GO
        rather than being renamed (Keith, same conversation). They were
        already on the retire-as-authority list, so sweeping them into
        the rename as slot_-prefixed fields would have preserved exactly
        the bookkeeping this model stops trusting. A resupply becomes an
        arrival landing in a filled slot - observed, not recorded.
      - "Decided BOTH halves of the regeneration-doubling fix, not one
        (plans/running-thoughts.md #26, which offered three shapes and
        chose none). Dropping the date from run_id makes a re-run
        overwrite rather than accumulate, and is the only shape that
        also works for a partial regeneration; pinning the anchor date
        stops every arrival instant in the history shifting when the
        calendar day changes. Either alone leaves a real failure: a
        dateless id with a floating anchor overwrites in place but
        silently rewrites every date, and a pinned anchor with a dated
        id still doubles the directory count."
      - Recorded because it was measured, not assumed - the "352
        committed runs" this project has been quoting is really 176.
        There are exactly 176 distinct (delivery_id, attempt_number)
        pairs, each appearing under two delivery dates one day apart,
        because somebody regenerated on two consecutive days.
      - "[B4] Decided the generator reads the real schedule config rather
        than its own. With scenarios hosted by effective-dated versions,
        a generator carrying a private copy of the cadence would place
        supplies against one schedule while the pipeline judged them
        against another - and the disagreement would look like a model
        failure rather than a config duplication."
      - "Decided the generator adopts the MODEL'S vocabulary rather than
        the design bending to the generator's existing names (Keith,
        2026-09-22, in his own words: we should not be changing the
        concepts we have agreed on). delivery_id becomes slot_id and
        delivery_date becomes the period or due date; delivery keeps its
        new sense of one physical arrival. Recorded as a principle and
        not only as a list of renames, because the same collision will
        recur every time a settled concept meets an older field name.
        Added by the batch 1+2 carry-over check, which found the removals
        well covered and this positive half absent."
      - "Decided the pinned anchor date stands, and demo data visibly
        ageing is accepted rather than worked around (Keith, 2026-09-22,
        signing this off: \"I'm happy for demo data to visibly age.
        That's just how it works.\"). This closes the open question this
        requirement carried. The cost is real and now chosen: the
        generated history drifts further from today until somebody bumps
        the anchor and regenerates, which makes regeneration a deliberate
        act rather than a side effect of running the generator on a
        different day. That determinism is the point - it is what stops a
        re-run doubling the committed history."
      - "SUPERSEDED 2026-09-23 - see the reversal recorded on
        REQ-QAC-039. These requirements turned out not to be independent
        of REQ-PIPE-049 the way this assumed, so the two regenerations
        happen separately after all and the tree is rewritten three
        times. Kept rather than edited, because the reasoning below is
        still what a third rewrite has to be weighed against.
        Decided the committed qa_results/ tree is rewritten TWICE, not
        three times (Keith, 2026-09-23). REQ-QAC-039 (check identity)
        and REQ-GEN-042 (dateless run_id, which renames every directory)
        land as ONE combined regeneration; unsigned REQ-PIPE-038
        (re-keying per dataset) waits for its own read-back and
        sign-off, and rewrites the tree a second time when batch 3
        reaches it. Found by delivery-architect: all three declared
        dependencies: [] as though independent, and each is individually
        coherent."
      - "Rejected doing all three at once, which needs no second rewrite
        and leaves no half-migrated state at all - but requires signing
        REQ-PIPE-038 now, unread, to save a commit. Rejected three
        separate rewrites, the shape as written, which leaves two
        windows where committed history has path segments in one shape
        and run ids in another. The cost accepted is one extra
        full-tree commit later; what it buys is that the sign-off gate
        stays honest."
      - "Consequence for whoever builds these: they are one change even
        though they are two requirements. REQ-QAC-039's own criterion
        already says every check identity changes exactly once, in the
        same change as the history rebuild - that now means REQ-GEN-042's
        run_id change too. Re-run pytest --durations=30 afterwards:
        CLAUDE.md records a real ~13x suite regression from git-history
        walking that scaled with commit count AND diff size, and a
        full-tree rewrite commit is exactly that growth."
  - id: REQ-GEN-043
    title: A delivery has a written-down on-disk format, and it declares nothing
    date_written: "2026-09-22"
    story: >
      As whoever builds delivery recognition in sprint 7, I want the shape
      a delivery takes on disk written down as a specification when the
      generator first emits it, so that I am implementing against an
      agreed format rather than reverse-engineering whatever the
      generator happened to do five sprints ago.
    moscow: must
    status: built
    source: >
      Keith, 2026-09-22, settling that sprint 2 DEFINES the on-disk
      delivery format sprint 7 consumes - "it must be a DELIBERATE
      ARTEFACT of this sprint... rather than something sprint 7
      reverse-engineers". plans/supply-model.md delivery sprint 2 and
      Thread B. Scoped by delivery-scoper, batch 1+2 pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL write each delivery as one self-contained unit
        on disk whose boundary is observable without reading any file's
        contents.
      - THE SYSTEM SHALL carry that format as a written specification in
        the repository, committed in the same change that first emits
        it.
      - THE SYSTEM SHALL name each file in a delivery so that the
        dataset it belongs to is derivable from the filename alone,
        using that dataset's own configured pattern.
      - THE SYSTEM SHALL NOT place the period, the slot, or any other
        statement of what a file is intended for inside a delivery, and
        no code that files a supply SHALL read such a statement.
      - THE SYSTEM SHALL ignore any timestamp a supplier could have
        written, and SHALL use only the receipt instant recorded on our
        side of the boundary.
      - THE SYSTEM SHALL keep the generator's own bookkeeping - which
        scenario a delivery came from, which slot it was built to fill -
        in an artefact outside every delivery.
      - THE SYSTEM SHALL NOT read that bookkeeping artefact from any
        pipeline, QA or dashboard-build module, and SHALL NOT embed any
        part of it into committed QA results.
      - THE SYSTEM SHALL be able to emit a delivery containing more than
        one file matching a single dataset's pattern.
      - THE SYSTEM SHALL be able to emit a delivery containing a file
        matching no dataset's pattern at all, including one that is not
        tabular data.
      - THE SYSTEM SHALL be able to emit a delivery containing a file
        that cannot be parsed as the format its name claims.
      - THE SYSTEM SHALL emit files destined for several datasets that
        arrived together as ONE delivery, not as one delivery each.
      - THE SYSTEM SHALL record, for each delivery, the instant WE
        received it, expressed with its UTC offset, in a receipt record
        written by the receiving side and held OUTSIDE the delivery unit.
      - THE SYSTEM SHALL hold that receipt record where a supplier has no
        path to write it.
      - IF a file resembling a receipt record is found INSIDE a delivery,
        THEN THE SYSTEM SHALL ignore it for every purpose and SHALL
        report it as an unexpected artefact.
      - THE SYSTEM SHALL be able to emit deliveries whose names follow no
        common pattern, so that delivery recognition cannot pass by
        parsing a name we wrote ourselves.
    non_functional_requirements:
      - The format must be expressible by a real transport. A delivery
        boundary comes from the transport - one folder drop, one prefix,
        one session - so a synthetic format that could not be produced
        by an S3 prefix or an SFTP session is not a stand-in for
        anything (Thread B, TS-17).
      - The format must not use characters that are illegal or awkward
        in a path on a non-Linux filesystem. This repo gets run on other
        people's machines as part of evaluating the PoC, and an ISO-8601
        instant contains colons.
      - In a real deployment this directory holds real Birth
        Registrations and Child Protection extracts. It stays under
        data/ and stays gitignored, and no part of the format may
        require committing a delivery's contents to git.
      - Removing the pipeline's dependence on the generator's manifest
        is the point, not a side effect. Real readers to retire, found
        by grep 2026-09-22 - qa_tools/cp/build_cp_warehouses.py:79,
        qa_tools/cp/run_evidently_cp.py:92, and
        qa_tools/cp/dataset_stats.py, which embeds the whole manifest
        entry into committed qa_results/ where
        qa_tools/common/acceptance_sync.py:113 then reads it back.
      - Anything that reads a delivery is invoked through mothman.
      - The receipt record is the one place a supplier could forge our own
        clock if the boundary is drawn wrongly. It is ours, it lives
        outside the delivery, and a lookalike inside a delivery is an
        anomaly to report rather than a value to read.
    dependencies: [REQ-GEN-042, REQ-PIPE-048]
    decisions:
      - "Decided the delivery on disk asserts ONLY what physically
        happened - these files landed together, at this instant. That is
        what makes it an OBSERVED TRANSPORT UNIT rather than the
        supplier-declared manifest Thread B rejected. The distinction is
        sharp and must stay sharp: a supplier declaring which period
        their data is for is a judgment we would have to trust and
        cannot enforce across a varied supplier base; a folder drop is a
        physical fact we can see for ourselves."
      - Rejected letting the pipeline keep reading the generator's
        manifest.json. It reads one today, and under this model that
        would be the rejected manifest arriving by the back door -
        filing decisions made from a declaration rather than from
        arrival plus slot state. The generator still needs bookkeeping
        for the scenario map, so the fix is to separate the two
        artefacts rather than to delete one.
      - Decided the receipt instant must be SIMULATED and supplied by
        the transport layer rather than taken from a file's mtime. A
        generated history spans months but is written in seconds, so
        real file metadata would collapse every arrival onto one instant
        and destroy every injected scenario. This is the one place the
        synthetic stand-in genuinely cannot be a file-system fact, and
        it should be labelled as such rather than quietly relied on.
      - "[B1] Decided the receipt instant lives in a TRANSPORT RECORD
        written beside the delivery, not encoded in the delivery's own
        directory name (Keith, 2026-09-22). It is closer to reality - in
        a real deployment the receipt time is object metadata the
        transport records, not anything in the drop - and it deliberately
        leaves the delivery's name free to be an arbitrary supplier-style
        prefix."
      - "[B1] The second half is the real reason, and it is a testing
        argument rather than a modelling one: if we name the drop
        ourselves, delivery recognition passes by parsing a name we
        wrote, which proves nothing. Leaving the name arbitrary makes
        recognition do real work against a boundary it did not choose.
        That is why the generator is required to emit names following no
        common pattern."
      - "[B1] Rejected encoding the instant in the directory name, which
        the scoper had leaned towards on the grounds that it is one fact
        in one place, visible in a listing, and impossible to confuse
        with file content. It loses on both points above, and it needed a
        filename-safe encoding because an ISO-8601 instant contains
        colons. Rejected doing both, which creates two values that can
        disagree."
      - "[B1] Decided a receipt-record lookalike INSIDE a delivery is an
        anomaly, never a value. This does not exist in the threads and
        follows from the choice: the moment the receipt time lives in a
        file rather than in a name only we control, a supplier who writes
        a file of that name would be setting our own clock - which is
        precisely what TS-32 forbids. The boundary is that the record
        lives outside the delivery, in a location the supplier cannot
        write to."
