# Live requirements register for this PoC - real user stories, not a
# design doc. Built 2026-09-18 (plans/qa-pipeline.md item 75), at
# Keith's own request ("having like actual requirements... user
# stories, requirements, and acceptance criteria... track MoSCoW
# status... have we implemented them yet... tie them back to the actual
# tests"), scoped via three rounds of AskUserQuestion before building
# (see that item's own writeup for the fork options not taken and why):
# structured YAML with typed fields (not hand-prose like CHANGELOG.md),
# high-level user-story granularity (not a 1:1 mirror of every numbered
# item in plans/qa-pipeline.md/wider.md), and REAL enforced linkage to
# tests (qa_tools/common/validate_requirements.py fails CI if a
# `linked_tests` entry doesn't resolve to a real file/test, or if a
# `built` requirement has none at all).
#
# Schema per entry (validate_requirements.py enforces every rule below,
# it isn't just documentation):
#   id:                 "REQ-<CODE>-NNN" (2026-09-19, Keith's own ask),
#                        where <CODE> is a real 3-4 letter code for the
#                        same 7-part component taxonomy plans/*.md items
#                        and CHANGELOG.md entries already tag things with
#                        (see qa_tools/common/validate_requirements.py's
#                        own `_COMPONENT_CODES` for the single source of
#                        truth, and docs/components.md for the full
#                        write-up of what each one actually covers):
#                          GEN  = Data generation
#                          QAC  = QA checks & contract
#                          PIPE = Pipeline & publishing
#                          DASH = Dashboard UI
#                          GHUB = GitHub workflow & people
#                          TEST = Testing & dev tooling
#                          DOCS = Docs & process
#                        NNN is zero-padded 3 digits, one single global
#                        sequence across every component (not a
#                        per-component counter, to avoid ever needing to
#                        know "what's the next PIPE number" separately
#                        from "what's the next number"), globally
#                        unique. The 22 pre-2026-09-19 entries below were
#                        bare "REQ-NNN" at first, then migrated the same
#                        day to this format once Keith asked for the
#                        legacy shape to be dropped entirely, not kept
#                        as a grandfathered exception - each one kept
#                        its own original NNN and picked up the real
#                        component code that best matches it (checked
#                        against how the equivalent feature is actually
#                        tagged in CHANGELOG.md/plans/*.md; several real
#                        features are legitimately tagged with more than
#                        one component there, but this id can only carry
#                        one - the single best-fit call for each is a
#                        judgement call, not a mechanical derivation).
#   title:              short, human title.
#   story:              "As a <role>, I want <capability>, so that
#                        <benefit>." - free text, not force-parsed, but
#                        should actually read as a real user story.
#   moscow:              must | should | could | wont
#   status:               not_started | in_progress | built
#   acceptance_criteria: list of real, checkable statements - at least 1.
#                        Written in EARS style going forward (2026-09-19,
#                        Keith's own explicit call, plans/wider.md #10's
#                        requirements-analysis agents work) - "WHEN
#                        <trigger>, THE SYSTEM SHALL <response>" (or
#                        IF/THEN, WHILE/<state>, WHERE/<feature> for the
#                        other real EARS templates) rather than free
#                        prose - genuinely more rigorous/testable, not
#                        force-parsed or regex-enforced here (natural
#                        language has too many valid phrasings to safely
#                        regex-validate), just a real convention the new
#                        requirements-scoper agent writes to. Existing
#                        pre-2026-09-19 entries below were NOT
#                        retroactively rewritten - not worth the churn
#                        for something CI doesn't actually enforce the
#                        syntax of.
#   linked_tests:        list of real pytest node ids ("tests/test_x.py"
#                        or "tests/test_x.py::TestClass::test_method" or
#                        "tests/test_x.py::test_function") or real
#                        tests-js/*.js file paths - each one is verified
#                        to actually exist (validate_requirements.py
#                        parses the referenced Python file's own AST to
#                        confirm a `::`-qualified name genuinely exists
#                        as a test, not just that the file exists).
#                        Required (at least 1) once status is "built" -
#                        a requirement can't claim to be built with
#                        nothing real verifying it. May be empty for
#                        not_started/in_progress.
#   source:              REQUIRED, and not blank - free text saying
#                        where this requirement came from ("Keith,
#                        voice-dictated batch, 2026-09-19" /
#                        "delivery-scoper, gap found while scoping
#                        plans/qa-pipeline.md item 25"). Real
#                        provenance, not a constrained enum.
#
#                        Made required 2026-09-20 (Keith: "it must be
#                        there and it must not be white space only or
#                        empty"). It had been optional on the reasoning
#                        recorded just below - that backfilling the 22
#                        pre-2026-09-19 entries would mean guessing.
#                        That was answered by going and looking instead:
#                        21 of the 22 trace to a real plans/*.md item, a
#                        real Thread/Phase, or a quoted ask, and the
#                        22nd (REQ-DASH-012) says plainly that its
#                        origin was never recorded - which is real
#                        provenance, and more useful than an absent
#                        field, because it tells a reader not to go
#                        looking. Every entry is a retrospective
#                        reconstruction where it says so.
#
#                        Why this one and not the rest: it is the only
#                        field nobody can rebuild later. What a
#                        requirement does is in the code; what verifies
#                        it is in the tests; why it was decided that way
#                        is in `decisions`. Where it came from exists
#                        only if someone wrote it down.
#
# Five further OPTIONAL fields (2026-09-19, same work; `source` was the
# sixth until it became required - see above) - all default to
# empty/absent for the many pre-existing entries below, which were not
# retroactively backfilled (nothing enforces backfilling optional
# fields, and guessing real evidence for old entries after the fact
# would be dishonest - these are for the new requirements-scoper/
# -architect/-reviewer agents to actually populate going forward).
#
# A written-but-blank value is rejected for every field here, optional
# ones included (2026-09-20, Keith): absent and empty look identical
# once whitespace is stripped, but they mean different things - a blank
# key is someone who started filling it in and stopped.
#   signed_off:          Keith's own sign-off on this requirement,
#                        BEFORE any building started - `by:` (a name)
#                        and `date:` ("YYYY-MM-DD"), both required if
#                        the key is present at all. REQUIRED from the
#                        moment `status` moves past "not_started", and
#                        deliberately optional while it is still
#                        not_started: signed-off-then-built is the whole
#                        shape of the rule, so a signed but not-yet-
#                        started requirement is the normal resting state
#                        between the two, not an error.
#
#                        Added 2026-09-20 (Keith: "update your
#                        instructions so that you get me to sign off on
#                        requirements before building begins... you
#                        presenting them to me and me providing input
#                        and sign off"). A field rather than only the
#                        written convention, because the convention was
#                        written first, the same day, and prose is
#                        exactly what had just failed: REQ-DASH-026 sat
#                        here with ten acceptance criteria while work
#                        went ahead against one of them BACKWARDS,
#                        because nothing required anyone to open it.
#                        Nothing in CI could tell a signed-off
#                        requirement from an unsigned one.
#
#                        `by` is not constrained to one name on
#                        purpose - hard-coding "Keith" into a schema is
#                        the kind of thing that quietly breaks the day
#                        somebody else signs one.
#
#                        THE 24 ALREADY-BUILT ENTRIES BELOW ARE
#                        BACKFILLED, all dated 2026-09-20, the day the
#                        field was introduced. Read that date for what
#                        it is: Keith accepting the register as it
#                        stands, not a sign-off that preceded the
#                        build. It could not have preceded the build for
#                        most of them - the register itself was written
#                        retrospectively in 2026-09-18 for the first 22.
#                        Same treatment, and the same reasoning, as the
#                        `source:` backfill above: a field that says
#                        plainly it is a reconstruction is worth more
#                        than an absent one. Everything from here on
#                        carries a real date, signed before the work.
#   date_written:        ISO date ("YYYY-MM-DD") this requirement was
#                        actually drafted - Keith's own ask, so the
#                        register has a real chronological trail, not
#                        just a sequential id. Optional/absent for old
#                        entries same as the rest of this list, but the
#                        requirements-scoper agent should always set it
#                        on anything it drafts from here on (Keith's own
#                        real Perth/AWST local date - see CLAUDE.md's
#                        own "Who this is for" section for why bare
#                        environment `date` can be wrong).
#   non_functional_requirements: list of real standing constraints this
#                        requirement must also respect (this project's
#                        own hard rules count - e.g. "CI must never
#                        touch live/synthetic data directly") - forces
#                        whoever's scoping a new idea to check it against
#                        rules like that, not just functional behaviour.
#   dependencies:        list of other real requirement ids this one
#                        needs or blocks. Each one is checked to actually
#                        exist in this same file (a dangling reference
#                        is a real validation error, same treatment as
#                        linked_tests).
#   open_questions:      list of real, unresolved forks the scoping/
#                        review agent found but couldn't resolve itself
#                        - structured, not buried in prose, and exactly
#                        what should get escalated to a human rather
#                        than guessed.
#   implemented_by:          list of real places this requirement is
#                        IMPLEMENTED - as opposed to linked_tests, which
#                        says what VERIFIES it. Added 2026-09-20 (Keith,
#                        plans/tooling.md #18). REQUIRED once `status` is
#                        "built" - CI fails without it, deliberately: the
#                        `evidence` field below shipped the day before
#                        with an equally clear spec, was optional, and sat
#                        at zero use because nothing ever forced the
#                        issue. Each entry is a repo-relative path, or
#                        `path::Symbol` / `path::Class::method`.
#                        A `.py` entry MUST name a symbol and is checked
#                        by a real AST parse - a bare Python path is
#                        rejected, because `exists()` stays true while the
#                        code inside the file is gutted or renamed, which
#                        is exactly how `touches:` lines in plans/*.md
#                        rotted while still looking authoritative.
#                        A front-end path (`.html`/`.js`/`.ts`) may be
#                        bare, since there's no JS parser on the Python
#                        side; a `::` on one IS allowed and IS verified,
#                        by tests-js/implemented_by.test.js, which loads the
#                        real template into jsdom and checks the symbol
#                        resolves - real execution, so a name appearing
#                        only in a comment cannot pass. Any other file
#                        type may be a bare path only: a `::` on it is
#                        rejected rather than silently unchecked.
#   decisions:           what was DECIDED and what was REJECTED on the
#                        way - short one-or-two-sentence items, a list.
#                        Added 2026-09-20 (Keith): "decisions taken,
#                        other pathways rejected... our collective
#                        memory of the thinking that went into that
#                        requirement, so it doesn't have to be taken
#                        back out of git history or kept in a massive
#                        plan file."
#                        REQUIRED once `status` is "built", no
#                        exceptions. Unlike `linked_tests`,
#                        `implemented_by` and `evidence`, it is NOT
#                        rejected on a requirement that is not built:
#                        it is scoping material and legitimately grows
#                        before any code does (REQ-QAC-024 accumulated
#                        fourteen over a day of forks settled one at a
#                        time, while correctly reading not_started).
#                        This is the field that makes
#                        deleting superseded plans prose SAFE rather
#                        than merely reversible: git preserves a deleted
#                        write-up, but finding one needs
#                        `git log -S"<phrase>"` with a phrase you must
#                        already suspect, which is nothing like grepping
#                        a live file.
#                        It sits opposite open_questions - that holds
#                        the forks NOT resolved, this holds the ones
#                        that were. Prefer "Decided X rather than Y,
#                        because Z": a rejected alternative is the part
#                        a future reader will otherwise re-derive.
#                        Deliberately FLAT, not nested. Every other list
#                        field here is flat strings, and nesting buys an
#                        authoring judgement per entry that one-or-two
#                        sentence items do not need.
#                        Distinct from non_functional_requirements,
#                        which holds CONSTRAINTS the requirement must
#                        respect. Several entries there were really
#                        decisions, filed under NFR because there was
#                        nowhere else for them; those moved here on
#                        2026-09-20.
#   evidence:            a MEASURED result that shows this requirement
#                        holds - narrowed to that, deliberately, on
#                        2026-09-20 (Keith). Verification has four
#                        recognised methods: analysis, inspection,
#                        testing and demonstration. linked_tests covers
#                        testing AND demonstration (a committed
#                        Playwright run that drives the real browser IS
#                        the demonstration); implemented_by covers
#                        inspection. Analysis - deriving that something
#                        holds by measuring rather than executing - is
#                        the one method nothing else holds, and it is
#                        all this field is for.
#                        Each entry says WHAT was measured, THE NUMBER,
#                        WHAT IT WAS MEASURED AGAINST, and WHEN. If you
#                        cannot put a figure in it, it does not belong
#                        here: a walkthrough belongs in linked_tests, a
#                        file-and-line reference in implemented_by.
#                        Not CI-enforced beyond "non-empty strings"
#                        (Keith's explicit call, 2026-09-20 - no digit
#                        check). The rule above is the authoring
#                        standard, and it is narrow enough to be
#                        obvious when it is broken.
#                        This field originally read "what was actually
#                        checked and how", which accepted all three of
#                        the above, overlapped three other fields, and
#                        went unused on all 27 requirements for the day
#                        and a half it existed in that form.
#
# This describes the PRODUCT (the QA dashboard/pipeline this PoC
# delivers), not this project's own working process - things like "a
# running-thoughts capture buffer" or "write CHANGELOG entries per push"
# are real, but they're conventions for HOW this gets built, not
# requirements of what gets delivered, so they're deliberately not here.

requirements:
  - id: REQ-QAC-001
    title: Real multi-tool QA checks against Birth Registrations
    story: >
      As a data engineer, I want Birth Registrations run through real
      dbt-core, Soda Core, datacontract-cli, and Evidently AI checks
      against real generated data, so that the QA results I see are
      genuinely computed, not fabricated for a demo.
    moscow: must
    status: built
    # Backfilled, along with the other 23 already-built entries - see
    # this file's header for what that date does and does not claim.
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      This PoC's own founding scope. The repo began in a claude.ai
      session with no internet access, where the four tools were
      hand-written Python/DuckDB stand-ins; a later Claude Code session
      installed and ran the real ones, which is what made this a
      requirement rather than an approximation. Register entry written
      retrospectively 2026-09-18.
    acceptance_criteria:
      - Every check result traces back to a real tool run against a
        real generated CSV, never a hand-written stand-in.
      - All four tools' checks are reconciled into one dashboard view
        per column.
    linked_tests:
      - tests/test_run_dbt_bdm.py
      - tests/test_run_soda_bdm.py
      - tests/test_run_datacontract_bdm.py
      - tests/test_run_evidently_bdm.py
    evidence:
      - >
        2026-09-20: 352 committed run directories under
        qa_results/registry-services/birth-registrations/, each holding real
        output from all four tools. 133 Birth Registrations check
        definitions parse across dbt, Soda and the ODCS contract.
    decisions:
      - >
        Ran the four real tools rather than reimplementing their logic. An earlier engines/ directory of hand-written Python/DuckDB stand-ins was deleted once it drifted out of sync with the real tools it imitated.
      - >
        Switched to dbt_utils macros (accepted_range, expression_is_true, recency) rather than hand-written equivalents, accepting a one-time `dbt deps` setup step as the cost.
    implemented_by:
      - qa_tools/bdm/orchestrate_bdm.py::run_pipeline
      - qa_tools/bdm/run_dbt_bdm.py::evaluate_dbt_bdm
      - qa_tools/bdm/run_soda_bdm.py::evaluate_soda_bdm
      - qa_tools/bdm/run_datacontract_bdm.py::evaluate_datacontract_bdm
      - qa_tools/bdm/run_evidently_bdm.py::evaluate_evidently_bdm
      - dbt_project/models/staging/schema.yml
      - contract/bdm-birth-registrations-contract.yaml
      - contract/bdm-birth-registrations-soda-checks.yml

  - id: REQ-QAC-002
    title: Real multi-tool QA checks against Child Protection
    story: >
      As a data engineer, I want the Child Protection collection (all 6
      tables, including cross-table business rules) run through the
      same four real tools, so that a multi-table collection gets the
      same real QA rigor as a single-table feed.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      The founding scope above, extended to a second, multi-table
      collection so cross-table business rules were exercised rather
      than assumed. Register entry written retrospectively 2026-09-18.
    acceptance_criteria:
      - Cross-table checks (referential integrity, business rules that
        span more than one table) run for real, not just per-table
        column checks.
    linked_tests:
      - tests/test_run_dbt_cp.py
      - tests/test_run_soda_cp.py
      - tests/test_run_datacontract_cp.py
      - tests/test_run_evidently_cp_real.py
    evidence:
      - >
        2026-09-20: 18 committed run directories under
        qa_results/child-protection-family-support/child-protection/, and 121
        Child Protection check definitions parsing across Soda and the ODCS
        contract - including 10 cross-table sql rules (7 referential-integrity,
        3 business rules) that no single-table check could express.
    decisions:
      - >
        Modelled Child Protection as one collection of six tables, with qa_results/ nesting kept at dataset level rather than table level - so a collection reads as one thing that was QA'd, not six.
      - >
        Kept cross-table rules (referential integrity, business rules) as real checks rather than deferring them, since a multi-table collection whose only checks are per-column would not have tested the thing that makes it different from a single feed.
    implemented_by:
      - qa_tools/cp/orchestrate_cp.py::run_pipeline_cp
      - qa_tools/cp/run_dbt_cp.py::evaluate_dbt_cp
      - qa_tools/cp/run_soda_cp.py::evaluate_soda_cp
      - qa_tools/cp/run_datacontract_cp.py::evaluate_datacontract_cp
      - qa_tools/cp/run_evidently_cp.py::evaluate_evidently_cp
      - contract/child-protection-contract.yaml
      - contract/child-protection-soda-checks.yml

  - id: REQ-DASH-003
    title: Drill-down status rollup (Agency -> Collection -> Dataset -> Column)
    story: >
      As an executive, I want a single red/amber/green rollup per
      agency that I can drill into down to individual columns, so that
      I can go from "is anything wrong" to "exactly what's wrong"
      without leaving the page.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      The reporting dashboard's founding structure, from the same
      original claude.ai design session - the agency-to-column
      drill-down was the shape the whole page was built around, not a
      feature added to it. Register entry written retrospectively
      2026-09-18.
    acceptance_criteria:
      - A dataset's own status is the worst status among its columns;
        a column's is the worst among its own real checks.
      - Every tier is clickable through to the next.
    linked_tests:
      - tests-js/status-rollups.test.js
      - tests-js/navigation.test.js
    evidence:
      - >
        2026-09-19: 30,561 statuses rendered on the live published site,
        each compared against the verdict its own tool recorded. Zero
        disagreements; zero results missing a verdict.
    decisions:
      - >
        A check's status is whatever its own tool recorded, never recomputed downstream from thresholds. The alternative silently rendered a check with 14 real violations green - a false green, introduced by the fix meant to prevent one.
      - >
        Chose one drill-down spine (Agency to Collection to Dataset to Column) over per-tool views, so a column's disagreeing tools sit side by side rather than in separate tabs.
    implemented_by:
      - dashboard/qa-reporting-dashboard.template.html::rollupStatuses
      - dashboard/qa-reporting-dashboard.template.html::navigate
      - qa_tools/common/dataset_status.py::dataset_status
      - pipeline/build_dashboard_data.py::build
      - pipeline/build_cp_dashboard_data.py::build

  - id: REQ-PIPE-004
    title: Committed, permanent QA history
    story: >
      As a data engineer, I want every real QA run's raw tool output
      committed and preserved permanently, so that history survives a
      check's own definition changing or being retired, potentially for
      years.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/publishing-and-history.md Thread B, scoped with Keith over
      one long session on 2026-09-16: how QA results actually become
      durable and shared, and how several people running QA across ~30
      datasets avoid stepping on each other.
    acceptance_criteria:
      - qa_results/ is committed to git, never gitignored or pruned.
      - The dashboard can be rebuilt purely from that committed history,
        with no live tool re-run required.
    linked_tests:
      - tests/test_qa_results_writer.py
      - tests/test_qa_results_reader.py
      - tests/test_build_results_from_history.py
    evidence:
      - >
        2026-09-16: results_bdm.json rebuilt from committed qa_results/
        history alone, diffed against the live orchestrator run -
        byte-identical, generated_at aside.
      - >
        2026-09-16: the synthetic-generation step run twice from an empty
        data/, manifest.json and results_bdm.json diffed - byte-identical,
        confirming the rebuild is deterministic rather than coincidentally
        equal on one run.
    decisions:
      - >
        Scope is tool RESULTS only, never the underlying data records - confirmed explicitly rather than assumed, since storing rows would make the history a second copy of the data.
      - >
        Retention is forever, and the format is each tool's own native output, so a future reader is not dependent on a reshaping step written today still being understood.
      - >
        Stores raw_output AND a resolved `verified` block side by side. dbt's known-bad failure counts and Soda's missing row totals only resolve correctly through a live warehouse connection, which will not exist once the run is over.
    implemented_by:
      - qa_tools/common/qa_results_writer.py::write_qa_result
      - qa_tools/common/qa_results_reader.py::read_qa_results
      - qa_tools/bdm/build_results_from_history.py::build_results_from_history
      - qa_tools/cp/build_results_from_history.py::build_results_from_history

  - id: REQ-PIPE-005
    title: CI-gated publish, no manual publish path
    story: >
      As a data engineer, I want the published dashboard to only ever
      come from an automated, gated CI build, so that nobody can push a
      dashboard build that skipped validation.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/publishing-and-history.md Thread A, same 2026-09-16 scoping
      session. Keith's own call that there be no manual local-publish
      path at all, rather than a discouraged one.
    acceptance_criteria:
      - There is no local "publish" command - only CI can deploy.
      - A structurally invalid or check-lifecycle-violating build never
        reaches the published site.
    linked_tests:
      - tests/test_check_dashboard_renders.py
      - tests/test_dashboard_e2e.py::TestBuiltDashboardRenders
    evidence:
      - >
        2026-09-16: the whole rebuild sequence rehearsed in an isolated clean
        git clone with no local state, matching a real CI checkout. Both gate
        scripts passed end to end.
    decisions:
      - >
        No manual publish-from-local path exists, in any form - not as a routine mechanism and not as a break-glass, because a break-glass path is the one that gets used under pressure.
      - >
        CI deploys but never commits back to git. The earlier commit-back step was removed after it raced with human pushes.
      - >
        CI must never open or query anything under data/, even though this PoC's data is synthetic. A pipeline that is only safe because today's data happens to be fake is one accident away from not being safe.
    implemented_by:
      - .github/workflows/deploy-pages.yml
      - dashboard/check_dashboard_renders.py::main
      - qa_tools/common/validate_check_lifecycle.py::main
      - dashboard/snapshot_dashboard.py::prepare_deploy_site

  - id: REQ-QAC-006
    title: Check lifecycle - retirement without losing history
    story: >
      As a data engineer, I want a check's history preserved even after
      it's formally retired or its definition changes, so that
      "retired" never means "forgotten."
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/publishing-and-history.md Thread D, same 2026-09-16 session
      - how a check being retired, or having its definition changed,
      should show up in the reporting UI without losing what it had
      already found.
    acceptance_criteria:
      - Every real check across all 4 tools carries a globally-unique,
        permanent check_id.
      - A definition change with no accompanying changelog entry fails
        CI.
      - A retired check still shows its full real history behind a
        toggle, never as a hard status.
    linked_tests:
      - tests/test_check_lifecycle.py
      - tests/test_validate_check_lifecycle.py
    evidence:
      - >
        2026-09-20: check-lifecycle validation parses 258 check definitions
        across all four tools and both datasets, reporting zero errors - no
        duplicate check_id, no config change without a changelog entry.
    decisions:
      - >
        Retirement is an explicit declaration, never inferred from a check's absence in a recent run - absence is ambiguous, and a check that silently stopped running looks identical to one that was retired.
      - >
        A check with no check_id is a hard error rather than a silent skip, so the gate cannot be bypassed by omission.
      - >
        Cosmetic fields (name, description) are deliberately outside the config hash, so proofreading an explanation does not read as a definition change needing a changelog entry.
      - >
        check_ids are tool-qualified by default rather than only where a collision happened, so the scheme does not depend on noticing collisions.
    implemented_by:
      - qa_tools/common/check_lifecycle.py::CheckMetadata
      - qa_tools/common/check_lifecycle.py::parse_dbt_check_metadata
      - qa_tools/common/check_lifecycle.py::parse_soda_check_metadata
      - qa_tools/common/check_lifecycle.py::parse_contract_check_metadata
      - qa_tools/common/check_lifecycle.py::parse_evidently_check_metadata
      - qa_tools/common/validate_check_lifecycle.py::collect_checks

  - id: REQ-PIPE-007
    title: Cadence-aware "as of" viewing
    story: >
      As a data engineer, I want to pick any date and see the data asset
      exactly as it stood then, so that I can answer "what did we know
      as of this date" for a daily or a quarterly dataset alike.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/publishing-and-history.md Thread C, same 2026-09-16 session
      - how a quarterly-cadence data asset should be presented
      differently from a daily one.
    acceptance_criteria:
      - Staleness is computed from each dataset's own real cadence
        (daily/weekly/quarterly), not one flat day-count for everything.
      - A date before any real history shows "no data," never a
        misleading blank or stale-but-colored view.
    linked_tests:
      - tests/test_cadence.py
      - tests/test_dashboard_e2e.py::TestAsOfDatePicking::test_a_date_before_any_real_history_shows_no_data
    evidence:
      - >
        2026-09-20: cadence parsed from each contract resolves to genuinely
        different schedules - Birth Registrations daily at 14:00 with 60
        minutes' latency, Child Protection quarterly (Feb/May/Aug/Nov, day 1)
        at 09:00 with 480. One code path, two real cadences, so the handling
        is cadence-aware rather than daily-only with an exception.
    decisions:
      - >
        A single global as-of day-count was tried, corrected from per-dataset to data-asset-level, then removed entirely - a flat day-count was the wrong shape, not the wrong number. A quarterly dataset's real ~92-day delivery gap made it read 'no data' for roughly two-thirds of every quarter.
      - >
        Replaced by per-dataset cadence declared in each dataset's own ODCS contract, so 'no data' means nothing has landed in the CURRENT expected cycle rather than the last delivery being more than N days old.
    implemented_by:
      - pipeline/cadence.py::parse_cadence_from_contract
      - pipeline/cadence.py::cycle_start
      - pipeline/cadence.py::classify_arrival
      - contract/data-asset.yaml

  - id: REQ-QAC-008
    title: Resupply chains derived from real, observable signals
    story: >
      As a data engineer, I want a resupply chain identified purely from
      real cadence timing and each arrival's own real pass/fail status,
      not from internal generator bookkeeping about which delivery a
      resupply was "for," so that the model matches what a real
      production feed could actually tell us (a resupply never arrives
      labelled as such).
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/conceptual-design.md Thread A, 2026-09-17. Keith's own
      critique while a mislabelled-attempt-number bug was being
      investigated: "suppliers won't actually label a resupply as
      against the original supply. It will just appear at a certain
      time. So I think something you're modeling about supplies and
      resupplies doesn't make sense."
    acceptance_criteria:
      - A red arrival starts or continues a chain; the first amber or
        green arrival after it closes the chain.
      - Every supply/resupply row shows its own real aggregate
        red/amber/green status.
    linked_tests:
      - tests-js/supply-history.test.js
    evidence:
      - >
        2026-09-18: build_results_from_history.py's history-only rebuild
        produced byte-identical counts to the live orchestrator run, for
        both datasets.
    decisions:
      - >
        Derived resupply chains from real, observable facts in the data rather than from the synthetic generator's own bookkeeping, so the logic would still work against a real feed that has no generator behind it.
    implemented_by:
      - dashboard/qa-reporting-dashboard.template.html::renderSupplyHistorySection
      - pipeline/build_dashboard_data.py::build

  - id: REQ-DASH-009
    title: "Recent activity: who published what QA, when"
    story: >
      As a manager, I want a feed of who ran and published QA results
      for which dataset and when, so that I can see real publish
      activity across the whole data asset at a glance.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/publishing-and-history.md Phase 3/5a - the activity-feed
      data and then its UI, built out of the committed run history
      Thread B had just established.
    acceptance_criteria:
      - Every entry resolves a real committer, a real commit SHA, and a
        real run timestamp - never a placeholder.
    linked_tests:
      - tests/test_changelog.py
    evidence:
      - >
        2026-09-20: build_changelog() resolves 3 publish events from committed
        qa_results/ history alone (2 Birth Registrations, 1 Child Protection),
        each carrying run_by and run_timestamp from file content and
        commit_sha/committed_at from a single walk of that dataset's git
        history.
    decisions:
      - >
        Grouped feed events by run_timestamp rather than by git commit, since one commit can legitimately bundle several datasets' runs.
      - >
        committed_at and commit_sha are resolved by walking git history rather than self-recorded before pushing, because a locally-made commit can still be rebased and have its SHA and date rewritten before it reaches the shared branch.
    implemented_by:
      - qa_tools/common/changelog.py::build_changelog
      - qa_tools/common/git_identity.py::get_run_by
      - dashboard/embed_dashboard_data.py::embed

  - id: REQ-DASH-010
    title: "Release notes: the tool's own development history"
    story: >
      As anyone evaluating this PoC, I want a real, curated changelog of
      what changed about the tool itself over time, so that I don't
      have to read raw git log to understand how it evolved.
    moscow: could
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/qa-pipeline.md item 62, 2026-09-17 - "what changed about the
      dashboard/tool itself over time", scoped explicitly against the
      two things already built that sound similar and are not: the
      activity feed and a single check's own definition history.
    acceptance_criteria:
      - Entries are real, dated, and categorized (Added/Fixed/Changed),
        not a mechanical commit dump.
    linked_tests:
      - tests/test_changelog_yaml.py
    evidence:
      - >
        2026-09-20: parse_changelog() extracts 8 dated release sections from
        CHANGELOG.md, embedded at build time so the panel needs no runtime
        fetch.
    decisions:
      - >
        Kept the tool's own development history as a separate feed from the QA-publish activity feed. They answer different questions and merging them would have buried both.
      - >
        The feed stays hand-curated rather than a generated commit dump, so not every commit earns an entry.
      - >
        Superseded its own original form on 2026-09-20 (REQ-DOCS-028): hand-written Keep-a-Changelog Markdown became structured YAML written for readers rather than maintainers. This requirement is still what the panel exists for; only the source format and voice changed.
    implemented_by:
      - dashboard/changelog_yaml.py::parse_changelog
      - dashboard/embed_dashboard_data.py::embed
      - CHANGELOG.yaml

  - id: REQ-TEST-011
    title: Real automated test coverage with an enforced floor
    story: >
      As a data engineer relying on this pipeline, I want its own
      correctness verified by a real, continuously-enforced test suite
      (unit, real-tool integration, dashboard JS, and real-browser
      end-to-end), so that a regression can't silently ship.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/publishing-and-history.md Phase 6, scoped 2026-09-17.
      Keith's own words on the coverage floor - pytest-cov and a real
      threshold "so we can't silently regress".
    acceptance_criteria:
      - CI runs the full suite, including real dbt-core/Soda Core/
        datacontract-cli/Evidently integration tests, on every push.
      - A measured code-coverage floor is enforced, not just a vague
        aspiration.
    linked_tests:
      - tests/test_dashboard_e2e.py::TestBuiltDashboardRenders::test_renders_with_zero_console_errors_and_a_populated_view
    evidence:
      - >
        2026-09-19: real CI coverage command (--cov=qa_tools --cov=pipeline
        --cov=generator --cov=dashboard) measured 94.76%, against the 92%
        floor pyproject.toml enforces.
    decisions:
      - >
        The coverage floor is a measured number rather than a guessed round one, so it cannot be quietly satisfied by a threshold nobody checked against reality.
      - >
        Parallel test execution became the default once the reason for staying serial - debuggability - turned out not to hold, since pytest-xdist silently falls back to serial when --pdb is passed.
    implemented_by:
      - .github/workflows/test.yml
      - pyproject.toml
      - tests-js/support/loadDashboard.js

  - id: REQ-DASH-012
    title: Dark mode
    story: >
      As a viewer, I want a persistent dark mode toggle, so that I can
      use the dashboard comfortably regardless of lighting or personal
      preference.
    moscow: could
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Not recorded at the time. Dark mode was built as part of the
      dashboard's general UI work with no scoping item of its own, and
      this entry was written retrospectively on 2026-09-18 from the
      built behaviour. Kept honest rather than guessed - the later
      decisions about it (that a shared ?theme= link never overrides the
      recipient's own stored choice) are real and recorded, but they are
      not where it came from.
    acceptance_criteria:
      - The choice persists across a reload.
    linked_tests:
      - tests/test_dashboard_e2e.py::TestDarkModeToggle::test_toggling_dark_mode_persists_across_a_reload
      - tests/test_dashboard_e2e.py::TestDarkModeToggle::test_dark_mode_actually_renders_dark
    evidence:
      - >
        2026-09-20: all 21 colour tokens are redefined under the dark theme,
        measured by resolving getComputedStyle on the real built page in both
        themes and diffing - zero tokens fall through to their light value, so
        the theme is complete rather than partial.
    decisions:
      - >
        Dark mode is a real toggle with a stored preference rather than only following the OS setting, so a viewer can override their system on one device.
      - >
