  - id: REQ-PIPE-052
    title: Slots are derived, one per table per period it participates in
    date_written: "2026-09-22"
    story: >
      As a data team leader whose collection has six tables, I want each
      table to have its own expected supply with its own deadline, so
      that one late table shows as one late table rather than dragging
      five punctual ones down with it.
    moscow: must
    status: built
    source: >
      Keith, 2026-09-21, plans/supply-model.md Threads C, E and F - each
      table claims a slot independently, and a slot carries its own
      due_at, grace and claim window. Delivery sprint 6, and test
      scenario register TS-27 and TS-33b. Scoped by delivery-scoper,
      batch 1+2 pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL derive a slot for each pairing of a dataset
        with a period that dataset participates in, and SHALL NOT
        require a slot to be authored.
      - THE SYSTEM SHALL create one slot per dataset per period, so that
        a collection of six datasets in one period has six slots.
      - THE SYSTEM SHALL give each slot its own due instant, computed
        from its period's date and its own dataset's expected time of
        day in the asset's timezone.
      - THE SYSTEM SHALL give each slot its own grace allowance, taken
        from its own dataset's contract.
      - THE SYSTEM SHALL open a slot's claim window a configured
        interval before that slot's due instant, and SHALL NOT close it.
      - IF a dataset declares a period as not expected, THEN THE SYSTEM
        SHALL create no slot for it.
      - THE SYSTEM SHALL determine whether a slot is overdue by querying
        the schedule and the slot's state, and SHALL NOT require an
        event or a scheduled sweep to record it.
      - THE SYSTEM SHALL derive slots deterministically, so the same
        configuration and the same date produce the same slots.
      - THE SYSTEM SHALL track each dataset's slot sequence
        independently of every other dataset's.
      - THE SYSTEM SHALL give each slot its own claim window, taken from
        its dataset's own contract where one is declared and from the
        version of its calendar in force on that period's own date
        otherwise.
    non_functional_requirements:
      - Slot count multiplies - ~30 datasets on the quarterly asset,
        several of them multi-table collections, times four periods a
        year, times years of history. Derivation must stay cheap at that
        size, and anything presented per slot must aggregate rather than
        enumerate. Thirty individual banners is noise.
      - Config only, no data access.
      - The claim window is a genuine TRADE, not a tuning knob, and this
        requirement must not invite anyone to "fix" it later. Tight
        windows buy cascade-immunity at the price of boundary
        misfiling; wide windows do the reverse; no sizing gets both.
      - Slot identity is what every later sprint compares against -
        overdue, staleness, assignment, classification and promotion are
        all defined against the expected-supply sequence. Its shape must
        be settled here rather than adjusted downstream.
    dependencies: [REQ-PIPE-051, REQ-PIPE-049, REQ-PIPE-048]
    decisions:
      - Decided each TABLE claims its own slot rather than a collection
        filling one slot as a unit (Keith, 2026-09-21). Everything
        before that had assumed one table per supply, which holds for
        Birth Registrations and not for Child Protection's six.
      - Decided this is what makes an earlier decision implementable. A
        multi-table check signalling that a table it spans is missing
        had no fact to test against until slots became per-table; it is
        now the crisp condition "any table this check spans has an
        unfilled slot for that period".
      - Decided per-table classification is more honest than
        per-delivery. If cp_clients lands 09:00 and cp_placements 14:00,
        each gets its own verdict rather than the whole delivery taking
        the worst.
      - "Decided the claim window OPENS before due and NEVER CLOSES, and
        that this reinstates an earliness window an earlier entry had
        just dropped as redundant. That call was wrong: the window is
        what defines when a slot becomes CLAIMABLE, which is the thing
        that makes the forward cascade structurally impossible rather
        than avoided by luck."
      - Decided this also DELETES the daily cutoff rule. "Arrives 10pm,
        so it is for tomorrow" needs no special handling - if a feed's
        supply genuinely lands the evening before, its due instant IS
        the evening before and the window opens accordingly. The
        schedule expresses it directly instead of a separate rule
        reinterpreting arrivals afterwards.
      - Decided overdue is a COMPUTED PROPERTY, not an event - a
        correction to an earlier claim that it needed a trigger. Same
        pattern already settled for the exhausted-schedule banner, which
        the dashboard computes from config rather than being told about.
      - "Scope boundary, recorded because it will be proposed otherwise
        (Keith): this system does NOT build staleness-tolerance policy
        for consumers. It attributes supplies to slots and reports what
        is where and how fresh. Whether a downstream consumer takes only
        the latest slot, composes several, or refuses anything older
        than a week is theirs - otherwise the tool grows a config
        surface for every downstream system's preferences, unmanageable
        at 30 datasets."
      - "Note on scope: this requirement DEFINES the claim window as a
        slot property. The rules that USE it - oldest claimable unfilled
        slot, on-time-wins-for-the-current-slot, monotonic filling, hold
        for a human - are slot ASSIGNMENT and belong to batch 3."
      - "[A3] Decided slot derivation resolves the claim window through
        inheritance rather than requiring every dataset to state one. A
        slot must always have a window - assignment is defined against it
        - so the resolution happens here, at derivation, rather than
        being left to each consumer to fall back on."
      - "[BUILD] Found that qa_tools/common/schedule.py's own
        claim_window() docstring described the OPPOSITE of the settled
        rule - \"how long AFTER a period's date a supply may still
        claim it\". A window measured forwards is one that CLOSES; the
        rule (Thread E) is that it opens a configured interval BEFORE
        the due instant and never closes. Read the wrong way it would
        make a late supply unfileable, from the same number. Corrected
        where it was, rather than only getting it right here."
      - "[BUILD] Decided Slot has no `closes_at` field at all, and that
        the absence is asserted in a test. The tempting fix for a
        boundary misfile is to close the window; closing it is what
        would break late filing, and this requirement's own NFR says
        the sizing is a genuine trade nobody should later 'fix'."
      - "[BUILD] Decided `late_after` is a derived property rather than
        a stored field, so a slot's due instant and its grace can never
        disagree with the instant it computes."
      - "[BUILD] Decided next_unfilled_claimable() implements only the
        half of Thread E's assignment rule that config can answer, and
        returns None rather than deciding the resupply case. Deciding
        it needs promotion state, which needs data - that is
        REQ-PIPE-034's, and guessing it here would put a filing
        decision in a module that cannot see what it is filing."
      - "[BUILD] Accepted an untidy layering rather than a second
        parser: qa_tools/common/slots.py imports pipeline.cadence to
        read a dataset's own slaProperties, because that array is
        parsed in exactly one place and reading it again here would be
        two parsers for one file. Named in the module docstring rather
        than left as an oddity; the tidier fix is a refactor this
        requirement does not need."
    linked_tests:
      - tests/test_slots.py
      - tests/test_schedule.py
      - tests/test_cli_schedule.py
    implemented_by:
      - qa_tools/common/slots.py::Slot
      - qa_tools/common/slots.py::slots_for_dataset
      - qa_tools/common/slots.py::is_claimable
      - qa_tools/common/slots.py::is_overdue
      - qa_tools/common/slots.py::next_unfilled_claimable
      - cli/schedule.py::_show_dataset
    evidence:
      - >
        2026-09-23: six Child Protection datasets in 2026-Q1 produce
        six slots, one each - the requirement's own story asserted
        directly, so one late table can show as one late table.
      - >
        2026-09-23: each slot carries its own timing from its own
        contract, and the two datasets in this repo genuinely differ -
        Birth Registrations due 14:00 with an hour's grace and a
        four-hour claim window, Child Protection due 09:00 with eight
        hours' grace and a fourteen-day one. Same code, different
        answers, which is what the per-element read buys.
      - >
        2026-09-23: the claim window opens early and never closes,
        asserted both ways - a supply arriving ten years late can still
        claim its slot, and one arriving a second before the window
        opens cannot claim anything at all. The second half is what
        makes the forward cascade structurally impossible rather than
        unlikely.
      - >
        2026-09-23: overdue-ness is a question, not a record. The same
        slot answers differently as `now` moves and nothing is written
        anywhere - which is what lets a dashboard built from
        configuration alone say a slot is overdue even though the run
        that would have reported it never happened.
      - >
        2026-09-23: a period a dataset declares not-expected produces
        NO slot, while the period itself is still returned and flagged
        with its reason. Both halves asserted together, because that is
        the difference between "agreed, no November file" and a silent
        gap.
      - >
        2026-09-23: deriving slots opens nothing under data/, asserted
        by watching every Path.open during a real derivation.
      - >
        2026-09-23: `mothman schedule show --dataset X` now shows each
        period's due instant and the instant it becomes claimable, so
        the one per-dataset fact somebody editing a calendar most needs
        is on the page rather than only in the model.
      - >
        2026-09-23: 1154 Python tests, 166 JS tests, all nine mothman
        gates.

  - id: REQ-PIPE-053
    title: A schedule that runs out is loud, and only for its own dataset
    date_written: "2026-09-22"
    story: >
      As a data team leader, I want to be told well before my dataset's
      authored dates run out, and stopped clearly if they do, so that the
      dashboard never goes quiet in a way that looks exactly like nothing
      having gone wrong.
    moscow: must
    status: built
    unmet_criteria:
      # post-build-review #33, built 2026-09-25. These were named in a
      # `decisions:` note - accurate, and in a field nobody has to read.
      # A criterion this requirement does not meet now has somewhere
      # structured to sit, and the gate can see it.
      #
      # ONE CAME OFF on 2026-09-25: "continue to accept that dataset's
      # supplies while its schedule is exhausted" is now met and
      # covered by tests/test_backlog.py. REQ-PIPE-061 built the
      # staging that accepting a supply into a backlog needed, and its
      # own criterion 9 is the same SHALL - the duplication was
      # deliberate, because this requirement made the claim and that
      # one is the mechanism.
      - criterion: >-
          IF a dataset has no slot covering the date being processed, THEN THE
          SYSTEM SHALL fail for that dataset.
        why: >-
          Describes a filing layer that does not exist yet. Nothing files a
          supply against a slot, so there is nothing to fail at.
        owner: REQ-PIPE-062 (slot assignment), batch 3
      - criterion: THE SYSTEM SHALL fail at filing, before QA runs for that dataset.
        why: Same filing layer - there is no filing step to fail before.
        owner: REQ-PIPE-062 (slot assignment), batch 3
      - criterion: >-
          THE SYSTEM SHALL scope that failure to the affected dataset, and SHALL
          NOT stop processing any other dataset.
        why: Scopes a failure that cannot occur yet.
        owner: REQ-PIPE-062 (slot assignment), batch 3
      - criterion: >-
          THE SYSTEM SHALL state, in that message, how many supplies are waiting
          and since when, and SHALL NOT state how many days have elapsed.
        why: >-
          The exhausted notice says how many datasets cannot be processed and
          never what is piling up, because nothing tracks a backlog yet. Raised
          independently as post-build-review #7.
        owner: REQ-PIPE-062 (slot assignment), batch 3
      - criterion: >-
          WHEN a run skips a dataset because its schedule is exhausted, THE
          SYSTEM SHALL state in that run's own summary how many datasets were
          processed and how many were skipped.
        why: No run currently skips a dataset for this reason, so no summary says so.
        owner: REQ-PIPE-062 (slot assignment), batch 3
    source: >
      Keith, 2026-09-21, plans/supply-model.md Thread C - "exhausted
      schedule - hard failure, scoped per dataset", stronger than the
      read-UNKNOWN option proposed to him and for a good reason: it
      cannot be ignored. Delivery sprint 6, and test scenario register
      TS-23 and TS-24. Scoped by delivery-scoper, batch 1+2 pass,
      2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL measure that runway in SLOTS, and SHALL NOT
        measure it in elapsed time.
      - THE SYSTEM SHALL NOT fail a build on the runway warning.
      - WHEN more than one dataset is low on runway, THE SYSTEM SHALL
        state how many rather than warning once per dataset.
      - IF a dataset has no slot covering the date being processed, THEN
        THE SYSTEM SHALL fail for that dataset.
      - THE SYSTEM SHALL fail at filing, before QA runs for that
        dataset.
      - THE SYSTEM SHALL scope that failure to the affected dataset, and
        SHALL NOT stop processing any other dataset.
      - WHILE a dataset's schedule is exhausted, THE SYSTEM SHALL
        continue to accept that dataset's supplies, so that the backlog
        can be filed correctly once dates are added.
      - WHEN the dashboard is built, THE SYSTEM SHALL compute the
        exhausted-schedule condition from configuration alone, and SHALL
        show it even though the run that would have produced new results
        did not happen.
      - THE SYSTEM SHALL state, in that message, how many supplies are
        waiting and since when, and SHALL NOT state how many days have
        elapsed.
      - WHERE a calendar is an authored date list, THE SYSTEM SHALL warn
        when fewer than a configured number of future slots remain for a
        dataset naming it.
      - WHERE a calendar is a cadence rule, THE SYSTEM SHALL NOT warn
        about runway for any dataset naming it.
      - THE SYSTEM SHALL surface the low-runway warning both in the
        dashboard and as a non-fatal warning in the repository's gates.
      - THE SYSTEM SHALL state, in the runway warning itself, that it is
        not failing the build.
      - THE SYSTEM SHALL distinguish a warning from a failure in text as
        well as colour, and SHALL NOT rely on colour alone.
      - WHEN a calendar is low on runway, THE SYSTEM SHALL warn once for
        that calendar, naming it, its last authored period and how many
        datasets name it, and SHALL NOT enumerate those datasets.
      - THE SYSTEM SHALL render an exhausted schedule as a status
        distinct from green, amber and red, and SHALL NOT render it with
        the same status or the same wording as a dataset that simply has
        no run on or before the selected as-of date.
      - THE SYSTEM SHALL NOT allow an exhausted schedule to be absorbed
        by the worst-of status rollup at any tier.
      - WHEN one or more schedules are exhausted, THE SYSTEM SHALL state
        so in a notice above the executive tier's agency grid, naming
        how many.
      - THE SYSTEM SHALL evaluate the exhausted-schedule condition
        against the as-of date currently selected, and SHALL NOT report
        a schedule as exhausted while viewing a date its calendar
        covers.
      - THE SYSTEM SHALL name, in that notice and in the failure, the
        configuration a person must edit.
      - THE SYSTEM SHALL NOT offer a way to dismiss or hide the
        exhausted-schedule notice, and SHALL NOT persist any such
        dismissal in browser storage.
      - WHEN a run skips a dataset because its schedule is exhausted,
        THE SYSTEM SHALL state in that run's own summary how many
        datasets were processed and how many were skipped.
    non_functional_requirements:
      - This is the whole reason authored dates are safe. Without it, a
        date list running out means nothing is ever expected, so nothing
        is ever overdue, and the dashboard goes QUIET rather than red -
        the same false-green shape as the staleness problem.
      - Scoping the failure per dataset is a scale requirement, not a
        nicety. At 30 datasets, one neglected annual dataset halting the
        other 29 is how a check gets disabled wholesale.
      - The banner must be computable by the dashboard build from config
        alone, with no data access and no dependency on the run that did
        not happen. A dashboard that stopped updating looks identical to
        one where nothing changed.
      - Measuring the backlog in supplies rather than days scales its
        own urgency - daily and quarterly feeds pile up at very
        different rates.
      - A non-fatal warning that fails a build gets disabled. Keep
        runway non-fatal, permanently.
    dependencies: [REQ-PIPE-052, REQ-PIPE-050]
    decisions:
      - "Decided HARD FAILURE rather than reading UNKNOWN (Keith,
        2026-09-21), which is stronger than what was proposed to him.
        The reason is that it cannot be ignored: once the runway warning
        has fired and nobody has filled in the dates, the pipeline
        refuses to process that dataset."
      - Decided hard failure is SAFE because staging only ever asserts
        arrival facts, so a backlog drains CORRECTLY once dates are
        added - filed to the right slots and classified against the
        right due instants, not approximated. That safety depends on
        replaying the backlog in arrival-timestamp order, which is
        batch 3's rule and was originally stated here without its
        dependency.
      - Decided to fail at FILING, before QA runs. A supply with no slot
        cannot be classified and cannot be promoted, so QA would produce
        results that can be filed nowhere. Keith's own preference too -
        a clear signal beats half-processing.
      - "Decided runway is measured in SLOTS, because months mislead:
        three months of quarterly runway is ONE slot, which is already
        too late."
      - Decided runway lands here rather than with the validate-config
        gate in sprint 5, even though Thread K lists it there. Runway is
        measured in slots and slots do not exist until this sprint. The
        gate keeps every error case; only the warning moves.
      - "Note on build order: the criteria covering filing and the
        staging backlog describe behaviour that cannot be verified until
        staging exists (batch 3, sprint 8). They are stated here because
        they are the schedule's own behaviour, and their tests land with
        staging rather than with this sprint."
      - "[A1] Decided runway is a property of the CALENDAR, not of the
        dataset. Thirty datasets on one authored calendar run out on the
        same day, so thirty warnings would be one fact repeated - which
        is what the aggregation criterion already exists to prevent, now
        with a natural unit to aggregate on."
      - "Decided the low-runway warning surfaces on BOTH the dashboard
        and in the gates (Keith, 2026-09-23). Thread C always said both;
        every runway criterion drafted here was pipeline-side, and
        delivery-dashboard-ux caught the dashboard half as lost in
        scoping. Thread C's own reasoning for both: the person who must
        act maintains config, not necessarily the one reading the
        dashboard. Rejected CI-only, which was the requirement as
        written - its real cost is that nobody sees the warning until
        the schedule has already run out, which is the failure it
        exists to pre-empt. Accepted cost: on a healthy quarterly asset
        this element is present for months at a time."
      - "Decided an exhausted schedule renders as a DISTINCT state
        outside green/amber/red (Keith, 2026-09-23). Rejected RED, which
        Thread C's own delta table had implied via cannot-run-becomes-
        red: a supplier's clean dataset would read red because WE forgot
        to type next year's dates, which is an attribution error - our
        config task undone, presented as their data gone bad - and the
        fastest way to teach people that red does not mean what it says.
        Rejected leaving it as nodata, which is what the naive
        implementation produces and is invisible in every rollup above
        it."
      - "The nodata trap is verified in the real code, not reasoned:
        rollup() filters d.noDataAsOf and rollupStatuses() filters
        s!==nodata before worstOf(), and STATUS_ORDER puts nodata at -1
        - the template's own comment says it can only ever lose a reduce
        that starts from green. So one exhausted dataset among 29
        healthy ones makes its collection, its agency and the executive
        tier all read green, with the only trace being a Tier-2 row
        whose wording is identical to a dataset that was never supplied.
        Under the new model nodata also narrows to \"nothing was owed\",
        and an exhausted schedule owes nothing by construction - so the
        obvious derivation lands it in exactly the bucket engineered to
        vanish."
      - "Decided the executive tier gets a NOTICE above the agency grid,
        naming how many (Keith, 2026-09-23), against the recommendation
        of a count badge on the affected agency's card. The badge was
        argued as quieter, scaling to 30 datasets, and telling you WHERE
        rather than just THAT. Keith took the louder option: an
        exhausted schedule stops a dataset being processed, and this
        whole requirement exists because the dashboard must never go
        quiet in a way that looks like nothing went wrong. The accepted
        risk, named so it can be watched: a notice that sits there for
        weeks becomes wallpaper, and wallpaper stops working for the
        next thing too."
      - "[BUILD] Status is `built`, and what that does NOT mean is
        worth stating because the plain word overclaims here. The
        runway warning and the exhausted-schedule state are built and
        tested end to end. The criteria about failing at filing,
        accepting supplies while exhausted, and a run summary naming
        what it skipped describe a filing layer that does not exist
        yet - this requirement''s own earlier decision already says
        their tests land with staging (sprint 8), and that is what the
        register is relying on here. `in_progress` was tried first and
        rejected BY THE GATE, which forbids evidence on anything not
