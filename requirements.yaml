  - id: REQ-QAC-047
    title: A shared table of status cases, covering the half the browser check cannot
    date_written: "2026-09-22"
    story: >
      As a data team leader, I want the status I see on the page to be
      the status the pipeline computed, so that a dataset does not read
      green in the dashboard and mean something else to the automation
      that opens my ticket.
    moscow: must
    status: built
    source: >
      plans/supply-model.md Thread I, verified against real code
      2026-09-21 - qa_tools/common/dataset_status.py has no nodata in
      STATUS_ORDER at all, so a recorded nodata falls through
      dashboard_status_of() to threshold math and returns green. Delivery
      sprint 3, and test scenario register TS-20. Scoped by
      delivery-scoper, batch 1+2 pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL return the same status from its Python and
        browser implementations for every check-result input.
      - IF an implementation encounters a recorded status it does not
        recognise, THEN THE SYSTEM SHALL fail loudly naming the status
        and where it was read from, and SHALL NOT fall back to
        threshold arithmetic.
      - THE SYSTEM SHALL NOT treat an unrecognised recorded status as
        evidence of health.
      - THE SYSTEM SHALL order statuses identically in both
        implementations.
      - IF a rollup is asked to combine a status it cannot order, THEN
        THE SYSTEM SHALL NOT return green.
      - WHEN a new status value is introduced, THE SYSTEM SHALL fail
        until both implementations recognise it.
      - THE SYSTEM SHALL apply the same retired-check filtering rule in
        both implementations.
    non_functional_requirements:
      - This must land BEFORE any per-check nodata value is recorded, or
        the new status meets a silent misgrade on arrival. That is
        plans/qa-pipeline.md item 74's exact failure mode, in the module
        whose own docstring says it drifted from its JS counterpart once
        already.
      - The verification has to run at the layer a human sees, not only
        at the data layer. tests/test_dashboard_e2e.py's own
        TestStatusMatchesEachToolsOwnVerdict is the worked example -
        ~30k statuses compared inside a real browser, in seconds.
      - Failing loudly on an unknown status is a change in failure
        behaviour, from silently-wrong to noisily-broken. That is
        deliberate, and it means a malformed committed result now stops
        a dashboard build that would previously have rendered a false
        green.
      - No live data access. Both implementations read already-built
        dashboard JSON, and must continue to.
      - Two toolchains, so both must cover it - uv run pytest and npm
        test.
      - The other half of this verification ALREADY EXISTS and is not
        rebuilt here. tests/test_dashboard_e2e.py's
        TestStatusMatchesEachToolsOwnVerdict drives the real built
        dashboard in a real browser and compares every committed result's
        rendered status against the verdict the tool recorded. That
        covers inputs nobody anticipated; the table covers inputs that do
        not exist yet. Neither covers the other's gap.
      - The table must be readable by both toolchains without either
        owning it - a committed data file, not a Python fixture the JS
        suite has to reimplement.
      - Adding a row must be the obvious thing to do when a status is
        added. If it is not, the table rots into a snapshot of what was
        true once.
    dependencies: []
    decisions:
      - Decided the fix is parity PLUS loud failure, not simply adding
        nodata to the Python STATUS_ORDER. Adding the one missing value
        makes the two agree today and guards nothing against the next
        status either side gains. The silent fall-through to threshold
        arithmetic is the actual defect - it converts "I do not know
        what this is" into "green".
      - Decided to guard the partial-nodata rollup path even though
        red-for-unrun (sprint 17) is intended to make it unreachable.
        TS-19 exists precisely because worstOf() is seeded green and
        STATUS_ORDER.nodata is -1, so five green plus one nodata returns
        green - the mechanism written to prevent a false green produces
        one once nodata becomes partial. A structural fix elsewhere is
        not a reason to leave the old path untested.
      - "Recorded as verified rather than reasoned. Both implementations
        filter retired checks BEFORE the rollup - the template's
        worstOf(c.checks.filter(ck=>!ck.retired)...) and
        dataset_status.py's `if ck.get(\"retired_as_of\"): continue` -
        so a table whose checks have all been retired yields an empty
        list and renders green by vacuum in both. The gate that closes
        that is sprint 16's zero-ACTIVE-checks CI check, not this
        requirement, but the parity finding is what proved it
        reachable."
      - "[B3] Decided the deliverable is the shared committed table ONLY
        (Keith, 2026-09-22), correcting the scoper's own recommendation
        of both mechanisms - which the main session had also recommended.
        The browser-level cross-check proposed as a second half ALREADY
        EXISTS: TestStatusMatchesEachToolsOwnVerdict was built after the
        item 74 incident and already drives the real page over all
        committed results. Proposing it again would have meant rebuilding
        something shipped, and would have hidden the fact that the table
        is precisely the MISSING half."
      - "[B3] Recorded because it is the reason the table is the right
        half rather than the cheap half: the existing cross-check can
        only ever cover statuses that appear in the committed history,
        and the status this sprint exists for - per-check nodata - has no
        history at all yet. A verification that only sees what has
        already happened cannot catch a value that has not happened."
      - "[BUILD] The defect turned out to be WORSE than the source note
        said, and in the other implementation too. The note described
        Python's missing nodata. Probing both sides first found that an
        UNRECOGNISED status read green in BOTH, by two different routes:
        Python fell through to threshold arithmetic, and the dashboard
        returned any truthy recorded status straight out to a rollup
        that could not order it - STATUS_ORDER[unknown] is undefined,
        `undefined > 0` is false, so the reduce kept its green seed.
        Neither side had a bug the other lacked; they had the same bug
        written twice."
      - "[BUILD] Decided recognition is scoped BY LEVEL - a check may
        carry only the ordered statuses, a dataset those plus the
        unordered ones. The first draft had one flat vocabulary, and
        the table's own `exhausted-is-never-a-check-verdict` case caught
        it: `exhausted` is a property of a dataset's SCHEDULE, so a
        check carrying one means something upstream wrote a
        dataset-level status onto a check. A flat vocabulary renders
        that bug instead of reporting it."
      - "[BUILD] A REAL PARITY GAP found while writing the table, which
        no plan had predicted: the two sides expressed the retired-check
        rule differently and disagreed on one input. The dashboard
        tested `retired_as_of != null`, so an EMPTY STRING read as
        RETIRED; Python tested truthiness, so the same check read as
        ACTIVE. One character of difference, opposite answers, and the
        dashboard's reading is the dangerous one - it drops a LIVE check
        out of the rollup entirely. Both now call one named function.
        This is the case for a table of INPUTS rather than a review of
        two implementations: nobody reading either line would have
        thought to try an empty string."
      - "[BUILD] Decided `worst_of([\"nodata\"])` returning GREEN is
        PINNED as-is rather than fixed, and the pin says so in the
        table. It is a real false green - a rollup containing nothing
        but nodata reads healthy - but both sides do it identically, so
        it is a parity case and not a parity bug, and this requirement's
        own earlier decision already says a structural fix elsewhere
        (sprint 17's red-for-unrun) is not a reason to leave the path
        untested. Changing the reduce's seed would be a behaviour change
        across every rollup in the dashboard, on a requirement scoped to
        parity. Pinning makes the eventual fix a deliberate edit to a
        named line rather than a silent drift."
      - "[BUILD] A test written for REQ-PIPE-053 EARLIER THE SAME DAY
        asserted the defect as intended behaviour: `worstOf([\"exhausted\",
        \"green\"])` returns `\"green\"`, with a comment reasoning that a
        status with no rank simply loses every comparison. True of the
        implementation, wrong about the rule, and it passed for a day.
        This is the argument for the table in one incident - that suite
        owned its own expectations, so it blessed whatever the page
        already did. Corrected, with the reasoning left in place rather
        than deleted."
      - "[BUILD] `pipeline/dashboard_check_labels.py` had cited
        `tests/test_status_parity.py` as an existing guard since
        2026-09-19, while no such file was in the repo. Recorded rather
        than quietly corrected when the file was finally written: a
        comment describing a guard that is not there reads exactly like
        one describing a guard that is, and this one had been read at
        least once without anyone checking."
      - "[BUILD] Made the dashboard expose `statusVocabulary()` rather
        than testing its consts directly. Same jsdom constraint
        REQ-PIPE-053 hit: a top-level `const` in a classic script is not
        a window property, so a test reading STATUS_ORDER from outside
        would have been comparing against `undefined` while appearing to
        pass. One accessor is also the better page: a single place that
        answers what statuses exist and where each may appear."
      - "[BUILD] Asserted that the REAL committed history carries
        nothing unrecognised, rather than assuming it. This change turns
        a false green into a failed build, so the blast radius is worth
        measuring - measured at green/amber/red only, across both
        datasets."
    linked_tests:
      - tests/test_status_parity.py
      - tests-js/status-parity.test.js
      - tests-js/schedule-runway.test.js
    implemented_by:
