      - qa_tools/common/acceptance_sync.py::build_decisions
      - qa_tools/common/ticket_sync.py::main
      - dashboard/qa-reporting-dashboard.template.html::buildRealDataset
    evidence:
      - >
        2026-09-20: 23 tests cover the decision matcher, including that a
        /reject comment matches its run the same way /accept does, that
        matching is case-insensitive, and that a comment before any real
        run matches nothing.
    decisions:
      - >
        The decision is a real comment on the dataset's own GitHub
        ticket, not a button in the dashboard. The dashboard is a static
        published page with no backend to receive a click, so a button
        would have needed one built purely to record a decision.
      - >
        No run_id has to be typed or copied. Every run already has a real
        arrival window from committed history, so a bare /accept or
        /reject is matched to whichever run's window contains the
        comment's own timestamp.
      - >
        A rejected run's status pill stays amber rather than turning red
        - Keith's own call, 2026-09-19, as the smaller and safer option,
        symmetric with accept rather than repainting the pill.
      - >
        An accepted run stays amber too, with an acknowledgment badge.
        Repainting it green would have made a human decision look like a
        data improvement.
      - >
        The decision is per-run, not standing: a new amber arrival needs
        its own fresh comment, so nobody can accept a dataset once and
        stop looking.

  - id: REQ-PIPE-018
    title: An AWS MVP reacting to real S3 delivery events
    story: >
      As a data engineer, I want the pipeline to run automatically when
      a real file lands in S3, so that QA happens as part of the actual
      delivery workflow, not a manually-kicked-off local script.
    moscow: should
    status: not_started
    source: >
      plans/running-thoughts.md #5, Thread B - deploy some version of
      this pipeline to AWS, triggered by real S3 events, so QA happens
      as part of the delivery rather than being kicked off by hand.
    acceptance_criteria:
      - A real S3 event triggers a real pipeline run with no manual
        step.
      - Child Protection's own cross-table checks only run once all 6
        tables for that snapshot have actually landed and been QA'd
        individually.
    linked_tests: []
    open_questions:
      - "WHEN is a delivery receipt written? Not designed anywhere. This document's own design parses the real S3 ObjectCreated event shape but predates the supply model and says nothing about receipts, while REQ-PIPE-057 now makes a delivery count as received only where our own receipt exists, REQ-PIPE-061 processes in receipt order and REQ-PIPE-066 classifies against it. What IS settled is only who writes it - we do, never the supplier, enforced structurally by write_delivery() refusing a receipts directory inside the deliveries directory. The hard part is that this is the same question as the delivery boundary: in S3 a supplier PUTs objects and events fire per object, with no delivery-is-finished signal, so 'when do we write the receipt' is exactly 'when does our boundary rule say this delivery is complete' - which Thread B requires to be arranged per source. See plans/running-thoughts.md #38."
      - "What does a production receipt CARRY? Today a delivery name and an instant, nothing about provenance - not the transport, the principal or credential that delivered it, the source bucket and key or SFTP account, or a checksum. Receipts are immutable and accumulate, so a field added later cannot be backfilled and every earlier arrival stays permanently thinner. See plans/running-thoughts.md #37."

