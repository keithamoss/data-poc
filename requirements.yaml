  - id: REQ-DASH-054
    title: The as-of picker knows the real calendar, because it is embedded
    date_written: "2026-09-22"
    story: >
      As a data owner picking a date, I want the picker to know the
      quarters we actually agreed with our suppliers, so that asking for
      a past quarter returns that quarter rather than silently nothing.
    moscow: must
    status: not_started
    source: >
      plans/supply-model.md Thread C - the dashboard's cycleStartDate()
      reimplements cycle_start() in JS because the as-of picker lets a
      viewer pick any date and a static site has no backend to ask. That
      reimplementation computes a cadence rule and cannot compute an
      authored date list, so the period sequences have to be embedded.
      Scoped by delivery-scoper, batch 1+2 pass, 2026-09-22 as delivery
      sprint 6. MOVED TO BATCH 6 on 2026-09-23, Keith's call, after
      delivery-architect found it depends on the unsigned REQ-DASH-041.
    acceptance_criteria:
      - THE SYSTEM SHALL use that embedded sequence for the as-of
        picker's period arithmetic.
      - THE SYSTEM SHALL NOT reimplement schedule derivation in the
        browser.
      - IF a viewer picks a date the embedded sequence does not cover,
        THEN THE SYSTEM SHALL say so plainly rather than render an empty
        view.
      - THE SYSTEM SHALL derive the embedded sequence from configuration
        only, with no access to anything under data/.
      - THE SYSTEM SHALL render with zero console errors in a real
        browser.
      - THE SYSTEM SHALL embed each of the asset's named calendars' period
        sequences into the built dashboard, and SHALL identify which
        calendar each dataset uses.
      - WHEN a viewer opens the as-of panel, THE SYSTEM SHALL state, for
        each of the asset's named calendars, which period the selected
        date falls in.
      - THE SYSTEM SHALL keep the as-of selection in its query parameter
        as a calendar date, and SHALL NOT replace it with a period name.
      - THE SYSTEM SHALL bound the as-of date input to the range the
        embedded sequences cover, so that an out-of-range date cannot be
        chosen with the picker.
      - IF an as-of date outside that range arrives by URL, THEN THE
        SYSTEM SHALL say so plainly, state the covered range, and offer
        a one-click reset to the default.
    non_functional_requirements:
      - A schedule is CONFIG, not data, so this is a new embed that
        touches nothing about CLAUDE.md's CI-never-reads-data rule. That
        is worth stating explicitly, because a new embed into the
        dashboard build is exactly the shape that rule exists to catch.
      - Size the embed honestly. A daily asset over five years is
        roughly 1,800 period entries, which is negligible against a page
        already around 8MB - but it grows forever, so it should be
        measured rather than assumed.
      - Verify in a real browser, at the render layer. A correct Python
        derivation says nothing about a template with its own transform.
      - This is easy to discover late, and the symptom would be an
        as-of picker silently returning nothing on a quarterly asset -
        which looks like no data rather than like a bug.
    dependencies: [REQ-PIPE-051, REQ-DASH-041]
    decisions:
      - Decided to embed the period sequence for EVERY schedule, not
        only authored ones, and delete the browser-side reimplementation
        entirely. Thread C only requires embedding authored lists, since
        JS can compute a cadence rule - but keeping one path removes the
        duplicated cycleStartDate()/cycle_start() logic rather than
        leaving one of its two branches alive, and Thread D already
        noted that the duplicated-logic surface should shrink rather
        than grow under this model. THIS IS THE SCOPER'S OWN CALL, going
        slightly beyond the thread, and worth Keith reacting to at
        sign-off.
      - Recorded because it explains why the duplication existed at all
        and is not a mistake to undo carelessly - the as-of picker lets
        a viewer pick ANY date in the browser and a static site has no
        backend to ask, so a client-side computation was genuinely
        unavoidable while the schedule was a RULE. It stops being
        unavoidable once the schedule is a list, because a list can be
        shipped.
      - "[A1] Decided the embed carries every calendar rather than one
        sequence. With named calendars the as-of picker must know which
        calendar a dataset follows before it can do any period arithmetic
        for it - an embed of one merged sequence would be unusable and
        silently wrong for whichever calendar lost."
      - "Decided this moves to BATCH 6 rather than dropping its
        REQ-DASH-041 dependency (Keith, 2026-09-23). delivery-architect
        found it labelled sprint 6 - batch 2 - while depending on
        REQ-DASH-041, which carries no signed_off and belongs to batch
        6, so under the sign-off gate it could not be built where it
        sat. Rejected dropping the dependency and keeping it in batch 2,
        which was the scoper's and the main session's recommendation on
        the grounds that its period arithmetic depends only on schedule
        config. Rejected signing REQ-DASH-041 now to unblock it, which
        would have bypassed the read-back gate that caught five
        transcription errors the day before."
      - "The reason the recommendation lost is the same one that put
        every dashboard sprint last, and it is Keith's own [B2]
        reasoning applied consistently: building a view against a data
        shape still moving is how clipDatasetToAsOf() ended up filtering
        on arrival rather than promotion - correct only because
        promotion did not yet exist. Slot assignment and promotion are
        unbuilt, so the coordinates this picker reasons about are still
        moving. The accepted cost, stated plainly: the as-of picker
        silently returns nothing on a quarterly asset until batch 6."
      - "Decided the picker STAYS a plain date, with each calendar's
        period shown as context in the panel (Keith, 2026-09-23).
        Rejected adding a period picker alongside the date: it matches
        how a quarterly data owner actually talks, but a period name is
        ambiguous at asset level once several calendars exist - 2026-Q3
        from the quarterly calendar and 2026-09-22 from the daily one
        are different buckets that must not share a key - so it could
        only ever sit beside the date, not replace it. Showing the
        periods as context answers \"which quarter am I in\" with no new
        control, no URL change, and no existing shared link broken."
      - "Decided the date input is BOUNDED to the embedded range rather
        than handling the out-of-range case well. delivery-dashboard-ux
        found #asof-input has no min/max at all today, so nothing
        prevents it. Removing the error case beats handling it; the
        by-URL path still needs the recovery, since a bound on the input
        cannot constrain a pasted link."

  - id: REQ-DASH-056
    title: A dataset shows what arrived and what is actually promoted, not one
      standing for the other
    date_written: "2026-09-23"
    story: >
      As a data engineer triaging a red dataset, I want to see both the
      supply that just arrived and the one currently promoted, so that I
      can tell "their latest file is bad" apart from "the data everyone
      downstream is using is bad" - which today look identical.
    moscow: should
    status: not_started
    source: >
      Keith, 2026-09-23, during REQ-DASH-041's sign-off. Settling that
      the as-of view shows the most recent ARRIVAL rather than the most
      recently promoted supply left a gap he named immediately - "latest
      supply is red and staged, promoted version is Monday's. Yes, I do
      want that" - and agreed it is probably a requirement of its own
      rather than a criterion on 041.
    acceptance_criteria:
      - WHERE a dataset's most recent arrival is not the supply
        currently promoted, THE SYSTEM SHALL show both, and SHALL NOT
        show either alone.
      - THE SYSTEM SHALL make clear which of the two a status refers
        to.
      - WHERE a dataset's most recent arrival IS the promoted supply,
        THE SYSTEM SHALL NOT clutter the view with the distinction.
      - THE SYSTEM SHALL state, for an arrival that is not promoted,
        why it is not - whether it is awaiting a decision, was rejected,
        or cannot be promoted because its schedule has no slot for it.
      - THE SYSTEM SHALL compute this from committed history alone, with
        no live data access.
    non_functional_requirements:
      - >
        This is the operational state Keith's team actually manages,
        which is why it earns its own requirement rather than a
        footnote. A tile that says only "red" when the red thing is
        sitting unpromoted in staging tells a viewer the wrong thing
        about what downstream consumers are getting.
      - >
        It must not become a second status. There are already three
        quiet states and one deliberately-unorderable one, and
        REQ-PIPE-053's own experience is that anything landing in the
        nodata bucket vanishes from every rollup above it. This is
        additional INFORMATION on a dataset, not a new value in the
        status vocabulary that status-cases.json governs.
      - >
        At 30 datasets the common case is that arrival and promoted are
        the same supply, so the distinction has to be invisible when it
        does not apply, or it becomes noise that trains people to stop
        reading it.
      - Verify at the render layer in a real browser, both toolchains.
    dependencies: [REQ-DASH-041, REQ-PIPE-034, REQ-PIPE-038]
    decisions:
      - >
        Decided this is its own requirement rather than a criterion on
        REQ-DASH-041 (Keith, 2026-09-23). 041 is about supply history
        and as-of viewing holding up under per-dataset arrivals; this is
        a new thing to show, with its own empty state, its own wording
        and its own noise risk at 30 datasets.
      - >
        Decided it is INFORMATION rather than a status. The tempting
        implementation is a new status value meaning "arrived but not
        promoted", and that is how it would get swallowed - the status
        vocabulary is shared with the Python side through
        status-cases.json, and a fourth quiet state was explicitly
        forbidden on REQ-DASH-041 the same day.
    open_questions:
      - >
        Where it appears - the dataset tile, the detail panel, or both.
        A tile is where a viewer forms their first impression, which
        argues for it being there; but the Tier-2 row is already carrying
        an exhausted-schedule marker, and two annotations competing for
        one row is how a row stops being readable. Needs the dashboard
        UX pass rather than a decision here.

  - id: REQ-PIPE-057
    title: A delivery is recognised from the transport, and what it cannot place it reports
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As whoever maintains this pipeline, I want the pipeline to work out for itself what arrived together and to say plainly what it could not place, so that filing starts from an observed transport unit rather than from anything a supplier told us or the generator wrote down."
    moscow: must
    status: built
    source: "Keith, delivery sprint 7, plans/supply-model.md Thread B (the DELIVERY is the arrival unit) and Thread H second chaos pass, plus test scenario register TS-15 and TS-17. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "THE SYSTEM SHALL treat one delivery as one observed transport unit, and SHALL establish its boundary without reading the contents of any file in it."
      - "THE SYSTEM SHALL take what constitutes a delivery from per-source configuration, so that a source whose transport expresses a boundary differently can be described rather than assumed."
      - "IF a source's configuration does not state what constitutes a delivery for that source, THEN THE SYSTEM SHALL fail for that source naming the missing configuration, and SHALL NOT infer a grouping from filenames, timestamps or arrival proximity."
      - "THE SYSTEM SHALL treat a delivery as received only where our own receipt record for it exists."
      - "IF a delivery is present with no receipt record, THEN THE SYSTEM SHALL leave it unprocessed, SHALL continue processing every other delivery, and SHALL report it on every run as an informational observation."
      - "THE SYSTEM SHALL NOT require a configured interval, a file modification time, or any record of how long a delivery has been present, in order to decide whether to report a missing receipt."
      - "WHERE a delivery is present with no receipt record, THE SYSTEM SHALL commit, as an observation of that run, the delivery's name and the names of the files then present in it, and SHALL NOT record it as a delivery received."
      - "THE SYSTEM SHALL derive which collections a delivery is for from the datasets its own files were attributed to, WHERE one delivery may be for more than one collection."
      - "THE SYSTEM SHALL NOT derive the receipt instant, the period, the dataset, the collection or the processing order from a delivery's name."
      - "WHERE a delivery contains a file attributed to no dataset, THE SYSTEM SHALL record it as an unrecognised artefact, SHALL report it at WARNING level rather than informational, and SHALL NOT fail the delivery, check it or promote it."
      - "THE SYSTEM SHALL distinguish an unrecognised artefact, which matches no pattern, from an unexpected table, which matches a pattern for a dataset with no slot in that period, and SHALL report the latter as informational."
      - "IF a delivery contains a file asserting what that delivery is for, or a file resembling our own receipt record, THEN THE SYSTEM SHALL report it as an anomaly and SHALL NOT read any value out of it."
      - "IF no file in a delivery is attributed to any dataset, THEN THE SYSTEM SHALL report the delivery as unplaceable, and SHALL NOT fail the run."
      - "WHERE a delivery holds files attributed to more than one collection, THE SYSTEM SHALL attribute each file on its own dataset's terms, and SHALL NOT hold, reject or fail the delivery for spanning collections."
      - "THE SYSTEM SHALL record every artefact it declined to act on alongside the delivery it came in, so that a supplier changing their extract is visible rather than silent."
      - "WHERE no deliveries are present at all, THE SYSTEM SHALL report no arrivals and SHALL NOT fail."
      - "THE SYSTEM SHALL expose delivery recognition as a subcommand of a mothman command group of its own, named supply, and SHALL NOT place it under a group documented as not human-facing."
      - "THE SYSTEM SHALL keep a run's identity stable against a change in which deliveries are recognised, and SHALL NOT derive a run id from a delivery's position in a list that recognition can reorder or shorten."
      - "IF a change to recognition would alter the run id of any run already present in committed history, THEN THE SYSTEM SHALL fail, naming the affected runs, and SHALL NOT rewrite or silently re-key that history."
    non_functional_requirements:
      - "Recognition runs on every pipeline run and reads every delivery present. At ~30 datasets with years of history this is thousands of deliveries, and today's shape re-reads the whole tree once per collection - it must scale by reading each delivery once per run, not once per collection."
      - "Recognition must work on a freshly-cloned machine where data/ does not exist at all. A test that asserts a gitignored tree is present passes locally and fails in CI - a real red on 2026-09-23 - so absence is a state to handle, not a precondition to assert."
      - "A delivery's name and its file names are supplier-controlled input that become paths. They must be validated before use and never interpolated into a shell command, a SQL identifier or a path without validation. The PoC's names already include spaces and bare hex strings."
      - "An unrecognised artefact's NAME is recorded so a person can act on it; its CONTENTS are never read, never recorded and never rendered. A filename is itself potentially identifying in a Birth Registrations or Child Protection context, which is the reason to state where the line is rather than assume it."
      - "This repository is public and the dashboard is published to GitHub Pages, so anything recognition reports becomes public in this PoC even though the data is synthetic. Anything whose real-deployment equivalent would be sensitive should be judged on the real-deployment terms, not on today's."
      - "Everything that reads a delivery is invoked through mothman."
      - "CI and any read-committed-history path may never open or query anything under data/, so recognition belongs to the pipeline run, never to the dashboard build."
    dependencies: [REQ-GEN-043, REQ-PIPE-058]
    decisions:
      - "Decided a delivery is an OBSERVED TRANSPORT UNIT - one folder drop, one S3 prefix, one SFTP session - and that this is categorically different from the supplier-declared manifest Thread B rejected. Nobody is asserting anything; we are noticing what arrived together. The distinction is worth keeping sharp, because a format that read a declaration of intent would reintroduce the rejected design by a back door."
      - "Decided the delivery boundary comes from the TRANSPORT and must be stated PER SOURCE. A source that cannot express one - six unrelated S3 PUTs with no common prefix - needs a boundary arranged as a plumbing step: a folder convention, a trigger file, a batch endpoint. That is an operational transport arrangement rather than asking a supplier to classify their data, and TS-17 requires it be an explicit configuration failure rather than a silent guess at grouping."
      - "Decided our own receipt record doubles as the completeness marker, which is what makes a mid-upload delivery distinguishable from a short one. The files are the supplier's side of the boundary and a directory being watched while still uploading looks exactly like a partial delivery; the receipt is ours and is written when the arrival is complete. This falls out of the format REQ-GEN-043 already built rather than being new machinery."
      - "Decided an unexpected or unrecognised artefact is INFORMATIONAL rather than red (Keith, 2026-09-22, settling an earlier red-or-informational fork). It is not a data quality failure; it is a supplier telling us something changed without saying so. Rejected red, which would make a routine covering note look like bad data."
      - "Decided an unrecognised artefact must not break a delivery or block readiness, because both are defined over EXPECTED tables (TS-15, broadened by Keith to cover a test.png, a garbage filename, any artefact mapping to no slot at all)."
      - "Decided a delivery's NAME means nothing and is required to follow no pattern, so that recognition cannot pass by parsing a name we wrote ourselves (docs/delivery-format.md, REQ-GEN-043 criterion 15). The real generated set already contains spaces, bare hex strings and four different naming conventions."
      - "Decided nothing in the pipeline may read data/generator_bookkeeping.json. It knows which slot each delivery was built to fill, and a pipeline reading it would be filing from a declaration rather than from arrival plus slot state - the rejected supplier manifest wearing our own badge. Tests may read it; nothing that files a supply may."
      - >
        SETTLED 2026-09-24 (Keith): a delivery MAY span collections, and
        is not held, rejected or failed for doing so. Each file is
        attributed to its own dataset and handled on that dataset's
        terms. A supplier dropping two collections in one transport unit
        is an ordinary thing to do, not a malformed arrival.
      - >
        This CHANGES BUILT BEHAVIOUR twice over, and the second one is
        the part that is easy to miss. qa_tools/common/arrivals.py's
        classify() raises DeliveryFormatError on such a delivery, which
        additionally takes the whole run down because recognition walks
        the whole tree. But classify() also RETURNS A SINGLE
        collection_id, which arrivals_for() then filters deliveries on -
        so single-collection is structural in today's code, not just a
        guard to delete.
      - >
        CONSEQUENCE, accepted deliberately: RUN IDENTITY stops being
        one-to-one with a delivery. Run ids are assigned today from
        receipt order WITHIN a collection, so one delivery means one
        run. Once a delivery may span collections, one arrival
        contributes to two collections' run sequences - one delivery,
        two runs. That is the honest model rather than a compromise: the
        DELIVERY is the transport unit and the RUN is the per-collection
        QA unit, and they were only ever the same thing by coincidence
        of the PoC's own generated data. See REQ-PIPE-061 for the
        ordering scope this implies.
      - >
        REJECTED, having been the drafted position on 2026-09-23 and
        settled the other way by Keith on 2026-09-24: holding a
        mixed-collection delivery for a human. The argument was that a
        delivery spanning two collections means the TRANSPORT BOUNDARY
        itself is wrong rather than the data, so every arrival fact
        derived from that boundary is suspect. It does not survive the
        observation that spanning collections is legitimate, and a hold
        would stop healthy supply on a boundary that is working. What
        survives from that thread is only the blast-radius point, which
        is kept above and applies to every odd delivery: whatever
        recognition decides about one, it must not take the rest of the
        run down - the same shape as failing 29 healthy datasets for one
        exhausted schedule, which REQ-PIPE-053 exists to prevent.
      - >
        UNCHANGED by the above, and the distinction is the whole point:
        a delivery whose files land in different PERIODS runs QA and
        never auto-promotes - a human review gate, re-confirmed by Keith
        2026-09-24. It is NOT a criterion here, because recognition
        never knows a period: period comes from slot assignment
        downstream, which is why the gate is scoped as a PROMOTION rule
        in delivery sprint 11 (plans/supply-model.md item 11). Its
        condition is different PERIODS, not different SLOTS - an
        ordinary six-table Child Protection delivery already spans six
        slots, so an implementation keyed on slots passes TS-33a while
        failing TS-33b and blocks auto-promotion on every healthy
        multi-table delivery.
      - >
        SETTLED 2026-09-24 (Keith): the new supply commands live in a
        MOTHMAN COMMAND GROUP OF THEIR OWN, named `supply`, Tier 1 -
        not folded into `pipeline`, not bolted onto `schedule`. This
        requirement's recognition command and REQ-PIPE-060's staging
        load are its first two members; the human-action queue and
        sprint 12's decision commands join it.
      - >
        The argument had already run once and is recorded on
        REQ-PIPE-050, which this decision follows rather than re-derives:
        delivery-architect argued for folding into `pipeline` on
        taxonomy grounds and lost, because cli/pipeline.py's own
        docstring calls that group "not human-facing - for integration
        tests and for yourself", and someone draining a hold queue is
        exactly a human. That decision ALSO rejected the obvious
        compromise by name - "fold in now, move to a `mothman supply`
        group when batches 3-6 justify one - because moving a command
        later breaks whatever docs and muscle memory have formed, and
        renames are how a CLI surface rots". This is that batch, and
        that is the group it named.
      - >
        Rejected extending `mothman schedule` into a broader supply
        group, which would reuse a Tier 1 group a person is already in:
        its docstring states "Everything here is CONFIG ONLY. Nothing
        opens data/", and recognition and staging both open data/, so it
        would break that group's stated invariant.
      - >
        NAMING CAVEAT, accepted knowingly: a SUPPLY is the per-dataset
        unit and a DELIVERY is the transport unit, so a group called
        `supply` listing deliveries is a slight mismatch. Chosen anyway
        because it is plans/supply-model.md's own word for the whole
        model, and because REQ-PIPE-050's decision had already
        anticipated that exact name.
      - >
        SETTLED 2026-09-24 (Keith), and it is a standing division rather
        than three separate rejections: THE CLI DOES THINGS, THE
        DASHBOARD SEES THINGS, GITHUB ISSUES DECIDES THINGS. The
        `supply` group holds OPERATIONS - run recognition, stage a
        delivery, validate patterns, reprocess a failed load after a fix
        - against the operator's own working copy, which is where
        "local" is the right answer. Reading the state of the supply
        model is the dashboard's job.
      - >
        His reason, and it is stronger than the convenience argument it
        defeats: ANY COUNT OR QUEUE THE CLI SHOWED WOULD BE STALE BY
        CONSTRUCTION. The records live in committed history, so a local
        mothman reads the operator's CHECKOUT - a count as of whenever
        they last pulled, presented as though it were live. The
        alternatives are worse: silently wrong, or a CLI command that
        fetches, which turns a local operation into a network one. The
        dashboard has no such problem because CI builds it from the
        actual committed state and publishes it, so it is current for
        everyone by construction.
      - >
        Three specific proposals are therefore REJECTED, recorded by
        name because each reads as an obvious convenience and will be
        re-proposed: a bare-`mothman` MAIN MENU ENTRY for outstanding
        supply decisions carrying a live count (delivery-cli-ux's §6,
        which it called the batch's biggest workflow-fit gap); a
        `mothman supply status` READ SURFACE listing the human-action
        queue (its §5); and a CLI LOOKUP answering "why was this supply
        filed here" over REQ-PIPE-062 criterion 9's recorded branch and
        considered slots (its §7). All three are the dashboard's.
      - >
        CONSEQUENCE, named rather than discovered: the dashboard becomes
        the ONLY way to see a hold, and it is rebuilt by CI on push - so
        the latency between a hold appearing and a person being able to
        see it is a deploy. That is already true of everything else this
        dashboard shows, but it stops being incidental and becomes
        load-bearing here, because a hold is work waiting on a human
        rather than a status anyone is browsing.
      - >
        SETTLED 2026-09-24 (Keith), resolving pre-build Q10 and a gap
        underneath it: an in-flight delivery is committed AS AN
        OBSERVATION OF THE RUN, naming the delivery and the files then
        present in it. The dashboard renders it framed as at the last
        regeneration - his own words, "as at the time that this
        dashboard was last regenerated, there were X in-flight
        deliveries".
      - >
        THE GAP THAT MADE Q10 UNANSWERABLE AS POSED, recorded because it
        is not visible from any single criterion. Criterion 4 treats a
        delivery as received only where our receipt exists, and
        REQ-PIPE-069 writes the committed delivery file AT RECOGNITION -
        so an in-flight delivery, having no receipt, is never recognised
        and leaves NO COMMITTED TRACE AT ALL. Criterion 5 nonetheless
        requires it reported on every run, and this requirement's own
        CLI-does-things decision makes the dashboard the only reader of
        committed history. The thing that had to be reported had nowhere
        to land, so both drafted options - one row carrying a run count,
        a literal row per run - presupposed a trail this design never
        wrote.
      - >
        WHAT RESOLVED IT was changing the SUBJECT of the record rather
        than relaxing any rule. Committing "delivery X is in flight" is
        a permanent record about a delivery we have not accepted - the
        wrong shape, and it would sit in history beside records of
        things that actually happened. Committing "the run at 14:32
        observed these deliveries in flight" is a record about THE RUN,
        which genuinely happened and genuinely saw that. The as-at
        framing is then honest labelling rather than a caveat, and it is
        what the dashboard already is: CURRENT_AS_OF and the snapshot
        archive rest on the same premise.
      - >
        FILENAMES, not just the delivery name, and not a count. A count
        answers "is anything in flight"; the question worth asking is
        "is anything STUCK", which needs to distinguish three deliveries
        flowing through from the same three sitting there for a week.
        Filenames go further: a stuck delivery's diagnosis is usually
        WHICH files made it, so a file list going 2, 4, 6 across runs
        reads as an upload progressing and one stuck at 2 reads as one
        that died. Reading a directory listing records no contents,
        which is the same line this requirement already draws for an
        unrecognised artefact.
      - >
        REJECTED, having been this session's own recommendation: making
        the in-flight report CLI-ONLY terminal output, on the grounds
        that an in-flight delivery is transient by definition. It
        satisfies criterion 5 and needs no committed record, but it
        loses the one genuinely bad case - a delivery whose boundary
        never closes because something upstream is broken would be
        visible only to whoever ran the pipeline, never on the
        dashboard. In-flight being the NORMAL state is exactly what
        would have let a stuck one hide.
      - >
        CONSEQUENCE, named rather than discovered: these records CHURN
        in a way no other committed record here does. An in-flight
        delivery is mid-upload by definition, so its file list
        legitimately differs run to run - which is the signal, and also
        makes this the one committed record expected to change between
        observations rather than being written once and left alone.
      - >
        Criterion 6 is untouched by this. It forbids requiring a record
        of how long a delivery has been present IN ORDER TO DECIDE
        WHETHER TO REPORT; reporting stays unconditional on every run,
        and a reader deriving persistence from run history afterwards is
        not the decision input.
      - >
        SETTLED 2026-09-24 (Keith), closing a finding that had NO OWNER
        after the pre-build review and would have surfaced as a red CI
        run rather than as a design question. Criteria 18 and 19 now own
        RUN IDENTITY.
      - >
        The mechanism, verified rather than assumed:
        qa_tools/common/arrivals.py's arrivals_for() assigns
        run_id = f"{run_id_prefix}{index:03d}" from a delivery's
        POSITION in the receipt-ordered, collection-filtered list. This
        requirement changes what is in that list twice over - a
        receipt-less delivery becomes SKIPPED where today read_receipt()
        raises and takes every delivery with it, and a delivery spanning
        collections now joins TWO sequences. Every committed
        qa_results/<agency>/<dataset>/<run_id>/ path is keyed by that
        number, so a behaviour change in recognition RENAMES COMMITTED
        QA HISTORY.
      - >
        delivery-architect called this the likeliest "we found out when
        CI went red" item in the batch, and it is: the change looks
        local to recognition, the breakage is in paths nothing in this
        requirement mentions. Criterion 19 makes it a loud, named
        failure instead - listing the affected runs rather than
        rewriting them - because re-keying committed history is
        REQ-PIPE-038's job, under its own delete-and-regenerate rule and
        Keith's one-off regeneration exception, not something
        recognition may do as a side effect.
      - >
        Criterion 18 states the underlying rule rather than only
        guarding the symptom: a run's identity must not be derived from
        a position in a list that recognition can reorder or shorten.
        Written that way deliberately - a guard alone would leave the
        fragile derivation in place and turn every future recognition
        change into a history migration.

      - >
        SETTLED 2026-09-24 (Keith): a delivery with no receipt is
        skipped as in-flight and reported on EVERY run as an
        informational observation - no configured interval, no
        threshold, no state. Persistence becomes visible through
        repetition: if it is still there tomorrow you have seen it five
        times. Chosen over reporting only once it has persisted beyond
        an interval, which was the drafted criterion.
      - >
        Two things decided it. First, the hard error this replaces
        bundled two separate decisions - read_receipt()'s docstring
        justifies NEVER INVENTING A TIMESTAMP, which is right and
        stays, but that reasoning does not also justify taking the run
        down; only the second half was in question. Reproduced: one
        receipt-less directory makes list_deliveries() raise, so all 60
        deliveries become unreadable.
      - >
        Second, and it is why in-flight is the normal case rather than
        an edge: under a real transport a delivery has no receipt until
        OUR OWN BOUNDARY RULE says it is complete. In S3 a supplier PUTs
        objects and events fire per object; there is no
        delivery-is-finished signal, which is the boundary problem
        Thread B already flagged as needing an operational arrangement
        per source. So "files present, no receipt" means "we have seen
        files, the boundary has not closed" - the normal state of every
        delivery until it does, not an anomaly.
      - >
        The interval-based option also cost more than it looked. To know
        how long a delivery has persisted needs either a directory
        modification time - the exact signal this module refuses to
        trust for the receipt instant - or new persistent state counting
        runs. Reporting every run needs neither. Noted for contrast:
        Thread E's rejection of magic numbers does not automatically
        apply here, because there the threshold decided a FILING
        outcome and silently misfiled data, whereas this one would only
        decide when to complain. It was rejected on cost, not on that
        principle.
      - >
        Rejected writing the receipt BEFORE the files, which would make
        its absence genuinely anomalous. It works only because the PoC
        controls both sides. In a real deployment a supplier pushes over
        SFTP or S3 and we merely observe, so there is no moment at which
        a receipt could precede the files existing. Building on it would
        be a design that is safe only because today's data is
        synthetic, which is the shape Keith rejected for
        deploy-pages.yml.


      - >
        SETTLED 2026-09-24 (Keith): an unrecognised artefact - a file
        matching no pattern - is reported at WARNING level, not
        informational. His reasoning is that it is the mitigation for
        having no history gate: a pattern that is too narrow shows up as
        a repeated, prominent warning on the activity screen rather than
        as silence.
      - >
        The case that prompted it is his own, and it is the dangerous
        one: a catch-up delivery whose CURRENT cp_clients and
        cp_placements match their patterns but whose RESUPPLIES of the
        same tables use a different filename that does not. The matched
        files are attributed, assigned, QA'd and promoted as if they
        were the whole supply, while the unmatched ones raise only an
        informational note. A near-miss is silent; a match would have
        been a loud hold. That is a false-complete, which is the
        direction this design exists to eliminate.
      - >
        This does NOT overturn the 2026-09-22 decision that an
        UNEXPECTED TABLE is informational, and the distinction is worth
        keeping because the two sit adjacent in the same feed at
        different levels. An unexpected table MATCHES a pattern, for a
        dataset with no slot that period - fully understood, merely
        surplus. An unrecognised artefact matches NOTHING - not
        understood at all, and the dangerous reading is that it is a
        supply we failed to claim. Knowing what something is, is the
        difference.
      - >
        SCOPE, from delivery-architect 2026-09-24, carried here because
        it is larger than this requirement's wording implies:
        recognition must become A PASS WHOSE RESULT IS THREADED, not a
        function callers invoke. arrivals_for() is called from TEN sites
        today - cli/bdm.py, cli/cp.py, pipeline/load.py, both
        build_*_warehouses modules, both orchestrate_* modules and four
        run_* tool modules - and list_deliveries() re-reads every
        directory and every receipt on each call, with only
        _patterns_for cached. So the read-each-delivery-once-per-run NFR
        above is a refactor across all ten, not an optimisation inside
        one.
      - >
        Related, and the part most likely to be missed: Arrival.
        path_for() is called UNCONDITIONALLY at six of those sites, and
        REQ-PIPE-059 turns its DeliveryFormatError into an operational
        state. If the hold is handled only inside new code, a held
        dataset still takes mothman bdm qa's run listing down, because
        cli/bdm.py's load_manifest() calls path_for() inside a
        comprehension. The hold has to be handled where an Arrival is
        CONSUMED, not only where it is produced.
      - >
        SECURITY, three items, all cheap and structural rather than
        matters of care. (1) validate_delivery_name() exists but is
        applied only by write_delivery() - read_delivery() and
        read_receipt() do none, safe today only because the name comes
        from iterdir(). The mothman subcommand this requirement adds
        will take a delivery name as an ARGUMENT, which closes that
        loop: validate at the CLI boundary and re-check containment
        before opening. (2) An unrecognised artefact's NAME is recorded
        and its CONTENTS never are - make that structural by giving the
        anomaly record no field a content sample could go in, rather
        than relying on nobody adding one while debugging. (3) This repo
        is public and whatever is reported gets published, so the render
        path must reach the DOM via textContent, never innerHTML.
      - >
        Decided the in-flight observation is committed to its own
        `observations/in_flight/` tree rather than under qa_results/,
        which is keyed by agency and collection. An in-flight delivery
        has no collection - nothing in it has been attributed yet -
        so filing it under one would mean choosing a collection for a
        delivery precisely because we do not yet know what it is for.
      - >
        Decided NOTHING is written when nothing is in flight. "The run
        saw nothing" is the ordinary state of most runs, and a file per
        run saying so would be churn carrying no signal. Criterion 7
        asks for a record WHERE such a delivery is present, which is
        exactly this - and it means the churn the decisions above warn
        about only ever costs anything when there is something to say.
      - >
        Criterion 11 IS BUILT NARROWER THAN IT IS WRITTEN, and the
        narrowing is stated rather than left to be discovered. It says
        an unexpected table is one matching a pattern for a dataset
        with no slot IN THAT PERIOD; which period a supply fills is
        REQ-PIPE-062's answer and does not exist yet. What is built is
        a dataset with no slots AT ALL, which is the same event at a
        coarser grain and catches the case the criterion exists for -
        a supplier sending something nothing is owed from.
      - >
        `slots_for_dataset(...) != []` is the obvious spelling of "is
        anything owed from this dataset" and it RAISES: a cadence-rule
        calendar generates for ever, so asking it for slots with no
        horizon is a question with no answer, and it says so rather
        than picking one. slots.is_owed_supplies() answers the question
        actually being asked. Recorded because the obvious spelling
        looks right, and the failure is a traceback from three frames
        down rather than a wrong answer.
    unmet_criteria:
      - criterion: >-
          Criterion 18 - a run's identity is still derived from its
          position in the receipt-ordered, collection-filtered list
          that recognition produces.
        why: >-
          The criterion forbids that derivation and names no
          replacement. Keith's call, 2026-09-25, over two alternatives:
          a committed run-id map built here would be absorbed almost
          immediately by REQ-PIPE-069's delivery log, which is where a
          delivery gets a durable record of its own, and deriving an id
          from the delivery itself would re-key all 60 committed runs -
          which criterion 19 exists to prevent happening as a side
          effect. Criterion 19's guard IS built, so the fragile
          derivation now fails loudly rather than silently renaming
          history.
        owner: REQ-PIPE-069, where a delivery gets a committed identity
    linked_tests:
      - tests/test_arrivals.py
      - tests/test_cli_supply.py
      - tests/test_run_id_guard.py
      - tests/test_delivery_boundary.py
      - tests/test_in_flight_log.py
    implemented_by:
      - qa_tools/common/arrivals.py::recognise
      - qa_tools/common/delivery.py::survey
      - qa_tools/common/delivery_boundary.py::check_all
      - qa_tools/common/run_id_guard.py::check
      - qa_tools/common/in_flight_log.py::record
      - qa_tools/common/slots.py::is_owed_supplies
    evidence:
      - >-
        2026-09-25: criterion 19's guard was checked against the REAL
        committed history, not a fixture - today's recognition still
        assigns all 60 committed run ids to the same deliveries. It
        holds because every delivery in this PoC has a receipt and none
        spans collections, and the test says so in as many words, so a
        future failure reads as "that stopped being true" rather than
        as a mystery.
      - >-
        2026-09-25: that check was run BEFORE building anything, which
        is what turned a blocker into a non-event. The architect called
        run identity the likeliest "we found out when CI went red" item
        in the batch; establishing first that neither behaviour change
        touches a real run id meant the work could proceed without
        waiting on REQ-PIPE-038's re-keying.
      - >-
        2026-09-25: a receipt-less delivery used to take every OTHER
        delivery down with it - read_receipt() raises and the listing
        read them in a comprehension, so one incomplete upload stopped
        the whole pipeline. What did not change is the rule underneath:
        a receipt instant is still never invented from a file's
        modification time. Skipping and reporting keeps the rule and
        drops the collateral damage.
      - >-
        2026-09-25: a latent bug in this batch's own earlier work was
        found here and is worth recording as a testing lesson rather
        than a fix. The arrival-pattern gate called a function that
        does not exist, and nothing noticed: every real dataset
        declares a pattern so the line never ran, and the test written
        for it monkeypatched the function out. The test now exercises
        the real one.
      - >-
        2026-09-25: recognition reads each delivery ONCE per
        invocation. The CLI's first version called it three times per
        delivery - three passes over every file and three copies of
        every warning - against this requirement's own constraint to
        read each delivery once per run rather than once per
        collection.
      - >-
        2026-09-25: all ten mothman gates green, 1502 Python tests and
        294 JS tests.
  - id: REQ-PIPE-058
    title: A file's dataset comes from that dataset's own declared pattern, and the patterns are gated
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As whoever plumbs in a new dataset, I want to declare how that dataset's files are named and have the pipeline attribute them on that alone, so that adding a dataset is a configuration change rather than a code change, and so that two datasets can never quietly claim the same file."
    moscow: must
    status: built
    source: "Keith, delivery sprint 7 - the per-dataset filename pattern that maps a file to a table - plus Thread H second chaos pass #3, where his own instinct was a regular expression per dataset. docs/delivery-format.md is normative on the consuming side. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "THE SYSTEM SHALL attribute each file in a delivery to at most one dataset, using that dataset's own declared arrival pattern."
      - "THE SYSTEM SHALL match that pattern against the file's own name alone, and SHALL NOT use the delivery's name, its path or the file's position in it as any part of the match."
      - "THE SYSTEM SHALL hold one arrival pattern per dataset, in that dataset's own configuration, as a regular expression in a field of its own."
      - "THE SYSTEM SHALL NOT reuse the S3 keyPattern as the filename matcher, so that a transport concern and a filename concern stop sharing one value."
      - "THE SYSTEM SHALL anchor each pattern to the whole filename, so that an unanchored pattern cannot match a substring and attribute a file it was never meant to claim."
      - "THE SYSTEM SHALL evaluate patterns independently of the order they are declared in, so that no attribution depends on which pattern happened to be checked first."
      - "WHEN the configuration gate runs, THE SYSTEM SHALL fail if a dataset that has slots declares no arrival pattern."
      - "WHEN the configuration gate runs, THE SYSTEM SHALL fail if any filename in the committed delivery history matches more than one dataset's arrival pattern."
      - "IF a file matches more than one dataset's arrival pattern, THEN THE SYSTEM SHALL hold that file for a human, SHALL NOT attribute it to any dataset, SHALL report it at no lower than WARNING level, and SHALL NOT fail the delivery or the run."
      - "THE SYSTEM SHALL report a file matching no pattern as unrecognised, and SHALL NOT attribute it by elimination, by proximity or by the collections the rest of the delivery belongs to."
      - "THE SYSTEM SHALL allow one dataset's pattern to MATCH more than one file in a single delivery without erroring, and SHALL NOT silently take one of them, WHERE what then happens to those files is REQ-PIPE-059's hold rather than acceptance of both."
      - "THE SYSTEM SHALL record, with each attributed file, which dataset's pattern attributed it."
      - "THE SYSTEM SHALL expose the pattern gate through mothman check."
    non_functional_requirements:
      - "A supplier renaming their extract is ordinary. Changing the pattern must be a configuration edit with no code change, or the ~30-dataset case becomes a code change per supplier whim."
      - "Two datasets quietly claiming one filename produces a supply filed against the wrong table - the false-green direction, and nothing about it is visible by reading either contract on its own. The protection is a PAIR, and each half does a different job: the configuration gate gives early warning at edit time but only sees collisions a real filename has already witnessed, while the runtime hold sees every collision that actually occurs and is the half that cannot be bypassed. Neither alone is sufficient at 30 datasets."
      - "Supplier filenames are untrusted input matched against configured patterns. If the pattern form is a raw regular expression, a pathological pattern plus a long filename is a real denial of service, so either the form is constrained or the matching is bounded."
      - "Only ~30 datasets' patterns exist, but every file in every delivery is matched against all of them on every run. Keep the matching linear and cheap rather than compiling a pattern per file."
      - "Patterns are configuration a human writes rarely and reads under pressure, so the gate's failure message must name the two datasets and the example filename that collide, not just report a conflict."
    dependencies: [REQ-GEN-043]
    decisions:
      - "Decided the per-dataset pattern is the ONLY thing inside a delivery that carries meaning (docs/delivery-format.md). Everything else - the delivery name, file order, any file's contents - is either arbitrary or a judgment we refuse to read."
      - "Recorded because the settled instinct and the built code differ, and someone will otherwise implement one and find the other. Keith's own instinct in Thread H was a REGULAR EXPRESSION per dataset. What exists today is an arrivalPattern keyPattern shaped as an S3 key - bdm/birth_registrations_{date}.csv - whose LAST SEGMENT is reused as a filename matcher by qa_tools/common/delivery.py, with {placeholder} expanding to a non-separator run. The same configured value is read by two consumers with different semantics: file_arrival.py matches whole S3 keys, delivery.py matches bare filenames."
      - "FOUND WHILE SCOPING, and it matters for sprint 7's own test coverage: under the real committed patterns, Child Protection's six datasets match EXACTLY one filename each (cp_clients.csv and so on), so the split-extract shape docs/delivery-format.md lists as legitimate - cp_clients.csv alongside cp_clients_part2.csv - matches nothing at all, and the second file would be reported as unrecognised rather than triggering the duplicate-match hold. Verified by running the real matcher over the real patterns. Two files matching one dataset is therefore currently unreachable for Child Protection and reachable for Birth Registrations only because its pattern carries a {date} placeholder."
      - "Rejected attributing an unmatched file by elimination - for instance, assuming the one file in a Birth Registrations delivery must be Birth Registrations. It reads reasonable and it is how a garbage file quietly becomes a supply."
      - "Rejected deriving the dataset from the delivery's directory name, which is arbitrary by design and would make recognition pass by parsing a name we wrote ourselves."


      - >
        SETTLED 2026-09-24 (Keith): the arrival pattern is a REGULAR
        EXPRESSION in a field of its own, not the S3 keyPattern reused.
        His own instinct from Thread H, and the fork was decided on
        expressiveness. The drafted middle option - placeholders in a
        dedicated field - cannot express the split-extract shape without
        gaining optionality, then repetition, then alternation, which is
        reinventing regex badly.
      - >
        One objection to regex is recorded as OVERSTATED rather than
        accepted. It was raised as "regex over untrusted input", which
        implies an injection risk. WE author the pattern; the filename is
        the input. A ReDoS needs a pathological pattern AND crafted
        input, and the pattern is ours, so the real risk is us writing a
        subtly wrong one rather than a supplier attacking. Keith's call
        on that: "I'm kind of willing to accept the risk of someone
        stuffing up a regex."
      - >
        What makes that risk acceptable is that it is ASYMMETRICALLY
        PROTECTED. A pattern that is too BROAD means one filename can be
        claimed by two datasets, which the configuration gate already
        fails on. A pattern that is too NARROW is the dangerous one, and
        nothing catches it at config time - which is what the warning
        level on REQ-PIPE-057 now compensates for.
      - >
        REJECTED a second gate proposed in this conversation - that every
        file in the committed delivery history must still match exactly
        one pattern. Keith's objection is decisive and had been
        underweighted: a downstream extraction system can legitimately
        change its filename structure, and that is a change we WANT to
        accept. Such a gate would force the old pattern to be kept
        forever, so patterns could only ever grow alternations,
        accumulating every historical naming scheme across thirty
        datasets over years. It punishes exactly the change that should
        be cheap. So there is no HISTORY gate: the only gate over
        pattern CONTENT is the duplicate-attribution one, criterion 8.
        Criterion 7's missing-pattern check is a separate completeness
        gate and is untouched by this - the two are easy to read as
        contradicting each other, which is why the distinction is
        spelled out rather than left to the count.
      - >
        SETTLED AND DONE 2026-09-24 (Keith), resolving pre-build Q12 -
        the delivery_id collision the concept inventory called "actively
        hazardous" and scheduled for batch 1, where it was missed. The
        contract's arrivalPattern placeholders were renamed from
        {delivery_id} to {slot_id} in the same session, because this
        requirement rewrites that config block anyway and it was the
        cheapest moment it will ever be.
      - >
        The collision was narrower than the inventory recorded, and
        checking that is what made the fix small: REQ-GEN-042 had
        already done the vocabulary work, and generator/generate_runs.py
        emits slot_id carrying its own note that "One slot, many
        deliveries - which is why this is not called delivery_id any
        more". The CONTRACT was the last place still carrying the old
        word, and it was the dangerous one - the supply model uses
        DELIVERY for the observed transport unit, so anyone building
        recognition from this config would have read "delivery" and got
        the logical obligation instead.
      - >
        Verified safe to rename alone before doing it: the capture group
        is never read by name. file_arrival.py returns groupdict() as an
        opaque dict, and the only named lookup anywhere is run_id, in
        the two aws/ ingest handlers. The placeholder name is
        documentation of what that path segment holds, not an interface.
        Confirmed by running the real arrival-pattern tests afterwards -
        23 passed.
      - >
        NOT DONE, and deliberately: the VALUES in real paths still read
        "delivery_120". Changing them changes generator output and
        therefore committed history, which REQ-PIPE-038 regenerates
        wholesale under its own delete-and-regenerate rule - so that is
        where the values follow. The config is now honest about what the
        segment MEANS; the segment's contents catch up there. Recorded
        because a half-renamed concept is exactly the state a later
        reader would otherwise find and mistake for an oversight.
      - >
        ANTI-PATTERN, named because a builder can satisfy two criteria
        at once and still ship the failure they exist to prevent.
        Criterion 11 says one dataset's pattern matching several files
        must not error and must not silently take one; REQ-PIPE-059 says
        hold. Both read as MET if Arrival.path_for() is changed to
        return the FIRST file instead of raising - it no longer errors,
        and nothing appears to be chosen because the choice is invisible.
        A supplier's second file is then dropped silently, which is
        precisely what REQ-PIPE-059 exists to stop and what
        path_for()'s current docstring already refuses to do. Found by
        delivery-architect, 2026-09-24.
      - >
        docs/delivery-format.md IS NORMATIVE AND THIS REQUIREMENT WILL
        FALSIFY IT AGAIN, so it must be updated in the SAME change, not
        as a follow-up - leaving it stale makes the spec and the code
        disagree with nothing saying which wins.
      - >
        "AGAIN" because checking it on 2026-09-24 found it was ALREADY
        WRONG, before this requirement changes anything. It said a
        file's dataset comes from the arrivalPattern block "matched by
        qa_tools/common/file_arrival.py" - but the function that
        actually maps a filename to a dataset inside a delivery is
        qa_tools/common/delivery.py's dataset_for_filename().
        file_arrival.py matches whole S3 KEYS, the transport concern the
        aws/ handlers use. The normative doc named the wrong half of
        exactly the split criterion 4 exists to make explicit. Fixed
        the same day, independently of this requirement, and the
        correction is stated in the doc itself so a reader meets it.
      - >
        SCOPE, recorded because the NFR above is FALSE TODAY for one of
        the two datasets: Child Protection does not use pattern
        attribution at all. qa_tools/cp/build_cp_warehouses.py loads by
        hardcoded filename in a loop, while Birth Registrations goes
        through arrival.path_for(). So "changing the pattern must be a
        configuration edit with no code change" holds for BDM and not
        for CP until that loop is rewritten, which is part of this
        requirement's work rather than a separate tidy-up.
      - >
        SECURITY, from delivery-architect 2026-09-24, and it makes
        criterion 5's anchoring structural rather than a review item.
        The ReDoS residual Keith accepted is bounded mechanically, not
        by trusting the author: cap filename length before matching
        (anything over 255 characters is already invalid on every
        filesystem this runs on), compile every pattern ONCE at config
        load and raise a NAMED CONFIG ERROR rather than a stack trace at
        recognition time, and match with re.fullmatch rather than
        relying on authors remembering to anchor. Rejecting
        backreferences and nested quantifiers at the gate is optional;
        the length cap is not.
      - >
        RETIREMENT, so the right thing is deleted: criterion 4 forbids
        reusing the S3 keyPattern as the filename matcher, which retires
        qa_tools/common/delivery.py's _filename_pattern_to_regex - the
        one that takes only a key's LAST SEGMENT and expands
        {placeholder} to a non-separator run. qa_tools/common/
        file_arrival.py's _pattern_to_regex legitimately SURVIVES: it
        matches whole S3 keys with named groups and is the real
        transport concern aws/'s handlers use. Two matchers with
        different semantics is exactly what criterion 4 is separating,
        so say which one goes or somebody deletes the wrong one.

      - >
        SETTLED 2026-09-24 (Keith): duplicate attribution is caught by a
        PAIR - a configuration gate over the committed filename history,
        plus a runtime hold when a file actually matches two patterns.
        The drafted criterion said the gate must fail "if any filename
        can be attributed to more than one dataset", which is a
        universal claim over every string that could ever exist and is
        therefore not testable as written. Someone would have
        implemented the corpus version and believed they had
        implemented the universal one.
      - >
        REJECTED proving non-overlap properly. It is genuinely
        decidable - regexes are finite automata, so the question is
        whether two languages intersect, answerable by a product
        automaton - and it would catch a collision no real file has ever
        witnessed. The worked example is two patterns overlapping on
        exactly one shape of name: ^cp_clients(_part\d+)?\.csv$ and
        ^cp_.*_part\d+\.csv$ collide only on cp_clients_part2.csv, so a
        corpus check stays green until the day a split extract arrives.
        It lost on cost: Python's re offers nothing for this, so it
        means a library or a few hundred lines of automata code, AND it
        works only on the truly regular subset, so the pattern form
        would have to exclude backreferences and lookarounds - a second
        thing the gate must then enforce. What it buys over the pair is
        only EARLIER notice of a collision the runtime hold would have
        held anyway, before anything was filed.
      - >
        Why the runtime hold is the half that matters: it cannot be
        wrong. It does not care whether the pattern form is regular,
        whether the gate's own reasoning has a bug, or whether anyone
        remembered to run the gate. The corpus gate is nearly free on
        top and catches careless edits when they are cheapest to fix,
        which is why both are kept rather than the hold alone.
      - >
        Note this is NOT the history gate rejected above, and the
        distinction is easy to lose. That one demanded every historical
        file still match exactly one pattern, which forces a dataset's
        old naming to be carried in its pattern forever. This one only
        looks for OVERLAP between two datasets on known names, so a
        supplier renaming their extract is still free - old names simply
        stop matching anything, which is not a gate failure.
      - >
        Note also what the runtime hold is NOT. Criterion 11 covers ONE
        dataset's pattern matching TWO files, which is the legitimate
        split-extract shape. This is TWO datasets matching ONE file,
        which is always a configuration error. They are adjacent in the
        same code path and produce opposite correct behaviour.
      - >
        Decided the seven shipped patterns are BEHAVIOUR-EQUIVALENT to
        what the retired matcher matched, so this requirement moved
        WHERE a pattern lives without changing WHAT it claims. Narrowing
        one - `birth_registrations_\\d{4}-\\d{2}-\\d{2}\\.csv` rather
        than the equivalent `birth_registrations_[^/]+\\.csv` - reads
        like an improvement and is the dangerous direction: nothing at
        config time catches a pattern that is too narrow, and the
        consequence is a real supply silently unrecognised. Narrow
        deliberately, in its own change, not while moving house.
      - >
        Decided against widening Child Protection's patterns to accept
        the split-extract shape - `cp_clients_part2.csv` matches nothing
        today and stays that way. It would be a one-character change and
        it is a product decision, not a refactor: a file that is
        currently reported as unrecognised would start being filed as a
        supply.
      - >
        YAML TRAP, recorded because it cost real time and will recur:
        the patterns are SINGLE-quoted in contract/data-asset.yaml,
        because YAML reads `\\.` inside a DOUBLE-quoted scalar as an
        unknown escape and refuses to parse the file at all. The same
        family as the check-yaml hook's own founding incident.
      - >
        The schedule gate caught the new key before any test did, and
        that is the strict-allowlist design working exactly as written -
        "an unknown key is accepted nowhere here precisely because a
        dropped one is invisible". Adding `arrival_pattern` to
        DatasetConfig is what makes it configuration rather than a typo;
        it is optional THERE because a dataset can coherently exist
        while its pattern is being added, and whether one that is owed
        supplies may go without is this requirement's own gate.
    linked_tests:
      - tests/test_arrival_patterns.py
      - tests/test_arrivals.py
      - tests/test_delivery.py
    implemented_by:
      - qa_tools/common/arrival_patterns.py::attribute
      - qa_tools/common/arrival_patterns.py::compiled_patterns
      - qa_tools/common/validate_arrival_patterns.py::validate
      - qa_tools/common/delivery.py::files_by_dataset
      - qa_tools/common/arrivals.py::recognise
    evidence:
      - >-
        2026-09-25: Child Protection moved OFF a hardcoded filename loop
        and onto pattern attribution, which is what makes this
        requirement's own non-functional claim - changing a pattern is a
        configuration edit, not a code change - true for both datasets
        rather than one. Verified against real data: a full CP pipeline
        run staged all six tables for all 18 runs by attribution, and
        3204 recorded check verdicts came back identical to the
        committed history the loop produced.
      - >-
        2026-09-25: criterion 8's GATE EXISTS AND HAS NO CORPUS YET, and
        it says so in its own output rather than reporting a clean pass
        - "no committed delivery log yet (REQ-PIPE-069), so nothing to
        check for duplicate attribution". The corpus is the delivery
        log, which is three requirements away in the build order, so
        today the configuration half catches a pattern that will not
        compile and a dataset owed supplies with none. The half with
        teeth today is the RUNTIME HOLD, which is the half that cannot
        be wrong: it does not care whether the gate has a corpus, or
        whether anyone remembered to run it.
      - >-
        2026-09-25: the runtime hold is asserted end to end - two
        datasets configured to claim one filename produce a warning
        naming the file, attribute it to neither, and do NOT fail the
        delivery. Failing would mean one bad pattern stopping every
        other supply in the same drop, which is worse than a held file
        somebody has to look at.
      - >-
        2026-09-25: criterion 6 is tested by REVERSING the declaration
        order and asserting the same answer, and criterion 5 by feeding
        a pattern an unanchored author would have written - `re.fullmatch`
        makes the anchoring structural rather than a review item.
      - >-
        2026-09-25: criterion 4's retirement is a real check rather than
        a note - a test asserts the keyPattern-as-filename matcher is
        gone from delivery.py AND that file_arrival.py's S3 key matcher
        survives. Saying which one goes is what stops somebody deleting
        the wrong one.
      - >-
        2026-09-25: all ten mothman gates green - the new `patterns`
        gate among them - with 1465 Python tests and 294 JS tests.
  - id: REQ-PIPE-059
    title: Two files for one dataset in one delivery are held, never chosen between
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an operator, I want the pipeline to stop and ask when one delivery contains two files that could both be the same table, so that a supplier's second file is never dropped by whichever one the loop happened to see last."
    moscow: must
    status: built
    source: "Keith, 2026-09-22, plans/supply-model.md Thread H second chaos pass #3 - 'hold for a human', tied by him to the not-yet-designed filename-to-dataset mapping. Delivery sprint 7. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "IF more than one file in a delivery is attributed to the same dataset, THEN THE SYSTEM SHALL hold that dataset's supply for a human, and SHALL NOT choose between the files."
      - "WHEN a supply is held this way, THE SYSTEM SHALL continue to process every other dataset in the same delivery."
      - "WHILE a supply is held, THE SYSTEM SHALL NOT assign it a slot, classify its arrival or promote it."
      - "WHEN a supply is held, THE SYSTEM SHALL record the delivery, the dataset and every file that matched, so that a person can see exactly what it could not choose between."
      - "THE SYSTEM SHALL report a held supply as an event needing action, distinguished from an informational one."
      - "WHILE a dataset's supply is held, THE SYSTEM SHALL leave that dataset's slot unfilled, so that the slot goes overdue in the ordinary way."
      - "IF a later delivery for the same dataset arrives while a hold is outstanding, THEN THE SYSTEM SHALL process the later delivery normally, and SHALL NOT discard or automatically resolve the held one."
    non_functional_requirements:
      - "A hold is a work queue entry, not an obstruction - the same reasoning that made a queue of red supplies the correct output of the promotion gate rather than a defect in it. It must be visible enough to be drained and must not stop anything else."
      - "At 30 datasets, holds must aggregate rather than produce one banner each. Two outstanding holds and twenty are different situations and must read differently without twenty separate elements."
      - "The held files stay where they are, on the supplier's side of the boundary. Nothing is copied, renamed or merged while a hold is outstanding, so resolving it later has the original material to work from."
    dependencies: [REQ-PIPE-058, REQ-PIPE-057]
    decisions:
      - "Decided HOLD FOR A HUMAN (Keith, 2026-09-22). A supply is one table VERSION, so a delivery containing two versions of one table is ill-formed, and 'whichever the loop saw last' is what you get by default."
      - "Rejected merging or concatenating the two files. A supply is one table version; concatenating two would manufacture a supply that never arrived, which is the same category of untruth as recording a missed delivery as met."
      - "Rejected taking the newest, the largest or the lexically last file. Every such rule is a guess dressed as a policy, and the failure is silent - the dropped file is exactly the one a supplier will later say they sent."
      - "Decided this hold, rather than a separate mechanism, is also what catches a delivery carrying two periods of the SAME table - a catch-up drop with August's and November's cp_clients is two files matching one dataset's pattern, so nothing reads a declared period and no new machinery is needed (Thread H second chaos pass #4). The residual case, different tables landing in different periods, is a promotion gate in sprint 11."
      - "Decided the built behaviour already refuses rather than guessing: Arrival.path_for() raises when a dataset matched several files, with its own docstring saying that taking the first would silently drop a supplier's second file. This requirement turns that refusal into a handled operational state instead of an exception."
      - "The TUI affordance Keith asked for - run QA on the held files and decide which slot each belongs to - is the write path, and belongs with the decision log in sprint 12. Recorded here so the hold is not built as a dead end."

      - >
        SETTLED 2026-09-24 (Keith), answering the open question this
        requirement carried, and REQ-PIPE-064's identical one, together.
        A held supply IS LOADED into staging but is NOT QA'd
        automatically. Keith's reasoning, which is sharper than the
        options as drafted: the single-table checks could run without a
        period, but drift and previous-period comparison cannot, so
        partial QA produces a verdict that has to be thrown away once
        the slot is known - and worse, possibly a GREEN one sitting in
        history against no period at all.
      - >
        The resolution path, and it is what stops the hold being a dead
        end: the hold surfaces as an event needing action; a human then
        either ASSIGNS each file to a slot, or REJECTS one of them
        (Keith added the reject case, 2026-09-24). Assignment is what
        unblocks QA, which then runs against the right period's schema.
        So this is not simply "no checks until filed" - there is a
        human-initiated path, and it is the same act as resolving the
        hold. The write path itself belongs with the decision log in
        sprint 12.
      - >
        What the run actually does meanwhile, worked through on Keith's
        own eight-file Child Protection example (cp_clients and
        cp_placements each arriving twice): the two duplicated datasets
        get no view, because REQ-PIPE-035 now forbids choosing between
        candidates, so they are unqueryable for that run. The other four
        datasets are processed, assigned and QA'd normally. Any
        cross-table check reading a held table reads RED naming it -
        which for cp_clients is real and not hypothetical, since
        cp_notifications, cp_investigations and cp_placements all carry
        a referential check against it. Holding one table reddens checks
        on others; the blast radius is not zero, it is scoped to what
        actually depends on the held thing.

      - >
        SETTLED 2026-09-24 (Keith): HOLD EVERY TIME, including the
        legitimate split extract, and accept the recurring cost. A
        supplier who routinely splits one table generates a hold per
        period, per dataset, indefinitely - he chose this knowing that,
        because a proper splitting mechanism is the real answer and a
        hold is the honest placeholder until one exists.
      - >
        Two real supply shapes are therefore explicitly OUT OF SCOPE for
        this PoC, both landing in this hold today and both logged as
        future requirements - plans/running-thoughts.md #39 (a supplier
        splits one table across several files, which we would stitch
        back together on load) and #40 (DELTA supplies, a dataset
        arriving as add/update/delete files rather than a full table).
        Keith's own words on both: "develop a proper splitting mechanism
        and deltas later".
      - >
        The delta shape is the larger of the two and is flagged here
        rather than only in the thought, because it contradicts this
        requirement's own foundation. A split extract is still one table
        VERSION cut into pieces. A delta is not a table version at all -
        it is a change set against a previous state - so "a supply is
        one table version", which is what justifies holding rather than
        merging, stops being true. Promotion, drift and the meaning of a
        green verdict all change with it.
      - >
        Recorded because the repo now carries a real, deliberate tension
        that will otherwise read as a defect: docs/delivery-format.md
        lists two files matching one dataset's pattern as one of three
        shapes a delivery may LEGITIMATELY contain. That stays true of
        what we may RECEIVE. What this requirement settles is that we
        will not PROCESS one unattended, which is a different claim -
        and the format doc now says so inline.
      - >
        REJECTED, for now rather than on principle, letting a dataset
        DECLARE that it arrives in parts: a config flag, parts
        concatenated on load, a single file then being the anomaly. It
        handles real split extracts cleanly but reintroduces exactly the
        merging this requirement rejects as manufacturing a supply that
        never arrived, so it needs a stated reason rather than being
        slipped in as configuration. ALSO REJECTED for now: hold once,
        remember the resolution, stop asking. Best ergonomics of the
        three and the likeliest eventual answer, but it needs the
        decision log from sprint 12 to exist first.

      - >
        Decided BOTH FILES STAGE UNDER DISTINCT PHYSICAL NAMES, which
        is not a detail: one name for both means the second overwrites
        the first, so the hold would have nothing left to resolve WITH.
        That is the exact failure the hold exists to prevent,
        reintroduced one layer down and invisible from anywhere the
        hold is reported.
      - >
        Decided "staged but not checked" is enforced by the MECHANISM
        rather than by remembering. REQ-PIPE-068 creates no view where
        a logical name has several candidates, so a held dataset is
        simply unreadable for that run - there is no code path that has
        to know a dataset is held in order to skip QA on it.
      - >
        Criterion 6 and half of criterion 3 are currently satisfied BY
        ABSENCE, which is worth stating rather than claiming as
        enforcement: nothing assigns slots (REQ-PIPE-062) or classifies
        arrivals (REQ-PIPE-066) yet, so a held supply cannot fill a
        slot or be classified because nothing fills or classifies
        anything. They need re-checking when those land, and the tests
        here assert what IS enforced today rather than implying more.
      - >
        The refusal itself was already built and already right -
        Arrival.path_for() has always raised rather than taking the
        first file, with its own docstring saying why. What was wrong
        is that it arrived as an EXCEPTION, from six unconditional call
        sites, so one ill-formed delivery took every other arrival down
        with it. This requirement turned a correct refusal into a
        handled state.
    linked_tests:
      - tests/test_holds.py
      - tests/test_delivery_log.py
      - tests/test_arrivals.py
    implemented_by:
      - qa_tools/common/holds.py::holds_in
      - qa_tools/common/holds.py::held_datasets
      - qa_tools/common/arrivals.py::Arrival
      - qa_tools/common/supply_db.py::staged_table
      - qa_tools/common/delivery_log.py::record
    evidence:
      - >-
        2026-09-25: the loader rewrite this needed - staging every file
        a dataset matched rather than the one path_for() returned - was
        proved behaviour-preserving against real data. A full pipeline
        run over both collections diffed 6563 recorded check verdicts
        against the committed history it replaced, with no differences
        at all.
      - >-
        2026-09-25: the overwrite hazard is asserted rather than
        reasoned about. A test stages two files for one dataset and
        confirms two physical tables exist - because one name for both
        loses a file silently, and the hold would then be reporting on
        material that is no longer there.
      - >-
        2026-09-25: "not QA'd" is asserted the way it is enforced - a
        test stages both halves, builds the run's views, and confirms
        the logical name resolves to nothing and that querying it
        raises. Nothing in the QA path knows what a hold is.
      - >-
        2026-09-25: criterion 2 is tested with a held delivery sitting
        beside a healthy one, because the failure it replaces was an
        exception from six unconditional path_for() call sites that
        took the whole run down.
      - >-
        2026-09-25: the shape is currently UNREACHABLE for Child
        Protection and reachable for Birth Registrations, and the tests
        say so rather than working around it - CP's patterns match
        exactly one filename each, so a second file is an unrecognised
        artefact rather than a hold, while BDM's carries a placeholder.
        Recorded because a future session widening a CP pattern needs
        to know that is what makes the hold reachable there.
      - >-
        2026-09-25: all ten gates green, 1533 Python tests and 294 JS
        tests.
  - id: REQ-PIPE-060
    title: Staging asserts only arrival facts, and a table is there or it is not
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As whoever maintains this pipeline, I want every arriving file loaded into staging on the strength of arrival alone, so that a supply is checkable before anybody has decided where it belongs, and so that staging can never be wrong about anything."
    moscow: must
    status: built
    source: "Keith, delivery sprint 8, plans/supply-model.md Thread B - staging then promotion, and 'staged data lives IN the warehouse', settled 2026-09-23 at REQ-PIPE-034's sign-off. Test scenario register TS-12 and TS-32. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    linked_tests:
      - tests/test_load_log.py
      - tests/test_staging_loads.py
      - tests/test_supply_db.py
      - tests/test_cli_supply.py
    implemented_by:
      - qa_tools/common/load_log.py::record_load
      - qa_tools/common/load_log.py::loaded_tables
      - qa_tools/common/load_log.py::delivery_is_processed
      - qa_tools/common/asset_time.py::arrival_key
      - qa_tools/common/supply_db.py::staged_table
      - qa_tools/common/supply_db.py::candidates_in
      - qa_tools/common/supply_db.py::expected_tables
      - qa_tools/bdm/build_per_run_warehouses.py::build_one
      - qa_tools/cp/build_cp_warehouses.py::add_table_to_run
      - cli/supply.py::load_command
      - cli/supply.py::failures_command
    evidence:
      - >
        2026-09-25: behaviour-preserving, measured rather than argued. A full
        `mothman pipeline run` over both collections after the rewrite diffed
        6563 recorded check verdicts against the committed history it replaced -
        identical, every one, with the status mix unchanged at 5235 pass / 1081
        fail / 247 warn. The physical table names and timestamps changed; no
        verdict did.
      - >
        2026-09-25: the real staging run wrote 150 load records for 60 deliveries
        (42 Birth Registrations arrivals plus 18 Child Protection arrivals of six
        tables each), and `mothman supply deliveries` reports 60/60 complete
        against what recognition says each delivery should have produced.
      - >
        2026-09-25: a second `mothman supply load` immediately afterwards wrote
        ZERO new records and re-staged every table, which is the bound on this
        committed tree. Found by running it, not by reading it - the first
        version wrote 42 duplicate records for a run in which nothing had
        changed.
      - >
        2026-09-25: criterion 7 is asserted at the layer a check actually reads.
        A test stages a table, deletes its load record, rebuilds the run's views,
        and confirms the real DuckDB catalogue raises on the view while the
        TABLE is still physically present - which is the whole distinction the
        mechanism rests on.
      - >
        2026-09-25: criteria 5 and 6 tested against a real failed load. A missing
        file leaves no table, writes a FAILED record naming the reason, writes no
        LOADED record, removes a stale table left by an earlier attempt, and the
        next file in the same delivery still stages.
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    acceptance_criteria:
      - "WHEN a delivery is recognised, THE SYSTEM SHALL load every file it attributed to a dataset into one global staging schema, before any check runs over that delivery."
      - "THE SYSTEM SHALL record, for a staged table, only facts observed at arrival - which delivery carried it, which dataset it was attributed to, and when we received it."
      - "THE SYSTEM SHALL NOT record a period, a slot or a supersession relationship at load time."
      - "THE SYSTEM SHALL name each staged table uniquely per arrival, carrying that arrival's instant, and SHALL NOT overwrite a table staged from an earlier arrival of the same dataset."
      - "IF a file cannot be loaded at all, THEN THE SYSTEM SHALL create no table for it, SHALL record the arrival and the reason it could not be loaded, and SHALL report that dataset's supply as red."
      - "WHERE one file in a delivery cannot be loaded, THE SYSTEM SHALL still stage every other file in that delivery."
      - "THE SYSTEM SHALL make a staged table visible to a check only once that table's load record exists, so that an interrupted load leaves nothing a check can read."
      - "IF a load is interrupted, THEN THE SYSTEM SHALL leave that delivery in a state the next run can process from the beginning, and SHALL NOT treat a partially-staged delivery as staged."
      - "THE SYSTEM SHALL NOT run two writing processes against one database file at the same time, and WHERE staging would otherwise fan out across parallel workers, THE SYSTEM SHALL stage sequentially."
      - "THE SYSTEM SHALL trigger checks from the arrival of a delivery, and SHALL NOT trigger them from a promotion."
      - "THE SYSTEM SHALL use only our own receipt instant as a supply's arrival time, and SHALL NOT use a timestamp inside the supplier's files, a column in their data or a file modification time."
      - "THE SYSTEM SHALL expose the staging load as a subcommand of the mothman supply group."

      - "THE SYSTEM SHALL record each table's load outcome as its own committed record, written only after that table's load is durable."
      - "THE SYSTEM SHALL NOT write a table's load record before its load is durable."
      - "THE SYSTEM SHALL treat a table with no load record as unloaded, and SHALL replace whatever is present for it rather than trusting it."
      - "THE SYSTEM SHALL consider a delivery processed only where every file attributed to a dataset has a load record."
      - "THE SYSTEM SHALL NOT automatically retry a load recorded as failed."
      - "WHERE a load is recorded as failed, THE SYSTEM SHALL surface it as needing human action, resolvable either by rejecting that supply or by reprocessing it after a fix."
      - "WHEN a failed load is reprocessed, THE SYSTEM SHALL write a new load record rather than editing the failed one, and SHALL take the latest record for that table as current."
      - "THE SYSTEM SHALL store load records in committed history alongside the delivery log, outside the per-dataset QA results."
    non_functional_requirements:
      - "A crash between the staging load and QA currently has no defined behaviour, and the failure is silent in the worst direction: a truncated table in a global staging schema is indistinguishable from a real short supply and would be checked as real data. Loading must be all-or-nothing per table, and a partially-processed delivery must be recognisable as such."
      - "DuckDB permits one PROCESS per database file - verified: while one holds a read-write connection a second writer fails AND a read-only reader fails with 'IO Error: Could not set lock on file'. mothman pipeline run fans out over a ProcessPoolExecutor and is parallel by default, and the per-run databases that provide isolation for free today are removed by REQ-PIPE-035 - so from this sprint on, two workers of a SINGLE invocation would collide on the file lock. Staging therefore runs sequentially, which is sufficient here and costs a flag that already exists. The concurrency problem this NFR used to call a hard blocker lands at sprint 15, with dbt as a second writing process, and belongs there."
      - "The global staging schema is new, spans every agency, holds every supply ever received including ones that were wrong, and is never emptied. In a real deployment it is the most sensitive artefact this design creates after the period schemas: an extract containing columns nobody should have sent sits there permanently. Retention is deliberately out of PoC scope, and that deferral belongs in the register rather than only in prose due for deletion."
      - "Staging only grows. At ~30 datasets on a quarterly asset plus a daily one, with years of history and a new table per arrival rather than an overwrite, the table count is the thing that grows fastest in this design - so nothing may require enumerating every staged table to answer an ordinary question."
      - "CI and any read-committed-history path may never open or query the warehouse, including staging. Anything a later read needs must be computed here, at load time, by whoever legitimately has a connection, and committed alongside."
      - "Everything that loads a delivery is invoked through mothman."
    dependencies: [REQ-PIPE-057, REQ-PIPE-035]
    unmet_criteria:
      - criterion: >-
          Criterion 5, in part - a file that cannot be loaded leaves no
          table, records the arrival and the reason, and is listed by
          `mothman supply failures`, but nothing yet renders that
          dataset's supply as RED to a reader of the dashboard.
        why: >-
          The load side is done and durable. What is missing is the
          presentation, and it already has an owner: REQ-DASH-070
          criterion 1 names a failed load among the things that must
          appear in one aggregated element for a human decision.
          Building a second, different red for it here would be the
          thing that requirement exists to prevent. Flagged rather than
          quietly counted as done.
        owner: REQ-DASH-070, this same batch
    decisions:
      - "Decided staging is a SCHEMA IN THE WAREHOUSE (Keith, 2026-09-23). Thread B said 'everything lands in staging on arrival' without saying where staging physically is, and the natural reading of 'promotion moves it into a period schema' is that staging sits somewhere else. It does not. Data is loaded as soon as it can be, checks run on it there, and the only thing not loaded is a file that cannot be read at all."
      - "Decided ONE GLOBAL staging schema rather than one mirroring slots or periods, and the REASON is recorded here because REQ-PIPE-034 records the departure from Keith's operational system without it - which is the worst combination, since a later session sees the difference, finds no argument, and corrects it back. A supply's slot is not known when it lands, and deferring that is the whole point of staging. A slot-mirrored staging schema forces the slot to be named at LOAD time. Three cases have no slot to name at all: an early supply not yet inside its claim window, a supply held because nothing is confidently claimable, and a mixed-period delivery. A mirror would need an unassigned schema alongside it, ending up with global AND mirrors. Keith's own summary on agreeing: we don't know where it should go, or indeed we need a human to make a decision."
      - "Decided staging asserts only the thing actually known - this landed at this time - so it can never be wrong. Rejected 'file by arrival, with the period as correctable metadata', which was argued as avoiding freezing a derived judgment into an immutable structure; it lost its force once tables could move between schemas, because then nothing expensive is being frozen."
      - "Decided an unloadable file gets NO TABLE (Keith, 2026-09-23, directly): there is no point creating an empty one when the delivery record already says something arrived and could not be read. The arrival is a fact; the table is not."
      - "Decided 'failed to load' is a CHECK RESULT, not a separate concept. An invalid CSV, a missing file, zero bytes, a bad encoding, a schema that does not match are all red findings on that table, and no separate taxonomy of failure is needed."
      - "Decided a resupply is a NEW TABLE in the same schema, never an overwrite, and that physical table names carry the arrival instant - matching Keith's real operational database. Recorded because the cheapest implementation is the wrong one: build_cp_warehouses.py does CREATE OR REPLACE today, which would satisfy a read-the-newest rule by keeping exactly one version and destroying the history that rule exists for."
      - "Decided ARRIVAL triggers checks, never promotion, because promotion-as-trigger LOOPS - a promotion decision made on a check result that was itself triggered by a promotion. No requirement held this; REQ-PIPE-036 carries delivery-triggered QA without the reason it is not the other way round."
      - "Decided a delivery is loaded as one package and is not atomic in the roll-back sense: the five-tables-land-one-fails case requires the five to be staged and checked, so a failed sixth does not refuse the delivery (TS-12, which Keith called 'a really important one' from real operational experience)."
      - "Decided RETENTION IS EXPLICITLY OUT OF SCOPE for the PoC (Keith, 2026-09-23): staging and rejected only grow, and that is accepted - 'we'll need that eventually but it's not a priority right now'. The future question he named is not just dropping data but whether QA history is kept alongside it, kept after it, or dropped with it. Recorded as a deliberate no rather than an unasked question."

      - >
        BUILD ORDER SETTLED 2026-09-24 (Keith): SPRINT 13 IS SPLIT. Its
        single-database half - retiring the per-run warehouses, one
        database per test worker - moves forward to sit with staging at
        sprint 8, because staging has nowhere to stage into without a
        durable database holding a staging schema. The schema-per-period
        half stays at sprint 13.
      - >
        Rejected building staging against today's per-run databases and
        migrating at 13: it is the only option that builds the same
        thing twice, and the second build is not a refinement but a
        replacement under a model the first one contradicts - per-run
        databases are exactly what REQ-PIPE-035 removes. Also rejected
        moving sprint 8 later, which does not move one sprint but four:
        sprints 9 and 10 both assume arrivals are staged, so the whole
        filing chain slides.
      - >
        Also rejected moving sprint 13 forward WHOLE, which was the
        scoper's recommendation. Sprint 13 is two things, and only one
        of them staging needs. Moving both would build the period
        schemas before slot assignment exists to fill them - shelves
        years before anything decides what goes on them.
      - >
        WHY THE SPLIT IS SAFE, and the condition that would break it,
        stated because it was verified rather than assumed. Thread J's
        argument for retiring per-run databases is that schema-per-period
        supplies the same ISOLATION. Moving the single-database half
        forward without it leaves a window with one database and no
        per-run isolation, which is survivable ONLY because nothing runs
        QA between sprint 8 and sprint 15. The same reason disposes of
        the verified one-process-per-database blocker here: dbt is the
        concurrent writer, and it does not run until QA does. If QA ever
        moves earlier than sprint 15, this split stops holding and both
        halves must move together.

      - >
        SETTLED 2026-09-24 (Keith): a committed PROCESSING LOG, one
        record per table, written only after that table's load is
        durable. His words - the safer and more boring option - and he
        refined the drafted version from per-delivery to PER TABLE,
        which is what closes the hole.
      - >
        Rejected deriving completeness from the warehouse catalogue,
        which had been the recommendation. The catalogue says a table
        EXISTS, not that it is COMPLETE, and the failure lands exactly
        at the boundary: crash after three of six tables leaves three
        present, correctly read as partial; crash during the LAST table
        leaves six of six present with one truncated, read as complete
        and skipped forever. A truncated table in staging is
        indistinguishable from a genuinely short supply and would be
        QA'd as real data, which is the precise failure this question
        exists to prevent.
      - >
        Also rejected loading a delivery's tables in ONE TRANSACTION,
        which would have dissolved the partial state entirely - verified
        by experiment that DuckDB DDL is transactional and that a real
        SIGKILL before COMMIT leaves no tables at all on reopen, not
        even truncated ones. Keith's objection is about scale rather
        than correctness: some deliveries carry very large tables, and
        the whole-delivery transaction rests on an untested assumption
        about memory and WAL. The experiment is recorded because it
        would become the better answer if that assumption were ever
        measured and held.
      - >
        THE ORDERING IS THE LOAD-BEARING PART and deserves its own
        criterion because the two orders look identical in review and
        fail in opposite directions. Record AFTER the load is durable -
        a crash between them re-loads a table that was already fine,
        which is wasteful and safe. Record BEFORE - a crash between them
        skips a table that never loaded, which is a silently missing
        supply. That asymmetry is why a re-load must also be safe
        against whatever is already there: no record means untrusted,
        so it is replaced rather than appended to.
      - >
        Decided a FAILED load is never retried automatically (Keith,
        2026-09-24). It is for a human, and the call is one of two
        things in his own framing: reject that supply, or fix a genuine
        bug and reprocess through the TUI. The second case is distinct
        and worth naming - the FILE is unchanged and OUR ability to read
        it changed, which works without special handling because
        deliveries are immutable on disk, so a reprocess re-reads the
        same bytes.
      - >
        That makes the failed-load path structurally the SAME as the
        held-supply path in REQ-PIPE-059 and REQ-PIPE-064 - a state
        needing human action, resolved by either an operation or a
        rejection, through the TUI, with the write path belonging to the
        decision log in sprint 12. One affordance serves both rather
        than two mechanisms, and records are append-only with the latest
        taken as current, which is the same shape REQ-PIPE-034 settled
        for arrivals.
      - >
        Decided the log is COMMITTED, beside the delivery log, rather
        than held in the warehouse. The warehouse is gitignored and
        whether it stays ephemeral is an open question
        (plans/running-thoughts.md #33), so putting processing state
        there would bind this decision to that unresolved one. Committed
        is also readable without a warehouse, which the dashboard build
        requires. Growth is one small file per table per delivery -
        roughly 11k a year at thirty datasets daily, the same order as
        qa_results/ already.
      - >
        SETTLED 2026-09-24 (Keith): criterion 7 reworded. It used to say
        a staged table must be READABLE only once loaded completely,
        which cannot be built alongside the rejection of a
        whole-delivery transaction above. Without a transaction a
        truncated table is physically present and physically readable -
        that is exactly why deriving completeness from the catalogue was
        rejected - so the criterion was true at one layer and false at
        another.
      - >
        What actually delivers the guarantee is the LOAD RECORD plus
        REQ-PIPE-035's ephemeral view: a check reads through a view, and
        the view resolves only tables that have a record. PHYSICAL
        PRESENCE IS NOT READABILITY, and that distinction is the whole
        mechanism. Recorded because the old wording's honest
        implementation was the transaction Keith turned down on scale,
        so someone building from the criterion alone would have
        reintroduced the rejected design believing they were following
        the spec.
      - >
        SETTLED 2026-09-24 (Keith): criterion 9 softened, and the DuckDB
        NFR with it. It used to require serialising every write to the
        shared database, and the NFR called the one-process limit a hard
        blocker - while the build-order decision above disposed of it by
        noting dbt does not run until sprint 15. Both sat in this
        requirement saying different things about the same risk.
      - >
        The part the sprint-15 reasoning did not cover, and it is real:
        mothman pipeline run fans out over a ProcessPoolExecutor
        (qa_tools/common/parallel_orchestrate.py) and is parallel by
        default. The collision is therefore not between two people - it
        is two worker processes of a SINGLE invocation, by one person,
        on one machine, with dbt nowhere in sight. It is harmless today
        only because each run gets its own per-run database, which
        REQ-PIPE-035 removes.
      - >
        Keith's call, and it survives that correction rather than
        resting on the version first put to him: this is a PoC, one
        person runs it, and staging runs SEQUENTIALLY until sprint 15
        makes real concurrency worth solving - a deliberate, stated
        constraint rather than a gap. The genuine concurrency
        problem is dbt as a second writing process, and it belongs to
        sprint 15.
      - >
        CORRECTED 2026-09-24, the same day, by delivery-architect and
        verified here against the real code: this decision originally
        said the cost was "a flag the tool already has", meaning
        --sequential. That is WRONG in a way that matters. --sequential
        is a single flag on qa_tools/common/parallel_orchestrate.py's
        run_in_parallel(), and there is ONE fan-out covering everything
        a run does per manifest entry - so setting it does not make
        STAGING sequential, it makes THE WHOLE PIPELINE sequential and
        gives up the parallel default Keith moved to on 2026-09-19.
      - >
        What this requirement actually needs is the STAGING PASS LIFTED
        OUT of the ProcessPoolExecutor fan-out and run once before it,
        so staging is serial and everything after stays parallel. That
        is a control-flow change, not a flag. Recorded because the cheap
        reading - "we already have --sequential, we are done" - is the
        one a builder reaches for first, and it silently costs the
        parallel default for the entire suite.
      - >
        SCOPE, from delivery-architect 2026-09-24: THIS WOULD BE THE
        FOURTH CSV-TO-DUCKDB LOADER unless it replaces the others.
        Three are live today - pipeline/load.py's load_all(),
        qa_tools/bdm/build_per_run_warehouses.py and
        qa_tools/cp/build_cp_warehouses.py - and all three do
        CREATE OR REPLACE TABLE ... read_csv_auto over
        qa_tools/common/csv_io. The concept inventory already lists the
        two per-run builders as retired by REQ-PIPE-035, and this
        requirement's own decisions already call out
        build_cp_warehouses.py's CREATE OR REPLACE as the
        cheapest-and-wrong implementation.
      - >
        Why that matters beyond tidiness: if the staging loader lands
        BESIDE them rather than replacing them, the repo carries four
        loaders, two live and two "to be deleted later" - which is the
        precise condition that produced the generator/
        synthetic_data_generator signature drift this project has
        already been bitten by. The retirement belongs in this batch,
        consistent with REQ-PIPE-068's single-database half having
        already moved forward to sprint 8.
      - >
        SECURITY: criterion 4 needs a unique physical table name per
        arrival, and it must be built from OUR OWN dataset id and
        receipt instant - never from a supplier's filename or the
        delivery name. The existing loaders f-string table names
        straight into DDL, safe only because the name comes from a
        hardcoded list, and DuckDB's parameter binding covers values,
        not identifiers. If anything supplier-derived ever reaches an
        identifier it must be validated against a strict pattern and
        quoted.
      - >
        The GLOBAL STAGING SCHEMA is the most sensitive artefact this
        design creates after the period schemas - it spans agencies,
        holds every supply ever received including the wrong ones, and
        is never emptied. Retention being out of PoC scope is a
        deliberate decision recorded above, not an oversight, and that
        should be said in the module's own docstring so a later session
        neither reads it as a gap nor quietly adds a cleanup that
        destroys history.
      - >
        SETTLED 2026-09-24 (Keith): THIS REQUIREMENT OWNS THE PROCESSING
        LOG OUTRIGHT, and REQ-PIPE-038's criterion 8 was dropped. That
        criterion said "record each table's LOAD OUTCOME as its own
        committed record, separate from the delivery's file, so that an
        arrival with nothing loadable is still a recorded arrival
        without the delivery's file ever being rewritten" - two
        statements, both now redundant. The first restates criterion 13
        here; the second protects the delivery file's immutability,
        which REQ-PIPE-069 owns twice over (its criterion 1 forbids
        rewriting, its criterion 3 forbids recording anything not known
        at recognition time).
      - >
        There was a structural reason too, beyond the duplication: after
        the 2026-09-24 split, REQ-PIPE-038 is purely about re-keying
        committed QA history per dataset. A load-outcome criterion does
        not belong in it at all any more - it was only ever there
        because the delivery log was.
      - >
        CRITERION 20 ADDED in the same change, and it is the reason the
        drop needed care. Nothing in any CRITERION said WHERE load
        records live: criterion 13 says "its own committed record"
        without a location, and the only statement that the log sits
        beside the delivery log was a DECISION here, not a criterion.
        REQ-PIPE-038's criterion 8 was accidentally the nearest thing to
        it, so dropping it without noticing would have widened the gap
        rather than closed it. The obligation is now checkable, in the
        same shape as REQ-PIPE-069 criterion 2.
      - >
        BUILT 2026-09-25: the unique-name form decision 30 asked for is
        `<table>__<arrival digits>` plus an ORDINAL where one dataset
        matched several files. The ordinal is the whole point - a
        supplier's filename was the obvious discriminator and is the
        one thing that may not be used, because these become SQL
        IDENTIFIERS and DuckDB's parameter binding covers values, not
        identifiers. Every part of the name is now ours: our dataset
        id, our receipt instant, our counter.
      - >
        BUILT 2026-09-25: an unchanged re-stage writes NO load record.
        Found by running it rather than reading it - a second
        `mothman supply load` over unchanged deliveries wrote 42
        duplicate records saying exactly what the previous 42 said.
        Over years of history at ~30 datasets that is a committed tree
        growing without bound and carrying no signal.
      - >
        It does NOT weaken criterion 19, which was checked before
        putting a deduplicate anywhere near an append-only log: that
        criterion is about a CHANGE of outcome, a failed load
        reprocessed into a loaded one, and a change is exactly what is
        still written. What is suppressed is a repetition. Rejected the
        alternative of pruning the tree periodically, which needs
        somebody to remember and deletes real history when they get it
        wrong.
      - >
        BUILT 2026-09-25: criterion 16 is answered against what
        RECOGNITION says a delivery should have produced, not against
        the catalogue. A file that failed outright leaves nothing in
        the catalogue to count, which is precisely the case being
        looked for - so the catalogue would report a delivery whose
        only failure was total as complete.
      - >
        BUILT 2026-09-25, and it is a defect in what was already
        shipped rather than a choice: NO TEST MAY WRITE INTO THIS
        REPO'S COMMITTED HISTORY TREES. The processing log was one day
        old and already held 109 test-run records out of 259 - table
        names that only ever existed inside a temporary directory,
        committed permanently. The cause is structural: these trees are
        written several frames below whatever a test called, by
        production code taking a directory argument nobody at the
        test's level passes, so a test cannot reliably opt out.
      - >
        The same hole was live and WORSE for the delivery log, and it
        would have fired on CI rather than here. Six tests invoke
        `mothman pipeline run` without redirecting it, and that command
        prunes the log against what is on disk. This machine has
        `data/deliveries/`, so nothing is pruned; a freshly-cloned
        runner has no `data/` at all, so the correct answer to "which
        deliveries are present" is NONE and all sixty committed records
        go. Exactly CLAUDE.md's own gitignored-tree trap, running in
        the opposite direction.
      - >
        Fixed by one session-scoped autouse fixture redirecting all
        three trees - processing log, delivery log, in-flight
        observations - and asserted by a test that reads the constants
        back rather than trusting the fixture. Rejected redirecting
        through the environment, which would silently defeat the
        per-test monkeypatches several existing tests already use;
        patching the module constants leaves those working and still
        restores to a temporary directory rather than to the real tree.

  - id: REQ-PIPE-061
    title: Arrivals are processed in receipt order, and an interrupted run loses nothing
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an agency data owner, I want two files that landed in the same batch to be filed the same way whatever order the pipeline happened to pick them up in, so that where a supply ends up is a fact about when it arrived rather than about a directory listing."
    moscow: must
    status: built
    source: "Keith, delivery sprint 8 - replay in arrival-timestamp order - plans/supply-model.md Thread H first chaos pass #2, and the dependency REQ-PIPE-053 already names: 'replaying the backlog in arrival-timestamp order, which is batch 3's rule'. Test scenario register TS-8 and TS-32. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    linked_tests:
      - tests/test_backlog.py
      - tests/test_holds.py
      - tests/test_cli_supply.py
      - tests/test_cli_pipeline.py
    implemented_by:
      - qa_tools/common/delivery.py::next_sequence
      - qa_tools/common/delivery.py::read_receipt_record
      - qa_tools/common/delivery.py::survey
      - qa_tools/common/backlog.py::Position
      - qa_tools/common/backlog.py::pending
      - qa_tools/common/backlog.py::advance
      - qa_tools/common/backlog.py::advance_through
      - qa_tools/common/backlog.py::advance_past_staged
      - qa_tools/common/arrivals.py::Arrival
    evidence:
      - >
        2026-09-25: criterion 3 was a LIVE bug, not a precaution, and the test was
        confirmed to catch it before the fix went in. survey() sorted on the receipt
        instant alone - a stable sort over a name-sorted iterdir() - so a tie fell to
        the delivery's NAME, which REQ-PIPE-057 criterion 8 separately forbids.
        Reverting the sort key made the new test fail on 'alpha' before 'zulu';
        restoring it made it pass.
      - >
        2026-09-25: all 60 regenerated receipts carry a distinct sequence, 1 through
        60, and a seeded regeneration reproduced every run id - run_id_guard.check()
        reports no change against committed history for either collection.
      - >
        2026-09-25: criterion 3 is LATENT in real data and the test says so. All 60
        committed receipts carry distinct instants, so no tie exists to exercise and a
        test over real data would have passed without touching the rule at all. The
        tie is constructed.
      - >
        2026-09-25: a second bug, found by Keith asking what incremental processing
        would cost rather than by any test. Position.of() defaulted a missing
        `sequence` to zero and Arrival carried none, so EVERY arrival's position had
        sequence 0 and the tiebreak was absent at the one layer that uses it. Measured
        directly - both collections' last arrivals reported sequence 0. Arrival now
        carries it (40 and 60 respectively) and a missing one raises.
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    acceptance_criteria:
      - "THE SYSTEM SHALL process arrivals in ascending order of our own receipt instant."
      - "THE SYSTEM SHALL NOT process arrivals in the order they were discovered, listed or named."
      - "WHERE two arrivals share a receipt instant, THE SYSTEM SHALL order them by the order their receipt records were written, and SHALL NOT order them by a delivery's name, by a directory listing or by sort stability."
      - "THE SYSTEM SHALL order arrivals by receipt instant across every collection, and SHALL NOT order them within one collection at a time."
      - "THE SYSTEM SHALL produce identical filings for a given set of arrivals whatever order they were presented in."
      - "WHEN a run processes arrivals, THE SYSTEM SHALL process every arrival not yet processed since its recorded marker, rather than only the arrival that triggered the run."
      - "THE SYSTEM SHALL advance its marker only past arrivals it has fully processed."
      - "IF a run is interrupted partway through a backlog, THEN THE SYSTEM SHALL leave every arrival it had not fully processed to the next run, in the same order."
      - "WHILE a dataset's schedule is exhausted, THE SYSTEM SHALL continue to accept and record that dataset's arrivals, so that the backlog files correctly once dates are added."
    non_functional_requirements:
      - "This is what makes REQ-PIPE-053's hard failure safe. That requirement's own decision says a backlog drains CORRECTLY once dates are added, filed to the right slots and classified against the right due instants rather than approximated - and it states plainly that the claim rests on this rule, which was written down without its dependency."
      - "Replay cost must be bounded by the arrivals not yet processed, not by the total history. A rule requiring every arrival ever received to be re-read on every run is correct and does not survive years of a daily feed."
      - "Determinism is a real correctness check here, not a preference: everything in this repo is seeded, so regenerating and diffing is how a refactor is proven behaviour-preserving. An order-dependent filing makes that check meaningless."
      - "Draining a backlog is idempotent and drop-safe by design, so a cancelled or failed run costs nothing beyond the delay. That property is what lets the pipeline stop depending on any platform's queueing guarantees."
    dependencies: [REQ-PIPE-057, REQ-PIPE-060]
    decisions:
      - "Decided ALWAYS ASSIGN IN ARRIVAL-TIMESTAMP ORDER, never discovery order, with a defined tiebreak for identical instants (Thread H first chaos pass #2). The worked example: Tuesday's late file and Thursday's on-time file both land in one batch around Thursday 22:00. Thursday's processed first is correct; Tuesday's processed first falls inside Thursday's on-time window, files as Thursday, and Thursday's real file then hits a filled slot and is held. Same two files, opposite outcome, decided by loop order - non-determinism nothing would ever flag."
      - "Decided the receipt instant is the only ordering fact. A supplier-provided timestamp reflects their clock, their timezone and their bugs, and staging's whole justification is that it asserts only facts we can vouch for (TS-32). A delivery's name is arbitrary by design, so sorting by it would be inventing an order out of a supplier's naming habits."
      - "Decided each run DRAINS THE BACKLOG - reading everything unprocessed since a marker rather than only the triggering event. Settled for decision processing in Thread H's second pass, and it is the same discipline here rather than a second one. The reason it matters generally: GitHub holds only ONE pending run per concurrency group, so three rapid triggers silently lose the middle one, and the opt-in queueing mode was rejected by Keith as edition-gated. Draining works on any edition, at any volume, and survives a run failing for reasons that have nothing to do with concurrency."
      - "Decided the tiebreak must be deterministic and stated rather than left to sort stability, because a stable sort over a directory listing is still a directory listing."
      - >
        SETTLED 2026-09-24 (Keith): the tiebreak is THE ORDER THE
        RECEIPT RECORDS WERE WRITTEN. The criterion used to require a
        tiebreak that was "defined" without defining it, so two
        implementers could both satisfy it with different tiebreaks and
        get different filings - the exact non-determinism this
        requirement exists to remove.
      - >
        The obvious choice was already forbidden and nothing said so.
        Sorting ties by delivery NAME is what most people reach for
        first, and REQ-PIPE-057 criterion 8 - signed earlier the same
        day - states the system shall not derive the processing order
        from a delivery's name. Recorded here because the prohibition
        lives in a different requirement, so someone reading only this
        one would never find it.
      - >
        Receipt-record write order was chosen over the surviving
        alternative, run identity assigned at recognition, because it is
        the SAME FACT the primary sort already uses, just at finer
        grain - one ordering rule rather than two, and no second concept
        to keep correct.
      - >
        SETTLED 2026-09-24 (Keith): receipt order is GLOBAL, not
        per-collection. It follows from REQ-PIPE-057 allowing one
        delivery to span collections - a per-collection ordering would
        have to visit such a delivery twice and could order it
        differently each time, which is the non-determinism this
        requirement exists to remove. Today's code orders within a
        collection (qa_tools/common/arrivals.py's arrivals_for()), so
        this is a change to built behaviour rather than a restatement.
      - >
        Note what stays per-collection: the RUN. One arrival spanning
        two collections produces two runs, because a run is the
        per-collection QA unit. Only the ORDER in which arrivals are
        processed is global, and the marker with it.
      - >
        SETTLED 2026-09-24 (Keith), closing the second finding left
        without an owner by the pre-build review: BUILDING THIS BATCH IS
        WHAT MAKES REQ-PIPE-053'S FILING-LAYER CRITERIA TESTABLE, AND
        THEY MUST GAIN THEIR linked_tests IN THE SAME CHANGE.
      - >
        REQ-PIPE-053 is `built` and admits the gap itself: "the criteria
        about failing at filing, accepting supplies while exhausted, and
        a run summary naming what it skipped describe a filing layer
        that does not exist yet". Those are its criteria 4, 5, 6, 7, 9
        and 22. This batch builds that filing layer, so they stop being
        aspirational the moment it lands.
      - >
        Nothing will catch it if it is skipped, which is why it is
        written down rather than left to good practice: the CI gate
        enforces linked_tests only at the transition to `built`, and
        REQ-PIPE-053 crossed that line already with four tests covering
        the half that was real. It is never asked again, so a
        requirement that overclaims stays overclaiming, silently and
        permanently.
      - >
        Noted while resolving it: criterion 9 here and REQ-PIPE-053's
        criterion 7 are the same SHALL - a dataset whose schedule is
        exhausted still accepts and records its arrivals. That
        duplication is deliberate rather than accidental, and this
        requirement's own first NFR explains why: 053 made the claim
        without the mechanism and this is the mechanism. Left in place,
        unlike the duplications resolved elsewhere today, because
        dropping either copy would cost one of the two requirements its
        readability.
      - >
        BUILT 2026-09-25 (Keith, choosing between exactly two options): the
        write-order fact is a SEQUENCE on the receipt, assigned monotonically
        when it is written. The alternative was a second timestamp, `recorded_at`
        - simpler, no read-modify-write, and it can still tie, at which point the
        order falls back to whatever the sort does. A sequence is total.
      - >
        A RECEIPT WITH NO SEQUENCE IS A HARD ERROR, never a default of zero.
        Defaulting would put every pre-sequence receipt in one place, so a tie
        between two of them falls to a directory listing - the exact
        non-determinism this requirement removes, reintroduced by the fallback
        written to tolerate it. Receipts live under gitignored data/, so the
        remedy is to regenerate rather than migrate.
      - >
        That refusal is deliberately NOT a DeliveryFormatError, and the
        distinction is load-bearing rather than taxonomic: survey() catches that
        one and reclassifies the delivery as still in flight. A receipt missing
        its sequence is a COMPLETE arrival we cannot order, and reporting it as
        an incomplete upload would hide it behind an ordinary operational state.
      - >
        BUILT 2026-09-25: the marker does NOT make `mothman pipeline run`
        incremental, and that was decided rather than overlooked. A full rebuild
        processes a SUPERSET of what criterion 6 requires, so the criterion holds,
        and regenerate-and-diff survives - the technique that proved 6563 verdicts
        unchanged the same day. Making the run incremental is a separate change
        with real prerequisites, recorded below.
      - >
        TWO PREREQUISITES FOR INCREMENTAL PROCESSING, both measured on 2026-09-25
        when Keith asked what it would cost. FIRST, one global marker cannot be
        advanced by two per-collection orchestrators: BDM's newest arrival is seven
        weeks past CP's, so whichever runs first pushes the shared marker past the
        other's outstanding work - measured, BDM first leaves CP 0 of 18 pending.
        A global marker implies ONE processing pass over the global order, which
        is a restructure of orchestration rather than a flag. It is latent today
        only because nothing reads the marker for control flow.
      - >
        SECOND, run ids are positional, so a late arrival renames committed
        history. That is REQ-PIPE-057 criterion 18, already recorded as unmet with
        REQ-PIPE-069 as owner. Incremental sharpens it: a full rebuild at least
        re-derives consistently, while an incremental run writes new runs beside
        history that assumed a different numbering. Stable run identity is a
        prerequisite, not a nice-to-have.
      - >
        Recorded as NOT a blocker although it looks like one: reports/results_*.json
        is a whole-dataset document carrying every run, but
        build_results_from_history.py already rebuilds it from committed
        qa_results/, so incremental composes - run the tools on new arrivals, then
        rebuild the document from history.

  - id: REQ-PIPE-062
    title: A supply is assigned to a slot by rule, and the rule can never claim forward
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an agency data owner, I want each supply attributed to the period it is actually for, so that a punctual supplier is never recorded as sending a very late resupply while the slot they actually filled goes overdue as a phantom missing delivery."
    moscow: must
    status: built
    linked_tests:
      - tests/test_assignment.py
      - tests/test_filing.py
      - tests/test_cli_supply.py
    implemented_by:
      - qa_tools/common/assignment.py::assign
      - qa_tools/common/assignment.py::current_slot
      - qa_tools/common/assignment.py::oldest_claimable_unfilled
      - qa_tools/common/assignment.py::most_recently_filled
      - qa_tools/common/assignment.py::Assignment
      - qa_tools/common/filing.py::record
      - qa_tools/common/filing.py::filing_for
      - qa_tools/common/filing.py::filled_slots
      - qa_tools/common/filing.py::file_arrivals
      - cli/supply.py::filings_command
    unmet_criteria:
      - criterion: >-
          Criterion 1, in part - assignment happens for every arrival BEFORE
          any check runs over it. The rule runs and is tested; it is not
          wired into the pipeline run, so no filing is recorded today.
        why: >-
          Keith's call, 2026-09-25, on measured evidence rather than in
          principle. Only a PROMOTION fills a slot (decision 10) and
          promotion does not exist until batch 4, so filled_slots() is
          permanently empty and "the oldest claimable unfilled slot" is
          always the first slot in the calendar. A real run filed 102 of
          108 supplies against 2023-Q1. Criterion 10 makes a filing
          WRITE-ONCE, so recording that would bake a known artefact of a
          missing dependency into permanent history where it later reads
          as data. filing.file_arrivals() is the single call that turns it
          on, and both orchestrators carry a comment saying so.
        owner: the promotion sprint (batch 4)
    evidence:
      - >
        2026-09-25: both cascades are tested as REAL SEQUENCES rather than
        single calls, which this requirement's own non-functional constraint
        demands - each is invisible day to day, every day locally plausible
        and never self-correcting, so a test of one call's return value would
        pass against a rule that destroys the next year of filings. The
        forward cascade test runs the rejected-then-promoted-then-resupplied
        Monday; the backward one runs a four-day outage and asserts the whole
        run afterwards stays on its own day.
      - >
        2026-09-25: the TS-3 boundary tests are LABELLED in the test file
        itself, not in a plans file due for deletion, and say in their own
        assertion messages that they assert a known imperfection stays
        CONTAINED rather than that the system gets the right answer.
      - >
        2026-09-25: a test of mine had the imperfection backwards and the run
        caught it. It expected an arrival inside the current slot's window to
        file to the PREVIOUS slot; criterion 2 says the opposite, and the real
        boundary misfile is a supply arriving BEFORE its own slot's window
        opens, which reads as a late resupply of the previous slot while the
        slot it actually filled goes overdue. The rule was right; the test was
        wrong.
      - >
        2026-09-25: never-claim-forward is asserted three ways - a slot whose
        window has not opened is not even considered, it is still not claimed
        when every open slot is filled, and an arrival before the first window
        is recorded unassignable rather than forced into a slot.
      - >
        2026-09-25: the cost constraint holds - the current slot is found by
        bisection rather than a scan, and assignment over 4028 slots is within
        a small constant of assignment over 28.
      - >
        2026-09-25: exercised end to end against the real pipeline before
        recording was turned off - 108 supplies filed, 6 by the on-time branch
        and 102 by oldest-claimable, and a second pass wrote nothing, which is
        criterion 10 holding on real data.
      - >
        2026-09-25, A CI-ONLY FAILURE IN THESE TESTS, caught by Keith looking
        at the Actions tab rather than by anything here. tests/test_filing.py
        read data/deliveries/ for its fixtures - a GITIGNORED tree, absent on
        a freshly-cloned runner - so it passed locally and failed on CI for
        four consecutive pushes with "expected one filing per CP dataset, got
        0". CLAUDE.md documents this exact trap in as many words and it was
        walked into anyway. The tests now build their own deliveries in
        tmp_path, verified by reproducing the CI condition locally: move data/
        aside, run the suite, which is the cheapest check for this class.
        A third test in the same class was passing VACUOUSLY for the same
        reason - it asserted against an empty list - and now asserts the
        fixture produced an arrival before asserting anything about it.
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    source: "Keith, delivery sprint 9 - the highest-risk sprint in the plan. plans/supply-model.md Thread E in full, including both cascades found by his own stress tests, plus Thread D's split of assignment from promotion. Test scenario register TS-1, TS-2, TS-3a-d, TS-6a, TS-6b, TS-9, TS-10. Honours the deferral REQ-PIPE-052 wrote: 'the rules that USE it - oldest claimable unfilled slot, on-time-wins-for-the-current-slot, monotonic filling, hold for a human - are slot ASSIGNMENT and belong to batch 3'. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "WHEN a supply arrives and is attributed to a dataset, THE SYSTEM SHALL assign it to exactly one of that dataset's own slots, record it as a resupply of a filled slot, or hold it - and SHALL do so before any check runs over it."
      - "IF the arrival falls at or before the due instant of that dataset's current slot plus that slot's grace allowance, and that slot is unfilled, THEN THE SYSTEM SHALL assign the supply to that slot, even where earlier slots are unfilled."
      - "WHERE that rule does not apply, THE SYSTEM SHALL assign the supply to the oldest slot that is unfilled and claimable."
      - "IF no such slot exists, THEN THE SYSTEM SHALL record the supply as a resupply of the most recently filled slot."
      - "THE SYSTEM SHALL NOT assign a supply to a slot whose claim window has not opened, under any rule or any circumstance."
      - "THE SYSTEM SHALL treat a slot as filled only where a supply has been PROMOTED into it, and SHALL NOT treat an arrival, a staged supply or a rejected supply as filling one."
      - "THE SYSTEM SHALL assign each dataset's supplies against that dataset's own slot sequence alone."
      - "THE SYSTEM SHALL perform assignment as a derivation, with no human input and no judgment."
      - "THE SYSTEM SHALL record, with each assigned supply, which branch of the rule assigned it and which slot it considered."
      - "WHEN a supply has already been filed, THE SYSTEM SHALL leave its assignment alone on every later run, and SHALL NOT re-derive it."
      - "THE SYSTEM SHALL assign a supply whose checks will report red on the same terms as any other, so that a supply never promoted still carries where it was filed."
      - "THE SYSTEM SHALL derive assignment from slot configuration and promotion state alone, and SHALL NOT read the contents of the supply being assigned."
    non_functional_requirements:
      - "The obvious implementation is the catastrophic one, and it is currently in the codebase. qa_tools/common/slots.py's next_unfilled_claimable() implements 'oldest claimable unfilled slot' with no on-time-wins branch and no monotonic filling - which is exactly the rule Thread E proves produces a permanent backward cascade. Its own docstring says it implements only half the rule deliberately, so this requirement extends it rather than re-deriving; but anything calling it as-is today gets the cascade."
      - "Both cascades are invisible day to day - every day looks locally plausible and nothing self-corrects - so the tests are the only thing that will ever catch a regression. This requirement's tests must drive real sequences over real slots, not assert one call's return value."
      - "The TS-3 family of tests asserts that a KNOWN IMPERFECTION STAYS CONTAINED rather than that the system gets the right answer, and the register says explicitly to label them so a later session does not 'fix' them. Label them in the tests themselves, not in a plans file that will be deleted."
      - "Assignment runs per arrival against a dataset's whole slot sequence. At a daily feed with years of history that sequence is thousands of slots, so assignment must not scan all of them per arrival - the rule only ever needs the current slot and the oldest claimable unfilled one."
      - "Deterministic and reproducible: the same arrivals plus the same configuration plus the same promotion state must produce the same filings, or the seeded regenerate-and-diff check stops meaning anything."
      - "Why a supply is where it is must be answerable a year later without re-running anything, which is why the rule branch is recorded rather than recomputed. Recomputing it later is not equivalent - the slot state it was decided against has moved on."
      - "Config and promotion state only, no read of anything under data/ beyond what the pipeline run legitimately holds open."
    dependencies: [REQ-PIPE-052, REQ-PIPE-061, REQ-PIPE-034]
    decisions:
      - "The rule, stated once: assign to the oldest slot whose CLAIM WINDOW is open and which is unfilled; if there is no such slot, it is a RESUPPLY of the most recently filled slot - amended by the on-time-wins branch below and by monotonic filling in REQ-PIPE-063."
      - "Decided NEVER CLAIM FORWARD, and the reason is asymmetric risk rather than taste. Mis-attributing an arrival backwards - calling a new delivery a resupply - is one contained error on one supply. Mis-attributing it forwards cascades through every future delivery. The claim window is what makes 'cannot' literal rather than likely: a slot whose window has not opened cannot be claimed at all."
      - "The FORWARD cascade, recorded in full because the broken rule reads perfectly reasonable and would be re-proposed. Daily feed due 12:00 Monday. Mon 14:00 arrives, red, rejected, Monday still unfilled. Mon 16:00 arrives, green, promoted, Monday filled. Mon 20:00 a third file arrives - under 'oldest unfilled slot' the oldest unfilled is TUESDAY, so a Monday resupply files as Tuesday's delivery; the next takes Wednesday; every later supply is off by one permanently. The cause: 'oldest unfilled slot' assumes every arrival fills a NEW obligation, and a resupply does not."
      - "The BACKWARD cascade, which was introduced by the fix for the forward one. Daily feed due ~22:00. Monday filled; the supplier's system goes down and Tuesday and Wednesday are missed; the next supply arrives on time at 22:00 Thursday. Under 'oldest claimable unfilled, window never closes' it files as Tuesday two days late, the next as Wednesday, the next as Thursday - a permanent two-day lag cascading backwards, every day locally plausible, never self-correcting."
      - "Decided the fix is that PUNCTUALITY IS EVIDENCE OF WHICH SLOT A SUPPLY IS FOR: if an arrival falls within the on-time window of the current slot and that slot is unfilled, file it there even if earlier slots are unfilled. Thursday 22:00 for a Thursday due 22:00 fills Thursday, and Tuesday and Wednesday stay unfilled and read as missed, which is true. Monday's supply arriving Tuesday 03:00 is not on time for Tuesday, so it takes the oldest unfilled - Monday, late. Lateness still works and an outage no longer eats the future."
      - "Rejected CLOSING a slot's window when the next one opens. It kills the cascade and breaks lateness - Monday's supply landing Tuesday morning would file as Tuesday."
      - "Rejected a FINITE LATENESS TOLERANCE. It only shifts the lag: a one-day tolerance turns a two-day cascade into a one-day cascade, and any fixed tolerance has an outage longer than it."
      - "Rejected GENEROUS OR CONTIGUOUS claim windows as the cure for boundary misfiling. With Tuesday's window open from Monday 12:00, the Monday 20:00 resupply finds Monday filled, Tuesday open and unfilled, and claims Tuesday - the forward cascade exactly. Tight windows buy cascade-immunity at the price of boundary misfiling; wide windows do the reverse; no sizing gets both, and the trade is accepted in favour of never claiming forward."
      - "Recorded because it is the cost being accepted knowingly: a boundary misfile is wrong TWICE, and reporting is this system's product. A punctual supplier is recorded as delivering a very late resupply, AND the next slot is left unfilled so it goes overdue - a phantom missing delivery for data that arrived on time one slot over. The data half is fine; it sits in the previous slot, present and checked."
      - "Decided ONLY A PROMOTION FILLS A SLOT, and this is load-bearing rather than definitional: without it the Monday 16:00 resupply in the forward-cascade example would itself have been pushed to Tuesday, because Monday's slot would have been 'filled' by the rejected 14:00 supply."
      - "Decided SLOT ASSIGNMENT AND PROMOTION ARE TWO STEPS, not one. As first proposed the period was assigned at promotion, but checks run BEFORE promotion, so at check time there would be no slot to classify against. Assignment is a derivation with no human in it; promotion is a decision. There is still exactly one place the slot is decided, it just happens earlier - and it means a REJECTED supply still gets classified, which matters, because 'arrived three weeks late AND was bad' is what belongs on the record."
      - "Decided the daily and quarterly assets share this machinery, and that the difference between them is ONLY WHO PULLS THE TRIGGER - a human decides which quarter a supply fills, a rule decides for the daily asset - with assignment identical underneath. The automatic rule is safe to be imperfect precisely because tables move between schemas: a wrong filing is a correction, not a rebuild."
      - "Decided an assignment is RECORDED and never re-derived for a supply already filed. Re-deriving on every run would silently undo a human's re-file and make history move under a reader - the same instability the stickiness rule exists to prevent on the promotion side."
      - "Rejected, again and for the record, DERIVING THE PERIOD FROM THE SUPPLY'S OWN CONTENT (circular - it infers the filing decision from the very data whose correctness is about to be tested, and a resupply exists precisely because the first attempt was wrong, possibly wrong in its dates) and the SUPPLIER-DECLARED PERIOD (unenforceable across a wide and varied supplier base, and the suppliers who would get it wrong are exactly the ones whose data most needs QA)."
      - "Decided this also DELETES the daily cutoff rule and the separate 'arrives a week early' case. Both are the same mechanism now: if a feed's supply genuinely lands the evening before, its due instant IS the evening before and the window opens accordingly - the schedule expresses it directly instead of a rule reinterpreting arrivals afterwards. TS-10 is the worked example: the same 22:00 arrival fills Tuesday on time or Monday late depending only on slot state."
      - "Decided nothing measures HOW EARLY a supply is in order to assign it (TS-9). Earliness is a reported consequence of the assignment, which is why classification can be a pure function of the assigned slot."
      - >
        SETTLED 2026-09-24 (Keith): a dataset whose supplies are FOR THE
        FOLLOWING PERIOD needs no exception to criterion 5, and
        criterion 5 stays absolute. He raised this as a per-dataset
        property - "does it appear in a slot in this period, or does it
        need to go into a slot in the next period?" - and it reads at
        first like a head-on collision with the never-claim-forward
        rule, which is why the answer is recorded here rather than left
        to be re-derived.
      - >
        It is the SAME MECHANISM as the deleted daily-cutoff and
        arrives-a-week-early cases directly above: the SCHEDULE
        expresses it, not the rule. If a dataset's supplies are for the
        following period, that period's slot carries a due instant and
        claim window that are already open when the supply arrives - so
        the window is open, nothing claims forward, and the assignment
        rule is untouched. Slots are already per-dataset, so this needs
        no new configuration axis either.
      - >
        Why it matters that this is NOT an exception: criterion 5 says
        "under any rule or any circumstance", and an absolute rule with
        one exception is how forward-claiming comes back. The general
        principle worth carrying is the one the cutoff decision already
        states - when an arrival seems to belong to a different period,
        the answer is almost always that the CALENDAR is wrong, never
        that the rule needs a special case. Raised as
        plans/road-testing.md item 3, which this answers in PRINCIPLE
        only - the capability is not built and is deliberately not in
        these sprints (Keith, 2026-09-24), so that entry stays OPEN as
        future work rather than being closed by this sign-off. Nothing
        today declares, per dataset, that its supplies are for the
        following period, or generates its slot calendar accordingly.

  - id: REQ-PIPE-063
    title: A slot stops being claimable once a later one is filled
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an agency data owner, I want a delivery that never arrived to stay recorded as not arrived, so that a later resupply of a different day cannot be quietly filed against it and turn a service failure into a met obligation."
    moscow: must
    status: built
    linked_tests:
      - tests/test_monotonic_filling.py
      - tests/test_assignment.py
    implemented_by:
      - qa_tools/common/assignment.py::closed_by_monotonic_filling
      - qa_tools/common/assignment.py::oldest_claimable_unfilled
      - qa_tools/common/assignment.py::assign
    evidence:
      - >
        2026-09-25: the scenario is traced end to end as a real sequence, and
        the requirement's own warning is answered directly. It says a test
        asserting a slot stayed UNFILLED is easy to write as a no-op that
        passes against any implementation, so each negative assertion here
        carries a CONTROL that drives the same arrival with monotonic filling
        switched off and shows the bad answer appearing - the Wednesday
        resupply taking the missed Tuesday. Without that control the test
        proves nothing.
      - >
        2026-09-25: genuine lateness is asserted to survive, which is the way
        this rule could have bought safety at too high a price. A supply
        landing 03:00 the next morning still fills its own slot while nothing
        later is filled, and four consecutive one-day-late supplies each fill
        their own slot in turn, so a feed running behind reads as running
        behind rather than as a run of missing slots.
      - >
        2026-09-25: claimability is computed, never stored - asserted by
        showing the same slot is open with only an earlier slot filled and
        closed once a later one is, and by a source check that the function
        writes nothing. A stored flag would be wrong from the moment the next
        promotion lands.
      - >
        2026-09-25: criterion 6's trigger needed interpretation and the
        reading is recorded rather than assumed. Thread H says "when nothing
        is confidently claimable, hold it for a human", while decision 1
        traces the Wednesday 23:00 arrival as a CONFIDENT Wednesday resupply -
        so the resupply branch keeps that case and the hold takes the rest.
        In practice that makes the hold unreachable on a contiguous daily
        calendar where the filled slot is always the one being arrived into;
        it fires where the filled slot is NOT the current one, which is a
        supply promoted out of order or a calendar with gaps. Put to Keith
        because a branch that cannot fire is indistinguishable from one that
        is wrong, and CONFIRMED BY HIM 2026-09-25: "that's spot on". The
        reading is settled rather than assumed.
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    source: "Keith, delivery sprint 9, plans/supply-model.md Thread H first chaos pass #3 - monotonic filling - with its own named limit. Test scenario register TS-5, TS-6c. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "THE SYSTEM SHALL treat a slot as no longer claimable once any later slot for the same dataset has been filled."
      - "THE SYSTEM SHALL continue to allow a genuinely late supply to fill its own slot where no later slot for that dataset is filled."
      - "WHERE consecutive slots are each filled late in sequence, THE SYSTEM SHALL fill each one, so that a feed running behind is recorded as running behind rather than as a run of missing slots."
      - "THE SYSTEM SHALL leave a slot closed this way unfilled, so that it reads as an obligation that was not met."
      - "THE SYSTEM SHALL NOT record a slot as met using a supply that arrived for a different slot."
      - "IF an arrival can only be placed in a slot that monotonic filling has closed, THEN THE SYSTEM SHALL hold it for a human."
    non_functional_requirements:
      - "The failure this prevents is rated worse than a cascade in the source thread, because it manufactures a delivery that never happened - a service failure erased using another day's data. A test asserting it must assert that a particular slot stayed UNFILLED, which is easy to write as a no-op that passes against any implementation."
      - "Claimability is asked, never recorded. The answer changes as later slots fill, so a stored flag is wrong from the moment the next promotion lands - the same reasoning REQ-PIPE-052 already applied to overdue."
      - "Whether a later slot is filled is promotion state, so this rule cannot be answered by the schedule alone. It must not become a second place that decides what 'filled' means."
    dependencies: [REQ-PIPE-062]
    decisions:
      - "The scenario, recorded in full because it survives the backward-cascade fix and is worse in kind. Tuesday missed entirely after an outage. Wednesday 22:00 arrives on time, green, promoted, so Wednesday is filled. Wednesday 23:00 a resupply of Wednesday arrives. Wednesday is filled so the on-time branch does not apply; the oldest claimable unfilled slot is TUESDAY, so the Wednesday resupply files as Tuesday one day late, and the resupply-of-the-most-recently-filled-slot branch never fires because an outstanding missed slot means a claimable unfilled one exists. A missed delivery is thereby recorded as MET."
      - "Decided MONOTONIC FILLING: a slot stops being claimable once a LATER slot has been filled. Re-traced against the scenario - Tuesday becomes non-claimable, nothing else is claimable, and the 23:00 arrival is correctly a Wednesday resupply. Genuine lateness survives, because Monday's supply landing Tuesday 03:00 finds Tuesday unfilled."
      - "The LIMIT, named rather than papered over (Keith: 'I think we can't design around that'). Once a delivery is skipped AND a later one has landed, a genuine backfill of the older slot cannot be placed by any rule - it is not claimable, and defaulting it into a future slot is the forward cascade again. That is what REQ-PIPE-064 exists for."
      - "Decided the definitive answer lives with a person, not a rule: a human marks the missed slots missed, with a reason. The rule only needs to be sensible rather than clairvoyant, because an outage is LOUD - Tuesday's slot goes overdue Tuesday evening, by Thursday two overdue slots are red, and a human is engaged well before the ambiguous arrival lands."
      - "Decided NOT_EXPECTED and MARKED MISSED must never blur, and the distinction is about what the record ends up saying rather than when it was agreed. not_expected in config changes what was OWED - the slot never existed, nothing is overdue, the record says nothing was due. A slot marked missed records an obligation that was NOT MET - it existed, it was owed, it did not arrive, and it stays in the record as a failure with a reason. Marking a slot missed is closing it while recording that it WAS owed; the acknowledgement is 'it is not coming', never 'it was not due'. Without the distinction, supplier reliability becomes whatever people were willing to excuse after the fact."
      - "Timing follows as a CONSEQUENCE rather than being the rule: you can only legitimately say nothing is owed BEFORE the fact. A supplier saying next week 'we are upgrading Tue-Wed, no files' is not_expected; finding out at 9pm Tuesday that it is already not coming is marked-missed. Editing config retrospectively to make red history disappear is exactly what must not happen."
      - "Recorded as a build-order fact: marking a slot missed is a human decision and belongs to the decision log in sprint 12. Until it exists, a slot closed by monotonic filling simply stays unfilled and overdue, which is correct but unresolvable - the dashboard will show a permanently red slot nobody can close."
      - >
        SETTLED 2026-09-24 (Keith), guarding against a blur this
        requirement's own reasoning invites: "FILLED" MEANS DATA
        RESOLVES FOR THAT PERIOD, NEVER THAT A SUPPLY ARRIVED. The
        carry-forward in plans/supply-model.md sprint 25 fills a slot by
        pointing its view at the last green supply, and that is a
        statement about DOWNSTREAM AVAILABILITY - consumers need
        something to query - not a statement that the supplier
        delivered.
      - >
        Why it needs saying here: this requirement is emphatic that
        not_expected and marked-missed must never blur, because
        "supplier reliability becomes whatever people were willing to
        excuse after the fact". A carried-forward slot reading as an
        ordinary filled slot would be that same erasure by a different
        route - a supplier credited for a delivery they never made. The
        carried-forward QUALIFIER CHIP is what keeps the two readable
        apart, which is why Keith made it a requirement of that concept
        rather than a presentation nicety.

  - id: REQ-PIPE-064
    title: When nothing is confidently claimable, hold it for a human
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an operator, I want the pipeline to say it does not know where a supply belongs rather than putting it somewhere plausible, so that the one thing it can never do is start a cascade by guessing forward."
    moscow: must
    status: built
    linked_tests:
