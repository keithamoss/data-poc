      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    source: "Keith, delivery sprint 9, plans/supply-model.md Thread H first chaos pass #3 and Thread E's standing principle - where a rule genuinely cannot know, SAY SO rather than commit silently. Test scenario register TS-7 and TS-6c's tail. Honours REQ-PIPE-052's deferral, in which 'hold for a human' appears exactly once in the whole register and nowhere else. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "IF no slot can be assigned by the rule and the supply cannot be recorded as a resupply of a filled slot, THEN THE SYSTEM SHALL hold it for a human."
      - "THE SYSTEM SHALL NOT assign a held supply to a slot whose claim window has not opened, under any fallback, default or recovery path."
      - "WHILE a supply is held, THE SYSTEM SHALL keep it staged, and SHALL NOT promote it or classify its arrival."
      - "WHEN a supply is held, THE SYSTEM SHALL state why no slot could be assigned, naming the slots it considered and why each was unavailable."
      - "THE SYSTEM SHALL report a held supply as an event needing action, distinguished from an informational one."
      - "WHILE a supply is held, THE SYSTEM SHALL leave every slot's state unchanged."
      - "THE SYSTEM SHALL continue to process every other dataset and every other delivery while a supply is held."
      - "THE SYSTEM SHALL count and report outstanding holds together, and SHALL NOT present one element per held supply."
    non_functional_requirements:
      - "A hold is the correct output of the rule, not a defect in it - the same reasoning that established a queue of red supplies is a work queue rather than an obstruction. Treating 'something is waiting for a human' as a failure mode is the error to avoid."
      - "At ~30 datasets, holds must aggregate. A design that is fine at two datasets produces thirty banners at thirty, and a banner per dataset is how people learn to ignore the whole class."
      - "A held supply is a state that persists across runs and must be re-presented on every run until it is resolved, not reported once into a log nobody re-reads."
      - "The resolution path does not exist until sprint 12, so a hold built now is a dead end by construction. That is acceptable for a build order but must be stated, because a hold nobody can clear is indistinguishable from a bug."
    dependencies: [REQ-PIPE-062, REQ-PIPE-063]
    decisions:
      - "Decided HOLD, never default forward. Defaulting a supply nothing can place into a future slot is the forward cascade again, arriving by the recovery path rather than by the rule."
      - "Decided this is a standing principle rather than a one-off, and Keith endorsed it as such: where a rule genuinely cannot know, SAY SO rather than commit silently. It has now produced three separate requirements in this area alone - this one, the ambiguity marking in REQ-PIPE-065, and the duplicate-file hold in REQ-PIPE-059."
      - "Decided a held supply stays STAGED rather than being rejected or discarded. Staging asserts only that this landed at this time, which is true regardless of where it eventually files, so holding costs nothing and loses nothing."
      - "The reachable case, so the test has something real to drive: a slot is skipped, a later slot is filled, monotonic filling closes the skipped one, and the genuine backfill for it then turns up. Nothing is claimable and nothing may be invented (TS-6c's tail, TS-7)."

      - >
        SETTLED 2026-09-24 (Keith), answering the open question this
        requirement carried, and REQ-PIPE-059's identical one, together.
        A held supply IS LOADED into staging but is NOT QA'd
        automatically. Keith's reasoning, which is sharper than the
        options as drafted: the single-table checks could run without a
        period, but drift and previous-period comparison cannot, so
        partial QA produces a verdict that has to be thrown away once
        the slot is known - and worse, possibly a GREEN one sitting in
        history against no period at all.
      - >
        The resolution path, and it is what stops the hold being a dead
        end: the hold surfaces as an event needing action; a human then
        either ASSIGNS each file to a slot, or REJECTS one of them
        (Keith added the reject case, 2026-09-24). Assignment is what
        unblocks QA, which then runs against the right period's schema.
        So this is not simply "no checks until filed" - there is a
        human-initiated path, and it is the same act as resolving the
        hold. The write path itself belongs with the decision log in
        sprint 12.
      - >
        WHAT HOLDING COSTS, stated generally because it applies to every
        hold in this model, not only to this requirement's trigger. A
        held table gets NO VIEW, because REQ-PIPE-035 forbids choosing
        between candidates, so it is unqueryable for that run. Every
        other dataset in the delivery is processed, assigned and QA'd
        normally. But any cross-table check READING a held table reads
        RED naming it - so holding one table reddens checks on others.
        The blast radius is not zero; it is scoped to what actually
        depends on the held thing.
      - >
        The worked example behind that is Keith's eight-file Child
        Protection case - cp_clients and cp_placements each arriving
        twice - and it belongs to REQ-PIPE-059's duplicate-file hold,
        NOT to this requirement's own trigger, which is a supply no slot
        can claim. Noted because the two holds share consequences and a
        reader could otherwise take the example as describing this rule.
        Its cp_clients detail is real rather than hypothetical:
        cp_notifications, cp_investigations and cp_placements all carry
        a referential check against it.

  - id: REQ-PIPE-065
    title: An uncertain assignment says it is uncertain, and an arrival into a filled slot is reported
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an operator, I want to be shown the filings the rule was not sure about and the supplies that landed on top of something already accepted, so that the two cases the rule genuinely cannot resolve reach a person while they are still cheap to correct."
    moscow: must
    status: built
    linked_tests:
      - tests/test_landed_on_accepted.py
      - tests/test_assignment.py
    implemented_by:
      - qa_tools/common/landed_on_accepted.py::report
      - qa_tools/common/landed_on_accepted.py::may_auto_promote
      - qa_tools/common/landed_on_accepted.py::LandedOnAccepted
      - qa_tools/common/assignment.py::assign
      - qa_tools/common/assignment.py::Assignment
    unmet_criteria:
      - criterion: >-
          Criteria 2 and 8, in part - surfacing an ambiguous assignment for
          review, and reporting both cases as warnings that do not stop
          processing. The marks and the report are produced and tested; no
          run emits them yet.
        why: >-
          Both need a filing to attach to, and REQ-PIPE-062's filings are
          deliberately not recorded until promotion exists. The report also
          needs to know WHEN a supply was accepted, which is promotion state
          and has no source until batch 4. Built and unwired rather than
          approximated from arrival state, which would report the wrong
          instant.
        owner: the promotion sprint (batch 4), with REQ-DASH-070 for the UI
    evidence:
      - >
        2026-09-25: the ambiguity mark is tested against a CONTROL that must
        NOT be marked - if every oldest-claimable assignment were flagged the
        mark would carry no information at all - and against an on-time
        assignment, which is never ambiguous.
      - >
        2026-09-25: a test of mine had criterion 1 backwards and the run
        caught it. It expected ambiguity where the chosen slot WAS the oldest,
        which can never have an earlier unfilled slot by construction. The
        real case is a slot closed by monotonic filling sitting unfilled while
        a later claimable one is taken - late for the later slot, or a
        backfill for the closed one, and no rule can tell.
      - >
        2026-09-25: proximity is proved to be the explanation and not the
        trigger by reporting the SAME arrival with and without an adjacent
        window - both fire, and only the wording differs. That is the whole
        reason the threshold version was rejected: any "within X" number is
        arbitrary and a case just outside it slips through in silence.
      - >
        2026-09-25: criterion 6 tested directly - an arrival for a slot that
        was never filled stays silent, so the ordinary repair path after a
        rejection does not become wallpaper.
      - >
        2026-09-25: criterion 9 exists as a real function rather than as prose
        in a sprint-11 requirement, and a test asserts it cannot see the new
        supply's own status - otherwise it could be talked into promoting a
        green duplicate over data already accepted. That carve-out went
        missing once already as an IOU against work that did not exist.
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    source: "Keith's own proposal, 2026-09-21, plans/supply-model.md Thread E - 'arrival into an already-filled slot: warn, and never auto-promote' - plus the ambiguous-assignment default in the same thread. Test scenario register TS-4, TS-1's tail, TS-3a and TS-3c. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "WHERE a supply is assigned to the oldest claimable unfilled slot while an earlier slot for the same dataset is also unfilled, THE SYSTEM SHALL mark that assignment as made under ambiguity."
      - "THE SYSTEM SHALL surface an assignment made under ambiguity for review, and SHALL NOT present it as certain."
      - "WHEN a supply is recorded against a slot already filled by a promoted supply, THE SYSTEM SHALL report it, naming when the existing supply was accepted."
      - "WHERE such an arrival landed close to an adjacent slot's claim window opening, THE SYSTEM SHALL include that proximity in the explanation."
      - "THE SYSTEM SHALL NOT use proximity to a claim window as the trigger for that report."
      - "THE SYSTEM SHALL NOT report an arrival into a slot that was never filled, so that the ordinary repair path after a rejection stays silent."
      - "THE SYSTEM SHALL name, in that report, the three responses available - accepting the supply as a correction, re-filing it to another slot, and rejecting it as a duplicate."
      - "THE SYSTEM SHALL report these as warnings rather than failures, and SHALL NOT stop processing on either."
      - "THE SYSTEM SHALL NOT automatically promote a supply that landed in a slot already filled by a promoted supply, whatever that supply's own status."
    non_functional_requirements:
      - "On a healthy feed an arrival into an accepted slot is rare, which is what keeps the report meaningful rather than becoming wallpaper at 30 datasets. If it turns out to be common, that is a signal about the claim windows, not a reason to suppress the report."
      - "The trigger is STRUCTURAL - the slot had been promoted into, and something arrived anyway - so there is nothing to tune. Keep it that way: the version this replaced needed a 'within X of the window opening' threshold, and any such X is arbitrary, with a case just outside it slipping through silently."
      - "An assignment marked uncertain must stay visible until somebody looks at it, and must not be cleared by the next run simply passing over it again."
    dependencies: [REQ-PIPE-062]
    decisions:
      - "Decided the trigger is a STRUCTURAL condition rather than a magic number (Keith's own proposal, 2026-09-21, replacing a near-a-window-boundary trigger). The slot had been promoted into and something arrived anyway; nothing to configure. Boundary proximity survives as the EXPLANATION rather than the trigger - the message reads 'a supply arrived for Monday, which was already accepted at 16:00. It landed 3 minutes before Tuesday's window opened - it may belong to Tuesday', versus the same message without the second sentence where there is no proximity. Same trigger, different diagnosis."
      - "Decided the distinction the boundary rule could not draw: a resupply after REJECTION is the expected repair path, routine and silent, because the slot was never filled. A resupply after ACCEPTANCE means we had already accepted something for this period, which is odd and gets reported."
      - "Decided WARNING, not error, because one legitimate case remains: a supplier realises the extract they sent was wrong - wrong period, wrong filter - even though it passed every check. Data can be clean and still be wrong, and that is the limit of any check suite."
      - "Decided the ambiguous case DEFAULTS BACKWARD but is marked. An arrival when a prior slot is unfilled cannot be told apart from a late one by any rule, so it takes the oldest claimable unfilled slot since late is commoner than early - marked as assigned under ambiguity and surfaced for review. Cheap to correct, because filing is mutable and the verdict recomputes."
      - "CARRIED HERE because sprint 11 owns the act and this requirement owns the detection, and the gap must not be lost between them: a supply landing in a filled slot NEVER AUTO-PROMOTES, whatever its status. Without that carve-out the amber-or-green auto-promotion rule would let a supplier's accidental duplicate send silently supersede data already accepted, with the only trace a superseded table nobody looked at. Filling an empty slot is routine; replacing accepted data is a decision."
      - >
        SETTLED 2026-09-24 (Keith): that carve-out is now CRITERION 9
        here, rather than a decision pointing at sprint 11. Found during
        sign-off: it is the rule standing between a supplier's
        accidental duplicate send and the silent replacement of accepted
        data, and it existed only as prose inside this requirement -
        no criterion here, and no requirement anywhere owning it. Sprint
        11 has none yet, and REQ-PIPE-062 criterion 6 says only that a
        promotion FILLS a slot, which is a different statement.
      - >
        That is the same shape as the batch-3 failure this project
        already recorded: an IOU written against work that does not
        exist, appearing exactly once in the register, in the deferral
        itself. Detection and the carve-out now travel together, and
        sprint 11 can restate it when it is scoped - a duplicated rule
        is cheap, an unowned one is not.
      - >
        ALSO SETTLED 2026-09-24 (Keith): MoSCoW raised from SHOULD to
        MUST. Unbuilt, this requirement leaves ambiguous assignments
        presented as CERTAIN, which is a false-confidence problem rather
        than a missing nicety - and everything either side of it in this
        batch is a must.
      - "Recorded so it is not re-proposed: the content check survives as a DETECTOR, not a decider. 'This supply does not look like the period it is filed under' is a legitimate, non-circular QA finding - it is not making the call - and it is the only thing that turns a wrong default filing into something a human sees rather than something that sits there quietly. NO REQUIREMENT OWNS IT; it is a check and belongs with batch 5's check work, and it is recorded here so it survives the deletion of Thread B."

  - id: REQ-PIPE-066
    title: Early, on time and late are measured against the slot the supply was filed to
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an agency data owner, I want lateness measured against the period a supply was actually filed to, so that a supply filed to Q3 is never reported late for Q2 and a genuinely early one is never reported twelve weeks late."
    moscow: must
    status: built
    linked_tests:
      - tests/test_arrival_classification.py
      - tests/test_dataset_stats.py
      - tests/test_build_dashboard_data.py
      - tests/test_build_cp_dashboard_data.py
    implemented_by:
      - qa_tools/common/arrival_classification.py::classify
      - qa_tools/common/arrival_classification.py::describe
      - qa_tools/bdm/dataset_stats.py::_arrival
      - qa_tools/cp/dataset_stats.py::_arrival
    unmet_criteria:
      - criterion: >-
          Criterion 9, in part - recording the classification with the supply
          so every consumer reads it rather than recomputing. The classifier
          is built and tested; nothing records its output yet.
        why: >-
          It classifies against the ASSIGNED SLOT, and REQ-PIPE-062's filings
          are deliberately not recorded until promotion exists. With no
          filing there is no slot, so every real supply would classify as
          UNFILED - correct by criterion 8 and useless as a record.
        owner: the promotion sprint (batch 4)
      - criterion: >-
          Criteria 10 and 11 - retiring the arrival-date derivation, and
          retiring the path that blanks a resupply's recorded classification
          in the dashboard template.
        why: >-
          Keith's call, 2026-09-25, on measured evidence: retiring the old
          derivation today would replace the dashboard's current answer with
          352 supplies reading "unfiled", because the new classifier has no
          filings to measure against. Un-blanking the resupply status has the
          same shape in reverse - it would surface the OLD derivation's
          answer for resupplies, which decision 9 establishes is meaningless,
          so the blanking's own justification still holds until the new
          derivation is live. Both retirements are one change with the
          recording above, not before it.
        owner: the promotion sprint (batch 4)
      - criterion: >-
          Criterion 12, in part - the arrival block's `earliest_extract`
          survives.
        why: >-
          max_lag_hours is retired, verified dead first. earliest_extract is
          not dead: it feeds lastArrival.arrivedAt, which the template
          renders in eight places, and it feeds the live classify_arrival()
          that criteria 10 and 11 cannot yet retire. It is a supplier-derived
          instant that REQ-PIPE-060 criterion 11 already forbids as an
          arrival time, so it goes when our own receipt instant replaces it -
          in the same change as the rest.
        owner: the promotion sprint (batch 4)
    evidence:
      - >
        2026-09-25: both failures of the derivation this replaces are tested
        directly, because both are plausible enough to be reinstated by
        accident. A quarterly supply arriving 2026-07-25 for the 2026-08-01
        anchor now classifies EARLY; under the old backwards-looking
        cycle_start() it resolved to the 2026-05-01 anchor and read about
        twelve weeks late for a quarter filled months ago. A 10pm arrival
        meant for the next day classifies early against tomorrow's slot
        instead of late against today's.
      - >
        2026-09-25: a CONTROL asserts the same arrival instant classifies
        differently against a different slot - late against yesterday's,
        early against tomorrow's. Without it the signature change could be
        doing nothing and the tests would not notice.
      - >
        2026-09-25: max_lag_hours retired, and VERIFIED DEAD BEFORE
        DELETING rather than on the strength of the decision that named it.
        Zero references in the dashboard template, zero in the JS suite; the
        only references outside the pipeline were tests asserting it was
        carried. It was never an arrival measure at all - MAX(extract_timestamp
        minus date_registered), a within-supply staleness figure sitting in an
        arrival block.
      - >
        2026-09-25: the 20-line filter whose stated justification was that
        deliberately-disordered rows "directly distort classify_arrival()'s
        real early/onTime/late classification" is retained for now, because
        that classification is retained for now. It goes with criteria 10 and
        11, and its reason for existing goes with it.
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    source: "Keith, delivery sprint 10, plans/supply-model.md Thread D - settled 2026-09-21, and every substantive decision in that thread is uncarried by any requirement. Test scenario register TS-9, TS-10, TS-16. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "THE SYSTEM SHALL classify a supply's arrival as early, on time or late against the due instant of the slot it was ASSIGNED to."
      - "THE SYSTEM SHALL NOT derive the period or slot used for classification from the arrival date."
      - "THE SYSTEM SHALL classify a supply as early where it arrived before its slot's due instant."
      - "THE SYSTEM SHALL classify a supply as on time where it arrived at or before its slot's due instant plus that slot's own grace allowance."
      - "THE SYSTEM SHALL classify a supply as late otherwise."
      - "THE SYSTEM SHALL classify each dataset's supply independently, so that one late table in a delivery does not make its punctual siblings late."
      - "THE SYSTEM SHALL classify a supply whose checks reported red, and a supply a human rejected, on the same terms as a promoted one."
      - "WHERE a supply has no assigned slot, THE SYSTEM SHALL report it as unfiled, and SHALL NOT report it as early, on time or late."
      - "THE SYSTEM SHALL record the classification with the supply, and every consumer SHALL read that record rather than recomputing it."
      - "THE SYSTEM SHALL retire the classification derived from an arrival date, and SHALL NOT leave two derivations of arrival classification in the codebase."
      - "THE SYSTEM SHALL retire every path that suppresses or reinterprets a recorded arrival classification, so that what a reader is shown is what was recorded."
      - "THE SYSTEM SHALL retire the arrival block committed with a run's dataset statistics, and SHALL NOT carry a supplier-derived arrival time or a lag measure through the dashboard build."
    non_functional_requirements:
      - "Two implementations of one concept that can disagree is item 74's exact failure mode, and it is the reason this is a signature change rather than an addition. The visible symptom of getting it wrong is 'filed to Q3, reported late for Q2', and the current derivation is live in BOTH dashboard build paths - pipeline/build_dashboard_data.py and pipeline/build_cp_dashboard_data.py."
      - "The usual seeded regenerate-and-diff check does NOT apply here, and that has to be said out loud before the work starts. Today's generated history measures 0 early, 240 on time, 112 late under the arrival-date derivation; the new derivation will legitimately produce different numbers, so a diff against today's output is evidence of the change working, not of a regression."
      - "Classification must be computable at check time, before promotion, because a rejected supply still gets classified. Anything requiring promotion state would make the record depend on a decision that may never be taken."
      - "The verdict travels with the supply, so the dashboard's JS never recomputes classification - the duplicated-logic surface shrinks rather than grows. cycleStartDate() still earns its place for the as-of picker's period maths, and that is a different job."
    dependencies: [REQ-PIPE-062, REQ-PIPE-048]
    decisions:
      - "The gap being fixed, with its worked examples. classify_arrival() derives the cycle from the arrival date via cycle_start(), which is defined as the most recent expected day AT OR BEFORE its input - it can only look backwards. So 'early' today can only mean early within a cycle. A quarterly supply arriving 2026-07-25 for the 2026-08-01 anchor resolves to the 2026-05-01 anchor and reads about twelve weeks LATE for a quarter that was filled months ago; a 10pm daily arrival intended for the next day reads late against the current one."
      - "Decided the fix is a SIGNATURE CHANGE - classify against the assigned slot rather than a cadence-derived cycle - not a new cadence property. Assignment already decides the period using information cycle_start() does not have, namely which slots are already filled, and deriving it a second time here creates two implementations of one concept that can disagree."
      - "Decided this REMOVES a property rather than adding one, which is the part most likely to be undone by a well-meaning later change: once the slot is known, 'early' is just arrival before due_at, so the earliness window is a filing parameter and not a cadence one. There is no separate earliness concept left in classification."
      - "Decided a REJECTED supply still gets classified. 'Arrived three weeks late AND was bad' is exactly what belongs on the record for a supply that never got promoted, and it falls out of assignment happening before promotion rather than at it."
      - "Decided classification is PER TABLE, not per delivery (TS-16). If cp_clients lands 09:00 and cp_placements 14:00, each gets its own verdict rather than the whole delivery taking the worst - a single late table stops dragging five punctual ones down. It follows from slots being per-table."
      - "Decided nothing measures how early a supply is in order to assign it; earliness is a reported consequence of the assignment (TS-9). That is what makes classification a pure function of arrival instant and assigned slot."
      - "Decided the grace allowance used is the SLOT's own, which is per-dataset. The two datasets in this repo genuinely differ - Birth Registrations an hour, Child Protection eight hours - so taking a collection-level or asset-level grace would be one table's answer imposed on the rest."
      - >
        SETTLED 2026-09-24 (Keith): criterion 11 added, because
        criterion 10 retires the old DERIVATION and the resupply case
        escapes between the words. buildSupplyHistory() in the dashboard
        template blanks arrivalStatus for every resupply
        (idx===0 ? arrival.arrivalStatus : undefined). That is not a
        second derivation - it is a DELETION of the recorded answer, in
        a different language, in a different file, so a criterion about
        derivations does not reach it.
      - >
        Its own comment justifies the blanking as a category error: a
        later attempt "reuses its predecessor's real row data via the
        generator's churn design, so comparing its stale
        extract_timestamp against whatever cycle it eventually lands in"
        means nothing. That reasoning was right, and it rests on exactly
        the two things this requirement removes - the supplier's
        extract_timestamp, replaced by OUR receipt instant, and a cycle
        inferred from the arrival date, replaced by the assigned slot. A
        resupply has both a receipt instant and an assigned
        relationship, so under this requirement its classification is
        real and meaningful for the first time.
      - >
        Left unfixed, the failure is quiet and durable: the work would
        be done, a correct answer produced for resupplies, and the
        screen would still show nothing - with a comment beside it that
        still reads as sound, so the next reader leaves it alone. Worth
        noting the justification also leans on a GENERATOR artefact (the
        churn design) rather than on a fact about real supply, which is
        a second reason it should not outlive the change.
      - >
        SETTLED 2026-09-24 (Keith), resolving pre-build Q11: the arrival
        block in dataset_stats.json GOES. His own framing - "that should
        not be in the JSON, that should be like a check that we craft".
        Criterion 12 retires it.
      - >
        It held two things with different reasons for going.
        EARLIEST_EXTRACT is MIN(extract_timestamp) over the SUPPLIER's
        own column, which REQ-PIPE-060 criterion 11 forbids as an
        arrival time, and it carried a 20-line filter whose stated
        justification was that deliberately-disordered rows "directly
        distort pipeline.cadence.classify_arrival()'s real
        early/onTime/late classification" - the very classification this
        requirement deletes. The workaround's reason for existing goes
        with it.
      - >
        MAX_LAG_HOURS is not an arrival measure at all despite its
        position in that block: it is MAX(extract_timestamp minus
        date_registered), a WITHIN-SUPPLY staleness figure. Verified
        2026-09-24 that it is computed, committed, carried through both
        dashboard build paths as maxLagHours - AND RENDERED NOWHERE. The
        only references outside the pipeline are tests asserting it was
        carried. Dead weight with a misleading name.
      - >
        REJECTED keeping either, renamed, as a presentation statistic.
        The real finding in here is EXTRACT-TO-RECEIPT LAG - the gap
        between when a supplier extracted their data and when we
        received it, genuine signal about supplier behaviour and quite
        different from whether the supply was on time. Keith's call is
        that it belongs as a CHECK rather than a committed stat, which
        is also where a tolerance and a verdict can live. Logged as
        plans/running-thoughts.md #43. Note it needs THIS requirement's
        receipt instant to compute, so it is not the deleted field
        wearing a new name.

  - id: REQ-PIPE-067
    title: An arrival verdict follows its filing, and is never a frozen fact
    date_written: "2026-09-23"
    signed_off:
      by: Keith
      date: "2026-09-24"
    story: "As an agency data owner, I want a supply that was reported late only because it was filed wrongly to stop reading late once it is filed correctly, so that the record never keeps a verdict everybody knows to be untrue."
    moscow: must
    status: built
    linked_tests:
      - tests/test_refiling.py
      - tests/test_arrival_classification.py
    implemented_by:
      - qa_tools/common/filing.py::refile
      - qa_tools/common/filing.py::classification_of
      - qa_tools/common/arrival_classification.py::classify
    unmet_criteria:
      - criterion: >-
          Criterion 4, in part - presenting the classification current for a
          supply's present filing. The verdict is computed from the current
          filing on every read and is never cached; nothing presents it to a
          reader yet.
        why: >-
          It travels with the supply, and REQ-PIPE-062's filings are not
          recorded until promotion exists - so there is nothing to present.
          The dashboard side is REQ-DASH-070's. Recorded rather than counted
          as done, because "computed correctly" and "shown correctly" are
          different claims and this requirement makes both.
        owner: the promotion sprint (batch 4), with REQ-DASH-070 for the UI
    evidence:
      - >
        2026-09-25: the fixture deliberately STARTS FROM THE WRONG ANSWER and
        a test asserts it - a supply filed to 2026-Q2 reads LATE - so the test
        that it reads EARLY once re-filed to 2026-Q3 cannot pass vacuously.
        That is the whole requirement in two assertions: a supply reported
        late purely because it was misfiled was never actually late.
      - >
        2026-09-25: criterion 2 is asserted STRUCTURALLY as well as
        behaviourally - the filing record carries no classification field at
        all, so there is nothing that could go stale. The verdict is derived
        on every read rather than stored and refreshed.
      - >
        2026-09-25: criterion 5 is BUILT NOW even though its trace cannot be
        followed until sprint 12, because the failure named at sign-off is
        specific - five of six criteria built and the sixth quietly skipped as
        un-buildable. The recomputation carries a reference to the re-filing
        that caused it, the reference is a REQUIRED argument rather than an
        optional one, and it dangles until the decision log exists to resolve
        it.
      - >
        2026-09-25: a re-file is one atomic record carrying both the from-slot
        and the to-slot, asserted directly. Under the composed
        demote-then-promote version it appears in the decision log as two
        entries and a reader a year later has to infer they were one act.
      - >
        2026-09-25: the cost constraint is asserted by PARSING THE FUNCTION
        BODY rather than grepping it - no call into a dataset's history and no
        loop at all. A first version of that test grepped the whole source and
        failed on the word "for" inside the docstring, which is a reminder
        that a structural assertion needs to look at code rather than text.
      - >
        2026-09-25: pipeline/cadence.py's docstring said the opposite - that
        the verdict is "embedded as a fixed historical fact". Corrected in the
        same change rather than left as a second account: the arrival TIME
        still never changes, the VERDICT is a function of the current filing.
      - 'Full Python suite: SEE COMMIT. JS suite: SEE COMMIT.'
    source: "Keith, delivery sprint 10, plans/supply-model.md Thread D's second correction, settled conditionally 2026-09-21 and unconditionally once re-filing was confirmed in scope 2026-09-22. Test scenario register TS-11. Scoped by delivery-scoper, sprints 7-10 pass, 2026-09-23."
    acceptance_criteria:
      - "WHEN a supply is re-filed to a different slot, THE SYSTEM SHALL recompute its arrival classification against the slot it is now filed to."
      - "THE SYSTEM SHALL NOT treat an arrival classification as a frozen historical fact."
      - "THE SYSTEM SHALL leave a supply's recorded arrival instant unchanged when its classification is recomputed."
      - "THE SYSTEM SHALL present the classification current for a supply's present filing, and SHALL NOT present one computed against a filing that has since changed."
      - "THE SYSTEM SHALL make a recomputed classification traceable to the re-filing that caused it."
      - "WHERE a supply's filing has not changed, THE SYSTEM SHALL leave its classification unchanged, and SHALL NOT recompute it on every run."
    non_functional_requirements:
      - "Recomputation must be local to the supply that moved. A re-file changes one supply's verdict, and a design requiring the history to be replayed to answer that is one that stops being usable once a daily feed has years behind it."
      - "The live dashboard defaults to as-corrected, so a recomputed verdict legitimately changes what a past as-of view shows. That is intended rather than a defect; the as-published answer lives in the snapshot archive. Say so where a reader will meet it, or it reads as history rewriting itself."
      - "pipeline/cadence.py's own docstring currently states the opposite - that the verdict is computed once, committed, and never needs porting to JS because a past run's arrival time never changes. The arrival TIME still never changes; the VERDICT becomes a function of the current filing. Correct the docstring in the same change rather than leaving two accounts."
    dependencies: [REQ-PIPE-066]
    decisions:
      - "Decided the verdict FOLLOWS the filing (Keith, settled conditionally 2026-09-21 on whether re-filing exists, unconditionally 2026-09-22 when he confirmed he means re-filing - moving a supply between slots - and that it is in scope). A supply reported late purely because it was misfiled was never actually late, and leaving a known-wrong verdict in place for the sake of immutability is the one place this design would knowingly say something untrue."
      - "Decided RE-FILING IS ATOMIC - one decision-log entry with a from-slot, a to-slot and one reason - rather than a demote followed by a promote. The argument that separates them is the decision log itself, which is the reason the log exists rather than a detail of it: under the composed version a re-file appears as two entries and a reader a year later has to infer they were one act, so 'why is this supply in Q3?' becomes a correlation exercise instead of having a single answer."
      - "Decided re-filing does NOT go through un-decide, and this was rejected explicitly rather than never considered. It looks natural - demote to staging, promote into the other period, no third operation - and it was the shape originally proposed. Un-decide and re-file are different acts for different reasons: un-decide says 'this needs another look', re-file says 'this belongs in a different period'. Sharing a mechanism would cost the log its legibility for no saving worth having."
      - "Recorded as a boundary: re-filing itself, its warning when the target slot is already filled, and the rule that a re-file into an occupied slot SUPERSEDES what is there, are sprint 11 and 12 work. This requirement owns only what happens to the VERDICT when a filing moves, which is why it can be built and tested before the write path exists - by moving a filing in a test rather than through the real operator path."
      - "Decided the dashboard's JS never recomputes classification, which is what makes a mutable verdict safe rather than a source of two answers. The verdict travels with the supply; the page renders it."
      - >
        SETTLED 2026-09-24 (Keith): CRITERION 5 IS BUILDABLE NOW AND ITS
        TRACE IS NOT NAVIGABLE UNTIL SPRINT 12. It requires a recomputed
        classification to be traceable to the re-filing that caused it,
        and re-filing is recorded in the DECISION LOG, which is sprint
        12 work. The boundary decision above says this requirement can
        be built and tested before the write path exists, by moving a
        filing in a test - and a test that moves a filing produces no
        log entry to point at.
      - >
        So the criterion is met by RECORDING THE REFERENCE - the
        recomputation carries an identifier for the re-filing that
        caused it - and that reference dangles until the decision log
        exists to resolve it. Stated here rather than left for whoever
        builds it to discover, because the alternative failure is
        specific: five of six criteria built, the sixth quietly skipped
        as un-buildable, and the requirement reported done.
  - id: REQ-DASH-071
    title: One way to write a date, everywhere a person reads one
    story: >-
      As someone reading the dashboard or the mothman CLI, I want every
      date and time shown to me in one consistent, readable form on the
      asset's own clock, so that I never have to convert between zones,
      decode a raw timestamp, or work out which of two adjacent tiles I
      should believe.
    moscow: must
    status: built
    source: >-
      Keith, voice-dictated, 2026-09-24 evening, settling the visual
      critic's Q4 and widening it himself - "let's make a call... that
      will standardise the display of all timestamps and dates across the
      entire code base". Scoped further 2026-09-24/25 through
      plans/post-build-review.md's Q4 and relative-time pass. HAND-DRAFTED
      2026-09-25, NOT through delivery-scoper - flagged per Keith's own
      standing rule of 2026-09-23 that a batch's provenance is stated
      before it is presented, not after being asked.
    signed_off:
      by: Keith
      date: "2026-09-25"
    acceptance_criteria:
      - >-
        THE SYSTEM SHALL render a date, wherever a person reads one, as
        the weekday, the day, the month and the year - for example
        "Friday, 29 September 2026".
      - >-
        WHERE a time is shown with a date, THE SYSTEM SHALL prefix it to
        that same date string - for example "2:15pm Friday, 29 September
        2026" - and SHALL NOT use a second date format for the pair.
      - >-
        THE SYSTEM SHALL write the time in lowercase am or pm with no full
        stops, no leading zero on the hour, and the minutes always shown
        even on the hour, so that a column of times aligns.
      - >-
        THE SYSTEM SHALL always show the year, and SHALL NOT omit it for
        the current year.
      - >-
        THE SYSTEM SHALL render every user-facing instant on the data
        asset's own configured clock.
      - >-
        THE SYSTEM SHALL NOT label the timezone on a user-facing instant,
        because there is only one - and SHALL NOT show two zones for the
        same fact.
      - >-
        THE SYSTEM SHALL NOT render a raw ISO-8601 timestamp anywhere a
        person can see one.
      - >-
        WHERE output echoes a value that is written in a configuration
        file, THE SYSTEM SHALL keep that value's own written form, so that
        a reader can compare the output against the file by eye.
      - >-
        THE SYSTEM SHALL resolve every user-facing date and time through
        one shared implementation per runtime, and SHALL NOT grow a second
        implementation of the same format.
      - >-
        THE SYSTEM SHALL NOT change how any instant is STORED - every
        stored instant keeps its ISO-8601 form and its own offset.
      - >-
        WHERE a relative time is shown, THE SYSTEM SHALL express it as "X
        unit ago" for the past and "in X unit" for the future, scaling by
        minutes, hours, days, weeks, months and years, and SHALL NOT fall
        back to an absolute date at any threshold.
      - >-
        WHERE a relative time is shown on a page that is being read as of
        a selected date, THE SYSTEM SHALL compute it relative to that
        selected date rather than to the reader's own clock.
      - >-
        THE SYSTEM SHALL state when the page a reader is looking at was
        BUILT, taken from the build itself, and SHALL NOT present any
        elapsed time that is measured from when the reader opened it.
      - >-
        IF the data asset's timezone is absent or cannot be resolved,
        THEN THE SYSTEM SHALL fail loudly rather than rendering any
        instant, and SHALL NOT fall back to the reader's own clock or
        to UTC.
    non_functional_requirements:
      - >-
        Mechanical breadth. This lands on the dashboard's own date
        helpers, the supply-history table, the SLA tile, the as-of
        control, and the mothman schedule output - so the change is wide
        and shallow, and the risk is a site missed rather than a site
        wrong. Enumerate the call sites before changing any of them.
      - >-
        The asset clock already exists and is already correct in the
        engine. This requirement must consume it, not reimplement it -
        REQ-PIPE-048 exists precisely so no second offset is carried
        anywhere.
    dependencies:
      - REQ-PIPE-048
      - REQ-QAC-047
    decisions:
      - >-
        Decided ONE date string with an optional time in front of it,
        rather than two formats. Keith's two dictated examples disagreed
        on the comma, and the cheapest way to settle that is not to pick a
        winner but to stop having two strings - so there is no rule about
        when the comma appears, because it always does, in the same place.
      - >-
        Decided the year is ALWAYS shown, not only when it is not the
        current year. Keith's own call. The narrower reading needs a rule
        and can surprise a reader; this one needs neither, and this
        dashboard shows several years of history at once.
      - >-
        Decided the absence of a timezone label MEANS everything is on the
        asset's clock - Keith's own words, and the substantive answer to
        the visual critic's Q4. Rejected keeping UTC and formatting it
        better, which leaves a reader adding eight hours in their head
        between two adjacent tiles, against a requirement whose own story
        is that a supply arriving at 10pm in Perth is not read as arriving
        the following afternoon.
      - >-
        Decided this is a DISPLAY standard and changes nothing about
        storage. Recorded explicitly because the distinction is
        load-bearing and nothing in the dictated version says it -
        qa_results/ is a permanent machine-read history, REQ-PIPE-048
        exists to make its offsets explicit, and changing what is written
        would break the lot.
      - >-
        Decided config-echoing output is EXEMPT - Keith, 2026-09-25.
        A column that echoes a configured value keeps its written form so
        a reader can diff the table against the file by eye. This
        SUPERSEDES his own 2026-09-24 call that the CLI matches the
        standard with no exemption. Both are on the record in
        plans/post-build-review.md, along with why the question was asked
        twice - a stale "still open" line sent a session to him with a
        lean opposite to the decision he had already made.
      - >-
        Decided the RELATIVE half is parked - Keith's own word, "let's
        park the whole relative date thing". Its FORMAT is specified here
        anyway, both directions included, so unparking is a matter of
        wiring rather than re-deciding. What is parked is the wiring into
        the sites a pass identified as high value - the last-QA-run
        column, the snapshots picker, latest arrival, release notes and
        plans dates.
      - >-
        Decided relative time must be computed against the SELECTED as-of
        date rather than the reader's own clock, and decided it here
        rather than at build time. Viewing as of a date in 2027, a
        "2 days ago" measured against the real clock is not unhelpful, it
        is false. It is cheap to build in and expensive to retrofit, which
        is the whole reason parking the rest is safe.
      - >-
        Decided the masthead's "Live - updated Ns ago" clock states when
        the page was BUILT - Keith, 2026-09-25, answering the draft's
        own open question by questioning the element instead.
        Investigating it found the code's own section header reads
        'Boot + fake "live" clock', and the implementation is a counter
        starting at 4 that adds 7 every 7 seconds - measuring nothing,
        counting up from whenever the tab was opened, beside a pulsing
        green "live" dot on a static file CI built days earlier
        (post-build-review #60). His framing - "it should be baked in
        when the dashboard gets rebuilt... otherwise it doesn't have any
        updated information in it" - is the only honest reading, and it
        removes the setInterval that was this requirement's own
        second-implementation problem.
      - >-
        Decided an unresolvable asset timezone FAILS LOUDLY - Keith,
        2026-09-25, "no need for a graceful fallback".
        assetTodayDateStr() falls back silently to UTC today, which is
        the fixed bug returning with no signal (post-build-review #35's
        second residue, and the same question #5 raises from the other
        side). A dashboard that quietly re-interprets every date on the
        page is worse than one that refuses to draw, because only the
        second is noticed.
      - >-
        Rejected splitting this into a dashboard requirement and a CLI
        one. The failure it fixes is two surfaces disagreeing about the
        same instant, so one requirement covering both is the point; a
        split would let them drift again while both read as built.
      - >-
        Decided a PLAIN CALENDAR DATE is not an instant and is rendered
        as written, in both twins. "2026-09-29" names a day, not a
        moment, so there is nothing to place on any clock - putting it
        through the zone machinery would re-read it as midnight UTC and,
        in a zone behind UTC, hand back the day before. Found while
        wiring, not while designing.
      - >-
        Decided a year is TWELVE MONTHS rather than 365 days in the
        relative form. With a 30-day month and a 365-day year there is a
        five-day window that prints "12 months ago", which Keith ruled
        out on 2026-09-24; making the year the month's own multiple
        removes the window instead of special-casing it. Folding
        fmtRelativeTime() into the shared rule also changed its
        counting from rounded to floored, so 1000 days now reads "2
        years ago" rather than "3" - the committed table's own
        never-falls-back case (6.7 years to "6 years ago") settles the
        direction.
      - >-
        Decided the RAW, UNBUILT TEMPLATE says "Not built" and draws no
        instant at all, rather than being given a clock of its own. It
        has no asset, so it has no asset clock, which is the same
        "nothing embedded" fact as its null HIERARCHY and not
        criterion 14's "cannot be resolved" case - there is nothing to
        resolve. Rejected letting the formatter fall back for it, which
        would have put a silent branch inside the one function whose
        job is to refuse one.
      - >-
        Known narrowing, recorded rather than fixed: a run_date reaches
        several render sites as a Date built at midnight UTC
        (buildRealDataset's own toDate), so it is placed on the asset's
        clock like any other instant. For an asset EAST of UTC - which
        every deployment of this is - that is the same calendar day and
        reads correctly. For one west of UTC it would read a day early,
        and the fix is for toDate to build asset-midnight rather than
        for the formatter to guess. Not done here because toDate's
        output also feeds as-of comparison arithmetic that constructs
        UTC midnight directly, and two conventions coexisting would be
        worse than one narrow one.
      - >-
        Known cost, accepted: "Friday, 25 September 2026" is four times
        the width of "2026-09-25", and the dense mono columns that used
        to carry the short form - the supply-history table, the mothman
        schedule table's Due and Claimable columns - are now
        noticeably wider and wrap in a narrow terminal. The standard as
        signed off has no carve-out for a compact column, so it was
        applied everywhere rather than selectively; if a column reads
        worse for it, that is a visual finding against this build, not
        a reason to grow a second format.
    open_questions: []
    linked_tests:
      - tests/test_display_time.py
      - tests-js/display-time.test.js
      - tests/test_dashboard_e2e.py
      - tests/test_cli_schedule.py
      - tests-js/relative-time-and-markers.test.js
    implemented_by:
      - qa_tools/common/display_time.py::format_day
      - qa_tools/common/display_time.py::format_instant
      - qa_tools/common/display_time.py::format_relative
      - dashboard/embed_dashboard_data.py::embed
      - cli/schedule.py::_show_dataset
    evidence:
      - >-
        2026-09-25: the FORMAT lives in display-time-cases.json at the
        repo root, which neither test suite owns. 24 cases - 5 day, 7
        instant, 12 relative - are read by tests/test_display_time.py
        and tests-js/display-time.test.js and run through their own
        side. Same shape as status-cases.json and for the same reason:
        two implementations of one rule drifted once already on this
        project and the drift rendered a check with 14 real violations
        green.
      - >-
        2026-09-25: the call sites were ENUMERATED before anything was
        changed, which the requirement's own non-functional constraint
        asked for - 26 fmtDate, 2 fmtDateShort, 3 fmtArrival, a
        character-sliced wall clock labelled " UTC", a raw ISO string
        with microseconds in the supply-history timing column, a
        toLocaleTimeString with a browser-zone label in the snapshots
        picker, and the masthead counter. The wide-and-shallow risk the
        constraint named is a site missed, so the guard below asserts
        on the page rather than on the formatter.
      - >-
        2026-09-25: the criterion-7 guard was CONFIRMED TO BITE by
        planting the old behaviour back - restoring the raw run_date
        cell fails 6 of the 7 dataset pages, naming the offending
        string. The guard walks every dataset page in a real browser
        and looks for an ISO instant, an ISO date or a bare wall clock
        in what a reader can actually see.
      - >-
        2026-09-25: criterion 14 is asserted from both ends - with no
        asset timezone embedded, and with one Intl cannot resolve, the
        page throws naming the zone rather than drawing a date. That
        replaces assetTodayDateStr()'s own two silent fallbacks to the
        viewer's clock (post-build-review #35's second residue), which
        were the fixed bug returning with no signal.
      - >-
        2026-09-25: criterion 13 is asserted by waiting. The masthead
        used to count up every 7 seconds from a hardcoded 4, so the
        number a reader saw was the age of their own browser tab; the
        test reads the stamp, waits 15 seconds - long enough to have
        caught the old clock twice - and asserts it has not moved.
      - >-
        2026-09-25: criterion 9 has a real gate rather than a
        convention. A test greps the committed template for the
        browser's own date formatters and for a second
        Intl.DateTimeFormat caller, and names the file a new one grew
        in. Number formatting is deliberately not caught by it, because
        a gate that cries wolf earns an exemption list and then gets
        ignored.
      - >-
        2026-09-25: the two runtimes are compared DIRECTLY as well as
        against the table - a real-browser test calls the page's own
        fmtInstant and the CLI's own display_time.format_instant on the
        same three instants and asserts the strings match. The table
        proves each side right on its own; this proves they agree.
      - >-
        2026-09-25: 1407 Python tests and 294 JS tests pass, and all
        nine mothman gates are green - including the real-browser render
        check, which holds the built page to zero console errors and so
        is what would catch a formatter throwing at a viewer. The Python
        suite gained 171 tests and about 42 seconds against the last
        recorded full run the same day; the new ones are mostly
        real-browser, which costs far more per test than the rest.
