  - id: REQ-QAC-017
    title: An accept/reject decision workflow for amber-status supplies
    story: >
      As a data engineer, I want a real, recorded decision on a
      persistently-amber dataset (accept it, or reject it and treat it
      as effectively red), so that "amber" doesn't sit ambiguous
      forever.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/running-thoughts.md #6, same 2026-09-18 batch, scoped with
      Keith 2026-09-19 ("let's tackle item six") - the read-only tension
      in accepting or rejecting an amber supply.
    acceptance_criteria:
      - A human decision on an amber result is recorded somewhere real
        and reflected back in the dashboard's own status.
    linked_tests:
      - tests/test_acceptance_sync.py
    implemented_by:
      - qa_tools/common/acceptance_sync.py::match_decisions
      - qa_tools/common/acceptance_sync.py::build_decisions
      - qa_tools/common/ticket_sync.py::main
      - dashboard/qa-reporting-dashboard.template.html::buildRealDataset
    evidence:
      - >
        2026-09-20: 23 tests cover the decision matcher, including that a
        /reject comment matches its run the same way /accept does, that
        matching is case-insensitive, and that a comment before any real
        run matches nothing.
    decisions:
      - >
        The decision is a real comment on the dataset's own GitHub
        ticket, not a button in the dashboard. The dashboard is a static
        published page with no backend to receive a click, so a button
        would have needed one built purely to record a decision.
      - >
        No run_id has to be typed or copied. Every run already has a real
        arrival window from committed history, so a bare /accept or
        /reject is matched to whichever run's window contains the
        comment's own timestamp.
      - >
        A rejected run's status pill stays amber rather than turning red
        - Keith's own call, 2026-09-19, as the smaller and safer option,
        symmetric with accept rather than repainting the pill.
      - >
        An accepted run stays amber too, with an acknowledgment badge.
        Repainting it green would have made a human decision look like a
        data improvement.
      - >
        The decision is per-run, not standing: a new amber arrival needs
        its own fresh comment, so nobody can accept a dataset once and
        stop looking.

