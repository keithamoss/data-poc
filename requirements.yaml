    evidence:
      - >
        2026-09-20: 6 committed .html.gz snapshots, each a self-contained copy
        openable years later with nothing but a browser.
    decisions:
      - >
        Snapshots are committed and accumulate, deliberately unlike every other generated artifact in this repo, because their whole purpose is to still exist years later.
      - >
