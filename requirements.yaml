  - id: REQ-PIPE-048
    title: One timezone parameter, and every stored instant carries its offset
    date_written: "2026-09-22"
    story: >
      As whoever reads a stored timestamp years from now, I want it to
      say what offset it is in, so that a supply that arrived at 10pm in
      Perth is not read as having arrived the following afternoon.
    moscow: must
    status: built
    source: >
      Keith, 2026-09-21, plans/supply-model.md Thread H chaos-pass items
      4 and 6 - one repo-wide config parameter replacing
      pipeline/cadence.py's hardcoded AWST_OFFSET. Delivery sprint 4, and
      test scenario register TS-31. Scoped by delivery-scoper, batch 1+2
      pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL read the data asset's timezone from exactly one
        configuration value.
      - THE SYSTEM SHALL derive every wall-clock computation from that
        value, and SHALL NOT carry a hardcoded offset anywhere.
      - THE SYSTEM SHALL write every stored timestamp with its own UTC
        offset.
      - IF a timestamp without an offset is encountered, THEN THE SYSTEM
        SHALL fail loudly naming where it came from, and SHALL NOT
        interpret it as UTC and SHALL NOT interpret it as local time.
      - THE SYSTEM SHALL NOT reinterpret an already-stored timestamp
        when the configuration value changes.
      - WHEN a date is interpreted as a point in time, THE SYSTEM SHALL
        take it to mean the end of that day in the asset's timezone.
      - THE SYSTEM SHALL compare instants rather than date strings
        wherever a comparison decides an outcome.
    non_functional_requirements:
      - Every later sprint compares instants, so this must land early
        and must not be revisited. It is small and independent
        deliberately.
      - The current behaviour is correct by coincidence in at least one
        place - clipDatasetToAsOf() compares date STRINGS, which gives
        end-of-day semantics by accident rather than by design. Pin the
        current semantics with a test BEFORE the refactor, not after,
        so the behaviour is provably unchanged when the comparison
        becomes a real instant comparison.
      - An offset stored alongside every value costs nothing, stays
        human-readable, and is self-describing to anyone opening a
        qa_results/ file years later. Without it, changing the config
        parameter retroactively reinterprets every timestamp ever
        written - the same retroactivity problem effective_from exists
        to prevent, arriving by a different door.
      - Enumerate every consumer of a timestamp mechanically before
        calling this done. A shape change to a stored value is exactly
        the class CLAUDE.md's item-74 lesson covers.
      - Config only, no data access, so nothing here constrains CI.
    dependencies: []
    linked_tests:
      - tests/test_asset_time.py
      - tests/test_asset_time_semantics.py
      - tests/test_cadence.py
      - tests/test_dataset_stats.py
      - tests/test_dashboard_e2e.py::TestTodayIsTheAssetsToday
    implemented_by:
      - qa_tools/common/asset_time.py::asset_timezone
      - qa_tools/common/asset_time.py::parse_instant
      - qa_tools/common/asset_time.py::record_source_instant
      - qa_tools/common/asset_time.py::now
      - qa_tools/common/asset_time.py::wall_clock
      - qa_tools/common/asset_time.py::end_of_day
      - pipeline/cadence.py::expected_moment
      - pipeline/cadence.py::classify_arrival
      - qa_tools/bdm/dataset_stats.py::_arrival
      - contract/data-asset.yaml
      - dashboard/qa-reporting-dashboard.template.html
    evidence:
      - >
        2026-09-23: the semantics were PINNED BEFORE the refactor, as
        this requirement's own NFR asks - every arrival in committed
        history with the verdict the pre-048 code gave it, 150 across 7
        datasets, 131 onTime / 16 early / 3 late. The pin was then
        confirmed to bite by changing the offset by one hour and
        watching real verdicts move, rather than trusting that it would.
        It held across the whole refactor.
      - >
        2026-09-23: the hardcoded AWST_OFFSET = timedelta(hours=8) is
        gone; the zone is one IANA name in contract/data-asset.yaml.
        14:00 in Perth still resolves to 06:00 UTC, asserted as an
        instant so the old offset arithmetic and the new zone lookup are
        held to the same number.
      - >
        2026-09-23: A REAL, LIVE BUG, found by the criterion rather than
        reasoned about. liveNowDateStr() used toISOString(), which is
        UTC - so between midnight and 08:00 in Perth the dashboard's
        default as-of date was YESTERDAY, every working morning, for
        eight hours. It had gone unnoticed because the page tends to be
        opened later in the day. Proved in a real browser at 07:40 Perth
        on 2026-09-23, a moment when the two calendars genuinely
        disagreed: viewers pinned to UTC, America/New_York and
        Pacific/Kiritimati (UTC+14) now all read 2026-09-23.
      - >
        2026-09-23: zero naked instants remain in committed history -
        16,609 carry an offset, 0 do not, measured across all 300
        committed files. Before the regeneration there were 150, in
        arrival.earliest_extract, on the CI dashboard-build path.
      - >
        2026-09-23: the read path now fails loudly and names its source.
        Verified by running the real build against the pre-regeneration
        history and reading the error, which named the field, the file
        and the offending value.
      - >
        2026-09-23: 913 Python tests, 162 JS tests, all eight mothman
        gates, plus check-lifecycle and the real-browser render check.
    decisions:
      - >
        Decided an IANA ZONE NAME, not an offset. An offset is one
        zone's answer for one moment; Western Australia does not observe
        daylight saving, so today the two agree - which is exactly why
        it was worth fixing before they stop agreeing, in a second asset
        somewhere that does.
      - >
        Decided the ONE remaining assumption lives at the SOURCE
        BOUNDARY, visibly, in asset_time.record_source_instant(). A
        supplier's extract_timestamp column arrives with no offset -
        this project's own synthetic feed included, calibrated in
        hours-from-midnight UTC - so somebody has to decide what it
        means. The bug was never that an assumption existed; it was that
        classify_arrival() made it INVISIBLY, at every read, forever, so
        no record existed of a decision having been taken. Made once, at
        the boundary, and written into the stored record permanently, it
        is a different thing: the next reader sees what was decided
        rather than inheriting it.
      - >
        Decided that boundary records UTC rather than the asset's own
        zone, deliberately. Recording Perth would have moved every
        arrival verdict in committed history, and criterion 5 says a
        stored instant keeps the meaning it was written with. This
        preserves today's meaning exactly and only writes it down -
        which is what let the pin above stay green across the change.
      - >
        Decided the snapshot and local-check FILENAME stamps stay UTC
        with their existing explicit Z suffix
        (dashboard/snapshot_dashboard.py, qa_tools/common/local_check.py).
        They are collision-resistant names, they already say which zone
        they are in, and dashboard/snapshots/*.html.gz is committed -
        renaming them would churn real history to satisfy the letter of
        a criterion about stored instants that they already meet.
      - >
        Decided the generator's own anchor date (generator/
        anchor_date.py's date.today()) is NOT moved onto the asset clock
        here, even though it is a wall-clock computation. Doing so would
        shift the whole generated history by a day and change every
        run_id, which would have destroyed the pin this requirement
        depends on. It belongs to REQ-GEN-042's own criterion that the
        schedule derive from a fixed, committed anchor - a pinned anchor
        makes the question moot rather than answering it twice.
      - >
        Decided clipDatasetToAsOf()'s date comparison keeps its
        behaviour and gains a NAME (ranOnOrBeforeAsOf). Both sides are
        YYYY-MM-DD in the asset's calendar, for which a lexicographic
        comparison is exactly the end-of-day-inclusive answer criterion
        6 asks for. This requirement's own NFR flags it as right by
        COINCIDENCE - nothing said the boundary was inclusive or that
        both sides shared a calendar - so what was missing was the
        statement, not the arithmetic. Rejected rewriting it in Date
        arithmetic, which would have introduced real timezone risk for
        no change in outcome.
      - Decided the parameter lives at the data-asset level, in
        contract/data-asset.yaml, because asset-level config IS
        repo-level here - an asset is a separate deployment, not a row
        in the data.
      - Decided to name a timezone rather than state an offset, even
        though AWST is a fixed UTC+8 with no daylight saving and a bare
        offset would work today. A named zone costs nothing (the
        standard library resolves it) and a fixed offset fails silently
        the first time this is pointed anywhere that observes daylight
        saving. THIS IS THE SCOPER'S OWN CALL and is worth Keith
        reacting to at sign-off - the counter-argument is that the
        current code is a deliberate fixed-offset simplification and
        says so.
      - Decided a naive timestamp is an error rather than something to
        interpret. cadence.py treats naive values as UTC today, so a
        naive AWST value is eight hours out - enough on a daily feed to
        flip on-time to late or move a supply into the wrong slot.
      - Decided "as at a date" means END OF DAY in the asset's timezone
        (Keith, 2026-09-22). "End of day" is meaningless without saying
        whose day, and one computed in UTC would be eight hours out,
        including or excluding a whole evening's arrivals. Both readings
        of the natural phrasing - "what did we know by the end of that
        day" - agree with it.

  - id: REQ-PIPE-049
    title: The asset carries named delivery calendars, and each dataset names one
    date_written: "2026-09-22"
    story: >
      As the person who agreed a delivery date with a supplier, I want
      that agreed date written down as the thing QA judges against, so
      that a supply is late because it missed what we agreed, not because
      a calendar library and a public holiday disagreed.
    moscow: must
    status: built
    source: >
      Keith, 2026-09-21, plans/supply-model.md Thread C - quarterly uses
      authored dates, daily uses a cadence rule, the asset owns the
      calendar and a dataset owns its participation. Delivery sprint 5,
      and test scenario register TS-26 and TS-27. Scoped by
      delivery-scoper, batch 1+2 pass, 2026-09-22; finalised the same day
      against Keith's answers to questions A1, A2 and A3.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL hold one or more NAMED delivery calendars per
        data asset, and each dataset SHALL name exactly one of them.
      - THE SYSTEM SHALL let a calendar be expressed either as authored
        dates, each carrying a period name and a date, or as a cadence
        rule.
      - THE SYSTEM SHALL express a schedule that genuinely is "every
        day" as a cadence rule rather than as an enumerated date list.
      - THE SYSTEM SHALL let a dataset name which of an authored
        calendar's delivery months it participates in, and SHALL treat a
        dataset saying nothing as participating in all of them.
      - IF a dataset naming a cadence-rule calendar also names delivery
        months, THEN THE SYSTEM SHALL reject the configuration rather
        than ignoring the months.
      - THE SYSTEM SHALL accept full month names only, case-insensitively,
        and SHALL NOT accept abbreviations, month numbers or positional
        indices.
      - THE SYSTEM SHALL let a dataset override its calendar with its own
        authored dates instead of subsetting it.
      - THE SYSTEM SHALL carry each dataset's own expected time of day
        and its own grace allowance in that dataset's own contract.
      - THE SYSTEM SHALL carry a default claim window on each calendar,
        and SHALL let a dataset override it in that dataset's own
        contract.
      - THE SYSTEM SHALL express a claim window as a duration carrying
        its own unit, so that the same property reads naturally at both a
        quarterly and a daily scale.
      - THE SYSTEM SHALL NOT attach a time of day to a calendar date.
      - THE SYSTEM SHALL version each calendar with an effective-from
        date and a changelog entry per version, in the same shape check
        lifecycle already uses.
      - THE SYSTEM SHALL let a dataset declare periods for which no
        supply is expected, each with a reason.
      - THE SYSTEM SHALL show a period declared not expected rather than
        omitting it.
      - THE SYSTEM SHALL NOT compute an authored date from a holiday
        calendar at evaluation time.
      - WHERE someone needs next year's candidate dates, THE SYSTEM SHALL
        offer a mothman subcommand that prints them for a human to
        review, edit and commit, and SHALL NOT use generated dates as the
        evaluation path.
    non_functional_requirements:
      - The authored calendar is a real once-a-year human task, and
        somebody will forget. The runway warning and the exhausted-
        schedule failure in REQ-PIPE-053 are that risk's mitigation, and
        this requirement is not safe without them.
      - The calendar is a governance artefact, not just config - Thread
        C's own words, "the dates ARE the supplier agreement, and QA
        judges against the agreement". It is version-controlled,
        effective-dated, and must never be edited retrospectively to
        make red history disappear (Thread E's explicit rule about
        not_expected versus marked-missed).
      - At ~30 datasets on the quarterly asset, 30 independent date
        lists would drift - dataset A saying 2 February and dataset B
        saying 3 February for the same delivery window is a class of bug
        nothing would ever flag. One calendar makes it impossible by
        construction, and the cross-reference validation in
        REQ-PIPE-050 is what makes that real.
      - Config only, no data access, so a dashboard build can read it
        under the CI rule.
      - Real config already exists and must be carried rather than
        reinvented - pipeline/cadence.py's parse_cadence_from_contract
        already reads cadenceType, cadenceAnchorMonths, cadenceDayOfMonth,
        expectedTime and latency from each contract's slaProperties.
      - A duration string is a new thing to parse and therefore a new
        thing to get wrong. One accepted form per unit, validated by the
        gate, rejected rather than coerced.
    linked_tests:
      - tests/test_schedule.py
      - tests/test_cli_schedule.py
      - tests/test_cadence.py
      - tests/test_daily_batch.py
    implemented_by:
      - qa_tools/common/schedule.py::calendar_for_dataset
      - qa_tools/common/schedule.py::periods_for_dataset
      - qa_tools/common/schedule.py::delivery_months
      - qa_tools/common/schedule.py::not_expected_periods
      - qa_tools/common/schedule.py::dataset_dates_override
      - qa_tools/common/schedule.py::claim_window
      - qa_tools/common/schedule.py::parse_duration
      - qa_tools/common/schedule.py::parse_month_name
      - qa_tools/common/schedule.py::candidate_dates
      - qa_tools/common/schedule.py::Calendar::version_in_force
      - pipeline/cadence.py::_sla_properties_to_dict
      - pipeline/cadence.py::parse_claim_window_from_contract
      - cli/schedule.py::show_command
      - cli/schedule.py::candidate_dates_command
      - contract/data-asset.yaml
      - contract/child-protection-contract.yaml
    evidence:
      - >
        2026-09-23: two named calendars in contract/data-asset.yaml -
        quarterly with 20 authored dates through 2027, daily as a
        cadence rule - and every one of the 7 real datasets names one.
        The authored dates were checked against the cadence the data is
        actually generated against (generate_cp_runs.py's Feb/May/Aug/
        Nov anchor) and against every delivery in committed history, so
        the schedule cannot judge supplies against dates nothing ever
        delivered on.
      - >
        2026-09-23: THE `element:` BUG IS REAL AND IS FIXED, and it was
        a capability being built rather than one preserved.
        pipeline/cadence.py's _sla_properties_to_dict keyed on
        `property` alone and discarded `element:`, so Child Protection's
        six datasets all silently inherited whatever cp_clients
        declared. It went unnoticed because all six genuinely do share
        one cadence, so the wrong answer and the right answer coincided.
        A property with no element is now a contract-wide default and
        one naming an element overrides it; both dashboard builders pass
        their own dataset's element explicitly.
      - >
        2026-09-23: no arrival verdict moved across the element fix -
        REQ-PIPE-048's own 150-arrival pin was re-run after it and held.
        That is what made it safe to change a parser every arrival
        classification in the repo depends on.
      - >
        2026-09-23: `mothman schedule candidate-dates --calendar
        quarterly --year 2026` flags all three of that year's weekend
        dates (1 Feb Sunday, 1 Aug Saturday, 1 Nov Sunday) rather than
        moving them, and prints that nothing evaluates against its
        output. Exercised against the real calendars, not a fixture.
      - >
        2026-09-23: 50 schedule tests and 10 CLI tests, most of them
        REJECTIONS - a duplicate period, dates running backwards, months
        on a cadence-rule calendar, a version with no changelog, a
        not-expected period with no reason, seven malformed durations
        and six rejected month forms. A schedule that quietly accepts
        config it cannot honour is how a dataset ends up expecting
        something other than what its author wrote.
      - >
        2026-09-23: 973 Python tests, 162 JS tests, all eight mothman
        gates.
    dependencies: [REQ-QAC-039, REQ-PIPE-048]
    decisions:
      - Decided quarterly uses authored DATES and daily uses a cadence
        rule, and that this is not a compromise - they are different
        shapes. 365 daily dates would be absurd to enumerate and the
        rule genuinely is "every day"; four quarterly dates a year are
        known well in advance, and the real agreed day is "the closest
        business day to the 1st", which a day-of-month rule does not
        express.
      - "Rejected runtime derivation from a holiday library (Keith's own
        counter-proposal), and rejected derive-at-runtime-then-freeze-
        the-computed-due-date. Neither loses on library quality - Keith
        was right that holiday packages are year-keyed, so a later
        gazette amendment does not silently rewrite a settled past date.
        They lose because the dates ARE the agreement: a calendar
        PREDICTS it, it does not CONSTITUTE it. Freezing additionally
        leaves nowhere to record a date that differs from what the rule
        would generate."
      - Decided the ASSET owns the calendar and a DATASET owns its
        participation, on a scale argument rather than a tidiness one -
        the quarterly asset will carry ~30 datasets, of which roughly
        70% arrive every quarter and the rest once or twice a year,
        still landing on one of the same four dates.
      - Decided month NAMES, not numbers or positional indices. Indices
        break silently if the calendar is edited or reordered; names
        stay meaningful and match how people talk about it. Full names
        only, because two accepted forms means config reading
        differently across 30 datasets for no gain.
      - Decided the key is delivery_months, never shortened to months
        (confirmed with Keith after a dictation ambiguity pointed the
        other way). It names when a supply ARRIVES, not the period it
        covers - a 2 February delivery is often for the November-January
        period, so the short form invites exactly the wrong reading.
      - Decided a period's NAME is AUTHORED per calendar date, not
        derived from the date, for the same reason. This was left to the
        scoper by Thread C and is settled here.
      - Decided the calendar date carries NO time of day, which
        SUPERSEDES Thread H chaos-pass item 5 ("the schedule carries a
        time alongside the dates"). That item predates Thread C's
        correction moving the deadline to the slot, and the two cannot
        both hold - a time on the calendar date is a per-period
        deadline, which is exactly what was ruled out. The instant
        due-ness needs comes from the slot's own expected time instead.
      - "Decided a dataset may fully override the calendar with its own
        dates even though no such dataset exists today (Keith:
        everything is aligned to one of the four days). Cheap now,
        awkward to retrofit once 30 datasets assume subsetting."
      - "Decided per-dataset expected times are a definite need (Keith,
        2026-09-22). CORRECTED 2026-09-22 after delivery-architect read
        the parser rather than the config: this was originally recorded
        with a caveat saying the alternative - one deadline per period -
        was not a genuine fork, because taking it would have meant
        deleting working config. That was wrong.
        pipeline/cadence.py's _sla_properties_to_dict keys on `property`
        alone and DISCARDS `element:`, so Child Protection's single
        expectedTime block covers all six of its datasets and the
        per-dataset discriminator already sitting in the contract is
        thrown away. expectedTime is per-CONTRACT, which equals
        per-dataset only for Birth Registrations, where a contract holds
        one dataset. So this requirement BUILDS a capability rather than
        preserving one - which justifies it more strongly - and
        honouring `element:` is real work in this sprint, not a given."
      - Rejected an exceptions mechanism separate from ordinary schedule
        editing. Authored dates make a changed quarterly date an
        ordinary edit; what survives is only a daily feed paused for a
        day or two, which is what not_expected is for.
      - "[A1] Decided the asset carries SEVERAL NAMED calendars, each
        dataset naming one (Keith, 2026-09-22). Rejected the single asset
        calendar Thread C sketched, and rejected making the calendar
        optional so a daily dataset could carry its own rule instead. The
        scoper argued named calendars were a level of config nobody needs
        yet, and that is wrong on the facts: two cadences ALREADY share
        one asset today - Birth Registrations daily and Child Protection
        quarterly, one contract/data-asset.yaml, verified in the real
        repo. So this is not generality bought for a hypothetical future,
        it is the shape the repo already needs. A monthly feed later then
        costs nothing."
      - "[A1] Rejected hanging the schedule off the COLLECTION instead of
        the asset. It would have worked today - Civil Registration daily,
        Child Protection quarterly - but it weakens the anti-drift
        argument that justified one calendar over 30 date lists: 30
        quarterly datasets can span several collections, and several
        collection-level calendars could drift apart again. Named
        calendars keep anti-drift WITHIN each calendar, which is where
        drift actually matters."
      - "[A2] Decided claimWindow is a DURATION STRING carrying its own
        unit - 14d, 4h - and the small parser is accepted (Keith,
        2026-09-22). Rejected expressing it in minutes for consistency
        with the neighbouring latency property: 14 days reads as 20160,
        which nobody can check by eye, and this value has to be readable
        at both a quarterly and a daily scale. Rejected naming it
        earlyWindow, because the design is explicit that nothing measures
        how early a supply is in order to assign it - earliness is a
        reported consequence of assignment, so earlyWindow names the
        wrong half of what the property does."
      - "[A3] Decided the claim window is a DEFAULT with a per-dataset
        override, the same inheritance shape as delivery_months - say
        nothing, get the default (Keith, 2026-09-22). Rejected
        per-dataset-only, which would put 30 near-identical values on one
        asset and let them drift, the exact argument that made the
        calendar asset-level. Rejected asset-level-only with no override,
        which leaves a dataset with a genuinely different upstream
        cadence nowhere to say so."
      - "[A3+A1] Decided the default lives on the CALENDAR rather than on
        the asset root. A3 was answered before A1 introduced named
        calendars, so it did not settle which. A quarterly calendar's
        sensible window is days and a daily calendar's is hours, so a
        single asset-root default would be wrong for one of them on day
        one, in this repo. Putting it on the calendar makes the default
        track the thing that sets its scale. Raised as the scoper's own
        call, following from two answers settled separately, and
        CONFIRMED by Keith 2026-09-22 when shown all three shapes side by
        side: the asset-root default would hand Birth Registrations a
        14-day claim window on a daily feed, so it only ever serves one
        of the two cadences. Per-dataset-only was rejected again at the
        same time - 30 copies of one number that nobody maintains."
      - "[A1] Decided delivery_months is meaningful only on an
        authored-date calendar, and is an ERROR on a cadence-rule one
        rather than an ignored key. A dataset naming a daily calendar
        participates in every period the rule generates; silently
        ignoring months there is exactly the kind of accepted-and-
        discarded config that produces a dataset expecting something
        other than what its author wrote."
      - "Rejected naming the participation field participatesIn, which a
        2026-09-22 draft of Thread C's config sketch invented before
        noticing delivery_months already existed two screens above it in
        the same thread. delivery_months wins on a reason the new name
        did not carry: it names when a supply ARRIVES, not the period it
        covers, because a 2 February delivery is often for the
        November-January period. Recorded because the prose that holds
        this gets deleted, and a future session scoping config would
        otherwise re-propose participatesIn with no sight of the
        counter-argument. Found by the batch 1+2 carry-over check, which
        is what that check is for."
      - "Decided the candidate-dates printer lives in the same new
        `mothman schedule` group as the config gate (Keith, 2026-09-23),
        for the same reason: it is a once-a-year human task, and
        `mothman schedule --help` is where somebody looks for it. See
        REQ-PIPE-050's own decision for why a new group beat folding
        both into `pipeline`, and for the reviewer disagreement behind
        it."
  - id: REQ-PIPE-050
    title: A config error can never silently produce zero slots, and a past date cannot move quietly
    date_written: "2026-09-22"
    story: >
      As whoever maintains 30 datasets' schedules, I want a typo to fail
      a build, so that a dataset does not quietly stop expecting anything
      and sit green for a year because somebody wrote Febuary.
    moscow: must
    status: built
    source: >
      Keith, 2026-09-21, plans/supply-model.md Thread K - the new asset
      and schedule YAML gets validated like everything else, as a
      validate-config gate alongside validate-requirements and
      validate-changelog. Delivery sprint 5, and test scenario register
      TS-25. Scoped by delivery-scoper, batch 1+2 pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - WHEN the repository's gates run, THE SYSTEM SHALL validate the
        asset and schedule configuration and SHALL exit non-zero on any
        error.
      - IF a configuration error would leave a dataset expecting nothing
        at all, THEN THE SYSTEM SHALL exit non-zero.
      - THE SYSTEM SHALL reject an unrecognised configuration key rather
        than ignoring it.
      - THE SYSTEM SHALL reject a month name that is not a real, full
        month name.
      - THE SYSTEM SHALL reject a dataset naming a delivery month for
        which its own calendar has no date.
      - THE SYSTEM SHALL reject schedule versions that overlap or are
        out of order on their effective-from dates.
      - THE SYSTEM SHALL reject duplicate calendar names, duplicate
        dates within a calendar, and duplicate period names.
      - THE SYSTEM SHALL reject a dataset that both subsets and
        overrides its own calendar.
      - THE SYSTEM SHALL reject a dataset named in asset configuration
        that has no contract, and a contract that has no asset
        configuration entry.
      - THE SYSTEM SHALL reject a negative grace allowance or claim
        window, an unparseable date, and a missing required value.
      - THE SYSTEM SHALL report every offending item rather than
        stopping at the first.
      - THE SYSTEM SHALL validate configuration without opening or
        querying anything under data/.
      - THE SYSTEM SHALL be invoked as a mothman subcommand.
      - THE SYSTEM SHALL reject a dataset naming a calendar the asset
        does not define.
      - THE SYSTEM SHALL reject a dataset that names delivery months
        against a cadence-rule calendar.
      - THE SYSTEM SHALL reject a claim window that is not a duration
        with a recognised unit, and SHALL NOT coerce one.
      - THE SYSTEM SHALL be invoked as a command in a schedule command
        group, and SHALL NOT be placed in a group documented as not
        human-facing.
      - THE SYSTEM SHALL be registered as a gate that runs alongside the
        repository's other sub-second gates.
      - THE SYSTEM SHALL report every offending item individually, and
        SHALL NOT collapse repeated instances of one rule into a single
        line.
      - THE SYSTEM SHALL name, in each error, the correction to make,
        not only the rule that was broken.
      - THE SYSTEM SHALL group reported errors by the file and the
        calendar or dataset they belong to, and SHALL state, before the
        detail, how many errors affect how many datasets.
      - WHEN the configuration cannot be parsed at all, THE SYSTEM SHALL
        name the file and the location, and SHALL NOT then report the
        absence of every value it could not read.
    non_functional_requirements:
      - This gate runs on every push and inside mothman check, whose own
        gates are ordered cheapest-first so the fast ones report while
        the slow ones are still ahead. A config-only validation should
        stay in that fast group - well under a second - rather than
        joining the slow tail.
      - Config only, no data access, so it is safe in CI under the
        standing rule.
      - At 30 datasets the referential check is where a typo would
        otherwise hide indefinitely. It is the check that justifies one
        calendar over 30 date lists, so it has to actually run.
      - Build on the existing pattern rather than new machinery -
        qa_tools/common/schemas.py's _Strict base already forbids extra
        keys, which is what catches a mistyped KEY rather than a
        mistyped value.
      - Failing a build is a real interruption, so every error here must
        be one a human can act on immediately. Name the file, the
        dataset and the value.
    dependencies: [REQ-PIPE-049, REQ-QAC-039]
    decisions:
      - Decided the organising idea is one sentence rather than a
        checklist - every check here exists to stop a config error
        silently producing ZERO SLOTS, which is the exhausted-schedule
        state arriving by accident on a dataset nobody is watching. Most
        of the validations are variations on that one failure, and a
        future addition should be justified against it.
      - Decided a mistyped KEY must fail, not just a mistyped value. A
        silently-dropped delivery_months key gives a dataset all four
        dates when it should have one - the error is invisible and the
        result looks plausible.
      - Decided runway is a WARNING and does NOT live here, which is a
        change from the sprint plan. Thread K lists runway as this
        gate's one warning, but runway is measured in SLOTS and slots do
        not exist until sprint 6, so it lands in REQ-PIPE-053 instead.
        Failing an otherwise-fine build on runway is also how a gate
        gets disabled.
      - "[A2] Decided the gate validates the claim-window duration rather
        than coercing it. A parser that accepts 14, 14d, 14 days and P14D
        is four ways for 30 datasets' config to read differently for no
        gain - the same reasoning that limited month names to one
        accepted form."

      - "[A4] Decided to REJECT building any technical mechanism for this,
        and to rely on review instead (Keith, 2026-09-22): \"let's just
        catch that and review. I don't need to invent a technical
        mechanism to handle that.\" The policy stands - Thread E's rule
        that config must never be edited to make red history disappear is
        real - but it is enforced by people reading a diff, as it is
        today, not by the gate."
      - "[A4] Rejected TWO mechanisms, both worked through before the
        decision, and both recorded because they are the obvious things
        to re-propose. (1) A recorded content record per calendar version
        plus a changelog entry naming it, checked locally: editing a past
        date breaks the record, updating the record breaks the changelog
        check, so the only route through is writing down what changed.
        Genuinely airtight, and real machinery for a rule that bites
        rarely. (2) Diffing the config against git history. Simpler to
        understand, and possible - CI clones at fetch-depth 2 today,
        which is a config line rather than a law - but this repo has a
        recorded performance incident from walking its own git history,
        so a deeper clone on every push is not free. Neither earns its
        cost against a reviewer reading the diff."
      - "[A4] REOPENED and DEFERRED 2026-09-23. delivery-architect found
        the cost estimate this was rejected on was too high:
        validate_check_lifecycle.py already runs `git show HEAD~1:<path>`
        on a single file at the fetch-depth 2 CI is already configured
        for - materially cheaper than the deep-clone git diff that was
        put to Keith and rejected on performance grounds. Keith's call
        was to defer rather than decide either way, so this is an open
        question on this requirement rather than a settled decision. The
        original reasoning still stands on its own terms - his words
        were \"I do not need to invent a technical mechanism to handle
        that\", which is a simplicity preference, not only a cost one."
      - "Decided this lives in a new `mothman schedule` command group,
        Tier 1 (Keith, 2026-09-23). The two pre-build reviewers
        DISAGREED here and this is the one place they did:
        delivery-architect said fold it into `pipeline` (both commands
        are PIPE by the taxonomy, `pipeline` holds exactly one command,
        and putting a config gate under `dashboard` deepens an existing
        misfiling); delivery-cli-ux said make a new group. The CLI
        reviewer won on a point the architect did not weigh: Keith's own
        docstring in cli/pipeline.py calls that group \"not
        human-facing - for integration tests and for yourself\", and
        someone editing 30 delivery calendars is exactly a human.
        Rejected also the architect's synthesis - fold in now, move to a
        `mothman supply` group when batches 3-6 justify one - because
        moving a command later breaks whatever docs and muscle memory
        have formed, and renames are how a CLI surface rots."
      - "Decided every offending item is reported INDIVIDUALLY (Keith,
        2026-09-23), against the recommendation. delivery-cli-ux argued
        for compiler-style cause suppression - report the root once,
        then \"30 datasets name this calendar and were not checked
        further\" - on the grounds that one asset-level mistake produces
        30 downstream errors and a reader who meets the 30 first fixes
        30 things. Keith took the literal reading of the existing
        criterion instead: nothing is ever hidden, and the count in the
        header is the true count. The grouping and ordering criteria
        above are what carry the scale problem instead."
      - "[BUILD] The retrospective-edit guard IS BUILT (Keith,
        2026-09-23), closing the question this requirement carried. He
        took the reopened option once the cost was confirmed rather
        than estimated: one `git show HEAD~1:<path>` of a single file,
        measured at about 3ms, at the fetch-depth CI already sets for
        validate_check_lifecycle.py''s own old-vs-new diff. The version
        rejected on 2026-09-22 needed a deep clone and a history walk,
        which is a different thing."
      - "[BUILD] Decided the guard is deliberately NARROW, because a
        gate that fires on legitimate work gets turned off. It is
        silent for: a date still in the FUTURE (editing those is the
        whole point of `mothman schedule candidate-dates`), a date that
        differs between VERSIONS (authoring a new effective-dated
        version is the sanctioned way to change a schedule), and a
        missing previous commit (a shallow checkout is not a finding).
        A changelog entry on the version clears it - this is a say-what-
        you-did gate, not a freeze, which is what Thread E actually
        asks for."
      - "[BUILD] Decided the organising sentence is also asked
        DIRECTLY, not only enforced through the specific rules. Each
        rule catches one way a dataset ends up expecting nothing; a
        final check derives what each dataset actually expects and says
        so if the answer is nothing. That catches the combinations no
        single rule does - every month real, every month on the
        calendar, and every resulting period then excluded by
        not_expected. It stays silent where an earlier error already
        fired for the same dataset, so one mistake is one error."
      - "[BUILD] Decided the schema lives in qa_tools/common/schemas.py
        beside requirements.yaml''s and CHANGELOG.yaml''s, rather than
        inside the gate. That module exists so a hand-authored file''s
        shape is stated once, and _Strict''s extra=\"forbid\" is what
        makes a mistyped KEY fail - which is the failure this whole
        requirement is about."
      - "[BUILD] Decided every error carries a separate `fix` alongside
        its `problem`. Naming the rule that was broken leaves the
        reader to work out what to type, and a gate that interrupts a
        build owes them better - the NFR asks for an error a human can
        act on immediately, which is a shape, not an aspiration."
    linked_tests:
      - tests/test_validate_schedule.py
      - tests/test_schedule.py
    implemented_by:
      - qa_tools/common/validate_schedule.py::validate
      - qa_tools/common/validate_schedule.py::_schema_errors
      - qa_tools/common/validate_schedule.py::_calendar_errors
      - qa_tools/common/validate_schedule.py::_dataset_errors
      - qa_tools/common/validate_schedule.py::_expects_nothing_errors
      - qa_tools/common/validate_schedule.py::_contract_errors
      - qa_tools/common/validate_schedule.py::_retrospective_edit_errors
      - qa_tools/common/schemas.py::DataAsset
      - cli/schedule.py::validate_command
    evidence:
      - >
        2026-09-23: every rule is tested by BREAKING the real committed
        configuration in one specific way and requiring the gate to say
        so - a misspelt month, a month the calendar has no date in, a
        calendar that does not exist, a mistyped key, duplicate
        calendars, duplicate periods, duplicate dates, out-of-order
        versions, a bare claim window, delivery_months against a
        cadence rule, a contract that does not exist and a contract
        nothing names. A validator tested only against valid input has
        never been shown to do anything.
      - >
        2026-09-23: the past-date guard was proved end to end against
        REAL git, not only against a stubbed comparison - moving
        2026-Q1 from 1 February to the 15th in the working tree made
        the real `mothman schedule validate` exit 1 and name the
        period, the old date, the new one and the version with no
        changelog entry.
      - >
        2026-09-23: and it stays quiet for every legitimate edit, which
        is the half that decides whether a gate survives - editing a
        future date, adding future dates, authoring a new
        effective-dated version, adding a changelog entry alongside the
        change, an unchanged file, a missing previous commit, and a
        previous version that does not parse.
      - >
        2026-09-23: it reads ONE file at ONE ref. Asserted by watching
        subprocess calls during a real validate() - exactly one git
        call, `git show HEAD~1:...` - because the deep-clone history
        walk this was rejected on in September is precisely what it
        must not become.
      - >
        2026-09-23: runtime is in line with the other fast gates -
        1339ms end to end against 1275ms for hierarchy and 1237ms for
        changelog, nearly all of it `uv run` startup; validate() itself
        is 141ms. It stays in the cheap-first group rather than joining
        the slow tail.
      - >
        2026-09-23: it opens nothing under data/, asserted by watching
        every Path.open during a real run rather than by reading the
        code. This gate runs on every push, and a config validator that
        reached into data/ would be exactly the accident the standing
        rule exists for.
      - >
        2026-09-23: every offending item is reported individually and
        the header count is the true count - seven datasets naming a
        missing calendar produce seven errors, not one summary. Keith's
        own call against a recommendation to suppress caused errors.
      - >
        2026-09-23: 1114 Python tests, 166 JS tests, all nine mothman
        gates - this one now among them.

  - id: REQ-PIPE-051
    title: Periods are derived from the schedule, and never move
    date_written: "2026-09-22"
    story: >
      As an agency data owner, I want the quarter a supply was filed
      under to still say the same thing next year, so that a supplier
      changing their cadence does not turn periods they met into periods
      they breached.
    moscow: must
    status: built
    source: >
      Keith, 2026-09-21, plans/supply-model.md Thread C, with period and
      slot separately defined 2026-09-22 after Keith noticed the concept
      inventory described a period schema without ever naming period.
      Delivery sprint 6, and test scenario register TS-26. Scoped by
      delivery-scoper, batch 1+2 pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL produce that sequence in the same shape whether
        the schedule was authored as dates or expressed as a cadence
        rule, so that nothing downstream knows which produced it.
      - WHERE a schedule is authored as dates, THE SYSTEM SHALL take
        each period's name from the configuration.
      - WHERE a schedule is a cadence rule, THE SYSTEM SHALL name each
        period by its own date.
      - WHEN a new schedule version is added, THE SYSTEM SHALL leave
        every earlier period unchanged.
      - THE SYSTEM SHALL NOT attach a due instant, a grace allowance or
        a claim window to a period.
      - THE SYSTEM SHALL name a warehouse schema after a period.
      - THE SYSTEM SHALL derive periods deterministically, so the same
        configuration produces the same sequence.
      - THE SYSTEM SHALL derive, for each named calendar, a sequence of
        periods, each carrying a name and a date.
      - THE SYSTEM SHALL evaluate each period against the version of its
        own calendar in force on that period's own date.
    non_functional_requirements:
      - Period derivation runs on every pipeline run and every dashboard
        build. It must stay cheap once a daily asset has years of
        periods rather than today's handful.
      - Config only, no data access, so a dashboard build can derive the
        sequence under the CI rule.
      - This is the concept a schema is named after, so a change to how
        a period is named is a change to physical storage. Name it once
        and do not revisit.
    dependencies: [REQ-PIPE-049]
    decisions:
      - Decided PERIOD and SLOT are separately defined, and that this
        NAMES what the calendar design already produced rather than
        replacing it. A first draft of the thread read as though a
        modelling error had been discovered, and that overstates it -
        the calendar and delivery_months design stands untouched.
      - Recorded because the SHAPE of the error is the reusable lesson.
        What was found was not a design disagreeing with reality, it was
        one thread disagreeing with ITSELF - its own "what exists"
        paragraph records that expectedTime is already per-dataset in
        every contract, four paragraphs above its own sentence putting
        the deadline on the period. Before concluding a design is wrong,
        check whether the document already contradicts itself above.
      - Decided the effective-dating rule is keyed on the PERIOD'S OWN
        DATE, not on a due date. Thread C phrases it as "the schedule
        version in force at that period's due date", which predates the
        deadline moving to the slot and would now be ambiguous - a
        period has no due date, and its several slots may have different
        ones. Restating it on the period's date preserves the intent
        (history does not move when a supplier changes) with no
        ambiguity.
      - "Decided a period carries a date and nothing else, deliberately,
        so that the deadline cannot drift back onto it. The case that
        decides it: three slots in one period, births due 09:00,
        cp_clients due 09:00 and cp_placements due 17:00. Births
        arriving at 16:00 reads ON TIME with the deadline on the period
        and LATE with it on the slot - and the wrong one is a FALSE
        GREEN, which is the direction that matters."
      - "[A1] Decided period derivation is per CALENDAR, not per asset.
        With several named calendars on one asset the two are no longer
        the same thing, and a period sequence spanning calendars would
        collide names - 2026-09-22 from a daily calendar and 2026-Q3 from
        a quarterly one are different buckets that must not share a
        schema."
      - "[BUILD] Criterion 9 turned out to name a REAL BUG, not a
        property to preserve. Period derivation read
        `calendar.current` - the newest version - for the entire
        sequence, so authoring a version effective 2027 did not merely
        move the earlier periods, it REPLACED them: four years of
        history ceased to exist and every supply filed against 2023-Q1
        had no period at all. Reproduced before fixing. Latent only
        because no second version has ever been authored, which is
        exactly why it needed a test rather than a note - the day
        somebody authors one is the day the history disappears."
      - "[BUILD] Decided a version contributes only the periods whose
        own date falls inside its own period of effect, so a later
        version re-stating an earlier period cannot reach back and move
        it. That is effective dating actually doing its job rather than
        being recorded and then ignored at the one place it mattered."
      - "[BUILD] Decided a schema name is `period_` plus the period
        name folded to lower-case with non-alphanumerics as
        underscores - `2026-Q1` becomes `period_2026_q1`. The prefix is
        not decoration: an authored period name is whatever the agency
        calls it, and a bare `2026_q1` is not a legal unquoted
        identifier everywhere, while a leading letter always is. Named
        once and not to be revisited, per this requirement's own NFR -
        changing it renames real schemas."
      - "[BUILD] Decided criterion 5 is asserted on the real
        dataclasses rather than left to reading. A due instant, a grace
        allowance and a claim window are all per-DATASET, and a period
        is shared by every dataset on its calendar - attaching any of
        the three here would flatten six datasets' different deadlines
        into one, which is precisely the failure REQ-PIPE-052's story
        describes."
    linked_tests:
      - tests/test_schedule.py
      - tests/test_slots.py
    implemented_by:
      - qa_tools/common/schedule.py::periods_for_calendar
      - qa_tools/common/schedule.py::periods_for_dataset
      - qa_tools/common/schedule.py::schema_name
      - qa_tools/common/schedule.py::_effect_windows
      - qa_tools/common/schedule.py::Period
    evidence:
      - >
        2026-09-23: the version bug was reproduced before being fixed -
        adding a 2027-only version to the real quarterly calendar left
        cp-clients with FOUR periods where it had twenty, all of them
        2027. Five tests now cover it, all confirmed failing against
        the old derivation first.
      - >
        2026-09-23: the real committed configuration derives exactly
        what it did before - 20 quarterly periods per Child Protection
        dataset, 10 for cp-case-workers on its Feb/August
        participation, 1361 daily periods for Birth Registrations up to
        the anchor. The fix changes what happens when a SECOND version
        exists, and nothing else.
      - >
        2026-09-23: a period carries a name and a date and nothing
        else, and a DatasetPeriod adds only whether a supply is
        expected - asserted against the real dataclasses, so attaching
        timing to either fails here rather than surfacing later as six
        datasets sharing one deadline.
      - >
        2026-09-23: every schema name derived from the real
        configuration is a legal bare identifier, and no two periods
        share one - checked across both a quarterly and a daily
        calendar rather than on the two hand-written examples.
      - >
        2026-09-23: 1154 Python tests, 166 JS tests, all nine mothman
        gates.

  - id: REQ-PIPE-052
    title: Slots are derived, one per table per period it participates in
    date_written: "2026-09-22"
    story: >
      As a data team leader whose collection has six tables, I want each
      table to have its own expected supply with its own deadline, so
      that one late table shows as one late table rather than dragging
      five punctual ones down with it.
    moscow: must
    status: built
    source: >
      Keith, 2026-09-21, plans/supply-model.md Threads C, E and F - each
      table claims a slot independently, and a slot carries its own
      due_at, grace and claim window. Delivery sprint 6, and test
      scenario register TS-27 and TS-33b. Scoped by delivery-scoper,
      batch 1+2 pass, 2026-09-22.
    signed_off:
      by: Keith
      date: "2026-09-22"
    acceptance_criteria:
      - THE SYSTEM SHALL derive a slot for each pairing of a dataset
        with a period that dataset participates in, and SHALL NOT
        require a slot to be authored.
      - THE SYSTEM SHALL create one slot per dataset per period, so that
        a collection of six datasets in one period has six slots.
      - THE SYSTEM SHALL give each slot its own due instant, computed
        from its period's date and its own dataset's expected time of
        day in the asset's timezone.
      - THE SYSTEM SHALL give each slot its own grace allowance, taken
        from its own dataset's contract.
      - THE SYSTEM SHALL open a slot's claim window a configured
        interval before that slot's due instant, and SHALL NOT close it.
      - IF a dataset declares a period as not expected, THEN THE SYSTEM
        SHALL create no slot for it.
      - THE SYSTEM SHALL determine whether a slot is overdue by querying
        the schedule and the slot's state, and SHALL NOT require an
        event or a scheduled sweep to record it.
      - THE SYSTEM SHALL derive slots deterministically, so the same
        configuration and the same date produce the same slots.
      - THE SYSTEM SHALL track each dataset's slot sequence
        independently of every other dataset's.
      - THE SYSTEM SHALL give each slot its own claim window, taken from
        its dataset's own contract where one is declared and from its
        calendar's default otherwise.
    non_functional_requirements:
      - Slot count multiplies - ~30 datasets on the quarterly asset,
        several of them multi-table collections, times four periods a
        year, times years of history. Derivation must stay cheap at that
        size, and anything presented per slot must aggregate rather than
        enumerate. Thirty individual banners is noise.
      - Config only, no data access.
      - The claim window is a genuine TRADE, not a tuning knob, and this
        requirement must not invite anyone to "fix" it later. Tight
        windows buy cascade-immunity at the price of boundary
        misfiling; wide windows do the reverse; no sizing gets both.
      - Slot identity is what every later sprint compares against -
        overdue, staleness, assignment, classification and promotion are
        all defined against the expected-supply sequence. Its shape must
        be settled here rather than adjusted downstream.
    dependencies: [REQ-PIPE-051, REQ-PIPE-049, REQ-PIPE-048]
    decisions:
      - Decided each TABLE claims its own slot rather than a collection
        filling one slot as a unit (Keith, 2026-09-21). Everything
        before that had assumed one table per supply, which holds for
        Birth Registrations and not for Child Protection's six.
      - Decided this is what makes an earlier decision implementable. A
        multi-table check signalling that a table it spans is missing
        had no fact to test against until slots became per-table; it is
        now the crisp condition "any table this check spans has an
        unfilled slot for that period".
      - Decided per-table classification is more honest than
        per-delivery. If cp_clients lands 09:00 and cp_placements 14:00,
        each gets its own verdict rather than the whole delivery taking
        the worst.
      - "Decided the claim window OPENS before due and NEVER CLOSES, and
        that this reinstates an earliness window an earlier entry had
        just dropped as redundant. That call was wrong: the window is
        what defines when a slot becomes CLAIMABLE, which is the thing
        that makes the forward cascade structurally impossible rather
        than avoided by luck."
      - Decided this also DELETES the daily cutoff rule. "Arrives 10pm,
        so it is for tomorrow" needs no special handling - if a feed's
        supply genuinely lands the evening before, its due instant IS
        the evening before and the window opens accordingly. The
        schedule expresses it directly instead of a separate rule
        reinterpreting arrivals afterwards.
      - Decided overdue is a COMPUTED PROPERTY, not an event - a
        correction to an earlier claim that it needed a trigger. Same
        pattern already settled for the exhausted-schedule banner, which
        the dashboard computes from config rather than being told about.
      - "Scope boundary, recorded because it will be proposed otherwise
        (Keith): this system does NOT build staleness-tolerance policy
        for consumers. It attributes supplies to slots and reports what
        is where and how fresh. Whether a downstream consumer takes only
        the latest slot, composes several, or refuses anything older
        than a week is theirs - otherwise the tool grows a config
        surface for every downstream system's preferences, unmanageable
        at 30 datasets."
      - "Note on scope: this requirement DEFINES the claim window as a
        slot property. The rules that USE it - oldest claimable unfilled
        slot, on-time-wins-for-the-current-slot, monotonic filling, hold
        for a human - are slot ASSIGNMENT and belong to batch 3."
      - "[A3] Decided slot derivation resolves the claim window through
        inheritance rather than requiring every dataset to state one. A
        slot must always have a window - assignment is defined against it
        - so the resolution happens here, at derivation, rather than
        being left to each consumer to fall back on."
      - "[BUILD] Found that qa_tools/common/schedule.py's own
        claim_window() docstring described the OPPOSITE of the settled
        rule - \"how long AFTER a period's date a supply may still
        claim it\". A window measured forwards is one that CLOSES; the
        rule (Thread E) is that it opens a configured interval BEFORE
        the due instant and never closes. Read the wrong way it would
        make a late supply unfileable, from the same number. Corrected
        where it was, rather than only getting it right here."
      - "[BUILD] Decided Slot has no `closes_at` field at all, and that
        the absence is asserted in a test. The tempting fix for a
        boundary misfile is to close the window; closing it is what
        would break late filing, and this requirement's own NFR says
        the sizing is a genuine trade nobody should later 'fix'."
      - "[BUILD] Decided `late_after` is a derived property rather than
        a stored field, so a slot's due instant and its grace can never
        disagree with the instant it computes."
      - "[BUILD] Decided next_unfilled_claimable() implements only the
        half of Thread E's assignment rule that config can answer, and
        returns None rather than deciding the resupply case. Deciding
        it needs promotion state, which needs data - that is
        REQ-PIPE-034's, and guessing it here would put a filing
        decision in a module that cannot see what it is filing."
      - "[BUILD] Accepted an untidy layering rather than a second
        parser: qa_tools/common/slots.py imports pipeline.cadence to
        read a dataset's own slaProperties, because that array is
        parsed in exactly one place and reading it again here would be
        two parsers for one file. Named in the module docstring rather
        than left as an oddity; the tidier fix is a refactor this
        requirement does not need."
    linked_tests:
      - tests/test_slots.py
      - tests/test_schedule.py
      - tests/test_cli_schedule.py
    implemented_by:
      - qa_tools/common/slots.py::Slot
      - qa_tools/common/slots.py::slots_for_dataset
      - qa_tools/common/slots.py::is_claimable
      - qa_tools/common/slots.py::is_overdue
      - qa_tools/common/slots.py::next_unfilled_claimable
      - cli/schedule.py::_show_dataset
    evidence:
      - >
        2026-09-23: six Child Protection datasets in 2026-Q1 produce
        six slots, one each - the requirement's own story asserted
        directly, so one late table can show as one late table.
      - >
        2026-09-23: each slot carries its own timing from its own
        contract, and the two datasets in this repo genuinely differ -
        Birth Registrations due 14:00 with an hour's grace and a
        four-hour claim window, Child Protection due 09:00 with eight
        hours' grace and a fourteen-day one. Same code, different
