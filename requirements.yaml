      - >
        2026-09-23: the delivery tree is byte-identical across re-runs,
        fingerprinted over every file. An intermediate version was not:
        seeding uniqueness from disk made a re-run avoid its own prior
        names and write a second history, 84 BDM deliveries where there
        should have been 42. Each generator now clears its own prior
