# Live requirements register for this PoC - real user stories, not a
# design doc. Built 2026-09-18 (plans/qa-pipeline.md item 75), at
# Keith's own request ("having like actual requirements... user
# stories, requirements, and acceptance criteria... track MoSCoW
# status... have we implemented them yet... tie them back to the actual
# tests"), scoped via three rounds of AskUserQuestion before building
# (see that item's own writeup for the fork options not taken and why):
# structured YAML with typed fields (not hand-prose like CHANGELOG.md),
# high-level user-story granularity (not a 1:1 mirror of every numbered
# item in plans/qa-pipeline.md/wider.md), and REAL enforced linkage to
# tests (qa_tools/common/validate_requirements.py fails CI if a
# `linked_tests` entry doesn't resolve to a real file/test, or if a
# `built` requirement has none at all).
#
# Schema per entry (validate_requirements.py enforces every rule below,
# it isn't just documentation):
#   id:                 "REQ-<CODE>-NNN" (2026-09-19, Keith's own ask),
#                        where <CODE> is a real 3-4 letter code for the
#                        same 7-part component taxonomy plans/*.md items
#                        and CHANGELOG.md entries already tag things with
#                        (see qa_tools/common/validate_requirements.py's
#                        own `_COMPONENT_CODES` for the single source of
#                        truth, and docs/components.md for the full
#                        write-up of what each one actually covers):
#                          GEN  = Data generation
#                          QAC  = QA checks & contract
#                          PIPE = Pipeline & publishing
#                          DASH = Dashboard UI
#                          GHUB = GitHub workflow & people
#                          TEST = Testing & dev tooling
#                          DOCS = Docs & process
#                        NNN is zero-padded 3 digits, one single global
#                        sequence across every component (not a
#                        per-component counter, to avoid ever needing to
#                        know "what's the next PIPE number" separately
#                        from "what's the next number"), globally
#                        unique. The 22 pre-2026-09-19 entries below were
#                        bare "REQ-NNN" at first, then migrated the same
#                        day to this format once Keith asked for the
#                        legacy shape to be dropped entirely, not kept
#                        as a grandfathered exception - each one kept
#                        its own original NNN and picked up the real
#                        component code that best matches it (checked
#                        against how the equivalent feature is actually
#                        tagged in CHANGELOG.md/plans/*.md; several real
#                        features are legitimately tagged with more than
#                        one component there, but this id can only carry
#                        one - the single best-fit call for each is a
#                        judgement call, not a mechanical derivation).
#   title:              short, human title.
#   story:              "As a <role>, I want <capability>, so that
#                        <benefit>." - free text, not force-parsed, but
#                        should actually read as a real user story.
#   moscow:              must | should | could | wont
#   status:               not_started | in_progress | built
#   acceptance_criteria: list of real, checkable statements - at least 1.
#                        Written in EARS style going forward (2026-09-19,
#                        Keith's own explicit call, plans/wider.md #10's
#                        requirements-analysis agents work) - "WHEN
#                        <trigger>, THE SYSTEM SHALL <response>" (or
#                        IF/THEN, WHILE/<state>, WHERE/<feature> for the
#                        other real EARS templates) rather than free
#                        prose - genuinely more rigorous/testable, not
#                        force-parsed or regex-enforced here (natural
#                        language has too many valid phrasings to safely
#                        regex-validate), just a real convention the new
#                        requirements-scoper agent writes to. Existing
#                        pre-2026-09-19 entries below were NOT
#                        retroactively rewritten - not worth the churn
#                        for something CI doesn't actually enforce the
#                        syntax of.
#   linked_tests:        list of real pytest node ids ("tests/test_x.py"
#                        or "tests/test_x.py::TestClass::test_method" or
#                        "tests/test_x.py::test_function") or real
#                        tests-js/*.js file paths - each one is verified
#                        to actually exist (validate_requirements.py
#                        parses the referenced Python file's own AST to
#                        confirm a `::`-qualified name genuinely exists
#                        as a test, not just that the file exists).
#                        Required (at least 1) once status is "built" -
#                        a requirement can't claim to be built with
#                        nothing real verifying it. May be empty for
#                        not_started/in_progress.
#
# Six further OPTIONAL fields (2026-09-19, same work) - all default to
# empty/absent for the many pre-existing entries below, which were not
# retroactively backfilled (nothing enforces backfilling optional
# fields, and guessing real provenance/evidence for old entries after
# the fact would be dishonest - these are for the new requirements-
# scoper/-architect/-reviewer agents to actually populate going
# forward):
#   date_written:        ISO date ("YYYY-MM-DD") this requirement was
#                        actually drafted - Keith's own ask, so the
#                        register has a real chronological trail, not
#                        just a sequential id. Optional/absent for old
#                        entries same as the rest of this list, but the
#                        requirements-scoper agent should always set it
#                        on anything it drafts from here on (Keith's own
#                        real Perth/AWST local date - see CLAUDE.md's
#                        own "Who this is for" section for why bare
#                        environment `date` can be wrong).
#   source:              free text - where this requirement came from
#                        ("Keith, voice-dictated batch, 2026-09-19" /
#                        "Requirements-analysis review of REQ-DOCS-014,
#                        gap found 2026-09-20"). Real provenance, not a
#                        constrained enum.
#   non_functional_requirements: list of real standing constraints this
#                        requirement must also respect (this project's
#                        own hard rules count - e.g. "CI must never
#                        touch live/synthetic data directly") - forces
#                        whoever's scoping a new idea to check it against
#                        rules like that, not just functional behaviour.
#   dependencies:        list of other real requirement ids this one
#                        needs or blocks. Each one is checked to actually
#                        exist in this same file (a dangling reference
#                        is a real validation error, same treatment as
#                        linked_tests).
#   open_questions:      list of real, unresolved forks the scoping/
#                        review agent found but couldn't resolve itself
#                        - structured, not buried in prose, and exactly
#                        what should get escalated to a human rather
#                        than guessed.
#   evidence:            list of real strings describing what was
#                        actually checked and how, populated by the
#                        requirements-reviewer agent, not the scoper -
#                        ("Playwright walkthrough 2026-09-20, confirmed
#                        X renders correctly"; "Read qa_tools/common/
#                        foo.py:42-88") - a real paper trail distinct
#                        from just which tests pass.
#
# This describes the PRODUCT (the QA dashboard/pipeline this PoC
# delivers), not this project's own working process - things like "a
# running-thoughts capture buffer" or "write CHANGELOG entries per push"
# are real, but they're conventions for HOW this gets built, not
# requirements of what gets delivered, so they're deliberately not here.

requirements:
  - id: REQ-QAC-001
    title: Real multi-tool QA checks against Birth Registrations
    story: >
      As a data steward, I want Birth Registrations run through real
      dbt-core, Soda Core, datacontract-cli, and Evidently AI checks
      against real generated data, so that the QA results I see are
      genuinely computed, not fabricated for a demo.
    moscow: must
    status: built
    acceptance_criteria:
      - Every check result traces back to a real tool run against a
        real generated CSV, never a hand-written stand-in.
      - All four tools' checks are reconciled into one dashboard view
        per column.
    linked_tests:
      - tests/test_run_dbt_bdm.py
      - tests/test_run_soda_bdm.py
      - tests/test_run_datacontract_bdm.py
      - tests/test_run_evidently_bdm.py

  - id: REQ-QAC-002
    title: Real multi-tool QA checks against Child Protection
    story: >
      As a data steward, I want the Child Protection collection (all 6
      tables, including cross-table business rules) run through the
      same four real tools, so that a multi-table collection gets the
      same real QA rigor as a single-table feed.
    moscow: must
    status: built
    acceptance_criteria:
      - Cross-table checks (referential integrity, business rules that
        span more than one table) run for real, not just per-table
        column checks.
    linked_tests:
      - tests/test_run_dbt_cp.py
      - tests/test_run_soda_cp.py
      - tests/test_run_datacontract_cp.py
      - tests/test_run_evidently_cp_real.py

  - id: REQ-DASH-003
    title: Drill-down status rollup (Agency -> Collection -> Dataset -> Column)
    story: >
      As an executive, I want a single red/amber/green rollup per
      agency that I can drill into down to individual columns, so that
      I can go from "is anything wrong" to "exactly what's wrong"
      without leaving the page.
    moscow: must
    status: built
    acceptance_criteria:
      - A dataset's own status is the worst status among its columns;
        a column's is the worst among its own real checks.
      - Every tier is clickable through to the next.
    linked_tests:
      - tests-js/status-rollups.test.js
      - tests-js/navigation.test.js

  - id: REQ-PIPE-004
    title: Committed, permanent QA history
    story: >
      As a data steward, I want every real QA run's raw tool output
      committed and preserved permanently, so that history survives a
      check's own definition changing or being retired, potentially for
      years.
    moscow: must
    status: built
    acceptance_criteria:
      - qa_results/ is committed to git, never gitignored or pruned.
      - The dashboard can be rebuilt purely from that committed history,
        with no live tool re-run required.
    linked_tests:
      - tests/test_qa_results_writer.py
      - tests/test_qa_results_reader.py
      - tests/test_build_results_from_history.py

  - id: REQ-PIPE-005
    title: CI-gated publish, no manual publish path
    story: >
      As a data steward, I want the published dashboard to only ever
      come from an automated, gated CI build, so that nobody can push a
      dashboard build that skipped validation.
    moscow: must
    status: built
    acceptance_criteria:
      - There is no local "publish" command - only CI can deploy.
      - A structurally invalid or check-lifecycle-violating build never
        reaches the published site.
    linked_tests:
      - tests/test_check_dashboard_renders.py
      - tests/test_dashboard_e2e.py::TestBuiltDashboardRenders

  - id: REQ-QAC-006
    title: Check lifecycle - retirement without losing history
    story: >
      As a data steward, I want a check's history preserved even after
      it's formally retired or its definition changes, so that
      "retired" never means "forgotten."
    moscow: must
    status: built
    acceptance_criteria:
      - Every real check across all 4 tools carries a globally-unique,
        permanent check_id.
      - A definition change with no accompanying changelog entry fails
        CI.
      - A retired check still shows its full real history behind a
        toggle, never as a hard status.
    linked_tests:
      - tests/test_check_lifecycle.py
      - tests/test_validate_check_lifecycle.py

  - id: REQ-PIPE-007
    title: Cadence-aware "as of" viewing
    story: >
      As a data steward, I want to pick any date and see the data asset
      exactly as it stood then, so that I can answer "what did we know
      as of this date" for a daily or a quarterly dataset alike.
    moscow: should
    status: built
    acceptance_criteria:
      - Staleness is computed from each dataset's own real cadence
        (daily/weekly/quarterly), not one flat day-count for everything.
      - A date before any real history shows "no data," never a
        misleading blank or stale-but-colored view.
    linked_tests:
      - tests/test_cadence.py
      - tests/test_dashboard_e2e.py::TestAsOfDatePicking::test_a_date_before_any_real_history_shows_no_data

  - id: REQ-QAC-008
    title: Resupply chains derived from real, observable signals
    story: >
      As a data steward, I want a resupply chain identified purely from
      real cadence timing and each arrival's own real pass/fail status,
      not from internal generator bookkeeping about which delivery a
      resupply was "for," so that the model matches what a real
      production feed could actually tell us (a resupply never arrives
      labelled as such).
    moscow: should
    status: built
    acceptance_criteria:
      - A red arrival starts or continues a chain; the first amber or
        green arrival after it closes the chain.
      - Every supply/resupply row shows its own real aggregate
        red/amber/green status.
    linked_tests:
      - tests-js/supply-history.test.js

  - id: REQ-DASH-009
    title: "Recent activity: who published what QA, when"
    story: >
      As a manager, I want a feed of who ran and published QA results
      for which dataset and when, so that I can see real publish
      activity across the whole data asset at a glance.
    moscow: should
    status: built
    acceptance_criteria:
      - Every entry resolves a real committer, a real commit SHA, and a
        real run timestamp - never a placeholder.
    linked_tests:
      - tests/test_changelog.py

  - id: REQ-DASH-010
    title: "Release notes: the tool's own development history"
    story: >
      As anyone evaluating this PoC, I want a real, curated changelog of
      what changed about the tool itself over time, so that I don't
      have to read raw git log to understand how it evolved.
    moscow: could
    status: built
    acceptance_criteria:
      - Entries are real, dated, and categorized (Added/Fixed/Changed),
        not a mechanical commit dump.
    linked_tests:
      - tests/test_changelog_md.py

  - id: REQ-TEST-011
    title: Real automated test coverage with an enforced floor
    story: >
      As a data steward relying on this pipeline, I want its own
      correctness verified by a real, continuously-enforced test suite
      (unit, real-tool integration, dashboard JS, and real-browser
      end-to-end), so that a regression can't silently ship.
    moscow: must
    status: built
    acceptance_criteria:
      - CI runs the full suite, including real dbt-core/Soda Core/
        datacontract-cli/Evidently integration tests, on every push.
      - A measured code-coverage floor is enforced, not just a vague
        aspiration.
    linked_tests:
      - tests/test_dashboard_e2e.py::TestBuiltDashboardRenders::test_renders_with_zero_console_errors_and_a_populated_view

  - id: REQ-DASH-012
    title: Dark mode
    story: >
      As a viewer, I want a persistent dark mode toggle, so that I can
      use the dashboard comfortably regardless of lighting or personal
      preference.
    moscow: could
    status: built
    acceptance_criteria:
      - The choice persists across a reload.
    linked_tests:
      - tests/test_dashboard_e2e.py::TestDarkModeToggle::test_toggling_dark_mode_persists_across_a_reload

  - id: REQ-DASH-013
    title: "Time travel: point-in-time dashboard snapshots"
    story: >
      As a data steward, I want fully self-contained, gzip-archived
      snapshots of the dashboard at points in time, so that "what did
      the whole page look like on this date" is answerable years later
      with nothing but a browser.
    moscow: could
    status: built
    acceptance_criteria:
      - Each snapshot opens standalone, with no dependency on the live
        site or any other file.
    linked_tests:
      - tests/test_snapshot_dashboard.py

  - id: REQ-DOCS-014
    title: A live requirements register, tied to real tests
    story: >
      As a product owner, I want real user stories tracked with MoSCoW
      priority, implementation status, and a real (not decorative) tie
      back to the tests that verify them, so that I have a genuine,
      trustworthy view of what's actually been delivered.
    moscow: should
    status: built
    acceptance_criteria:
      - Every requirement's linked_tests are validated to actually
        exist in CI, not just asserted in prose.
      - A "built" requirement can't ship with zero real linked tests.
    linked_tests:
      - tests/test_validate_requirements.py
      - tests/test_requirements_yaml.py

  - id: REQ-GHUB-015
    title: GitHub Issues as the QA remediation ticketing system
    story: >
      As a QA analyst, I want a real ticket opened automatically when a
      dataset needs follow-up, so that remediation work is tracked
      somewhere real rather than living only in someone's head.
    moscow: should
    status: not_started
    acceptance_criteria:
      - A real GitHub Issue is opened/updated/commented on accurately
        by the pipeline for real QA events.
    linked_tests: []

  - id: REQ-GHUB-016
    title: Data-asset-level people and roles config
    story: >
      As a manager, I want a config of who works on this data asset
      (name, email, role - QA/peer review/manager) and what they're
      assigned to, so that remediation tickets can be routed to the
      right person automatically.
    moscow: should
    status: not_started
    acceptance_criteria:
      - A real config file lists people, roles, and assignments.
    linked_tests: []

  - id: REQ-QAC-017
    title: An accept/reject decision workflow for amber-status supplies
    story: >
      As a data steward, I want a real, recorded decision on a
      persistently-amber dataset (accept it, or reject it and treat it
      as effectively red), so that "amber" doesn't sit ambiguous
      forever.
    moscow: should
    status: not_started
    acceptance_criteria:
      - A human decision on an amber result is recorded somewhere real
        and reflected back in the dashboard's own status.
    linked_tests: []

  - id: REQ-PIPE-018
    title: An AWS MVP reacting to real S3 delivery events
    story: >
      As a data steward, I want the pipeline to run automatically when
      a real file lands in S3, so that QA happens as part of the actual
      delivery workflow, not a manually-kicked-off local script.
    moscow: should
    status: not_started
    acceptance_criteria:
      - A real S3 event triggers a real pipeline run with no manual
        step.
      - Child Protection's own cross-table checks only run once all 6
        tables for that snapshot have actually landed and been QA'd
        individually.
    linked_tests: []

  - id: REQ-GEN-019
    title: Realistic Child Protection resupply simulation
    story: >
      As a data steward, I want Child Protection's synthetic data to
      simulate realistic resupplies too (today only Birth Registrations
      does), so that the resupply-chain model has real, varied data to
      demonstrate against for a periodic, multi-table collection.
    moscow: could
    status: not_started
    acceptance_criteria:
      - Child Protection's generator can produce a red-then-recovered
        sequence across its own quarterly cadence.
    linked_tests: []

  - id: REQ-DASH-020
    title: Human-friendlier dashboard URLs
    story: >
      As a viewer, I want a shareable link to a specific dataset/column
      view that's actually readable, so that I don't have to share an
      opaque URL-encoded JSON blob.
    moscow: could
    status: not_started
    acceptance_criteria:
      - A dataset-level URL reads as a real path, not encoded JSON.
    linked_tests: []

  - id: REQ-DASH-021
    title: Expose this project's own planning memory in the dashboard
    story: >
      As a product owner, I want to browse the plans/*.md planning
      files (with real statuses, not just prose) from inside the
      dashboard, so that I don't have to leave it to see what's done,
      parked, or still open.
    moscow: could
    status: not_started
    acceptance_criteria:
      - Each planning file's own items are browsable with a real status
        indicator, not just raw markdown text.
    linked_tests: []

  - id: REQ-DASH-022
    title: Dashboard gamification for QA turnaround
    story: >
      As a manager, I want staff who turn QA around quickly or
      consistently produce clean data celebrated somehow on the
      dashboard, so that good QA practice is visibly recognized.
    moscow: could
    status: not_started
    acceptance_criteria:
      - Not yet scoped - shape (leaderboard, badges, streaks) undecided.
    linked_tests: []

  - id: REQ-QAC-023
    title: Check metadata comes from data, never from prose
    date_written: "2026-09-20"
    story: >
      As someone maintaining these checks, I want a check's column and
      name to be stated as data rather than recovered by parsing its
      description, so that rewording an explanation can never silently
      move a check to the wrong place on the dashboard.
    moscow: must
    status: not_started
    source: >
      Found by delivery-architect while checking technical fit for
      REQ-QAC-024, verified at source, scoped with Keith 2026-09-20.
      Priority inherited from REQ-QAC-024, which cannot be done safely
      until this lands.
    acceptance_criteria:
      - WHEN a contract quality rule concerns a single column, THE SYSTEM
        SHALL express it as a property-level rule under that column, and
        SHALL determine its column from the contract's own schema
        structure rather than from the rule's description text.
      - THE SYSTEM SHALL hold a hand-authored short name for every
        SQL-type quality rule, and SHALL NOT derive any check's name from
        its description text.
      - THE SYSTEM SHALL define the check_id grammar in exactly one
        place as a pattern, and SHALL resolve any check_id segment
        through it rather than by ad hoc string splitting.
      - WHEN check-lifecycle validation runs, IF a check_id does not
        match that grammar, THEN THE SYSTEM SHALL exit non-zero and name
        every offending check_id.
      - WHEN check-lifecycle validation runs, IF a check_id's column
        segment names a column other than the one its rule is attached
        to, THEN THE SYSTEM SHALL exit non-zero and name it.
      - THE SYSTEM SHALL report every check against the same column it
        reports today, except the three cross-column business rules,
        which SHALL move from table level to the column their own
        check_id already names.
    non_functional_requirements:
      - Every check's config_hash must be byte-identical before and
        after. This repo is seeded and deterministic, so that is a real
        correctness proof rather than a smoke test.
      - No new hand-authored field beyond the SQL-rule name - the column
        comes from schema structure, not from a new property (Keith's
        own call, 2026-09-20, after establishing the contract can
        express it natively).
      - The grammar module parses and validates only - it does NOT build
        check_ids. Keith raised a builder and then declined it on the
        real numbers on 2026-09-20 - 254 check_ids are authored in YAML
        where a Python builder cannot help, against 3 in production
        Python and 32 in tests. Correctness everywhere comes from the
        validator, not from a constructor serving 1% of cases.
      - Nothing here needs a live connection to data/ or any warehouse.
    dependencies: []
    linked_tests: []
    open_questions:
      - Whether datacontract-cli runs a property-level sql rule
        identically to a model-level one. The contract already has one
        working property-level sql rule (cp_clients.date_of_birth), so
        the mechanism is proven, but all 10 moved rules need verifying.

  - id: REQ-QAC-024
    title: Plain-English explanation of what every QA check does
    date_written: "2026-09-20"
    story: >
      As a data steward who doesn't know dbt, Soda or Evidently, I want
      every check to say in plain English what it looks for and what it
      means if it fails, so that I can tell what's actually wrong with
      my data without asking the person who built the pipeline.
    moscow: must
    status: not_started
    source: >
      Keith, flagged as near-term work in plans/qa-pipeline.md item 25,
      2026-09-18; scoped via delivery-scoper 2026-09-19 and walked
      through fork by fork with Keith 2026-09-20.
    acceptance_criteria:
      - THE SYSTEM SHALL hold, for every active check across all four
        tools and both real datasets, a hand-authored plain-English
        statement of what that check verifies, in the check's own
        definition alongside its existing check_id and category.
      - THE SYSTEM SHALL hold, separately addressable from that
        statement, either a hand-authored plain-English statement of
        what a failure most likely indicates has happened upstream, or
        an explicit declaration that this check's failure cause is
        self-evident from what it verifies.
      - WHERE that second statement is authored, THE SYSTEM SHALL say
        what a failure indicates rather than restate what the check
        verifies in other words.
      - THE SYSTEM SHALL express both statements without naming any
        tool, macro or statistical method, and without cross-referencing
        another check or file that a reader cannot follow.
      - THE SYSTEM SHALL permit real column and table names in either
        statement where they are the clearest way to say what is being
        checked.
      - THE SYSTEM SHALL NOT state what a reader should do about a
        failure; remediation belongs to the ticket, not to the check
        definition.
      - THE SYSTEM SHALL provide a third, explicitly-named field for
        contributor-facing rationale, distinct from both plain-English
        statements, and SHALL preserve any superseded technical wording
        there rather than discard it.
      - WHEN any of a check's three authored text fields is edited with
        no change to that check's own config, THE SYSTEM SHALL NOT
        report the check as changed and SHALL NOT require a changelog
        entry.
    non_functional_requirements:
      - Three authored text fields per check (Keith, 2026-09-19/20). The
        existing `description` becomes by definition the plain-English
        "what"; the other two are new.
      - No authoring standard (Keith's explicit call) - no reading-age
        target, no length cap, no external guideline. The bar is "sounds
        right to a non-technical colleague" and the check's own
        maintainer authors it, with no review step.
      - No audit trail when wording changes (Keith's explicit call) -
        out of the config hash, out of the changelog, however material.
        Committed dashboard/snapshots/*.html.gz become the de facto
        record of what wording was live when.
      - Where two tools genuinely check the same thing, their statements
        MAY be identical. Per-engine wording is permission to differ
        where the checks differ, not a requirement to diverge (Keith,
        2026-09-20).
      - None of the three fields may alter any check's config_hash.
        VERIFIED TRAP - Evidently's parser excludes config-hash fields
        by an explicit name list (check_lifecycle.py:415-417), unlike
        dbt/Soda which exclude the whole metadata block, so that list
        must be updated or every Evidently check's hash changes.
      - All three fields must be plumbed through all four parsers and
        both dashboard builders, not just the one they were first
        authored in.
      - Authoring hazard, with real evidence. This adds two prose fields
        to ~258 checks, most of them hand-edited into YAML, and plain
        English carries apostrophes, colons and hashes that terse
        technical text does not. Two real breakages happened in a single
        morning just writing this register - a continuation line
        beginning with a hash parsed as a comment, and a colon-space
        inside a plain scalar. Use block scalars for the new fields. The
        check-yaml pre-commit hook catches unparseable YAML but NOT a
        mangled-but-still-valid string, which is the more dangerous
        outcome and has bitten this project before.
      - Text is published on a public site. Keith's explicit, informed
        decision - no limit on what a failure's consequence may say,
        made with that consequence named. If this is ever pointed at
        real production data, that is a decision to revisit
        deliberately, not an unexamined default.
    dependencies: [REQ-QAC-023]
    linked_tests: []

  - id: REQ-QAC-025
    title: No check ships without a plain-English explanation
    date_written: "2026-09-20"
    story: >
      As the person maintaining this pipeline, I want CI to refuse a
      check that has no plain-English explanation, so that coverage
      can't quietly rot the way it would if the field stayed optional.
    moscow: should
    status: not_started
    source: >
      delivery-scoper, gap found while scoping plans/qa-pipeline.md item
      25; mechanism and exemptions settled with Keith 2026-09-20.
    acceptance_criteria:
      - WHEN check-lifecycle validation runs, IF any check is missing its
        plain-English statement of what it verifies, THEN THE SYSTEM
        SHALL exit non-zero and name every offending check_id.
      - WHEN check-lifecycle validation runs, IF any check neither states
        what a failure indicates nor explicitly declares that its failure
        cause is self-evident, THEN THE SYSTEM SHALL exit non-zero and
        name every offending check_id.
      - THE SYSTEM SHALL apply these rules to retired checks on the same
        terms as active ones.
      - THE SYSTEM SHALL treat the contributor-rationale field as
        optional and SHALL NOT report its absence as an error.
      - THE SYSTEM SHALL report every offending check in one run rather
        than stopping at the first.
      - THE SYSTEM SHALL evaluate these rules only against the checks in
        the current working tree, never against those parsed from an
        earlier commit.
      - THE SYSTEM SHALL NOT substitute a generated, inferred or
        placeholder explanation for a missing one.
    non_functional_requirements:
      - Hard failure from day one, no warning phase. The only argument
        for softening was the HEAD~1 parse problem, which the validate()
        placement removes.
      - VERIFIED TRAP - validate_check_lifecycle.py parses both the
        working tree and HEAD~1, so making these fields mandatory at
        PARSE time would make the previous commit's own files
        unparseable and break the gate on the very push that introduces
        it. Enforcement belongs in validate(), over new checks only.
      - No category-based rule. CI does not refuse the self-evident
        declaration on any category; the check's author decides
        (Keith's explicit call, 2026-09-20, declining a proposed veto on
        consistency/timeliness checks).
      - This gate is the only thing between the register and unusable
        explanations, since there is deliberately no authoring standard
        and no audit trail. It can enforce that an explanation is
        present and that a "why" was consciously decided; by design it
        cannot enforce that either is good.
      - Runs inside the existing CI gate rather than as a new workflow.
    dependencies: [REQ-QAC-024]
    linked_tests: []

  - id: REQ-DASH-026
    title: Plain English as a check's primary headline
    date_written: "2026-09-20"
    story: >
      As a data steward glancing at the dashboard between other work, I
      want each check to lead with what it checks in plain English
      rather than with the name of the tool that ran it, so that I can
      tell what's wrong without decoding three tools' vocabularies
      first.
    moscow: should
    status: not_started
    source: >
      Keith, plans/qa-pipeline.md item 25's third scoping question;
      answered 2026-09-19 and detailed with delivery-dashboard-ux's note
      2026-09-20.
    acceptance_criteria:
      - WHEN a check is displayed, THE SYSTEM SHALL use its plain-English
        statement of what it verifies as the primary headline, in every
        place a check's name is rendered today.
      - THE SYSTEM SHALL render the check's engine and real check name as
        secondary information on the same view, not hidden behind a
        further click.
      - THE SYSTEM SHALL NOT render the shared category label on a check
        card.
      - WHEN a viewer opens a check's detail panel, THE SYSTEM SHALL show
        what a failure indicates under its own heading, in the same
        position and with the same styling whether the check currently
        passes or fails.
      - IF a check declares its failure cause self-evident, THEN THE
        SYSTEM SHALL omit that section and SHALL NOT render the
        declaration itself as viewer-facing text.
      - IF a check has no plain-English statement, THEN THE SYSTEM SHALL
        fall back to its existing technical name rather than render an
        untitled card.
      - THE SYSTEM SHALL key a check's URL segment on its check_id, and a
        deep link captured before a wording edit SHALL still resolve
        after it.
      - THE SYSTEM SHALL render a check card as a real link, so that
        middle-click, modifier-click and copy-link-address behave as they
        do for any other link on the page.
      - THE SYSTEM SHALL clamp the card headline to at most two rendered
        lines, with the full text rendered unclamped in the detail panel,
        and the status pill SHALL sit at the same position regardless of
        headline length.
      - WHEN the dashboard is opened directly from the filesystem, THE
        SYSTEM SHALL render every explanation from embedded content with
        no network request.
    non_functional_requirements:
      - The real cost here is layout, not payload - two sentences across
        166 checks is roughly 80KB on an 8MB page, and headlines render
        only inside an open column drawer, never at the executive,
        agency or dataset tiers.
      - There is deliberately no authored length cap, so the UI cannot
        assume short headlines and "keep them short" is not available as
        a mitigation.
      - The render and e2e fixtures must include at least one check whose
        statement exceeds 250 characters, or the clamp and panel-header
        criteria are untestable - every real check today is short.
      - The template interpolates check text into innerHTML and into an
        unescaped aria-label attribute. Promoting authored prose to every
        headline widens where that matters; an apostrophe-heavy sentence
        containing a double quote breaks out of the attribute.
      - Both audiences read the same page at different depths, so
        promoting the steward's headline must not cost the pipeline
        maintainer the tool trace they use to find a root cause.
      - Must keep the zero-console-errors bar and the existing Playwright
        e2e suite green.
    dependencies: [REQ-QAC-024]
    linked_tests: []
    open_questions:
      - The card-as-real-link criterion closes half of
        plans/dashboard.md item 15. The rest of that item - per-view
        document.title, focus handling after a route change, an ARIA
        live region - stays its own work.

  - id: REQ-GHUB-027
    title: Check explanations in the tickets raised from a failure
    date_written: "2026-09-20"
    story: >
      As whoever picks up a QA remediation ticket, I want the ticket
      itself to say in plain English what was failing and why it
      matters, so that I can act on it without first going back to the
      dashboard.
    moscow: could
    status: not_started
    source: >
      Keith, 2026-09-19; parked 2026-09-20 until the core lands, after
      delivery-architect found the drafted premise did not match the
      real ticket model.
    acceptance_criteria:
      - PARKED - not to be built until REQ-QAC-024 and REQ-DASH-026 have
        landed and their real sentences can be judged in place.
      - THE SYSTEM SHALL, when built, include the plain-English
        statements of the checks actually driving a dataset's status in
        that dataset's ticket - not of a single check, since tickets are
        one per dataset keyed off the aggregate status.
    non_functional_requirements:
      - The drafted premise was wrong - ticket_sync.py opens at most one
        open issue per dataset, keyed off dataset_status(), and its body
        deliberately defers check detail to the dashboard. Reframing
        that is a real change of stance, not a small addition.
      - Sizing for whenever this is picked up - at the latest run
        cp-carers had 3 checks not green and cp-placements 21, but those
        21 collapse to 9 distinct questions.
      - This is where the public-repo exposure of Keith's "no
        sensitivity limit" decision actually lands, since a ticket ties
        the text to a named dataset and date.
    dependencies: [REQ-QAC-024]
    linked_tests: []
