        2026-09-23: THE `element:` BUG IS REAL AND IS FIXED, and it was
        a capability being built rather than one preserved.
        pipeline/cadence.py's _sla_properties_to_dict keyed on
        `property` alone and discarded `element:`, so Child Protection's
        six datasets all silently inherited whatever cp_clients
        declared. It went unnoticed because all six genuinely do share
        one cadence, so the wrong answer and the right answer coincided.
        A property with no element is now a contract-wide default and
        one naming an element overrides it; both dashboard builders pass
        their own dataset's element explicitly.
      - >
        2026-09-23: no arrival verdict moved across the element fix -
