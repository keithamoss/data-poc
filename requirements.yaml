  - id: REQ-DASH-022
    title: Dashboard gamification for QA turnaround
    story: >
      As a manager, I want staff who turn QA around quickly or
      consistently produce clean data celebrated somehow on the
      dashboard, so that good QA practice is visibly recognized.
    moscow: could
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      plans/running-thoughts.md #3, same 2026-09-18 batch - staff who
      turn QA around quickly or consistently produce clean data being
      visibly recognised.
    acceptance_criteria:
      - THE SYSTEM SHALL show, per person, a streak of consecutive QA
        ticket resolutions that were never reopened.
      - WHEN a resolved ticket is later reopened, THE SYSTEM SHALL treat
        that resolution as not clean and SHALL NOT count it toward the
        streak.
      - THE SYSTEM SHALL list everyone with recorded resolutions, not
        only the highest-scoring few.
    linked_tests:
      - tests/test_leaderboard.py
    implemented_by:
      - qa_tools/common/leaderboard.py::build_leaderboard
      - qa_tools/common/leaderboard.py::compute_resolution_streaks
      - qa_tools/common/leaderboard.py::build_resolution_episodes
      - dashboard/qa-reporting-dashboard.template.html::renderLeaderboardPanel
    evidence:
      - >
        2026-09-20: 18 tests cover the streak logic, including that a
        closed ticket later reopened is a dirty episode and breaks the
        streak rather than counting toward it.
    decisions:
      - >
        The metric counts clean TICKET RESOLUTIONS, not clean QA runs.
        The original design credited whoever ran QA, which stops meaning
        anything the moment running is automated - there is no human left
        to credit. Closing a ticket is the one action in this system
        guaranteed to need a person.
      - >
        A reopened ticket breaks the streak. Counting a close that did
        not hold would reward closing tickets rather than fixing data.
      - >
        Everyone with resolutions appears, not only the top few - a
        leaderboard that shows only winners tells most people nothing
        about their own work.

  - id: REQ-QAC-023
    title: Check metadata comes from data, never from prose
    date_written: "2026-09-20"
    story: >
      As someone maintaining these checks, I want a check's column and
      name to be stated as data rather than recovered by parsing its
      description, so that rewording an explanation can never silently
      move a check to the wrong place on the dashboard.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Found by delivery-architect while checking technical fit for
      REQ-QAC-024, verified at source, scoped with Keith 2026-09-20.
      Priority inherited from REQ-QAC-024, which cannot be done safely
      until this lands.
    acceptance_criteria:
      - WHEN a contract quality rule concerns a single column, THE SYSTEM
        SHALL express it as a property-level rule under that column, and
        SHALL determine its column from the contract's own schema
        structure rather than from the rule's description text.
      - THE SYSTEM SHALL hold a hand-authored short name for every
        SQL-type quality rule, and SHALL NOT derive any check's name from
        its description text.
      - THE SYSTEM SHALL define the check_id grammar in exactly one
        place as a pattern, and SHALL resolve any check_id segment
        through it rather than by ad hoc string splitting.
      - WHEN check-lifecycle validation runs, IF a check_id does not
        match that grammar, THEN THE SYSTEM SHALL exit non-zero and name
        every offending check_id.
      - WHEN check-lifecycle validation runs, IF a check_id's column
        segment names a column other than the one its rule is attached
        to, THEN THE SYSTEM SHALL exit non-zero and name it.
      - WHEN check-lifecycle validation runs, IF two checks on the same
        dataset and column share the final check_id segment, THEN THE
        SYSTEM SHALL exit non-zero and name both, since that segment
        alone identifies a check in a dashboard URL.
      - THE SYSTEM SHALL report every check against the same column it
        reports today, except the three cross-column business rules,
        which SHALL move from table level to the column their own
        check_id already names.
    non_functional_requirements:
      - Every check's config_hash must be byte-identical before and
        after. This repo is seeded and deterministic, so that is a real
        correctness proof rather than a smoke test.
      - Nothing here needs a live connection to data/ or any warehouse.
      - KNOWN GAP, deliberately not resolved here - the grammar this
        defines has no collection segment, while a dashboard URL is
        /agency/X/collection/Y/dataset/Z. The identifier skips a level
        the rest of the system models, so a check's collection cannot be
        derived from its own id. That is the first piece of work under
        plans/publishing-and-history.md item 6 and may change this
        grammar. Build the module so the pattern is a single definition
        that can absorb a new segment, rather than assuming today's
        shape is final.
      - The tail-uniqueness rule exists because global check_id
        uniqueness does NOT imply it. Two checks could differ only in
        their table segment, be globally unique, and still collide in a
        URL that carries no table segment - whichever one the lookup
        found first would win, silently, which is the failure this work
        exists to remove. That cannot happen today only because every
        dataset maps to exactly one table, which nothing enforces, so
        the guarantee is stated directly rather than inherited from a
        coincidence of the current data model.
      - The rule is expressed in the same terms the URL keys on, and
        lives in the same module as the grammar, so the two cannot drift
        apart. A collision is a hard failure at authoring time - not a
        fallback to the full check_id for the colliding check, which
        would put two URL shapes on one page and hide the problem.
    dependencies: []
    linked_tests:
      - tests/test_check_id.py
      - tests/test_run_datacontract_cp.py::test_every_sql_rule_routes_to_a_real_column
      - tests/test_run_datacontract_cp.py::test_a_sql_rules_name_is_authored_not_taken_from_its_description
      - tests/test_run_datacontract_cp.py::test_a_range_check_is_not_labelled_referential_integrity
      - tests/test_run_datacontract_bdm.py::test_every_sql_rule_has_its_own_authored_name
      - tests/test_run_datacontract_bdm.py::test_sql_rules_get_their_shared_label_from_structure_not_prose
    implemented_by:
      - qa_tools/common/check_id.py::parse
      - qa_tools/common/check_id.py::validate_grammar
      - qa_tools/common/check_id.py::validate_column_matches
      - qa_tools/common/check_id.py::validate_tail_uniqueness
      - qa_tools/common/check_lifecycle.py::contract_rule_attachments
      - qa_tools/common/check_lifecycle.py::name_by_check_id
      - qa_tools/common/validate_check_lifecycle.py::_check_id_errors
      - qa_tools/cp/run_datacontract_cp.py::evaluate_datacontract_cp
      - qa_tools/bdm/run_datacontract_bdm.py::evaluate_datacontract_bdm
      - contract/child-protection-contract.yaml
      - contract/bdm-birth-registrations-contract.yaml
    evidence:
      - >
        2026-09-20: all 258 check config_hashes byte-identical before and
        after, captured before the first edit and re-compared after the
        last. This repo is seeded and deterministic, so that is a real
        correctness proof rather than a smoke test.
      - >
        2026-09-20: the real datacontract-cli run over all 62 Child
        Protection checks, diffed before and after the 10 rules moved to
        property level - status, metric value, row counts, thresholds and
        dimension identical on every one. The only difference is column
        attribution, on exactly the 3 business rules AC7 names. That
        settles this requirement's own open question: the tool runs a
        property-level sql rule identically to a model-level one.
      - >
        2026-09-20: all 258 real check_ids parse under the grammar, with
        zero tail collisions and zero column mismatches against the
        contracts' real attachments. Each of the three new gates was then
        confirmed to bite against a deliberately broken input rather than
        trusted on a green run.
    decisions:
      - >
        Took the column from the contract's own schema structure rather
        than adding a new hand-authored property - considered and
        rejected once the contract was confirmed able to express it
        natively (Keith, 2026-09-20).
      - >
        Rejected a check_id BUILDER in favour of a validator only. Keith
        raised it, then declined it on the real numbers: 254 check_ids
        are authored in YAML where a Python constructor cannot help,
        against 3 in production Python and 32 in test fixtures.
        Correctness everywhere comes from validation, not from a
        constructor serving 1% of cases. The argument that nearly
        carried it was not call-count but drift-proofing - one module
        exposing build, parse and validate can be property-tested so the
        three cannot disagree - so this is worth revisiting if
        Python-authored check definitions ever stop being a rounding
        error.
      - >
        Rejected two earlier shapes before moving the rules under their
        column. Reading the column out of the check_id was rejected as
        still being string-parsing; adding an explicit `column` property
        was rejected once Keith asked whether the contract could simply
        say it natively - which it can, because a property-level
        `type: sql` rule already worked here.
      - >
        The three business rules had check_ids naming notification_id,
        investigation_id and carer_id while the dashboard rendered them
        as (table). The id said one thing and the page another, and
        nothing noticed - which is why the new gate cross-checks the two
        rather than only fixing the attribution once.
      - >
        Moved the 10 table-level sql rules under their column rather than
        keeping a lookup from check_id to column. The contract can
        express the attachment natively, so structure carries it and
        there is nothing to keep in step.
      - >
        Put the authored name in customProperties rather than in the rule
        body, which keeps it outside the config hash - renaming a check
        for readability is not a change to what it does, and the 258
        unchanged hashes are the proof.
      - >
        Kept the three new gates inside the existing check-lifecycle
        command instead of adding a fourth mothman subcommand. A
        contributor who breaks one has broken the same class of thing the
        existing rules protect, and finding that out in two places is
        worse than one.
      - >
        Made the test fixtures' check_ids real-shaped rather than
        exempting them from the grammar. Two lifecycle tests failed on
        ids like "a.b.c.not_null" that could never exist in the real
        repo; a gate the tests exercising it are excused from is not a
        gate.
      - >
        Fixed a real pre-existing bug found while rewriting the label
        logic, rather than reproducing it faithfully. The old helper
        labelled anything that was not a business rule as "Referential
        integrity", so a date-of-birth range check was grouped across
        tools with the FK checks. The label now comes from the check_id
        tail, and only relationships_* is an FK check.

  - id: REQ-QAC-024
    title: Plain-English explanation of what every QA check does
    date_written: "2026-09-20"
    story: >
      As a data engineer who doesn't know dbt, Soda or Evidently, I want
      every check to say in plain English what it looks for and what it
      means if it fails, so that I can tell what's actually wrong with
      my data without asking the person who built the pipeline.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, flagged as near-term work in plans/qa-pipeline.md item 25,
      2026-09-18; scoped via delivery-scoper 2026-09-19 and walked
      through fork by fork with Keith 2026-09-20.
    acceptance_criteria:
      - THE SYSTEM SHALL hold, for every active check across all four
        tools and both real datasets, a hand-authored plain-English
        statement of what that check verifies, in the check's own
        definition alongside its existing check_id and category.
      - THE SYSTEM SHALL hold, separately addressable from that
        statement, either a hand-authored plain-English statement of
        what a failure most likely indicates has happened upstream, or
        an explicit declaration that this check's failure cause is
        self-evident from what it verifies.
      - WHERE that second statement is authored, THE SYSTEM SHALL say
        what a failure indicates rather than restate what the check
        verifies in other words.
      - THE SYSTEM SHALL express both statements without naming any
        tool, macro or statistical method, and without cross-referencing
        another check or file that a reader cannot follow.
      - THE SYSTEM SHALL permit real column and table names in either
        statement where they are the clearest way to say what is being
        checked.
      - THE SYSTEM SHALL NOT state what a reader should do about a
        failure; remediation belongs to the ticket, not to the check
        definition.
      - THE SYSTEM SHALL provide a third, explicitly-named field for
        contributor-facing rationale, distinct from both plain-English
        statements, and SHALL preserve any superseded technical wording
        there rather than discard it.
      - THE SYSTEM SHALL confine that third field to standing facts a
        contributor needs and a viewer must not see - cross-references
        between checks, and notes explaining why a check behaves as it
        does by construction.
      - THE SYSTEM SHALL NOT use that third field for dated definition
        changes, which belong in the check's own changelog.
      - WHEN an existing description contains dated definition-change
        history, THE SYSTEM SHALL move that history into the check's
        changelog rather than into the contributor-rationale field.
      - WHEN any of a check's three authored text fields is edited with
        no change to that check's own config, THE SYSTEM SHALL NOT
        report the check as changed and SHALL NOT require a changelog
        entry.
    non_functional_requirements:
      - Three authored text fields per check (Keith, 2026-09-19/20). The
        existing `description` becomes by definition the plain-English
        "what"; the other two are new. Names settled by Keith on
        2026-09-20 - `description` (existing, repurposed),
        `failure_indicates` (new), `technical_note` (new).
      - The contributor-rationale field is sparse by design - on the
        order of 8 distinct texts across 258 checks - which is why it
        stays optional and CI never requires it.
      - The boundary against `changelog` is load-bearing and was tested
        against the real text before the field was kept. A changelog
        entry carries a date, an author and a breaking flag. A standing
        fact has none of those, so forcing one into the changelog means
        inventing a date and an author for something that never
        happened, corrupting the one field whose job is who changed what
        when.
      - No authoring standard (Keith's explicit call) - no reading-age
        target, no length cap, no external guideline. The bar is "sounds
        right to a non-technical colleague" and the check's own
        maintainer authors it, with no review step.
      - No audit trail when wording changes (Keith's explicit call) -
        out of the config hash, out of the changelog, however material.
        Committed dashboard/snapshots/*.html.gz become the de facto
        record of what wording was live when.
      - Where two tools genuinely check the same thing, their statements
        MAY be identical. Per-engine wording is permission to differ
        where the checks differ, not a requirement to diverge (Keith,
        2026-09-20).
      - None of the three fields may alter any check's config_hash.
        VERIFIED TRAP - Evidently's parser excludes config-hash fields
        by an explicit name list (check_lifecycle.py:415-417), unlike
        dbt/Soda which exclude the whole metadata block, so that list
        must be updated or every Evidently check's hash changes.
      - All three fields must be plumbed through all four parsers and
        both dashboard builders, not just the one they were first
        authored in.
      - Authoring hazard, with real evidence. This adds two prose fields
        to ~258 checks, most of them hand-edited into YAML, and plain
        English carries apostrophes, colons and hashes that terse
        technical text does not. Two real breakages happened in a single
        morning just writing this register - a continuation line
        beginning with a hash parsed as a comment, and a colon-space
        inside a plain scalar. Use block scalars for the new fields. The
        check-yaml pre-commit hook catches unparseable YAML but NOT a
        mangled-but-still-valid string, which is the more dangerous
        outcome and has bitten this project before.
      - Text is published on a public site. Keith's explicit, informed
        decision - no limit on what a failure's consequence may say,
        made with that consequence named. If this is ever pointed at
        real production data, that is a decision to revisit
        deliberately, not an unexamined default.
    decisions:
      - >
        The plain-English authoring rules live in
        docs/check-authoring-rules.md, not here. They were settled with
        Keith over 25 real checks reviewed three at a time on
        2026-09-20, each one from him rejecting a specific draft - but
        they are a standing standard governing every check authored from
        here on, across every tool and every dataset, not a record of
        this requirement's own build. A one-off migration pass is the
        wrong owner for a rule that outlives it: this requirement goes
        `built` and is never opened again, while the next person adding
        a check needs the rules and has no reason to look here. The doc
        carries each rule together with the draft it replaced, and this
        field deliberately does not restate any of it, so there is only
        ever one copy to keep true.
      - >
        Decided a standing docs/ reference rather than leaving the rules
        as decisions on this requirement, or putting them in
        check_lifecycle.py's CheckMetadata comment. docs/ is an existing,
        proven third category the 2026-09-20 "requirements are permanent,
        plans are ephemeral" rule never traded away - docs/components.md
        is the precedent, a standing convention doc read at authoring
        time and kept honest by a real CI test. CheckMetadata was
        rejected as the home because someone editing a contract YAML is
        not reading a Python dataclass; it keeps the field mechanics,
        which is what code can actually express.
      - >
        Nothing enforces the wording rules, and that was accepted with
        the consequence named. The lifecycle gate can only check that
        failure_indicates is present - it cannot tell whether a
        description names an agency or lists allowed values. This
        project has already proved that a field with no forcing function
        stays empty (`evidence` at 0/27 uses with a better spec than
        most), so the mitigation is discoverability rather than
        enforcement: the gate's own failure message names the doc, and
        so do the contract files' header comments.
      - >
        A measured correction to this requirement's own reasoning: the
        NFR claiming "on the order of 8 distinct texts" justified the
        third field was counted from the real descriptions and is
        wrong. 7 of those 8 are generator/synthetic prose, which Keith
        then ruled out; 0 are non-generator "by construction" notes;
        4 are cross-references, of which 2 exist only because wording
        is duplicated. Two genuine uses, not eight. Kept anyway on
        Keith's call - "we'll see how we go as we do more checks and
        other sets" - so nobody re-proposes dropping it without this
        context, or re-proposes it on the original, disproven count.
      - >
        The dominant shape of THIS pass is splitting, not writing. Many
        existing descriptions carry the failure meaning welded on with
        no statement of what the check verifies at all, so the work is
        mostly moving approved wording into the right field rather than
        authoring fresh prose - faster and lower-risk than it looked
        when scoped. The rule that falls out of it (a description states
        what the check verifies; the failure meaning belongs in
        failure_indicates) is in the doc.
      - >
        Measured before starting, as the real scale of the pass: 257
        active checks, 140 distinct description texts, 6 with no
        description at all, and 182 of 257 sharing description text with
        a sibling. That last number is why "shared wording is permission,
        not obligation" needed to be a rule - most of the corpus is
        shared text, and some of it papers over a real difference in
        what the sibling checks actually ask.
      - >
        The gate enforces over the WORKING TREE only, never over the
        previous commit, which `validate_check_lifecycle.py` also
        parses. Enforcing at parse time instead would have made the
        commit before this one unparseable and broken CI on the very
        push that introduced the fields - flagged as a trap while
        scoping, and the reason the check lives beside `validate()`'s
        own results rather than inside the parser. It also removed the
        only real argument for a warn-first rollout.
      - >
        Rewriting a description must never move the check. That is what
        REQ-QAC-023 fixed - name and column used to be recovered from
        the description prose - and it is the dependency that made this
        requirement safe to attempt at all.
      - >
        RESOLVED (Keith, 2026-09-20), the open question that blocked
        this pass: measured verification prose in a description is
        DROPPED, not rehomed. Rejected three alternatives, each of
        which would have kept it: `evidence:` on REQ-QAC-001 (the right
        shape - that field was narrowed to measured analysis the same
        day - but it puts the justification a level above the check it
        justifies, where nobody reading the check will find it);
        `technical_note` (would have meant reopening the
        no-synthetic-data ruling); and a new requirement invented
        mainly to give the measurements an owner. What survives is the
        tolerance itself - "tolerated null up to ~5%" is the rule and
        stays in the description - and the observed ranges are
        recomputable from committed `dataset_stats.json` whenever
        anyone wants them, so nothing is actually lost, only un-written.
      - >
        The `self-evident` sentinel renders as nothing, and is resolved
        in the template rather than at the dashboard builders (Keith,
        2026-09-20, both calls). Rendering nothing matches what an
        absent value already did and what the template's own comment
        always claimed, so the "What a failure means" heading only ever
        appears with something real under it - which matters because
        roughly half of all checks are expected to carry the sentinel.
        Resolving it in the template rather than at the builders was
        the fork: it keeps the authored value travelling through to the
        page intact, so a check definition and the data built from it
        never diverge, and changing what the sentinel LOOKS like later
        is a template edit rather than a data rebuild. Rejected
        stripping it at the builders, which would have been the same
        posture `technical_note` gets - but that exclusion exists
        because a viewer must not see contributor prose, and an
        authoring marker in page source is harmless.
      - >
        The CI gate ships OFF, as a count rather than a gate, behind an
        explicit `--require-failure-indicates` flag on `mothman
        dashboard validate-check-lifecycle`. It cannot be switched on
        until all 257 active checks are authored, and the alternatives
        for bridging that gap were worse: an allowlist that shrinks
        needs maintaining and goes stale, and not building it until the
        end means writing the gate under time pressure. Meanwhile the
        count is the useful half - it turns "257 checks to write" into a
        number that visibly moves. Flipping it on at the end is one flag
        on deploy-pages.yml's own step.
      - >
        A second, narrower rule was added to that gate once writing its
        tests exposed the hole: a near-miss spelling of the sentinel
        ("self evident", "Self_Evident") is rejected outright. The gate
        proper accepts any non-empty value, so a typo would satisfy it
        and then render verbatim under a heading on the published page -
        the same leak the template's own normalisation prevents for the
        correct spelling, and the gate is the only layer that can tell a
        typo from prose someone meant. Found because a test written to
        cover the folded-block-scalar case passed with the normalisation
        deliberately removed, which meant it was not testing what its
        own name claimed.
      - >
        Found while wiring that up, and it would have shipped: the
        render layer omitted the failure block only when the value was
        ABSENT, so the first authored sentinel would have put the
        literal words "self-evident" under a heading on a public page.
        The plumbing was written before the sentinel was approved, and
        the template's own comment already described the intended
        behaviour, so this was the sentinel arriving late rather than a
        disagreement. Two tests added and confirmed failing against the
        unfixed template first - including the folded-block-scalar
        spelling, since the authoring doc tells authors to use `>` and
        a folded scalar is not `===` the sentinel.
      - >
        The prose the open question was about is really TWO kinds, and
        only one of them was ever open. Counted against the real
        checks: 7 carry it, 7 distinct texts. Four are measured
        tolerance evidence ("real observed range: 0.9-3.3%", two
        distinct measurements shared across Soda/datacontract sibling
        pairs) - those are what the decision above settles. The other
        three are generator-construction notes on CP contract checks
        ("Passes 0/0 on every clean run - child_protection.py only ever
        assigns an Approved carer"), which need no new decision at all:
        they are the synthetic-generator prose already ruled out of
        technical_note, welded onto a real description that was never
        stated separately. They are the splitting case, not the
        rehoming one.
    open_questions:
      - >
        Should a check's real-world CONSEQUENCE weight show anywhere?
        Raised against the carer-approval check - a child placed with
        an unapproved carer is a compliance failure, not a
        data-tidiness one - and never answered. The category and red
        status may already carry it, or a data engineer triaging several
        reds at once may have no way to tell which one matters most. Not
        scoped; it would be a new field or a UI treatment, not something
        the prose can fix.
    dependencies: [REQ-QAC-023]
    implemented_by:
      - docs/check-authoring-rules.md
      - qa_tools/common/check_lifecycle.py::is_self_evident
      - qa_tools/common/check_lifecycle.py::_lifecycle_fields
      - qa_tools/common/validate_check_lifecycle.py::_explanation_errors
      - qa_tools/common/validate_check_lifecycle.py::_looks_like_sentinel
      - pipeline/build_dashboard_data.py::build
      - pipeline/build_cp_dashboard_data.py::build_one_table
      - dashboard/qa-reporting-dashboard.template.html::openCheckPanel
    linked_tests:
      - tests/test_check_lifecycle.py::test_parse_contract_check_metadata_reads_failure_indicates_and_technical_note
      - tests/test_validate_check_lifecycle.py::test_an_active_check_with_no_failure_indicates_is_an_error
      - tests/test_validate_check_lifecycle.py::test_the_self_evident_sentinel_satisfies_the_gate
      - tests/test_validate_check_lifecycle.py::test_a_near_miss_spelling_of_the_sentinel_is_rejected
      - tests/test_validate_check_lifecycle.py::test_real_prose_is_never_mistaken_for_a_near_miss
      - tests/test_validate_check_lifecycle.py::test_the_gate_is_off_by_default_and_fatal_only_when_asked
      - tests-js/check-drawer-prose.test.js
    evidence:
      - >
        2026-09-20: all 257 active checks across four tools and both
        datasets carry an authored description and a failure_indicates,
        measured by parsing the real check definitions. The CI gate is
        switched on (deploy-pages.yml runs
        validate-check-lifecycle --require-explanations), so the count
        cannot silently regress. The flag was named
        --require-failure-indicates when this was first written and is
        recorded under its real name here; re-measured at the end of the
        day, 258 checks parse with zero errors, the one retired check
        included.
      - >
        2026-09-20: 213 of the 257 use the self-evident sentinel rather
        than authored prose - 83% - with 44 carrying authored failure
        prose. This entry first recorded 129 and 50%, which was true
        when taken but was taken BEFORE the final pass authoring the
        remaining 113 checks, most of which landed on the sentinel. The
        requirement predicted "roughly half" before any check was
        written; the real answer is four in five.
      - >
        2026-09-20: all 258 check config_hashes byte-identical before
        and after the pass, captured from a git worktree at the
        pre-pass commit and compared against the working tree. 105
        prose edits in one batch, zero hash changes.
      - >
        2026-09-20: a mechanical audit of all 257 authored texts
        against the rules returned zero violations - no tool, macro or
        statistical method named; no check naming its own column; no
        figure in any description; no agency name; no run, extract or
        cadence mechanics.
      - >
        2026-09-20: 257 of 257 reach the built dashboard carrying their
        description, and technical_note reaches it zero times as data -
        its only occurrences in the built page are this register's own
        prose about the field. This entry first recorded 244 of 257: the
        13 missing were table-level checks with no column to render
        under, and routing them to the two supply/table-level pseudo-
        columns the same day closed that gap.

  - id: REQ-QAC-025
    title: No check ships without a plain-English explanation
    date_written: "2026-09-20"
    story: >
      As the person maintaining this pipeline, I want CI to refuse a
      check that has no plain-English explanation, so that coverage
      can't quietly rot the way it would if the field stayed optional.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      delivery-scoper, gap found while scoping plans/qa-pipeline.md item
      25; mechanism and exemptions settled with Keith 2026-09-20.
    acceptance_criteria:
      - WHEN check-lifecycle validation runs, IF any check is missing its
        plain-English statement of what it verifies, THEN THE SYSTEM
        SHALL exit non-zero and name every offending check_id.
      - WHEN check-lifecycle validation runs, IF any check neither states
        what a failure indicates nor explicitly declares that its failure
        cause is self-evident, THEN THE SYSTEM SHALL exit non-zero and
        name every offending check_id.
      - THE SYSTEM SHALL apply these rules to retired checks on the same
        terms as active ones.
      - THE SYSTEM SHALL treat the contributor-rationale field as
        optional and SHALL NOT report its absence as an error.
      - THE SYSTEM SHALL report every offending check in one run rather
        than stopping at the first.
      - THE SYSTEM SHALL evaluate these rules only against the checks in
        the current working tree, never against those parsed from an
        earlier commit.
      - THE SYSTEM SHALL NOT substitute a generated, inferred or
        placeholder explanation for a missing one.
    non_functional_requirements:
      - Hard failure from day one, no warning phase. The only argument
        for softening was the HEAD~1 parse problem, which the validate()
        placement removes.
      - VERIFIED TRAP - validate_check_lifecycle.py parses both the
        working tree and HEAD~1, so making these fields mandatory at
        PARSE time would make the previous commit's own files
        unparseable and break the gate on the very push that introduces
        it. Enforcement belongs in validate(), over new checks only.
      - No category-based rule. CI does not refuse the self-evident
        declaration on any category; the check's author decides
        (Keith's explicit call, 2026-09-20, declining a proposed veto on
        consistency/timeliness checks).
      - This gate is the only thing between the register and unusable
        explanations, since there is deliberately no authoring standard
        and no audit trail. It can enforce that an explanation is
        present and that a "why" was consciously decided; by design it
        cannot enforce that either is good.
      - Runs inside the existing CI gate rather than as a new workflow.
    implemented_by:
      - qa_tools/common/validate_check_lifecycle.py::_explanation_errors
      - qa_tools/common/validate_check_lifecycle.py::_looks_like_sentinel
      - qa_tools/common/check_lifecycle.py::is_self_evident
      - cli/dashboard.py::validate_check_lifecycle_command
      - .github/workflows/deploy-pages.yml
    linked_tests:
      - tests/test_validate_check_lifecycle.py::test_a_check_with_no_description_is_an_error
      - tests/test_validate_check_lifecycle.py::test_an_active_check_with_no_failure_indicates_is_an_error
      - tests/test_validate_check_lifecycle.py::test_the_self_evident_sentinel_satisfies_the_gate
      - tests/test_validate_check_lifecycle.py::test_a_near_miss_spelling_of_the_sentinel_is_rejected
      - tests/test_validate_check_lifecycle.py::test_a_retired_check_is_held_to_the_same_terms
      - tests/test_validate_check_lifecycle.py::test_both_halves_are_reported_in_one_run
      - tests/test_validate_check_lifecycle.py::test_the_gate_is_off_by_default_and_fatal_only_when_asked
    evidence:
      - >
        2026-09-20: the gate passes over all 258 checks with
        --require-explanations on, and is live in deploy-pages.yml, so
        the result cannot silently regress. Removing one check's
        description in memory produces exactly 1 error naming that
        check_id, confirming the rule bites rather than passing
        vacuously.
      - >
        2026-09-20: 1 of the 258 is retired, and it was authored rather
        than excused - the count of checks exempt from these rules is
        zero.
    decisions:
      - >
        Shipped OFF first, as a count rather than a gate, and switched
        on only once REQ-QAC-024's authoring pass reached 257 of 257.
        The counting half was what made that pass tractable - "257
        checks to write" became a number that visibly moved - and it
        still runs for anyone invoking the command locally mid-change.
      - >
        Retired checks are held to the same terms as active ones, which
        reverses how this was first built. The first version exempted
        them on the reasoning that they are history nobody reads in
        anger. That is wrong twice over: this requirement says
        otherwise in as many words, and a retired check still renders
        behind the dashboard's own retired-checks toggle, so a reader
        can still meet its prose. There was exactly one, and it was
        authored.
      - >
        The gate checks the WORKING TREE only, never the previous
        commit that validate_check_lifecycle.py also parses. Enforcing
        at parse time would have made the commit before this one
        unparseable and broken CI on the very push introducing the
        fields.
      - >
        A near-miss spelling of the sentinel is rejected outright
        ("self evident", "Self_Evident"). The rule proper accepts any
        non-empty value, so a typo would satisfy it and then render
        verbatim under a heading on the published page - the gate is
        the only layer that can tell a typo from prose someone meant.
      - >
        Named --require-explanations rather than
        --require-failure-indicates, which is what it shipped as. The
        original name described half the rule, and the half it named
        was the half this requirement did NOT originally enforce.
    dependencies: [REQ-QAC-024]

  - id: REQ-DASH-026
    title: Plain English as a check's primary headline
    date_written: "2026-09-20"
    story: >
      As a data engineer using this dashboard during a refresh, I want
      each check to lead with what it checks in plain English rather
      than with the name of the tool that ran it, so that I can tell
      what's wrong without decoding three tools' vocabularies first.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, plans/qa-pipeline.md item 25's third scoping question;
      answered 2026-09-19 and detailed with delivery-dashboard-ux's note
      2026-09-20. Amended and signed off 2026-09-20 evening, after three
      of its criteria were found to predate the fields they describe.
    acceptance_criteria:
      - WHEN a check is displayed, THE SYSTEM SHALL use its hand-authored
        name as the primary headline, in every place a check's technical
        name is rendered today.
      - THE SYSTEM SHALL render the check's description on the card,
        directly beneath the headline.
      - THE SYSTEM SHALL render the check's tool and terse identifier as
        secondary information on the same view, derived from its
        check_id and formatted "tool:terse_name", not hidden behind a
        further click.
      - THE SYSTEM SHALL NOT render the shared category label on a check
        card.
      - WHEN a viewer opens a check's detail panel, THE SYSTEM SHALL show
        what a failure indicates under its own heading, in the same
        position and with the same styling whether the check currently
        passes or fails.
      - IF a check declares its failure cause self-evident, THEN THE
        SYSTEM SHALL omit that section and SHALL NOT render the
        declaration itself as viewer-facing text.
      - IF a check has no hand-authored name, THEN THE SYSTEM SHALL fall
        back to its existing technical name rather than render an
        untitled card.
      - THE SYSTEM SHALL key a check's URL segment on its check_id, and a
        deep link captured before a wording edit SHALL still resolve
        after it.
      - THE SYSTEM SHALL render a check card as a real link, so that
        middle-click, modifier-click and copy-link-address behave as they
        do for any other link on the page.
      - THE SYSTEM SHALL clamp the card description to at most two
        rendered lines, with the full text rendered unclamped in the
        detail panel, and the status pill SHALL sit at the same position
        regardless of description length.
      - THE SYSTEM SHALL set every hand-authored check field on a card as
        element text rather than as interpolated markup, so that a value
        containing a quote or an angle bracket cannot alter the card's
        structure.
      - WHEN the dashboard is opened directly from the filesystem, THE
        SYSTEM SHALL render every explanation from embedded content with
        no network request.
    non_functional_requirements:
      - The real cost here is layout, not payload - descriptions are
        already embedded for the detail panel, so putting them on the
        card adds rendering rather than bytes, and cards render only
        inside an open column drawer, never at the executive, agency or
        dataset tiers.
      - There is deliberately no authored length cap, so the UI cannot
        assume short descriptions and "keep them short" is not available
        as a mitigation.
      - The render and e2e fixtures must include at least one check whose
        description exceeds 250 characters, or the clamp and
        panel-header criteria are untestable - the longest real
        description today is 156.
      - Two audiences read the same page at different depths, so
        promoting the plain-English headline must not cost the pipeline
        maintainer the tool trace they use to find a root cause.
      - Must keep the zero-console-errors bar and the existing Playwright
        e2e suite green.
    dependencies: [REQ-QAC-024]
    linked_tests:
      - tests/test_dashboard_check_labels.py::test_tool_ref_moves_the_tool_token_to_the_front
      - tests/test_dashboard_check_labels.py::test_tool_ref_reuses_the_grammars_own_tool_list_rather_than_a_copy
      - tests/test_dashboard_e2e.py::TestCheckCardReadsAsPlainEnglish
      - tests/test_dashboard_e2e.py::TestCheckCardIsARealLink
      - tests/test_dashboard_e2e.py::TestLongDescriptionsAreClampedOnTheCardOnly
      - tests/test_dashboard_e2e.py::TestAuthoredProseCannotAlterTheCard
    implemented_by:
      - pipeline/dashboard_check_labels.py::tool_ref
      - pipeline/build_dashboard_data.py::build
      - pipeline/build_cp_dashboard_data.py::build
      - dashboard/qa-reporting-dashboard.template.html
    evidence:
      - >
        2026-09-20: all 42 distinct tool_ref values across both datasets
        carry a tool prefix, longest 37 characters - against 20 of 54
        raw tool check names exceeding 40, and datacontract's longest
        reaching 200.
      - >
        2026-09-20: a 310-character description renders as exactly 2
        lines on the card and 4 unclamped in the detail panel, measured
        in a real browser against computed line-height. The longest real
        description today is 156, so the clamp is verified against a
        case the corpus cannot yet produce.
      - >
        2026-09-20: the status pill sits at an identical offset from the
        top of every card in a column when every description is over the
        clamp - one distinct value across all 9 cards.
      - >
        2026-09-20: a plain left-click is intercepted (defaultPrevented
        true) while meta-, ctrl- and shift-click are all left to the
        browser (false), measured on the real built page.
      - >
        2026-09-20: a name of 'Quote " and <b>bold</b>' injects 1 real
        <b> element through the pre-change renderer and truncates its
        aria-label to 'View details for Quote '; through the current one
        it renders as literal text, 0 injected elements, and the full
        string in the aria-label. 6 of 257 real checks contain an
        apostrophe and none contain a quote or angle bracket, so this is
        latent rather than live.
    decisions:
      - Decided the headline is the check's short hand-authored `name`
        rather than its fuller `description`. The criterion originally
        said "plain-English statement", written at 09:04 on 2026-09-20
        when `description` was the only plain-English field a check had;
        `name` arrived at 13:17 that day and rule 19 of
        docs/check-authoring-rules.md made it the heading that evening.
        Measured over all 257 checks - `name` runs 9-36 characters,
        `description` 27-156 - so the criterion was pointing at the
        wrong one of two fields rather than being wrong in intent.
      - Decided the description goes on the card under the headline
        rather than staying in the detail panel (Keith, 2026-09-20,
        choosing between the two). Leaving it in the panel would put the
        plain English one click away from the reader this requirement
        exists for.
      - Decided the secondary line is derived mechanically from the
        check_id tail as "tool:terse_name", rejecting three alternatives.
        Printing each tool's own check name raw was rejected because 20
        of 54 exceed 40 characters - datacontract's SQL rules reach 200,
        restating the description in tool-speak. Truncating to
        "tool:kind" alone was rejected because eleven different SQL rules
        would all read "datacontract:sql". Hand-authoring 20 short names
        (Keith's own proposal) was rejected once the check_id tails
        turned out to already be exactly that - hand-written, 23
        characters median, and already CI-gated unique per column by
        REQ-QAC-023's validate_tail_uniqueness(). A second set would be
        a mapping that rots.
      - Decided the card line and the URL segment resolve to the same
        string, so what a reader sees is what they can deep-link to and
        grep the contract for.
      - Decided hand-authored fields are set as element text rather than
        escaped on their way into an HTML string. An esc() helper only
        works where someone remembers to call it, which is the same
        silent-omission shape as the gap it would be fixing; textContent
        cannot be bypassed by a field added later.
      - Decided the primary user is a data engineer working a refresh,
        not a data steward (Keith, 2026-09-20 - stewards never look at
        this dashboard, so that user does not exist). A team lead
        glancing at it between other work is the real secondary reader,
        and is what the two-line clamp and the scannable headline are
        for.
    open_questions:
      - The card-as-real-link criterion closes half of
        plans/dashboard.md item 15. The rest of that item - per-view
        document.title, focus handling after a route change, an ARIA
        live region - stays its own work.
  - id: REQ-GHUB-027
    title: Check explanations in the tickets raised from a failure
    date_written: "2026-09-20"
    story: >
      As whoever picks up a QA remediation ticket, I want the ticket
      itself to say in plain English what is failing and why it matters,
      so that I can act on it without first going back to the dashboard.
    moscow: could
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-19; parked 2026-09-20 until the core landed, after
      delivery-architect found the drafted premise did not match the
      real ticket model. Rescoped against that model and signed off the
      same evening, once REQ-QAC-024 and REQ-DASH-026 had both landed
      and the real sentences could be judged in place.
    acceptance_criteria:
      - WHEN a ticket is opened for a dataset, THE SYSTEM SHALL name in
        its body every check on that dataset that is not green, grouped
        so that checks sharing a name and description appear once.
      - THE SYSTEM SHALL separate the checks matching the ticket's own
        status from the rest, so that a reader can tell what is driving
        the status from what is merely also not green.
      - WHERE checks are grouped, THE SYSTEM SHALL state how many checks
        and which columns that group covers.
      - THE SYSTEM SHALL present each group as the check's hand-authored
        name and its plain-English description, unaltered and
        unsupplemented.
      - THE SYSTEM SHALL link every check in a group to that check's own
        page on the live dashboard, as generated metadata alongside the
        authored prose rather than woven into it.
      - THE SYSTEM SHALL NOT include the contributor-facing technical
        note anywhere in a ticket.
      - WHEN a run posts a comment on an already-open ticket, THE SYSTEM
        SHALL include the list as it stands at that run, and SHALL post
        it even when it is identical to the previous comment's.
      - THE SYSTEM SHALL NOT edit a ticket's body after the ticket is
        opened.
      - THE SYSTEM SHALL list every group, with no cap and no
        truncation.
      - WHEN a dataset resolves to green, THE SYSTEM SHALL post its
        existing resolved comment with no check list.
      - THE SYSTEM SHALL NOT list a placeholder row standing for a
        column that no tool defines a rule against.
      - THE SYSTEM SHALL strip surrounding whitespace from every
        hand-authored check text at the point it is parsed, so that no
        consumer can fail to recognise the self-evident sentinel.
      - THE SYSTEM SHALL derive the list solely from the already-built
        dashboard JSON, never from data/ or a live warehouse
        connection.
    non_functional_requirements:
      - No new exposure - every sentence this adds is already published
        on the dashboard. What is new is that a ticket ties it to a
        named dataset and a date, which is where the public-repo
        consequence of the "no sensitivity limit" decision actually
        lands.
      - Comment volume is the real cost and is accepted deliberately - a
        dataset broken for weeks accumulates a long, near-identical list
        on every run.
      - Grouping must not depend on the order checks arrive in.
      - ticket-sync.yml is the only write-permitted workflow and stays
        that way; nothing here goes near deploy-pages.yml.
      - Normalising authored text must not change any check's
        config_hash, or every check in the repo would report as changed
        and demand a changelog entry.
    dependencies: [REQ-QAC-024, REQ-DASH-026]
    linked_tests:
      - tests/test_ticket_check_summary.py
      - tests/test_ticket_sync.py::test_a_new_tickets_body_names_what_is_actually_failing
      - tests/test_ticket_sync.py::test_every_still_red_comment_carries_the_current_list
      - tests/test_ticket_sync.py::test_the_list_is_posted_again_even_when_it_has_not_changed
      - tests/test_ticket_sync.py::test_a_dataset_resolved_to_green_gets_no_list
      - tests/test_ticket_sync.py::test_an_amber_check_is_listed_under_a_red_ticket
    implemented_by:
      - qa_tools/common/ticket_check_summary.py::build_check_summary
      - qa_tools/common/ticket_check_summary.py::check_url
      - qa_tools/common/ticket_sync.py::_check_section
      - qa_tools/common/check_lifecycle.py::_authored
    evidence:
      - >
        2026-09-20: cp-placements, the worst real dataset, renders 17
        failing and 4 warning checks as 5 and 2 grouped entries. Birth
        Registrations renders 3 checks as 1 entry, cp-carers 2 as 1.
        Measured against the real committed dashboard JSON.
      - >
        2026-09-20: every deep link the builder generates resolves to a
        check key that really exists in that dataset, asserted across
        all three non-green datasets rather than sampled.
      - >
        2026-09-20: zero of the 258 config_hashes change when authored
        text is stripped at parse time, compared against the same parse
        from HEAD. Zero values reach the dashboard JSON with stray
        whitespace afterwards, against 210 sentinels and 40 contract
        descriptions before.
      - >
        2026-09-20: 11 placeholder rows exist across the six Child
        Protection tables, carrying no key, name or description. All 11
        are green today, so a status filter alone would exclude them;
        they are excluded explicitly regardless.
    decisions:
      - Decided every not-green check is listed, not only those matching
        the ticket's status (Keith, 2026-09-20, amending his own earlier
        answer). An amber check under a red ticket is worth seeing while
        somebody is already looking. They go under a separate heading,
        because a flat list answers neither "why is this red" nor "what
        else should I know".
      - Decided against a cap with "and N more" (Keith). A genuinely
        broken dataset produces a long ticket, and that is the honest
        outcome - hiding the tail hides it from the one person who
        opened the ticket to fix it.
      - Decided the body is written once and each run comment carries
        the current list, rather than rewriting the body each run. The
        thread becomes a real record of the failure set shrinking; the
        cost, stated and accepted, is repetition on a long-running
        ticket.
      - Decided the list repeats even when identical to the previous
        comment (Keith, resolving the open question this shipped with).
        Skipping unchanged lists was the only real lever on volume and
        would have traded away the every-run-on-the-record property.
      - Decided to show name and description only, not the failure-cause
        statement. That removed a live trap rather than merely
        simplifying - 210 of 213 self-evident sentinels reached the
        dashboard JSON as "self-evident\n", and only the template's
        own .trim().toLowerCase() stopped it rendering. A ticket builder
        comparing exactly would have printed the literal word
        "self-evident" into 210 GitHub issues.
      - Decided to fix that whitespace at _lifecycle_fields(), the one
        place every parser reads authored text from, rather than at each
        consumer. Safe because _NON_CONFIG_FIELDS is derived from that
        function's own keys, so those values are excluded from
        config_hash by construction - verified across all 258 rather
        than assumed. A second source was missed on the first attempt,
        the ODCS rules' own native description:, and was caught only by
        re-measuring the built JSON.
      - Decided to grow ticket_sync's dataset mapping to carry a
        collection id rather than consolidating the four copies of that
        mapping now. This is the fourth copy, which is the exact
        condition the module's own comment set for consolidating - the
        refactor is real and does not belong inside a ticket-body
        change.
      - Rejected rewriting a ticket's body on each run. It would always
        be accurate, but loses what the ticket looked like on day one,
        and the per-run comments already carry the current truth.
    open_questions:
      - Whether the run comment should be skipped when its list is
        identical to the previous one was asked and answered - do not
        skip. Worth revisiting only after watching a real long-running
        ticket, since it is the only lever on comment volume.
  - id: REQ-PIPE-031
    title: A check's identity is its check_id, never its display name
    date_written: "2026-09-20"
    story: >
      As a data engineer reading a check's history, I want each check's
      results to belong to that check alone, so that a tile I am looking
      at is not silently blending two different checks' numbers.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Found 2026-09-20 while fixing the table-level rendering gap
      below; recorded until now only in plans/running-thoughts.md #20,
      which is why this entry exists - the most serious defect found
      that day had no requirement at all.
    acceptance_criteria:
      - THE SYSTEM SHALL key each check's accumulated per-run values on
        its check_id, never on a display name or a tool-reported check
        name.
      - IF two checks on the same column would share a tool-reported
        name, THEN THE SYSTEM SHALL still report each one's own values
        separately.
    non_functional_requirements:
      - The fix must not alter any check's config_hash, or every check
        in the repo would report as changed.
      - Must hold for both dataset builders, not only the one where the
        collision was observed.
    dependencies: [REQ-QAC-023]
    linked_tests:
      - tests/test_build_dashboard_data.py
      - tests-js/table-level-checks.test.js
    implemented_by:
      - pipeline/build_dashboard_data.py::build
      - pipeline/dashboard_check_labels.py::url_key
    evidence:
      - >
        2026-09-20: the two colliding Birth Registrations checks
        genuinely disagree on 166 of 352 committed runs, so the
        published "plausible range" tile had been showing a blend of a
        range check and a freshness check. Measured against the real
        committed qa_results history.
      - >
        2026-09-20: zero collisions across both datasets after the fix,
        with the regression test confirmed failing against the
        pre-fix builder first.
    decisions:
      - The Birth Registrations builder keyed its slots on (engine,
        check_name). datacontract-cli reports every sql-type rule as
        `datacontract:custom_sql`, so date_of_birth's range check and
        its freshness check shared one key - one vanished from the page
        and both kept writing into the survivor's values. This was live
        on the published site, not a latent risk.
      - Decided to key on check_id, whose grammar and per-column tail
        uniqueness REQ-QAC-023 already gates in CI, rather than making
        the tool-reported name unique. A display name is not an
        identity, which is the same lesson REQ-DASH-026 applies to
        URLs.
      - Child Protection was never affected - its builder is per-table
        and scoping by dataset_id gives zero collisions - so the fix
        was applied to the Birth Registrations builder only.

  - id: REQ-DASH-032
    title: Supply- and table-level checks reach the dashboard
    date_written: "2026-09-20"
    story: >
      As a data engineer checking an arriving supply, I want the checks
      that apply to the whole supply rather than to one column to appear
      on the page, so that "is this supply the right size" is a question
      the dashboard can answer at all.
    moscow: must
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Found 2026-09-20 by verifying that REQ-QAC-024's first authored
      batch actually rendered rather than assuming the builders carried
      it; recorded only in plans/running-thoughts.md #20 until now.
    acceptance_criteria:
      - THE SYSTEM SHALL render every active check, including those that
        apply to a whole supply or table rather than to one column.
      - THE SYSTEM SHALL separate checks about the size and timeliness
        of a supply from checks about whether tables agree with each
        other.
      - THE SYSTEM SHALL NOT exclude a check from the page on the
        grounds of a status-calculation bug that no longer exists.
    non_functional_requirements:
      - Must be verified in a real browser rather than at the data
        layer - a correct builder says nothing about a render layer with
        its own transform.
    dependencies: [REQ-QAC-024]
    linked_tests:
      - tests-js/table-level-checks.test.js
      - tests/test_build_dashboard_data.py
    implemented_by:
      - pipeline/build_dashboard_data.py::SUPPLY_LEVEL_PSEUDO_COLUMN
      - pipeline/build_cp_dashboard_data.py::build_one_table
      - dashboard/qa-reporting-dashboard.template.html
    evidence:
      - >
        2026-09-20: 244 of 257 active checks reached the page before
        this; 257 of 257 after. The 13 were 7 rowCount_datacontract, 5
        row_count_soda and 1 freshness_datacontract.
      - >
        2026-09-20: verified in a real browser - Birth Registrations
        shows 1 supply-level column and Child Protection 6, 12 checks
        between them, every one green, zero console errors.
    decisions:
      - Three separate causes, not the one structural quirk first
        diagnosed - a bare `continue` on the "(table)" column name, a
        deliberate row-count exclusion, and the identity collision that
        is now REQ-PIPE-031.
      - The row-count exclusion was guarding a bug that no longer
        existed. Its own comment gave the reason - a warning-severity
        check has no fail threshold, a missing one defaulted to 0, and
        the status rule read any healthy positive row count as red.
        That was fixed at source when checkStatus() started preferring
        the tool's own verdict, so the workaround outlived its bug by
        long enough to hide 12 real checks.
      - Decided on two pseudo-columns rather than one (Keith,
        2026-09-20) - "(supply-level checks)" for row-count and
        freshness, "(table-level checks)" for cross-table rules. Is
        this supply the right size is a different question from do
        these tables agree, and Child Protection already used the
        second name, so it was reused rather than invented.
      - Decided to fix this after the authoring loop finished rather
        than during it (Keith). Two consequences followed - the 13 kept
        being authored like every other check, since the prose was
        correct and would simply start rendering; and the explanation
        gate did not exempt them, which would have been the wrong way
        round with a fix already coming.

  - id: REQ-DASH-033
    title: Supply-level checks get their own section, not a pseudo-column
    date_written: "2026-09-20"
    story: >
      As a data engineer opening a dataset, I want the checks about the
      supply as a whole presented as their own part of the page, so that
      the first question I ask about an arriving supply is not filed as
      one more row in a list of columns.
    moscow: should
    status: not_started
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      The one fork REQ-DASH-032 left open, carried out of
      plans/running-thoughts.md #20 and settled by Keith on 2026-09-20 -
      "table level checks do deserve their own dataset level section".
    acceptance_criteria:
      - WHEN a viewer opens a dataset, THE SYSTEM SHALL present
        supply-level and table-level checks in their own section,
        distinct from the list of columns.
      - THE SYSTEM SHALL NOT render either pseudo-column among the real
        columns once that section exists.
      - THE SYSTEM SHALL keep every existing deep link to a check in
        those groups working.
      - THE SYSTEM SHALL continue to fold those checks into the
        dataset's own status exactly as it does today.
    non_functional_requirements:
      - The pseudo-column names are currently real URL segments, so
        changing the structure must not silently break a bookmark.
      - Must be verified in a real browser, same as REQ-DASH-032.
    dependencies: [REQ-DASH-032]
    open_questions:
      - Whether the section sits above or below the column grid, and
        whether it carries its own status rollup, are presentation
        calls better made against a real rendering than in advance.

  - id: REQ-DOCS-028
    title: A "What's New" feed written for the people who use the tool
    date_written: "2026-09-20"
    story: >
      As a director, manager or someone in client services, I want to
      read what changed in plain language, so that I can stay across the
      tool without having to understand how it is built.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-20, modelled on his own keithamoss/mapa repo's
      in-app "What's New" page (frontend/src/features/whatsNew).
    acceptance_criteria:
      - THE SYSTEM SHALL hold its own development history as structured
        data rather than prose, grouped by day, newest first, with no
        version or release names.
      - THE SYSTEM SHALL state, for each day, a single summary sentence
        that a reader can stop at.
      - WHERE a change is listed, THE SYSTEM SHALL give it a headline and
        a description of one or two sentences, and SHALL tag it with one
        or more of the project's own seven components.
      - WHEN the publishing CI gate runs, IF any component tag is not one
        of those seven, THEN THE SYSTEM SHALL exit non-zero and name it.
      - WHEN the publishing CI gate runs, IF a day has no summary, an item
        has no headline or description, a category is outside the closed
        vocabulary, or a date appears twice, THEN THE SYSTEM SHALL exit
        non-zero and name the offending entry.
      - THE SYSTEM SHALL render the feed without a per-component emoji,
        while continuing to render the component tags themselves.
    non_functional_requirements:
      - Nothing here needs a live connection to data/ or any warehouse -
        the feed is a committed file read at build time, like every other
        embedded const.
      - The voice standard (second person, outcome-only, no file paths,
        tool names or measurements) is stated in CHANGELOG.yaml's own
        header and is deliberately NOT machine-checked. A proxy for it
        would be gamed within a week and wrong more often than right.
      - The component vocabulary is taken from validate_requirements.py's
        own codes rather than restated, so adding a component to the
        taxonomy cannot leave this gate behind.
    decisions:
      - >
        YAML rather than Mapa's JSON. This repo already hand-authors
        prose in YAML with block scalars, which handle multi-sentence
        text far better than JSON's escaped strings; the check-yaml
        pre-commit hook already validates every staged .yaml; and
        comments are possible at all. Mapa used JSON because its reader
        is TypeScript - ours is Python, which reads YAML natively.
      - >
        Categories are New/Improved/Fixed - plain words rather than Keep
        a Changelog's Added/Changed/Fixed, which read as a spec for a
        maintainer. Closed and validated, because an open vocabulary
        drifts into six near-synonyms within a month.
      - >
        The existing ~100 Markdown entries were scrapped outright rather
        than migrated (Keith: "that's fine"). Only safe because the
        engineering detail in them now lives in evidence: and decisions:
        on the requirements, both CI-enforced - a week earlier the same
        deletion would have destroyed the only record.
      - >
        Emojis were dropped from this feed only, not from the Plans tab's
        filter chips. On a filter chip an icon helps you re-find one you
        have used before in a row of seven; in a release note it
        decorated a tag that already said the same thing in words. It
        also keeps COMPONENT_ICON alive, so the taxonomy CI check keeps
        all three representations it cross-references.
      - >
        Per-item timestamps went. Day-grouping is the point, and a
        to-the-minute time is detail this audience does not need. The
        field survives as optional in the shape so the renderer needs no
        change if one item ever wants one.
      - >
        Release names were considered and declined. Mapa names its
        releases ("Cradle of Fur"); Keith's call was to keep grouping by
        day, so the date is the only key and there is no version field.
      - >
        The authoring standard lives in `CHANGELOG.yaml`'s own header
        comment, not in a standalone doc (Keith, 2026-09-20, asked
        directly whether it should move out alongside
        docs/check-authoring-rules.md). The two cases look identical and
        are not: check definitions live across six files and none of
        them could own the rules, which is why those needed a doc; a
        changelog entry cannot be written without opening the one file
        those rules already sit at the top of, which is better placement
        than a doc rather than worse. What did get fixed is the real
        second copy - CLAUDE.md had been restating the voice rules and
        the mechanics in 45 lines while saying in the same breath that
        the header "states the standard in full", and is now cut back to
        whether and when an entry is owed, which is genuinely its own
        job. The one thing CLAUDE.md held that the header did not - add
        to a day's existing block rather than opening a second one -
        moved into the header rather than being dropped.
      - >
        One feed, with per-tier mapping explicitly deferred rather than
        declined - six real user tiers exist (plans/running-thoughts.md
        #2) and an executive plainly wants different entries from a data
        engineer, but splitting the feed before anyone has read a single
        entry would be designing for a problem nobody has reported.
    linked_tests:
      - tests/test_changelog_yaml.py
      - tests/test_dashboard_e2e.py::TestReleaseNotesPanel::test_it_reads_as_a_whats_new_page_not_an_engineering_log
    implemented_by:
      - CHANGELOG.yaml
      - dashboard/changelog_yaml.py::parse_changelog
      - qa_tools/common/validate_changelog.py::validate
      - dashboard/embed_dashboard_data.py::embed
      - dashboard/qa-reporting-dashboard.template.html::renderChangelogPanel
      - cli/dashboard.py::validate_changelog_command
      - .github/workflows/deploy-pages.yml
    evidence:
      - >
        2026-09-20: the rewrite replaced 1 file of ~100 hand-written
        Markdown entries with 1 structured feed of 5 items across 1 day,
        and deleted 2 modules (the Markdown parser and its tests). The
        validator reports 1 day, 5 items, zero errors.
      - >
        2026-09-20: the rendered panel measured in a real browser -
        zero console errors, zero emoji characters, and the Plans tab
        re-checked in the same run to confirm its own 10 chip icons
        survived, since the emoji removal was deliberately scoped to one
        surface of two.

  - id: REQ-TEST-030
    title: One command that runs every gate this repo has
    date_written: "2026-09-20"
    story: >
      As someone about to push a change, I want a single command that
      runs every check this repo has, so that a suite I did not think to
      run is not mistaken for a suite that passed.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-20, after a session found that the JavaScript suite
      does not exercise what CI exercises and kept being skipped -
      "happy to add in npm test as a default thing that we run", and,
      on the obvious alternative, "I don't want to maintain file lists
      and so forth. That's messy."
    acceptance_criteria:
      - THE SYSTEM SHALL provide a single command that runs the Python
        linter, the YAML linter, both register gates, the JavaScript
        suite and the Python suite.
      - WHEN a gate fails, THE SYSTEM SHALL continue running the
        remaining gates and then name every gate that failed.
      - WHEN a required toolchain is not installed, THE SYSTEM SHALL
        report that gate as not run, and SHALL NOT report the overall
        result as a pass.
      - WHERE the Python suite has already been run selectively, THE
        SYSTEM SHALL offer a way to skip it WHILE still running every
        other gate.
      - THE SYSTEM SHALL show each gate's own output as it runs, not
        only a summary afterwards.
    non_functional_requirements:
      - Runs the same gates CI runs, so a green result here is real
        evidence about CI rather than a different set of checks that
        shares some names.
      - Adding a gate is one edit in one place.
      - Skipping the Python suite leaves a pass that still completes in
        seconds, so the cheap path stays worth taking.
    decisions:
      - >
        Rejected the obvious mechanism - a rule mapping changed files to
        the suites they affect - on Keith's explicit instruction. Such a
        list is wrong the moment someone adds a file and nothing tells
        you it has gone stale, which is the same rot this project
        already watched happen to the `touches:` lines in plans/*.md.
        A command that always runs everything has nothing to keep up to
        date.
      - >
        Every gate runs even after one fails, rather than stopping at
        the first. Fixing four things you were told about at once is one
        pass; finding them one command at a time is four, and the last
        three are invisible while the first is unfixed.
      - >
        A missing toolchain reports as "not run" and suppresses the
        all-passed line entirely. Found by its own test, which caught
        the first version printing "incomplete" and "Every gate passed"
        one after the other - a summary that overstates its coverage is
        the exact failure this command exists to prevent.
      - >
        Gate output streams rather than being captured for the summary.
        A table saying the Python suite failed, with the failure itself
        discarded, would be worse than no command at all.
      - >
        Ordered cheapest-first with the Python suite last, so the fast
        gates report while the slow one is still ahead of you.
      - >
        Not a substitute for checking the real CI run. CI's environment
        can diverge from local on things no local command can see, which
        this project has already been bitten by - the command's own
        docstring says so rather than letting a green table imply
        otherwise.
    dependencies: [REQ-TEST-011]
    linked_tests:
      - tests/test_cli_check.py
    implemented_by:
      - cli/check.py::check_command
      - cli/check.py::_GATES
      - cli/app.py::cli
    evidence:
      - >
        2026-09-20: a real run reports six gates - linter, YAML linter,
        both register gates, 140 JavaScript tests and the Python suite -
        from one command.
      - >
        2026-09-20: a deliberately failing gate was confirmed not to
        stop the ones after it, and a missing toolchain was confirmed to
        suppress the all-passed line rather than being counted as a
        pass.

  - id: REQ-DOCS-029
    title: Declared schemas and a standard linter for this repo's own YAML
    date_written: "2026-09-20"
    story: >
      As someone maintaining this project's hand-authored YAML, I want
      its shape declared as a spec and its parse-level hazards caught by
      a standard tool, so that a typo or a duplicated key fails loudly
      instead of being silently accepted.
    moscow: should
    status: built
    signed_off:
      by: Keith
      date: "2026-09-20"
    source: >
      Keith, 2026-09-20 - "can't we use a YAML schema validation library
      and give it a spec for this kind of stuff rather than writing these
      hacky scripts?", after a hand-rolled duplicate-key checker.
    acceptance_criteria:
      - THE SYSTEM SHALL declare the shape of requirements.yaml and
        CHANGELOG.yaml as a schema rather than as hand-written field
        checks.
      - WHEN a hand-authored YAML file contains a duplicate mapping key,
        THE SYSTEM SHALL fail and name the key and its line.
      - WHEN a record carries a field name the schema does not define,
        THE SYSTEM SHALL reject it rather than ignore it.
      - WHERE a value is rejected, THE SYSTEM SHALL name the offending
        value, not only what was expected.
      - THE SYSTEM SHALL continue to verify every linked_tests and
        implemented_by entry against a real parse of the code it names,
        and every dependency against a real id in the same file.
      - THE SYSTEM SHALL run the duplicate-key check in CI as well as at
        commit time.
      - THE SYSTEM SHALL validate both files against the same declared
        schema whether they are being gated or being rendered.
      - WHEN an optional field is written with a blank or whitespace-only
        value, THE SYSTEM SHALL reject it, WHILE continuing to accept
        the field being absent.
      - THE SYSTEM SHALL require every requirement to record where it
        came from, and SHALL reject a blank or whitespace-only value
        for it.
      - WHEN a file fails the schema, THE SYSTEM SHALL report every
        problem in the file in one run rather than stopping at the
        first.
    non_functional_requirements:
      - No behaviour change to what is accepted, beyond the two
        deliberate ones recorded in decisions - every rule the previous
        validators enforced still fires.
      - The closed vocabularies have one home, so adding a component or
        a category stays a single edit and the existing taxonomy
        consistency check keeps working.
    decisions:
      - >
        Used yamllint for duplicate keys rather than a hand-written
        checker or ruamel.yaml. ruamel detects them too, but soda-core
        pins it below 0.18, so this repo is stuck on a 2023 release
        chosen by a QA tool. yamllint is purpose-built, standalone, and
        makes it a named rule rather than a side effect of a stricter
        parser.
      - >
        Rejected solving the duplicate-key problem with a schema, tested
        rather than assumed. Schema validation runs on the parsed
        object, and a duplicate does not make a key MISSING - it leaves
        it present with truncated content. A jsonschema model requiring
        a non-empty list PASSED on the exact input that had already cost
        five decisions.
      - >
        Every yamllint style rule is disabled. On its default ruleset
        this repo reports 230 findings, 220 of them line-length - these
        files are hand-authored prose that wraps to suit the sentence,
        and leaving those on would bury the one rule that matters.
      - >
        The schemas are used by the dashboard's own parsers as well as
        by the validators - one declaration of each file's shape, not
        two. The first cut kept them apart on the grounds that a parser
        should render whatever is really there and never raise, so a
        half-written file still shows. Keith overruled it ("I don't mind
        if the parsers would choke and throw an error") and the
        reasoning holds: a requirement missing its story rendered as a
        requirement whose story is the empty string, which a reader
        cannot tell apart from one that genuinely has nothing to say.
        The parsers' own _DEFAULTS dicts were a second, hand-maintained
        statement of the same shape, free to drift from the real one.
      - >
        The requirements gate now reads the raw YAML itself instead of
        going through the parser, which it had always done. Necessary
        once the parser raises: a gate that stops at the first problem
        makes an author fix a batch one run at a time. It is also a
        better gate - the parser used to fill in every missing field
        before the gate saw it, so an absent required field arrived as
        an empty one and was reported as the wrong kind of error.
      - >
        Kept the cross-reference checks in Python, as Keith expected. A
        schema can say linked_tests is a list of strings; only an AST
        parse can say that tests/x.py::TestY::test_z names a method that
        exists, which is the difference between a decorative reference
        and an enforced one.
      - >
        Added an error formatter rather than accepting pydantic's
        wording. Pydantic states what a field should be but not what was
        written; the hand-written validators always named the offending
        value, and losing that would have made the errors worse in
        exchange for tidier code.
      - >
        A field written with nothing in it is rejected, for every
        optional field rather than just `source`. An earlier cut of this
        work accepted it, reasoning that the stripped value is identical
        to an absent one so the intent must be identical too. Keith
        disagreed and was right: a blank key is someone who started
        filling it in and stopped, and that is worth being able to tell
        apart. Accepting it is the same silent shape as the duplicate
        mapping key that prompted this work - text that looks written
        down and is not. Implemented as a before-validator, since with
        whitespace stripping an after-validator cannot tell a blank
        value from an empty one.
      - >
        `source` is required, not optional. It is the only field nobody
        can rebuild later - what a requirement does is in the code, what
        verifies it is in the tests, why it was decided that way is in
        `decisions`, but where it came from exists only if someone wrote
        it down. It had been optional because backfilling the 22
        pre-2026-09-19 entries was judged to mean guessing; that was
        answered by going and looking instead of guessing.
      - >
        21 of those 22 trace to a real plans/*.md item, Thread, Phase or
        quoted ask. The 22nd, REQ-DASH-012, records that its origin was
        never written down - kept as an honest statement rather than a
        plausible-sounding reconstruction, because the reader who most
        needs that field is the one deciding whether to go looking.
      - >
        Three entries (REQ-GHUB-015, REQ-GHUB-016, REQ-GEN-019) were
        found still marked not_started while the code they describe
        exists - the same staleness four others had already been caught
        with. Left alone here deliberately: correcting a status pulls in
        linked_tests, implemented_by, evidence and decisions for each,
        which is real work and not what this change is.
    dependencies: [REQ-DOCS-014]
    linked_tests:
      - tests/test_schemas.py
      - tests/test_validate_requirements.py
      - tests/test_changelog_yaml.py
      - tests/test_requirements_yaml.py
      - tests/test_component_taxonomy_consistency.py
    implemented_by:
      - qa_tools/common/schemas.py::Requirement
      - qa_tools/common/schemas.py::Changelog
      - qa_tools/common/schemas.py::format_error
      - qa_tools/common/vocab.py::COMPONENT_CODES
      - qa_tools/common/validate_requirements.py::validate
      - qa_tools/common/validate_requirements.py::main
      - qa_tools/common/validate_changelog.py::validate
      - dashboard/requirements_yaml.py::parse_requirements
      - dashboard/changelog_yaml.py::parse_changelog
      - .yamllint
      - .pre-commit-config.yaml
      - .github/workflows/test.yml
    evidence:
      - >
        2026-09-20: the two validators fell from 487 lines to 366 while
        gaining a guarantee they never had - an unknown field is now
        rejected rather than silently ignored. All 28 requirements and
        the whole changelog validate unchanged.
      - >
        2026-09-20: 11 requirement rules and 9 changelog rules were each
        re-confirmed to fire after the rewrite, by feeding a
        deliberately broken record to the real validator rather than
        trusting that the schema covered them.
      - >
        2026-09-20: yamllint reports zero findings across this repo's
        own YAML with key-duplicates enabled, and catches a planted
        duplicate at the exact line.
      - >
        2026-09-20: all 30 requirements carry a non-blank source, and
        the gate was confirmed to report both an absent one and a
        whitespace-only one against the requirement that carries it.
