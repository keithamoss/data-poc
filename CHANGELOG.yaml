# What's New - this project's own development history, written for the
# people who use it rather than the people who build it.
#
# Replaced the hand-written Keep-a-Changelog CHANGELOG.md on 2026-09-20.
# That file had become an engineering log: entries ran fifteen lines,
# carried config hashes and file paths and measured percentages, and were
# addressed to whoever would maintain the code next. Useful, but not to a
# director, a manager, or someone in client services trying to stay across
# a refresh cycle - and that is who reads this.
#
# THE STANDARD BELOW IS NOT CHANGED WITHOUT KEITH'S EXPLICIT APPROVAL.
# Standing instruction, 2026-09-20, covering the wording and not just
# the substance: propose the exact replacement text, get a yes, then
# edit. This applies to the rules in this header, never to the entries
# themselves - writing a new entry is ordinary work.
#
# The model is Keith's own `keithamoss/mapa`, whose in-app "What's New"
# page this deliberately imitates:
#
#   - Every item is a HEADLINE plus one or two sentences. Not a paragraph.
#   - Write what someone can now DO, in second person. "You can now see
#     which column a check belongs to" - never "moved 10 sql rules to
#     property level".
#   - No file paths, function names, measurements or internal references.
#     If a sentence only makes sense to someone who has read the code, it
#     belongs in requirements.yaml, not here.
#   - Name a tool only where the name IS the information - something a
#     reader types, or a check they would recognise in their own output.
#     Refined 2026-09-20 on Keith's own ask, against an entry that said a
#     command "runs every check it has" and left the reader none the
#     wiser: "be good if you explained a little bit more about what
#     actually, what it's checking". The test is who the name helps, not
#     whether it sounds technical - the tools someone runs are part of
#     their day; the function that calls them is not.
#   - Headlines can have some life in them. Mapa's are the bar:
#     "Begone, weird highlighting bug", "No menu for you".
#
# LENGTH. Measured against Mapa's own live feed on 2026-09-20 (the
# production branch - main was four versions stale, and reading it gave
# numbers that were wrong by a third), 7 releases and 44 items:
#
#                     min   median   mean   p90   max
#   item description   13      27     30.1    49    79
#   headline            1       2      3.0     5    16
#
# So the targets here, and they are targets rather than limits - Mapa
# has a 79-word item and it earns it:
#
#   - `description`: around 25-35 words. Up to 35 is comfortable; past
#     that, ask what the extra words are doing. This file's own first
#     ten items averaged 49 and ran to 85, which is what prompted
#     measuring: "way too long... maybe 30% of the size" (Keith).
#   - `headline`: 2-5 words. Mapa's median is 2. Ours were averaging
#     6.5 - "Four things the register said we hadn't built" says in
#     eight what "Four things we'd already built" says in four.
#   - `summary`: REQUIRED here. Around 20 words, and 40 at the outside
#     - Keith, 2026-09-20, setting the ceiling and the condition on it
#     in the same breath: 40 "would need to be like a lot of changes in
#     one day". So the length is the day's, not the writer's. A quiet
#     day that takes 40 words to summarise has been padded; a genuinely
#     busy one has earned them.
#
#     Mapa leaves the summary out on six of its seven releases, so
#     requiring it is a deliberate divergence, not an imitation: it
#     groups by named version, we group by day, and a day needs a line
#     telling a reader whether it is worth their time at all.
#
# None of this is gated. Word count IS machine-checkable, unlike voice,
# so it could be - it is not, because a hard cap would push an author
# into dropping the word that carried the meaning rather than into
# writing a better sentence, and because the one real outlier in
# Mapa's own feed is a good entry. Review is what holds it.
#
# Where the engineering detail went, and why this is safe: every built
# requirement in requirements.yaml now carries `evidence:` (what was
# measured, with the number) and `decisions:` (what was decided, and what
# was rejected). Both are CI-enforced. So the detail that used to justify
# a long changelog entry has a better home, and this file does not need
# to carry it.
#
# Structure notes:
#   - Grouped by DAY, newest first. No release names or version numbers.
#     Add to a day's existing `date:` block rather than starting a
#     second one - the validator rejects two blocks for one day, and
#     the reason is the reader, not the schema: they would see the
#     date twice with no way to tell which is authoritative.
#   - `category` is one of: New, Improved, Fixed.
#   - `components` are the project's own 7-part taxonomy, by full name,
#     CI-checked against docs/components.md and the dashboard's own
#     consts. They render as tags; the per-component emoji was dropped
#     from this feed on 2026-09-20 (the Plans tab keeps its own).
#   - `summary` is one sentence for the whole day. A reader should be
#     able to stop there.
#   - `time` is optional per item and usually omitted - day-grouping is
#     the point, and a to-the-minute timestamp is detail this audience
#     does not need.
#
# YAML rather than Mapa's JSON, deliberately: this repo already
# hand-authors prose in YAML with `>` block scalars, which handle
# multi-sentence text far better than JSON's escaped strings; the
# check-yaml pre-commit hook already validates every staged .yaml; and
# comments like this one are possible at all. Mapa used JSON because its
# reader is TypeScript. Ours is Python, which reads YAML natively.

intro: >
  What's changed in the data quality tool, newest first. Everything here
  is written for the people who use it - if you want the reasoning, the
  measurements or the code behind a change, the Requirements panel has
  all three.

releases:
  - date: "2026-10-25"
    summary: >
      The dashboard appears in under half a second again, and a data file
      that did not load is named plainly without hiding everything else.
    changes:
      - category: Fixed
        items:
          - headline: Opens in a blink
            components: ["Dashboard UI"]
            description: >
              The dashboard showed nothing for up to ten seconds while it drew
              every agency's weekly trend. The agencies now appear straight
              away, and the trend lines fill in a moment later.
          - headline: Missing files, plainly said
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              When a data file is missing or from another build, the page now
              says which, and the published site no longer keeps files from
              earlier builds.
          - headline: One broken collection, not a broken page
            components: ["Dashboard UI"]
            description: >
              If one collection's data file does not load, the rest of the
              dashboard still shows. One notice names what is missing and
              tells you to reload first, and Plans, Demo and Feedback carry
              on as normal.
      - category: Improved
        items:
          - headline: Waits that hold still
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              How long a supply has waited for a decision is now counted to
              when the page was built, so everyone reading the same page sees
              the same figure, and an unchanged history builds unchanged files.
          - headline: Archived pages, properly dressed
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              Published snapshots now find their fonts beside them, and no
              longer show a Demo button they cannot play. The site also tells
              browsers its data files are not for other websites to load.
          - headline: A build of your own
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              The dashboard build commands take `--out-dir`, so you can build
              a complete page somewhere else without touching your local
              dashboard. The browser tests use it to run on every core at
              once, and no longer overwrite your local dashboard when they run.
  - date: "2026-10-24"
    summary: >
      Every result now sits on the delivery it actually read, in the order it
      ran; a table in the warehouse is judged only by what sits beside it, and
      "in place" says where.
    changes:
      - category: Improved
        items:
          - headline: Judged by its neighbours
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A table already in the warehouse is now judged only against the
              tables in the warehouse beside it, so a file that was held back
              can neither turn it red nor keep it green.
          - headline: The asker takes the blame
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              When a check between two tables cannot run because one is
              missing, only the table asking the question turns red. One late
              file no longer colours every table it touches.
          - headline: "\"In place\" says where"
            components: ["Dashboard UI", "Testing & dev tooling"]
            description: >
              The dashboard and the terminal now say a supply is "in place in
              the warehouse", and the date control reads "In the warehouse on".
              Saved links still open where they did.
          - headline: Results placed by what they read
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              A check between two tables now shows on the delivery it actually
              read, ordered by when it ran rather than guessed from dates and
              times, so the page and the promotion decision always agree.
          - headline: Results before a re-check
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              Looking back at a date before a delivery was re-checked now shows
              what it was first checked as. It used to show the delivery before
              it, or nothing at all.
          - headline: A re-check is its own point
            components: ["Dashboard UI"]
            description: >
              When a later file or a re-check is checked hours after the first,
              it now appears as a new point in the check's history instead of
              quietly changing an earlier one.
          - headline: Blocked rows say why
            components: ["Dashboard UI"]
            description: >
              When a check between two tables could not be run, its row now
              tells you why: two competing files are waiting to be settled, or
              the supply it reads is being held.
          - headline: Trend lines name their causes
            components: ["Dashboard UI"]
            description: >
              Hover over a point on a dataset's trend line in the list to see
              what caused it and when: the supply arriving, another table's
              delivery, or a re-check.
          - headline: Carry forward from the queue
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              A quarter that could carry a newer copy forward is now one item
              in the decisions queue that opens its door, and a promotion that
              makes one available tells you so.
      - category: Fixed
        items:
          - headline: Re-checks reach the page
            components: ["Dashboard UI"]
            description: >
              A re-check that ran only the checks between tables now shows on
              each table's page; before, the page went on showing the result
              it had replaced.
          - headline: Worst of its quarters
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A table carried into a later quarter is now judged in each quarter
              it sits in, and shows the worst, so a pass beside one quarter's
              files cannot hide a failure beside another's.
          - headline: Went in red, says so
            components: ["Dashboard UI"]
            description: >
              A promoted supply that was already red before it was promoted now
              says it went in red, and since when, instead of claiming it went
              in green and turned red afterwards.
          - headline: Owed until it runs
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A re-check that failed and was retried later now reads as owed on
              every day in between, on the check and on the red promoted label
              alike.
          - headline: Carry-forward warnings tell the truth
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A carry-forward warning now says what the quarter holds today and
              shows once per quarter, and a quarter opens only when the decision
              that files into it actually goes through.
      - category: New
        items:
          - headline: Carry the newer one forward
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              When a quarter that skips a table is carrying forward an older
              copy of it, you now see a warning and can swap in the newer one
              in one step, so nothing reading it goes red in between.
          - headline: Quarters open at the first file
            components: ["Pipeline & publishing"]
            description: >
              A quarter now opens, and fills in the tables it does not owe,
              when its first file arrives, so the checks of that first delivery
              can read them.
          - headline: Crashes and timeouts are remembered
            components: ["Pipeline & publishing"]
            description: >
              Every attempt at checking a supply is now recorded, including one
              that crashes, times out or is stopped part way, so a failed
              attempt no longer vanishes once it is retried.
          - headline: One file per collection
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              Each collection's data now sits in its own file beside the page,
              so no single file grows as collections are added. The page still
              opens straight from disk.
          - headline: Missing files are named
            components: ["Dashboard UI"]
            description: >
              If one of those files is missing or from another build, the page
              says which one and what to do, instead of quietly showing an
              empty dashboard.
          - headline: Plans load when opened
            components: ["Dashboard UI"]
            description: >
              The Plans tab and the Requirements panel now load their data the
              first time you open them, so the page is about six megabytes
              lighter for everyone else.
          - headline: No file past 10 MiB
            components: ["Pipeline & publishing"]
            description: >
              A collection's data larger than 10 MiB is written as numbered
              parts the page joins back together, and every build prints the
              size of each file it writes.
          - headline: Snapshots stay one file
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              An archived snapshot still opens on its own with nothing but a
              browser. The published site's copy is split back into files so
              it fits the host's per-file limit.
  - date: "2026-10-20"
    summary: >
      Cross-table checks are checked once per delivery, and their history
      reads one delivery at a time.
    changes:
      - category: Improved
        items:
          - headline: One check for two tables that arrive together
            components: ["Pipeline & publishing"]
            description: >
              When a delivery brings two tables at the same moment, a check
              between them now runs once rather than once for each table.
              Both tables are still judged on its result.
          - headline: A delivery counts once in a check's history
            components: ["Dashboard UI"]
            description: >
              A check's panel compares against the delivery before rather
              than the same delivery's other copy, counts deliveries rather
              than copies, and says which rows came from another table.
  - date: "2026-10-19"
    summary: >
      A third collection, Emergency Department, joins the asset with its own
      history, and the synthetic data now shows a calendar being corrected
      part way through.
    changes:
      - category: New
        items:
          - headline: Emergency Department arrives
            components: ["Data generation", "QA checks & contract"]
            description: >
              A third collection, ED Presentations, now has a quarterly history
              going back to 2013, its own contract and checks, and a quarter
              it was never owed, so you can see a gap read as one.
          - headline: Calendars corrected mid-history
            components: ["Data generation", "Pipeline & publishing"]
            description: >
              The synthetic history now includes calendar corrections that are
              merged, then confirmed: one supply re-judged, one moved, one
              kept by a person, one held, and one parked behind a later
              quarter.
          - headline: A correction left waiting
            components: ["Data generation"]
            description: >
              Birth Registrations' history runs three days longer, to 25
              September, and ends on a correction nobody has confirmed yet,
              so you can see a supply judged against a claim window still
              awaiting the data asset manager.
          - headline: A dataset switched off, then on
            components: ["Data generation"]
            description: >
              Child Protection's carers are turned off for two quarters, so you
              can see a late supply still counted, a supply in the gap held,
              and the quarters between owing nothing.
      - category: Fixed
        items:
          - headline: Owed-nothing quarters stand on the right supply
            components: ["Pipeline & publishing", "Data generation"]
            description: >
              In the synthetic history, a Child Protection dataset that owes
              nothing in a quarter now stands on its own latest supply, not an
              older one picked because Emergency Department was processed
              first. Collections that share a calendar are now replayed
              together, in the order their files arrived.
          - headline: A missing --collection is asked for
            components: ["Testing & dev tooling"]
            description: >
              A mothman command that needs --collection now says so and
              stops, where `mothman supply queue` and eight others used to
              run without one and end in a traceback.
          - headline: A re-check of one table now reaches the tables that read it
            components: ["Dashboard UI"]
            description: >
              A page shows each check's newest result, whichever table's run
              recorded it, so a reader turns green the day a fixed table is
              re-checked rather than at its own next supply. While a table's
              own supply waits on a person, its cross-table checks show what
              they found on the tables that read it. A result that came from
              another table's re-check or supply says so, and when - or that
              it could not be checked, and why the readers are waiting.
      - category: Improved
        items:
          - headline: Corrections to confirm are on the dataset's page
            components: ["Dashboard UI"]
            description: >
              A calendar correction awaiting the data asset's manager is now
              one of the things waiting for a person on each dataset it
              affects, counted once in its collection and agency, from the
              day it is dated.
          - headline: Cross-table checks say which tables they are between
            components: ["Dashboard UI"]
            description: >
              Each cross-table row names the table it is checked on and the
              one it reads, so a table read by three others shows three
              relationships rather than one check listed three times.
  - date: "2026-10-18"
    summary: >
      Every collection's supplies are now generated, run, summarised and
      rebuilt by one shared set of modules, its commands are built from the
      register, and a new command shows how many
      GitHub Actions minutes the project is using.
    changes:
      - category: New
        items:
          - headline: See what CI is costing
            components: ["Testing & dev tooling"]
            description: >
              `mothman github ci-usage` reports the last week's test runs,
              cancelled runs, pushes and billable minutes per workflow, scaled
              to a month against the 2,000 minutes a private repository gets
              for free. It says plainly whether the project fits.
      - category: Improved
        items:
          - headline: One pipeline for every collection
            components: ["Pipeline & publishing"]
            description: >
              Running a supply's checks, working out its row counts and
              distributions, and rebuilding its results from recorded history
              all go through one shared module each, reading what differs from
              the collection's adapter. The last ten copied modules are gone,
              and both collections record exactly what they did before.
          - headline: Birth Registrations is no longer a special case
            components: ["Pipeline & publishing"]
            description: >
              Birth Registrations now records and publishes its results in the
              same shape as Child Protection, as a collection with one table.
              Its row-count check is counted for its table like every other
              collection's. Each collection's report files are named from its
              agency and collection, for example
              `reports/results_rs_civil-registration.json`.
          - headline: One synthetic data generator for every collection
            components: ["Data generation"]
            description: >
              Both collections' synthetic histories are written by one shared
              generator, with each collection's rows, seeds and schedule in a
              small module of its own. A new collection is that one module,
              and every delivery comes out byte-for-byte as before.
          - headline: A dataset's GitHub link opens what it is held to
            components: ["Dashboard UI"]
            description: >
              A dataset's GitHub link now opens its collection's data contract
              at that dataset's own entry, and an agency's opens its folder of
              contracts and checks. Both had pointed at code folders that no
              longer exist, and each tooltip now says where it goes.
          - headline: Every collection's commands come from the register
            components: ["Testing & dev tooling"]
            description: >
              `mothman bdm` and `mothman cp`, and the TUI's "Which dataset?"
              menus, are now built from the list of collections, so a new
              collection gets its commands and its menu entry without code of
              its own. Every command reads and behaves as before, and
              `mothman --help` opens in about half the time.
          - headline: Help that still reads at thirty collections
            components: ["Testing & dev tooling"]
            description: >
              `mothman --help` now lists the collections in a panel of their
              own, above the tools, and the new `mothman collections` command
              lists every one with its agency. Every `--collection` option
              takes a short or an id, and an unknown one is refused with the
              closest names.
          - headline: Every menu names a collection the same way
            components: ["Testing & dev tooling"]
            description: >
              The filing menu now lists Birth Registrations and Child Protection
              in the same words and order as the Quality Assurance menu. In a
              long list, typing a collection's short, id or dataset name finds
              it in any menu.
          - headline: Four column notes read in full again
            components: ["Dashboard UI"]
            description: >
              Four column descriptions had been shortened to the dashboard's
              briefer wording when the contracts became their source. They now
              carry the contract's own fuller text, on the page and in the
              contract alike.
          - headline: Birth Registrations shows its missing table-level rule
            components: ["Dashboard UI"]
            description: >
              A Birth Registrations dataset page now shows a grey Table-level
              card saying no rule is defined, as Child Protection's always
              has, so a missing rule is something you can see. A collection
              with one table no longer shows a Cross-table section at all.
          - headline: Child Protection's Soda checks show their dimension
            components: ["QA checks & contract"]
            description: >
              Fifty-two Child Protection Soda checks were recorded with no
              quality dimension and sat under "Other". Each now takes the
              category written beside it in its checks file, so you find it
              under Completeness, Conformity, Consistency or Uniqueness.
          - headline: A test that adds a collection from scratch
            components: ["Testing & dev tooling"]
            description: >
              A new test adds a made-up collection to a copy of the repository
              using only its own files, then follows it to a rendered page. You
              also see each collection's adapter size against a budget of 150
              lines when you run `mothman check`.
  - date: "2026-10-16"
    summary: >
      Birth Registrations' history now opens with twelve days when each
      supply was due the evening before, and Child Protection's earliest
      years no longer leave corrected files waiting for a decision.
    changes:
      - category: New
        items:
          - headline: An evening-before stretch for Birth Registrations
            components: ["Data generation"]
            description: >
              The synthetic Birth Registrations history now starts on 18 June
              with twelve days when each day's supply was due at 22:00 the
              evening before. Arrivals just outside and right on that window
              are planted there; every later day is unchanged.
          - headline: One runner per QA tool, for every collection
            components: ["Pipeline & publishing"]
            description: >
              dbt, Soda, datacontract-cli and Evidently each run through one
              shared module, and every supply is staged by one more, reading
              what differs from the collection's adapter. Ten copied modules
              are gone, and both collections record exactly what they did.
          - headline: Every collection's checks live in its agency's folder
            components: ["QA checks & contract"]
            description: >
              Each collection's contract, Soda and Evidently checks now sit
              together under contract/<agency>/, and its dbt files in folders
              named after it. Evidently's checks are YAML like the rest rather
              than Python, and no check changed in the move.
          - headline: Collections come from one registry
            components: ["Pipeline & publishing"]
            description: >
              Which collections exist is read from the hierarchy in
              contract/data-asset.yaml, and each runs through a small adapter.
              A new collection is picked up everywhere or refused by name, and
              `mothman check` now fails on any code that names one directly.
          - headline: Prove a refactor changed nothing
            components: ["Testing & dev tooling"]
            description: >
              `mothman debug equivalence capture` bootstraps any commit from
              empty in a worktree of its own, and `compare` shows whether two
              captures differ in recorded results, generated files, built
              reports or help and menu text. Its clock is pinned, so captures
              taken days apart still compare.
      - category: Fixed
        items:
          - headline: Corrected files in the earliest years are accepted
            components: ["Data generation"]
            description: >
              In Child Protection's earliest ten years, three corrected files
              sat in the decision queue for good. Someone now accepts each one
              a day after it arrives, so those quarters end on their corrected
              file and the queue holds only what needs you.
  - date: "2026-10-15"
    summary: >
      A dataset, or a whole collection, can now be turned off for a while or
      for good, without losing its configuration or anything it still owed.
      A supply's checks can be run again where it is filed, and a mistaken
      acknowledgement or not-supplied mark can be withdrawn.
    changes:
      - category: New
        items:
          - headline: Turn a dataset off
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Give a participation version an effective_to and a
              turned_off_reason, and the dataset stops owing supplies after
              that day - for good, or until a later version brings it back.
              One edit turns off a whole collection.
          - headline: Nothing owed goes quiet early
            components: ["Pipeline & publishing"]
            description: >
              A period owed before the turn-off is still chased until it is
              settled, and its slot stays open as long as it always would have.
              A file received while turned off is held quietly, apart from
              everything waiting on you.
          - headline: Changing a turn-off after the fact
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Moving or removing a turn-off is an ordinary edit until the
              periods it changes start to matter; after that it needs a
              declared correction, and the refusal names each period and when
              it started to matter.
          - headline: Re-check a supply where it is
            components: ["Pipeline & publishing"]
            description: >
              When a check was wrong and you have fixed it, ask for a waiting or
              promoted supply's checks to run again in the period it is filed to,
              with a reason, from Filing decisions or `mothman supply decide
              --operation re-check`. Nothing moves; a waiting supply that comes
              back green can promote itself.
          - headline: A promoted supply that re-checks worse stays, and says so
            components: ["Pipeline & publishing"]
            description: >
              A promoted supply is never taken out by a re-check. If it comes
              back worse than it was promoted on, it is listed as "Promoted, then
              re-checked" until someone demotes it or acknowledges the new verdict.
          - headline: Withdraw a mistaken acknowledgement or not-supplied mark
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              Recorded one on the wrong slot? Withdraw it with a reason, from
              Filing decisions or `mothman supply decide`. The period reads
              overdue again, or the supply awaits acknowledgement again, and the
              dashboard shows what was withdrawn, by whom and why.
          - headline: Periods a dataset owes nothing in say so
            components: ["Dashboard UI"]
            description: >
              A dataset's supply history now shows each period it owes nothing
              in as a quiet row in its place - "Not owed — outside its agreed
              months (Feb, Aug)", "Not expected — <reason>" - never red, and
              never mistaken for a missed supply.
          - headline: The SLA tile gives the delivery time in force
            components: ["Dashboard UI"]
            description: >
              The SLA tile names the dataset's own months, "Twice a year (Feb,
              Aug, day 1), by 09:00", with the agreed reason beneath, and changes
              with the date you are looking at. Before a dataset owes anything it
              reads "Not owed yet".
          - headline: A turned-off dataset reads as turned off
            components: ["Dashboard UI"]
            description: >
              Its real verdict stays, red included, with a marker beside it -
              "Turning off after 31 Mar", "Turning off - 2026-Q1 supply still
              owed", "Turned off since 1 Apr" - and the reason in its header.
              Once it owes nothing more it leaves its group's rollup, and a
              group that is only turned off reads "Turned off", never green.
          - headline: Quiet about what was received while turned off
            components: ["Dashboard UI"]
            description: >
              Supplies received while a dataset is turned off get their own quiet
              section in its supply history and one line on its page, and its
              SLA tile reads "Turned off — nothing due".
          - headline: A supply placed by hand says so
            components: ["Dashboard UI"]
            description: >
              A held supply a person placed into a period now carries a "Placed
              in <period>" tag on its row - who, when and why, and whether that
              period was closed or not yet open when it arrived - and its hold's
              row says where it went.
          - headline: "`schedule show` says it is off"
            components: ["Pipeline & publishing"]
            description: >
              `mothman schedule show --on <date>` and the Calendar entry now say
              who turned a dataset off, when and why, what it still owes and
              until when, and how long an ordinary edit can still change it.
      - category: Fixed
        items:
          - headline: The agency legend adds up
            components: ["Dashboard UI"]
            description: >
              The landing page's legend now gives a plain count for green
              agencies, like the others, rather than "1 agencies".
          - headline: An agreed gap no longer reads as stale
            components: ["Dashboard UI"]
            description: >
              A dataset between deliveries, on a date inside a period it was
              agreed not to supply, no longer reads "nothing has landed yet".
          - headline: Turned-off holds stay out of what needs you
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              Supplies received while a dataset was turned off no longer count
              towards a dataset's outstanding marker or its blocker history, and
              `mothman supply holds` no longer lists them or names their dataset
              as waiting on you.
          - headline: Keep is only offered where it would be accepted
            components: ["Pipeline & publishing"]
            description: >
              Confirming a correction, and every list of parked moves, no longer
              offers to keep a supply in a period that owes nothing any more. A
              parked move into a turned-off period now names that period.
          - headline: Turn-off wording that matched the facts
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              A dataset back on inside its collection's gap is no longer shown
              as off for good. A turn-off that has not started yet no longer
              silences the runway warning, and a freeze refusal names every
              period the change reaches back into, not only the first.
          - headline: Turned-off and not-owed, tidied
            components: ["Dashboard UI"]
            description: >
              A dataset not owed anything yet says "Not owed yet", not "No
              data". A supply in a period owed nothing shows once. "Nothing more
              owed" waits until the turn-off is written down, and the runway
              warning stops asking for dates a dataset will never owe.
          - headline: Corrections wait, and turn-offs hold
            components: ["Pipeline & publishing"]
            description: >
              A held supply that only an unconfirmed correction covers stays
              held until the correction is confirmed. A correction that turns a
              period off now holds a supply a person filed there too, and the
              flags refuse a substitute over two unsettled files.
          - headline: Decisions in words in the terminal
            components: ["Testing & dev tooling"]
            description: >
              `mothman supply decisions` now says "promoted", "no longer
              acknowledged" and so on, the same words the dashboard uses,
              instead of the log's own action names.
          - headline: Placed, then what happened next
            components: ["Dashboard UI"]
            description: >
              A pair placed by hand and later superseded or rejected now says
              both. A placed supply later re-filed elsewhere stops saying
              "Placed in" from that day. Each supply received while turned off
              says how it ended, and the line counts how many are still held.
          - headline: Corrections and turn-offs, tightened
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A supply you placed into a period that a correction turns off is
              now shown as becoming a turned-off hold. A held supply waits for a
              pending correction, a timezone correction included, unless the
              confirmed calendar gives it the same period. A dataset not owed
              yet says so in the table and on its own page.
          - headline: Every supply in a period, in the terminal
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              When more than one supply is filed to a period, Decide about a
              period lists them all, each with where it stands and its verdict,
              and you pick the one the decision is about. A good supply waiting
              behind a resupply that could not be loaded is in the queue again.
          - headline: Two more test scenarios have data behind them
            components: ["Data generation"]
            description: >
              TS-14, a corrected Client Register arriving on its own weeks
              later, and TS-54, a period stood on an earlier promoted supply,
              now open from the Scenarios tab like the rest.
          - headline: What a whole period holds, dataset by dataset
            components: ["Dashboard UI"]
            description: >
              Each period of a collection now has a page of its own: one row
              per dataset saying whether it holds its own promoted supply, one
              inherited or substituted from an earlier period, or nothing - with
              when it arrived, who decided, and the status it was promoted on.
              Open it from a period's heading in any supply history, or from a
              stand-in's details.
          - headline: Two Client Register files in one delivery are a contested pair
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Child Protection's Client Register is now recognised under any
              name of the form cp_clients_<suffix>.csv, so two of its files in
              one delivery are held as a contested pair, the same way Birth
              Registrations' are, and you settle them with the same decision.
              A check run from a folder now works out each table from its file
              name and refuses a folder with two files for one table.
          - headline: A scenario link lands on what it is about
            components: ["Dashboard UI", "Data generation"]
            description: >
              Following a scenario from the Scenarios tab now scrolls straight
              to the part of the page it is about and marks it with its id and
              date. The link is a real link, so you can open it in a new tab or
              share it, and a reload lands in the same place.
          - headline: "'How it got here' has its own column"
            components: ["Dashboard UI"]
            description: >
              In a dataset's supply history, the last column is now headed How
              it got here: placed, filed by hand, settled from two files, moved
              by a correction or still owed after a turn-off. Timing is only
              about whether it was on time.
          - headline: Ten more years of Child Protection
            components: ["Data generation", "QA checks & contract"]
            description: >
              The synthetic Child Protection history now starts in 2013 rather
              than 2023: forty more quarters of ordinary deliveries, so new
              scenarios have room. Every older delivery is unchanged except
              two quarters, and the column-order scenario now sits in 2026-Q3.
          - headline: One block for a period owed nothing
            components: ["Dashboard UI"]
            description: >
              When several supplies land in a period a dataset owes nothing
              in, its supply history now shows that period once, with every
              delivery in it, rather than repeating "Not owed" for each.
          - headline: The right dataset in the runway warning
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              A dataset whose turn-off for good is written down no longer
              decides how short a calendar's dates are, so another dataset
              that is also running short is the one you are warned about.
          - headline: Turning off waits until it is written down
            components: ["Pipeline & publishing"]
            description: >
              The terminal only says a dataset is "turning off - nothing more
              owed" from the day its turn-off was recorded, the same day the
              dashboard starts saying so.
          - headline: Re-checked worse stays on the list
            components: ["Pipeline & publishing", "GitHub workflow & people"]
            description: >
              A promoted supply that came back worse on a re-check stays on
              the list while you ask for another re-check, until that one
              runs and says otherwise.
          - headline: Reject only, at the door too
            components: ["GitHub workflow & people"]
            description: >
              A supply that could not be loaded is offered reject alone in the
              period door, even when it is the only supply in its period - the
              same choice the queue gives you.
          - headline: Scenario links land in the middle
            components: ["Dashboard UI"]
            description: >
              Following a scenario now puts what it is about in the middle of
              the window, not squeezed against the bottom edge, and keeps the
              top of the page in view where both fit.
          - headline: A pair of files says what to do
            components: ["Pipeline & publishing"]
            description: >
              When a check run from a folder finds two files for one table, it
              now tells you how to fix it: remove all but one file, or keep the
              delivery and settle the pair in Filing decisions.
  - date: "2026-10-14"
    summary: >
      The dashboard now counts what is not green at every level, and every
      requirement has a link of its own, and a held supply can be placed into a
      period. Also fixes for a supply that arrives early reading as missing, and
      for side panels opened from a shared link.
    changes:
      - category: New
        items:
          - headline: Place a held supply into the period it belongs to
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              A supply the filing rule could not place used to have one way
              out: rejection. Now Filing decisions lists held supplies in their
              own group, and you can place one by picking its period from a list
              that marks closed periods and ones it owes nothing in. It is then
              checked there and the promotion gate decides, as for any arrival.
              A held supply can also be rejected without naming a period.
          - headline: "`supply decide` leaves checks to the processing pass"
            components: ["Pipeline & publishing"]
            description: >
              Recording a placement or a re-file with `mothman supply decide`
              now leaves its checks owed for `mothman pipeline process` instead
              of running them there. Add `--wait` to run them straight away;
              it exits 3 if the decision stands but its checks did not finish.
          - headline: Filing decisions offers everything the command line can do
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              Bringing back a superseded version is offered wherever one can
              come back - not only after the newer one is rejected - and says
              how many there are. A promoted supply can be rejected straight
              from the screen. A test now tries every decision against every
              state the screen can show, so the two cannot drift apart.
          - headline: Link straight to one requirement
            components: ["Dashboard UI"]
            description: >
              Each requirement in the Requirements panel now has its own link,
              on its id. Share it and the panel opens at that requirement,
              marked "Linked here"; Back and Forward step through it like any
              other page.
          - headline: Every change to what a check does now needs a note
            components: ["QA checks & contract"]
            description: >
              Changing a check's rule - the regex macro behind a dbt test, a
              Soda check's expression, a drift check's thresholds - now fails
              the build until the check's changelog says why. Before, only
              changes to a check's settings were caught.
          - headline: A check's chart says what it measures
            components: ["Dashboard UI"]
            description: >
              Each check's trend chart now names its line above the plot and
              in its table - "Rows with no value (count)", "Rows (count)",
              "Drift score (PSI)" - instead of a bare "Value", so a falling
              row count is not read as an improving failure count.
          - headline: The dataset list counts columns that are not green
            components: ["Dashboard UI"]
            description: >
              The Trend column is now "Columns not green": how many of a
              dataset's columns are red or amber on its latest QA run - "1 of
              11", then "0 red, 1 amber" - with two small lines for the red and
              amber share on each run. A check section counts as one column.
          - headline: A Feedback tab shows what was raised and what came of it
            components: ["Dashboard UI", "Docs & process"]
            description: >
              A new Feedback tab lists everything raised while road-testing the
              dashboard - by you or by us - with what we heard, what we built,
              and links to see it. Each card's status comes from the
              requirements it points at, so it is never out of date.
          - headline: Agency cards count datasets that are not green
            components: ["Dashboard UI"]
            description: >
              Each agency card, and each collection heading under it, now says
              how many of its datasets are not green - "2 of 6 datasets not
              green", then "2 red, 0 amber" - with a small red and amber trend
              for each week back to its first QA run.
          - headline: Dataset and column pages chart red and amber
            components: ["Dashboard UI"]
            description: >
              Each dataset page now charts the share of its columns red and
              amber on every QA run, and each column's panel does the same for
              its checks - with titled axes and a "View as table" listing.
              Column tiles show the same two small lines.
      - category: Fixed
        items:
          - headline: Trend lines no longer count unjudged checks as failing
            components: ["Dashboard UI"]
            description: >
              A check with no rule for a period, or not run for it, used to
              count as failing in the Trend column, so a dataset with nothing
              wrong could draw a line near the top of its box. Only amber and
              red count now.
          - headline: Check rules in subfolders need a note too
            components: ["QA checks & contract"]
            description: >
              A dbt macro or test kept in a subfolder now needs a changelog
              note when it changes, like one at the top level. Drift checks
              also read their column from the check's own entry now.
          - headline: Check sections say No data when their columns do
            components: ["Dashboard UI"]
            description: >
              On a date with nothing yet in a dataset's current period, its
              Supply-level, Table-level and Cross-table sections now read "No
              data" like its columns, instead of green from an earlier run.
          - headline: Close shuts the Requirements panel in one press
            components: ["Dashboard UI"]
            description: >
              After following links from one requirement to another inside
              the panel, X or Escape used to step back one requirement at a
              time. It now closes the panel; Back still steps through them.
          - headline: An early supply no longer reads as "No data"
            components: ["Dashboard UI"]
            description: >
              A supply that arrives inside its claim window but before its
              period starts now counts as that period's supply. Before, a
              whole collection could read "No data" for the quarter even
              though its supply had arrived and been accepted.
          - headline: Demo corrections are dated by the history, not the rebuild
            components: ["Data generation", "Pipeline & publishing"]
            description: >
              A calendar correction in the demo history used to show as
              confirmed on whatever day the history was rebuilt. It now shows
              as confirmed when the history ends, or on the correction's own
              date if that is later, so every rebuild reads the same.
          - headline: Closing a shared panel link keeps you on the dashboard
            components: ["Dashboard UI"]
            description: >
              Opening a link straight to the Requirements, Release notes or
              another side panel, then closing it, used to take you back out of
              the dashboard - or, in a new tab, would not close at all. It now
              closes and leaves you where you were.
  - date: "2026-10-13"
    summary: >
      You can now say what each of two files for one table is. Also fixes
      for re-checks after a decision and for past dates that showed
      today's files.
    changes:
      - category: New
        items:
          - headline: Settle two files that arrived for one table
            components: ["Pipeline & publishing"]
            description: >
              When two files arrive for one table, open Filing decisions in
              mothman and choose "settle". For each file you say whether it
              is the period's supply, belongs to another period, is wrong,
              or is a spare copy. Each file that becomes a supply is then
              checked on its own, and the dataset stops reading "two files".
          - headline: Two files for one table, on the page and the ticket
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              A dataset with two files for one table now says so in those
              words, names both files and tells you where to settle them. Once
              settled, its supply history shows who settled the pair and what
              each file turned out to be, and a re-filed file links to the
              period it went to.
          - headline: Seven example pairs of files in the demo history
            components: ["Data generation"]
            description: >
              Birth Registrations' demo history now runs 85 days and includes
              seven deliveries with two files for one table: a duplicate, the
              next day's file sent early, a corrected resend, stray test
              files, and a pair where neither file is usable. Each reads "two
              files" on the day it arrived and is settled by an example person
              the next morning, so you can see every outcome on a real page.
          - headline: Demo cases for what the page says about a past date
            components: ["Data generation"]
            description: >
              The demo history now has a real case of each thing the page words
              differently on a past date: a supply that waited and was later
              rejected, a stand-in period later removed and another later
              replaced, a supply promoted after a newer one, and an inherited
              quarter. Each is in the test scenarios panel, and its link opens
              on a date where it shows.
      - category: Fixed
        items:
          - headline: Two files for one table can no longer both be promoted
            components: ["Pipeline & publishing"]
            description: >
              Promoting a dataset where two files claim the same table used to
              move both into the period. It is now refused, and tells you
              where to settle the two files instead.
          - headline: A rejected supply can be promoted back
            components: ["Pipeline & publishing"]
            description: >
              Promoting a supply you had rejected used to be refused, because
              promotion only looked among the supplies still waiting. It now
              brings the supply back, so a rejection can be undone.
          - headline: Re-checks after a decision work for Perth-time supplies
            components: ["Pipeline & publishing"]
            description: >
              Re-checking a supply after a person re-filed or restored it
              could not find the supply's own table when it arrived on Perth
              time, and a re-check that did run stopped the Child Protection
              dashboard building. Both are fixed, and the synthetic history's
              scripted decisions now run their re-checks too.
          - headline: A check between two tables re-checks both when one arrives
            components: ["Pipeline & publishing"]
            description: >
              A check comparing two tables counts toward both datasets, but
              when one table arrived only the dataset the check was filed
              under was checked again. A supply that check had turned red,
              because the other table was not there yet, now gets checked
              again and can be promoted.
          - headline: Only settling the two files ends "Two files, choose one"
            components: ["Pipeline & publishing"]
            description: >
              Excusing a late supply no longer stops a dataset showing "Two
              files, choose one". Only rejecting the pair, or a later supply
              replacing it, ends that now.
          - headline: A pair with one unreadable file is not checked early
            components: ["Pipeline & publishing"]
            description: >
              When one of two files for a table could not be loaded, the other
              used to be checked as if it were the supply before anyone had
              settled the pair. Neither is checked now until a person decides,
              as the page already said.
          - headline: A re-file cannot end someone else's pair
            components: ["Pipeline & publishing"]
            description: >
              Re-filing a supply into a period where two files are still
              waiting to be settled is now refused, with where to settle them.
              It used to supersede the pair without anyone choosing a file.
          - headline: The file that never loaded is named on a settled pair
            components: ["Dashboard UI"]
            description: >
              A settled pair now marks the file the load refused as never
              loaded, with the file check's reason, and a day where both files
              were rejected says so in those words.
          - headline: A settled spare file is never "the latest file"
            components: ["Dashboard UI"]
            description: >
              Once two files for one table are settled, the panel comparing
              what is promoted with the latest file names the file that became
              the supply. It used to be able to name the spare copy or the
              rejected file instead.
          - headline: A past date no longer shows files from its future
            components: ["Dashboard UI"]
            description: >
              The "not the latest file" panel now says what was promoted and
              what had arrived on the date you picked, in the past tense and
              naming that date, instead of today's files. The supply the
              verdict line names as in place is now always the one the panel
              names.
          - headline: Inherited and substituted labels describe the period you are viewing
            components: ["Dashboard UI"]
            description: >
              The "Inherited from" and "Substituted from" label now only shows
              for the period on show, so today's view no longer names an
              earlier quarter's stand-in. Following it lands on the day that
              supply was promoted, and Back returns you to exactly the date
              you left.
          - headline: Following an inherited or substituted period takes you to the change
            components: ["Dashboard UI"]
            description: >
              The page now scrolls to the "You have left" banner, which names the
              date you left, and your browser's Back button returns you there.
          - headline: A supply goes into a period only once it has been checked there
            components: ["Pipeline & publishing"]
            description: >
              Promoting a supply by hand used to skip every check on where it
              was filed, so a held supply, or one filed to another period,
              could go in without its checks ever running there. It is now
              refused, and so is a promotion while the supply's re-check is
              still owed. Each refusal tells you what to do instead. The
              automatic rule also now leaves a supply owed its re-check
              alone until that re-check runs.
  - date: "2026-10-12"
    summary: >
      Rebuilding the whole history takes half as long, and failing Child
      Protection checks now show their example rows where some showed none.
    changes:
      - category: Improved
        items:
          - headline: Each run checks only what it records
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              A Child Protection run used to check all six tables and keep one.
              Each run now asks dbt, Soda and datacontract-cli only for the
              checks it records, so rebuilding the history from empty takes
              about four and a half minutes rather than nine, with the same
              results. Every existing database needs rebuilding once.
          - headline: A missing check stops the run
            components: ["Pipeline & publishing"]
            description: >
              If a check a run should record comes back with no result at all,
              the run is refused and names the check, rather than the gap
              reading as a pass. Each run also records what every tool was
              asked to check.
          - headline: A decision says who it will re-check
            components: ["Pipeline & publishing"]
            description: >
              Before you confirm a promotion, demotion, substitution or
              inheritance, its warning now lists the other supplies whose
              checks read the table it moves. Each is owed a re-check by
              your decision and may turn red.
          - headline: Child Protection supplies arrive early, too
            components: ["Data generation"]
            description: >
              The synthetic history now has three Child Protection supplies
              that arrive inside their quarter's two-week early window, and
              one that arrives too early, lands in the quarter before, and is
              then moved to its own quarter by a person's decision. You can
              find them in the scenario map as TS-9 and TS-65 to TS-67.
      - category: Fixed
        items:
          - headline: Closing a check returns you to its column
            components: ["Dashboard UI"]
            description: >
              If you reached a check from a link or a pasted address,
              closing it could take you all the way back to the agency
              view, or off the dashboard in a new tab. Closing now always
              returns you to the column the check belongs to.
          - headline: Rejecting both files of a pair clears them
            components: ["Pipeline & publishing"]
            description: >
              When two files arrived for one dataset and you rejected the
              pair, both files stayed waiting in staging. Rejecting the pair
              now moves both of them out.
          - headline: Example rows no longer go missing
            components: ["QA checks & contract"]
            description: >
              Some failing Soda checks in Child Protection listed no example
              rows because another table had a check with the same name. Each
              check now shows rows from its own table.
          - headline: dbt reuses its parse as intended
            components: ["Pipeline & publishing"]
            description: >
              A dbt run could pick up a parse file left behind by an earlier
              process and then re-read the whole project. Each run now keeps
              only the parse it wrote itself.
  - date: "2026-10-11"
    summary: >
      A collection with nothing counted no longer reads green, one re-check
      never runs twice, the asset's clock can change without rewriting the
      past, and every delivery agreement lives in one file.
    changes:
      - category: Fixed
        items:
          - headline: A clean resend keeps its twins
            components: ["Data generation"]
            description: >
              A resupply in the synthetic history could drop one twin of a
              multiple birth and so fail the sibling checks though nothing
              else was wrong. Resends now only drop single births.
          - headline: Nothing counted, never green
            components: ["Dashboard UI"]
            description: >
              A collection whose every dataset is left out of its status - none
              has an agreed schedule yet - used to show green. It now reads Not
              counted, with a line saying why.
          - headline: One re-check, one run
            components: ["Pipeline & publishing"]
            description: >
              The terminal and the processing pass could both start the same
              re-check at once. Now whichever starts second says it is already
              being run elsewhere and leaves it to finish there.
      - category: Improved
        items:
          - headline: A clock that can move
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              The asset's timezone now has dated versions, so if it ever
              changes, every past due time keeps the clock it was judged
              against. A due time daylight saving would skip or repeat is
              refused.
          - headline: One file for the delivery agreement
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Calendars, which datasets are on them, and when each is due now
              live together in contract/calendar.yaml, in dated versions. The
              data contracts no longer carry delivery timing, and the old
              delivery_months key is refused with the name of its replacement.
          - headline: A due time that can change going forward
            components: ["Pipeline & publishing"]
            description: >
              Each slot now takes its due time, grace and claim window from
              the agreement in force on its own date, so changing a due time
              never re-judges a slot that was already due. A supply can be due
              a whole number of days before its period - the evening before,
              for instance.
          - headline: The agreement's past changes only on the record
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Once a date, a due time or a timezone has governed a supply, the
              configuration gate refuses any change to it that is not a declared
              correction - with a change reference, an approver and the old and
              new values - and prints the correction ready to paste. Adding next
              year's dates still needs nothing.
          - headline: The asset has a named manager
            components: ["Pipeline & publishing"]
            description: >
              The people file now lists the roles a person can hold and names
              the manager of the whole data asset, and the configuration check
              fails if there is none. A decision can be limited to that person.
          - headline: Due ahead of its period
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A dataset whose supply arrives weeks before the period it is for
              can now say so in its schedule, and the supply history heads that
              cycle with the day it is actually due.
          - headline: A verdict remembers what judged it
            components: ["Pipeline & publishing"]
            description: >
              Each early, on-time or late verdict is now kept with the due
              time, grace and claim window it was measured against. If an
              approved correction changes that, the new verdict is added
              alongside the old one, naming the correction.
          - headline: Corrections need a code owner
            components: ["GitHub workflow & people", "Pipeline & publishing"]
            description: >
              The delivery agreement's files now have named code owners, and a
              correction is refused unless its approver is one of them. Making
              GitHub require their review is a repository setting; the new
              docs/code-owner-review.md says how to turn it on.
          - headline: Excuse a late supply
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              When a supplier was late for a reason you accept, you can now
              excuse that supply with a reason, one at a time or across a range
              of periods. It still counts as late, and the dashboard shows it as
              Late (excused) with who excused it and why. An excuse can be
              withdrawn.
          - headline: A changed agreement stops the pipeline for that dataset
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              If a dataset's agreed due time, grace or dates change without a
              declared correction, its new supplies are now held and the
              dashboard shows it red with what changed and how to fix it. Every
              other dataset carries on. `mothman schedule check-agreement` says
              which datasets are affected.
          - headline: See what a calendar correction would change
            components: ["Pipeline & publishing"]
            description: >
              Before asking for a correction to be approved, `mothman schedule
              preview-correction` lists every slot whose times move, every
              verdict that would change and every supply that would land in
              another period or be held, and writes it as Markdown to attach.
              `mothman schedule draft-correction` prints the entry to declare,
              and a new Calendar menu shows each dataset's agreement.
          - headline: Confirm a calendar correction's moves at once
            components: ["Pipeline & publishing"]
            description: >
              Once a correction is merged, the data asset's manager sees every
              supply it would move, hold or re-judge, and confirms them in one
              step, keeping any that should stay where they are with a reason.
              `mothman supply corrections` lists what is waiting, and the
              filing menu offers it first. What was applied prints for the
              change reference.
          - headline: See what a correction changed, one step away
            components: ["Dashboard UI"]
            description: >
              A supply a calendar correction re-judged shows its new verdict,
              with "Late at the time - re-judged by correction CAB-1, approved
              by ..." on its history row. A supply kept against a correction
              says so and why, a dataset with a correction waiting to be
              confirmed says that too, and each confirmed correction appears
              once in Recent activity.
          - headline: Where each rule can read amber
            components: ["QA checks & contract", "Data generation"]
            description: >
              `mothman scenarios bands` lists every rule's warn and fail
              bounds in each tool and whether it can read amber at a given
              size. Every check written in SQL now names the columns it reads.
          - headline: A few unrecognised client postcodes are tolerated
            components: ["QA checks & contract"]
            description: >
              The Child Protection contract now fails on unrecognised client
              postcodes only at 3% or more, matching its Soda and dbt checks. A
              supply with just a few now reads amber rather than red.
          - headline: Amber supplies in the history read amber
            components: ["Data generation"]
            description: >
              The synthetic history's amber supplies used to read red, because
              they broke rules that allow no exceptions. Each is now built to
              land inside a rule's warning band, so more supplies are promoted
              and fewer periods are left with a gap.
          - headline: The history checks its own aim
            components: ["Data generation", "Testing & dev tooling"]
            description: >
              Generating the synthetic history now runs the real checks on each
              scenario supply built to a verdict, and stops if one reads
              differently. After a bootstrap, every supply built to a verdict is
              compared with what was recorded, and the bootstrap fails naming
              any that disagree. `--skip-target-trial` skips the first check.
          - headline: Four more scenarios to look at
            components: ["Data generation"]
            description: >
              The synthetic history now shows an amber supply held under hold
              and then promoted by a person, one promoted and awaiting
              acknowledgement, one acknowledged, and a green resend replacing
              a promoted supply. SCENARIOS.md says where to find each.
          - headline: A scenario can ask for green, amber or red
            components: ["Data generation"]
            description: >
              An injected scenario can now say what its supply should read -
              green, or amber or red on a named rule - and the generator
              builds it to that from the checks' own thresholds. One that
              cannot be built stops generation before anything is changed.
          - headline: Rebuilt history replays corrections as they happened
            components: ["Pipeline & publishing", "Data generation"]
            description: >
              A rebuilt history now files each supply against the delivery
              agreement as it stood when the supply arrived. Once both
              collections are replayed, it confirms each correction as the
              asset manager would, so none is left waiting after a rebuild.
          - headline: A blocked correction move waits rather than stops
            components: ["Pipeline & publishing"]
            description: >
              Confirming a correction no longer waits on a blocked move. The
              rest go ahead, and the blocked one waits on the outstanding list
              until what blocks it is cleared, then moves to the period you
              confirmed. Meanwhile the asset manager can keep it where it is.
          - headline: Excuse a run of periods from the menu
            components: ["Pipeline & publishing"]
            description: >
              The terminal now offers the range form of an excuse too, from the
              period you picked to one you name. A range covers current and
              rejected supplies and skips superseded ones, saying so.
          - headline: Corrections, tidied
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A correction's preview lists past slots in full and counts later
              ones, shows each time in its own zone, and gives one entry to paste
              per thing changed. A supply a correction moved now says so on its
              history row.
          - headline: Refused means frozen
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A dataset whose agreement changed without a declared correction
              now has nothing promoted or re-checked until it is explained, exits
              with its own status (3), and shows the refusal only from the
              period it affects, beside any other blocker.
          - headline: Say it once for the collection
            components: ["Pipeline & publishing"]
            description: >
              A collection can now state a due time, grace or months owed once,
              and its datasets take each value unless they say otherwise -
              `inherit` goes back to it. `mothman schedule show --on` says where
              each value came from.
  - date: "2026-10-07"
    summary: >
      A promoted supply's colour now matches the page, held supplies say how
      to unblock them, and example failing rows are stable.
    changes:
      - category: Fixed
        items:
          - headline: Promoted pill matches the page
            components: ["Dashboard UI"]
            description: >
              A promoted supply could read green in its history while the page
              above said red. Its colour now follows the page, and changes only
              when something after its arrival changes it - saying what.
          - headline: Odd file names from S3
            components: ["Pipeline & publishing"]
            description: >
              A file whose name has a space or bracket is now read correctly when
              it arrives through S3, and one unreadable file no longer stops the
              others in the same upload being recorded.
          - headline: Same data, same example rows
            components: ["QA checks & contract"]
            description: >
              A check's example failing rows were whichever rows a tool
              happened to return first. They are now the lowest keys, in key
              order, so two runs of the same data show the same rows.
      - category: Improved
        items:
          - headline: Held until dates exist
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              A supply held because its dataset's delivery dates ran out now
              says so by name, and that adding the next dates files it
              automatically - not that someone has to file or reject it.
          - headline: Checkpoints explain themselves
            components: ["Testing & dev tooling"]
            description: >
              Checkpoint and resume refuse a bad request in a sentence before
              touching anything, list the arrival numbers you can choose, and
              end a resume with one line you can paste.
          - headline: Fine print on example rows
            components: ["Dashboard UI"]
            description: >
              Under a check's example failing rows, a line says which rows
              they are - and, past the number Soda or datacontract-cli
              returns, that the tool chose them.
  - date: "2026-10-06"
    summary: >
      One command now processes whatever has arrived and finishes what is
      owed, and every route by which you keep a supply from the terminal goes
      through the same steps the pipeline does.
    changes:
      - category: New
        items:
          - headline: Replay a collection from a checkpoint
            components: ["Testing & dev tooling"]
            description: >
              mothman pipeline bootstrap --collection cp --checkpoint-before N
              keeps a copy of the database part-way through, and mothman
              pipeline resume replays from there into a database of its own.
              It works out for itself whether your change could affect an
              earlier arrival, and refuses if it could.
          - headline: One command processes what has arrived
            components: ["Pipeline & publishing"]
            description: >
              mothman pipeline process checks and gates every arrival not yet
              processed, in the order they were received, then runs what is
              owed and reconciles tickets. It asks nothing, so a scheduler can
              run it, and it never generates data.
          - headline: The gate records why it did not promote
            components: ["Pipeline & publishing"]
            description: >
              When the promotion rule leaves a supply for a person, the
              decision log now says so and why - red, a filled slot, no open
              period, could not be loaded. It changes nothing about what a
              period holds.
          - headline: A kept supply reports what happened to it
            components: ["Testing & dev tooling"]
            description: >
              After you keep a supply from the terminal you see which dataset
              each file became, the period and slot it was filed to, whether
              it was early or late, and what the rule decided. A trial says
              what recognition would make of each file.
      - category: Improved
        items:
          - headline: Rebuilding the history is much faster
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              Configuration files are now read once per run rather than
              thousands of times, using the faster C parser. A test replay of
              twelve Child Protection arrivals dropped from about three minutes
              to under two, and database connections are now reused rather than
              opened about sixty times per arrival. dbt now runs in a process of
              its own that keeps its parsed project between runs, so a full
              bootstrap from empty takes about eight and a half minutes rather
              than fifteen.
          - headline: A supply after its schedule ends says what to fix
            components: ["Pipeline & publishing"]
            description: >
              A supply that arrives after its dataset's last scheduled date is
              held as schedule-ended, naming the last period, the file to edit
              and the command that proposes dates. Once you add them, the next
              processing pass files it for you.
          - headline: The schedule-ended notice counts what is waiting
            components: ["Dashboard UI"]
            description: >
              The notice now says how many supplies are held because a
              schedule ended and when the earliest arrived, and appears from
              the day the last slot closes rather than a period early.
          - headline: A rebuilt synthetic history keeps its own dates
            components: ["Pipeline & publishing", "Data generation"]
            description: >
              Rebuilding the synthetic history now stamps every decision,
              filing, run and load with when it happened in that history, not
              with the day you rebuilt it. Anything you decide afterwards still
              carries the real time.
          - headline: A past date says what has changed it since
            components: ["Dashboard UI"]
            description: >
              Viewing what was in place on a past date, the page now lists the
              decisions made after that date that changed what it shows, naming
              the dataset, the supply and when each was made.
          - headline: A promoted supply's pill shows how it stands now
            components: ["Dashboard UI"]
            description: >
              In a supply history, a promoted supply's status pill is its
              newest result on the date on show, with the verdict it arrived
              with beside it when the two differ - so a Green pill no longer
              sits beside "Red promoted".
          - headline: Keeping a supply from the terminal follows the pipeline's own steps
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              A single table, part of a delivery or a run picked from the
              synthetic data is now filed, checked against its period and
              gated exactly as the pipeline would. A drift reference is asked
              for only when you run a trial.
          - headline: A file from the other collection is refused straight away
            components: ["Testing & dev tooling"]
            description: >
              Keeping a Birth Registrations file through the Child Protection
              command, or the reverse, is refused before anything is written,
              naming the collection it belongs to.
      - category: Fixed
        items:
          - headline: Relabelling a database needs a person
            components: ["Pipeline & publishing"]
            description: >
              Replacing the environment a database is marked as - production
              included - could be done with flags alone. It now needs someone
              at a terminal typing out what is being replaced.
          - headline: The version gate reads every image
            components: ["Testing & dev tooling"]
            description: >
              An untagged, pinned or differently named PostgreSQL image, or
              one set as a job's container, no longer slips past the check
              that CI and the dev container run the declared version.
          - headline: Keeping a supply and a processing pass no longer collide
            components: ["Pipeline & publishing"]
            description: >
              If a processing pass is already working on an arrival you keep
              from the terminal, your keep is refused and you are told why.
              Before, both ran and both failed.
          - headline: A failed step makes processing exit 2
            components: ["Pipeline & publishing"]
            description: >
              A failure anywhere in a pass - recording deliveries, owed work,
              tickets - now reads as a failure to a scheduler, not as red
              results. A file that cannot be staged now holds back only its
              own collection.
          - headline: A trial really leaves nothing behind
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              A trial's own check results and run are now removed along with
              everything else it used. Before, they stayed in the database,
              even though the terminal told you nothing was recorded.
          - headline: A kept folder tells you what it left behind
            components: ["Testing & dev tooling"]
            description: >
              Keeping a folder now lists any file no dataset recognises, so a
              renamed extract doesn't quietly go unchecked.
          - headline: Production asks for its name before deleting anything
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              Tidying left-over schemas or discarding sample data in production
              now needs you to type the environment's name, and --yes no longer
              skips it. Keeping a file by hand in production is one step now:
              typing the name is the decision to keep it.
          - headline: A file without a header is caught even when it looks like one
            components: ["QA checks & contract"]
            description: >
              A first line holding a date, a number or true/false is now
              treated as data rather than as column names, so a file missing
              its header no longer slips through by accident.
          - headline: Which database you're on is now recorded inside it
            components: ["Pipeline & publishing"]
            description: >
              A database's environment is now kept as a row in its own QA
              history, so it travels with copies of the database. A database
              marked the old way needs marking once more with mothman env mark.
          - headline: A Soda check that can't run now shows red
            components: ["QA checks & contract"]
            description: >
              If Soda can't evaluate one of its checks, that check now reads
              red with the reason, instead of quietly missing from the
              results. CI also refuses a check Soda can't parse or one that
              would need Soda Cloud.
          - headline: Production asks for its name once per keep
            components: ["Testing & dev tooling"]
            description: >
              Keeping a supply in production asked you to type its name
              twice. It now asks once, and a typo gets one more try before
              the check runs as a trial instead.
          - headline: A file refused at load is not checked and replaces nothing
            components: ["Pipeline & publishing"]
            description: >
              A file that fails a file check now records those results and
              nothing else. Before, the tools ran against last period's table
              under its name, and it set aside a real supply that was still
              waiting.
          - headline: Past dates on the dashboard no longer show today
            components: ["Dashboard UI"]
            description: >
              On an earlier date, held supplies stay in the waiting list,
              waits count to that date, and a file check's history stops at
              it. A superseded supply names its replacement by the time it
              arrived, and the "results below" line no longer sits above an
              empty page.
          - headline: An unknown collection name gets a plain answer
            components: ["Testing & dev tooling"]
            description: >
              The supply commands now name the known collections when you
              mistype one, and take bdm and cp as pipeline run does.
          - headline: Red promoted is easier to see
            components: ["Dashboard UI"]
            description: >
              A promoted supply that has since turned red now shows a short
              red pill in the dataset's header, with the reason beneath, and
              the agency and collection cards list those datasets.
          - headline: Supplies waiting for a decision are on the dashboard
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              "Waiting for a person" now includes the supplies the terminal's
              queue lists as awaiting a decision, one line per dataset, and the
              cards count the same things the list does.
          - headline: Supply history keeps each period's story to itself
            components: ["Dashboard UI"]
            description: >
              A red supply is no longer shown as resupplied by the next
              period's supply, and the history tables' columns line up from
              one period to the next.
          - headline: Jumping to a scenario says so, and Back undoes it
            components: ["Dashboard UI"]
            description: >
              Following a scenario's link shows a bar naming the scenario and
              the date you are viewing, with a way back to today, and the
              browser's Back button returns you to the date you left.
          - headline: Cross-table checks say which tables and tool
            components: ["Dashboard UI"]
            description: >
              On a collection page, each cross-table check now names the table
              it is declared on, its column and the tool that runs it.
          - headline: Red and green read clearly in dark mode
            components: ["Dashboard UI"]
            description: >
              The red and green status colours are lighter in dark mode, so
              both meet the usual contrast standard against their pills.
          - headline: A promotion past a reference gap says so
            components: ["Pipeline & publishing"]
            description: >
              When the rule promotes a supply whose only reds come from a gap
              in its reference, the recorded reason now names those checks
              instead of saying every check passed or warned.
          - headline: The terminal report shows which check, not the shared prefix
            components: ["Testing & dev tooling"]
            description: >
              The Check column now shows the column and check name, since the
              tool already has its own column.
          - headline: Files arriving in S3 go through the same steps as everything else
            components: ["Pipeline & publishing"]
            description: >
              The S3 handlers now record each arriving object as a delivery,
              with its receipt taken from storage, and then run the same
              processing pass the terminal does - filed, checked and gated in
              receipt order. Nothing is copied, and a retried event records
              nothing twice.
          - headline: A fixed file that loads is checked again
            components: ["Pipeline & publishing"]
            description: >
              When a supply that could not be loaded is reprocessed and loads,
              its checks are now owed again, and the next processing pass runs
              them as a run of their own, recording the reload as the reason.
          - headline: CI reuses the bootstrapped database
            components: ["Testing & dev tooling"]
            description: >
              When nothing that shapes the generated QA history has changed,
              CI restores the database from its cache instead of spending
              over twenty minutes rebuilding it, and its log says which it did.
          - headline: A refusal in the menu no longer ends the session
            components: ["Testing & dev tooling"]
            description: >
              If something inside a menu flow is refused, you see why and
              return to the menu, instead of being dropped out of mothman.
          - headline: Clearer messages from the terminal
            components: ["Testing & dev tooling"]
            description: >
              The progress bar counts each arrival separately, production
              explains that a change needs a terminal, and the messages no
              longer name a flag that does not exist or print quoted errors.
          - headline: Waiting items link to their dataset
            components: ["Dashboard UI"]
            description: >
              Each item in "waiting for a person" that names a dataset now
              links straight to it, and rows that lead nowhere no longer
              look clickable.
          - headline: Resetting a synthetic database keeps its identity in place
            components: ["Pipeline & publishing"]
            description: >
              A reset now empties everything except the database's identity
              record, so nothing reading it at the same moment is told the
              database is unmarked, and the date it was marked stays.

  - date: "2026-10-05"
    summary: >
      A dataset that cannot be checked - its supply held, claimed by two
      files, or impossible to load - now reads plainly red and says why,
      instead of showing last time's green.
    changes:
      - category: New
        items:
          - headline: A period holds exactly one version of each table
            components: ["Pipeline & publishing"]
            description: >
              Promoting a supply into a period that already holds one now sets
              the old one aside as superseded, in the same step, so anything
              reading the period sees one table rather than several. If a
              later period stands on the old one, you are told which and how
              to clear it.
          - headline: A decision that does more than its own period shows you first
            components: ["Pipeline & publishing", "GitHub workflow & people"]
            description: >
              Before you confirm, the terminal lists what else the decision
              changes and how to undo each. A script passes the warning's key
              with --acknowledge; on a ticket you reply a second time with
              acknowledge and the key. If anything changed in between, you are
              shown the new warning instead.
          - headline: Re-file a supply to the period it belongs to
            components: ["Pipeline & publishing", "GitHub workflow & people"]
            description: >
              From the terminal or a ticket you can now move a supply to a
              different period. It is checked again there and the normal rules
              decide whether it is promoted. The earlier filing stays on
              record, and you are shown first anything the move takes out or
              sets aside.
          - headline: The scenario map is a tab of its own
            components: ["Dashboard UI"]
            description: >
              The list of deliberately awkward supplies moved from a side
              drawer to a Scenarios tab beside Plans and Demo, with its own
              address. Each entry names the requirements it demonstrates and
              says when there is no data behind it yet.
          - headline: The sample history now plays back a person's decisions too
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              The synthetic history can now include a person's decisions,
              scripted in configuration and raised through the same decision
              path you use, such as acknowledging an amber supply or marking a
              day not supplied. They run only on a synthetic asset, as a
              dedicated actor no route but the replay can use.
          - headline: Each file is checked before any of it is loaded
            components: ["QA checks & contract", "Pipeline & publishing"]
            description: >
              Six checks now look at a file as it arrived - readable text, the
              right separator, a header row, no repeated column names, every
              row the same width, columns in the contract's order. A file that
              fails one is refused and its dataset reads red naming the check;
              columns out of order only warn. They are about the file, never
              its data, so they do not change any data check's status.
          - headline: More awkward supplies in the sample data
            components: ["Testing & dev tooling"]
            description: >
              The sample history now shows a daily file arriving a day late
              that fills the next day, while its own day is marked not
              supplied by a person. It also has a Child Protection file that
              goes ragged partway and is refused, and one whose columns arrive
              in a different order and only warns.
          - headline: Fresh re-checks now win over older results in replays
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A supply's results are now ordered by when each run's cause took
              effect on the asset's own timeline, never by when the batch
              happened to run. In a replay, older results had been outranking
              newer ones, which could show a false "red promoted".
          - headline: Every period says what each of its tables is
            components: ["Pipeline & publishing"]
            description: >
              Each period schema now has a _manifest view: one row per table,
              saying whether it was promoted, inherited or substituted, which
              supply it is, when it was received and decided, and the status it
              went in on. An analyst or tool with access to the period alone can
              read it.
          - headline: Choose whether a resend may replace accepted data
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              A new replacement setting decides whether a resupply may replace a
              promoted supply automatically: never (as shipped), when green, or
              when green or amber. The replaced supply is superseded, not lost,
              and the gate refuses green-or-amber wherever amber is held.
          - headline: Moving a table re-checks what reads it
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Promoting, rejecting, demoting or re-filing a supply now re-checks
              the cross-table checks in that period that read its table, and the
              gate looks again at every supply waiting there. One that still
              fails is listed in one prominent decision-log entry; anything left
              undone shows as owed in the queue.
          - headline: Red promoted, and every supply's outcome
            components: ["Dashboard UI"]
            description: >
              A promoted supply whose newest cross-table results are red now
              says so beside its status, with when and after what it turned and
              the status it went in on. Each supply in a dataset's history shows
              its outcome: promoted, rejected, superseded (by which, by whom), or
              waiting.
          - headline: The date control says "In place on"
            components: ["Dashboard UI"]
            description: >
              The date picker is now labelled "In place on", and the page says
              plainly that it uses everything known today; the snapshot archive
              is what shows what the page said on a past date. Old links using
              ?asof= still work and are rewritten to ?in-place-on=.
          - headline: A decision can check a supply again, as a run of its own
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Bringing back a superseded supply, or re-filing one, now runs its
              checks again while you wait, under a run of its own. The new
              verdict becomes the supply's verdict and the earlier run stays in
              its history. If the check cannot finish, it is left owed and you
              are told.
          - headline: Tables in a period carry their plain name
            components: ["Pipeline & publishing"]
            description: >
              A promoted table is now called cp_clients in its period, not
              cp_clients__ followed by an arrival key, so you query a period
              like any ordinary schema. The database itself refuses to move a
              table out from under a period's view, and a decision waiting on
              a running check tells you to retry rather than hanging.
          - headline: The dashboard tells you when the warehouse and the log disagree
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              After every check run and every decision that moves a table, the
              decision log is compared with what each period actually holds.
              A missing or stray table shows as a red notice on that dataset's
              page, naming the period and the table, and the build warns.
          - headline: A newer file waiting in a promoted period is in the queue
            components: ["Pipeline & publishing", "GitHub workflow & people"]
            description: >
              The terminal's queue and period view now list a newer version
              waiting in a period that already has one promoted, and offer to
              promote it - showing you first that the current one will be set
              aside, and both commands it takes to put it back.
          - headline: A held, contested or unloadable supply turns its dataset red
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              While a supply waits for you to place it, choose between two
              files, or deal with a file that could not be loaded, its
              dataset reads red with the reason in words - once, not on every
              check - and the red rolls up to the collection and agency. The
              date picker shows it from the day the file arrived.
          - headline: Drift checks say when they compared across a gap
            components: ["QA checks & contract", "Dashboard UI"]
            description: >
              If an earlier period you were owed has no accepted supply, the
              drift and volume checks go red and tell you which period they
              compared with instead - while still showing what the
              measurement itself found, so a gap is never mistaken for drift.
          - headline: You can accept that a closed period was not supplied
            components: ["Pipeline & publishing", "GitHub workflow & people"]
            description: >
              A period that closed with nothing in it now says so, and you can
              record - with a reason - that you accept it was not supplied.
              It leaves your to-do list but stays in the record. Runs of
              missed days or quarters show as one item, not one per period.
          - headline: The dashboard shows a period with no supply in red
            components: ["Dashboard UI"]
            description: >
              A dataset with a closed period that nothing arrived for reads
              red and says "no supply", naming the periods. Each agency card
              counts what is waiting for you in one line, by kind. Periods
              you accepted show quietly with your reason.
          - headline: A newer file replaces the older one waiting for the same period
            components: ["Pipeline & publishing"]
            description: >
              When a supplier resends a table, the earlier version nobody had
              accepted is set aside for that period - kept, not deleted - and
              only the newest waits for you or is checked against its siblings.
          - headline: You can set a supply aside, or bring a set-aside one back
            components: ["Pipeline & publishing", "GitHub workflow & people"]
            description: >
              Supersede a waiting supply to set it aside without rejecting it,
              or un-supersede one to bring it back. `mothman supply superseded`
              lists the set-aside versions and what replaced each.
          - headline: You choose what happens to an amber supply
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              One setting - hold, promote-and-acknowledge or promote - for the
              whole asset, a collection or a dataset. Under hold an amber supply
              waits for you; under promote-and-acknowledge it is promoted and you
              are asked to acknowledge it, with a reason, from the queue.
          - headline: You can reject a supply that could not be loaded
            components: ["Pipeline & publishing"]
            description: >
              A file that failed to load now appears in the terminal's queue
              of supplies waiting on you. Rejecting it settles it everywhere;
              promoting it is refused, since there is nothing to promote.
          - headline: The tool refuses a database that belongs somewhere else
            components: ["Pipeline & publishing"]
            description: >
              Every database now records which data asset and environment it
              belongs to, and every command checks that against yours before it
              does anything. A new database is marked once with mothman env
              mark, where you type the environment's name.
          - headline: The terminal always says which environment you are in
            components: ["Testing & dev tooling"]
            description: >
              The menu and every question show the environment along the
              bottom, a confirmation names it, and a command prints it on its
              first line, marked "not production" unless it is.
          - headline: One declared PostgreSQL version, checked on every connection
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              The data asset now says which PostgreSQL major it runs on. A
              server on a different one is refused, and the configuration gate
              fails if the dev container or CI would test against another.
      - category: Improved
        items:
          - headline: A gap in earlier periods no longer holds a supply back
            components: ["QA checks & contract", "Pipeline & publishing"]
            description: >
              A drift or volume check compared across a period with nothing
              accepted still reads red and says so, but it no longer stops
              the supply being promoted - only a real drift does. One supply
              left waiting no longer makes every later one wait too.
          - headline: A dataset page shows the newest supply in place or waiting
            components: ["Dashboard UI"]
            description: >
              On any date you pick, a dataset's results are the newest supply
              that is in place or still waiting for a decision, and a line
              under the heading says which. A supply that was rejected,
              demoted or set aside no longer stands in as the answer.
          - headline: An old held supply no longer hides later results
            components: ["Dashboard UI"]
            description: >
              A dataset with a supply still waiting to be placed stays red
              with the reason, but its later periods now show their own
              checked results rather than "No data".
          - headline: See which amber setting applies, and where it was set
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              Each dataset page, `mothman supply slots` and the new `mothman
              supply amber-setting` say what happens to an amber supply - for
              example "promote (set for the whole data asset, since 1 Jan
              2023)" - so a setting nobody remembers choosing can be found.
          - headline: A late file that is still expected is named
            components: ["Dashboard UI"]
            description: >
              A dataset's row now says when a file is late but its period is
              still open, beside any older period that closed with nothing in
              it, and the no-supply notice asks you to chase the supplier
              before deciding anything.
      - category: Fixed
        items:
          - headline: A period can no longer end up holding two versions of a table
            components: ["Pipeline & publishing"]
            description: >
              Two people promoting into the same period at once, rejecting a
              promoted supply, or promoting a supply with no tables could each
              leave a period with two versions or none. Each is now refused or
              handled in one step, and a pipeline rule never overrides a
              person's promotion.
          - headline: The terminal refuses before asking, and its undo steps work
            components: ["Pipeline & publishing", "GitHub workflow & people"]
            description: >
              A promotion that cannot happen is refused before you are asked to
              confirm it. The warning's undo now lists every step it takes, and
              each command prints on its own line so you can copy it whole.
          - headline: Child Protection pages say correctly what is in place
            components: ["Dashboard UI"]
            description: >
              The line saying whether a dataset's results are in place or
              waiting read "nothing is in place" for five of the six Child
              Protection datasets. Each supply is now matched to its own run.
          - headline: A past date shows each check as it was that day
            components: ["Dashboard UI"]
            description: >
              Picking an earlier date coloured each check by its newest result,
              so a check that was red that day could read green. It now shows
              the result of the run on show.
          - headline: A trial with a file that will not load no longer crashes
            components: ["Pipeline & publishing"]
            description: >
              A trial now records the checks it could not run because a file
              was missing or unreadable, and finishes, rather than stopping
              with an error.
          - headline: A slip in the asset configuration no longer crashes every command
            components: ["Testing & dev tooling"]
            description: >
              If contract/data-asset.yaml cannot be read, every mothman
              command now stops with one line naming the file, the line and
              the problem, instead of a page of Python error.
          - headline: A file after the calendar runs out is held, not filed years back
            components: ["Pipeline & publishing"]
            description: >
              The last period of a written-out calendar now closes, so a file
              arriving after it waits for you to place it rather than being
              filed into a period years earlier.
          - headline: A demote that would leave two waiting versions is refused
            components: ["Pipeline & publishing"]
            description: >
              Demoting a supply into a period where a newer version is
              already waiting now says to reject or set aside the newer one
              first, so one table never has two versions waiting.
          - headline: Bootstrapping both collections at once no longer fails at random
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              The two collections could both create the same shared table at
              the same moment, and one would crash. Shared tables and schemas
              are now created one at a time.
          - headline: Setting a supply aside yourself now takes effect everywhere
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A supply you superseded by hand was not recognised as superseded,
              so it could still be promoted and could not be brought back. It
              is now listed, refused promotion and can be un-superseded, and a
              superseded supply no longer shows on the dashboard as still waiting.
          - headline: A period emptied after it closed reads as having no supply again
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              A closed period that was filled and later emptied - say by
              undoing a substitution - stayed green on the dashboard. It now
              reads red again from the moment it was emptied.
          - headline: The dashboard's to-do panel follows the date you are viewing
            components: ["Dashboard UI"]
            description: >
              Looking at a past date no longer lists periods that had not
              closed yet. A resupply waiting for your decision is no longer
              counted as a period with no supply.
          - headline: A supply nobody could place is no longer checked anyway
            components: ["Pipeline & publishing"]
            description: >
              Held supplies were still having every check run against them and
              recorded. Now nothing runs until you decide which period they
              belong to.
          - headline: One held supply no longer stops a dataset's later supplies being checked
            components: ["Pipeline & publishing"]
            description: >
              A supply waiting for a person used to stop every later supply of
              the same dataset from being checked, and those showed as green.
              Each supply is now checked on its own terms.
          - headline: No check silently drops out of a run
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Each run now confirms that every check a tool left out is
              recorded as not evaluated. The first full run of this found two
              checks that had been vanishing, which are now checked again.
          - headline: Why a file could not be loaded is said in our own words
            components: ["Pipeline & publishing"]
            description: >
              The recorded reason no longer copies the loading library's
              message, which could quote a row of the file; it names the
              line and the problem instead.
          - headline: Hand-filing questions are no longer hidden under the progress bar
            components: ["Testing & dev tooling"]
            description: >
              When you file a supply by hand, the questions and what you type
              now show properly, a bare date is refused rather than recorded as
              midnight, and receipts that disagree about who filed a delivery
              are refused.
          - headline: A file refused on its own date shows its waiting item
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              On the date a supply could not be loaded, the dataset said it was
              waiting for a person and then that nothing was. The item now
              counts from when the file arrived, as the red does.
          - headline: The date page shows the file that really arrived last
            components: ["Dashboard UI"]
            description: >
              Two files received the same day could be shown in the wrong
              order, because their times were compared as text. They are now
              compared as times, and dated in the data asset's own timezone.
          - headline: Smaller fixes to the file checks
            components: ["QA checks & contract", "Dashboard UI"]
            description: >
              A very long legitimate field no longer refuses a file, a repeated
              name the contract does not list is counted rather than quoted, a
              refusal names the check as the page does, and a screen reader
              now hears each check's status and finding.
  - date: "2026-10-04"
    summary: >
      A check that could not run now shows on the dashboard as red and
      says why, instead of quietly disappearing.
    changes:
      - category: Fixed
        items:
          - headline: A dataset's arrival history shows when its own file landed
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              In a delivery whose files arrived a few minutes apart, `mothman
              supply history` showed every file at the time the first one
              landed, with a supply id that matched no filing. Each arrival
              now shows its own file's receipt and the id its filing carries.
          - headline: A late file is no longer filed into an older, empty period
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              Each period now closes the moment the next period starts
              accepting files, and a file goes to whichever period was open
              when we received it - never backward into an older one left
              empty. A file that arrives when none of its dataset's periods
              is open is held for you to place. The "Uncertain filing"
              marker and the separate review of off-cycle arrivals are gone,
              since neither case can happen any more.
          - headline: A check that could not run no longer vanishes
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              The 2 October release recorded why a check could not run, but
              the dashboard never showed it - the check simply dropped out
              of the run. It now appears on the check's own card in red,
              marked "not evaluated", with the reason in its detail panel,
              and its trend chart leaves a gap rather than drawing a zero
              that looked like nothing was wrong.
          - headline: Automatic promotions name the rule that made them
            components: ["Pipeline & publishing"]
            description: >
              The decision log said an automatic promotion was made by
              whoever ran the pipeline. It now names the promotion rule, so
              you can tell at a glance which decisions a person made.
          - headline: Keeping a file from the terminal offers the next decision
            components: ["Testing & dev tooling"]
            description: >
              When you keep a local file, folder or S3 supply and it is left
              waiting on a decision, the terminal now offers that decision
              straight away, as the synthetic route already did.
          - headline: Rejecting a replacement file no longer empties its quarter
            components: ["Pipeline & publishing"]
            description: >
              If a quarter was already filled and you rejected a second file
              sent for it, the quarter read as empty and the queue asked for
              a resupply. It now keeps showing the supply that fills it. The
              same applied when an off-cycle resupply was held back.
          - headline: Two checks with the same name are no longer drawn as one
            components: ["Dashboard UI"]
            description: >
              On a table other datasets check against, two of their checks
              that shared a name were merged into a single card, so one
              dataset's results were shown under the other's check. Each
              now has its own card and its own link.
          - headline: Database passwords stay out of error messages
            components: ["Pipeline & publishing"]
            description: >
              A connection error only hid the password when the connection
              string was written as a web-style address. It now hides it
              however the string is written, and shows nothing of one it
              cannot read.
      - category: Improved
        items:
          - headline: A supply filed by hand says who filed it and when it really arrived
            components: ["Pipeline & publishing", "Dashboard UI", "Testing & dev tooling"]
            description: >
              Keeping a supply you received by hand now asks when it was
              originally received - the email's arrival, or each S3 object's
              own time, offered for you to confirm - and records your answer
              beside our receipt without ever using it to file or judge the
              supply. Every delivery also records whether a person filed it,
              how and who, shown in `mothman supply deliveries` and on the
              dashboard. Scripts pass `--originally-received`.
          - headline: Starting the synthetic history from empty is one deliberate command
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              `mothman env reset-synthetic` deletes the whole synthetic QA
              history after you type a phrase naming what goes, and refuses
              for any asset not declared synthetic. `pipeline run` and
              `bootstrap --force` now refuse to run over existing history
              instead of quietly adding to it, delivery records are kept for
              good, and `pipeline regenerate-history` is gone.
          - headline: Overlapping delivery periods are caught before anything arrives
            components: ["Pipeline & publishing"]
            description: >
              The configuration check now fails if any dataset's claim window
              for one period would open before the previous period stops
              being on time, so a file can never belong to two periods at once.
          - headline: Requirements can be retired, and filtered by status
            components: ["Docs & process", "Dashboard UI"]
            description: >
              A requirement a later one replaces now stays in the
              Requirements panel marked "Retired", saying when, who decided
              and what replaced it - a single criterion can be retired the
              same way. The panel also gains a filter, so you can show only
              what is built, in progress, not started or retired.

  - date: "2026-10-02"
    summary: >
      Every file is now checked the moment it lands, only the supply that
      turned up unexpectedly waits for you, and a file sent early is
      credited to the right quarter.
    changes:
      - category: Fixed
        items:
          - headline: A missing table is not a failure
            components: ["QA checks & contract", "Pipeline & publishing"]
            description: >
              When a check needs a table that is not available, it no longer
              fails - or takes every other check in the run down with it. It
              now says which table it was waiting for and why: not due yet
              (no data, not red), overdue, or sent but awaiting your
              decision. The last two stay red, because each needs someone to
              act, and each says plainly that the data itself did not fail.
          - headline: An early file counts for the quarter it was sent for
            components: ["Pipeline & publishing"]
            description: >
              Suppliers may send a quarterly file up to a fortnight before
              it is due. Until now one that arrived in that fortnight was
              counted against the PREVIOUS quarter and recorded as about
              three months late. It is now credited to the quarter it was
              sent for, and reads as early. No existing supply changes -
              none has ever arrived that far ahead.
      - category: Improved
        items:
          - headline: Each file is checked as it lands
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Nothing waits for a delivery to be complete any more. Each file
              is checked on arrival against the rest of its quarter - whatever
              else has arrived, or what you have already accepted - and its
              results are recorded once, against its own table.
          - headline: Files arrive on their own time
            components: ["Data generation", "Pipeline & publishing"]
            description: >
              Each file now carries the moment it reached us, not one
              time for its whole delivery. Most synthetic deliveries still
              land at once, as if unzipped together; some trickle in over a
              few minutes, in a different order each time.
          - headline: An early table no longer holds up the rest
            components: ["Pipeline & publishing"]
            description: >
              A dataset that only delivers twice a year sometimes arrives in
              a quarter it is not due in. That supply is still checked and
              still comes to you for a decision, but the five tables that
              arrived alongside it are promoted normally. Across the whole
              synthetic history that is 45 supplies you no longer have to
              wave through.
          - headline: The reason says what actually happened
            components: ["Pipeline & publishing"]
            description: >
              The queue used to tell you a delivery's tables were "filed to
              more than one period", which left you working out which one
              was odd. It now names the dataset, the quarter it arrived in
              and the quarter it was filed to.
          - headline: Late means late, measured from when we received it
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              Whether a supply was early, on time or late was worked out
              from a timestamp inside the supplier's own file - so in
              effect the supplier decided whether they were late. It is now
              measured from when the file reached us, against the quarter
              it was filed to. Twenty-five Child Protection supplies that
              read as on time are now correctly late; one of them arrived
              eleven days after its deadline.
          - headline: Every resupply shows its own verdict
            components: ["Dashboard UI"]
            description: >
              Only the first attempt in a chain used to show early, on time
              or late - the rest were left blank, because the old
              calculation could not say anything meaningful about them. Each
              attempt now carries its own.
          - headline: Decisions are dated when they were taken
            components: ["Pipeline & publishing"]
            description: >
              Every promotion in the synthetic history was stamped with the
              moment the history was generated, so all four years of
              decisions appeared to happen at once. They now carry the date
              they would really have been taken, which is what makes asking
              "what did we hold back in June" possible at all.
          - headline: See how long a supply has been waiting on you
            components: ["Dashboard UI"]
            description: >
              The dataset page and the supply-history panel now show the
              time between a supply reaching us and somebody promoting it.
              Where nobody has yet, it reads as still waiting rather than
              as nothing at all.
  - date: "2026-09-30"
    summary: >
      A supply nothing could place now waits for you until you deal with
      it, instead of disappearing when the run that found it ended.
    changes:
      - category: Fixed
        items:
          - headline: Held supplies stop vanishing
            components: ["Pipeline & publishing"]
            description: >
              When nothing can work out which period a supply belongs to,
              it now stays on your list until you decide about it. It used
              to be mentioned once in a run's output and then forgotten.
          - headline: Both kinds of hold, one list
            components: ["Pipeline & publishing"]
            description: >
              A supply held because two files claim the same dataset and one
              held because no period fits now appear together, each saying
              what you can do about it. The second kind was invisible before.
      - category: New
        items:
          - headline: Catch-up drops wait for you
            components: ["Pipeline & publishing"]
            description: >
              When one delivery's tables belong to two different quarters,
              everything in it is still checked but nothing is promoted
              automatically - it comes to you with its results in hand
              instead of being filed and found later.
      - category: Improved
        items:
          - headline: A hold knows how it ended
            components: ["Pipeline & publishing"]
            description: >
              Once you promote, reject or re-file a held supply, its entry
              closes and keeps a pointer to the decision that closed it - so
              you can see later why it stopped asking for your attention.
  - date: "2026-09-29"
    summary: >
      You can now decide what goes into a period from the terminal, and
      see what every period already resolves to.
    changes:
      - category: New
        items:
          - headline: Decide a period from the terminal
            components: ["Testing & dev tooling"]
            description: >
              A new Filing decisions menu shows the supplies waiting on
              somebody, and lets you promote or reject one, or say a
              period stands on an earlier one. Every choice is recorded
              with your name and your reason.
          - headline: Your queue, without running anything first
            components: ["Testing & dev tooling"]
            description: >
              Run mothman supply queue to see what is waiting, and
              mothman supply slots to see where every period stands.
              Both read the same live record the tickets do, so the
              terminal and a ticket can no longer disagree.
          - headline: The run you just did offers its own next step
            components: ["Testing & dev tooling"]
            description: >
              Finish a check and, if that supply is now waiting on a
              decision, you are offered it there rather than having to
              go and find it.
      - category: Improved
        items:
          - headline: Only people we know can file
            components: ["Testing & dev tooling"]
            description: >
              A filing decision is accepted only from somebody named in
              the project's own people list, and refused with a reason
              from anybody else. Every decision needs a reason and an
              explicit yes before it is written.
          - headline: A fresher demo
            components: ["Dashboard UI"]
            description: >
              The Demo tab's recording was showing a question the tool
              stopped asking. It has been re-recorded against the real
              wizard as it is today.

  - date: "2026-09-28"
    summary: >
      Supplies that pass their checks now file themselves into the period
      they were sent for, and looking at an earlier date follows the
      delivery dates you actually agreed.
    changes:
      - category: Improved
        items:
          - headline: A dashboard now tells you when it is not the real one
            components: ["Dashboard UI"]
            description: >
              A dashboard built anywhere other than the published
              environment now says so on the page, in words rather than
              just a colour, so a screenshot of development results can
              never be mistaken for production's. One that does not know
              where it was built says that too, instead of staying quiet.
          - headline: As-of viewing now follows your real delivery dates
            components: ["Dashboard UI"]
            description: >
              Pick a past date and the dashboard works out which delivery
              period it falls in from the calendar you agreed, not from a
              guess about how quarters usually run. It gets the February,
              May, August and November cycle right.
          - headline: The as-of panel tells you which period you are looking at
            components: ["Dashboard UI"]
            description: >
              Choose a date and the panel names the period it lands in on
              each of your calendars. The same day is its own day on a daily
              feed and the middle of a quarter on a quarterly one.
          - headline: You can no longer pick a date the dashboard cannot answer for
            components: ["Dashboard UI"]
            description: >
              The date box now stops at the earliest and latest periods it
              has. If an old link carries a date outside them, the page says
              so, names the range it covers and offers one click back.
      - category: Fixed
        items:
          - headline: A repaired link no longer breaks itself
            components: ["Dashboard UI"]
            description: >
              Opening an old link to a column that no longer exists tidies the
              address so you can share it again. With a date set, that tidy-up
              used to leave a link nobody could open. It does not now.
          - headline: Daily periods are named in words again
            components: ["Dashboard UI"]
            description: >
              Items about a daily feed's missing days named the day as a bare
              code. They now name it in words, the way every other date on the
              page is written.
      - category: New
        items:
          - headline: A ticket says something new or says nothing
            components: ["Pipeline & publishing"]
            description: >
              Tickets no longer repeat themselves run after run. Each one's
              description is kept up to date with where its supply has got to,
              so a thread quiet for a month still tells you, and comments mark
              only what actually changed.
          - headline: Each expected supply can have its own ticket
            components: ["Pipeline & publishing"]
            description: >
              A ticket per expected supply, kept up to date with where that
              supply has got to, and silent when nothing has changed. By
              default only supplies that want somebody get one; set
              ticket_policy to all for every one.
          - headline: Decide it on the ticket, in your own words
            components: ["Pipeline & publishing"]
            description: >
              A line starting with a slash on a supply's ticket now records the
              decision, with everything you wrote around it as the reason. A
              comment with no such line is left alone, and a decision that
              cannot be taken is answered on the thread.
          - headline: One set of filing decisions, whoever makes them
            components: ["Pipeline & publishing"]
            description: >
              Promote, reject, demote, substitute and the rest now go through
              one place, so the terminal and a ticket cannot end up offering
              different things or disagreeing about what is allowed. Repeating
              a decision already made says so instead of failing.
          - headline: Only real people can file a decision
            components: ["Pipeline & publishing"]
            description: >
              Filing decisions are now checked against the people list, so a
              stand-in entry can be shown on a page without being able to act,
              and a real colleague added without a GitHub username fails the
              build instead of finding out later.
          - headline: You can take an inherited quarter back out
            components: ["Pipeline & publishing"]
            description: >
              A quarter standing on an earlier supply can now be stood up or
              taken back down one dataset at a time, with your reason on the
              record - which is what frees a withdrawal those quarters were
              holding up.
          - headline: A blocked withdrawal now tells you how to unblock it
            components: ["Pipeline & publishing"]
            description: >
              Refusing to move a supply, the system names each quarter standing
              on it AND which action clears that one - de-substitute where a
              person chose it, un-inherit where the schedule did.
          - headline: Every Child Protection table watches its own size
            components: ["QA checks & contract"]
            description: >
              Each of the six tables now has a check on how much it grew or
              shrank against the last supply you promoted, with a warn level
              and a fail level. A table that has doubled over three years is no
              longer judged against a fixed floor.
          - headline: Drift is measured against what you actually promoted
            components: ["QA checks & contract"]
            description: >
              Distribution and row-count checks now compare each supply with
              the last one you promoted, however many periods back that was -
              never with the start of history, and never with a file somebody
              rejected.
          - headline: A check with nothing to compare says so
            components: ["QA checks & contract"]
            description: >
              A dataset's first supply has nothing behind it, so its drift and
              volume checks now read as having no reference instead of quietly
              passing. Nothing is promoted on the strength of a comparison that
              never happened.
          - headline: Whose results are these, and a way back
            components: ["Dashboard UI"]
            description: >
              A period showing an earlier one's data now says the checks on
              the page belong to that earlier period, and offers one click
              through to it. You are told you have left, and given a way
              back, on a link that survives being shared.
          - headline: A period standing in on an earlier one says so
            components: ["Dashboard UI"]
            description: >
              Where a period shows data from an earlier one, its status now
              carries a label naming where the data came from - and saying
              whether a person decided it or the schedule did, with their
              reason as written.
          - headline: You can see what is live, not just what arrived
            components: ["Dashboard UI"]
            description: >
              Where a dataset's newest file is not the one in the warehouse, its
              page now shows both and says why the new one is not live yet. When
              they are the same, nothing extra appears.
          - headline: A dataset that is not due stops reading as missing
            components: ["Pipeline & publishing"]
            description: >
              An annual dataset now fills each quarter it is not due in with
              the supply that is still current, so a query for this quarter
              answers instead of finding nothing. Where there is nothing
              earlier to stand on, the queue says so.
          - headline: A period nobody supplied can stand on an earlier one
            components: ["Pipeline & publishing"]
            description: >
              When a supplier confirms a quarter's extract is not coming, you
              can point that period at an earlier one you choose, with your
              reason on the record. Queries answer instead of returning an
              empty table.
          - headline: Good supplies now file themselves away
            components: ["Pipeline & publishing"]
            description: >
              A supply whose checks all pass or warn now moves itself into the
              period it was sent for. A red one, or one arriving where a supply
              already sits, waits for you and says which it is.
          - headline: Deliveries are handled oldest first
            components: ["Pipeline & publishing"]
            description: >
              Each delivery is now checked before the next one starts, so it
              sees the periods the earlier ones filled. Five years of quarterly
              extracts land in five years of quarters instead of piling into
              the first.
          - headline: There is now one record of who decided what happened to a supply
            components: ["Pipeline & publishing"]
            description: >
              Promoting, rejecting, demoting or re-filing a supply is written
              down as it happens, with who decided it and why. Nothing can
              change or remove an entry afterwards - a change of mind is a new
              one. See it with mothman supply decisions.
          - headline: A decision and what it does to the data are now one step
            components: ["Pipeline & publishing"]
            description: >
              The record and the change land together or not at all, so the log
              can never say a supply was promoted when the promotion failed.
              Two people cannot both be told yes for the same delivery period.
          - headline: Rejecting a supply or using a bad one now asks you why
            components: ["Pipeline & publishing"]
            description: >
              A rejection, using a supply whose checks came back red, or
              replacing one already in use all need a reason. A routine
              promotion does not - reasons you are made to give for everything
              stop meaning anything.
      - category: New
        items:
          - headline: Three of the awkward supply shapes are now in the real data
            components: ["Data generation"]
            description: >
              The forward cascade, the supplier outage and the renamed resupply
              are generated rather than living only in a test. You can watch a
              third file land after a day is already filled, two days with no
              supply at all, and a catch-up drop whose renamed files are left
              on the floor.
          - headline: You can now run checks before a schedule is agreed
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Sample data for a dataset nobody has agreed a schedule for is held
              apart from your real supplies, and the checks run over it normally.
              You see whether each one passes, which is the whole point of
              developing it.
          - headline: Check development stays out of your quality history
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              Results from a dataset with no agreed schedule are recorded as
              in-development. They show on that dataset's own page with their real
              verdicts, and count towards nothing above it.
          - headline: A new dataset can be checked against an established one
            components: ["QA checks & contract"]
            description: >
              A check that compares two tables works even when only one of them has
              an agreed schedule. Its verdict belongs to the new dataset, so a
              dataset still in development can never turn a live one red.
          - headline: Sample data goes when you say it goes
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              Run mothman supply discard-sample to remove the data you were
              developing checks against. Nothing removes it for you - not agreeing a
              schedule, not any later run - and the record of that work stays.
      - category: Improved
        items:
          - headline: A dataset with no schedule cannot colour the others
            components: ["Dashboard UI"]
            description: >
              A dataset you have not agreed a schedule for keeps its own real red,
              amber or green, and every summary above it leaves it out. One
              collection's unfinished work no longer changes the asset's headline.
          - headline: The tile says which kind of no-schedule it is
            components: ["Dashboard UI"]
            description: >
              "No delivery schedule agreed yet" is somebody's outstanding job. A
              one-off extraction says so instead, because presenting a finished
              decision as an open one puts a permanent item on your list.
          - headline: A supply no longer waits for the rest of its delivery
            components: ["Pipeline & publishing"]
            description: >
              Every file that arrives is checked on its own, against the newest
              version of the other tables it needs. Nothing has to work out when
              a multi-file delivery has finished, so nothing can sit waiting for
              a file that never comes.
          - headline: Every arrival now records which clock timed it
            components: ["Pipeline & publishing"]
            description: >
              An arrival is timed by when our own storage took the file, or by
              our clock where storage does not say - and the record tells you
              which. It is never taken from the file itself, which a supplier
              controls.
          - headline: A check run by automation now says which automation
            components: ["Pipeline & publishing"]
            description: >
              A run from a scheduled workflow is credited to that workflow by
              name rather than needing a person's details, so the activity feed
              stops implying somebody was at a keyboard.
      - category: Fixed
        items:
          - headline: Which period each supply counts for is recorded in the warehouse
            components: ["Pipeline & publishing"]
            description: >
              That record was going to be written into the repository the day
              this gets switched on. It now goes where everything else does, so
              nothing starts filling the repository with day-to-day state.
          - headline: The requirements register agrees with itself again
            components: ["Docs & process", "Pipeline & publishing"]
            description: >
              Around twenty requirements still described quality results as
              files in the repository and the dashboard as something GitHub
              builds. Each now says what the system actually does, and says
              what it used to say, so nothing reads as two conflicting rules.
          - headline: A dataset can exist before its delivery schedule is agreed
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              You can add a dataset, say plainly that no schedule has been
              agreed for it yet, and it will not be reported as owing anything.
              A one-off extraction for a project says so differently, because it
              is never going to gain one.
          - headline: Saying nothing about a schedule is still an error
            components: ["Pipeline & publishing"]
            description: >
              Declaring that a dataset has no calendar is now allowed; leaving
              the calendar out by accident, or mistyping its name, still fails
              the configuration check. A dataset that silently expects nothing
              never reports a missing delivery.
          - headline: A retired design cannot quietly come back
            components: ["Testing & dev tooling", "Docs & process"]
            description: >
              A new check fails the build if anything starts describing quality
              results as files again. A tidy-up only stays tidy if something
              watches it, and this is what watches.
          - headline: The test suite stopped leaving deliveries behind
            components: ["Testing & dev tooling"]
            description: >
              One test was filing a real delivery every time it ran, and twenty-six
              had built up. They were being counted as arrivals, which made one
              measurement of what actually arrived wrong. Nothing can do it again.
          - headline: The dashboard's read-only account really is read-only now
            components: ["Pipeline & publishing"]
            description: >
              It could still reach one part of the warehouse it was never meant
              to, because of how database-wide permissions work. It is now
              limited to the quality records and nothing else.
  - date: "2026-09-27"
    summary: >
      The warehouse is now PostgreSQL, and every QA tool checks what was
      loaded into it rather than the file that arrived.
    changes:
      - category: Improved
        items:
          - headline: Your QA history lives in the warehouse now, not in the repository
            components: ["Pipeline & publishing", "QA checks & contract"]
            description: >
              Every check result, every tool's own raw output and every run's
              own record are stored alongside the data they describe. You no
              longer commit anything to keep a run, and the history is the
              same history whoever is looking at it.
          - headline: Keeping a run, or not, is now something you decide before it runs
            components: ["Testing & dev tooling", "Pipeline & publishing"]
            description: >
              The wizard asks whether to record a check before it starts
              rather than offering to promote the results afterwards. Say no
              and it runs as a trial, which leaves nothing behind.
          - headline: The dashboard is no longer built by GitHub
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              Building it needs the QA history, and that is somewhere GitHub
              cannot reach. The checks that only read configuration still run
              there on every push, so a bad contract or a stale index is
              still caught before anything else happens.
      - category: New
        items:
          - headline: A file you were emailed can now become a real arrival
            components: ["Pipeline & publishing"]
            description: >
              Check a supply you downloaded or were sent, and you are asked
              whether to keep it. Keeping files it as a delivery received
              now, so the arrival history and the dashboard show it the same
              way they show anything that arrived on its own.
          - headline: Or run a trial, which leaves nothing behind
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              Say no and you get a trial: the same four tools against the
              same rows, with the same verdicts, and not a trace of it
              anywhere afterwards. Experimenting with a file costs nothing.
              Pass --commit or --trial to answer without being asked.
      - category: Improved
        items:
          - headline: A run now cleans up after itself on disk
            components: ["Pipeline & publishing"]
            description: >
              Each run already gave back the database schemas it borrowed;
              it now gives back dbt's working directory too. That had been
              quietly accumulating - nearly two gigabytes of it in this
              checkout - because nothing ever removed it.
          - headline: Open the project in a container and it just works
            components: ["Testing & dev tooling"]
            description: >
              A development container now brings up a PostgreSQL on the
              same version the build server uses, waits for it, and
              installs everything the tests need. Evaluating the project
              no longer starts with a list of commands to run by hand.
          - headline: Run names you can actually read
            components: ["Pipeline & publishing"]
            description: >
              A kept supply is numbered like every other arrival, and a
              trial is named for the moment you ran it. The long names built
              out of your own filename, which repeated the dataset name and
              the date back at you, are gone.
          - headline: One database, and it is the one production runs
            components: ["Pipeline & publishing"]
            description: >
              Staging, rejected supplies, each period and each run's views
              now live in PostgreSQL instead of a DuckDB file. Every
              property this design leans on is exercised by the engine a
              real deployment would use, rather than read from
              documentation and hoped for.
          - headline: DuckDB now reads what arrives, and nothing else
            components: ["Pipeline & publishing"]
            description: >
              It still reads the CSV or Parquet a supplier sends and works
              out what is in it, which is the job it is best at. The rows
              then stream into PostgreSQL. It is never a warehouse.
          - headline: Drift is measured against the warehouse too
            components: ["QA checks & contract"]
            description: >
              The last check still reading the supplier's file now reads
              what was loaded, like the other three. It compares against
              the distribution recorded when the reference supply was
              checked, so it keeps working however old that supply gets.
          - headline: datacontract-cli checks the warehouse, not the file
            components: ["QA checks & contract"]
            description: >
              It used to read the supplier's CSV directly, which made it
              the one tool answering a different question from the other
              three - they checked what had been loaded, it checked what
              had been sent. Two tools could disagree about a dataset and
              both be right. They now look at the same thing.
      - category: Fixed
        items:
          - headline: A failed check no longer leaves a connection behind either
            components: ["QA checks & contract"]
            description: >
              Four places closed their database connection only when
              everything went right, so a check that errored leaked one
              and could block the next run's tidy-up. They now close
              whatever happens.
          - headline: Nothing to export before you run anything
            components: ["Testing & dev tooling"]
            description: >
              Put your database details in a `.env` file once and every
              command and the tests pick them up. Anything already set
              in your shell still wins. `.env.example` lists what goes
              in it.
          - headline: Soda no longer leaves a connection behind after every scan
            components: ["QA checks & contract"]
            description: >
              Each scan quietly left one database connection open, still
              inside a transaction, holding the tables it had just read.
              After forty of them a run could no longer tidy up after
              itself and gave up waiting. Scans now close what they
              opened.
          - headline: A load can no longer wait forever for a lock
            components: ["Pipeline & publishing"]
            description: >
              If something does hold a table open, a load now gives up
              after thirty seconds and tells you what it was waiting for,
              rather than hanging with nothing in the log to say why.
          - headline: A scan can no longer move your database
            components: ["QA checks & contract"]
            description: >
              Running Soda quietly reloaded your `.env` over everything
              you had already set, so a run told to use one database
              carried on against another. Whatever you set when you
              started a command now stays set.
          - headline: The test suite stays in its own database
            components: ["Testing & dev tooling"]
            description: >
              A side effect of the above had tests drifting onto the real
              warehouse partway through a run, so they failed differently
              every time and left tables behind. Each one now stays where
              it was put.
          - headline: A dbt build that failed no longer looks like one that worked
            components: ["QA checks & contract"]
            description: >
              If dbt could not run, the previous run's results were still
              on disk and got reported as this run's - a pass you could
              not tell from a real one. A build that did not happen now
              stops the run and tells you what dbt said.
          - headline: Each run cleans up after itself
            components: ["Pipeline & publishing"]
            description: >
              A run's temporary schemas used to be swept up at the very
              end, all at once, which could pull the floor out from
              under a check you started separately. Each run now
              discards its own the moment it finishes.
          - headline: One copy of a supply, not three
            components: ["Pipeline & publishing"]
            description: >
              A supply used to be written to disk two or three times -
              as a delivery, as a flat copy beside it, and for Child
              Protection again by staging. It now exists where it
              arrived and in the database, and nowhere else.
          - headline: A file you hand it is checked where it is
            components: ["Pipeline & publishing"]
            description: >
              Checking a single file used to copy it into a working
              directory first, along with the reference you compared
              it against. Both are now read from wherever you point
              at, and the reference is loaded like any other supply.
          - headline: Shorter names for an ad-hoc check
            components: ["Pipeline & publishing"]
            description: >
              Checking a file you point at built a name from the whole
              filename plus the time, which for an ordinary delivery
              repeated the dataset name and carried two dates. It now
              keeps the recognisable start and the time.
          - headline: Drift will not answer from a stale file
            components: ["QA checks & contract"]
            description: >
              If the warehouse cannot give the drift check the rows it
              needs, it now says so. It used to quietly read a copy off
              disk instead and hand you a number that looked fine.
          - headline: Two checks of the same files no longer collide
            components: ["Pipeline & publishing"]
            description: >
              Checking two folders in one go could have the second
              quietly demolish what the first had loaded, because the
              two runs were treated as the same arrival. They are two
              arrivals now.
      - category: New
        items:
          - headline: mothman supply tidy
            components: ["Testing & dev tooling"]
            description: >
              Clears temporary schemas an interrupted run left behind.
              It shows you what it found and asks before dropping
              anything, because it cannot tell a leftover from a run
              somebody else has going right now.
      - category: New
        items:
          - headline: You need a PostgreSQL to run this
            components: ["Testing & dev tooling"]
            description: >
              There is no database file in the repository to open any
              more, so setting this up means pointing it at a real
              server. The README says how, including one trap worth
              knowing: the database needs a password even locally.
      - category: New
        items:
          - headline: The dashboard will say which environment built it
            components: ["Pipeline & publishing"]
            description: >
              Environments are now declared in one place, and a checkout
              says which one it is. Groundwork for building the
              dashboard where the data lives, so a development build can
              never be mistaken for the published one. `mothman env
              list` shows them.
          - headline: One command to set up a fresh checkout
            components: ["Testing & dev tooling"]
            description: >
              `mothman pipeline bootstrap` generates the synthetic data
              and runs every check over it, so a new clone has something
              to look at. Run it as often as you like - if there is
              already data there it says so and stops. It is on the
              mothman menu too.
          - headline: A new session sets itself up
            components: ["Testing & dev tooling"]
            description: >
              Starting a session now starts the database, creates its
              login if missing, installs what the tests need, and tells
              you whether the warehouse has anything in it. Previously
              you found all of that out from failing tests.
      - category: Improved
        items:
          - headline: The browser tests stopped waiting around
            components: ["Testing & dev tooling"]
            description: >
              They used to pause half a second after every page load on
              the off chance it had finished rendering. They now wait
              for the page to say it has, which takes a quarter off the
              time the checks need and removes a source of flakiness.
          - headline: Schema names you can actually read
            components: ["Pipeline & publishing"]
            description: >
              A quarter's schema is now `period_2026_q3` rather than
              `period_2026_2d_51_33`, and a run's is `qa_run_run_001`.
              What you see in the database is what you would have
              guessed.
          - headline: Two periods can no longer share one schema by accident
            components: ["QA checks & contract"]
            description: >
              A calendar naming both "2026-Q3" and "2026_Q3" is now
              refused, naming both, when you validate the schedule.
              Previously they were two periods whose promoted data would
              have quietly ended up together.
  - date: "2026-09-26"
    summary: >
      Birth Registrations no longer looks like it missed three and a half
      years of deliveries, and a late supply is filed to the day it was
      actually for.
    changes:
      - category: Fixed
        items:
          - headline: 1,333 deliveries that were never owed
            components: ["Pipeline & publishing"]
            description: >
              The daily delivery calendar was set to start in January 2023,
              years before Birth Registrations first supplied anything, so
              every day in between counted as a delivery that never arrived.
              It now starts when the feed does.
          - headline: Both tables now count
            components: ["QA checks & contract"]
            description: >
              A check comparing two tables used to count against whichever
              one it happened to be written under, so the other could read
              green while a check about it was failing. It now appears on
              both, and counts against both.
          - headline: Late supplies land right
            components: ["Pipeline & publishing"]
            description: >
              Because those empty days counted as still waiting to be filled,
              a supply arriving late was filed against the oldest of them
              rather than the day it was for - in one case three and a half
              years earlier.
          - headline: Two checks wearing one name
            components: ["Dashboard UI"]
            description: >
              Where two checks of the same tool sat side by side, the second
              borrowed the first's name and opened the first's details. Both
              now show their own, so a row about carers no longer reads as a
              row about clients.
          - headline: Sprints count themselves
            components: ["Docs & process"]
            description: >
              The delivery plan works out each sprint's status from how many of
              its requirements are actually finished, instead of someone typing
              it in. Eleven of twenty-five had drifted out of date.
          - headline: No rule is not a pass
            components: ["Dashboard UI"]
            description: >
              A section with no quality rule defined showed a green tick, which
              read as "checked and fine" rather than "nothing checked". It now
              says so plainly instead.
      - category: Improved
        items:
          - headline: What is waiting on what
            components: ["Docs & process"]
            description: >
              The Plans tab now shows which delivery sprints are held up by
              which, and by how many unfinished criteria. One sprint turns
              out to be holding up seventeen across seven others.
          - headline: One folder per table
            components: ["Pipeline & publishing"]
            description: >
              Every QA result is now filed under the table it describes, so
              finding one table's history is opening a folder rather than
              sifting a shared file. The whole history was rebuilt this way.
          - headline: Cross-table checks have a home
            components: ["Dashboard UI"]
            description: >
              Checks about the relationship between two tables now have a
              section of their own on the collection page, and appear on
              every table they read rather than only the one they were
              written under.
  - date: "2026-09-25"
    summary: >
      Every date and time now reads the same way, supplies are kept in
      one warehouse rather than thrown away, and everything waiting for a
      person is gathered into one list with a count.
    changes:
      - category: Fixed
        items:
          - headline: Three Child Protection datasets open properly again
            components: ["Dashboard UI"]
            description: >
              Opening Client Register, Carer Register or Case Workers
              left out the supply history and did not update the address
              bar, so the link you copied went back to the agency. Both
              are fixed, and the checks that caused it can now be linked
              to like any other.
          - headline: The overview counts what is actually there
            components: ["Dashboard UI"]
            description: >
              The green figure on the front page was worked out by
              subtracting the red and amber ones from the total, so an
              agency with no data, or whose schedule had ended, was
              counted as healthy. Every figure is now counted in its own
              right, and the two quiet states appear in the key with
              their own totals whenever they are real.
          - headline: A trend line no longer ends in red when there is no current reading
            components: ["Dashboard UI"]
            description: >
              Looking at a date where a dataset has history but nothing
              recent, the card drew its full trend ending in a red dot —
              often the only red on screen — directly under a pill
              saying there is no data. The history still shows; the dot
              marking "where it stands now" goes grey, because at that
              date nobody can say. A related fix means a status the
              dashboard does not recognise is drawn grey rather than
              green.
          - headline: Adding a collection no longer means remembering a second file
            components: ["QA checks & contract"]
            description: >
              The check that keeps data contracts and the agency tree in
              step worked from a hand-written list of contract files, so
              adding a collection meant editing two places — and
              forgetting the second one meant the new contract was never
              checked at all, silently. The list is now worked out from
              the tree itself, and a contract file nothing points at is
              reported rather than ignored.
          - headline: A finished requirement can now admit what it did not finish
            components: ["Docs & process"]
            description: >
              The requirements register could only say "built" or "not
              started", so one marked built while six of its criteria
              were not built at all read as complete, with the gap
              recorded in a notes field nobody had to open. A
              requirement can now list the criteria it does not meet,
              each saying why and who picks it up next, and the
              Requirements panel shows them above everything else.
          - headline: Quiet status pills no longer disappear under the cursor
            components: ["Dashboard UI"]
            description: >
              Pointing at a dataset row made its own "No data" or
              "Schedule ended" pill vanish — the row highlight and the
              pill were painted in exactly the same colour. The pill now
              keeps its shape under the cursor, and reads slightly more
              clearly there than it does at rest.
          - headline: Priority and status stopped sharing a colour
            components: ["Dashboard UI"]
            description: >
              A requirement marked "Must" was drawn in the same red as a
              failing dataset, so one screen could show red verdicts on
              one side and red priorities on the other. Priorities now
              have their own scale.
          - headline: Small fixes for narrow screens and long lines
            components: ["Dashboard UI"]
            description: >
              Header buttons and breadcrumbs are now big enough to press
              on a phone, a command shown in a notice no longer splits
              into what looks like two commands, "Tier 2" stops wrapping
              onto two lines, and the footer and the front-page notice
              no longer run the full width of a wide monitor.
          - headline: Everything you can navigate to is a real link
            components: ["Dashboard UI"]
            description: >
              Breadcrumbs, agency cards and dataset names were buttons
              pretending to be links, so middle-click, Ctrl-click,
              open-in-new-tab and copy-link-address all did nothing on
              them. They are real links now, and the page gets out of
              the way when you ask the browser to handle one. Buttons
              that perform an action rather than going somewhere — the
              date picker, dark mode, the side panels — stay buttons.
          - headline: A dataset whose schedule has ended still shows its history
            components: ["Dashboard UI"]
            description: >
              Opening one replaced the whole page with a notice saying no
              more supplies are expected, hiding eighteen runs of real
              results behind it. The notice stays at the top, and
              everything you came for is underneath it, labelled as the
              last known state rather than a current reading.
          - headline: A column with no quality rule now says so instead of showing green
            components: ["Dashboard UI", "QA checks & contract"]
            description: >
              Eleven columns across the Child Protection datasets have no
              automated rule defined. Each showed a green tick, with the
              explanation buried four clicks away in the check panel — so
              a column nobody checks looked exactly like one that had
              passed, and in three cases turned a whole table-level
              section green on its own. They now read "No rule defined"
              in a disabled grey at every level. It is not a verdict: it
              neither drags a dataset down nor lifts it up.
          - headline: The dashboard warns you before a delivery calendar runs out
            components: ["Dashboard UI", "Pipeline & publishing"]
            description: >
              The warning that a calendar is nearly out of dates was
              computed and only ever shown in the build log, so the one
              place people actually look never carried it. It now
              appears on the front page, names the dataset that runs out
              first, and says plainly that nothing has failed. It steps
              aside once a calendar has actually run out, where the
              existing notice takes over.
          - headline: A link to a column that no longer exists says so
            components: ["Dashboard UI"]
            description: >
              Opening an old bookmark for a column that had since been
              renamed or dropped left you on the dataset page with no
              explanation and the dead link still in the address bar, so
              sharing it passed the problem on. You now get a short note
              saying what is missing, the address bar is tidied up, and
              the rest of the page still shows what you came for.
          - headline: A sentence in the page footer reads properly again
            components: ["Dashboard UI"]
            description: >
              Removing the illustrative datasets left two sentences run
              together with no full stop between them, on every page.
          - headline: "`schedule show` answers \"what's next?\" without a date dump"
            components: ["Testing & dev tooling"]
            description: >
              Asking for a daily dataset's schedule either crashed, or
              printed over a thousand rows once you worked out that it
              wanted an end date. It now shows the last few periods and
              the next few, marks the next supply owed, and says how
              many it left out. Use --all for the full list.
          - headline: Wrong input to a schedule command reads like an error, not a crash
            components: ["Testing & dev tooling"]
            description: >
              A mistyped dataset name, or a malformed date, ended in
              thirty lines of Python traceback - while the command next
              to it answered the same mistake in a tidy box. Both now
              do. The dataset and calendar options also list their real
              values in --help, so there is less to guess at.
          - headline: The runway warning names the dataset its number belongs to
            components: ["Pipeline & publishing"]
            description: >
              It said a calendar had two supplies left and gave the
              calendar's last date, which belonged to a different
              dataset - so counting the dates in the file gave you a
              different answer with no way to reconcile them. It now
              names the dataset that runs out first and that dataset's
              own last period.
          - headline: "`mothman check` can say \"passed, with a warning\""
            components: ["Testing & dev tooling"]
            description: >
              A gate could only pass or fail, so the low-runway warning
              printed eight gates above a summary that said "Every gate
              passed". There is now a fourth outcome that reports the
              warning without failing anything.
          - headline: Suggesting next year's delivery dates cannot leave a gap
            components: ["Testing & dev tooling"]
            description: >
              The command the runway warning points you at would
              propose a year already in the file, a year in the past, or
              a year with unauthored ones before it - which is the empty
              schedule the build check exists to prevent. It now
              proposes only the year next in line, and --yaml gives you
              the block to paste.
          - headline: Configuration errors are easier to act on
            components: ["Testing & dev tooling"]
            description: >
              One mistyped duration produced two errors saying different
              things about the same value, and the generated advice was
              "Add it." or "Correct the value." Each mistake is now
              reported once, with the shape and an example of what
              belongs there, and the count of affected datasets includes
              those broken by a calendar rather than only those named
              directly.
          - headline: Changing a delivery calendar no longer moves old claim windows
            components: ["Pipeline & publishing"]
            description: >
              How early a supply may be filed against a slot was read
              from whichever version of the calendar is current, and
              applied to every slot including ones years old. Shortening
              the window today would have quietly moved when past
              supplies became claimable. Each slot now uses the window
              that was in force on its own date. A window set on an
              individual dataset is unaffected - it has no versions to
              move between.
          - headline: An unrecognised collection is now an error, not an empty day
            components: ["Pipeline & publishing"]
            description: >
              Asking for the arrivals of a collection that does not
              exist returned nothing at all, which looks exactly like a
              collection that has had no deliveries. Renaming one would
              have given you a pipeline that processed nothing and said
              nothing was wrong. It now stops and tells you which
              collections there are.
          - headline: Lower-case month names are accepted where they always worked
            components: ["Pipeline & publishing"]
            description: >
              Writing "february" instead of "February" in a delivery
              calendar was refused by the build check with "which is not
              a month", even though the pipeline itself read it
              perfectly. The check now asks the pipeline how it reads a
              month rather than keeping its own second opinion.
          - headline: Every commit in a push is now checked for quiet edits
            components: ["Pipeline & publishing"]
            description: >
              Two guards exist to stop a past delivery date, or a
              check's definition, being changed after the fact - and
              both only ever looked at the last commit of a push. A
              change made one commit earlier went unseen. They now read
              the whole push. Two related holes closed with it: editing
              an existing calendar note no longer licenses moving a
              past date (only a new note does), and "in the past" is
              now decided on the asset's own clock rather than the
              build machine's, which sits on a different calendar day
              for about a third of every day.
          - headline: An empty delivery calendar no longer calls itself "low"
            components: ["Pipeline & publishing"]
            description: >
              A calendar with no future dates left was described in the
              same words as one merely running short. It now says it is
              exhausted, and says plainly that nothing is failing the
              build yet.
      - category: Improved
        items:
          - headline: Nobody picks between two files for you
            components: ["Pipeline & publishing"]
            description: >
              If one delivery carries two files that are both the same
              table, that table is held for you rather than the pipeline
              picking one. Both are kept, everything else in the
              delivery carries on, and you decide.
          - headline: A permanent record of what arrived
            components: ["Pipeline & publishing"]
            description: >
              Every delivery now leaves a record of what was in it and
              what each file was taken to be, written once and kept.
              Including the files nothing recognised, so a supplier
              quietly renaming an extract shows up rather than passing.
          - headline: One slow upload no longer stops everything
            components: ["Pipeline & publishing"]
            description: >
              A delivery still being uploaded used to halt the whole
              run. It is now left alone and picked up once complete, and
              you can see what is still arriving and which files have
              landed so far.
          - headline: Adding a dataset stops being a code change
            components: ["Pipeline & publishing"]
            description: >
              Each dataset now says for itself how its files are named,
              in one line of configuration. If two datasets ever claim
              the same file, it is held for you rather than filed
              against a guess.
          - headline: One warehouse instead of hundreds
            components: ["Pipeline & publishing"]
            description: >
              Every supply used to be loaded into its own database file,
              thrown away once the checks had run. They now go into one
              warehouse that keeps them, and each run records which
              version of each table it read.
          - headline: A tied count no longer shuffles
            components: ["Dashboard UI"]
            description: >
              Where several values were invalid the same number of
              times, the list could come back in a different order each
              rebuild, and one could drop off the bottom. Now it is
              always the same list.
          - headline: Dates read like dates
            components: ["Dashboard UI", "Testing & dev tooling"]
            description: >
              Every date and time, on the dashboard and in the command
              line, now reads one way - "2:15pm Friday, 29 September
              2026" - on Perth time. No raw timestamps left, and no UTC
              to convert.
          - headline: When this page was built
            components: ["Dashboard UI"]
            description: >
              The "Live - updated 4s ago" counter beside the title was
              measuring how long your browser tab had been open, not how
              fresh the data was. It now says when the page was built.
          - headline: The top tier is called Agencies
            components: ["Dashboard UI"]
            description: >
              The landing view was labelled "Executive", which said who
              it was for rather than what was on it. It is now
              "Agencies" - the plural matters, because the tier below it
              is one agency. Nothing you have bookmarked changes.
          - headline: You can reach the whole dashboard from the keyboard
            components: ["Dashboard UI"]
            description: >
              The dataset list on an agency page could not be reached
              without a mouse, so keyboard navigation stopped one level
              above the data. Those rows now take focus and open on
              Enter, every control has a visible focus outline, and
              focus no longer disappears into panels that are closed.
          - headline: The page says which view you are on
            components: ["Dashboard UI"]
            description: >
              Every view used to share one browser-tab title, so history
              and bookmarks could not tell them apart. The title now
              names the view, and moving between views announces itself
              and moves the cursor there.
          - headline: One calendar typo now reads as one calendar typo
            components: ["Pipeline & publishing"]
            description: >
              Mistyping a calendar's name used to produce an identical
              error for every dataset on it, each suggesting you edit
              that dataset - and offering the misspelling itself as a
              valid choice. The check now says once, above the detail,
              how many datasets name the missing calendar and which
              defined calendar nobody is using, and it only suggests
              calendars something already uses.
          - headline: A calendar mistake is caught before you push
            components: ["Testing & dev tooling"]
            description: >
              Editing the delivery calendars now runs the schedule check
              as you commit, rather than waiting for the build. It takes
              about a second and reads no data.
          - headline: "--collection, because that is what it takes"
            components: ["Testing & dev tooling"]
            description: >
              `mothman pipeline run` and the `debug` runners took
              `--dataset bdm` or `--dataset cp`, which name collections
              rather than datasets - and `--dataset` means a real
              dataset elsewhere in the same tool. They now take
              `--collection`. Commands that genuinely take a dataset are
              unchanged.
          - headline: A file is loaded or it is not
            components: ["Pipeline & publishing"]
            description: >
              Every supply now carries a record saying it finished
              loading, and a check can only read one that has it. If a
              load is cut short, nothing is left behind for a check to
              mistake for a short delivery.
          - headline: Stage what arrived, ask questions later
            components: ["Pipeline & publishing"]
            description: >
              `mothman supply load` puts every delivery into the
              warehouse on the strength of having arrived - no period,
              no slot, nothing it cannot know yet. Each supply is kept
              under its own arrival time, so a resupply never writes
              over the one before it.
          - headline: The ones that would not load
            components: ["Pipeline & publishing"]
            description: >
              A file that cannot be read no longer stops the rest of its
              delivery. `mothman supply failures` lists what failed and
              why, and waits for you - reject the supply, or fix the
              cause and load it again.
          - headline: Arrival order, not whatever the folder said
            components: ["Pipeline & publishing"]
            description: >
              Two files that landed in the same batch are now processed
              in the order they actually arrived. Where two share an
              arrival time, the order they were received in settles it -
              previously the supplier's own file naming did, which meant
              the same two files could be filed differently.
          - headline: An interrupted run picks up where it stopped
            components: ["Pipeline & publishing"]
            description: >
              A run that stops partway now leaves everything it did not
              finish for the next one, in the same order, rather than
              only looking at whatever arrived most recently.
          - headline: Every table gets its own timeline
            components: ["Pipeline & publishing"]
            description: >
              `mothman supply history --dataset <name>` shows when that
              one table arrived, on its own. A file resent for it no
              longer disappears into a delivery of five other tables
              that did not change, and those five gain nothing from
              sharing the drop.
          - headline: A file that would not load still counts as arriving
            components: ["Pipeline & publishing"]
            description: >
              A supply that could not be read is still the latest thing
              that arrived for that table, so a supplier sending
              something broken shows up rather than leaving yesterday
              on screen as though nothing happened.
          - headline: A punctual supplier stops reading as a late one
            components: ["Pipeline & publishing"]
            description: >
              Working out which period a supply is for now treats
              arriving on time as evidence of which period it belongs
              to. Without that, a supplier whose system went down for
              two days had every later delivery recorded two days late,
              for good.
          - headline: A delivery that never came stays missing
            components: ["Pipeline & publishing"]
            description: >
              A period nobody delivered for can no longer be quietly
              filled by a later day's resupply. It stays on the record
              as an obligation that was not met, so a service failure
              cannot turn into a met one.
          - headline: Saying it does not know
            components: ["Pipeline & publishing"]
            description: >
              Where the pipeline genuinely cannot tell which period a
              supply is for, it now says so and waits for you, naming
              every period it considered and why each was ruled out -
              rather than putting the file somewhere plausible.
          - headline: Everything waiting, in one list
            components: ["Dashboard UI"]
            description: >
              Held supplies, failed loads, files nothing could place and
              uncertain filings now appear together with one count, on
              the overview and on every agency and dataset they affect.
              On a quiet day it says nothing is waiting.
          - headline: Warnings are not verdicts
            components: ["Dashboard UI"]
            description: >
              Anything waiting for a person is marked as needing action,
              a warning or information, in its own wording and never in
              the red, amber and green a failing check uses - so an odd
              filename cannot read as a dataset in trouble.
          - headline: One period at a time
            components: ["Pipeline & publishing"]
            description: >
              Checks will read a single period's data with the delivery
              under test laid over it, so a comparison between two tables
              is always within one period. A delivery covering two periods
              is checked once for each.
          - headline: Checks that cannot run
            components: ["Pipeline & publishing"]
            description: >
              Where a table a check needs never arrived, the check now
              reads red and names it, instead of quietly reading nothing.
              A brand-new dataset with no earlier period to compare
              against still reads as having no data, not as a failure.
          - headline: Checks name what they read
            components: ["QA checks & contract"]
            description: >
              A check that compares two tables now records which version
              of the other table it read, so a failing referential check
              tells you what it was failing against rather than leaving
              you to work it out.
          - headline: No half-finished runs
            components: ["Pipeline & publishing"]
            description: >
              If a tool fails partway through a run, the error now names
              the collection, the tool and the run, and the run is no
              longer counted as a completed one just because some of its
              results were written.
          - headline: Tables on their own schedules
            components: ["Dashboard UI"]
            description: >
              Where the tables in one collection arrive at different
              times, each now shows its own history, and picking a date
              shows each one as at its own most recent arrival rather
              than the collection's.
          - headline: A map of the breakages
            components: ["Testing & dev tooling"]
            description: >
              A committed list now says which awkward supplies in the
              sample data are there on purpose, what each is meant to
              show and where to look at it - so a red supply reads as a
              demonstration rather than as something nobody fixed.
          - headline: Scenarios, on the page
            components: ["Dashboard UI"]
            description: >
              A new Scenarios panel lists the deliberate breakages and
              what each is meant to show. Once one is in the data, picking
              it will set the date and open the page it happened on.

  - date: "2026-09-24"
    summary: >
      Child Protection investigations are now checked for dates that run
      backwards, and two quiet states on the dashboard are easier to read.
    changes:
      - category: Fixed
        items:
          - headline: A guess now looks like a guess
            components: ["Pipeline & publishing"]
            description: >
              Where the pipeline had to choose between a late delivery
              and an early one, it now says the filing was a guess
              instead of presenting it as settled, and flags it for
              someone to check while it is still cheap to correct.
          - headline: Late for which period, exactly
            components: ["Pipeline & publishing"]
            description: >
              Early, on time and late are now worked out against the
              period a supply was actually filed to. A quarterly file
              arriving a week ahead used to read as about twelve weeks
              late for a quarter that closed months earlier.
          - headline: Fix the filing, fix the verdict
            components: ["Pipeline & publishing"]
            description: >
              A supply that only looked late because it was filed to
              the wrong period stops looking late once somebody moves
              it to the right one. When it arrived does not change -
              only which period it counts towards.
          - headline: Agency cards line up again
            components: ["Dashboard UI"]
            description: >
              The summary row at the foot of each agency card now sits at
              the same height on every card, whatever the length of the
              agency's name. A card with a short name used to leave a gap
              below its figures that read as though something was missing.
          - headline: Older activity now says how long ago, not just when
            components: ["Dashboard UI"]
            description: >
              Recent activity gave up after a month and showed a bare
              date instead. It now keeps counting in weeks, months and
              years, so you can tell at a glance how long ago something
              was QA'd without working it out.
          - headline: The schedule check no longer contradicts its own warning
            components: ["Pipeline & publishing"]
            description: >
              When a delivery calendar had run out of dates, the check
              said every dataset was expecting a supply immediately above
              a warning that six of them could not be processed. It now
              reports what it actually checked - that the configuration
              itself is sound - and leaves the warning to speak for
              itself.
          - headline: One ended schedule is no longer announced twice
            components: ["Dashboard UI"]
            description: >
              An agency or collection with a single ended schedule used
              to show "Schedule ended" and "1 schedule ended" side by
              side. The count now appears only when it is adding
              something - and it still appears for a single one whenever
              the status beside it says anything else, so nothing gets
              hidden.
          - headline: The "No data" tag has an outline you can actually see
            components: ["Dashboard UI"]
            description: >
              The dashed outline that tells "No data" apart from "Schedule
              ended" was too faint to make out, so at a glance the two
              looked alike. It is now as clear as the label inside it, and
              it no longer disappears when you hover the row.
      - category: New
        items:
          - headline: An investigation cannot end before it began
            components: ["QA checks & contract"]
            description: >
              Child Protection investigations are now checked for a
              closing date earlier than the date they opened. An
              investigation still open is left alone, and one opened and
              closed on the same day passes.

  - date: "2026-09-23"
    summary: >
      Supplies are now recognised from what actually arrived, delivery
      calendars are written down and warn you before they run out, and
      the names behind everything come from one place.
    changes:
      - category: Improved
        items:
          - headline: Checks name their collection
            components: ["QA checks & contract"]
            description: >
              A check's identifier now carries its collection, so you can
              see where a check sits from its name alone. It no longer
              carries a database table name that only ever made sense to
              one of the four tools.
          - headline: One place for agencies and collections
            components: ["QA checks & contract", "Pipeline & publishing"]
            description: >
              Agency, collection and dataset names were written down in
              twelve places that could quietly disagree, and several
              had. Change one now and the whole tool follows, including
              the dashboard.
          - headline: Delivery dates are written down
            components: ["Pipeline & publishing"]
            description: >
              The dates a supplier agreed to deliver on are now recorded
              as dates, not worked out from a rule each time. A dataset
              says which calendar it is on and which months it takes
              part in, and can say a period has no supply coming, with a
              reason.
          - headline: Every dataset on the page is real
            components: ["Dashboard UI"]
            description: >
              The invented agencies and datasets that filled out the
              overview are gone. Everything you see is now backed by a
              real pipeline run, and more real datasets are coming to
              take their place.
          - headline: A supply knows its period
            components: ["Data generation"]
            description: >
              Every supply now records which period it is for and when
              it actually turned up, as two separate things. A late
              resupply belongs to the quarter it was meant for, not the
              one it arrived in.
          - headline: Next year's dates, suggested
            components: ["Testing & dev tooling"]
            description: >
              `mothman schedule candidate-dates` proposes next year's
              delivery dates for you to check, edit and commit, and
              flags any that land on a weekend rather than quietly
              moving them. Nothing is judged against its suggestions.
          - headline: Supplies arrive, rather than announce themselves
            components: ["Data generation", "Pipeline & publishing"]
            description: >
              The tool used to be handed a list of what had been sent.
              It now works out what arrived by looking at what actually
              landed - which files, in which drop, and when we received
              them - so nothing a supplier could write decides how a
              supply is filed.
          - headline: Ready for an awkward drop
            components: ["Data generation"]
            description: >
              The tool can now take in the drops that cause real
              trouble - a covering note nobody asked for, an extract
              split across two files, a resupply of only the tables
              that were wrong. They are not in the demo data yet; the
              handling that reads them is.
          - headline: Typos fail the build
            components: ["Pipeline & publishing", "Testing & dev tooling"]
            description: >
              A mistake in a delivery calendar - a misspelt month, a
              calendar that does not exist, a month with no date - now
              stops the build and tells you what to change. It used to
              leave that dataset quietly expecting nothing, which looks
              exactly like a dataset with nothing wrong.
          - headline: Each table has its own deadline
            components: ["Pipeline & publishing"]
            description: >
              A collection's tables each get their own expected supply,
              with their own due time and their own allowance for being
              late. One table arriving late now shows as one late
              table, instead of dragging its punctual siblings down
              with it.
          - headline: See when a supply is due
            components: ["Testing & dev tooling"]
            description: >
              `mothman schedule show --dataset <name>` now lists, for
              every period, when that dataset's supply is due and the
              moment it can first be filed against - so you can check a
              calendar edit did what you meant before committing it.
          - headline: Last year's dates stay put
            components: ["Pipeline & publishing"]
            description: >
              Changing a delivery date that has already passed would
              silently rewrite whether past supplies were on time. You
              can still correct one, but you now have to say what you
              changed and why.
          - headline: Told before dates run out
            components: ["Pipeline & publishing", "Dashboard UI"]
            description: >
              A calendar with only a few delivery dates left now says
              so, on the dashboard and every time you run the checks.
              It counts deliveries rather than months, because three
              months of a quarterly calendar is one delivery.
          - headline: A calendar that ended says so
            components: ["Dashboard UI"]
            description: >
              When a dataset's dates run out it now reads as its own
              thing, not as red and not as quiet - naming the last
              period it covered and the file to edit. It says so at
              every level, so one ended calendar among thirty healthy
              datasets cannot go unnoticed.
          - headline: One answer, two places
            components: ["QA checks & contract", "Dashboard UI"]
            description: >
              The status you see on the page and the status behind your
              tickets are now held to one shared list of agreed cases,
              so the two cannot quietly disagree about the same check.
      - category: Fixed
        items:
          - headline: An unknown result is no longer green
            components: ["QA checks & contract", "Dashboard UI"]
            description: >
              A result neither side recognised used to read as healthy,
              in both the dashboard and the ticketing. It now stops
              things and says what it found, because not knowing what a
              result means is not the same as it being fine.
          - headline: A retired check that was not
            components: ["Dashboard UI"]
            description: >
              A check whose retirement date was left blank was dropped
              from the dashboard's totals while still counting
              everywhere else, so a live check could vanish from the
              status you were reading.
          - headline: Old links no longer break the page
            components: ["Dashboard UI"]
            description: >
              A bookmark pointing at a dataset that has since been
              renamed or removed used to open a blank page with no
              explanation. It now tells you what the link is looking
              for and offers a way back.
          - headline: Regenerating no longer doubles the history
            components: ["Data generation"]
            description: >
              Rebuilding the demo data on a different day used to leave
              two complete copies of the history side by side rather
              than replacing it. It now overwrites itself, and rebuilds
              identically whatever day you run it.
          - headline: Six datasets, one deadline
            components: ["Pipeline & publishing"]
            description: >
              Child Protection's six datasets all shared whichever
              delivery time the first one declared, because the
              per-dataset setting was being read and thrown away. Each
              can now have its own.
          - headline: Yesterday's date, all morning
            components: ["Dashboard UI"]
            description: >
              Open the dashboard before 8am in Perth and it defaulted to
              yesterday, because it worked out the date in UTC. It now
              uses the asset's own timezone, so everyone sees the same
              day wherever they are.
          - headline: Timestamps say their timezone
            components: ["Pipeline & publishing"]
            description: >
              Arrival times were stored with no timezone on them, so a
              supply that landed at 10pm could be read as the next
              afternoon. Every stored time now carries its offset, and
              anything missing one is rejected rather than guessed at.
          - headline: Contracts said the wrong thing
            components: ["QA checks & contract"]
            description: >
              Both data contracts named an agency or collection that no
              longer existed anywhere else. They are corrected, and a
              new check stops them drifting again.
          - headline: Birth Registrations found its collection
            components: ["Pipeline & publishing"]
            description: >
              Birth Registrations results were filed without a
              collection while Child Protection's had one. They now
              match, so the two read the same way everywhere.
          - headline: Two drops, one folder
            components: ["Data generation"]
            description: >
              Two unrelated deliveries that happened to pick the same
              name were quietly merged into one folder, losing the
              contents of the first. A drop now refuses to write over
              one that is already there.

  - date: "2026-09-20"
    summary: >
      Checks now sit against the column they actually check, and the
      tool's own records became something you can verify.
    changes:
      - category: Improved
        items:
          - headline: Checks know where they belong
            components: ["QA checks & contract"]
            description: >
              Every check now sits against the column it actually
              checks, so a rule about a carer's identifier appears under
              that identifier rather than off to one side under the
              table. Three cross-table rules moved too.
          - headline: Five checks, one name
            components: ["QA checks & contract", "Dashboard UI"]
            description: >
              Five Birth Registrations checks all displayed under one
              name, impossible to tell apart. They now read as what they
              are - "Registered on or after birth", "Multiple-birth
              sibling match", and so on.
          - headline: Safe to reword
            components: ["QA checks & contract"]
            description: >
              A check's name and column used to be read out of the
              explanation beneath it, so improving the wording could
              quietly move the check. No longer.
          - headline: One command to check everything
            components: ["Testing & dev tooling"]
            description: >
              One command now runs ruff, yamllint, the dashboard's
              JavaScript tests and the Python suite, so there's no
              working out which checks a given change needs. Anything
              that couldn't run says so rather than passing quietly.
          - headline: The explanations have rules now
            components: ["QA checks & contract", "Docs & process"]
            description: >
              The plain-English explanations on checks are now written
              to one agreed standard rather than to whoever happened to
              write them, so they read consistently across every check
              and dataset as new ones arrive.
          - headline: No check ships unexplained
            components: ["QA checks & contract"]
            description: >
              A check that arrives without a plain-English explanation
              now fails the build rather than quietly appearing with
              nothing to read. Retired checks are held to it too.
          - headline: Checks say what they are
            components: ["Dashboard UI"]
            description: >
              Check headings read "Invalid values" and "Registered on or
              after birth" now, instead of "Invalid values —
              dbt:accepted_values (dbt-core)". Which tool ran it is
              still there, in the line underneath.
          - headline: The missing thirteen
            components: ["Dashboard UI"]
            description: >
              Thirteen checks were running but had nowhere to appear, so
              you never saw them. Row-count and freshness checks now sit
              under the supply they check, alongside the columns.
          - headline: Two checks wearing one name
            components: ["Dashboard UI", "QA checks & contract"]
            description: >
              Two different checks on the date of birth were sharing one
              tile, so the numbers you saw under one of them sometimes
              belonged to the other. They are now separate.
          - headline: Every check explains itself
            components: ["QA checks & contract", "Dashboard UI"]
            description: >
              All 257 checks now say in plain English what they look
              for, and the ones with a known cause say what a failure
              usually means. No jargon, no tool names, no thresholds
              you have to decode.
      - category: Fixed
        items:
          - headline: Five decisions that quietly disappeared
            components: ["Docs & process"]
            description: >
              Part of the record explaining why things were built the
              way they were had been silently dropped. It is back, and
              cannot be lost that way again.
          - headline: Filed under the wrong heading
            components: ["QA checks & contract", "Dashboard UI"]
            description: >
              The date-of-birth plausibility check was grouped with the
              ones that verify records point at each other correctly. It
              now sits where it belongs.
      - category: New
        items:
          - headline: Paperwork, properly checked
            components: ["Docs & process", "Testing & dev tooling"]
            description: >
              The rules about what a requirement or a release note must
              contain are now written down as a specification rather
              than scattered through code. A misspelt field name is an
              error, not something quietly ignored.
          - headline: What's New, written for you
            components: ["Docs & process", "Dashboard UI"]
            description: >
              This page used to be a build log - fifteen lines an entry,
              full of file names and percentages. It is now a short
              account of what changed and what you can do with it.
          - headline: Four things we'd already built
            components: ["Docs & process", "Dashboard UI"]
            description: >
              Readable web addresses, the Plans tab, the leaderboard and
              the accept-or-reject decision on an amber supply were all
              listed as not started, months after they shipped. They now
              read as built.
          - headline: Every requirement shows its working
            components: ["Docs & process"]
            description: >
              For everything the tool promises, the Requirements panel
              now shows where it lives in the code, what proves it
              works, the measured result, and what was decided. Nothing
              is marked finished without all four.
          - headline: Checks read like sentences
            components: ["Dashboard UI"]
            description: >
              A check now leads with what it checks in plain English,
              with the explanation right underneath and a short tool
              reference below that. You no longer have to open a check
              to find out what it looks for.
          - headline: Check cards are real links
            components: ["Dashboard UI"]
            description: >
              Middle-click a check to open it in a new tab, or copy its
              link address, the way you would anywhere else. Every check
              has had its own web address for a while; now you can
              actually get at it.
          - headline: Supply checks get their own place
            components: ["Dashboard UI"]
            description: >
              Whether the right amount of recent data turned up now has
              its own section at the top of a dataset, instead of
              hiding at the end of the column list. Its checks read
              without a click.
          - headline: Tickets say what is wrong
            components: ["GitHub workflow & people", "QA checks & contract"]
            description: >
              A QA ticket now lists what is actually failing, in plain
              English, with a link to each check. You can act on it
              without opening the dashboard first, and every run adds
              the current list.
          - headline: Nothing gets built unagreed
            components: ["Docs & process"]
            description: >
              Every requirement now carries who agreed it and when, next
              to its status in the Requirements panel. Work cannot move
              past "not started" without one, so nothing gets built on
              an assumption.
