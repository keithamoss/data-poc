name: Deploy dashboard to GitHub Pages

# Publishes dashboard/qa-reporting-dashboard.html (already self-contained -
# its data is baked in at commit time by dashboard/embed_dashboard_data.py,
# not fetched live) as index.html on GitHub Pages. No build step beyond the
# rename: as more datasets get wired into the dashboard, this workflow
# doesn't need to change - it just republishes whatever's in dashboard/ at
# deploy time. See plans/wider.md action 5.

on:
  push:
    branches: [claude/new-session-en9qen]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard/qa-reporting-dashboard.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
