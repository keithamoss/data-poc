name: Build, validate, and publish the dashboard

# Phase 3 of plans/publishing-and-history.md's Thread A ("CI-gated
# publishing") - this workflow IS the only path from a committed QA run
# to the published site now, per Keith's own explicit call ("gone
# entirely - CI is the only path", no manual local-publish path in any
# form). It used to just republish an already-built dashboard/
# qa-reporting-dashboard.html that a human built and committed locally
# (see git history for that version) - it now does the real build
# itself, from committed history alone, and gates the result before
# anything reaches Pages.
#
# What "the real build" means: dashboard/embed_dashboard_data.py reads
# dashboard/qa-reporting-dashboard.template.html (the real, committed
# UI source - hand-authored HTML/CSS/JS, with three placeholder consts:
# REAL_BIRTH_REG_DATA/REAL_CP_DATA/SNAPSHOT_MANIFEST) and writes
# dashboard/qa-reporting-dashboard.html (no `.template` - gitignored,
# never committed) with real data embedded, fresh on every run. This
# WAS one file (Keith's explicit call, 2026-09-16: keep hand-authored
# UI and embedded data together rather than split into a template/
# build-output pair) - but as of the same day, this job stopped
# committing the rebuilt consts back to git at all (a second decision,
# later the same day - see "Why this job no longer commits anything"
# below), which made the one-file design's own justification (avoiding
# restructuring churn, since CI was going to commit the data-only diff
# back either way) moot. Keith reconsidered once that changed, same
# day: the template + gitignored build output split, after all - see
# plans/publishing-and-history.md's Phase 3 section ("Reconsidered and
# built") for the full account, including why this also let a
# pre-commit hook that had briefly existed to guard the one-file design
# get removed as redundant. The rebuild happens in the job's own
# working tree, feeds straight into the Pages artifact a few steps
# down, and is discarded when the job ends - the committed template has
# no real data in it at all, by design, not "stale" the way the old
# one-file design's committed copy was. That's a deliberate trade, not
# an oversight -
# see below.
#
# Why this job no longer commits anything (2026-09-16, same day as the
# rule below): the original design had this job commit the data-only
# diff back to the branch after a successful build (`[skip ci]`-tagged),
# so "what was published" stayed git-diffable. In practice that step
# raced against human pushes to the same branch - CI's bot commit and a
# person's own push could each land between the other's fetch and push,
# producing real non-fast-forward rejections (hit twice for real, both
# resolved by fetch+rebase). Keith asked whether Pages' modern Actions-
# based deployment (actions/deploy-pages) could work without a shared
# branch at all - researched for real (not assumed): deploy-pages is
# already artifact-based and branch-independent; the race was entirely
# the fault of this job's own separate commit-back step, not deploy-
# pages itself. Two branch-independent fixes were on the table: (a) commit
# the rebuilt data to a dedicated output branch instead of the shared dev
# branch, or (b) stop committing the rebuilt data anywhere and let each
# Pages deployment's own history (tied to the exact commit SHA it was
# built from) be the record of what was published when. Keith's call,
# after walking through exactly what's lost either way: **option
# (b)** - the underlying source of truth (qa_results/, Thread B) stays
# fully committed and untouched regardless; only the pre-rendered,
# git-diffable copy of "what the dashboard showed at time T" goes away,
# in exchange for removing the race entirely. "What was published when"
# is now a rebuild-from-qa_results/ exercise (deterministic, same
# pipeline this job itself runs) or a look at Pages' own deployment
# history, not a `git log -p` on this file. dashboard/snapshots/*.html.gz
# (plans/dashboard.md #5) is unaffected either way - a separate, deliberate
# point-in-time archive mechanism, not sourced from this decision at all.
#
# This job touches ONLY committed files - no data of any kind, real or
# (in this PoC) synthetic-standing-in-for-real. Keith's hard rule, same
# day: "CI never touches production data" - full stop, not even this
# project's own fake stand-in for it, because the point is a pipeline
# that would actually be safe to point at a real deployment, not one
# that happens to be harmless today only because today's data isn't
# real. pipeline/build_dashboard_data.py's/build_cp_dashboard_data.py's
# own direct DuckDB queries (the sex/concern_type value-count charts,
# arrival-lag stats) used to need a live warehouse - moved to qa_tools/
# bdm/dataset_stats.py + qa_tools/cp/dataset_stats.py, computed once by
# orchestrate_bdm.py/orchestrate_cp.py (the one place with a legitimate
# connection already open) and committed to qa_results/ alongside each
# run's check results. No real dbt-core/Soda Core/datacontract-cli/
# Evidently run happens here either - qa_tools.*.build_results_from_
# history reads back each tool's already-resolved `verified` records
# straight from committed qa_results/ (Phase 2), so this is fast and
# needs none of those four tools actually installed... except
# `uv sync --dev` installs them anyway (pyproject.toml has no lighter
# dependency group to sync instead) - a known, accepted inefficiency,
# not a correctness problem.
#
# The gate (structural + check-lifecycle + requirements + real-browser
# render) runs BEFORE the deploy steps - broken output never reaches
# Pages. "Old" for the check-lifecycle diff is the immediately-previous
# commit on this branch (Keith's call, 2026-09-16 - see qa_tools/common/
# validate_check_lifecycle.py's own docstring for why), which is why this
# checks out 2 commits of history, not 1. The requirements gate (item
# 75, qa_tools/common/validate_requirements.py) has no old-vs-new diff
# of its own - it only ever validates requirements.yaml against the
# CURRENT working tree's test files.
#
# Also still decompresses every dashboard/snapshots/*.html.gz into
# _site/snapshots/*.html at deploy time - plans/dashboard.md #5's "time
# travel" picker - via dashboard/snapshot_dashboard.py --prepare-site,
# the same code local developers run (sync_local_snapshots(), wired
# into every ./run_pipeline.sh). Unlike before, this now runs through
# the full `uv sync` environment (already synced for the real rebuild
# above), not a separate `--no-project` stdlib-only install - no longer
# worth keeping that split now this job installs everything anyway.
#
# Item 76's UI-integration follow-up (plans/qa-pipeline.md, 2026-09-18,
# scoped via AskUserQuestion): also fetches every currently-open real
# GitHub Issue the ticketing MVP (qa_tools/common/ticket_sync.py,
# .github/workflows/ticket-sync.yml - a SEPARATE, write-permitted
# workflow) has opened, via a real, read-only `gh issue list` call, and
# writes it to reports/open_tickets.json for dashboard/embed_dashboard_
# data.py to embed as TICKET_STATUS (a small badge on each dataset's own
# tile). Needs `issues: read` below (new) - still never `contents:
# write`, this job doesn't write to git either way. A real external
# read, not "data" in CLAUDE.md's hard-rule sense (that rule is about
# data/*, never about calling GitHub's own API for issue state).
#
# running-thoughts.md #6 ("read-only tension: accepting/rejecting amber
# supplies", 2026-09-18, scoped via two AskUserQuestion rounds): also
# fetches every real qa-ticket issue's own comments (open AND closed -
# qa_tools/common/acceptance_sync.py's own real `gh` boundary), writes
# them to reports/qa_comments.json, and embed_dashboard_data.py matches
# any real /accept comment to the real run it applies to purely by
# timestamp against that run's own committed arrival window - no run_id
# ever typed by a human. Same real-read, `issues: read`-only treatment
# as the ticket fetch above - this job still never writes to GitHub,
# only ever reads a comment someone else already posted there.
#
# running-thoughts.md #3's leaderboard, REDESIGNED 2026-09-18 (the
# automation-tension follow-up to item #5 Thread B): used to be fully
# CI-safe with no `gh` call at all (built purely from committed qa_
# results/ history); now measures a real person's own streak of clean
# GitHub-ticket RESOLUTIONS instead of clean QA RUNS (see qa_tools/
# common/leaderboard.py's own docstring for why), which needs the real
# WHO-closed-this-ticket data only GitHub's classic Issue Events API
# exposes - so this job now also fetches every real qa-ticket issue's
# own real closed/reopened history (qa_tools/common/leaderboard.py's own
# real `gh` boundary) to reports/ticket_resolutions.json, same real-
# read/`issues: read`-only treatment as everything else above.

on:
  push:
    # No generator/** here - this job no longer runs anything from it
    # (see the hard-rule note above), so a generator-only change has no
    # effect on what this job builds until someone runs it locally and
    # commits fresh qa_results/ history, which already triggers this.
    # A glob, not a single named branch - same fix and same reason as
    # test.yml's own trigger (plans/publishing-and-history.md #7,
    # 2026-09-19): this was pinned to one session's branch name, so it
    # stopped firing for every later session.
    #
    # Worth being explicit about what this means HERE, since unlike
    # test.yml this workflow is the real publish path to a live, public
    # site: any `claude/*` branch can now publish. That matches how this
    # project actually works (sessions are sequential, each branching
    # from the last, so "the newest push publishes" is the correct
    # behaviour), and the `concurrency: pages` group below already
    # serialises deploys so two can never interleave. The residual risk
    # it does NOT cover: if two sessions genuinely overlap, an older
    # branch pushing last would publish older content. That's a real but
    # narrow window, and the honest fix for it is a real trunk branch to
    # publish from - a bigger change to how this project works, flagged
    # in #7 rather than decided here.
    branches: ["claude/**"]
    paths:
      - "qa_results/**"
      - "contract/**"
      - "dbt_project/models/staging/schema.yml"
      - "qa_tools/**"
      - "pipeline/**"
      - "dashboard/**"
      - "CHANGELOG.yaml" # the "What's New" feed the Release Notes panel embeds at build time
      - "requirements.yaml" # item 75's "Requirements" panel embeds this file's own content at build time
      # plans/**: the Plans TAB embeds every plans/*.md file's own
      # content at build time (dashboard/plans_md.py's parse_plans(),
      # via embed_dashboard_data.py's PLANS_DIR -> `const PLANS`), for
      # exactly the same reason CHANGELOG.yaml and requirements.yaml are
      # listed above. Missed when that tab was built (2026-09-18,
      # plans/running-thoughts.md #10), so for a day every plans-only
      # commit silently failed to republish and the live Plans tab drifted
      # behind the repo - confirmed by fetching the real published page
      # and finding none of that day's plans work in it. See
      # plans/publishing-and-history.md #8.
      - "plans/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # running-thoughts.md #6 ("read-only tension: accepting/rejecting
  # amber supplies") - near-real-time publishing of a real /accept
  # comment: a human commenting on a real qa-ticket issue re-triggers
  # this exact same build/validate/publish job (never a separate,
  # lighter workflow - this IS already "rebuild from committed history,
  # gate, publish", just from a different real event). Gated below (the
  # job's own `if:`) so an unrelated comment on an unrelated issue never
  # triggers a real rebuild - only a comment starting with /accept on an
  # issue that actually carries the real qa-ticket label does. Still a
  # pure read (parses the comment, never writes back to the issue) - no
  # new permission needed, `issues: read` below already covers it.
  issue_comment:
    types: [created]

permissions:
  contents: read # back to read-only, 2026-09-16 - see the "stop committing" note above; this job no longer writes to git at all
  issues: read # item 76's UI-integration follow-up - real gh issue list, never a write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-validate-publish:
    # See the issue_comment trigger's own comment above - only a real
    # /accept comment on a real qa-ticket issue should pay for a full
    # rebuild; every other event (push/workflow_dispatch, or any other
    # issue_comment) always runs.
    if: >
      github.event_name != 'issue_comment' ||
      (startsWith(github.event.comment.body, '/accept') &&
       contains(github.event.issue.labels.*.name, 'qa-ticket'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # The two history-comparing gates below ask "did something that
      # should be immutable change?" by reading a file at an earlier
      # commit. Comparing against HEAD~1 only ever checks a push's LAST
      # commit, so anything edited in the one underneath it went
      # unread - true for the calendars and for every hand-authored
      # check alike (plans/post-build-review.md #44). This is the
      # commit the push STARTED from, so every commit in it is covered.
      # Empty on workflow_dispatch/issue_comment, where
      # qa_tools/common/diff_base.py falls back to HEAD~1.
      MOTHMAN_DIFF_BASE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not 2: the gates now compare against the
          # push's base, which can be any number of commits back.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync dependencies
        run: uv sync --dev

      - name: Install Playwright's Chromium
        run: uv run playwright install --with-deps chromium

      - name: Rebuild check results from committed qa_results/ history
        run: uv run mothman dashboard rebuild-results

      - name: Reshape into dashboard JSON
        run: uv run mothman dashboard build-data

      - name: Fetch open QA tickets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label qa-ticket --state open \
            --json number,title,url,labels,updatedAt --limit 100 > reports/open_tickets.json

      - name: Fetch QA ticket comments (for real /accept matching)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run mothman github sync-acceptances > reports/qa_comments.json

      - name: Fetch QA ticket resolution history (for the leaderboard)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run mothman github sync-leaderboard > reports/ticket_resolutions.json

      - name: Embed real data into the dashboard
        run: uv run mothman dashboard embed

      - name: Gate - hierarchy validation (REQ-QAC-039)
        run: uv run mothman dashboard validate-hierarchy

      # Needs history for its past-date guard - the same MOTHMAN_DIFF_BASE
      # and full checkout this job already sets for the check-lifecycle
      # diff below, which is exactly why that guard was affordable
      # enough to build (REQ-PIPE-050).
      - name: Gate - schedule and asset config validation (REQ-PIPE-050)
        run: uv run mothman schedule validate

      - name: Gate - check-lifecycle validation (Thread D)
        run: uv run mothman dashboard validate-check-lifecycle --require-explanations

      - name: Gate - requirements validation (item 75)
        run: uv run mothman dashboard validate-requirements

      - name: Validate CHANGELOG.yaml (schema + component tags)
        run: uv run mothman dashboard validate-changelog

      # plans/INDEX.md is generated from plans/*.md but committed, so it
      # can drift the moment anyone edits a plans file without
      # regenerating. A committed generated artifact nobody checks is
      # worse than none - a session reads it INSTEAD of the files.
      - name: Check the plans index is current
        run: uv run mothman dashboard plans-index --check

      - name: Gate - dashboard structural + real-browser render check
        run: uv run mothman dashboard check-renders

      - name: Prepare site
        run: uv run mothman dashboard snapshot --prepare-site _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
