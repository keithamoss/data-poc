name: Run test suite

# Phase 6 of plans/publishing-and-history.md (test coverage), scoped
# 2026-09-17: 211+ tests existed with zero CI enforcement path before
# this - deploy-pages.yml only ever ran the build/validate/publish
# steps for the dashboard itself, scoped to a narrow set of paths that
# don't even include generator/ or tests/ (see that workflow's own
# trigger comment). This is deliberately a SEPARATE workflow, not a step
# bolted onto deploy-pages.yml, because the two have genuinely different
# scopes: deploy-pages.yml only needs to re-run when something that
# affects the PUBLISHED DASHBOARD changes; this workflow needs to catch
# a regression anywhere in the codebase, including generator/ changes
# that never touch a committed dashboard artifact at all - so no path
# filter, runs on every push to the working branch.
#
# `uv run pytest` is what's gated here - `uv run ruff check .` stays a
# local/pre-commit concern (pre-commit already wires it into every
# `git commit`, so a real lint regression can't reach this branch in
# the first place; this workflow's job is catching what pre-commit
# CAN'T catch, a genuine test failure, not re-litigating lint).
#
# Phase 6 step 4 (2026-09-17): also runs with coverage and enforces
# pyproject.toml's [tool.coverage.report] fail_under - Keith's own
# words, pytest-cov + a real threshold "so we can't silently regress",
# the real achieved number only set once step 3's actual gap-closing
# work was done (see plans/publishing-and-history.md's own "Build
# progress" note for that number and the reasoning behind the buffer
# below it). --cov-report=term-missing here (not just the pass/fail
# gate) so a real regression's own missing lines show up directly in
# the workflow log, not just a bare percentage.
#
# Phase 6 step 5 (2026-09-17): a second, independent `js-tests` job runs
# Vitest against the dashboard's own inline JS (tests-js/ - see that
# directory's own tests-js/support/loadDashboard.js docstring for how a
# hand-authored, no-module-system single-file template gets loaded into
# a real jsdom Window with no changes to the template itself). A
# separate job, not a step tacked onto `test` above, so the two run in
# parallel (independent toolchains, uv vs npm, no shared state) and a
# JS-only failure is immediately visibly distinct from a Python one in
# the Actions UI.
#
# Phase 6 step 6 (2026-09-17): tests/test_dashboard_e2e.py adds real
# Playwright browser tests (as-of date picking, supply-history
# drill-down, dark mode persistence, plus the raw-template-with-mock-
# data render check absorbed from dashboard/check_dashboard_renders.py -
# see that test module's own docstring), so this job now also installs
# Chromium (same step deploy-pages.yml already runs). deploy-pages.yml's
# own check_dashboard_renders.py CI gate step is intentionally left in
# place rather than removed - it's the actual pre-publish gate for a
# public site, and folding it into this suite instead was judged too
# risky to do unsupervised (see plans/publishing-and-history.md's step
# 6 write-up for the reasoning) - the two now overlap in what they
# cover, which is redundant but safe, not a gap.
#
# 2026-09-17 (Phase 7, Keith's own report of a failed run): this job was
# missing `dbt deps` - README.md/CLAUDE.md's own documented one-time
# step that installs dbt_utils (several real dbt checks use macros that
# package ships, not dbt-core itself - `dbt build` won't even compile
# without it). deploy-pages.yml never needed this (it never runs a real
# `dbt build`, only reads pre-committed qa_results/ JSON) and
# dbt_project/dbt_packages/ is gitignored, never committed, so every
# fresh CI checkout genuinely needs this run fresh - this job's own
# real dbt-core integration tests (Phase 6 step 2) were failing on
# every single push since they landed, invisible locally because this
# sandbox already had dbt_packages/ installed from earlier session
# work. Found alongside, and initially misattributed to, the Python
# 3.12 fix above - confirmed as a genuinely separate cause by checking
# the actual CI run AFTER that fix landed: Python was correctly 3.11 by
# then, but every dbt-based test still failed with the exact same
# `FileNotFoundError` for target/<run_id>/manifest.json - dbt was
# erroring out during compile, silently, since run_dbt() calls
# subprocess.run(..., check=False, capture_output=True) and nothing
# surfaces a failed dbt invocation's own stderr.

# A glob, not a single named branch (plans/publishing-and-history.md #7,
# fixed 2026-09-19). This used to read `branches:
# [claude/new-session-en9qen]` - the working branch of whichever session
# last edited this file. Every session since got a different branch name,
# so this workflow fired for NONE of them and CI silently did nothing:
# `list_workflow_runs` filtered to a later session's branch returned zero
# runs while the repo as a whole had 335. Nothing was ever red - the
# failure mode was CI looking fine because it wasn't running at all,
# exactly the thing CLAUDE.md's own "a passing local pytest is NOT
# evidence CI is green" rule exists to catch.
#
# `claude/**` rather than a PR trigger, deliberately: this project has no
# trunk at all (there is no `main` - every branch in the repo is a
# `claude/*` session branch, each continuing from the last), and its own
# convention is to push straight to a session branch and never open a PR
# unless asked. A pull_request trigger would have nothing to target.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

# A superseded run tells you nothing - this branch pushes several times a
# session, and only the newest commit's result matters. Cancels in
# progress per-branch, so two concurrent sessions never cancel each other.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync dependencies
        run: uv sync --dev

      - name: Install dbt_utils
        run: uv run dbt deps --project-dir dbt_project --profiles-dir qa_tools/dbt_profiles

      - name: Install Playwright's Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run test suite
        run: uv run pytest --cov=qa_tools --cov=pipeline --cov=generator --cov=dashboard --cov-report=term-missing

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard JS test suite
        run: npm test
