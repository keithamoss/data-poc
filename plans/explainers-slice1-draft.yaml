  source: "Keith, plans/explainers.md item 1 second and fourth rounds, item 3 rounds 2, 3 and 6, slice 1 answer Q11, and set 4, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "WHEN docs-writer has drafted a page with marked slots, THE SYSTEM SHALL have docs-illustrator read the whole draft and fill each slot."
    - "THE SYSTEM SHALL let docs-illustrator choose, per concept, among a recurring-cast story, an everyday analogy, a real-world incident scenario, and an analogy followed by the cast walking through it, and to combine them."
    - "THE SYSTEM SHALL let docs-illustrator choose between a short vignette and numbered zine-style panels for a story."
    - "THE SYSTEM SHALL have docs-illustrator follow REQ-DOCS-118 for every diagram, including writing each caption into accTitle and accDescr, and REQ-DOCS-117 for every story."
