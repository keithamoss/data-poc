- id: REQ-DOCS-131
  title: "A small reader-judgement skill, the one standard the critic preloads"
  date_written: "2026-09-29"
  story: "As Keith, I want the rules a reader judges a page by held in one small skill that the critic and the writers all preload, so that the critic applies exactly the rules the writer wrote to without being handed the cast, glossary or examples that a cold reader would not have."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: "2026-09-29"
  source: "Keith, plans/explainers.md item 3, slice 1 answers set 4 (the critic does not preload the house standard) and set 5 (the standard splits into two skills) and set 6 (its content as drafted), 2026-09-29. Drafted by delivery-scoper in its third revision of explainers slice 1, 2026-09-29."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold the reader-judgement rules in exactly one file, .claude/skills/docs-reader-judgement/SKILL.md, and SHALL NOT hold a second copy of any of them anywhere else, including the house standard and any agent's prompt."
    - "THE SYSTEM SHALL have docs-critic preload the reader-judgement skill as its only skill, and SHALL have docs-writer, docs-illustrator and docs-fact-checker preload it alongside the house standard."
    - "THE READER-JUDGEMENT SKILL SHALL hold only rules a reader can apply to the finished page on its own, and SHALL NOT contain the cast, the glossary, worked examples, the banned-word lists or any rule the validator enforces."
    - "THE READER-JUDGEMENT SKILL SHALL hold the rule that the first sentence of the 'In short' box answers the page's why-question on its own."
    - "THE READER-JUDGEMENT SKILL SHALL hold the rule that a page makes sense to a reader who arrives on it cold, so that every invented term it uses is defined on that page and every cast member it uses is introduced by name and role on first mention, whether or not another page or the glossary already does so."
    - "THE READER-JUDGEMENT SKILL SHALL hold the sensitivity rule - every story concerns files, deadlines and decisions, never the children, families or births the data describes, and no page carries a realistic case or an invented personal detail, including in a diagram or an example row - and SHALL state that a breach is a blocker."
    - "THE READER-JUDGEMENT SKILL SHALL hold the two argue-not-decorate tests for a diagram - with every label stripped the shape still carries the idea, and a reader could learn something from it - and SHALL treat a diagram that adds nothing the prose has not already said as excess."
    - "THE READER-JUDGEMENT SKILL SHALL hold the pattern-shaped rhetorical tics that no fixed string can catch - 'it's not X, it's Y', rule-of-three padding, and ending a section on a punchy one-liner."
    - "THE SYSTEM SHALL mark the skill as preloadable and not user-invocable, so that it is never offered as a slash command."
    - "[PROCESS] THE SYSTEM SHALL NOT add, remove, renumber or reword any rule in the reader-judgement skill without Keith's approval of the exact wording."
  non_functional_requirements:
    - "COLDNESS: everything in this skill reaches the critic before it reads the page, so everything in it is context a real reader does not have. It stays small on purpose - rules about how a page should read, never facts about Mothman - and each addition needs a reason a cold reader would accept."
    - "One copy of every rule across the two skills: the writer and illustrator preload both, so a rule the critic needs lives HERE and only here, and the house standard does not restate it. That is what lets the writer be held to exactly what the critic checks (the paper check's 'equal effort' point)."
    - "An authoring standard in CLAUDE.md's sense, gated by the amendment REQ-DOCS-115 makes, for the same reason as the house standard: a rule the critic reads one way and Keith another is the failure the gate exists for."
    - "SECURITY: it lives outside docs/explainers/, so no docs-* agent's write guard allows editing it, and the validator scans it for zero-width and bidirectional-control characters (REQ-DOCS-122)."
    - "Written general enough for a second document type later, like the house standard (round 12)."
  dependencies: []
  decisions:
    - "Decided the split into two skills (Keith, set 5): a small reader-judgement skill - judgement rules only, no cast, glossary or examples - that the critic preloads alone, and the house standard the other three preload with it. Still one copy of every rule. Rejected: a named exception copying rules into the critic's prompt."
    - "Decided a requirement of its own rather than criteria inside REQ-DOCS-115, REQ-DOCS-124 or REQ-DOCS-127 (scoper's call in this revision): it is a separate file with its own consumers, its own approval gate and a boundary against the house standard that has to be stated once, and folding it into the house standard's requirement would put the two skills' contents in one list where the line between them is easy to lose."
    - "Decided which rules sit here (Keith, set 6, approving the scoper's proposal as drafted): answer-first, the page stands alone for a cold reader (terms and cast), the sensitivity rule, the argue-not-decorate tests and diagram excess, and the pattern-shaped rhetorical tics. The test used - does the critic have to apply this rule itself? - puts everything the validator enforces, and every writing technique only a writer needs, in the house standard."
    - "Decided traits 9 and 10 - admit simplifications in one sentence, and keep an analogy to one idea - stay in the house standard (Keith, set 6). Rejected: moving them here, which the critic could judge from the page alone but which would split the traits list across two files."
    - "Decided the skill is preloadable with user-invocable false, because a skill with disable-model-invocation cannot be preloaded (round 2 research)."
  open_questions: []

- id: REQ-DOCS-132
  title: "The validator enforces the house standard's mechanical prose rules"
  date_written: "2026-09-29"
  story: "As Keith, triaging an agent-written page, I want every rule a machine can check - sentence length, banned words, punctuation and the rest - rejected before any reviewer sees the page, so that the critic's findings and my time go on what only a reader can judge."
  moscow: must
  status: not_started
  source: "Keith, slice 1 answers Q5 (the validator enforces the mechanical style rules), set 4 (the other mechanical rules too) and set 5 (no requirement ids or code in a page body), 2026-09-29, with definitions from the delivery-architect review. Split out of REQ-DOCS-122 by delivery-scoper in its third revision of explainers slice 1, 2026-09-29."
  acceptance_criteria:
    - "THE SYSTEM SHALL enforce the rules below in `mothman docs validate` (REQ-DOCS-122), each under its own stable rule id."
    - "THE SYSTEM SHALL apply the prose rules to headings, body text, list items, table cells, the 'In short' box and captions, and SHALL NOT apply them to front matter, Mermaid source or the 'where this comes from' list."
    - "THE SYSTEM SHALL count a sentence as a run of prose ending in a full stop, question mark or exclamation mark followed by whitespace or the end of its block, with the end of a heading, list item, table cell or caption also ending a sentence."
    - "THE SYSTEM SHALL count a word as a whitespace-separated token containing at least one letter or digit, so that a spaced en dash is not a word and a hyphenated compound is one word."
    - "IF a sentence other than a heading is longer than 25 words, THEN THE SYSTEM SHALL reject it."
    - "IF a paragraph holds more than five sentences, THEN THE SYSTEM SHALL reject it."
    - "IF a page's prose contains a word or phrase on the house standard's banned lists, THEN THE SYSTEM SHALL reject it, unless the house standard's exemption list covers that use."
    - "THE SYSTEM SHALL read the banned lists and the exemption list from the house standard's YAML block (REQ-DOCS-115), and SHALL NOT keep a copy of either in its own code."
    - "IF a page's prose contains a semicolon, or eg, ie or etc in any spelling, THEN THE SYSTEM SHALL reject it."
    - "IF a page's prose contains a negative contraction, THEN THE SYSTEM SHALL reject it."
    - "IF a page's prose contains the word 'midnight', THEN THE SYSTEM SHALL reject it."
    - "IF a heading ends in a question mark, THEN THE SYSTEM SHALL reject it."
    - "IF a page's prose contains an em dash, an en dash without a space on both sides, a spaced hyphen used as a dash, or a hyphen or dash joining two numbers or two dates, THEN THE SYSTEM SHALL reject it."
    - "THE SYSTEM SHALL NOT treat a period name of the form 2026-Q3 as a dash in a date or range."
    - "IF a page's body contains a requirement id, an inline code span, a fenced block other than Mermaid, or a repository file path outside a link target, THEN THE SYSTEM SHALL reject it."
  non_functional_requirements:
    - "Precise definitions of 'sentence' and 'word' are what make a 25-word cap mean the same to the writer, the validator and Keith. Without them the same page passes on one reading and fails on another, and the writer cannot fix what it cannot predict."
    - "False positives are expected - 'just' is on the condescension list and also appears in 'just-in-time'. The fix is an exemption in the house standard, which Keith approves, never a marker in the page, which an agent could add to silence the check."
    - "Word count is NOT enforced here: 500 to 800 words is a target the critic judges (Keith, set 4), not a limit."
    - "Headings are exempt from the sentence-length rule because a heading is not a sentence, but every other prose rule applies to them."
    - "Deterministic and fast, like the rest of the validator, so it sits in `mothman check` and CI."
  dependencies:
    - REQ-DOCS-115
    - REQ-DOCS-116
    - REQ-DOCS-122
  decisions:
    - "Decided the validator enforces the mechanical style rules - the 25-word cap, the banned words, semicolons, eg, ie and etc, and the spaced en dash - and the critic keeps the judgement calls (Keith, slice 1 Q5). SUPERSEDES style round 2's 'the critic flags anything over the cap'. Rejected: critic only, because a model sometimes misses a 26-word sentence; and both, because it duplicates noise at triage."
    - "Decided the validator also enforces negative contractions, 'midnight', paragraphs over five sentences, headings ending in '?', and dashes in dates or ranges (Keith, set 4). Word count stays with the critic."
    - "Decided the validator rejects requirement ids and code in a page body (Keith, set 5)."
    - "Decided the definitions of sentence and word, and the allowlist for period names like 2026-Q3 (delivery-architect, adopted). The allowlist exists because a period name is a defined Mothman term that happens to contain a hyphen between a year and a quarter, not a range."
    - "Decided the pattern-shaped rhetorical tics stay with the critic (the reader-judgement skill, REQ-DOCS-131), since they are judgement calls rather than fixed strings; only fixed-phrase tics are on the banned lists."
    - "Decided exemptions live in the house standard's YAML block from the start (delivery-architect, adopted), replacing the earlier draft's 'no exemptions until a real page proves the check too blunt'. Still no per-line override."
    - "Decided a requirement of its own, split out of REQ-DOCS-122 (scoper's call in this revision): the safety validator and the style rules it enforces had grown to about forty criteria together, and they change for different reasons - security hardening versus the house standard's wording."
  open_questions: []
