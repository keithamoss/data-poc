# DRAFT, NOT THE REGISTER. delivery-scoper's slice-1 drafts for the explainer team
# (plans/explainers.md #3). Kept here only so they survive the container;
# they move into requirements.yaml once Keith's twelve questions are answered,
# and this file is deleted in that same commit. Nothing here is signed off.
- id: REQ-DOCS-115
  title: One approved writing standard for explainer prose
  date_written: "2026-09-29"
  story: "As whoever writes, illustrates or reviews an explainer, I want one approved written standard for how explainer prose reads, so that every page sounds like the same colleague and can be held to the same rules."
  moscow: must
  status: not_started
  source: "Keith, designed across plans/explainers.md item 3 (style rounds 1 to 5, the GOV.UK research and the baseline switch), 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold the explainer house standard in exactly one file, and every docs-* agent SHALL take its rules from that file rather than from wording copied into its own prompt."
    - "THE SYSTEM SHALL NOT add, remove, renumber or reword any rule in the house standard without Keith's approval of the exact wording."
    - "THE HOUSE STANDARD SHALL name GOV.UK's writing guidance as its baseline and SHALL mark each rule that is Keith's own preference layered on top of it."
    - "THE HOUSE STANDARD SHALL state the voice: a senior colleague at a whiteboard, 'you' for the reader and 'we' for a choice the project made, warm and lightly playful, with wry asides allowed in body text only."
    - "THE HOUSE STANDARD SHALL forbid puns and humour in page titles and headings, and SHALL require headings and titles to be statements rather than questions."
    - "THE HOUSE STANDARD SHALL state the mechanics Keith settled - Australian spelling, the Oxford comma always, a spaced en dash for a break in a sentence, a 25-word sentence cap with a 15 to 20 word aim, paragraphs of at most five sentences, no semicolons, no eg, ie or etc, 'cannot' and 'do not' rather than those contractions, 'to' in ranges, '11:59pm' rather than 'midnight', dates in the '29 September 2026' form, and GOV.UK's numbers rule."
    - "THE HOUSE STANDARD SHALL require a named period to be given with its due date on first use on each page, in the form 'the 2026-Q3 period (supply due 1 August 2026)', and plain thereafter."
    - "THE HOUSE STANDARD SHALL list the four banned categories - AI-voice words, condescension, corporate filler and rhetorical tics - each with its examples."
    - "THE HOUSE STANDARD SHALL require a new term's first use on a page to be bold, defined in one plain clause in the same sentence and linked to its glossary entry, and SHALL reserve bold for that use alone."
    - "THE HOUSE STANDARD SHALL require every invented term to be spelled exactly as its canonical glossary entry spells it, and SHALL require GOV.UK's words-to-avoid to be avoided wherever they are not a defined Mothman term."
    - "THE HOUSE STANDARD SHALL require status names in lowercase plain text, and prose first with lists only for real sets."
    - "THE HOUSE STANDARD SHALL name CHANGELOG.yaml's reader voice as the model and the internal prose of plans/*.md and CLAUDE.md as the anti-model."
    - "THE HOUSE STANDARD SHALL keep its explanation-specific rules in a section of their own, so that rules for a second document type can be added beside them without restructuring the file."
  non_functional_requirements:
    - "The standard is an authoring standard in exactly the sense CLAUDE.md's standing rule means: hundreds of hand-authored sentences will be held against it, so a clause that reads one way to Keith and another to the agent applying it is the failure this gate exists for. Approval of the substance is not approval of the wording."
    - "Single copy, the same reasoning as CHANGELOG.yaml's header (REQ-DOCS-028): two copies of a style rule drift, and nothing says which one wins."
    - "Every rule in it should be one a reader of the finished page could check, either by eye or by the validator (REQ-DOCS-122). A rule nobody can check is a rule the critic will interpret differently on each run."
    - "It must be readable on GitHub as plain markdown with no build step, because slice 1 has no dashboard tab."
    - "Designed for reuse by the pipeline docs (plans/explainers.md item 2, 'Running Mothman'), but this requirement builds only the explanation rules. How-to and reference rules are item 2's own scoping."
  dependencies: []
  decisions:
    - "Decided GOV.UK's writing guidance is the baseline (Keith, 2026-09-29, 'Fine, ignore the style manual. GovUK is a bit better anyway'). The Australian Government Style Manual was the first baseline, rejected once its own host refused scripted clients and GOV.UK's guidance was read in full. Australian spelling stays, as Keith's preference rather than a Style Manual rule."
    - "Decided headings and titles are STATEMENTS (style round 5), reversing style round 1's 'mostly questions'. The why-question lives in the brief and the page's opening answer instead. GOV.UK's reason was accepted - question headings are hard to front-load."
    - "Decided new terms stay BOLD rather than GOV.UK's single quotes (style round 5). GOV.UK's real concern, bold used for emphasis, is met by reserving bold for defined terms only."
    - "Decided the Oxford comma ALWAYS, a deliberate departure from both the Style Manual and GOV.UK (style round 2). The spaced en dash is Keith's own too - GOV.UK has no rule for it."
    - "Decided humour narrows to wry asides in body text (style round 5). Puns come out of headings and titles, where they cost skimming and search. Not picked in style round 1 - Australian references and idiom, or keeping all the humour inside the cast's stories."
    - "Decided dates follow the '29 September 2026' form even though the dashboard has its own single date format (REQ-DASH-071). Keith chose this over matching the dashboard, accepting that an explainer and the dashboard may show a date differently."
    - "Decided numbers follow GOV.UK - 'one' in words unless it is a step or list point, numerals for everything else including 2 to 9. This closed plans/explainers.md queue item 8; the Style Manual's rule is no longer needed."
    - "Decided a named period is given with its DUE DATE on first use, not its months. The earlier answer, 'term plus months', rested on a wrong example - Mothman's quarterly periods are authored dates anchored on 1 February, May, August and November, deliberately not calendar quarters, so 2026-Q3 is not July to September. A WA reader could also read Q3 as a financial-year quarter."
    - "Decided GOV.UK's words-to-avoid that are real Mothman terms - promote, deliver, assets, issues - are KEPT as terms and defined in the glossary, rather than renamed. GOV.UK's own rule is to explain specialist terms. In general prose GOV.UK is followed ('problems', not 'issues')."
    - "Decided the exemplars - model CHANGELOG.yaml's reader voice, anti-model plans/ and CLAUDE.md. Not picked as a model - the check explanations from REQ-QAC-024. External exemplars are still to come from Keith (queue item 6)."
    - "Decided NOT to adopt GOV.UK's separate accessible title and description per diagram as a writing rule; the diagram caption does that job (see REQ-DOCS-118)."
    - "Decided the standard is written general enough for a second document type (round 12), because the same team is expected to write 'Running Mothman' later. Only explanation rules are written now."
  open_questions:
    - "WHERE the single copy lives - as the SKILL.md of the one preloaded skill every docs-* agent names in `skills:`, or as a page under docs/explainers/ that the agents read on demand. Asked of Keith in the scoper's report; the answer also decides whether CLAUDE.md's authoring-standard rule needs to name the file, or whether the explainers rule already covers it."
    - "External writing exemplars (plans/explainers.md queue item 6) are not named yet. Proposed that the standard ships without them and gains them when Keith names them - asked in the scoper's report."
    - "Three GOV.UK rules from the live research were never explicitly adopted or rejected - no heading may use a term before the page has explained it, redefine terms on every page rather than only in the glossary, and a page summary of 160 characters or fewer. Asked in the scoper's report."

- id: REQ-DOCS-116
  title: Every explainer page has the same four fixed parts and cites only citable sources
  date_written: "2026-09-29"
  story: "As a manager or a new engineer opening an explainer, I want the answer at the top, the reasoning in one place and the sources at the end, so that I can stop reading as soon as I have what I came for and trust what I read."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 1, 4, 5, 10 and style rounds 3 and 5, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29."
  acceptance_criteria:
    - "THE HOUSE STANDARD SHALL leave a page's shape free-form apart from four required parts - an 'In short' box, an opening answer to the page's why-question, a short 'why it's this way' section, and a 'where this comes from' list."
    - "THE HOUSE STANDARD SHALL require the 'In short' box to sit at the top of the page, to run to three or four sentences, and to open with the one-sentence answer to the page's why-question."
    - "THE HOUSE STANDARD SHALL require the 'why it's this way' section to hold two to four bullets drawn from the cited requirements' decisions, saying what was chosen, what was rejected, and why."
    - "THE HOUSE STANDARD SHALL require the 'where this comes from' list to be the last section of the page and to name every requirement id and config or code file the page rests on."
    - "THE HOUSE STANDARD SHALL NOT allow requirement ids, file names or code identifiers in the body of a page outside that list."
    - "THE HOUSE STANDARD SHALL require links a reader needs, to the glossary or a related page, to appear inline where they are relevant, and SHALL NOT allow them to appear only in the closing list."
    - "THE HOUSE STANDARD SHALL set a page's length at about 500 to 800 words excluding diagrams, and SHALL direct deeper detail to another page by link."
    - "THE HOUSE STANDARD SHALL define a citable source as a requirement in requirements.yaml, or a specific config or code file, and SHALL NOT treat any file under plans/ or CLAUDE.md as citable."
    - "WHERE a page explains a concept whose requirement is signed off but not built, THE HOUSE STANDARD SHALL require the page to badge it 'designed, not built yet'."
    - "THE HOUSE STANDARD SHALL define the front matter every page carries - the page's why-question, its group, its cited sources, its status as draft or signed off, and, once signed, who signed it off and when, a last-reviewed date and a review-by date."
  non_functional_requirements:
    - "Answer-first is not decoration. GDS found concept pages are the type readers skip most, and slice 2's 'What's this?' links will land a confused reader straight onto one - the first sentence has to carry the answer on its own."
    - "The citable-source rule is what makes slice 2's staleness gate workable at all: plans/*.md and CLAUDE.md churn daily, and a page fingerprinting them would fail the gate constantly. Slice 1 has no gate, but a page written against the wrong rule now would need rewriting then."
    - "The front matter fields are defined now so that slice 2 only ADDS fingerprints and checking, and does not have to re-open every page already signed. The checks themselves are deferred to explainers slice 2."
    - "Compatibility: the four fixed parts have to render as plain markdown on GitHub (Mermaid 11.17.2 at last test) with no custom HTML, because REQ-DOCS-122 rejects raw HTML."
  dependencies:
    - REQ-DOCS-115
  decisions:
    - "Decided free-form page shape (round 5), chosen over a fixed skeleton and over 'required elements, free order'. Two answers in the same round fix the 'In short' box and the 'why' section; round 1's why-question and the cited sources make four fixed parts."
    - "Decided two readers on one page (round 5) - an 'In short' box a manager can stop after, and the rest for the engineer. Rejected separate reading paths per audience; GDS's 'Documenting APIs' also warns against organising documentation by user type."
    - "Decided 500 to 800 words, readable in three to four minutes (round 5)."
    - "Decided the 'why it's this way' section is drawn from requirements' decisions fields (round 5), because they are exactly Diataxis's 'choices, alternatives, reasons' raw material."
    - "Decided identifiers live only in the closing sources list (style round 3), keeping the body clean for managers."
    - "Decided the sources list STAYS at the end despite GOV.UK's 'do not gather links at the bottom' (style round 5), because it is provenance rather than further reading - and inline links carry anything a reader actually needs."
    - "Decided plans/*.md is NEVER citable (round 4) because it is working material deleted as requirements land. The writer may read it for background (round 10)."
    - "Decided designed-but-unbuilt concepts ARE explained, clearly badged (item 4, Keith's calls), and every such page is revisited as the build lands."
    - "Decided the boundary with REQ-QAC-024 (item 1): that requirement explains each CHECK in plain English; an explainer explains a CONCEPT - a supply, a slot, promotion, the worst-of rollup. A check's plain-English fields get only a glossary entry and one line in 'what a check is' (triage #29)."
    - "Decided a concept with two halves is SPLIT and CROSS-LINKED (the two-track sweep): the explainer covers what it means and why, a Running Mothman how-to covers the steps, each links to the other and neither repeats the other. The links wait until item 2's pages exist."
    - "Decided each page records a last-reviewed and a review-by date alongside its sign-off (Keith's calls on the live research), because a fingerprint catches a changed source but not a world that changed while no cited file did. Suggested review period six months; the date check itself is explainers slice 2."
  open_questions:
    - "Whether a page may cite a requirement that is NOT signed off. REQ-PIPE-110 to 113 are unsigned and the claim-windows page would lean on them. Asked in the scoper's report."

- id: REQ-DOCS-117
  title: A fixed cast, and stories that are about data, never the people in it
  date_written: "2026-09-29"
  story: "As a reader working through several explainers, I want the same small cast in every story, so that I get to know them, and I want every story to stay clear of the people the data describes, so that nothing here trivialises child protection or birth records."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 round 4, round 12, round 15 and 'The cast', 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29."
  acceptance_criteria:
    - "THE HOUSE STANDARD SHALL define a fixed cast once, giving each member a name, a role, an agency or team, one personality trait and what they typically struggle with."
    - "THE HOUSE STANDARD SHALL NOT change the cast's wording without Keith's approval of the exact text."
    - "THE HOUSE STANDARD SHALL name one cast member as the reader's stand-in, and that description SHALL match the critic's persona in REQ-DOCS-127."
    - "THE HOUSE STANDARD SHALL name one cast member as the voice of the 'In short' box."
    - "THE HOUSE STANDARD SHALL define the Mothman mascot, and SHALL limit it to some diagrams and the odd aside, never a heading."
    - "THE HOUSE STANDARD SHALL require every story to concern files, deadlines and decisions, and SHALL NOT allow a story about the children, families or births the data describes."
    - "THE HOUSE STANDARD SHALL NOT allow a realistic case, or an invented personal detail such as a child's name, a date of birth or a family circumstance, anywhere on a page, including in a diagram or an example row."
    - "IF a page breaches the sensitivity rule, THEN THE SYSTEM SHALL treat the breach as a blocker-severity finding."
    - "THE HOUSE STANDARD SHALL state that the cast is introduced in the overview page's one-supply journey, and SHALL say how a page read before the overview introduces a cast member it uses."
  non_functional_requirements:
    - "PRIVACY, and the reason this is a must: the real collections behind this PoC include child protection. A page that is fine for synthetic data is still published publicly on GitHub the moment it is pushed, and would be read by exactly the people a careless story would offend. The rule has to hold as if the data were real, because in a real deployment it is."
    - "The rule applies to invented detail as much as to real detail. An agent that never reads data/ can still invent a plausible child - which is why REQ-DOCS-124 keeps the agents away from data AND this rule forbids invention."
    - "The cast's names must not collide with contract/people.yaml's placeholder colleagues or any real person the project names, so a reader never confuses a story character with someone who can actually take a decision."
  dependencies:
    - REQ-DOCS-115
  decisions:
    - "Decided a fixed cast, defined once and reused (round 4), so readers get to know them - the Phippy pattern from the Illustrated Children's Guide to Kubernetes."
    - "Decided the cast's first draft - Priya (a supplier's data steward), Sam (a data engineer new to the asset team, the reader's stand-in), Jo (the operator who makes filing decisions), Marcus (the team manager, voice of 'In short'), Lin (a downstream researcher) - plus the Mothman mascot. Keith approves the exact wording when the standard is written."
    - "Rejected Monty Python names. Keith first picked them to match contract/people.yaml's placeholders, then, seeing the re-cast (Galahad, Patsy, Tim the Enchanter, Bedevere, Roger the Shrubber), chose regular Australian names instead."
    - "Decided the reader's stand-in MATCHES the critic's persona, so the stories and the critic test the same reader."
    - "Decided the cast is introduced in the overview page's one-supply journey (round 15), so later stories can assume the reader knows them."
    - "Decided the sensitivity guardrail (Keith's call) - stories are about data, never the people in it - and that the critic flags a breach as a BLOCKER."
  open_questions:
    - "How a page read BEFORE the overview introduces a cast member it uses, given the overview is not in slice 1. Depends on which page goes first - asked in the scoper's report."

- id: REQ-DOCS-118
  title: Diagrams that explain, look the same everywhere, and can be read by a screen reader
  date_written: "2026-09-29"
  story: "As a reader on GitHub today and on the dashboard later, I want every explainer diagram to argue a point, look the same in both places and carry a description a screen reader can announce, so that the pictures teach rather than decorate."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 1 fourth round, item 3 round 6 and Keith's calls on the live GOV.UK research, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29."
  acceptance_criteria:
    - "THE HOUSE STANDARD SHALL allow the hand-drawn look only on flowchart, state, class and ER diagrams, and SHALL require any other diagram type to use the plain look."
    - "WHERE a concept's natural shape is one the hand-drawn look does not support, THE HOUSE STANDARD SHALL require the right shape in the plain look rather than a supported shape bent to fit."
    - "THE HOUSE STANDARD SHALL require every Mermaid block to state its look and its theme explicitly."
    - "THE HOUSE STANDARD SHALL fix one handDrawnSeed value for every hand-drawn diagram."
    - "THE HOUSE STANDARD SHALL define a shared colour palette, tested in light and dark mode and matched to the dashboard, and SHALL require every classDef to set fill, stroke and text colour."
    - "THE HOUSE STANDARD SHALL require every diagram to carry a one-line caption saying what it shows, and SHALL require the same text as the diagram's accTitle and accDescr."
    - "THE HOUSE STANDARD SHALL require every diagram to still make sense rendered in the plain look."
    - "THE HOUSE STANDARD SHALL require every diagram to pass the two argue-not-decorate tests - with every label stripped the shape still carries the idea, and a reader could learn something from it."
    - "THE HOUSE STANDARD SHALL NOT allow a Mermaid click directive or any directive that touches securityLevel."
  non_functional_requirements:
    - "COMPATIBILITY across two renderers: GitHub renders Mermaid 11.17.2 (tested 2026-09-28) while slice 2 will vendor 12.x, and version 12 changed defaults for about ten diagram types. Explicit look and theme are what make the two copies match; the plain-look rule is what keeps a page readable if GitHub changes version without notice."
    - "ACCESSIBILITY: Mermaid exposes an accessible name only through accTitle and accDescr in the source (GDS Way, 'Diagrams as code'). A visible caption alone is not announced, so the caption has to be carried into the source, and REQ-DOCS-122 checks it mechanically rather than by review."
    - "STABILITY: the default seed of 0 re-randomises the wobble on every render, so without a fixed seed two renders of an unchanged page differ, and a before/after comparison of a page is noise."
    - "SECURITY: click directives and securityLevel overrides are the Mermaid surface that could turn a diagram into a link to anywhere or into script. They are forbidden in the standard and rejected by REQ-DOCS-122, and slice 2 initialises Mermaid strict as a second layer."
  dependencies:
    - REQ-DOCS-115
  decisions:
    - "Decided hand-drawn only where it fits, and only on the four types Mermaid supports it for that GitHub's 11.17.2 also has - flowchart (11.0), state (11.0), class (11.4), ER (11.5) (Keith, 2026-09-28)."
    - "Decided correctness beats consistency (round 6): use a plain timeline or gantt where that is genuinely clearest. This settled the tension that the first topic, claim windows, is naturally a timeline."
    - "Verified empirically that GitHub renders the hand-drawn look (Keith viewed a temporary test page, 2026-09-28, since deleted) - a hand-drawn flowchart rendered visibly differently from the plain one, and a hand-drawn state diagram rendered hand-drawn."
    - "Decided all three on every diagram (round 6) - a one-line caption, a shared palette tested in light and dark, and one fixed handDrawnSeed."
    - "Decided accTitle and accDescr are GENERATED from the caption (Keith's calls on the live research), so the illustrator writes it once and the validator checks the copy. Rejected a separate accessible title and description written by hand (style round 5), as a second text that could drift."
    - "Decided 'as many diagrams as it takes' (round 6) - the illustrator's call, with the critic flagging excess."
    - "Carried from the research, not individually voted on: 'diagrams should argue, not display' and its two tests (mgranberry), and Julia Evans' own anti-pattern, 'fun illustrations on dry explanations'."
  open_questions:
    - "A group page's overview diagram was meant to have nodes linking to the concept pages (item 4), but that needs Mermaid's click directive, which this standard forbids and strict mode disables. Asked in the scoper's report; no group page is in slice 1, but the standard must say which way it goes."

- id: REQ-DOCS-119
  title: A glossary seed, one canonical word per concept
  date_written: "2026-09-29"
  story: "As a reader meeting a Mothman term for the first time, I want one glossary that gives each invented term its one canonical spelling, a one-line definition and where it is explained, so that I never have to guess whether two words mean the same thing."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 1, 3 and 4, the naming session (rounds 1 to 3) and its glossary canon, the re-baseline decisions and round 15's placeholder names, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold one glossary of the project's invented terms at docs/explainers/glossary.md."
    - "THE SYSTEM SHALL give every glossary entry its canonical term, its exact spelling, a one-line definition, its aliases, the requirement or requirements that define it, and the explainer page that covers it or a mark that none does yet."
    - "THE SYSTEM SHALL list every alias and retired word as pointing at its canonical term, and SHALL NOT give an alias a definition of its own."
    - "THE SYSTEM SHALL seed the glossary with every canonical term and alias the naming session settled, and with the terms the first explainer (REQ-DOCS-130) uses."
    - "THE SYSTEM SHALL mark the three asset-shape names - scheduled asset, one-off extraction and sample - as draft placeholders."
    - "THE SYSTEM SHALL define promote, deliver, asset and issue as Mothman terms, in line with REQ-DOCS-115's rule on GOV.UK's words-to-avoid."
    - "THE SYSTEM SHALL show delivery, arrival and supply nested in one small diagram in the glossary, and SHALL show the delivery agreement and the supply calendar as two related entries, one inside the other."
    - "THE SYSTEM SHALL badge an entry whose concept is signed off but not built 'designed, not built yet'."
    - "THE SYSTEM SHALL NOT add or change a glossary entry unless Keith has approved it, either directly or at an /explain brief checkpoint."
  non_functional_requirements:
    - "The glossary sits under docs/explainers/, so CLAUDE.md's standing rule 'never change an explainer without Keith's approval' already covers it. A building session that renames a term in code reports which glossary entry it affects and does not edit the entry itself."
    - "MAINTAINABILITY: plans/explainers.md queue item 9 flags five renames in code and requirements (delivery calendar to supply calendar, the sample schema, /accept to acknowledge, cycle to period, stale to no data). Each one will ripple into this file, so aliases carry the old words rather than the old words being deleted."
    - "Machine-readable enough for two later readers: REQ-DOCS-121's recall check needs each entry's defining requirement, and slice 2's searchable glossary panel needs the entries. Both must parse the ONE file, not a second copy of it."
    - "Scale: the page list has 32 concept pages and far more terms. One file must stay readable by eye at that size, which argues for one short line per entry rather than paragraphs."
    - "Security: the glossary is published publicly and embedded in the dashboard in slice 2, so REQ-DOCS-122's validator applies to it exactly as to a page."
  dependencies:
    - REQ-DOCS-115
  decisions:
    - "Decided a first-class glossary (round 1): one file, one-line definition, exact spelling, and the explainer that covers it. The writer uses terms exactly as defined."
    - "Decided the writer PROPOSES and Keith APPROVES (round 3). New or changed terms appear in the brief, Keith approves them at the brief checkpoint, and only then are they added, so the glossary cannot drift without him seeing it."
    - "Canon from the naming session, canonical then aliases - demote, always with its destination (to staging or to rejected), alias un-decide; substitute and substituted, aliases standing in and last good one; inherit, distinct from substitute because nobody decides it; carry forward RETIRED, because it also means supplies for the following period; resupply means an arrival into a filled slot; supply calendar, alias delivery calendar; in development, aliases pre-agreement, calendar-less, not yet agreed; sample reserved for the practice-data asset shape; recency for the check category, alias ODCS timeliness; acknowledge for amber, alias accept; overdue, no data, recency and freshness distinct, with stale an alias of no data; delivery, arrival and supply distinct; QA run and trial (never 'trial run'); waiting on a person, with blocked kept for a healthy table whose check cannot run because a neighbour is missing or held; period, alias cycle; In place on, alias as of."
    - "Decided 'early', 'on time' and 'late' are only ever about arrivals, and 'recency' is the content check, so 'timeliness' never appears unqualified."
    - "Decided the built status-inferred resupply chain (REQ-QAC-008) is NOT explained (triage #27, 'explain the new model instead'). This overrode the naming session's note that it would be explained separately."
    - "Decided (re-baseline) 'delivery agreement' and 'supply calendar' are nested and both kept - the agreement is what we agreed with a supplier (REQ-PIPE-110), the calendar is the schedule of periods and due dates inside it. Noted that 'supply calendar' had zero uses anywhere at the time; 'reconcile' and 'stand on' are established words and 'stand on' is an alias."
    - "Decided readers only ever see 'QA run'; run_id and rehearsal-versus-real stay out of the explainers as tooling."
    - "Decided the three placeholder asset-shape names are named by how supplies arrive (round 15), entered as draft, and approved by Keith."
    - "Decided the glossary may double as a quick-reference panel in the dashboard tab - built in explainers slice 2, not here."
  open_questions:
    - "The glossary's FORMAT - markdown with one structured line per entry, or a YAML data file rendered to glossary.md - is left to delivery-architect. Constraint: one source of truth that both REQ-DOCS-121's check and slice 2's panel parse, and that reads well on GitHub."

- id: REQ-DOCS-120
  title: The concept map lives in a committed file, not in a plans entry
  date_written: "2026-09-29"
  story: "As whoever starts the next /explain run, I want the agreed groups, reading order and page list in one committed file, so that tiering decisions survive plans/explainers.md being deleted and nobody re-derives which concept gets its own page."
  moscow: could
  status: not_started
  source: "delivery-scoper, found by the carry-over check over plans/explainers.md item 4 and THE PAGE LIST in item 3, 2026-09-29. Proposed rather than asked for - Keith has not asked for this file."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold the explainers' concept map in one committed file under docs/explainers/."
    - "THE SYSTEM SHALL list the groups in their numbered reading order, from 0 (the overview) to 9 (looking back)."
    - "THE SYSTEM SHALL list, for each group, its concept pages in reading order, and for each page the concepts it carries as sections."
    - "THE SYSTEM SHALL list the concepts that are glossary-only, and SHALL list each excluded concept with where it went - the pipeline docs, parked, or not explained."
    - "THE SYSTEM SHALL record each group page's four required parts - a big-picture story with the cast, one overview diagram, concept cards in reading order, and 'read first' prerequisites."
    - "THE SYSTEM SHALL NOT change the concept map without Keith's approval."
  non_functional_requirements:
    - "This exists for the carry-over rule in CLAUDE.md, not for readers: explainers are documentation and get no requirement each (round 1), so once plans/explainers.md item 4 is deleted, nothing else holds 32 tiering decisions made one by one with Keith."
    - "It is configuration, not state - authored, reviewed, and the same for two people with no data - so it belongs in git under the standing rule."
  dependencies:
    - REQ-DOCS-119
  decisions:
