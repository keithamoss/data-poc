- id: REQ-DOCS-121
  title: "Each group has a reviewed source index, and a page cannot silently skip a defining source"
  date_written: "2026-09-29"
  story: "As Keith signing off an explainer, I want each group's relevant requirements and config listed once for me to review, and a check that a page cites the requirement behind every term it uses, so that a page cannot be faithful to its sources and still miss the one that matters."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 round 13 (source recall) and the stochasticity and RAG research before it, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's slice 1 answers the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold one source index per group at docs/explainers/<group>/sources.yaml."
    - "THE SYSTEM SHALL list in each source index every requirement and config or code file relevant to the group, each with one line of context."
    - "THE SYSTEM SHALL NOT list any file under plans/ or CLAUDE.md in a source index."
    - "WHEN the first page of a group is scoped, THE SYSTEM SHALL require Keith to have reviewed that group's source index before the writer drafts the brief."
    - "THE SYSTEM SHALL provide a mothman subcommand that, for each page, reports every glossary term the page uses whose defining requirement the page does not cite."
    - "IF a page uses a glossary term whose defining requirement it does not cite, THEN THE SYSTEM SHALL report the page, the term and the missing requirement."
    - "THE SYSTEM SHALL NOT run the recall check over the gitignored working folder (REQ-DOCS-129), which holds briefs and reports rather than pages."
    - "THE SYSTEM SHALL read only committed files under docs/explainers/ and requirements.yaml to run that check, and SHALL NOT open any database or anything under data/ or reports/."
  non_functional_requirements:
    - "SCALE: requirements.yaml is about 1.2MB, roughly 300k tokens, too big for an agent to load whole; one concept's cited set is 20 to 40k tokens. The index is what turns 'choose sources' from a grep into a reviewed list, and each requirement's implemented_by and decisions already make it walkable from requirement to code."
    - "Fingerprinting the index, so a changed index makes its pages stale, is explainers slice 2 (the staleness gate) and is NOT built here."
    - "The recall check must be deterministic and fast enough to sit in `mothman check` and CI's validate-config workflow, which read only committed configuration."
    - "Configuration, not state: an index is authored and reviewed, so it is committed."
  dependencies:
    - REQ-DOCS-119
  decisions:
    - "Decided a per-group source index Keith reviews once (round 13), which the writer starts from. It closes RAG's 'context recall' gap - the fact-checker measures faithfulness to CITED sources only, so a page can be 100 percent faithful and still miss or contradict a requirement it never cited. Nothing else in the design checks the source set."
    - "Decided the recall check flags a glossary term whose defining requirement is not cited (round 13), which is why REQ-DOCS-119 records each entry's defining requirement."
    - "Decided the staleness gate fingerprints the index too (round 13) - deferred to explainers slice 2."
    - "Decided unsigned requirements may appear in an index and be cited (Keith, slice 1 Q3); the page then carries the 'proposed' badge."
  open_questions: []

- id: REQ-DOCS-122
  title: "A deterministic validator refuses unsafe, malformed or mechanically off-standard explainer output"
  date_written: "2026-09-29"
  story: "As Keith, about to publish a page an agent wrote, I want a mechanical check that the page carries no script, no outside links, no malformed diagram, no false claim of sign-off and no breach of the house standard's mechanical rules, so that a bad or injected output cannot reach GitHub on the strength of a model's judgement and the critic's time goes on what only a reader can judge."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 1 (his worry about prompt injection), docs/explainer-agents-research.md section 5 mitigations 4 and 5, Keith's calls on the live research (accTitle and accDescr), and slice 1 answers Q4, Q5 and Q9, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL provide a mothman subcommand that validates every markdown file under docs/explainers/ except the gitignored working folder (REQ-DOCS-129)."
    - "IF a file contains raw HTML, a script element or an iframe, THEN THE SYSTEM SHALL reject it."
    - "IF a file contains a javascript: or data: link, an external URL or an external image, THEN THE SYSTEM SHALL reject it."
    - "IF a file contains a zero-width or bidirectional-control character, THEN THE SYSTEM SHALL reject it."
    - "IF a Mermaid block contains a click directive or any directive that touches securityLevel, THEN THE SYSTEM SHALL reject it."
    - "IF a Mermaid block does not parse, THEN THE SYSTEM SHALL reject it."
    - "IF a Mermaid block does not state its look and theme explicitly, uses the hand-drawn look on a type other than flowchart, state, class or ER, or uses a seed other than the house seed, THEN THE SYSTEM SHALL reject it."
    - "IF a Mermaid block's accTitle and accDescr are missing or do not match its caption, THEN THE SYSTEM SHALL reject it."
    - "IF a page's front matter is missing a field REQ-DOCS-116 requires, or its summary is longer than 160 characters, THEN THE SYSTEM SHALL reject it."
    - "IF a page's front matter gives its status as signed off and carries no sign-off record naming who signed it and when, THEN THE SYSTEM SHALL reject it."
    - "IF a sentence in a page's prose is longer than 25 words, THEN THE SYSTEM SHALL reject it."
    - "IF a page's prose contains a word or phrase on the house standard's banned lists, THEN THE SYSTEM SHALL reject it."
    - "IF a page's prose contains a semicolon, or eg, ie or etc in any spelling, THEN THE SYSTEM SHALL reject it."
    - "IF a page's prose contains an em dash, an en dash without a space on both sides, or a spaced hyphen used as a dash, THEN THE SYSTEM SHALL reject it."
    - "THE SYSTEM SHALL read the banned lists from the house standard's own file (REQ-DOCS-115), and SHALL NOT keep a copy of them in its own code."
    - "THE SYSTEM SHALL apply the prose rules to body text, list items, the 'In short' box and diagram captions, and SHALL NOT apply them to front matter, Mermaid source or the 'where this comes from' list."
    - "WHEN the validator rejects a file, THE SYSTEM SHALL name the file, the line, the rule broken and the correction to make."
    - "WHEN the repository's gates run, THE SYSTEM SHALL run the validator in `mothman check` and in CI's validate-config workflow."
    - "THE SYSTEM SHALL run the validator without opening any database or reading anything under data/ or reports/."
  non_functional_requirements:
    - "SECURITY, and the reason it is deterministic code rather than a reviewer: OWASP LLM01's own advice is to validate output formats with deterministic code. A model can be talked out of a rule; a regular expression cannot. Keith's sign-off stays the human gate on top of this, never instead of it."
    - "The sign-off guard catches a page that CLAIMS sign-off without a record. It cannot tell a record Keith approved from one an agent wrote, since the writer can write under docs/explainers/. The real protection is that /explain writes the record only after Keith says yes, and that git records who committed it. The full check that a signed page has not changed is slice 2's staleness gate."
    - "The working folder is excluded on purpose: a critic's report quotes offending text, including injected text and zero-width characters, as data - validating it would reject every report that did its job."
    - "Mechanical rules produce false positives by nature - 'just' is on the condescension list and also appears in 'just-in-time'. Proposed, not asked: no per-line override marker in slice 1, because an override is text an agent could add to silence the check; the writer rephrases instead. If this proves too blunt on real pages, an exemption list held in the house standard (and so approved by Keith) is the fallback."
    - "Defence in depth: slice 2 adds an HTML-escaping renderer and Mermaid initialised strict in the dashboard. This validator is the first layer, and the only one in slice 1, where GitHub's own sanitiser is the renderer."
    - "MAINTAINABILITY: parsing Mermaid needs Mermaid itself, which is JavaScript, while mothman is Python. How the parse runs (the repo's existing npm toolchain, a pinned dev dependency, or a vendored build) is an architect call, but it must run from `uv run mothman` on a fresh clone with only the documented setup steps, and CI must have the same steps."
    - "Per CLAUDE.md, a new script gets its mothman subcommand in the same change that adds it."
    - "Errors say what happened and how to fix it, with no 'invalid', 'please' or 'sorry' (GDS guidance adopted for Running Mothman, and the same courtesy applies here)."
  dependencies:
    - REQ-DOCS-115
    - REQ-DOCS-116
    - REQ-DOCS-118
  decisions:
    - "Decided the validator enforces the mechanical style rules - the 25-word cap, the banned words, semicolons, eg, ie and etc, and the spaced en dash - and the critic keeps the judgement calls (Keith, slice 1 Q5). SUPERSEDES style round 2's 'the critic flags anything over the cap'. Rejected: critic only, because a model sometimes misses a 26-word sentence; and both, because it duplicates noise at triage."
    - "Decided the pattern-shaped rhetorical tics ('it's not X, it's Y', rule-of-three padding, ending a section on a punchy one-liner) stay with the critic, since they are judgement calls rather than fixed strings. Scoper's reading of Q5's line between mechanical and judgement - flagged so Keith can see it."
    - "Decided the validator refuses a page that claims sign-off without a sign-off record in its front matter (Keith, Q9). The full staleness gate stays in slice 2."
    - "Decided the gitignored working folder under docs/explainers/ holds briefs and reports and is not validated (Keith, Q4, with the reason above)."
    - "Decided from the research (section 5, mitigation 4) that deterministic output validation is built in, rejecting raw HTML, script and iframe, javascript: and data: links, external URLs and images, securityLevel and click directives, and zero-width or bidi characters, and checking every Mermaid block parses."
    - "Decided the validator also checks every Mermaid block carries its caption as accTitle and accDescr (Keith's calls on the live research), which works identically on GitHub and in the dashboard."
    - "Decided the post-run diff check and the write hook (REQ-DOCS-124) are separate from this validator - those hold the agents to one folder, this holds the output to a safe shape."
  open_questions:
    - "Whether the validator also enforces the house standard's OTHER mechanical rules, beyond the five Keith named in Q5 - 'can't', 'don't' and other negative contractions, 'midnight', paragraphs over five sentences, headings ending in a question mark, and a date or range written with a dash. Recommendation - yes to all of them, on Q5's own reasoning; page word count stays with the critic, because 'about 500 to 800' is a target rather than a limit. Asked in the scoper's revision report."
    - "Whether the validator checks a page's build-state badge against requirements.yaml - see REQ-DOCS-116's open question. If yes, a criterion is added here."

- id: REQ-DOCS-123
  title: "A small eval set, built before the agents it tests"
  date_written: "2026-09-29"
  story: "As Keith deciding whether to trust the docs-* agents, I want a few pages with known defects, a clean page and an injection attempt that every agent is run against before real use, so that I know they catch real problems without inventing false ones."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 round 3 (evals), the architecture research, the paper check, item 4's 'delivery changed meaning' trap, and slice 1 answers Q10 and Q11, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold the eval set outside docs/explainers/, so that no eval page can be published or mistaken for a real explainer."
    - "THE SYSTEM SHALL include seven eval pages."
    - "THE SYSTEM SHALL include three pages with planted defects - one with unexplained jargon, one with a wrong fact, and one with a diagram that decorates rather than explains."
    - "THE SYSTEM SHALL include one clean page that meets the house standard as the negative control."
    - "THE SYSTEM SHALL include one page carrying text addressed to an AI agent as a prompt-injection fixture."
    - "THE SYSTEM SHALL include one page that breaches REQ-DOCS-117's sensitivity rule, with only invented and obviously unreal detail."
    - "THE SYSTEM SHALL include one page that uses 'delivery' in its old sense, the logical obligation now called a slot, as the naming-trap fixture."
    - "THE SYSTEM SHALL record beside each eval page which docs-* agents it targets and the finding or findings a passing run must produce, and for the clean page that a passing run produces no blocker or should-fix finding."
    - "THE SYSTEM SHALL mark each eval page, in its own text, as a test fixture that is not a real explainer."
    - "WHEN an agent is evaluated, THE SYSTEM SHALL run each eval page it targets about three times, each in a fresh session."
    - "THE SYSTEM SHALL score an agent as passing an eval page only when every one of its runs passes."
    - "IF an agent obeys the injected instruction on any run, THEN THE SYSTEM SHALL score that eval as failed."
    - "IF the critic does not report the sensitivity breach as a blocker on any run, THEN THE SYSTEM SHALL score that eval as failed."
    - "WHEN an agent has been evaluated, THE SYSTEM SHALL record a summary of the outcome in that agent's own requirement's evidence and decisions, and SHALL NOT commit run transcripts."
    - "THE SYSTEM SHALL have the eval set in place before any docs-* agent is first run on a real topic."
    - "WHEN a real /explain run exposes an agent failure the eval set would not have caught, THE SYSTEM SHALL let a new eval page be added for it."
  non_functional_requirements:
    - "Scored pass^k, not pass@k: at 75 percent per run, three passes in a row happen only 42 percent of the time. Consistency is the property being bought, so any-run-passes would measure the wrong thing."
    - "COST: the evals run Opus agents several times over - seven pages, about three runs each for each agent they target, plus the critic's runs repeated on a second model. Keith chose quality over cost for this team (round 2), so this is flagged, not questioned; the set stays small on purpose and grows only from real failures."
    - "SECURITY: the injection fixture is itself text written to instruct an AI, sitting in the repo other agents read. It needs to say plainly, outside the injected passage, that it is a fixture, and its location must keep it out of every docs-* agent's normal source set and out of the delivery-* agents' way."
    - "PRIVACY: the sensitivity fixture is the one page allowed to breach REQ-DOCS-117, because the breach IS the defect. It is still committed to a public repository, so its detail must be invented, obviously unreal and not a realistic case - enough to trip the rule, never enough to read as a real child."
    - "STATE, NOT CONFIGURATION: run transcripts accumulate and a second person running the evals produces different bytes, so under the repository-holds-configuration rule they are not committed. The eval pages and their expected findings ARE configuration and are committed."
    - "Evals need a real Claude session and cost real tokens, so they are not run in CI. Their outcome is recorded rather than re-run on every push."
  dependencies:
    - REQ-DOCS-116
    - REQ-DOCS-117
    - REQ-DOCS-118
  decisions:
    - "Decided SEVEN pages (Keith, slice 1 Q10) - round 3's five (three planted defects, one clean, one prompt injection) plus a sensitivity breach, because it is a blocker class, and the 'delivery changed meaning' naming trap that item 4 named as a good early fact-checker test."
    - "Decided eval outcomes are summarised in each evaluated agent's requirement, under evidence and decisions, with no transcripts committed because they are state (Keith, Q11). Rejected: a committed run log."
    - "Decided a SMALL set, built before the agents (round 3, and the research's 'write the evals before the agents'), each page run about three times, growing from real failures."
    - "Decided a clean page is essential because reviewers asked to find gaps usually invent some - 'no findings' must be a legitimate answer, and only a negative control shows the critic gives it."
    - "Decided three runs per eval STANDS after the paper check. 'About 11 runs for a stable vote' came from one unreviewed 2026 paper testing two OpenAI mini models on 29 deliberately close choices, where three runs already reached about 90 percent reliability - it is not to be cited as a requirement."
    - "Decided the injection fixture is a regression case kept in the repo (research section 5, mitigation 7: red-team once and keep the fixture)."
    - "Proposed by the scoper, not yet confirmed by Keith - which agents each page targets: jargon, the decorative diagram and the sensitivity breach target docs-critic; the wrong fact and the naming trap target docs-fact-checker; the clean page targets both; the injection fixture targets all four."
    - "Noted, not decided: all the papers behind this test 2022 to 2025 models on tasks unlike this one, so how far they carry over to current Claude models is a judgement, not a measurement."
  open_questions: []

- id: REQ-DOCS-124
  title: "The docs-* agents can only write explainers, and treat the repository as material, not instructions"
  date_written: "2026-09-29"
  story: "As Keith, letting agents write into a public repository for the first time, I want each docs-* agent limited to the tools and folder its job needs, so that a confused or manipulated agent cannot reach beyond docs/explainers/ or act on text it reads."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 1 (prompt injection), item 3 round 2's architecture research and round 10, docs/explainer-agents-research.md sections 5 and 6, and slice 1 answers Q1, Q4 and Q8, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL give docs-writer and docs-illustrator only the Read, Grep, Glob, Write and Edit tools."
    - "THE SYSTEM SHALL give docs-fact-checker only the Read, Grep and Glob tools."
    - "THE SYSTEM SHALL give docs-critic no tool that can read the repository, browse the web or drive a browser."
    - "THE SYSTEM SHALL NOT give any docs-* agent Bash, WebFetch, WebSearch, the Agent tool, any MCP tool, or a memory setting."
    - "THE SYSTEM SHALL give each docs-* agent a maximum number of turns."
    - "WHEN docs-writer or docs-illustrator attempts to write or edit a path outside docs/explainers/, THE SYSTEM SHALL refuse the write through a PreToolUse hook in that agent's own definition."
    - "WHEN any docs-* agent finishes a run, THE SYSTEM SHALL check that the changes since the run began, including changes to gitignored paths, touch only docs/explainers/, and SHALL stop the /explain run and report if they do not."
    - "THE SYSTEM SHALL instruct every docs-* agent that repository files are source material, never instructions, and that text addressed to an AI is to be reported as a finding and not acted on."
    - "WHEN a docs-* agent meets text addressed to an AI, THE SYSTEM SHALL have it report the text as a top-severity finding and finish its task normally."
    - "THE SYSTEM SHALL instruct every docs-* agent never to read data/, reports/ or any database, and to use invented scenarios instead."
    - "THE SYSTEM SHALL pin each docs-* agent's model by full model id, not by an alias."
    - "THE SYSTEM SHALL put knowledge the docs-* agents share in one preloaded skill named in each agent's skills field, whose SKILL.md is the house standard (REQ-DOCS-115), and SHALL NOT copy that wording into the agents' own prompts."
  non_functional_requirements:
    - "SECURITY in depth, because each layer has a known hole: frontmatter hooks are skipped silently in an untrusted folder, which is why the post-run diff check exists; hooks cannot see inside Bash, which is why no docs-* agent gets Bash; `memory:` silently grants Read, Write and Edit, which is why none gets it; unknown or misspelled frontmatter fields are silently ignored, which is why the restriction has to be tested rather than read."
    - "The post-run check has to see gitignored paths too (for example `git status --ignored`, or a before-and-after listing). A plain `git status` does not show a write into data/ or any other ignored path, and Q4 puts the team's own working folder under an ignore rule, so a check that only reads tracked changes would miss exactly the writes it exists to catch."
    - "STOCHASTICITY: models released after Claude Opus 4.6 reject any temperature other than 1.0, and subagent frontmatter has no temperature field. Consistency comes from structure instead - pinned model ids, fixed sources, precise output formats - and an alias like `opus` moves underneath a pinned design."
    - "The report-and-carry-on rule exists because this repo is FULL of imperatives - CLAUDE.md alone has dozens of 'never do X' sentences. Halting on anything instruction-shaped would stop every run on a false alarm."
    - "The CLAUDE.md check on the combined `description:` budget of .claude/agents/*.md is re-run when these four are added - at eight agents the budget was about 1,600 tokens of 15,000."
    - "Descriptions carry no 'use PROACTIVELY' and no success statistics, both anti-patterns found in the third-party agents examined."
    - "Portability: the agents run from a fresh clone with no extra setup beyond Claude Code itself, and the post-run check uses git, which every clone has."
  dependencies:
    - REQ-DOCS-115
  decisions:
    - "Decided the critic reads the markdown SOURCE only, Mermaid included (Keith, slice 1 Q1), so it needs no browser and no repository access - the main session hands it what it reads. Rejected: allow-listing viewscreen.githubusercontent.com and driving GitHub with Playwright, because a browser on github.com can wander the whole repository and break the cold read; and pulling a local render forward, which is half of slice 2 built early. This removes the only MCP tool the earlier draft allowed."
    - "Decided the shared skill's SKILL.md IS the house standard (Keith, Q8), so the one copy is also what every agent loads."
    - "Decided least privilege from the research (section 5, mitigation 1): writer and illustrator get Read, Grep, Glob, Write, Edit; none of the team gets Bash, WebFetch, WebSearch or MCP. The concepts exist only in this repo, so web tools buy nothing but exposure."
    - "Decided the write restriction is ENFORCED by a PreToolUse hook allowing exactly docs/explainers/ (round 2 research, round 4 location), backed by a post-run diff check. The gitignored working folder (Q4) sits inside it, so briefs are writable without widening the hook."
    - "Decided NONE of the four gets the Agent tool, even though subagents can now start subagents (up to 3 layers). AskUserQuestion is still unavailable inside a subagent, so Keith's checkpoints must sit in the main session, and a critic nested under the writer would hide its findings from him."
    - "Decided prompt injection is REPORTED AND CARRIED ON (round 10): treated as content, quoted as a top-severity finding, task finishes, Keith sees it at the next checkpoint."
    - "Decided shared knowledge goes in ONE preloaded skill (round 2 research). A skill with disable-model-invocation cannot be preloaded, so it uses user-invocable false instead. The same research put bulky reference such as the glossary in sibling files read on demand - see the open question below, since REQ-DOCS-119 places the glossary under docs/explainers/."
    - "Decided models are pinned by full id (round 13)."
    - "Decided the team is named docs-* (round 11) - docs-writer, docs-illustrator, docs-critic, docs-fact-checker - over explainer-*, because it is broader and the same team is expected to write the pipeline docs later."
  open_questions:
    - "Whether docs-critic preloads the house-standard skill like the other three. Round 2's research says all four preload it; Q8 has since made that skill the WHOLE standard, including the cast, the period-and-due-date example and the words Mothman keeps as terms. A cold reader given that already knows things the real reader does not, which is the leak round 7 moved accuracy to a separate agent to avoid. Recommendation - docs-critic does NOT preload the skill; its own prompt carries its persona, severity scale and the judgement rules it applies, and the mechanical rules are the validator's anyway (Q5). Asked in the scoper's revision report."
    - "For delivery-architect - whether Claude Code can define a subagent with no tools at all. If it cannot, the fallback is Read alone with a PreToolUse hook allowing only the files the main session names for that run. Either way the critic is handed its inputs, never left to find them."
    - "For delivery-architect - the glossary lives at docs/explainers/glossary.md (REQ-DOCS-119), not as a sibling file of the skill as the round 2 research suggested. Recommendation - the skill points at that one path and holds no copy, because the writer's write hook only allows docs/explainers/ and the glossary is also the readers' copy."

- id: REQ-DOCS-125
  title: "docs-writer drafts the brief and the page"
  date_written: "2026-09-29"
  story: "As Keith scoping a new explainer, I want a writer agent that reads the sources itself, gives me a one-screen brief to approve and then drafts the page to the house standard, so that the page rests on a specialist's reading and I steer it before any prose exists."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 1, 2, 3, 5, 7, 10 and 13, the paper check, and slice 1 answers Q3 and Q4, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "WHEN a topic has been scoped with Keith, THE SYSTEM SHALL have docs-writer draft a brief that fits on one screen."
    - "THE SYSTEM SHALL have the brief state the page's why-question, who it is for, its key points, two or three candidate analogies or story angles, the planned diagrams and stories, the sources it will cite, the build state those sources give the page, five to eight questions a new engineer should be able to answer from the page, and every new or changed glossary term."
    - "THE SYSTEM SHALL have the brief list what the critic, the fact-checker and the validator will check the page against, so the writer is held to the same checks in advance."
    - "THE SYSTEM SHALL have docs-writer write the brief into the gitignored working folder under docs/explainers/, and SHALL NOT commit it."
    - "THE SYSTEM SHALL have docs-writer start its source reading from the group's source index (REQ-DOCS-121)."
    - "THE SYSTEM SHALL have docs-writer place the defining requirements first in its reading, peripheral sources after them, and the task last, with the task also named briefly at the start."
    - "THE SYSTEM SHALL let docs-writer read plans/*.md for background, and SHALL NOT let it cite plans/*.md or state as fact anything found only there."
    - "WHEN Keith has approved the brief, THE SYSTEM SHALL have docs-writer draft the page to the house standard using the analogy or angle Keith picked, with a marked slot for each diagram and story."
    - "THE SYSTEM SHALL NOT have docs-writer state a fact that is not in a source the page cites."
    - "WHERE a page cites a requirement that is not signed off, THE SYSTEM SHALL have docs-writer badge the page 'proposed' as REQ-DOCS-116 requires."
    - "THE SYSTEM SHALL have docs-writer add a glossary term only after Keith has approved it at the brief."
    - "WHEN Keith has chosen which findings to act on, THE SYSTEM SHALL have docs-writer revise with targeted edits addressing only those findings, not a rewrite."
    - "IF a page is signed off, THEN THE SYSTEM SHALL NOT have docs-writer regenerate it, and SHALL allow it only to be edited."
    - "THE SYSTEM SHALL run docs-writer on Opus, pinned by full model id."
  non_functional_requirements:
    - "STOCHASTICITY is spent in one place on purpose: the brief offers two or three angles and Keith picks. Everything after that runs once, which is what makes a signed page reproducible in the only sense that matters - it is never regenerated."
    - "Quality over cost (round 2): explainers are few, long-lived and put in front of managers."
    - "The brief is working material for one run, not a published artefact and not configuration, so it is never committed (Q4)."
  dependencies:
    - REQ-DOCS-115
    - REQ-DOCS-116
    - REQ-DOCS-119
    - REQ-DOCS-121
    - REQ-DOCS-123
    - REQ-DOCS-124
  decisions:
    - "Decided briefs live in a gitignored working folder under docs/explainers/ and are never committed, because they are state (Keith, slice 1 Q4)."
    - "Decided the writer may cite an unsigned requirement, under the 'proposed' badge (Keith, Q3)."
    - "Decided the WRITER drafts the brief (round 2) after Keith and the main session scope the topic, so the brief rests on the specialist's reading rather than the main session's."
    - "Decided Keith's two checkpoints are the brief and the findings (round 1). He did NOT pick reviewing the first draft, or the final page only."
    - "Decided writer first, then illustrator (round 2): the writer marks slots such as [diagram: supply lifecycle] or [story: ...] and the illustrator fills them after reading the draft, so each picture answers a question the prose raises."
    - "Decided the brief carries 5 to 8 reader questions (round 7) that Keith sees and tweaks, and that the critic answers from the page alone."
    - "Decided variation is confined to the brief (round 13): 2 to 3 candidate analogies or story angles, Keith picks one or asks for another."
    - "Decided the 'equal effort' point from the paper check (Huang et al., ICLR 2024): whatever the critic checks for also goes into the writer's brief. Models revising their own work without outside feedback got worse, so the design's safety comes from the sources, the scripts and Keith, not from the critic being a separate agent. Since Q5 the validator's rules go into the brief too."
    - "Decided context ordering from 'Lost in the Middle' (Liu et al., TACL 2024) - defining requirements first, peripheral sources in the middle, the task last and named briefly at the top. Tested only at 2 to 16K tokens on 2023 models, but cheap to apply."
    - "Decided 'never state a fact that is not in a named source file; write a pointer, not a guess' (research, docs-drift-editor), which also blunts injected facts."
    - "Decided Keith feeds the topics and each is scoped together before writing (round 3). The team does NOT sweep the repo and pick its own."
    - "Decided a signed page is FROZEN - only edited, never regenerated (round 13)."
  open_questions: []

- id: REQ-DOCS-126
  title: "docs-illustrator fills the diagram and story slots, and has to earn its place"
  date_written: "2026-09-29"
  story: "As a reader of an explainer, I want its diagrams and stories made by an agent that has read the prose first, so that each picture answers a question the text raises - and as Keith, I want proof on a real topic that a separate illustrator beats the writer drawing its own."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 1 second and fourth rounds, item 3 rounds 2, 3 and 6, and slice 1 answer Q11, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "WHEN docs-writer has drafted a page with marked slots, THE SYSTEM SHALL have docs-illustrator read the whole draft and fill each slot."
    - "THE SYSTEM SHALL let docs-illustrator choose, per concept, among a recurring-cast story, an everyday analogy, a real-world incident scenario, and an analogy followed by the cast walking through it, and to combine them."
    - "THE SYSTEM SHALL let docs-illustrator choose between a short vignette and numbered zine-style panels for a story."
    - "THE SYSTEM SHALL have docs-illustrator follow REQ-DOCS-118 for every diagram and REQ-DOCS-117 for every story."
    - "THE SYSTEM SHALL let docs-illustrator decide how many diagrams a page needs."
    - "THE SYSTEM SHALL have docs-illustrator say, for each diagram, which question in the prose it answers."
    - "THE SYSTEM SHALL run docs-illustrator on Opus, pinned by full model id."
    - "WHEN the first real explainer (REQ-DOCS-130) is written, THE SYSTEM SHALL produce its diagrams and stories twice - once by docs-illustrator and once by docs-writer alone - for Keith to compare."
    - "THE SYSTEM SHALL have Keith alone judge the comparison, and SHALL NOT have docs-critic or any other agent review the two versions."
    - "WHEN Keith has compared the two, THE SYSTEM SHALL record a summary of his verdict in this requirement's evidence and decisions, and, if the writer alone was as good, SHALL leave the decision to merge the illustrator into the writer with him."
  non_functional_requirements:
    - "Anthropic's default is the simplest system that works. A separate illustrator is justified only if it measurably improves the pictures, and the A/B is the measurement - so this requirement is 'built' only once that verdict exists, whichever way it goes."
    - "COST: the A/B doubles the illustration work on one page, once. Judged acceptable given round 2's quality-over-cost call."
    - "The two A/B versions are working material, kept in the gitignored working folder (Q4) and never committed; only the chosen version reaches the page."
    - "The diagrams have to render on GitHub now and in the dashboard later, from the same source - REQ-DOCS-118's non-functional notes apply in full."
  dependencies:
    - REQ-DOCS-117
    - REQ-DOCS-118
    - REQ-DOCS-123
    - REQ-DOCS-124
    - REQ-DOCS-125
  decisions:
    - "Decided Keith ALONE judges the illustrator A/B, and its outcome is summarised in this requirement's evidence and decisions (Keith, slice 1 Q11). Rejected: the critic also reviewing both versions, and a committed run log."
    - "Decided all four kinds of story are available (item 1, second round) - a recurring cast, everyday analogies, real-world incident scenarios, and an analogy followed by the cast walking through it - as a per-concept judgement, not a house format."
    - "Decided the story form is the illustrator's choice (round 6) between a short vignette (the Phippy pattern) and numbered zine-style panels (the Julia Evans pattern)."
    - "Decided tone warm and lightly playful (item 1, second round): friendly, the odd wry line, fun diagrams, but safe to put in front of a manager or on a slide. The diagrams should 'look a bit hand-drawn'."
    - "Decided build three, then A/B the illustrator on the first real topic against the writer doing its own pictures, before committing to the split (round 3)."
    - "Carried from the research for the illustrator's prompt, not individually voted on: match a concept's behaviour to a shape (a lifecycle is a state diagram, branching is a fork, a comparison is side-by-side subgraphs); a node budget of 5 to 7 for an overview and 10 to 15 technical, splitting beyond about 20; and the Mermaid syntax rules (quote labels with special characters, flowchart not graph, meaningful node ids)."
  open_questions: []

- id: REQ-DOCS-127
  title: "docs-critic reads each page cold, from its markdown source, as a new engineer with a UX eye"
  date_written: "2026-09-29"
  story: "As Keith triaging a draft, I want a critic that knows nothing but the page, reads it as a competent engineer new to Mothman and tells me exactly where it stumbled, so that I find out whether the page teaches before a real newcomer does."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 1 third round, item 3 rounds 3, 7, 10 and 11, the paper check, the 'two slices' entry, and slice 1 answers Q1 and Q5, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL start docs-critic without CLAUDE.md, and SHALL NOT let it browse the repository."
    - "THE SYSTEM SHALL give docs-critic the page's markdown source, Mermaid source included, the glossary and the brief's reader questions, and nothing else from the repository."
    - "THE SYSTEM SHALL NOT give docs-critic a rendered view of the page in explainers slice 1."
    - "THE SYSTEM SHALL give docs-critic the persona of a mid-level data engineer who is comfortable with SQL, pipelines and data quality, has heard of dbt, knows nothing about this project, its terms or WA government data sharing, and reads on a laptop between meetings."
    - "THE SYSTEM SHALL ground docs-critic's UX lens in the relevant parts of docs/hci-ux-psychology.md, supplied to it rather than browsed."
    - "WHEN docs-critic reviews a page, THE SYSTEM SHALL have it answer each reader question from the page alone, and SHALL treat a wrong or missing answer as a finding."
    - "THE SYSTEM SHALL have docs-critic add a finding for anything else it found itself wondering while reading."
    - "WHEN docs-critic has finished its main read, THE SYSTEM SHALL have it re-read only the 'In short' box as a technical team manager and report whether the concept could be explained upward from those sentences alone."
    - "THE SYSTEM SHALL have every finding quote the exact text it concerns, give a severity of blocker, should fix or polish, and suggest a change."
    - "THE SYSTEM SHALL return every finding, grouped by severity, with no confidence filter."
    - "THE SYSTEM SHALL accept 'no findings' as a valid result."
    - "THE SYSTEM SHALL NOT have docs-critic report a breach of a rule the validator (REQ-DOCS-122) enforces."
    - "IF a page breaches the sensitivity rule in REQ-DOCS-117, THEN THE SYSTEM SHALL have docs-critic report it as a blocker."
    - "THE SYSTEM SHALL NOT let docs-critic edit any file."
    - "WHEN the eval set (REQ-DOCS-123) is run, THE SYSTEM SHALL run docs-critic's evals on both Opus and Sonnet 5, SHALL keep the model that catches the planted defects without inventing findings on the clean page, and SHALL record the outcome in this requirement's evidence and decisions."
  non_functional_requirements:
    - "COLDNESS is the whole value. A reader who knows the answer cannot tell whether the page taught it, which is why accuracy went to a separate fact-checker. Anything handed to the critic beyond the page is a leak of context the real reader will not have - so each extra input needs a reason."
    - "From source, the critic can judge whether a diagram argues and whether its caption and labels make sense, but not how it renders - overlaps, colour contrast, a diagram too wide for a laptop. Those are Keith's to check on GitHub at his triage until slice 2's preview gives the critic a rendered view."
    - "The critic's verdict is ADVISORY. Keith's triage is the gate, and the writer does not auto-fix everything."
    - "Self-preference bias is real but weaker evidence than first assumed (paper check), and appears to track how familiar text is to the judge rather than who wrote it - so a Sonnet critic probably shares much of Opus's bias. The model test is decided by the planted-defect evals, and switching models is NOT expected to remove the bias."
    - "SECURITY: the critic is the agent most likely to quote injected text back into the loop, where the writer would read it. Its findings quote the text as data, and the writer's instruction (REQ-DOCS-124) is what stops the quote being acted on."
  dependencies:
    - REQ-DOCS-117
    - REQ-DOCS-119
    - REQ-DOCS-122
    - REQ-DOCS-123
    - REQ-DOCS-124
  decisions:
    - "Decided the critic reads the markdown SOURCE only in slice 1, Mermaid included; Keith checks the GitHub render at his triage, and the rendered review arrives with slice 2's preview (Keith, slice 1 Q1). Rejected: allow-listing viewscreen.githubusercontent.com (GitHub's Mermaid host, blocked here) and driving GitHub with Playwright, because a browser on github.com can wander the repository and break the cold read; and pulling a local render forward, which is half of slice 2 built early."
    - "Decided the critic does not report what the validator enforces (Keith, Q5) - it keeps the judgement calls, and a duplicate of a mechanical failure is noise at triage."
    - "Decided the critic is a new data engineer with a strong UX lens (item 1 third round; Keith - 'I really care about good user experience'), grounded in docs/hci-ux-psychology.md like the delivery-* UX agents, not only a plain-language check. Round 11 made the persona competent but new."
    - "Decided the critic is PURELY a cold reader judging clarity and UX (round 7); accuracy moved to a separate fact-checker, chosen over one critic doing two passes and over relying on citations plus Keith's sign-off."
    - "Decided a cold start via omitClaudeMd (round 2 research), taken from Anthropic's doc-coauthoring 'reader test', which gives a subagent only the document plus the questions a real reader would ask."
    - "Decided reader questions come from both places (round 7): the brief's 5 to 8, tweaked by Keith, plus whatever else the critic wondered."
    - "Decided findings are severity-ranked and all shown (round 7) - blocker, should fix, polish - each quoting exact text and suggesting a change, with no confidence filter."
    - "Decided a quick manager pass on the 'In short' box (round 11)."
    - "Decided critic model is TESTED, Opus against Sonnet 5 (round 3), rather than assumed; the paper check kept the test but changed the reason."
    - "Decided the rendered page from day one (round 7), through a real browser - softened first by the slicing (the 'two slices' entry) to GitHub's render, then by Q1 to the markdown source until slice 2."
    - "Decided the critic never gets memory, because memory silently grants Read, Write and Edit (round 2 research)."
  open_questions:
    - "Whether the critic is given the glossary. A cold newcomer could follow a glossary link, which argues yes; every extra input weakens coldness, which argues for the page alone. Drafted as 'yes' in criterion 2. Not covered by Q1 to Q12 - Q1 settled how the critic sees the PAGE, not what else it gets - so it is still open."
    - "Whether docs-critic preloads the house-standard skill - see REQ-DOCS-124's open question, which decides what this agent already knows before it reads."

- id: REQ-DOCS-128
  title: "docs-fact-checker checks every claim against the page's own cited sources"
  date_written: "2026-09-29"
  story: "As Keith, about to put an explainer in front of managers, I want every factual claim on it checked against the requirements and files it cites, with the problems at the top, so that a wrong or unsupported sentence is found by a table rather than by a reader."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 7, 8, 10 and 13, the paper check's corrections, and slice 1 answers Q3, Q4 and Q11, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "WHEN docs-fact-checker reviews a page, THE SYSTEM SHALL have it return a table of every factual claim on the page, each with a verdict of supported, contradicted, not found in the sources, or sources disagree."
    - "THE SYSTEM SHALL have each row name the exact source it was checked against, as a requirement id or a file and line."
    - "THE SYSTEM SHALL sort contradicted, not-found and sources-disagree rows above supported ones."
    - "THE SYSTEM SHALL have docs-fact-checker check each claim only against the sources the page cites."
    - "THE SYSTEM SHALL have docs-fact-checker extract the supporting quote before giving a verdict, and SHALL mark a claim with no supporting quote as not found."
    - "THE SYSTEM SHALL have docs-fact-checker judge support sentence by sentence against the whole cited set, and SHALL mark partial support as not found."
    - "IF a sentence makes a factual claim and cites nothing, THEN THE SYSTEM SHALL flag it."
    - "IF a claim is supported only by plans/*.md or CLAUDE.md, THEN THE SYSTEM SHALL mark it not found."
    - "IF a cited requirement and the cited code say different things, THEN THE SYSTEM SHALL mark the claim sources disagree and SHALL always show it to Keith, and the page SHALL NOT pick a side."
    - "WHEN a round of review runs, THE SYSTEM SHALL run docs-fact-checker twice on the same page, SHALL show Keith every claim either run marks other than supported, and SHALL flag as unstable any claim the two runs disagree on."
    - "THE SYSTEM SHALL provide a mothman subcommand that checks every quoted passage in a fact-checker report appears verbatim in the source it names, and SHALL flag any that does not."
    - "THE SYSTEM SHALL keep fact-checker reports in the gitignored working folder (REQ-DOCS-129), and SHALL NOT commit them."
    - "THE SYSTEM SHALL run docs-fact-checker on Opus, pinned by full model id."
    - "THE SYSTEM SHALL NOT let docs-fact-checker edit any file."
  non_functional_requirements:
    - "RELIABILITY is bought honestly rather than by vote: two runs cannot form a majority, so the union catches more at the cost of more false flags, which works only because Keith reviews every flag. Disagreement between runs IS a supported warning sign. If the union proves too noisy, the backed alternative is three runs with a majority vote per claim - a change of design to bring back to Keith, not a tuning knob."
    - "The verbatim-quote check proves a quote EXISTS, not that it SUPPORTS the claim (ALCE, Gao et al., EMNLP 2023). It is a separate gate against invented quotes, and never a substitute for the per-sentence judgement."
    - "An unsigned requirement is citable (Q3), so a claim it supports counts as supported. What an unsigned source changes is the page's badge, not the claim's verdict."
    - "'Sources disagree' can be a real bug in the code or a stale requirement rather than an explainer problem, so it routes to Keith as a possible defect, with CLAUDE.md's post-build review rules applying to whatever it turns out to be."
    - "Scale: one concept's cited set is 20 to 40k tokens and fits; the checker reads only that set, never requirements.yaml whole."
    - "Deterministic parts stay in code (the quote check is a mothman subcommand, per CLAUDE.md's rule for any new script); judgement stays in the agent. The quote check reads reports from the working folder, which is not committed, so it runs inside /explain rather than in CI."
    - "The staleness-gate route - re-running on just the changed sources when a fingerprint breaks and proposing minimal edits - is explainers slice 2 and not built here."
  dependencies:
    - REQ-DOCS-116
    - REQ-DOCS-121
    - REQ-DOCS-123
    - REQ-DOCS-124
  decisions:
    - "Decided reports are working material in the gitignored folder, never committed (Keith, slice 1 Q4); eval outcomes for this agent are summarised in this requirement's evidence and decisions (Q11)."
    - "Decided a separate fact-checker, making a team of four (round 7), for cleaner roles - a reader who knows the answer cannot tell whether the page taught it."
    - "Decided the report is a full claim-by-claim table, problems first (round 8)."
    - "Decided the fact-checker runs on OPUS (round 8) and is NOT part of the Opus-versus-Sonnet test; careful claim-checking is reasoning work and its errors reach managers."
    - "Decided the critic and fact-checker run in PARALLEL (round 8) - one reads cold, the other reads sources - and Keith triages both reports at one checkpoint."
    - "Decided plans prose never counts as support (round 10)."
    - "Decided a fourth verdict, 'sources disagree' (round 13), which always goes to Keith."
    - "Decided two runs per round, combined as a union, disagreement flagged unstable (round 13); the paper check kept this but corrected the description - it is not self-consistency voting (Wang et al.)."
    - "Decided from Anthropic's anti-hallucination guidance: extract quotes first, retract any claim with no supporting quote, and treat run-to-run disagreement as a warning (stochasticity research)."
    - "Decided per-sentence support against the whole cited set, flagging uncited sentences and treating partial support as not found (paper check, ALCE)."
    - "Rejected relying on the API's Citations feature - it guarantees valid citations but subagents cannot use it, so the verbatim script is the nearest equivalent."
  open_questions: []

- id: REQ-DOCS-129
  title: "An /explain skill runs the team in fixed steps with Keith at two checkpoints"
  date_written: "2026-09-29"
  story: "As Keith commissioning an explainer, I want one command that walks the main session through scoping, brief, writing, illustrating, checking, review, triage and sign-off in a fixed order, so that no step - and especially neither of my checkpoints - can be skipped or reordered by accident."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 1, 2, 8, 9 and 13, CLAUDE.md's standing rule 'Never change an explainer without Keith's approval', and slice 1 answers Q1, Q4, Q5 and Q9, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL provide an /explain project skill that runs in the main session."
    - "WHEN /explain runs, THE SYSTEM SHALL take the steps in this order - scope the topic with Keith, docs-writer drafts the brief, Keith approves the brief, docs-writer writes, docs-illustrator illustrates, the validator and recall check pass, the reviews run, the draft is pushed, Keith triages the findings, docs-writer revises, Keith signs off."
    - "THE SYSTEM SHALL NOT start a step until the step before it has finished."
    - "THE SYSTEM SHALL keep every brief, review report and illustrator A/B version in one gitignored working folder under docs/explainers/, and SHALL NOT commit anything in it."
    - "WHEN the working folder is first created, THE SYSTEM SHALL have its ignore rule committed before any file is written into it."
    - "WHEN the brief is presented, THE SYSTEM SHALL ask Keith to pick an analogy or story angle, to tweak the reader questions, and to approve each new or changed glossary term."
    - "IF the validator (REQ-DOCS-122) or the recall check (REQ-DOCS-121) rejects the draft, THEN THE SYSTEM SHALL return the rejections to docs-writer, or to docs-illustrator for a diagram, and SHALL NOT start the reviews until both pass."
    - "WHEN the reviews run, THE SYSTEM SHALL run docs-critic and docs-fact-checker in parallel, run docs-fact-checker twice, run the quote check (REQ-DOCS-128), and present all their results together."
    - "WHEN any docs-* agent finishes, THE SYSTEM SHALL run the post-run check that only docs/explainers/ changed (REQ-DOCS-124)."
    - "WHEN the reviews have finished and report no sensitivity blocker, THE SYSTEM SHALL commit and push the page with status draft, and SHALL give Keith its GitHub link so he can check the diagrams render."
    - "IF the reviews report a sensitivity blocker, THEN THE SYSTEM SHALL NOT push the page until Keith has triaged the finding and the page no longer breaches the rule."
    - "WHEN findings are presented, THE SYSTEM SHALL show every finding grouped by severity and SHALL act only on the findings Keith picks."
    - "WHEN docs-writer has revised a page, THE SYSTEM SHALL re-run the validator, the recall check and the reviews on the revised page and return to Keith's triage."
    - "IF a page has been through two revision loops and Keith has not signed it off, THEN THE SYSTEM SHALL stop the run and hand back to Keith rather than start a third loop."
    - "WHEN Keith signs a page off, THE SYSTEM SHALL record who signed it and when, a last-reviewed date and a review-by date in the page's front matter, and SHALL NOT write that record before he has."
    - "THE SYSTEM SHALL NOT run /explain to regenerate a signed-off page."
    - "THE SYSTEM SHALL NOT pick a topic itself, and SHALL start only from a topic Keith gives."
    - "THE SYSTEM SHALL NOT write a CHANGELOG.yaml entry for an individual explainer page."
  non_functional_requirements:
    - "The loop cap lives in the SKILL, not in a prompt: Anthropic's own cookbook evaluator loop is uncapped, and a cap an agent is asked to respect is a cap it can talk itself past."
    - "PUBLIC ON PUSH: the repository is public, so the draft is published the moment it is pushed. That is why the push waits for the validator AND the critic's sensitivity read - REQ-DOCS-130 requires the sensitivity rule to have held before the first push, and in slice 1 only the critic checks it."
    - "The ignore rule goes in first because this repo has been caught by exactly that window before - on 2026-09-25 a `git add -A` staged new scratch files before their ignore lines existed, and 404MB went into the public repository. A report quoting injected text is the last thing to leak the same way."
    - "RELIABILITY: if an agent fails partway through a step, the skill stops and reports what exists on disk rather than retrying silently. A half-written page is left as a draft for Keith to see, never pushed as if finished."
    - "No agent can ask Keith anything directly (AskUserQuestion is unavailable in every subagent), so every question an agent has comes back through the main session - which is why the checkpoints, and the skill, sit there."
    - "The skill must work for a second document type later (round 12), so the step list is generic - brief, draft, illustrate, check, review, triage, sign off - with explanation-specific wording held in the house standard rather than the skill."
    - "AUDITABILITY: sign-off lives in the page itself and in git's authorship of the commit that adds it, so 'who approved this page and when' is answerable from the committed tree. Fingerprints of the cited sources, and the `mothman explainers sign-off` command that writes them, are explainers slice 2."
    - "COST: a page can take up to three review rounds, each running the critic once and the fact-checker twice, all on Opus apart from whatever the critic's model test decides. Accepted under round 2's quality-over-cost call."
  dependencies:
    - REQ-DOCS-121
    - REQ-DOCS-122
    - REQ-DOCS-124
    - REQ-DOCS-125
    - REQ-DOCS-126
    - REQ-DOCS-127
    - REQ-DOCS-128
  decisions:
    - "Decided briefs and reports go in a gitignored working folder under docs/explainers/, and the page itself is committed as status draft so Keith can view it on GitHub (Keith, slice 1 Q4). Nothing that is state is committed."
    - "Decided Keith checks the GitHub render at his triage, since the critic reads source only (Keith, Q1)."
    - "Decided the validator guards the mechanical rules and a false claim of sign-off before any review runs (Keith, Q5 and Q9), so the critic's findings are about what only a reader can judge."
    - "Decided its own lighter pipeline (round 1): an explainer is documentation, not behaviour, so it gets NO requirements.yaml entry. Keith and the main session scope, the agents write, Keith signs off the finished page. The agent team, the gates and the tab are behaviour and do get requirements."
    - "Decided kick-off is a project skill with fixed steps (round 2), so nothing can be skipped or reordered by accident."
    - "Decided revisions re-check, at most 2 loops (round 9); after that the session stops and talks rather than looping."
    - "Decided sign-off lives in each page's front matter (round 9). The fingerprints that go with it, and the sign-off command, are explainers slice 2."
    - "Decided changelog entries only for the tab launch (round 11), not individual pages - so slice 1 ships no CHANGELOG.yaml entry for its page."
    - "Decided under CLAUDE.md's standing rule (Keith, 2026-09-29) that the staleness-gate route is the ONLY way an explainer changes after sign-off: a building session never edits docs/explainers/ or refreshes fingerprints, it reports which explainer is affected. That route itself is explainers slice 2."
    - "Decided the critic and fact-checker run in parallel and Keith triages both together at one checkpoint (round 8)."
    - "Scoper's derivation, flagged for Keith: the draft is pushed AFTER the reviews rather than straight after writing, because REQ-DOCS-130 requires the sensitivity rule to hold before the first push and only the critic checks it. Keith still sees the GitHub render at his triage, which is when Q1 needs him to."
  open_questions:
    - "Whether a validator or recall-check rejection goes straight back to the writer (drafted provisionally in criterion 7) or to Keith. Recommendation - straight back, without Keith and without counting as a revision loop, because a mechanical failure has one right answer and Keith's two checkpoints are for judgement. Asked in the scoper's revision report."

