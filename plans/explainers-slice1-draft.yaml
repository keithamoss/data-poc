# DRAFT, NOT THE REGISTER. delivery-scoper's slice-1 drafts for the explainer team
# (plans/explainers.md #3). Kept here only so they survive the container;
# they move into requirements.yaml once Keith's questions are answered,
# and this file is deleted in that same commit. Nothing here is signed off.
#
# Revision 3, 2026-09-29: revised against Keith's set 4 and set 5 answers and the
# delivery-architect findings the main session adopted. Two requirements are new
# in this revision - REQ-DOCS-131 (the reader-judgement skill, from set 5's split)
# and REQ-DOCS-132 (the mechanical prose rules, split out of REQ-DOCS-122 to keep
# the validator requirement small). Their numbers assume nothing else has taken
# 131 or 132 by the time this is applied.
#
# Revision 4, 2026-09-29: a targeted pass applying Keith's set 6 answers only
# (signed-page hash, the _work/ exclusion, the reader-judgement boundary, the
# fifth 'idea' badge, turns of phrase in titles, the brief cap, the eval targets).
#
# A criterion that begins "[PROCESS]" is a human approval step. Its evidence is a
# dated sign-off record in the requirement's evidence field (who approved what,
# and when), not a linked test.
- id: REQ-DOCS-115
  title: "One approved writing standard for explainer prose, preloaded by the docs-* agents that write and check facts"
  date_written: "2026-09-29"
  story: "As whoever writes, illustrates or fact-checks an explainer, I want one approved written standard for how explainer prose reads, so that every page sounds like the same colleague and can be held to the same rules."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: "2026-09-29"
  source: "Keith, designed across plans/explainers.md item 3 (style rounds 1 to 5, the GOV.UK research, the baseline switch and the exemplar traits), 2026-09-28 to 2026-09-29, slice 1 answers Q5, Q6 and Q8, the headings refinement, and sets 4, 5 and 6, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold the explainer house standard in exactly one file, .claude/skills/docs-house-style/SKILL.md, and SHALL NOT hold a second copy of any of its rules anywhere else."
    - "THE SYSTEM SHALL have docs-writer, docs-illustrator and docs-fact-checker preload the house standard, and SHALL NOT have docs-critic preload it."
    - "THE SYSTEM SHALL keep the rules a reader judges in the reader-judgement skill (REQ-DOCS-131) and not in the house standard, so that every rule has exactly one home across the two skills."
    - "[PROCESS] THE SYSTEM SHALL NOT add, remove, renumber or reword any rule in the house standard without Keith's approval of the exact wording."
    - "[PROCESS] WHEN the house standard is first committed, THE SYSTEM SHALL amend CLAUDE.md's authoring-standard rule to name the house standard's SKILL.md and the reader-judgement skill's SKILL.md as gated files, in wording Keith has approved."
    - "THE HOUSE STANDARD SHALL name GOV.UK's writing guidance, at guidance.publishing.service.gov.uk, as its baseline, and SHALL mark each rule that is Keith's own preference layered on top of it."
    - "THE HOUSE STANDARD SHALL state the voice as a senior colleague at a whiteboard, warm, lightly playful and happy to admit where something is fiddly, using 'you' for the reader and 'we' for a choice the project made."
    - "THE HOUSE STANDARD SHALL NOT allow a pun in any heading or page title."
    - "THE HOUSE STANDARD SHALL require headings and page titles to be statements, not questions."
    - "THE HOUSE STANDARD SHALL state the mechanics Keith settled - Australian spelling, the Oxford comma always, a spaced en dash for a break in a sentence, a 25-word sentence cap with a 15 to 20 word aim, paragraphs of at most five sentences, no semicolons, no eg, ie or etc, no negative contractions of any kind while positive ones such as 'you'll' stay allowed, 'to' in ranges, '11:59pm' rather than 'midnight', dates in the '29 September 2026' form, and GOV.UK's numbers rule."
    - "THE HOUSE STANDARD SHALL mark each rule the validator enforces (REQ-DOCS-122, REQ-DOCS-132) with that rule's stable id, so that the writer knows in advance which rules fail mechanically."
    - "THE HOUSE STANDARD SHALL hold the banned words and phrases, the house handDrawnSeed and the validator's exemption list in one fenced YAML block, which the validator reads directly."
    - "THE HOUSE STANDARD SHALL require a named period to be given with its due date on first use on each page, in the form 'the 2026-Q3 period (supply due 1 August 2026)', and plain thereafter."
    - "THE HOUSE STANDARD SHALL list the banned categories that fixed strings can catch - AI-voice words, condescension, corporate filler and the fixed-phrase rhetorical tics - each with its examples."
    - "THE HOUSE STANDARD SHALL require a new term's first use on a page to be bold, defined in one plain clause in the same sentence and linked to its glossary entry, and SHALL reserve bold for that use alone."
    - "THE HOUSE STANDARD SHALL count the 'In short' box as part of the page for first use, so that a term first used in the box is defined in the box."
    - "THE HOUSE STANDARD SHALL NOT allow a heading to use an invented term before the page has defined it, except that the page title may name the page's own concept."
    - "THE HOUSE STANDARD SHALL require every invented term to be spelled exactly as its canonical glossary entry spells it, and SHALL require GOV.UK's words-to-avoid to be avoided wherever they are not a defined Mothman term."
    - "THE HOUSE STANDARD SHALL require status names in lowercase plain text, and prose first with lists only for real sets."
    - "THE HOUSE STANDARD SHALL name CHANGELOG.yaml's reader voice as the model and the internal prose of plans/*.md and CLAUDE.md as the anti-model."
    - "THE HOUSE STANDARD SHALL name Keith's four external exemplars - Julia Evans, the GDS blogs, Bartosz Ciechanowski, and Stripe and Monzo - and SHALL state the twelve writing traits drawn from them (docs/explainer-agents-research.md section 9), with traits 1, 2, 6, 7, 11 and 12 worded as the next five criteria require."
    - "THE HOUSE STANDARD SHALL word trait 7 so that real examples come only from committed configuration - period names, due dates, and dataset and table names - and any example row is invented and obviously synthetic."
    - "THE HOUSE STANDARD SHALL word traits 1 and 2 to apply to the body after the 'In short' box, so that the box stays first and the body opens on the story moment."
    - "THE HOUSE STANDARD SHALL word trait 12 so that the recap and its one pointer sit immediately before the 'where this comes from' list, which stays last."
    - "THE HOUSE STANDARD SHALL word trait 6 so that a diagram's caption is its one-line takeaway, in the caption form REQ-DOCS-118 defines, and still supplies the diagram's accTitle and accDescr."
    - "THE HOUSE STANDARD SHALL word trait 11 as warmth from the cast, small stakes and plain friendliness, with wry asides in body text, a gentle turn of phrase (not a pun) allowed in a section heading or a page title, and nothing playful in a definition."
    - "THE HOUSE STANDARD SHALL state the exemplar traits as paraphrase only, and SHALL NOT quote, excerpt or link any exemplar's text."
    - "THE HOUSE STANDARD SHALL list the exemplar habits deliberately not taken, so that none is adopted by imitation."
    - "THE HOUSE STANDARD SHALL keep its explanation-specific rules in a section of their own, so that rules for a second document type can be added beside them without restructuring the file."
  non_functional_requirements:
    - "The standard is an authoring standard in exactly the sense CLAUDE.md's standing rule means: hundreds of hand-authored sentences will be held against it, so a clause that reads one way to Keith and another to the agent applying it is the failure this gate exists for. Approval of the substance is not approval of the wording - which includes the twelve traits, the cast and the banned lists."
    - "Single copy, the same reasoning as CHANGELOG.yaml's header (REQ-DOCS-028): two copies of a style rule drift, and nothing says which one wins. Set 5's split into two skills keeps that true only if each rule has one home, which is why criterion 3 names the boundary."
    - "Rules as data: the validator reads the banned lists, the seed and the exemptions from the standard's own YAML block, and a test holds the validator's rule ids and the standard's inline markers in step (REQ-DOCS-122). A rule enforced in code therefore cannot drift from the rule Keith approved."
    - "Every rule in it should be one a reader of the finished page could check, either by eye or by the validator. A rule nobody can check is a rule each agent will interpret differently on each run."
    - "It must be readable on GitHub as plain markdown with no build step, because slice 1 has no dashboard tab. A SKILL.md with YAML front matter meets this."
    - "SECURITY: the standard lives outside docs/explainers/, so the docs-* agents' write guard (REQ-DOCS-124) already stops any of them editing the rules they are held to."
    - "No outside text in any agent's prompt: the exemplars reach the agents as paraphrased traits only, which avoids any copyright question and removes one prompt-injection route. One exemplar source (Stripe's .md docs) was found to carry a preamble addressed to AI agents, which is exactly the text this keeps out."
    - "Designed for reuse by the pipeline docs (plans/explainers.md item 2, 'Running Mothman'), but this requirement builds only the explanation rules. How-to and reference rules are item 2's own scoping."
  dependencies:
    - REQ-DOCS-131
  decisions:
    - "Decided the single copy IS a preloaded skill's SKILL.md (Keith, slice 1 Q8), at .claude/skills/docs-house-style/SKILL.md (name adopted from the delivery-architect review). Rejected: a standalone doc under docs/explainers/ that agents read on demand, which would have been a second file the skill had to point at."
    - "Decided docs-critic does NOT preload the house standard (Keith, set 4), to keep round 7's cold read - the standard carries the cast, the examples and the words Mothman keeps as terms, which a real reader does not have. This SUPERSEDES round 2's 'all four agents preload the skill' and Q8's 'the one skill every agent preloads'."
    - "Decided the standard splits into TWO skills (Keith, set 5): a small reader-judgement skill the critic preloads alone (REQ-DOCS-131), and this house standard, which the other three preload with it. Still one copy of every rule. Rejected: a named exception that copies rules into the critic's prompt."
    - "Decided CLAUDE.md's authoring-standard rule is amended to name the gated SKILL.md files (Keith, Q8), with the amendment's own wording going to Keith first like any standard. Until then the rule names only docs/check-authoring-rules.md and CHANGELOG.yaml's header."
    - "Decided the folder stays docs/explainers/, with 'Understanding Mothman' as a display title only (Keith, Q8). Rejected: renaming the folder now."
    - "Decided the validator enforces the mechanical rules and the critic keeps the judgement calls (Keith, Q5), and set 4 extended the validator to the other mechanical rules (REQ-DOCS-132). This SUPERSEDES style round 2's 'the critic flags anything over the cap'. Rejected: critic only, because a model sometimes misses a 26-word sentence; and both, because it doubles the noise at Keith's triage."
    - "Decided rules as data (delivery-architect, adopted): each validator rule has a stable id marked inline in the standard, and the banned lists, the seed and the exemptions live in one fenced YAML block the validator reads. Exemptions exist from the start and are approved by Keith as part of the standard. There is still no per-line override marker in a page, because an override is text an agent could add to silence the check."
    - "Decided all three GOV.UK rules the live research found (Keith, Q6): no heading uses a term before the page explains it; every page defines its own terms, because readers arrive from links and search rather than in order (now held in REQ-DOCS-131); and every page has a summary of 160 characters or fewer (REQ-DOCS-116's front matter)."
    - "Decided 'first use' (Keith, set 4): a page title may name its own concept, and a term used in the 'In short' box is defined in the box itself, which also keeps the box plain for a manager."
    - "Decided the exemplars are used as TRAITS, NOT TEXT (Keith, style round 4), over short quoted extracts and over a links-only list. Twelve traits were drafted from Julia Evans, the GDS blogs, Bartosz Ciechanowski, and Stripe and Monzo; their exact wording goes to Keith with the rest of the standard."
    - "Decided trait 7's 'real examples' means committed configuration only (Keith, set 4) - real period names, due dates, and dataset and table names - and any example row is invented and obviously synthetic. This keeps trait 7 consistent with REQ-DOCS-124 (no agent reads data/) and the sensitivity rule."
    - "Decided the traits and the fixed page parts are reconciled (Keith, set 4): 'In short' stays first and the body opens on the story moment; trait 12's recap and pointer sit just before the sources, which stay last; trait 6's takeaway line is the caption and still feeds accTitle and accDescr."
    - "Decided trait 11's wording follows style rounds 1 and 5 plus the headings refinement (Keith, set 4): wry asides in body text, a gentle turn of phrase (not a pun) allowed in a heading, nothing playful in definitions. The draft trait's 'keep humour in the story' is dropped, since style round 1 did not pick it."
    - "Decided headings (Keith, 2026-09-29): a gentle turn of phrase in a heading is fine and puns are still out. This refines style round 5, which took puns out of headings and titles."
    - "Decided page TITLES follow the same rule as headings - a gentle turn of phrase is allowed, a pun never is (Keith, set 6). Rejected: the scoper's recommendation that titles stay plain because search, the concept cards and slice 2's 'What's this?' links show them."
    - "Decided GOV.UK's writing guidance is the baseline (Keith, 2026-09-29, 'Fine, ignore the style manual. GovUK is a bit better anyway'), cited at guidance.publishing.service.gov.uk where it now lives. The Australian Government Style Manual was the first baseline, rejected once its own host refused scripted clients and GOV.UK's guidance was read in full. Australian spelling stays, as Keith's preference rather than a Style Manual rule."
    - "Decided NO negative contractions at all (style round 5, GOV.UK, and the research's list of habits not taken), while positive ones such as 'you'll' stay allowed. The validator enforces it (set 4)."
    - "Decided headings and titles are STATEMENTS (style round 5), reversing style round 1's 'mostly questions'. The why-question lives in the brief and the page's opening answer instead. GOV.UK's reason was accepted - question headings are hard to front-load."
    - "Decided new terms stay BOLD rather than GOV.UK's single quotes (style round 5). GOV.UK's real concern, bold used for emphasis, is met by reserving bold for defined terms only."
    - "Decided the Oxford comma ALWAYS, a deliberate departure from both the Style Manual and GOV.UK (style round 2). The spaced en dash is Keith's own too - GOV.UK has no rule for it."
    - "Decided humour narrows to wry asides in body text (style round 5), refined by the headings decision above. Not picked in style round 1 - Australian references and idiom, or keeping all the humour inside the cast's stories."
    - "Decided dates follow the '29 September 2026' form even though the dashboard has its own single date format (REQ-DASH-071). Keith chose this over matching the dashboard, accepting that an explainer and the dashboard may show a date differently."
    - "Decided numbers follow GOV.UK - 'one' in words unless it is a step or list point, numerals for everything else including 2 to 9. This closed plans/explainers.md queue item 8; the Style Manual's rule is no longer needed."
    - "Decided a named period is given with its DUE DATE on first use, not its months. The earlier answer, 'term plus months', rested on a wrong example - Mothman's quarterly periods are authored dates anchored on 1 February, May, August and November, deliberately not calendar quarters, so 2026-Q3 is not July to September. A WA reader could also read Q3 as a financial-year quarter."
    - "Decided GOV.UK's words-to-avoid that are real Mothman terms - promote, deliver, assets, issues - are KEPT as terms and defined in the glossary, rather than renamed. GOV.UK's own rule is to explain specialist terms. In general prose GOV.UK is followed ('problems', not 'issues')."
    - "Decided the internal exemplars - model CHANGELOG.yaml's reader voice, anti-model plans/ and CLAUDE.md. Not picked as a model - the check explanations from REQ-QAC-024."
    - "Decided NOT to adopt GOV.UK's separate accessible title and description per diagram as a writing rule; the diagram caption does that job (REQ-DOCS-118)."
    - "Decided the pattern-shaped rhetorical tics ('it's not X, it's Y', rule-of-three padding, ending a section on a punchy one-liner) live in the reader-judgement skill (REQ-DOCS-131), because no fixed string catches them and the critic is the agent that has to judge them. Only fixed-phrase tics such as 'here's the thing' stay in this standard's banned lists."
    - "Decided the standard is written general enough for a second document type (round 12), because the same team is expected to write 'Running Mothman' later. Only explanation rules are written now."
  open_questions: []

- id: REQ-DOCS-116
  title: "Every explainer page has the same fixed parts, a short summary and a visible build state, and cites only citable sources"
  date_written: "2026-09-29"
  story: "As a manager or a new engineer opening an explainer, I want the answer at the top, the reasoning in one place, the sources at the end and a clear sign of whether the thing described exists yet, so that I can stop reading as soon as I have what I came for and trust what I read."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: "2026-09-29"
  source: "Keith, plans/explainers.md item 3 rounds 1, 4, 5, 10 and style rounds 3 and 5, slice 1 answers Q3 and Q6, and sets 4, 5 and 6, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "THE HOUSE STANDARD SHALL leave a page's shape free-form apart from its fixed parts - the page's why-question in the front matter, an 'In short' box, a 'why it's this way' section, a recap with one pointer onward, and a 'where this comes from' list."
    - "THE HOUSE STANDARD SHALL require the 'In short' box to come first after the page title and any page badge, written as a GitHub alert block of three or four sentences."
    - "THE HOUSE STANDARD SHALL require the body after the 'In short' box to open on a story moment."
    - "THE HOUSE STANDARD SHALL require the 'why it's this way' section to hold two to four bullets drawn from the cited requirements' decisions, saying what was chosen, what was rejected, and why."
    - "THE HOUSE STANDARD SHALL require the recap and its one pointer to sit immediately before the 'where this comes from' list."
    - "THE HOUSE STANDARD SHALL require the 'where this comes from' list to be the last section of the page, to name every requirement id and config or code file the page rests on, and to name each file as plain text rather than as a link."
    - "THE HOUSE STANDARD SHALL NOT allow requirement ids, file names or code identifiers in the body of a page outside that list."
    - "THE HOUSE STANDARD SHALL require links a reader needs, to the glossary or a related page, to appear inline where they are relevant, and SHALL NOT allow them to appear only in the closing list."
    - "THE HOUSE STANDARD SHALL set a page's length at about 500 to 800 words excluding diagrams, and SHALL direct deeper detail to another page by link."
    - "THE HOUSE STANDARD SHALL define a citable source as a requirement in requirements.yaml, whether or not it is signed off, or a specific config or code file, and SHALL NOT treat any file under plans/ or CLAUDE.md as citable."
    - "THE HOUSE STANDARD SHALL define five build states - 'an idea, not designed yet', where the concept has no defining requirement at all and its glossary entry is marked as an idea (REQ-DOCS-119); and four derived from requirements.yaml - 'proposed', where the requirement is not signed off; 'designed, not built yet', where it is signed off and its status is not_started or in_progress; 'partly built', where its status is built and it has unmet_criteria; and built, where its status is built with no unmet_criteria."
    - "THE HOUSE STANDARD SHALL rank the states from least built to most built as 'an idea, not designed yet', 'proposed', 'designed, not built yet', 'partly built', built."
    - "THE HOUSE STANDARD SHALL give a page the state of its least-built cited requirement, and SHALL require a page badge directly under the title whenever that state is anything other than built."
    - "THE HOUSE STANDARD SHALL NOT allow a page badge of 'an idea, not designed yet', and SHALL NOT let an idea-badged section change the page's own state."
    - "WHERE a page mentions a concept whose glossary entry is marked as an idea, THE HOUSE STANDARD SHALL allow it only in a section badged 'an idea, not designed yet' holding exactly one sentence of prose under that badge, and SHALL exempt that one sentence from the citable-source rule."
    - "WHERE a section rests on requirements whose least-built state differs from the page's, THE HOUSE STANDARD SHALL require a section badge naming that state directly under the section's heading."
    - "WHERE a page or section is badged 'proposed', THE HOUSE STANDARD SHALL require one plain sentence saying that the design is not yet agreed and may change."
    - "THE HOUSE STANDARD SHALL require every badge to be plain markdown text that reads the same on GitHub and in the dashboard."
    - "THE HOUSE STANDARD SHALL define the front matter every page carries - the page's why-question, a summary of 160 characters or fewer, its group, its cited sources, its build state, its status as draft or signed off, and, once signed, who signed it off and when, a hash of the page as signed (REQ-DOCS-122), a last-reviewed date and a review-by date."
  non_functional_requirements:
    - "Answer-first is not decoration. GDS found concept pages are the type readers skip most, and slice 2's 'What's this?' links will land a confused reader straight onto one - the first sentence has to carry the answer on its own. The rule that it does lives in the reader-judgement skill (REQ-DOCS-131), because the critic is the one who judges it."
    - "The citable-source rule is what makes slice 2's staleness gate workable at all: plans/*.md and CLAUDE.md churn daily, and a page fingerprinting them would fail the gate constantly. Slice 1 has no gate, but a page written against the wrong rule now would need rewriting then."
    - "Badges are DERIVED, never judged: every state but one comes from requirements.yaml's status, signed_off and unmet_criteria, and 'an idea, not designed yet' comes from the concept's glossary entry, which Keith approves - so the validator can check every badge (REQ-DOCS-122). The cost, accepted by Keith in set 4, is that a building session which signs or builds a cited requirement turns CI red on a page it may not edit, until Keith approves the badge change - the same trade as slice 2's staleness gate."
    - "A 'proposed' page describes a design that sign-off may still change, so it is the page most likely to go wrong silently. Slice 2's fingerprint gate catches the requirement entry changing; in slice 1 nothing does, which is why the page must say plainly that the design may change."
    - "The front matter fields are defined now so that slice 2 only ADDS fingerprints and checking, and does not have to re-open every page already signed. The summary is there for search and for a group page's concept cards later; slice 1 only requires it to exist and fit."
    - "Compatibility: the fixed parts and the badges have to render as plain markdown on GitHub (Mermaid 11.17.2 at last test) with no custom HTML, because the validator rejects raw HTML. GitHub alert syntax renders natively there; slice 2's dashboard renderer has to render the same alert block."
  dependencies:
    - REQ-DOCS-115
    - REQ-DOCS-131
  decisions:
    - "Decided unsigned requirements ARE citable, under a separate 'proposed' badge (Keith, slice 1 Q3). Rejected: the scoper's recommendation that only signed requirements be citable, which would have kept every page resting on REQ-PIPE-110 to 113 out of the explainers until they were signed."
    - "Decided the status mapping (Keith, set 5): in_progress reads 'designed, not built yet', and a built requirement with unmet_criteria gets its own 'partly built' badge. That makes four states, not Q3's three."
    - "Decided a FIFTH state, 'an idea, not designed yet' (Keith, set 6), for a concept with no requirement at all, such as one-off project extractions: one sentence under the badge, exempt from citation. Rejected: the scoper's recommendation that such a concept get a draft glossary entry only and its section wait until a requirement exists."
    - "Decided the idea badge is section-only and does not pull a page's own badge down, so a built page with one idea section still reads as built (scoper's derivation in revision 4, flagged for Keith). The alternative - the idea state ranking into the page badge - would badge group 1's page 'an idea' for the sake of one sentence."
    - "Decided mixed-state pages (Keith, set 4): the page badge follows its least-built source, and a section whose state differs carries its own badge. Rejected: a page-level badge only, which would hide a built page's one unbuilt section."
    - "Decided badge drift is caught by the validator in slice 1 (Keith, set 4), accepting that a build session can turn CI red on a page it may not edit, with the fix coming to Keith."
    - "Decided the page parts and the exemplar traits are reconciled (Keith, set 4): 'In short' first, the body opening on the story moment, trait 12's recap and pointer just before the sources, and the sources last."
    - "Decided the 'In short' box is written as a GitHub alert block (delivery-architect, adopted), the one alert syntax the validator allows, so the box is findable by the validator and renders as a box on GitHub with no HTML."
    - "Decided every page carries a summary of 160 characters or fewer (Keith, Q6, from GOV.UK), held in the front matter."
    - "Decided free-form page shape (round 5), chosen over a fixed skeleton and over 'required elements, free order'. Two answers in the same round fix the 'In short' box and the 'why' section; round 1's why-question and the cited sources are also required, and set 4 added the recap and pointer."
    - "Decided two readers on one page (round 5) - an 'In short' box a manager can stop after, and the rest for the engineer. Rejected separate reading paths per audience; GDS's 'Documenting APIs' also warns against organising documentation by user type."
    - "Decided 500 to 800 words, readable in three to four minutes (round 5). Word count stays a target the critic judges, not a validator rule (set 4)."
    - "Decided the 'why it's this way' section is drawn from requirements' decisions fields (round 5), because they are exactly Diataxis's 'choices, alternatives, reasons' raw material."
    - "Decided identifiers live only in the closing sources list (style round 3), keeping the body clean for managers; the validator enforces it (set 5)."
    - "Decided the sources list STAYS at the end despite GOV.UK's 'do not gather links at the bottom' (style round 5), because it is provenance rather than further reading - and inline links carry anything a reader actually needs. Files in it are plain text, because links may only point inside docs/explainers/ (delivery-architect, adopted)."
    - "Decided plans/*.md is NEVER citable (round 4) because it is working material deleted as requirements land. The writer may read it for background (round 10)."
    - "Decided slice 2's staleness gate fingerprints each cited requirement's OWN ENTRY, not the whole of requirements.yaml (round 4), so an unrelated requirement's edit never marks a page stale. Carried here because this requirement defines what a page cites; the gate itself is slice 2."
    - "Decided designed-but-unbuilt concepts ARE explained, clearly badged (item 4, Keith's calls), and every such page is revisited as the build lands. Q3 extended the same treatment to unsigned designs."
    - "Decided the boundary with REQ-QAC-024 (item 1): that requirement explains each CHECK in plain English; an explainer explains a CONCEPT - a supply, a slot, promotion, the worst-of rollup. A check's plain-English fields get only a glossary entry and one line in 'what a check is' (triage #29)."
    - "Decided a concept with two halves is SPLIT and CROSS-LINKED (the two-track sweep): the explainer covers what it means and why, a Running Mothman how-to covers the steps, each links to the other and neither repeats the other. The links wait until item 2's pages exist."
    - "Decided each page records a last-reviewed and a review-by date alongside its sign-off (Keith's calls on the live research), because a fingerprint catches a changed source but not a world that changed while no cited file did. Suggested review period six months; the date check itself is explainers slice 2."
  open_questions: []

- id: REQ-DOCS-117
  title: "A fixed cast, and stories that are about data, never the people in it"
  date_written: "2026-09-29"
  story: "As a reader working through several explainers, I want the same small cast in every story, so that I get to know them, and I want every story to stay clear of the people the data describes, so that nothing here trivialises child protection or birth records."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: "2026-09-29"
  source: "Keith, plans/explainers.md item 3 round 4, round 12, round 15 and 'The cast', and sets 4 and 5, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "THE HOUSE STANDARD SHALL define a fixed cast once, giving each member a name, a role, an agency or team, one personality trait and what they typically struggle with."
    - "[PROCESS] THE SYSTEM SHALL NOT change the cast's wording without Keith's approval of the exact text."
    - "THE HOUSE STANDARD SHALL name one cast member as the reader's stand-in, and that description SHALL match the critic's persona in REQ-DOCS-127."
    - "THE HOUSE STANDARD SHALL name one cast member as the voice of the 'In short' box."
    - "THE HOUSE STANDARD SHALL define the Mothman mascot, and SHALL limit it to some diagrams and the odd aside, never a heading."
    - "THE SYSTEM SHALL hold the sensitivity rule - every story concerns files, deadlines and decisions, never the children, families or births the data describes, and no page carries a realistic case or an invented personal detail such as a child's name, a date of birth or a family circumstance, including in a diagram or an example row - in the reader-judgement skill (REQ-DOCS-131), so that the writer and the critic hold the same one copy."
    - "IF a page breaches the sensitivity rule, THEN THE SYSTEM SHALL treat the breach as a blocker-severity finding."
    - "THE HOUSE STANDARD SHALL state that the cast is introduced in the overview page's one-supply journey."
    - "THE SYSTEM SHALL require every page to introduce each cast member it uses by name and role in one clause on first mention, through the reader-judgement skill's stand-alone rule (REQ-DOCS-131), so that a page read before the overview or reached from a link still makes sense."
  non_functional_requirements:
    - "PRIVACY, and the reason this is a must: the real collections behind this PoC include child protection. A page that is fine for synthetic data is still published publicly on GitHub the moment it is pushed, and would be read by exactly the people a careless story would offend. The rule has to hold as if the data were real, because in a real deployment it is."
    - "The rule applies to invented detail as much as to real detail. An agent that never reads data/ can still invent a plausible child - which is why REQ-DOCS-124 keeps the agents away from data AND this rule forbids invention."
    - "The cast's names must not collide with contract/people.yaml's placeholder colleagues or any real person the project names, so a reader never confuses a story character with someone who can actually take a decision."
  dependencies:
    - REQ-DOCS-115
    - REQ-DOCS-131
  decisions:
    - "Decided a fixed cast, defined once and reused (round 4), so readers get to know them - the Phippy pattern from the Illustrated Children's Guide to Kubernetes."
    - "Decided the cast's first draft - Priya (a supplier's data steward), Sam (a data engineer new to the asset team, the reader's stand-in), Jo (the operator who makes filing decisions), Marcus (the team manager, voice of 'In short'), Lin (a downstream researcher) - plus the Mothman mascot. Keith approves the exact wording when the standard is written."
    - "Rejected Monty Python names. Keith first picked them to match contract/people.yaml's placeholders, then, seeing the re-cast (Galahad, Patsy, Tim the Enchanter, Bedevere, Roger the Shrubber), chose regular Australian names instead."
    - "Decided the reader's stand-in MATCHES the critic's persona, so the stories and the critic test the same reader."
    - "Decided the cast is introduced in the overview page's one-supply journey (round 15), so later stories can assume the reader knows them - but see the next decision."
    - "Decided cast on early pages (Keith, set 4): name and role on first mention on EVERY page, matching Q6's 'every page redefines its terms'. The first page, periods and slots (Keith, Q2), is written before the overview exists, so the overview cannot be relied on to introduce anyone."
    - "Decided the sensitivity guardrail (Keith's call) - stories are about data, never the people in it - and that the critic flags a breach as a BLOCKER. It lives in the reader-judgement skill rather than the house standard (set 5 split), because the critic must hold it and preloads only that skill."
  open_questions: []

- id: REQ-DOCS-118
  title: "Diagrams that explain, look the same everywhere, and can be read by a screen reader"
  date_written: "2026-09-29"
  story: "As a reader on GitHub today and on the dashboard later, I want every explainer diagram to argue a point, look the same in both places and carry a description a screen reader can announce, so that the pictures teach rather than decorate."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 1 fourth round, item 3 round 6, Keith's calls on the live GOV.UK research, slice 1 answer Q7, and set 4, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "THE HOUSE STANDARD SHALL allow the hand-drawn look only on flowchart, state, class and ER diagrams, and SHALL require any other diagram type to use the plain look."
    - "WHERE a concept's natural shape is one the hand-drawn look does not support, THE HOUSE STANDARD SHALL require the right shape in the plain look rather than a supported shape bent to fit."
    - "THE HOUSE STANDARD SHALL require every Mermaid block to state its look and its theme explicitly."
    - "THE HOUSE STANDARD SHALL fix one handDrawnSeed value for every hand-drawn diagram, held in its YAML block (REQ-DOCS-115)."
    - "THE HOUSE STANDARD SHALL define a shared colour palette, tested in light and dark mode and matched to the dashboard, and SHALL require every classDef to set fill, stroke and text colour."
    - "THE HOUSE STANDARD SHALL define a diagram's caption as the first non-blank line after the Mermaid block's closing fence, written wholly in italics as one sentence."
    - "THE HOUSE STANDARD SHALL require every diagram to carry a caption that states its one-line takeaway (trait 6)."
    - "THE SYSTEM SHALL have docs-illustrator write the caption's text into the Mermaid block as both its accTitle and its accDescr, and SHALL have the validator (REQ-DOCS-122) check that both equal the caption."
    - "THE HOUSE STANDARD SHALL require every diagram to still make sense rendered in the plain look."
    - "THE SYSTEM SHALL hold the two argue-not-decorate tests in the reader-judgement skill (REQ-DOCS-131), and THE HOUSE STANDARD SHALL NOT restate them."
    - "THE HOUSE STANDARD SHALL NOT allow a Mermaid click directive or any directive that touches securityLevel."
    - "THE HOUSE STANDARD SHALL require a group page's overview diagram to carry no links, and SHALL require the list of concept cards beneath it to carry the links to the concept pages."
  non_functional_requirements:
    - "COMPATIBILITY across two renderers: GitHub renders Mermaid 11.17.2 (tested 2026-09-28) while slice 2 will vendor 12.x, and version 12 changed defaults for about ten diagram types. Explicit look and theme are what make the two copies match; the plain-look rule is what keeps a page readable if GitHub changes version without notice."
    - "ACCESSIBILITY: Mermaid exposes an accessible name only through accTitle and accDescr in the source (GDS Way, 'Diagrams as code'). A visible caption alone is not announced, so the caption is copied into the source and the validator checks the copy rather than a reviewer. Cards as ordinary markdown links are also the more accessible route to the concept pages - a link inside an SVG node is harder to reach by keyboard."
    - "A fixed caption form (the italic line after the fence) is what lets the validator find the caption at all; a caption anywhere else is invisible to the equality check."
    - "STABILITY: the default seed of 0 re-randomises the wobble on every render, so without a fixed seed two renders of an unchanged page differ, and a before/after comparison of a page is noise."
    - "SECURITY: click directives and securityLevel overrides are the Mermaid surface that could turn a diagram into a link to anywhere or into script. They are forbidden in the standard and rejected by the validator, and slice 2 initialises Mermaid strict as a second layer."
  dependencies:
    - REQ-DOCS-115
    - REQ-DOCS-131
  decisions:
    - "Decided a group page's overview diagram has NO links; a list of concept cards beneath it carries them, and securityLevel stays strict (Keith, slice 1 Q7). Rejected: click directives with relative links. This supersedes item 4's 'one overview diagram whose nodes link to the concept pages'."
    - "Decided hand-drawn only where it fits, and only on the four types Mermaid supports it for that GitHub's 11.17.2 also has - flowchart (11.0), state (11.0), class (11.4), ER (11.5) (Keith, 2026-09-28)."
    - "Decided correctness beats consistency (round 6): use a plain timeline or gantt where that is genuinely clearest. This settled the tension that claim windows is naturally a timeline."
    - "Verified empirically that GitHub renders the hand-drawn look (Keith viewed a temporary test page, 2026-09-28, since deleted) - a hand-drawn flowchart rendered visibly differently from the plain one, and a hand-drawn state diagram rendered hand-drawn."
    - "Decided all three on every diagram (round 6) - a one-line caption, a shared palette tested in light and dark, and one fixed handDrawnSeed."
    - "Decided the caption is trait 6's takeaway line and still feeds accTitle and accDescr (Keith, set 4). This supersedes round 6's 'a caption saying what it shows'."
    - "Decided accTitle and accDescr are COPIES of the caption that docs-illustrator writes, checked equal by the validator (Keith's calls on the live research, wording corrected by the delivery-architect review). Nothing generates them. Rejected a separate accessible title and description written independently (style round 5), as a second text that could drift."
    - "Decided the caption form - the italic line straight after the fence - so the validator can find it (delivery-architect, adopted). Italics were chosen because bold is reserved for defined terms."
    - "Decided 'as many diagrams as it takes' (round 6) - the illustrator's call, with the critic flagging excess."
    - "Carried from the research, not individually voted on: 'diagrams should argue, not display' and its two tests (mgranberry), now held in the reader-judgement skill, and Julia Evans' own anti-pattern, 'fun illustrations on dry explanations'."
  open_questions: []

- id: REQ-DOCS-119
  title: "A glossary seed held as YAML, one canonical word per concept, with a generated readable copy"
  date_written: "2026-09-29"
  story: "As a reader meeting a Mothman term for the first time, I want one glossary that gives each invented term its one canonical spelling, a one-line definition and where it is explained, so that I never have to guess whether two words mean the same thing."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 1, 3 and 4, the naming session (rounds 1 to 3) and its glossary canon, the re-baseline decisions, round 15's placeholder names, slice 1 answers Q2 and Q3, and sets 5 and 6, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold the glossary's one source at docs/explainers/glossary.yaml, under a strict schema that rejects unknown and missing keys."
    - "THE SYSTEM SHALL give every glossary entry its canonical term spelled exactly, a one-line definition, its aliases, any further word forms it should match, the requirement or requirements that define it, the explainer page that covers it or a mark that none does yet, and whether it is a draft."
    - "THE SYSTEM SHALL list every alias and retired word as pointing at its canonical term, and SHALL NOT give an alias a definition of its own."
    - "THE SYSTEM SHALL provide `mothman docs glossary`, which writes docs/explainers/glossary.md from glossary.yaml and requirements.yaml, and SHALL commit the generated file."
    - "IF the committed glossary.md differs from what `mothman docs glossary` would write, THEN `mothman docs glossary --check` SHALL fail, and `mothman docs validate` (REQ-DOCS-122) SHALL run that check."
    - "THE SYSTEM SHALL derive each entry's badge from its defining requirements in requirements.yaml, using REQ-DOCS-116's derived states and its least-built rule, and SHALL NOT let a badge be written by hand."
    - "THE SYSTEM SHALL give glossary.yaml an explicit idea field, true only for an entry whose concept has no defining requirement at all, and SHALL render such an entry in glossary.md with the badge 'an idea, not designed yet'."
    - "IF a glossary entry is marked as an idea and names a defining requirement, or names no defining requirement and is not marked as an idea, THEN `mothman docs validate` SHALL reject it."
    - "THE SYSTEM SHALL seed the glossary with every canonical term and alias the naming session settled, and with the terms the first explainer, periods and slots (REQ-DOCS-130), uses."
    - "THE SYSTEM SHALL mark the three asset-shape names - scheduled asset, one-off extraction and sample - as draft placeholders."
    - "THE SYSTEM SHALL define promote, deliver, asset and issue as Mothman terms, in line with REQ-DOCS-115's rule on GOV.UK's words-to-avoid."
    - "THE SYSTEM SHALL show delivery, arrival and supply nested in one small diagram in glossary.md, held in glossary.yaml and held to REQ-DOCS-118 like any explainer diagram, and SHALL show the delivery agreement and the supply calendar as two related entries, one inside the other."
    - "[PROCESS] THE SYSTEM SHALL NOT add or change a glossary entry unless Keith has approved it, either directly or at an /explain brief checkpoint."
  non_functional_requirements:
    - "The glossary sits under docs/explainers/, so CLAUDE.md's standing rule 'never change an explainer without Keith's approval' already covers both glossary.yaml and the generated glossary.md. A building session that renames a term in code reports which entry it affects and does not edit it."
    - "Badges derived, never hand-written (Keith, set 5): because glossary.md is generated from requirements.yaml as well as glossary.yaml, a requirement that is signed or built makes the committed glossary.md stale, and the --check gate catches it - that is how glossary badge drift is found, with no separate rule."
    - "One source, several readers: REQ-DOCS-121's recall check, the generator, and slice 2's searchable glossary panel all parse glossary.yaml through the one parser module (REQ-DOCS-122), never glossary.md."
    - "MAINTAINABILITY: plans/explainers.md queue item 9 flags five renames in code and requirements (delivery calendar to supply calendar, the sample schema, /accept to acknowledge, cycle to period, stale to no data). Each one will ripple into this file, so aliases carry the old words rather than the old words being deleted."
    - "Scale: the page list has 32 concept pages and far more terms. glossary.md must stay readable by eye at that size, which argues for one short line per entry rather than paragraphs."
    - "Security: the glossary is published publicly and embedded in the dashboard in slice 2, so the validator applies to glossary.yaml and glossary.md exactly as to a page."
    - "Who writes what: docs-writer's write guard (REQ-DOCS-124) allows glossary.yaml but not glossary.md, and no docs-* agent has a shell, so the main session runs `mothman docs glossary` inside /explain (REQ-DOCS-129) whenever the writer changes the YAML."
  dependencies:
    - REQ-DOCS-115
    - REQ-DOCS-116
    - REQ-DOCS-122
  decisions:
    - "Decided glossary.yaml is the source, with a readable glossary.md generated from it and gated against going stale (Keith, set 5, the CHANGELOG.yaml precedent; the gate has the same shape as `mothman dashboard plans-index --check`). Rejected: markdown with one structured line per entry, which three programs would each have had to parse."
    - "Decided glossary badges are derived from requirements.yaml, never hand-written (Keith, set 5)."
    - "Decided an entry with no defining requirement carries an explicit idea mark and the badge 'an idea, not designed yet' (Keith, set 6), since that badge cannot derive from requirements.yaml. The mark is a glossary change, so Keith approves it like any other, and an entry must either name a defining requirement or carry the mark - there is no unbadged third case."
    - "Decided a first-class glossary (round 1): one source, one-line definition, exact spelling, and the explainer that covers it. The writer uses terms exactly as defined."
    - "Decided the writer PROPOSES and Keith APPROVES (round 3). New or changed terms appear in the brief, Keith approves them at the brief checkpoint, and only then are they added, so the glossary cannot drift without him seeing it."
    - "Decided the glossary badges follow the page states, including 'proposed' for an unsigned design (Keith, slice 1 Q3) and 'partly built' (set 5)."
    - "Canon from the naming session, canonical then aliases - demote, always with its destination (to staging or to rejected), alias un-decide; substitute and substituted, aliases standing in and last good one; inherit, distinct from substitute because nobody decides it; carry forward RETIRED, because it also means supplies for the following period; resupply means an arrival into a filled slot; supply calendar, alias delivery calendar; in development, aliases pre-agreement, calendar-less, not yet agreed; sample reserved for the practice-data asset shape; recency for the check category, alias ODCS timeliness; acknowledge for amber, alias accept; overdue, no data, recency and freshness distinct, with stale an alias of no data; delivery, arrival and supply distinct; QA run and trial (never 'trial run'); waiting on a person, with blocked kept for a healthy table whose check cannot run because a neighbour is missing or held; period, alias cycle; In place on, alias as of."
    - "Decided 'early', 'on time' and 'late' are only ever about arrivals, and 'recency' is the content check, so 'timeliness' never appears unqualified."
    - "Decided the built status-inferred resupply chain (REQ-QAC-008) is NOT explained (triage #27, 'explain the new model instead'). This overrode the naming session's note that it would be explained separately."
    - "Decided (re-baseline) 'delivery agreement' and 'supply calendar' are nested and both kept - the agreement is what we agreed with a supplier (REQ-PIPE-110), the calendar is the schedule of periods and due dates inside it. Noted that 'supply calendar' had zero uses anywhere at the time; 'reconcile' and 'stand on' are established words and 'stand on' is an alias."
    - "Decided 'schedule' folds into the supply calendar as a glossary alias (tiering, originals round 1)."
    - "Decided readers only ever see 'QA run'; run_id and rehearsal-versus-real stay out of the explainers as tooling."
    - "Decided the three placeholder asset-shape names are named by how supplies arrive (round 15), entered as draft, and approved by Keith."
    - "Decided the glossary may double as a quick-reference panel in the dashboard tab - built in explainers slice 2, not here."
  open_questions: []

- id: REQ-DOCS-120
  title: "The concept map lives in a committed, schema-checked config file, not in a plans entry"
  date_written: "2026-09-29"
  story: "As whoever starts the next /explain run, I want the agreed groups, reading order and page list in one committed file, so that tiering decisions survive plans/explainers.md being deleted and nobody re-derives which concept gets its own page."
  moscow: should
  status: not_started
  source: "delivery-scoper, found by the carry-over check over plans/explainers.md item 4 and THE PAGE LIST in item 3, 2026-09-29. Kept by Keith as a committed config file (slice 1 Q12) and raised to should (set 4), 2026-09-29; schema adopted from the delivery-architect review the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL hold the explainers' concept map in docs/explainers/concept-map.yaml, under a strict schema that rejects unknown and missing keys."
    - "THE SYSTEM SHALL list the groups in their numbered reading order, from 0 (the overview) to 9 (looking back), each with its 'read first' prerequisites."
    - "THE SYSTEM SHALL list, for each group, its concept pages in reading order, and for each page the concepts it carries as sections."
    - "THE SYSTEM SHALL list the concepts that are glossary-only, and SHALL list each excluded concept with where it went - the pipeline docs, parked, or not explained."
    - "THE SYSTEM SHALL record the four parts every group page carries - a big-picture story with the cast, one overview diagram with no links, concept cards in reading order that carry the links, and 'read first' prerequisites."
    - "IF concept-map.yaml does not match its schema, repeats a group number or a page, or places one concept in more than one place, THEN `mothman docs validate` (REQ-DOCS-122) SHALL reject it."
    - "[PROCESS] THE SYSTEM SHALL NOT change the concept map without Keith's approval."
  non_functional_requirements:
    - "This exists for the carry-over rule in CLAUDE.md, not for readers: explainers are documentation and get no requirement each (round 1), so once plans/explainers.md item 4 is deleted, nothing else holds 32 tiering decisions made one by one with Keith."
    - "It is configuration, not state - authored, reviewed, and the same for two people with no data - so it belongs in git under the standing rule."
    - "Under docs/explainers/, so CLAUDE.md's 'never change an explainer without Keith's approval' rule already covers it, and the validator's file-level rules apply to it."
    - "A strict schema is what makes it trustworthy as the one source the next /explain run starts from; a misspelled key silently ignored would lose a tiering decision without anyone noticing."
  dependencies:
    - REQ-DOCS-119
    - REQ-DOCS-122
  decisions:
    - "Decided the concept map becomes a committed config file (Keith, slice 1 Q12), so the 32 tiering decisions survive when plans/explainers.md is deleted. Rejected: keeping item 4 in the plans file until the last group page is written and deleting it whole under CLAUDE.md's rule 4. This supersedes item 4's own note that 'the concept map lives here until it moves into the real glossary and group pages'."
    - "Decided the file is concept-map.yaml under a strict schema (delivery-architect, adopted) and the requirement is SHOULD (Keith, set 4, up from could)."
    - "Carried from item 4 - groups as a numbered learning path, read in order but anyone can jump in anywhere (Keith's call); groups 0 overview, 1 the shape of the asset, 2 the calendar, 3 what arrives, 4 filing a supply, 5 filling the gaps, 6 when a person is needed, 7 how status works, 8 the checks, 9 looking back."
    - "Carried from item 4 - the overview covers the problem, one supply's journey from arriving to being judged to appearing on the dashboard, and a tour of the groups (round 14); it carries a short red, amber and green primer so every group can use the words (round 15)."
    - "Carried - group 1 must flag that the asset's SHAPE VARIES (Keith - 'we don't have language for that yet, but it is something that will change'), so its pages are the likeliest to be revisited."
    - "Carried - three tiers (round 16): a big idea gets its own page, a medium one a section, a small one a glossary entry only."
    - "Carried - THE PAGE LIST, 32 concept pages plus a group page per group, and the triage outcomes: 29 included, #9 and #30 to the pipeline docs, #6 and #31 split, #25 and #29 included only briefly, #27 explaining only the new model; freshness capping parked until it has a requirement."
    - "Carried - status and checks divide cleanly (round 15): group 7 is purely how status works, group 8 is every check, organised by LEVEL rather than by the five categories (round 14)."
    - "Carried - a group page's overview diagram carries no links; the concept cards beneath it carry them (Keith, slice 1 Q7, superseding item 4's linked-node diagram)."
    - "Carried - the line between the two tracks (Keith, confirmed 2026-09-29): what things MEAN to a reader is an explainer; how the system is OPERATED AND MAINTAINED - permissions, configuration changes, check upkeep - is Running Mothman. The tracks split by Diataxis type: explanation here, how-to, reference and technical explanation there."
    - "Carried - 'the four QA tools and why there are four' is NOT a concept and is not explained (item 1, third round); the CI-never-touches-data rule and the delivery-* agent pipeline go to the pipeline docs."
    - "Carried from the re-baseline - group 6's ticket page explains the NEW model, one ticket per slot always showing where that supply has got to (REQ-PIPE-083, REQ-GHUB-109), with the reconciling mechanics in the pipeline docs; and REQ-PIPE-110 to 113 give the explainers their MEANING only (a past due date can never change, windows never overlap), with file location and timezone versioning in the pipeline docs, as is REQ-TEST-114. The re-baseline said 'badged not built'; since 110 to 113 are unsigned, under Q3 that badge is now 'proposed' until Keith signs them."
