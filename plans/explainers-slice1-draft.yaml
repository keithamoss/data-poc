  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 1, 2, 8, 9 and 13, CLAUDE.md's standing rule 'Never change an explainer without Keith's approval', slice 1 answers Q1, Q4, Q5 and Q9, and sets 4, 5 and 6, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL provide an /explain project skill at .claude/skills/explain/SKILL.md, marked disable-model-invocation true, that runs in the main session."
    - "WHEN /explain runs, THE SYSTEM SHALL take the steps in this order - scope the topic with Keith, docs-writer drafts the brief, Keith approves the brief, docs-writer writes, docs-illustrator illustrates, the validator and recall check pass, the reviews run, the draft is pushed, Keith triages the findings, docs-writer revises, Keith signs off."
    - "THE SYSTEM SHALL NOT start a step until the step before it has finished."
    - "THE SYSTEM SHALL keep every brief, review report, diagram note and illustrator A/B version for a run in one working folder, docs/explainers/_work/<date>-<slug>/, and SHALL NOT commit anything in it."
    - "THE SYSTEM SHALL ignore docs/explainers/_work/ through a rule in the repository's root .gitignore, and SHALL NOT rely on a .gitignore file inside docs/explainers/."
    - "WHEN the working folder is first created, THE SYSTEM SHALL have its ignore rule committed before any file is written into it."
    - "WHEN the brief is presented, THE SYSTEM SHALL ask Keith to pick an analogy or story angle, to tweak the reader questions, and to approve each new or changed glossary term."
    - "WHEN docs-writer has changed glossary.yaml, THE SYSTEM SHALL regenerate glossary.md with `mothman docs glossary` before the validator runs."
    - "WHEN /explain is about to start any docs-* agent, THE SYSTEM SHALL take a snapshot with `mothman docs snapshot`, and WHEN that agent finishes, SHALL run `mothman docs verify-changes` against it (REQ-DOCS-124)."
    - "IF the validator (REQ-DOCS-122, REQ-DOCS-132) or the recall check (REQ-DOCS-121) rejects the draft, THEN THE SYSTEM SHALL return the rejections to docs-writer, or to docs-illustrator for a diagram, without bringing them to Keith, and SHALL NOT start the reviews until both pass."
    - "THE SYSTEM SHALL NOT count a return for a validator or recall-check rejection as a revision loop."
    - "WHEN the reviews run, THE SYSTEM SHALL run docs-critic and docs-fact-checker in parallel, run docs-fact-checker twice, save both agents' reports into the working folder, run `mothman docs quote-check` (REQ-DOCS-128), and present all their results together."
    - "WHEN the reviews have finished and report no sensitivity blocker, THE SYSTEM SHALL commit and push the page with status draft, and SHALL give Keith its GitHub link so he can check the diagrams render."
    - "IF the reviews report a sensitivity blocker, THEN THE SYSTEM SHALL NOT push the page until Keith has triaged the finding and the page no longer breaches the rule."
    - "WHEN /explain commits, THE SYSTEM SHALL stage each path by name, and SHALL NOT use git add -A, git add . or any other form that stages whatever happens to be present."
    - "WHEN findings are presented, THE SYSTEM SHALL show every finding grouped by severity and SHALL act only on the findings Keith picks."
    - "WHEN docs-writer has revised a page, THE SYSTEM SHALL re-run the validator, the recall check and the reviews on the revised page and return to Keith's triage."
    - "IF a page has been through two revision loops - each loop being Keith's triage followed by docs-writer's revision - and Keith has not signed it off, THEN THE SYSTEM SHALL stop the run and hand back to Keith rather than start a third loop."
    - "[PROCESS] WHEN Keith signs a page off, THE SYSTEM SHALL record who signed it and when, the page's hash as printed by `mothman docs validate --print-hash` (REQ-DOCS-122), a last-reviewed date and a review-by date in the page's front matter, and SHALL NOT write that record before he has."
    - "THE SYSTEM SHALL NOT run /explain to regenerate a signed-off page."
    - "THE SYSTEM SHALL NOT pick a topic itself, and SHALL start only from a topic Keith gives."
    - "THE SYSTEM SHALL NOT write a CHANGELOG.yaml entry for an individual explainer page."
    - "[PROCESS] WHEN the working folder is first created, THE SYSTEM SHALL amend CLAUDE.md's explainer rule to exclude docs/explainers/_work/, in wording Keith has approved before the edit is made."
  non_functional_requirements:
    - "The loop cap lives in the SKILL, not in a prompt: Anthropic's own cookbook evaluator loop is uncapped, and a cap an agent is asked to respect is a cap it can talk itself past. A mechanical rejection is not a loop because it has one right answer and Keith's checkpoints are for judgement (Keith, set 4)."
    - "PUBLIC ON PUSH: the repository is public, so the draft is published the moment it is pushed. That is why the push waits for the validator AND the critic's sensitivity read - REQ-DOCS-130 requires the sensitivity rule to have held before the first push, and in slice 1 only the critic checks it."
    - "The ignore rule goes in first, in the ROOT .gitignore, because this repo has been caught by exactly that window before - on 2026-09-25 a `git add -A` staged new scratch files before their ignore lines existed, and 404MB went into the public repository. A nested .gitignore inside docs/explainers/ would be a file the writer's guard lets it edit. A report quoting injected text is the last thing to leak the same way, which is also why staging is by explicit path."
    - "RELIABILITY: if an agent fails partway through a step, the skill stops and reports what exists on disk rather than retrying silently. A half-written page is left as a draft for Keith to see, never pushed as if finished."
    - "No agent can ask Keith anything directly (AskUserQuestion is unavailable in every subagent), so every question an agent has comes back through the main session - which is why the checkpoints, and the skill, sit there."
    - "The skill must work for a second document type later (round 12), so the step list is generic - brief, draft, illustrate, check, review, triage, sign off - with explanation-specific wording held in the house standard rather than the skill."
    - "AUDITABILITY: sign-off lives in the page itself and in git's authorship of the commit that adds it, so 'who approved this page and when' is answerable from the committed tree. Fingerprints of the cited sources, and the `mothman docs sign-off` command that writes them, are explainers slice 2."
    - "EVIDENCE: the skill is steps a model follows, not code a test can drive, so this requirement's evidence is a dated summary of a real /explain run - the topic, the steps taken, the loops used and the outcome - rather than a linked test for each step."
    - "COST: a page can take up to three review rounds, each running the critic once and the fact-checker twice, all on Opus apart from whatever the critic's model test decides. Accepted under round 2's quality-over-cost call."
  dependencies:
