- id: REQ-DOCS-127
  title: "docs-critic reads each page cold, from its markdown source, as a new engineer with a UX eye"
  date_written: "2026-09-29"
  story: "As Keith triaging a draft, I want a critic that knows nothing but the page and what a real reader could look up, reads it as a competent engineer new to Mothman and tells me exactly where it stumbled, so that I find out whether the page teaches before a real newcomer does."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 1 third round, item 3 rounds 3, 7, 10 and 11, the paper check, the 'two slices' entry, slice 1 answers Q1 and Q5, and sets 4 and 5, 2026-09-28 to 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "THE SYSTEM SHALL start docs-critic without CLAUDE.md, and SHALL NOT let it read the repository (REQ-DOCS-124)."
    - "THE SYSTEM SHALL give docs-critic, in its prompt, the page's markdown source with Mermaid source included, the whole glossary inline, the brief's reader questions and the rule-id list printed by `mothman docs validate --list-rules`, and nothing else from the repository."
    - "THE SYSTEM SHALL NOT give docs-critic a rendered view of the page in explainers slice 1."
    - "THE SYSTEM SHALL have docs-critic preload the reader-judgement skill (REQ-DOCS-131) as its only skill, and SHALL NOT have it preload the house standard (REQ-DOCS-115)."
    - "THE SYSTEM SHALL give docs-critic the persona of a mid-level data engineer who is comfortable with SQL, pipelines and data quality, has heard of dbt, knows nothing about this project, its terms or WA government data sharing, and reads on a laptop between meetings."
    - "THE SYSTEM SHALL ground docs-critic's UX lens in an excerpt of docs/hci-ux-psychology.md written once into docs-critic's own agent definition."
    - "THE SYSTEM SHALL have docs-critic use the glossary as a reader would use a glossary panel, and SHALL have it report where the page fails to explain something, not a term merely because the glossary also defines it."
    - "WHEN docs-critic reviews a page, THE SYSTEM SHALL have it answer each reader question from the page alone, and SHALL treat a wrong or missing answer as a finding."
    - "THE SYSTEM SHALL have docs-critic add a finding for anything else it found itself wondering while reading."
    - "WHEN docs-critic has finished its main read, THE SYSTEM SHALL have it re-read only the 'In short' box as a technical team manager and report whether the concept could be explained upward from those sentences alone."
    - "THE SYSTEM SHALL have every finding quote the exact text it concerns, give a severity of blocker, should fix or polish, and suggest a change."
    - "THE SYSTEM SHALL return every finding, grouped by severity, with no confidence filter."
    - "THE SYSTEM SHALL accept 'no findings' as a valid result."
    - "THE SYSTEM SHALL NOT have docs-critic report a breach of any rule on the validator's rule-id list."
    - "IF a page breaches the sensitivity rule (REQ-DOCS-117, REQ-DOCS-131), THEN THE SYSTEM SHALL have docs-critic report it as a blocker."
    - "THE SYSTEM SHALL NOT let docs-critic edit any file."
    - "WHEN the eval set (REQ-DOCS-123) is run, THE SYSTEM SHALL run docs-critic's evals on both Opus and Sonnet 5, SHALL keep the model that catches the planted defects without inventing findings on the clean page, and SHALL record a dated summary of the outcome in this requirement's evidence and the choice in its decisions."
  non_functional_requirements:
    - "COLDNESS is the whole value. A reader who knows the answer cannot tell whether the page taught it, which is why accuracy went to a separate fact-checker. Anything handed to the critic beyond the page is a leak of context the real reader will not have - so each extra input has a reason: the glossary because a real reader can open the glossary panel, the reader questions because they are the test, the rule-id list only to say what NOT to report."
    - "The HCI excerpt is written into the agent file once, rather than supplied per run, so every run of the critic judges UX against the same text and the critic never needs to read the repository for it."
    - "From source, the critic can judge whether a diagram argues and whether its caption and labels make sense, but not how it renders - overlaps, colour contrast, a diagram too wide for a laptop. Those are Keith's to check on GitHub at his triage until slice 2's preview gives the critic a rendered view."
    - "The critic's verdict is ADVISORY. Keith's triage is the gate, and the writer does not auto-fix everything."
    - "Self-preference bias is real but weaker evidence than first assumed (paper check), and appears to track how familiar text is to the judge rather than who wrote it - so a Sonnet critic probably shares much of Opus's bias. The model test is decided by the planted-defect evals, and switching models is NOT expected to remove the bias."
    - "SECURITY: the critic is the agent most likely to quote injected text back into the loop, where the writer would read it. Its findings quote the text as data, and the writer's instruction (REQ-DOCS-124) is what stops the quote being acted on."
  dependencies:
    - REQ-DOCS-119
    - REQ-DOCS-122
    - REQ-DOCS-123
    - REQ-DOCS-124
    - REQ-DOCS-131
  decisions:
    - "Decided the critic does NOT preload the house standard; its prompt carries persona and severity, the reader-judgement skill carries the judgement rules, and the validator owns the mechanical rules (Keith, sets 4 and 5). This SUPERSEDES round 2's 'all four agents preload the skill', to keep round 7's cold read."
    - "Decided the critic IS given the glossary (Keith, set 4), because a real reader can open the glossary panel. It catches pages that fail to explain, not terms the glossary covers."
    - "Decided the critic learns what not to report from the validator's rule-id list, not from the house standard (delivery-architect, adopted), since it no longer preloads the standard."
    - "Decided the HCI excerpt is baked into the agent file once (delivery-architect, adopted)."
    - "Decided the critic reads the markdown SOURCE only in slice 1, Mermaid included; Keith checks the GitHub render at his triage, and the rendered review arrives with slice 2's preview (Keith, slice 1 Q1). Rejected: allow-listing viewscreen.githubusercontent.com (GitHub's Mermaid host, blocked here) and driving GitHub with Playwright, because a browser on github.com can wander the repository and break the cold read; and pulling a local render forward, which is half of slice 2 built early."
    - "Decided the critic does not report what the validator enforces (Keith, Q5) - it keeps the judgement calls, and a duplicate of a mechanical failure is noise at triage."
    - "Decided the critic is a new data engineer with a strong UX lens (item 1 third round; Keith - 'I really care about good user experience'), grounded in docs/hci-ux-psychology.md like the delivery-* UX agents, not only a plain-language check. Round 11 made the persona competent but new."
    - "Decided the critic is PURELY a cold reader judging clarity and UX (round 7); accuracy moved to a separate fact-checker, chosen over one critic doing two passes and over relying on citations plus Keith's sign-off."
    - "Decided a cold start via omitClaudeMd (round 2 research), taken from Anthropic's doc-coauthoring 'reader test', which gives a subagent only the document plus the questions a real reader would ask. Proven by the eval step that asks it to read CLAUDE.md (REQ-DOCS-123)."
    - "Decided reader questions come from both places (round 7): the brief's 5 to 8, tweaked by Keith, plus whatever else the critic wondered."
    - "Decided findings are severity-ranked and all shown (round 7) - blocker, should fix, polish - each quoting exact text and suggesting a change, with no confidence filter."
    - "Decided a quick manager pass on the 'In short' box (round 11)."
    - "Decided critic model is TESTED, Opus against Sonnet 5 (round 3), rather than assumed; the paper check kept the test but changed the reason."
    - "Decided the rendered page from day one (round 7), through a real browser - softened first by the slicing (the 'two slices' entry) to GitHub's render, then by Q1 to the markdown source until slice 2."
    - "Decided the critic never gets memory, because memory silently grants Read, Write and Edit (round 2 research)."
  open_questions: []

- id: REQ-DOCS-128
  title: "docs-fact-checker checks every claim against the page's own cited sources"
  date_written: "2026-09-29"
  story: "As Keith, about to put an explainer in front of managers, I want every factual claim on it checked against the requirements and files it cites, with the problems at the top, so that a wrong or unsupported sentence is found by a table rather than by a reader."
  moscow: must
  status: not_started
  source: "Keith, plans/explainers.md item 3 rounds 7, 8, 10 and 13, the paper check's corrections, slice 1 answers Q3, Q4 and Q11, and sets 5 and 6, 2026-09-29. Scoped by delivery-scoper as explainers slice 1, 2026-09-29; revised against Keith's answers and the delivery-architect review the same day."
  acceptance_criteria:
    - "WHEN docs-fact-checker reviews a page, THE SYSTEM SHALL have it return every factual claim on the page, each with a verdict of supported, contradicted, not found in the sources, or sources disagree."
    - "THE SYSTEM SHALL have docs-fact-checker return its report as one fenced YAML table with one row per claim - the claim, the verdict, the source and the supporting quote - and SHALL have the main session save that table into the run's working folder."
    - "THE SYSTEM SHALL have each row name the exact source it was checked against, as a requirement id or a file and line."
    - "THE SYSTEM SHALL sort contradicted, not-found and sources-disagree rows above supported ones."
    - "THE SYSTEM SHALL have docs-fact-checker check each claim only against the sources the page cites."
    - "THE SYSTEM SHALL have docs-fact-checker extract the supporting quote before giving a verdict, and SHALL mark a claim with no supporting quote as not found."
    - "THE SYSTEM SHALL have docs-fact-checker judge support sentence by sentence against the whole cited set, and SHALL mark partial support as not found."
    - "IF a sentence makes a factual claim and cites nothing, THEN THE SYSTEM SHALL flag it, unless it is the one sentence under an 'an idea, not designed yet' badge (REQ-DOCS-116)."
    - "THE SYSTEM SHALL list the sentence under an 'an idea, not designed yet' badge in the report as exempt, with no verdict, so that Keith still sees it."
    - "IF a claim is supported only by plans/*.md or CLAUDE.md, THEN THE SYSTEM SHALL mark it not found."
    - "IF a cited requirement and the cited code say different things, THEN THE SYSTEM SHALL mark the claim sources disagree and SHALL always show it to Keith, and the page SHALL NOT pick a side."
    - "WHEN a round of review runs, THE SYSTEM SHALL run docs-fact-checker twice on the same page, SHALL show Keith every claim either run marks other than supported, and SHALL flag as unstable any claim the two runs disagree on."
    - "THE SYSTEM SHALL provide `mothman docs quote-check`, which checks that every quoted passage in a saved fact-checker report appears in the source it names, and flags any that does not."
    - "THE SYSTEM SHALL match a quote from a requirement against that requirement's parsed field values from requirements.yaml, and a quote from any other file against that file's text, in both cases after normalising whitespace, and SHALL NOT match against raw YAML text."
    - "THE SYSTEM SHALL keep fact-checker reports in the gitignored working folder (REQ-DOCS-129), and SHALL NOT commit them."
    - "THE SYSTEM SHALL run docs-fact-checker on Opus, pinned by full model id."
    - "THE SYSTEM SHALL NOT let docs-fact-checker edit any file."
  non_functional_requirements:
    - "RELIABILITY is bought honestly rather than by vote: two runs cannot form a majority, so the union catches more at the cost of more false flags, which works only because Keith reviews every flag. Disagreement between runs IS a supported warning sign. If the union proves too noisy, the backed alternative is three runs with a majority vote per claim - a change of design to bring back to Keith, not a tuning knob."
    - "Matching against PARSED field values matters because YAML folds, quotes and escapes text: a quote copied faithfully from a requirement's criterion would not appear verbatim in the raw file whenever the line wraps. Matching raw text would produce false 'invented quote' flags."
    - "A fenced YAML table is machine-readable by the quote check and readable by Keith at triage, from the same text."
    - "The verbatim-quote check proves a quote EXISTS, not that it SUPPORTS the claim (ALCE, Gao et al., EMNLP 2023). It is a separate gate against invented quotes, and never a substitute for the per-sentence judgement."
    - "An unsigned requirement is citable (Q3), so a claim it supports counts as supported. What an unsigned source changes is the page's badge, not the claim's verdict."
    - "'Sources disagree' can be a real bug in the code or a stale requirement rather than an explainer problem, so it routes to Keith as a possible defect, with CLAUDE.md's post-build review rules applying to whatever it turns out to be."
    - "Scale: one concept's cited set is 20 to 40k tokens and fits; the checker reads only that set, never requirements.yaml whole."
    - "Deterministic parts stay in code (the quote check is a mothman subcommand, per CLAUDE.md's rule for any new script); judgement stays in the agent. The quote check reads reports from the working folder, which is not committed, so it runs inside /explain rather than in CI."
    - "The staleness-gate route - re-running on just the changed sources when a fingerprint breaks and proposing minimal edits - is explainers slice 2 and not built here."
  dependencies:
    - REQ-DOCS-116
    - REQ-DOCS-121
    - REQ-DOCS-122
    - REQ-DOCS-123
    - REQ-DOCS-124
  decisions:
    - "Decided quote checks match parsed, whitespace-normalised requirement field values, not raw YAML text, and the report is a fenced YAML table the main session saves (delivery-architect, adopted)."
    - "Decided reports are working material in the gitignored folder, never committed (Keith, slice 1 Q4); eval outcomes for this agent are summarised in this requirement's evidence and decisions (Q11)."
    - "Decided a separate fact-checker, making a team of four (round 7), for cleaner roles - a reader who knows the answer cannot tell whether the page taught it."
    - "Decided the report is a full claim-by-claim table, problems first (round 8)."
    - "Decided the fact-checker runs on OPUS (round 8) and is NOT part of the Opus-versus-Sonnet test; careful claim-checking is reasoning work and its errors reach managers."
    - "Decided the critic and fact-checker run in PARALLEL (round 8) - one reads cold, the other reads sources - and Keith triages both reports at one checkpoint."
    - "Decided plans prose never counts as support (round 10)."
    - "Decided a fourth verdict, 'sources disagree' (round 13), which always goes to Keith."
    - "Decided two runs per round, combined as a union, disagreement flagged unstable (round 13); the paper check kept this but corrected the description - it is not self-consistency voting (Wang et al.)."
    - "Decided from Anthropic's anti-hallucination guidance: extract quotes first, retract any claim with no supporting quote, and treat run-to-run disagreement as a warning (stochasticity research)."
    - "Decided per-sentence support against the whole cited set, flagging uncited sentences and treating partial support as not found (paper check, ALCE)."
    - "Decided the one sentence under an 'an idea, not designed yet' badge is exempt from citation (Keith, set 6), and is listed as exempt rather than dropped from the report (scoper's derivation, flagged for Keith). Rejected: holding such a concept to a glossary entry only until a requirement exists."
    - "Rejected relying on the API's Citations feature - it guarantees valid citations but subagents cannot use it, so the verbatim script is the nearest equivalent."
  open_questions: []

- id: REQ-DOCS-129
  title: "An /explain skill runs the team in fixed steps with Keith at two checkpoints"
  date_written: "2026-09-29"
  story: "As Keith commissioning an explainer, I want one command that walks the main session through scoping, brief, writing, illustrating, checking, review, triage and sign-off in a fixed order, so that no step - and especially neither of my checkpoints - can be skipped or reordered by accident."
