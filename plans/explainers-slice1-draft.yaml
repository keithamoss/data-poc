    - REQ-DOCS-132
  decisions:
    - "Decided a validator or recall-check rejection goes straight back to the writer, without Keith, and does not count as a revision loop (Keith, set 4)."
    - "Decided the skill's location and flag, the working-folder path, the ROOT .gitignore rule, a snapshot before each agent and explicit-path staging (delivery-architect, adopted)."
    - "Decided briefs and reports go in a gitignored working folder under docs/explainers/, and the page itself is committed as status draft so Keith can view it on GitHub (Keith, slice 1 Q4). Nothing that is state is committed."
    - "Decided Keith checks the GitHub render at his triage, since the critic reads source only (Keith, Q1)."
    - "Decided the validator guards the mechanical rules and a false claim of sign-off before any review runs (Keith, Q5 and Q9), so the critic's findings are about what only a reader can judge."
    - "Decided its own lighter pipeline (round 1): an explainer is documentation, not behaviour, so it gets NO requirements.yaml entry. Keith and the main session scope, the agents write, Keith signs off the finished page. The agent team, the gates and the tab are behaviour and do get requirements."
    - "Decided kick-off is a project skill with fixed steps (round 2), so nothing can be skipped or reordered by accident."
    - "Decided revisions re-check, at most 2 loops (round 9); after that the session stops and talks rather than looping."
    - "Decided the sign-off record carries a hash of the page as signed (Keith, set 6), so an edit after sign-off fails the validator until Keith signs again. Rejected: a CI rule on commits that touch docs/explainers/, and relying on review alone."
    - "Decided CLAUDE.md's explainer rule EXCLUDES docs/explainers/_work/ (Keith, set 6), since nothing there is published or committed; its exact wording goes to Keith before the edit."
    - "Decided sign-off lives in each page's front matter (round 9). The fingerprints that go with it, and the sign-off command - renamed `mothman docs sign-off` by set 5 - are explainers slice 2."
    - "Decided changelog entries only for the tab launch (round 11), not individual pages - so slice 1 ships no CHANGELOG.yaml entry for its page."
    - "Decided under CLAUDE.md's standing rule (Keith, 2026-09-29) that the staleness-gate route is the ONLY way an explainer changes after sign-off: a building session never edits docs/explainers/ or refreshes fingerprints, it reports which explainer is affected. That route itself is explainers slice 2."
