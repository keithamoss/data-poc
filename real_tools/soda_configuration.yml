# Real Soda Core data source configuration, for running via the `soda` CLI
# directly (rather than real_tools/run_soda_real.py's Python Scan API,
# which this project uses instead so it can point the connection at each
# per-run DuckDB file - the CLI reads one static configuration.yml, so
# duplicate this file per run with a different `path`, or use the Python
# API as this repo does, to reproduce that).
#
#   soda scan -d birth_registrations -c real_tools/soda_configuration.yml \
#       contract/bdm-birth-registrations-soda-checks.yml
#
# (run from the repo root, after `SET search_path='raw'` isn't available on
# the CLI path - point `path` at one of the per-run files under
# data/duckdb_runs/, which already puts the table in a "raw" schema, and
# add `schema: raw` below.)
data_source birth_registrations:
  type: duckdb
  path: data/duckdb_runs/run_01_2026-09-01.duckdb
  schema: raw
  read_only: true
