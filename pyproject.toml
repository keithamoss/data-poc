[project]
name = "mothman"
version = "0.1.0"
description = "QA/data-pipeline PoC for a multi-agency government data asset (BDM Birth Registrations + Child Protection), backed by real dbt-core/Soda Core/datacontract-cli/Evidently runs against synthetic data."
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    "duckdb>=1.0",
    "soda-core-duckdb>=3.5",
    "datacontract-cli[duckdb]>=1.2",
    "evidently>=0.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "playwright>=1.62.0",  # real-browser UI verification (dashboard) - `uv run playwright install chromium` once after `uv sync --dev`, then drive it via `uv run python3 ...`; deliberately in the venv, not relied on as a system package, so this works the same on any contributor's machine
]

# soda-core-duckdb declares duckdb<1.1.0, but datacontract-cli[duckdb] needs
# a newer duckdb via its ibis-framework dependency - a real pip
# ResolutionImpossible error if both are installed in one transaction (see
# requirements-real.txt's history for the two-step pip workaround this used
# to need). Verified at runtime, repeatedly, across this whole project: all
# four tools run together fine on duckdb 1.5.5, well past that declared
# ceiling - the ceiling itself is stale, not the actual runtime requirement.
# This override tells uv's resolver to trust that, so `uv sync` resolves
# everything in one step instead of needing a manual two-step pip dance.
[tool.uv]
override-dependencies = ["duckdb>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Just the repo root - generator/, pipeline/, and synthetic_data_generator/
# are real packages now (each has an __init__.py), same as qa_tools/ always
# was (plans/wider.md #20), so everything imports as e.g.
# `from generator import dirty` / `qa_tools.common.parallel_orchestrate`,
# not as flat bare-module names. See plans/wider.md's package-layout entry
# for why the old per-directory pythonpath entries (and every script's own
# sys.path.insert hack) are gone.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
# Excludes qa_tools/dbt_profiles (dbt-generated) and the synthetic-data-
# generator subdirectory's own separate history - lint this repo's own
# actively-developed code, not vendored/generated output.
exclude = ["dbt_project/target", ".venv"]

[tool.ruff.lint]
# Lean on purpose (Keith's call, 2026-09-14): catch real bugs, not enforce
# style on an already-large, deliberately narrative-comment-heavy codebase.
select = [
    "F",   # pyflakes - unused imports/variables, undefined names, real bugs
    "E9",  # syntax errors
]
