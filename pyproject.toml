[project]
name = "mothman"
version = "0.1.0"
description = "QA/data-pipeline PoC for a multi-agency government data asset (BDM Birth Registrations + Child Protection), backed by real dbt-core/Soda Core/datacontract-cli/Evidently runs against synthetic data."
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    "duckdb>=1.0",
    "soda-core-duckdb>=3.5",
    "datacontract-cli[duckdb]>=1.2",
    "evidently>=0.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "click>=8.1",
    "rich>=13.7", # promoted from transitive (dbt-core) to direct - the mothman
    # CLI/TUI's own rich-rendered reports/progress, not just an incidental dep anymore
    "rich-click>=1.7", # mothman CLI's help/error formatting - plans/tooling.md #1
    "questionary>=2.1", # mothman CLI's real interactive arrow-key menus - chosen
    # over InquirerPy/PyInquirer on project-health grounds, see plans/tooling.md #1
    "pyfiglet>=1.0", # mothman CLI's splash-screen wordmark - plans/tooling.md #1
]

[project.optional-dependencies]
# The AWS event-driven MVP (plans/running-thoughts.md #5 Thread B / docs/
# aws-event-driven-mvp-design.md) - kept out of the core dependency set so
# nobody not touching that thread pays for it. `uv sync --extra aws` to
# install. boto3 alone (already a transitive dependency of something else
# in this project - confirmed importable without this extra) is enough to
# run/test aws/lambda_handlers/*.py and qa_tools/cp/completion_tracker.py's
# DynamoDBCompletionTracker; aws-cdk-lib/constructs are only needed to
# actually `cdk synth`/`cdk deploy` aws/cdk/ - never attempted in this
# sandbox (no AWS CLI, no CDK CLI, no real credentials - see the design
# doc's own "What's verified vs. not" section).
aws = [
    "boto3>=1.34",
    "aws-cdk-lib>=2.150",
    "constructs>=10.0",
]

[project.scripts]
mothman = "cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "playwright>=1.62.0", # real-browser UI verification (dashboard) - `uv run playwright install chromium` once after `uv sync --dev`, then drive it via `uv run python3 ...`; deliberately in the venv, not relied on as a system package, so this works the same on any contributor's machine
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "pyte>=0.8.2", # dev-only: scripts/dev/tui_screenshot.py's real terminal-emulator
    # buffer (pty capture -> final on-screen grid, not just a scrolling raw-byte log -
    # needed because questionary/rich redraw in place via cursor-movement ANSI codes) -
    # used to show real CLI/TUI screenshots during mothman development, never imported
    # by the shipped pipeline/CLI itself.
]

# soda-core-duckdb declares duckdb<1.1.0, but datacontract-cli[duckdb] needs
# a newer duckdb via its ibis-framework dependency - a real pip
# ResolutionImpossible error if both are installed in one transaction (see
# requirements-real.txt's history for the two-step pip workaround this used
# to need). Verified at runtime, repeatedly, across this whole project: all
# four tools run together fine on duckdb 1.5.5, well past that declared
# ceiling - the ceiling itself is stale, not the actual runtime requirement.
# This override tells uv's resolver to trust that, so `uv sync` resolves
# everything in one step instead of needing a manual two-step pip dance.
[tool.uv]
override-dependencies = ["duckdb>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Just the repo root - generator/, pipeline/, and synthetic_data_generator/
# are real packages now (each has an __init__.py), same as qa_tools/ always
# was (plans/qa-pipeline.md #84), so everything imports as e.g.
# `from generator import dirty` / `qa_tools.common.parallel_orchestrate`,
# not as flat bare-module names. See plans/publishing-and-history.md #3
# for why the old per-directory pythonpath entries (and every script's own
# sys.path.insert hack) are gone.
pythonpath = ["."]

[tool.coverage.run]
# Just the real pipeline source - not tests/ itself, not dbt_project/
# (dbt-generated), not synthetic_data_generator/ (deliberately out of
# Phase 6's scope - plans/publishing-and-history.md/plans/data-
# generation.md #8 - dormant/unwired code, not worth a coverage floor yet).
source = ["qa_tools", "pipeline", "generator", "dashboard", "cli"]

[tool.coverage.report]
exclude_also = [
    # Never executed under pytest (every qa_tools/*/run_*.py,
    # build_*.py, orchestrate_*.py CLI entrypoint) - not a real gap,
    # just how every one of these scripts is actually invoked
    # (`python3 -m qa_tools.bdm.orchestrate_bdm`, ./run_pipeline.sh,
    # etc.), never as an imported function call under test.
    "if __name__ == .__main__.:",
]
# The real, measured floor as of the Phase 6 step 3 coverage pass
# (2026-09-17, plans/publishing-and-history.md's own "Build progress"
# note - 93.73% across these 4 packages with __main__ guards excluded
# as above, up from 91% before that exclusion) - a small buffer below
# that measured number, not the number itself, so a
# single new untested edge branch doesn't immediately fail CI the way
# sitting exactly at the ceiling would; still real enforcement against
# an actual regression, not a symbolic value picked in advance (Keith's
# own words: pytest-cov + a real threshold "so we can't silently
# regress" - plans/publishing-and-history.md's Phase 6 scoping).
fail_under = 92

[tool.ruff]
target-version = "py311"
line-length = 120
# Excludes qa_tools/dbt_profiles (dbt-generated) and the synthetic-data-
# generator subdirectory's own separate history - lint this repo's own
# actively-developed code, not vendored/generated output.
exclude = ["dbt_project/target", ".venv"]

[tool.ruff.lint]
# Lean on purpose (Keith's call, 2026-09-14): catch real bugs, not enforce
# style on an already-large, deliberately narrative-comment-heavy codebase.
select = [
    "F",   # pyflakes - unused imports/variables, undefined names, real bugs
    "E9",  # syntax errors
]
