repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
  # Real incident, 2026-09-18: a hand-edited contract/*.yaml changelog
  # entry (a JSON string embedded in a YAML single-quoted scalar) got
  # shell-escape-style quoting (\"'\"'\") instead of real YAML quote-
  # doubling ('') - still committable, since ruff only checks Python,
  # and the breakage wasn't caught until the next real tool run parsed
  # the file. check-yaml (a real, standard pre-commit-hooks check - just
  # yaml.safe_load against every staged *.yml/*.yaml) catches this
  # class of mistake at commit time instead, for the four real check/
  # contract YAML files this project's own checks live in as much as
  # any other YAML here.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
  # check-yaml above only proves a file PARSES. It uses yaml.safe_load,
  # which accepts a duplicate mapping key silently and keeps the last
  # one - so a second `decisions:` block on one requirement discarded
  # five real decisions on 2026-09-20 with nothing anywhere noticing.
  # yamllint's key-duplicates rule is the purpose-built check for that;
  # see .yamllint for why every other rule is off, and why a schema
  # validator could not have caught it.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
  # check-yaml and yamllint both glob *.yml/*.yaml, so neither ever
  # looks at .claude/agents/*.md - which carry YAML frontmatter inside a
  # Markdown file. Real incident, 2026-09-22: four of eight subagents had
  # a hard-wrapped multi-line `description:`, which is not a valid plain
  # scalar, so their frontmatter never parsed and Claude Code silently
  # did not register them. They had been unloadable since the day they
  # were written, and the periodic manual check counted files on disk -
  # the same number either way. A `local` hook rather than a stock one
  # because the frontmatter has to be sliced out before yaml.safe_load
  # sees it. Goes through `mothman` like everything else in this repo.
  - repo: local
    hooks:
      - id: mothman-check-agents
        name: agent frontmatter parses
        entry: uv run mothman check --only agents
        language: system
        files: ^\.claude/agents/.*\.md$
        pass_filenames: false
  # The schedule/asset configuration gate, at commit time rather than
  # only in CI. Keith's own call, 2026-09-25: a one-character mistake in
  # a calendar name can leave six datasets expecting nothing, and
  # finding that out after a push is a slow way to learn it. Config
  # only - nothing here opens data/ or a warehouse - so it costs ~1.2s.
  #
  # WHAT IT DOES NOT DO, recorded so nobody later reads it as covering
  # more than it does (plans/post-build-review.md #19): it does not fix
  # the case where a typo'd calendar name produces N identical errors
  # whose suggested fix steers you to the wrong edit. That path ends in
  # a VALID configuration - point the datasets at the misspelling and
  # the gate goes green - so running the same validator sooner, or more
  # often, still goes green. Only naming the common cause fixes that,
  # and it is a separate piece of work.
  #
  # `check --only schedule` rather than `schedule validate` directly,
  # matching mothman check's own --only help text, which names a
  # pre-commit hook as what that option is for.
  - repo: local
    hooks:
      - id: mothman-check-schedule
        name: schedule configuration is valid
        entry: uv run mothman check --only schedule
        language: system
        files: ^contract/.*\.ya?ml$
        pass_filenames: false
  # The hierarchy gate, at commit time for one specific reason beyond
  # the general one (Keith's own ask, 2026-09-26: "a guard against it
  # ever being used"). A cross-table check's result is recorded at
  # qa_results/<agency>/<collection>/_cross-table/<run_id>/, beside the
  # datasets - and that name is only unambiguous while no dataset,
  # collection or agency can be called it. The gate refuses any id
  # beginning with an underscore.
  #
  # Worth having locally rather than only in CI because the failure it
  # prevents is not a red build, it is a directory tree where nobody
  # can tell a scope from a run id - and by the time that is committed
  # and regenerated against, renaming it is a re-key of committed
  # history rather than an edit.
  - repo: local
    hooks:
      - id: mothman-check-hierarchy
        name: no id takes a reserved scope name
        entry: uv run mothman check --only hierarchy
        language: system
        files: ^contract/.*\.ya?ml$
        pass_filenames: false
