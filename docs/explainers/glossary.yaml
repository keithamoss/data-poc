# The explainer glossary (REQ-DOCS-119): one canonical word per concept.
# The ONE source - glossary.md is generated from this by `mothman docs glossary`.
# Every entry was approved by Keith, entry by entry (2026-09-30 to 2026-10-02);
# never add or change one without his approval (criterion 13).
#
# `categories` is ORDERED: it is the order glossary.md's sections render in,
# which is how the supply calendar's terms sit at the back.

categories:
  - key: data
    title: "The data"
  - key: checking
    title: "Checking it"
  - key: deciding
    title: "Deciding what happens to a supply"
  - key: dashboard
    title: "Reading the dashboard"
  - key: calendar
    title: "The supply calendar"

entries:

  # ---------------------------------------------------------------- the data

  - term: data asset
    definition: "All the data one team looks after, from every agency that supplies it, arranged as agencies, collections, and datasets."
    aliases: [asset]
    forms: [data assets, assets]
    defined_by: [REQ-QAC-039, REQ-DASH-003]
    page: null
    draft: false
    idea: false
    category: data

  - term: dataset
    definition: "One table that an agency supplies, with its own contract, its own checks, and its own slot in each period it takes part in."
    aliases: []
    forms: [datasets]
    defined_by: [REQ-QAC-039, REQ-PIPE-052]
    page: null
    draft: false
    idea: false
    category: data

  - term: collection
    definition: "A group of datasets that one agency supplies together, such as Child Protection's six tables."
    aliases: []
    forms: [collections]
    defined_by: [REQ-QAC-039]
    page: null
    draft: false
    idea: false
    category: data

  - term: scheduled data asset
    definition: "A data asset whose supplies are owed on a supply calendar. This is the shape every data asset in Mothman has today."
    aliases: []
    forms: [scheduled assets]
    defined_by: [REQ-PIPE-049, REQ-PIPE-052]
    page: null
    draft: false
    idea: false
    category: data

  - term: one-off data
    definition: "Any table, or set of tables, that we check once rather than on a schedule. Data extracted for a single project is the most common case, but it can be any tabular data we want to check. It has no supply calendar. We check it with one-off checks, so none of it reaches a data asset's permanent reporting."
    aliases: [one-off dataset, one-off data collection, one-off extraction]
    forms: []
    defined_by: []
    page: null
    draft: false
    idea: true
    category: data

  - term: sample data
    definition: "Data provided before a dataset's supply calendar is agreed, so we can build its checks. It may be real, synthetic or scrambled. We check it with one-off checks: a new round for each new set of sample data, or another round each time we add more checks. None of it reaches a data asset's permanent reporting."
    aliases: [sample dataset, sample data collection]
    forms: []
    defined_by: []
    page: null
    draft: false
    idea: true
    category: data

  - term: delivery
    definition: "One drop from a supplier, which may hold several files."
    aliases: []
    forms: [deliveries, deliver, delivers, delivered]
    defined_by: [REQ-GEN-042]
    page: null
    draft: false
    idea: false
    category: data

  - term: arrival
    definition: "One file we received, with its receipt time, which is the moment our own storage took it. A delivery of several files is several arrivals."
    aliases: []
    forms: [arrivals]
    defined_by: [REQ-PIPE-105, REQ-PIPE-034]
    page: null
    draft: false
    idea: false
    category: data

  - term: supply
    definition: "One version of one dataset's table, which is filed to a slot and judged by checks. Each supply comes from one arrival."
    aliases: []
    forms: [supplies]
    defined_by: [REQ-PIPE-034, REQ-PIPE-062]
    page: null
    draft: false
    idea: false
    category: data

  - term: permanent reporting
    definition: "What a data asset reports about its quality over time: its dashboard, and the history behind it. Only supplies that arrive on its supply calendar reach it."
    aliases: []
    forms: []
    defined_by: []
    page: null
    draft: false
    idea: true
    category: data


  # ---------------------------------------------------------------- checking it

  - term: QA run
    definition: "One pass of Mothman's checks over newly arrived data. For now, a person starts each one. Once it is automated, it will start by itself whenever data arrives."
    aliases: []
    forms: [QA runs]
    defined_by: [REQ-PIPE-036]
    page: null
    draft: false
    idea: false
    category: checking

  - term: one-off check
    definition: "Running a dataset's checks on data we do not keep, such as sample data or one-off data. It produces a report and each tool's raw output, for you to keep outside the system. Nothing from it reaches the data asset's permanent reporting."
    aliases: [trial, trial check]
    forms: [one-off checks]
    defined_by: []
    page: null
    draft: false
    idea: true
    category: checking

  - term: recency
    definition: "A category of check that asks whether the data itself is recent enough, such as whether its newest record is from the last few weeks. It's not about when a supply arrived."
    aliases: [timeliness]
    forms: []
    defined_by: [REQ-QAC-024, REQ-QAC-001]
    page: null
    draft: false
    idea: false
    category: checking

  - term: blocked
    definition: "Said of a table whose check cannot run because another table it compares against is missing or held. It is not the same as waiting on a person."
    example: "A check that matches each notification's client identifier to a client in the clients table cannot run while this quarter's clients table is missing, so notifications shows as blocked, even though nothing is wrong with the notifications table itself."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-079]
    page: null
    draft: false
    idea: false
    category: checking


  # ---------------------------------------------------------------- deciding what happens to a supply

  - term: staging
    definition: "Where every arriving supply waits after its checks, until it is decided on. Mothman promotes a green or amber supply from staging automatically when its slot is empty. Anything else waits for a person, who can promote it or reject it."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-060, REQ-PIPE-076]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: filing decision
    definition: "A recorded choice about where a supply belongs, made by a person or by a rule, such as promoting, rejecting or re-filing it."
    aliases: []
    forms: [filing decisions]
    defined_by: [REQ-GHUB-082, REQ-PIPE-074]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: promote
    definition: "To move a supply out of staging into its period, which fills its slot. Mothman promotes a green or amber supply automatically when its slot is empty. A person can also promote a supply that failed one or more of its checks, if they decide to use it anyway."
    aliases: []
    forms: [promotes, promoted, promoting, promotion]
    defined_by: [REQ-PIPE-075, REQ-PIPE-062]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: reject
    definition: "A person's decision that a supply will not be used. Any supply can be rejected, but never by an automatic rule."
    aliases: []
    forms: [rejects, rejected, rejecting, rejection]
    defined_by: [REQ-PIPE-076]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: demote
    definition: "A person's decision to take a promoted supply out of its period and put it back in staging, which leaves its slot unfilled. To take a promoted supply out and not use it at all, a person rejects it instead."
    aliases: [un-decide]
    forms: [demotes, demoted, demoting, demotion]
    defined_by: [REQ-PIPE-076, REQ-GHUB-082]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: re-file
    definition: "A person's decision to move a supply to a different slot from the one the rule chose."
    example: "A supplier sends their third-quarter file so early that it arrives before the third quarter's claim window opens. The rule files it to the second quarter, and a person re-files it to the third quarter."
    aliases: []
    forms: [re-files, re-filed, re-filing]
    defined_by: [REQ-GHUB-082]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: acknowledge
    definition: "A person's note that they have seen an amber supply and are content for it to stand. They make it by commenting /accept on the dataset's QA ticket in GitHub. It is recorded in the decision log, and the dashboard shows an acknowledgement badge beside the supply's status, which stays amber. It changes nothing about where the supply is filed."
    aliases: []
    forms: [acknowledges, acknowledged, acknowledging]
    defined_by: [REQ-QAC-017, REQ-PIPE-092]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: resupply
    definition: "A supply that arrives for a slot already filled. It never promotes itself, so a person decides what happens to it."
    aliases: []
    forms: [resupplies, resupplied]
    defined_by: [REQ-PIPE-062, REQ-PIPE-065]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: substitute
    definition: "A person's decision that a period nobody supplied will use an earlier period's promoted supply instead. The period then shows as substituted."
    example: "A supplier misses the second quarter entirely, so we decide the second quarter will use the first quarter's supply."
    aliases: [standing in, last good one]
    forms: [substitutes, substituted, substituting, substitution, carried forward, carrying forward]
    defined_by: [REQ-PIPE-084, REQ-DASH-085]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: de-substitute
    definition: "A person's decision to undo a substitute, so the period no longer uses an earlier period's supply."
    aliases: []
    forms: [de-substitutes, de-substituted, de-substituting, de-substitution]
    defined_by: [REQ-PIPE-084, REQ-GHUB-082]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: inherit
    definition: "When a dataset does not take part in a period, that period uses the dataset's most recent promoted supply instead. Mothman does this automatically when a period is set up, and a person can also do it by hand."
    example: "In a data asset where most datasets arrive quarterly, an annual dataset supplied each August has nothing due in the other three quarters, so each of them uses the latest August supply."
    aliases: []
    forms: [inherits, inherited, inheriting, inheritance]
    defined_by: [REQ-PIPE-098, REQ-PIPE-099, REQ-DASH-100]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: un-inherit
    definition: "A person's decision to undo an inheritance, so the period no longer uses that earlier supply."
    aliases: []
    forms: [un-inherits, un-inherited, un-inheriting]
    defined_by: [REQ-PIPE-099]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: waiting on a person
    definition: "Said of a slot that cannot move on until a person acts. It may be a decision about a supply that arrived, such as whether to promote a resupply or a supply that failed its checks. Or it may be about a supply that never came, such as chasing the supplier."
    aliases: []
    forms: []
    defined_by: [REQ-DASH-070, REQ-PIPE-076]
    page: null
    draft: false
    idea: false
    category: deciding

  - term: ticket
    definition: "The one GitHub issue for a slot, kept up to date with where that slot's supply has got to."
    aliases: [issue]
    forms: [tickets, issues]
    defined_by: [REQ-PIPE-083, REQ-GHUB-109]
    page: null
    draft: false
    idea: false
    category: deciding


  # ---------------------------------------------------------------- reading the dashboard

  - term: early
    definition: "Said of a supply that arrived before its slot's due time. Early is fine. It says when the supply arrived, never how good its data is."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-066]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: on time
    definition: "Said of a supply that arrived at or after its slot's due time, but within its grace allowance. It says when the supply arrived, never how good its data is."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-066]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: late
    definition: "Said of a supply that arrived after its slot's due time and grace allowance had both passed. It says when the supply arrived, never how good its data is."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-066]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: overdue
    definition: "Said of a slot whose due time has passed with nothing filed to it. It is about what did not arrive, never about what the data says."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-052]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: filled
    definition: "Said of a slot once a supply has been promoted into it. An arrival, or a supply still in staging, never fills a slot."
    aliases: []
    forms: [fill, fills, filling, unfilled]
    defined_by: [REQ-PIPE-062, REQ-PIPE-075]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: closed unfilled
    definition: "Said of a slot that can no longer be claimed, because a later slot for the same dataset is filled. It stays on record as an unmet obligation."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-063, REQ-DASH-070]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: no data
    definition: "Shown when a dataset has nothing to report on the date you're looking at, such as a date before its first supply arrived. The dashboard says no data rather than leaving a blank."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-007, REQ-DASH-041]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: freshness
    definition: "Whether a dataset's latest supply arrived when it should have. If it is overdue, the dataset cannot show as fully green, even when every check passed. It's about the supply being late, not about the data inside it."
    aliases: []
    forms: []
    defined_by: []
    page: null
    draft: false
    idea: true
    category: dashboard

  - term: schedule ended
    definition: "The status of a dataset whose authored dates have run out, so no slot covers the date being viewed. It is not a quality verdict: the data may be perfectly fine. It means someone needs to add more dates to the supply calendar."
    aliases: [exhausted schedule]
    forms: []
    defined_by: [REQ-PIPE-053]
    page: null
    draft: false
    idea: false
    category: dashboard

  - term: in place on
    definition: "A date picker in the reporting dashboard. Choose a date to see the whole data asset as it stood on that date: which supply was in each slot, and what its checks found. It uses everything we know today, including corrections made since. To see what the dashboard itself showed on a past date, open a snapshot instead."
    aliases: [as of]
    forms: []
    defined_by: [REQ-PIPE-081]
    page: null
    draft: false
    idea: false
    category: dashboard


  # ---------------------------------------------------------------- the supply calendar

  - term: delivery agreement
    definition: "What we agreed with a supplier about when each dataset is due, written down in one place, with the supply calendar inside it."
    aliases: []
    forms: [delivery agreements]
    defined_by: [REQ-PIPE-110]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: supply calendar
    definition: "The list of periods, and the date each period's supply is due, inside a delivery agreement. The time of day comes from each dataset. Each dataset follows exactly one."
    aliases: [delivery calendar, schedule]
    forms: [supply calendars, delivery calendars, schedules]
    defined_by: [REQ-PIPE-049, REQ-PIPE-051]
    page: null
    draft: false
    idea: false
    category: calendar
    part_of: "delivery agreement"

  - term: authored dates
    definition: "A supply calendar written out as a list of dates, each carrying its period's name. The other kind is a cadence rule."
    aliases: []
    forms: [authored date]
    defined_by: [REQ-PIPE-049, REQ-PIPE-051]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: cadence rule
    definition: "A supply calendar stated as a rule, such as every day, rather than as a list of dates. Each period is named after its own date, such as 29 September 2026."
    aliases: []
    forms: [cadence rules]
    defined_by: [REQ-PIPE-049, REQ-PIPE-051]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: calendar version
    definition: "One dated edition of a supply calendar. Each period is judged against the version in force on its own date, so a later edition never changes an earlier period."
    aliases: []
    forms: [calendar versions]
    defined_by: [REQ-PIPE-049, REQ-PIPE-051]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: delivery month
    definition: "One of the months in which a supply calendar's authored dates fall. A dataset can take part in only some of them. A dataset that names none takes part in every month."
    example: "In a data asset where most datasets arrive quarterly, a dataset supplied once a year names just its one month, such as August, and has no slot in the other three quarters."
    aliases: []
    forms: [delivery months]
    defined_by: [REQ-PIPE-049]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: period
    definition: "One named point in a supply calendar, carrying a name and a date, that each supply is filed to. A period never moves once it exists."
    aliases: [cycle]
    forms: [periods, cycles]
    defined_by: [REQ-PIPE-051, REQ-PIPE-049]
    page: "2-calendar/periods-and-slots.md"
    draft: false
    idea: false
    category: calendar

  - term: not-expected period
    definition: "A period in which a dataset owes no supply, declared beforehand with a reason. It still shows, marked as not expected, and it has no slot."
    example: "A supplier tells us there will be no third-quarter supply because they are moving to a new system."
    aliases: []
    forms: [not-expected periods, not expected]
    defined_by: [REQ-PIPE-049, REQ-PIPE-052]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: slot
    definition: "One dataset's expected supply for one period, with its own due time, grace allowance, and claim window. Each dataset has its own slots, one for each period it takes part in."
    aliases: []
    forms: [slots]
    defined_by: [REQ-PIPE-052]
    page: "2-calendar/periods-and-slots.md"
    draft: false
    idea: false
    category: calendar

  - term: due time
    definition: "The moment a slot's supply is expected: its period's date at its dataset's expected time of day, in the data asset's time zone."
    aliases: []
    forms: [due times]
    defined_by: [REQ-PIPE-052, REQ-PIPE-048]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: grace allowance
    definition: "Extra time after a slot's due time during which an arriving supply still counts as on time."
    aliases: [grace]
    forms: [grace allowances]
    defined_by: [REQ-PIPE-052, REQ-PIPE-049]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: claim window
    definition: "The stretch of time in which a supply can be filed to a slot. It opens a set time before the slot's due time. It does not close at a set time: it closes when a later slot for the same dataset is filled. Until then, a late supply can still be filed to it, but once the next slot's window opens, a file that arrives on time for the next slot fills that one instead."
    aliases: []
    forms: [claim windows]
    defined_by: [REQ-PIPE-052, REQ-PIPE-049]
    page: null
    draft: false
    idea: false
    category: calendar

  - term: runway
    definition: "How many future slots a dataset's authored dates still cover. When few remain, Mothman warns, counting slots rather than months."
    example: "A quarterly dataset whose dates run to the end of 2027 has five slots of runway in September 2026. Mothman warns once four or fewer remain, which for a quarterly dataset is about a year ahead."
    aliases: []
    forms: []
    defined_by: [REQ-PIPE-053]
    page: null
    draft: false
    idea: false
    category: calendar

