  decisions:
  - "THE HEADLINE PROBLEM (evidence walk-through [8], Keith 2026-11-14): record the 'after' figures as evidence, retire the 'before' halves of REQ-PIPE-296 c7, REQ-GEN-298 c13 and REQ-DASH-299 NFR 6, and send the bootstrap at about 9x its 720s budget here - not called met. REJECTED capturing befores, and retiring all three."
