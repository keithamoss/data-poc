- "id": "REQ-GEN-404"
  title: "The synthetic history's anchor date is an input recorded with the history - one place the generator and the bootstrap take it from, the date used written with the generated history and into the qa schema, and a re-run given that date reproducing the same bytes"
  date_written: "2026-11-14"
  story: "As whoever regenerates the demo, I want the date a history was generated up to to be an input I can see and give back, rather than a constant edited by hand, so that a rolling anchor stays reproducible and a resume regenerates the same history it is comparing against."
  moscow: "must"
  status: "not_started"
  source: "Keith, plans/running-thoughts.md #138 (2026-11-03, morning report 12 Q4: 'make it rolling') and R2 of 'Rolling anchor date scoping', SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "THE SYSTEM SHALL take a generation's anchor from one function, generator.anchor_date.get_anchor_date (generator/anchor_date.py line 49), given the anchor by its caller - REQ-GEN-405 decides which date - and SHALL hold no other default anywhere in the generator or a provider."
  - "THE SYSTEM SHALL read the anchor at call time in every provider, so that no module reads it at import: the Child Protection provider's module-level `_anchor = get_anchor_date()` and START_DATE (assets/quarterly/synthetic/collections/child_protection.py lines 273-274) SHALL become functions."
  - "WHEN a generation writes a history, THE SYSTEM SHALL record the anchor it used, from one value, in three places: the generator's bookkeeping (generator/driver.py write_bookkeeping, line 59) for the generator's own readers; a one-line anchor file beside the delivery tree under data/<asset>/, which asset_model/ reads (its charter covers the delivery tree, QB); and, through the bootstrap, the qa schema (criterion 4) (SR1)."
  - "WHEN a bootstrap replays a history, THE SYSTEM SHALL record the anchor the history was generated with in the qa schema, once per history, so that the dashboard build and `mothman` can read it as a recorded fact (REQ-DASH-407) without reading the bookkeeping, which no pipeline, QA or build module may read (REQ-GEN-043 criterion 7)."
  - "THE SYSTEM SHALL offer `--anchor YYYY-MM-DD` on `mothman pipeline bootstrap` and on every `mothman <collection> generate-synthetic-data`, and `--roll-anchor` on the bootstrap only; giving both SHALL be a usage error naming both; and WHEN an anchor is given, THE SYSTEM SHALL generate the history that anchor gives, byte for byte the same as any earlier generation with that anchor and the same inputs (CLI finding 6)."
  - "WHEN a resume or a checkpoint regenerates a collection's deliveries to compare with a checkpoint (REQ-TEST-160 criterion 2; checkpoints.arrivals_of), THE SYSTEM SHALL regenerate with the anchor recorded for the history being resumed, never with today's, and IF none is recorded, THEN it SHALL refuse, naming `mothman env reset-synthetic` then `mothman pipeline bootstrap`."
  - "IF a generation is asked for an anchor that is not a valid date, THEN THE SYSTEM SHALL refuse naming it; IF it is later than today on the asset's clock, THEN THE SYSTEM SHALL refuse saying '<date> is after today, <today> on <zone>'s clock. A history cannot be generated up to a day that has not happened. Nothing was written.'; IF it is earlier than the fixed test anchor, THEN THE SYSTEM SHALL refuse naming 2026-09-25 as the earliest (SR6); each before anything is written (CLI finding 7)."
  - "IF `mothman <collection> generate-synthetic-data` is asked for an anchor - the fixed one by default, or `--anchor` - that differs from the anchor recorded for the asset's current history (the anchor file, criterion 3), THEN THE SYSTEM SHALL refuse before anything is written, naming both dates and `mothman env reset-synthetic` then `mothman pipeline bootstrap` (SR3, SETTLED by Keith 2026-11-14)."
  - "IF GENERATOR_ANCHOR_DATE is set in the environment (load_local_env reads .env), THEN every generation and bootstrap SHALL refuse, saying the variable is no longer read and naming `--anchor`; README.md (lines 631-635, which still describe a rolling 'today' default and the variable) and every help text SHALL name `--anchor` and none SHALL name the variable (CLI finding 6)."
  - "THE SYSTEM SHALL install the anchor process-wide for the span of a generation or bootstrap, so that the providers' argument-free get_anchor_date() calls (about 15, in correction_claims, scenario_injection and all four providers) read it, and SHALL hand it to every spawned process through assets.handoff() with the snapshot (REQ-PIPE-397) (architect, non-blocking)."
  - "THE SYSTEM SHALL fold the anchor into replay_inputs.cache_key(), so that a history generated at another anchor can never match the fixed-anchor key while the fixed anchor's key stays constant (REQ-GEN-405 criterion 11) (architect, non-blocking)."
  - "THE SYSTEM SHALL resolve, where the asset has no anchor file (no delivery tree - CI's critical half, a fresh checkout), offset dates to the fixed test anchor only where MOTHMAN_ENVIRONMENT is test or ci, and SHALL refuse elsewhere naming the missing file and `mothman pipeline bootstrap`; a real asset never resolves an offset (REQ-GEN-406 criterion 3) (SR1)."
  - "WHEN this requirement is built, THE SYSTEM SHALL amend REQ-GEN-042 criterion 7 to read 'THE SYSTEM SHALL derive the generated schedule from one anchor date, given to the generation and recorded with the history, rather than from the day it is run.' and criterion 8 to read 'WHEN the generator is re-run with the same anchor and unchanged configuration, THE SYSTEM SHALL produce an identical history, and SHALL NOT add a second copy of it alongside the first.' - wording APPROVED AS WORDED by Keith 2026-11-14."
  - "THE SYSTEM SHALL have tests, seen failing first, of two generations with one anchor writing identical trees, of a provider imported before the anchor is installed generating for the anchor installed later, of a spawned process reading the installed anchor, of a resume regenerating with the recorded anchor on a later day, of a future anchor, an anchor before 2026-09-25 and both flags together refused, of a bare generate-synthetic-data refused on a mismatch with the anchor file, of GENERATOR_ANCHOR_DATE refused, and of the cache key differing at another anchor."
  non_functional_requirements:
  - "REPRODUCIBILITY: everything stays seeded; the anchor is the one input that varies, and it is recorded, so a history can always be rebuilt (R2)."
