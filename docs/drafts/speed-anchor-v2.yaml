- "id": "REQ-PIPE-430"
  title: "A bootstrap snapshots the delivery tree it is about to replay - its own installation, after generation and never during it - and answers every recognition from that snapshot, and a tree that changes mid-replay fails the bootstrap"
  date_written: "2026-11-14"
  story: "As whoever regenerates the demo, I want the replay to read the generated delivery tree once rather than hundreds of times, so that a quarter of the replay's time stops going on re-reading files that cannot have changed."
  moscow: "must"
  status: "not_started"
  source: "Keith, SA Q3 (SETTLED 2026-11-14, option (b)): REQ-PIPE-250's first profiled speed-up ('recognise the delivery tree once per tree content rather than on every arrival and every next_receipt call') into this batch; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "WHEN a bootstrap or a resume has finished generating the collections it is about to replay, THE SYSTEM SHALL install a delivery-tree snapshot in asset_model/ - an installation of its own, separate from REQ-PIPE-397's configuration snapshot and never installed during a generation (REQ-GEN-398 criterion 4) - recognise each of those collections' arrivals once (arrivals.arrivals_for, qa_tools/common/arrivals.py line 245), and, while it is installed, answer every later call for those collections and folders from it, including the calls from orchestrate (qa_tools/tools/orchestrate.py line 590), stage (qa_tools/tools/stage.py line 297), the bootstrap (bootstrap.py line 611) and the next-receipt look-ups (promotion.py lines 479 and 510), wherever REQ-PIPE-382 leaves them (architect B4)."
  - "WHERE the bootstrap's one-collection or checkpoint branch generates and replays each collection in turn (bootstrap.py lines 261-270), THE SYSTEM SHALL install the tree snapshot after each collection's generation and release it before the next collection's (architect B4)."
  - "WHEN the tree snapshot is installed, THE SYSTEM SHALL record a digest of each recognised tree's listing and receipts, and WHEN it is released, IF a tree's digest differs, THEN THE SYSTEM SHALL exit non-zero, the TUI SHALL NOT print 'Ready', and the message SHALL name the collection and the folders, say the likely cause neutrally (a hand filing or a generation in another terminal during the run), say the recorded history is kept but not to be trusted, and name `mothman env reset-synthetic` then `mothman pipeline bootstrap` (CLI finding 10)."
  - "WHILE no pin is installed, THE SYSTEM SHALL recognise the tree as it does today, on every call, so that a live processing pass sees a delivery the moment it lands."
  - "THE SYSTEM SHALL return each caller arrivals no caller can change for another - each Arrival's files_by_dataset (a plain dict today, arrivals.py line 67) given as a MappingProxyType or deep-copied - as REQ-PIPE-254 criterion 7's rule asks (architect B4)."
  - "THE SYSTEM SHALL have tests, seen failing first, counting tree recognitions in a replay of a test asset (one per collection), of no snapshot during a generation that recognises its own new tree (a Linkage Products-style read of an earlier collection's tree), of an unpinned call seeing a delivery added since the last call, of a caller's change to files_by_dataset not reaching another caller, and of a tree changed mid-replay failing the bootstrap."
  non_functional_requirements:
  - "PERFORMANCE: REQ-PIPE-250's profile put 25% of the quarterly stream's samples in recognising the whole tree, half of it inside promotion.next_receipt; arrivals_for took 0.6s on 229 deliveries and is called several times per arrival. Target: that share near zero in REQ-PIPE-403's after profile - an upper bound of about 1,500s of today's 6242s replay."
  - "SCALABILITY: this is the term that grows with the history (REQ-PIPE-250 decisions: every arrival re-reads every delivery), so the saving grows with each roll of the anchor and each new collection."
  - "RELIABILITY: generation finishes before any replay starts (bootstrap.py lines 254-275, 'so no pipeline recognises a delivery tree a generator is still writing'), which is what makes one recognition per snapshot safe; criterion 3 catches the case that breaks it."
  - "SECURITY AND PRIVACY: recognition reads file names and receipts, never supply rows; a real asset is never pinned, so a live pass is unchanged."
  dependencies:
  - "REQ-PIPE-397"
  - "REQ-GEN-399"
  - "REQ-PIPE-380"
  - "REQ-PIPE-250"
  decisions:
  - "ADDED TO THIS BATCH (SA Q3, SETTLED by Keith 2026-11-14, option (b)): REQ-PIPE-250's speed-up (1). REJECTED building S1-S3 only, and revisiting the budget."
  - "ITS OWN INSTALLATION, NOT THE CONFIGURATION PIN (architect B4, correcting v1): v1 keyed the tree memo on the configuration pin, which REQ-GEN-398 also installs during generation, when the tree is being written and read back. Installing it after generation, by the bootstrap, is safe because generation finishes before any replay starts; the end digest checks it. Checking a tree's content on every call instead costs a read of every receipt, which is most of what recognition costs. REJECTED invalidating on every write_delivery and remove_deliveries (more moving parts for the same guarantee), and a content-keyed cache for the live pass."
  - "NOT A CONFIGURATION CACHE (delivery-scoper): the delivery tree is supplier files, not configuration, so REQ-PIPE-254's content rule does not govern it; it is asset_model's 'the delivery tree' half (QB)."
  - "FOR THE BUILDER OF REQ-PIPE-382 (architect, seam note, not an edit of v6): the tree half of promotion.next_receipt (lines 479 and 510) is replay-only work in the real pipeline - its own docstring says the live pass has no tree - and with Keith's later answer putting the seeded lag inside the replay clock, letting the replay clock work out the next receipt itself would remove half of this requirement's work. Flagged for #134 v6's REQ-PIPE-382 criterion 4; not decided here."
  open_questions: []
  signed_off: null
- "id": "REQ-PIPE-431"
  title: "datacontract-cli's library call for each run runs in a long-lived worker process of its own, beside Soda Core and Evidently in the foreground and dbt in its worker, while asking, filtering, left-out notes and recording stay in the run's process, with results kept in tool order"
  date_written: "2026-11-14"
  story: "As whoever regenerates the demo, I want datacontract-cli's share of each run to overlap the other tools rather than follow them, so that once dbt is no longer the longest step a run takes only as long as its slowest tool."
  moscow: "should"
  status: "not_started"
  source: "Keith, SA Q3 (SETTLED 2026-11-14, option (b)): the datacontract time sink of REQ-PIPE-250's profile, and its speed-up (2) ('run the four tools of one run side by side'), into this batch; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "THE SYSTEM SHALL send only each run's datacontract-cli library call (datacontract_common.run_against_warehouse, called at qa_tools/tools/run_datacontract.py line 96) to a long-lived worker process, one per pipeline process, started on first use and reused, spawned rather than forked, its start, lock, request and restart code shared with dbt_worker through one helper rather than copied, and returning a picklable result (per check: type, model, diagnostics and quality definition) (architect B5)."
  - "THE SYSTEM SHALL keep in the run's own process everything of run_datacontract.evaluate except that call - asked_for.ask and SCOPED (lines 86-87), run_owner and bulk_recheck's trial owners, left_out.note (line 188), unreadable-table filtering and write_qa_result - so that records carry the process-wide replay clock's instant and the staged agreement, the left-out comparison holds and a re-check trial keeps its scope (architect B5)."
  - "THE SYSTEM SHALL pass the worker its database credentials through its environment and an authenticated connection as dbt_worker does, never on a command line (architect, security)."
  - "WHEN a run's tools are evaluated, THE SYSTEM SHALL run dbt in its worker, datacontract-cli in its worker, and Soda Core then Evidently in the foreground, all three lanes at once, and SHALL keep the recorded results in today's tool order - dbt, Soda Core, datacontract-cli, Evidently (orchestrate.py lines 191-213)."
  - "IF two lanes fail, THEN THE SYSTEM SHALL report the failure of the tool earliest in that order, as parallel_orchestrate.beside does for dbt today, and SHALL leave no worker running a request behind the exception."
  - "IF the datacontract worker dies mid-request or cannot start, THEN THE SYSTEM SHALL fail that run's datacontract step as a tool error whose message names datacontract-cli, says the supply's data was not the cause, says whether the run's other tools' results stand, and says either that the next run restarts the worker (stopped mid-run) or that it will fail the same way (did not start) with what to check; worded to agree with timing-attempts-v1's 'Not checked - the run crashed' (CLI finding 9)."
  - "THE SYSTEM SHALL update `--sequential`'s help on `mothman pipeline bootstrap` and `resume` (cli/pipeline.py line 577 says 'rather than dbt beside the rest') to name datacontract-cli as well (CLI finding 9)."
  - "WHERE TOOLS_CONCURRENTLY is off (`--sequential`'s debugging mode, parallel_orchestrate.py line 120), THE SYSTEM SHALL run all four one after another in tool order, in this process, as today."
  - "THE SYSTEM SHALL have tests, seen failing first, of a run's datacontract library call happening in a different process from Soda Core's, of a replayed run's datacontract records carrying the replay clock's instant, of a re-check trial's datacontract scope surviving, of results in tool order whichever lane finishes first, of a killed worker failing only that step and the next run succeeding, and of the sequential mode running in-process."
  non_functional_requirements:
  - "PERFORMANCE, HONESTLY: datacontract-cli was 18% of the stream's samples; the profile's 49% waiting on dbt says dbt already outlasts the whole foreground, so this saves time per run only once REQ-PIPE-432 has made dbt shorter than Soda plus datacontract plus Evidently. Measured with REQ-PIPE-403, per run, before and after; built after REQ-PIPE-432 for that reason."
  - "RELIABILITY: a worker is a process, so a datacontract-cli crash cannot take the run's process with it; Soda's reload of .env into os.environ (plans/tooling.md #26) cannot reach it."
  - "COST: on this 4-core sandbox two streams side by side, each with a dbt worker, a datacontract worker and a foreground, is six busy processes on four cores; REQ-PIPE-403's after measurement says whether that oversubscribes."
  - "MAINTAINABILITY: one worker pattern for both out-of-process tools - REQ-PIPE-431 SHALL share dbt_worker's request, lock and restart code rather than copy it."
  dependencies:
  - "REQ-PIPE-432"
  - "REQ-PIPE-250"
  - "REQ-TEST-116"
  decisions:
  - "ADDED TO THIS BATCH (SA Q3, SETTLED by Keith 2026-11-14, option (b)). REJECTED building S1-S3 only, and revisiting the budget."
  - "A WORKER PROCESS, NOT A THREAD (delivery-scoper, from the code): Soda Core, datacontract-cli and Evidently run in-process and stay one after another because none was written to share an interpreter concurrently (parallel_orchestrate.beside's docstring), and Soda rewrites os.environ; the only safe way to overlap one with the others is a process, which is how dbt already runs beside them (REQ-TEST-116 criterion 3, REQ-PIPE-157). REJECTED threads for the in-process tools."
  - "DATACONTRACT, NOT SODA OR EVIDENTLY (delivery-scoper, Keith may change it): it is the largest foreground share (18% against Soda's 5% and Evidently's 2%), so it is the one worth a process."
  - "AFTER REQ-PIPE-432 (delivery-scoper): with dbt the critical path, overlapping the foreground changes nothing until dbt is shorter; building it second makes its effect measurable."
  - "ONLY THE LIBRARY CALL MOVES (architect B5, correcting v1): evaluate depends on state that lives only in the pipeline process - the asked-for scope, the trial-owner registry whose docstring says it works because the tools run in one process, left_out's per-process notes, the replay clock and the staged agreement. Moved whole, records would carry the wall clock, LeftOutMismatch would raise and re-check trials would lose their scope."
  - "NOTHING THAT RECORDS RUNS IN A WORKER (architect, 'done well' point 5)."
  open_questions: []
  signed_off: null
- "id": "REQ-PIPE-432"
  title: "A run's dbt step costs less: one dbt invocation profiled by phase, then dbt allowed to run a run's tests side by side and the per-invocation overhead the profile names cut, with the time per run recorded before and after"
  date_written: "2026-11-14"
  story: "As whoever regenerates the demo, I want each run's dbt step to stop being the longest part of every run, so that the replay's critical path shortens rather than only the work that already finishes first."
  moscow: "must"
  status: "not_started"
  source: "Keith, SA Q3 (SETTLED 2026-11-14, option (b)): the dbt time sink of REQ-PIPE-250's profile, and its speed-up (3) ('the dbt worker round trip, about half the stream's active samples'), into this batch; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "BEFORE this requirement's first change, THE SYSTEM SHALL record in its evidence one profile of a quarterly run's dbt step inside the worker (qa_tools/common/dbt_worker.py _serve), split into partial parse, compile, opening the database connection, running the selected nodes and writing run_results.json and manifest.json, over at least ten consecutive runs of one collection."
  - "THE SYSTEM SHALL let dbt run a run's selected tests side by side by passing dbt's documented --threads flag from one named constant (not the `threads: 1` literal in qa_tools/dbt_profiles/profiles.yml), constant for the life of each worker so the partial parse stays valid, and SHALL record in evidence the dbt time per run at 1, 2 and 4 threads on this sandbox with both streams running, choosing the value from that measurement (architect, non-blocking)."
  - "IF the threads setting holds a value that is not a whole number from 1 to the machine's core count, THEN THE SYSTEM SHALL refuse before dbt is invoked, naming the setting and the values allowed, never a dbt traceback (CLI finding 9)."
  - "WHERE the profile in criterion 1 shows a phase that repeats identical work every run - a re-parse, a re-compile of unchanged nodes, a connection opened per invocation - THE SYSTEM SHALL cut it using dbt's documented options only (as REQ-PIPE-157 used only dbt's documented API), and SHALL record the phase and its time before and after."
  - "THE SYSTEM SHALL keep every recorded dbt verdict coming from that run's own run_results.json, parsed as today (evaluate_dbt_*), and SHALL sort the parsed results by unique_id before recording, so that thread scheduling can never reorder what is recorded (architect, non-blocking)."
  - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence the dbt time per run before and after, and the share of the stream's samples spent waiting on the dbt worker, against the profile's 49%."
  - "THE SYSTEM SHALL have tests, seen failing first, of the threads setting reaching the profile dbt is invoked with, and of two runs' verdicts each read from their own target directory with threads above one."
  non_functional_requirements:
  - "PERFORMANCE: about 3.8s a run on one thread when REQ-PIPE-157 landed (dbt_worker's docstring), and the replay's critical path - 49% of the quarterly stream's samples waiting on it. Target: dbt no longer the longest lane of a run, so that REQ-PIPE-431 can pay. Measured per run from qa.run_attempt's tool times on this sandbox, and in REQ-PIPE-403's bootstrap totals."
  - "RELIABILITY: a dbt test failing or erroring reads exactly as at one thread; dbt's threads run the selected nodes of one invocation, never two runs at once in one worker (dbt_worker's one-request lock stays)."
  - "COST: more dbt threads mean more PostgreSQL connections: two bootstrap streams at about 2 x threads, and the test suite at about 4 xdist workers x threads per session, times two concurrent sessions - all well under PostgreSQL's default 100 at 4 threads; a real deployment with thirty collections still runs one pass at a time (architect, non-blocking)."
  - "COMPATIBILITY: dbt's documented options only, so a dbt upgrade does not break it (REQ-PIPE-157's rule)."
  dependencies:
  - "REQ-PIPE-157"
  - "REQ-PIPE-250"
  - "REQ-PIPE-403"
  decisions:
  - "ADDED TO THIS BATCH (SA Q3, SETTLED by Keith 2026-11-14, option (b)). REJECTED building S1-S3 only, and revisiting the budget."
  - "DBT FIRST OF THE THREE (delivery-scoper): it is the critical path of every run - the main thread waits on it after Soda, datacontract and Evidently have finished - so every second cut here is a second off the replay, which is not true of the foreground tools."
  - "THREADS ARE THE FIRST LEVER, MEASURED NOT ASSUMED (delivery-scoper, from the code): the profile runs dbt with threads 1, so a run's tests execute one at a time though they are independent reads; criterion 2 measures 1, 2 and 4 with both streams running before choosing, because on four cores more threads can cost more than they save."
  - "PROFILE THE INVOCATION BEFORE CUTTING IT (delivery-scoper): REQ-PIPE-157 already removed process start and the full re-parse; what is left of 3.8s is not yet known by phase, so criterion 1 comes before criterion 4. This profiles one step inside a settled build, not the 'profile first, decide later' Keith rejected for S2."
  - "THE FLAG, NOT THE PROFILE (architect, non-blocking): --threads is documented, and one constant read by the worker keeps every invocation of a worker's life at one value, which the partial parse needs."
  open_questions: []
  signed_off: null
