  title: "Each asset's from-empty bootstrap is measured before and after this batch by stage, on this sandbox, and recorded as the evidence for REQ-PIPE-250 criteria 2 and 5, which own the 12-minute budget; REQ-PIPE-250's compare-proof criterion is retired"
