  decisions:
  - "DERIVED VALUES ONCE (S1, SETTLED by Keith 2026-11-14): 'with slots and periods derived from it worked out once'. #318 named slots_for_dataset, periods_for_dataset and correction_claims as recomputed inside the generator's loops."
  - "KEYED ON THE AGREEMENT USED AND THE ZONES IN FORCE (architect B3, correcting v1): correction_trial.configured swaps the time-zone versions as well as the agreement, and slots resolve zones through the former, so a key on the agreement alone would answer a staged time-zone correction with slots worked out under the pinned zones - a silent wrong filing. And every one of the four takes agreement=, so the key is the agreement used, not agreement.current()."
