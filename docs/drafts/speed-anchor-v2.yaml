# retirement of REQ-PIPE-250 c4 cites that reason, so it waits too.
requirements:
- "id": "REQ-PIPE-397"
  title: "The shared reading code can pin an asset's configuration for one run - every configuration file read once at the start and answered from that read until the run ends - installed only by the synthetic side, refused on an asset that is not synthetic, and invisible to the pipeline modules that read through it"
  date_written: "2026-11-14"
  story: "As whoever maintains the pipeline, I want one place that can hold an asset's configuration still for the length of a generation or a replay, so that the millions of configuration reads a synthetic history makes stop costing a file read each, without the pipeline ever knowing it is in a replay."
  moscow: "must"
  status: "not_started"
  source: "Keith, post-build-review #318 (2026-11-03) and S1/S2 of 'Speed scoping', SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "THE SYSTEM SHALL offer in asset_model/ one snapshot object with install() and release() that pins the selected asset's configuration for the span of a with-block: at install time it SHALL read, once and up front, every file of a declared set - the asset folder's *.yaml and *.yml files excluding dbt/dbt_packages/, assets/environments.yaml and the shared file-checks default - keyed on each file's resolved path, and while it is installed every read of a file in that set made through config_yaml (read, load and every config_yaml.Built store, qa_tools/common/config_yaml.py lines 110-221 at 5b502c46) SHALL be answered from that snapshot (architect B1)."
  - "WHILE no pin is installed, THE SYSTEM SHALL read every configuration file as it reads now, on every call (REQ-PIPE-254 criterion 15)."
  - "IF the selected asset does not declare `synthetic: true` (read through REQ-PIPE-382's one reader, asset_time.declared_synthetic), THEN THE SYSTEM SHALL refuse to install the pin, naming the asset and its data-asset.yaml, so that the refusal holds with the bootstrap package absent."
  - "THE SYSTEM SHALL have no real pipeline module test whether a pin is installed: the pin SHALL act inside config_yaml's readers only, as REQ-PIPE-382's installed clock acts inside asset_time.now()."
  - "WHILE a pin is installed and a staged correction is in force for an arrival (correction_trial.configured, qa_tools/common/correction_trial.py lines 172-196), THE SYSTEM SHALL answer the agreement and the time-zone versions from the staged configuration for the span of that arrival's event context, the pin answering everything else."
  - "WHEN a configuration file is edited while a pin is installed, THE SYSTEM SHALL go on answering from the pinned text until the pin is released, and the next read after release SHALL see the edit (S1)."
  - "THE SYSTEM SHALL have every reader of a file in the snapshot set read it through config_yaml.read, load or a Built store: at 5b502c46, 54 config_yaml.parse calls in 26 files under qa_tools/, generator/, assets/, pipeline/ and dashboard/ read the file themselves first (for example file_checks.py lines 95 and 357, check_bands.py lines 269, 339, 364, 432 and 459, check_lifecycle.py lines 404, 545, 656, 680, 747 and 813, amber_setting.py line 124, agreement.py line 506, environments.py line 78) and 34 yaml.safe_load calls bypass config_yaml altogether (for example generator/synthetic_inputs.py lines 54, 73 and 90, linked_datasets.py line 31, list_setting_members.py lines 186 and 253, validate_schedule.py lines 2307 and 2330, and dbt_common.py line 193's read of dbt_project.yml); each SHALL be rewritten, the builder re-counting at build (architect B2)."
  - "IF a module under asset_model/, qa_tools/, generator/, pipeline/, dashboard/ or an asset's collections/ or synthetic/collections/ reads a file in the snapshot set with read_text, open or yaml.safe_load outside config_yaml, THEN `mothman check` SHALL fail, naming the file, the line and the path read - as a rule of REQ-TEST-384's one syntax-tree walker, not a scanner of its own (architect B2)."
  - "IF a file in the snapshot set is missing or unreadable at install, THEN the pin SHALL raise as an unpinned read would, on every read of it, and SHALL NOT remember the failure (REQ-PIPE-254 criterion 9)."
  - "THE SYSTEM SHALL have config_yaml.load keep returning a deep copy on every call inside a pin, as it does outside one, because callers mutate what it returns (config_yaml.py line 107); its docstring SHALL say so, so the copy is not optimised away."
  - "THE SYSTEM SHALL pin every configuration read mothman's own code makes, and SHALL leave the QA tools' own reads of their project files (dbt's project and Soda's check files, read by the tools themselves) unpinned, so that a mid-run edit of those reaches the tool as it does today and is caught after the run by the replay cache key (REQ-TEST-117) and the resume digest (REQ-TEST-160) (SA Q4, SETTLED by Keith 2026-11-14)."
  - "THE SYSTEM SHALL hand the installed snapshot - with the selected asset, its layout, the installed anchor (REQ-GEN-404) and the clock - to every process a pinned run spawns through assets.handoff() and assets.adopt() (qa_tools/common/assets.py lines 282 and 292, REQ-PIPE-369 criterion 4's one hand-off), and no process pool SHALL carry an initializer of its own; the target-trial pool (cli/target_trial.py lines 171-174, initializer=assets.select today) SHALL move onto handoff (architect B1)."
  - "THE SYSTEM SHALL take the pin's digest from the snapshot taken at install (criterion 1), so that it names exactly the contents every process in the run was handed."
  - "WHEN this requirement is built, THE SYSTEM SHALL amend REQ-PIPE-254 criterion 15 to read: 'OUTSIDE A PINNED RUN (REQ-PIPE-397), THE SYSTEM SHALL decide whether a file has changed by reading its content on every call, and SHALL NOT use its modification time, size or inode to skip that read.' - wording APPROVED AS WORDED by Keith 2026-11-14."
  - "THE SYSTEM SHALL have tests, seen failing first, of a value read inside a pin unchanged after its file is edited mid-pin, of the edit seen after release, of the pin refused on a non-synthetic asset in a process where the bootstrap package cannot be imported, of a staged correction answered over the pin within its arrival's context only, and of a read outside any pin seeing an edit that leaves size and modification time unchanged (REQ-PIPE-254 criterion 2 still holding), and of a dbt model edited inside a pin reaching dbt (criterion 11's unpinned tool reads), and of a pinned generation of a test asset run under a sys.addaudithook 'open' hook, asserting that no file in the snapshot set is opened from a mothman frame while the pin is installed (a QA tool's frames allowed, SA Q4) (architect B2)."
  non_functional_requirements:
  - "PERFORMANCE: inside a pin a read of a snapshot file makes no file read - stat calls such as assets.Resolver.names (assets.py lines 155-164) and callers' exists()/is_file() checks remain (architect, non-blocking); outside one it costs what it costs today. Measured with REQ-PIPE-403."
  - "RELIABILITY: the pin is process-wide, not a context variable, for the reason replay_clock's own docstring gives - a run's four tools write from worker threads a context variable would not reach; it is released however the with-block ends."
  - "SECURITY: a real asset cannot be pinned (criterion 3), so a long-running real process never answers from a stale configuration; the refusal lives in shared code a real deployment keeps."
  - "MAINTAINABILITY: one seam, beside the clock, so nothing in the 17 real pipeline modules REQ-PIPE-382 lists learns a second replay concept."
  - "COMPATIBILITY: no new dependency; runs through `uv run`."
  dependencies:
  - "REQ-PIPE-380"
  - "REQ-PIPE-382"
  - "REQ-PIPE-254"
  decisions:
  - "PIN ONCE PER RUN (S1, SETTLED by Keith 2026-11-14): a generation and a bootstrap read the configuration at the start and use it throughout, with the slots and periods derived from it worked out once (REQ-PIPE-400); an edit made mid-run is seen by the next run. REJECTED caching by file change (it is what REQ-PIPE-254 criterion 15 forbids, and a stat check still costs a system call per read), and pinning everywhere, which would withdraw criterion 15."
  - "CRITERION 15 STAYS FOR EVERYTHING ELSE (S1): the pipeline, the CLI and the dashboard build outside a bootstrap read whole on every call, as REQ-PIPE-254 decided."
  - "THROUGH THE SEAM, NOT A FLAG (the architect, docs/drafts/separation-v5-reviews.md line 357): a pinned mode the pipeline tested for would put back the replay flag REQ-PIPE-382 removes, so the pin is installed by the synthetic side and acts inside config_yaml, as the clock acts inside asset_time."
  - "config_yaml BECOMES THE CHOKE POINT; IT IS NOT ONE TODAY (corrected after the architect's B2): v1 said hierarchy, agreement and asset_time build through config_yaml.read and a Built store, which is true of those three, but 54 parse calls read their file themselves and 34 yaml.safe_load calls bypass config_yaml, so a pin there alone would miss them silently. Criteria 7 and 8 route every snapshot-set read through it and make that a gate; the audit-hook test proves it. post-build-review #318's counts (hierarchy._load 2.7 million calls, agreement.standing_on 1.5 million in one generation) are still why the choke point matters."
  - "STAGED CORRECTIONS OVERLAY THE PIN (delivery-scoper, from the code): correction_trial.configured swaps agreement.current and asset_time.timezone_versions in memory for an arrival's span (correction_trial.py lines 184-196); the pin is the base those overlays sit on, so a replay still files each arrival against the agreement as it stood (REQ-PIPE-170 criterion 23)."
  - "REFUSED ON A REAL ASSET (delivery-scoper, following REQ-PIPE-382 criterion 6's pattern, Keith may change it): S2 says the pinned mode is used only by the synthetic replay; refusing it in shared code is what makes 'only' true on a deployment without the bootstrap."
  - "NO EQUIVALENCE COMPARE (QD and the standing rule, Keith 2026-11-14): the tests in criterion 15 are the proof; the synthetic history may move."
  - "MOTHMAN'S OWN READS ONLY (SA Q4, SETTLED by Keith 2026-11-14): dbt and Soda read their project files themselves, outside config_yaml; the replay cache key and the resume digest catch a mid-run edit of those after the run. REJECTED copying each dbt project and its check files into a pinned scratch folder at the start."
  - "REQ-PIPE-254 CRITERION 15 AMENDED AS WORDED (SA amendments, APPROVED by Keith 2026-11-14): 'OUTSIDE A PINNED RUN (REQ-PIPE-397), ...', applied when this requirement is built."
  - "EAGER, NOT LAZY (architect B1): v1 pinned a file at its first read, so a spawned child would read fresh any file the parent had not yet read, and REQ-GEN-399's handing and digest could not both hold. The snapshot reads its declared set at install, so the digest is one value and every child gets it."
  - "ONE HAND-OFF FOR EVERY POOL (architect B1 and 'done well' point 2): the bootstrap's stream pool, the target-trial pool and parallel_orchestrate.run_manifest's pool (parallel_orchestrate.py lines 101-103) all start processes during a pinned run; assets.handoff() already is the one hand-off (REQ-PIPE-369 criterion 4), and the target trial's own initializer is the exception it absorbs."
  - "KEYED ON THE RESOLVED PATH (architect, non-blocking): callers mix REPO-relative paths with the asset resolver's, so two spellings of one file must hit one snapshot entry."
  open_questions: []
  signed_off: null
- "id": "REQ-GEN-398"
  title: "A generation - `mothman <collection> generate-synthetic-data` and a bootstrap's generation step, its target trials included - runs with its asset's configuration pinned"
  date_written: "2026-11-14"
  story: "As whoever regenerates the synthetic history, I want a generation to read its configuration once rather than millions of times, so that generating the quarterly asset stops taking minutes of file reads before any real check runs."
  moscow: "must"
  status: "not_started"
  source: "Keith, post-build-review #318 (2026-11-03: 'a real fix memoizes per generation, which needs a decision on how a generation pins its configuration') and S1, SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "WHEN a generation of a synthetic asset starts - the shared driver (generator/driver.py generate, line 153), the target trial, the scenario map writer and checkpoints.arrivals_of (qa_tools/common/checkpoints.py line 201) - THE SYSTEM SHALL install REQ-PIPE-397's snapshot before its first configuration read, hand it to every process the generation starts (the target trial's pool included, REQ-PIPE-397), and release it when the generation ends."
  - "WHEN a bootstrap generates its collections before replaying them (qa_tools/common/bootstrap.py lines 254-275), THE SYSTEM SHALL generate every collection under one pin, so that every collection of the asset is generated from the same configuration."
  - "WHEN a generation ends inside a bootstrap, THE SYSTEM SHALL report its wall clock as an entry of the bootstrap's existing 'Took ...' line (qa_tools/common/bootstrap.py line 308), not as a line of its own format; WHEN `mothman <collection> generate-synthetic-data` ends on its own, it SHALL print one line naming how long generation took (CLI finding 4)."
  - "THE SYSTEM SHALL NOT install REQ-PIPE-430's delivery-tree snapshot at any point of a generation, because a generation recognises the tree it has just written (generator/driver.py line 273; linkage_products.py lines 1424 and 1594, reading the Child Protection and Emergency Department trees written earlier in the same generation; checkpoints.arrivals_of's temporary tree, line 218) (architect B4)."
  - "THE SYSTEM SHALL have a test, seen failing first, of a configuration file edited while a generation runs leaving that generation's output unchanged and the next generation reading the edit."
  non_functional_requirements:
  - "PERFORMANCE: measured with REQ-PIPE-403 - a generation's wall clock before and after, per asset, on this 4-core sandbox, nothing else running. Today's quarterly generation step is about 411s of the 6666s (6653s total less the stream's 6242s), its trials 53s on 4 workers (unmet-evidence [13]); post-build-review #318 profiled one arrivals_of generation at 906s before its two fixes and 457s after."
  - "RELIABILITY: a generation that fails part-way releases the pin and leaves nothing pinned for the next command."
  - "OBSERVABILITY: criterion 3's line sits beside the bootstrap's 'Took ...' line and budget line (bootstrap.py lines 304 and 317)."
  dependencies:
  - "REQ-PIPE-397"
  - "REQ-PIPE-400"
  decisions:
  - "THE GENERATOR FIRST (S1, SETTLED by Keith 2026-11-14): #318 found the generator's cost in hierarchy._load, agreement.standing_on and the slot and period arithmetic it recomputes inside its loops (slots_for_dataset, periods_for_dataset, correction_claims)."
  - "#318's TWO POLISH FIXES STAY (post-build-review #318): the asset listing remembered by the folder's stat and the dbt schema parses remembered per file; REQ-PIPE-401 brings the second back in line with REQ-PIPE-254."
  - "GENERATION NEVER MEMOISES THE TREE (architect B4): v1 keyed REQ-PIPE-430's tree memo on the configuration pin, which this requirement installs during generation, so stale arrivals would have been served to the very checks that compare placements with recognition. The tree snapshot is its own installation, after generation (REQ-PIPE-430)."
  - "GENERATION TIME IN THE 'Took' LINE (CLI finding 4): one format for every stage's time, read where people already look."
  open_questions: []
  signed_off: null
- "id": "REQ-GEN-399"
  title: "The replay inside a bootstrap runs the real pipeline with the asset's configuration pinned - installed by the bootstrap around its own call, every stream process pinned to the same contents - while `mothman pipeline run`, the processing pass, the CLI and the dashboard build read as now"
  date_written: "2026-11-14"
  story: "As whoever regenerates the demo, I want the replay's thousands of real pipeline runs to read the configuration the bootstrap started with, so that a bootstrap spends its time on the checks rather than on re-reading the same files, and a real run's behaviour is untouched."
  moscow: "must"
  status: "not_started"
  source: "Keith, S2 of 'Speed scoping' (SETTLED 2026-11-14, NOT THE RECOMMENDATION) and the architect's note on this batch (docs/drafts/separation-v5-reviews.md line 357); drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "WHEN a bootstrap or a resume replays a synthetic asset, THE SYSTEM SHALL install REQ-PIPE-397's pin around the replay from the bootstrap's own call, as it installs REQ-PIPE-382's replay clock, and no real pipeline module SHALL install, test or know of it."
  - "WHEN a bootstrap or a resume starts processes of its own - the streams (bootstrap._run_concurrently, bootstrap.py lines 754-781), the target trial's pool and parallel_orchestrate.run_manifest's pool - THE SYSTEM SHALL hand each the snapshot REQ-PIPE-397 took at install through assets.handoff(), never re-read, so that no two processes replay against two versions of a file (architect B1)."
  - "WHEN a bootstrap finishes, IF any process it started reports a pinned digest different from the bootstrap's, THEN THE SYSTEM SHALL exit non-zero, the TUI SHALL NOT print 'Ready' (as for target disagreements, cli/app.py lines 233-238), and the message SHALL say this is a fault in mothman's hand-off rather than anything the person did, which processes and files differed, that the history it recorded is kept but not to be trusted, and that `mothman env reset-synthetic` then `mothman pipeline bootstrap` replaces it (CLI finding 10)."
  - "WHEN a bootstrap finishes, THE SYSTEM SHALL print, in the CLI and the TUI alike and in this order: the 'Took ...' line with generation as one of its entries; the budget line; 'Configuration pinned: <first 12 characters of the digest>', dimmed; and a closing line naming the staged tables and 'generated up to <date>' followed by '(the fixed test anchor)' or '(rolled to today on <zone>'s clock; `--anchor <date>` reproduces it)'; and no statement SHALL end in '...' - the TUI's step() (cli/app.py lines 217-226) passing statements through without appending it, as the CLI's _step already does (CLI finding 4)."
  - "WHILE no bootstrap or resume is running, THE SYSTEM SHALL have `mothman pipeline run`, the processing pass, every CLI command and the dashboard build read configuration as REQ-PIPE-254 criterion 15 requires, with no pin installed."
  - "THE SYSTEM SHALL keep the bootstrap's later steps that run after the replay (confirming due corrections, target agreement, bootstrap.py lines 296-311) under the same pin, released only when the bootstrap returns."
  - "THE SYSTEM SHALL have tests, seen failing first, of a calendar or check file edited mid-replay leaving that replay's filings and verdicts as the pinned file says, of the next bootstrap reading the edit, of two stream processes receiving the same digest, and of `mothman pipeline run` on a synthetic asset seeing an edit made since the last call."
  non_functional_requirements:
  - "PERFORMANCE: measured with REQ-PIPE-403; the replay is today's 6242s of the quarterly 6666s, so it is where the budget is won or lost."
  - "RELIABILITY: a crash in a stream process releases nothing the parent holds; the parent's pin is released when the bootstrap returns or raises."
  - "SECURITY AND PRIVACY: a real asset is never pinned (REQ-PIPE-397 criterion 3), so a real deployment's long-running pass always reads the configuration as it is."
  - "OBSERVABILITY: the pinned digest's first 12 characters sit in the closing lines (criterion 4), dim, so it is there when needed and not read otherwise."
  - "COST: the replay cache key (replay_inputs.INPUTS, qa_tools/common/replay_inputs.py line 47) already hashes every pinned file, so pinning changes no CI cache behaviour."
  dependencies:
  - "REQ-PIPE-397"
  - "REQ-PIPE-382"
  - "REQ-PIPE-383"
  - "REQ-GEN-381"
  - "REQ-PIPE-262"
  decisions:
  - "THE REPLAY ALSO RUNS PINNED (S2, SETTLED by Keith 2026-11-14, NOT THE RECOMMENDATION): the pipeline gains a pinned mode used only by the synthetic replay; outside a bootstrap it reads as now (criterion 15). REJECTED profiling first and deciding later (the recommendation), and pinning the generator only."
  - "THROUGH REQ-PIPE-382's SEAM, SO 382 AND 383 LAND FIRST (the architect, docs/drafts/separation-v5-reviews.md line 357): the bootstrap installs the pin around its own call, as it will install its clock once replay_clock.on_replay_clock leaves orchestrate (REQ-PIPE-382 criterion 11)."
  - "HANDED, NOT RE-READ (delivery-scoper, Keith may change it): each stream is a spawned process (bootstrap.py line 778), so a child re-reading at its own start could pin a file edited between two children starting; handing the parent's contents makes S1's 'read at the start' true across processes. REJECTED each process pinning at its own start."
  - "pipeline run STAYS UNPINNED ON A SYNTHETIC ASSET TOO (delivery-scoper, following REQ-PIPE-383's decision that pipeline run on a synthetic asset is the real path): it is a real processing pass over what has arrived."
  - "A DIGEST MISMATCH IS OURS (CLI finding 10): the contents are handed, so a mismatch is a hand-off defect; the message says so rather than implying the person edited a file mid-run."
  - "ONE CLOSING BLOCK FOR BOTH SURFACES (CLI finding 4): 'Generated up to' belongs on the last line both the CLI ('Populated: ...') and the TUI ('Ready - ...') already print, not among the dim progress lines; REQ-DASH-407 criterion 6 points here."
  open_questions: []
  signed_off: null
- "id": "REQ-PIPE-400"
  title: "The values derived from an agreement - each dataset's slots and periods, a calendar's periods, a dataset's standing on a date - are worked out once per immutable Agreement and zone-versions value actually used, pinned or not, so a staged calendar or time-zone correction is never answered from another's result"
  date_written: "2026-11-14"
  story: "As whoever regenerates the demo, I want the schedule arithmetic a generation and a replay repeat inside their loops worked out once for the configuration they pinned, so that a long history does not recompute the same calendar millions of times."
  moscow: "must"
  status: "not_started"
  source: "Keith, S1 of 'Speed scoping' ('with slots and periods derived from it worked out once'), SETTLED 2026-11-14, and post-build-review #318's profile; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). v2 2026-11-14 with the architect's, CLI and dashboard reviews (docs/drafts/speed-anchor-v1-reviews.md) and Keith's SR1-SR9. A PROPOSAL, not signed."
  acceptance_criteria:
  - "THE SYSTEM SHALL work out each of slots.slots_for_dataset (qa_tools/common/slots.py line 254), schedule.periods_for_dataset, schedule.periods_for_calendar and Agreement.standing_on (qa_tools/common/agreement.py line 257) at most once per distinct argument set per (Agreement used, time-zone versions in force) pair, the Agreement being the one each call actually uses - its explicit agreement= argument or schedule._agreement's answer (schedule.py line 325) - never agreement.current() looked up again (architect B3)."
  - "WHILE a staged correction is in force (correction_trial.configured swaps agreement.current and asset_time.timezone_versions, correction_trial.py lines 185-193), THE SYSTEM SHALL key every remembered value on both the staged agreement and the staged time-zone versions, so that no value worked out under one calendar or one set of zones answers a call made under another (architect B3)."
  - "THE SYSTEM SHALL key on the immutable Agreement instance itself, which config_yaml.Built returns unchanged for unchanged text, holding a strong reference to it and to the zone-versions value so an object id is never reused, and SHALL bound what it remembers to the most recent agreements, so that the memo is correct pinned or unpinned and a long-running unpinned process does not grow without limit."
  - "THE SYSTEM SHALL return each remembered value as an immutable value or a caller's own copy (REQ-PIPE-254 criterion 7), and SHALL NOT use functools.lru_cache or functools.cache for it (REQ-PIPE-254 criterion 16)."
  - "THE SYSTEM SHALL have tests, seen failing first, counting each function's real computations in one pinned generation of a test asset (once per argument set), of a staged calendar correction AND a staged time-zone correction each getting values worked out under it, and of an unpinned call seeing an edited calendar."
  non_functional_requirements:
  - "PERFORMANCE: measured with REQ-PIPE-403, and by counting calls in a profiled generation before and after (post-build-review #318's method: hierarchy._load 2.7 million calls, agreement.standing_on 1.5 million)."
  - "SCALABILITY: the remembered set grows with the number of distinct dataset and date arguments a run asks, which at thirty collections is thousands of small values, not millions; it is released with the pin."
