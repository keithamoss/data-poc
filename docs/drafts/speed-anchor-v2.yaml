  - "THE SYSTEM SHALL keep every refusal reset-synthetic has today - not synthetic, in production, the typed phrase (REQ-PIPE-144 criteria 21-23 and 43) - for the files as for the database, deleting nothing when it refuses."
  - "THE SYSTEM SHALL delete only the selected asset's files, resolving real paths first, and SHALL refuse - deleting nothing - a symlink among them or a data folder outside ROOT/data/<asset> or an injected asset root's own data folder (architect, non-blocking)."
  - "THE SYSTEM SHALL have a guard test, seen failing first, that regenerates a test asset at one anchor, resets, regenerates at a later anchor and bootstraps, and finds exactly one history - every delivery, receipt, placement and qa.run of the second and none of the first - and tests of the refusal on a hand-filed folder, of the new phrase, and of a symlinked data folder refused."
  non_functional_requirements:
  - "RELIABILITY: a reset interrupted part-way leaves the next reset able to finish; a later generation into a half-deleted tree is refused by the bootstrap's existing staged-table and history checks."
  - "AUDITABILITY: the reset's confirmation names the files as well as the schemas, so what was deleted is said before it goes."
  - "PRIVACY AT REAL SCALE: refused on a real asset and in production, as today; deleting files widens what the one deliberate command deletes, never who may run it."
  dependencies:
