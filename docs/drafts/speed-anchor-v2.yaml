  - "REQ-PIPE-144"
  - "REQ-GEN-381"
  decisions:
  - "REPLACE, DO NOT ARCHIVE (R4, SETTLED by Keith 2026-11-14): a regeneration replaces the whole history - the generated delivery and receipt files and the database, through the existing typed-confirmation reset - with one history up to the new date; a guard test proves two regenerations on different dates leave one history. REJECTED archiving the previous history."
  - "THE RESET DELETES THE FILES, NOT THE GENERATOR ALONE (delivery-scoper, from the code): reset-synthetic drops schemas only today, and a generation deletes what its bookkeeping says it wrote last time (generator/driver.py previous_delivery_names, line 83) - which misses anything the bookkeeping does not list, as the 26 handfiled-* directories of 2026-09-28 showed. One deliberate command deleting both is R4's 'replaces the whole history'."
  - "THE PHRASE NAMES THE FILES TOO (SR4, SETTLED by Keith 2026-11-14): REJECTED keeping the phrase and relying on the listing above it."
  - "REFUSE WHILE A HAND-FILED FOLDER EXISTS (SR5, SETTLED by Keith 2026-11-14, NOT THE RECOMMENDATION): a folder the generator did not write cannot be regenerated, so the reset stops until a person has moved or deleted it. REJECTED deleting them listed apart (the recommendation), and keeping them. 'Not written by the generator' is decided by the bookkeeping, the one record of what it wrote."
  - "THE LAST MOMENT TO READ THE ANCHOR (CLI finding 1): REQ-GEN-404's reproducibility is 'give that date back', so the reset says the date it is about to delete."
