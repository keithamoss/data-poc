  - "WHEN REQ-GEN-398, REQ-GEN-399, REQ-PIPE-400, REQ-TEST-402 and REQ-PIPE-430 to REQ-PIPE-432 are built, THE SYSTEM SHALL record the same by-stage measurement after them and cite it as evidence for REQ-PIPE-250 criterion 2 (three consecutive runs per asset within 720s), which owns the budget, reporting it to Keith whether or not the budget is met (SR7)."
  - "THE SYSTEM SHALL cite the hand-started test.yml run's cache-miss bootstrap step time for the same commit as evidence for REQ-PIPE-250 criterion 5, rather than restating that criterion here (SR7)."
  - "THE SYSTEM SHALL record with every measurement the commit, the load average at the start and the end, and what else was running (architect, 'done well' point 7)."
