  - "WHEN this requirement is built, THE SYSTEM SHALL retire REQ-PIPE-250 criterion 4 under retired_criteria with REQ-TEST-239's approved reason, and drop REQ-PIPE-250's BEHAVIOUR-PRESERVING NFR (APPROVED AS WORDED by Keith 2026-11-14), naming REQ-TEST-393 as replaced_by once it is in the register (REQ-TEST-239's retirement is HELD for it, Keith 2026-11-14)."
  non_functional_requirements:
  - "PERFORMANCE, THE BASELINE TODAY: quarterly 6666s (generation about 411s, of it trials 53s on 4 workers; the Child Protection, Emergency Department and Linkage Products stream 6242s), daily 681s, both before post-build-review #318's fixes; budget 720s per asset (REQ-PIPE-352 criterion 5). An upper bound, which is why criterion 1 re-measures."
  - "PERFORMANCE, AN HONEST EXPECTATION: REQ-PIPE-250's profile (2026-10-26, py-spy, 240s of the quarterly stream) put 49% of the replay's samples waiting on the dbt worker, 25% recognising the delivery tree, 18% in datacontract-cli, 5% Soda, 5% recording, 3% filing, 2% Evidently, 2% staging, 1.5% the gate. Applied to today's 6242s replay: removing the tree work (REQ-PIPE-430) saves up to about 1,500s; dbt is the critical path of every run, so the run's share falls only as far as dbt falls (REQ-PIPE-432), and datacontract beside the rest (REQ-PIPE-431) pays only once dbt is shorter than the foreground tools. Even if all three land well, the quarterly replay is estimated at about 2,000-3,000s plus generation - several times 720s - because the asset now replays roughly 450 runs (302 Child Protection, 57 Emergency Department, about 105 geocoding and the Linkage Products runs, before knock-ons), and 720s would need well under 1.5s a run, everything included. The daily asset (681s today) should stay within. This is an estimate from one profile, not a measurement; criterion 2 is the measurement."
  - "NOT A CI GATE (REQ-PIPE-250's decision, CONFIRMED by Keith 2026-10-18): timing varies by runner; the budget is an acceptance measurement on this sandbox and a printed line, owned by REQ-PIPE-250 (SR7)."
  - "COST: each from-empty quarterly bootstrap is about 1h50m of sandbox time today, and a CI cache miss about 145 billable minutes (CLAUDE.md, 2026-11-02); the CI figure is read off a hand-started run that is due anyway, never one started for this."
  dependencies:
