# PROPOSAL - plans/running-thoughts.md #134, the CODE half, plus #137 groups
# B-D and the split overview's decisions D1, D1b, D2, D3 and D4.
# Drafted by delivery-scoper: v1 and v2 2026-11-02, v3 the same day (with
# Keith's answers Q1-Q8 and v2's three open questions), v4 2026-11-03 (Perth)
# carrying SPLIT D1-D4 (Keith, 2026-11-03), the relevant answers to morning
# report 12 (Q6, Q8, Q9, Q10, Q11, Q13, Q14, A1) and #137 groups B, C and D.
# NOT SIGNED. Nothing here is built until Keith signs it. v3's settled answers
# (Q1-Q8 and the three v2 questions) are carried, with domain/ renamed
# asset_model/ (SPLIT D1).
#
# Re-scanned against `work` at 04fa7955 (after the asset split), 2026-11-03:
#   asset_model/ closure (asset_time 410, hierarchy 293, schedule 1028, slots
#     583, assets 560, agreement 635, config_yaml 226, in_force 39) = 3,774
#     lines. Its one import of the real pipeline: assets.py line 525
#     (adapter_file imports qa_tools.collections). No database driver.
#   generator side -> qa_tools: 96 import statements in 13 files (54 in
#     generator/, 42 in the providers, 0 in synthetic_data_generator/), naming
#     22 modules; 90 of 135 imported names are asset_model's closure. 8
#     statements reach the replay machinery (scripted_decisions 4,
#     scenario_map 3, correction_replay 1). New since v3: 3 imports of
#     evidently_common in the Linkage Products provider (fold_value_counts,
#     collection_checks, psi_of_counts); the provider also loads the QA
#     adapter (known_values, through qa_tools.collections).
#   providers -> generator/ 64 statements, -> synthetic_data_generator/ 2;
#     synthetic_data_generator/ -> generator/ 8. All inside the generator side.
#   Path loading: assets.load('adapter') is called only from
#     qa_tools/collections/__init__.py line 273; assets.load('provider') only
#     from generator/collections/__init__.py line 45.
#   Replay machinery in qa_tools/common: bootstrap 783, checkpoints 335,
#     replay_clock 136, replay_inputs 263, scripted_decisions 722,
#     scripted_corrections 190, correction_replay 166, scenarios 178,
#     scenario_map 400, target_agreement 387, synthetic_reset 211 = 3,771.
#   Real pipeline -> machinery: 26 statements (replay_clock 22 in 17 modules,
#     bootstrap 1 in knock_on.py line 475, correction_replay 1 in
#     arrival_lifecycle.py line 177, scripted_decisions 1 in orchestrate.py
#     line 586, scenario_map 1 in dashboard/embed_dashboard_data.py line 196).
#   Machinery -> cli.pipeline: 7 statements (bootstrap.py 5, replay_inputs 1,
#     checkpoints 1). v3 named one.
#   Clock calls in the real pipeline: 5 anchor(), 1 advance_to(), 4 active(),
#     2 @on_replay_clock (v3 counted 6 and 7 at b03a7be6).
requirements:
  - id: REQ-PIPE-380
    title: "The shared reading code - asset time, the hierarchy, the schedule, slots and what they need - is one package, asset_model/, which the pipeline, the generator and the bootstrap may all import and which imports none of them"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want the code that reads each asset's time zone, hierarchy, calendar and slots in one package of its own, so that the real pipeline and the synthetic side read every asset's definitions the same way without either depending on the other."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; the code half queued behind the asset split, (a)); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03 with SPLIT D1 (the package renamed asset_model/), Q6, Q8 and Q14 (2026-11-03), re-scanned at 04fa7955. A PROPOSAL, not signed until Keith signs v4."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold the shared reading code in one top-level package, asset_model/ (SPLIT D1, SETTLED by Keith 2026-11-03): asset_time, hierarchy, schedule and slots, and the modules they import - assets, config_yaml, in_force and agreement, 3,774 lines at 04fa7955 - moved with their behaviour unchanged."
      - "THE SYSTEM SHALL keep every asset's definitions - its hierarchy, calendar, time zone, contracts and checks - under assets/<asset>/, and SHALL hold in asset_model/ no agency, collection, dataset, calendar date or time zone of its own."
      - "THE SYSTEM SHALL split the collection registry (qa_tools/collections/__init__.py, 288 lines at 04fa7955) so that which collections an asset declares, with each one's short and run_prefix, is in asset_model/, and loading a collection's QA adapter by path stays in the real pipeline; loading a provider by path already sits in the generator (generator/collections/__init__.py line 45) and stays there."
      - "THE SYSTEM SHALL remove asset_model's one import of the real pipeline at 04fa7955 - assets.adapter_file importing qa_tools.collections (qa_tools/common/assets.py line 525) - by moving adapter_file into the real pipeline's half of the registry."
      - "THE SYSTEM SHALL keep the dbt readiness check (assets.dbt_project_ready and DbtPackagesMissing, REQ-QAC-368 criterion 6 as amended by Q10) in the real pipeline, not in asset_model/."
      - "THE SYSTEM SHALL move the asset resolver's refusals with it unchanged - OutsideTheRepository raised only where code builds a repository path (REQ-PIPE-342 decisions 18 and 20; C7 and Q14, SETTLED by Keith 2026-11-02 and 2026-11-03), BadAssetName, ModuleNameClash and OneAssetPerProcess - with their existing tests passing and asserting what they asserted before."
      - "IF an asset_model module imports qa_tools, pipeline, dashboard, cli, generator, synthetic_data_generator, bootstrap, scenarios or any file under assets/, THEN `mothman check` SHALL fail, naming the file, the line and the imported module (REQ-TEST-384)."
      - "THE SYSTEM SHALL import no database driver, pandas, numpy or QA tool library at module level anywhere in asset_model/, so that importing it opens no connection and needs no supply rows."
      - "THE SYSTEM SHALL move into asset_model/ every pure pipeline function the generator calls (Q1, SETTLED by Keith 2026-11-02) - at 04fa7955 the whole of assignment (open_slot and assign, which import only asset_time and slots), arrival_classification.classify, check_bands (catalogue, default_rows), promotion.effective_at_for and next_receipt, amber_setting.resolve and resolve_on_date, list_setting_members.declared, linked_datasets' asset-folder and column readers, and evidently_common's fold_value_counts, INVALID_CODE and status_for - so that the pipeline and the generator call one definition."
      - "IF a function the generator calls cannot move into asset_model/ without importing the real pipeline, a QA tool library or a database, THEN THE SYSTEM SHALL report it to Keith for a decision rather than allowlist it permanently or hand its value to the generator as data."
      - "WHERE a caller needs the datasets every asset in the repository declares - the feedback validator's agency check (REQ-DOCS-219 criterion 10) and the generator's refusal of a scenario naming a dataset no asset declares (REQ-GEN-246 criterion 8) - THE SYSTEM SHALL offer that read in asset_model/, from configuration only, opening no connection (Q6 and Q8, SETTLED by Keith 2026-11-03)."
      - "WHEN a module moves into asset_model/, THE SYSTEM SHALL rewrite every importer in the same change and SHALL leave no forwarding module under its old path."
      - "WHEN asset_model/ lands, THE SYSTEM SHALL name it in CLAUDE.md's layout table, README's layout tour and docs/components.md in the same change."
      - "THE SYSTEM SHALL show through REQ-TEST-239's compare, normalised as REQ-TEST-357 criteria 2 and 3 are amended (A1 and Q11, SETTLED by Keith 2026-11-02 and 2026-11-03), that the move changes nothing either asset's bootstrap records, generates, builds or offers."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: a move of code, proven by REQ-TEST-239's equivalence compare for each asset, never by re-capturing a pin."
      - "PERFORMANCE: each asset's bootstrap from empty is no slower than before the change by more than 5 percent (SETTLED by Keith 2026-11-02), measured on the same sandbox, and the CLI's import time is unchanged."
      - "PORTABILITY: no new third-party dependency; everything still runs through `uv run` from the repository root; an asset folder injected from outside the repository (REQ-PIPE-342) is read by asset_model/ exactly as today."
      - "SCALABILITY: nothing in asset_model/ is per collection or per asset, so a thirtieth collection or a third asset adds no module to it."
      - "MAINTAINABILITY: every new test module names its asset (C11, SETTLED by Keith 2026-11-02); every asset_model name used outside its own module is public (REQ-PIPE-376)."
      - "SECURITY: asset_model/ only reads committed configuration and runs no adapter or provider code itself; what it loads by path is decided by the caller's side, which REQ-TEST-384 checks."
    dependencies:
      - "REQ-PIPE-342"
      - "REQ-PIPE-369"
      - "REQ-TEST-239"
      - "REQ-TEST-357"
      - "REQ-TEST-384"
      - "REQ-QAC-368"
    decisions:
      - "THE PACKAGE IS asset_model/ (SPLIT D1, SETTLED by Keith 2026-11-03), replacing domain/ (Q2, SETTLED by Keith 2026-11-02), because domain/ read as though it held the definitions, which stay in each asset's folder. REJECTED shared/, model/ and core/."
      - "THE CUT IS RIGHT (SPLIT D1, SETTLED by Keith 2026-11-03): each asset defines its own hierarchy, calendar and time zone in assets/<asset>/; the shared code that only reads those definitions sits in one package the real pipeline and the generator both import; the generator, the bootstrap and scenarios/ stay out of a real deployment."
      - "THE CODE HALF IS ITS OWN BATCH, AFTER THE SPLIT (Keith, 2026-10-31, #134 (a)): the configuration half went into the asset split (REQ-GEN-370, REQ-GEN-371). REJECTED (b), the whole separation after the split, which moves the configuration twice, and (c), the whole separation before the split."
      - "THE CLOSURE MOVES WITH THE FOUR (delivery-scoper, from the scan): schedule and slots import agreement, asset_time imports in_force and assets, so a package holding only the four would import qa_tools and fail its own gate. Re-checked at 04fa7955: still true."
      - "NO FORWARDING MODULES (delivery-scoper): a re-export left at the old path keeps an old import working, so the import gate would stop seeing it. REJECTED shims kept for one push."
      - "THE REGISTRY IS SPLIT, NOT MOVED WHOLE (delivery-scoper): which collections exist is shared, but loading an adapter is the pipeline's and loading a provider is the generator's. The 2026-11-03 scan found the provider half already in generator/collections/, so only the declaration half and adapter_file move."
      - "DBT READINESS STAYS IN THE PIPELINE (delivery-scoper, v4): only the real pipeline runs dbt, and asset_model/ reads definitions; dbt_project_ready moving with assets.py would put a QA tool's install state into the shared reading code."
      - "THE GENERATOR'S PURE PIPELINE FUNCTIONS MOVE INTO asset_model/ (Q1, SETTLED by Keith 2026-11-02): REJECTED a permanent list of pipeline modules the generator may import, and REJECTED handing the generator everything as data, which would let its predictions drift from what the pipeline does."
      - "fold_value_counts MOVES (the v4 brief, 2026-11-03): the Linkage Products provider has folded planned value counts through evidently_common since REQ-GEN-295 criterion 7 was amended (A2, SETTLED by Keith 2026-11-02). The rest of its drift planning (psi_of_counts, which runs Evidently) is open question 1."
      - "THE BOTH-HIERARCHIES READ IS ASSET_MODEL'S (delivery-scoper, v4): Q6 and Q8 (SETTLED by Keith 2026-11-03) allow reading every asset's hierarchy, configuration only; the generator needs it for REQ-GEN-246 criterion 8 and may import only asset_model/, so that is where it goes."
      - "#137 GROUP A IS NOT A DEPENDENCY (Keith, 2026-11-02 ~21:05 Perth: safe tidying is built separately): whichever lands first, the other works on the tree as it then is, and the line counts here are re-taken at build."
    open_questions:
      - "1. THE GENERATOR'S DRIFT PLANNING RUNS EVIDENTLY (found 2026-11-03). The Linkage Products provider plans a geocoding file's drift verdict with evidently_common.psi_of_counts, which rebuilds frames with pandas and runs Evidently's own PSI (compute_psi), and with collection_checks, which reads the check file through the registry. Under criterion 10 this needs Keith. Options: (a) a small drift-planning module in asset_model/ holding fold_value_counts, status_for, excluding, psi_of_counts and compute_psi, importing pandas and Evidently inside functions only, which the real run_evidently also calls - one copy, but asset_model/ then reaches a QA tool library at call time; (b) the generator side keeps its own PSI copy - against A2's 'computed from the same inputs the real drift check uses'; (c) one permanent allowlist entry for this edge - against Q1. RECOMMENDED (a): it keeps A2's single computation and Q1's rule, and criterion 8 still holds because nothing is imported at module level."
    signed_off: null

  - id: REQ-GEN-381
    title: "The bootstrap and replay machinery - bootstrap, checkpoints, replay inputs, the simulated clock, scripted decisions and corrections, correction replay, scenarios, target agreement and the synthetic reset - is a package of its own outside qa_tools/, and the real pipeline never imports it"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want everything that exists only to replay a synthetic history in one package outside the pipeline, so that a deployment leaves it out and the pipeline cannot come to depend on it."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; 'the bootstrap and replay machinery out of qa_tools'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03, re-scanned at 04fa7955 (seven reaches into cli/, not one). A PROPOSAL, not signed until Keith signs v4."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold in one top-level package, bootstrap/ (Q2, SETTLED by Keith 2026-11-02), the modules that exist only to replay a synthetic history: today's qa_tools/common/bootstrap, checkpoints, replay_inputs, scripted_decisions, scripted_corrections, correction_replay, scenarios, target_agreement and synthetic_reset, and the simulated half of replay_clock (REQ-PIPE-382), 3,771 lines with the scenario map at 04fa7955. None of them SHALL remain under qa_tools/."
      - "IF `mothman pipeline bootstrap` is asked to run for an asset that does not declare `synthetic: true`, THEN THE SYSTEM SHALL refuse, naming the asset, and replay_clock.replaying's wall-clock branch for a real asset's bootstrap SHALL go; a real asset's first run is `mothman pipeline run` (Q5, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL let the bootstrap package import asset_model/, scenarios/ (REQ-GEN-386 criterion 4), the real pipeline and the generator's one public module (REQ-GEN-386 criterion 3), and SHALL NOT let it import cli/: the 7 statements reaching cli.pipeline at 04fa7955 (bootstrap.py lines 392, 488, 493, 511 and 695; replay_inputs.py line 155; checkpoints.py line 211) SHALL go."
      - "IF any module under qa_tools/, pipeline/, dashboard/ or an asset's collections/ imports the bootstrap package, THEN `mothman check` SHALL fail, naming it (REQ-TEST-384)."
      - "THE SYSTEM SHALL move how collections are grouped into streams (bootstrap.streams today) into the real pipeline, because knock_on.py (line 475 at 04fa7955) reads it outside any replay."
      - "THE SYSTEM SHALL keep `mothman pipeline bootstrap`, checkpoints and resume, `mothman pipeline cache-key`, `mothman scenarios`, the target trial and `mothman env reset-synthetic` doing what they do today for each asset (REQ-PIPE-352, REQ-PIPE-365 criteria 2 and 3), with their existing tests passing and asserting what they asserted before."
      - "THE SYSTEM SHALL key the replay cache (replay_inputs.cache_key) on the bootstrap package's own files as well as today's inputs, so that a change to the machinery restarts a resume as a change to it under qa_tools/ does today."
      - "WHEN bootstrap/ lands, THE SYSTEM SHALL name it in CLAUDE.md's layout table, README's layout tour and docs/components.md in the same change."
      - "THE SYSTEM SHALL show through REQ-TEST-239's compare, normalised as REQ-TEST-357 criteria 2 and 3 are amended, that the move changes nothing either asset's bootstrap records, generates, builds or offers."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: proven by REQ-TEST-239's equivalence compare for each asset."
      - "PERFORMANCE: each asset's bootstrap from empty is no slower than before the change by more than 5 percent (SETTLED by Keith 2026-11-02), and it still meets REQ-PIPE-352 criterion 5's 12 minutes wherever it met it before."
      - "RELIABILITY: a resume after the move still restarts when machinery changes (criterion 7), so a checkpoint never outlives the code that wrote it."
      - "PRIVACY AT REAL SCALE: the package that can invent a record's time and play a scripted person is the part a real deployment leaves out."
      - "MAINTAINABILITY: about 3,800 lines change address once; nothing gains a new dependency; every new test module names its asset (C11)."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-382"
      - "REQ-PIPE-383"
      - "REQ-TEST-384"
      - "REQ-GEN-386"
      - "REQ-PIPE-352"
      - "REQ-PIPE-365"
      - "REQ-TEST-239"
    decisions:
      - "OUT OF qa_tools, NOT A SUBPACKAGE OF IT (Keith, 2026-10-31, #134: 'strict separation ... with the actual pipelines'). REJECTED (b) and (c) of #134 as in REQ-PIPE-380."
      - "SEPARATE FROM THE GENERATOR, NOT ONE 'synthetic' PACKAGE (Keith, 2026-10-31: 'a strict separation between themselves'). REJECTED one package holding both, with the separation left to convention."
      - "SYNTHETIC RESET GOES WITH THE BOOTSTRAP (delivery-scoper): it is refused unless the asset is synthetic and exists only to start a replay from empty."
      - "THE SCENARIO MAP IS SPLIT, NOT MOVED HERE WHOLE (delivery-scoper): its writer goes with the generator (REQ-GEN-386 criterion 6), its vocabulary with scenarios/ (Q4), and the reader the dashboard uses stays with the pipeline (REQ-PIPE-385 criterion 4)."
      - "THE BOOTSTRAP IS SYNTHETIC-ONLY (Q5, SETTLED by Keith 2026-11-02): REJECTED keeping a bootstrap for a real asset, whose first run is `mothman pipeline run`."
      - "THE BOOTSTRAP STAYS GEN (SETTLED by Keith 2026-11-02): REJECTED PIPE, and REJECTED a new eighth component code."
      - "SEVEN REACHES INTO cli/, NOT ONE (the split overview, corrected 2026-11-02; re-counted 2026-11-03): v3 named only generated_into. All seven go through the generator's public module, which offers what cli/pipeline.py offers the bootstrap today."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-382
    title: "The real pipeline reads the time through one clock in asset_model/, which only a replay of a synthetic asset may replace, and no real pipeline module imports replay_clock or sets the time"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want the pipeline to ask one clock for the time and never know whether a replay is running, so that the simulated clock can leave with the bootstrap and a real record's time can still never be invented."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; 'the replay clock untangled from the real pipeline'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03, re-counted at 04fa7955, with #137 group D's three readers of `synthetic: true` folded in. A PROPOSAL, not signed until Keith signs v4."
    acceptance_criteria:
      - "THE SYSTEM SHALL give the real pipeline one clock to stamp records with, in asset_model/, and every real pipeline module that reads replay_clock today SHALL read the time from that clock and import nothing of replay_clock: 17 modules and 22 import statements at 04fa7955 (stage and orchestrate in qa_tools/tools/; arrival_lifecycle, census, correction_apply, decision_log, delivery_log, file_checks, filing, gate, inheritance, knock_on, period_schema, qa_store, recheck, schedule_ended and supply_holds in qa_tools/common/)."
      - "WHILE no replay clock is installed, THE SYSTEM SHALL stamp every record with the wall clock, as asset_time.now() does today."
      - "THE SYSTEM SHALL let the clock be replaced only by one installation call for the span of a replay; IF the selected asset does not declare `synthetic: true`, THEN asset_model/ SHALL refuse the installation itself, so that the refusal holds with the bootstrap package absent (Q6 of 2026-11-02, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL read an asset's `synthetic: true` declaration in one place, in asset_model/, and the three readers of it today (replay_clock._is_synthetic, asset_time.py line 192 and synthetic_reset.is_synthetic) SHALL call that one (#137 group D)."
      - "THE SYSTEM SHALL move every call that sets the simulated time out of the real pipeline and into the bootstrap package, driven through REQ-PIPE-383's hooks - at 04fa7955 5 anchor() calls (orchestrate.py line 558, stage.py line 163, arrival_lifecycle.py lines 200 and 241, delivery_log.py line 395) and 1 advance_to() call (decision_log.py line 972) - EVERY one of them, the mid-step anchor() calls in stage.py and delivery_log.py included, each moved into a clock hook (SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL remove the replay_clock.active() reads (4 at 04fa7955: orchestrate.py line 557, arrival_lifecycle.py lines 175 and 199, decision_log.py line 971) and the 2 @replay_clock.on_replay_clock decorations (orchestrate.py lines 548 and 658) from real pipeline modules, the bootstrap entering the replay span around its own call instead."
      - "WHERE MOTHMAN_PINNED_NOW is set, THE SYSTEM SHALL pin the time through the same installation call and the same refusal, so that there is one way to give the pipeline a time other than the wall clock (Q7, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL have tests, seen failing first, of a real pipeline module stamping a record with an installed clock, of installation refused on a non-synthetic asset in a process where the bootstrap package cannot be imported, and of a record stamped with the wall clock when no clock is installed."
      - "WHEN REQ-TEST-239's compare is run before and after this change, THE SYSTEM SHALL show every surface equal except recorded instants written by the steps that anchored mid-step (stage.py and delivery_log.py); IF any other recorded instant, or anything else, differs, THEN the build SHALL stop and report it."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence every recorded instant that moved - which table and record, its old and new value, and by how much - and SHALL accept those moves as the new recorded instants (SETTLED by Keith 2026-11-02)."
    non_functional_requirements:
      - "SECURITY AND PRIVACY: a real asset's record of when something happened is evidence; the refusal to invent it lives in code a real deployment keeps (criterion 3)."
      - "BEHAVIOUR-PRESERVING EXCEPT WHERE LISTED: every surface of REQ-TEST-239's compare is equal for each asset except the recorded instants of the steps that anchored mid-step, which may move and are listed record by record in evidence (criteria 9 and 10, SETTLED by Keith 2026-11-02)."
      - "PERFORMANCE: reading the clock costs what asset_time.now() costs today; the bootstrap is no slower than before by more than 5 percent (SETTLED by Keith 2026-11-02)."
      - "RELIABILITY: the clock stays process-wide, as replay_clock's own docstring explains (a run's four tools write from worker threads a context variable would not reach)."
      - "AUDITABILITY: run_by and run_timestamp keep coming from the same places; only which module supplies the instant changes."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-383"
      - "REQ-PIPE-081"
      - "REQ-TEST-239"
    decisions:
      - "ONE SEAM, NOT A FLAG IN EVERY MODULE (Keith, 2026-10-31, #134: replay_clock 'woven into about 20 real pipeline modules'; 17 at both the 2026-11-02 and 2026-11-03 counts)."
      - "THE PIPELINE ONLY READS THE CLOCK, THE BOOTSTRAP SETS IT (delivery-scoper): anchoring at an arrival's receipt and advancing to a decision's instant are replay acts, so they belong with the replay."
      - "THE REFUSAL LIVES IN THE SHARED CLOCK (Q6 of 2026-11-02, SETTLED by Keith 2026-11-02): REJECTED leaving it to the bootstrap, which a real deployment does not have."
      - "MOTHMAN_PINNED_NOW GOES THROUGH THE SAME SEAM (Q7, SETTLED by Keith 2026-11-02): REJECTED leaving it as a second way to set the time, in asset_time."
      - "REJECTED passing a clock argument through every call (delivery-scoper): it would widen the signature of every stamping function in 17 modules for a replay-only need."
      - "EVERY anchor() CALL MOVES, AND THE NEW INSTANTS ARE ACCEPTED (SETTLED by Keith 2026-11-02): the mid-step calls in stage.py and delivery_log.py move into clock hooks too, and the instants they stamp may change. REJECTED reporting each call that could not move without changing an instant for a decision of its own."
      - "ONE READER OF synthetic: true (#137 group D, which noted it already folded here): three hand-written readers of one declaration would eventually disagree, and the refusal in criterion 3 depends on it."
      - "COUNTS RE-TAKEN 2026-11-03: v3 counted 6 anchor() and 7 active() at b03a7be6; 04fa7955 has 5 and 4. The criteria name every call; the builder re-counts at build."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-383
    title: "Scripted decisions and scripted corrections are played by the bootstrap through hooks the replay offers, and the real pipeline neither builds a player nor imports scripted_decisions or correction_replay"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want the real pipeline to offer a place to act between arrivals rather than to play scripted decisions itself, so that a synthetic history's scripted people go with the bootstrap and the pipeline only ever processes what arrived."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31 scan: 'orchestrate plays scripted decisions'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03, line numbers re-taken at 04fa7955. A PROPOSAL, not signed until Keith signs v4."
    acceptance_criteria:
      - "THE SYSTEM SHALL let a caller of a collection's replay and of a stream's replay (orchestrate.run_pipeline and run_stream today) pass a hook run before each arrival and after the last, the shape scripted_decisions.Player and orchestrate.StreamPlayer have today, and SHALL run none WHERE none is passed."
      - "THE SYSTEM SHALL NOT build a scripted-decision player inside the real pipeline: orchestrate._begin's default of scripted_decisions.Player(coll.id) (line 606 at 04fa7955, imported at line 586) SHALL go, and the bootstrap SHALL build each collection's player and each stream's combined player and pass it in, StreamPlayer (line 640) moving with it."
      - "THE SYSTEM SHALL hand an arrival's scripted correction to arrival_lifecycle through the same hook rather than have it import correction_replay (arrival_lifecycle.py line 177 at 04fa7955)."
      - "WHEN the bootstrap replays a synthetic asset, THE SYSTEM SHALL play every scripted decision and correction at the instant and in the order it plays them today, through the same decision path a person uses (REQ-GEN-135), refused unless the asset declares itself synthetic."
      - "WHEN `mothman pipeline run` or the processing pass runs, on any asset, THE SYSTEM SHALL play no scripted decision and no scripted correction; only the bootstrap plays them (Q5, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL have tests, seen failing first, of a replay given no hook playing nothing, and of a stream's hook called before an arrival of another collection received after a decision's instant (REQ-PIPE-262 criterion 4), and SHALL show through REQ-TEST-239's compare that every decision-log entry is unchanged."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: the decision log, filings and promotions of each asset's bootstrap are unchanged, proven by REQ-TEST-239's compare."
      - "AUDITABILITY: scripted decisions keep their synthetic actor and recorded instants (REQ-GEN-135), so a replayed history still says who decided and when."
      - "SECURITY: the real pipeline keeps its refusal of the synthetic actor outside a replay (filing_decisions.py, people.py), because a guard is not machinery and must stay where a real deployment runs it."
      - "PERFORMANCE: a hook call per arrival is what the player call costs today."
    dependencies:
