requirements:
- id: REQ-QAC-176
  title: "Every check result records a fingerprint of the check's definition that survives settings being added"
  date_written: '2026-10-10'
  story: "As the person who fixes a check, I want every recorded result to carry a fingerprint of the check's definition as it stood when it ran, so that the system can say exactly which supplies were judged under an old definition - without a date anyone typed, and without every supply looking stale each time the system grows a new setting."
  moscow: should
  status: not_started
  source: "Split out of REQ-PIPE-164 on 2026-10-10 (Keith), after the delivery-architect's 2026-10-08 review proposed recording each check's config_hash on every result and Keith chose a fingerprint over the changelog-date cut-off. Scope widened by Keith the same day on the architect's second pass. SCOPER PASS by delivery-scoper, 2026-10-14 (unsigned triage). SIGN-OFF HELD by Keith, 2026-10-14, behind plans/running-thoughts.md #89 (schema migrations), because criterion 18 collides with it. SPLIT by Keith, 2026-10-14 (176-B, option A): the changelog-gate half - former criteria 3 to 6, 17, 19 and 23 - is REQ-QAC-223, signable now; this keeps the fingerprint on every result, and stays held."
  "acceptance_criteria":
  - "THE SYSTEM SHALL record, with every check result, a fingerprint of that check's definition as it stood when the result was produced."
  - "THE SYSTEM SHALL compute that fingerprint with the one writer that already fingerprints a check's definition for the changelog gate (check_lifecycle's config hash, as REQ-QAC-223 widens it), extended so that a setting whose value equals its frozen default is left out before hashing."
  - "THE SYSTEM SHALL include in a check's fingerprint the check's own expression or test type and its configuration, so that changing either changes the fingerprint."
  - "THE SYSTEM SHALL include in a dbt check's fingerprint, for a generic test, the text of the project macro that defines its test type, and for a singular test, the text of its SQL file and of every project macro whose name appears in it, followed transitively - found by scanning the project's macros and generic-test directories; and SHALL NOT include package macros or staging model SQL."
  - "THE SYSTEM SHALL hold each Evidently check's whole definition - the column it compares, its method and its warn and fail thresholds - as literals in its CHECK_LIFECYCLE entry, SHALL have the runners read them from there by check_id, and SHALL include them in its fingerprint."
  - "THE SYSTEM SHALL read every source file a fingerprint covers through one reader given a path and a git ref, so that the changelog gate fingerprints the diff base's files as they stood at that ref, and a run fingerprints the working tree."
  - "THE SYSTEM SHALL normalise a check's settings before comparing them with the frozen defaults and before serialising them - dates written as ISO strings - and SHALL refuse any value of a type it does not know, rather than coerce it."
  - "THE SYSTEM SHALL key the frozen defaults by tool and by the setting's path within that tool's configuration, scoped to the check kind where a default applies to one kind only."
  - "THE SYSTEM SHALL drop a setting equal to its frozen default by recursing into maps only, comparing lists whole, dropping a map left empty by the dropping, and treating null as equal to a default only where the table says null."
  - "THE SYSTEM SHALL keep the frozen defaults as one append-only list in code, shared across scheme versions, each entry giving the tool, the setting's path, any check-kind scope, the value the system used when that setting was introduced, and the scheme version that introduced it."
  - "IF an existing frozen-default entry is changed or removed, THEN THE SYSTEM SHALL refuse it except as a new scheme version."
  - "THE SYSTEM SHALL compare a stored fingerprint with the check's current definition fingerprinted under the stored fingerprint's own scheme version, and SHALL keep every scheme version's writer and frozen-defaults table while any recorded result carries it, so that a new scheme version alone makes no stored fingerprint differ."
  - "THE SYSTEM SHALL store the fingerprint on the check result row as a column of its own, written by both functions that record results - record_results and record_file_results - including the not-evaluated records they synthesise."
  - "THE SYSTEM SHALL build the map of check id to fingerprint once per process, SHALL raise rather than build a partial map if any check definition fails to parse, and SHALL refuse to record a result whose check id has no fingerprint in that map."
  - "THE SYSTEM SHALL have a golden test that pins the writer - a fixed set of literal per-tool configurations committed in the test with their expected v1 fingerprints - so that any drift, including a canonical-JSON library upgrade, fails."
  - "THE SYSTEM SHALL have a test that adding a setting at its frozen default leaves every real check's fingerprint unchanged, and that changing one check's threshold, expression or SQL changes that check's fingerprint alone."
  - "THE SYSTEM SHALL have the changelog gate use the same fingerprint, so that a change to a check's expression, a singular test's SQL or an Evidently threshold made without a changelog entry is refused."
  - "HELD BEHIND plans/running-thoughts.md #89 - NOT FOR SIGN-OFF UNTIL #89 SETTLES (Keith, 2026-10-14). AS DRAFTED 2026-10-10: IF the schema change that adds the fingerprint column finds recorded results that predate it, THEN THE SYSTEM SHALL refuse to run, saying that this database's results were recorded before check fingerprints existed and so cannot be upgraded in place, and printing `mothman env reset-synthetic` - which asks for typed confirmation - and `mothman pipeline bootstrap`, each on a line of its own. MIGRATION-ERA ALTERNATIVE (proposed, #89 rule 1): WHERE a check result was recorded before fingerprints were, THE SYSTEM SHALL leave its fingerprint empty, meaning not recorded at the time, and SHALL NOT compute one for it from any later definition."
  - "THE SYSTEM SHALL amend, in the same change, REQ-QAC-006 criterion 2 to say that a change to a check's expression, a singular test's SQL or a project macro it uses, or an Evidently check's column, method or thresholds is a definition change."
  - "THE SYSTEM SHALL serialise the settings it hashes as RFC 8785 canonical JSON."
  - "THE SYSTEM SHALL write the fingerprint with its scheme version, as 'v1:' followed by the full 64-hex-digit SHA-256."
  - "THE SYSTEM SHALL fingerprint a file check per dataset from that dataset's own definition of it, so that changing one dataset's definition changes that dataset's fingerprint alone."
  - "WHERE one source file moves several checks' fingerprints, THE SYSTEM SHALL have the changelog gate report it once, naming the file and listing the checks, rather than once per check."
