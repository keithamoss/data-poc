# DRAFT - unsigned triage re-scope, delivery-scoper, 2026-10-14.
# Every entry is a PROPOSAL for Keith's sign-off; nothing here is signed.
# Same ids as the live register, plus REQ-DASH-221 (split out of REQ-DASH-175) and REQ-QAC-223 (split out of REQ-QAC-176).
# Keith's answers of 2026-10-14 afternoon are folded in (summary.md, 'Keith's answers').
# The delivery-architect and delivery-cli-ux reviews, and Keith's answers to them (all option A), are folded in too (summary.md, 'Reviews folded').
# See summary.md beside this file for what changed, the questions, and amendments to signed requirements.
requirements:
- id: REQ-PIPE-164
  title: "A person can have one supply's checks run again where it is filed, without moving it"
  date_written: '2026-10-07'
  story: "As the person who has just fixed a check that was wrong - our mistake, not the supplier's - I want to ask for a waiting supply's QA to be run again in the period it is filed to, so that a verdict produced by our own fault does not stand, and nobody has to re-file a supply to the same place or promote a red one to get past it."
  moscow: should
  status: not_started
  source: "delivery-scoper, 2026-10-07 - a gap found auditing Keith's condition on REQ-PIPE-111. Verified against built code: REQ-PIPE-140's re-check runs only when a decision or a reload owes one (cli/common.py refuses a recorded re-run of an arrival and names the re-check as 'owed by the decision that calls for it'); no decision exists whose purpose is the re-check itself. SPLIT 2026-10-10 - see the first decision. CURRENCY PASS by delivery-scoper, 2026-10-14 (unsigned triage, docs/drafts/unsigned-triage/): checked against everything signed since - REQ-PIPE-163, REQ-PIPE-179, REQ-DASH-180, REQ-PIPE-193/194, REQ-PIPE-168, REQ-PIPE-170, REQ-PIPE-173."
  "acceptance_criteria":
  - "THE SYSTEM SHALL offer RE-CHECK as a filing decision a person raises about a supply that is filed and waiting, or filed and promoted, on the same terms as every other - actor, mandatory reason, allowlist, refusal, one implementation behind every route."
  - "WHEN a person re-checks a supply, THE SYSTEM SHALL, in one transaction, record the re-check decision and an owed re-check (REQ-PIPE-140) naming that decision as its cause, the owed re-check being a run of its own covering the supply's own checks and the cross-table checks that read it, against its filed period, with the supply's tables resolved through REQ-PIPE-193 criterion 13's one resolver."
  - "THE SYSTEM SHALL NOT run any QA inside the transaction that records a re-check."
  - "WHEN a re-check is recorded in the terminal's filing-decisions door, THE SYSTEM SHALL run its owed re-check straight after the transaction commits, while the person waits, through REQ-PIPE-140's mechanism."
  - "WHEN a re-check is recorded through `mothman supply decide` without --wait, THE SYSTEM SHALL say that its checks are owed, SHALL print `mothman pipeline process` on a line of its own, saying that it runs every owed QA run and not only this one and that nothing runs until the processing pass or that command does, and SHALL NOT wait for them."
  - "IF that run is interrupted or fails to complete, THEN THE SYSTEM SHALL leave it owed for the processing pass (REQ-PIPE-140 criterion 8), and the re-check decision SHALL stand."
  - "WHERE the re-checked supply is waiting, THE SYSTEM SHALL apply the promotion gate to the new verdict exactly as for a first arrival, under the settings in force at that instant."
  - "WHERE the re-checked supply is promoted, THE SYSTEM SHALL record the new verdict as its current one, SHALL NOT apply the promotion gate to it or write any gate decision for it, and SHALL NOT demote or move it, leaving any change of what the period holds to a person's decision."
  - "THE SYSTEM SHALL NOT move the supply, change its filing or change what any period resolves to on a re-check."
  - "IF a person re-checks a supply that is not filed and waiting or filed and promoted, THEN THE SYSTEM SHALL refuse it and say why - for a held supply, giving the hold's own responses as its label works them out (REQ-PIPE-179 criterion 18), as REQ-PIPE-163 criterion 38's refusal of promote does, each command on a line of its own; and for a rejected supply naming promote, and for a superseded one un-supersede, as the decision that would bring it back to where it can be re-checked, with its flag form on a line of its own."
  - "THE SYSTEM SHALL offer re-check in the terminal's filing-decisions door on every slot holding a supply that is filed and waiting or filed and promoted - except a file of an open contested pair, on which the door offers only the settlement (REQ-PIPE-194 criterion 4) - and through mothman supply decide."
  - "THE SYSTEM SHALL amend, in the same change, REQ-GHUB-082 criterion 1 and REQ-PIPE-074 criterion 1 to list re-check among the filing decisions."
  - "WHERE a promoted supply's re-check comes back red, THE SYSTEM SHALL say that it is still promoted and the period keeps it, SHALL name demote as the decision that would take it out, and SHALL name acknowledge as the decision that records that it stays (criterion 15)."
  - "WHEN the reason is asked for, THE SYSTEM SHALL say that it is published on the dashboard."
  - "WHERE a promoted supply's re-check comes back worse than the verdict it was promoted on, THE SYSTEM SHALL list it in the terminal's queue of supplies waiting on a decision, under its own heading - 'Promoted, then re-checked <verdict>' - naming the supply, its period, the verdict it was promoted on (the promote decision's recorded promoted_status), the new verdict and the re-check that found it, until a person demotes it or acknowledges its new verdict with a reason."
  - "WHERE a re-check is recorded through `mothman supply decide --wait`, THE SYSTEM SHALL run its owed re-check straight after the transaction commits, in the foreground, as the terminal's door does, and SHALL end with the shared outcome panel (REQ-PIPE-163 criterion 26), exiting as REQ-PIPE-163 criterion 28 says where its checks do not finish."
  - "WHEN a re-check run ends, in the terminal's door or under --wait, THE SYSTEM SHALL show the shared outcome panel (REQ-PIPE-163 criterion 26), naming the supply and its period and giving the verdict before and the verdict after, and either what the promotion gate did with a waiting supply or, for a promoted supply, that it stays promoted."
  - "IF a person stops a re-check run with Ctrl-C, THEN THE SYSTEM SHALL end without a traceback, say that the re-check decision stands and its checks are still owed, and print `mothman pipeline process` on a line of its own."
  - "THE SYSTEM SHALL claim an owed re-check before running it, as every owed run is claimed (REQ-PIPE-163 criterion 31's amendment of REQ-PIPE-140)."
  - "THE SYSTEM SHALL NOT count a re-check, single or bulk, as a person's decision about the supply, so that a waiting supply re-checked green may promote itself under the gate; and SHALL amend, in the same change, REQ-PIPE-076 criterion 7 to name re-check beside re-file."
  - "WHILE a promoted supply is listed under 'Promoted, then re-checked <verdict>', THE SYSTEM SHALL count it among the states needing a person (REQ-PIPE-064 criterion 5, REQ-PIPE-132 criterion 10), whether or not its dataset is turned off (REQ-PIPE-179 criterion 23); and SHALL amend, in the same change, REQ-PIPE-122 criterion 14 so that acknowledge covers a promoted supply's re-checked verdict as well as amber on arrival."
  - "IF a person re-checks a supply that is one file of an open contested pair (REQ-PIPE-194 criterion 9), THEN THE SYSTEM SHALL refuse it, append nothing, and say that the pair is settled first, at 'mothman > Filing decisions > {collection name} > Supplies waiting on a decision', where settling it checks each file that becomes a supply (REQ-PIPE-193 criterion 21)."
  - "IF the agreement backstop refuses the supply's dataset (REQ-PIPE-173), THEN THE SYSTEM SHALL refuse the re-check, saying that the dataset's judged past changed without a declared correction, giving REQ-PIPE-173's own finding for that dataset with its paste-ready fix (the agreement backstop's Finding.fix), each on a line of its own, and saying that the re-check can be raised again once the correction is declared; and SHALL NOT record anything."
  - "THE SYSTEM SHALL NOT record a new arrival verdict (REQ-PIPE-168) on a re-check, the supply's filing and receipt being unchanged; the verdict a re-check changes is the supply's QA status."
  - "THE SYSTEM SHALL be covered by a test that re-checks a promoted supply through the real re-check executor and asserts that no gate decision of any kind is appended for it and that it stays promoted in its period, so that criterion 8 is proved against the executor that today applies the gate to every re-check."
  - "THE SYSTEM SHALL label re-check in the terminal's filing-decisions door by what it does and what it costs - 'Re-check: run its checks again where it is (about a minute; recorded and published)' - and SHALL list it after the decisions that settle the supply on the same slot (promote, reject, demote, acknowledge, re-file)."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-163 criterion 35 so that a refused placement gives the same finding, fix and next step as criterion 23 gives a refused re-check."
  "non_functional_requirements":
  - "No new execution path for running QA: REQ-PIPE-140 already built the run identity, the owed record, the failure handling and the 'most recent run is current' rule. This adds a decision that owes one."
  - "Only the orchestrator path that legitimately holds a supply-row connection runs it (REQ-PIPE-140 criterion 6); on the GitHub route the decision is recorded and the processing pass runs it, as for a re-file."
  - "A NEW DECISION-LOG ACTION, so every reader of the log is enumerated before the build is called done - the decision_action_known constraint in qa_store, the as-at readers, the change-point builder, the ticket text and the page's decision wording (DECISION_DONE, REQ-DASH-221) - the cost REQ-PIPE-163 rejected a PLACE action to avoid, accepted here because a re-check is a genuinely different act."
  - "THE SCHEMA CHANGE IS ADDITIVE ONLY (a new action value). Under today's rule it is a version bump with a reset and bootstrap; once plans/running-thoughts.md #89 is settled it is a forward migration in which no earlier row changes. Nothing in this requirement depends on which."
  - "SCALE: at thirty datasets a person may re-check many supplies in a day, one at a time; each is one owed run through the existing executor, so cost grows with use, not with history."
  - "THE GATE IS SKIPPED IN THE EXECUTOR, NOT AFTER IT (delivery-architect, 2026-10-14): recheck._run_claimed calls promotion.after_runs on every re-check today (qa_tools/common/recheck.py, the gate block after the run), so criterion 8 needs that call skipped where the supply is promoted; criterion 25 is the test that proves it."
  - "ONE READER LIST: criterion 2's 'cross-table checks that read it' are found as a re-file already finds them (filing_decisions._readers_rechecked), not by a second query (delivery-architect, 2026-10-14)."
  - "ONE NAME PER MEANING: the new decision-log action needs a constant of its own; recheck.RECHECK already names an OWED-RUN kind ('recheck'), and the two must not share a constant even where they share a word (delivery-architect, 2026-10-14)."
  - "THE VERDICT IT WAS PROMOTED ON is read from the promote decision's promoted_status column on the decision table (qa_store), never recomputed from a run, so criterion 15 compares against what the gate actually saw (delivery-architect, 2026-10-14)."
  dependencies:
  - REQ-PIPE-140
  - REQ-GHUB-082
  - REQ-PIPE-163
  - REQ-PIPE-074
  - REQ-PIPE-151
  - REQ-PIPE-076
  - REQ-PIPE-083
  - REQ-PIPE-122
  - REQ-PIPE-132
  - REQ-PIPE-173
  - REQ-PIPE-179
  - REQ-PIPE-193
  - REQ-PIPE-194
  - REQ-PIPE-168
  decisions:
  - "SPLIT 2026-10-10 (Keith, on the delivery-scoper second pass): REQ-PIPE-164 had grown to 38 criteria across four concerns, so it became four requirements - REQ-PIPE-164 single re-check, REQ-QAC-176 the check-definition fingerprint, REQ-PIPE-177 bulk re-check, REQ-PIPE-178 trial - each reviewed and signed off on its own. Decisions travelled with the criteria they explain."
  - "A DECISION, NOT A BARE COMMAND (scoper's call): every recorded re-run must carry the decision that caused it (REQ-PIPE-140 criterion 4). A re-check with no cause would be the first recorded QA run nobody can explain, which is what that criterion exists to prevent."
  - "SUPERSEDED 2026-10-10 - confirmed by Keith with a condition (decision below). WAS: A PROMOTED SUPPLY IS RE-CHECKED BUT NOT RE-GATED (scoper's call, PROVISIONAL): the gate decides whether to promote what waits; it has no rule for taking back what a person or the rule already accepted, and inventing one here would let a check fix demote data downstream readers depend on without anybody choosing to."
  - "REJECTED re-filing a supply to its own period as the workaround: refiling.plan refuses it ('already filed to') and would rightly do so - it is not a move."
  - "SHOULD RATHER THAN MUST: a person can already promote a red supply with a reason, so our check mistake is survivable today; what is missing is a way to put the honest verdict on the record."
  - "RUNS AS A PLACEMENT DOES (2026-10-10, following Keith's answer on REQ-PIPE-163): the decision and the owed re-check commit together; the TUI door runs it straight after commit; `mothman supply decide` records it and leaves it owed. Applied here by consistency with the placement answer - Keith's answer on decide below adds --wait."
  - "A PROMOTED SUPPLY RE-CHECKED RED SAYS THE PERIOD KEEPS IT AND NAMES DEMOTE (delivery-cli-ux, 2026-10-07), so 'still red' is never read as 'already taken out'."
  - "A RE-CHECK DOES NOT COUNT AS 'A PERSON DECIDED THIS SUPPLY' (Keith, 2026-10-10, on the delivery-architect's blocker): a re-check, single or bulk, is excluded from rejection.decided_by_a_person() as re-file already is (REQ-PIPE-141 criterion 8), so a waiting supply re-checked green can still promote itself under the gate exactly as criterion 7 says. Without this every re-checked waiting supply - hundreds after a bulk re-check - would need a person to promote it. REQ-PIPE-076 criterion 7 is to be amended in the same change to name re-check beside re-file; that wording comes to Keith at sign-off. REJECTED counting a re-check as a person's decision."
  - "A PROMOTED SUPPLY IS RE-CHECKED BUT NEVER DEMOTED AUTOMATICALLY - CONFIRMED (Keith, 2026-10-10, settling the scoper's PROVISIONAL decision): its new verdict is recorded and shown; taking it out of its period stays a person's decision (demote). Keith's condition: the terminal and the dashboard must show very clearly where this has happened - a promoted supply whose re-check came back worse than the verdict it was promoted on. Carried by this requirement's terminal criteria and by REQ-DASH-175. REJECTED re-gating promoted supplies: a check fix would demote data downstream readers depend on without anyone choosing to."
  - "'IT STAYS' IS RECORDED WITH ACKNOWLEDGE, AND THE ENTRY NEEDS ACTION (Keith, 2026-10-10): a promoted supply re-checked worse than the verdict it was promoted on leaves the 'Promoted, then re-checked <verdict>' list when a person demotes it or acknowledges its new verdict with a reason - REQ-PIPE-122's acknowledge, reused rather than a new 'keep'; until then it counts among the states needing a person (REQ-PIPE-083), because our own fixed check now judges the data in place worse. REQ-PIPE-122's acknowledge is to be amended in the same change to cover a promoted supply's re-checked verdict as well as amber on arrival; that wording comes to Keith at sign-off. REJECTED a new keep decision (a second word for the same act) and REJECTED leaving the entry out of needs-action."
  - "`mothman supply decide` LEAVES A RE-CHECK OWED BY DEFAULT, WITH AN OPT-IN --wait (Keith, 2026-10-10, option B, on the delivery-cli-ux review): by default decide records the re-check, says its checks are owed and names `mothman pipeline process`, saying that it runs every owed QA run, not only this one; with --wait it runs this one re-check in the foreground, as the TUI door does, and ends with the same outcome panel. Scripts are unaffected by default, and a person at a terminal need not run the whole processing pass to see one result. REJECTED decide always leaving the re-check owed with no way to run just that one (option A)."
  - "FOLDED 2026-10-10 (main session): the split review round's fixes are now criteria - the run's coverage moved into criterion 2; a promoted supply skips the gate and gets no gate decision (delivery-architect 2); an advisory claim per owed re-check (delivery-architect 3, plans/post-build-review.md #136); the outcome panel, Ctrl-C and the named `mothman pipeline process` (delivery-cli-ux 1-3); the door offers re-check only on waiting or promoted supplies (delivery-scoper 16); REQ-PIPE-074 and REQ-PIPE-151 added as dependencies. The amendments to REQ-PIPE-076 and REQ-PIPE-122 are same-change criteria, so Keith approves their wording at sign-off."
  - "decide --wait EXITS WITH A DISTINCT NON-ZERO CODE WHEN THE DECISION IS RECORDED BUT ITS CHECKS DID NOT FINISH (Keith, 2026-10-10, round 3 Q4, option A, the delivery-cli-ux recommendation): a failed run, Ctrl-C or a run already claimed elsewhere ends with the panel saying the decision stands and its checks are still owed, and an exit code of its own - distinct from 0 (recorded and checked) and from 1 (refused) - so a script that asked to wait can tell it got no verdict. Applies to every operation --wait covers (place and re-file too, REQ-PIPE-163). REJECTED exiting 0 because the decision itself stood."
  - "ROUND 3 FOLDED, 2026-10-10 (main session): the outcome panel and decide --wait's exit code are the ones REQ-PIPE-163 now defines for every decision that owes checks (Keith Q1, Q4; delivery-cli-ux M8); the claim is REQ-PIPE-163's amendment of REQ-PIPE-140 for every runner (delivery-architect 5); needs-action cited as REQ-PIPE-064 and REQ-PIPE-132, as REQ-PIPE-179 cites it (delivery-dashboard-ux 22). Criterion numbers in decisions written before this fold refer to the list as it then stood."
  - "CURRENCY PASS, 2026-10-14 (delivery-scoper, unsigned triage): criteria 1 to 21 keep their numbers so the references other records make to them (post-build-review #136, REQ-PIPE-163's open question, REQ-DASH-175's decisions) stay true; new criteria are appended as 22 to 24. Changed in place: 2 (the one resolver of REQ-PIPE-193 criterion 13, which lists recheck among its users), 10 (a held supply's refusal gives the hold's own responses by label, REQ-PIPE-179 criterion 18 and REQ-PIPE-163 criterion 38, since 'naming place' is wrong for a schedule-ended hold), 11 (no re-check on an open pair, REQ-PIPE-194 criterion 4), 13 (names acknowledge as well as demote, as Keith's 2026-10-10 decision already made acknowledge the way to record that it stays) and 21 (REQ-PIPE-179 criterion 23, and the acknowledge amendment pinned to REQ-PIPE-122 criterion 14)."
  - "CRITERION 19 (THE CLAIM) IS ALREADY MET - recorded, not new work (Keith, 2026-10-14): recheck.run takes a session advisory lock before running any owed item (post-build-review #136, built 2026-10-11), proved by tests/test_recheck.py::TestTwoRunnersNeverRunOneOwedItem, and REQ-PIPE-163 criterion 31 states it in REQ-PIPE-140's own text. Kept as a criterion so the build links that test."
  - "AN OPEN CONTESTED PAIR IS SETTLED, NOT RE-CHECKED (delivery-scoper, 2026-10-14, following REQ-PIPE-194 criterion 4 and REQ-PIPE-193 criterion 25, both signed 2026-10-13): the door offers nothing but the settlement on an open pair, and the settlement itself runs each resulting supply's checks. Criterion 22 is the flag route's refusal, worded as REQ-PIPE-163 criterion 33 words placement's."
  - "REFUSED WHILE THE AGREEMENT BACKSTOP REFUSES THE DATASET (delivery-scoper, 2026-10-14; CONFIRMED by Keith, 2026-10-14, 164/177-A - decision below): consistent with REQ-PIPE-163 criterion 35, which Keith kept on 2026-10-14 (close-out Q25). Today recheck.run already leaves an owed re-check for a refused dataset waiting, still owed (morning-report (f), 2026-10-11), so the alternative - record it and let it wait - needs no new machinery. Put to Keith with REQ-PIPE-177's bulk case as one question."
  - "TWO MEANINGS OF 'VERDICT' (delivery-scoper, 2026-10-14): REQ-PIPE-168 (signed 2026-10-07) made the ARRIVAL verdict - on time or late - a recorded fact, while this requirement's 'verdict' is the QA status. Criterion 24 says a re-check records no arrival verdict, so the two cannot be confused in the build. REJECTED renaming 'verdict' throughout: the word is already on the terminal's headings that REQ-PIPE-179 criterion 23 and REQ-DASH-180 criterion 6 quote."
  - "NO CHANGE NEEDED FROM REQ-PIPE-170 (corrections) OR REQ-PIPE-161 (excuses): a re-check moves no filing, so a parked correction move and an excuse are both untouched by it; checked 2026-10-14."
  - "THE AMENDMENTS COMPOSE WITH REQ-PIPE-163's (delivery-scoper, 2026-10-14): REQ-GHUB-082 criterion 1, REQ-PIPE-074 criterion 1 and REQ-PIPE-076 criterion 7 are each also amended by REQ-PIPE-163 (approved 2026-10-14, applied when 163 is built). The exact wording in docs/drafts/unsigned-triage/summary.md is written on top of 163's, and says how to apply it if this requirement is built first. Note REQ-PIPE-163 criterion 24 says its amendment names re-check, but the wording Keith approved does not; criterion 20 here adds it."
  - "A REFUSED DATASET'S RE-CHECK IS REFUSED, NOT LEFT WAITING (Keith, 2026-10-14, 164/177-A, option A): criterion 23 refuses a single re-check while the agreement backstop refuses the supply's dataset, naming the backstop, as REQ-PIPE-163 criterion 35 refuses a placement; REQ-PIPE-177 criterion 28 skips such a dataset in a bulk re-check. Nothing is lost: the fingerprint still differs, so the queue's nudge keeps offering it. REJECTED recording the re-check and letting it wait, still owed, until the change is restored or declared (option B): a decision would sit on the record with nothing having run."
  - "A REJECTED OR SUPERSEDED SUPPLY IS NOT RE-CHECKABLE (Keith, 2026-10-14, 164-B, option A): criterion 10 keeps refusing any supply that is not filed and waiting or filed and promoted. The scope stays small, and a rejected supply's table sits in the rejected schema, which REQ-PIPE-140's run does not read today. REJECTED re-checking it in place, staying rejected or superseded with its new verdict on the record (option B), knowing the cost: a supply rejected because our own check was wrong keeps that wrong verdict on the record."
  - "REVIEWS FOLDED, 2026-10-14 (delivery-architect and delivery-cli-ux, recorded in docs/drafts/unsigned-triage/review-architect.md and review-cli-ux.md): criteria 1 to 24 keep their numbers. Changed in place: 5 (says nothing runs until the processing pass or that command does - cli-ux L4), 10 (a rejected or superseded supply's refusal names promote or un-supersede with its flag form - cli-ux L2), 15 (the verdict promoted on is the promote decision's promoted_status - architect), 23 (the backstop's refusal gives REQ-PIPE-173's finding and paste-ready fix and says the re-check can be raised again once declared - cli-ux H3). Added: 25 (a test that a promoted supply's re-check appends no gate decision - architect HIGH, because recheck._run_claimed calls promotion.after_runs on every re-check today), 26 (the door's label, and its place after the settling decisions - cli-ux L1), 27 (the same next step for REQ-PIPE-163 criterion 35 - cli-ux H3's flag on a signed requirement, carried as amendment T12). Criterion 19's linked test at build is tests/test_recheck.py::TestTwoRunnersNeverRunOneOwedItem (architect LOW), as the decision above already says."
  - "THE BACKSTOP REFUSAL GIVES A NEXT STEP (delivery-cli-ux H3, 2026-10-14): a refusal that only says the past changed leaves the person nothing to do. REQ-PIPE-173 already computes the fix for the dataset (agreement_freeze's Finding.fix, paste-ready), so the refusal gives it. REQ-PIPE-163 criterion 35 has the same gap and is signed, so criterion 27 carries its amendment (summary T12) rather than this pass editing 163. REJECTED naming the agreement command alone: the person would run a second command to learn what the first already knew."
- id: REQ-GHUB-165
  title: "The terminal offers un-supersede wherever the flags allow it, and a test keeps the menus level with the flags"
  date_written: '2026-10-07'
  story: "As a person fixing something an automated rule decided, I want the terminal's filing-decisions door to offer every decision the flags can take wherever it applies, so that undoing a mistake never depends on knowing a command line the screen did not show me."
  moscow: should
  status: not_started
  source: "delivery-scoper, 2026-10-07 - gaps found auditing Keith's condition on REQ-PIPE-111 ('the TUI offers users ALL of the tools...'). Verified by running qa_tools/common/filing_queue.operations_for against every slot state, and `mothman supply queue --collection child-protection`, 2026-10-07. RE-SCOPED by delivery-scoper, 2026-10-14, to what is left (Keith, 2026-10-14, unsigned triage): criterion 1, a real parity test, and an operation list for today's operations."
  "acceptance_criteria":
  - "THE SYSTEM SHALL offer un-supersede in the terminal's filing-decisions door on every slot where filing_decisions.apply would accept it - a superseded version of the dataset's table exists in that period and no other version waits for it (REQ-PIPE-120 criterion 5) - reading the recorded supersessions through a function given the caller's connection, as filing_queue.excuse_offers reads recorded punctuality, labelling the offer with how many superseded versions it can bring back, and SHALL NOT restrict it to a slot whose supply was rejected."
  - "THE SYSTEM SHALL be covered by a test that, for every slot state the door can show and for a held supply of each label (REQ-PIPE-163 criterion 10), and for every filing decision, fails where the flag route's own implementation (filing_decisions.apply) would append an entry for a decision the door does not offer on that state, unless the test names the decision as deliberately terminal-hidden on that state, with a reason."
  - "THE SYSTEM SHALL take that test's decisions from filing_decisions.OPERATIONS and the excuse offers rather than a list of its own, so that it covers, when built, promote, reject, demote, re-file, substitute, de-substitute, inherit, un-inherit, mark as not supplied, acknowledge, supersede, un-supersede, excuse lateness, withdraw excuse, choose-file and place, and covers any operation added later without amending this requirement."
  - "THE SYSTEM SHALL count a decision the flag route records as unchanged (an Outcome with changed false) as not accepted, for that test."
  - "IF any slot state or hold label that test names has no example to test against, THEN THE SYSTEM SHALL fail the test, naming it, rather than pass on fewer states."
  - "THE SYSTEM SHALL be covered by a test that every operation in filing_decisions.TERMINAL_ONLY - choose-file and place when built - raised as a GitHub comment appends nothing and replies that the decision is made in the terminal (REQ-PIPE-193 criterion 16, REQ-PIPE-163 criterion 36)."
  - "THE SYSTEM SHALL build that test's examples itself - one slot in each state and one held supply of each label - committed to the test's own database (MOTHMAN_TEST_DSN, one per test worker), and SHALL NOT read the bootstrapped history or seed the examples inside a transaction that is rolled back."
  "non_functional_requirements":
  - "THE TEST IS THE DELIVERABLE as much as the screens: REQ-GHUB-082 criterion 3 guarantees parity between GitHub and the terminal's IMPLEMENTATION, not between the flag form and the wizard's MENUS, and the gaps below grew in exactly that seam."
  - "Offering more must not mean showing more by default - at thirty datasets a menu listing every decision on every slot is noise. Offer by state, as operations_for already does; the fix is in what the state logic knows."
  - "THE TEST DRIVES THE REAL FLAG ROUTE (CLAUDE.md's test rule 1): it asks filing_decisions.apply, not a copy of its rules, so a refusal added to apply later moves the test with it."
  - "CI COST: the parity test builds its own examples in the test's own database (criterion 7), so it needs no deployment and runs in the fast half of CI; it is not marked needs_deployment, and the fast half's skip count stays zero (CLAUDE.md)."
  dependencies:
  - REQ-GHUB-082
  - REQ-PIPE-120
  - REQ-PIPE-161
  - REQ-PIPE-163
  - REQ-PIPE-193
  - REQ-PIPE-194
  decisions:
  - "WHAT THE AUDIT FOUND, run rather than read (2026-10-07): operations_for offers un-supersede only on a REJECTED slot. After a newer file superseded a waiting one, or after an automatic replacement (REQ-PIPE-123) superseded a promoted one, the only terminal path back is to REJECT the newer supply first - recording a quality judgement that was never made, which REQ-PIPE-118 says supersession is not. The flag form (`mothman supply decide --operation un-supersede`) and `mothman supply superseded` reach it directly."
  - "HELD SUPPLIES ARE INVISIBLE TO THE TERMINAL DOOR: the standing queue for Child Protection listed 24 supplies on 2026-10-07 and none of the 9 assignment-rule holds `mothman supply holds` reported, because a held supply has no slot and the door is built from slots."
  - "A CONTESTED PAIR SHOWS ONE FILE: slot_state carries one filed supply per slot, so the door offers decisions on one file of the pair (read in code, not run - the current database holds no contested pair). Recorded as a likely gap to confirm, not a measured one."
  - "PARITY BY TEST, NOT BY CARE: REQ-PIPE-140 criterion 5 was amended the day before this was written because a criterion named a terminal reader that did not exist; menus drift from flags the same way, quietly."
  - "FILE-CHECK REFUSALS ARE NOT OVERRIDABLE, BY DESIGN (Keith, 2026-10-07) - the one 'not at all' in the 2026-10-07 audit of automated decisions that is deliberate rather than a gap. A file the file checks refuse (a ragged row, for instance) has no loadable data to promote; the remedy is reject and resend, and the terminal offers reject on it."
  - "THE PARITY TEST COVERS THIS BATCH, AND THE TERMINAL-ONLY ONES ARE ASSERTED ABSENT FROM GITHUB (delivery-cli-ux pre-build review, 2026-10-07): REQ-GHUB-082 criterion 3 is being amended to allow terminal-only operations, and a test that only checked presence would let one leak onto GitHub unnoticed."
  - "RE-SCOPED TO WHAT IS LEFT (Keith, 2026-10-14, unsigned triage): of the 2026-10-07 criteria, 1 stays (now criterion 1), 5 and 6 become the parity test (criteria 2 to 6), and the rest are moot or owned elsewhere - see the next three decisions."
  - "OLD CRITERION 2 (reach the superseded list from the door) IS ALREADY MET where un-supersede is offered: cli/filing_tui.py lists supersession.superseded_in for the dataset and period and asks which version comes back (REQ-PIPE-120 criterion 8). Criterion 1 offers it on more slots; the list comes with it."
  - "OLD CRITERION 3 (a contested pair offers decisions on each file) IS MOOT: REQ-PIPE-194 criterion 4 (signed 2026-10-13) offers an open pair exactly the settlement - choose-file, and its 'reject both' - which names each file, and nothing else; once settled, each file is a supply of its own (REQ-PIPE-193 criterion 12) and gets every decision any supply gets."
  - "OLD CRITERION 4 (list held supplies in the door) MOVED to REQ-PIPE-163 criteria 10 and 17, signed 2026-10-14. Criterion 2 here still tests it, by taking held supplies as states."
  - "THE OPERATION LIST IS DERIVED, NOT WRITTEN DOWN (delivery-scoper, 2026-10-14): the 2026-10-07 list named excuse-lateness, withdraw-excuse, place, re-check and its bulk form, keep, the correction confirmation and the two withdrawals. Excuse and its withdrawal are built (REQ-PIPE-161), choose-file is built (REQ-PIPE-193) and place is signed (REQ-PIPE-163); re-check, the bulk re-check and the two withdrawals are REQ-PIPE-164's, REQ-PIPE-177's and REQ-PIPE-166's, and each joins the test by joining filing_decisions.OPERATIONS, so none of them amends this requirement. Keep and the correction confirmation are not slot decisions - they are offered only inside REQ-PIPE-170's confirmation - so their parity is that requirement's."
  - "ONE DIRECTION ONLY (delivery-scoper, 2026-10-14): the test fails where the flags allow what the door hides, not where the door offers what apply may refuse - filing_queue.operations_for's own rule is that what is offered is not what is permitted, and apply refuses at the instant of appending."
  - "REQ-GHUB-082 IS NOT AMENDED: criterion 2 of it ('offer every one of those operations in the mothman TUI') is the promise this requirement's test makes mechanical."
  - "PARTLY SUPERSEDED 2026-10-14 - its rolled-back transaction gives way to examples committed in the test's own database (decision below); driving the real apply stands. THE PARITY TEST DRIVES THE REAL filing_decisions.apply (Keith, 2026-10-14, 165-A, option A): against a database holding one slot per state, inside a transaction that is rolled back, so the test uses the real refusals and adds no product code (CLAUDE.md's test rule 1); it probably runs in the deployment half of CI. REJECTED pulling a pure permitted(state, operation) out of apply for the door and the test to share (option B): drift would be impossible by construction, but it is a refactor of apply, and the test would then compare a function with itself."
  - "EXAMPLES ARE SEEDED IN THE TEST'S OWN DATABASE, NOT ROLLED BACK AND NOT THE BOOTSTRAP (Keith, 2026-10-14, review-architect Q3, option A): one committed example per state in the per-worker MOTHMAN_TEST_DSN database (criterion 7). Why not the rolled-back transaction 165-A chose: the flag route opens connections of its own - filing_decisions' terminal-only reply opens a second, read-only connection (filing_decisions.py, around line 477) - and none of them can see rows seeded but not committed, so the test would report on states it never saw. Why not the bootstrap: it cannot be relied on to hold an example of every state, and criterion 5 would fail on whichever state the history lacked. REJECTED the bootstrapped history (option B). 165-A's other half - drive the real filing_decisions.apply and add no product code to permit it - stands."
  - "UN-SUPERSEDE'S OFFER READS ON THE CALLER'S CONNECTION (delivery-architect, 2026-10-14): a connection-taking supersede_offers(conn, state) beside excuse_offers in filing_queue, so the door and the parity test read the same rows the caller can see; criterion 1 says so."
  - "THE OFFER CARRIES A COUNT (delivery-cli-ux L5, 2026-10-14): 'Un-supersede (2 earlier versions)' tells the person there is a choice to come before they take it."
  - "BUILT AFTER REQ-PIPE-163 (delivery-architect, 2026-10-14): the test takes a held supply of each label as a state (REQ-PIPE-163 criteria 10 and 17), and the door has none until 163 is built."
  - "REVIEWS FOLDED, 2026-10-14: changed in place 1 (the caller's connection; the count); added 7 (the test's own examples); NFR 4 now places the test in the fast half of CI."
- id: REQ-PIPE-166
  title: "A person can withdraw a mark-as-not-supplied or an acknowledgement recorded by mistake"
  date_written: '2026-10-07'
  story: "As a person who recorded an annotation on the wrong slot, or before the facts were in, I want to withdraw it with a reason, so that the record reads what is true without my having to stage some other decision just to paper over the first."
  moscow: could
  status: not_started
  source: "delivery-scoper, 2026-10-07 - a gap found auditing Keith's condition on REQ-PIPE-111 ('undo mistakes (ours ...)'). Verified: filing_decisions.OPERATIONS has no withdrawal for mark-not-supplied or acknowledge, and operations_for offers only substitute on a not-supplied-accepted slot and nothing that withdraws an acknowledgement. CURRENCY PASS by delivery-scoper, 2026-10-14 (unsigned triage): checked against REQ-PIPE-161 (withdraw-excuse, which this mirrors), REQ-PIPE-164, REQ-PIPE-179 and REQ-DASH-162."
  "acceptance_criteria":
  - "THE SYSTEM SHALL offer a person the withdrawal of a mark as not supplied (REQ-PIPE-132) and of an acknowledgement (REQ-PIPE-122), each with a mandatory reason, on the same terms as every other filing decision, on the GitHub and terminal routes alike, to the person who recorded it or any person on the contract/people.yaml allowlist, as REQ-PIPE-161 criterion 8 does for an excuse."
  - "THE SYSTEM SHALL record a withdrawal as its own decision-log entry naming the entry it withdraws by that entry's id (the decision table's caused_by_decision column), never by its position among the supply's entries, and SHALL NOT delete or alter the entry withdrawn."
  - "WHEN a mark as not supplied is withdrawn, THE SYSTEM SHALL report the slot as it would read had the mark never been made - overdue or never-supplied and closed - and SHALL return it to the states needing action."
  - "WHEN an acknowledgement is withdrawn, THE SYSTEM SHALL report the supply as awaiting acknowledgement again, where it is still what its period holds."
  - "IF there is no standing annotation of that kind to withdraw, THEN THE SYSTEM SHALL refuse and say why."
  - "THE SYSTEM SHALL offer withdraw-not-supplied in the terminal's filing-decisions door per period and dataset, on a slot reading not supplied (accepted), beside substitute; and withdraw-acknowledgement on a promoted supply carrying a standing acknowledgement, read from the recorded decisions as filing_queue.excuse_offers reads an excuse; and both through mothman supply decide."
  - "THE SYSTEM SHALL amend, in the same change, REQ-GHUB-082 criteria 1, 31 and 32 and REQ-PIPE-074 criterion 1 to list the two withdrawals, withdraw-not-supplied among the per-period decisions."
  - "THE SYSTEM SHALL name the operations withdraw-acknowledgement and withdraw-not-supplied."
  - "WHERE the acknowledgement withdrawn is of a promoted supply's re-checked verdict (REQ-PIPE-164 criterion 21), THE SYSTEM SHALL list the supply again under 'Promoted, then re-checked <verdict>' and count it among the states needing a person."
  - "WHEN the reason is asked for, THE SYSTEM SHALL say that it is published on the dashboard."
  - "THE SYSTEM SHALL honour a withdrawal in every reader of the annotation it withdraws - the terminal's slot states and queue, the needs-action policy and its tickets (REQ-PIPE-083), the acknowledgement lookup (acknowledgement.acknowledged_by), the slot timeline (pipeline/slot_timeline.py), the dashboard-data builders (pipeline/build_dashboard_data.py, pipeline/build_cp_dashboard_data.py) and the page's decision wording (DECISION_DONE) - so that none of them still reads the withdrawn annotation as standing."
  - "THE SYSTEM SHALL describe each withdrawal in words wherever a past decision is described - 'no longer acknowledged', 'no longer marked not supplied', as REQ-DASH-198 words de-substitute and un-inherit - and SHALL NOT show the raw operation name."
  - "WHERE an acknowledgement or a mark as not supplied was withdrawn, THE SYSTEM SHALL show the dashboard's acknowledgement badge or not-supplied (accepted) reading up to the withdrawal's instant and not from it, and SHALL show an acknowledgement and its withdrawal in the supply history, as REQ-DASH-162 criterion 3 does for an excuse, and a mark and its withdrawal where criterion 15 says."
  - "WHEN a withdrawal is confirmed, on either route, THE SYSTEM SHALL name the entry withdrawn - who recorded it, when, and its reason - and its public consequence (for an acknowledgement, that the page stops showing it from now, that it stays in the supply's history, and that the supply needs a person again; for a mark, that the period reads overdue or never supplied again and its ticket reopens), and SHALL say that it can be recorded again."
  - "WHERE a mark as not supplied was withdrawn, THE SYSTEM SHALL show the withdrawal in the period's cell of the cycle table and in the accepted-gaps list, in the shape excuseNote() gives an excuse - '<annotation> · withdrawn by <person>, <instant>: <reason>' - since a mark has no supply-history row of its own."
  - "WHERE an acknowledgement was withdrawn, THE SYSTEM SHALL show the supply's awaiting-acknowledgement tag again with the withdrawn acknowledgement on a line beneath it, and SHALL show an acknowledgement's reason as visible text, not only in a title attribute."
  - "WHEN a supply whose acknowledgement was withdrawn is acknowledged again, THE SYSTEM SHALL report the newer acknowledgement as the one standing, in every reader criterion 11 names."
  - "THE SYSTEM SHALL be covered by a test that every action in decision_log.ACTIONS has wording in the page's DECISION_DONE, or is named in that test as deliberately not shown with a reason, so that no new action reaches the page as its raw name."
  "non_functional_requirements":
  - "Annotations only: a withdrawal, like the annotation it withdraws, changes no data and nothing a period resolves to (REQ-PIPE-132 criterion 8)."
  - "EVERY READER ENUMERATED, AND ASSERTED WHERE A PERSON SEES IT (CLAUDE.md's shape-change rule): today the acknowledgement is read by qa_store's acknowledgement view, pipeline/acknowledgements.py, acknowledgement.acknowledged_by, slot_state and filing_queue, and the mark by not_supplied, pipeline/closed_slots.py, slot_state and the queue; both are read by pipeline/slot_timeline.py, both dashboard-data builders and the template's DECISION_DONE (delivery-architect, 2026-10-14). acknowledged_by takes the EARLIEST acknowledgement (ORDER BY effective_at, LIMIT 1), which goes stale after a withdrawal and a second acknowledgement (criterion 17) - each must honour the withdrawal, and the dashboard's own reading is tested in a browser."
  - "THE SCHEMA CHANGE IS ADDITIVE ONLY (two new action values); see REQ-PIPE-164's matching NFR for how it sits with plans/running-thoughts.md #89."
  - "AUDITABLE: a withdrawal names the entry it withdraws and is never a deletion, so who marked, who withdrew and why stay on the record and on the published page."
  - "ONE HISTORY READER, NOT THREE (delivery-architect, 2026-10-14): excuse.history (qa_tools/common/excuse.py) already pairs an annotation with its withdrawal as at an instant, and pipeline/excuses.py publishes it; the build generalises those to any annotation and its withdrawal rather than adding two near-copies for acknowledgements and marks."
  dependencies:
  - REQ-PIPE-132
  - REQ-PIPE-122
  - REQ-PIPE-161
  - REQ-DASH-162
  - REQ-GHUB-082
  - REQ-PIPE-074
  - REQ-PIPE-083
  decisions:
  - "COULD, NOT MUST: neither annotation changes data, and both are overtaken by later decisions today (a re-file or substitution supersedes a mark; an acknowledgement lapses when its supply leaves the period). What a mistaken one costs is a wrong sentence on the record, not a wrong table - real, but survivable."
  - "THE SAME SHAPE AS REQ-PIPE-161's withdrawal of an excuse, so the three annotations behave alike. REJECTED a generic 'undo last decision', which for a holding decision would mean reversing table moves and is exactly what demote, un-supersede, de-substitute and un-inherit already do with their own guards."
  - "CURRENCY PASS, 2026-10-14 (delivery-scoper, unsigned triage): criteria 1 to 8 keep their numbers. Changed: 1 (both routes, and who may withdraw - REQ-PIPE-161 criterion 8's terms, which this said it mirrored but did not state), 6 (where each is offered, by the same rules as mark and acknowledge themselves - REQ-GHUB-082 criterion 31 puts mark among the per-period decisions) and 7 (REQ-GHUB-082 criteria 31 and 32 too, since withdraw-not-supplied is per-period). Added 9 to 13."
  - "THE DASHBOARD HALF IS FOLDED IN (delivery-scoper, 2026-10-14; CONFIRMED by Keith, 2026-10-14, 166-A - decision below): REQ-PIPE-161 had its page half split out as REQ-DASH-162, but here the page half is two criteria (12 and 13), and leaving them out would publish a withdrawn acknowledgement as standing - the page reads acknowledge entries directly. Put to Keith as summary question 166-A."
  - "SHOWN UP TO THE WITHDRAWAL, NOT ERASED FROM EARLIER DATES (delivery-scoper, 2026-10-14; CONFIRMED by Keith, 2026-10-14, 166-B - decision below): the page already shows an acknowledgement from its own instant (the template's by(a.acknowledged.at)), so a withdrawal ends it at its own instant, and the history row says it was withdrawn. REQ-DASH-162 criterion 5 shows an EXCUSE on every date instead; summary question 166-B asks which Keith wants here."
  - "NO AMENDMENT TO REQ-PIPE-076 CRITERION 7 (delivery-scoper, 2026-10-14): mark-not-supplied names no supply, and an acknowledgement is already a person's decision about its supply (rejection.decided_by_a_person does not exempt it), so withdrawing one adds no bar that was not already there."
  - "A TURNED-OFF PERIOD NEEDS NOTHING NEW (delivery-scoper, 2026-10-14, against REQ-PIPE-179): where a later turn-off leaves a marked period owed nothing, criterion 3's 'as it would read had the mark never been made' is an owed-nothing period, which needs no action; nothing here overrides REQ-PIPE-179 criterion 23."
  - "RE-CHECK INTERPLAY (delivery-scoper, 2026-10-14): REQ-PIPE-164 criterion 21 extends acknowledge to a promoted supply's re-checked verdict; criterion 9 here says what withdrawing that kind does. Vacuous until REQ-PIPE-164 is built; tested then."
  - "THE DASHBOARD HALF STAYS IN THIS REQUIREMENT (Keith, 2026-10-14, 166-A, option A): criteria 12 and 13 are the page half, so a withdrawn acknowledgement never goes on showing as standing. REJECTED a separate DASH requirement on the REQ-PIPE-161 / REQ-DASH-162 pattern (option B)."
  - "ON A DATE BEFORE THE WITHDRAWAL THE PAGE STILL SHOWS THE ANNOTATION (Keith, 2026-10-14, 166-B, option A): criterion 13 shows the acknowledgement badge or not-supplied (accepted) reading up to the withdrawal's instant and not from it, as an acknowledgement is already shown from its own instant, and the supply history shows both entries. REJECTED hiding it on every date as REQ-DASH-162 criterion 5 does for an excuse (option B), which would erase the mistake from the past view too."
  - "REVIEWS FOLDED, 2026-10-14 (delivery-architect; delivery-cli-ux M4; delivery-dashboard-ux M4 to M6): criteria 1 to 13 keep their numbers. Changed in place: 2 (the entry withdrawn named by id, caused_by_decision - architect), 11 (the reader list, which the architect found incomplete), 12 (REQ-DASH-198's 'no longer ...' wording - dashboard-ux M6), 13 (a mark's withdrawal shown where criterion 15 says). Added: 14 (the confirmation names the entry and its public consequence - cli-ux M4), 15 (a withdrawn mark in the cycle-table cell and the accepted-gaps list - dashboard-ux M4), 16 (the awaiting tag returns and the reason is visible - dashboard-ux M5), 17 (a second acknowledgement after a withdrawal is the standing one - architect, acknowledged_by's LIMIT 1), 18 (DECISION_DONE tied to decision_log.ACTIONS by a test - architect LOW). The schema NFR and REQ-PIPE-076 decision are unchanged."
  - "A WITHDRAWAL NAMES ITS ENTRY BY ID (delivery-architect, 2026-10-14): the decision table's caused_by_decision column already links an entry to the one it acts on, so a withdrawal uses it. REJECTED naming it by position ('the latest acknowledgement of this supply'): after a withdrawal and a second acknowledgement, position points at the wrong one."
  - "'NO LONGER ACKNOWLEDGED', NOT 'ACKNOWLEDGEMENT WITHDRAWN' (delivery-dashboard-ux M6, 2026-10-14): the page already words de-substitute and un-inherit as 'no longer substituted' and 'no longer carried forward' (REQ-DASH-198 criterion 4), so a reader sees one pattern for an undone annotation. REJECTED the earlier draft's 'acknowledgement withdrawn' wording: a second pattern for the same kind of act."
- id: REQ-DASH-175
  title: "The dashboard says when a supply was placed by hand"
  date_written: '2026-10-10'
  story: "As a data team leader reading a dataset's supply history, I want a supply a person placed by hand to say so - who, when and why - so that I do not mistake a person's decision for the filing rule's."
  moscow: should
  status: not_started
  source: "delivery-dashboard-ux pre-build review of REQ-PIPE-163 and REQ-PIPE-164, 2026-10-08, findings 7 to 10. Drafted by the main session from that review on 2026-10-10 and SCOPER PASS by delivery-scoper, 2026-10-14 (unsigned triage): split into this placement half, built with REQ-PIPE-163, and REQ-DASH-221, the re-check half, built after REQ-PIPE-164 and REQ-PIPE-177; carries close-out amendment 2 (approved by Keith with REQ-PIPE-163)."
  "acceptance_criteria":
  - "WHERE a supply was placed by a person, THE SYSTEM SHALL show on its supply-history row a 'Placed in <period>' tag, in the column that says how the row came to be in its cycle, naming the person and the date, with the reason as visible text."
  - "WHERE the period a supply was placed into was closed, or not yet open, at the supply's receipt instant, THE SYSTEM SHALL say which on that row."
  - "WHERE a hold was resolved by placing, THE SYSTEM SHALL show the resolved hold's row in the form a rejected supply's resolved row takes, naming the period the supply was placed into, the person and the date, in the section that listed it while held."
  - "THE SYSTEM SHALL show a supply that was both placed and excused (REQ-DASH-162) with two distinct labels in two distinct cells - punctuality in the timing cell, placement in the provenance cell - and SHALL NOT show 'excused' beside the placement or 'placed' beside the excuse."
  - "THE SYSTEM SHALL show a placement from its decision's instant, as every other decision is shown (REQ-PIPE-081 criteria 1 and 4), and SHALL show the supply as held on any earlier date."
  - "THE SYSTEM SHALL NOT change a row's Outcome cell because of a placement alone; the Outcome cell SHALL change only when the supply's promotion state does."
  - "THE SYSTEM SHALL describe a placement and a re-check in words wherever a past decision is described - 'placed in <period>', 're-checked' - recognising a placement as a person's re-file whose from-period is empty (REQ-PIPE-163 criterion 2), and SHALL NOT show the raw operation name or describe a placement as a re-file."
  - "THE SYSTEM SHALL compute all of this from recorded decisions and results only, and SHALL NOT read supply rows."
  - "THE SYSTEM SHALL show the 'Placed in' tag only for a person's placement, and SHALL NOT show it for a held supply the rule filed once configuration covered it (REQ-PIPE-154 criterion 7, REQ-PIPE-179 criterion 19) or that a confirmed correction filed (REQ-PIPE-170), each recorded as the rule's re-file from no period, which keep the wording they have."
  - "WHERE a held contested pair was placed whole (REQ-PIPE-163 criterion 37), THE SYSTEM SHALL say so on the pair's row - placed in <period>, the person, the date and the reason - while it is open and once it is settled (REQ-PIPE-194 criterion 10)."
  "non_functional_requirements":
  - "Rendered from data another component computed - placing is REQ-PIPE-163's; this only consumes it (docs/components.md)."
  - "Same date and person formatting as everything else on the page (REQ-DASH-071)."
  - "AT THIRTY DATASETS: one tag per placed row and nothing per dataset or collection, so it adds no noise to any rollup."
  dependencies:
  - REQ-PIPE-163
  - REQ-DASH-162
  - REQ-PIPE-081
  - REQ-DASH-071
  - REQ-PIPE-154
  - REQ-PIPE-170
  - REQ-PIPE-179
  - REQ-PIPE-194
  - REQ-DASH-180
  decisions:
  - "SPLIT FROM REQ-PIPE-163 AND REQ-PIPE-164 on the REQ-PIPE-154 / REQ-DASH-155 pattern: the decision and its record are one reviewable unit, the rendering another."
  - "PLACEMENT AND EXCUSE IN DIFFERENT CELLS WITH DIFFERENT VERBS (delivery-dashboard-ux pre-build review, 2026-10-08): a supply placed into a closed period reads late, and is exactly the one most likely to be excused too, so sharing a cell would let a reader take one reason for the other."
  - "FOLDED 2026-10-10 (main session): the review blocker on criterion 5 is applied by splitting it - a single re-check says who re-checked it and why, a bulk re-check names the corrected check and its changelog entry (which REQ-PIPE-177 now records). Also applied: no Outcome-cell flip, the as-of rule for a placement, 'Placed in <period>' rather than 'Placed by hand' (filedNote already uses the latter), the resolved hold row in the rejected branch's form, links inside clickable rows, nothing for a trial, and REQ-PIPE-177 as a dependency."
  - "ROUND 3 FOLDED, 2026-10-10 (main session): an amber re-check gets the acknowledgement badge's form, since the page has no amber red-promoted badge, and the supply counts as outstanding until acknowledged, so Keith's 'very clearly' holds for amber too (delivery-dashboard-ux 16); the badge stays after acknowledgement, naming who (delivery-scoper L); the re-check note extends the existing arrived-as note rather than adding a second (18) and replaces the turned-red-later tag (17); 'and other checks' where another check moved (delivery-architect 8); the drawer link a real <a href> (19); the drawer line's date rule (20); REQ-PIPE-081 cited as criteria 1 and 4 (delivery-scoper J); REQ-DASH-126, REQ-PIPE-081 and REQ-DASH-071 added as dependencies. Criterion numbers in decisions written before this fold refer to the list as it then stood."
  - "SPLIT, 2026-10-14 (delivery-scoper, on Keith's ask that the placement half can be built with REQ-PIPE-163 and the re-check half after REQ-PIPE-164 and REQ-PIPE-177; CONFIRMED by Keith, 2026-10-14, 175-A, option A): this requirement keeps the placement criteria and its id, so REQ-PIPE-163's dependency on it and amendment 2 still point at the right place; the re-check criteria, and every decision about them, moved to REQ-DASH-221. Old criteria map as: 1-4 -> 1-4, 10 -> 5, 11 -> 6 (placement half) and 221's 6 (re-check half), 12 -> 7, 13 -> 8; 5-9 and 14-17 -> REQ-DASH-221. REJECTED keeping one requirement half-built for weeks: its status would read in-progress while waiting on two unsigned requirements."
  - "CLOSE-OUT AMENDMENT 2 IS CARRIED, WORDING UNCHANGED (Keith, 2026-10-14, approved with REQ-PIPE-163, close-out Q27): old criterion 12 now reads as amendment 2 set out, and sits at criterion 7 after the split. It still names 're-checked'; REQ-DASH-221 criterion 7 is where that half is built and tested."
  - "THE RULE'S RE-FILE FROM NO PERIOD IS NOT A PLACEMENT (delivery-scoper, 2026-10-14, read in code): correction_apply._place and the schedule-ended drain record actor_kind rule, so 'a person's re-file whose from-period is empty' (amendment 2) already excludes them; criterion 9 says so, so a builder reading only REQ-PIPE-163 criterion 40's 'one shared placer' does not tag them too."
  - "A HELD PAIR PLACED WHOLE (delivery-scoper, 2026-10-14): REQ-PIPE-163 criterion 37 (signed 2026-10-14) places both files still contested; criterion 10 says where the page records that, since the pair row is the only place both files are shown together."
  - "A PLACED TURNED-OFF HOLD STAYS IN THE QUIET SECTION (main session, low stakes, 2026-10-14, on the delivery-dashboard-ux review's recommendation; Keith to overrule at sign-off): a supply held as turned off is listed in its own 'Received while turned off' section (REQ-DASH-180 criterion 14), and criterion 3 shows a resolved hold's row in the section that listed it while held, so once placed it stays there rather than moving to the 'Needed a person' table. This changes no behaviour Keith signed - it is what criterion 3 and REQ-DASH-180 criterion 14 already say together - so the scoper's open question is closed rather than put to him. REJECTED moving the row to the main table once placed: it would change sections on the date it was placed, and the quiet section would under-count what it received."
  - "REVIEWED 2026-10-14: delivery-architect found it sound and buildable with REQ-PIPE-163; delivery-dashboard-ux made no finding on it beyond the open question settled above. No criterion changed."
- id: REQ-DASH-221
  title: "The dashboard says when a supply was re-checked after we fixed a check, and shows very clearly a promoted supply that came back worse"
  date_written: '2026-10-14'
  story: "As a data team leader reading a dataset's supply history, I want a supply whose verdict changed because we fixed a check to say so - who, when, why and which check - so that I do not blame a supplier for a verdict our own check produced, and I can see at once a promoted supply our fixed check now judges worse."
  moscow: should
  status: not_started
  source: "delivery-scoper, 2026-10-14 (unsigned triage): split out of REQ-DASH-175, whose criteria 5-9 and 11, 14-17 came from the delivery-dashboard-ux pre-build review of REQ-PIPE-163 and REQ-PIPE-164, 2026-10-08, findings 7 to 10, drafted by the main session 2026-10-10. Split confirmed by Keith, 2026-10-14 (175-A). Confirm 221 is still free before applying: 219 and 220 are taken by the road-testing-feedback draft and 210-217 by the unjudged-cross-table draft. EFFECTIVELY HELD (delivery-architect, 2026-10-14): it depends on REQ-PIPE-177, which depends on REQ-QAC-176's stored fingerprint, whose sign-off Keith held behind plans/running-thoughts.md #89 - so it cannot be built until #89 settles, as REQ-QAC-176, REQ-PIPE-177 and REQ-PIPE-178 cannot."
  "acceptance_criteria":
  - "WHERE a supply's status changed on a single re-check, THE SYSTEM SHALL say so by extending the arrived-as note its supply-history row already shows - 'Arrived <old> · re-checked <date> by <person> - <reason>' - for a waiting or a promoted supply alike, in words that place the change with our check rather than with the supply."
  - "WHERE a supply's status changed on a bulk re-check, THE SYSTEM SHALL extend the same note with '· re-checked after we corrected <check> (<changelog entry date>)', adding 'and other checks' where results of other checks changed in the same run, the check's name being a link (an <a href>) to its drawer's own path that keeps the date on show."
  - "WHERE a single re-check changed nothing, THE SYSTEM SHALL still show it on the supply's row, with its person, date and reason."
  - "THE SYSTEM SHALL show, in a check's drawer under its Definition changelog, one line per bulk re-check of that check - how many supplies across how many datasets, the date, the person, how many changed, and the reason - beside the changelog entry it acted on, shown only from the bulk re-check's instant on the date on show and not counted in the heading's count of changes; and SHALL show nothing on rows a bulk re-check left unchanged."
  - "WHERE the date on show is before a re-check, THE SYSTEM SHALL show the verdict that stood then, with a quiet forward note - 'Re-checked later - <instant>, now <status>, after <cause>' - and from the re-check's instant SHALL show the new verdict; and SHALL NOT list a re-check among the decisions made since the date on show; the note replaces the turned-red-later tag where the re-check is what turned it."
  - "THE SYSTEM SHALL NOT change a row's Outcome cell because of a re-check alone; the Outcome cell SHALL change only when the supply's promotion state does."
  - "THE SYSTEM SHALL describe a re-check, single or bulk, as 're-checked' wherever a past decision is described, as REQ-DASH-175 criterion 7 requires, adding it to the page's decision wording (DECISION_DONE), and SHALL NOT show the raw operation name."
  - "WHERE a promoted supply's re-check came back worse than the verdict it was promoted on, THE SYSTEM SHALL show it, WHERE red, with the red-promoted badge (REQ-DASH-126) naming the re-check as the cause, and WHERE amber, with a tag in the acknowledgement badge's form - 'Amber, promoted - re-checked, awaiting acknowledgement' - in either case on its supply-history row and in the dataset's header, and for red in the collection's red-promoted marker; and SHALL keep the badge after acknowledgement, naming who acknowledged it."
  - "THE SYSTEM SHALL place the amber re-checked tag where the red-promoted badge sits - after the status pill and before the turn-off marker (REQ-DASH-180 criterion 13)."
  - "WHERE a link sits inside a clickable row, THE SYSTEM SHALL follow the link alone when it is clicked, and SHALL NOT also act on the row's own click."
  - "THE SYSTEM SHALL show nothing of a trial re-check, which records nothing."
  - "THE SYSTEM SHALL list such a supply in the outstanding queue, and count it in every outstanding marker, under the kind 'Promoted, then re-checked <verdict>' - the terminal's own heading - until it is demoted or acknowledged, whether or not its dataset is turned off (REQ-DASH-180 criterion 6)."
  - "THE SYSTEM SHALL compute all of this from recorded decisions and results only, and SHALL NOT read supply rows."
  - "THE SYSTEM SHALL amend, in the same change, REQ-DASH-126 criteria 1, 2 and 6 so that a promoted supply turned red by a re-check is red promoted, names the re-check as its cause, and on an earlier date carries criterion 5's re-checked-later note in place of the turned-red note."
  "non_functional_requirements":
  - "Rendered from data another component computed - re-checking is REQ-PIPE-164's and REQ-PIPE-177's; this only consumes it (docs/components.md)."
  - "Same date and person formatting as everything else on the page (REQ-DASH-071)."
  - "AT THIRTY DATASETS AND HUNDREDS OF SUPPLIES PER BULK RE-CHECK: a bulk re-check is one line in the check's drawer and nothing on unchanged rows (criterion 4), so a fix that touches every supply adds no noise to supply history."
  - "AUDITABLE AND PUBLIC: who re-checked, when and why is published, which the terminal's reason prompt promises (REQ-PIPE-164 criterion 14, REQ-PIPE-177 criterion 22)."
