  - "A RE-CHECK'S CAUSE NAMES OUR CHECK (same review): the requirement's own story is 'our mistake, not the supplier's', so the words must not leave a supplier looking responsible for a verdict a fixed check produced."
  - "A RE-CHECK'S VERDICT TAKES EFFECT FROM THE RE-CHECK ONWARD (Keith, 2026-10-10, option A, 'in line with the approach we take for other things that use the as-of on the dashboard'): on any In place on date before the re-check, the dashboard shows the verdict that stood then, with a quiet forward note - 'Re-checked later - <instant>, now <status>, after <cause>' - reusing the existing turns-red-later muted tag; from the re-check's instant it shows the new verdict. A re-check therefore never changes what an earlier date shows, and is not listed in the 'decisions made since then' note. This is the as-of rule every other decision already follows (REQ-PIPE-081 criterion 5). REJECTED showing it retroactively: on earlier dates the new pill would contradict the outcome the gate actually reached on the old verdict."
  - "A BULK RE-CHECK'S OUTCOME IS ONE LINE IN THE CHECK'S DEFINITION CHANGELOG, AND NOTHING ON UNCHANGED ROWS (Keith, 2026-10-10, option B, the delivery-dashboard-ux recommendation): the check's drawer, under its Definition changelog, carries one line per bulk re-check - 'Re-checked 412 supplies across 9 datasets on 3 Oct by Keith: 9 changed - <reason>' - beside the changelog entry it acted on; rows whose verdict the bulk run left unchanged show nothing; rows it changed carry the cause as criterion 6 words it. So the terminal's promise that the reason is published on the dashboard holds for every bulk run, and the outcome has one place to be read. REJECTED showing it only on changed rows (the reason would be published only where something changed). A single re-check that changes nothing still shows on its own row (REQ-PIPE-164 criterion 14's published-reason promise), as the dashboard review's finding 5 proposed."
  - "FOLDED 2026-10-10 (main session): the review blocker on criterion 5 is applied by splitting it - a single re-check says who re-checked it and why, a bulk re-check names the corrected check and its changelog entry (which REQ-PIPE-177 now records). Also applied: no Outcome-cell flip, the as-of rule for a placement, 'Placed in <period>' rather than 'Placed by hand' (filedNote already uses the latter), the resolved hold row in the rejected branch's form, links inside clickable rows, nothing for a trial, and REQ-PIPE-177 as a dependency."
  - "ROUND 3 FOLDED, 2026-10-10 (main session): an amber re-check gets the acknowledgement badge's form, since the page has no amber red-promoted badge, and the supply counts as outstanding until acknowledged, so Keith's 'very clearly' holds for amber too (delivery-dashboard-ux 16); the badge stays after acknowledgement, naming who (delivery-scoper L); the re-check note extends the existing arrived-as note rather than adding a second (18) and replaces the turned-red-later tag (17); 'and other checks' where another check moved (delivery-architect 8); the drawer link a real <a href> (19); the drawer line's date rule (20); REQ-PIPE-081 cited as criteria 1 and 4 (delivery-scoper J); REQ-DASH-126, REQ-PIPE-081 and REQ-DASH-071 added as dependencies. Criterion numbers in decisions written before this fold refer to the list as it then stood."
  - "SPLIT OUT OF REQ-DASH-175, 2026-10-14 (delivery-scoper; CONFIRMED by Keith, 2026-10-14, 175-A, option A - two requirements, REJECTED one requirement with the re-check half left unmet until REQ-PIPE-164 and REQ-PIPE-177 land): the decisions above travelled with the criteria they explain. Their criterion numbers are REQ-DASH-175's as they then stood; here old 5-9 are 1-5, old 11's re-check half is 6, old 14 is 8, old 15-17 are 10-12."
  - "REQ-DASH-126 IS AMENDED, NOT WORKED ROUND (delivery-scoper, 2026-10-14): its criterion 1 defines red promoted from refreshed cross-table results and criteria 2 and 6 name an arrival or promotion as the only causes, so old criterion 14's 'red-promoted badge naming the re-check as the cause' contradicted a signed requirement as written. Criterion 14 amends it; exact wording in the summary."
  - "ORDERED BESIDE THE TURN-OFF MARKER (delivery-scoper, 2026-10-14): REQ-DASH-180 criterion 13 (signed 2026-10-14) fixes the order pill, red-promoted badge, turn-off marker; criterion 9 puts the amber re-checked tag in the badge's place, so the two cannot be drawn in either order."
  - "COUNTED WHETHER OR NOT TURNED OFF (REQ-PIPE-179 criterion 23, REQ-DASH-180 criterion 6, both signed 2026-10-14, already name 'Promoted, then re-checked <verdict>' as counting): criterion 12 cites it."
