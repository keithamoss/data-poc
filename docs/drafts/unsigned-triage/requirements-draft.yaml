  - "SUPERSEDED 2026-10-14 by Keith's answer (decision below). WAS: SPLIT OFFERED, NOT DONE (delivery-scoper, 2026-10-14; summary question 176-B): criteria 3 to 6, 17, 19 and 23 widen what the CHANGELOG GATE sees - today macros/matches_regex.sql backs 11 checks and editing it trips no gate - and need no stored column, so they could be signed and built now while the stored fingerprint waits on #89. Left whole until Keith answers."
  - "THE FULL 64-HEX DIGEST (Keith, 2026-10-14, 176-A, option A): criterion 21 stands - 'v1:' followed by the full 64-hex-digit SHA-256 - about 48 bytes more per result row than a 16-hex digest, and no truncation to defend later. REJECTED 16 hex like check_lifecycle._config_hash today (option B); a collision is negligible either way."
  - "SPLIT: THE CHANGELOG-GATE HALF IS REQ-QAC-223 (Keith, 2026-10-14, 176-B, option A): former criteria 3, 4, 5, 6, 17, 19 and 23 widen what the changelog gate sees and need no stored column, so they became REQ-QAC-223's criteria 1 to 7, signable now and built ahead of this. They stay here in place as retired_criteria, so criterion 12 (cited by REQ-PIPE-177 criterion 2) and criterion 18 (the hold) keep their numbers. The REQ-QAC-006 criterion 2 amendment (summary T8) moved with former criterion 19. This requirement keeps the stored fingerprint - the frozen defaults, canonical JSON, the scheme version, the column, both writers stamping, the golden test - and STAYS HELD behind plans/running-thoughts.md #89; criterion 2 now extends REQ-QAC-223's widened writer rather than widening it itself. REJECTED keeping it whole and held (option B): today macros/matches_regex.sql backs 11 checks and editing it trips no gate, and that does not need to wait on #89."
