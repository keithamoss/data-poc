  "non_functional_requirements":
  - "Derived from committed configuration and code only; reads no supply rows. Computed once per run, not once per result."
  - "The selection that reads it (REQ-PIPE-177) runs every time the terminal's queue opens, so the stored fingerprint must be indexed with the result's run and check id."
  - "BEFORE BUILDING criterion 14's refusal, confirm on a bootstrapped database that every recorded result's check id is in the lifecycle map, or the refusal halts the pipeline on day one (delivery-architect, round 3)."
  - "A NEW DEPENDENCY (the rfc8785 package, criterion 20) to keep current; the golden test (criterion 15) is what makes an upgrade of it safe, since any change in its output fails CI."
  - "STORAGE AT SCALE: 64 hex digits plus 'v1:' is about 67 bytes per check result; at thirty datasets and years of daily history (some 550,000 results a year at fifty checks a supply) that is tens of MB a year, small beside the results themselves. Keith chose the full digest over a 16-hex one, about a quarter of the size (2026-10-14, 176-A)."
  - "NO SUPPLY ROWS, NO PERSONAL DATA: the fingerprint is computed from committed configuration and code, so it is safe on the publisher's side of the line and on a real asset alike."
  dependencies:
  - REQ-PIPE-089
  - REQ-QAC-223
  open_questions:
  - "(HELD with criterion 18, 2026-10-14) If #89's migrations are adopted, results recorded before the fingerprint column carry an empty fingerprint. What does REQ-PIPE-177's bulk re-check do with them - leave them out and say how many in its consequences panel, treat them as differing (the first bulk re-check of a check re-runs its whole history), or offer them as an explicit opt-in? Both earlier rejections (decision 'A DATABASE HOLDING RESULTS WITH NO FINGERPRINT IS REFUSED') were made under 'regenerate, never migrate', which #89 reverses."
  decisions:
  - "SPLIT 2026-10-10 (Keith, on the delivery-scoper second pass): REQ-PIPE-164 had grown to 38 criteria across four concerns, so it became four requirements - REQ-PIPE-164 single re-check, REQ-QAC-176 the check-definition fingerprint, REQ-PIPE-177 bulk re-check, REQ-PIPE-178 trial - each reviewed and signed off on its own. Decisions travelled with the criteria they explain."
  - "THE AFFECTED SET IS CHOSEN BY A STORED DEFINITION FINGERPRINT, NOT BY THE CHANGELOG DATE (Keith, 2026-10-10, on the delivery-architect review). Each result records a fingerprint of its check's definition; the bulk re-check takes every supply whose stored fingerprint differs from today's. REJECTED the changelog-date cut-off: run instants come from the replay clock, so on a bootstrapped history every supply looks older than every 2026 changelog entry and the whole history would be selected; and a hand-typed or backdated date silently changes what is re-run. Git and the check changelog stay the record of WHAT changed and why - Keith: the fingerprint says only THAT it changed, and nothing else is stored to report the change."
  - "THE FINGERPRINT SURVIVES ADDED SETTINGS (Keith, 2026-10-10, after research): settings at their frozen default are left out before hashing, as the Rust stable_hash crate does, so adding a setting whose default is what the system already did changes no stored fingerprint. Defaults are FROZEN in a versioned table, because a default edited in place would be invisible - the old hash left the field out and so would the new. Implemented in our existing writer rather than a new dependency; RFC 8785 canonical JSON (the rfc8785 package) replaces the hand-rolled json.dumps. REJECTED a fingerprint of tool and code versions: every dbt, Soda or Python upgrade would make every supply look stale (plans/running-thoughts.md #73). REJECTED storing the parsed settings or the YAML text alongside the hash: it would need a parser for every past shape, and Git already holds the history."
  - "THE FINGERPRINT COVERS THE EXPRESSION, SINGULAR-TEST SQL AND EVIDENTLY THRESHOLDS (Keith, 2026-10-10, on the delivery-architect second pass): today's config_hash hashes only a dbt test's config (not its test type), only a Soda check's config (not its expression), none of a singular test's SQL file, and nothing of Evidently's thresholds, which are code constants - so a fix to any of those would select nothing to re-check, and the changelog gate already misses them. The writer is changing anyway, so widening it costs nothing extra. REJECTED keeping today's scope."
  - "A WRITER CHANGE IS INVISIBLE TO THE CHANGELOG GATE BY CONSTRUCTION (delivery-architect second pass, 2026-10-10, verified by the main session in validate_check_lifecycle.py::main): the gate re-parses the diff base's definitions and hashes both sides with the CURRENT writer, so a new writer moves both sides together. The main session had told Keith the opposite earlier the same day, and the baseline-file decision below rested on that error."
  - "SUPERSEDED LATER THE SAME DAY - the baseline file is dropped (decision below); its premise was the main session's error. WAS: THE WRITER CHANGE IS RE-BASELINED BY A COMMITTED BASELINE FILE (Keith, 2026-10-10, 'happy in principle'): switching the writer moves all 258 hashes at once, which the changelog gate would read as every check changing. One file lists every check's fingerprint, regenerated by one mothman command and reviewed like any configuration, and the gate compares against it. REJECTED a one-off gate exemption for a named commit: a hole in the gate that outlives the change it was made for."
  - "THE FINGERPRINT INCLUDES THE MACRO BEHIND A GENERIC TEST AND ANY MACRO A SINGULAR TEST NAMES (Keith, 2026-10-10, option A, the delivery-architect's recommendation): a generic test's fingerprint includes the text of the project macro that defines its test type (found by scanning macros/*.sql for its {% test <name>( definition); a singular test's includes its SQL file and every project macro whose name appears in it, followed transitively. The scan is lexical and static, so it errs towards including too much - the safe direction. The architect found no singular test calls a project macro today, while macros/matches_regex.sql backs 11 checks by test type, so editing it changed 11 checks with no fingerprint moving. Package macros (dbt_utils, pinned in package-lock.yml) are a tool version and stay out, as do staging model SQL files. REJECTED working out macro use from dbt's manifest (would run dbt parse inside the gate, at the old ref too); REJECTED including each test's staging model SQL (one model edit would mark every dbt check on that table, across all history); REJECTED singular tests only (covers nothing today). Criterion 3's 'any project macro it calls' is to be reworded to this."
  - "AN EVIDENTLY CHECK'S COMPARISON COLUMN AND METHOD MOVE INTO ITS CONFIG WITH ITS THRESHOLDS (Keith, 2026-10-10, option A, the delivery-architect's recommendation): each Evidently check's whole definition - the column it compares (e.g. sex, concern_type), the method, and the warn and fail thresholds - lives as literals in its CHECK_LIFECYCLE entry, the runners read them from there by check_id, and the module constants are deleted. So changing which column a check compares is a change to the check: it moves the fingerprint and is caught by the changelog gate. REJECTED thresholds only, which would leave a column or method change invisible to both."
  - "NO BASELINE FILE; A GOLDEN TEST GUARDS THE WRITER (Keith, 2026-10-10, option A, recommended by delivery-architect and delivery-scoper): the committed baseline file is dropped. Its premise - that switching the writer would make the changelog gate see every check change - was the main session's error; the gate re-hashes both sides with the current writer. Instead a golden test pins the writer: a fixed set of literal per-tool configurations committed in the test with their expected v1 fingerprints, so any drift - including an rfc8785 upgrade - fails; plus a test that adding a setting at its frozen default leaves real checks' fingerprints unchanged, and that changing one check's threshold, expression or SQL moves only that check's (or, for a file check, that definition's per-dataset fingerprints). Criterion 10 is to be removed and criterion 11 reworded to that. REJECTED keeping the file: every check edit would also have to regenerate it."
  - "A DATABASE HOLDING RESULTS WITH NO FINGERPRINT IS REFUSED UNTIL REGENERATED (Keith, 2026-10-10, option C): the schema change that adds the fingerprint column refuses to run against a database whose recorded results predate it, naming `mothman env reset-synthetic` and `mothman pipeline bootstrap` as the way forward - the project's 'regenerate, never migrate' rule and the RESHAPED_AT pattern the last schema reshape used. This ships before any real deployment exists, so no real asset will ever hold results without fingerprints; a real deployment's first result already carries one. REJECTED treating fingerprint-less results as differing (the first bulk re-check of any check would re-run all its history, and the queue nudge would fire for every check on day one) and REJECTED leaving them out (older supplies reachable only one at a time). This also settles REQ-PIPE-177's question about whether its selection and nudge pick up all existing history: they cannot, because no such history survives."
  - "CONFIRMED BY KEITH 2026-10-14 (176-A, decision below). THE FULL 64-HEX SHA-256 IS STORED (main session, 2026-10-10, as an implementation detail under Keith's standing permission for minor choices - not put to him): criterion 2's 'v1:<sha256>' already reads as the whole digest, and delivery-architect and delivery-scoper both recommended it over today's 16-hex truncation (check_lifecycle.py:202); about 48 bytes more per result row, and no truncation to defend later. Keith to overrule at sign-off if he wants otherwise."
  - "FOLDED 2026-10-10 (main session): the split review round's fixes are now criteria - Evidently definitions as literals read by check_id, because the gate execs lifecycle modules at the old ref and an imported constant would hide a change (delivery-architect); source files through an injected read(path, ref); one append-only frozen-defaults list; both result writers stamp, synthesised not-evaluated records included; the map cached per process and raising on parse failure; 64 hex stated; bundled criteria split; the baseline criteria replaced by the golden test; REQ-QAC-006 amended by same-change criterion and added as a dependency."
  - "ROUND 3 FOLDED, 2026-10-10 (main session): criterion 2's three statements split into 2, 20 and 21 (delivery-scoper L); a file check fingerprinted per dataset, which the no-baseline decision assumed and no criterion said (delivery-scoper L); the macro scan covers generic-test directories and a run reads the working tree (delivery-architect); one source file moving many fingerprints reported once (delivery-cli-ux M13); the pre-fingerprint refusal worded as not the person's fault, commands on lines of their own (delivery-cli-ux L4). Criterion numbers in decisions written before this fold refer to the list as it then stood. In particular: 'criterion 3' in the macro decision is now criterion 4, and 'criterion 10 removed, 11 reworded' in the no-baseline decision are now 15 and 16."
  - "SCOPER PASS, 2026-10-14 (delivery-scoper, unsigned triage): verified against the code - check_result still has no fingerprint column (qa_store.py), check_lifecycle._config_hash still hashes json.dumps to 16 hex, the Evidently runners still read WARN_THRESHOLD/FAIL_THRESHOLD and cp's _COLUMN as module constants, and rfc8785 is not yet a dependency. No criterion changed except 18's hold; criteria keep their numbers."
