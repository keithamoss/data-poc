  "non_functional_requirements":
  - "Derived from committed configuration and code only; reads no supply rows. Computed once per run, not once per result."
  - "The selection that reads it (REQ-PIPE-177) runs every time the terminal's queue opens, so the stored fingerprint must be indexed with the result's run and check id."
  - "BEFORE BUILDING criterion 14's refusal, confirm on a bootstrapped database that every recorded result's check id is in the lifecycle map, or the refusal halts the pipeline on day one (delivery-architect, round 3)."
  - "A NEW DEPENDENCY (the rfc8785 package, criterion 20) to keep current; the golden test (criterion 15) is what makes an upgrade of it safe, since any change in its output fails CI."
  - "STORAGE AT SCALE: 64 hex digits plus 'v1:' is about 67 bytes per check result; at thirty datasets and years of daily history (some 550,000 results a year at fifty checks a supply) that is tens of MB a year, small beside the results themselves. Keith chose the full digest over a 16-hex one, about a quarter of the size (2026-10-14, 176-A)."
  - "NO SUPPLY ROWS, NO PERSONAL DATA: the fingerprint is computed from committed configuration and code, so it is safe on the publisher's side of the line and on a real asset alike."
  dependencies:
  - REQ-PIPE-089
  - REQ-QAC-223
  open_questions:
  - "(HELD with criterion 18, 2026-10-14) If #89's migrations are adopted, results recorded before the fingerprint column carry an empty fingerprint. What does REQ-PIPE-177's bulk re-check do with them - leave them out and say how many in its consequences panel, treat them as differing (the first bulk re-check of a check re-runs its whole history), or offer them as an explicit opt-in? Both earlier rejections (decision 'A DATABASE HOLDING RESULTS WITH NO FINGERPRINT IS REFUSED') were made under 'regenerate, never migrate', which #89 reverses."
  decisions:
  - "SPLIT 2026-10-10 (Keith, on the delivery-scoper second pass): REQ-PIPE-164 had grown to 38 criteria across four concerns, so it became four requirements - REQ-PIPE-164 single re-check, REQ-QAC-176 the check-definition fingerprint, REQ-PIPE-177 bulk re-check, REQ-PIPE-178 trial - each reviewed and signed off on its own. Decisions travelled with the criteria they explain."
  - "THE AFFECTED SET IS CHOSEN BY A STORED DEFINITION FINGERPRINT, NOT BY THE CHANGELOG DATE (Keith, 2026-10-10, on the delivery-architect review). Each result records a fingerprint of its check's definition; the bulk re-check takes every supply whose stored fingerprint differs from today's. REJECTED the changelog-date cut-off: run instants come from the replay clock, so on a bootstrapped history every supply looks older than every 2026 changelog entry and the whole history would be selected; and a hand-typed or backdated date silently changes what is re-run. Git and the check changelog stay the record of WHAT changed and why - Keith: the fingerprint says only THAT it changed, and nothing else is stored to report the change."
  - "THE FINGERPRINT SURVIVES ADDED SETTINGS (Keith, 2026-10-10, after research): settings at their frozen default are left out before hashing, as the Rust stable_hash crate does, so adding a setting whose default is what the system already did changes no stored fingerprint. Defaults are FROZEN in a versioned table, because a default edited in place would be invisible - the old hash left the field out and so would the new. Implemented in our existing writer rather than a new dependency; RFC 8785 canonical JSON (the rfc8785 package) replaces the hand-rolled json.dumps. REJECTED a fingerprint of tool and code versions: every dbt, Soda or Python upgrade would make every supply look stale (plans/running-thoughts.md #73). REJECTED storing the parsed settings or the YAML text alongside the hash: it would need a parser for every past shape, and Git already holds the history."
  - "THE FINGERPRINT COVERS THE EXPRESSION, SINGULAR-TEST SQL AND EVIDENTLY THRESHOLDS (Keith, 2026-10-10, on the delivery-architect second pass): today's config_hash hashes only a dbt test's config (not its test type), only a Soda check's config (not its expression), none of a singular test's SQL file, and nothing of Evidently's thresholds, which are code constants - so a fix to any of those would select nothing to re-check, and the changelog gate already misses them. The writer is changing anyway, so widening it costs nothing extra. REJECTED keeping today's scope."
  - "A WRITER CHANGE IS INVISIBLE TO THE CHANGELOG GATE BY CONSTRUCTION (delivery-architect second pass, 2026-10-10, verified by the main session in validate_check_lifecycle.py::main): the gate re-parses the diff base's definitions and hashes both sides with the CURRENT writer, so a new writer moves both sides together. The main session had told Keith the opposite earlier the same day, and the baseline-file decision below rested on that error."
  - "SUPERSEDED LATER THE SAME DAY - the baseline file is dropped (decision below); its premise was the main session's error. WAS: THE WRITER CHANGE IS RE-BASELINED BY A COMMITTED BASELINE FILE (Keith, 2026-10-10, 'happy in principle'): switching the writer moves all 258 hashes at once, which the changelog gate would read as every check changing. One file lists every check's fingerprint, regenerated by one mothman command and reviewed like any configuration, and the gate compares against it. REJECTED a one-off gate exemption for a named commit: a hole in the gate that outlives the change it was made for."
  - "THE FINGERPRINT INCLUDES THE MACRO BEHIND A GENERIC TEST AND ANY MACRO A SINGULAR TEST NAMES (Keith, 2026-10-10, option A, the delivery-architect's recommendation): a generic test's fingerprint includes the text of the project macro that defines its test type (found by scanning macros/*.sql for its {% test <name>( definition); a singular test's includes its SQL file and every project macro whose name appears in it, followed transitively. The scan is lexical and static, so it errs towards including too much - the safe direction. The architect found no singular test calls a project macro today, while macros/matches_regex.sql backs 11 checks by test type, so editing it changed 11 checks with no fingerprint moving. Package macros (dbt_utils, pinned in package-lock.yml) are a tool version and stay out, as do staging model SQL files. REJECTED working out macro use from dbt's manifest (would run dbt parse inside the gate, at the old ref too); REJECTED including each test's staging model SQL (one model edit would mark every dbt check on that table, across all history); REJECTED singular tests only (covers nothing today). Criterion 3's 'any project macro it calls' is to be reworded to this."
  - "AN EVIDENTLY CHECK'S COMPARISON COLUMN AND METHOD MOVE INTO ITS CONFIG WITH ITS THRESHOLDS (Keith, 2026-10-10, option A, the delivery-architect's recommendation): each Evidently check's whole definition - the column it compares (e.g. sex, concern_type), the method, and the warn and fail thresholds - lives as literals in its CHECK_LIFECYCLE entry, the runners read them from there by check_id, and the module constants are deleted. So changing which column a check compares is a change to the check: it moves the fingerprint and is caught by the changelog gate. REJECTED thresholds only, which would leave a column or method change invisible to both."
  - "NO BASELINE FILE; A GOLDEN TEST GUARDS THE WRITER (Keith, 2026-10-10, option A, recommended by delivery-architect and delivery-scoper): the committed baseline file is dropped. Its premise - that switching the writer would make the changelog gate see every check change - was the main session's error; the gate re-hashes both sides with the current writer. Instead a golden test pins the writer: a fixed set of literal per-tool configurations committed in the test with their expected v1 fingerprints, so any drift - including an rfc8785 upgrade - fails; plus a test that adding a setting at its frozen default leaves real checks' fingerprints unchanged, and that changing one check's threshold, expression or SQL moves only that check's (or, for a file check, that definition's per-dataset fingerprints). Criterion 10 is to be removed and criterion 11 reworded to that. REJECTED keeping the file: every check edit would also have to regenerate it."
  - "A DATABASE HOLDING RESULTS WITH NO FINGERPRINT IS REFUSED UNTIL REGENERATED (Keith, 2026-10-10, option C): the schema change that adds the fingerprint column refuses to run against a database whose recorded results predate it, naming `mothman env reset-synthetic` and `mothman pipeline bootstrap` as the way forward - the project's 'regenerate, never migrate' rule and the RESHAPED_AT pattern the last schema reshape used. This ships before any real deployment exists, so no real asset will ever hold results without fingerprints; a real deployment's first result already carries one. REJECTED treating fingerprint-less results as differing (the first bulk re-check of any check would re-run all its history, and the queue nudge would fire for every check on day one) and REJECTED leaving them out (older supplies reachable only one at a time). This also settles REQ-PIPE-177's question about whether its selection and nudge pick up all existing history: they cannot, because no such history survives."
  - "CONFIRMED BY KEITH 2026-10-14 (176-A, decision below). THE FULL 64-HEX SHA-256 IS STORED (main session, 2026-10-10, as an implementation detail under Keith's standing permission for minor choices - not put to him): criterion 2's 'v1:<sha256>' already reads as the whole digest, and delivery-architect and delivery-scoper both recommended it over today's 16-hex truncation (check_lifecycle.py:202); about 48 bytes more per result row, and no truncation to defend later. Keith to overrule at sign-off if he wants otherwise."
  - "FOLDED 2026-10-10 (main session): the split review round's fixes are now criteria - Evidently definitions as literals read by check_id, because the gate execs lifecycle modules at the old ref and an imported constant would hide a change (delivery-architect); source files through an injected read(path, ref); one append-only frozen-defaults list; both result writers stamp, synthesised not-evaluated records included; the map cached per process and raising on parse failure; 64 hex stated; bundled criteria split; the baseline criteria replaced by the golden test; REQ-QAC-006 amended by same-change criterion and added as a dependency."
  - "ROUND 3 FOLDED, 2026-10-10 (main session): criterion 2's three statements split into 2, 20 and 21 (delivery-scoper L); a file check fingerprinted per dataset, which the no-baseline decision assumed and no criterion said (delivery-scoper L); the macro scan covers generic-test directories and a run reads the working tree (delivery-architect); one source file moving many fingerprints reported once (delivery-cli-ux M13); the pre-fingerprint refusal worded as not the person's fault, commands on lines of their own (delivery-cli-ux L4). Criterion numbers in decisions written before this fold refer to the list as it then stood. In particular: 'criterion 3' in the macro decision is now criterion 4, and 'criterion 10 removed, 11 reworded' in the no-baseline decision are now 15 and 16."
  - "SCOPER PASS, 2026-10-14 (delivery-scoper, unsigned triage): verified against the code - check_result still has no fingerprint column (qa_store.py), check_lifecycle._config_hash still hashes json.dumps to 16 hex, the Evidently runners still read WARN_THRESHOLD/FAIL_THRESHOLD and cp's _COLUMN as module constants, and rfc8785 is not yet a dependency. No criterion changed except 18's hold; criteria keep their numbers."
  - "SIGN-OFF HELD BEHIND #89 (Keith, 2026-10-14): criterion 18 refuses a pre-fingerprint database and makes reset-and-bootstrap the only remedy, which #89's decided-so-far table reverses (from schema version 41 every bump ships a forward migration; reset-synthetic is no longer the remedy for a schema gap). The migration-era alternative is written into criterion 18 beside the original, so the call is a choice between two written texts when #89 returns."
  - "THIS IS #89's RAW-EVIDENCE GAP 'a check's definition isn't pinned to each result' (docs/drafts/schema-migrations/README.md, medium gaps): building it closes that gap, and its 'v1:' scheme prefix is already #89's proposed rule 4 (version the meaning of a recorded value)."
  - "SUPERSEDED 2026-10-14 by Keith's answer (decision below). WAS: SPLIT OFFERED, NOT DONE (delivery-scoper, 2026-10-14; summary question 176-B): criteria 3 to 6, 17, 19 and 23 widen what the CHANGELOG GATE sees - today macros/matches_regex.sql backs 11 checks and editing it trips no gate - and need no stored column, so they could be signed and built now while the stored fingerprint waits on #89. Left whole until Keith answers."
  - "THE FULL 64-HEX DIGEST (Keith, 2026-10-14, 176-A, option A): criterion 21 stands - 'v1:' followed by the full 64-hex-digit SHA-256 - about 48 bytes more per result row than a 16-hex digest, and no truncation to defend later. REJECTED 16 hex like check_lifecycle._config_hash today (option B); a collision is negligible either way."
  - "SPLIT: THE CHANGELOG-GATE HALF IS REQ-QAC-223 (Keith, 2026-10-14, 176-B, option A): former criteria 3, 4, 5, 6, 17, 19 and 23 widen what the changelog gate sees and need no stored column, so they became REQ-QAC-223's criteria 1 to 7, signable now and built ahead of this. They stay here in place as retired_criteria, so criterion 12 (cited by REQ-PIPE-177 criterion 2) and criterion 18 (the hold) keep their numbers. The REQ-QAC-006 criterion 2 amendment (summary T8) moved with former criterion 19. This requirement keeps the stored fingerprint - the frozen defaults, canonical JSON, the scheme version, the column, both writers stamping, the golden test - and STAYS HELD behind plans/running-thoughts.md #89; criterion 2 now extends REQ-QAC-223's widened writer rather than widening it itself. REJECTED keeping it whole and held (option B): today macros/matches_regex.sql backs 11 checks and editing it trips no gate, and that does not need to wait on #89."
  - "REVIEWED 2026-10-14 (delivery-architect): no structural issues; it stays held behind plans/running-thoughts.md #89 with criterion 18 and its open question. No criterion changed."
- id: REQ-QAC-223
  title: "The changelog gate sees a change to a check's expression, SQL, macro or Evidently settings"
  date_written: '2026-10-14'
  story: "As the person who reviews a change to a check, I want CI to refuse any change to what a check actually does - its expression, the SQL or project macro behind it, or an Evidently check's column, method or thresholds - unless it comes with a changelog entry, so that no check's definition changes silently and every fix has a dated record a re-check can later point to."
  moscow: should
  status: not_started
  source: "Split out of REQ-QAC-176 by Keith, 2026-10-14 (unsigned triage, summary question 176-B, option A), so that the changelog-gate half can be signed and built now while REQ-QAC-176's stored fingerprint stays held behind plans/running-thoughts.md #89. Drafted by delivery-scoper, 2026-10-14, from REQ-QAC-176's former criteria 3 to 6, 17, 19 and 23 (drafted 2026-10-10 from the delivery-architect's reviews and Keith's answers that day)."
  "acceptance_criteria":
  - "THE SYSTEM SHALL include in a check's definition hash - check_lifecycle's config hash, the one writer the changelog gate compares - the check's own expression or test type as well as its configuration, so that changing either changes the hash."
  - "THE SYSTEM SHALL include in a dbt check's definition hash, for a generic test, the text of the project macro that defines its test type, and for a singular test, the text of its SQL file and of every project macro whose name appears in it, followed transitively - found by scanning the project's macros and generic-test directories; and SHALL NOT include package macros or staging model SQL."
  - "THE SYSTEM SHALL hold each Evidently check's whole definition - the column it compares, its method and its warn and fail thresholds - as literals in its CHECK_LIFECYCLE entry, SHALL have the runners read them from there by check_id, and SHALL include them in its definition hash."
  - "THE SYSTEM SHALL read every source file a definition hash covers through one reader given a path and a git ref, so that the changelog gate hashes the diff base's files as they stood at that ref and the working tree's files as they stand."
  - "WHEN a check's definition hash differs between the diff base and the working tree and the check gains no changelog entry, THE SYSTEM SHALL fail the changelog gate naming the check, so that a change to its expression, a singular test's SQL, a project macro it uses, or an Evidently check's column, method or thresholds is refused as a change to its configuration already is."
  - "THE SYSTEM SHALL amend, in the same change, REQ-QAC-006 criterion 2 to say that a change to a check's expression, a singular test's SQL or a project macro it uses, or an Evidently check's column, method or thresholds is a definition change."
  - "WHERE one source file moves several checks' definition hashes, THE SYSTEM SHALL have the changelog gate report it once, naming the file and listing the checks, rather than once per check."
  - "THE SYSTEM SHALL be covered by a test that runs the changelog gate over a change to dbt_project/macros/matches_regex.sql with no changelog entry and asserts that it fails, naming that file once and every check whose test type it defines."
  - "THE SYSTEM SHALL be covered by a test that a change to one check's expression, to one singular test's SQL, or to one Evidently check's threshold, made without a changelog entry, fails the changelog gate naming that check alone, and that the same change made with a changelog entry passes."
  "non_functional_requirements":
  - "CONFIGURATION ONLY: derived from committed configuration and code at two git refs; reads no supply rows and no database, so it runs where the gate already runs - .github/workflows/validate-config.yml, which already checks out full history (fetch-depth 0) for the diff base."
  - "NO DATABASE OR SCHEMA CHANGE, which is why it is not held behind plans/running-thoughts.md #89: the definition hash is computed and compared in memory by the gate and stored nowhere."
  - "PERFORMANCE: the gate reads the project's macros and singular-test SQL at each of the two refs, a handful of small files; the macro scan is done once per ref, not once per check."
  - "AT THIRTY DATASETS: a shared macro backs many checks (matches_regex.sql backs 11 today), so criterion 7's one report per source file is what keeps a single macro edit to one readable failure rather than dozens."
  - "MAINTAINABILITY: no new dependency (REQ-QAC-176 brings rfc8785, not this); the macro scan is lexical and static, erring towards including too much, which can only make the gate ask for a changelog entry it did not strictly need."
  - "ONE READER, ALREADY THERE (delivery-architect, 2026-10-14): criterion 4's reader is validate_check_lifecycle._old_file_content(rel_path, ref), extended so that a ref of None reads the working tree - not a second reader beside it."
  - "NOT MERGED WITH sources_fingerprint() (delivery-architect, 2026-10-14): validate_check_lifecycle.sources_fingerprint() is REQ-PIPE-192's digest of every source file, keyed for that requirement's declarations and read whole; the definition hash is per check. They answer different questions and stay separate functions."
  - "THE SHARED EVIDENTLY BANDS MOVE INTO EACH CHECK (delivery-architect, 2026-10-14): WARN_THRESHOLD and FAIL_THRESHOLD in qa_tools/common/evidently_common.py are shared by every Evidently check today; criterion 3 copies their values into each check's CHECK_LIFECYCLE entry as literals and deletes the constants, and a comment where they stood says why - the gate execs the lifecycle modules at the old ref, so a value imported from elsewhere would hide a change from it."
  dependencies:
  - REQ-QAC-006
  decisions:
  - "SPLIT OUT OF REQ-QAC-176 (Keith, 2026-10-14, 176-B, option A): REQ-QAC-176's former criteria 3, 4, 5, 6, 17, 19 and 23 are criteria 1 to 7 here, reworded from 'fingerprint' to 'definition hash' because nothing here is stored; criteria 8 and 9 are new, the tests that make criterion 5 checkable. REQ-QAC-176 keeps the stored fingerprint and stays held behind #89, and its criterion 2 extends this writer rather than widening it. REJECTED keeping 176 whole and held: the gate's half needs no column and no migration rule."
  - "WHY THE GATE IS WIDENED (carried from REQ-QAC-176, Keith, 2026-10-10, on the delivery-architect second pass): today's config hash covers only a dbt test's config (not its test type), only a Soda check's config (not its expression), none of a singular test's SQL file and nothing of Evidently's thresholds, which are code constants - so a change to any of them trips no gate. macros/matches_regex.sql backs 11 checks by test type, and editing it today changes 11 checks with no hash moving. REJECTED keeping today's scope."
  - "THE MACRO BEHIND A GENERIC TEST AND ANY MACRO A SINGULAR TEST NAMES (carried from REQ-QAC-176, Keith, 2026-10-10, option A, the delivery-architect's recommendation): found by scanning the project's macros for its {% test <name>( definition and following names transitively; lexical and static, so it errs towards including too much, the safe direction. Package macros (dbt_utils, pinned in package-lock.yml) are a tool version and stay out, as do staging model SQL files. REJECTED working out macro use from dbt's manifest (it would run dbt parse inside the gate, at the old ref too); REJECTED including each test's staging model SQL (one model edit would mark every dbt check on that table); REJECTED singular tests only (covers nothing today - no singular test calls a project macro)."
  - "AN EVIDENTLY CHECK'S COLUMN AND METHOD MOVE INTO ITS CONFIG WITH ITS THRESHOLDS (carried from REQ-QAC-176, Keith, 2026-10-10, option A): the module constants are deleted and the runners read the literals by check_id, because the gate execs lifecycle modules at the old ref and an imported constant would hide a change. REJECTED thresholds only, which would leave a column or method change invisible."
  - "WIDENING THE WRITER DOES NOT TRIP THE GATE BY ITSELF (carried from REQ-QAC-176; delivery-architect second pass, 2026-10-10, verified in validate_check_lifecycle.py): the gate re-parses the diff base's definitions and hashes both sides with the CURRENT writer, so a new writer moves both sides together and no baseline file is needed (Keith, 2026-10-10, dropped the committed baseline file on that basis)."
  - "THE ONE EXCEPTION IS THE BUILD COMMIT'S EVIDENTLY CHECKS (delivery-scoper, 2026-10-14, read in qa_tools/*/evidently_check_lifecycle.py; say if otherwise): criterion 3 adds the column, method and thresholds to each CHECK_LIFECYCLE entry, which the diff base's entries do not have, so each Evidently check's hash differs once in the commit that builds this. The build adds a changelog entry to each saying its definition is now recorded with the check and its behaviour is unchanged - following Keith's 2026-10-10 rejection of a one-off gate exemption for a named commit ('a hole in the gate that outlives the change it was made for')."
  - "ONE WRITER, TWO USES (delivery-scoper, 2026-10-14): REQ-QAC-176, once #89 settles, extends this same writer with frozen defaults, RFC 8785 canonical JSON and the 'v1:' full 64-hex digest Keith chose (2026-10-14, 176-A), and stores its output. The gate's own hash is never stored, so its form is no fact this requirement fixes, and when 176 lands the gate simply compares the extended writer's output on both sides, by the decision above. REJECTED a second, gate-only hash: two writers of one definition can disagree."
  - "AMENDS REQ-QAC-006 CRITERION 2 (summary T8, moved here from REQ-QAC-176 with former criterion 19): the exact wording is in docs/drafts/unsigned-triage/summary.md, now carried by criterion 6 here and no longer held."
  - "REVIEWS FOLDED, 2026-10-14 (delivery-architect: buildable now): three NFRs added - the one reader, not merged with sources_fingerprint, the Evidently bands and their comment. No criterion changed."
- id: REQ-PIPE-177
  title: "A person can have every supply checked under an old definition of a fixed check re-checked at once"
  date_written: '2026-10-10'
  story: "As the person who has just fixed a check that was wrong, I want every supply that check judged under its old definition re-checked in one action, across every dataset and period it touches, so that no verdict our mistake produced is left standing and I do not have to find them one by one."
  moscow: should
  status: not_started
  source: "Split out of REQ-PIPE-164 on 2026-10-10 (Keith); bulk re-check was added to that requirement by Keith on 2026-10-07. Folds in the delivery-scoper and delivery-architect second-pass findings of 2026-10-10. SCOPER PASS by delivery-scoper, 2026-10-14 (unsigned triage), against everything signed since. EFFECTIVELY HELD (delivery-architect, 2026-10-14): criterion 2 selects by REQ-QAC-176's stored fingerprint, whose sign-off Keith held behind plans/running-thoughts.md #89."
  "acceptance_criteria":
  - "THE SYSTEM SHALL offer a BULK re-check, raised by a person naming one check by its check_id, with a mandatory reason. A bulk re-check SHALL cover every dataset and every period that check touches, and SHALL NOT offer the person a period range on it."
  - "THE SYSTEM SHALL choose the supplies a bulk re-check covers as every supply, in any dataset and any period, that is filed and waiting or promoted and whose result for that check in its current run (qa.supply_current_run) carries a fingerprint (REQ-QAC-176) different from the check's current one, compared as REQ-QAC-176 criterion 12 says, SHALL NOT consult readers-only runs, and SHALL include none other."
  - "IF a bulk re-check would cover no supply, THEN THE SYSTEM SHALL refuse it, saying that every supply the check touches was already checked under its current definition."
  - "IF the named check is retired, THEN THE SYSTEM SHALL refuse a bulk re-check of it, saying that a retired check's results no longer judge any supply."
  - "IF the named check is a file check, THEN THE SYSTEM SHALL refuse a bulk re-check of it, printing the command that reprocesses a supply on a line of its own, since file checks run only at staging."
  - "THE SYSTEM SHALL show, before anything runs and on both routes, one consequences panel giving the check, its current changelog entry, the number of supplies the bulk re-check covers by dataset and period, and how many of them are promoted, and SHALL ask for one confirmation of that number."
  - "THE SYSTEM SHALL record a bulk re-check, in one transaction and before any of it runs, as one re-check decision-log entry and one owed re-check for each supply it covers, each naming the check in a column of its own, the check's current changelog entry and the reason, written in sorted slot order."
  - "THE SYSTEM SHALL treat each supply in a bulk re-check as a single re-check under REQ-PIPE-164's gate criteria."
  - "WHERE a promoted supply's re-check in a bulk re-check comes back worse than the verdict it was promoted on, THE SYSTEM SHALL list it under REQ-PIPE-164's 'Promoted, then re-checked <verdict>' heading and SHALL name it in the bulk re-check's summary."
  - "IF any re-run in a bulk re-check fails to complete, THEN THE SYSTEM SHALL leave it owed under REQ-PIPE-140 criterion 8 and SHALL continue with the rest."
  - "THE SYSTEM SHALL offer the bulk re-check as `mothman supply recheck --check <check_id> --reason <why>`, with --yes, --acknowledge KEY and --hand-off, and no period range."
  - "WHEN a bulk re-check is proposed on the flag route, THE SYSTEM SHALL require --yes with --acknowledge KEY, the key computed over every covered supply and the check's current fingerprint, SHALL refuse if the set has changed since it was shown, and SHALL require the asset's production confirmation where that applies."
  - "THE SYSTEM SHALL offer the bulk re-check in the terminal's filing-decisions door ABOVE the collection choice, beside calendar corrections, as 'Supplies checked before a check changed (N)', N counting every collection; where one check has supplies to cover it SHALL lead to that check's bulk re-check, and where more than one, to a chooser of those checks, each with its supply count, the date it changed and its changelog headline."
  - "WHILE a bulk re-check runs in the terminal, THE SYSTEM SHALL show its progress one line per supply in the shape the terminal's other runs use - '[k/N] re-checking <dataset> <period> (received <day>)...' - with the elapsed and estimated remaining time measured from the run so far, SHALL mark a supply whose verdict changed as it finishes ('now amber, was green'), and SHALL say at the start that Ctrl-C stops it at any point and that whatever has not run stays owed for the processing pass."
  - "WHEN a bulk re-check ends, THE SYSTEM SHALL show a summary of how many verdicts changed, stayed the same and are still owed, listing each supply whose verdict changed with its old and new verdict and the checks whose results changed, and SHALL NOT use the words rejected or refused for a gate outcome."
  - "THE SYSTEM SHALL claim each owed re-check before running it, as every owed run is claimed (REQ-PIPE-163 criterion 31's amendment of REQ-PIPE-140)."
  - "WHEN the terminal runs a bulk re-check, THE SYSTEM SHALL run only the owed re-checks that bulk re-check recorded."
  - "WHERE a bulk re-check covers more than 10 supplies, THE SYSTEM SHALL warn the person before it runs, giving the count and an approximate duration at about a minute per supply ('roughly N minutes' or 'roughly N hours'), shown as information only, the line staying a count; SHALL offer 'Hand it to the processing pass' first and 'Run it here now' second, the hand-off recording the run without running any of it in the terminal and saying that nothing runs until the processing pass or `mothman pipeline process` does; and on the flag route the consequences panel SHALL mention --hand-off and SHALL say that closing the terminal part way leaves the rest owed."
  - "WHERE a bulk re-check would cover at least one supply of a collection, THE SYSTEM SHALL say so in that collection's queue in the terminal - 'N supplies were checked before <check> changed' where one check would, or 'N supplies were checked before K checks changed' where more than one would - N counting that collection's own supplies, adding '(M more in other collections)' where other collections have some, as a choice that leads to criterion 13's asset-wide entry."
  - "WHEN `mothman supply queue` runs, THE SYSTEM SHALL print criterion 19's line for its collection and, beneath it, one plain line per check with supplies to cover - its check_id written as it is pasted after --check, its supply count in this collection and in all, the date it changed and its changelog headline - followed by `mothman supply recheck --check <check_id> --reason <why>` on a line of its own, as `mothman supply superseded` lists what its command takes."
  - "THE SYSTEM SHALL offer the bulk re-check on the terminal route only and SHALL NOT offer it on the GitHub route; THE SYSTEM SHALL amend, in the same change, REQ-GHUB-082 criterion 3 to name the bulk re-check beside REQ-PIPE-170's correction confirmation, choose-file (REQ-PIPE-193) and place (REQ-PIPE-163) as terminal-only, and SHALL add it to filing_decisions.TERMINAL_ONLY."
  - "WHEN the reason is asked for, THE SYSTEM SHALL say that it is published on the dashboard against each of the N supplies the bulk re-check covers, giving N."
  - "THE SYSTEM SHALL run a bulk re-check raised on the flag route in the foreground whatever the number of supplies it covers, unless --hand-off is given, in which case it SHALL record every owed re-check, run none, and say that the processing pass will run them - and that it runs every owed QA run, not only these, and that nothing runs until it or `mothman pipeline process` does - printing that command on a line of its own."
  - "WHEN the processing pass runs owed re-checks, THE SYSTEM SHALL start no new one once the pass's deadline is reached, leaving the rest owed."
  - "IF a person stops a bulk re-check with Ctrl-C, on either route, THEN THE SYSTEM SHALL end without a traceback, show criterion 15's summary for what ran, say that the rest are still owed, and print `mothman pipeline process` on a line of its own."
  - "THE SYSTEM SHALL state in `mothman supply recheck --help` that it runs in the foreground unless --hand-off is given."
  - "THE SYSTEM SHALL leave out of a bulk re-check every file of an open contested pair (REQ-PIPE-194 criterion 9), whose settlement checks it under the check's current definition (REQ-PIPE-193 criterion 21), and SHALL say in the consequences panel how many were left out and why."
  - "WHERE the agreement backstop refuses a dataset the bulk re-check would cover (REQ-PIPE-173), THE SYSTEM SHALL leave that dataset's supplies out, SHALL name the dataset, its count, REQ-PIPE-173's own finding for it and that finding's paste-ready fix in the consequences panel, saying that its supplies are covered once the correction is declared, and SHALL keep them in the queue's nudge, so that a later bulk re-check covers them once the change is restored or declared."
  - "WHERE owed QA runs are listed after a decision (REQ-PIPE-121 criterion 16's owed list in the terminal), THE SYSTEM SHALL list the owed re-checks of one bulk re-check as one line - 'k of N re-checks for <check> still owed (raised <date>)' - rather than one line per supply, so that this line is also the progress view of a handed-off run."
  - "THE SYSTEM SHALL exit `mothman supply recheck` (other than a trial) with 0 when every covered re-check ran or every one was handed off, with 1 when it refuses, and with REQ-PIPE-163 criterion 28's own code - the decision stands, its checks still owed - when a foreground run leaves any re-check owed, Ctrl-C included."
  - "IF `mothman supply recheck` runs without a terminal and without --yes, THEN THE SYSTEM SHALL show the consequences panel and refuse, with the flag hint naming --yes and --acknowledge <key> and giving the key."
  - "THE SYSTEM SHALL offer `mothman supply recheck --check <check_id> --list`, printing the supplies the bulk re-check would cover - dataset, period, supply id and current verdict - so that a person can choose --supply ids for a trial, and SHALL record nothing."
  - "THE SYSTEM SHALL say in the consequences panel how many rejected or superseded supplies the check's old definition also judged, which the bulk re-check does not cover (REQ-PIPE-164 criterion 10), naming promote and un-supersede, with their flag forms, as the decisions that would bring one back to be covered."
  "non_functional_requirements":
  - "BOUNDED BY THE CHECK AND ITS FINGERPRINT, NOT BY A RANGE. At thirty datasets and years of daily history 'every supply that check ever touched' is large, so the real run covers the one named check across everything it touches, and only supplies whose stored fingerprint differs from today's are re-run. There is no period range on the real run (Keith, 2026-10-08): a partial re-run after a fix is not a case anyone needs. The count is shown and confirmed before anything runs."
  - "Runs through the processing pass's orchestrator path, one supply at a time like any owed re-check, so a large bulk re-check is slow rather than unsafe; owed re-checks survive an interrupted run (REQ-PIPE-140)."
  - "The selection and the queue nudge read one shared query, and the nudge reads it once, grouped by check, rather than once per check; neither re-implements the 'current result' rule."
  - "A NEW COLUMN ON THE DECISION (the check, criterion 7) IS ADDITIVE: earlier decisions carry it empty, which is true - no bulk re-check existed. See REQ-PIPE-164's NFR for how that sits with plans/running-thoughts.md #89."
  - "COST AT SCALE: about a minute of the four tools per supply, so a fix touching 400 supplies is some seven hours of compute on the processing pass's machine; criterion 18's hand-off and criterion 24's deadline are what keep that from blocking a terminal or overrunning a Lambda budget."
  - "ITS OWN OWED RUNS ONLY (delivery-architect, 2026-10-14): criterion 17 needs recheck.run_all_owed to take the owed ids a bulk re-check recorded (an ids= filter); today it takes kinds and a collection only. The deadline of criterion 24 is passed through the same call, which processing_pass.run_pass makes today with none."
  - "THE OWED LIST GROUPS BY BULK RE-CHECK (delivery-cli-ux H4, 2026-10-14): cli/supply.py's _say_owed prints one line per owed run today, so a 400-supply hand-off would print 400 lines; criterion 29 groups them by the bulk re-check that raised them."
  dependencies:
  - REQ-PIPE-164
  - REQ-QAC-176
  - REQ-PIPE-140
  - REQ-PIPE-151
  - REQ-GHUB-082
  - REQ-PIPE-163
  - REQ-PIPE-173
  - REQ-PIPE-179
  - REQ-PIPE-193
  - REQ-PIPE-194
  open_questions:
  - "(HELD with REQ-QAC-176 criterion 18, 2026-10-14) If #89's migrations are adopted, results recorded before fingerprints carry an empty one; criterion 2 as written selects only a fingerprint DIFFERENT from today's. Whether an empty one is left out, counted in the panel, or selectable is REQ-QAC-176's held question and settles with it; the 'NOT BLOCKED ANY MORE' decision assumed the refusal Keith has now held."
  decisions:
  - "SPLIT 2026-10-10 (Keith, on the delivery-scoper second pass): REQ-PIPE-164 had grown to 38 criteria across four concerns, so it became four requirements - REQ-PIPE-164 single re-check, REQ-QAC-176 the check-definition fingerprint, REQ-PIPE-177 bulk re-check, REQ-PIPE-178 trial - each reviewed and signed off on its own. Decisions travelled with the criteria they explain."
  - "BULK RE-CHECK IS IN THIS BATCH (Keith, 2026-10-07), against the recommendation to leave it to check-lifecycle work."
  - "ONE ENTRY PER SUPPLY, as REQ-PIPE-161's range excuse is recorded: every re-run carries its own cause (REQ-PIPE-140 criterion 4)."
  - "THE QUEUE NUDGES A BULK RE-CHECK (Keith, 2026-10-07): 'N supplies were checked before <check> changed'. A nudge, not an automatic re-run - re-judging promoted data stays a person's call."
  - "AMENDED 2026-10-08 - its shared range flags moved to the trial (decision below); the rest stands. ITS OWN COMMAND, THE SHARED RANGE FLAGS, THE CONSEQUENCES PANEL, PROGRESS AND A SUMMARY (delivery-cli-ux pre-build review, 2026-10-07). A promoted supply re-checked red says the period keeps it and names demote, so 'still red' is never read as 'already taken out'."
  - "AMENDED 2026-10-08 (Keith): supersedes the decision above that required a period range. The real run covers everything the check touches with no range at all. A period range now belongs to the TRIAL only, where it is a bounded look at a few supplies, and the screen says so plainly. The concern behind the old decision - not re-judging years of data without anyone deciding to - is met by the stored fingerprint (REQ-QAC-176) and by the count-and-confirm step, not by a range."
  - "A LARGE BULK RUN WARNS AND OFFERS A HAND-OFF (Keith, 2026-10-10): the terminal records every owed re-check up front, runs them with progress and may be stopped at any point, with the processing pass finishing what is left; where the estimated time is long it warns first and offers to hand the whole run to the pass. THE LINE IS MORE THAN 10 SUPPLIES (Keith, 2026-10-10): a count of runs, not a time estimate - roughly ten minutes at about a minute per supply, but a count is what the person can check and what a test can assert. REJECTED the proposed thirty-minute time estimate."
  - "A BULK RE-CHECK HAS NO TICKET, SO IT IS TERMINAL-ONLY (delivery-scoper second pass, 2026-10-10): it spans many slots, and REQ-GHUB-082 criterion 3 forbids one route having an operation the other lacks unless named - so it is named."
  - "A CHECK ADDED AFTER A SUPPLY WAS CHECKED IS NOT A FIX TO IT: a supply with no result for the check is never selected. REJECTED selecting supplies with no result (delivery-scoper second pass)."
  - "NOT BLOCKED ANY MORE (2026-10-10): REQ-QAC-176's answer on results with no fingerprint - a database holding them is refused until regenerated - means no fingerprint-less history ever reaches this requirement's selection (criterion 2) or queue nudge (criterion 16)."
  - "EACH BULK RE-CHECK DECISION RECORDS THE CHECK'S CURRENT CHANGELOG ENTRY (Keith, 2026-10-10, option A, restoring what the main session dropped by mistake in the split): every decision a bulk re-check writes names the check (in a column of its own, not prose in the reason - architect) and the changelog entry of that check's definition current when the re-check was raised, so the record says permanently which fix caused the re-run and REQ-DASH-175 can say 're-checked after we corrected <check> (<entry date>)'. Criterion 7 is to be restored to 'naming the check, the check's current changelog entry and the reason'. REJECTED recording the check only: the reader would have to work out from the check's changelog which entry applied."
  - "ON THE FLAG ROUTE A BULK RE-CHECK RUNS IN THE FOREGROUND UNLESS --hand-off IS GIVEN (Keith, 2026-10-10, option A, the delivery-cli-ux recommendation): `mothman supply recheck --yes` runs the re-checks in the foreground whatever their number; `--hand-off` records every owed re-check and runs none, saying the processing pass will run them and printing that command on a line of its own. So the command does what its name says, and the TUI's hand-off choice (criterion 15) has its flag equivalent. REJECTED always handing off above 10 on the flag route (the command would silently change behaviour past a threshold) and REJECTED refusing above 10 without an explicit flag (a script that worked at 9 supplies would break at 11)."
  - "THE QUEUE NUDGE AGGREGATES (Keith, 2026-10-10, option A, the delivery-cli-ux recommendation): WHERE more than one check has supplies a bulk re-check would cover, the terminal's queue shows one line - 'N supplies were checked before K checks changed' - leading to a chooser of those checks, each listed with its supply count, the date it changed and its changelog headline; WHERE exactly one, that check's own line. `mothman supply queue` prints the same line with the recheck command beneath it. Criterion 16 is to be reworded to this. REJECTED one line per check: at thirty datasets and some 258 checks, a batch of fixes would bury the queue."
  - "REJECTED SELECTING ONLY SUPPLIES WHOSE RESULT FOR THE CHECK WAS RED OR AMBER (delivery-scoper, carried from the changelog-date decision it outlived): a fix can turn a false pass into a fail as easily as the reverse. Restored 2026-10-10 from REQ-PIPE-164's superseded decision, which the split had left behind."
  - "FOLDED 2026-10-10 (main session): the split review round's fixes are now criteria - one panel and one confirmation (delivery-cli-ux 6); Ctrl-C named and a summary listing changed supplies (delivery-cli-ux 7-8); the changelog shown on both routes (delivery-scoper 2); promoted supplies back worse (delivery-scoper 6); sorted slot order and the check in a column of its own (delivery-architect 10); the acknowledge key over every covered supply (delivery-architect 11); the terminal runs only its own owed ids and the pass honours its deadline (delivery-architect 12); one grouped nudge query (delivery-architect 13); the refusal no longer claims nothing changed, which was false where every supply had already been re-checked."
  - "ROUND 3 FOLDED, 2026-10-10 (main session): the summary names the checks whose results changed, so a verdict moved by another check is not credited to the corrected one (delivery-architect 8); the claim is REQ-PIPE-163's amendment of REQ-PIPE-140 (delivery-architect 5, delivery-scoper H); criterion 17's two WHENs split (delivery-scoper L); Ctrl-C defined on both routes (delivery-cli-ux M7); --check named (L1); hand-off wording, the panel's --hand-off hint and --help (L2); the retired and file-check refusals say why (L3); the word ban (M8); the fingerprint compared under its own scheme version (delivery-architect). Criterion numbers in decisions written before this fold refer to the list as it then stood. In particular: the hand-off criterion cited as 15 is now 18, and the queue nudge cited as 16 is now 19."
  - "SCOPER PASS, 2026-10-14 (delivery-scoper, unsigned triage): criteria 1 to 26 keep their numbers; 21's amendment now composes with REQ-PIPE-163's of the same criterion; 27 and 28 are added."
  - "CRITERION 16 (THE CLAIM) IS ALREADY MET - recorded, not new work (Keith, 2026-10-14): recheck.run's advisory lock, tests/test_recheck.py::TestTwoRunnersNeverRunOneOwedItem, stated in REQ-PIPE-140 by REQ-PIPE-163 criterion 31. Kept so the build links that test."
  - "CRITERION 24 (THE PASS'S DEADLINE) IS NOT MET, against the triage's reading (delivery-scoper, 2026-10-14, verified in code): processing_pass.run_pass checks its deadline only before taking a new ARRIVAL; its owed work is one call to recheck.run_all_owed, which takes no deadline and runs up to 1000 items. So a Lambda pass with hundreds of owed bulk re-checks would run past its budget. Small, but real work, and it stays a criterion."
  - "OPEN PAIRS LEFT OUT (delivery-scoper, 2026-10-14, following REQ-PIPE-194 criterion 4): an open pair offers only the settlement, and the settlement runs each resulting supply's checks under today's definitions, so leaving it out loses nothing; criterion 27 says so in the panel rather than silently."
  - "REJECTED RUNNING ONLY THE FIXED CHECK (delivery-scoper, 2026-10-14; say if otherwise): REQ-PIPE-188 to 191 (signed 2026-10-12) let a run ask its tools for just the checks it records, which would turn a minute per supply into seconds. But a supply's most recent run is its current one (REQ-PIPE-140 criterion 5), so a one-check re-run would leave every other check unjudged in the run that now speaks for the supply. Carrying the other results forward into it is a design of its own, not scoped."
  - "A REFUSED DATASET IS SKIPPED, NAMED AND KEPT IN THE NUDGE (Keith, 2026-10-14, 164/177-A, option A): criterion 28 leaves out a dataset the agreement backstop refuses, names it and its count in the consequences panel, and keeps it in the queue's nudge, as REQ-PIPE-164 criterion 23 refuses a single re-check and REQ-PIPE-163 criterion 35 a placement. REJECTED recording its re-checks and letting them wait, still owed (option B): decisions would sit on the record with nothing having run."
  - "POST-BUILD-REVIEW #179 IS LEFT TO THIS REQUIREMENT (Keith, 2026-10-14): owed work has no Lambda budget today - processing_pass.py line 520 calls recheck.run_all_owed(kinds=(REEVALUATE, RECHECK)) with no deadline, so the pass's deadline guards only the arrival loop. Criterion 24 carries the fix; no separate fix is made ahead of this requirement, and #179 is closed against it when this is built."
  - "TURNED-OFF DATASETS ARE COVERED LIKE ANY OTHER (delivery-scoper, 2026-10-14, against REQ-PIPE-179): a supply promoted in a period its dataset owed is still judged, and if it comes back worse it counts whether or not the dataset is turned off (REQ-PIPE-179 criterion 23). No criterion needed."
  - "REVIEWS FOLDED, 2026-10-14 (delivery-cli-ux H1 to H4, M1 to M3, M5, L2 to L4; delivery-architect): criteria 1 to 28 keep their numbers. Changed in place: 13 (offered above the collection choice - H1), 14 (progress in the terminal's run-line shape, elapsed and remaining, changed verdicts marked - M1), 18 (duration as information, hand-off offered first, the flag panel's close-the-terminal note - M1, L4), 19 (each collection's own count plus '(M more in other collections)' - H1), 20 (one paste-ready line per check - H2), 22 (published against each of the N supplies - L3), 23 (nothing runs until the pass does - L4), 28 (the backstop's finding and fix in the panel - H3). Added: 29 (one owed line per bulk re-check - H4), 30 (exit codes - M2), 31 (no terminal and no --yes - M3), 32 (--list - M5), 33 (rejected and superseded supplies counted, not covered - L2). The architect confirmed criterion 24 unmet and the command's home as `mothman supply recheck`."
  - "ASSET-WIDE, ABOVE THE COLLECTION CHOICE (Keith, 2026-10-14, review-cli-ux Q1, option A): a bulk re-check covers every dataset the check touches, so it is offered where calendar corrections are, before a collection is chosen, as 'Supplies checked before a check changed (N)'; each collection's queue shows its own count plus '(M more in other collections)'. REJECTED offering it inside each collection's queue (option B): a per-collection door to an asset-wide action, whose count never matches what it does."
  - "APPROXIMATE DURATION SHOWN, INFORMATION ONLY (Keith, 2026-10-14, review-cli-ux Q2, option A): 'about a minute per supply, so roughly N minutes' beside the count; the more-than-10 line stays a count, as Keith set it on 2026-10-10. REJECTED counts only (option B): a person cannot turn 400 supplies into seven hours at a glance."
  - "A FOREGROUND RUN THAT LEAVES ANY RE-CHECK OWED EXITS WITH REQ-PIPE-163's OWN CODE (Keith, 2026-10-14, review-cli-ux Q3, option A): the 'decision stands, checks still owed' code REQ-PIPE-163 criterion 28 defines, so a script tells a complete run from a partial one the same way for every decision that owes checks. REJECTED exiting 0 (option B): a script would read a partial run as complete."
  - "'HAND IT TO THE PROCESSING PASS' IS OFFERED FIRST (Keith, 2026-10-14, review-cli-ux Q4, option A): above ten supplies, the choice that does not tie up the terminal for an hour is the first one read. REJECTED 'Run it here now' first (option B)."
  - "`mothman supply queue` LISTS ONE LINE PER CHECK BENEATH THE COUNT (delivery-cli-ux H2, 2026-10-14; PUT TO KEITH AT SIGN-OFF - docs/drafts/unsigned-triage/summary.md, 'Ready for sign-off'): the aggregate line alone left the person needing a --check value the screen never showed. Each line is a check_id ready to paste, as `mothman supply superseded` does for what it lists. The terminal's queue keeps Keith's 2026-10-10 aggregate line and chooser (decision 'THE QUEUE NUDGE AGGREGATES' above), whose reason - a batch of fixes burying the queue - is about a menu rather than a command's printed list of the checks that changed. REJECTED keeping the one aggregate line with no check named."
- id: REQ-PIPE-178
  title: "A person can try a bulk re-check on a few supplies first, and nothing is recorded"
  date_written: '2026-10-10'
  story: "As the person who has just fixed a check, I want to see what the fix does to a few of the supplies it will re-check before I re-check them all, so that I can be confident the fix is right without putting anything on the record."
  moscow: should
  status: not_started
  source: "Split out of REQ-PIPE-164 on 2026-10-10 (Keith); the trial shape was Keith's, 2026-10-08 and 2026-10-10. SCOPER PASS by delivery-scoper, 2026-10-14 (unsigned triage). EFFECTIVELY HELD (delivery-architect, 2026-10-14): it depends on REQ-PIPE-177 and REQ-QAC-176, held behind plans/running-thoughts.md #89."
  "acceptance_criteria":
  - "THE SYSTEM SHALL offer a TRIAL re-check, raised by a person naming one check by its check_id and choosing either one or more supplies from a list, or a period range, from among only the supplies the real bulk re-check of that check would cover."
  - "IF the real bulk re-check of the named check would cover no supply, THEN THE SYSTEM SHALL refuse the trial, saying so."
  - "WHEN a trial runs, THE SYSTEM SHALL run each chosen supply's QA through the same implementation as the real re-check, under a re-check-trial run identity that reads the supply's own table where it now lies - shared staging for a waiting supply, its period's schema for a promoted one, resolved through REQ-PIPE-193 criterion 13's one resolver - and every table it reads beside it read-only, keeps its resolution record and dbt scratch in a schema of its own dropped when it ends, writes nothing to any staging, period or rejected schema, and whose results are discarded when it ends."
  - "WHEN a trial shows a supply's verdict, THE SYSTEM SHALL show it beside the supply's current verdict, and WHERE the supply is waiting, what the promotion gate would do with it, and WHERE it is promoted, that it would stay promoted, and SHALL NOT use the words rejected or refused for the gate's prediction."
  - "THE SYSTEM SHALL compute the gate's prediction with the promotion gate's own plan step, split from the step that applies it, and SHALL write nothing in doing so."
  - "THE SYSTEM SHALL leave no QA run, verdict, decision-log entry, owed re-check or change to any supply behind a trial."
  - "THE SYSTEM SHALL record a trial's run with no supply and the arrival scope, so that it can never be any supply's current run at any instant, including between the trial finishing and its results being discarded."
  - "THE SYSTEM SHALL state, before a trial runs, how many supplies it will run, by dataset and period, beside the number the real re-check would cover, and SHALL require the person to confirm. A trial SHALL NOT be capped on how many supplies it can run."
  - "WHEN a trial is given a period range, THE SYSTEM SHALL say in the terminal that the range applies to the trial only, and that the real bulk re-check covers everything the check touches with no range."
  - "WHEN a trial shows a verdict, THE SYSTEM SHALL say that the verdict comes from a run that has been discarded, and that the real run may differ if the data changes before it runs."
  - "THE SYSTEM SHALL offer the trial as `mothman supply recheck --check <check_id> --trial`, taking either a repeatable --supply or --dataset with the range flags REQ-PIPE-161 criterion 15 defines, and --yes, and no reason, --acknowledge or production confirmation."
  - "IF --trial is given with --reason, --acknowledge or --hand-off, THEN THE SYSTEM SHALL refuse it, naming the flag and saying that a trial records nothing."
  - "THE SYSTEM SHALL offer the trial on the terminal route only - the filing-decisions door and `mothman supply recheck --trial` - and SHALL NOT offer it on the GitHub route or under `mothman supply decide`."
  - "THE SYSTEM SHALL offer a trial inside the terminal's bulk re-check flow, before the real run's confirmation, as well as on its own."
  - "WHEN a trial is stopped part way, Ctrl-C included, THE SYSTEM SHALL end without a traceback, show the verdicts of the supplies that finished, and say that nothing was recorded."
  - "IF a trial is given a period range without --dataset, THEN THE SYSTEM SHALL refuse it, naming the datasets the real run covers."
  - "IF --trial runs without a terminal and without --yes, THEN THE SYSTEM SHALL refuse it with the flag hint naming --yes."
  - "WHEN a trial ends, THE SYSTEM SHALL print the real bulk re-check's command for that check with the number of supplies it would cover, on a line of its own, and in the terminal's bulk re-check flow SHALL return to the real run's confirmation."
  "non_functional_requirements":
  - "A trial reads supply rows, so it runs only on the terminal's own orchestrator-held connection and never on any build path."
  - "No new executor: the trial is the real re-check given a trial run identity, and the gate prediction is a pure function."
  - "COST: a trial costs what the real re-check costs per supply (about a minute of the four tools), and is uncapped by Keith's choice; the count-and-confirm is the only brake, so the confirmation states the count before anything runs (criterion 8)."
  - "LEAVES NOTHING BEHIND (CLAUDE.md, data/ accumulates): its schema and dbt scratch are dropped when it ends, as a run's own are (orchestrators' _discard_this_runs_schemas), Ctrl-C included."
  dependencies:
  - REQ-PIPE-177
  - REQ-QAC-176
  - REQ-PIPE-103
  - REQ-PIPE-161
  - REQ-PIPE-193
  decisions:
  - "SPLIT 2026-10-10 (Keith, on the delivery-scoper second pass): REQ-PIPE-164 had grown to 38 criteria across four concerns, so it became four requirements - REQ-PIPE-164 single re-check, REQ-QAC-176 the check-definition fingerprint, REQ-PIPE-177 bulk re-check, REQ-PIPE-178 trial - each reviewed and signed off on its own. Decisions travelled with the criteria they explain."
  - "TRIAL SHAPE (Keith, 2026-10-08): supplies chosen from a list, several at once, or a period range; the verdict and the gate's outcome are shown; nothing is recorded. NO CAP on how many supplies a trial runs - Keith's reason: a trial that refuses past some number pushes people into the real run to get round it. The trial states how many it will run and asks the person to confirm, as the real run does. NO REASON REQUIRED on a trial (Keith, 2026-10-08): it records nothing and requires nothing. AGREED (Keith, 2026-10-08): the trial and the real run share one implementation, differing only in whether results are kept - 'that's actually perfect'."
  - "THE TRIAL LIVES ON `mothman supply recheck --trial` (Keith, 2026-10-10, on the delivery-cli-ux review), beside the real run and matching `mothman bdm qa --trial`, which already means 'the real tools ran, nothing was recorded'. A trial takes no reason, no --acknowledge and no production confirmation - only the count-and-confirm. REJECTED `mothman supply decide`, as the 2026-10-08 draft had it: decide exists to record a decision and always takes a reason, so a command that records nothing does not belong in it. The single re-check stays on decide --operation re-check."
  - "THE TRIAL OFFERS ONLY WHAT THE REAL RUN WOULD COVER (Keith, 2026-10-10, on the delivery-cli-ux review): the supplies whose stored check fingerprint differs from the check's current definition, so a trial is a true preview of the real run; its confirmation shows the real run's total beside the trial count. REJECTED offering any filed supply the check touches: a trial of supplies the real run will never re-check previews nothing."
  - "A TRIAL IS A TRIAL RUN IDENTITY, NOT A ROLLED-BACK TRANSACTION (delivery-architect, 2026-10-08, citing supply_db.py's own measured note): the four tools open their own connections and cannot see uncommitted work, and dbt builds on a connection no rollback reaches. REJECTED the transaction idea the main session floated on 2026-10-08 (plans/running-thoughts.md #72)."
  - "A RE-CHECK TRIAL NEEDS ITS OWN RUN IDENTITY, NOT REQ-PIPE-103's (delivery-architect 14, 2026-10-10, a blocker): REQ-PIPE-103's trial identity stages its own files into its own schema, so it cannot see the real supply's staged table. A re-check trial reads shared staging read-only and writes nothing there; the discard mechanism is shared."
  - "FOLDED 2026-10-10 (main session): the split review round's fixes are now criteria - the trial identity (architect 14); supply NULL and arrival scope so it can never be current (architect 15); the gate split into plan and apply so the prediction is the gate's own (architect 16); offered inside the bulk flow, with the current verdict beside the trial's (delivery-cli-ux 12-13); refusals for --reason, --acknowledge and --hand-off (delivery-cli-ux 14); refused when the real run would cover nothing (delivery-scoper 19)."
  - "ROUND 3 FOLDED, 2026-10-10 (main session): the trial reads a promoted supply from its period's schema, not staging, and keeps its resolution record and dbt scratch in a schema of its own, because record_resolution writes into the run's staging schema (delivery-architect 7); --yes on the flag route and its non-terminal refusal (delivery-cli-ux M11); a range needs --dataset, since one check spans calendars with different period names (M12); Ctrl-C (M7); --check named (L1); the word ban on the prediction (M8). Criterion numbers in decisions written before this fold refer to the list as it then stood."
  - "SCOPER PASS, 2026-10-14 (delivery-scoper, unsigned triage): one change - criterion 3 resolves the supply's table through REQ-PIPE-193 criterion 13's one resolver, which (signed 2026-10-13) every path mapping a supply to a table must use. Open pairs and refused datasets need nothing here: a trial offers only what the real run would cover (criterion 1), so REQ-PIPE-177's criteria 27 and 28 carry over."
  - "THE TRIAL RUNS EVERY CHECK, NOT ONLY THE FIXED ONE (delivery-scoper, 2026-10-14): the trial shows a verdict and the gate's prediction, which need all the supply's checks, and Keith's 2026-10-08 'one implementation' rule means it runs what the real re-check runs. REJECTED a one-check trial under REQ-PIPE-188 to 191's scoped runs: it would preview a verdict the real run might not reach."
  - "NOT A FILING DECISION, SO REQ-GHUB-082 IS NOT AMENDED (delivery-scoper, 2026-10-14): a trial records nothing, so criterion 3 of REQ-GHUB-082 (no route lacks an operation the other has) does not reach it; criterion 13 here keeps it off GitHub on its own terms."
  - "REVIEWS FOLDED, 2026-10-14: added 18 (a trial ends by pointing at the real run - delivery-cli-ux M6); criterion 17 already carries M3's non-terminal refusal. EFFECTIVELY HELD behind #89 with REQ-PIPE-177 and REQ-QAC-176 (delivery-architect)."
