- id: REQ-QAC-231
  title: "A Department of Health > Emergency Department > ED Presentations collection is declared in configuration, with a contract and 10 to 15 checks across all four tools, under item 6's conventions"
  date_written: "2026-10-15"
  story: "As Keith adding test scenarios, I want a small one-table quarterly dataset under its own agency with a real contract and a few checks in each tool, so that a scenario that needs no Child Protection shape can be planted where a quarter costs about five seconds rather than about thirty."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99) and his answers recorded in plans/data-generation.md #12. Drafted by delivery-scoper 2026-10-15, re-drafted 2026-10-16 on item 6's final drafts; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL declare, in contract/data-asset.yaml's hierarchy, an agency department-of-health named 'Department of Health', holding one collection emergency-department named 'Emergency Department' with short ed and run_prefix ed_run_, holding one dataset ed-presentations named 'ED Presentations', table ed_presentations, with an exact arrival pattern for one file, ed_presentations.csv."
    - "THE SYSTEM SHALL place the dataset on the existing quarterly calendar in contract/calendar.yaml, with its own participation_defaults due at 09:00 with 8 hours' grace, taking effect from the first quarter its generated history holds (REQ-GEN-232), and SHALL reword the quarterly calendar's description so that it no longer names Child Protection as its only user."
    - "THE SYSTEM SHALL declare the dataset in contract/emergency-department-contract.yaml with eight columns - presentation_id, arrival_datetime, triage_category, age_group, sex, postcode, departure_status, length_of_stay_minutes - each with its type and whether it is required."
    - "THE SYSTEM SHALL define between 10 and 15 active checks, at least two in each tool, in the files item 6 finds by convention - contract/emergency-department-soda-checks.yml, contract/emergency-department-evidently-checks.yml, the contract, and dbt files under dbt_project/models/emergency-department/ and dbt_project/tests/emergency-department/ - every one carrying check_id, category, introduced_date and changelog."
    - "THE SYSTEM SHALL give every check an introduced_date on or before the claim-window opening of the dataset's first generated period, so that no recorded result is for a supply received before its check existed (plans/running-thoughts.md #98)."
    - "THE SYSTEM SHALL write each check's description, failure_indicates and technical_note to docs/check-authoring-rules.md as it stands, with no change to those rules."
    - "THE SYSTEM SHALL say, in the contract's own description, that it describes a synthetic dataset standing in for an emergency department collection and holds no real patient data."
    - "THE SYSTEM SHALL add an agency description for Department of Health to the presentation configuration REQ-DASH-244 moved AGENCY_BLURB into."
    - "WHEN `mothman check` runs, THE SYSTEM SHALL pass every configuration gate with the new agency, collection and dataset present - the registry gate (REQ-PIPE-240), the check-source and dbt-folder gates (REQ-QAC-241), the patterns, zero-active-checks and check-lifecycle gates and the agreement freeze - with no exemption added for them."
  non_functional_requirements:
    - "CONFIGURATION ONLY: hierarchy, calendar, contract, check and dbt files; nothing here reads data or the database. The adapter and provider are REQ-PIPE-233's and REQ-GEN-232's."
    - "PRIVACY, FOR A REAL DEPLOYMENT: age group rather than date of birth is deliberate; postcode, sex, age group and an arrival instant together are a quasi-identifier in real emergency department data, so the contract's description says so. Checks on those columns record row-level failing values, as others do (Keith, 2026-10-16)."
    - "NO NEW DEPENDENCY: the four tools already installed."
    - "AGREEMENT FREEZE: adding a new dataset's calendar membership on a synthetic asset needs no declared correction - REQ-PIPE-111 criterion 9 as amended."
  dependencies:
    - REQ-PIPE-240
    - REQ-QAC-241
    - REQ-PIPE-111
  decisions:
    - "WHY THIS DATASET EXISTS (Keith, 2026-10-15): to SHRINK Child Protection. Since REQ-GEN-207 grew it ten years the bootstrap went 8m08s to 31m52s (Child Protection 1792s against Birth Registrations 550s), and Child Protection's cost is its run count, not its table count."
    - "GENERALISE FIRST (Keith, 2026-10-15, Q1, confirmed after the architect's pass): plans/publishing-and-history.md item 6 lands before this dataset, which is its first user. REJECTED a third copy of the per-collection modules, and the architect's registry-plus-copied-runners middle path."
    - "ITEM 6'S CONVENTIONS (docs/drafts/item6): short ed and run_prefix ed_run_ declared, not derived (item 6 call 4); Evidently checks in contract YAML (REQ-QAC-241); dbt files in the collection's own folders (REQ-QAC-241, round-4 call 28); a blurb in presentation configuration (REQ-DASH-244). Kept by Keith 2026-10-16: ed and ed_run_."
    - "ONE TABLE, ABOUT EIGHT COLUMNS, ONE CSV PER SUPPLY; ITS OWN AGENCY; ALL FOUR TOOLS, 10 TO 15 CHECKS; QUARTERLY ON THE SHARED CALENDAR (Keith, 2026-10-15). REJECTED joining an existing agency or collection."
    - "ONE SHARED QUARTERLY CALENDAR (Keith, Q2): a correction to it applies to both Child Protection and Emergency Department; the empty-elsewhere rule that follows is REQ-GEN-237's."
    - "SUPERSEDES AN OLDER REJECTION: REQ-GEN-044 decision [B4] rejected 'a third synthetic daily dataset purely to host the other configurations'. Keith's #99 call is the later decision."
    - "DEPENDS ON REQ-PIPE-111 CRITERION 9 AS AMENDED (Keith, Q7, applied to the register 2026-10-15): the synthetic exemption covers adding a new dataset's calendar membership, so the architect's finding that membership is itself a frozen item no longer bites. Not restated here."
    - "KEPT BY KEITH 2026-10-16 - IDS AND NAMES: department-of-health, emergency-department, ed-presentations, table ed_presentations, file ed_presentations.csv. plans/running-thoughts.md #100 (mix up dataset names) is separate and unscoped."
    - "KEPT BY KEITH 2026-10-16 - DUE 09:00 WITH 8 HOURS' GRACE, AS CHILD PROTECTION: the moved scenarios' quoted instants hold unchanged only if the due time does."
    - "SIGNED OFF BY KEITH 2026-10-16 - THE CHECK SET (13): datacontract-cli - presentation_id not null, presentation_id unique, triage_category in 1-5, sex in its valid values, row count in band; Soda - postcode missing percentage, departure_status in its valid values, length of stay non-negative and below a plausible ceiling; dbt - arrival_datetime not null, age_group accepted values, length of stay accepted range; Evidently - drift in triage_category and in age_group."
  open_questions:
    - "ANSWERED (Keith, 2026-10-16): the check set (13) signed off as listed, and the ids, names and due time kept as proposed."
    - "ANSWERED (Keith, 2026-10-16): Emergency Department checks on postcode, sex, age group and arrival time RECORD FAILING ROWS, as other checks do (architect finding A8) - his call, knowing those four together re-identify a patient in real data."

- id: REQ-GEN-232
  title: "An Emergency Department generator provider writes one quarterly CSV per supply with Child Protection's severity mix, for as many quarters as its scenarios need"
  date_written: "2026-10-15"
  story: "As Keith planting scenarios, I want an Emergency Department provider under the shared generator driver that writes ordinary quarterly supplies with the same kind of mix Child Protection has, so that the scenarios that move off Child Protection have somewhere cheap to live."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99) and his answers in plans/data-generation.md #12. Re-drafted 2026-10-16 on item 6's final drafts; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL generate Emergency Department's history through REQ-GEN-246's shared driver, from a provider at generator/collections/emergency_department.py, each period one delivery carrying one file, ed_presentations.csv, with the contract's eight columns."
    - "THE SYSTEM SHALL declare the provider's seed range disjoint from Birth Registrations' and Child Protection's, so that REQ-GEN-246's overlap gate passes and adding it changes no byte either of them writes."
    - "THE SYSTEM SHALL draw Emergency Department's ordinary quarters with Child Protection's severity mix - about a quarter amber, two reds with resupply chains, the oldest supply clean - from Emergency Department's own seed."
    - "THE SYSTEM SHALL size the history by a dry run of REQ-GEN-044's collision refusal over every scenario planned for Emergency Department (REQ-GEN-235, REQ-GEN-236, REQ-GEN-237 and the participation gap of REQ-GEN-251), with every period each claims, ending at Child Protection's newest quarter and adding the fewest whole years that leave the dry run with no refusal, and SHALL record the count and the output in this requirement's evidence."
    - "THE SYSTEM SHALL draw postcodes from generator/names_au.py's existing WA postcode pool."
    - "WHEN an Emergency Department injection suppresses a period's routine supply, places an arrival days before or after a period's date at a stated time, or carries scripted decisions (REQ-GEN-135), THE SYSTEM SHALL generate it through the shared driver with no Emergency Department-specific code outside the provider."
    - "IF an Emergency Department scenario cannot be placed, THEN generation SHALL refuse before writing anything, naming the scenario, and SHALL NOT shift, drop or relax it."
    - "WHEN `mothman ed generate-synthetic-data` runs twice with the same seed and configuration, THE SYSTEM SHALL write byte-identical deliveries and receipts both times."
  non_functional_requirements:
    - "COST: about five seconds of bootstrap per supply is the reason this dataset exists - rows per supply kept small (proposed a few thousand), the measured per-supply cost in evidence."
    - "BYTE-IDENTICAL NEIGHBOURS: Birth Registrations' and Child Protection's generated files unchanged by this requirement alone - REQ-TEST-239's S4 compare."
    - "SYNTHETIC ONLY: no real record, list or extract; postcodes from the existing WA pool, NOT a licensed Australia Post list."
    - "LINE BUDGET: the provider's lines reported by REQ-TEST-249's report, outside the 150-line QA adapter budget."
  dependencies:
    - REQ-QAC-231
    - REQ-GEN-246
    - REQ-TEST-245
    - REQ-GEN-044
  decisions:
    - "HISTORY AS LONG AS ITS SCENARIOS NEED, BY DRY RUN, THE REQ-GEN-207 RULE (Keith, 2026-10-15)."
    - "CHILD PROTECTION'S SEVERITY MIX, FROM ITS OWN SEED (Keith, Q8). REJECTED all-clean ordinary quarters: a scenario moved here should sit among the same kind of history it sat among on Child Protection."
    - "A PROVIDER, NOT A COPY (item 6, REQ-GEN-246): the old criteria routing scenario_injection.generated_periods() to this generator and adding a `mothman ed` command are DROPPED as covered by REQ-GEN-246 and REQ-TEST-245."
    - "WA POSTCODES FROM generator/names_au.py (delivery-architect, 2026-10-15). REJECTED a licensed Australia Post list."
    - "SUPPRESSION IS GENERIC (main session, 2026-10-15): the routine supply for a period a scenario needs empty is not generated."
    - "PROPOSED, NOT KEITH'S - ENDS WHERE CHILD PROTECTION ENDS: the moved scenarios keep their quarters only if this history covers 2023-Q3 to 2026-Q3 on the same anchor."
  open_questions: []

- id: REQ-PIPE-233
  title: "Emergency Department runs end to end as a third collection through its QA adapter - what item 6 does not already make true"
  date_written: "2026-10-15"
  story: "As whoever maintains the pipeline, I want Emergency Department QA'd, recorded, bootstrapped and replayed exactly as the other two collections are, through one short adapter, so that a scenario moved onto it is judged by the same tools and rules it was on Child Protection."
  moscow: must
  status: not_started
  source: "Keith, plans/running-thoughts.md #99 and plans/data-generation.md #12. Re-drafted 2026-10-16: most of the 2026-10-15 draft is now item 6's (REQ-PIPE-240 to REQ-TEST-249). A PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL provide Emergency Department's QA adapter at qa_tools/collections/emergency_department.py, carrying no legacy flag and no temporary pointer, with its logic reported against REQ-TEST-249's 150-line soft budget."
    - "WHEN an Emergency Department supply arrives, THE SYSTEM SHALL file, stage, check with all four tools, record and gate it through the shared modules, with no Emergency Department name in any file outside its configuration, check files, adapter and provider."
    - "WHEN `mothman pipeline bootstrap` runs over an empty database, THE SYSTEM SHALL generate and replay all three collections, each in its own process, and log each collection's time in CLAUDE.md's running log."
    - "WHEN a replay of every collection finishes, THE SYSTEM SHALL confirm the due corrections across all three, as REQ-PIPE-170 criterion 31 does once amended by REQ-PIPE-240."
    - "THE SYSTEM SHALL run CI's deployment half of .github/workflows/test.yml against a bootstrap holding all three collections, and record its duration."
  non_functional_requirements:
    - "A BUILD MAY READ RECORDED QA RESULTS, NEVER ACTUAL DATA, AND NEVER ANYTHING ELSE (Keith, 2026-09-27): carried by REQ-DASH-244's shared builder; nothing here widens the publisher's grant."
    - "BOOTSTRAP TIME: Emergency Department must not be the critical path; the whole is REQ-PIPE-250's hard 12 minutes."
    - "CI COST: the deployment half's new duration recorded."
  dependencies:
    - REQ-QAC-231
    - REQ-GEN-232
    - REQ-TEST-249
    - REQ-PIPE-240
  decisions:
    - "MOSTLY COLLAPSED INTO ITEM 6 (Keith's generalise-first answer). DROPPED as covered: `mothman ed qa` and --collection accepting ed (REQ-TEST-245); refusing an unknown collection rather than falling back (REQ-PIPE-240 criteria 3 and 6, and the allowlist hand-offs); the fixed two-entry maps in processing_pass and checkpoints (REQ-PIPE-240); dashboard data built only from recorded results (REQ-DASH-244); the third-copy-or-generalise question (answered). What remains is ED's own adapter and the end-to-end facts only a real third collection makes true."
    - "CRITERION 2 IS ITEM 6'S PROMISE CHECKED ON A REAL COLLECTION: REQ-TEST-249 proves it on a fake one."
    - "CRITERION 4 RIDES ON REQ-PIPE-170 CRITERION 31'S AMENDMENT, which is Keith's to approve in REQ-PIPE-240; without it the code says every collection and the built criterion's text lags."
  open_questions: []

