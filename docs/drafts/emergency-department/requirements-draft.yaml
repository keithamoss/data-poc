- id: REQ-GEN-238
  title: "Child Protection's grown history drops its oldest years down to what a fresh dry run of its remaining scenarios needs, amending REQ-GEN-207"
  date_written: "2026-10-15"
  story: "As Keith, I want Child Protection's grown history cut back to the quarters its remaining scenarios need once the others have moved, so that the bootstrap gets back most of the 24 minutes the ten-year growth cost."
  moscow: must
  status: not_started
  source: "Keith, plans/running-thoughts.md #99 and plans/data-generation.md #12 Q4. Amendment wording on REQ-GEN-207 delegated by Keith to the main session. Re-drafted 2026-10-16; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL re-run REQ-GEN-207 criterion 2's dry run over only the Child Protection scenarios still planned once REQ-GEN-235, REQ-GEN-236 and REQ-GEN-237 are applied - TS-42 and TS-80 with their lead-ins (REQ-GEN-203), TS-63 and its correction (REQ-GEN-218), TS-50, TS-55 and TS-81 (REQ-GEN-206) - and SHALL keep the fewest whole years that leave it with no refusal, recording the count and the output in this requirement's evidence."
    - "THE SYSTEM SHALL remove the grown quarters older than that count, keeping the original fifteen and the remaining grown quarters' run plan, seeds, slot ids and delivery names as REQ-GEN-207 drew them, so that every kept quarter is byte-identical by REQ-TEST-239's S4."
    - "THE SYSTEM SHALL move the effective_from of Child Protection's earliest participation_defaults version and each dataset's earliest participation version forward to the first kept quarter, each with a changelog line saying why, and SHALL leave the amber_setting and replacement_setting 2013 versions, and the quarterly calendar's 2013 version wherever Emergency Department's history still uses its dates, in place."
    - "THE SYSTEM SHALL make tests/before_growth.py remove the grown versions by their dates after this change, and SHALL make it assert that each block it filters lost at least one version."
    - "THE SYSTEM SHALL leave every Birth Registrations delivery and receipt byte-identical."
    - "THE SYSTEM SHALL compare every surviving Child Protection supply's recorded status before and after and report any difference to Keith as a finding."
    - "THE SYSTEM SHALL amend, in the change that adds this requirement, REQ-GEN-207 criteria 1 and 2 to the wording recorded in this requirement's decisions."
  non_functional_requirements:
    - "BYTE-IDENTICAL: kept quarters and Birth Registrations, by REQ-TEST-239's S4."
    - "DETERMINISM: removing old quarters moves no index counted from the original fifteen."
    - "AGREEMENT FREEZE: removing or later-dating a past version on a synthetic asset needs no declared correction - REQ-PIPE-111 criterion 9 as amended."
    - "BOOTSTRAP TIME: measured from empty before and after and logged per collection; the target is REQ-PIPE-250's."
  dependencies:
    - REQ-GEN-207
    - REQ-GEN-203
    - REQ-GEN-218
    - REQ-GEN-235
    - REQ-GEN-236
    - REQ-GEN-237
    - REQ-PIPE-111
  decisions:
    - "DROP THE OLDEST GROWN YEARS TO WHAT A FRESH DRY RUN NEEDS; THE ORIGINAL FIFTEEN STAY BYTE-IDENTICAL (Keith, Q4). REJECTED re-packing the remaining scenarios into the quarters REQ-GEN-235 frees, and REJECTED going straight back to fifteen."
    - "WHAT STAYS ON CHILD PROTECTION (Keith, 2026-10-15): a scenario needing a supply of several files, a cross-table check, or several datasets in one collection - and TS-63 (Keith, Q6)."
    - "AMBER AND REPLACEMENT 2013 VERSIONS STAY (delivery-architect, 2026-10-15): they have no correction route and no synthetic exemption, and a version in force earlier than needed governs nothing."
    - "tests/before_growth.py MUST ASSERT IT REMOVED SOMETHING (delivery-architect): it keys on the literal 2013-01-01, so once the participation versions move it would filter nothing and every test using it would silently change meaning."
    - "THE FREEZE IS ANSWERED BY THE REGISTER (Keith, Q7): REQ-PIPE-111 criterion 9 was amended 2026-10-15 to exempt removing or later-dating a past version on a synthetic asset; depended on, not restated."
    - "AMENDMENT, FINAL TEXT - REQ-GEN-207 criterion 2, appended: 'AMENDED <date applied> by REQ-GEN-238: TS-3a, TS-3b and TS-57 to TS-61 moved to Emergency Department (Keith, 2026-10-15), and the growth was re-sized by the same dry run over the scenarios that stayed, to <N> years, dropping the oldest.'"
    - "AMENDMENT, FINAL TEXT - REQ-GEN-207 criterion 1: as signed, with 'add Child Protection quarters before 2023-Q1' followed by ' - <N> years since REQ-GEN-238 re-sized it, from ten -', and 'AMENDED <date applied> by REQ-GEN-238.'"
  open_questions: []

- id: REQ-PIPE-250
  title: "A bootstrap from empty, all three collections, finishes within 12 minutes on this sandbox, its per-quarter cost profiled first"
  date_written: "2026-10-16"
  story: "As Keith, I want a fresh bootstrap of the whole synthetic history to take at most twelve minutes, so that regenerating it - in a fresh session, in CI, after any history change - is something done without planning around it."
  moscow: must
  status: not_started
  source: "Keith, plans/data-generation.md #12 Q5 (2026-10-15): 'a hard 12 minutes', confirmed after the architect's 15-17 minute estimate, with profiling in scope. Drafted by delivery-scoper 2026-10-16; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL profile a from-empty bootstrap by collection, stage and quarter, and SHALL record in this requirement's evidence where the time goes, including why Child Protection's per-quarter cost rose from about 21s to about 33s with the growth."
    - "WHEN `mothman pipeline bootstrap` runs from empty on this sandbox with all three collections, THE SYSTEM SHALL finish within 12 minutes of wall clock, in each of three consecutive runs recorded in evidence."
    - "WHEN a bootstrap finishes, THE SYSTEM SHALL print its wall clock against the 12-minute budget, and SHALL say plainly when it is over."
    - "WHEN a speed-up changes pipeline code, THE SYSTEM SHALL show by REQ-TEST-239's compare that it changed nothing a bootstrap records."
    - "THE SYSTEM SHALL record the CI deployment half's cache-miss bootstrap time alongside, without a budget of its own."
  non_functional_requirements:
    - "BEHAVIOUR-PRESERVING: a speed-up is a refactor in item 6's sense - byte-identical or not shipped as a speed-up."
    - "NOT A CI GATE: timing varies by runner; the budget is an acceptance measurement on this sandbox, as CLAUDE.md's runtime log is."
  dependencies:
    - REQ-GEN-238
    - REQ-PIPE-233
    - REQ-TEST-239
  decisions:
    - "A HARD 12 MINUTES FROM EMPTY (Keith, Q5), BELOW the architect's 15-17 minute estimate for about thirty Child Protection quarters - which is why profiling is in scope, not optional."
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - 'HARD' IS READ AS AN ACCEPTANCE MEASUREMENT ON THIS SANDBOX (three runs) AND A PRINTED BUDGET LINE, NOT A FAILING GATE (delivery-scoper, proposed): a wall-clock gate in CI fails on a slow runner rather than a slow pipeline. REJECTED a CI timing gate."
    - "A REQUIREMENT OF ITS OWN: the shrink (REQ-GEN-238) reduces how much work there is; this makes the remaining work fast enough. Either may turn out to be most of the answer."
  open_questions: []
