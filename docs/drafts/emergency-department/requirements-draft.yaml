    - "THE PER-QUARTER COST ROSE WITH THE GROWTH (delivery-scoper, 2026-10-15, from CLAUDE.md's log): 317s for 15 quarters (about 21s each) before, 1792s for 55 (about 33s each) after. Profiling a Child Protection replay may return more than this shrink does; noted, not scoped here."
