- id: REQ-QAC-231
  title: "A Department of Health > Emergency Department > ED Presentations dataset exists in configuration, with a contract and 10 to 15 checks across all four QA tools"
  date_written: "2026-10-15"
  story: "As Keith adding test scenarios, I want a small one-table quarterly dataset under its own agency with a real contract and a few checks in each tool, so that a scenario that needs no Child Protection shape can be planted where a quarter costs about five seconds rather than about thirty."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99). Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL declare, in contract/data-asset.yaml's hierarchy, an agency department-of-health named 'Department of Health', holding one collection emergency-department named 'Emergency Department', holding one dataset ed-presentations named 'ED Presentations', table ed_presentations, with an exact arrival pattern for one file, ed_presentations.csv."
    - "THE SYSTEM SHALL place the collection on the existing quarterly calendar in contract/calendar.yaml, with its own participation_defaults due at 09:00 with 8 hours' grace - the values Child Protection owes under - taking effect from the first quarter its generated history holds (REQ-GEN-232), and SHALL change the quarterly calendar's description so that it no longer names Child Protection as its only user."
    - "THE SYSTEM SHALL declare the dataset in an ODCS contract of its own, contract/emergency-department-contract.yaml, with eight columns - presentation_id, arrival_datetime, triage_category, age_group, sex, postcode, departure_status, length_of_stay_minutes - each with its type and whether it is required."
    - "THE SYSTEM SHALL define between 10 and 15 active checks on the dataset, at least two in each of dbt-core, Soda Core, datacontract-cli and Evidently, every one carrying the check-lifecycle metadata (check_id, introduced_date, changelog) the existing contracts carry."
    - "THE SYSTEM SHALL give every check introduced_date on or before the claim-window opening of the dataset's first generated period, so that no recorded result is for a supply received before its check existed (plans/running-thoughts.md #98)."
    - "THE SYSTEM SHALL write each check's description, failure_indicates and technical_note to docs/check-authoring-rules.md as it stands, with no change to those rules."
    - "THE SYSTEM SHALL mark the contract, in its own description, as describing a synthetic dataset standing in for an emergency department collection, holding no real patient data."
    - "WHEN `mothman check` runs, THE SYSTEM SHALL pass every configuration gate with the new agency, collection and dataset present - the patterns gate, the zero-active-checks gate, the check-lifecycle gate and the agreement freeze among them - with no exemption added for them."
  non_functional_requirements:
    - "CONFIGURATION ONLY: contract, check and hierarchy files; nothing here reads data or the database."
    - "PRIVACY, FOR A REAL DEPLOYMENT: age group rather than date of birth is deliberate; postcode, sex, age group and an arrival instant together are a quasi-identifier in real emergency department data, so the contract's description says so, and no check or dashboard field derived from this dataset may show a row-level value of those columns (the existing failing-values display included) without that being decided for real data first."
    - "NO NEW DEPENDENCY: the four tools already installed; no new Python or npm package."
    - "SCALE: the third collection must be declarable by configuration alone at this layer - the agency, collection and dataset come from the hierarchy, never from a list of two in code."
  dependencies: []
  decisions:
    - "WHY THIS DATASET EXISTS (Keith, 2026-10-15): to SHRINK Child Protection. Since REQ-GEN-207 grew it ten years the bootstrap went 8m08s to 31m52s (Child Protection 1792s against Birth Registrations 550s), and Child Protection's cost is its run count (six datasets over 55 quarters plus resupplies), not its table count."
    - "ONE TABLE, ABOUT EIGHT COLUMNS, ONE CSV PER SUPPLY (Keith, 2026-10-15, choosing the main session's proposal): presentation id, arrival date/time, triage category 1-5, age group, sex, postcode, departure status, length of stay."
    - "ITS OWN AGENCY (Keith, 2026-10-15): Department of Health > Emergency Department > one dataset, so the executive view shows a third agency. REJECTED joining an existing agency or collection."
    - "ALL FOUR TOOLS, ABOUT 10 TO 15 CHECKS IN TOTAL (Keith, 2026-10-15): so a scenario that moves still exercises the tools it did before."
    - "QUARTERLY, ON THE EXISTING QUARTERLY CALENDAR (Keith, 2026-10-15): so quarterly scenarios move across unchanged."
    - "SUPERSEDES AN OLDER REJECTION: REQ-GEN-044 decision [B4] rejected 'a third synthetic daily dataset purely to host the other configurations', sequencing new datasets after the supply model (plans/running-thoughts.md #23). Keith's #99 call is the later decision; #23's own words say adding datasets is what triggers the file-architecture question, which REQ-PIPE-233 carries."
    - "PROPOSED, NOT KEITH'S - IDS AND NAMES: department-of-health, emergency-department, ed-presentations, table ed_presentations, file ed_presentations.csv, named 'ED Presentations'. plans/running-thoughts.md #100 (mix up dataset names) is separate and unscoped."
    - "PROPOSED, NOT KEITH'S - DUE 09:00 WITH 8 HOURS' GRACE, AS CHILD PROTECTION: the moved scenarios' configurations and quoted instants (TS-9's 'due 09:00 on the 1st', TS-67's 21 October 10:00 re-file) hold unchanged only if the due time does."
    - "PROPOSED, NOT KEITH'S - INTRODUCED BEFORE THE FIRST SUPPLY: #98 found checks introduced 2023-01-15 run against forty grown quarters with nothing saying so. Repeating that on a new dataset would demonstrate nothing #98 does not already show."
    - "PROPOSED, NOT KEITH'S - THE CHECK SET (13): datacontract-cli - presentation_id not null, presentation_id unique, triage_category in 1-5, sex in its valid values, row count in band; Soda - postcode missing percentage, departure_status in its valid values, length of stay non-negative and below a plausible ceiling; dbt - arrival_datetime not null, age_group accepted values, length of stay accepted range; Evidently - drift in triage_category and in age_group. Final wording and bands at build, to the authoring rules."
  open_questions:
    - "FOR KEITH AT SIGN-OFF: the proposed check set and names above."
- id: REQ-GEN-232
  title: "A seeded Emergency Department generator writes one quarterly CSV per supply, for as many quarters as its planned scenarios need"
  date_written: "2026-10-15"
  story: "As Keith planting scenarios, I want a generator for the Emergency Department dataset that writes ordinary quarterly supplies and can suppress, move and time a supply as Child Protection's can, so that the scenarios that move off Child Protection have somewhere cheap to live."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99). Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL generate, for each Emergency Department period, one delivery carrying one file, ed_presentations.csv, with the contract's eight columns, its receipts written by the single delivery.write_receipts()."
    - "THE SYSTEM SHALL draw every seed for the dataset from a range of its own, disjoint from every seed and offset the Birth Registrations and Child Protection generators use, so that adding it changes no byte either of them writes."
    - "THE SYSTEM SHALL size the history by a dry run of REQ-GEN-044's collision refusal over every scenario planned for Emergency Department (REQ-GEN-235, REQ-GEN-236 and the scenarios REQ-GEN-237 re-points), with every period each claims, ending at the same newest quarter as Child Protection's, adding the fewest whole years that leave the dry run with no refusal, and SHALL record the count and the dry run's output in this requirement's evidence."
    - "THE SYSTEM SHALL let an Emergency Department injection suppress a period's routine supply, place an arrival a stated number of days before or after a period's date at a stated time, and carry scripted decisions (REQ-GEN-135), with the same Injection fields Birth Registrations' and Child Protection's injections use."
    - "THE SYSTEM SHALL route scenario_injection.generated_periods() for ed-presentations to this generator, so that a scenario placed on it is never refused as having no generator nor given another collection's periods."
    - "THE SYSTEM SHALL keep the history's first supply clean, as every generated history's first must be."
    - "IF an Emergency Department scenario cannot be placed, THEN generation SHALL refuse before writing anything, naming the scenario, and SHALL NOT shift, drop or relax it."
    - "WHEN `mothman ed generate-synthetic-data` runs twice with the same seed and configuration, THE SYSTEM SHALL write byte-identical deliveries and receipts both times."
  non_functional_requirements:
    - "COST: about five seconds of bootstrap per supply is the reason this dataset exists - keep rows per supply small (proposed a few thousand), and report the measured per-supply cost in evidence."
    - "BYTE-IDENTICAL NEIGHBOURS: Birth Registrations' and Child Protection's generated files are unchanged by this requirement alone, proved by a byte comparison before and after."
    - "SYNTHETIC ONLY: no real record, list or extract is used as a source; postcodes may be drawn from a list of real WA postcode values (a public reference list), never from patient data."
    - "ONLY THROUGH mothman: a new `mothman ed generate-synthetic-data` command in the same change, never a bare script."
  dependencies:
    - REQ-QAC-231
    - REQ-GEN-044
  decisions:
    - "HISTORY: AS MANY QUARTERS AS ITS SCENARIOS NEED, BY DRY RUN, THE SAME RULE AS REQ-GEN-207 (Keith, 2026-10-15)."
    - "SUPPRESSION IS GENERIC, NOT A CHILD PROTECTION NEED (main session, 2026-10-15, resolving the 'with Child Protection suppression' note in Keith's answer on TS-3a/3b): it means the routine supply for the period a scenario needs empty is not generated (Injection.suppress), which works identically on a one-table dataset. Criterion 4."
    - "PROPOSED, NOT KEITH'S - ENDS WHERE CHILD PROTECTION ENDS: the moved built scenarios (REQ-GEN-235) keep their quarters only if this history covers 2023-Q3 to 2026-Q3 on the same anchor; the dry run then adds older quarters for the rest."
    - "PROPOSED, NOT KEITH'S - THE ORDINARY MIX: see open question 1."
  open_questions:
    - "FOR KEITH (question set 2, Q8): do the ordinary Emergency Department quarters draw the same severity mix as Child Protection's (about a quarter amber, two reds with resupply chains, the oldest clean), or are they all clean apart from the scenarios? Changes what the generator builds and how many supplies a bootstrap runs."
- id: REQ-PIPE-233
  title: "Emergency Department runs through the whole pipeline as a third collection - QA by all four tools, recorded results, bootstrap, corrections replay and CI"
  date_written: "2026-10-15"
  story: "As whoever maintains the pipeline, I want Emergency Department QA'd, recorded and bootstrapped exactly as the other two collections are, so that a scenario moved onto it is judged by the same tools and the same rules it was on Child Protection."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99). Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "WHEN an Emergency Department supply arrives, THE SYSTEM SHALL file, stage, check with dbt-core, Soda Core, datacontract-cli and Evidently, record the results in the qa schema and gate it for promotion, through the same filing, recording and promotion code the other two collections use."
    - "THE SYSTEM SHALL offer `mothman ed qa`, and accept ed wherever a command takes --collection (pipeline run, pipeline bootstrap, debug run-*, checkpoints), in the same change."
    - "WHEN `mothman pipeline bootstrap` runs over an empty database, THE SYSTEM SHALL generate and replay all three collections, Emergency Department beside the other two."
    - "WHEN a replay of every collection finishes, THE SYSTEM SHALL confirm the due corrections as REQ-PIPE-170 criterion 31 does for both today, and a replay of fewer than every collection SHALL leave them pending."
    - "THE SYSTEM SHALL build Emergency Department's dashboard data from the recorded QA results only, never from supply rows."
    - "IF any place in code that maps collections - a fixed two-entry map, a choice list, a per-collection branch - meets a collection it does not know, THEN THE SYSTEM SHALL refuse naming the collection, and SHALL NOT fall back to another collection's behaviour."
    - "THE SYSTEM SHALL run the CI deployment half of .github/workflows/test.yml against a bootstrap holding all three collections."
  non_functional_requirements:
    - "A BUILD MAY READ RECORDED QA RESULTS, NEVER ACTUAL DATA, AND NEVER ANYTHING ELSE (Keith, 2026-09-27): unchanged for a third collection, and the publisher's least-privilege grant covers it without widening."
    - "BOOTSTRAP TIME: Emergency Department must not be the critical path; its replay is measured and logged in CLAUDE.md's running log with the others. The whole-bootstrap budget is question set 2, Q5."
    - "SCALE: the target is about 30 datasets on one asset, so every two-collection map this touches is either made to read the hierarchy or listed as known debt in plans/publishing-and-history.md #6 - which one depends on question set 1, Q1."
    - "CI COST: the deployment half already bootstraps from empty; record its new duration once measured."
  dependencies:
    - REQ-QAC-231
    - REQ-GEN-232
    - REQ-PIPE-170
  decisions:
    - "ADDING DATASETS IS WHAT TRIGGERS THE FILE-ARCHITECTURE QUESTION (Keith, 2026-09-20, plans/running-thoughts.md #23, scoped with #29): 'you cannot tell which abstraction is right from two datasets'. This dataset is the first such addition. How much of plans/publishing-and-history.md #6 it pays down is question set 1, Q1."
    - "FOUND BY delivery-scoper (2026-10-15): at least 27 Python modules name child-protection directly, qa_tools/common/checkpoints.py and processing_pass.py hold fixed two-entry COLLECTIONS maps, `--collection` is a click.Choice of bdm/cp/all, and REQ-PIPE-170 criterion 31 (built) says 'both collections'. Criterion 6 exists because a third collection silently given Birth Registrations' periods has already happened once (post-build-review #169)."
    - "REQ-PIPE-170 CRITERION 31 NEEDS KEITH'S WORDING APPROVAL (not among the four requirements whose wording he delegated, 2026-10-15): 'both collections' to 'every collection', and 'rebuild both collections' results' to 'rebuild every collection's results'. It changes built behaviour, so it is listed here rather than amended silently."
  open_questions:
    - "FOR KEITH (question set 1, Q1): third copy of the per-collection modules, or generalise now? Decides how large this requirement is."
    - "CHECK AT BUILD: whether correction_replay's 'both collections finished' condition is a count or a named pair; criterion 4 needs it to mean every collection the asset declares."
- id: REQ-DASH-234
  title: "The dashboard shows a third, real agency - Department of Health - on the executive view and down to its dataset page"
  date_written: "2026-10-15"
  story: "As a data team leader glancing at the register, I want the Department of Health to appear as a real agency beside the other two, so that the page shows what is actually checked, and the moved scenarios' links land on a real page."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99: 'so the executive view shows a third agency'). Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "WHEN the dashboard is built from recorded results holding Emergency Department, THE SYSTEM SHALL show Department of Health as an agency card on the executive view, its collection and its dataset page, with the same status, as-at and supply-history behaviour the other agencies have."
    - "THE SYSTEM SHALL count the third agency in every executive-view counter and legend, so that each still sums to the number of agencies shown."
    - "THE SYSTEM SHALL reword the page's footer, which names the two real collections, so that it names every real collection or none."
    - "WHEN a scenario link names an Emergency Department dataset, THE SYSTEM SHALL open that dataset's page on the link's date, as for any other dataset."
    - "IF the built page holds no Emergency Department data, THEN THE SYSTEM SHALL render as it does today with no console error."
    - "THE SYSTEM SHALL NOT assert, in any test, a fixed number of agencies, collections or real datasets - each is read from the hierarchy."
  non_functional_requirements:
    - "RENDER BUDGET: the built page's size and tests/test_dashboard_e2e.py's duration are measured before and after and reported; neither has a hard gate (CLAUDE.md's informal runtime log), but a growth beyond about 10% is reported to Keith as a finding."
    - "NO MOCK DATA: every figure for the new agency traces to a recorded result; nothing illustrative returns."
    - "POLISH BAR: the third card must line up with the other two (REQ-GEN-044's own card-alignment finding shows the page has been wrong here before)."
  dependencies:
    - REQ-PIPE-233
  decisions:
    - "A THIRD AGENCY ON THE EXECUTIVE VIEW (Keith, 2026-10-15)."
    - "FOUND BY delivery-scoper (2026-10-15): the template holds two named data consts (REAL_BIRTH_REG_DATA, REAL_CP_DATA) read in at least seven places, and embed_dashboard_data.py embeds exactly those two - whether a third const or a list replaces them follows question set 1, Q1."
    - "ALREADY SAFE, VERIFIED: TestExecutiveLegend's counter test reads the total from the page rather than a fixed number; the gap test needs 'at least two' real agency cards."
- id: REQ-GEN-235
  title: "The built early-arrival scenarios TS-9, TS-65, TS-66 and TS-67 move to Emergency Department, keeping their TS numbers and quarters"
  date_written: "2026-10-15"
  story: "As Keith, I want the early-arrival scenarios, which need nothing Child Protection has, re-planted on Emergency Department in the same quarters with the same instants, so that they stop costing Child Protection runs while every quoted date stays true."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99, naming TS-9, TS-65, TS-66 and TS-67 as moving). Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL re-key the injections TS-9, TS-65, TS-66 and TS-67 to ed-presentations, each keeping its scenario id, its quarter (2024-Q2, 2025-Q3, 2025-Q4 and 2023-Q4) and its arrival instant relative to the quarter's date."
    - "THE SYSTEM SHALL replace TS-67's six Child Protection scripted decisions in contract/scripted_decisions.yaml - five re-files and the cp-case-workers rejection - with one re-file of the Emergency Department supply to 2023-Q4 at the same instant and with the same reason."
    - "THE SYSTEM SHALL generate the four Child Protection quarters these leave, and 2023-Q3 which TS-67 filed into, as ordinary deliveries, and SHALL leave every other Child Protection and every Birth Registrations delivery and receipt byte-identical, proved by a byte comparison before and after."
    - "THE SYSTEM SHALL rewrite the four register entries in plans/supply-model.md to name the Emergency Department dataset and one file in place of 'the whole collection', each Expect re-quoted from the first bootstrapped build, and SHALL report to Keith any quoted text that changed beyond the dataset's name."
    - "THE SYSTEM SHALL re-capture tests/fixtures/arrival_semantics_golden.json and SHALL report every verdict that changed on a Child Protection arrival, rather than accept it."
    - "WHEN the synthetic history is bootstrapped, THE SYSTEM SHALL open each of the four scenarios' links on the Emergency Department dataset's page."
  non_functional_requirements:
    - "BYTE-IDENTICAL WHAT DOES NOT MOVE: criterion 3's proof is the same shape as REQ-GEN-207 criterion 4's."
    - "CHANGELOG: one CHANGELOG.yaml entry for the dataset and the moves together, in the push that ships them."
  dependencies:
    - REQ-GEN-232
    - REQ-PIPE-233
    - REQ-DASH-234
  decisions:
    - "EVERYTHING THAT DOES NOT NEED CHILD PROTECTION MOVES AND KEEPS ITS TS NUMBER (Keith, 2026-10-15): a scenario stays only if it needs a supply of several files, a cross-table check, or several datasets in one collection. TS-9, TS-65, TS-66 and TS-67 named as moving."
    - "WHAT THE MOVE LOSES, ACCEPTED BY KEITH'S NAMING: TS-67 on Child Protection also showed cp-case-workers rejected in a quarter it is not delivered in, and each early scenario a whole six-table delivery. Neither was the scenario's point; TS-52 and TS-79 keep the partial-participation shapes."
    - "PROPOSED, NOT KEITH'S - SAME QUARTERS: keeping each quarter keeps TS-9's '22 April, nine days early' and TS-67's 12 and 21 October quotes true, and needs REQ-GEN-232's history to reach 2023-Q3."
- id: REQ-GEN-236
  title: "TS-3a and TS-3b are planted on Emergency Department - a quarterly arrival one day outside the claim window, with the prior slot filled and unfilled"
  date_written: "2026-10-15"
  story: "As Keith, I want the quarterly half of the claim-window family planted on Emergency Department, so that the window is seen gating at its own boundary on a real page without spending Child Protection quarters."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99), superseding his answer of 2026-10-15 ~12:15 that put TS-3a and TS-3b in REQ-GEN-207's grown quarters. Delivers REQ-GEN-044 criterion 1 for these two. Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL generate, as TS-3a, an Emergency Department supply received one day before the next quarter's claim window opens, while the current quarter's slot is filled."
    - "THE SYSTEM SHALL generate, as TS-3b, the same arrival in another quarter whose routine supply is suppressed, so that the current quarter's slot was never filled."
    - "THE SYSTEM SHALL generate only those arrival shapes, and SHALL NOT generate the resupply, the late filing or any verdict the scenarios expect (REQ-GEN-044 criterion 6)."
    - "THE SYSTEM SHALL rewrite the TS-3a and TS-3b register entries to the quarterly calendar's real values - the 1st of February, May, August and November, due 09:00, a 14-day claim window - in place of 'Feb 2 / May 1 / Aug 3 / Nov 2', each with an Expect quoted from the first bootstrapped build and a Breaks as line, and SHALL keep the family's note that the filled branch is a contained imperfection, not a defect."
    - "IF either cannot be placed, THEN generation SHALL refuse naming it, and SHALL NOT shift it."
  non_functional_requirements:
    - "DETERMINISM: placed by anchor and seed, as every injection is."
  dependencies:
    - REQ-GEN-232
    - REQ-PIPE-233
    - REQ-GEN-044
  decisions:
    - "TS-3a AND TS-3b MOVE (Keith, 2026-10-15, #99)."
    - "SUPPRESSION IS GENERIC (main session, 2026-10-15): 'with Child Protection suppression' meant only that the routine supply is not generated for the period TS-3b needs empty."
    - "THE REGISTER'S CONFIG LINE IS NOT THE CALENDAR: it says Feb 2 / May 1 / Aug 3 / Nov 2 and 'opens 20 July'; the calendar is the 1st of each month, window opening 18 July 09:00. Criterion 4, the same correction REQ-GEN-195 made for TS-9."
- id: REQ-GEN-237
  title: "The signed, unbuilt correction and turn-off scenarios TS-57 to TS-60 and TS-63 are re-pointed at Emergency Department"
  date_written: "2026-10-15"
  story: "As Keith, I want the calendar-correction and turn-off scenarios that need no Child Protection shape planted on Emergency Department, so that the correction's quarters and TS-63's gap stop costing Child Protection quarters."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99, naming TS-57 to TS-62 and TS-63). Amendment wording on REQ-GEN-044, 203, 205 and 218 delegated by Keith to the main session the same evening. Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL apply, in the change that adds this requirement to requirements.yaml, the amendments to REQ-GEN-044, REQ-GEN-205 and REQ-GEN-218 recorded in this requirement's decisions, each marked 'AMENDED <date applied> by REQ-GEN-237'."
    - "THE SYSTEM SHALL count, in REQ-GEN-205's collision rule, a period whose slot a change to a shared calendar alters as claimed in every collection on that calendar, and IF the correction's impact preview (REQ-PIPE-169) shows a move or re-judgement of any supply no scenario names, THEN generation SHALL refuse naming the change reference and the supply."
    - "THE SYSTEM SHALL leave REQ-GEN-203 and the scenarios it plants on Child Protection, because each needs a cross-table reader."
  non_functional_requirements:
    - "TEXT ONLY: this requirement changes no code by itself beyond criterion 2; the building is REQ-GEN-205's and REQ-GEN-218's."
  dependencies:
    - REQ-GEN-232
    - REQ-GEN-205
    - REQ-GEN-218
    - REQ-GEN-044
  decisions:
    - "TS-57 TO TS-60 AND TS-63 MOVE (Keith, 2026-10-15, #99). TS-62 IS ON BIRTH REGISTRATIONS ALREADY (Keith, 2026-10-14, F11) and stays there: the rule governs Child Protection scenarios. PROVISIONAL reading of #99's 'TS-57 to TS-62'."
    - "TS-61 STAYS ON CHILD PROTECTION, RIDING THE SAME CORRECTION - PROVISIONAL on question set 1, Q3 (delivery-scoper's recommendation): its blocker is a later quarter inheriting the supply, which needs partial participation (cp-case-workers) - clause (c) of Keith's rule - while #99 names it as moving. Because the quarterly calendar is shared, one correction's date edits can reach an Emergency Department quarter for TS-57 to TS-60 and a Child Protection quarter for TS-61, so REQ-GEN-205 criterion 20's 'one applied summary shows all five shapes' still holds."
    - "A CHANGE TO THE SHARED CALENDAR CLAIMS ITS PERIOD IN EVERY COLLECTION - PROVISIONAL on question set 1, Q2 (delivery-scoper's recommendation): found 2026-10-15, REQ-GEN-205 criterion 22 makes each change an edit to a quarter's date in contract/calendar.yaml, which every collection on the quarterly calendar owes against. Criterion 2."
    - "TS-63 MOVES TO THE ONE EMERGENCY DEPARTMENT DATASET - PROVISIONAL on question set 2, Q6: Keith named it; the scoper's original reason for cp-carers (REQ-GEN-218, 'PROPOSED, NOT KEITH'S') was that a cross-table check reads it, so REQ-PIPE-179 criterion 22's inheritance is seen doing work. On a one-dataset collection the whole collection goes quiet for two quarters."
    - "AMENDMENT, FINAL TEXT - REQ-GEN-044, appended decision (no criterion names Child Protection for TS-3a or TS-3b): 'TS-3a AND TS-3b MOVE TO EMERGENCY DEPARTMENT (Keith, 2026-10-15, plans/running-thoughts.md #99), superseding his answer of the same day that put them in REQ-GEN-207's grown quarters with Child Protection suppression; REQ-GEN-236 plants them. Suppression there means only that the routine supply is not generated. AMENDED <date applied> by REQ-GEN-237.'"
    - "AMENDMENT, FINAL TEXT - REQ-GEN-205 criterion 6: 'WHEN a replay of every collection confirms the due corrections (REQ-PIPE-170 criterion 31) - on every route that does so: a bootstrap, a resumed bootstrap or `mothman pipeline run` over every collection - THE SYSTEM SHALL confirm a correction that has a scripted confirmation through correction_apply.confirm with exactly the keeps and reason the script names, SHALL leave a correction whose scripted confirmation says pending unconfirmed, and SHALL confirm a correction with none as it does today. AMENDED <date applied> by REQ-GEN-237.'"
    - "AMENDMENT, FINAL TEXT - REQ-GEN-205 criterion 8: as signed, with 'before it rebuilds both collections' results' replaced by 'before it rebuilds every collection's results', and the AMENDED line."
    - "AMENDMENT, FINAL TEXT - REQ-GEN-205 criterion 10: as signed, with this inserted after its first clause: 'a period whose slot a change to a calendar alters is claimed in every collection on that calendar;' and the AMENDED line. (SUBSTANTIVE - changes what is built; conditional on Q2.)"
    - "AMENDMENT, FINAL TEXT - REQ-GEN-205 criterion 11: 'THE SYSTEM SHALL place TS-57 to TS-60 in Emergency Department quarters (REQ-GEN-232) and TS-61 in a Child Protection quarter REQ-GEN-207 adds, so that no existing scenario moves, and TS-62 on Birth Registrations, its correction dated a few days before the end of the history and its later arrival the next daily supply. AMENDED <date applied> by REQ-GEN-237.' (SUBSTANTIVE - conditional on Q3.)"
