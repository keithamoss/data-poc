- id: REQ-GEN-238
  title: "Child Protection's grown history shrinks to what its remaining scenarios need, by the same dry run, amending REQ-GEN-207"
  date_written: "2026-10-15"
  story: "As Keith, I want Child Protection's grown history cut back to the quarters its remaining scenarios need once the others have moved, so that the bootstrap gets back most of the 24 minutes the ten-year growth cost."
  moscow: must
  status: not_started
  source: "Keith, scoping conversation 2026-10-15 evening (plans/running-thoughts.md #99: 'Child Protection then shrinks to whatever its remaining scenarios need ... an amendment to the built, signed REQ-GEN-207'). Drafted by delivery-scoper 2026-10-15; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL re-run REQ-GEN-207 criterion 2's dry run over only the Child Protection scenarios still planned once REQ-GEN-235, REQ-GEN-236 and REQ-GEN-237 are applied - TS-42 and TS-80 with their lead-ins (REQ-GEN-203), TS-50, TS-55 and TS-81 as REQ-GEN-206 drafts them, TS-61 if it stays (Q3) - and SHALL keep the fewest whole years that leave it with no refusal, recording the count and the output in this requirement's evidence."
    - "THE SYSTEM SHALL remove the grown quarters older than that count from the generated history, keeping the remaining grown quarters' run plan, seeds, slot ids and delivery names as REQ-GEN-207 drew them, so that every kept quarter is byte-identical."
    - "THE SYSTEM SHALL move the effective_from of Child Protection's earliest participation_defaults version, each dataset's earliest participation version, and the amber and replacement settings' earliest versions forward to the first kept quarter, each with a changelog line saying why, and SHALL leave the quarterly calendar's 2013 version wherever Emergency Department's history still uses its dates."
    - "THE SYSTEM SHALL leave every Birth Registrations delivery and receipt, and every kept Child Protection one, byte-identical, proved by a byte comparison before and after."
    - "THE SYSTEM SHALL compare every surviving Child Protection supply's recorded status before and after and report any difference to Keith as a finding, since a drift or volume check reaches back to the most recent earlier promoted period."
    - "THE SYSTEM SHALL measure a bootstrap from empty before and after and log both in CLAUDE.md's running log, per collection."
    - "THE SYSTEM SHALL amend, in the change that adds this requirement, REQ-GEN-207 criteria 1 and 2 to the wording recorded in this requirement's decisions."
  non_functional_requirements:
    - "BOOTSTRAP BUDGET - PROPOSED, question set 2, Q5: at most 15 minutes from empty on this sandbox. Estimate, not a measurement: the remaining Child Protection demand is about 15 to 18 grown quarters (four to five years), so about 30 to 33 Child Protection quarters at the 21s to 33s a quarter measured on 2026-10-15 - about 10 to 18 minutes, Child Protection still the critical path. The move alone does NOT get back to 8 minutes."
    - "BYTE-IDENTICAL: kept quarters and Birth Registrations, criteria 2 and 4, the same proof shape as REQ-GEN-207 criterion 4."
    - "DETERMINISM: seeded; removing old quarters moves no index counted from the original fifteen."
    - "AGREEMENT FREEZE: moving a frozen version's effective_from is a change agreement_freeze refuses without a declared correction, even on a synthetic asset (verified 2026-10-15: criterion 9 exempts only an ADDED version). Question set 2, Q7."
  dependencies:
    - REQ-GEN-207
    - REQ-GEN-203
    - REQ-GEN-235
    - REQ-GEN-236
    - REQ-GEN-237
  decisions:
    - "SHRINK TO WHAT THE REMAINING SCENARIOS NEED (Keith, 2026-10-15): not straight back to 15 quarters, not kept at ten years."
    - "WHAT STAYS ON CHILD PROTECTION (Keith, 2026-10-15): a scenario needing a supply of several files (TS-12, TS-38, TS-56, TS-75a, TS-76, TS-77a - those carrying file_shape), a cross-table check, or several datasets in one collection."
    - "AMENDMENT, FINAL TEXT (wording delegated to the main session by Keith, 2026-10-15; <N> is filled from criterion 1's evidence) - REQ-GEN-207 criterion 2, appended: 'AMENDED <date applied> by REQ-GEN-238: TS-3a, TS-3b, TS-57 to TS-60 and TS-63 moved to Emergency Department (Keith, 2026-10-15), and the growth was re-sized by the same dry run over the scenarios that stayed, to <N> years.'"
