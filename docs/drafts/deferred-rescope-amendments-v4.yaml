REQ-PIPE-342:
  acceptance_criteria_replace:
    5: "THE SYSTEM SHALL discover the asset folders from assets/ itself, and the extraction folders from extractions/ itself (REQ-PIPE-446), and SHALL NOT hold a list of assets or extractions, or name either, anywhere in code. AMENDED 2026-11-21 by REQ-PIPE-446."
  note: "Criterion 1 is unchanged - it lays out an ENDURING asset's folder; an extraction's folder is REQ-PIPE-440's."
REQ-PIPE-363:
  acceptance_criteria_replace:
    1: "THE SYSTEM SHALL take the asset a command acts for from MOTHMAN_ASSET, naming an asset folder under assets/ or an extraction folder under extractions/ by its bare name, beside MOTHMAN_ENVIRONMENT and MOTHMAN_SUPPLY_DSN (SETTLED by Keith 2026-11-01, on REQ-PIPE-091's precedent). AMENDED 2026-11-21 by REQ-PIPE-446."
    4: "IF a command that is not one of the tool commands of criterion 5 is given WHILE MOTHMAN_ASSET is unset or names no asset or extraction folder, THEN THE SYSTEM SHALL answer not 'No such command' but that MOTHMAN_ASSET is not set, or names no folder, naming the variable, listing the folder names found under assets/, saying how many extractions there are and how to list them, and saying there is deliberately no default, in the form environments.current() uses for MOTHMAN_ENVIRONMENT - reading nothing but those folder names. AMENDED 2026-11-21 by REQ-PIPE-446."
    6: "IF a command that reads asset configuration or opens a connection runs WHILE MOTHMAN_ASSET is unset or names no asset or extraction folder, THEN THE SYSTEM SHALL refuse before reading any asset configuration or opening any connection, naming the variable, every asset folder found and how many extractions there are, and SHALL NOT fall back to a default, a last-used value or the only asset present. AMENDED 2026-11-21 by REQ-PIPE-446."
  wording_for_keith: "Criteria 4 and 6 list the enduring assets by name but extractions only as a count ('and 37 extractions - mothman extraction list'), so the refusal stays readable with 200 of them. REQ-PIPE-363's refusal wording was SETTLED by Keith on 2026-11-01, so the exact new words need his yes."
  decisions_add:
    - "EXTRACTIONS ARE SELECTED BY THEIR BARE ID (REQ-PIPE-446, 2026-11-21): MOTHMAN_ASSET=<id> for both roots, a name in both refused; the refusal lists assets by name and extractions by count. REJECTED a prefix, since data/, reports/ and supply_<name> are one namespace either way."
