  - id: REQ-PIPE-383
    title: "Scripted decisions and scripted corrections are played by the bootstrap through hooks the replay offers, and the real pipeline neither builds a player nor imports scripted_decisions or correction_replay"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want the real pipeline to offer a place to act between arrivals rather than to play scripted decisions itself, so that a synthetic history's scripted people go with the bootstrap and the pipeline only ever processes what arrived."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31 scan: 'orchestrate plays scripted decisions'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14 unchanged (lines re-checked at a35066ff). A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL let a caller of a collection's replay and of a stream's replay (orchestrate.run_pipeline and run_stream today) pass a hook run before each arrival and after the last, the shape scripted_decisions.Player and orchestrate.StreamPlayer have today, and SHALL run none WHERE none is passed."
      - "THE SYSTEM SHALL NOT build a scripted-decision player inside the real pipeline: orchestrate._begin's default of scripted_decisions.Player(coll.id) (line 606, imported at line 586) SHALL go, and the bootstrap SHALL build each collection's player and each stream's combined player and pass it in, StreamPlayer (line 640) moving with it."
      - "THE SYSTEM SHALL hand an arrival's scripted correction to arrival_lifecycle through the same hook rather than have it import correction_replay (arrival_lifecycle.py line 177)."
      - "WHEN the bootstrap replays a synthetic asset, THE SYSTEM SHALL play every scripted decision and correction at the instant and in the order it plays them today, through the same decision path a person uses (REQ-GEN-135), refused unless the asset declares itself synthetic."
      - "WHEN `mothman pipeline run` or the processing pass runs, on any asset, THE SYSTEM SHALL play no scripted decision and no scripted correction; only the bootstrap plays them (Q5, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL have tests, seen failing first, of a replay given no hook playing nothing, and of a stream's hook called before an arrival of another collection received after a decision's instant (REQ-PIPE-262 criterion 4), and SHALL show through REQ-TEST-239's compare that every decision-log entry is unchanged."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: the decision log, filings and promotions of each asset's bootstrap are unchanged, proven by REQ-TEST-239's compare."
      - "AUDITABILITY: scripted decisions keep their synthetic actor and recorded instants (REQ-GEN-135), so a replayed history still says who decided and when."
      - "SECURITY: the real pipeline keeps its refusal of the synthetic actor outside a replay (filing_decisions.py, people.py), because a guard is not machinery and must stay where a real deployment runs it."
      - "PERFORMANCE: a hook call per arrival is what the player call costs today."
    dependencies:
      - "REQ-GEN-381"
      - "REQ-GEN-135"
      - "REQ-PIPE-262"
      - "REQ-TEST-239"
    decisions:
      - "HOOKS IN THE PIPELINE, SCRIPTS IN THE BOOTSTRAP (delivery-scoper): the replay already takes a player argument; only its default and the correction lookup reach the scripts, so the seam exists and needs closing rather than building."
      - "THE SYNTHETIC-ACTOR REFUSAL STAYS IN THE PIPELINE (delivery-scoper): REJECTED moving it with the player, because a real deployment would then have no guard against the synthetic actor."
      - "ONLY THE BOOTSTRAP PLAYS SCRIPTED DECISIONS (Q5, SETTLED by Keith 2026-11-02): REJECTED `mothman pipeline run` playing them on a synthetic asset as it does today. A behaviour change for that command, not for a bootstrap, so REQ-TEST-239's compare (which captures a bootstrap) is unaffected; any test asserting that `pipeline run` plays them changes with this requirement."
    open_questions: []
    signed_off: null

  - id: REQ-TEST-384
    title: "An imports gate in mothman check and the validate-config workflow fails any import, or any load by path, across a forbidden edge between asset_model/, the real pipeline, the generator, scenarios/, the bootstrap and cli/, with a shrink-only allowlist whose every entry names the requirement that removes it"
    date_written: "2026-11-02"
    story: "As whoever maintains the pipeline, I want a gate that fails a forbidden import in either direction, including code run by file path, on every change and every push, so that the separation is checked rather than remembered."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31: 'a strict separation'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03 with the package renamed asset_model/ and the path-loading gap; v5 2026-11-14 with Keith's Q11 of 2026-11-14 (where the gate runs on a push). A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL offer an `imports` gate in `mothman check`, needing no asset and no database, that reads every Python file of the repository outside tests/ and scripts/ by its syntax tree - module-level and function-level imports, imports under `if TYPE_CHECKING:`, and importlib.import_module calls with a literal name - and assigns each file to one side: asset_model/; the real pipeline (qa_tools/, pipeline/, dashboard/ and each asset's collections/); the generator (generator/, synthetic_data_generator/ and each asset's synthetic/collections/); scenarios/; bootstrap/; or cli/."
      - "IF asset_model/ imports any other side, or the real pipeline imports the generator, scenarios/, the bootstrap or cli/, or scenarios/ imports anything but asset_model/, or the generator imports the bootstrap, cli/ or the real pipeline (Q1, SETTLED by Keith 2026-11-02), or the bootstrap imports cli/, THEN the gate SHALL fail, naming the file, the line, both sides and the imported module."
      - "THE SYSTEM SHALL treat each call of asset_model's path loader as an import of the side its kind names - 'adapter' the real pipeline, 'provider' the generator - so that a load by path across a forbidden edge fails as an import would; IF a call passes its kind as anything but a literal, THEN the gate SHALL fail, naming the call."
      - "THE SYSTEM SHALL read the gate's exceptions from one committed allowlist whose every entry names a file, the module it imports and the requirement that removes it, and SHALL fail WHERE an entry names no requirement, or names an import that no longer exists."
      - "IF a change adds an allowlist entry absent at the base commit, THEN the gate SHALL fail, so that the list only shrinks."
      - "WHEN this gate lands, THE SYSTEM SHALL hold in the allowlist exactly the gate's own findings on that commit, so that it lands green, and each of REQ-PIPE-380, REQ-GEN-381, REQ-PIPE-382, REQ-PIPE-383, REQ-PIPE-385, REQ-GEN-386, REQ-QAC-389 and REQ-PIPE-390 SHALL remove the entries it names."
      - "THE SYSTEM SHALL run the gate as its own step in .github/workflows/validate-config.yml beside the other configuration gates, in both legs of its per-asset matrix (post-build-review #321), as that workflow already runs every repository-wide gate (Q11 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL add to validate-config.yml's push `paths:` every directory the gate reads that the filter does not already name - at a35066ff generator/**, synthetic_data_generator/**, pipeline/**, dashboard/** and cli/** - and asset_model/**, scenarios/** and bootstrap/** as each lands, and the gate's allowlist file, so that a push changing only one of them still runs the gate."
      - "THE SYSTEM SHALL mark every test of the gate `critical` (REQ-TEST-375), each needing no deployment, no browser and no database, so that push CI's critical set runs them (Q11 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL have tests, seen failing first, of each forbidden edge failing, of each allowed edge passing, of a function-level import caught, of a provider loaded by path from the real pipeline failing, of a non-literal loader kind failing, of a stale allowlist entry failing, of an added entry failing, and of the workflow's paths filter naming every directory the gate assigns a side."
    non_functional_requirements:
      - "PERFORMANCE: the gate reads syntax trees and imports nothing, and runs in under 5 seconds over the repository; run in both matrix legs it adds seconds, not minutes, to the workflow."
      - "MAINTAINABILITY: each allowlist entry names its requirement, so the list is a to-do list that can only get shorter; the paths-filter test (criterion 10) fails when a new top-level package is given a side and not added to the filter."
      - "OBSERVABILITY: a failure names the file and the line, so it can be fixed without reading the gate."
      - "COST: no database and no bootstrap; its critical tests run in the critical job's existing five-minute budget (REQ-TEST-375), and validate-config.yml bills seconds per leg."
      - "SCALABILITY: a thirtieth collection's adapter and provider are sorted by folder, so the gate needs no change for a new collection or a new asset."
      - "COMPATIBILITY: the gate reads committed files only, so it runs on a government network with no package index or GitHub access."
    dependencies:
      - "REQ-PIPE-342"
      - "REQ-PIPE-369"
      - "REQ-GEN-370"
      - "REQ-TEST-375"
    decisions:
      - "THE GATE COMES FIRST (delivery-scoper): landing it with today's findings allowlisted makes it the measure each later requirement shrinks, rather than a test written last against a tree already moved."
      - "BOTH DIRECTIONS IN ONE GATE (the brief, 2026-11-02): the pipeline never imports the generator today, but nothing holds that true; the generator imports the pipeline in 97 statements at a35066ff."
      - "SYNTAX TREE, NOT IMPORTING (delivery-scoper): importing every module to watch sys.modules would need pandas, a database and an asset; a syntax tree needs none. REJECTED a runtime import hook as the gate (REQ-PIPE-385's import-blocking test is the runtime check)."
      - "tests/ ARE EXEMPT (delivery-scoper): a test of the bootstrap imports the pipeline and the bootstrap together by design."
      - "scripts/ IS EXEMPT (delivery-scoper, v4): scripts/dev/ holds throwaway dev-only tools (record_cast.py, tui_screenshot.py) that ship with nothing; assigning them a side would only allowlist them."
      - "PROVIDERS ARE ON THE GENERATOR SIDE (delivery-scoper, v3 and v4): so a provider importing generator/ or synthetic_data_generator/ is inside one side and allowed, which resolves REQ-GEN-386 criterion 1's wording."
      - "LOADS BY PATH ARE EDGES TOO (delivery-scoper, v4; the split overview, corrected 2026-11-02, named the gap): assets.load runs adapter and provider files with no import statement, so a syntax-tree gate alone cannot see it. Today the two calls are literal and on the right sides (qa_tools/collections line 273, generator/collections line 45); criterion 3 keeps it that way. REJECTED leaving it to REQ-PIPE-385's runtime test alone, which only proves the pipeline runs without the generator, not that nothing tries."
      - "dashboard/, pipeline/ AND qa_tools/ ARE ONE SIDE (the split overview, 2026-11-02): qa_tools/ imports pipeline/ and dashboard/ in three places today, and nothing in #134 asks to separate them."
      - "ON A PUSH, IN validate-config.yml WITH ITS TESTS critical (Q11 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): REJECTED (b) the local gate only, which a push could skip, and (c) the critical tests only, which prove the gate works but not that today's tree passes it."
      - "BOTH MATRIX LEGS, NOT ONE (delivery-scoper, v5, Keith may change it): the gate needs no asset, so one leg would do; but validate-config.yml's own comment says every repository-wide gate (requirements, changelog, feedback, the plans index) runs in both legs because each costs seconds, and a leg-conditional step would be the one exception a reader has to notice. The second run costs about five seconds."
      - "THE PATHS FILTER IS PART OF THE ANSWER (delivery-scoper, v5, found in the workflow): validate-config.yml fires only on assets/**, dbt_shared/**, qa_tools/**, CHANGELOG.yaml, requirements.yaml, plans/** and itself, so a push touching only generator/ or cli/ would never run the gate Q11 put there. Criterion 8 closes it, and criterion 10's test keeps it closed."
      - "NO FAULT-RATE GATE (Q11 of 2026-11-14 with Q5, SETTLED by Keith 2026-11-14): v4's proposed gate holding dirty.py's literal rates to their bands is not built, because REQ-GEN-392 now derives the rates."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-385
    title: "An asset with no synthetic/ folder runs, publishes and passes every gate with neither the generator, scenarios/ nor the bootstrap importable, and the commands that need them are absent or refused by name"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want to leave the generator and the bootstrap out entirely, so that what runs on real supplies is only the pipeline and its configuration."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31); extends REQ-GEN-370 criterion 8 from configuration to code. Scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03 (scenarios/ added to what may be absent); v5 2026-11-14 unchanged. A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "WHERE the generator, synthetic_data_generator, scenarios/ and the bootstrap package cannot be imported and the selected asset has no synthetic/ folder, THE SYSTEM SHALL stage, check, gate, promote, re-check and record that asset's real supplies, build and publish its dashboard, and pass every `mothman check` gate."
      - "THE SYSTEM SHALL keep one `mothman` entry point, and SHALL list a synthetic command in `mothman --help` and the terminal's menus only WHERE the components it needs can be imported AND the selected asset has a synthetic/ folder (Q3, SETTLED by Keith 2026-11-02)."
      - "IF a synthetic command is invoked by name where criterion 2 leaves it out, THEN THE SYSTEM SHALL exit non-zero naming the missing component or the missing synthetic/ folder rather than raise an ImportError or report an unknown command - REQ-GEN-370 criterion 8's refusal by name, kept."
      - "IF the asset has no scenario map (SCENARIOS-<asset>.md, REQ-PIPE-352 criterion 3), THEN the dashboard build SHALL embed an empty SCENARIO_MAP rather than fail, reading the map through a reader outside the generator, scenarios/ and the bootstrap package."
      - "WHILE the embedded scenario map is empty - as it is for an asset with no synthetic/ folder - THE SYSTEM SHALL hide the dashboard's scenario features entirely, showing no scenario control, label, link or count anywhere on the page (SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL have a test, seen failing first, that runs a fixture asset with no synthetic/ folder through `mothman pipeline run`, `mothman dashboard rebuild` and `mothman check` in a subprocess where importing the generator, synthetic_data_generator, scenarios/ or the bootstrap package raises, and shows each succeeding (Q8 of 2026-11-02, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL have a real-browser test, seen failing first, that builds the dashboard for a fixture asset with no synthetic/ folder and finds no scenario control or label in the page's text, accessible names or menus, and that the same page built with a non-empty map shows them."
    non_functional_requirements:
      - "PRIVACY AT REAL SCALE: a real deployment can show that no code able to invent a record's time or play a scripted person is present."
      - "PORTABILITY: works from a plain checkout through `uv run`, with no extra install step to leave a component out."
      - "RELIABILITY: a missing component is a named refusal, never a traceback."
      - "COST: criterion 6's test uses a fixture asset and the test database, not a bootstrap, so it costs seconds."
    dependencies:
      - "REQ-GEN-370"
      - "REQ-GEN-381"
      - "REQ-PIPE-382"
      - "REQ-PIPE-383"
      - "REQ-GEN-386"
      - "REQ-TEST-384"
    decisions:
      - "ONE mothman, SYNTHETIC COMMANDS PRESENT ONLY WHERE THEY CAN RUN (Q3, SETTLED by Keith 2026-11-02): REJECTED a second entry point, and REJECTED listing them always and refusing at run time."
      - "AN IMPORT-BLOCKING TEST ONLY (Q8 of 2026-11-02, SETTLED by Keith 2026-11-02): REJECTED a recorded run in a copy of the tree with the packages deleted, as v1's criterion 6 had it."
      - "THE GATE IS NOT ENOUGH ON ITS OWN (delivery-scoper): an import gate catches what is written, but not a command that would crash at run time without a package. Criterion 6 runs it."
      - "THE SCENARIO MAP'S READER IS SHARED (delivery-scoper): the build reads the committed map today (REQ-DASH-046) and may open nothing under data/, so the reader stays with the pipeline, the writer goes with the generator and the vocabulary with scenarios/ (REQ-GEN-386)."
      - "SCENARIO FEATURES HIDDEN ENTIRELY ON AN EMPTY MAP (SETTLED by Keith 2026-11-02): a real deployment's dashboard says nothing about scenarios. REJECTED leaving them as they render today with an empty map."
      - "scenarios/ IS PART OF WHAT A REAL DEPLOYMENT LEAVES OUT (SPLIT D1, SETTLED by Keith 2026-11-03: 'the generator, bootstrap and scenarios stay out of a real deployment'), so v4 adds it to criteria 1 and 6."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-386
    title: "The generator side - generator/, synthetic_data_generator/ and each asset's providers - imports from outside itself only asset_model/ and scenarios/, reaches the bootstrap through nothing, and offers the bootstrap and cli/ one public module"
    date_written: "2026-11-02"
    story: "As whoever maintains the generator, I want it to depend only on the shared reading code, so that it can change, or be left out, without touching the pipeline or the bootstrap."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; 'the generator's imports narrowed to the shared domain model'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03, criterion 1 reworded for the providers' imports of generator/; v5 2026-11-14, evidently_common's three calls routed to the drift module (Q1 of 2026-11-14). A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL let the generator side - generator/, synthetic_data_generator/ and each asset's synthetic/collections/ providers - import from outside itself only asset_model/, scenarios/ (criterion 4), the standard library and declared third-party dependencies (Q1, SETTLED by Keith 2026-11-02); inside the side, a provider may import generator/ and synthetic_data_generator/ (66 statements at 04fa7955) and synthetic_data_generator/ may import generator/ (8 statements)."
      - "THE SYSTEM SHALL remove every import of the real pipeline from the generator side - 97 statements in 13 files at a35066ff - each pure function it calls moving into asset_model/ (REQ-PIPE-380 criteria 9, 10 and 12), the Linkage Products provider's three evidently_common imports going to the drift module, and SHALL record where each module outside asset_model's closure went (collections, linked_datasets, amber_setting, scripted_decisions, evidently_common, arrivals, check_bands, scenario_map, promotion, delivery, correction_apply, correction_trial, assignment, list_setting_members, correction_replay and arrival_classification at 04fa7955) in this requirement's decisions when built."
      - "THE SYSTEM SHALL give the generator one public module, used by the bootstrap and cli/, offering what cli/pipeline.py's generate_collection, has_target_trial, target_datasets, generated_collections, generated_targets, generated_gate_outcomes and generated_into (lines 301-410) offer the bootstrap today; the bootstrap SHALL import nothing else of the generator and nothing of cli/."
      - "THE SYSTEM SHALL hold in one small shared package, scenarios/ at the top level (Q4 and its name, SETTLED by Keith 2026-11-02), the reader of each asset's scripted_decisions.yaml (load, PERIOD, CHAIN_MARK, CHAIN_OPERATIONS and the due-instant helpers the generator calls today, made public) and the scenario vocabulary (SUBJECTS, SUPPLY_HISTORY_ROW, AS_AT_PANEL and the rest); the generator and the bootstrap may import it, it imports only asset_model/, and nothing in the real pipeline imports it."
      - "IF the generator side imports the bootstrap package, THEN `mothman check` SHALL fail (REQ-TEST-384); today's 8 such statements (scripted_decisions in scenario_injection.py and linkage_products.py, scenario_map in scenario_injection.py and targets.py, correction_replay in correction_claims.py) SHALL go, through criterion 4's package or criterion 2's moves."
      - "THE SYSTEM SHALL move the scenario map's writer to the generator, which places the scenarios."
      - "THE SYSTEM SHALL move delivery writing (delivery.write_delivery, remove_deliveries and existing_delivery_names, with the bookkeeping-file names) to the generator, keeping the delivery layout and file-name reading the pipeline uses (dataset_for_filename, default_deliveries_dir) in asset_model/ or the pipeline."
      - "THE SYSTEM SHALL use no underscore-led name of a module outside the generator side: at 04fa7955 correction_apply._declared, linked_datasets._asset_folder, _walk and _columns, scripted_decisions._due_at and _wall_clock_after, and schedule._agreement each become a public name where they land (REQ-PIPE-376)."
      - "THE SYSTEM SHALL show through REQ-TEST-239's compare that no byte any collection generates changes, for each asset."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: every generated file is unchanged, proven by REQ-TEST-239's compare. (REQ-GEN-392 is the one requirement in this batch that regenerates, and is built and compared on its own.)"
      - "PERFORMANCE: providers stay importable without pandas or numpy (REQ-GEN-246 criterion 7), so the providers gate's time is unchanged."
      - "MAINTAINABILITY: a generator that predicts what the pipeline will do (target trials, correction claims, drift planning) through the pipeline's own code stays in step with it; one that takes data instead can drift - which is why Q1 settled on moving the functions rather than passing data."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-TEST-384"
      - "REQ-GEN-370"
      - "REQ-GEN-246"
      - "REQ-TEST-239"
      - "REQ-QAC-389"
    decisions:
      - "NARROWED TO THE SHARED READING CODE (Keith, 2026-10-31, #134's code half). REJECTED (b) and (c) of #134 as in REQ-PIPE-380."
      - "ONE ENTRY POINT, NOT A SUBPROCESS (delivery-scoper): REJECTED having the bootstrap run the generator only as a `mothman` subprocess, which would lose the in-process resume comparison (REQ-TEST-160) for no gain the gate does not already give."
      - "A SHARED SYNTHETIC-CONFIG PACKAGE (Q4, SETTLED by Keith 2026-11-02): REJECTED the generator owning the readers (the bootstrap would then import the generator beyond its entry point), and REJECTED the bootstrap owning them (the generator would import the bootstrap)."
      - "SHARED READING CODE ONLY (Q1, SETTLED by Keith 2026-11-02): REJECTED a permanent list of allowed pipeline modules, and REJECTED taking everything as data."
      - "THE DRIFT PLANNING GOES THROUGH asset_model/ (Q1 of 2026-11-14, SETTLED by Keith 2026-11-14): the provider's fold, PSI, exclusions and thresholds are the real check's own, from one module both call. REJECTED a generator-side PSI copy and a permanent allowlist entry."
      - "THE SHARED PACKAGE IS NAMED scenarios/, AT THE TOP LEVEL (SETTLED by Keith 2026-11-02): REJECTED synthetic_config/. It does not clash with the scenarios modules moving into bootstrap/ or with cli/scenarios.py, because imports here are absolute."
      - "THE RULE IS ABOUT THE SIDE'S BOUNDARY, NOT EACH FILE (delivery-scoper, v4): providers build on generator/ (scenario_injection, targeting and resupply among them) and synthetic_data_generator/, and REQ-TEST-384 already puts all three on one side. REJECTED moving the helpers providers use into asset_model/, which would put synthetic machinery into code a real deployment ships, and REJECTED a narrow provider-facing generator API for now (no decision asks for one)."
      - "THE ENTRY POINT OFFERS SEVEN THINGS, NOT TWO (delivery-scoper, v4): the bootstrap also asks whether a collection has a target trial, its target datasets, the generated collections, targets and gate outcomes."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-376
    title: "The shared reading code's names say what they mean as it moves into asset_model/: the two claim_window and two _calendar_periods functions renamed apart, every name used outside its module public, fall_hold with its one caller, and two dead functions removed with their register claims"
