  - id: REQ-PIPE-378
    title: "The schedule code answers each of #137 group D's questions one way, as Keith settled them: a date before a calendar's first version raises for every caller, the cadence check is made per round only, look-ups from now share one named horizon, two slot helpers stop swallowing configuration errors, and a period's round is required"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want each place where the schedule code answers one question two ways settled on purpose, so that a supply's period, window and slot do not depend on which function happened to be asked, and a configuration mistake is never read as an answer."
    moscow: could
    status: not_started
    source: "Keith, plans/running-thoughts.md #137 group D (2026-11-02, 'WOULD CHANGE BEHAVIOUR (Keith's)'; sent to delivery-scoper ~21:05 Perth). Drafted by delivery-scoper 2026-11-03 (separation v4, five open questions); v5 2026-11-14 with Keith's Q6-Q10 of 2026-11-14, each fallback caller named and drafted against the code at a35066ff. A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL answer which calendar version is in force on a date through one function, Calendar.version_in_force (schedule.py line 172 at a35066ff), which raises ScheduleConfigError naming the calendar, the date and its earliest version for a date before the first version; schedule._version_in_force (line 809), which falls back to the first version, SHALL go, and its callers SHALL call Calendar.version_in_force (Q6 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "IF schedule.claim_window is asked for a date before the dataset's calendar's first version and no participation version states the window, THEN it SHALL raise criterion 1's error rather than take the first version's window (line 806 today); a window a participation version states is answered as today."
      - "IF schedule.periods_for_dataset's per-round cadence check (line 691) meets a round before the calendar's first version, THEN it SHALL raise criterion 1's error; only a dataset's own dates can produce such a round, because a calendar generates no period before its first version."
      - "IF a dataset's own dates name a round before its calendar's first version, THEN `mothman schedule validate` SHALL fail, naming the dataset, the round, the calendar and its first version, so that criteria 2 and 3 are met in configuration rather than mid-run. (No dataset in either asset declares own dates at a35066ff, checked 2026-11-14.)"
      - "WHEN orchestrate._claim_window (qa_tools/tools/orchestrate.py line 475) meets criterion 1's error for a dataset on an arrival's receipt date, THE SYSTEM SHALL do what open question 2 settles."
      - "WHEN verdict.resolved (verdict.py lines 92 and 94) meets criterion 1's error, THE SYSTEM SHALL keep its callers' existing handling of a slot that cannot be built: verdict.judge records the classification with no inputs and no fingerprint (its never-raises rule), and verdict.compared reports the slot as one that cannot be built now, naming the error."
      - "WHEN agreement_drift's keys for a period (agreement_drift.py line 132) meet criterion 1's error, THE SYSTEM SHALL leave out the calendar-version key, because no calendar version governed the period, and SHALL still add the calendar-period key; every other exception there is handled as today."
      - "WHEN participation_view.view (participation_view.py lines 183 and 218) meets criterion 1's error, THE SYSTEM SHALL show the claim window as stated by no calendar version on that date, naming the calendar's earliest version, and show no source date for it, rather than raise."
      - "WHEN the Linkage Products provider's release timing (linkage_products.py lines 1745 and 1800) meets criterion 1's error, THE SYSTEM SHALL refuse to generate, naming the release and the date (its CannotGenerate), rather than time a release against a borrowed window."
      - "THE SYSTEM SHALL keep files_go.py line 57 and pipeline/period_slots.py line 40, which already call Calendar.version_in_force and so already raise, as they are."
      - "THE SYSTEM SHALL keep only the per-round cadence check - months named by a participation in force on a round whose calendar version is a cadence rule, judged on the round's date (schedule.py line 691) - and SHALL remove the check against the calendar's current version (lines 732-738, cal.current); the refusal of an unbounded ask of a cadence-rule calendar (line 739) is not a months check and stays (Q7 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL hold one named look-ahead horizon in asset_model/ - a reach, and a function giving the furthest date from a day, today on the asset's clock by default - and every look-up from now SHALL use it: at a35066ff slots.lookup_horizon (3 years; slot_named, placing.py lines 206 and 348, turned_off.py line 142), schedule.date_of and round_of (365 days, lines 903 and 925), agreement_freeze.py line 398 (400 days), pipeline/period_slots.py line 42 (400 days), dashboard/embed_dashboard_data.py line 365 (366 days), period_overlap.py line 63 (the end of next year) and correction_trial.py line 329 (400 days past the later of the latest period and today), at the reach open question 3 settles (Q8 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL have slots.relative_period (line 341) count within the same horizon slot_named looks within, so that every period slot_named can find, relative_period can count from and to; an offset reaching past the horizon answers None, as an offset past the sequence does today."
      - "THE SYSTEM SHALL treat the look-aheads measured from a given date rather than from now - at a35066ff slots.fall_hold (731 days, line 499), inheritance.py line 697, scripted_decisions.py line 527, correction_trial.py line 723, verdict.compared (line 338), validate_schedule.py lines 1906, 2140 and 2258, and agreement_freeze.py line 311 and _FLIP_REACH (800 days, line 669) - in the form open question 4 settles."
      - "IF slots.is_owed_supplies (line 444) or slots.period_claimed_at (line 529) meets a ScheduleConfigError, THEN it SHALL raise it rather than answer False or None; NoCalendarAgreed SHALL keep its deliberate quiet answer ('nothing owed'), and an unknown dataset (UnknownDatasetError, a KeyError) its answer as today (Q9 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL narrow period_claimed_at's `except ValueError` (line 538) so that it no longer catches ScheduleConfigError, which is a subclass of ValueError (schedule.py line 73); any other ValueError it still serves SHALL be named in this requirement's decisions when built."
      - "WHEN the error of criterion 15 reaches the helpers' callers - arrivals.py line 222, validate_arrival_patterns.py line 99 and promotion.py line 514 at a35066ff - THE SYSTEM SHALL let it stop the step and name the configuration, never continue as though nothing were owed."
      - "THE SYSTEM SHALL make DatasetPeriod.round (schedule.py line 126) required, with no default, and SHALL remove the 'or period' fallbacks at slots.py line 307 and schedule.py line 142; both product constructors (schedule.py line 675 and the Child Protection provider line 742) already set it, and no test builds one by hand at a35066ff (Q10 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL have, for each criterion that changes behaviour (2 to 9 and 11 to 18), a test seen failing first against today's behaviour."
      - "WHEN REQ-TEST-239's compare is run before and after this requirement, THE SYSTEM SHALL record in evidence every difference it shows, item by item; IF any recorded filing, verdict, decision or check result moves, or a look-up gives a different answer rather than seeing further, THEN the build SHALL stop and report it to Keith before it is accepted. (Expected for criteria 1-10: nothing moves, since no dataset in either asset has a round before its calendar's first version.)"
    non_functional_requirements:
      - "RELIABILITY: a configuration error is the one thing the pipeline must not read as 'nothing owed' (criteria 15-17); a date no calendar version covers is an error the caller meets on purpose, never a borrowed answer (criteria 1-9)."
      - "BEHAVIOUR CHANGES ONLY BY DECISION: every difference is listed in evidence, as REQ-PIPE-382 criterion 10 does for moved instants, and any recorded result that moves stops the build for Keith (criterion 20)."
      - "PERFORMANCE: one horizon or one policy costs no more than today's; the bootstrap is no slower by more than 5 percent; WHERE the settled horizon is longer than a site's today, the dashboard build's time and embedded size are measured before and after and reported."
      - "SCALABILITY: at thirty collections, a daily calendar generates one period a day to the horizon for every daily dataset, so the horizon's reach is the cost multiplier for every look-up from now (open question 3)."
      - "OBSERVABILITY: criterion 1's error names the calendar, the date and the earliest version, so a caller that lets it surface needs no extra words."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-376"
      - "REQ-PIPE-377"
      - "REQ-PIPE-243"
      - "REQ-PIPE-113"
      - "REQ-TEST-239"
    decisions:
      - "A DATE BEFORE A CALENDAR'S FIRST VERSION RAISES, FOR EVERY CALLER (Q6 of 2026-11-14, SETTLED by Keith 2026-11-14, option (b), NOT the recommendation): the callers that fell back today must meet the error and say what they do instead (criteria 2-9). REJECTED (a) falling back to the first version everywhere, as in_force.py's docstring says a calendar does (the recommendation), and (c) keeping both policies, each renamed."
      - "THE FALLBACK'S CALLERS, NAMED (delivery-scoper, v5, from the code at a35066ff): schedule._version_in_force had five direct callers - schedule.py's per-round cadence check (line 691) and claim_window (line 806), agreement_drift.py line 132, participation_view.py line 218 and verdict.py line 94 - and claim_window carries it to slots.slot_instants (every slot), verdict.py line 92, orchestrate._claim_window, participation_view.py line 183 and the Linkage Products provider. v4 named four; the per-round cadence check and the claim window's own callers are the ones it missed."
      - "WHY NOTHING IS EXPECTED TO MOVE (delivery-scoper, v5, checked 2026-11-14): every calendar period lies on or after its calendar's first version, and no dataset in either asset declares own dates, so today every caller's date lies on or after the first version (quarterly 2013-01-01; daily 2026-06-18). The error is a guard for configuration not yet written, which is why criterion 4 refuses it in the schedule gate."
      - "EACH CALLER'S ANSWER IS THE SCOPER'S PROPOSAL (delivery-scoper, v5, Keith may change any): verdict keeps its existing cannot-be-built handling; agreement_drift drops only the key that has nothing to name; participation_view words the gap, as a view rather than a judgement; the generator refuses, as it refuses any release it cannot time. orchestrate's is open question 2."
      - "ONLY THE PER-ROUND CADENCE CHECK (Q7 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): history is judged against the version in force on each round's date. REJECTED (b) only the current-version check, and (c) keeping both."
      - "ONE NAMED HORIZON FOR LOOK-UPS FROM NOW (Q8 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): relative_period counts within it, and REQ-TEST-239's compare shows what moves. REJECTED (b) keeping each horizon, documented."
      - "SIX HORIZONS WERE MORE THAN SIX (delivery-scoper, v5, from the code): v4 listed six; a grep at a35066ff finds eight sites reaching from now and nine reaching from a given date (criteria 12 and 14). promotion._READER_REACH (400 days, promotion.py line 523) bounds how far on a READER'S DELIVERY is looked for among arrivals, not how far a schedule is generated, so it is not a look-ahead horizon and is left alone."
      - "SWALLOWED CONFIGURATION ERRORS RAISE (Q9 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): NoCalendarAgreed keeps its deliberate quiet 'nothing owed'. REJECTED (b) keep swallowing. Found in the code (delivery-scoper, v5): ScheduleConfigError subclasses ValueError, so removing it from period_claimed_at's tuple alone would change nothing - criterion 16 is what makes Keith's answer true."
      - "AN UNKNOWN DATASET KEEPS ITS QUIET ANSWER (delivery-scoper, v5, Keith may change it): Q9 named configuration errors; UnknownDatasetError means the dataset is not in this asset's hierarchy, which is_owed_supplies' callers already treat as nothing owed, and arrivals only offers it datasets its own patterns found."
      - "DatasetPeriod.round REQUIRED (Q10 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): the two 'or period' fallbacks go. REJECTED (b) leaving it optional."
      - "THE SIXTH ITEM IS ALREADY FOLDED (#137 group D): the three readers of `synthetic: true` become one in REQ-PIPE-382 criterion 4."
      - "ONE REQUIREMENT, FIVE SETTLED ITEMS (delivery-scoper, v5): kept whole because the ids were kept; it could split into the in-force items (Q6, Q7), the horizon (Q8) and the error and field items (Q9, Q10) if Keith prefers smaller pieces, each with its own compare."
    open_questions:
      - "1 (NEW in v5). DOES Q6 COVER PARTICIPATION VERSIONS TOO? Q6 asked about 'two in force policies for one calendar'; a second first-version fallback exists for PARTICIPATION versions (REQ-PIPE-113 criterion 2's rule, slots._participation_for and claim_window's participation branch): a calendar period before a dataset's first participation version takes the first version's inputs, because the slot before it closes against it. Child Protection's datasets participate from 2015-01-01 on a calendar from 2013-01-01. Options: (a) calendar versions only, the participation rule unchanged - nothing moves; (b) participation versions too - every slot whose next period predates the first participation version stops being buildable, which would change slot closing for Child Protection's first owed quarter. RECOMMENDED (a): Q6's words were about a calendar, and the participation rule has its own reason, recorded on REQ-PIPE-113."
      - "2 (NEW in v5). WHAT orchestrate._claim_window DOES ON THE ERROR. It caps when a gate reached from an arrival takes effect, using the shortest claim window of the datasets the arrival carries on its receipt date. Options: (a) leave that dataset out of the shortest-window minimum, none if none remain - its docstring's own rule, 'never a borrowed one' (REQ-PIPE-243 criterion 2); (b) let it raise, stopping the arrival's gate step and naming the dataset; (c) fall back to the adapter's claim_window_dataset. RECOMMENDED (a): an arrival received before its calendar existed is still an arrival, and refusing it would make a supplier's early file a pipeline failure; (c) borrows a window, which Q6 rejected."
      - "3 (NEW in v5). THE ONE HORIZON'S REACH. Options: (a) 3 years, slots.lookup_horizon's today - no look-up from now loses anything it sees today, the dashboard embeds about three years of future slots instead of one (about 1,100 rather than 366 for a daily dataset), and the agreement-freeze and overlap gates can find conflicts further ahead; (b) about 400 days - the dashboard barely changes, but slot_named, placing and turned_off stop seeing periods more than about 13 months ahead, so re-filing into one is refused; (c) a separate named reach for display. RECOMMENDED (a): lengthening only lets a look-up see further, while shortening can turn today's answer into none, which is the quiet direction; the cost is measured (NFR 3). (c) is two horizons again."
      - "4 (NEW in v5). DO LOOK-AHEADS FROM A GIVEN DATE SHARE IT? Q8 settled look-ups from now; nine sites reach ahead from a round, a decision's instant, a version's start or the latest recorded period (criterion 14), at 400, 731 and 800 days and two years. Options: (a) the same named reach, measured from each site's own date, any site the builder shows needs another reach reported to Keith rather than kept; (b) only look-ups from now, the rest left as they are, documented. RECOMMENDED (a): v4's question listed fall_hold and agreement_freeze among the horizons Keith answered, and a second family of reaches is the drift Q8 removes. _FLIP_REACH is the likeliest exception: it must reach past a whole flip of files_go_to_period."
    signed_off: null

  - id: REQ-PIPE-379
    title: "Every asset reads its delivery calendar through one mechanism in asset_model/ - named calendars of authored dates or the daily cadence rule, each dataset picking one - and a project extraction owes no slot by declaring `no_calendar: never`"
    date_written: "2026-11-03"
    story: "As whoever would stand up a new asset - including a one-off project extraction - I want its delivery calendar to be configuration read by the same code as every other asset's, so that a new asset needs no calendar code of its own."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 1b (SPLIT D1b, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14 with Keith's Q2 of 2026-11-14. A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL read every asset's calendar.yaml through one loader in asset_model/, with the calendars' dates and versions per asset (SPLIT D1b, SETTLED by Keith 2026-11-03)."
      - "THE SYSTEM SHALL keep both calendar shapes a version may take today - authored dates, and the daily cadence rule (`cadence: {rule: daily}`, Birth Registrations') - read by that one loader (Q2 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL NOT branch on an asset's name or a calendar's name anywhere outside that asset's own folder: generator/scenario_injection.py line 1419's test for a calendar named 'daily' (at a35066ff) SHALL read whether the calendar version in force is a cadence rule instead."
      - "WHERE a dataset declares `no_calendar: never` (REQ-PIPE-106), THE SYSTEM SHALL give it no slot, no period and nothing owed, as today, and SHALL keep `no_calendar`'s distinction between a schedule not yet agreed and one that will never exist (Q2 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL have a test that runs a fixture asset whose only collection is a project extraction, its datasets declaring `no_calendar: never`, through `mothman pipeline run` and `mothman dashboard rebuild`, and shows each supply staged, checked and recorded with no slot, no period and nothing marked missing."
      - "WHERE a new asset declares its calendars in its own calendar.yaml, THE SYSTEM SHALL need no code change to read them, and the schedule gate SHALL check them as it checks today's."
    non_functional_requirements:
      - "SCALABILITY: a third or fourth asset shape (the project extraction, CLAUDE.md's scale note) adds configuration, not code."
      - "BEHAVIOUR-PRESERVING for today's two assets: criterion 3's change is proven by REQ-TEST-239's compare."
      - "COST: criterion 5's test uses a fixture asset and the test database, not a bootstrap."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-106"
    decisions:
      - "ONE MECHANISM, PER-ASSET DATES (SPLIT D1b, SETTLED by Keith 2026-11-03): named calendars, each dataset picking one; a project extraction has no slots. REJECTED a per-asset calendar plug-in."
      - "ONE MECHANISM MEANS TODAY'S MECHANISM (Q2 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): both calendar shapes as today, and `no_calendar: never` stays how an extraction has no slots. REJECTED (b) authored dates only, every dataset naming a calendar and an extraction naming one with no dates - which would write the daily calendar out date by date and lose 'not yet agreed' against 'never'; and (c) an extraction naming an empty calendar instead of `no_calendar: never`."
      - "D1b's WORDING READ THROUGH Q2 (delivery-scoper, v5): D1b said 'a calendar with no slots'; Q2 settles that the form is a dataset declaring `no_calendar: never` against today's mechanism, so this requirement says that and nothing about an empty calendar."
      - "MOSTLY ALREADY TRUE (delivery-scoper, 2026-11-03): schedule.py reads both assets' calendar.yaml through one loader today, and REQ-PIPE-106 (built) lets a dataset declare `no_calendar: never`. What is missing is a proof that a whole asset of that shape runs (criterion 5) and one name-based branch in the generator (criterion 3)."
    open_questions: []
    signed_off: null

