  - id: REQ-PIPE-377
    title: "Each schedule rule written more than once is written once in asset_model/: a round to the period its files fill, which participation version gives a slot its inputs, and whether a dataset supplies in a round"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want each schedule rule answered by one function, so that the dashboard, the pipeline and the generator cannot quietly disagree about which period a supply fills or whether it was owed."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #137 group C (2026-11-02, 'REAL DUPLICATION (scope with Keith)'; sent to delivery-scoper ~21:05 Perth). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14, sites re-taken at a35066ff. A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL turn a round into the period its files fill in one asset_model function - schedule.period_filled_by today (line 948 at a35066ff), with an index form for callers walking a sequence (REQ-PIPE-321 NFR 1) - and every other site that adds files_go_to_period to a sequence index SHALL call it: at a35066ff schedule.py lines 716 (periods_for_dataset's _owed) and 938 (round_of), slots.py line 510 (fall_hold), inheritance.py line 710, participation_view.py line 117, pipeline/period_slots.py line 60, pipeline/owed_nothing.py line 54 and the Child Protection provider (assets/quarterly/synthetic/collections/child_protection.py line 741)."
      - "IF a round's files would fill a period past the end of the sequence, THEN the one function SHALL answer that there is none, as period_filled_by does today, and the Child Protection provider SHALL refuse naming the round rather than raise an IndexError (it has no bounds check today)."
      - "THE SYSTEM SHALL resolve which participation version gives a slot its inputs once per slot, in asset_model/, and the two copies #137 found in the schedule and slot code and the one in verdict.py SHALL read that answer."
      - "THE SYSTEM SHALL answer whether a dataset supplies in a round in one asset_model function, and the three places #137 found it written - schedule.py's _participates (line 679) and round_of's month test (lines 942-943), which ignores the not-yet-owing and turned-off rules _participates applies, among them - SHALL call it."
      - "IF, before the change, the copies folded by criteria 1, 3 or 4 give different answers for any round of any dataset in either asset, THEN the build SHALL stop and report each difference to Keith rather than pick one answer."
      - "THE SYSTEM SHALL have a test, seen failing first, of the Child Protection provider's refusal in criterion 2, and a test that walks every dataset's rounds in both assets comparing each folded site's answer with the one function's."
      - "THE SYSTEM SHALL show through REQ-TEST-239's compare that folding changes nothing either asset's bootstrap records, generates, builds or offers."
