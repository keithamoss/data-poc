    open_questions:
      - "1 (NEW in v5). THE AMBER RULE. Q5 left the rule to scoping, 'e.g. the middle of the band aimed at'. Proposed: amber aims at the middle of the aimed rules' amber intersection at the frame's row count, in rows, rounded down - targeting._target's rule. Worked against today's comments: Birth Registrations' facility nulls at 1,900 rows, Soda above 15 percent and at or below 35, dbt above 300 and at or below 600, intersect at 301-600 rows and aim at 450 (23.7 percent; today 30 percent); sex at 1,900 rows aims at 15 rows (0.8 percent; today 0.8). Options: (a) the middle, as proposed; (b) the lower third, nearer the warn threshold, so an amber reads as only just amber; (c) the upper third. RECOMMENDED (a): the most margin either side, so the binomial spread of a probabilistic fault (open question 3) is least likely to cross a threshold, and it is the rule the targeting code already uses."
      - "2 (NEW in v5). THE RED RULE, WHICH HAS NO TOP. A fail band is open above, so it has no middle. Options: (a) the lowest failing count plus the width of the rule's amber band (as far past the fail threshold as amber's band is wide) - facility nulls at 1,900 rows aim at 665 + 300 = 965 rows (50.8 percent; today 55), a count band failing above 5 aims at 10 (today about 12); (b) one and a half times the lowest failing count - 998 and 8; (c) twice it - 1,330 and 12. RECOMMENDED (a): it scales with how wide the rule's tolerance is, and lands near today's sizes. It needs open question 3's floor for a single-tier rule, whose amber band has no width."
      - "3 (NEW in v5). SINGLE-TIER RULES AND HOW A SIZE IS PLANTED. Two linked forks. (i) A single-tier rule fails on any violation and has no amber band, so neither rule above gives it a size: options (a) amber plants nothing on a single-tier rule, as REQ-GEN-184 already does, and red plants a fixed handful (proposed 5 rows), declared once beside the derivation, since any violation fails and the count only sets how many failing rows the page shows; (b) keep planting single-tier faults in an amber preset, so that supply reads red as today. (ii) Today's injectors plant each row with a probability, so a supply aimed at 3 rows may get 0 (about a 5 percent chance) and read green: options (a) plant exactly the derived count, as targeting's _set_nulls does; (b) keep the per-row probability at size divided by rows. RECOMMENDED (i)(a) and (ii)(a): the history regenerates anyway, and an exact count makes 'aimed at the middle of the band' true of every file rather than on average. (i)(a) moves Child Protection's amber partial resupplies from reading red to reading amber, which criterion 6 lists."
