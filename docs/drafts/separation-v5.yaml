# (Perth) carrying Keith's answers to v4's eleven open questions
# (docs/drafts/decisions-2026-11-01.md, final section, Q1-Q11, 2026-11-14).
# NOT SIGNED. Nothing here is built until Keith signs it. Ids unchanged from v4.
#
# WHAT v5 CHANGES (v4's eleven questions all answered; none re-asked):
#   REQ-PIPE-380  Q1: one drift module in asset_model/; criterion 11 now moves
#                 the built every_asset reader; check_bands' own readers named.
#   REQ-GEN-381   criterion 7: the replay cache key covers asset_model/,
#                 scenarios/ and bootstrap/ (found in the code, see decisions).
#   REQ-TEST-384  Q11: validate-config.yml, both matrix legs, its paths filter
#                 widened, its tests marked critical.
#   REQ-PIPE-378  Q6-Q10 turned from open questions into criteria; Q6 drafts
#                 what each fallback caller does on the new error.
#   REQ-PIPE-379  Q2: today's two calendar shapes and `no_calendar: never`.
#   REQ-QAC-387   Q3: override by check name.
#   REQ-QAC-389   Q4 (not the recommendation): a real age_group rule, a new
#                 datacontract check with its own lifecycle entry.
#   REQ-GEN-392   Q5 (not the recommendation): fault rates derived from bands
#                 at generation time; the history regenerates; pins re-captured.
#   REQ-PIPE-390  split risk 6 recorded as SETTLED.  REQ-GEN-391 split risk 5
#                 recorded as SETTLED.
#   Line numbers re-taken at a35066ff (2026-11-14) where a criterion changed;
#   unchanged criteria keep v4's 04fa7955 figures, which still held on the
