    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #137 group B (2026-11-02, 'renames ride the #134 move'; groups B-D sent to delivery-scoper ~21:05 Perth). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14, line numbers re-taken at a35066ff after #137 group A landed. A PROPOSAL, not signed until Keith signs v5."
