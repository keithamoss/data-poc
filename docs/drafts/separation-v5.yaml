      - "WHERE an asset's file-checks.yaml holds an entry whose `check:` names a shared check, THE SYSTEM SHALL use that entry in place of the shared one, whole, for that asset only; no field of the shared entry SHALL be inherited (Q3 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "WHERE an asset's file-checks.yaml holds an entry whose `check:` names no shared check, THE SYSTEM SHALL run it as a check for that asset only."
      - "WHERE an asset's override of a shared check carries `retired_as_of`, THE SYSTEM SHALL stop running that shared check for that asset from that date, as a retired check is stopped today, and SHALL keep running it for every other asset."
      - "WHERE an asset's folder holds no file-checks.yaml, THE SYSTEM SHALL run the shared default unchanged, and `mothman check`'s collections gate SHALL no longer require the file in each asset folder (validate_collections.ASSET_WIDE today, line 286 at a35066ff)."
      - "THE SYSTEM SHALL read the merged checks through one function, used by every reader of file-checks.yaml at a35066ff (file_checks.py line 49, qa_tools/collections/__init__.py line 150, check_bands' file bands, check_lifecycle.parse_file_check_metadata through validate_check_lifecycle, and validate_collections)."
      - "THE SYSTEM SHALL derive each file check's id per dataset as today (`<asset>.<agency>.<collection>.<dataset>.<check>_file`, REQ-QAC-096 criterion 4), so that no recorded check id changes, an override included."
      - "THE SYSTEM SHALL hold the shared default and each asset's additions and overrides to the check-lifecycle gate, the authoring rules and the changelog rule a file check is held to today (REQ-QAC-096 criteria 5 and 6); IF an override changes what a check does, or retires it, without a changelog entry of its own, THEN the gate SHALL fail naming the asset and the check."
      - "IF an asset's file-checks.yaml names a key the shared default does not allow, or names one check twice, THEN THE SYSTEM SHALL refuse it naming the asset, the file and the entry."
      - "WHERE the selected asset's folder is outside the repository (REQ-PIPE-342's injection), THE SYSTEM SHALL read the shared default from the code's own checkout and the asset's additions and overrides from the asset folder."
      - "WHEN this lands, THE SYSTEM SHALL delete both assets' identical copies and SHALL show through REQ-TEST-239's compare that no check, verdict or record changes for either asset."
      - "THE SYSTEM SHALL have tests, seen failing first, of an asset adding a check, of an asset overriding one whole (a field the override leaves out is not taken from the shared entry), of an asset retiring a shared check for itself while another asset still runs it, of an asset with no file of its own, and of a check named twice refused."
    non_functional_requirements:
      - "SCALABILITY: at thirty collections and a third asset, a new file-level check is one entry, not one per asset."
      - "COMPATIBILITY: the shared default ships with the code, as dbt_shared/ does, so an injected asset folder outside the repository still gets it."
      - "AUDITABILITY: an asset's override or retirement carries its own changelog entry, so which asset departs from the shared default, and why, is on the record."
      - "MAINTAINABILITY: an override is read whole in one place, so a reader never has to merge two files in their head to know what an asset runs."
      - "BEHAVIOUR-PRESERVING: today's two assets run exactly the shared default, proven by REQ-TEST-239's compare."
    dependencies:
      - "REQ-QAC-096"
      - "REQ-PIPE-342"
      - "REQ-QAC-368"
    decisions:
      - "ONE SHARED DEFAULT, BESIDE dbt_shared/ (SPLIT D2, SETTLED by Keith 2026-11-03): an asset may add to or override it; a new file-level check reaches every asset at once. REJECTED a copy per asset, with or without a gate."
      - "OVERRIDE BY CHECK NAME (Q3 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): a same-named `check:` replaces the shared entry whole, a new name adds an asset-only check, and `retired_as_of` on an override stops a shared check for that asset. REJECTED (b) field-by-field inheritance, and (c) additions only, which does not meet D2's 'or override'."
      - "THE FILE NAME IS THE SCOPER'S PROPOSAL (delivery-scoper, 2026-11-03): file-checks.yaml at the repository root, the name both assets use today. Keith may change it at sign-off."
      - "IDS STAY PER ASSET (delivery-scoper): a file check's id already carries the asset (REQ-QAC-096 criterion 4), so sharing the definition shares no recorded result between assets."
      - "people.yaml AND data-asset.yaml STAY COPIED (SPLIT D2, SETTLED by Keith 2026-11-03), with no gate: each team owns its own; the shared lines are format and comments. REJECTED a shared default for either. Recorded here because this is the D2 requirement for file checks; the dbt-packages half is REQ-TEST-388."
    open_questions: []
    signed_off: null

  - id: REQ-TEST-388
    title: "Every asset's dbt project declares the same dbt packages and versions, and a gate in mothman check fails when two assets' packages.yml or package-lock.yml differ"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want every asset to run its checks on the same dbt packages, so that a check behaves the same on every asset and a package upgrade cannot land in one asset and be forgotten in the other."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 2, the dbt package files (SPLIT D2, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14 unchanged. A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL keep a packages.yml and a package-lock.yml in every asset's dbt project (assets/<asset>/dbt/), because dbt reads them from each project, and `mothman env dbt-deps` SHALL install each asset's from its own (REQ-QAC-368)."
      - "IF any two asset folders in the repository declare different dbt packages or versions - their packages.yml, or their package-lock.yml, differing once parsed as YAML - THEN `mothman check` SHALL fail, naming both assets, the file and the first entry that differs."
      - "WHERE only one asset folder can be seen, THE SYSTEM SHALL pass the gate and report that it compared one asset."
      - "THE SYSTEM SHALL run the gate without a database, an asset selection or network access, in the validate-config workflow."
      - "THE SYSTEM SHALL have tests, seen failing first, of a differing package revision failing, of a differing lock hash failing, of a difference in comments alone passing, and of one asset passing."
    non_functional_requirements:
      - "PERFORMANCE: two small YAML files per asset; the gate runs in under a second."
      - "MAINTAINABILITY: an upgrade is one edit per asset, held together by the gate, and `mothman env dbt-deps` per asset as today."
      - "COMPATIBILITY: the gate reads committed files only, so it runs on a government network with no access to dbt Hub or GitHub."
      - "COST: no database and no bootstrap; seconds in CI."
    dependencies:
      - "REQ-QAC-368"
    decisions:
      - "SAME PACKAGES, KEPT PER PROJECT, GATED (SPLIT D2, SETTLED by Keith 2026-11-03): every asset uses the same dbt packages and versions; the per-project packages.yml and package-lock.yml stay because dbt needs them in each project. REJECTED packages per asset, and one shared install folder."
      - "PARSED, NOT BYTES (delivery-scoper): a comment is not a package, so a reworded comment should not fail the gate; a changed revision or lock hash should."
      - "THE LOCK FILE IS COMPARED TOO (delivery-scoper): REQ-QAC-368 decision 5 as changed by C6 (SETTLED by Keith 2026-11-02) makes dbt's own package-lock.yml the meaning of 'installed', so two assets with equal packages.yml but different locks would run different code."
      - "people.yaml AND data-asset.yaml HAVE NO GATE (SPLIT D2, SETTLED by Keith 2026-11-03): see REQ-QAC-387."
    open_questions: []
    signed_off: null

  - id: REQ-QAC-389
    title: "Each QA adapter's statistics read a column's allowed values from the collection's contract at run time, the adapters hold no hand-copied list, and Emergency Department's age_group gains a real contract rule that datacontract-cli checks"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want the statistics a run records to count against the allowed values the contract declares, and every counted column's list to be a rule a tool checks, so that a list edited in the contract is the list the statistics use, whichever tool is later dropped."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 3 (SPLIT D3, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14 with Keith's Q4 of 2026-11-14 (a new check on age_group). A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "WHEN a run records a collection's statistics, THE SYSTEM SHALL read each counted column's allowed values from the collection's ODCS contract at that moment, through one reader in asset_model/ - the column's `enum:` or its datacontract `invalidValues` rule's `validValues`."
      - "THE SYSTEM SHALL remove every hand-copied allowed-value list from the QA adapters - at 04fa7955 _SEX_VALID and _SUBURB_VALID (assets/daily/collections/civil_registration.py), _POSTCODE_VALID and _CONCERN_TYPE_VALID (assets/quarterly/collections/child_protection.py), TRIAGE_CATEGORIES and AGE_GROUPS (emergency_department.py, lines 5-6 at a35066ff) and MATCH_LEVELS (linkage_products.py) - and an adapter SHALL name only which columns its statistics count and test."
      - "THE SYSTEM SHALL keep the order the contract declares a list in, so that recorded value counts keep their declared order (REQ-QAC-247)."
      - "IF a column an adapter names has no allowed-value list in its contract, or the contract declares it twice and the two disagree, THEN THE SYSTEM SHALL refuse the run before any tool runs, naming the contract, the column and what is missing or different, and `mothman check` SHALL fail on the same condition without a database."
      - "THE SYSTEM SHALL add to Emergency Department's contract (assets/quarterly/department-of-health/emergency-department-contract.yaml, the ed_presentations table's age_group column, line 108 at a35066ff) a datacontract quality rule of metric invalidValues whose validValues are the ten bands AGE_GROUPS holds today, in the same order ('0-4', '5-14', '15-24', '25-34', '35-44', '45-54', '55-64', '65-74', '75-84', '85+'), mustBe 0, severity error and dimension conformity - the shape the triage_category and sex rules on the same table already take (Q4 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL give that rule the id quarterly:department-of-health:emergency-department:ed-presentations:age_group:invalidValues_datacontract and the check_id customProperty quarterly.department-of-health.emergency-department.ed-presentations.age_group.invalidValues_datacontract, following its siblings' convention, and the check-lifecycle gate SHALL accept it as a new check_id."
      - "THE SYSTEM SHALL give that rule its lifecycle customProperties as its siblings carry them - introduced_date (as open question 1 settles), changelog '[]', and the authored prose of docs/check-authoring-rules.md: description 'A single unrecognised value fails.' (its tolerance, the rule for an invalid-values check); failure_indicates 'The source system has started emitting a value that was never agreed in the contract, usually a new age banding introduced upstream without notice.' (the dbt accepted_values sibling's wording for the same rule, so one rule reads one way across tools); and no technical_note - and `mothman dashboard validate-check-lifecycle --require-explanations` SHALL pass."
      - "THE SYSTEM SHALL have the statistics read age_group's allowed values from that rule through criterion 1's reader, so that the datacontract-cli check and the recorded value counts read one list."
      - "THE SYSTEM SHALL have the Linkage Products provider's drift planning read a column's known values through the same reader (known_values, assets/quarterly/synthetic/collections/linkage_products.py line 353 at a35066ff) rather than by loading the collection's QA adapter, so that a planned reference folds as the recorded one does."
      - "THE SYSTEM SHALL keep each tool's own copy of a list - the contract's, Soda's and dbt's - as it is, with no gate holding them equal, and SHALL leave the generator's value pools (generator/names_au.py and the providers' own, Emergency Department's AGE_GROUPS draw included) independent of the contract (SPLIT D3)."
      - "THE SYSTEM SHALL have tests, seen failing first, of a value added to a contract list being counted by the next run's statistics, of a column with no list refused before any tool runs, and of an age_group value outside the ten bands failing the new datacontract check."
      - "THE SYSTEM SHALL show through REQ-TEST-239's compare that no recorded statistic, existing verdict or generated byte changes for either asset, and that the only new records are the age_group check's own results; IF any of them is not a pass, or any Emergency Department dataset verdict moves, THEN the build SHALL stop and report each to Keith."
    non_functional_requirements:
      - "PERFORMANCE: the contract is read once per run, not per row or per column; a run is no slower than today beyond one more datacontract rule on one table."
      - "RELIABILITY: a list the statistics cannot find is a named refusal before the tools run, never an empty list that would count every value invalid."
      - "PRIVACY AT REAL SCALE: allowed-value lists (suburbs, postcodes, triage categories, age bands) are reference data, not records; reading them at run time touches no supply row beyond what the statistics already read."
      - "SCALABILITY: a thirtieth collection's adapter declares columns, not lists, so it cannot drift from its own contract."
      - "AUDITABILITY: the new check carries its own check_id, introduced_date and changelog from its first run, so the register and the dashboard can say when age_group started being checked by datacontract-cli."
      - "COST: one more check result per Emergency Department run; no new tool, no new dependency."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-QAC-247"
      - "REQ-QAC-024"
    decisions:
      - "THE THREE PER-TOOL COPIES STAY (SPLIT D3, SETTLED by Keith 2026-11-03): the tool comparison is still running and one or more checks, or a whole tool, will go. REJECTED declaring once with every tool reading, an agreement gate, and one check per rule."
      - "THE ADAPTER READS THE CONTRACT AT RUN TIME (SPLIT D3, SETTLED by Keith 2026-11-03): the contract is the copy that survives whichever tool is dropped. Applies to every collection, not only Civil Registration."
      - "THE GENERATOR'S POOLS STAY INDEPENDENT (SPLIT D3, CHANGED by Keith 2026-11-03): test data need not follow the rule exactly. REJECTED the contract driving the generator."
      - "THE PROVIDER'S known_values IS NOT A POOL (delivery-scoper, 2026-11-03): it mirrors what the statistics record so a planned drift reference has the recorded one's shape (A2, SETTLED by Keith 2026-11-02), so it reads what the statistics read. The pools it draws rows from stay independent."
      - "EITHER DECLARATION IS READ (delivery-scoper): today's contracts use `enum:` (Linkage Products' match_level) and `validValues` (every other list). Both are ODCS the contract already carries; a disagreement between them fails loudly rather than picking one."
      - "AGE_GROUP GETS A REAL RULE, A NEW CHECK (Q4 of 2026-11-14, SETTLED by Keith 2026-11-14, option (b), NOT the recommendation): the ten bands become an allowed-values rule datacontract-cli checks, with its own lifecycle entry, and the statistics read the same list. REJECTED (a) a contract customProperty no tool checks (the recommendation), and (c) a hand copy in the adapter."
      - "AN invalidValues RULE, NOT A FIELD-LEVEL enum: (delivery-scoper, v5, from the code): Keith's answer allowed either. qa_tools/tools/run_datacontract.py records only the quality-rule check types in _QUALITY_CHECK_TYPES (line 44) and drops the schema-derived ones, and a field-level `enum:` carries no customProperties to hold a check_id or lifecycle; so an `enum:` would be checked by the tool and never recorded - Linkage Products' match_level is in that state today. Only the invalidValues form gives the recorded, lifecycled check Q4 asked for."
      - "THE NEW CHECK'S WORDING FOLLOWS ITS SIBLINGS (delivery-scoper, v5): the description states the tolerance, not the purpose, and names no value (check-authoring-rules, 'no enumerated value lists'); failure_indicates is the dbt accepted_values sibling's sentence for the same rule ('say it the same way across tools'). Writing a check's prose is ordinary work, not an authoring-standard change, so Keith reviews it here rather than approving a rule."
      - "NOTHING IS EXPECTED TO FAIL IT (delivery-scoper, v5, checked 2026-11-14): Emergency Department's provider draws age_group only from its own ten bands (assets/quarterly/synthetic/collections/emergency_department.py line 79), and no fault or scenario in generator/ or the providers writes age_group; criterion 12 stops the build if that turns out wrong."
    open_questions:
      - "1 (NEW in v5). THE NEW CHECK'S introduced_date. The date is lifecycle metadata: nothing in the pipeline evaluates a check only after it, so the bootstrap records the new check on every Emergency Department supply from the first. Options: (a) '2013-01-01', its siblings' date and the dbt accepted_values check's on the same column - the history then reads as if datacontract-cli had always checked age_group, which is what the replay records; (b) the build date - honest about when the rule was written, but the dashboard and register would carry results dated years before the check's own introduced_date. RECOMMENDED (a): the recorded results and the date then agree, and the changelog '[]' plus this requirement record when it was actually added."
    signed_off: null

  - id: REQ-PIPE-390
    title: "The order of the dataset statuses is held once, in asset_model/, and the pipeline's, the bootstrap's and the providers' copies read it"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want one definition of which status is worse than which, so that a re-check, a target trial and a planned verdict cannot rank green, amber and red differently from the dashboard."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 4 (SPLIT D4, 2026-11-03, Perth: 'the status order moves into asset_model/'). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14, split risk 6's answer recorded. A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold the order of the dataset statuses (nodata below green below amber below red, dataset_status.ORDERED_STATUSES today) once, in asset_model/, and the pipeline, the bootstrap and the providers SHALL read it there: dataset_status.py line 62, rechecking.py line 117, target_agreement.py line 25 and assets/quarterly/synthetic/collections/linkage_products.py line 345 (unchanged at a35066ff)."
      - "THE SYSTEM SHALL rank green, amber and red in each former copy exactly as it does today, proven by a test of each reader and by REQ-TEST-239's compare."
      - "THE SYSTEM SHALL keep the dashboard page's own copy of the order, held equal to the Python one by status-cases.json's shared cases as today."
      - "THE SYSTEM SHALL have a test that fails WHERE a module outside asset_model/ and tests/ defines its own ranking of the status words, its docstring saying it reads source for an architecture rule with no behaviour to observe."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: proven by REQ-TEST-239's compare for each asset."
      - "MAINTAINABILITY: a new status word is added in one place and the shared cases."
    dependencies:
      - "REQ-PIPE-380"
    decisions:
      - "THE STATUS ORDER JOINS #134 (SPLIT D4, SETTLED by Keith 2026-11-03). REJECTED status order only (without the generator's near-copies), and waiting."
      - "THE PAGE KEEPS ITS COPY (delivery-scoper, from the split overview): the page has no build step and ticketing runs without a browser, so the shared test cases are the agreement."
      - "THE PAGE'S OWN THREE INTERNAL COPIES STAY AS THEY ARE (SPLIT RISK 6, SETTLED by Keith 2026-11-03): RECHECK_RANK, xtStatusCounts' order list and XT_WORD ('No result') are left alone, and the cross-table grid keeps its 'No result' wording. REJECTED reading STATUS_ORDER from both repeats, and one wording everywhere. So this requirement's test (criterion 4) reads Python modules only, never the template."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-391
    title: "The Child Protection provider takes its quarters only from the quarterly calendar, and the geocoding faults' planned verdicts are derived from the bands of the checks they aim at"
    date_written: "2026-11-03"
    story: "As whoever maintains the generator, I want the providers to read the calendar and the check bands rather than restate them, so that a changed calendar date or band moves what the generator plans with it."
    moscow: could
    status: not_started
    source: "Keith, the split overview's decision 4 (SPLIT D4, 2026-11-03, Perth: 'the Child Protection provider reads the quarterly calendar ... the hand-written geocoding verdict table is derived'). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14, split risk 5's answer recorded. A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL remove the Child Protection provider's own statement of the quarterly calendar - _quarter_start, _add_quarters and START_DATE (assets/quarterly/synthetic/collections/child_protection.py lines 240-274 at a35066ff), which nothing reads - so that its quarters come only from the quarterly calendar through asset_model/, as generated_periods and drawn_grown_periods already do."
      - "THE SYSTEM SHALL derive each geocoding row fault's planned verdict (GEO_FAULT_VERDICT, hand-written at linkage_products.py line 138) from the check it is aimed at (GEO_FAULT_AIMS, line 144) and that check's warn and fail bands in check_bands' catalogue, at the size the fault plants."
      - "IF a derived verdict differs from today's table for any fault, THEN the build SHALL stop and report it to Keith rather than accept it."
      - "THE SYSTEM SHALL have a test, seen failing first against the hand-written table, that a changed band moves a fault's derived verdict."
      - "THE SYSTEM SHALL show through REQ-TEST-239's compare that no byte either asset generates changes."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: dead code and a table replaced by its derivation; proven by REQ-TEST-239's compare."
      - "MAINTAINABILITY: a band edited in a check file moves the generator's plan without a second edit."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-GEN-386"
      - "REQ-GEN-298"
    decisions:
      - "THE NEAR-COPIES JOIN #134 (SPLIT D4, SETTLED by Keith 2026-11-03). REJECTED status order only, and waiting."
      - "THE CHILD PROTECTION RESTATEMENT IS DEAD (delivery-scoper, 2026-11-03, re-checked 2026-11-14): a grep of the repository finds no reader of START_DATE, _quarter_start or _add_quarters outside the provider's own definitions; the provider already takes its periods from schedule.periods_for_dataset and periods_for_calendar('quarterly'). So this is a removal, not a rewire, and its round-to-period step is folded by REQ-PIPE-377."
      - "DERIVED THROUGH check_bands (delivery-scoper): the reader Linkage Products already uses for its planned verdicts, and the one D4 names."
      - "THE GEOCODING CHECK FILES STAY HAND-WRITTEN (SPLIT RISK 5, SETTLED by Keith 2026-11-03): each geocoded source's Soda, dbt and contract sections stay their own hand-reviewed artefact, although only three facts differ between sources. REJECTED a template from the three facts, and waiting for a third source. So deriving the planned VERDICTS here derives nothing about the check files themselves."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-392
    title: "The older providers' fault rates in generator/dirty.py are derived at generation time from the warn and fail bands of the checks they aim at, read through check_bands as Linkage Products reads them, and the history they shape is regenerated with every move listed"
    date_written: "2026-11-03"
    story: "As whoever maintains the generator, I want each fault rate that is sized to a check's band to be computed from that band as the check file states it, so that a band changed in a check file moves the planted fault with it and an amber or red supply lands where it was meant to without a second edit."
    moscow: could
    status: not_started
    source: "Keith, the split overview's decision 4 (SPLIT D4, 2026-11-03, Perth: 'the older providers (dirty.py's fault rates) read thresholds through the readers Linkage Products uses'). Drafted by delivery-scoper 2026-11-03 (separation v4); v5 2026-11-14 with Keith's Q5 of 2026-11-14 (derive, not gate). A PROPOSAL, not signed until Keith signs v5."
    acceptance_criteria:
      - "THE SYSTEM SHALL declare, for every fault in generator/dirty.py's presets (apply_birth_registrations_presets and the six apply_cp_*_presets at a35066ff, wherever they sit when this is built), which rule or rules it aims at, by check_bands' rule key, in one table per preset as GEO_FAULT_AIMS does for geocoding faults; the band each rate aims at SHALL no longer be written only in a comment."
      - "WHEN a preset dirties a frame, THE SYSTEM SHALL compute each band-sized fault's size from its aimed rules' warn and fail bands, read through check_bands' catalogue at the frame's own row count (each tool's unit and operator honoured, as check_bands' amber intersection already does), by the rule open questions 1 and 2 settle, and SHALL plant it as open question 3 settles (Q5 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "IF no size lands a fault on the verdict asked on every rule it aims at - an empty band intersection, or a band the frame's row count cannot reach - THEN THE SYSTEM SHALL refuse to generate, naming the preset, the fault, the rules and the bands, rather than plant a size that lands elsewhere."
      - "THE SYSTEM SHALL keep as literals only the preset parameters that are not sized to a check's band - at a35066ff the stale-delivery coin flip (inject_stale_delivery's whole-run rate) among them - each named in this requirement's decisions when built with why it is not band-sized."
      - "THE SYSTEM SHALL keep the amber-by-construction paths of REQ-GEN-184 (targeting.bdm_amber and cp_amber) as they are; this requirement changes the presets they do not replace - every red supply, and a Child Protection amber whose payload holds no cp_clients."
      - "WHEN this is built, THE SYSTEM SHALL regenerate Birth Registrations' and Child Protection's dirty supplies and bootstrap each asset from empty, and SHALL record in evidence every supply whose delivery file changed and every recorded check result, dataset verdict, filing, promotion and decision that moved, each with its old and new value."
      - "THE SYSTEM SHALL re-capture every committed artefact captured from today's generated history that the regeneration moves - at a35066ff tests/fixtures/arrival_semantics_golden.json, SCENARIOS-daily.md and SCENARIOS-quarterly.md (REQ-PIPE-352 criterion 3), and every test or scenario expectation asserting a recorded count or verdict of a regenerated supply - and SHALL account for each moved entry in evidence against the supply or verdict that moved it; IF a moved entry cannot be traced to a moved supply, THEN the build SHALL stop and report it."
      - "IF a scenario or target that today lands on a named verdict (REQ-GEN-186's agreement check) no longer does after regeneration, THEN the build SHALL stop and report it to Keith rather than re-aim the scenario."
      - "THE SYSTEM SHALL have tests, seen failing first against today's literal rates, that a band changed in a check file moves the derived size of the fault aimed at it, that a red fault lands past every aimed rule's fail threshold at the frame's row count, that an amber fault lands inside every aimed rule's amber band, and that an unreachable band is refused (criterion 3) - each on a small frame, with no bootstrap."
      - "THE SYSTEM SHALL NOT add a `mothman check` gate holding literal rates to their bands: the rates are derived, so there is no literal to hold (Q11 of 2026-11-14 with Q5, SETTLED by Keith 2026-11-14)."
    non_functional_requirements:
      - "BEHAVIOUR CHANGES BY DECISION, LISTED: the regenerated history differs from today's by design (Q5 of 2026-11-14); every moved supply and verdict is in evidence, as REQ-GEN-334's regenerated releases were (D1, 2026-11-02), and the pins move only with their causes accounted for (criterion 7)."
      - "REPRODUCIBILITY: the derivation is seeded and deterministic - the same configuration and the same seed give the same bytes - so a later diff of generated output stays a real correctness check (CLAUDE.md: everything is seeded)."
      - "MAINTAINABILITY: a band edited in a check file moves the planted fault without a second edit; a fault with no declared aim fails at generation (criterion 3) rather than silently planting a stale size."
      - "COST: one bootstrap per asset from empty to regenerate (about an hour on this sandbox at the 2026-10-31 measure), and the next hand-started test.yml is a cache miss (about 145 billable minutes at the 2026-11-02 measure); push CI's critical set is unaffected."
      - "PERFORMANCE: reading the catalogue once per generation, not per frame; the bootstrap is no slower by more than 5 percent beyond the regeneration itself."
