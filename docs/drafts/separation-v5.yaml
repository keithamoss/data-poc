      - "PERFORMANCE: callers walking a sequence still read by index, never by walking the sequence per round (REQ-PIPE-321 NFR 1); the bootstrap is no slower by more than 5 percent."
      - "SCALABILITY: at thirty collections on a daily calendar, the participation version is resolved once per slot, not three times."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-376"
      - "REQ-PIPE-321"
    decisions:
