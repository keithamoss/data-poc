#
# Re-scanned at a35066ff, 2026-11-14:
#   asset_model/ closure (asset_time 387, hierarchy 247, schedule 961, slots
#     544, assets 610, agreement 635, config_yaml 226, in_force 39) = 3,649
#     lines (group A of #137 has landed). assets.py's import of
#     qa_tools.collections is now line 575.
#   generator side -> qa_tools: 97 import statements in 13 files.
#   ScheduleConfigError is a subclass of ValueError (schedule.py line 73), so
#     a bare `except ValueError` catches it - load-bearing for Q9.
