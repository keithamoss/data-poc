      - "WHEN schedule.py and slots.py move into asset_model/ (REQ-PIPE-380), THE SYSTEM SHALL rename slots.claim_window (line 234 at a35066ff, the widest window a dataset has ever had) to slots.widest_claim_window, keeping schedule.claim_window (line 757, the window in force on a date) as it is, and rewrite every caller in the same change."
      - "WHEN they move, THE SYSTEM SHALL rename slots._calendar_periods (line 366, a dataset's period sequence, 18 uses outside slots.py) to the public slots.period_sequence, and schedule._calendar_periods (line 569, an authored calendar's periods, one caller) to schedule._authored_periods."
      - "THE SYSTEM SHALL give a public name to every asset_model function, class or constant used outside its own module - at a35066ff schedule._agreement (29 uses outside schedule.py), slots._calendar_periods (18), slots._participation_for (4), hierarchy._require (4), schedule._as_date (3), slots._timing, schedule._parse_version, schedule._load, schedule._files_go_to_period_errors and hierarchy._from_text - and no module outside asset_model/ or tests/ SHALL use an underscore-led asset_model name. schedule._version_in_force (3 uses) is removed by REQ-PIPE-378 criterion 1 rather than renamed; whichever lands first, it is not left private and used."
      - "THE SYSTEM SHALL move slots.fall_hold (line 477) into asset_model's assignment module beside assign, its one caller (assignment.py line 232)."
