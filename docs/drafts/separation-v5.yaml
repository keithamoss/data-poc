      - "A DISAGREEMENT IS KEITH'S, NOT THE BUILDER'S (delivery-scoper, under #137's rule that anything changing behaviour is his): #137 noted one of the three 'supplies in round R' copies is narrower than the others and did not confirm it is reachable, so criterion 5 checks first. v5 names the likely narrow one (round_of's month test) without confirming it is reachable."
