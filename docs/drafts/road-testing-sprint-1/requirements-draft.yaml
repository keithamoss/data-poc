# DRAFT - road-testing sprint 1, "where do I put my effort?" (plans/road-testing.md
# #1 and #2), scoped by delivery-scoper 2026-10-14 from the sprint line, entries
# #1 and #2 in full, and Keith's answers of 2026-10-06 and 2026-10-13.
# REVISED 2026-10-14 (~17:00 Perth) to fold in Keith's answers to Q1-Q8, and
# again (~17:30) to fold in his answers to NQ1-NQ3, the delivery-dashboard-ux
# review (S1-S3, G1-G6, minors, Q1-Q5) and the delivery-architect review (B1,
# H1-H3, M1-M5, L1-L6, Q2-Q3) - see summary.md.
# A PROPOSAL for Keith's sign-off, not a settled requirement. Nothing here is in
# requirements.yaml. Criteria are numbered as before: a criterion that changed
# meaning was rewritten in place, and new ones are appended.
# The turned-off clauses left this draft for a proposed amendment of signed
# REQ-DASH-180 (summary.md, "Amendment to REQ-DASH-180").
# REVISED again 2026-10-14 evening to fold in Keith's answers at the sign-off
# readiness check: collection headings get the count AND the trend (226), zero
# parts are kept ("2 red, 0 amber"), the drafted wording is approved, and the
# four judgement calls are confirmed. No open question remains.
requirements:
  - id: REQ-DASH-224
    title: "One function decides whether a column or a check is red, amber, green or not counted on a QA run, and every count and trend line uses it"
    date_written: "2026-10-14"
    story: "As a data team leader reading any count or trend of what is not green, I want red and amber counted the same way everywhere - per check, per column and per check section - so that a count and the line beside it never disagree, and red and amber can be told apart in every one of them."
    moscow: must
    status: not_started
    source: "Keith, plans/road-testing.md #1 (a trend drawn in two places measuring two different things, neither labelled) and #2 (Tier 1 and Tier 2 say whether there is a problem, never how big), road-testing sprint 1; his answers of 2026-10-06 and 2026-10-13, to sprint-1 Q1-Q8 and NQ1-NQ3 on 2026-10-14, and to the delivery-architect review's questions the same evening. Drafted by delivery-scoper 2026-10-14; reviewed by delivery-architect and delivery-dashboard-ux 2026-10-14. Builds on the Trend defect fix recorded as post-build-review #181 (commit cf060e9), which Keith chose on 2026-10-14 to fix separately and first."
    acceptance_criteria:
      - "THE SYSTEM SHALL decide, in one function in the dashboard page, how a single check counts on a given QA run: a non-retired check whose verdict recorded on that run is red SHALL count as red, amber as amber, green as green, and any other check - inactive ('No rule defined'), no data ('not run for this period'), or with no entry recorded on that run - SHALL count as none of them and SHALL be left out of every total for that run, as post-build-review #181's fix already does for today's Trend line. A check's verdict SHALL NOT be carried forward from an earlier run."
      - "THE SYSTEM SHALL count a check by the verdict its tool recorded, so that a check recorded red because it could not be evaluated counts as red."
      - "THE SYSTEM SHALL decide, in that same function, how a column counts on a QA run: red if any of its counted checks is red, otherwise amber if any is amber, otherwise green if any is green, and not counted if none of its checks is counted."
      - "THE SYSTEM SHALL treat each check section that belongs to no column - 'Supply-level checks', 'Table-level checks' and 'Cross-table checks' - as one more column under the rule in criterion 3, named by its section heading, and SHALL find those sections by each entry's own scope field (COLUMN_SCOPES), never by matching a display name."
      - "THE SYSTEM SHALL read only the dataset's columns and check sections (ds.columns), never its file checks (fileChecks), so that no file-check verdict enters any count or trend these requirements add, as REQ-DASH-097 criterion 2 requires."
      - "THE SYSTEM SHALL return, for each QA run in scope, keyed by that run's run_id and not by its date, the number of counted units, the number red and the number amber, so that every caller can draw red and amber as separate series and two runs on one day stay two points."
      - "THE SYSTEM SHALL draw every column-level and check-level trend line, and compute every red, amber and not-green count of columns or checks that REQ-DASH-225 and REQ-DASH-227 add, from that function; and SHALL compute every count and trend of datasets that REQ-DASH-226 adds from one function, datasetStatusesOn(date), taken out of buildData() so that the dataset pills and those counts are worked out by the same code."
      - "IF no unit in scope is counted on a QA run, THEN THE SYSTEM SHALL leave that run out of the lines entirely, and SHALL NOT plot it as 0% or as 100%; so a supply received but held and never checked - such as a cp-case-workers delivery in a month it owes nothing in, carrying only 'No rule defined' placeholders - adds no point."
      - "IF a check carries a status the page does not recognise, THEN THE SYSTEM SHALL refuse it as recognisedStatus() already does, and SHALL NOT count it either way."
      - "THE SYSTEM SHALL have tests-js tests, written first and seen to fail against the code as it stands after post-build-review #181, covering four cases: a column with one amber and one red check counts as one red column; a column whose only check is inactive is not counted; a supply-level section with one red check counts as one red unit named 'Supply-level checks'; and a run with one red, one amber and one green column returns 3 counted, 1 red and 1 amber. At least one of them SHALL drive the dataset list row's drawn trend through the page's existing entry point rather than the new function by name, so that it fails on behaviour and not merely because the function does not yet exist: for a dataset whose one column has an amber and a red check beside a green column, the red line SHALL sit at 50% and the amber line at 0%, where today's line plots 2 of 3 checks failing."
      - "THE SYSTEM SHALL compute all of this in the page from the check histories the build already embeds, SHALL add nothing to the embedded data, and SHALL NOT read supply rows."
      - "THE SYSTEM SHALL take a dataset's trend points from the QA runs in place or awaiting a decision on the date on show - the runs clipDatasetToInPlaceOn() already uses for the pill, so that a supply withdrawn by that date contributes no point - and SHALL end every line at the newest of them that criterion 8 does not leave out, so that the line's last point and the count beside it are worked out from the same run."
      - "THE SYSTEM SHALL leave retired checks out of every point, past points included, as the column pills and today's Trend line already do."
    non_functional_requirements:
      - "THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else. Everything here is computed in the browser from histories already embedded."
      - "ONE ANSWER: one counting function per unit in the page - unitCounts for columns and checks, datasetStatusesOn for datasets. plans/qa-pipeline.md item 74 found four status implementations that had drifted, one of which rendered a check with 14 violations green. A second counter per tier would recreate that."
      - "TEST-FIRST: criterion 10's tests must be seen red against the code as it stands after post-build-review #181, and at least one of them for a behavioural reason (M4 of the delivery-architect review), before this lands."
      - "PERFORMANCE: one pass over each in-scope check's history per render. At about 30 datasets with about 50 columns of about 5 checks each, that is tens of thousands of entries, well inside the 400ms Doherty threshold (docs/hci-ux-psychology.md). Measure it once on the built page rather than assume. The dataset-level function is the expensive one and REQ-DASH-226 carries its budget."
      - "MAINTAINABILITY: no Python twin. qa_tools/common/dataset_status.py mirrors the status vocabulary because Python consumers need it, and it knows nothing of blockers, missing supplies or refusals, so it could not compute datasetStatusesOn anyway. Nothing in Python shows these counts."
    dependencies: []
    decisions:
      - "THE TREND DEFECT IS FIXED SEPARATELY, FIRST (Keith, 2026-10-14). delivery-scoper found while scoping that aggregateFailureSeries() counted every status other than 'green' as failing, so inactive placeholders and recorded 'nodata' entries counted as failures, and every Child Protection dataset plotted a non-zero share with no amber or red verdict (cp-notifications 2 of 45 against 0 of 43 verdicts). Keith chose to fix it now, test-first, as a post-build-review defect: post-build-review #181, done 2026-10-14 in commit cf060e9, tests-js/trend-counts-only-verdicts.test.js. This requirement builds on that fix rather than being it. SUPERSEDES the first draft's 'its own requirement, not a quiet bug fix'."
      - "ONE FUNCTION DECIDES NOT GREEN (proposed by delivery-scoper, kept after Keith's answers). REJECTED a counting helper per tier, on item 74's lesson."
      - "RED AND AMBER ARE RETURNED SEPARATELY (Keith, 2026-10-14, sprint-1 Q2). He asked for red and amber as two trend lines, so the function returns both counts per run rather than one not-green share."
      - "A COLUMN COUNTS ONCE, AT ITS WORST CHECK (Keith, 2026-10-14, sprint-1 Q2). A column with one amber and one red check is one red column, consistent with how the column tile's pill already rolls up."
      - "CHECK SECTIONS COUNT AS COLUMNS (Keith, 2026-10-14, sprint-1 Q3). Supply-level, table-level and cross-table sections each count as one unit, named by the section heading the dataset page already shows. REJECTED the recommended separate worded line for sections, and REJECTED counting real columns only."
      - "FILE CHECKS ARE OUT OF EVERY COUNT AND TREND IN THIS SPRINT (Keith, 2026-10-14, NQ1: 'Let's separate this and scope it separately - I do think they need to display through all levels of the dashboard, but just not sure how yet'). REJECTED both NQ1 options - leaving them out for good, and counting a 'File checks' column, which would have amended signed REQ-DASH-097 criterion 2 and put an amber count beside a green pill. REQ-DASH-097 is untouched; how file-check verdicts surface at every level is plans/running-thoughts.md #96. Criterion 5 is the delivery-architect review's L1 wording: file checks sit beside the columns (fileChecks), never inside them, so leaving them out costs nothing."
      - "A CROSS-TABLE SECTION COUNTS ONCE PER DATASET IT IS FILED UNDER (delivery-scoper, 2026-10-14, following Q3). The section is already in each participating dataset's columns and already folds into each one's status (Keith, 2026-09-26, 'counts against both'). So each such dataset counts one 'Cross-table checks' unit. Deduplication by check_id matters only when one figure spans several datasets, and since Q4 the agency card counts datasets, not checks, so no figure here does."
      - "RATE IN THE LINE STANDS (Keith, 2026-09-17, plans/qa-pipeline.md #60). Units get introduced and retired, so the denominator moves. Each line is a share of that run's counted units."
      - "ONLY A CHECKED RUN IS A POINT (Keith, 2026-10-14, delivery-architect review Q2). Asked whether a check with no result on a run should carry its last verdict forward (A) or be left out (B), Keith asked 'how could it have no result?'. Checked against the built reports: 10 runs of 208 were received and never checked - 9 Child Protection (8 cp-case-workers deliveries in months it owes nothing in, 1 cp-clients) and 1 Birth Registrations - each carrying only 'No rule defined' placeholders; otherwise a check added later simply has no earlier history. His answer: no point for a run that was never checked. REJECTED carrying verdicts forward onto such a run (the review's H1 proposal), which would have drawn a point for a supply nobody checked."
      - "WHY THE COUNT AND THE LAST POINT AGREE, AND WHAT GUARDS IT (delivery-scoper, 2026-10-14, from the review's H1). The pill takes each check's newest recorded entry among the eligible runs (clipDatasetToInPlaceOn), which carries a verdict forward; the line counts each checked run on its own entries. The two agree because the only checks with entries on a never-checked run are 'No rule defined' placeholders, which are inactive on every run, and because no check in the built reports has a gap between its first and last checked run (0 gaps across both collections, 2026-10-14). If a gap ever appears, REQ-DASH-225 criterion 18 and REQ-DASH-226 criterion 12 assert that each line's last point equals the count, so it goes red rather than drifting. REJECTED carrying forward within checked runs to make agreement unconditional, which Keith's Q2 answer did not ask for. Confirmed by Keith, 2026-10-14, at the sign-off readiness check."
      - "POINTS ARE KEYED BY RUN, NOT BY DATE (delivery-architect review M2). Today's aggregateFailureSeries() keys on h.date, so two runs on one day are summed into one point. A resupply on the day of its original is exactly the case worth seeing."
      - "POINTS COME FROM THE RUNS IN PLACE OR AWAITING (delivery-architect review M1). The first draft said 'including supplies later withdrawn', which contradicts how the pill clips a dataset to the date on show. A withdrawn supply is not the dataset's verdict, so it is not a point either."
      - "RETIRED CHECKS STAY OUT OF PAST POINTS TOO (Keith, 2026-10-14, delivery-architect review Q3, option A). Column pills (buildRealDataset) and today's Trend line already leave retired checks out at every date, so the line agrees with the pill. KNOWN DIVERGENCE, accepted: the supply-history per-run pill (datasetStatusByRun, and qa_tools/common/dataset_status.py's status_by_run) includes them, so a past run's own pill can be red for a check since retired while that run's trend point is not. REJECTED including retired checks in historical points (option B), which would make the line disagree with every pill beside it."
      - "TWO COUNTING FUNCTIONS, ONE PER UNIT (delivery-architect review H2, following Keith's NQ2 B). With the agency card judging each dataset's full status as of each date, 'one function' cannot cover datasets: a dataset's full status needs blockers, missing supplies and refusals, which only buildData() works out. So criterion 7 names two - the unit counter for columns and checks, and datasetStatusesOn(date) taken out of buildData() for datasets. REJECTED precomputing dataset statuses in Python (dataset_status.py knows no blockers, missing supplies or refusals) and REJECTED a second dataset-status routine beside buildData()."
      - "SHAPE OF THE CODE (delivery-architect review, advisory, not acceptance): one pure unitCounts(columns, runIds); one twoLineSparkline(series, {quiet, label}) shared by every tier; datasetStatusesOn(date); rollup()'s live filter lifted into a named predicate; the 0.05 floor and the endpoint-dot code removed."
      - "NO PYTHON TWIN (proposed by delivery-scoper, confirmed by the delivery-architect review L6). If a Python consumer ever shows these counts, the rule joins status-cases.json's parity cases then. REJECTED adding a twin speculatively."
    open_questions: []

  - id: REQ-DASH-225
    title: "The dataset list says how many columns are not green, how many red and how many amber, where Trend sits now, with small red and amber trend lines beside it"
    date_written: "2026-10-14"
    story: "As a data team leader with about thirty datasets on the quarterly asset, I want each row of a collection's dataset list to say how many of its columns are not green, how many of those are red and how many amber, beside small red and amber lines that say what they plot, so that I can rank the red datasets and see which way each is heading without opening them one at a time."
    moscow: must
    status: not_started
    source: "Keith, plans/road-testing.md #2 and #1, road-testing sprint 1. His 2026-10-06 answer to #2: 'the dataset list counts failing COLUMNS, in its own column where Trend sits today'. His 2026-10-13 answer on where Trend goes: 'a small labelled one kept in the dataset list beside the count' (commit 6f35083). His answers to sprint-1 Q1, Q2, Q3 and Q6, to NQ1, and to the delivery-dashboard-ux review's Q1, Q2 and Q4, all on 2026-10-14. Drafted by delivery-scoper 2026-10-14; reviewed by delivery-architect and delivery-dashboard-ux 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL replace the agency tier's dataset-list column headed 'Trend' with a column headed 'Columns not green', in the same position, and SHALL carry the unit only in that header, never repeated on each row."
      - "THE SYSTEM SHALL show, as a .legend-key line directly above each collection's dataset table, one key reading: 'Columns not green — <solid red line sample> red · <dotted amber line sample> amber, share of columns on each QA run. Supply-level, table-level and cross-table checks each count as one column.' Wording approved by Keith, 2026-10-14, at the sign-off readiness check."
      - "WHILE a dataset's row is its ordinary row - not one of the single reason rows for a blocked dataset, a period closed with no supply, an ended schedule or no QA run within tolerance - THE SYSTEM SHALL show in that column, in bold, '<N> of <M>', where M is the dataset's units that REQ-DASH-224 counts on the newest checked run on the date on show and N is those that are red or amber."
      - "WHERE N is above 0, THE SYSTEM SHALL say beneath the count, in muted text, how many units are red and how many amber - '2 red, 1 amber' - always giving both numbers and never leaving out a part whose number is 0, so that a dataset with only red reads '2 red, 0 amber'."
      - "WHERE a check section counted as a column is red or amber, THE SYSTEM SHALL name it at the end of that same line - '2 red, 1 amber · incl. Supply-level checks', several sections joined by commas - so that a reader can see that a section, not a table column, is among them. Wording approved by Keith, 2026-10-14, at the sign-off readiness check."
      - "WHERE N is 0 and M is above 0, THE SYSTEM SHALL read 'All <M> green', and SHALL NOT show a bare 0."
      - "WHERE a dataset is red or amber for a reason other than its checks - a supply waiting for a person, or a period closed with no supply - THE SYSTEM SHALL keep that reason in words on the same row, as noSupplyNote() does today, so that the count is never the only text beside a red it does not explain."
      - "THE SYSTEM SHALL show to the right of the count's text two small trend lines of the same units: the share of counted units that were red, and the share that were amber, on each checked QA run up to the date on show (REQ-DASH-224 criteria 8 and 12)."
      - "THE SYSTEM SHALL tell the two lines apart by line style as well as colour: red as a solid line, amber as a dotted line with round caps (dash pattern 1.5,2.5), drawn in --bad and --warn respectively. The key SHALL be the line criterion 2 adds, not one per row, and the lines SHALL NOT rely on colour alone (REQ-DASH-070 criterion 6)."
      - "THE SYSTEM SHALL draw every row's lines on the same fixed scale, 0% to 100% of counted units, so that rows can be compared, and SHALL NOT use a floor that makes an all-green history look like a low, non-zero value."
      - "THE SYSTEM SHALL end both lines at the newest checked QA run among the runs the row's pill reads (REQ-DASH-224 criterion 12), so that the lines' last point and the count beside them state the same thing."
      - "THE SYSTEM SHALL give the pair of lines one accessible name that states what they plot, the date range and the latest values in words, for example 'Columns red and amber on each QA run, 12 runs from 1 Feb 2023 to 1 Aug 2026; latest 2 red and 1 amber of 15'. That name SHALL replace today's 'aggregate failing-check trend sparkline'."
      - "THE SYSTEM SHALL draw no endpoint dot, since the count beside the lines already states where the dataset stands; and tests-js/sparkline-endpoint.test.js's endpoint-dot assertions SHALL be removed in the same change, keeping any assertion in it that still guards live code (such as statusColorVar() never defaulting to green) and rewriting its quiet-state cases for criterion 14."
      - "WHILE a dataset is in a quiet state (no data, exhausted or inactive, post-build-review #57), THE SYSTEM SHALL still draw both lines, in neutral ink and told apart by line style alone, so that history stays visible without colour making a claim about the present."
      - "THE SYSTEM SHALL compute the count and the lines as at the date on show (the in-place-on date), from the same column statuses the row's pill rolls up, so that choosing a different date changes them and a cold-loaded link to a past date shows that date's figures."
      - "WHILE the current period is one a dataset owes nothing in by participation or not_expected (REQ-DASH-182 criterion 15, which already holds on today's page), THE SYSTEM SHALL show the count and lines for the supply in place, just as its pill shows that supply's verdict. The turned-off case is REQ-DASH-180's, by the proposed amendment in summary.md."
      - "THE SYSTEM SHALL have tests-js tests, written first and seen to fail, covering four cases: a dataset whose only red is a supply-level check reads '1 of <M>' and '1 red, 0 amber · incl. Supply-level checks'; a dataset whose units are all green reads 'All <M> green'; the drawn red and amber lines for a two-run history sit at the shares REQ-DASH-224 returns on the fixed scale; and a history green on every run draws no stroke in the red or amber colour."
      - "THE SYSTEM SHALL have a real-browser test against the built dashboard. For every real dataset on an ordinary row, at the build's own date and at one earlier date, the test SHALL check that the red count equals the column tiles and check sections on the dataset's page whose pill is red, that the amber count likewise matches amber, that M equals the tiles and sections showing one of the three verdicts, and that the lines' last point (from their accessible name) equals the count. It SHALL assert first that at least one dataset has N above 0, so that it cannot pass with every count at zero."
      - "THE SYSTEM SHALL draw a neutral 0% baseline in --line-strong under every pair of lines, and SHALL draw the red or amber series in its colour only along stretches where that series is above 0%, so that a dataset green on every run shows no red or amber pixel."
      - "THE SYSTEM SHALL draw every two-line trend these requirements add with vector-effect='non-scaling-stroke' and a stroke of at least 1.5px, so that the box's non-uniform stretching (.spark is width:100% with preserveAspectRatio='none') does not distort the stroke or the dotted pattern."
      - "WHERE M is 0 on the date on show on an ordinary row, THE SYSTEM SHALL show 'No column has a verdict on this date' in faint ink in place of the count, SHALL NOT read 'All 0 green', and SHALL draw no red or amber pixel; any history SHALL still be drawn in neutral ink under criterion 14."
      - "WHERE a dataset has fewer than two checked QA runs up to the date on show, THE SYSTEM SHALL draw no lines, showing 'One QA run so far' in faint ink where it has exactly one."
      - "WHILE a row is one of the single reason rows criterion 3 names, THE SYSTEM SHALL keep its reason spanning the new column as it spans the Trend column today, with no count and no lines."
    non_functional_requirements:
      - "SCALE (CLAUDE.md, about 30 datasets on the quarterly asset). This is the requirement that makes the list rankable: one count per row, red and amber stated, and lines on one shared scale so that the eye can compare thirty rows. A line auto-scaled per row would let 3% and 90% look the same height."
      - "LEGIBILITY AT SPARKLINE SIZE: the lines sit in today's roughly 180 by 28 pixel box, to the right of the count's text. On a fixed 0-100% scale, one unit in fifteen is about 2 pixels above the baseline, so small values are deliberately quiet - the count and the accessible name carry the exact figure. Where the two lines coincide, red is drawn on top. The dotted amber pattern must stay distinguishable at that size, and is checked once by eye on the built page in both themes."
      - "CONTRAST (delivery-dashboard-ux review G2): the amber series uses --warn, not --warn-fill, and must reach at least 3:1 against the surface in both light and dark themes (light --warn-fill on white is about 2.7:1, and dark --bad against --warn-fill is about 1.1:1 in lightness). Red and amber must remain distinguishable in a greyscale capture of the built page, which the solid/dotted pattern carries. Checked once by the post-build critic."
      - "ACCESSIBILITY, NEVER COLOUR ALONE (REQ-DASH-070 criterion 6). Red and amber are stated in words in the count, distinguished by line style as well as colour in the lines, and given in full in the accessible name. The dataset page's 'View as table' (REQ-DASH-227) carries both full series."
      - "REUSE, NO NEW VOCABULARY: the count is plain text (bold N of M, muted red/amber line), not a new chip or pill; the key reuses .legend-key; the lines come from the one two-line sparkline function every tier shares."
      - "THE BUILD RULE: computed in the page from recorded results the build already embeds, with no supply rows and no new embedded data."
      - "AS-OF CORRECTNESS: every figure is judged on the date on show, like the pill beside it. A test at a past date is required (the real-browser criterion), not just at the build's own date."
      - "COMPATIBILITY: no new asset, so file:// and offline viewing are unaffected. A phone is not a target (post-build-review #16), and the column should be no wider than the Trend column it replaces plus one line of text."
      - "PERFORMANCE: no new embedded data, and the count is one pass over the dataset's checks. The built page's load and agency-tier render time should not move measurably. Check once, not budgeted."
      - "OBSERVABILITY: CHANGELOG.yaml-worthy - a visible change to the main triage table."
    dependencies:
      - REQ-DASH-224
      - REQ-DASH-070
    decisions:
      - "COLUMNS, NOT CHECKS, IN THE DATASET LIST (Keith, 2026-10-06, answering #2; confirmed 2026-10-14, sprint-1 Q1). #2's own reasoning: a single bad column can carry several failing checks, so a check count overstates how many things are actually wrong."
      - "IN ITS OWN COLUMN, WHERE TREND SITS TODAY (Keith, 2026-10-06, answering #2). REJECTED #2's other options, the count beside the pill or the count inside the pill."
      - "A SMALL LABELLED TREND STAYS IN THE LIST BESIDE THE COUNT (Keith, 2026-10-13, commit 6f35083). This refines his 2026-10-06 answer to #1, which had the dataset list show the count 'instead' of the sparkline. REJECTED removing the list's trend entirely."
      - "THE LINES MEASURE WHAT THE COUNT BESIDE THEM COUNTS (Keith, 2026-10-14, sprint-1 Q1). #2 warned that a number beside the unlabelled trend 'risks two unexplained figures instead of one'. REJECTED a checks-based line beside a columns count, and REJECTED showing both a columns and a checks count in the row."
      - "RED AND AMBER AS TWO LINES (Keith, 2026-10-14, sprint-1 Q2 - 'maybe have separate lines for red vs orange', clarified as two series). REPLACES the first draft's single not-green line. Each column counts once, at its worst check, so red plus amber never exceeds 100%."
      - "THE ROW READS '3 OF 15' IN BOLD, '2 RED, 1 AMBER' BENEATH, UNIT ONLY IN THE HEADER (Keith, 2026-10-14, delivery-dashboard-ux review Q1, option A). 'Columns not green' is the header, the all-green row reads 'All 15 green', and the lines sit to the right of the text. REJECTED option B, the unit repeated on every row ('3 of 15 columns not green'), which at thirty rows is thirty copies of a word the header already says. SUPERSEDES the first draft's '<N> of <M> columns not green' on each row."
      - "BOTH COUNTS, ALWAYS - '2 RED, 0 AMBER' (Keith, 2026-10-14, sign-off readiness check). Every red/amber line these requirements add gives both numbers, a zero included. REJECTED delivery-scoper's drafted rule of leaving out a zero part ('2 red'), which had not been asked before. Applies equally to REQ-DASH-226's '<r> red, <a> amber', which is worded as criterion 4 words it."
      - "AMBER DOTTED WITH ROUND CAPS, RED SOLID (Keith, 2026-10-14, delivery-dashboard-ux review Q2, option A). Dashed already means something on the same page: on a check's chart, amber and red dashed lines are the warn and fail thresholds and a grey dashed connector is 'did not report' (trendChart()). REJECTED option B, dashed amber, which the first draft had."
      - "THE KEY IS A .legend-key LINE ABOVE EACH COLLECTION TABLE (Keith, 2026-10-14, delivery-dashboard-ux review Q4, option A). It carries the line samples and the sentence saying what counts as a column, the same sentence under the dataset page trend's title (REQ-DASH-227). REJECTED option B, the key in the column header, which the first draft had alongside a separate one-line note - too much for a table header cell. SUPERSEDES the first draft's header note 'Supply, table, cross-table and file checks each count as one', which also named file checks before NQ1 took them out."
      - "NO RED OR AMBER PIXEL FOR A GREEN HISTORY (delivery-dashboard-ux review S1). On a fixed 0-100% scale both series sit at 0% for an all-green history, and with red drawn on top every row would carry a red line along its bottom. A neutral baseline, with colour only where a series is above 0%, removes it."
      - "NON-SCALING STROKE (delivery-dashboard-ux review S2, delivery-architect review L3). .spark stretches to width:100% with preserveAspectRatio='none', so a stroke or dot pattern drawn in viewBox units distorts. Column tiles are about 16px tall, not 28 (REQ-DASH-227 carries that size)."
      - "NOTHING TO COUNT READS AS NOTHING TO COUNT (delivery-dashboard-ux review S3). 'All 0 green' is a false green in words. DECLINED the review's 'no lines' for that case where history exists: Keith's rule for quiet states is 'no red amber and greens... but I should still be able to see the historical graphs' (post-build-review #57), so the history stays, in neutral ink. Confirmed by Keith, 2026-10-14, at the sign-off readiness check."
      - "SOLID RED, DOTTED AMBER, ONE KEY PER TABLE (delivery-scoper, 2026-10-14, as amended by the review answers). Line style is what keeps the two series apart without colour (REQ-DASH-070), and one key per table rather than one per row keeps thirty rows quiet. REJECTED a text label on each row's lines, which does not fit a 28-pixel box."
      - "NO ENDPOINT DOT (delivery-scoper, 2026-10-14). Today's single dot coloured the run's worst status. With two coloured lines it would be a third mark in the same box saying what the count already says. In a quiet state both lines go neutral, which carries post-build-review #57's rule that only a claim about the present goes quiet: here, the colour is that claim. tests-js/sparkline-endpoint.test.js asserts the dot and goes with it (delivery-architect review M5; CLAUDE.md, a test goes when its behaviour goes)."
      - "CHECK SECTIONS COUNT AS COLUMNS, AND THE ROW SAYS SO (Keith, 2026-10-14, sprint-1 Q3). '15' on a 14-column table is accepted, and explained twice: the key line says sections count as one each, and any section that is red or amber is named in the row's red/amber line. REJECTED the recommended separate section line."
      - "ONE FIXED 0-100% SCALE (Keith, 2026-10-14, sprint-1 Q6). Rows compare by eye. The 0.05 floor in aggregateSparkline() goes with it: it existed only to avoid dividing by zero on an all-green history, and it pinned that history above the baseline as a low, non-zero-looking line."
      - "NAMED IN PLACE, NOT A DIFFERENT TREATMENT. #1 left open whether the aggregate line is named in place or replaced. Keith's 2026-10-13 answer keeps it in the list, labelled. What makes thirty rows readable is a stated measure and one shared scale, not a different chart."
      - "THE LINES ARE PER CHECKED QA RUN (delivery-scoper, not asked, unchallenged at Keith's 2026-10-14 answers; corrected by the delivery-architect review M1 and Keith's answer to its Q2). Each point is a checked supply among the runs in place or awaiting on the date on show, resupplies included; a supply withdrawn by that date, or never checked, is not a point. The key says 'each QA run'. REJECTED plotting one point per period's supply in place in this sprint, which would be a different series rather than a labelling change. SUPERSEDES the first draft's 'including supplies later withdrawn'."
      - "THE TURNED-OFF CLAUSE MOVES TO REQ-DASH-180 (Keith, 2026-10-14, delivery-architect review B1, option b). 'Turned off' does not exist in the page yet - REQ-DASH-180 is signed but not built - so a criterion about it here could be neither built nor seen failing first. The owes-nothing half of the old criterion 16 stays, because REQ-DASH-182 criterion 15 already holds on today's page. REJECTED option a, building sprint 1 after REQ-DASH-180. REQ-DASH-180 and REQ-DASH-182 leave this requirement's dependencies accordingly."
      - "SORTING BY RED COUNT IS NOT IN SPRINT 1 (delivery-scoper, 2026-10-14, at the main session's direction to leave it out unless trivial). It is not trivial: the dataset list's order today is the hierarchy's, and a sort changes what 'the third row' means in every link, test and screenshot. A count invites a sort, so it is worth raising again - suggested as a plans/running-thoughts.md entry for a later sprint."
    open_questions: []

  - id: REQ-DASH-226
    title: "Agency cards, and each collection heading on the agency tier, say how many datasets are not green, how many red and how many amber, with small red and amber trend lines on both"
    date_written: "2026-10-14"
    story: "As a data team leader landing on the Agencies page, I want each agency card to say how many of its datasets are not green, split into red and amber, beside a small weekly trend of the same, so that I can tell how many places in an agency need me, and whether that is growing, before I open it."
    moscow: must
    status: not_started
    source: "Keith, plans/road-testing.md #2 and #1, road-testing sprint 1. His 2026-10-13 answer: 'Tier 1 ROLLS THE COUNT UP onto agency cards' (commit 1ac13eb). His answers to sprint-1 Q4 (count datasets, not checks), Q5 (keep a small labelled trend), NQ2 (full status as of each date) and NQ3 (two lines), to the delivery-dashboard-ux review's Q3 and Q5, and to the delivery-architect review's B1, all on 2026-10-14. Drafted by delivery-scoper 2026-10-14; reviewed by delivery-architect and delivery-dashboard-ux 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL show on each agency card on the Agencies tier a line reading '<N> of <M> datasets not green' where the card's rollup leaves none of its datasets out, and '<N> of <M> counted datasets not green' where it leaves some out; and, where N is above 0, beneath it '<r> red, <a> amber' worded as REQ-DASH-225 criterion 4 words it. M SHALL be the agency's datasets that the card's own colour rollup counts on the date on show, and N those of them whose own status is red or amber."
      - "THE SYSTEM SHALL judge each dataset in that count by the same status its own pill shows on the date on show, worked out by datasetStatusesOn(date) (REQ-DASH-224 criterion 7), including a red or amber that comes from something other than its checks, such as a supply waiting for a person or a period closed with no supply."
      - "THE SYSTEM SHALL leave out of N and M every dataset the rollup leaves out - today no schedule agreed, schedule ended and no data - by one named predicate lifted out of rollup()'s own filter and used by both, and WHERE the card shows a line saying which datasets are not counted (today's notCountedMarker(), and REQ-DASH-180 criterion 10's line once built), SHALL place the count line directly above it."
      - "WHERE N is 0 and M is above 0, THE SYSTEM SHALL read 'All <M> datasets green' ('All <M> counted datasets green' where some are left out), and SHALL NOT show a bare 0."
      - "THE SYSTEM SHALL show beneath each collection's heading on the agency tier the same count line and the same small two-line weekly trend as the agency card, worked out over that collection's counted datasets by the same predicate and datasetStatusesOn(date): criteria 1 to 4, 6 and 7 to 10 apply to the heading as to the card, the trend's label reads as criterion 8's, and its grid starts at the first week in which any of the collection's datasets had a QA run."
      - "WHERE a group's status is 'Not counted' (post-build-review #135), or M is otherwise 0, on an agency card or a collection heading, THE SYSTEM SHALL show no count line, and SHALL NOT show '0 of 0 datasets not green'; its trend SHALL still be drawn, in neutral ink with its label, where there are at least two points."
      - "THE SYSTEM SHALL keep a small trend on the agency card, in place of today's aggregate sparkline, plotting the share of the card's counted datasets that were red and the share that were amber as two lines - red solid, amber dotted, on the fixed 0-100% scale, with REQ-DASH-225's neutral baseline and non-scaling stroke (REQ-DASH-225 criteria 9, 10, 19 and 20)."
      - "THE SYSTEM SHALL label that trend visibly on the card, reading 'Datasets red and amber, each week', and SHALL give it an accessible name stating its measure, date range and latest values in words, for example 'Datasets red and amber each week, 40 weeks from 3 Jan 2026 to 10 Oct 2026; latest 1 red and 1 amber of 6'. Wording approved by Keith, 2026-10-14, at the sign-off readiness check."
      - "THE SYSTEM SHALL plot the card's trend on a weekly grid whose last point is the date on show and whose earlier points step back seven days at a time to the first week in which any of the agency's datasets had a QA run, judging each dataset at each point by its full status as of that date through datasetStatusesOn(date), as a share of the datasets counted on that date - so that the line ends at the card's count by construction."
      - "THE SYSTEM SHALL compute the count as at the date on show, from the same dataset statuses the card's pill rolls up, so that a cold-loaded link to a past date shows that date's figures."
      - "THE SYSTEM SHALL have a tests-js test, written first and seen to fail, in which an agency with one red, one amber and one green dataset and one dataset with no schedule agreed (inNoRollup) reads '2 of 3 counted datasets not green' and '1 red, 1 amber', and in which the collection heading over those same four datasets reads the same and draws its trend from the same per-date statuses as the card."
      - "THE SYSTEM SHALL have a real-browser test against the built dashboard which, at the build's own date and at one earlier date, checks each agency card's and each collection heading's N, red and amber against the pills of its counted datasets on the agency tier, and that each trend's last point (from its accessible name) equals the count. It SHALL assert first that some agency card has N above 0."
      - "THE SYSTEM SHALL render the Agencies tier - pills, counts and every other card and collection-heading line - in under 400ms on the built page, and MAY draw the card and collection-heading trends after that first paint, working out each grid date's dataset statuses once, by one datasetStatusesOn(date) call serving every card and every heading together, and caching them by date."
    non_functional_requirements:
      - "SCALE: at about 30 datasets an agency card carries one line of counts and one small trend, never a list of dataset names - the same aggregation rule REQ-DASH-180's NFR 1 and REQ-DASH-070's NFR 2 hold the cards to."
      - "ACCESSIBILITY: red and amber are said in words, and the trend's two lines differ by style as well as colour (REQ-DASH-070 criterion 6)."
      - "MULTI-AGENCY: each card counts only its own agency's datasets. A deployment is one asset, so nothing crosses an asset boundary."
      - "THE BUILD RULE: computed in the page from recorded results. No new embedded data, and no dataset status precomputed in Python."
      - "CONSISTENCY: the count and the pill on one card are judged over the same datasets on the same date, by the same predicate and the same status function. A card whose count includes a dataset its pill leaves out is a card arguing with itself."
      - "PERFORMANCE, BUDGETED (delivery-dashboard-ux review G6, delivery-architect review H3): datasetStatusesOn per grid point is the whole page's work, and today's datasetTile() rebuilds every Child Protection dataset for each dataset it is asked for. Before the trend is built, each feed's datasets are built at most once per date (memoised), and one datasetStatusesOn per grid date serves every card and every collection heading - the headings share the cards' weekly grid dates, so they add drawing but no status work. The tier, with card and heading trends both, must meet criterion 13's 400ms on the built page, measured once with a synthetic 30-dataset fixture as well as on today's real data. IF it cannot, the build stops and raises it with Keith rather than thinning or shortening the series silently."
      - "AS-OF CORRECTNESS: a cold-loaded past-date link shows that date's count and that date's weekly series, checked by the real-browser test at an earlier date."
    dependencies:
      - REQ-DASH-224
      - REQ-DASH-225
      - REQ-DASH-070
    decisions:
      - "DATASETS, NOT CHECKS, ON THE CARDS (Keith, 2026-10-14, sprint-1 Q4). SUPERSEDES his 2026-10-06 'N of M checks not green' for the cards. At agency level the useful question is how many places need attention. REJECTED a checks count, which an agency with one dataset failing forty checks would inflate."
      - "M IS THE DATASETS THE CARD'S ROLLUP COUNTS (delivery-scoper's recommendation, kept after Q4, 2026-10-14). Keith's choice of datasets as the unit does not change which datasets: the card's pill and its count describe the same set, and datasets outside it have their own line. REJECTED counting every dataset whatever the rollup says."
      - "'COUNTED' IN THE WORDS WHEN SOME ARE LEFT OUT (Keith, 2026-10-14, delivery-dashboard-ux review Q5, option A). The card's footer already says '8 datasets', so '2 of 5 datasets not green' beside it reads as an arithmetic error. '2 of 8 datasets not green' when none is left out; '2 of 5 counted datasets not green', with the not-counted line directly beneath, when some are. REJECTED option B, the first draft's unqualified wording. Until REQ-DASH-180 criterion 10's partial not-counted line is built, a card with some datasets left out (today only by no schedule agreed, schedule ended or no data) shows 'counted' and its footer total but no line naming the others - an interim gap that REQ-DASH-180 closes, not one this requirement adds a line for. The interim gap confirmed by Keith, 2026-10-14, at the sign-off readiness check."
      - "A DATASET IS JUDGED BY ITS OWN PILL (delivery-scoper, 2026-10-14). Since the unit is a dataset, 'not green' is the dataset's own status, red or amber for any reason, not a recount of its checks. That keeps the card's count equal to what a reader sees by opening it, and a dataset is counted once whatever checks it shares."
      - "THE CARD KEEPS A SMALL LABELLED TREND (Keith, 2026-10-14, sprint-1 Q5). SUPERSEDES his 2026-10-06 'instead' for the cards and the first draft's removal of the card's sparkline. The trend plots datasets not green, the card's own unit."
      - "EACH DATASET'S FULL STATUS AS OF EACH DATE (Keith, 2026-10-14, NQ2, option B). The line always ends at the card's count, because its last point is the date on show judged the way the pill is. REJECTED option A, check verdicts only, which was cheaper but let the line end below the count when a dataset was red only for a missing supply."
      - "A WEEKLY GRID, LABELLED 'EACH WEEK' (Keith, 2026-10-14, delivery-dashboard-ux review Q3 and delivery-architect review Q1, option A). Datasets run on different cadences, so full status as of a date needs a grid of dates rather than run dates. REJECTED option B, one point per period, which at a quarterly cadence gives a card a handful of points and does not fit a mix of daily and quarterly datasets. The grid is anchored on the date on show (delivery-scoper's proposal) so that its last point is the count."
      - "TWO LINES ON THE CARD TOO (Keith, 2026-10-14, NQ3, option A). One trend vocabulary across tiers. REJECTED option B, one 'datasets not green' line, which would have been quieter on a card that already has a pill, a count and markers."
      - "A QUIET CARD STILL SHOWS ITS TREND (delivery-dashboard-ux review, minors; delivery-architect review L4). 'Not counted' and other quiet cards show no count but keep the trend in neutral ink with its label, under post-build-review #57's rule that history stays and only claims about the present go quiet."
      - "THE TURNED-OFF CLAUSES MOVE TO REQ-DASH-180 (Keith, 2026-10-14, delivery-architect review B1, option b). 'Turned off' is neither a dataset state nor a group status in the page yet - REQ-DASH-180 is signed but not built - so criteria 3 and 6 and criterion 11's turned-off dataset could be neither built nor seen failing first. They become a proposed new REQ-DASH-180 criterion extending criterion 11's test with a turned-off dataset (summary.md, 'Amendment to REQ-DASH-180'). Criterion 11 meanwhile uses a dataset with no schedule agreed, the one left-out kind the page has today (inNoRollup). REJECTED option a, holding sprint 1 until REQ-DASH-180 is built."
      - "THE TIER HAS A BUDGET, AND MISSING IT IS RAISED NOT HIDDEN (delivery-dashboard-ux review G6, delivery-architect review H3). 400ms is the Doherty threshold the project already uses (docs/hci-ux-psychology.md). Trends may draw after first paint so that the counts never wait for them. DECLINED the architect's 'at most N points' cap for this sprint: a cap shortens history silently, which is the thing G6 says to raise instead; the measurement with a 30-dataset fixture decides whether one is needed, and if so it comes back to Keith. Since the collection headings gained trends (Keith, 2026-10-14), the budget covers card and heading trends together. Declining the cap confirmed by Keith, 2026-10-14, at the sign-off readiness check."
      - "COLLECTION HEADINGS GET THE COUNT AND THE TREND (Keith, 2026-10-14, sign-off readiness check). Each collection heading on the agency tier carries the card's count line and the same small two-line weekly trend, over the collection's counted datasets. REJECTED delivery-scoper's proposal of the count only, without a trend, which argued that the collection's own table directly below already carries a trend per dataset. The heading's trend costs no extra status work, since it uses the same weekly grid dates and the same datasetStatusesOn(date) results as the cards (criterion 13)."
      - "TIER 1 ROLLS THE COUNT UP (Keith, 2026-10-13, answering the sprint plan's open question)."
      - "THE PILL STAYS WORST-OF; THE COUNT SITS BESIDE IT (#2). Worst-of is right for 'is anything wrong here', and it is deliberate: the Agencies tier's sub-heading says a failure cannot hide behind a healthy average. #2 found it lossy only for ranking. REJECTED replacing the pill with a count or a share."
    open_questions: []

  - id: REQ-DASH-227
    title: "The dataset page and each column's panel show red and amber trend lines that say in words what they plot"
    date_written: "2026-10-14"
    story: "As an agency's data owner asked whether a dataset is getting better or worse, I want the dataset page and each column's panel to show red and amber trends that say what they measure and over which runs, so that I can answer without guessing whether a falling line is good news."
    moscow: should
    status: not_started
    source: "Keith, plans/road-testing.md #1, road-testing sprint 1. His 2026-10-06 answer: 'trend sparklines labelled on the dataset and column pages', repeated on 2026-10-13. His answer to sprint-1 Q7 on 2026-10-14 (a new dataset-level trend, red and amber as two lines matching the list, plus a label over the column grid), his confirmation the same day of two lines on the column panel and tiles, and his answers to the delivery-dashboard-ux review's Q2 and Q4. Drafted by delivery-scoper 2026-10-14; reviewed by delivery-architect and delivery-dashboard-ux 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL show on each dataset page, above the column grid, a trend titled 'Columns red and amber, each QA run', and directly under that title a .legend-key line carrying the same key sentence as REQ-DASH-225 criterion 2. It SHALL plot as two lines the share of the dataset's counted units (REQ-DASH-224, check sections included) that were red and the share that were amber on each checked QA run up to the date on show, with a y-axis titled '% of columns' from 0% to 100% and dated first, middle and last x-axis labels."
      - "THE SYSTEM SHALL draw those lines as REQ-DASH-225 does - red solid, amber dotted with round caps, neutral 0% baseline - so that the dataset page and the dataset list read alike."
      - "THE SYSTEM SHALL show in each column's panel (openColumnDrawer) a trend titled 'Checks on this column red and amber, each QA run', as two lines in the same style and scale, with a y-axis titled '% of checks'."
      - "THE SYSTEM SHALL give each of those two trends a 'View as table' listing, reusing the page's existing View-as-table toggle, newest first, with one row per QA run giving the run date, the number red, the number amber, and the count as '<N> of <M> not green'."
      - "THE SYSTEM SHALL label the column grid's small per-column trends once, in a line above the grid reading 'Each column's lines: share of its checks red (solid) and amber (dotted), each QA run', draw each as two lines in the same style, and give each an accessible name stating the same and its latest values in words. Wording approved by Keith, 2026-10-14, at the sign-off readiness check."
      - "THE SYSTEM SHALL end each trend at the newest checked QA run among the runs the page's pills read on the date on show (REQ-DASH-224 criterion 12), and SHALL plot nothing after that date."
      - "WHILE a dataset is blocked, THE SYSTEM SHALL show neither trend nor the column tiles' trends, as the tiles already show none today (REQ-PIPE-115 criterion 26)."
      - "THE SYSTEM SHALL draw every trend from REQ-DASH-224's function, so that the dataset page's latest red and amber equal the counts on that dataset's row in the dataset list (REQ-DASH-225) on the same date."
      - "THE SYSTEM SHALL have a real-browser test against the built dashboard which, for a real dataset with a unit that is not green at the build's own date, checks three things: the dataset page's trend title, y-axis title and key are visible text; its 'View as table' latest row gives the same red, amber and '<N> of <M>' as the dataset list; and the column panel's latest row matches the red and amber checks listed in that panel. It SHALL assert first that the dataset has such a unit."
      - "THE SYSTEM SHALL draw the column tiles' lines at the tile's own height of about 16px, with the non-scaling stroke of REQ-DASH-225 criterion 20, and SHALL draw no lines on a tile whose column has no counted check on the date on show or fewer than two checked QA runs."
      - "THE SYSTEM SHALL compute every trend here as at the date on show, so that a cold-loaded link to a past date shows that date's series and latest values."
    non_functional_requirements:
      - "ACCESSIBILITY: every trend has a text equivalent - 'View as table' with both series on the two larger trends, an accessible name with the latest values on the small ones - and red and amber differ by line style and are named in words, not by colour alone (REQ-DASH-070 criterion 6). Contrast as REQ-DASH-225's CONTRAST NFR."
      - "CONSISTENCY: one trend vocabulary across the page - 'red and amber', 'each QA run', solid and dotted, a 0-100% scale, one key sentence - so that what a reader learns on the dataset list carries correctly to the dataset page. #1's whole complaint is two adjacent trends that read alike and mean different things."
      - "LEGIBILITY AT TILE SIZE: column tiles are about 16px tall, not the list's 28 (delivery-dashboard-ux review S2), so the dotted amber pattern is checked by eye on a tile as well as on the list, in both themes."
      - "THE BUILD RULE: computed in the page from the embedded check histories. No new embedded data."
      - "SCALE: a dataset with many columns gets one dataset-level trend, not one larger chart per column. The per-column lines stay tile-sized."
    dependencies:
      - REQ-DASH-224
      - REQ-DASH-225
      - REQ-PIPE-115
    decisions:
      - "LABELLED TRENDS ON THE DATASET AND COLUMN PAGES (Keith, 2026-10-06 and 2026-10-13)."
      - "A NEW DATASET-LEVEL TREND PLUS A GRID LABEL (Keith, 2026-10-14, sprint-1 Q7). REJECTED labelling the tiles alone, which would leave the dataset page as the one level with no answer to 'is this dataset getting better'."
      - "RED AND AMBER AS TWO LINES ON THE DATASET PAGE (Keith, 2026-10-14, sprint-1 Q7, 'matching the list')."
      - "TWO LINES IN THE COLUMN PANEL AND ON THE TILES TOO (delivery-scoper's call, confirmed by Keith 2026-10-14: 'two lines everywhere'). One vocabulary per page: a single not-green line beside two-line trends would be the 'read alike, mean different things' problem #1 recorded."
      - "THE KEY SITS UNDER THE DATASET PAGE TREND'S TITLE (Keith, 2026-10-14, delivery-dashboard-ux review Q4, option A). The same sentence as the dataset list's key line, so that the two levels are explained in the same words. REJECTED the key inside the chart."
      - "AMBER DOTTED (Keith, 2026-10-14, delivery-dashboard-ux review Q2). SUPERSEDES the first draft's 'dashed' in criteria 2 and 5; see REQ-DASH-225's decision for why dashed was taken."
      - "THE COLUMN PAGE IS THE COLUMN PANEL (delivery-scoper's reading). The dashboard has no column route of its own. A column opens in the drawer (openColumnDrawer), which today carries no trend at all."
      - "COLUMNS AT DATASET LEVEL, CHECKS AT COLUMN LEVEL (Keith, 2026-10-14, following sprint-1 Q1). The dataset page speaks the dataset list's unit, so its trend ends at the list's count. The column panel can only count checks."
    open_questions: []

  - id: REQ-DASH-228
    title: "A check's own trend chart names what it measures on its axis and in its table"
    date_written: "2026-10-14"
    story: "As anyone opening a check's panel, I want its trend chart to say what quantity it plots and in what unit, so that a row count, a failing-row count and a percentage do not appear under identical labelling, and a falling line is read the right way."
    moscow: should
    status: not_started
    source: "Keith, plans/road-testing.md #1, second bullet (the per-check chart's y-axis has no title, and its 'View as table' header is the bare word 'Value'), road-testing sprint 1; his answer to sprint-1 Q8 on 2026-10-14. Drafted by delivery-scoper 2026-10-14; reviewed by delivery-architect and delivery-dashboard-ux 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL title the y-axis of every check's trend chart (trendChart()) with what the check measures and its unit, for example 'Rows with no value (count)', 'Rows (count)', 'Invalid values (%)' or 'Drift score (PSI)', set as horizontal text above the plot's top-left corner, not rotated."
      - "THE SYSTEM SHALL head the value column of that chart's 'View as table' listing with the same words, and SHALL NOT head it with the bare word 'Value'."
      - "THE SYSTEM SHALL work out what a check measures from its declared rule kind (its tool_ref kind, e.g. dbt:not_null), using one mapping. WHERE the kind is not in the mapping, it SHALL fall back to the unit alone ('Value (count)'), and SHALL NOT guess."
      - "THE SYSTEM SHALL have a test that fails naming every rule kind declared in the committed check configuration (the check ids declared under contract/) that has no entry in the mapping, so that a new kind is noticed rather than left falling back silently, and so that the test runs in CI's fast half with no deployment. It SHALL assert first that the configuration declares at least one rule kind."
      - "THE SYSTEM SHALL have a real-browser test which opens one check of each of three units (count, %, PSI) on the built dashboard and asserts that the y-axis title and the table header are visible text naming the measure and the unit."
    non_functional_requirements:
      - "MAINTAINABILITY: a new rule kind added to a contract needs one entry in the mapping. Criterion 4 makes forgetting it a red test rather than a silent fallback, and reading committed configuration keeps that test out of the slow deployment half."
      - "AUTHORING STANDARD UNTOUCHED: the mapping is generated wording, not a hand-authored check field, so docs/check-authoring-rules.md does not change and its approval rule does not apply."
      - "ACCESSIBILITY: the measure is said in text on the axis and in the table header, not left for the reader to infer from the line's shape. Horizontal text, because rotated text at this size is hard to read and is skipped by some screen magnifiers."
      - "THE BUILD RULE: wording only, from recorded check metadata. No supply rows."
    dependencies: []
    decisions:
      - "#1's SECOND HALF IS IN THIS SPRINT (delivery-scoper). The sprint line names only the aggregate trends, but #1 records both charts as one problem: 'the two are adjacent in the same UI and one is a RATE while the other is a RAW METRIC'. Kept as a small, separate requirement so that Keith can drop it without touching the rest."
      - "DERIVED FROM THE DECLARED RULE KIND THROUGH ONE MAPPING (Keith, 2026-10-14, sprint-1 Q8). Matches sprint 3's 'derived from each check's declared rule' (Keith, 2026-10-13). The recorded results hold 45 rule kinds across 263 checks, which fall into a handful of measures. REJECTED the unit alone, which keeps the ambiguity ('count' is a failing-row count for not_null and a row count for rowCount), and REJECTED a new hand-authored field, which would change docs/check-authoring-rules.md and need 263 checks written up."
      - "THE COMPLETENESS TEST READS CONFIGURATION, NOT RESULTS (delivery-architect review L5). The first draft read rule kinds from the built dashboard's recorded results, which puts the test in CI's slow deployment half behind a full bootstrap. The kinds are declared in committed configuration, so the test belongs in the fast half. A kind present only in old history - a check since removed from the contract - is covered by criterion 3's fallback rather than by this test."
      - "THE MEASURE READS HORIZONTALLY, TOP-LEFT (delivery-dashboard-ux review, minors). REJECTED a rotated y-axis title."
    open_questions: []
