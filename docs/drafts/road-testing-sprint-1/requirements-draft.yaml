# DRAFT - road-testing sprint 1, "where do I put my effort?" (plans/road-testing.md
# #1 and #2), scoped by delivery-scoper 2026-10-14 from the sprint line, entries
# #1 and #2 in full, and Keith's answers of 2026-10-06 and 2026-10-13.
# REVISED the same day (2026-10-14, ~17:00 Perth) to fold in Keith's answers to
# Q1-Q8 (summary.md, "Keith's answers").
# A PROPOSAL for Keith's sign-off, not a settled requirement. Nothing here is in
# requirements.yaml. Criteria marked PROVISIONAL turn on a NEW question (NQ1-NQ3)
# in summary.md.
requirements:
  - id: REQ-DASH-224
    title: "One function decides whether a column or a check is red, amber, green or not counted on a QA run, and every count and trend line uses it"
    date_written: "2026-10-14"
    story: "As a data team leader reading any count or trend of what is not green, I want red and amber counted the same way everywhere - per check, per column and per check section - so that a count and the line beside it never disagree, and red and amber can be told apart in every one of them."
    moscow: must
    status: not_started
    source: "Keith, plans/road-testing.md #1 (a trend drawn in two places measuring two different things, neither labelled) and #2 (Tier 1 and Tier 2 say whether there is a problem, never how big), road-testing sprint 1; his answers of 2026-10-06 and 2026-10-13, and to sprint-1 Q1-Q8 on 2026-10-14. Drafted by delivery-scoper 2026-10-14. Builds on the Trend defect fix recorded as post-build-review #181, which Keith chose on 2026-10-14 to fix separately and first."
    acceptance_criteria:
      - "THE SYSTEM SHALL decide, in one function in the dashboard page, how a single check counts on a given QA run: a non-retired check whose recorded verdict is red SHALL count as red, amber as amber, green as green, and any other check - inactive ('No rule defined') or no data ('not run for this period') - SHALL count as none of them and SHALL be left out of every total, as post-build-review #181's fix already does for today's Trend line."
      - "THE SYSTEM SHALL count a check by the verdict its tool recorded, so that a check recorded red because it could not be evaluated counts as red."
      - "THE SYSTEM SHALL decide, in that same function, how a column counts on a QA run: red if any of its counted checks is red, otherwise amber if any is amber, otherwise green if any is green, and not counted if none of its checks is counted."
      - "THE SYSTEM SHALL treat each check section that belongs to no column - 'Supply-level checks', 'Table-level checks' and 'Cross-table checks' (COLUMN_SCOPES) - as one more column under the rule in criterion 3, named by its section heading."
      - "THE SYSTEM SHALL treat a dataset's file checks (REQ-DASH-097) as one more column named 'File checks' under the rule in criterion 3, judged on the file attempt that QA run loaded. PROVISIONAL on NQ1, because REQ-DASH-097 criterion 2 says no file-check verdict is folded into any count or trend."
      - "THE SYSTEM SHALL return, for each QA run in scope, the number of counted units, the number red and the number amber, so that every caller can draw red and amber as separate series."
      - "THE SYSTEM SHALL draw every aggregate trend line, at every tier where one is shown, from that function, and SHALL compute every red, amber and not-green count that REQ-DASH-225, REQ-DASH-226 and REQ-DASH-227 add from it, so that a count and the lines beside it cannot disagree."
      - "IF no unit in scope is counted on a QA run, THEN THE SYSTEM SHALL leave that run out of the lines, and SHALL NOT plot it as 0% or as 100%."
      - "IF a check carries a status the page does not recognise, THEN THE SYSTEM SHALL refuse it as recognisedStatus() already does, and SHALL NOT count it either way."
      - "THE SYSTEM SHALL have tests-js tests, written first and seen to fail against the code as it stands after post-build-review #181, covering four cases: a column with one amber and one red check counts as one red column; a column whose only check is inactive is not counted; a supply-level section with one red check counts as one red unit named 'Supply-level checks'; and a run with one red, one amber and one green column returns 3 counted, 1 red and 1 amber."
      - "THE SYSTEM SHALL compute all of this in the page from the check histories the build already embeds, SHALL add nothing to the embedded data, and SHALL NOT read supply rows."
    non_functional_requirements:
      - "THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else. Everything here is computed in the browser from histories already embedded."
      - "ONE ANSWER: one counting function in the page. plans/qa-pipeline.md item 74 found four status implementations that had drifted, one of which rendered a check with 14 violations green. A second counter per tier would recreate that."
      - "TEST-FIRST: criterion 10's tests must be seen red against the code as it stands after post-build-review #181, before this lands."
      - "PERFORMANCE: one pass over each in-scope check's history per render. At about 30 datasets with about 50 columns of about 5 checks each, that is tens of thousands of entries, well inside the 400ms Doherty threshold (docs/hci-ux-psychology.md). Measure it once on the built page rather than assume."
      - "MAINTAINABILITY: no Python twin. qa_tools/common/dataset_status.py mirrors the status vocabulary because Python consumers need it. Nothing in Python shows these counts."
    dependencies: []
    decisions:
      - "THE TREND DEFECT IS FIXED SEPARATELY, FIRST (Keith, 2026-10-14). delivery-scoper found while scoping that aggregateFailureSeries() counts every status other than 'green' as failing, so inactive placeholders and recorded 'nodata' entries counted as failures, and every Child Protection dataset plotted a non-zero share with no amber or red verdict (cp-notifications 2 of 45 against 0 of 43 verdicts). Keith chose to fix it now, test-first, as a post-build-review defect (post-build-review #181). This requirement builds on that fix rather than being it. SUPERSEDES the first draft's 'its own requirement, not a quiet bug fix'."
      - "ONE FUNCTION DECIDES NOT GREEN (proposed by delivery-scoper, kept after Keith's answers). REJECTED a counting helper per tier, on item 74's lesson."
      - "RED AND AMBER ARE RETURNED SEPARATELY (Keith, 2026-10-14, sprint-1 Q2). He asked for red and amber as two trend lines, so the function returns both counts per run rather than one not-green share."
      - "A COLUMN COUNTS ONCE, AT ITS WORST CHECK (Keith, 2026-10-14, sprint-1 Q2). A column with one amber and one red check is one red column, consistent with how the column tile's pill already rolls up."
      - "CHECK SECTIONS COUNT AS COLUMNS (Keith, 2026-10-14, sprint-1 Q3). Supply-level, table-level and cross-table sections each count as one unit, named by the section heading the dataset page already shows. REJECTED the recommended separate worded line for sections, and REJECTED counting real columns only."
      - "A CROSS-TABLE SECTION COUNTS ONCE PER DATASET IT IS FILED UNDER (delivery-scoper, 2026-10-14, following Q3). The section is already in each participating dataset's columns and already folds into each one's status (Keith, 2026-09-26, 'counts against both'). So each such dataset counts one 'Cross-table checks' unit. Deduplication by check_id matters only when one figure spans several datasets, and since Q4 the agency card counts datasets, not checks, so no figure here does."
      - "RATE IN THE LINE STANDS (Keith, 2026-09-17, plans/qa-pipeline.md #60). Units get introduced and retired, so the denominator moves. Each line is a share of that run's counted units."
      - "NO PYTHON TWIN (proposed by delivery-scoper). If a Python consumer ever shows these counts, the rule joins status-cases.json's parity cases then. REJECTED adding a twin speculatively."
    open_questions: []

  - id: REQ-DASH-225
    title: "The dataset list says how many columns are not green, how many red and how many amber, where Trend sits now, with small red and amber trend lines beside it"
    date_written: "2026-10-14"
    story: "As a data team leader with about thirty datasets on the quarterly asset, I want each row of a collection's dataset list to say how many of its columns are not green, how many of those are red and how many amber, beside small red and amber lines that say what they plot, so that I can rank the red datasets and see which way each is heading without opening them one at a time."
    moscow: must
    status: not_started
    source: "Keith, plans/road-testing.md #2 and #1, road-testing sprint 1. His 2026-10-06 answer to #2: 'the dataset list counts failing COLUMNS, in its own column where Trend sits today'. His 2026-10-13 answer on where Trend goes: 'a small labelled one kept in the dataset list beside the count' (commit 6f35083). His answers to sprint-1 Q1, Q2, Q3 and Q6 on 2026-10-14. Drafted by delivery-scoper 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL replace the agency tier's dataset-list column headed 'Trend' with a column headed 'Columns not green', in the same position. The wording is for Keith's approval at sign-off."
      - "THE SYSTEM SHALL show beneath that header one line saying what counts as a column, reading 'Supply, table, cross-table and file checks each count as one'. The wording is for Keith's approval at sign-off, and 'file' depends on NQ1."
      - "WHILE a dataset's row is its ordinary row - not one of the single reason rows for a blocked dataset, a period closed with no supply, an ended schedule or no QA run within tolerance - THE SYSTEM SHALL show in that column '<N> of <M> columns not green', where M is the dataset's units that REQ-DASH-224 counts on the date on show and N is those that are red or amber."
      - "WHERE N is above 0, THE SYSTEM SHALL say in words beneath the count how many units are red and how many amber, for example '2 red, 1 amber'."
      - "WHERE a check section counted as a column is red or amber, THE SYSTEM SHALL name it in that same line, for example '2 red (one is Supply-level checks), 1 amber', so that a reader can see that a section, not a table column, is among them."
      - "WHERE N is 0, THE SYSTEM SHALL read 'All <M> columns green', and SHALL NOT show a bare 0."
      - "WHERE a dataset is red or amber for a reason other than its checks - a supply waiting for a person, or a period closed with no supply - THE SYSTEM SHALL keep that reason in words on the same row, as noSupplyNote() does today, so that the count is never the only text beside a red it does not explain."
      - "THE SYSTEM SHALL show beside the count two small trend lines of the same units: the share of counted units that were red, and the share that were amber, on each QA run up to the date on show."
      - "THE SYSTEM SHALL tell the two lines apart by line style as well as colour: red as a solid line and amber as a dashed line. It SHALL show a key once in the column header, in words beside a sample of each style ('red' and 'amber'), and SHALL NOT rely on colour alone (REQ-DASH-070 criterion 6)."
      - "THE SYSTEM SHALL draw every row's lines on the same fixed scale, 0% to 100% of counted units, so that rows can be compared, and SHALL NOT use a floor that makes an all-green history look like a low, non-zero value."
      - "THE SYSTEM SHALL end both lines at the same QA run whose verdict the row's status pill and count show, so that the lines end where the count stands."
      - "THE SYSTEM SHALL give the pair of lines one accessible name that states what they plot, the date range and the latest values in words, for example 'Columns red and amber on each QA run, 12 runs from 1 Feb 2023 to 1 Aug 2026; latest 2 red and 1 amber of 15'. That name SHALL replace today's 'aggregate failing-check trend sparkline'."
      - "THE SYSTEM SHALL draw no endpoint dot, since the count beside the lines already states where the dataset stands."
      - "WHILE a dataset is in a quiet state (no data, exhausted or inactive, post-build-review #57), THE SYSTEM SHALL still draw both lines, in neutral ink and told apart by line style alone, so that history stays visible without colour making a claim about the present."
      - "THE SYSTEM SHALL compute the count and the lines as at the date on show (the in-place-on date), from the same column statuses the row's pill rolls up, so that choosing a different date changes them and a cold-loaded link to a past date shows that date's figures."
      - "WHILE a dataset is turned off (REQ-DASH-180), or the current period is one it owes nothing in (REQ-DASH-182), THE SYSTEM SHALL show the count and lines for the supply in place, just as its pill shows that supply's verdict."
      - "THE SYSTEM SHALL have tests-js tests, written first and seen to fail, covering three cases: a dataset whose only red is a supply-level check reads '1 of <M> columns not green' and names 'Supply-level checks'; a dataset whose units are all green reads 'All <M> columns green'; and the drawn red and amber lines for a two-run history sit at the shares REQ-DASH-224 returns on the fixed scale."
      - "THE SYSTEM SHALL have a real-browser test against the built dashboard. For every real dataset on an ordinary row, at the build's own date and at one earlier date, the test SHALL check that the red count equals the column tiles and check sections on the dataset's page whose pill is red, that the amber count likewise matches amber, and that M equals the tiles and sections showing one of the three verdicts. It SHALL assert first that at least one dataset has N above 0, so that it cannot pass with every count at zero."
    non_functional_requirements:
      - "SCALE (CLAUDE.md, about 30 datasets on the quarterly asset). This is the requirement that makes the list rankable: one count per row, red and amber stated, and lines on one shared scale so that the eye can compare thirty rows. A line auto-scaled per row would let 3% and 90% look the same height."
      - "LEGIBILITY AT SPARKLINE SIZE: the lines sit in today's roughly 180 by 28 pixel box. On a fixed 0-100% scale, one unit in fifteen is about 2 pixels above the baseline, so small values are deliberately quiet - the count and the accessible name carry the exact figure. Where the two lines coincide, red is drawn on top. The dashed amber pattern must stay distinguishable at that size, and is checked once by eye on the built page."
      - "ACCESSIBILITY, NEVER COLOUR ALONE (REQ-DASH-070 criterion 6). Red and amber are stated in words in the count, distinguished by line style as well as colour in the lines, and given in full in the accessible name. The dataset page's 'View as table' (REQ-DASH-227) carries both full series."
      - "THE BUILD RULE: computed in the page from recorded results the build already embeds, with no supply rows and no new embedded data."
      - "AS-OF CORRECTNESS: every figure is judged on the date on show, like the pill beside it. A test at a past date is required (the real-browser criterion), not just at the build's own date."
      - "COMPATIBILITY: no new asset, so file:// and offline viewing are unaffected. A phone is not a target (post-build-review #16), and the column should be no wider than the Trend column it replaces plus one line of text."
      - "PERFORMANCE: no new embedded data, and the count is one pass over the dataset's checks. The built page's load and agency-tier render time should not move measurably. Check once, not budgeted."
      - "OBSERVABILITY: CHANGELOG.yaml-worthy - a visible change to the main triage table."
    dependencies:
      - REQ-DASH-224
      - REQ-DASH-180
      - REQ-DASH-182
      - REQ-DASH-070
    decisions:
      - "COLUMNS, NOT CHECKS, IN THE DATASET LIST (Keith, 2026-10-06, answering #2; confirmed 2026-10-14, sprint-1 Q1). #2's own reasoning: a single bad column can carry several failing checks, so a check count overstates how many things are actually wrong."
      - "IN ITS OWN COLUMN, WHERE TREND SITS TODAY (Keith, 2026-10-06, answering #2). REJECTED #2's other options, the count beside the pill or the count inside the pill."
      - "A SMALL LABELLED TREND STAYS IN THE LIST BESIDE THE COUNT (Keith, 2026-10-13, commit 6f35083). This refines his 2026-10-06 answer to #1, which had the dataset list show the count 'instead' of the sparkline. REJECTED removing the list's trend entirely."
      - "THE LINES MEASURE WHAT THE COUNT BESIDE THEM COUNTS (Keith, 2026-10-14, sprint-1 Q1). #2 warned that a number beside the unlabelled trend 'risks two unexplained figures instead of one'. REJECTED a checks-based line beside a columns count, and REJECTED showing both a columns and a checks count in the row."
      - "RED AND AMBER AS TWO LINES (Keith, 2026-10-14, sprint-1 Q2 - 'maybe have separate lines for red vs orange', clarified as two series). REPLACES the first draft's single not-green line. Each column counts once, at its worst check, so red plus amber never exceeds 100%."
      - "SOLID RED, DASHED AMBER, ONE KEY PER HEADER (delivery-scoper, 2026-10-14). Line style is what keeps the two series apart without colour (REQ-DASH-070), and one key in the header rather than one per row keeps thirty rows quiet. REJECTED a text label on each row's lines, which does not fit a 28-pixel box."
      - "NO ENDPOINT DOT (delivery-scoper, 2026-10-14). Today's single dot coloured the run's worst status. With two coloured lines it would be a third mark in the same box saying what the count already says. In a quiet state both lines go neutral, which carries post-build-review #57's rule that only a claim about the present goes quiet: here, the colour is that claim."
      - "CHECK SECTIONS COUNT AS COLUMNS, AND THE ROW SAYS SO (Keith, 2026-10-14, sprint-1 Q3). '15 columns' on a 14-column table is accepted, and explained twice: the header's one-line note says sections count as one each, and any section that is red or amber is named in the row's red/amber line. REJECTED the recommended separate section line."
      - "ONE FIXED 0-100% SCALE (Keith, 2026-10-14, sprint-1 Q6). Rows compare by eye. The 0.05 floor in aggregateSparkline() goes with it: it existed only to avoid dividing by zero on an all-green history, and it pinned that history above the baseline as a low, non-zero-looking line."
      - "NAMED IN PLACE, NOT A DIFFERENT TREATMENT. #1 left open whether the aggregate line is named in place or replaced. Keith's 2026-10-13 answer keeps it in the list, labelled. What makes thirty rows readable is a stated measure and one shared scale, not a different chart."
      - "THE LINES ARE PER QA RUN, AS TODAY (delivery-scoper, not asked, unchallenged at Keith's 2026-10-14 answers). Each point is a supply that was checked, including resupplies and supplies later withdrawn. The label says 'each QA run'. REJECTED plotting one point per period's supply in place in this sprint, which would be a different series rather than a labelling change."
    open_questions:
      - "At about 30 datasets, should the dataset list be sortable, or sorted by default by red count? Out of this sprint as drafted - Keith asked for counts, not ordering - but a count invites a sort. Raise it for a later sprint or decline it. Not asked in sprint-1 Q1-Q8."

  - id: REQ-DASH-226
    title: "Agency cards, and each collection heading on the agency tier, say how many datasets are not green, how many red and how many amber, with small red and amber trend lines"
    date_written: "2026-10-14"
    story: "As a data team leader landing on the Agencies page, I want each agency card to say how many of its datasets are not green, split into red and amber, beside a small trend of the same, so that I can tell how many places in an agency need me, and whether that is growing, before I open it."
    moscow: must
    status: not_started
    source: "Keith, plans/road-testing.md #2 and #1, road-testing sprint 1. His 2026-10-13 answer: 'Tier 1 ROLLS THE COUNT UP onto agency cards' (commit 1ac13eb). His answers to sprint-1 Q4 (count datasets, not checks) and Q5 (keep a small labelled trend) on 2026-10-14. Drafted by delivery-scoper 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL show on each agency card on the Agencies tier a line reading '<N> of <M> datasets not green' and, where N is above 0, '<r> red, <a> amber' in words. M SHALL be the agency's datasets that the card's own colour rollup counts on the date on show, and N those of them whose own status is red or amber."
      - "THE SYSTEM SHALL judge each dataset in that count by the same status its own pill shows on the date on show, including a red or amber that comes from something other than its checks, such as a supply waiting for a person or a period closed with no supply."
      - "THE SYSTEM SHALL leave out of N and M every dataset the rollup leaves out - turned off with nothing owed (REQ-DASH-180 criterion 7), no schedule agreed, schedule ended, no data - and SHALL keep the existing 'N datasets not counted' line (REQ-DASH-180 criterion 10) as the place they are said."
      - "WHERE N is 0, THE SYSTEM SHALL read 'All <M> datasets green', and SHALL NOT show a bare 0."
      - "THE SYSTEM SHALL show the same line, worked out over that collection's counted datasets, beneath each collection's heading on the agency tier. PROVISIONAL - Keith named agency cards only; see the open question."
      - "WHERE a group's status is 'Turned off' or 'Not counted' (REQ-DASH-180 criteria 8 and 9), THE SYSTEM SHALL show no count line, and SHALL NOT show '0 of 0 datasets not green'."
      - "THE SYSTEM SHALL keep a small trend on the agency card, in place of today's aggregate sparkline, plotting the share of the card's counted datasets that were red and the share that were amber as two lines, drawn, keyed, scaled and named exactly as REQ-DASH-225 draws the dataset list's lines. The two-line form is PROVISIONAL on NQ3."
      - "THE SYSTEM SHALL label that trend visibly on the card, for example 'Datasets red and amber over time', and SHALL give it an accessible name stating its measure, date range and latest values in words."
      - "THE SYSTEM SHALL plot the card's trend at the points, and judge each dataset at each point, as NQ2 settles. PROVISIONAL: as drafted, one point per date on which any counted dataset had a QA run, each dataset judged by its latest QA run on or before that date through REQ-DASH-224, over the set of datasets counted on the date on show."
      - "THE SYSTEM SHALL compute the count as at the date on show, from the same dataset statuses the card's pill rolls up."
      - "THE SYSTEM SHALL have a tests-js test, written first and seen to fail, in which an agency with one red, one amber, one green and one turned-off dataset owing nothing reads '2 of 3 datasets not green' and '1 red, 1 amber'."
      - "THE SYSTEM SHALL have a real-browser test against the built dashboard which, at the build's own date and at one earlier date, checks each agency card's N, red and amber against the pills of its counted datasets on the agency tier. It SHALL assert first that some agency card has N above 0."
    non_functional_requirements:
      - "SCALE: at about 30 datasets an agency card carries one line of counts and one small trend, never a list of dataset names - the same aggregation rule REQ-DASH-180's NFR 1 and REQ-DASH-070's NFR 2 hold the cards to."
      - "ACCESSIBILITY: red and amber are said in words, and the trend's two lines differ by style as well as colour (REQ-DASH-070 criterion 6)."
      - "MULTI-AGENCY: each card counts only its own agency's datasets. A deployment is one asset, so nothing crosses an asset boundary."
      - "THE BUILD RULE: computed in the page from recorded results. No new embedded data."
      - "CONSISTENCY: the count and the pill on one card are judged over the same datasets on the same date. A card whose count includes a dataset its pill leaves out is a card arguing with itself."
      - "PERFORMANCE: the card's trend walks every counted dataset's history. At about 30 datasets, some daily, that is the largest series on the page. Measure the Agencies tier's render once on the built page; if it moves noticeably, raise it rather than shortening the series silently."
    dependencies:
      - REQ-DASH-224
      - REQ-DASH-225
      - REQ-DASH-180
      - REQ-DASH-070
    decisions:
      - "DATASETS, NOT CHECKS, ON THE CARDS (Keith, 2026-10-14, sprint-1 Q4). SUPERSEDES his 2026-10-06 'N of M checks not green' for the cards. At agency level the useful question is how many places need attention. REJECTED a checks count, which an agency with one dataset failing forty checks would inflate."
      - "M IS THE DATASETS THE CARD'S ROLLUP COUNTS (delivery-scoper's recommendation, kept after Q4, 2026-10-14). Keith's choice of datasets as the unit does not change which datasets: the card's pill and its count describe the same set, and datasets outside it already have their own line (REQ-DASH-180 criterion 10). REJECTED counting every dataset whatever the rollup says, which would put a turned-off dataset's red in a count beside a pill that leaves it out."
      - "A DATASET IS JUDGED BY ITS OWN PILL (delivery-scoper, 2026-10-14). Since the unit is now a dataset, 'not green' is the dataset's own status, red or amber for any reason, not a recount of its checks. That keeps the card's count equal to what a reader sees by opening it. It also removes the first draft's cross-table de-duplication criterion and test: a dataset is counted once whatever checks it shares."
      - "THE CARD KEEPS A SMALL LABELLED TREND (Keith, 2026-10-14, sprint-1 Q5). SUPERSEDES his 2026-10-06 'instead' for the cards and the first draft's removal of the card's sparkline. The trend plots datasets not green, the card's own unit."
      - "TWO LINES ON THE CARD TOO (proposed by delivery-scoper, 2026-10-14, PROVISIONAL on NQ3). One trend vocabulary across tiers: what a reader learns from the dataset list's red and amber lines reads the same on the card."
      - "TIER 1 ROLLS THE COUNT UP (Keith, 2026-10-13, answering the sprint plan's open question)."
      - "THE PILL STAYS WORST-OF; THE COUNT SITS BESIDE IT (#2). Worst-of is right for 'is anything wrong here', and it is deliberate: the Agencies tier's sub-heading says a failure cannot hide behind a healthy average. #2 found it lossy only for ranking. REJECTED replacing the pill with a count or a share."
    open_questions:
      - "Does the collection heading on the agency tier get the same count line (criterion 5)? Keith named agency cards. The collection heading is the card one level down, and it is where thirty datasets would sit. Drafted in, PROVISIONAL. Not asked in sprint-1 Q1-Q8."
      - "NQ2 (summary.md): what are the points of the agency card's trend, and is a dataset judged at each point by its checks alone or by its full status as of that date?"
      - "NQ3 (summary.md): is the agency card's trend two lines, red and amber, like the dataset list, or one not-green line?"

  - id: REQ-DASH-227
    title: "The dataset page and each column's panel show red and amber trend lines that say in words what they plot"
    date_written: "2026-10-14"
    story: "As an agency's data owner asked whether a dataset is getting better or worse, I want the dataset page and each column's panel to show red and amber trends that say what they measure and over which runs, so that I can answer without guessing whether a falling line is good news."
    moscow: should
    status: not_started
    source: "Keith, plans/road-testing.md #1, road-testing sprint 1. His 2026-10-06 answer: 'trend sparklines labelled on the dataset and column pages', repeated on 2026-10-13. His answer to sprint-1 Q7 on 2026-10-14: a new dataset-level trend, red and amber as two lines matching the list, plus a label over the column grid. Drafted by delivery-scoper 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL show on each dataset page, above the column grid, a trend titled 'Columns red and amber, each QA run'. It SHALL plot as two lines the share of the dataset's counted units (REQ-DASH-224, check sections included) that were red and the share that were amber on each QA run up to the date on show, with a y-axis titled '% of columns' from 0% to 100%, dated first, middle and last x-axis labels, and a key naming each line in words."
      - "THE SYSTEM SHALL draw those lines as REQ-DASH-225 does - red solid, amber dashed - so that the dataset page and the dataset list read alike."
      - "THE SYSTEM SHALL show in each column's panel (openColumnDrawer) a trend titled 'Checks on this column red and amber, each QA run', as two lines in the same style and scale, with a y-axis titled '% of checks'."
      - "THE SYSTEM SHALL give each of those two trends a 'View as table' listing, newest first, with one row per QA run giving the run date, the number red, the number amber, and the count as '<N> of <M> not green'."
      - "THE SYSTEM SHALL label the column grid's small per-column trends once, in a line above the grid reading 'Each column's lines: share of its checks red (solid) and amber (dashed), each QA run' (wording for Keith's approval at sign-off), draw each as two lines in the same style, and give each an accessible name stating the same and its latest values in words."
      - "THE SYSTEM SHALL end each trend at the QA run whose verdict the page shows on the date on show, and SHALL plot nothing after that date."
      - "WHILE a dataset is blocked, THE SYSTEM SHALL show neither trend nor the column tiles' trends, as the tiles already show none today (REQ-PIPE-115 criterion 26)."
      - "THE SYSTEM SHALL draw every trend from REQ-DASH-224's function, so that the dataset page's latest red and amber equal the counts on that dataset's row in the dataset list (REQ-DASH-225) on the same date."
      - "THE SYSTEM SHALL have a real-browser test against the built dashboard which, for a real dataset with a unit that is not green at the build's own date, checks three things: the dataset page's trend title, y-axis title and key are visible text; its 'View as table' latest row gives the same red, amber and '<N> of <M>' as the dataset list; and the column panel's latest row matches the red and amber checks listed in that panel. It SHALL assert first that the dataset has such a unit."
    non_functional_requirements:
      - "ACCESSIBILITY: every trend has a text equivalent - 'View as table' with both series on the two larger trends, an accessible name with the latest values on the small ones - and red and amber differ by line style and are named in words, not by colour alone (REQ-DASH-070 criterion 6)."
      - "CONSISTENCY: one trend vocabulary across the page - 'red and amber', 'each QA run', solid and dashed, a 0-100% scale - so that what a reader learns on the dataset list carries correctly to the dataset page. #1's whole complaint is two adjacent trends that read alike and mean different things."
      - "THE BUILD RULE: computed in the page from the embedded check histories. No new embedded data."
      - "SCALE: a dataset with many columns gets one dataset-level trend, not one larger chart per column. The per-column lines stay tile-sized."
    dependencies:
      - REQ-DASH-224
      - REQ-DASH-225
      - REQ-PIPE-115
    decisions:
      - "LABELLED TRENDS ON THE DATASET AND COLUMN PAGES (Keith, 2026-10-06 and 2026-10-13)."
      - "A NEW DATASET-LEVEL TREND PLUS A GRID LABEL (Keith, 2026-10-14, sprint-1 Q7). REJECTED labelling the tiles alone, which would leave the dataset page as the one level with no answer to 'is this dataset getting better'."
      - "RED AND AMBER AS TWO LINES ON THE DATASET PAGE (Keith, 2026-10-14, sprint-1 Q7, 'matching the list')."
      - "TWO LINES IN THE COLUMN PANEL AND ON THE TILES TOO (delivery-scoper, 2026-10-14, not asked). One vocabulary per page: a single not-green line beside two-line trends would be the 'read alike, mean different things' problem #1 recorded. Keith may reverse it at sign-off."
      - "THE COLUMN PAGE IS THE COLUMN PANEL (delivery-scoper's reading). The dashboard has no column route of its own. A column opens in the drawer (openColumnDrawer), which today carries no trend at all."
      - "COLUMNS AT DATASET LEVEL, CHECKS AT COLUMN LEVEL (Keith, 2026-10-14, following sprint-1 Q1). The dataset page speaks the dataset list's unit, so its trend ends at the list's count. The column panel can only count checks."
    open_questions: []

  - id: REQ-DASH-228
    title: "A check's own trend chart names what it measures on its axis and in its table"
    date_written: "2026-10-14"
    story: "As anyone opening a check's panel, I want its trend chart to say what quantity it plots and in what unit, so that a row count, a failing-row count and a percentage do not appear under identical labelling, and a falling line is read the right way."
    moscow: should
    status: not_started
    source: "Keith, plans/road-testing.md #1, second bullet (the per-check chart's y-axis has no title, and its 'View as table' header is the bare word 'Value'), road-testing sprint 1; his answer to sprint-1 Q8 on 2026-10-14. Drafted by delivery-scoper 2026-10-14."
    acceptance_criteria:
      - "THE SYSTEM SHALL title the y-axis of every check's trend chart (trendChart()) with what the check measures and its unit, for example 'Rows with no value (count)', 'Rows (count)', 'Invalid values (%)' or 'Drift score (PSI)'."
      - "THE SYSTEM SHALL head the value column of that chart's 'View as table' listing with the same words, and SHALL NOT head it with the bare word 'Value'."
      - "THE SYSTEM SHALL work out what a check measures from its declared rule kind (its tool_ref kind, e.g. dbt:not_null), using one mapping. WHERE the kind is not in the mapping, it SHALL fall back to the unit alone ('Value (count)'), and SHALL NOT guess."
      - "THE SYSTEM SHALL have a test that fails naming every rule kind present in the built dashboard's recorded results that has no entry in the mapping, so that a new kind is noticed rather than left falling back silently. It SHALL assert first that the recorded results hold at least one rule kind."
      - "THE SYSTEM SHALL have a real-browser test which opens one check of each of three units (count, %, PSI) on the built dashboard and asserts that the y-axis title and the table header are visible text naming the measure and the unit."
    non_functional_requirements:
      - "MAINTAINABILITY: a new rule kind added to a contract needs one entry in the mapping. Criterion 4 makes forgetting it a red test rather than a silent fallback."
      - "AUTHORING STANDARD UNTOUCHED: the mapping is generated wording, not a hand-authored check field, so docs/check-authoring-rules.md does not change and its approval rule does not apply."
      - "ACCESSIBILITY: the measure is said in text on the axis and in the table header, not left for the reader to infer from the line's shape."
      - "THE BUILD RULE: wording only, from recorded check metadata. No supply rows."
    dependencies: []
    decisions:
      - "#1's SECOND HALF IS IN THIS SPRINT (delivery-scoper). The sprint line names only the aggregate trends, but #1 records both charts as one problem: 'the two are adjacent in the same UI and one is a RATE while the other is a RAW METRIC'. Kept as a small, separate requirement so that Keith can drop it without touching the rest."
      - "DERIVED FROM THE DECLARED RULE KIND THROUGH ONE MAPPING (Keith, 2026-10-14, sprint-1 Q8). Matches sprint 3's 'derived from each check's declared rule' (Keith, 2026-10-13). The recorded results hold 45 rule kinds across 263 checks, which fall into a handful of measures. REJECTED the unit alone, which keeps the ambiguity ('count' is a failing-row count for not_null and a row count for rowCount), and REJECTED a new hand-authored field, which would change docs/check-authoring-rules.md and need 263 checks written up."
    open_questions: []
