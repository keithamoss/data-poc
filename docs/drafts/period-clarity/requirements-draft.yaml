- id: REQ-DASH-287
  title: "The date control names the period the date on show is in, and the picker gives each calendar's window"
  date_written: "2026-10-23"
  story: "As anyone moving between pages and dates, I want the header's date control to say which period that date is in - '22 October 2026 · 2026-Q4' - and the picker to give each calendar's window, so that the date I chose and the period the page talks about are linked without opening anything."
  moscow: must
  status: not_started
  source: "Dashboard UX critic, 2026-10-22 (S3, N3). Keith, 2026-10-22 (Perth), Q2 = B: the period on the header button, both calendars on pages spanning them, after mock-ups quarterly-B, daily-B and overview-B ('phone width will need to wrap or abbreviate'); Q1's per-dataset answer for the picker. Dashboard UX reviewer P4. Drafted by delivery-scoper 2026-10-23 (as REQ-DASH-284); v2 the same day for the dashboard UX review (S6, S7, S8, N3)."
  acceptance_criteria:
  - "THE SYSTEM SHALL end the date control's button label, after the date, with ' · <period>' in its own span - on a dataset page that dataset's period (REQ-DASH-284 criterion 5); on a collection, agency or asset-wide page each distinct calendar among the datasets in scope by the calendar's default, joined ' / ', authored-dates calendars first - an authored calendar as its period name, a cadence calendar as 'the <D Mon> supply' - for example 'In the warehouse on: Thursday, 22 October 2026 · 2026-Q4 / the 22 Oct supply'; and updateInPlaceOnButtonLabel() SHALL set both the date span and the period span. Which quarter is named is PROVISIONAL ON P-Q1 = A."
  - "THE SYSTEM SHALL take the button's words before the date from REQ-DASH-277 criterion 3 and SHALL NOT change them, this requirement owning only the period suffix."
  - "AT PHONE WIDTH (480px and narrower), THE SYSTEM SHALL lift .snapshots-btn's white-space:nowrap for #in-place-on-btn alone, shorten the date to 'Thu 22 Oct 2026', and keep the button to at most two lines, the period wholly inside the viewport and never truncated with an ellipsis."
  - "THE SYSTEM SHALL give the button an accessible name that spells the period out - 'In the warehouse on Thursday, 22 October 2026, period 2026-Q4' for an authored calendar, '..., the 22 October 2026 supply' for a cadence calendar, and both on a spanning page."
  - "THE SYSTEM SHALL set the document title in describeRoute() - its one writer - to '<view name> · <D Mon YYYY> · <period(s) as on the button> · <site name>', updating it on every date change and every navigation without a reload, and SHALL NOT re-fire #route-announcer for a date change, which stays the view name."
  - "WHEN a viewer opens the date panel, THE SYSTEM SHALL state for each named calendar the period the selected date is named by on the calendar's default and its window - '<period>, open <date> – <date>' for an authored-dates calendar, 'the <day> supply' for a cadence calendar - in place of '<period>, which began <day>', amending REQ-DASH-054 criterion 6 with the wording in summary.md once Keith has approved it."
  - "WHERE at least one dataset of a calendar has a different window from the default for that period (REQ-DASH-284 criterion 4), THE SYSTEM SHALL follow that calendar's line in the panel with 'Not every dataset has this window: <dataset> (open <date> – <date>)', naming up to three and, past three, the first two and 'and <n> more', each name a real <a href> link built with navHref to that dataset's page at the same date; and WHERE none differs, SHALL show no note."
  - "THE SYSTEM SHALL have real-browser tests, tests/test_dashboard_e2e.py::TestDateControlNamesThePeriod, against a dashboard built from a fixture history, written first and seen to fail: on 2026-10-22 cp-notifications' button ends '· 2026-Q4', birth-registrations' '· the 22 Oct supply', and the agency overview's '· 2026-Q4 / the 22 Oct supply'; the accessible names spell each out; the document titles of two dates differ and the route announcer's text does not change on a date change; the panel's quarterly line reads '2026-Q4, open 18 Oct 2026 – 18 Jan 2027' with no difference note, and a fixture dataset with its own days_before brings the note naming it as a link; and at 375px the button is at most two lines with its period wholly inside the viewport."
  non_functional_requirements:
  - "ONE NARROW CONTROL, TWO REQUIREMENTS (dashboard UX review P4): REQ-DASH-277 owns the label's words, this the suffix; build with 277 or after it, and whichever is built second carries the other's phone-width test."
  - "PHONE WIDTH (Keith: 'wrap or abbreviate'): the date shortens at 480px and below, the period wraps, never truncated."
  - "ACCESSIBILITY: the accessible name carries the period for either kind of calendar; the announcer is not re-fired by a filter change (a date change is a replaceState filter, not a navigation)."
  - "COMPATIBILITY: the query parameter still carries a calendar date (REQ-DASH-054 criterion 7)."
  - "SCALE: one suffix per calendar in scope, never per dataset."
  dependencies:
  - REQ-DASH-284
  - REQ-DASH-277
  - REQ-DASH-054
  decisions:
  - "THE PERIOD ON THE BUTTON (Keith, 2026-10-22, Q2 = B; critic S3)."
  - "BOTH CALENDARS ON A PAGE SPANNING THEM (Keith, Q2 = B; overview-B mock-up). On the tier-1 Agencies overview the button is the only place the period is named, which fits Q2 (dashboard UX N3)."
  - "A DATASET PAGE USES ITS OWN WINDOW, A SPANNING PAGE THE DEFAULT (Keith, 2026-10-22)."
  - "THE NOTE IS COMPUTED, NEVER A STANDING CAVEAT (Keith, 2026-10-22)."
  - "THE BUTTON'S MECHANICS NAMED (dashboard UX S7): .snapshots-btn is nowrap and pill-shaped, and updateInPlaceOnButtonLabel() writes the date span only."
  - "ONE TITLE WRITER, NO ANNOUNCER ON A DATE CHANGE (dashboard UX S8): describeRoute() already owns document.title; re-announcing on a filter change would be noise."
  - "THE DOCUMENT TITLE (critic N3)."
  - "THE DATE INPUT'S OWN FORMAT IS LEFT ALONE (critic N5): the browser's locale renders a native date input. Out of scope."
  open_questions: []
- id: REQ-DASH-288
  title: "Collection and agency pages name the period by the calendar's default window, and say so only where a dataset in them differs"
  date_written: "2026-10-23"
  story: "As someone reading a collection or an agency, I want the page to name the period it is about with its calendar's window, and to tell me only when one of its datasets keeps a different window, so that I read thirty datasets against one period without a standing caveat I learn to ignore."
  moscow: should
  status: not_started
  source: "Keith, 2026-10-22 (Perth), Q1 refined for pages spanning datasets: the calendar's default, and a note ONLY when a dataset in scope actually differs, computed from the agreement, never a standing caveat. Dashboard UX critic B1 and S2. Drafted by delivery-scoper 2026-10-23 (as REQ-DASH-285); v2 the same day for the dashboard UX review (S6, N3, N4)."
  acceptance_criteria:
  - "THE SYSTEM SHALL show under a collection's name and under an agency's name a period line in the shape and style of REQ-DASH-286 criteria 2 and 7, from the calendar's default window, one line per distinct calendar among the datasets in scope, authored-dates calendars first."
  - "WHERE at least one dataset in the page's scope has a different window from the calendar's default for the period named (REQ-DASH-284 criterion 4), THE SYSTEM SHALL follow that line with 'Not every dataset here has this window: <dataset> (open <date> – <date>)', naming up to three and, past three, the first two and 'and <n> more', each a real <a href> link built with navHref to its page at the same date; and WHERE none differs, SHALL show no note."
  - "THE SYSTEM SHALL name the supply in each collection-list row's Latest arrival cell through REQ-DASH-285's helper, so that a supply from an earlier period than the page's carries that period ('On time · 2026-Q3 supply, 9:00am Saturday, 1 August 2026'), and SHALL NOT add a Period column."
  - "THE SYSTEM SHALL compute every part from the embedded windows and results, never from supply rows, and SHALL render every name as text."
  - "THE SYSTEM SHALL have real-browser tests, against a dashboard built from a fixture history, written first and seen to fail: the Child Protection collection on 2026-10-22 shows '2026-Q4 · open 18 Oct 2026 – 18 Jan 2027 · due 1 Nov 2026' and no difference note; with one fixture dataset given its own days_before, the note names and links that dataset only; cp-notifications' Latest arrival cell reads '2026-Q3 supply' on 2026-10-22 and carries no period on 2026-08-15; and an agency spanning both calendars, where the fixture has one, shows two lines."
  non_functional_requirements:
  - "SCALE (~30 collections): one line per calendar; the note names at most three; no new column."
  - "NO STANDING CAVEAT (Keith)."
  - "PERFORMANCE: the note's condition is REQ-DASH-284's precomputed flag."
  - "BUILD ORDER (dashboard UX N4): a should; if it slips behind REQ-DASH-286 and 287, collection and agency pages name the period on the button alone until it lands."
  - "ACCESSIBILITY, DARK MODE, PHONE WIDTH: as REQ-DASH-286."
  dependencies:
  - REQ-DASH-284
  - REQ-DASH-285
  - REQ-DASH-286
  decisions:
  - "THE CALENDAR'S DEFAULT ON A SPANNING PAGE, A NOTE ONLY WHERE ONE DIFFERS (Keith, 2026-10-22). REJECTED a standing caveat."
  - "THE PERIOD IN THE LATEST ARRIVAL CELL, NOT A NEW COLUMN (delivery-scoper; dashboard UX review agrees): a column would repeat the page's period thirty times."
  - "THE TIER-1 AGENCIES OVERVIEW GETS NO LINE (dashboard UX N3): there the button names the period, which fits Keith's Q2."
  - "SPARKLINES ARE NOT BUCKETED BY PERIOD (dashboard UX review P6; REQ-PIPE-279 K3 = C): critic N2 is out of scope; the 'each week' label is true."
  open_questions: []
- id: REQ-DASH-289
  title: "A cross-table check that could not run because the other table has nothing in the warehouse for the period says so on its row and on the collection list, naming the table and the period"
  date_written: "2026-10-23"
  story: "As a data team leader looking at Notifications in red, I want each cross-table row that could not run to say 'Not evaluated' and name the table and period it was missing, and the collection list to say the same in short, so that I go to the Client Register's 2025-Q2 supply instead of hunting through Notifications for a fault it does not have."
  moscow: must
  status: not_started
  source: "Dashboard UX critic, 2026-10-22 (B2), at in-place-on 2025-05-15. Keith, 2026-10-22 (Perth), Q3 = A: stays red and says why on the row with the period, and on the collection-list row in short. Dashboard UX reviewer section 4 and P1. Drafted by delivery-scoper 2026-10-23 (as REQ-DASH-286); v2 the same day for the architect review (S8, S9, note) and the dashboard UX review (S6, S10, S11, the 375px stack)."
  acceptance_criteria:
  - "WHERE EVERY tool's result in a cross-table cell is not evaluated because a table of another dataset had no supply in the warehouse for the period (REQ-PIPE-270), THE SYSTEM SHALL show the cell's word as 'Not evaluated' - the page's existing word, not a new status - and WHERE any tool's result in the cell was evaluated, SHALL keep REQ-DASH-272 criterion 8's worst-of-the-marks word, so that a dbt Fail is never shown as 'Not evaluated'; amending REQ-DASH-272 criterion 8 with the wording in summary.md once Keith has approved it."
  - "THE SYSTEM SHALL keep the cell's per-tool marks in REQ-DASH-272 criterion 8's order, giving a tool that could not run the page's existing mark for a not-evaluated result and '·' only to a tool with no such check, and SHALL follow them with REQ-DASH-272 criterion 8's note, worded 'no <dataset> in the warehouse for <period>' - for example 'Not evaluated', its marks, then '— no Client Register in the warehouse for 2025-Q2'. The note's wording is PROVISIONAL ON P-Q4 = A."
  - "THE SYSTEM SHALL keep that row's status pill red (REQ-PIPE-270) and SHALL NOT show it amber, grey or as a new state."
  - "THE SYSTEM SHALL carry the cell's full sentence, with the table and the period, in the row's accessible name (REQ-DASH-272 criterion 12)."
  - "THE SYSTEM SHALL word REQ-DASH-204 criterion 18's quiet note under such a reader's status pill in the collection table 'Red because no <dataset> is in the warehouse for <period>', one note per causing table, the dataset a real <a href> link built with navHref to its page at the same date on show, whose click SHALL NOT also trigger the row's own navigation (stopping propagation as ticketBadge() does) and whose middle-click opens a new tab; amending REQ-DASH-204 criterion 18 with the wording in summary.md once Keith has approved it. The wording is PROVISIONAL ON P-Q4 = A."
  - "THE SYSTEM SHALL head a check panel's could-not-run block 'Not evaluated for <supply>', the supply named through REQ-DASH-285's helper with its period, in place of 'Not evaluated in the current run', and SHALL state in it the other table and the period it was missing."
  - "THE SYSTEM SHALL judge all of this as at the date on show from the counted results and the decision log, take the missing table and its period from structured fields - REQ-PIPE-279's read record or REQ-PIPE-270's reason code, through the one function REQ-DASH-204 criterion 10 names - never from a reason's prose, and SHALL NOT read supply rows."
  - "THE SYSTEM SHALL have a JS test in tests-js/cross-table-grid.test.js, written first and seen to fail, asserting that a cell whose every tool is not evaluated reads 'Not evaluated' and that a cell with a dbt Fail and a Soda not-evaluated reads 'Fail'; and real-browser tests, tests/test_dashboard_e2e.py::TestNotEvaluatedNamesTheMissingPeriod, against a dashboard built from a fixture history of the 2025-05-15 shape - a Client Register 2025-Q2 supply received and not loaded - written first and seen to fail: cp-notifications' three Client-reference rows read 'Not evaluated', their marks, and '— no Client Register in the warehouse for 2025-Q2' with a Red pill; their accessible names carry the same; the Notifications, Investigations and Placements rows of the collection list carry 'Red because no Client Register is in the warehouse for 2025-Q2', whose link opens the Client Register at the same date and not the reader's row; the panel heading names the 2025-Q2 Notifications supply; at 375px the stacked 'In the warehouse: Not evaluated ...' result fits inside the viewport (REQ-DASH-272 criterion 16); and cp-clients' own page keeps REQ-DASH-264 criterion 4's could-not-run banner unchanged."
  non_functional_requirements:
  - "NO FALSE GREEN, NO NEW STATUS (Keith, #95: red only, strict)."
  - "ONE VOCABULARY (dashboard UX review section 4): the row note is REQ-DASH-272's, through the one helper; REQ-DASH-204's top-of-page lead differs today - P-Q6."
  - "BUILD ORDER (architect S9): depends on REQ-DASH-204, which depends on the UNSIGNED REQ-PIPE-211, so this is transitively blocked until 211 is signed and built."
  - "SCALE: one collection-list note per causing table, never per check."
  - "ACCESSIBILITY: word and marks, never colour alone; the full sentence in the accessible name; no link whose click is swallowed by its row."
  - "PERFORMANCE: computed at build per result."
  - "PRIVACY: names the dataset and the period, never a file."
  dependencies:
  - REQ-DASH-272
  - REQ-DASH-204
  - REQ-PIPE-270
  - REQ-PIPE-269
  - REQ-PIPE-279
  - REQ-DASH-285
  - REQ-DASH-264
  decisions:
  - "STAYS RED AND SAYS WHY (Keith, 2026-10-22, Q3 = A). REJECTED Q3 = B, a distinct 'Not evaluated' status."
  - "'NOT EVALUATED' ONLY WHEN EVERY TOOL IS (architect S8): v1 replaced 272 c8's worst-of-the-marks word outright, which would show a cell with a real dbt Fail as 'Not evaluated' - the false-green direction. 272 c8 is signed, so the change is an amendment with old/new wording."
  - "THE MARKS STAY (dashboard UX S11): the positional key (272 c11) only decodes if every check shows all three positions."
  - "THE NOTE IS REQ-DASH-272's (P-Q4 = A recommended; both reviewers agree): Keith's example 'Client Register has no 2025-Q2 supply' is false in the B2 case, where the supply arrived and could not be loaded."
  - "A LINK INSIDE A CLICKABLE ROW (dashboard UX S6): the collection row is a <tr data-nav tabindex=0>; without stopping propagation a click on 'Client Register' would open Notifications - defeating the point of B2."
  - "THE MISSING PERIOD FROM A STRUCTURED FIELD (architect note)."
  - "THE SAMPLE COUNTS (critic N4) ARE NOT TAKEN HERE: REQ-PIPE-279 criterion 10's one counting function; re-check once 279 lands."
  - "v1 CITED REQ-DASH-204 'criterion 19' AND REQ-DASH-272 'criterion 11' FOR THE COLLECTION NOTE AND THE ACCESSIBLE NAME: in the signed register they are 204 criterion 18 and 272 criterion 12. Corrected."
  open_questions:
  - "P-Q4 (summary.md): 'no Client Register in the warehouse for 2025-Q2' (recommended A) or 'Client Register has no 2025-Q2 supply' (B)."
  - "P-Q6 (summary.md): amend REQ-DASH-204 criterion 2's lead 'No promoted <dataset> for <period>.' to 'No <dataset> in place in the warehouse for <period>.' in this batch (recommended A), or keep it and record why the two differ (B)."
- id: REQ-DASH-290
  title: "The dashboard opens on the build's date when today is past it"
  date_written: "2026-10-23"
  story: "As someone opening the dashboard the morning after a build, I want it to open on the newest date it covers rather than on today with a warning, so that the first thing I see is an answer and not a notice telling me to click for one."
  moscow: should
  status: not_started
  source: "plans/post-build-review.md #260 (fixed 2026-10-22): 'Whether the DEFAULT should itself be the newest covered date is a behaviour question for the period-clarity requirement, not this fix.' Dashboard UX critic S4. Drafted by delivery-scoper 2026-10-23 (as REQ-DASH-287) to P-Q2's recommended answer; v2 the same day for the architect review (B1, B2, AQ2)."
  acceptance_criteria:
  - "THE SYSTEM SHALL default the date on show to today on the asset's clock where the covered range holds it, and otherwise to the covered range's last date - the build's date (REQ-DASH-284 criterion 7). PROVISIONAL ON P-Q2 = A."
  - "THE SYSTEM SHALL reset to that same date from the picker's 'Reset to default (<date>)' and SHALL label it with that date."
  - "WHEN the page opens with no date in its address, THE SYSTEM SHALL show neither the 'outside the dates' notice nor the past-date notice."
  - "IF a date outside the covered range arrives by address, THEN THE SYSTEM SHALL keep REQ-DASH-054 criterion 9's notice, its one-click reset landing on a covered date."
  - "THE SYSTEM SHALL keep the default date out of the address, so that a plain link opened later shows the build's date."
  - "THE SYSTEM SHALL have a JS test, written first and seen to fail, with the asset clock one day past the build's date, asserting the default is the build's date and no range notice shows - for a fixture with a daily calendar and for a quarterly-only fixture - and asserting that with 2026-Q4 embedded on 2026-10-22 the default is never 2026-11-01; and a real-browser test asserting the same on a dashboard whose build day is before today."
  non_functional_requirements:
  - "HONESTY: the build line already says when the page was built, so opening on that day is the truthful answer."
  - "COMPATIBILITY: no change to the query parameter or saved links."
  - "ACCESSIBILITY: one fewer status announcement on every morning load."
  - "IF AQ2 = B this becomes a MUST and carries REQ-DASH-284 criterion 7's fix itself: a quarterly-only deployment otherwise shows the out-of-range notice every day."
  dependencies:
  - REQ-DASH-054
  - REQ-DASH-284
  decisions:
  - "#260 FIXED THE DEAD BUTTON, NOT THE DEFAULT (plans/post-build-review.md #260)."
  - "A STATIC PAGE ANSWERS UP TO ITS BUILD (REQ-DASH-054's embed note; REQ-PIPE-092 rebuilds on every publish)."
  - "THE COVERED RANGE ENDS AT THE BUILD'S DATE (architect B1, B2): v1's 'newest covered date' would have opened on 1 November once 2026-Q4 was embedded from 18 October, and on 1 August in a quarterly-only deployment."
  open_questions:
  - "P-Q2 (summary.md): default to the build's date when today is past it (recommended A); keep today with the notice (B, today's behaviour since #260); or extend coverage to today (C)."
