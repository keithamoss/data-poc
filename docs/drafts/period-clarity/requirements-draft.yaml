# behaviour question. A PROPOSAL for Keith's sign-off: nothing here is in
# requirements.yaml and nothing is signed. summary.md beside this file is the
# sign-off brief, holds the old/new wording of every signed criterion these
# amend, and carries FOUR QUESTIONS FOR KEITH (P-Q1 to P-Q4). Criteria marked
# PROVISIONAL ON P-Qn are written to the recommended answer.
#
# STANDS ON the signed #95 batch v6 (docs/drafts/unjudged-cross-table/
# requirements-draft-v6.yaml - REQ-DASH-272, 275, 277, 204), REQ-PIPE-279
# (docs/drafts/deterministic-matching/), and REQ-DASH-054, REQ-PIPE-081,
# REQ-DASH-182 and REQ-DASH-264 in requirements.yaml.
#
# IDS: 284 to 290, the next free numbers on 2026-10-23 across requirements.yaml
# and every docs/drafts/ file (281-283 went to REQ-TEST in docs/drafts/small-2026-10-23/). Check the
