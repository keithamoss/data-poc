- id: REQ-DASH-288
  title: "Collection and agency pages name the period by the calendar's default window, and say so only where a dataset in them differs"
  date_written: "2026-10-23"
  story: "As someone reading a collection or an agency, I want the page to name the period it is about with its calendar's window, and to tell me only when one of its datasets keeps a different window, so that I read thirty datasets against one period without a standing caveat I learn to ignore."
  moscow: should
  status: not_started
  source: "Keith, 2026-10-22 (Perth), period-clarity Q1, refined for pages spanning datasets: show the calendar's default, and a note that individual datasets differ ONLY when at least one dataset in the page's scope actually has a different window for that period - computed from the agreement, never a standing caveat. Dashboard UX critic B1 (a period on the collection list) and S2. Drafted by delivery-scoper 2026-10-23."
  acceptance_criteria:
  - "THE SYSTEM SHALL show under a collection's name and under an agency's name a period line in the shape of REQ-DASH-286 criterion 2's first line, from the calendar's default window, one line per distinct calendar among the datasets in scope, authored-dates calendars first."
  - "WHERE at least one dataset in the page's scope has a different open or close date from the calendar's default for the period named (REQ-DASH-284 criterion 3), THE SYSTEM SHALL follow that line with 'Not every dataset here has this window: <dataset> (open <date> – <date>)', naming up to three and, past three, the first two and 'and <n> more', each a link to its page at the same date; and WHERE none differs, SHALL show no note."
  - "THE SYSTEM SHALL name the supply in each collection-list row's Latest arrival cell through REQ-DASH-285's helper, so that a supply from an earlier period than the page's carries that period ('On time · 2026-Q3 supply, 9:00am Saturday, 1 August 2026'), and SHALL NOT add a Period column."
  - "THE SYSTEM SHALL compute every part from the embedded windows and results, never from supply rows, and SHALL render every name as text."
  - "THE SYSTEM SHALL have real-browser tests, against a dashboard built from a fixture history, written first and seen to fail: the Child Protection collection on 2026-10-22 shows '2026-Q4 · open 18 Oct 2026 – 18 Jan 2027 · ...' and no difference note; with one fixture dataset given its own days_before, the note names that dataset only; the Latest arrival cell of cp-notifications reads '2026-Q3 supply' on 2026-10-22 and carries no period on 2026-08-15; and an agency spanning both calendars, where the fixture has one, shows two lines."
  non_functional_requirements:
  - "SCALE (~30 collections on the quarterly asset): one line per calendar, not per dataset; the note names at most three; no new column on a table that already has six at phone width."
  - "NO STANDING CAVEAT (Keith): a note shown on every page is noise, and noise gets ignored when it finally matters."
  - "PERFORMANCE: the note's condition is a precomputed flag per dataset slot (REQ-DASH-284 criterion 3), checked for the datasets in scope."
  - "ACCESSIBILITY, DARK MODE, PHONE WIDTH: as REQ-DASH-286."
  dependencies:
  - REQ-DASH-284
  - REQ-DASH-285
  - REQ-DASH-286
  decisions:
  - "THE CALENDAR'S DEFAULT ON A SPANNING PAGE, AND A NOTE ONLY WHERE ONE DIFFERS (Keith, 2026-10-22). REJECTED the scoper's first reading, a standing 'individual datasets may differ' caveat."
  - "THE PERIOD IN THE LATEST ARRIVAL CELL, NOT A NEW COLUMN (delivery-scoper, PROPOSED; the critic proposed a Period column): the period that matters on a row is the supply's, and only where it is not the page's; a column would repeat the page's period thirty times. To mention at the walk-through."
  - "THE AGENCY OVERVIEW'S SPARKLINE IS NOT BUCKETED BY PERIOD (dashboard UX review P6; REQ-PIPE-279, Keith K3 = C): critic N2 noted quarterly agencies' sparklines say 'each week'; bucketing by period would merge K3 = C's separate points. Out of scope; the label is true as it stands."
  open_questions: []
- id: REQ-DASH-289
  title: "A cross-table check that could not run because the other table has nothing in the warehouse for the period says so on its row and on the collection list, naming the table and the period"
  date_written: "2026-10-23"
  story: "As a data team leader looking at Notifications in red, I want each cross-table row that could not run to say 'Not evaluated' and name the table and period it was missing, and the collection list to say the same in short, so that I go to the Client Register's 2025-Q2 supply instead of hunting through Notifications for a fault it does not have."
  moscow: must
  status: not_started
  source: "Dashboard UX critic, 2026-10-22 (review-ux-critic.md B2), at in-place-on 2025-05-15: Notifications' three Client-reference rows showed only the rule and Red, and the collection list showed Notifications, Investigations and Placements red 'incl. Cross-table checks' with nothing pointing at the Client Register. Keith, 2026-10-22 (Perth), Q3 = A: it stays red and says why on the row with the period, and on the collection-list row in short. Dashboard UX reviewer section 4 and P1: extend REQ-DASH-272's cell notes and panel sentences through the one helper rather than add a second vocabulary. Drafted by delivery-scoper 2026-10-23."
  acceptance_criteria:
  - "WHERE the result REQ-PIPE-269 counts for a cross-table check on a dataset page was not evaluated because a table of another dataset had no supply in the warehouse for the period (REQ-PIPE-270), THE SYSTEM SHALL show that result's cell word as 'Not evaluated' - the page's existing word for such a result, not a new status - followed by REQ-DASH-272 criterion 8's note, worded 'no <dataset> in the warehouse for <period>', for example 'Not evaluated — no Client Register in the warehouse for 2025-Q2'. The note's wording is PROVISIONAL ON P-Q4 = A."
  - "THE SYSTEM SHALL keep that row's status pill red (REQ-PIPE-270) and SHALL NOT show it amber, grey or as a new state."
  - "THE SYSTEM SHALL carry the cell's full sentence, with the table and the period, in the row's accessible name (REQ-DASH-272 criterion 11)."
  - "THE SYSTEM SHALL word REQ-DASH-204 criterion 19's quiet note under such a reader's status pill in the collection table 'Red because no <dataset> is in the warehouse for <period>', one note per causing table, the dataset a link to its page at the same date on show - amending REQ-DASH-204 criterion 19 with the wording in summary.md once Keith has approved it. The wording is PROVISIONAL ON P-Q4 = A."
  - "THE SYSTEM SHALL head a check panel's could-not-run block 'Not evaluated for <supply>', the supply named through REQ-DASH-285's helper with its period, in place of 'Not evaluated in the current run', and SHALL state in it the other table and the period it was missing."
  - "THE SYSTEM SHALL judge all of this as at the date on show from the counted results and the decision log, identify the table from structured fields through the one function REQ-DASH-204 criterion 10 names, never from a reason's prose, and SHALL NOT read supply rows."
  - "THE SYSTEM SHALL have real-browser tests, tests/test_dashboard_e2e.py::TestNotEvaluatedNamesTheMissingPeriod, against a dashboard built from a fixture history of the 2025-05-15 shape - a Client Register 2025-Q2 supply received and not loaded - written first and seen to fail: cp-notifications' three Client-reference rows read 'Not evaluated — no Client Register in the warehouse for 2025-Q2' with a Red pill; their accessible names carry the same; the Notifications, Investigations and Placements rows of the collection list carry 'Red because no Client Register is in the warehouse for 2025-Q2'; the panel heading names the 2025-Q2 Notifications supply; and cp-clients' own page keeps REQ-DASH-264 criterion 4's could-not-run banner unchanged."
  non_functional_requirements:
  - "NO FALSE GREEN, NO NEW STATUS (Keith, #95: red only, strict): the words explain the red and never soften it."
  - "ONE VOCABULARY (dashboard UX review section 4): the row note is REQ-DASH-272's, through the one helper; REQ-DASH-204's top-of-page line keeps its own wording ('No promoted <dataset> for <period>'), which this does not touch."
  - "SCALE: one collection-list note per causing table, never per check."
  - "ACCESSIBILITY: word and icon, never colour alone; the full sentence in the accessible name."
  - "PERFORMANCE: computed at build per result; no per-render history walk."
  - "PRIVACY: names the dataset and the period, never a file."
  dependencies:
  - REQ-DASH-272
  - REQ-DASH-204
  - REQ-PIPE-270
  - REQ-PIPE-269
  - REQ-DASH-285
  - REQ-DASH-264
  decisions:
  - "STAYS RED AND SAYS WHY (Keith, 2026-10-22, Q3 = A). REJECTED Q3 = B, a distinct 'Not evaluated' status, which would change a status rule against #95's strict, red-only decision and Q13 = B."
  - "'NOT EVALUATED' IS AN EXISTING WORD (the template already uses it on the trend chart and the panel's compare column): the cell uses it rather than REQ-DASH-272 criterion 8's 'worst of the marks', which has no word of its own for a check no tool could run."
  - "THE NOTE IS REQ-DASH-272's, NOT A NEW ONE (dashboard UX review section 4, PROPOSED as P-Q4 = A): Keith's example wording 'Client Register has no 2025-Q2 supply' is false in the B2 case itself, where the Client Register's 2025-Q2 supply was received and could not be loaded; 'no Client Register in the warehouse for 2025-Q2' is true in every cause REQ-PIPE-270 lists."
  - "THE PANEL NAMES THE SUPPLY, NOT 'THE CURRENT RUN' (critic B2: 'the current run' unnamed)."
  - "THE SAMPLE COUNTS DISAGREE (critic N4: 41 runs in the header, 46 in the panel chart, ~52 table rows at 2025-05-15) is NOT TAKEN HERE: REQ-PIPE-279 criterion 10 already makes list counts, sparkline and panel count one function (dashboard UX review section 4), and it should be re-checked against the built page once 279 lands."
  open_questions:
  - "P-Q4 (in summary.md): the row note 'no Client Register in the warehouse for 2025-Q2' (recommended A, REQ-DASH-272's existing wording) or Keith's example 'Client Register has no 2025-Q2 supply' (B)."
- id: REQ-DASH-290
  title: "The dashboard opens on the newest date it covers when today is past it"
  date_written: "2026-10-23"
  story: "As someone opening the dashboard the morning after a build, I want it to open on the newest date it has periods for rather than on today with a warning, so that the first thing I see is an answer and not a notice telling me to click for one."
  moscow: should
  status: not_started
  source: "plans/post-build-review.md #260 (fixed 2026-10-22): the 'outside the dates' notice offered the default date when the default itself was past the covered range - every morning after a build - and now offers the newest covered date instead; 'Whether the DEFAULT should itself be the newest covered date is a behaviour question for the period-clarity requirement, not this fix.' Dashboard UX critic S4. Drafted by delivery-scoper 2026-10-23 to the recommended answer of P-Q2, which is still Keith's."
  acceptance_criteria:
  - "THE SYSTEM SHALL default the date on show to today on the asset's clock where the embedded sequences cover it, and otherwise to the newest date they cover. PROVISIONAL ON P-Q2 = A."
  - "THE SYSTEM SHALL reset to that same date from the picker's 'Reset to default (<date>)' and SHALL label it with that date."
  - "WHEN the page opens with no date in its address, THE SYSTEM SHALL show neither the 'outside the dates' notice nor the past-date notice."
  - "IF a date outside the covered range arrives by address, THEN THE SYSTEM SHALL keep REQ-DASH-054 criterion 9's notice, its one-click reset now always landing on a covered date."
  - "THE SYSTEM SHALL keep the default date out of the address, as today, so that a plain link opened later shows the newest date of the build it opens."
  - "THE SYSTEM SHALL have a JS test, written first and seen to fail, with the asset clock one day past the covered range, asserting the default is the range's last date and no range notice shows; and a real-browser test asserting the same on a dashboard whose build day is before today."
  non_functional_requirements:
  - "HONESTY: the build line already says when the page was built, so opening on that day is the truthful answer, not a hidden one."
  - "COMPATIBILITY: no change to the query parameter or saved links; a link carrying an explicit date keeps it."
  - "ACCESSIBILITY: one fewer status announcement on every morning load."
  dependencies:
  - REQ-DASH-054
  - REQ-DASH-284
  decisions:
  - "#260 FIXED THE DEAD BUTTON, NOT THE DEFAULT (plans/post-build-review.md #260, 2026-10-22): the notice now offers the newest covered date; whether the default should be that date was left for here."
  - "A STATIC PAGE ANSWERS UP TO ITS BUILD (REQ-DASH-054's own embed note: the newest pickable daily date is the build day; REQ-PIPE-092 rebuilds on every publish)."
  open_questions:
  - "P-Q2 (in summary.md): default to the newest covered date when today is past it (recommended A); keep today and the notice offering the newest covered date (B, today's behaviour since #260); or extend coverage to today so the page opens on today, saying nothing is known after the build (C)."
