# DRAFT v2 - PERIOD CLARITY (plans/running-thoughts.md #118), delivery-scoper,
# 2026-10-23 (Perth). v1 the same day; v2 folds the architect review
# (review-architect.md: B1-B3, S1-S9, notes, AQ1, AQ2) and the dashboard UX
# review (review-dashboard-ux.md: B1, S1-S12, N1-N4) - summary.md maps every
# item to where it went or why not. A PROPOSAL for Keith's sign-off: nothing
# here is in requirements.yaml and nothing is signed. summary.md is the sign-off
# brief, holds the old/new wording of every signed criterion these amend, and
# carries EIGHT QUESTIONS FOR KEITH (P-Q1, AQ1, AQ2, P-Q3, P-Q2, P-Q5, P-Q6,
# P-Q4, in order of how much they change the build). Criteria marked
# PROVISIONAL are written to the recommended answer, which both reviewers
# share for P-Q1 to P-Q4.
#
# STANDS ON the signed #95 batch (REQ-DASH-272, 275, 277, 204 and the rest,
# now in requirements.yaml), REQ-PIPE-279 (in requirements.yaml, signed), and
# REQ-DASH-054, REQ-PIPE-081, REQ-DASH-182 and REQ-DASH-264. TRANSITIVELY
# BLOCKED (architect S9): REQ-DASH-204 depends on REQ-PIPE-211, which is in the
# register UNSIGNED and ordered before 204, so REQ-DASH-285 and REQ-DASH-289,
# which depend on 204, cannot be built until 211 is signed and built.
#
# IDS: 284 to 290, renumbered from 281-287 on 2026-10-23 because 281-283 went
# to REQ-TEST in docs/drafts/small-2026-10-23/. Check the register again when
# this is applied.
requirements:
- id: REQ-DASH-284
  title: "The build embeds each period's window from one slots.py function, and the page has one rule for which period a date is NAMED by, never judged by"
  date_written: "2026-10-23"
  story: "As someone reading any page of the dashboard, I want the page to know when each delivery period opens and closes, for each dataset and as its calendar's default, so that every label it shows me for a period carries the real window that period is open for and not a guess."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-22 (Perth), period-clarity Q1: an authored-date calendar's period is shown with its OPEN-to-CLOSE range, opening when its claim window opens and closing when the next period's claim window opens (qa_tools/common/slots.py closes_at; 2026-Q3, due 1 Aug with a 14-day window, is open 18 Jul-18 Oct 2026); a cadence calendar's period is named by its day; windows are per dataset, with the calendar's default shown beside where they differ. Drafted by delivery-scoper 2026-10-23 (as REQ-DASH-281); v2 the same day for the architect review (B1, B2, B3, S1-S5, notes) and the dashboard UX review (B1)."
  acceptance_criteria:
  - "THE SYSTEM SHALL provide in qa_tools/common/slots.py, beside slot_instants, one function returning a calendar's DEFAULT window for a period - default_window(calendar, period) - as asset-clock dates: open, the asset-clock date of the period's date at 00:00 less the claim window of the calendar version in force on that date (14 days gives 18 Jul for 1 Aug; a 36-hour window lands on the date it falls in); close, the same for the next period; due, the period's date - resolving a pending, unconfirmed calendar correction (REQ-PIPE-173) exactly as slot_instants resolves it, and saying how in its docstring."
  - "THE SYSTEM SHALL build the embedded windows by EXTENDING dashboard/embed_dashboard_data.py's _slots_by_dataset() - the loop that already feeds SLOT_DUE_DATES (REQ-PIPE-167 criterion 5) - filtered to slots whose window has opened (criterion 6), and SHALL NOT add a second loop over slots_for_dataset; the period line's due date and cycleLabel's SLOT_DUE_DATES SHALL come from that one source, with a comment saying why the two cannot disagree."
  - "THE SYSTEM SHALL embed, once per authored-dates calendar period, the default open, close and due DATES from criterion 1, and the default due INSTANT for display."
  - "THE SYSTEM SHALL embed a per-dataset entry for a period ONLY where that dataset's own open or close date on the asset's clock differs from the default, or its due instant is not the default's, carrying its own open and close dates, its due instant and a 'differs' flag that is true where the dates differ; and WHERE a dataset follows its own dates (dataset_dates_override), SHALL mark every one of its periods as differing."
  - "THE SYSTEM SHALL answer which period a date is NAMED by through ONE page function: for a dataset on an authored-dates calendar, the period whose open-to-close dates hold that date (open on or before it, close after it), from the dataset's own entry where it has one and otherwise the calendar default - including a period in which the dataset owes nothing (no slot), which takes the calendar default; for a page spanning datasets, the calendar default; and for a cadence calendar, the day itself. PROVISIONAL ON P-Q1 = A."
  - "THE SYSTEM SHALL end each embedded period sequence at the last period whose default window opens on or before the BUILD's date on the asset's clock - so a build at 08:00 on 18 October 2026 embeds 2026-Q4, which opens at 09:00 that day - and SHALL NOT embed a period whose window opens on a later date, amending REQ-DASH-054 criterion 3 with the wording in summary.md once Keith has approved it. PROVISIONAL ON P-Q1 = A."
  - "THE SYSTEM SHALL end the covered date range - the picker's maximum, the out-of-range notice's offer and REQ-DASH-290's default - at the build's date on the asset's clock (from BUILT_AT), never at a later-dated period and never at the newest period's start, so that a period embedded because its window has opened (criterion 6) never makes a future date pickable, and a quarterly-only deployment is in range every day of its current period. PROVISIONAL ON AQ2: under A this lands first as a defect fix, failing test first, and this criterion is its regression guard; under B it is built here."
  - "THE SYSTEM SHALL use criterion 5's function only where the page NAMES a period - the period line (REQ-DASH-286), the date control and picker (REQ-DASH-287), the spanning pages' line (REQ-DASH-288), the arrival-from banner's 'here' period, and the supply history's 'Current cycle' tag and owed-nothing 'so far' marker - and SHALL leave every caller that JUDGES on the period's date: status, staleness (staleInPlaceOn, owedPeriodStart), gaps and lateness, the no-data banner's 'current expected cycle', notSuppliedWord's Due or No supply, promotionStateOn's period on show (REQ-DASH-198), settledPairPeriod's fallback, decisionsChangingDate and REQ-DASH-209's composition view; each staying caller SHALL carry the comment '// judges by date (REQ-DASH-284)', so the split is greppable, and each moving caller SHALL have a test."
  - "THE SYSTEM SHALL NOT change any status, staleness, rollup, gap, lateness, 'Not owed' or composition judgement because of this requirement."
  - "THE SYSTEM SHALL compute every embedded value from committed configuration alone and SHALL NOT read supply rows or recorded results for it, and SHALL print the bytes the embed adds in the build's output."
  - "THE SYSTEM SHALL have a Python test, tests/test_embed_period_windows.py, written first and seen to fail, on a pinned clock on or after 18 October 2026, asserting first that the window set is not empty, then that default_window gives the quarterly calendar's 2026-Q3 as open 2026-07-18, close 2026-10-18, due 2026-08-01; that cp-notifications carries no per-dataset entry (it matches the default); that a dataset given a days_before of 3 in a test agreement carries one, flagged as differing; and that a build pinned to 08:00 on 2026-10-18 embeds 2026-Q4."
  - "THE SYSTEM SHALL have a JS test, tests-js/period-of-date.test.js, written first and seen to fail, asserting that for cp-notifications 2026-10-17 is named 2026-Q3, 2026-10-18 is 2026-Q4, 2026-07-17 is 2026-Q2 and 2026-07-18 is 2026-Q3; that where no dataset differs a dataset page and a spanning page name the same period; that cp-case-workers on 2026-06-01, a month it owes nothing, is named by the calendar default; that birth-registrations' 2026-10-22 is the day 2026-10-22; and that with the build on 2026-10-22 and 2026-Q4 embedded the covered range ends 2026-10-22, also for a quarterly-only fixture with no daily calendar."
  - "THE SYSTEM SHALL have a real-browser REGRESSION GUARD, passing on today's page, that on 2026-10-22 - asserting first that the date lies inside 2026-Q4's embedded window and before 2026-Q4's date - cp-notifications keeps its 2026-Q3 supply's verdict, is not shown as 'No data' or stale, and REQ-DASH-209's composition view shows no 2026-Q4 row."
  - "WHERE a supply is filed to 2026-Q4 before 1 November 2026, THE SYSTEM SHALL head its supply-history cycle as 2026-Q4, not 2026-Q3's, and a /period/2026-Q4 link SHALL resolve - both of which fail today because 2026-Q4 is not embedded before its date - with a real-browser test of each. PROVISIONAL ON P-Q1 = A."
  non_functional_requirements:
  - "THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else; this embed reads configuration only, as REQ-DASH-054's PERIOD_SEQUENCES does."
  - "SIZE AT TARGET SCALE (architect S2): dates, not instants, and per-dataset entries only where a dataset differs. Full per-dataset instants would be about 90KB today and about 500KB (~3% of a ~16MB page) at ~100 datasets x 55 quarters; sparse, the default is one entry per calendar period and today's per-dataset count is zero. The embed prints its bytes (criterion 10)."
  - "NO SECOND TIMEZONE IMPLEMENTATION (architect S2): membership compares asset-clock DATES computed at build, so the page needs no instant arithmetic beside ASSET_TIMEZONES; the due instant is carried for display only."
  - "ONE RULE EACH: windows in slots.py (criterion 1), membership in one page function (criterion 5), and the names/judges split greppable (criterion 8) - CLAUDE.md's shape-change rule found four status implementations where two were known."
  - "PERFORMANCE: lookups by index or binary search; no history walk per render."
  - "SCALE (~30 collections on the quarterly asset): one default per calendar period whatever the number of datasets."
  - "PRIVACY: configuration only."
  dependencies:
  - REQ-DASH-054
  - REQ-PIPE-131
  - REQ-PIPE-167
  - REQ-PIPE-173
  - REQ-DASH-198
  - REQ-DASH-209
  decisions:
  - "OPEN TO CLOSE, NOT CALENDAR DATES (Keith, 2026-10-22, Q1 option A as he amended it). REJECTED the critic's '1 Aug-31 Oct', option B (label by reference period - no such field) and option C for authored calendars."
  - "A CADENCE CALENDAR IS NAMED BY ITS DAY (Keith, 2026-10-22, Q1 option C for daily): nothing is embedded for a daily calendar."
  - "PER DATASET, WITH THE CALENDAR'S DEFAULT (Keith, 2026-10-22)."
  - "A NEW slots.py FUNCTION FOR THE DEFAULT (architect S3): slots.py and schedule.claim_window() answer per dataset only; computing the default inside the embed would be a second schedule implementation. The date rule is the asset-clock date of (period date 00:00 - window). REJECTED computing it in embed_dashboard_data.py."
  - "EXTEND _slots_by_dataset(), DON'T ADD A LOOP (architect S1): it already calls slots_for_dataset for SLOT_DUE_DATES, and COLLECTION_DATA's lateSlots and closedSlots already carry closesAt; two loops could disagree on a due date."
  - "DATES, SPARSE (architect S2): membership only needs dates under the end-of-date rule; per-dataset entries only where they differ keep the embed small at target scale. REJECTED v1's per-dataset instants for every slot."
  - "'DIFFERS' IS JUDGED BY DATE (delivery-scoper; both reviewers agree): a 14:00 due against 09:00 on the same day is not a different window. No Child Protection or Emergency Department dataset differs today."
  - "A PERIOD WITH NO SLOT TAKES THE DEFAULT; A DATASET WITH ITS OWN DATES ALWAYS DIFFERS (architect S4, delivery-scoper's choice of his two options): cp-case-workers in June is named by the calendar's 2026-Q2 so the page can say 'Not owed' for it; a dataset with its own dates has no meaningful default, and is named in the difference note rather than silently excluded from it."
  - "A DATE BELONGS TO THE PERIOD WHOSE DATES HOLD IT, AND THE SEQUENCE ENDS AT THE BUILD'S DATE (dashboard UX B1 = architect S5): v1's 'opened by the present moment' left a build at 08:17 on 18 October without 2026-Q4 though the page named 2026-Q4 for that date. The embed now uses the same date rule as membership."
  - "THE COVERED RANGE ENDS AT THE BUILD'S DATE (architect B1, B2): coveredDateRange() takes the newest period DATE, so embedding 2026-Q4 from 18 October would make 1 November pickable, and a quarterly-only deployment (the target shape) already reads out of range every day after its period starts. A defect today, independent of this batch - AQ2."
  - "NAMES, NEVER JUDGES, CALLER BY CALLER (architect B3, classified by delivery-scoper from the template): periodNameFor names in four places that move (the arrival-from banner, the owed-nothing 'so far' and 'Current cycle', the picker) and judges in the rest. promotionStateOn's period on show stays on dates because it decides what the warehouse stood on - before any 2026-Q4 supply is filed, 2026-Q4 is not opened (REQ-PIPE-271) and the supply in place is 2026-Q3's; the text it produces names that supply through REQ-DASH-285's helper, so a Q4 page reads 'the 2026-Q3 supply' rather than an unqualified 'this period'."
  - "NAMING ONLY, NEVER STATUS: staleness reads the filed period against owedPeriodStart by period date; moving it to the window would turn every quarterly dataset 'No data' from 18 October, before its supply is due."
  - "TWO LATENT FIXES COME WITH A (architect note): an early 2026-Q4 supply's cycle heads as 2026-Q3 today because periodDateNamed('2026-Q4') is null until 1 November, and /period/2026-Q4 is Not-found; criterion 14."
  open_questions:
  - "P-Q1 (summary.md): name a date by the period whose window holds it (recommended A; both reviewers agree) or by the period whose date has passed (B, as the mock-up did). Criteria 5, 6 and 14 are written to A."
  - "AQ2 (summary.md): fix the covered-range defect now, test first, independent of this batch (recommended A), or fold it into REQ-DASH-290 (B)."
- id: REQ-DASH-285
  title: "Every supply the dashboard names is named through one helper that returns its period as a structured part"
  date_written: "2026-10-23"
  story: "As a data team leader reading a quarterly dataset in late October, I want a supply from an earlier period to be named by that period - 'the 2026-Q3 supply, received 9:00am Saturday, 1 August 2026' - wherever the page names it, so that I can tell at a glance that the results I am reading are from the period before the one now open."
  moscow: must
  status: not_started
  source: "Dashboard UX critic, 2026-10-22 (review-ux-critic.md B1, B2, S2). Dashboard UX reviewer, 2026-10-22 (review-dashboard-ux-279v3-95v5.md P1): REQ-DASH-272 criterion 22's one Python helper 'so that the period-clarity work changes supply naming once'. Drafted by delivery-scoper 2026-10-23 (as REQ-DASH-282); v2 the same day for the architect review (S6, S7, S9) and the dashboard UX review (S12)."
  acceptance_criteria:
  - "THE SYSTEM SHALL have REQ-DASH-272 criterion 22's one Python helper return, for each supply it names, structured parts - its receipt instant, the period it was filed to, and its long and short forms with and without the period - embedded per dataset as a supplyNames map keyed by run, and SHALL name through it every supply the dashboard shows a person: REQ-PIPE-081 criterion 1's verdict line as REQ-DASH-277 and REQ-DASH-272 word it; REQ-DASH-272's clause, cell notes, panel sentences and history row; REQ-DASH-275's and REQ-DASH-204's notices; and, moved from the page's own script into that map, the collection list's Latest arrival cell, the column drawer's row-counts heading, the check panel's not-evaluated heading and its 'Latest result'/'Current run' label, and the check panel's compare list and history rows (REQ-DASH-286 criterion 9). The helper's shape is PROVISIONAL ON AQ1 = A."
  - "WHERE the period a named supply was filed to is not the period the page names for the date on show (REQ-DASH-284 criterion 5), THE SYSTEM SHALL show the form with the period - long 'the <period> supply, received <instant>', short '<dataset> <period>, received <day>' - and WHERE it is the same period, the form without it, the page's choice being one comparison of two period names, commented as presentation of a computed value. PROVISIONAL ON P-Q3 = A."
  - "THE SYSTEM SHALL write <period> through fmtPeriodOrDay - '2026-Q3' for an authored calendar, the day as fmtDay gives it for a cadence calendar - SHALL fold the ED promotion block's fmtPeriodName into it so that the page has one period formatter, and SHALL NOT put an open-to-close range in a supply's name."
  - "WHERE a supply on a cadence calendar was received on a different day from its own period's day (the evening-before era), THE SYSTEM SHALL name both - 'the 25 June 2026 supply, received 9:58pm Wednesday, 24 June 2026'."
  - "WHERE a supply stands in for a period by inheritance or substitution, THE SYSTEM SHALL keep REQ-DASH-272 criterion 4's 'carried forward from <period>' form."
  - "THE SYSTEM SHALL amend, in the same change, REQ-DASH-272 criterion 22 and the quoted supply-naming forms of REQ-DASH-272 criteria 1, 8, 12 and 20, REQ-DASH-275 criteria 1, 4 and 6, REQ-DASH-204 criterion 2 and REQ-DASH-277 criterion 1, with the wording in summary.md once Keith has approved it, changing nothing else any of them requires; under AQ1 = A, the criterion 22 amendment is applied to REQ-DASH-272 before 272 is built."
  - "THE SYSTEM SHALL render every name as text, never as markup."
  - "THE SYSTEM SHALL have a Python test of the helper, written first and seen to fail, covering the authored long and short forms with and without the period, the cadence form on its own day and the evening-before form; and a real-browser test, tests/test_dashboard_e2e.py::TestSupplyNamesCarryTheirPeriod, against a dashboard built from a fixture history, written first and seen to fail, in which cp-notifications on 2026-10-22 reads 'The results below are the 2026-Q3 supply in place in the warehouse, received 9:00am Saturday, 1 August 2026.' and on 2026-08-15 the same line with no period in it, and the ED promotion block's period reads as fmtPeriodOrDay gives it."
  non_functional_requirements:
  - "NO SECOND VOCABULARY (dashboard UX review P1, P2): the period reaches every sentence through the one helper; not a third rewording of REQ-PIPE-081 criterion 1."
  - "BUILD ORDER (architect S6, S9): needs REQ-DASH-272's helper with structured parts (AQ1), and depends on REQ-DASH-204, which depends on the UNSIGNED REQ-PIPE-211 - so this is transitively blocked until 211 is signed and built."
  - "LENGTH AND PHONE WIDTH: the period adds about 16 characters, only where it is news."
  - "PERFORMANCE: the helper runs at build; the page compares two period names."
  - "MAINTAINABILITY: one helper and one formatter."
  - "ACCESSIBILITY: the period is plain text in the sentence and in every accessible name that carries it."
  dependencies:
  - REQ-DASH-272
  - REQ-DASH-275
  - REQ-DASH-204
  - REQ-DASH-277
  - REQ-DASH-284
  - REQ-PIPE-081
  decisions:
  - "THROUGH THE ONE HELPER (dashboard UX review P1, in REQ-DASH-272 criterion 22). REJECTED a period sentence beside each existing sentence."
  - "STRUCTURED PARTS, SETTLED BEFORE 272 IS BUILT (architect S6, AQ1 = A recommended): 272 c22 forbids re-deriving names in the page, and this requirement has the page choose per date whether to print the period. Settling the helper's shape now - one line in 272 before its build - avoids building it flat and then rewriting it and every caller. The page's choice is one comparison, presentation of a computed value."
  - "TEXT MOVED INTO THE HELPER IS NAMED (architect S7): the Latest arrival cell, the drawer's row-counts heading, the check panel's not-evaluated heading and result label, and its compare list and history rows are rendered in the page today and outside 272's scope; criterion 1 lists them and the supplyNames map is the build output that carries them."
  - "THE PERIOD ONLY WHERE IT IS NEWS (P-Q3 = A; both reviewers agree). REJECTED always (bloats 275's and 204's notices) and never (leaves S2's old results unnamed by period)."
  - "ONE PERIOD FORMATTER (dashboard UX S12): fmtPeriodName builds a local-time Date and can disagree with fmtDay on the asset clock."
  open_questions:
  - "AQ1 (summary.md): specify REQ-DASH-272's helper now to return structured parts (recommended A), or build 272 flat and rework it under this requirement (B)."
  - "P-Q3 (summary.md): the period in a supply's name only where it differs from the page's (recommended A), always (B) or never (C)."
- id: REQ-DASH-286
  title: "A dataset page names its period in one line under its name, with the period's window, what has arrived for it, and how old the results are once that is news"
  date_written: "2026-10-23"
  story: "As a data team leader opening a dataset's page, I want one line under its name saying which period I am looking at, when that period is open, and whether anything has arrived for it yet - and, once it is overdue, how old the results below are - so that I never mistake last quarter's green for this quarter's."
  moscow: must
  status: not_started
  source: "Dashboard UX critic, 2026-10-22 (review-ux-critic.md B1, S1, S2, N1). Keith, 2026-10-22 (Perth), Q1 and Q2 = B (the period line under the dataset name and in the column and check panel subtitles), after the mock-ups. Dashboard UX reviewer P2. Drafted by delivery-scoper 2026-10-23 (as REQ-DASH-283); v2 the same day for the dashboard UX review (S1-S5, S9, N1, N2) and the architect review (the empty Q4 cycle)."
  acceptance_criteria:
  - "THE SYSTEM SHALL show on every dataset page, in .view-head's left column between its <h2> and .view-sub, one period line marked data-period-line, naming the period the date on show is named by for that dataset (REQ-DASH-284 criterion 5), on each of the four render branches that write .view-head - no data on the date, blocked, owed nothing or never supplied, and the normal view - above every notice inside the dataset view (REQ-DASH-275's, REQ-DASH-204's, the blocked and waiting banners) and above the verdict line; the global past-date notice stays where it is, above the <h2>."
  - "THE SYSTEM SHALL word the first line, for an authored-dates calendar, '<period> · open <date> – <date> · due <date>' - for example '2026-Q4 · open 18 Oct 2026 – 18 Jan 2027 · due 1 Nov 2026', the year written once where both ends share it ('open 18 Jul – 18 Oct 2026') - and for a cadence calendar 'The <day> supply · due <time>' - for example 'The 22 October 2026 supply · due 2:00pm'."
  - "WHERE the dataset's own window for the period differs from its calendar's default (REQ-DASH-284 criterion 4), THE SYSTEM SHALL follow the range with muted text '(calendar default: open <date> – <date>)', and SHALL NOT show it where they agree."
  - "WHERE the results below are not a supply of the period the line names, THE SYSTEM SHALL add a second line saying what that period holds, in the form that applies: 'Nothing received for <period> yet — due <instant>.' before its late instant; 'Nothing received for <period> — late since <instant>, open until <date>.' while REQ-DASH-133's late-but-open state holds; 'No supply for <period> — closed <date>.' once it has closed; or REQ-DASH-182's owed-nothing label from its one function ('Not owed — outside its agreed months (Feb, Aug)') - the full due instant appearing here and never on the first line."
  - "WHERE results are shown and the named period is past its late instant without a supply - and, for a cadence calendar, in any gap - THE SYSTEM SHALL end the second line with 'The results below are <n> days old.', <n> being whole days on the asset's clock from the receipt of the supply shown to the date on show, and SHALL NOT show the age before the named period's late instant. PROVISIONAL ON P-Q5 = A."
  - "THE SYSTEM SHALL NOT add a second line where the results below are a supply of the period named, and SHALL NOT repeat the verdict line's or any notice's wording."
  - "THE SYSTEM SHALL style the line as plain text in the page's existing tokens - the period bold in var(--ink), the rest at .view-sub's size in var(--ink-muted), the second line muted at 12.5px like .verdict-of - with no border, box or background, and SHALL NOT use --surface-2."
  - "THE SYSTEM SHALL end the subtitle of the column drawer and of the check panel with ' · <supply>', the supply whose results the panel shows, in REQ-DASH-285's short form WITH its period whatever the page's period ('risk_rating · Notifications 2026-Q3, received 1 Aug 2026'), SHALL head the drawer's row counts 'Row counts — <supply>' in place of 'Current run — row counts', and SHALL name the supply under the check panel's 'Latest result' or 'Current run' label in the same form."
  - "THE SYSTEM SHALL label each option of the check panel's compare list and each row of its history table, for an authored-dates calendar, with the supply's period in REQ-DASH-285's short form - in place of a bare 'Run date' - so that scheduled supplies and resupplies of one period read as that period's."
  - "THE SYSTEM SHALL head each supply-history cycle on an authored-dates calendar '<period> — due <day>' in place of 'Cycle starting <day>' (a following-period dataset's '<period> — due <day> (period dated <day>)' in place of 'Cycle due <day> (period dated <day>)'), keep a cadence calendar's day heading, put the 'Current cycle' tag on the period the period line names - showing that period as an empty cycle row where it has no supply yet - and say 'Nothing received for <period> yet.' in place of 'No deliveries in the current cycle yet.', amending REQ-DASH-182 criterion 10's quoted text with the wording in summary.md once Keith has approved it. The tag's placement and the empty row are PROVISIONAL ON P-Q1 = A."
  - "THE SYSTEM SHALL compute the line from the embedded windows (REQ-DASH-284), the embedded late slots and the results already embedded, looking each up, and SHALL render every name as text."
  - "THE SYSTEM SHALL say every state in words, never by colour alone, and SHALL write the range for screen readers in full in a .sr-only span ('open from 18 October 2026 to 18 January 2027'), with the abbreviated visible range aria-hidden, rather than an aria-label on a static element."
  - "AT PHONE WIDTH, THE SYSTEM SHALL wrap the period line within the viewport with no horizontal scroll, breaking between its '·'-separated parts rather than inside a date."
  - "THE SYSTEM SHALL have real-browser tests, tests/test_dashboard_e2e.py::TestPeriodLine, against a dashboard built from a fixture history, written first and seen to fail, in which: cp-notifications on 2026-10-22 reads '2026-Q4 · open 18 Oct 2026 – 18 Jan 2027 · due 1 Nov 2026' then 'Nothing received for 2026-Q4 yet — due 9:00am Sunday, 1 November 2026.' and no age; on 2026-11-02, with still nothing received, the second line ends 'The results below are 93 days old.'; on 2026-08-15 it reads '2026-Q3 · open 18 Jul – 18 Oct 2026 · due 1 Aug 2026' with no second line; birth-registrations on 2026-10-22, with nothing since 25 September, reads 'The 22 October 2026 supply · due 2:00pm' and 'The results below are 27 days old.'; a fixture dataset with its own days_before shows the calendar-default text and cp-notifications does not; the line is present on each of the four render branches, a never-supplied or owed-nothing dataset included; the line follows the <h2> and precedes .view-sub, every notice inside the view and the verdict line in document order; supply history carries an empty 2026-Q4 row tagged 'Current cycle'; the check panel's subtitle and compare options carry the period; the range's .sr-only text is the full form; and at 375px wide the line has no part outside the viewport, in light and dark mode."
  non_functional_requirements:
  - "RECOGNITION OVER RECALL (docs/hci-ux-psychology.md; critic B1)."
  - "ABOVE THE FOLD ON A PHONE: before the description (critic: the verdict line sat at y=1030 at 390x844)."
  - "NOT A NOTICE (dashboard UX S3): plain text, so it does not compete with .notice-exhausted."
  - "ACCESSIBILITY: words never colour; the full range in .sr-only; static text re-rendered with the page, not a live region."
  - "DARK MODE: existing tokens only."
  - "PERFORMANCE (~16MB page): a few index lookups per render."
  - "COMPATIBILITY: no new asset; file:// and offline unaffected; query parameter unchanged."
  - "PRIVACY: the period and the dataset, never a file name."
  dependencies:
