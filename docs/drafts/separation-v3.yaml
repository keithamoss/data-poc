  - id: REQ-GEN-386
    title: "The generator and its providers import only the shared domain model and a small shared scenarios package, reach the bootstrap through nothing, and offer the bootstrap and cli/ one public entry point"
    date_written: "2026-11-02"
    story: "As whoever maintains the generator, I want it to depend only on the shared model of an asset, so that it can change, or be left out, without touching the pipeline or the bootstrap."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; 'the generator's imports narrowed to the shared domain model'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1); v2 the same day with Keith's answers Q1-Q8 (SETTLED 2026-11-02). v3 the same day with his answers to v2's three open questions. A PROPOSAL, not signed until Keith signs v3."
    acceptance_criteria:
      - "THE SYSTEM SHALL let generator/, synthetic_data_generator/ and each asset's providers import only the domain model, the shared scenarios package (criterion 4), the standard library and declared third-party dependencies (Q1, SETTLED by Keith 2026-11-02); at b03a7be6 they hold 86 import statements of qa_tools in 13 files, naming 21 modules, of which the four domain modules are 75 of 122 imported names."
      - "THE SYSTEM SHALL remove every import of the real pipeline from the generator, each pure function it calls moving into the domain model (REQ-PIPE-380 criterion 5) - assignment.open_slot, arrival_classification.classify, check_bands.catalogue among them - and SHALL record where each of today's 17 non-domain modules' uses went in this requirement's decisions when built."
      - "THE SYSTEM SHALL give the generator one public entry point, used by the bootstrap and cli/: generate an asset's history, and report what was generated under a root (generator/output.generated_into today, reached from the bootstrap through cli/pipeline.py). The bootstrap SHALL import nothing else of the generator."
      - "THE SYSTEM SHALL hold in one small shared scenarios package (Q4, SETTLED by Keith 2026-11-02), named scenarios/ at the top level (SETTLED by Keith 2026-11-02) the reader of each asset's scripted_decisions.yaml (load, PERIOD, CHAIN_MARK, CHAIN_OPERATIONS and the due-instant helpers the generator calls today) and the scenario vocabulary (SUBJECTS, SUPPLY_HISTORY_ROW, AS_AT_PANEL and the rest); the generator and the bootstrap may import it, it imports only the domain model, and nothing in the real pipeline imports it."
      - "IF the generator imports the bootstrap package, THEN `mothman check` SHALL fail (REQ-TEST-384); today's 8 such statements (scripted_decisions, correction_replay, in scenario_injection.py, correction_claims.py and linkage_products.py) SHALL go, through criterion 4's package or criterion 2's moves."
      - "THE SYSTEM SHALL move the scenario map's writer to the generator, which places the scenarios."
      - "THE SYSTEM SHALL move delivery writing (delivery.write_delivery, remove_deliveries) to the generator, keeping the delivery layout and file-name reading the pipeline uses in the domain model or the pipeline."
      - "THE SYSTEM SHALL show through REQ-TEST-239's compare that no byte any collection generates changes, for each asset."
    non_functional_requirements:
      - "BEHAVIOUR-PRESERVING: every generated file is unchanged, proven by REQ-TEST-239's compare."
      - "PERFORMANCE: providers stay importable without pandas or numpy (REQ-GEN-246 criterion 7), so the providers gate's time is unchanged."
      - "MAINTAINABILITY: a generator that predicts what the pipeline will do (target trials, correction claims) through the pipeline's own code stays in step with it; one that takes data instead can drift - which is why Q1 settled on moving the functions rather than passing data."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-TEST-384"
      - "REQ-GEN-370"
      - "REQ-GEN-246"
      - "REQ-TEST-239"
    decisions:
      - "NARROWED TO THE DOMAIN MODEL (Keith, 2026-10-31, #134's code half). REJECTED (b) and (c) of #134 as in REQ-PIPE-380."
      - "ONE ENTRY POINT, NOT A SUBPROCESS (delivery-scoper's choice): REJECTED having the bootstrap run the generator only as a `mothman` subprocess, which would lose the in-process resume comparison (REQ-TEST-160) for no gain the gate does not already give."
      - "A SHARED SYNTHETIC-CONFIG PACKAGE (Q4, SETTLED by Keith 2026-11-02): REJECTED the generator owning the readers (the bootstrap would then import the generator beyond its entry point), and REJECTED the bootstrap owning them (the generator would import the bootstrap)."
      - "DOMAIN MODEL ONLY (Q1, SETTLED by Keith 2026-11-02): REJECTED a permanent list of allowed pipeline modules, and REJECTED taking everything as data."
      - "THE SHARED PACKAGE IS NAMED scenarios/, AT THE TOP LEVEL (SETTLED by Keith 2026-11-02): REJECTED synthetic_config/. It does not clash with the scenarios modules moving into bootstrap/ or with cli/scenarios.py, because imports here are absolute (bootstrap.scenarios, cli.scenarios)."
    open_questions: []
