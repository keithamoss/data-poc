  decisions:
  - "Scoped as its own requirement and built before REQ-PIPE-265 is flipped to built, rather than folded into #95 v5 (Keith, 2026-10-22, option A)."
  - "ONE REQUIREMENT, built in two chunks - the record (criteria 1-8, 23), then its readers - under one sign-off (Keith, 2026-10-22, split = A). Rejected - two requirements and two sign-offs: the record alone delivers nothing visible, and REQ-PIPE-265 waits on both."
  - "ONE ORDER FOR 'NEWEST', page and gate alike: evaluation order, run_seq (Keith, 2026-10-22, K1 = A) - a Wednesday re-check of a Monday-effective decision is newest everywhere because it is the only result that saw the decision, and post-build-review #116 D1 still holds because a re-run is always opened after what it re-runs. The gate's effective-time order is replaced. Rejected - run_seq for the page and effective time for the gate, with the disagreement named in a criterion (K1 = B; architect B4): the page and the gate would name different results as newest for every decision recorded after the fact."
  - "run_seq IS THE ORDER RUNS WERE OPENED, NOT A CLAIM ABOUT WHAT THEY SAW (architect v3 S1): v3's sequencing NFR said only within-collection sequencing kept a decision out of the gap between overlay and open_run, which was false - a person's supply decide takes only slot locks. The gap is bounded rather than closed: what a run saw is its qa.check_read, and placement and the gate filter on that; test 18 pins it. Rejected - drawing run_seq at resolution time, which moves the gap rather than closing it and puts the draw in every resolution path (period_overlay, stage, supply_db)."
  - "drift_reference follows run_seq (architect v3 S2's recommendation, a direct consequence of K1's one order): drift_reference.run_for prefers qa.current_run, which follows supply_current_run, so Evidently's reference changes on today's ties; its fallback ordering by run instant and LIKE on run-id text goes with the rest."
  - "A RESULT THAT READ NO SUPPLY OF A TABLE (ABSENT or NO-SUPPLY) shows only on the page of the table its check is declared on (Keith, 2026-10-22, K2 = A): Notifications' Q3 'every notification has a client', with no Clients filed for Q3, reads red on Notifications' page and Clients' page keeps its Q2 supply's result as newest. Bounded by REQ-QAC-037 criteria 6-7 (a cross-table result is about every table it reads, shared not copied) and #258 Q13 = B (could-not-run counts toward the declaring table only). Rejected - also showing it on Clients' newest point as could-not-run (K2 = B), a point it never read; 174 results on ed_probe have this shape."
  - "REQ-DASH-264 CRITERION 1 IS AMENDED TWICE (Keith, 2026-10-22, accepting the architect's technical answer in docs/drafts/unjudged-cross-table/summary.md's V5-Q1 paragraph): this requirement amends it with its own wording, and #95's REQ-PIPE-269 amends it again quoting this one's as OLD, since 279 ships first and #95's is a strict refinement. Rejected - 279 leaving criterion 1 to REQ-PIPE-269 and shipping only its K2 clause."
  - "EVERY EVALUATION IS ITS OWN POINT, ordered by run_seq (Keith's own option, 2026-10-22, K3 = C: \"record/show two points for notifications - one for what was checked on Monday and another for what was re-checked on Tuesday\"). In a delivery whose files are checked at different instants - across midnight or any gap; five deliveries on ed_probe, up to 2h50m apart - the later file's result is a second, newer point, nothing is re-dated or overwritten (#258 Q4's \"never re-dating the earlier one\" stands), and REQ-DASH-264 criterion 12's same-day rule is RETIRED rather than amended: being part of the same delivery is no longer a placement rule. Same-instant siblings still give one point, because REQ-PIPE-265 evaluates once and carries."
  - "Rejected - the delivery decides (K3 = A, the v2 draft's recommendation): it merged the Tuesday result into Monday's point, so the point kept its date while its value changed under it - a re-dating of the value. Rejected - the delivery AND the same day (K3 = B): brings the day rule back, with a test that depends on the time zone (asset_time.local_date)."
  - "THE CAUSE OF AN ARRIVAL RUN IS ITS ARRIVAL - its REQ-PIPE-265 sibling group, the supplies filed from one delivery at one receipt instant - not its delivery (follows from K3 = C). Under the v2 draft the delivery was the cause, which is what folded a later file of the same delivery into the earlier file's point. The cause key is arrival group, decision id, load id or (with REQ-PIPE-267) gate application; an arrival of ANOTHER delivery reading an older supply (Investigations reading 1 February Case Workers) has a cause too, its own arrival (architect B3). Keith noted this becomes an edge case once the transport layer gives real package boundaries (\"this is a package of files to wait and process together\" - plans/supply-thoughts.md). #95's package is this sibling group partitioned by period; the cause is not partitioned, so a zip filed to two periods is one cause and two packages - REQ-PIPE-266's to decide."
  - "A RUN INSIDE A GATE APPLICATION HAS THE APPLICATION AS ITS CAUSE (Keith, 2026-10-22, accepting the architect's technical answer in the V5-Q1 paragraph; architect v5 #95 S2): otherwise each round of an S5 cascade is its own point and the settled history shows intermediate rounds about a supply that ended not promoting. Conditional on REQ-PIPE-267 being built, which owns the gate-application id on qa.run. Rejected - each hold-back decision as its own cause, as #95 v5 drafted it."
  - "A run with no supply (qa.run.supply_id NULL - a trial's or a fixture's, _arrival_purpose) has no cause and is placed on no point, shown as today (architect v3 S6): there is nothing it could be about."
  - "ONE POINT PER SUPPLY AND CAUSE (Keith, 2026-10-22, K4 = A), read alongside K3 = C as 'each thing that happened is its own point' - an arrival, another arrival, a decision: one re-file of Clients that re-runs Notifications' and Investigations' readers checks gives Clients' trend one re-check point, not two seconds apart (7 decisions on ed_probe caused more than one readers run). Rejected - one point per run (K4 = B): how many points a hub table gets would depend on how many tables read it, mostly noise at thirty collections."
  - "THE DEFAULT COMPARISON IS THE NEWEST EARLIER POINT WITH AN EVALUATED RESULT FOR THAT CHECK (Keith, 2026-10-22, N1 = B), 'earlier' meaning lower emitted rank and 'evaluated' the one existing definition (carried.not_evaluated_reason, NOT_EVALUATED_KEYS). With the reviewers' conditions: one function decides both the default and the ?cmp= rule (dashboard UX S7 - an existing defect, setCompareIdx dropping ?cmp= at history.length-2 while the real default is defaultCompareIndex, fixed test-first here as test 26); each compare and history entry names its cause; and once #95's grid lands, comparison stays within one bucket (staged or warehouse) - REQ-PIPE-272's to state. Rejected - the point just before (N1 = A), often 'could not be checked' (312 of 2,508 same-day pairs); and the previous supply's newest point (N1 = C), which hides what a re-check changed."
  - "A NON-OWN POINT NAMES ITS CAUSE IN THE SPARKLINE TOOLTIP, and the list's counts, its sparkline and the panel's run count share one function (dashboard UX review section 4): a staggered quarterly delivery now gives two or three points minutes apart where a zip gives one, which reads as several supplies unless each says where it came from (also period-clarity N4). The cause-naming must fit the compare card; post-build-review #261 (the 'Latest result' half pushed out by a long compared-run label) is a separate defect fix with its own failing test, and nothing here widens that label beyond the cause REQ-DASH-264 already names."
  - "A RETRIED RUN DRAWS A NEW run_seq WHEN IT STARTS AGAIN (Keith, 2026-10-22, K5 = A): it ranks after anything opened in between. Rejected - keeping the first number and refusing a retry whose resolution changed (K5 = B): the retry would fail and need a new run key and a new path."
  - "EVERY ATTEMPT OF A RUN IS RECORDED (Keith, 2026-10-22, added under K5: \"it should also be obvious somewhere that it did time out or crash\"; \"yes, add it to 279\"). Checked against the code that day: reopen_run only clears completed_at and record_results replaces a tool's results, so today a failed attempt leaves no trace once retried. The record feeds both the crash's visibility and check durations (plans/running-thoughts.md #120). HOW IT IS SHOWN IS NOT IN THIS REQUIREMENT - it goes to the UX review (plans/running-thoughts.md #121), which should pick 'interrupted' or 'stopped' for display and may reuse supply decide's 'Something is using these tables right now ... retry in a minute' for a timeout (CLI UX review)."
  - "AN ATTEMPT WHOSE PROCESS DIED IS CLOSED AS INTERRUPTED, END TIME UNKNOWN, ONLY WHEN THE NEXT ATTEMPT OF THAT RUN TAKES THE RUN'S LOCK (Keith, 2026-10-22, N2 = A with his lock rule). Keith asked how we would know it had died rather than still running: PostgreSQL releases a session advisory lock when its connection dies, and processing_pass.arrival_lock already holds one per arrival for a whole run, so Keith approved every attempt holding one named after its run key (today some re-check and knock-on locks last only for the claim). Never closed from incomplete_runs, a read function that cannot tell a dead attempt from a live one in another process - closing a live one would lose its real outcome (architect v3 N2). Rejected - recording it as CRASHED with no end time (N2 = B): 'crashed' would then mean two things. Rejected - a timeout or heartbeat deciding death: a clock guess, which this requirement exists to remove."
  - "A STOP SEEN FROM OUTSIDE IS INTERRUPTED, NEVER CRASHED (CLI UX review; architect v3 S5): Ctrl-C during supply decide --wait (filing_tui) or a stopped pass is somebody stopping it, not a fault, so KeyboardInterrupt, SIGTERM and SystemExit end an attempt INTERRUPTED with its end time known; one outcome then covers every 'stopped from outside', end known or not."
  - "TIMED-OUT is only what this project's own connections can see (architect v3 S5): SQLSTATE 55P03 or 57014 on a connection we opened. A dbt or Soda timeout arrives as QaRunFailure and records CRASHED, said in the end-writer's docstring rather than guessed from message text. The end is written on a fresh connection, because the attempt's own transaction may be aborted. COMPLETED means complete_run succeeded; the census and the gate after it are not part of the attempt."
  - "trial.discard is the one thing allowed to remove attempts (architect v3 S4): REQ-PIPE-103 criterion 6 deletes a trial run and everything under it, so qa.run_attempt has no foreign key to qa.run and the discard deletes its attempts by run key, as it does the census. Rejected - letting the discard fail on attempts, which would break trials."
  - "mothman debug run-* is refused against an evaluated run (architect v3 S3): it writes through record_run and record_results into an existing completed run, which would replace results and check_read rows under an old run_seq with no attempt. Rejected - letting it draw a run_seq and attempt of its own, which would make a debug invocation outrank the real runs on the page and the gate."
  - "NO BEFORE/AFTER EQUIVALENCE COMPARISON for this requirement (Keith's own option, 2026-10-22, K6 = C: \"The equivalence check is all about the refactor ... this is about genuine changes, so we don't need to run the equivalence check\"). It is proved by its own guess-failing tests (criteria 26-28) and an ordinary bootstrap from empty, with criterion 25 bringing any moved pin to Keith rather than re-pinning it (architect v3 note, the rule #95's REQ-PIPE-271 criterion 9 already carries). Rejected - accepting differences once each is listed with the tie or order that changed it (K6 = A, the v2 recommendation and architect S5), and requiring zero differences (K6 = B, which would have kept the run-key tie-break this removes). REQ-TEST-239 itself is untouched here; Keith's note that it \"can be paused and retired ... but not yet deleted\" is plans/running-thoughts.md #122, to which the CLI UX review adds: comparing across the 45 to 46 bump shows differences everywhere, which is not a regression."
  - "THE PAGE DOES NOT YET SAY WHICH SUPPLY A RESULT READ IN THIS REQUIREMENT (Keith, 2026-10-22, K7 = A): the build carries the read supplies in the data (criterion 16). For cross-table rows this is partly overtaken by #95 - REQ-PIPE-272's criterion 8 notes and criterion 12 sentences (Q12 = A) already name the supply read - so the period-clarity requirement (docs/drafts/period-clarity/review-ux-critic.md B2) must extend those rather than add a second vocabulary (dashboard UX review section 4). Rejected - adding it to REQ-DASH-264 criterion 7's sentences inside this requirement (K7 = B), new signed wording with no UX review."
  - "Rejected - the calendar-day rule (REQ-DASH-264 criteria 11 and 12, Keith's #258 Q3 and Q4): the day was a stand-in for 'the same event', and it is wrong both ways - it merges a 15:00 re-check or resupply into a 09:00 delivery of the same day, and its boundary is the asset's time zone, not anything that happened."
  - "Rejected - inferring the run read from the arrival stamp in the run id (read_run's fallback) and the template's \"read || ownRun\" stand-in: both guess the supply of a table the result did not record, and are wrong whenever a held or later arrival shares the day (the Case Workers 1 May 2025 case)."
  - "Rejected - ordering ties by recorded_at, run_instant, run_index or run-id text (recordedAtOf, unitCounts' sorts, the own-run sort, supply_current_run, runs_about, runs_for, list_run_ids, the manifest sort): keys sort as text, so __r10 sorts before __r9 and cp_notifications__X after cp_clients__X__r1; 62 groups of runs on ed_probe share a run instant; a re-check shares its arrival's run_index (recheck.py) and a settled pair's two supplies share one. With no comparison under K6 nothing else would catch a missed site, which is why criterion 20's guard covers the readers too (architect v3 S2)."
  - "Rejected - qa.check_result.id as the sequence: per result where the order needed is per run, and reassigned when a run's results are deleted and re-inserted on re-record."
  - "Rejected - a sequence drawn by a column DEFAULT on insert (the first draft's criterion 4) and frozen for life (architect B1): runs are first inserted at staging by file checks (register_run_if_absent) or by any tool write (record_run), so a DEFAULT records staging time, not evaluation; and a run key is evaluated again in real paths (reopen_run, recheck.mint_run_id reusing an owed run's key). Drawn in open_run, redrawn each time it is opened. The v2 draft said 'in the same transaction as the resolution'; the code records the resolution earlier, in period_overlay's own transaction."
  - "run_seq is named distinctly because three orders already exist and each keeps one job: qa.delivery_file.receipt_sequence and arrivals' sequence are RECEIPT order (REQ-PIPE-061, which arrival came first); run_index is the manifest's arrival enumeration, retired as the build's own-run order; qa.check_result.id is a row identity, never an order. run_seq is OPENING order, the only one that says which result is newer. An attempt is identified by the run_seq it drew."
  - "Rejected - a new delivery-id column on qa.run (the main session's candidate 2): qa.filing already records every supply's delivery (NOT NULL, append-only; a held supply has a filing row with slot NULL), and qa.delivery_file its receipt instant, so a run's arrival group is a join on recorded facts. A second copy is a copy that can disagree."
  - "Within a point, highest run_seq wins, rejecting \"another table's result replaces the own verdict\" (template unitCounts, REQ-DASH-264's decision on REQ-DASH-225 criterion 18). Under K3 = C two results of one check share a point only within one sibling group or one cause's fan-out."
  - "Storage is rows in qa.check_read keyed to check_result.id with ON DELETE CASCADE, not jsonb in extra (architect S3): the gate's SQL joins it, and record_results' delete-and-insert then replaces result and reads atomically. qa.run_attempt is keyed (run_key, run_seq) with no cascade from results or runs, which is the point of it."
  - "Contested, held and pairs recorded as states with supply ids, not names (architect S1): a contested table falls through to the period's promoted supply (supply_db.Resolution.unreadable), an open pair is one filed supply with two files, and a held entry is today a physical name, a supply id or an empty string depending on the path (period_overlay.py, name_held_siblings) - only a supply id lets criterion 15 match."
  - "Whether a table was read from staging or the period is its own recorded field (architect S2): the writer used `logical in resolution.supply_of` as \"is a period table\", which putting staged supplies in supply_of would silently break for unnamed readers."
  - "Recording the supply for a single-table result was rejected as a second copy of qa.run.supply_id; criterion 3's refusal enforces the assumption rather than trusting today's 0 of 20,014 (architect S4)."
  - "Placement reads recorded reads, not today's declarations (architect B2): share_cross_table_results and _cross_table_info used collect_checks(None), so editing a check's declared reads re-placed old history."
  - "name_held_siblings' held-or-absent decision, made at run time from the supply id, stays: it is deterministic and is what decides criterion 1's state."
  - "The physical names in a result's tables_read (REQ-PIPE-036 criteria 10 and 11) stay: they say which TABLE was read; this adds which SUPPLY. qa.tables_read's physical-name matching in runs_about becomes dead and goes."
  - "What stays a time, deliberately: a result's display date (REQ-DASH-264 criterion 9) and the as-of clip (criterion 1) are about WHEN something was recorded. Neither decides what a result is about or which of two is newer. CLI display of recorded_at, run_index, caused_at and run-key text (cli/supply.py) is display only and stays (CLI UX review)."
  - "The gate side (criteria 21 and 22) is in this requirement rather than left to #95 (first draft Q5, settled by the architect's review): leaving it would keep carried.siblings parsing run ids and runs_about matching names, which is the guessing Keith ruled out, and criterion 2's supply on qa.tables_read is needed by the gate anyway."
