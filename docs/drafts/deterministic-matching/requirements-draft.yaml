requirements:
- id: REQ-PIPE-279
  title: "A result recorded under another table's run is placed by the supplies it read and the cause of its run, never by days, times or run ids"
  date_written: "2026-10-22"
  story: "As someone reading a dataset's page, I want every check result recorded under another table's run placed on the supply it actually read, as a point of its own for each thing that caused it to be checked, and ordered by when it was evaluated, from recorded facts alone, so that the page, the list's counts and the promotion gate agree on what each result is about and which is newest, and no two people building from the same history can get a different answer."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-22, after the REQ-PIPE-265 display fix placed results by run-id stamps, calendar days and recording-time tie-breaks: \"I don't want ties and guessing, I want deterministic matching - even if it means changing the metadata we capture.\" Scoped as its own requirement, built before REQ-PIPE-265 is flipped to built (plans/running-thoughts.md #117). Drafted by delivery-scoper 2026-10-22 against the ed_probe bootstrapped history, reviewed by delivery-architect the same day (docs/drafts/deterministic-matching/review-architect.md), revised with Keith's answers to K1-K7 and the split (2026-10-22, K3 = C and K6 = C his own options, the attempt record his addition under K5), then reviewed again by delivery-architect, delivery-dashboard-ux and delivery-cli-ux (docs/drafts/review-*-279v3-95v5.md) and revised 2026-10-23 with those findings and Keith's answers N1 = B and N2 = A with his lock rule. Serves the architect's #95 v4 blocker B2."
  acceptance_criteria:
  # --- What is recorded, at run time ---
  - "WHEN the result of a cross-table check is recorded, THE SYSTEM SHALL record in qa.check_read, in the same transaction and replaced with the result whenever it is recorded again, one row for EVERY table that check reads - those it declares and its own (carried._reads_of) - giving that table's state in the recording run's own resolution and the supply it names: READ (the supply read; for a contested table that fell through to the period's promoted supply, that supply, flagged contested with the contested files named), HELD (the held supply's id, never a physical name or an empty string), ABSENT (no supply), or NO-SUPPLY (a sample or trial table that belongs to no supply)."
  - "THE SYSTEM SHALL carry in a run's resolution the supply of every table it reads or holds, a staged table included, taken from the filing and supply-file records the period overlay already walks (period_overlay.staged_for_period, filing.CURRENT, supply_files.resolve), with whether the table was read from staging or from the period recorded as its own field - never inferred from the presence of a supply - and SHALL write that supply on qa.tables_read for staged tables too, leaving the physical names in a result's tables_read unchanged."
  - "THE SYSTEM SHALL treat the result of a check that reads only its own table as about its run's own supply (qa.run.supply_id), and IF such a result is offered for recording under a run whose dataset_id is not the check's own dataset, THEN THE SYSTEM SHALL refuse it."
  - "IF the read of any table a cross-table check reads cannot be recorded with its result, THEN THE SYSTEM SHALL refuse to record that result and fail the run's write loudly, rather than record a cross-table result with no read (qa_results_writer._with_tables_read's swallowed exception goes)."
  - "WHEN the orchestrator opens a run for evaluation (qa_results_writer.open_run, called by orchestrate._run_one_inner after the run's resolution is recorded and before any tool is invoked), THE SYSTEM SHALL draw the run a new sequence number, qa.run.run_seq, and SHALL draw a new one each time that run key is opened again - a reopen, or an owed re-check retried under its own key - so a retry ranks after every run opened in between; qa_results_writer.record_run and qa_store.register_run_if_absent SHALL NOT set it, and complete_run SHALL refuse a run that has none. run_seq is the order runs were OPENED: what a run saw is its qa.check_read rows, and no criterion or code SHALL infer what a run saw from run_seq alone."
  - "WHEN the orchestrator opens a run for evaluation, THE SYSTEM SHALL record a new ATTEMPT of it in a new qa.run_attempt table - its run key, the run_seq criterion 5 drew and when it began, written in open_run's one transaction with that run_seq - and WHEN the attempt ends, in a finally that catches every BaseException and writes on a fresh connection, when it ended and how: COMPLETED (complete_run succeeded; the census and the gate that follow are not part of the attempt), TIMED-OUT (one of this project's own connections raised SQLSTATE 55P03 lock_not_available or 57014 query_canceled, anywhere in the exception chain), INTERRUPTED (a stop seen from outside - KeyboardInterrupt, SIGTERM, SystemExit or a stopped pass - with its end time), or CRASHED (any other exception, including a tool's own timeout arriving as QaRunFailure, with its type and its message truncated to 1,000 characters); and SHALL NOT change an attempt once it has ended, nor remove it on a reopen (reopen_run), a retry or a re-recording of the run's results (record_results) - the one exception being trial.discard (REQ-PIPE-103 criterion 6), which deletes a trial run's attempts by run key along with the run, qa.run_attempt carrying no foreign key that would make the discard fail."
  - "THE SYSTEM SHALL have every attempt hold a PostgreSQL session advisory lock keyed on its run key from the moment it begins until it ends, so an attempt with no recorded end is RUNNING while that lock is held; WHEN the next attempt of that run key takes the lock and finds an earlier attempt with no recorded end, THE SYSTEM SHALL close that earlier attempt as INTERRUPTED with its end time unknown (NULL, never invented); and SHALL NOT close an attempt from qa_store.incomplete_runs or from any other reader that does not hold that run key's lock - a reader asking whether an attempt is still running answers from whether the lock is held, and leaves the attempt as it is."
  - "IF a results write (record_run, record_results) is offered for a run that has a run_seq and no open attempt - a mothman debug run-* invocation against a run the orchestrator already evaluated - THEN THE SYSTEM SHALL refuse it and say so, rather than replace that run's results and qa.check_read rows under its old run_seq with no attempt recorded."
  # --- What 'newer' and 'one point' mean ---
  - "WHERE two results about one supply are to be put in order - which is newer, in the promotion gate and on the page alike - THE SYSTEM SHALL order them by their runs' run_seq, replacing the gate's order by a decision's effective time (supply_status.runs_about's caused_at), and SHALL NOT break any tie by recording time, effective time, run instant, run index or run-id text."
  - "THE SYSTEM SHALL key every result recorded under another table's run, on a dataset's page and in the dataset list, to ONE POINT - (dataset, the supply of its table criterion 1 recorded it read, the recording run's CAUSE) - where an arrival run's cause is its ARRIVAL, the group of REQ-PIPE-265 siblings it belongs to (criterion 22; a lone arrival is a group of one), a re-check, readers-only or knock-on run's cause is the decision id or load id it records, and, WHERE REQ-PIPE-267 is built, a run opened under a gate application has that application as its cause (qa.run's gate-application id, REQ-PIPE-267 criterion 12); so two arrivals of one delivery checked at different receipt instants are two causes and two points whatever the gap between them, every run that one decision, load or gate application causes adds one point for each supply it read, and a supply's OWN point is the point whose cause is that of the supply's current run (REQ-PIPE-140 criterion 5). A run that belongs to no supply (qa.run.supply_id NULL - a trial's or a fixture's) has no cause and is placed on no point, shown as today."
  - "THE SYSTEM SHALL give each check, within one point, the result of that point's highest-run_seq run that recorded it, whichever table's run that was - so of two sibling arrivals the later one's verdict outranks the earlier one's not-evaluated record (REQ-PIPE-265 criterion 6), and of one cause's several runs the last opened wins - replacing the rule that another table's result replaces the own verdict."
  - "THE SYSTEM SHALL count each point once, through ONE function shared by the dataset list's counts, its sparklines and a check panel's run count, ordered by its rank (criterion 16), a point that is not a supply's own carrying every other check's verdict into it from the point before; and WHEN a later point is recorded SHALL NOT re-date, merge into or overwrite any earlier point; REQ-DASH-264 criterion 12's same-day rule is RETIRED in favour of this."
  - "WHEN a check panel compares one point against another, THE SYSTEM SHALL by default compare it against the newest earlier point (lower emitted rank, criterion 16) whose result for that check was evaluated (carried.not_evaluated_reason and NOT_EVALUATED_KEYS - the one existing definition), with ONE function deciding both that default and whether the ?cmp= URL state is written (setCompareIdx, defaultCompareIndex), and SHALL name on every compare and history entry, and in the sparkline tooltip of every point that is not a supply's own, the cause it came from (\"from the <table>'s run, <time>\", \"from the <table>'s re-check, <time>\") - amending REQ-DASH-264 criterion 11 as summary.md words it."
  - "IF a result's recorded state for a dataset's table is ABSENT or NO-SUPPLY, THEN THE SYSTEM SHALL NOT show or count it on that dataset's page, and SHALL show it unchanged on the page of the dataset the check is declared on - amending REQ-DASH-264 criterion 1."
  - "WHILE REQ-PIPE-115 criterion 10 applies to a dataset, THE SYSTEM SHALL show on that dataset's page each cross-table result whose recorded state for its table is HELD with the held supply's id, and as not run (the existing grey 'No data') each cross-table check with none - amending REQ-DASH-264 criterion 3's \"recorded at or after the held supply's receipt\"."
  # --- What the build emits and reads ---
  - "THE SYSTEM SHALL emit, for each collection, each own point's supply id (qa.run.supply_id), each result's read supplies as criterion 1 recorded them, each point's cause, and a dense rank for every point and every history entry computed from run_seq within that collection, SHALL NOT emit run_seq itself, and the template SHALL order points and entries by that rank alone - still dating each result by when it was recorded (REQ-DASH-264 criterion 9), a point by its lowest-ranked result, and clipping each result by the in-place-on date (REQ-DASH-264 criterion 1)."
  - "THE SYSTEM SHALL take which dataset a run is for and what kind of run it is - for own_runs, recorded_by and REQ-DASH-264 criterion 7's sentences - from qa.run's dataset_id and scope, and SHALL NOT read either off the run id."
  - "THE SYSTEM SHALL decide which datasets' pages a cross-table result is shared to from the tables qa.check_read recorded it reading, and SHALL NOT use the checkout's current declarations (share_cross_table_results, _cross_table_info), so the same history builds the same placement under a later checkout."
  - "THE SYSTEM SHALL NOT compare calendar days, recording times, run indexes or run-id text to decide which supply, cause or point a result belongs to, nor to order two results or two runs, and SHALL remove each place that does - in pipeline/build_dashboard_data.py: read_run's stamp inference, _merged_by_time, the own-run sort by _run_date then run_index then run key, the current value taken as the max recorded_at, and own_runs' and recorded_by's run_owner(run_id); in the readers: qa_results_reader.list_run_ids' natural sort, qa_store.runs_for's ORDER BY run_instant, run_key, and results_history's manifest sort by run_index, with recheck.execute's run_index stamp that exists only for that sort (post-build-review #161); in the template: unitCounts' day comparison, its \"read || ownRun\" stand-in, its chain sort by date and at, its point sort by date, at and runId, recordedAtOf, and sameDelivery, with deliveryCount and defaultCompareIndex re-based on the point key; in the gate: supply_status.runs_about's ORDER BY caused_at, run_key and its physical-name match, and qa.supply_current_run's run_instant, run_key tie-breaks; drift_reference.run_for's fallback order by run instant and its LIKE on run-id text, which take run_seq and qa.run's dataset_id instead; and carried.decide's text-sorted siblings."
  - "THE SYSTEM SHALL have one test that fails if any placement or ordering code in pipeline/build_dashboard_data.py, qa_tools/tools/results_history.py, qa_results_reader, qa.supply_current_run, the template's unitCounts, sameDelivery, defaultCompareIndex and point sorts, supply_status, drift_reference or carried reads recorded_at, a run id's text or a calendar day - an architecture-rule test that says so in its docstring (CLAUDE.md, a test earns its place, rule 1)."
  # --- The gate side ---
  - "THE SYSTEM SHALL answer \"which results are about this supply\" with ONE function (supply_status.results_about, or equivalent) joining qa.check_result, qa.check_read and qa.run, used by the dashboard build, the promotion gate (runs_about, latest_results), carried.decide (whose _same_supplies reduces to comparing recorded supply ids, its siblings taken in run_seq order) and #95's counting rule, with its docstring stating the five recorded states and why, and its tie-break run_seq (criterion 9)."
  - "THE SYSTEM SHALL read REQ-PIPE-265's siblings from the record - arrival runs whose supplies were filed from one delivery with one receipt instant (qa.filing, qa.delivery_file) - and SHALL NOT parse them from run ids (carried.siblings), amending REQ-PIPE-265 criterion 1 as summary.md words it."
  # --- Schema, determinism, pins, tests ---
  - "THE SYSTEM SHALL bump the qa schema from version 45 to 46, so the existing refusal of another version (qa_store._refuse_another_version) has an older database rebuilt from empty by mothman env reset-synthetic and mothman pipeline bootstrap, never migrated."
  - "WHEN the dashboard data is built twice from the same recorded history, including with another collection's runs interleaved differently, THE SYSTEM SHALL produce byte-identical output apart from generated_at."
  - "WHERE the bootstrap from empty under this change moves REQ-PIPE-262 criterion 12's pinned inheritances, TS-63's expectations or REQ-GEN-251 criterion 3's, THE SYSTEM SHALL bring each to Keith with its cause - a generator fix that keeps the pin, or a new value - and SHALL NOT re-pin any silently (carried from #95's REQ-PIPE-271 criterion 9)."
  - "THE SYSTEM SHALL have these tests, each written first and seen to fail against today's code: (1) two Clients supplies in one day, 09:00 and a 15:00 resupply, and a Notifications run reading the 15:00 one - placed on the 15:00 supply; (2) one delivery across midnight, Notifications 23:50 Monday and Clients 00:10 Tuesday - on Notifications' page, Notifications' own Monday point unchanged and Clients' Tuesday result a second, newer point; (3) one delivery within one day, Notifications 09:00 and Clients 11:50 - two points, not one; (4) runs sharing one run instant with badly sorting keys (__r10 against __r9, cp_notifications__X against cp_clients__X__r1) - page order, qa.supply_current_run and list_run_ids follow run_seq; (5) an owed re-check retried under its own key after another run opened - its run_seq is the greater; (6) another collection's runs interleaved - built output byte-identical; (7) a check's declared reads edited after recording - placement unchanged; (8) a contested own table - placed on the promoted supply it fell through to; (9) a settled pair - two supplies of one table in one delivery, each placed on its own supply."
  - "THE SYSTEM SHALL also have, written first and seen to fail: (10) the writer refusing a cross-table result with no read recorded; (11) JS unitCounts ordering two points with the same date and recording time by their emitted rank; (12) a Notifications supply delivered with Clients at 09:00 and a Clients re-check decision at 15:00 the same day - the 15:00 result a re-check point of its own; (13) TestColumnsNotGreenMatchesTheDatasetPage's held Case Workers arrival of 1 May 2025, recorded the same day as Investigations reading the 1 February supply - a point of the 1 February supply whose cause is Investigations' arrival; (14) a same-instant Clients and Notifications zip whose Client reference is carried - one point, the Notifications supply's own; (15) Notifications' 2024-Q3 Client reference recorded with Clients ABSENT for Q3 - red on Notifications' page, not on Clients' page, whose newest stays its Q2 supply's result; (16) a decision recorded on Wednesday with Monday's effective time, its Wednesday re-check of Client reference against a Notifications arrival's Tuesday result - the Wednesday result newest for the gate and the page alike; (17) one Clients re-file whose decision re-runs Notifications' and Investigations' readers checks - one re-check point on Clients' page, not two; (18) a decision recorded between a run's overlay and its open_run - the gate's choice of result unchanged, because it filters on recorded supplies."
  - "THE SYSTEM SHALL have, written first and seen to fail: (19) a run whose first attempt raises a lock timeout and whose retry completes - two attempts, TIMED-OUT then COMPLETED, each with its start, end and run_seq; (20) a run whose first attempt crashes in a tool and whose retry completes - the CRASHED attempt kept with its exception type and message after the retry's record_results and complete_run; (21) an attempt stopped by KeyboardInterrupt, and one by SIGTERM - each INTERRUPTED with its end time, never CRASHED; (22) an attempt whose process is killed, then a retry - the earlier attempt closed INTERRUPTED with no end time when the retry takes the lock; (23) an attempt still running in another process - qa_store.incomplete_runs reports it and nothing closes it; (24) mothman debug run-dbt against an evaluated run - refused, its results and run_seq unchanged; (25) trial.discard of a trial run with attempts - the discard succeeds and its attempts go; (26) a JS test that the panel's default comparison is the newest earlier evaluated point and that choosing it writes no ?cmp=, while choosing any other point writes one, so a copied link opens the same comparison."
  non_functional_requirements:
  - "DETERMINISM. Same recorded history, same placement, same bytes: no ordering by recording time, effective time, run instant, run index or run-id text anywhere in the placement or gate path, and every query feeding either says ORDER BY a recorded key - never a database's natural row order."
  - "THE BUILD EMITS A RANK, NEVER run_seq. Collections bootstrap in parallel, so the raw numbers interleave differently from one bootstrap to the next while each collection's own order does not; a dense per-collection rank is what keeps two equal histories byte-identical."
  - "OPENED IS NOT SAW. The resolution is recorded (period_overlay.rebuild_for_arrival) before open_run draws run_seq, and a person's supply decide takes only slot locks, so a decision can land between the two. Placement and the gate filter on recorded supplies (qa.check_read), so the only effect is that two results about one supply can be ordered with the higher run_seq having read the older partner; inside #95's gate applications run_seq is drawn under the per-(collection, period) lock, which closes it there."
  - "A BUILD READS RECORDED QA RESULTS ONLY (CLAUDE.md). The supply read, the cause, run_seq and the attempts are qa-schema facts written at run time; the build never opens staging._resolutions or any schema holding supply rows."
  - "AN ATTEMPT IS HISTORY, NEVER STATE TO TIDY: qa.run_attempt is written once at the start and once at the end of each attempt (or once by the next attempt that finds it dead), never pruned by a re-run, so check durations (plans/running-thoughts.md #120) and a failed attempt's visibility (#121) can be read from it later. Nothing here displays it."
  - "LIVENESS IS A LOCK, NEVER A TIMEOUT. Whether an attempt is still running is whether its session advisory lock is held: PostgreSQL releases it when the connection dies (crash, kill, machine restart), so no clock, heartbeat or staleness threshold decides that an attempt died."
  - "SECURITY. An attempt's exception message is truncated before it is stored; nothing else here touches credentials, access or supply rows."
  - "SCALE. At about thirty collections, daily and quarterly, over years, with a daily collection gaining cross-table checks, placement is a lookup per result keyed by recorded ids - linear in results - replacing _merged_by_time's scan of the whole history per result. qa.check_read holds rows only for cross-table results (1,866 of 21,880 results on ed_probe, about 1.9k rows); qa.run_attempt one row per attempt, about one per run plus retries; plus one nextval and one advisory lock per attempt. K3's every-evaluation-a-point adds points only where a delivery's files are checked at different instants (five deliveries on ed_probe)."
  - "AUDITABILITY. Which supply of every table a cross-table result read, in what state, which arrival, decision, load or gate application caused its run, in what order runs were opened, and every attempt of a run with how it ended, are answerable from the qa schema alone, years later, without code of the day."
  - "ONE FACT, ONE FUNCTION, THREE READERS. The page, the promotion gate and #95's counting rule read the same record through the same function, in the same order (run_seq), so they cannot disagree about what a result is about or which is newest; and the list's counts, its sparklines and the panel's run count share one counting function."
  - "PROJECT EXTRACTIONS. Nothing here assumes a cadence: arrivals, supplies, causes and attempts all exist for a one-off extraction."
  - "COST. The schema bump forces one reset and bootstrap here (about 1,245s from empty, 2026-10-18); there is no before/after comparison to pay for (K6). The first push takes a CI cache miss, a full deployment bootstrap of about 39 billable minutes (REQ-TEST-260) - so it ships in one push."
  - "NO NEW DEPENDENCY, NO NEW COMMAND. The one CLI-visible change is criterion 8's refusal on mothman debug run-*."
