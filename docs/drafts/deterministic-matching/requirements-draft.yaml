requirements:
- id: REQ-PIPE-279
  title: "A result recorded under another table's run is placed by the supplies it read and the cause of its run, never by days, times or run ids"
  date_written: "2026-10-22"
  story: "As someone reading a dataset's page, I want every check result recorded under another table's run placed on the supply it actually read, and counted with that supply's own delivery or as a re-check of it from recorded facts alone, so that the page, the list's counts and the promotion gate agree on what each result is about, and no two people building from the same history can get a different answer."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-22, after the REQ-PIPE-265 display fix placed results by run-id stamps, calendar days and recording-time tie-breaks: \"I don't want ties and guessing, I want deterministic matching - even if it means changing the metadata we capture.\" Scoped as its own requirement, built before REQ-PIPE-265 is flipped to built (plans/running-thoughts.md #117). Drafted by delivery-scoper 2026-10-22 against the ed_probe bootstrapped history, reviewed by delivery-architect the same day (docs/drafts/deterministic-matching/review-architect.md) and revised with every finding folded in. Serves the architect's #95 v4 blocker B2."
  acceptance_criteria:
  # --- What is recorded, at run time ---
  - "WHEN the result of a cross-table check is recorded, THE SYSTEM SHALL record in qa.check_read, in the same transaction and replaced with the result whenever it is recorded again, one row for EVERY table that check reads - those it declares and its own (carried._reads_of) - giving that table's state in the recording run's own resolution and the supply it names: READ (the supply read; for a contested table that fell through to the period's promoted supply, that supply, flagged contested with the contested files named), HELD (the held supply's id, never a physical name or an empty string), ABSENT (no supply), or NO-SUPPLY (a sample or trial table that belongs to no supply)."
  - "THE SYSTEM SHALL carry in a run's resolution the supply of every table it reads or holds, a staged table included, taken from the filing and supply-file records the period overlay already walks (period_overlay.staged_for_period, filing.CURRENT, supply_files.resolve), with whether the table was read from staging or from the period recorded as its own field - never inferred from the presence of a supply - and SHALL write that supply on qa.tables_read for staged tables too, leaving the physical names in a result's tables_read unchanged."
  - "THE SYSTEM SHALL treat the result of a check that reads only its own table as about its run's own supply (qa.run.supply_id), and IF such a result is offered for recording under a run whose dataset_id is not the check's own dataset, THEN THE SYSTEM SHALL refuse it."
  - "IF the read of any table a cross-table check reads cannot be recorded with its result, THEN THE SYSTEM SHALL refuse to record that result and fail the run's write loudly, rather than record a cross-table result with no read (qa_results_writer._with_tables_read's swallowed exception goes)."
  - "WHEN the orchestrator opens a run to evaluate it (orchestrate.open_run), THE SYSTEM SHALL draw the run a new sequence number, qa.run.run_seq, in the same transaction that records the run's resolution, and SHALL draw a new one each time that run key is reopened and re-resolved; qa_results_writer.record_run and qa_store.register_run_if_absent SHALL NOT set it, and complete_run SHALL refuse a run that has none. (The redraw is provisional on K5.)"
  # --- What 'newer' and 'one point' mean ---
  - "WHERE two results about one supply are to be put in order - which is newer, in the promotion gate and on the page alike - THE SYSTEM SHALL order them by their runs' run_seq, and SHALL NOT break any tie by recording time, run instant, run index or run-id text. (Provisional on K1.)"
  - "THE SYSTEM SHALL key every result recorded under another table's run, on a dataset's page, to ONE POINT - (dataset, the supply of its table criterion 1 recorded it read, cause) - where the cause is the delivery of an arrival run (qa.filing's delivery for the supply that arrival checked) and the decision id or load id a re-check, readers-only or knock-on run records; the point is that supply's OWN point WHERE the recording run is an arrival of the delivery that brought that supply, whatever days the two were recorded on (provisional on K3), and otherwise a re-check point of that supply, one per cause (provisional on K4)."
  - "THE SYSTEM SHALL give each check, within one point, the result of that point's highest-run_seq run that recorded it, whichever table's run that was - so a supply's own re-check opened after a sibling's arrival outranks the sibling's result, and the reverse - replacing the rule that another table's result replaces the own verdict."
  - "IF a result's recorded state for a dataset's table is ABSENT or NO-SUPPLY, THEN THE SYSTEM SHALL NOT show or count it on that dataset's page, and SHALL show it unchanged on the page of the dataset the check is declared on - amending REQ-DASH-264 criterion 1. (Provisional on K2.)"
  - "WHILE REQ-PIPE-115 criterion 10 applies to a dataset, THE SYSTEM SHALL show on that dataset's page each cross-table result whose recorded state for its table is HELD with the held supply's id, and as not run (the existing grey 'No data') each cross-table check with none - amending REQ-DASH-264 criterion 3's \"recorded at or after the held supply's receipt\"."
  # --- What the build emits and reads ---
  - "THE SYSTEM SHALL emit, for each collection, each own point's supply id (qa.run.supply_id) and a dense rank for every point and every history entry computed from run_seq within that collection, SHALL NOT emit run_seq itself, and the template SHALL order points and entries by that rank alone - still dating each by when it was recorded (REQ-DASH-264 criterion 9) and clipping by the in-place-on date (REQ-DASH-264 criterion 1)."
  - "THE SYSTEM SHALL take which dataset a run is for and what kind of run it is - for own_runs, recorded_by and REQ-DASH-264 criterion 7's sentences - from qa.run's dataset_id and scope, and SHALL NOT read either off the run id."
  - "THE SYSTEM SHALL decide which datasets' pages a cross-table result is shared to from the tables qa.check_read recorded it reading, and SHALL NOT use the checkout's current declarations (share_cross_table_results, _cross_table_info), so the same history builds the same placement under a later checkout."
  - "THE SYSTEM SHALL NOT compare calendar days, recording times, run indexes or run-id text to decide which supply, cause or point a result belongs to, nor to order two results or two runs, and SHALL remove each place that does - in pipeline/build_dashboard_data.py: read_run's stamp inference, _merged_by_time, the own-run sort by _run_date then run_index then run key, the current value taken as the max recorded_at, and own_runs' and recorded_by's run_owner(run_id); in the template: unitCounts' day comparison, its \"read || ownRun\" stand-in, its chain sort by date and at, its point sort by date, at and runId, recordedAtOf, and sameDelivery with deliveryCount and defaultCompareIndex re-based on the point key; in the gate: supply_status.runs_about's ORDER BY caused_at, run_key and its physical-name match, and qa.supply_current_run's run_instant, run_key tie-breaks; and carried.decide's text-sorted siblings."
  - "THE SYSTEM SHALL have one test that fails if any placement or ordering code in pipeline/build_dashboard_data.py, the template's unitCounts, sameDelivery, defaultCompareIndex and point sorts, supply_status or carried reads recorded_at, a run id's text or a calendar day - an architecture-rule test that says so in its docstring (CLAUDE.md, a test earns its place, rule 1)."
  # --- The gate side ---
  - "THE SYSTEM SHALL answer \"which results are about this supply\" with ONE function (supply_status.results_about, or equivalent) joining qa.check_result, qa.check_read and qa.run, used by the dashboard build, the promotion gate (runs_about, latest_results), carried.decide (whose _same_supplies reduces to comparing recorded supply ids, its siblings taken in run_seq order) and #95's counting rule, with its docstring stating the five recorded states and why. (Its tie-break is provisional on K1.)"
  - "THE SYSTEM SHALL read REQ-PIPE-265's siblings from the record - arrival runs whose supplies were filed from one delivery with one receipt instant (qa.filing, qa.delivery_file) - and SHALL NOT parse them from run ids (carried.siblings), amending REQ-PIPE-265 criterion 1 as summary.md words it."
  # --- Schema, determinism, tests ---
  - "THE SYSTEM SHALL bump the qa schema from version 45 to 46, so the existing refusal of another version (qa_store._refuse_another_version) has an older database rebuilt from empty by mothman env reset-synthetic and mothman pipeline bootstrap, never migrated."
  - "WHEN the dashboard data is built twice from the same recorded history, including with another collection's runs interleaved differently, THE SYSTEM SHALL produce byte-identical output apart from generated_at; and WHEN the bootstrapped history is captured before and after this change (REQ-TEST-239), the comparison SHALL list every difference in promotions, refusals and current runs, each with the tie or order that changed it. (Whether differences are accepted once explained is K6.)"
  - "THE SYSTEM SHALL have these tests, each written first and seen to fail against today's code: (1) two Clients supplies in one day, 09:00 and a 15:00 resupply, and a Notifications run reading the 15:00 one - placed on the 15:00 supply; (2) one delivery across midnight, Notifications 23:50 Monday and Clients 00:10 Tuesday - Clients' result counted on the Notifications supply's own point; (3) runs sharing one run instant with badly sorting keys (__r10 against __r9, cp_notifications__X against cp_clients__X__r1) - page order and qa.supply_current_run follow run_seq; (4) an owed re-check retried under its own key after another run opened - its run_seq is the greater; (5) another collection's runs interleaved - built output byte-identical; (6) a check's declared reads edited after recording - placement unchanged; (7) a contested own table - placed on the promoted supply it fell through to; (8) a settled pair - two supplies of one table in one delivery, each placed on its own supply."
  - "THE SYSTEM SHALL also have, written first and seen to fail: (9) the writer refusing a cross-table result with no read recorded; (10) JS unitCounts ordering two points with the same date and recording time by their emitted rank; (11) a Notifications supply delivered with Clients at 09:00 and a Clients re-check decision at 15:00 the same day - the 15:00 result a re-check point of its own; (12) TestColumnsNotGreenMatchesTheDatasetPage's held Case Workers arrival of 1 May 2025, recorded the same day as Investigations reading the 1 February supply - a re-check point of the 1 February supply, its cause Investigations' delivery; (13) a same-instant Clients and Notifications zip whose Client reference is carried - counted on the Notifications supply's own point by the read recorded with it."
  non_functional_requirements:
  - "DETERMINISM. Same recorded history, same placement, same bytes: no ordering by recording time, run instant, run index or run-id text anywhere in the placement or gate path, and every query feeding either says ORDER BY a recorded key - never a database's natural row order."
  - "THE BUILD EMITS A RANK, NEVER run_seq. Collections bootstrap in parallel, so the raw numbers interleave differently from one bootstrap to the next while each collection's own order does not; a dense per-collection rank is what keeps two equal histories byte-identical."
  - "ORDER WITHIN A COLLECTION NEEDS ITS RE-CHECKS AND KNOCK-ONS SEQUENTIAL, as they are today; if #95's concurrent rule applications land, run_seq is drawn under its per-(collection, period) advisory lock (architect v4 S1) rather than only in the resolution's transaction."
  - "A BUILD READS RECORDED QA RESULTS ONLY (CLAUDE.md). The supply read, the cause and run_seq are qa-schema facts written at run time; the build never opens staging._resolutions or any schema holding supply rows."
  - "SCALE. At about thirty collections, daily and quarterly, over years, with a daily collection gaining cross-table checks, placement is a lookup per result keyed by recorded ids - linear in results - replacing _merged_by_time's scan of the whole history per result. qa.check_read holds rows only for cross-table results (1,866 of 21,880 results on ed_probe, about 1.9k rows) plus one nextval per run."
  - "AUDITABILITY. Which supply of every table a cross-table result read, in what state, which delivery or decision caused its run and in what order runs were evaluated are answerable from the qa schema alone, years later, without code of the day."
  - "ONE FACT, ONE FUNCTION, THREE READERS. The page, the promotion gate and #95's counting rule read the same record through the same function, so they cannot disagree about what a result is about or which is newest."
  - "PROJECT EXTRACTIONS. Nothing here assumes a cadence: deliveries, supplies and causes all exist for a one-off extraction."
  - "COST. The schema bump forces one reset and bootstrap here (about 1,245s from empty, 2026-10-18) and two for REQ-TEST-239's before/after; the first push takes a CI cache miss, a full deployment bootstrap of about 39 billable minutes (REQ-TEST-260) - so it ships in one push."
  - "NO NEW DEPENDENCY, NO NEW COMMAND, NO CLI CHANGE."
  dependencies:
  - REQ-PIPE-265
  - REQ-DASH-264
  - REQ-PIPE-036
  - REQ-PIPE-140
  - REQ-PIPE-104
  - REQ-PIPE-115
  - REQ-TEST-239
  decisions:
  - "Scoped as its own requirement and built before REQ-PIPE-265 is flipped to built, rather than folded into #95 v5 (Keith, 2026-10-22, option A)."
  - "Rejected - the calendar-day rule (REQ-DASH-264 criteria 11 and 12, Keith's #258 Q3 and Q4): the day was a stand-in for the delivery, and it fails both ways - it merges a 15:00 re-check or resupply into a 09:00 delivery of the same day, and it splits one delivery whose files straddle midnight."
  - "Rejected - inferring the run read from the arrival stamp in the run id (read_run's fallback) and the template's \"read || ownRun\" stand-in: both guess the supply of a table the result did not record, and are wrong whenever a held or later arrival shares the day (the Case Workers 1 May 2025 case)."
  - "Rejected - ordering ties by recorded_at, run_instant, run_index or run-id text (recordedAtOf, unitCounts' sorts, the own-run sort, supply_current_run, runs_about): keys sort as text, so __r10 sorts before __r9 and cp_notifications__X after cp_clients__X__r1; 62 groups of runs on ed_probe share a run instant; a re-check shares its arrival's run_index (recheck.py) and a settled pair's two supplies share one."
  - "Rejected - qa.check_result.id as the sequence: per result where the order needed is per run, and reassigned when a run's results are deleted and re-inserted on re-record."
  - "Rejected - a sequence drawn by a column DEFAULT on insert (the first draft's criterion 4) and frozen for life (architect B1): runs are first inserted at staging by file checks (register_run_if_absent) or by any tool write (record_run), so a DEFAULT records staging time, not evaluation; and a run key is evaluated again in real paths (reopen_run with a new resolution, recheck.mint_run_id reusing an owed run's key), so a frozen number would call a retry that read newer state older. Drawn in open_run, with the resolution, redrawn on reopen."
  - "run_seq is named distinctly because three orders already exist and each keeps one job: qa.delivery_file.receipt_sequence and arrivals' sequence are RECEIPT order (REQ-PIPE-061, which arrival came first); run_index is the manifest's arrival enumeration, retired as the build's own-run order; qa.check_result.id is a row identity, never an order. run_seq is EVALUATION order, the only one that says which result is newer."
  - "Rejected - a new delivery-id column on qa.run (the main session's candidate 2): qa.filing already records every supply's delivery (NOT NULL, append-only; a held supply has a filing row with slot NULL), and qa.run records the supply an arrival run checked, so a run's delivery is a join on recorded facts. A second copy is a copy that can disagree."
  - "Delivery, not receipt instant, makes a result part of a supply's own point: on ed_probe one delivery's files span up to 2h50m (REG_20260807), and REQ-DASH-264 Q3's 312 staggered pairs are one delivery checked once by each table. The receipt instant stays what defines REQ-PIPE-265 siblings, which is narrower on purpose."
  - "The cause key is delivery name, decision id or load id (architect B3): an arrival run of ANOTHER delivery reading an older supply (Investigations reading 1 February Case Workers) needs a cause too, and its delivery is it."
  - "Within a point, highest run_seq wins, rejecting \"another table's result replaces the own verdict\" (template unitCounts, REQ-DASH-264's decision on REQ-DASH-225 criterion 18): a supply's own point is its CURRENT run, which can be a full re-check opened after a sibling's arrival that re-ran the same check (architect B3)."
  - "Storage is rows in qa.check_read keyed to check_result.id with ON DELETE CASCADE, not jsonb in extra (architect S3): the gate's SQL joins it, and record_results' delete-and-insert then replaces result and reads atomically."
  - "Contested, held and pairs recorded as states with supply ids, not names (architect S1): a contested table falls through to the period's promoted supply (supply_db.Resolution.unreadable), an open pair is one filed supply with two files, and a held entry is today a physical name, a supply id or an empty string depending on the path (period_overlay.py, name_held_siblings) - only a supply id lets criterion 10 match."
  - "Whether a table was read from staging or the period is its own recorded field (architect S2): the writer used `logical in resolution.supply_of` as \"is a period table\", which putting staged supplies in supply_of would silently break for unnamed readers."
  - "Recording the supply for a single-table result was rejected as a second copy of qa.run.supply_id; criterion 3's refusal enforces the assumption rather than trusting today's 0 of 20,014 (architect S4)."
  - "Placement reads recorded reads, not today's declarations (architect B2): share_cross_table_results and _cross_table_info used collect_checks(None), so editing a check's declared reads re-placed old history."
  - "name_held_siblings' held-or-absent decision, made at run time from the supply id, stays: it is deterministic and is what decides criterion 1's state."
  - "The physical names in a result's tables_read (REQ-PIPE-036 criteria 10 and 11) stay: they say which TABLE was read; this adds which SUPPLY. qa.tables_read's physical-name matching in runs_about becomes dead and goes."
  - "What stays a time, deliberately: a point's display date (REQ-DASH-264 criterion 9) and the as-of clip (criterion 1) are about WHEN something was recorded. Neither decides what a result is about or which of two is newer."
  - "The gate side (criteria 16 and 17) is in this requirement rather than left to #95 (first draft Q5, settled by the architect's review): leaving it would keep carried.siblings parsing run ids and runs_about matching names, which is the guessing Keith ruled out, and criterion 2's supply on qa.tables_read is needed by the gate anyway."
  open_questions:
  - "K1 (the gate's order). Run_seq for page AND gate (recommended, architect B4), or run_seq for the page with the gate kept on effective time and the disagreement written into a criterion?"
  - "K2. A result that read no supply of a table (174 on ed_probe): shown only on the declaring table's page (recommended), or also on the absent table's as could-not-run on its newest point?"
  - "K3. One delivery across midnight: the delivery decides, the result counting on the earlier supply's own point (recommended, amends #258 Q4's 'never re-dating'), or the delivery AND the same day?"
  - "K4. Re-check points: one per supply and cause (recommended), or one per run?"
  - "K5. A run key evaluated again (owed retry, reopen): a new run_seq (recommended), or keep the first and refuse a re-run whose resolution changed?"
  - "K6. The before/after bootstrap comparison: accept differences once each is listed and explained (recommended), or require none?"
  - "K7 (auditability). Should the page say which supply a result read? Recommended not in this requirement - the build carries it in the data either way."
