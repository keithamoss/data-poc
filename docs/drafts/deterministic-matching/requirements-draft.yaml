requirements:
- id: REQ-PIPE-279
  title: "A result recorded under another table's run is placed by the supplies it read and the cause of its run, never by days, times or run ids"
  date_written: "2026-10-22"
  story: "As someone reading a dataset's page, I want every check result recorded under another table's run placed on the supply it actually read, as a point of its own for each thing that caused it to be checked, and ordered by when it was evaluated, from recorded facts alone, so that the page, the list's counts and the promotion gate agree on what each result is about and which is newest, and no two people building from the same history can get a different answer."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-22, after the REQ-PIPE-265 display fix placed results by run-id stamps, calendar days and recording-time tie-breaks: \"I don't want ties and guessing, I want deterministic matching - even if it means changing the metadata we capture.\" Scoped as its own requirement, built before REQ-PIPE-265 is flipped to built (plans/running-thoughts.md #117). Drafted by delivery-scoper 2026-10-22 against the ed_probe bootstrapped history, reviewed by delivery-architect the same day (docs/drafts/deterministic-matching/review-architect.md) with every finding folded in, and revised by delivery-scoper 2026-10-23 with Keith's answers to K1-K7 and the split question (2026-10-22), including his own options K3 = C and K6 = C and the attempt record he added under K5. Serves the architect's #95 v4 blocker B2."
  acceptance_criteria:
  # --- What is recorded, at run time ---
  - "WHEN the result of a cross-table check is recorded, THE SYSTEM SHALL record in qa.check_read, in the same transaction and replaced with the result whenever it is recorded again, one row for EVERY table that check reads - those it declares and its own (carried._reads_of) - giving that table's state in the recording run's own resolution and the supply it names: READ (the supply read; for a contested table that fell through to the period's promoted supply, that supply, flagged contested with the contested files named), HELD (the held supply's id, never a physical name or an empty string), ABSENT (no supply), or NO-SUPPLY (a sample or trial table that belongs to no supply)."
  - "THE SYSTEM SHALL carry in a run's resolution the supply of every table it reads or holds, a staged table included, taken from the filing and supply-file records the period overlay already walks (period_overlay.staged_for_period, filing.CURRENT, supply_files.resolve), with whether the table was read from staging or from the period recorded as its own field - never inferred from the presence of a supply - and SHALL write that supply on qa.tables_read for staged tables too, leaving the physical names in a result's tables_read unchanged."
  - "THE SYSTEM SHALL treat the result of a check that reads only its own table as about its run's own supply (qa.run.supply_id), and IF such a result is offered for recording under a run whose dataset_id is not the check's own dataset, THEN THE SYSTEM SHALL refuse it."
  - "IF the read of any table a cross-table check reads cannot be recorded with its result, THEN THE SYSTEM SHALL refuse to record that result and fail the run's write loudly, rather than record a cross-table result with no read (qa_results_writer._with_tables_read's swallowed exception goes)."
  - "WHEN the orchestrator opens a run for evaluation (qa_results_writer.open_run, called by orchestrate._run_one_inner after the run's resolution is recorded and before any tool is invoked), THE SYSTEM SHALL draw the run a new sequence number, qa.run.run_seq, and SHALL draw a new one each time that run key is opened again - a reopen, or an owed re-check retried under its own key - so a retry ranks after every run opened in between; qa_results_writer.record_run and qa_store.register_run_if_absent SHALL NOT set it, and complete_run SHALL refuse a run that has none."
  - "WHEN the orchestrator opens a run for evaluation, THE SYSTEM SHALL record a new ATTEMPT of it in a new qa.run_attempt table - its run key, the run_seq criterion 5 drew for it and when it began - and WHEN that attempt ends, when it ended and how: COMPLETED (complete_run succeeded), TIMED-OUT (it raised PostgreSQL's lock or statement timeout, anywhere in its exception chain) or CRASHED (any other exception, with its type and message); and SHALL NOT change an attempt once it has ended, nor remove it on a reopen (reopen_run), a retry or a re-recording of the run's results (record_results), so a run retried after a timeout keeps both attempts. (An attempt whose process died without recording an end is closed as N2 decides.)"
  # --- What 'newer' and 'one point' mean ---
  - "WHERE two results about one supply are to be put in order - which is newer, in the promotion gate and on the page alike - THE SYSTEM SHALL order them by their runs' run_seq, replacing the gate's order by a decision's effective time (supply_status.runs_about's caused_at), and SHALL NOT break any tie by recording time, effective time, run instant, run index or run-id text."
  - "THE SYSTEM SHALL key every result recorded under another table's run, on a dataset's page and in the dataset list, to ONE POINT - (dataset, the supply of its table criterion 1 recorded it read, the recording run's CAUSE) - where an arrival run's cause is its ARRIVAL, the group of REQ-PIPE-265 siblings it belongs to (criterion 19; a lone arrival is a group of one), and a re-check, readers-only or knock-on run's cause is the decision id or load id it records; so two arrivals of one delivery checked at different receipt instants are two causes and two points whatever the gap between them, every run that one decision or load causes adds one point for each supply it read, and a supply's OWN point is the point whose cause is that of the supply's current run (REQ-PIPE-140 criterion 5)."
  - "THE SYSTEM SHALL give each check, within one point, the result of that point's highest-run_seq run that recorded it, whichever table's run that was - so of two sibling arrivals the later one's verdict outranks the earlier one's not-evaluated record (REQ-PIPE-265 criterion 6), and of one decision's several runs the last opened wins - replacing the rule that another table's result replaces the own verdict."
  - "THE SYSTEM SHALL count each point once - in the dataset list's counts and sparklines and in a check panel's run count - ordered by its rank (criterion 13), a point that is not a supply's own carrying every other check's verdict into it from the point before, and WHEN a later point is recorded SHALL NOT re-date, merge into or overwrite any earlier point; REQ-DASH-264 criterion 12's same-day rule is RETIRED in favour of this."
  - "IF a result's recorded state for a dataset's table is ABSENT or NO-SUPPLY, THEN THE SYSTEM SHALL NOT show or count it on that dataset's page, and SHALL show it unchanged on the page of the dataset the check is declared on - amending REQ-DASH-264 criterion 1."
  - "WHILE REQ-PIPE-115 criterion 10 applies to a dataset, THE SYSTEM SHALL show on that dataset's page each cross-table result whose recorded state for its table is HELD with the held supply's id, and as not run (the existing grey 'No data') each cross-table check with none - amending REQ-DASH-264 criterion 3's \"recorded at or after the held supply's receipt\"."
  # --- What the build emits and reads ---
  - "THE SYSTEM SHALL emit, for each collection, each own point's supply id (qa.run.supply_id), each result's read supplies as criterion 1 recorded them, and a dense rank for every point and every history entry computed from run_seq within that collection, SHALL NOT emit run_seq itself, and the template SHALL order points and entries by that rank alone - still dating each result by when it was recorded (REQ-DASH-264 criterion 9), a point by its lowest-ranked result, and clipping each result by the in-place-on date (REQ-DASH-264 criterion 1)."
  - "THE SYSTEM SHALL take which dataset a run is for and what kind of run it is - for own_runs, recorded_by and REQ-DASH-264 criterion 7's sentences - from qa.run's dataset_id and scope, and SHALL NOT read either off the run id."
  - "THE SYSTEM SHALL decide which datasets' pages a cross-table result is shared to from the tables qa.check_read recorded it reading, and SHALL NOT use the checkout's current declarations (share_cross_table_results, _cross_table_info), so the same history builds the same placement under a later checkout."
  - "THE SYSTEM SHALL NOT compare calendar days, recording times, run indexes or run-id text to decide which supply, cause or point a result belongs to, nor to order two results or two runs, and SHALL remove each place that does - in pipeline/build_dashboard_data.py: read_run's stamp inference, _merged_by_time, the own-run sort by _run_date then run_index then run key, the current value taken as the max recorded_at, and own_runs' and recorded_by's run_owner(run_id); in the template: unitCounts' day comparison, its \"read || ownRun\" stand-in, its chain sort by date and at, its point sort by date, at and runId, recordedAtOf, and sameDelivery, with deliveryCount and defaultCompareIndex re-based on the point key; in the gate: supply_status.runs_about's ORDER BY caused_at, run_key and its physical-name match, and qa.supply_current_run's run_instant, run_key tie-breaks; and carried.decide's text-sorted siblings."
  - "THE SYSTEM SHALL have one test that fails if any placement or ordering code in pipeline/build_dashboard_data.py, the template's unitCounts, sameDelivery, defaultCompareIndex and point sorts, supply_status or carried reads recorded_at, a run id's text or a calendar day - an architecture-rule test that says so in its docstring (CLAUDE.md, a test earns its place, rule 1)."
  # --- The gate side ---
  - "THE SYSTEM SHALL answer \"which results are about this supply\" with ONE function (supply_status.results_about, or equivalent) joining qa.check_result, qa.check_read and qa.run, used by the dashboard build, the promotion gate (runs_about, latest_results), carried.decide (whose _same_supplies reduces to comparing recorded supply ids, its siblings taken in run_seq order) and #95's counting rule, with its docstring stating the five recorded states and why, and its tie-break run_seq (criterion 7)."
  - "THE SYSTEM SHALL read REQ-PIPE-265's siblings from the record - arrival runs whose supplies were filed from one delivery with one receipt instant (qa.filing, qa.delivery_file) - and SHALL NOT parse them from run ids (carried.siblings), amending REQ-PIPE-265 criterion 1 as summary.md words it."
  # --- Schema, determinism, tests ---
  - "THE SYSTEM SHALL bump the qa schema from version 45 to 46, so the existing refusal of another version (qa_store._refuse_another_version) has an older database rebuilt from empty by mothman env reset-synthetic and mothman pipeline bootstrap, never migrated."
  - "WHEN the dashboard data is built twice from the same recorded history, including with another collection's runs interleaved differently, THE SYSTEM SHALL produce byte-identical output apart from generated_at."
  - "THE SYSTEM SHALL have these tests, each written first and seen to fail against today's code: (1) two Clients supplies in one day, 09:00 and a 15:00 resupply, and a Notifications run reading the 15:00 one - placed on the 15:00 supply; (2) one delivery across midnight, Notifications 23:50 Monday and Clients 00:10 Tuesday - on Notifications' page, Notifications' own Monday point unchanged and Clients' Tuesday result a second, newer point; (3) one delivery within one day, Notifications 09:00 and Clients 11:50 - two points, not one; (4) runs sharing one run instant with badly sorting keys (__r10 against __r9, cp_notifications__X against cp_clients__X__r1) - page order and qa.supply_current_run follow run_seq; (5) an owed re-check retried under its own key after another run opened - its run_seq is the greater; (6) another collection's runs interleaved - built output byte-identical; (7) a check's declared reads edited after recording - placement unchanged; (8) a contested own table - placed on the promoted supply it fell through to; (9) a settled pair - two supplies of one table in one delivery, each placed on its own supply."
  - "THE SYSTEM SHALL also have, written first and seen to fail: (10) the writer refusing a cross-table result with no read recorded; (11) JS unitCounts ordering two points with the same date and recording time by their emitted rank; (12) a Notifications supply delivered with Clients at 09:00 and a Clients re-check decision at 15:00 the same day - the 15:00 result a re-check point of its own; (13) TestColumnsNotGreenMatchesTheDatasetPage's held Case Workers arrival of 1 May 2025, recorded the same day as Investigations reading the 1 February supply - a point of the 1 February supply whose cause is Investigations' arrival; (14) a same-instant Clients and Notifications zip whose Client reference is carried - one point, the Notifications supply's own; (15) Notifications' 2024-Q3 Client reference recorded with Clients ABSENT for Q3 - red on Notifications' page, not on Clients' page, whose newest stays its Q2 supply's result; (16) a decision recorded on Wednesday with Monday's effective time, its Wednesday re-check of Client reference against a Notifications arrival's Tuesday result - the Wednesday result newest for the gate and the page alike; (17) one Clients re-file whose decision re-runs Notifications' and Investigations' readers checks - one re-check point on Clients' page, not two."
  - "THE SYSTEM SHALL have, written first and seen to fail: (18) a run whose first attempt raises a lock timeout and whose retry completes - two attempts, TIMED-OUT then COMPLETED, each with its start, end and run_seq; (19) a run whose first attempt crashes in a tool and whose retry completes - the CRASHED attempt kept with its exception type and message after the retry's record_results and complete_run; (20) an attempt whose process ends without recording an end, then a retry - closed as N2 decides."
  non_functional_requirements:
  - "DETERMINISM. Same recorded history, same placement, same bytes: no ordering by recording time, effective time, run instant, run index or run-id text anywhere in the placement or gate path, and every query feeding either says ORDER BY a recorded key - never a database's natural row order."
  - "THE BUILD EMITS A RANK, NEVER run_seq. Collections bootstrap in parallel, so the raw numbers interleave differently from one bootstrap to the next while each collection's own order does not; a dense per-collection rank is what keeps two equal histories byte-identical."
  - "ORDER WITHIN A COLLECTION NEEDS ITS RE-CHECKS AND KNOCK-ONS SEQUENTIAL, as they are today: the resolution is recorded (period_overlay) before open_run draws run_seq, so a decision landing between the two is excluded only by that sequencing; if #95's concurrent rule applications land, run_seq is drawn under its per-(collection, period) advisory lock (architect v4 S1)."
  - "A BUILD READS RECORDED QA RESULTS ONLY (CLAUDE.md). The supply read, the cause, run_seq and the attempts are qa-schema facts written at run time; the build never opens staging._resolutions or any schema holding supply rows."
  - "AN ATTEMPT IS HISTORY, NEVER STATE TO TIDY: qa.run_attempt is append-only per attempt (one write at the start, one at the end), never pruned by a re-run, so check durations (plans/running-thoughts.md #120) and a failed attempt's visibility (#121) can be read from it later. Nothing here displays it."
  - "SCALE. At about thirty collections, daily and quarterly, over years, with a daily collection gaining cross-table checks, placement is a lookup per result keyed by recorded ids - linear in results - replacing _merged_by_time's scan of the whole history per result. qa.check_read holds rows only for cross-table results (1,866 of 21,880 results on ed_probe, about 1.9k rows); qa.run_attempt one row per attempt, about one per run plus retries; plus one nextval per attempt. K3's every-evaluation-a-point adds points only where a delivery's files are checked at different instants (five deliveries on ed_probe)."
  - "AUDITABILITY. Which supply of every table a cross-table result read, in what state, which arrival, decision or load caused its run, in what order runs were evaluated, and every attempt of a run with how it ended, are answerable from the qa schema alone, years later, without code of the day."
  - "ONE FACT, ONE FUNCTION, THREE READERS. The page, the promotion gate and #95's counting rule read the same record through the same function, in the same order (run_seq), so they cannot disagree about what a result is about or which is newest."
  - "PROJECT EXTRACTIONS. Nothing here assumes a cadence: arrivals, supplies, causes and attempts all exist for a one-off extraction."
  - "COST. The schema bump forces one reset and bootstrap here (about 1,245s from empty, 2026-10-18); there is no before/after comparison to pay for (K6). The first push takes a CI cache miss, a full deployment bootstrap of about 39 billable minutes (REQ-TEST-260) - so it ships in one push."
  - "NO NEW DEPENDENCY, NO NEW COMMAND, NO CLI CHANGE."
  dependencies:
  - REQ-PIPE-265
  - REQ-DASH-264
  - REQ-QAC-037
  - REQ-PIPE-036
  - REQ-PIPE-140
  - REQ-PIPE-104
  - REQ-PIPE-115
  decisions:
  - "Scoped as its own requirement and built before REQ-PIPE-265 is flipped to built, rather than folded into #95 v5 (Keith, 2026-10-22, option A)."
  - "ONE REQUIREMENT, built in two chunks - the record (criteria 1-6, 20), then its readers - under one sign-off (Keith, 2026-10-22, split = A). Rejected - two requirements and two sign-offs: the record alone delivers nothing visible, and REQ-PIPE-265 waits on both."
  - "ONE ORDER FOR 'NEWEST', page and gate alike: evaluation order, run_seq (Keith, 2026-10-22, K1 = A) - a Wednesday re-check of a Monday-effective decision is newest everywhere because it is the only result that saw the decision, and post-build-review #116 D1 still holds because a re-run is always opened after what it re-runs. The gate's effective-time order is replaced. Rejected - run_seq for the page and effective time for the gate, with the disagreement named in a criterion (K1 = B; architect B4): the page and the gate would name different results as newest for every decision recorded after the fact."
  - "A RESULT THAT READ NO SUPPLY OF A TABLE (ABSENT or NO-SUPPLY) shows only on the page of the table its check is declared on (Keith, 2026-10-22, K2 = A): Notifications' Q3 'every notification has a client', with no Clients filed for Q3, reads red on Notifications' page and Clients' page keeps its Q2 supply's result as newest. Bounded by REQ-QAC-037 criteria 6-7 (a cross-table result is about every table it reads, shared not copied) and #258 Q13 = B (could-not-run counts toward the declaring table only). Rejected - also showing it on Clients' newest point as could-not-run (K2 = B), a point it never read; 174 results on ed_probe have this shape."
  - "EVERY EVALUATION IS ITS OWN POINT, ordered by run_seq (Keith's own option, 2026-10-22, K3 = C: \"record/show two points for notifications - one for what was checked on Monday and another for what was re-checked on Tuesday\"). In a delivery whose files are checked at different instants - across midnight or any gap; five deliveries on ed_probe, up to 2h50m apart - the later file's result is a second, newer point, nothing is re-dated or overwritten (#258 Q4's \"never re-dating the earlier one\" stands), and REQ-DASH-264 criterion 12's same-day rule is RETIRED rather than amended: being part of the same delivery is no longer a placement rule. Same-instant siblings still give one point, because REQ-PIPE-265 evaluates once and carries."
  - "Rejected - the delivery decides (K3 = A, the v2 draft's recommendation): it merged the Tuesday result into Monday's point, so the point kept its date while its value changed under it - a re-dating of the value. Rejected - the delivery AND the same day (K3 = B): brings the day rule back, with a test that depends on the time zone (asset_time.local_date)."
  - "THE CAUSE OF AN ARRIVAL RUN IS ITS ARRIVAL - its REQ-PIPE-265 sibling group, the supplies filed from one delivery at one receipt instant - not its delivery (follows from K3 = C). Under the v2 draft the delivery was the cause, which is what folded a later file of the same delivery into the earlier file's point. The cause key is therefore arrival group, decision id or load id; an arrival of ANOTHER delivery reading an older supply (Investigations reading 1 February Case Workers) has a cause too, its own arrival (architect B3). Keith noted this becomes an edge case once the transport layer gives real package boundaries (\"this is a package of files to wait and process together\" - plans/supply-thoughts.md)."
  - "ONE POINT PER SUPPLY AND CAUSE (Keith, 2026-10-22, K4 = A), read alongside K3 = C as 'each thing that happened is its own point' - an arrival, another arrival, a decision: one re-file of Clients that re-runs Notifications' and Investigations' readers checks gives Clients' trend one re-check point, not two seconds apart (7 decisions on ed_probe caused more than one readers run). Rejected - one point per run (K4 = B): how many points a hub table gets would depend on how many tables read it, mostly noise at thirty collections."
  - "A RETRIED RUN DRAWS A NEW run_seq WHEN IT STARTS AGAIN (Keith, 2026-10-22, K5 = A): it ranks after anything opened in between, because it saw more. Rejected - keeping the first number and refusing a retry whose resolution changed (K5 = B): the retry would fail and need a new run key and a new path."
  - "EVERY ATTEMPT OF A RUN IS RECORDED (Keith, 2026-10-22, added under K5: \"it should also be obvious somewhere that it did time out or crash\"; \"yes, add it to 279\"). Checked against the code that day: reopen_run only clears completed_at and record_results replaces a tool's results, so today a failed attempt leaves no trace once retried. The record is when each attempt began and ended and how it ended, kept across retries; it feeds both the crash's visibility and check durations (plans/running-thoughts.md #120). HOW IT IS SHOWN IS NOT IN THIS REQUIREMENT - it goes to the UX review (plans/running-thoughts.md #121)."
  - "NO BEFORE/AFTER EQUIVALENCE COMPARISON for this requirement (Keith's own option, 2026-10-22, K6 = C: \"The equivalence check is all about the refactor ... this is about genuine changes, so we don't need to run the equivalence check\"). It is proved by its own guess-failing tests (criteria 22-24) and an ordinary bootstrap from empty; the v2 criterion 19's comparison clause is removed, not relaxed, and REQ-TEST-239 is no longer a dependency. Rejected - accepting differences once each is listed with the tie or order that changed it (K6 = A, the v2 recommendation and architect S5), and requiring zero differences (K6 = B, which would have kept the run-key tie-break this removes). REQ-TEST-239 itself is untouched here; Keith's note that it \"can be paused and retired ... but not yet deleted\" is plans/running-thoughts.md #122."
  - "THE PAGE DOES NOT YET SAY WHICH SUPPLY A RESULT READ (Keith, 2026-10-22, K7 = A): the build carries the read supplies in the data (criterion 13), and the wording goes to the period-clarity requirement (docs/drafts/period-clarity/review-ux-critic.md B2 - every cross-table row naming both sides' period and supply), designed and UX-reviewed there as one piece. Rejected - adding it to REQ-DASH-264 criterion 7's sentences inside this requirement (K7 = B), new signed wording with no UX review."
  - "Rejected - the calendar-day rule (REQ-DASH-264 criteria 11 and 12, Keith's #258 Q3 and Q4): the day was a stand-in for 'the same event', and it is wrong both ways - it merges a 15:00 re-check or resupply into a 09:00 delivery of the same day, and its boundary is the asset's time zone, not anything that happened."
  - "Rejected - inferring the run read from the arrival stamp in the run id (read_run's fallback) and the template's \"read || ownRun\" stand-in: both guess the supply of a table the result did not record, and are wrong whenever a held or later arrival shares the day (the Case Workers 1 May 2025 case)."
  - "Rejected - ordering ties by recorded_at, run_instant, run_index or run-id text (recordedAtOf, unitCounts' sorts, the own-run sort, supply_current_run, runs_about): keys sort as text, so __r10 sorts before __r9 and cp_notifications__X after cp_clients__X__r1; 62 groups of runs on ed_probe share a run instant; a re-check shares its arrival's run_index (recheck.py) and a settled pair's two supplies share one."
  - "Rejected - qa.check_result.id as the sequence: per result where the order needed is per run, and reassigned when a run's results are deleted and re-inserted on re-record."
  - "Rejected - a sequence drawn by a column DEFAULT on insert (the first draft's criterion 4) and frozen for life (architect B1): runs are first inserted at staging by file checks (register_run_if_absent) or by any tool write (record_run), so a DEFAULT records staging time, not evaluation; and a run key is evaluated again in real paths (reopen_run, recheck.mint_run_id reusing an owed run's key). Drawn in open_run, redrawn each time it is opened. The v2 draft said 'in the same transaction as the resolution'; the code records the resolution earlier, in period_overlay's own transaction, so the criterion now says 'after the resolution is recorded and before any tool is invoked' and the gap is covered by the sequencing NFR."
  - "run_seq is named distinctly because three orders already exist and each keeps one job: qa.delivery_file.receipt_sequence and arrivals' sequence are RECEIPT order (REQ-PIPE-061, which arrival came first); run_index is the manifest's arrival enumeration, retired as the build's own-run order; qa.check_result.id is a row identity, never an order. run_seq is EVALUATION order, the only one that says which result is newer. An attempt is identified by the run_seq it drew."
  - "Rejected - a new delivery-id column on qa.run (the main session's candidate 2): qa.filing already records every supply's delivery (NOT NULL, append-only; a held supply has a filing row with slot NULL), and qa.delivery_file its receipt instant, so a run's arrival group is a join on recorded facts. A second copy is a copy that can disagree."
  - "Within a point, highest run_seq wins, rejecting \"another table's result replaces the own verdict\" (template unitCounts, REQ-DASH-264's decision on REQ-DASH-225 criterion 18). Under K3 = C two results of one check share a point only within one sibling group or one decision's fan-out, where the later-opened run saw at least as much."
  - "Storage is rows in qa.check_read keyed to check_result.id with ON DELETE CASCADE, not jsonb in extra (architect S3): the gate's SQL joins it, and record_results' delete-and-insert then replaces result and reads atomically. qa.run_attempt is keyed (run_key, run_seq) and has NO cascade from results, which is the point of it."
  - "Contested, held and pairs recorded as states with supply ids, not names (architect S1): a contested table falls through to the period's promoted supply (supply_db.Resolution.unreadable), an open pair is one filed supply with two files, and a held entry is today a physical name, a supply id or an empty string depending on the path (period_overlay.py, name_held_siblings) - only a supply id lets criterion 12 match."
  - "Whether a table was read from staging or the period is its own recorded field (architect S2): the writer used `logical in resolution.supply_of` as \"is a period table\", which putting staged supplies in supply_of would silently break for unnamed readers."
  - "Recording the supply for a single-table result was rejected as a second copy of qa.run.supply_id; criterion 3's refusal enforces the assumption rather than trusting today's 0 of 20,014 (architect S4)."
  - "Placement reads recorded reads, not today's declarations (architect B2): share_cross_table_results and _cross_table_info used collect_checks(None), so editing a check's declared reads re-placed old history."
  - "name_held_siblings' held-or-absent decision, made at run time from the supply id, stays: it is deterministic and is what decides criterion 1's state."
  - "The physical names in a result's tables_read (REQ-PIPE-036 criteria 10 and 11) stay: they say which TABLE was read; this adds which SUPPLY. qa.tables_read's physical-name matching in runs_about becomes dead and goes."
  - "What stays a time, deliberately: a result's display date (REQ-DASH-264 criterion 9) and the as-of clip (criterion 1) are about WHEN something was recorded. Neither decides what a result is about or which of two is newer."
  - "The gate side (criteria 18 and 19) is in this requirement rather than left to #95 (first draft Q5, settled by the architect's review): leaving it would keep carried.siblings parsing run ids and runs_about matching names, which is the guessing Keith ruled out, and criterion 2's supply on qa.tables_read is needed by the gate anyway."
  open_questions:
  - "N1 (changes the panel's default comparison, REQ-DASH-264 criterion 11). With the same-day merge retired, a staggered delivery gives Notifications' Client reference two points minutes apart, the first often 'could not be checked' (312 of 2,508 same-day pairs on the bootstrapped history). Which point does the panel compare a point against by default: (a) the point just before it, (b) the newest earlier point with an evaluated result for that check (recommended), or (c) the newest point of the dataset's previous supply?"
  - "N2 (changes the attempt record, criterion 6). An attempt whose process is killed records no end. Close it as INTERRUPTED, end time unknown, when the next attempt of that run key begins or qa_store.incomplete_runs finds it (recommended), or record it as CRASHED with no end time?"
