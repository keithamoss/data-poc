- id: REQ-DASH-204
  title: "A dataset turned red because another table it reads could not be read says so at the top of its page, naming that table and what clears it"
  date_written: "2026-10-14"
  story: "As a data team leader opening a Child Protection dataset that reads red, I want the top of its page to tell me when the red comes from ANOTHER table it reads that could not be read - not yet due, overdue, held back with its delivery, two files for one table, a file that could not be loaded, held or waiting on a decision - naming that table and what clears it, so that I go to the one decision or arrival that clears it instead of hunting through this dataset's checks for a fault it does not have."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-13 evening, answering the CLI and dashboard UX reviews of the calendar close-out batch (plans/running-thoughts.md #92): 'a reader dataset turned red by ANOTHER table's contest gets a NEW DASHBOARD REQUIREMENT NOW'. Re-folded for #95 on 2026-10-22 (delivery-scoper): Keith's v2 Q10 = A (one wording), his 2026-10-22 S2 wording, N1 = A (the not-due muted line), Q5 = A (the owed re-check), Q10 = A (a rejected package-mate). THIS VERSION REPLACES the close-out draft's (docs/drafts/calendar-close-out/requirements-draft.yaml) when #95 is applied."
  acceptance_criteria:
  - "WHERE the supply a dataset page is about has a cross-table check, declared on this dataset, recorded as not evaluated because a table belonging to ANOTHER dataset could not be read - not yet due, overdue, staged and awaiting a decision, contested, could not be loaded, held with no period, or held back with its package (REQ-PIPE-270 criterion 4; held_blast_radius) - THE SYSTEM SHALL show at the top of that page ONE notice in the .notice-exhausted structure with a modifier class (never an inline style), in the blocked branch after the waiting-blocker banner and before the exhausted-schedule banner, holding one line per such table, each beginning in bold with criterion 15's wording and naming the period."
  - "THE SYSTEM SHALL word each line '<b>No promoted <dataset> for <period>.</b> <n> of this supply's checks need it, so they could not run. That is not a fault in this supply's own data. They run again by themselves once a <period> <dataset> supply is promoted.'; and WHERE the table is the package-mate held back with this supply, '<b>No promoted <dataset> for <period>.</b> The <dataset> received with this supply (<instant>) was held back, so <n> of this supply's checks could not run. That is not a fault in this supply's own data. They run again by themselves once a <period> <dataset> supply is promoted.'"
  - "THE SYSTEM SHALL NOT word the line so that it says or implies this dataset has nothing else wrong, SHALL leave out 'That is not a fault in this supply's own data.' where the supply has a red check of its own, and SHALL NOT change the dataset's status because of it - the line explains the red and never removes it."
  - "THE SYSTEM SHALL show one line per table however many of the dataset's checks read it, and SHALL NOT show a line per check."
  - "THE SYSTEM SHALL make every dataset name in the line a real link (<a href>) to that dataset's page at the same date on show, built with navHref / affectsLinks, so that middle-click and copying the link keep the date."
  - "THE SYSTEM SHALL judge the line as at the date on show - from the counted results (REQ-PIPE-269) and the decision log on that date - and SHALL NOT judge it as at the build, and SHALL NOT show a cause recorded at the run as though it were the table's state today; the cause is read on that table's own page."
  - "WHILE the table is in the warehouse on the date on show but the re-check it owes this supply has not run (REQ-PIPE-269 criterion 5), THE SYSTEM SHALL word the line '<b>Not yet re-checked against the <dataset> promoted <instant>.</b> <n> of this supply's checks read it; the re-check runs on the next processing pass.'; and WHILE a contest is resolved on the date on show but the checks it stopped have not run again, '<b><dataset>'s pair for <period> was settled on <date>.</b> <n> of this supply's checks have not run again since; the re-check runs on the next processing pass (REQ-PIPE-211).' - and SHALL NOT say that the red is waiting on the pair."
  - "WHEN the dataset's checks have been re-evaluated so that the supply's counted results carry no check not evaluated because of another table, THE SYSTEM SHALL show no line."
  - "THE SYSTEM SHALL NOT show the line on the page of the dataset whose table is the cause, which carries criterion 17's 'Affects' instead."
  - "THE SYSTEM SHALL identify the blocking table, its cause and a held-supply record's held_tables from structured fields alone, through the one function REQ-PIPE-278 criterion 1 names, and SHALL NOT parse a reason's prose; records written before this change SHALL be read by their single unrunnable_code."
  - "THE SYSTEM SHALL compute the line at build time from recorded QA results and recorded decisions only, and SHALL NOT read supply rows."
  - "THE SYSTEM SHALL render every name in the line as text, never as markup."
  - "THE SYSTEM SHALL have real-browser tests, against a dashboard built from a fixture history, written first and seen to fail, in which: a reader dataset shows one line naming the contested table while the pair is open - though three of its checks read that table - and no line once its checks have been re-evaluated after the settlement; S2 strict's Clients page shows the package form naming the held-back Notifications; a reader whose partner is not yet due shows the line and the partner's page shows criterion 17's muted line; and the owed re-check shows its own wording."
  - "WHERE the synthetic history holds TS-42 or TS-80 (REQ-GEN-203), THE SYSTEM SHALL quote the line, as the page words it, in each scenario's register entry for its three reader datasets on the pair's arrival day."
  - "THE SYSTEM SHALL use criterion 2's one wording for every cause and SHALL NOT word the line per cause, except criterion 7's two lines."
  - "WHERE every red check on a reader's waiting supply is one not evaluated because of another table, THE SYSTEM SHALL word the reader's verdict line and its outstanding item to say that nothing needs deciding on this supply, and that its checks run again and the gate is applied again once a <period> <dataset> supply is promoted (REQ-PIPE-121), and SHALL NOT offer promote or reject as its next step; WHERE that other supply has been rejected, THE SYSTEM SHALL say instead, from the decision log, 'The <dataset> file received with it was turned down; this supply now needs its own decision.'"
  - "THE SYSTEM SHALL end the notice the causing dataset's own page shows for that cause with 'Affects <reader links>', built by affectsLinks(), naming each dataset this criterion's line appears on at the date on show; and WHERE the cause is that the table is not yet due, SHALL show on that table's page, in noSupplyNote()'s .late-open-note shape, a muted line 'Not due until <instant> — the <reader links> is waiting on it' ('are waiting on it' for more than one), leaving the readers' red unchanged."
  - "THE SYSTEM SHALL show, in the collection table, a quiet note under each such reader's status pill naming the causing table, in the noSupplyNote shape, and on the collection card ONE line per causing table, in the redPromotedMarker shape, naming that table once with the number of readers it holds red - except a cause that is part of a held-back delivery, which REQ-DASH-275 criterion 4's one line carries - and SHALL NOT list each reader on the card."
  non_functional_requirements:
  - "SCALE (CLAUDE.md's ~30-datasets rule): one line per table, never per check; one card line per causing table or held-back delivery."
  - "PERFORMANCE: computed once per dataset per build from the results already embedded; no per-render scan of history."
  - "THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else (criterion 11)."
  - "PRIVACY: the line names the other dataset and the period, never the two filenames."
  - "ACCESSIBILITY AND CONSISTENCY: the page's notice structure and role='status'; the not-due line in the existing muted-note shape; no new asset, so the self-hosted, file:// and offline viewing paths are unaffected."
  - "NO FLICKERING REDS (#113): a red because a partner is not due yet is explained on both pages and raises nothing (REQ-PIPE-278)."
  - "TEST FIRST for criterion 3 above all: a line that read as 'this dataset is fine' would be the false-green direction."
  dependencies:
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-PIPE-121
  - REQ-DASH-197
  - REQ-PIPE-202
  - REQ-GEN-203
