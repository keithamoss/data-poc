# VOCABULARY (CLI review of v3; Keith's own answers use it): the gate's
# outcome for a supply it does not promote is HELD BACK, recorded as the
# decision-log action 'promotion-withheld'. Never 'held' (REQ-PIPE-078's held
# with no period) and never 'refused' or 'rejected' (a person's decision,
# REQ-PIPE-163 criterion 20). 'Not promoting' is used only inside the gate's
# algorithm, before anything is written.
requirements:
- id: REQ-PIPE-266
  title: "Files that arrive together are gated together, once every one of them has been checked"
  date_written: "2026-10-21"
  story: "As the person answerable for a collection's supplies, I want the files that arrive in one package to be gated together, and only once every one of them has been checked, so that no file is promoted on a verdict about a package-mate that is then held back."
  moscow: must
  status: not_started
  source: "Keith, settling plans/running-thoughts.md #95's shape, 2026-10-20 evening to 2026-10-21 morning (summary.md, 'Shape settled in principle'): 'A package of files is gated together, after every file in it has been checked'; zip as the stand-in for a package, plans/running-thoughts.md #114. Keith's answers on v3, 2026-10-22: Q3 = A, Q9 = A ('B later'), a decision on a package still being gated is refused, the joint-promotion history row. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22."
  acceptance_criteria:
  - "THE SYSTEM SHALL treat as ONE PACKAGE the arrivals of one collection that share a receipt instant and are filed to one period - the siblings of REQ-PIPE-265 criterion 1, read from the record, partitioned by period - and SHALL treat an arrival that shares its instant with no other as a package of one."
  - "THE SYSTEM SHALL gate a package through ONE package-gate function, reached from every place a gate is applied to an arrival - the per-arrival lifecycle, the orchestrator, the processing pass and a person's hand-filed run - and SHALL NOT leave any of them gating one sibling alone."
  - "WHILE an arrival is checked and the rest of its package is not, THE SYSTEM SHALL classify it as CHECKED, WAITING FOR ITS PACKAGE - not a failure (processing_pass.fail_arrival), holding back later arrivals as an ungated one does - and SHALL record the package's gate as an owed item whose cause is the load of the package's last arrival (or, if qa_store's owed-item constraint cannot take that, a new owed kind 'package-gate'), so that a timeout, a budget stop or a crash resumes it."
  - "THE SYSTEM SHALL give every promotion and every hold-back of one package gate the same effective instant, rather than one seeded per arrival (orchestrate.promote_after's effective_at_for), so that newest-cause ordering (REQ-PIPE-121 criterion 10) treats the package as one decision point."
  - "WHEN a person runs one file of a package that is not yet fully checked (mothman cp qa --commit), THE SYSTEM SHALL say it is not gated yet and waits until every file of its package is checked, naming how many are, SHALL exit 0, and SHALL offer no decision on it."
  - "WHERE arrivals come from the cloud ingest path, which records each object as its own delivery at its own storage instant (s3_arrival.record_object), THE SYSTEM SHALL treat each as a package of one, and SHALL say so as a known limitation in docs/aws-event-driven-mvp-design.md, naming plans/running-thoughts.md #114 and plans/supply-thoughts.md as where a cloud package boundary (a manifest or an end marker) is to be scoped."
  - "WHEN an arrival of a package of more than one has been checked, THE SYSTEM SHALL NOT apply the promotion gate to it until every arrival of that package has been checked, an arrival counting as checked once its run is recorded or its supply is recorded as could not be loaded, held (REQ-PIPE-078) or contested."
  - "WHEN the last arrival of a package has been checked, THE SYSTEM SHALL gate the package's supplies together as one gate application (REQ-PIPE-267), and SHALL do so before any arrival received after the package is filed."
  - "THE SYSTEM SHALL record each supply a gate application holds back as a decision-log entry with the action 'promotion-withheld', with the rule as actor, naming the package's receipt instant and, where the cause is another supply, that supply - and SHALL write it the moment it is final (once a supply is held back it is never promoted by the same gate application), not when the whole application has settled."
  - "THE SYSTEM SHALL record each promotion a gate application makes with the rule as actor, naming the package's receipt instant and every other supply promoted in the same gate application, so that the supply history can say what it was promoted with (REQ-DASH-272)."
  - "WHEN a gate application promotes one or more supplies, THE SYSTEM SHALL owe ONE re-evaluation (REQ-PIPE-121) covering every table it moved, after the last of those promotions commits, and SHALL NOT owe one per promotion."
  - "IF the processing pass stops after some arrivals of a package have been checked and before the package is gated, THEN THE SYSTEM SHALL leave the checked arrivals ungated, check the rest on its next pass and then gate the package, and SHALL NOT gate the checked arrivals on their own."
  - "IF an arrival of a package cannot be checked because its run fails to complete, THEN THE SYSTEM SHALL leave the whole package checked-and-waiting and its gate owed - not a failure of the package-mates - report which arrival stopped it and at which stage, re-run the crashed arrival on the next processing pass, and gate the package together once it is checked; THE SYSTEM SHALL NOT gate the package-mates without it."
  - "WHERE an arrival of a package is checked but left ungated because the agreement backstop refuses its dataset (REQ-PIPE-170), THE SYSTEM SHALL treat that supply as held back at the package gate, so that its package-mates are re-checked against what is in the warehouse and go ahead if green (REQ-PIPE-267), matching the backstop's own 'holding back nothing else'."
  - "IF a person asks to record a decision on a supply whose package is still being checked or gated - its package-gate item owed and not cleared - THEN THE SYSTEM SHALL refuse before asking for a reason, worded 'The delivery received <instant> is still being checked (<n> of <m> files checked); decide once it is gated.', and SHALL record nothing."
  - "WHEN a person's promotion is applied (promotion.promote), THE SYSTEM SHALL re-confirm, under the slot locks it already takes, that the supplies the promoted supply's counted cross-table verdicts read are still the ones in place or promoting with it (as inheritance._still_stands_on re-confirms a stood-on supply), and IF any has changed, THEN SHALL restart the gate application rather than promote on a verdict about a supply that is no longer there."
  - "WHEN a replay of one collection is asked for a checkpoint before an arrival that is not the first of its package, THE SYSTEM SHALL refuse, naming the package's first arrival, and SHALL NOT save a checkpoint between two arrivals of one package."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-105 criterion 1, REQ-PIPE-121 criterion 9 and REQ-TEST-159 criterion 1 with the wording in summary-v4.md once Keith has approved it."
  - "S1, NOTHING IS GATED BEFORE THE LAST FILE IS CHECKED: THE SYSTEM SHALL have tests/test_package_gate.py::TestGatedTogether::test_no_sibling_is_gated_before_the_last_is_checked, driving the real Child Protection orchestrator with a zip of Clients v2 and Notifications v2 over a 2024-Q3 holding Clients v1 and Notifications v1, asserting that no promotion or 'promotion-withheld' is recorded for either v2 before both runs are recorded - written first and seen to fail, because today each arrival is gated straight after its own run (arrival_lifecycle.process)."
  - "S2, ONE KNOCK-ON FOR A PACKAGE PROMOTED WHOLE: THE SYSTEM SHALL have tests/test_package_gate.py::TestGatedTogether::test_a_package_promoted_whole_owes_one_reevaluation, in which a first-time zip of Clients v2 and Notifications v2, both green, promotes both with one effective instant, each promotion naming the other, owes exactly one re-evaluation, and records no readers-only run for either - written first and seen to fail."
  - "THE SYSTEM SHALL have tests/test_package_gate.py::TestInterruptedPackage::test_a_part_checked_package_is_finished_and_gated_whole, which stops the processing pass between the two runs of S1's zip and asserts that the next pass checks the second, then gates both together; and test_a_crashed_sibling_keeps_the_package_waiting, which makes Notifications v2's run fail at the Soda stage and asserts Clients v2 is neither promoted nor held back, the package's gate is owed, and the next pass re-runs Notifications v2 and gates both - both written first and seen to fail."
  - "THE SYSTEM SHALL have tests/test_package_gate.py::TestBackstopSibling::test_a_backstop_refused_sibling_counts_as_held_back, in which the agreement backstop refuses cp-notifications and Clients v2 is re-checked against Notifications v1 and promoted - written first and seen to fail."
  - "THE SYSTEM SHALL have tests/test_package_gate.py::TestDecisionDuringTheGate - test_a_decision_on_a_package_still_being_gated_is_refused (the refusal wording, nothing recorded) and test_a_promotion_whose_read_supply_moved_restarts_the_gate (S16: a person promotes Notifications v2 while Clients v2 is being re-checked against Notifications v1, and Clients v2 is not promoted on the verdict about v1) - both written first and seen to fail."
  non_functional_requirements:
  - "NO HALF-AND-HALF VIEW (Keith, 2026-10-21): nothing is promoted on a verdict about a package-mate that has not itself been gated."
  - "NO FLICKERING REDS (plans/running-thoughts.md #113): a hold-back is written only once it is final, so no decision a gate application later reverses is ever recorded; the results of re-checks that have not settled are not counted anywhere until it settles (REQ-PIPE-267 criterion 11)."
  - "PERFORMANCE: a package's gate waits only for its own files' checks - minutes on Child Protection - and never for any other arrival, so REQ-PIPE-105 criterion 2 (no supply held pending another's arrival) still holds."
  - "RELIABILITY: a crashed sibling keeps its package waiting and owed until the next pass re-runs it (Keith, Q3 = A); a backstop refusal, which can last until someone fixes the agreement, holds back only its own supply; a part-checked package is finished, never gated in part."
  - "DETERMINISM AND REPLAY: package membership comes from the recorded receipt instant, never from process timing, so a parallel and a sequential bootstrap still record the same decisions (REQ-PIPE-262 criterion 13), and a checkpoint is only ever at a package boundary."
  - "AUDITABILITY: every promotion and hold-back names its package's receipt instant, and every promotion names what it was promoted with, so 'what was gated together' is one query over qa.decision."
  - "CONCURRENCY: a person's decision can neither land between a package's checks and its gate (refused) nor promote on a read supply that moved under it (re-confirmed under the slot locks)."
  - "SCALE (~30 collections on the quarterly asset): a package is one collection's files at one instant, so the cost is per package and does not grow with the number of collections."
  - "COMPATIBILITY (cloud path): on S3 every file stands alone and gets the accepted flicker until a boundary is scoped; recorded, not designed around (Keith, Q9 = A)."
  - "SECURITY AND PRIVACY: nothing widened; the package is identified from receipt records, never file contents."
  dependencies:
  - REQ-PIPE-265
  - REQ-PIPE-267
  - REQ-PIPE-105
  - REQ-PIPE-121
  - REQ-PIPE-151
  - REQ-PIPE-170
  - REQ-TEST-159
  decisions:
  - "GATED TOGETHER, AFTER ALL ARE CHECKED (Keith, 2026-10-20/21): 'A package of files is gated together, after every file in it has been checked.' REJECTED today's behaviour, gating each file straight after its own run (arrival_lifecycle.process calls promote_after per arrival), which in S1 promotes Clients v2 before Notifications v2 has been checked at all."
  - "A ZIP STANDS IN FOR A PACKAGE, AND A PACKAGE IS A SHARED RECEIPT INSTANT (Keith, 2026-10-20, plans/running-thoughts.md #114). Criterion 1 reads it from the record exactly as REQ-PIPE-265 does, so another boundary marker later changes one definition, not two. NOT the delivery directory: a delivery's files can land minutes apart (REQ-GEN-044), and those are staggered, not a package."
  - "ZIP-ONLY FOR NOW, THE CLOUD BOUNDARY LATER (Keith, 2026-10-22, Q9 = A, 'B later'): on the S3 path every file stands alone and gets the accepted flicker; this is a recorded limitation, REQ-DOCS-274 tells suppliers to upload a zip, and a cloud boundary (a manifest or an end marker) is transport-layer work for plans/running-thoughts.md #114 and plans/supply-thoughts.md. REJECTED defining a cloud package boundary now (Q9 B)."
  - "A CRASH WAITS, A BACKSTOP REFUSAL IS HELD BACK (Keith, 2026-10-22, Q3 = A): a crash is usually transient, so the package stays checked-and-waiting and owed, not failed, and the next pass re-runs the crashed file and gates the package together; a backstop refusal can last until the agreement is fixed, so it counts as held back and the siblings are re-checked against the warehouse partner, which matches the backstop's own 'holding back nothing else'. REJECTED both waiting (Q3 B: a long backstop refusal holds a clean file indefinitely) and both counting as held back (Q3 C: after a crash a file is judged without knowing what its package-mate would have found)."
  - "HOLD-BACKS ARE WRITTEN WHEN FINAL, NOT WHEN THE GATE SETTLES (architect, v3 draft review N3): v3 wrote every refusal only after the gate settled, but a re-check run's cause is the hold-back and qa.run requires a cause (qa_store.py:216-217). Within one gate application the held-back set only grows, so a hold-back is final the moment it is made and writing it then flickers nothing. The re-check RESULTS stay hidden until the application settles (REQ-PIPE-267 criterion 11). The owed package gate had no cause either (qa_store.py:1330), hence criterion 3."
  - "THE ACTION IS 'promotion-withheld' AND THE WORD IS 'HELD BACK' (CLI review of v3): v3's 'refusal' named no decision-log action and its wording opened 'Refused:', which REQ-PIPE-163 criterion 20 forbids for a gate outcome; the terminal already says 'held back' for the gate (decision_words, _gate_words), and Keith's own answers use it."
  - "A DECISION ON A PACKAGE STILL BEING GATED IS REFUSED (Keith, 2026-10-22, agreed batch 'All four as recommended'; architect T13; CLI review N3): Keith's wording, criterion 15. And promote() re-confirms the read holders under the slot locks (architect S16) - the refusal closes the ordinary race, the re-confirmation closes the one the refusal cannot see."
  - "THE JOINT PROMOTION IS RECORDED AND SHOWN (Keith, 2026-10-22, agreed batch): criterion 10 records what a supply was promoted with; REQ-DASH-272 shows 'Promoted <time> with the <dataset> supply received <instant>, by the rule' on the supply-history row, which replaces the v3 'cleared minutes later' note (dashboard Q-F)."
  - "NO COMPLETENESS IS INFERRED (REQ-PIPE-105 criteria 2 and 12, unchanged): a package's files share one instant and are all present when it is filed, so gating together waits on their checks, never on an arrival. The retired completion tracker stays retired."
  - "STAGGERED FILES FLICKER, ACCEPTED (Keith, 2026-10-20): 'I guess that's just going to have to flicker at that point. And we need to say, if you want to avoid a flicker, make sure you send us a package of files... I don't think we can really design around that.' REQ-DOCS-274 carries the supplier guidance."
  - "ONE KNOCK-ON PER GATE APPLICATION (delivery-scoper, 2026-10-21): a knock-on after the first of several promotions would re-run the next one's readers against a period about to change. Hence criterion 11 and the REQ-PIPE-121 criterion 9 amendment."
  - "A CHECKPOINT NEVER SPLITS A PACKAGE (delivery-scoper): refusing such a checkpoint is simpler than teaching resume about part-gated packages."
  open_questions: []
- id: REQ-PIPE-267
  title: "A supply is promoted only on cross-table verdicts about what the warehouse will hold, and supplies that depend on each other are gated together, transitively, until nothing changes"
  date_written: "2026-10-21"
  story: "As a data team leader, I want a file promoted only on cross-table verdicts about the tables it will actually sit beside in the warehouse, and files that depend on each other promoted together or not at all, so that the warehouse never holds a table judged only against a file that did not get in, and two or three clean files never wait on each other for a person."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-20/21 (summary.md, 'Shape settled in principle'): the no-half-and-half principle; 'When a file in the package is held, the others' cross-table checks re-run against the warehouse partner before any of them can promote'; 'Re-checks cascade within a package until nothing changes'; 'things that depend on each other don't promote until they're all happy... A human can always overrule that using the terminal'. Keith, 2026-10-22: the transitive group gate (architect N1), put to him as a clarification of 'things that depend on each other don't promote until they're all good', no objection; the scoper's Q1 and Q2 both A. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22 (absorbs v3's REQ-PIPE-268 and criterion 14)."
  acceptance_criteria:
  - "THE SYSTEM SHALL count toward a supply's promotion gate a cross-table verdict only where it is counted toward that supply (REQ-PIPE-269 criterion 4) and every supply the check's run read (qa.tables_read, compared by supply, never by physical table name) is either the supply in the warehouse for its table in that period - promoted, inherited or substituted - or a supply still promoting in the same gate application."
  - "THE SYSTEM SHALL form a GATE APPLICATION from the supplies a gate entry has just checked - a package's arrivals (REQ-PIPE-266), or the supplies a re-evaluation (REQ-PIPE-121 criterion 3) or a re-check (recheck.execute: a re-file, an un-supersede, a settlement) touched - together with every supply WAITING in the same period that is connected to any of them through recorded cross-table verdicts, TRANSITIVELY, and SHALL apply criteria 1 to 9 to the whole set at every gate entry."
  - "THE SYSTEM SHALL NOT run any check of a waiting supply to bring it into a gate application, deciding from its recorded results alone; and WHERE a counted verdict of a joined waiting supply read a supply that is neither in the warehouse nor still promoting in the application, THE SYSTEM SHALL mark the joined supply not promoting rather than re-check it, so that no other table is re-checked because a file landed."
  - "WHEN a gate application begins, THE SYSTEM SHALL mark as NOT PROMOTING every supply of it that would not be promoted on checks that read no other supply of the application - its own checks, and cross-table verdicts against supplies in the warehouse - or that is red, amber under 'hold', contested, held, could not be loaded, superseded, refused by the agreement backstop, or a resupply its slot's replacement setting does not let replace, and SHALL NOT mark a supply not promoting at this step only because a verdict against another supply of the application failed."
  - "WHEN a supply of a gate application is not promoting and another supply of it - one the gate entry has just checked - is still promoting and has a cross-table verdict that read it, THE SYSTEM SHALL re-evaluate that check for the other supply against the period as it will stand - that table's supply in the warehouse, or none - reading the application's other still-promoting supplies as staged, before the gate decides on the other supply."
  - "THE SYSTEM SHALL then mark not promoting every supply that a re-evaluation of criterion 5 left failing, repeat criterion 5, and - once no re-evaluation changes anything - mark not promoting together every still-promoting supply whose counted verdict against another still-promoting supply fails, and repeat from criterion 5, stopping only when the set of supplies not promoting stops growing; THE SYSTEM SHALL then promote the rest together, so that supplies that read each other promote together or not at all."
  - "THE SYSTEM SHALL evaluate each step of criteria 4 to 6 over the whole set of supplies at once, never one supply at a time, SHALL reach the same outcome whatever order the supplies are listed in, SHALL NOT re-check a supply already not promoting, and SHALL NOT re-run a check whose read supplies have not changed since its last result."
  - "WHERE a re-evaluated check has no supply in the warehouse to read for a table, THE SYSTEM SHALL record it not evaluated and red with the reason that applies (REQ-PIPE-079 criteria 4, 15 and 16; REQ-PIPE-270), counted as REQ-PIPE-269 criterion 4 says, and SHALL NOT treat the absent table as empty."
  - "WHERE a check's verdict was carried from a sibling (REQ-PIPE-265) and a supply it read is not promoting, THE SYSTEM SHALL stop counting the carried verdict and re-evaluate the check under criterion 5, whose result replaces it; REQ-PIPE-265's criteria are unchanged."
  - "THE SYSTEM SHALL record each re-evaluation of criterion 5 as a readers-only run (REQ-PIPE-121 criterion 2), naming as its cause the 'promotion-withheld' entry of the supply that is not promoting (REQ-PIPE-266 criterion 9, written the moment it is final), recording on the run which tables it read from the warehouse rather than from staging (from_warehouse, on qa.run), batching one run per supply per round, and SHALL NOT re-run any supply's own table and column checks for it."
  - "WHILE a gate application has not settled, THE SYSTEM SHALL NOT count the results its re-evaluations record toward any status, page, count, ticket or notification, and SHALL count them only once its last promotion or hold-back is written, so that an intermediate result of a cascade is never shown."
  - "WHEN a supply is held back because of a re-evaluation under criterion 5, THE SYSTEM SHALL record on its 'promotion-withheld' entry, as structured fields, which checks are responsible, which supply in the warehouse each was checked against (or that there was none), and which supply of the application was held back; and SHALL word its reason from those fields as 'Held back: <check>, re-checked against the <dataset> in place in the warehouse (received <instant>) because the <dataset> received with it was held back. This supply's own checks passed.' or 'Held back: <check> could not be checked - no <dataset> is in place in the warehouse, and the <dataset> received with it was held back. This supply's own checks passed.', leaving out the last sentence where they did not."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-075 criterion 2 and REQ-PIPE-121 decision 11 ('A FILE LANDING IN STAGING STAYS OUTSIDE THIS MECHANISM') with the wording in summary-v4.md once Keith has approved it."
  - "S1 GREEN BRANCH: THE SYSTEM SHALL have tests/test_package_gate.py::TestPackageMateHeldBack::test_clients_rechecked_against_notifications_in_the_warehouse_and_promoted - 2024-Q3 holding Clients v1 and Notifications v1, a zip of Clients v2 (green) and Notifications v2 (red on blank values of its own) - asserting that Notifications v2 is held back, that Notifications' Client reference is re-run for Clients v2 against Notifications v1 and passes, that Clients v2 is promoted, and that the period then holds Clients v2 and Notifications v1 - written first and seen to fail, because today Clients v2 is promoted on the verdict against Notifications v2."
  - "S1 RED BRANCH: THE SYSTEM SHALL assert in the same class (test_clients_held_back_when_it_drops_clients_notifications_v1_points_at) that where Clients v2 lacks clients Notifications v1 points at, the re-run fails, Clients v2 is held back, and its 'promotion-withheld' entry carries criterion 12's fields and wording naming Notifications v1 and the held-back Notifications v2."
  - "S1 STEP 4: THE SYSTEM SHALL assert in the same class (test_rejecting_the_held_back_package_mate_changes_nothing) that a person rejecting Notifications v2 afterwards owes no re-evaluation and leaves Clients v2's results and decision unchanged, and (test_promoting_it_later_rechecks_through_the_knock_on) that a person promoting Notifications v2 instead re-checks Clients v2 through REQ-PIPE-121's knock-on - characterization guards, not claimed to fail first."
  - "S2 STRICT: THE SYSTEM SHALL assert in tests/test_package_gate.py::TestFirstTimePackage::test_clients_held_back_when_notifications_is_held_back that in a first-time zip with Notifications v2 held back, Notifications' Client reference is re-run for Clients v2 with no Notifications in the warehouse, records not evaluated and red, and Clients v2 is held back; and that a later promotion of Notifications v2 by a person re-checks and promotes Clients v2 through the knock-on - written first and seen to fail."
  - "S3 AND S2b, A WAITING PARTNER JOINS: THE SYSTEM SHALL have tests/test_package_gate.py::TestStaggered::test_waiting_partner_promoted_with_the_later_file - Notifications v2 arriving alone at 08:40, held back red because no Clients is in the warehouse or staged; Clients v2 arriving alone at 09:00 whose run passes Notifications' Client reference against the staged Notifications v2 - asserting both promoted in one gate application and no readers-only run; and test_correction_promotes_with_the_waiting_clients - after S2 strict leaves both held back, a clean Notifications v3 arriving alone the next day is promoted together with Clients v2 - both written first and seen to fail."
  - "S3b, A PARTNER WAITING FOR ITS OWN RED: THE SYSTEM SHALL assert in the same class (test_arrival_rechecked_against_the_warehouse_when_its_partner_is_red) that where Clients v2 waits red on its own checks and Notifications v2 arrives alone twenty minutes later, Clients v2 joins the gate application and is not promoting, and Notifications v2 is gated on its Client reference re-run against Clients v1, not on its verdict against Clients v2 - written first and seen to fail."
  - "S10, THREE STAGGERED ARRIVALS: THE SYSTEM SHALL have tests/test_package_gate.py::TestTransitiveGate::test_three_staggered_files_promote_together - 2024-Q4 with nothing in the warehouse; Notifications v2 at 08:40 (held back, no Clients or Investigations), Clients v2 at 09:00 (held back: Notifications v2 still reads no Investigations), Investigations v2 at 09:20 - asserting all three are promoted in Investigations v2's gate application with no readers-only run; and test_mutual_waiters_join (S11: Notifications and Investigations waiting on each other are both joined by a third arrival) - written first and seen to fail (under v3's REQ-PIPE-268 all three waited for a person)."
  - "S5 CASCADE: THE SYSTEM SHALL have tests/test_package_gate.py::TestCascade::test_mutual_readers_settle_in_any_order - a zip of Clients v2, Notifications v2 and Investigations v2 over v1s, Investigations v2 red on its own checks - asserting the same promotions and hold-backs whichever order the three are listed in, and that the cascade stops when nothing changes - written first and seen to fail."
  - "T14, RE-FILED SIBLINGS: THE SYSTEM SHALL have tests/test_package_gate.py::TestRecheckEntry::test_refiled_partners_are_gated_together, in which a person re-files Clients and Notifications supplies into one period and both, clean together, are promoted in one gate application through recheck.execute - written first and seen to fail."
  non_functional_requirements:
  - "NO HALF-AND-HALF VIEW (Keith, 2026-10-21): a supply is never promoted on a verdict about a supply that will not be beside it in the warehouse (criterion 1)."
  - "NO FALSE GREEN: an absent partner is could-not-run, which is red for the table asking the question (criterion 8, REQ-PIPE-269 criterion 4); nothing is promoted because a check that could not read a table was left out."
  - "NO DEADLOCK BETWEEN CLEAN FILES (architect N1): every waiting supply connected through recorded verdicts joins the gate application, so two, three or more clean files arriving apart, or re-filed together, promote together when the last of them is checked."
  - "NO FLICKERING REDS (plans/running-thoughts.md #113): hold-backs are written only when final, and a re-check's results are not counted until the application settles (criterion 11)."
  - "PERFORMANCE OF THE CASCADE: each round re-runs only cross-table checks (never a supply's own), only for supplies the gate entry just checked, and a set of n supplies settles in at most n-1 rounds - at most 5 for Child Protection's six tables. Joining waiting supplies costs one status computation each and no run. On the bootstrapped history queried 2026-10-21, 12 of 53 multi-file Child Protection packages held a file that was never promoted. The added runs and wall clock are measured on the first bootstrap after build and the bootstrap figure in CLAUDE.md updated."
  - "SCALE (~30 collections): the connected set is bounded by one collection's tables in one period, never by the asset's."
  - "DETERMINISM AND REPLAY: the outcome is a fixed point evaluated over the whole set at once, independent of order (criterion 7), and which waiting supplies join is decided from recorded results alone, so a replay, a resume and a parallel bootstrap reach the same decisions."
  - "AUDITABILITY: every re-run names the hold-back that caused it (criterion 10) and every hold-back names its cause and the supply it was checked against (criterion 12), so 'why was this held back when its own data was fine' is answerable from the decision log alone."
  - "SECURITY: a person's override (promote, accept) keeps its allowlist, actor and mandatory reason; nothing widened."
  - "THE BUILD RULE: everything here is decided at run time where a connection is legitimately open; the dashboard build reads only what was recorded."
