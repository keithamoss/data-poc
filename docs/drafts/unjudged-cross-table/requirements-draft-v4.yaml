  decisions:
  - "A NEW REQUIREMENT NOW (Keith, 2026-10-13): a top-of-page line on the reader naming the other table. REJECTED leaving it for a later road-testing sighting."
  - "THE LINE EXPLAINS THE RED, NEVER REMOVES IT (delivery-scoper, 2026-10-14; restored under #95's strict rule, REQ-PIPE-270): REJECTED showing such a reader amber or recomputed without those checks - the false-green direction."
  - "NAMES THE DATASET AND PERIOD, NOT THE FILES (delivery-scoper, 2026-10-14)."
  - "ONE LINE PER TABLE (CLAUDE.md scale rule): REJECTED a line per affected check."
  - "EVERY RED ROOTED IN ANOTHER TABLE GETS THE LINE (Keith, 2026-10-14, close-out Q17 = A), and under #95 that now includes NOT YET DUE (REQ-PIPE-270 makes it red) and HELD BACK WITH ITS PACKAGE. The close-out's 'never a not-yet-due one' is withdrawn: Keith wants the shout even when the table simply has not arrived."
  - "ONE WORDING, 'NO PROMOTED <dataset> FOR <period>' (Keith, 2026-10-14/20, v2 Q10 = A): the cause is read on that dataset's page, and the recorded cause can be out of date. REJECTED the close-out's five per-cause wordings; with them go the per-table reason codes (close-out criterion 10), which only those wordings needed - the structured table fields and held_tables stay."
  - "THE PACKAGE FORM (Keith, 2026-10-22, S2 wording = yes): 'The <dataset> received with this supply (<instant>) was held back, so <n> of this supply's checks could not run...' This amends his own single wording from v2 Q10 = A for the one case where the cause is a package-mate."
  - "THE OWED RE-CHECK'S WORDS (Keith, 2026-10-22, Q5 = A): 'Not yet re-checked against the <dataset> promoted <instant>; the re-check runs on the next processing pass.' It replaces the v2 UX review's 'was promoted on <date>' line, and resolves the close-out criterion 7 against criterion 15 contradiction (v2 dashboard UX 4)."
  - "A PARTNER NOT DUE YET GETS A MUTED LINE ON ITS OWN PAGE (Keith, 2026-10-22, N1 = A): 'Not due until <instant> — the <reader> is waiting on it', reader names by affectsLinks; the reader's red is unchanged. This answers the close-out's open check (a not-yet-due cause had no notice for 'Affects' to end). Keith answered 'A' once to two questions open together; both recorded as A, to confirm at the walk-through."
  - "A REJECTED PACKAGE-MATE (Keith, 2026-10-22, Q10 = A): no re-check; the reason reworded from the decision log; no stale 'waiting for'."
  - "COLLECTION LEVEL: ROW NOTE, 'AFFECTS', AND ONE CARD LINE (Keith, 2026-10-14, close-out Q18 = A), with a held-back delivery's one line (REQ-DASH-275) taking the place of per-cause lines for its own causes."
  - "THE READER'S OWN WAITING ITEM SAYS NOTHING NEEDS DECIDING THERE (Keith, 2026-10-14, close-out Q19 = A): criterion 16 is the page half; the terminal half is REQ-PIPE-210."
  - "MUST (Keith, 2026-10-14, close-out Q20 = A)."
  - "S1 RED IS NOT THIS REQUIREMENT'S (delivery-scoper, 2026-10-22): a supply re-checked against the warehouse that FAILS has a real failing verdict, not a check that could not run; REQ-DASH-275 explains it."
  open_questions:
