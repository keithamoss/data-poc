- id: REQ-GEN-273
  title: "Target agreement compares a targeted supply with its own checks, and a few scenarios pin what the package gate decides"
  date_written: "2026-10-21"
  story: "As whoever maintains the synthetic history, I want the bootstrap's target check to compare each supply with what its own checks found, and a few scripted scenarios to declare what the package gate should decide, so that a supply built green is not reported as a disagreement because a package-mate built red was held back, and the gate itself is still pinned by the test history."
  moscow: must
  status: not_started
  source: "Delivery-scoper, 2026-10-21, tension T7: REQ-GEN-186 criterion 3 compares every targeted supply's verdict as the promotion gate reads it and fails the bootstrap on a difference; under REQ-PIPE-267 and REQ-PIPE-270 a supply built green can end red for want of a partner. Keith, 2026-10-22, Q7 = A, 'with a few scenario that explicitly exercise B'. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22."
  acceptance_criteria:
  - "WHEN a replay finishes, THE SYSTEM SHALL compare each targeted supply's target with the verdict of the file's own checks - leaving out the cross-table checks recorded not evaluated for want of a table (REQ-PIPE-270) and the re-evaluations REQ-PIPE-267 criterion 5 made because another supply was held back - and SHALL fail the bootstrap only on a difference in that comparison (REQ-GEN-186 criterion 3)."
  - "THE SYSTEM SHALL report, without failing the bootstrap, each targeted supply whose full gate reading differs from its target only because of the checks criterion 1 leaves out, naming the package-mate or the missing table."
  - "THE SYSTEM SHALL let a scripted scenario in the scenario map (REQ-GEN-045) declare the GATE OUTCOME it expects for named supplies - promoted, or held back, and where held back, because of which other supply and whether after a re-check against the warehouse - and WHEN a replay finishes, SHALL compare each declared outcome with the recorded promotions and 'promotion-withheld' entries and IF they differ, THEN fail the bootstrap naming the scenario and the supply."
  - "THE SYSTEM SHALL add scripted scenarios declaring gate outcomes for at least: S1 green (Clients v2 re-checked against Notifications v1 and promoted; Notifications v2 held back), S1 red (Clients v2 held back after the re-check), S2 strict (Clients v2 held back because Notifications v2 was held back, nothing in the warehouse), the S10 three-file staggered chain (all three promoted together at the last arrival), and Q13's Placements case (S14: Placements v2 held back alone, the other tables promoted), each with its own scenario id."
  - "THE SYSTEM SHALL NOT compute a predicted verdict (REQ-GEN-186 criterion 4) and SHALL change no filing, promotion, decision or verdict (REQ-GEN-186 criterion 6)."
  - "THE SYSTEM SHALL audit, in the same change, every scripted decision in the scenario map that names a supply this batch's gating changes the outcome of (scripted_decisions refuses a changed target), and REQ-PIPE-262 criterion 12's pins, TS-63 and REQ-GEN-251 criterion 3, and SHALL bring each changed expectation to Keith - with whether a generator fix keeps it - rather than re-pin it silently."
  - "THE SYSTEM SHALL amend, in the same change, REQ-GEN-186 criterion 3 with the wording in summary-v4.md once Keith has approved it."
  - "THE SYSTEM SHALL have tests/test_target_agreement.py::TestPackageMateHeldBack::test_green_target_agrees_when_only_a_held_back_partner_made_it_red, a fixture replay of S2 strict with Clients built green and Notifications built red, asserting no bootstrap failure and one reported difference naming Notifications; and tests/test_target_agreement.py::TestGateOutcomes::test_a_declared_gate_outcome_that_differs_fails_the_bootstrap, declaring S1 green's outcome wrongly and asserting the bootstrap fails naming the scenario - both written first and seen to fail."
  non_functional_requirements:
  - "NO MASKED DEFECT: only checks that could not read a partner, or were re-run because a partner was held back, are left out of the target comparison - and the gate's own outcome is pinned separately by criterion 4's scenarios (Keith, Q7: 'with a few scenario that explicitly exercise B')."
  - "MAINTAINABILITY: targets stay about the file's own data, so scenario authors do not encode the gating rule in every target; only the few gate-outcome scenarios carry it. The left-out set comes from recorded reasons and causes, never from prose."
  - "DETERMINISM: the same history gives the same report and the same gate-outcome comparison."
  - "BOOTSTRAP COST: five more scripted scenarios add their arrivals to a bootstrap already measured in CLAUDE.md; measured on the first bootstrap after build."
  dependencies:
  - REQ-GEN-186
  - REQ-GEN-045
  - REQ-PIPE-266
  - REQ-PIPE-267
  - REQ-PIPE-269
  - REQ-PIPE-270
  decisions:
  - "A TARGET DESCRIBES THE FILE (Keith, 2026-10-22, Q7 = A): compared against the file's own checks, leaving out could-not-run results and re-checks a package-mate caused. REJECTED Q7 B as the general rule (targets declare the strict red too, so every scenario author encodes the gating rule) and Q7 C (compare as today and fix each scenario that fails, including the early file of each of 312 staggered pairs)."
  - "A FEW SCENARIOS PIN THE GATE (Keith, 2026-10-22: 'with a few scenario that explicitly exercise B'): a few scripted scenarios declare the expected GATE outcome and are checked against it, so the package gate is pinned by the test history. Which ones was left to the scoper; Keith's suggestion was taken whole: S1 green, S1 red, S2, the S10 chain, and Q13's Placements case. S2 is taken as S2 strict, since a first-time zip of two greens promotes both under today's rule too and would pin nothing new."
  - "WHY (delivery-scoper): the 312 staggered pairs each have an early file that is red under REQ-PIPE-270 until its partner arrives; Child Protection's targeted scenarios plant red tables beside green ones (TS-48, TS-75). Compared as today, the bootstrap would fail on supplies whose own data matched their target exactly."
  - "THE PINS MAY NEED A GENERATOR FIX, NOT A RE-PIN (architect, v3 draft review): criterion 6."
  open_questions: []
- id: REQ-DOCS-274
  title: "Supplier guidance says to send a delivery's files as one package, a zip"
  date_written: "2026-10-21"
  story: "As a supplying team, I want to be told that files sent separately are each judged as they arrive and may read red until the rest arrive, so that I send them as one zip and nobody is told about a red that clears by itself."
  moscow: should
  status: not_started
  source: "Keith, 2026-10-20: 'we need to say, if you want to avoid a flicker, make sure you send us a package of files'. Keith, 2026-10-22, Q9 = A: packages are zip-only for now, and this guidance says to upload a zip. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22."
  acceptance_criteria:
  - "THE SYSTEM SHALL carry, in the documentation a supplying team is given, guidance that the files of one delivery should be sent as one zip, whichever way they are sent - a delivery directory or the cloud upload path - and that files sent separately, including separate uploads to the cloud path, are each checked as they arrive, so that an early file whose cross-table checks need a later one reads red until it arrives."
  - "THE SYSTEM SHALL state in that guidance that the red clears by itself once the later file arrives and is promoted, and that a zip avoids it."
  - "THE SYSTEM SHALL NOT describe a package as anything other than files sharing one receipt instant, which today means one zip, until another boundary marker is scoped (plans/running-thoughts.md #114, plans/supply-thoughts.md)."
  non_functional_requirements:
  - "NO FLICKERING REDS (#113): the remedy Keith chose for staggered files is this guidance, so it should exist before notification on red is switched on."
  - "MAINTAINABILITY: one place, linked from docs/delivery-format.md and docs/aws-event-driven-mvp-design.md, so a later boundary marker changes one text."
  dependencies:
  - REQ-PIPE-266
  - REQ-PIPE-270
  decisions:
  - "GUIDANCE, NOT DESIGN (Keith, 2026-10-20): 'I don't think we can really design around that.'"
  - "UPLOAD A ZIP, ON THE CLOUD PATH TOO (Keith, 2026-10-22, Q9 = A): the cloud ingest path forms no packages (REQ-PIPE-266 criterion 6), so a supplier there avoids the flicker only by uploading one zip."
  open_questions:
  - "1. WHERE IT LIVES (carried from v3, not yet answered): no supplier-facing document exists in this repository; docs/delivery-format.md is the synthetic on-disk format. RECOMMENDED: a short new docs/supplier-guidance.md, linked from both design docs, because the transport-layer work (plans/supply-thoughts.md) is unscoped and this should exist before #113. ALTERNATIVES: a section in docs/delivery-format.md, or wait for the transport-layer work."
- id: REQ-DASH-275
  title: "A supply held back with its delivery says so at the top of its page, names the root of the chain, and the card says it once per delivery"
  date_written: "2026-10-22"
  story: "As a data team leader opening a dataset whose clean-looking supply was held back because another file in its delivery was, I want the top of the page to say which file held it back, what it was re-checked against and what clears it - naming the root where the chain is longer - and the collection card to say it once per delivery, so that I go to the one decision that clears the delivery instead of hunting through this dataset's checks."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-22: S1-red top line = A ('Held back with the Notifications received with it ...', no 'not a fault' clause); S6 root naming = A (links always, the root named when the chain is longer than one step, the root's page lists everything it holds back); Q11 = A (the card follows each dataset's newest supply, plus one line per held-back delivery); Q10 = A (a rejected package-mate rewords the line from the decision log). Dashboard UX review of v3 (D3, D5, the missing card criterion, links). Drafted by delivery-scoper 2026-10-22, split from REQ-DASH-204 so each stays small: REQ-DASH-204 is the check that could not run because another table is absent; this is the supply held back with its delivery."
  acceptance_criteria:
  - "WHERE the supply a dataset page is about was held back (REQ-PIPE-266 criterion 9) because a supply received with it was held back and a re-check against the warehouse (REQ-PIPE-267 criterion 5) fails, THE SYSTEM SHALL show at the top of the page one notice in the existing .notice-exhausted role=status structure, worded '<b>Held back with the <dataset> received with it.</b> That file (received <instant>) was held back, so this supply was re-checked against the <dataset> in place in the warehouse, and <n> cross-table check(s) fail against it. It is checked again by itself once a <dataset> supply is promoted.', and SHALL NOT add a 'not a fault' clause."
  - "WHERE the hold-back reaches this supply through more than one step - the root file held back, a package-mate held back because of it, and this supply because of that one - THE SYSTEM SHALL open the notice with the root and the chain, worded '<b>Held back with its delivery:</b> the <root dataset> file was held back, and the <dataset> with it.', naming each step in order."
  - "THE SYSTEM SHALL end the notice the ROOT supply's own page shows (its awaiting-a-decision line) with 'Holding back with it: <links>', naming every supply its hold-back is holding back, directly or through the chain, as at the date on show."
  - "THE SYSTEM SHALL show on the collection, agency and exec cards ONE line per held-back delivery, worded '[Red] Held back together: <names> (one delivery, received <instant>)', naming up to three datasets and, past three, the first two and 'and <n> more', and SHALL NOT also show REQ-DASH-204 criterion 18's line for a cause that is part of that delivery."
  - "THE SYSTEM SHALL leave the cards' rollups following each dataset's newest supply - the staging view while it awaits a decision - so that red on a card keeps meaning 'a person is needed'."
  - "WHEN the root's package-mate is rejected, THE SYSTEM SHALL word the notice from the decision log as it then stands - 'The <dataset> file received with it was turned down; this supply now needs its own decision.' - and SHALL NOT show anywhere a 'waiting for' or 'checked again once' that can no longer happen."
  - "THE SYSTEM SHALL render every dataset name in these lines as a real link (<a href>) to that dataset's page at the same date on show, built with navHref / affectsLinks, and every name as text, never markup."
  - "THE SYSTEM SHALL judge every line as at the date on show and compute it at build time from the recorded 'promotion-withheld' entries' structured fields (REQ-PIPE-267 criterion 12) and the decision log, never from prose and never from supply rows."
  - "THE SYSTEM SHALL have real-browser tests, tests/test_dashboard_e2e.py::TestHeldBackWithItsDelivery, against a dashboard built from a fixture history, written first and seen to fail: S1 red - Clients' page shows the notice naming Notifications with links that keep the date on show; S6 chain - the Notifications page names the Investigations root and the Investigations page lists Notifications and Clients under 'Holding back with it'; the Child Protection card shows one 'Held back together' line for the delivery; and after a person rejects the root the notice reads 'turned down' and no 'checked again once' remains."
  non_functional_requirements:
  - "SCALE (~30 collections; one delivery may carry many tables): one card line per delivery, not per dataset, names truncated past three; the chain is named once on each page."
  - "NO FALSE QUIET: the notice never says or implies this supply has nothing wrong - S1 red is a real failing verdict against the warehouse, which is why it has no 'not a fault' clause (Keith)."
  - "NAVIGATION: every name is a real link that keeps the date on show, so a chain is never a dead end (dashboard UX review of v3)."
  - "ACCESSIBILITY AND CONSISTENCY: the page's existing notice structure and role=status; no new asset."
  - "THE BUILD RULE: recorded results and the decision log only."
  dependencies:
  - REQ-PIPE-266
  - REQ-PIPE-267
  - REQ-DASH-204
  - REQ-DASH-272
  - REQ-DASH-277
  decisions:
  - "A TOP-OF-PAGE NOTICE FOR S1 RED (Keith, 2026-10-22, A), with no 'not a fault' clause. This settles the contradiction the dashboard review found in summary-v3 (D5: REQ-DASH-204 'does not apply to S1's red branch' against a proposed 'Held with the Notifications file it came with'). REJECTED the row sentence alone."
  - "NAME THE ROOT (Keith, 2026-10-22, S6 root naming = A): links always; where the chain is longer than one step the held-back line names the root as well; the root's page lists every supply its hold is holding back, directly or through the chain. REJECTED naming only the immediate package-mate (B)."
  - "ONE CARD LINE PER HELD-BACK DELIVERY (Keith, 2026-10-22, Q11 = A): 'Red keeps meaning a person is needed.' REJECTED Q11 B, rolling the card up on the warehouse view with '2 awaiting a decision' beside it - calmer, but a waiting red would no longer redden the card. The dashboard review found v3 claimed a criterion for this that did not exist; criterion 4 is it."
  - "A REJECTED PACKAGE-MATE IS NOT RE-RUN, ONLY REWORDED (Keith, 2026-10-22, Q10 = A): the verdict cannot change, so nothing re-runs; every surface words the reason from the decision log as it stands. REJECTED Q10 B (re-run the others' checks on a rejection), which bends 'other tables are re-checked only on promotion'."
  - "'HELD BACK', NEVER 'HELD' (dashboard UX review of v3, D3): 'held' alone is REQ-PIPE-078's held with no period."
  - "SPLIT FROM REQ-DASH-204 (delivery-scoper, 2026-10-22, Keith's 'small and self-contained'): REQ-DASH-204 covers a check that could not run for want of another table (S2 is its package form); this covers a supply re-checked against the warehouse and failing (S1 red, S6)."
  open_questions: []
- id: REQ-PIPE-276
  title: "The terminal says what a package gate did: what was held back and by what, what to decide first, and what an override will set off"
  date_written: "2026-10-22"
  story: "As the person working through Child Protection supplies in the terminal, I want every place the terminal reports a gate to say which supply was held back by which, what was re-checked against the warehouse, which decision clears it, and what my own decision will set off, so that I decide the one thing that matters and am never surprised by what the rule does next."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-22: Q8 = A (queue placement, REQ-PIPE-210), the mid-gate refusal wording (REQ-PIPE-266 criterion 15), Q10 = A. The CLI UX review of v3 (review-cli-ux-v3-draft.md): the exit-code rewording and test, the next-step condition and named surfaces, the vocabulary, the locus clause, terminal grouping by root, the override consequence text including T13/S5, and new scenarios N1 to N5. Carries v3's REQ-PIPE-267 criteria 11, 12 and 15. Drafted by delivery-scoper 2026-10-22."
  acceptance_criteria:
  - "THE SYSTEM SHALL use 'held back' for a gate outcome on every terminal surface, SHALL NOT use 'held' (REQ-PIPE-078), 'refused' or 'rejected' (REQ-PIPE-163 criterion 20) for it, and SHALL NOT list a held-back supply under 'Held - no period yet'."
  - "WHERE mothman cp qa, mothman bdm qa or mothman pipeline process touched a supply that ends held back on a red - a red from a re-check against the warehouse (REQ-PIPE-267 criterion 5) included - THE SYSTEM SHALL count that red toward has_failures and PassReport.red, keeping exit_status's precedence (the agreement backstop's 3 over red's 1), and SHALL show the re-check's results in its report as a table headed 're-checked against the warehouse'."
  - "WHERE the terminal shows a supply held back because of another supply - in outcome_panel and in _recheck_panel - THE SYSTEM SHALL, while that other supply is waiting, name its decision as the next step first ('Decide cp-notifications <period> (received <instant>) - promoting it re-checks this one'), and say that nothing needs deciding on this supply and that an override is made by naming it (mothman supply decide --operation promote --dataset <id> --period <period> --reason ...); and once the other supply is rejected or superseded, SHALL offer this supply's own decisions instead, worded from the decision log as it stands (REQ-DASH-275 criterion 6's wording)."
  - "THE SYSTEM SHALL show a held-back supply's reason as its 'promotion-withheld' entry words it (REQ-PIPE-267 criterion 12), including 'This supply's own checks passed.' where they did."
  - "WHERE one hold-back holds back several supplies - a package, or a chain through a cascade - THE SYSTEM SHALL show it under _grouped as one line for the root's own red, then one line per supply it holds back with that supply's final state, each naming the root and what it traces through, and SHALL NOT print a cascade's intermediate states."
  - "WHEN a person is about to promote a supply and a counted cross-table verdict it holds read a supply that is not in the warehouse, THE SYSTEM SHALL say so before the person confirms, naming that supply and saying the check is re-run against the warehouse once it is promoted (REQ-PIPE-121), and SHALL keep the promotion available on the same terms as today."
  - "WHEN a person is about to promote a supply whose knock-on would re-run a check already recorded red for the same pair of supplies (T13, S5: promoting S1-red's held-back Clients v2 re-checks Notifications v1 against it), THE SYSTEM SHALL list among the decision's consequences (apply_decision's consequences key) that '<dataset> (received <instant>) will be re-checked against it, and its last check against it failed', so that confirming needs that key with --yes."
  - "WHEN a person is about to promote a supply that other waiting supplies are held back by, THE SYSTEM SHALL list among the consequences that it re-checks them ('re-checks cp-clients' waiting supply received <instant>; if it is green, the rule promotes it')."
  - "WHEN a person's decision has been applied and its knock-on has run, THE SYSTEM SHALL list (in _follow_up) every supply the knock-on re-gated - promoted, or still held back - with its outcome, and SHALL NOT list only the ones left incomplete."
  - "WHEN a person asks to decide on a supply whose package is still being checked or gated, THE SYSTEM SHALL show REQ-PIPE-266 criterion 15's refusal before asking for a reason, on the menu path and the flag form alike."
  - "WHERE an arrival of a package is checked and waits because a package-mate's run stopped, THE SYSTEM SHALL say 'checked, waiting for its package - <dataset>'s run stopped at the <stage> stage; the next pass re-runs it and gates both' (or 'gates them all')."
  - "WHEN a person re-files one supply of a package into another period without the other supplies of that package, THE SYSTEM SHALL warn before confirming, naming the supplies left behind, and SHALL keep the re-file available."
  - "THE SYSTEM SHALL show every line this requirement adds with NO_COLOR set and when piped, without losing meaning, and SHALL shorten dataset names in table cells with filing_tui's existing shortening rather than wrap them."
  - "THE SYSTEM SHALL have tests, written first and seen to fail: tests/test_cli_package_gate.py::test_s1_red_qa_commit_exits_1_and_shows_the_recheck (mothman cp qa --commit on S1 red exits 1 and prints a 're-checked against the warehouse' table); test_next_step_names_the_package_mate_then_the_supply_after_rejection; test_grouped_by_root_prints_final_states_only (S5 cascade); test_override_lists_the_worse_recheck_consequence (T13); test_follow_up_lists_every_regated_supply; test_mid_gate_decision_is_refused_before_the_reason_prompt; test_crashed_sibling_wording; test_partial_refile_warns; and each surface under NO_COLOR and a pipe."
  non_functional_requirements:
  - "ONE VOCABULARY (CLI review of v2 and v3): 'held back', dataset ids, state first - as the terminal's other lines."
  - "SCALE (~30 collections): one line per root and one per outcome; a cascade prints its settled state only; names shortened in cells."
  - "NO SURPRISE OVERRIDES: every consequence beyond the decision's own slot is named before confirming and needs its key with --yes (REQ-GHUB-082's existing mechanism)."
  - "SCRIPTABILITY: the exit code still says whether anything is red, with the backstop's code still winning; output stays meaningful piped and under NO_COLOR."
  - "SECURITY: nothing widened; a person's decision keeps its allowlist, actor and mandatory reason."
  dependencies:
  - REQ-PIPE-266
  - REQ-PIPE-267
  - REQ-PIPE-210
  - REQ-GHUB-082
  - REQ-PIPE-163
  - REQ-PIPE-151
  decisions:
  - "SEPARATED FROM THE GATE (delivery-scoper, 2026-10-22): v3 carried the terminal's wording inside REQ-PIPE-267; it is its own small requirement now, with the CLI review's corrections, so the gate and its wording can be reviewed apart."
  - "EXIT CODES KEEP THEIR PRECEDENCE (CLI review of v3): a re-check's red counts toward has_failures and PassReport.red; exit_status's existing order (backstop 3 over red 1) is not changed."
  - "THE NEXT STEP DEPENDS ON WHETHER THE CAUSE IS STILL WAITING (CLI review of v3): v3's criterion 12 named the package-mate's decision first unconditionally, which is wrong once it has been rejected (Keith, Q10 = A)."
  - "OVERRIDE BY NAMING IT (Keith, 2026-10-22, Q8 = A, 'the scoper's draft, not the CLI reviewer's A''): a supply held back only by another is not a pickable decision from the queue line, but a hand override stays available by naming it. REJECTED A' (pickable from the queue with 'Deciding cp-notifications settles this one'); Keith was told he can switch."
  - "AN OVERRIDE THAT WILL MAKE THINGS WORSE SAYS SO (CLI review of v3, T13/S5): in S1 red the held-back Clients v2's re-check read Notifications v1, which IS in the warehouse, so v3's warning was silent; criterion 7 covers it."
  open_questions: []
- id: REQ-DASH-277
  title: "'In place' reads 'in place in the warehouse' wherever it is shown to a person"
  date_written: "2026-10-22"
  story: "As anyone reading the dashboard or the terminal, I want 'in place' to say where - 'in place in the warehouse' - so that I never have to guess whether a supply is merely received, staged, or actually in the warehouse that other people query."
  moscow: should
  status: not_started
  source: "Keith, 2026-10-22, during #95 v3's sign-off: 'in place' becomes 'in place in the warehouse' wherever the phrase is shown to a person, in #95's wording and everywhere it is already exposed (about 33 uses in the dashboard template and 12 in the CLI, plans/running-thoughts.md #116). A change to built, signed wording, so its own small requirement, outside #95's batch but landing with it. Drafted by delivery-scoper 2026-10-22."
  acceptance_criteria:
  - "THE SYSTEM SHALL show the phrase 'in place in the warehouse' wherever the dashboard shows a person 'in place' meaning a supply in a period's warehouse schema - the verdict line ('... which is not in place in the warehouse yet. The supply in place in the warehouse is ...', 'Nothing is in place in the warehouse for this period yet.', 'The results below are the supply in place in the warehouse, received ...'), the date control's panel heading and body ('What was in place in the warehouse on a date', 'Shows, for every dataset, the supply that was in place in the warehouse on the date ...'), and the past-date notices ('Showing what was in place in the warehouse on <date>', 'You are viewing what was in place in the warehouse on ...')."
  - "THE SYSTEM SHALL show the same phrase in the terminal wherever it means the same thing - the door's and the queue's state words ('in place in the warehouse (promoted)', 'in place in the warehouse, awaiting acknowledgement', 'in place in the warehouse - <reason>') and 'the supply in place in the warehouse is not one of these.'"
  - "THE SYSTEM SHALL label the date control '<picker label>' and use the same words, in lower case, wherever a shown label repeats it - the scenario label ('<scenario id> · <picker label> <date>'), the jump label, the scenario-not-found message, the generated scenario register and mothman scenarios' 'where' line - with <picker label> 'In the warehouse on'. (PROVISIONAL - open question 1.)"
  - "THE SYSTEM SHALL NOT change the idiom 'in place of', code comments, docstrings, function and variable names, element ids or the date control's query-string parameter (in-place-on), so that every saved link and snapshot keeps working. (PROVISIONAL on open question 1 for the ids and the parameter.)"
  - "THE SYSTEM SHALL use 'in place in the warehouse' in every wording drafted for #95 (REQ-DASH-204, REQ-DASH-272, REQ-DASH-275, REQ-PIPE-267, REQ-PIPE-271, REQ-PIPE-276)."
  - "THE SYSTEM SHALL amend, in the same change, the quoted wording of REQ-PIPE-081 criterion 20 (and criterion 23 if open question 1 says so), REQ-DASH-182 criterion 3, REQ-DASH-208 criterion 4, REQ-GEN-199 criterion 18 and REQ-GHUB-229 criterion 5, with the wording in summary-v4.md once Keith has approved it, changing nothing else any of them requires; and SHALL leave requirement prose that uses 'in place' as the register's own term, rather than quoting what a person sees, unchanged."
  - "THE SYSTEM SHALL update, in the same change, every existing test that asserts the old shown wording - each seen to fail against the new wording first - and SHALL add a real-browser test, tests/test_dashboard_e2e.py::TestInPlaceInTheWarehouse::test_no_visible_text_says_in_place_alone, which walks every visible text node of a dashboard built from a fixture history with a past date selected and an awaiting supply on show, asserts that some do say 'in place in the warehouse' (so it cannot pass on an empty page), and asserts that none says 'in place' without 'in the warehouse' after it, other than 'in place of'."
  - "THE SYSTEM SHALL carry a CHANGELOG.yaml entry for the change in the same push."
  non_functional_requirements:
  - "CLARITY FOR A WIDER AUDIENCE (Keith): the warehouse is the thing other people query; 'in place' alone left the reader to infer it."
  - "LENGTH: the phrase adds about 17 characters to every long sentence (dashboard UX density review); the verdict line's in-the-warehouse half already moves to its own line at phone width (REQ-DASH-272 criterion 3), and the date control's label is the one place the long form does not fit, hence open question 1."
  - "COMPATIBILITY: identifiers and the query-string parameter are unchanged, so links, bookmarks and the scenario jump keep working; committed snapshots (dashboard/snapshots/*.html.gz) keep the wording of the day they were taken, deliberately."
  - "MAINTAINABILITY: shown wording only; no rename of code, so the change is small and reviewable."
  dependencies:
  - REQ-PIPE-081
  - REQ-DASH-182
  - REQ-DASH-208
  - REQ-GEN-199
  - REQ-GHUB-229
  decisions:
  - "SAY WHERE (Keith, 2026-10-22): 'in place' becomes 'in place in the warehouse' wherever the phrase is shown to a person, here and everywhere else it is already exposed. Its own requirement because it changes built, signed wording outside #95."
  - "THE COUNTS, CHECKED (delivery-scoper, 2026-10-22): 'about 33 uses in the dashboard template and 12 in the CLI' are raw counts that include code comments and the idiom 'in place of'. The SHOWN uses found on 2026-10-22 are about fourteen lines of the template (the verdict line, the date control and its panel, the past-date notices, the scenario labels) and five in the CLI (filing_tui's state words and its 'supply in place' line, and mothman scenarios' 'where' line). The build-time Python adds none of its own. The rest are comments or 'in place of'."
  - "SHOWN WORDING, NOT THE REGISTER'S VOCABULARY (delivery-scoper, PROPOSED): requirement prose using 'in place' as a term of art (REQ-DASH-180, 197, 225 and many others) is not changed; only criteria that QUOTE what a person sees are amended. REQ-PIPE-081 criterion 26's sweep of register prose for the 'In place on' rename is the precedent against which this is a deliberate narrowing: the register's term is fine for its readers; the page's reader is the one who needs 'in the warehouse'."
  - "THE PICKER LABEL IS REQ-PIPE-081 CRITERION 20, NOT CRITERION 6 (delivery-scoper, checked 2026-10-22): summary.md named criterion 6; criterion 6 is about saying a decision changed an earlier date's view."
  open_questions:
  - "1. THE DATE CONTROL'S LABEL (Keith, at the walk-through). Scenario: a reader opens the page and sees the button '📅 In place on: 22 October 2026'. 'In place in the warehouse on' is long for a button and the page's narrowest control. RECOMMENDED: 'In the warehouse on' - short, and carries the same meaning - keeping the element ids and the in-place-on query parameter as they are, which needs REQ-PIPE-081 criterion 23 ('name the date control's own element ids and its query-string parameter after the label the control carries') amended to say the ids stay 'in-place-on'. ALTERNATIVES: 'In place in the warehouse on' in full; or keep 'In place on' for the control only. Renaming the ids and parameter to match (criterion 23 as written) would need criterion 24's old-link handling again for a second spelling, which is why it is not recommended."
- id: REQ-PIPE-278
  title: "One ticket and one still-failing record per root cause, naming everything it holds back"
  date_written: "2026-10-22"
  story: "As the person told about supplies that need a decision, I want one ticket and one 'still failing' record for the supply that actually caused a hold-back, naming every supply it holds back, so that one bad file does not raise a ticket for every table that reads it."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-22, agreed batch ('All four as recommended'): Q6 = A, one ticket and one 'still failing' record per root cause, naming everything it holds back. Keith, 2026-10-22, Q5 = A and N1: an owed re-check, and a red because a partner is not due yet, should not page anyone. Drafted by delivery-scoper 2026-10-22."
  acceptance_criteria:
  - "THE SYSTEM SHALL identify, for every waiting supply whose only failing checks are another table's doing - held back with a package-mate (REQ-PIPE-266), or cross-table checks that could not run for want of another table (REQ-PIPE-270) - its ROOT CAUSE: the supply, or the absent table's slot, that the chain of structured causes ends at, through ONE function shared with REQ-DASH-204, REQ-DASH-275 and REQ-PIPE-210."
  - "WHERE the ticket policy is 'needs-action' (REQ-PIPE-083 criterion 21), THE SYSTEM SHALL raise no ticket of its own for such a supply's slot, and SHALL name it, with its period, in the root cause's ticket under 'Also held back by this', reconciled as the root's ticket is."
  - "WHERE the root cause is a table not yet due, THE SYSTEM SHALL raise no ticket for the hold-back at all until that table is overdue, at which point the overdue slot's own ticket names the supplies it holds back."
  - "WHEN a re-evaluation leaves waiting supplies failing (REQ-PIPE-121 criterion 12), THE SYSTEM SHALL write ONE still-failing record per root cause, naming every supply it holds back, SHALL NOT write a separate record for a supply whose failing checks are all another table's doing, and SHALL NOT write one for a waiting supply whose failure the re-evaluation did not change."
  - "THE SYSTEM SHALL NOT raise a ticket or write a still-failing record for a supply whose only red is an owed re-check (REQ-PIPE-269 criterion 5)."
  - "WHERE such a supply ALSO has a failing check of its own, THE SYSTEM SHALL ticket and record it as today, naming the root cause beside its own failure."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-121 criterion 12 and REQ-PIPE-083 criterion 21 with the wording in summary-v4.md once Keith has approved it."
  - "THE SYSTEM SHALL have tests, written first and seen to fail: tests/test_root_cause_shouts.py::test_s2_strict_raises_one_ticket_naming_both (Notifications v2's ticket names Clients v2; Clients v2's slot has none); test_s14_placements_root_names_nothing_it_does_not_hold (Q13: only Placements is ticketed, naming nothing else); test_s1_green_writes_no_still_failing_record_about_unchanged_blank_values; test_not_yet_due_root_raises_no_ticket_until_overdue; and test_owed_recheck_raises_nothing."
  non_functional_requirements:
  - "NO TICKET STORM (~30 collections): one bad, widely read file raises one ticket, not one per reader."
  - "NO FLICKERING REDS (plans/running-thoughts.md #113): nothing is raised for a red that clears by itself - an owed re-check, a partner not yet due."
  - "NO FALSE QUIET: a supply with a failure of its own is still ticketed (criterion 6); only a red that is wholly another's is folded into the root's ticket."
  - "ONE ANSWER: the page, the queue and the tickets name the same root through one function, so they cannot disagree."
  - "SECURITY AND PRIVACY: tickets name datasets and periods, never rows or filenames (REQ-DASH-204 NFR 4's rule)."
  dependencies:
  - REQ-PIPE-083
  - REQ-PIPE-121
  - REQ-PIPE-266
  - REQ-PIPE-267
  - REQ-PIPE-269
  - REQ-PIPE-270
  - REQ-DASH-204
  - REQ-PIPE-210
  decisions:
  - "ONE PER ROOT CAUSE (Keith, 2026-10-22, Q6 = A, agreed batch): follows his v2 Q6 and Q7 answers ('the missing table's own ticket carries it') and is what red-driven notifications need at ~30 collections. The architect called it 'now necessary rather than tidier' once one bad file could hold back a delivery. REJECTED Q6 B (each red supply its own ticket and record, like any red): one bad Client Register file could raise a ticket for every table that reads it."
  - "NO RECORD FOR A FAILURE THE RE-EVALUATION DID NOT CHANGE (delivery-scoper, carried from v3's Q6 option A, which Keith accepted): in S1's green branch, Clients v2's promotion would otherwise write 'left 1 waiting supply failing: Notifications' about blank values nobody's promotion affected."
  - "NOTHING FOR A RED THAT CLEARS BY ITSELF (Keith, 2026-10-22, Q5 = A: 'No notification is sent for that red unless the re-check itself fails'; N1: a red lasting days because a partner isn't due yet 'should not page anyone'). Tickets and still-failing records are the notifications that exist today; #113 decides the rest."
  - "ITS OWN REQUIREMENT (delivery-scoper): the rule spans the decision log's record (REQ-PIPE-121) and the ticket policy (REQ-PIPE-083), and neither the gate nor any display requirement is the right home."
