- id: REQ-PIPE-271
  title: "A period is opened, and its non-participating datasets inherited, when the first supply is filed to it, and a person is warned when a newer supply could be carried forward"
  date_written: "2026-10-21"
  story: "As the person answerable for a quarterly collection, I want a quarter's inheritances made as soon as the first supply is filed to it, and to be told when a newer supply could be carried forward instead, so that a quarter in which a dataset owes nothing never waits for a first promotion every reader is waiting on, and nothing carried forward goes quietly stale."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-20 ('inherit when the quarter is filed, not when it is first promoted. That would align with the idea we have of having a command to open a quarter that's separate to any checks'). Keith, 2026-10-22, Q4 = B plus a warning: 'B, but include the warning on the dashboard et cetera when it goes stale'; confirmed the same day ('Happy with the wording you used and your interpretation'), the warning covering both the stale and the refused case. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22."
  acceptance_criteria:
  - "WHEN the first supply is filed to a period whose schema does not yet exist, THE SYSTEM SHALL open that period through the one mechanism REQ-PIPE-098 criterion 4 names, making its inheritances (REQ-PIPE-098 criterion 1) in the same step, before any check runs over that supply."
  - "THE SYSTEM SHALL open the period before the run's overlay is built (REQ-PIPE-105 criterion 5), so that every check in the first package filed to the period reads the inherited tables."
  - "THE SYSTEM SHALL NOT open a period for a supply held with no period (REQ-PIPE-078) or for a trial."
  - "THE SYSTEM SHALL open a period shared by several collections on one calendar (REQ-PIPE-262) at the first filing of any of them, recording which collection's filing opened it."
  - "THE SYSTEM SHALL make a period's inheritance once, when the period opens (REQ-PIPE-098 criterion 2), and SHALL NOT later make, retry or re-point it automatically - neither where it was REFUSED for want of an earlier promoted supply (REQ-PIPE-098 criteria 9 and 10) nor where it was MADE on a supply that is no longer the newest promoted."
  - "WHEN a supply of a dataset is promoted into a period earlier than an open period that inherits that dataset - or whose inheritance of it was refused - and the newly promoted supply is newer than what that period carries forward, THE SYSTEM SHALL record a warning in the decision log, at the prominence of a refused inheritance (REQ-PIPE-098 criterion 10), naming the later period, the dataset, the supply it carries forward (or that it carries nothing) and the newer supply."
  - "WHILE such a warning stands, THE SYSTEM SHALL show it on the dashboard - on that dataset's page for the later period, and as one line on its collection card - and in the terminal, in the Filing decisions queue and in that period's door (REQ-GHUB-229), worded 'A newer <dataset> could be carried forward into <period>. <period> carries forward the supply received <instant>; the one received <instant> has been promoted into <earlier period> since. A person can carry that one forward instead.' or, for a refused inheritance, '<period> carries nothing forward for <dataset>: there was no earlier promoted supply when it opened. The one received <instant> has been promoted into <earlier period> since, and a person can carry it forward.', each naming the operation that does it (REQ-PIPE-099: un-inherit, then inherit). (NEW WORDING for Keith's approval.)"
  - "THE SYSTEM SHALL clear the warning once the later period carries forward the newer supply, holds a supply of its own for that dataset, or the newer supply leaves its period, and SHALL NOT clear it any other way."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-098 criterion 4 with the wording in summary-v4.md once Keith has approved it; and WHERE the bootstrap moves REQ-PIPE-262 criterion 12's pinned inheritances, TS-63's expectations or REQ-GEN-251 criterion 3's, THE SYSTEM SHALL bring each to Keith with the cause - a generator fix that keeps the pin, or a new value - and SHALL NOT re-pin any silently."
  - "S6: THE SYSTEM SHALL have tests/test_period_opening.py::TestOweNothingQuarter::test_readers_of_case_workers_promote_in_a_quarter_it_sits_out - a 2024-Q4 in which cp-case-workers does not participate and a package of the other five tables, all green - asserting that 2024-Q4 is opened at the package's filing, cp-case-workers is inherited before any run, the readers' cross-table checks read the inherited table and pass, and all five promote - written first and seen to fail."
  - "STALE AND REFUSED: THE SYSTEM SHALL have tests/test_period_opening.py::TestCarryForwardWarning - test_a_stale_inheritance_is_warned_not_repointed (2024-Q4 opened on 2024-Q2's Case Workers while 2024-Q3's waits; a person promotes 2024-Q3's; 2024-Q4 still carries 2024-Q2's and the warning names both) and test_a_refused_inheritance_is_warned_not_retried (S9: nothing earlier when 2024-Q4 opened; an earlier supply promoted later; the readers stay red and the warning names it) - each also asserting the warning in the terminal's queue output and on the built dashboard page, and that it clears once a person carries the newer one forward - written first and seen to fail."
  non_functional_requirements:
  - "NO DEADLOCK: the owe-nothing quarter's first promotion no longer depends on a table that only its first promotion would bring."
  - "NO SILENT STALENESS: opening earlier makes a stale inheritance more likely; the warning on the dashboard, in the queue and in the door makes it visible instead of designing it away (Keith, Q4 = B)."
  - "DETERMINISM AND REPLAY: who opens a period depends only on receipt order across the stream (REQ-PIPE-262), never on process timing; nothing is re-pointed later, so a replay reaches the same inheritances."
  - "OBSERVABILITY: the opening is a recorded event naming the filing and collection that caused it (REQ-PIPE-098 criterion 3); the warning is a decision-log entry, so it is auditable after it clears."
  - "COMPATIBILITY: a consumer querying a period schema directly in SQL may now see a period holding only inherited views while everything else is staged; REQ-PIPE-081 criterion 11 already promises such a consumer nothing about as-at answers, and the _manifest view (REQ-PIPE-130) lists what it holds."
  - "SCALE (~30 collections): one warning per period and dataset, one card line per warning; nothing is listed per reader."
  - "MAINTAINABILITY: one opening mechanism (REQ-PIPE-098 decision 6) - filing calls it, as promotion, substitution and the future explicit command do."
  dependencies:
  - REQ-PIPE-098
  - REQ-PIPE-099
  - REQ-PIPE-262
  - REQ-PIPE-105
  - REQ-PIPE-270
  - REQ-GHUB-229
  decisions:
  - "INHERIT WHEN THE QUARTER IS FILED (Keith, 2026-10-20): 'That would align with the idea we have of having a command to open a quarter that's separate to any checks.' The deadlock it removes: in an owe-nothing quarter every reader of Case Workers needs an inherited table that arrives only at a first promotion, which none of them can make under the strict rule."
  - "CARRY FORWARD ONCE, WARN WHEN IT GOES STALE (Keith, 2026-10-22, Q4 = B: 'B, but include the warning on the dashboard et cetera when it goes stale'; confirmed: 'Happy with the wording you used and your interpretation'): no automatic retry of a refused inheritance and no automatic re-pointing of a made one; a person re-points by hand (REQ-PIPE-099's un_inherit / inherit_one). The warning covers both the stale and the refused case, so the architect's S9 (readers red with nothing carried forward) is cleared by a person acting on the warning, not by a retry. REJECTED Q4 A (retry the refused one, recommended in v3) and Q4 C (retry and re-point both automatically). Keeps Keith's 2026-09-26 'any other inheritance would be per-dataset and by operator command' (REQ-PIPE-098 decision 8) whole."
  - "REQ-PIPE-098 CRITERION 4's EXPLICIT COMMAND STAYS UNMET AND UNOWNED (Keith, 2026-10-19, 'Leave until needed'): filing is a third trigger of the same mechanism, not the command."
  - "SHARED PERIODS (REQ-PIPE-262): Emergency Department and Child Protection share the quarterly calendar, so an Emergency Department filing can open a Child Protection quarter and make its inheritances; criterion 4 records which. Confirmed mechanically fine by the architect (v3 draft review): open_period runs outside other transactions, and inherit_into walks every dataset."
  - "NOTHING ASSUMES A PERIOD HOLDS A PROMOTION (architect, v3 draft review, answering v3's open question 2): the census is fine, and nothing reads qa.period as 'something was promoted'. A period holding only inherited views is new but harmless."
  - "S17, RECORDED AND ACCEPTED, NOT CHANGED (architect, v3 draft review): a period that inherits its predecessor at filing blocks a green resupply of the predecessor more often (promotion.py:983-995, a stood-on supply cannot be replaced while a later period stands on it). That is today's behaviour, widening; the person sees it as today's refusal and un-inherits first."
  - "THE PINS ARE AT RISK, AND A RE-PIN IS NOT THE DEFAULT FIX (architect, v3 draft review): REQ-PIPE-262 criterion 12's pins (requirements.yaml:39249-39252), TS-63 and REQ-GEN-251 criterion 3 can move under opening-at-filing and under strict red; they may need a generator fix rather than a new value. Criterion 9."
  open_questions:
  - "1. FOR KEITH AT THE WALK-THROUGH (tension T18, carried from v3, not yet answered): a period BEFORE a partner dataset's participation starts has nothing to inherit and never will, so under the strict rule a check declared on a participating table and reading that dataset is red in every such period with no way out but a person. Scenario: a dataset joins a collection's agreement from 2025-Q1, and a reader's check of it runs in 2024-Q4. RECOMMENDED: such a check is out of scope for a period in which a table it reads is not owed and has never been supplied - that is the agreement, not an absence - and records neither red nor a result. ALTERNATIVE: keep it red and let a person promote each such period by hand."
- id: REQ-DASH-272
  title: "A dataset page awaiting a decision also gives the warehouse's status, and its cross-table checks show each result against what's staged and against what's in the warehouse"
  date_written: "2026-10-21"
  story: "As a data team leader opening a dataset whose newest supply is awaiting a decision, I want the page to say whether the supply actually in the warehouse is green, and each cross-table check to show what it found against what's staged and against what's in the warehouse, so that I can tell 'a bad file is waiting' from 'the warehouse is broken' at a glance, while an engineer can still read the full explanation."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-20 evening and 2026-10-21 morning ('Warehouse view: option 2. The awaiting line gains a clause giving the in-place supply's status'). Keith, 2026-10-22: Q12 = A (every cross-table row says what it read, structured, as-at, two exempt kinds); S6 row display = A (a row whose staging verdict and warehouse re-check differ shows both); row density = Option C 'with stacked results on phone' (review-dashboard-ux-v3-density.md, after mock-ups mockup-density-option-c.png and -option-c-phone.png); Q5 = A wording; the joint-promotion history row. Dashboard UX review of v3: D1, D2, D3, D4, N4, N5. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22."
  acceptance_criteria:
  - "WHERE a dataset page's verdict line says the newest supply is awaiting a decision and names the supply in the warehouse (REQ-PIPE-081 criterion 1), THE SYSTEM SHALL end it with that supply's status on the date on show, counted by REQ-PIPE-269, worded 'The supply in place in the warehouse is the one received <instant>, and is <status>.' with <instant> as fmtInstant gives it and <status> as STATUS_LABEL gives it - for example 'The supply in place in the warehouse is the one received 9:00am Monday, 1 July 2024, and is Green.'"
  - "THE SYSTEM SHALL show <status> with the status legend's own word and icon, never colour alone."
  - "THE SYSTEM SHALL word the clause for every case: green or amber '..., and is <status>.'; red and promoted while red '..., and is Red: it was promoted while red.'; red since promotion '..., and is Red: it turned red <time>, after <cause>' (redPromotedBadge's wording) - WHERE the cause is a person's promotion, naming that person from the decision log - and SHALL put the in-the-warehouse half on its own line at phone width."
  - "WHERE the supply in the warehouse for the period is inherited or substituted, THE SYSTEM SHALL word the clause 'The supply in place in the warehouse is the one carried forward from <period> (received <instant>), and is <status>.', judging it as at the date on show from the promotion timeline (promotionStateOn), not from the latest promotion state."
  - "WHERE nothing is in the warehouse for the period, THE SYSTEM SHALL say 'Nothing is in place in the warehouse for this period yet.'"
  - "THE SYSTEM SHALL show a dataset's cross-table checks as a grid with ONE ROW PER CHECK, not per tool, under the columns 'Check', 'Against what's staged' and 'Against what's in the warehouse', each row naming the check and, under its name, '<declared on> → <reads>' (REQ-DASH-264 criterion 2), and carrying one status pill that is the gate's reading of the check - the result REQ-PIPE-269 counts toward the supply on show."
  - "THE SYSTEM SHALL place a result in the 'Against what's staged' cell where its run read a supply of the other table that was not in the warehouse at the date on show, and in the 'Against what's in the warehouse' cell where every supply of another table its run read was in the warehouse at the date on show, taking the newest such result per cell; SHALL decide it in the Python build from qa.tables_read, the run's from_warehouse marker and the structured reason code, never from text; SHALL judge 'in the warehouse' as at the date on show from the promotion timeline; and SHALL show a dash in a cell with no result."
  - "THE SYSTEM SHALL show in each filled cell the result's word, one mark per tool that recorded it in the order dbt, Soda, datacontract-cli (✓ for a pass, ✗ for a fail, and the page's existing marks for any other result), and a short note of which supply of the other table was read - '<dataset> received <day>' (fmtDay, adding the time only where two supplies of that table share a day), '<dataset> received <day>, carried forward from <period>' for an inherited one, or 'no <dataset> in the warehouse for <period>' where none was."
  - "WHERE a check's staging result and its re-check against the warehouse differ (REQ-PIPE-267 criterion 5), THE SYSTEM SHALL fill both cells, end the warehouse cell's note with '— why it is held back', and take the row's pill from the gate - for S6, Escalation completeness reads 'Pass ✓ ✓ ✓, Investigations received 2 Oct' against what's staged and 'Fail ✗ ✗ ✗, Investigations received 1 Jul — why it is held back' against what's in the warehouse, with a Red pill."
  - "WHERE a check's result in the warehouse is the owed re-check of REQ-PIPE-269 criterion 5, THE SYSTEM SHALL show 'Not yet re-checked' in the warehouse cell with the note '<dataset> promoted <day>'."
  - "THE SYSTEM SHALL end the grid with a key line, 'The marks are dbt, Soda and datacontract-cli. Select a check for each tool's full result.', showing the marks themselves (✓ ✗)."
  - "THE SYSTEM SHALL make each check's name the control that opens its panel, and SHALL NOT nest a link or button inside another button; the panel SHALL show each tool's full result and, for each, the full sentence of what it read - 'Read against the <dataset> in place in the warehouse, received <instant>', 'Read against the <dataset> supply received <instant>, not in place in the warehouse yet', 'Read against the <dataset> in place in the warehouse for <period>, carried forward from <period> (received <instant>)' or 'Read against: no <dataset> in place in the warehouse for <period>' - with REQ-DASH-264 criterion 7's sentence; and the row's accessible name SHALL carry the same sentences."
  - "WHERE a result was recorded by a re-evaluation REQ-PIPE-267 criterion 5 made, THE SYSTEM SHALL give it in the panel and the accessible name, in place of the 'Read against' sentence, as 'Re-checked <time and day> against the <dataset> in place in the warehouse (received <instant>): the <dataset> received with this supply was held back.' or, where none was in the warehouse, 'Could not be checked <time and day>: no <dataset> is in place in the warehouse, and the <dataset> received with this supply was held back.'; and WHERE it is the owed re-check, 'Not yet re-checked against the <dataset> promoted <instant>; the re-check runs on the next processing pass.'"
  - "WHERE a waiting supply's staging result was read against a supply that is itself awaiting a decision, THE SYSTEM SHALL say so in the panel, naming that supply's receipt."
  - "THE SYSTEM SHALL render every dataset name in this requirement's sentences as a real link (<a href>) to that dataset's page at the same date on show, built with navHref / affectsLinks, and every name as text, never markup."
  - "AT PHONE WIDTH, THE SYSTEM SHALL stack each check's two results under its name, keeping its status pill wholly visible inside the viewport."
  - "THE SYSTEM SHALL count a re-evaluation of REQ-PIPE-267 criterion 5 of a dataset's own supply as part of that supply's delivery in REQ-DASH-264 criterion 11's run count (sameDelivery), labelled 're-checked against the <dataset> in place in the warehouse', and SHALL NOT count it as a second run."
  - "THE SYSTEM SHALL show a supply in the warehouse - its rows, pill, counts, sparklines and rollups - from the results REQ-PIPE-269 counts at the date on show, through the build's one function, and SHALL NOT show on its page a result about a supply of another table not in the warehouse."
  - "WHEN a waiting supply is rejected, THE SYSTEM SHALL show the page from the in-warehouse supply's results from the rejection's date on, as clipDatasetToInPlaceOn does today for a withdrawn run."
  - "WHERE a supply was promoted in one gate application with others (REQ-PIPE-266 criterion 10), THE SYSTEM SHALL say so on its supply-history row, 'Promoted <time> with the <dataset> supply received <instant>, by the rule', naming up to three supplies and, past three, the first two and 'and <n> more'."
  - "THE SYSTEM SHALL compute the clause, each cell, note and sentence, and the history row at build time in Python from recorded QA results and the decision log, and SHALL NOT re-derive them in the page's script."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-081 criterion 1 and REQ-DASH-264 criteria 2 and 7 and non-functional requirement 2 with the wording in summary-v4.md once Keith has approved it."
  - "THE SYSTEM SHALL have real-browser tests, tests/test_dashboard_e2e.py::TestWarehouseAndStagingViews, against a dashboard built from a fixture history, written first and seen to fail: S1 green branch - Notifications' page reads 'Awaiting a decision' for v2 and 'The supply in place in the warehouse is the one received <v1 instant>, and is Green.'; S6 - Escalation completeness is one row with Pass in the staged cell, Fail and '— why it is held back' in the warehouse cell and a Red pill, and its accessible name carries both full sentences; S4 - Clients' page after Notifications v2's hold-back reads Green with no result from Notifications v2's run; an inherited supply's clause; the owed re-check; the joint-promotion history row; after a rejection the page reads the in-warehouse supply's verdict; and at 375px wide every row's pill is inside the viewport."
  non_functional_requirements:
  - "NO FALSE GREEN AND NO FALSE ALARM: the newest supply's red stays the headline (REQ-PIPE-081 criterion 1's 2026-10-05 reason), and the clause stops a reader concluding the warehouse is broken when it is not."
  - "NO HALF-AND-HALF VIEW, MADE VISIBLE (Keith, Q12 = A): the two columns are the two views; no cell mixes them."
  - "DENSITY (Keith, 2026-10-22, Option C): about a third of the lines the per-tool rows took in the S6 mock-up; the long sentences are one selection away and always in the accessible name, for 'a sort of wider audience of engineers'."
  - "ACCESSIBILITY: status word and icon, never colour alone (REQ-DASH-070 criterion 6); the marks are explained by a visible key and spelled out in each row's accessible name; no interactive element nested in another."
  - "PERFORMANCE: the in-warehouse status, the cell placement and the notes are computed per result at build from REQ-PIPE-269's date windows; no per-render history walk."
  - "SCALE (~30 collections): one row per relationship however many tools ran it, so a table read by many others lists one labelled row per relationship (amended REQ-DASH-264 NFR 2)."
  - "COMPATIBILITY: no new asset; file:// and offline viewing unaffected; the in-place-on query parameter is kept by every link."
  dependencies:
  - REQ-PIPE-269
  - REQ-PIPE-267
  - REQ-PIPE-266
  - REQ-PIPE-081
  - REQ-DASH-264
  - REQ-DASH-126
  - REQ-DASH-277
  decisions:
  - "OPTION 2, A CLAUSE ON THE AWAITING LINE (Keith, 2026-10-21 morning). REJECTED sending the reader to supply history to find the warehouse's state, Keith's first guess."
  - "THE PAGE STILL LEADS WITH THE NEWEST SUPPLY (REQ-PIPE-081 criterion 1, amended 2026-10-05 by Keith): the clause adds the warehouse's state; it does not replace the newest supply's."
  - "EVERY ROW SAYS WHAT IT READ (Keith, 2026-10-22, Q12 = A, confirmed after the mechanism was explained): on both views, decided in the Python build from structured fields (qa.tables_read, the run's from_warehouse marker, the structured reason code), never from text, 'in place' judged as at the date on show. Two kinds of result are excepted from the 'Read against' sentence because their own sentence already names the partner: a package re-check against the warehouse, and could-not-be-checked for want of a partner (criterion 13). REJECTED Q12 B (only re-checked rows)."
  - "BOTH RESULTS ON A ROW WHERE THEY DIFFER (Keith, 2026-10-22, S6 row display = A, 'definitely option A', after mockup-s6-cross-table.png): the staging result and the re-check against the warehouse partner, the latter saying it is why the supply is held back; the row's status is the gate's."
  - "A GRID: ONE ROW PER CHECK, STAGED AND WAREHOUSE COLUMNS, STACKED ON PHONE (Keith, 2026-10-22, density Option C 'with stacked results on phone', after mock-ups of B and C on the real page). His concern: 'I think we could do something better here than just layering in lots of text, but I think having the longer descriptions there is useful to explain it to a sort of wider audience of engineers.' REJECTED Option A (one row per check with per-tool pill buttons) and Option B (one row per tool, the sentence once per group heading), and the v3 layout of one row per tool with every sentence repeated (the S6 mock-up's dual lines x3). The reviewer's caution on C - most rows fill one column - was seen on the mock-up and accepted."
  - "VOCABULARY AND FORMATS (dashboard UX review of v3, D2 and D3): 'held back', never 'was not promoted' or plain 'held'; 'received <instant>' in fmtInstant's form ('9:00am Monday, 1 July 2024'); STATUS_LABEL's capitalised word. D1: v3's criterion 2 and criterion 7 both printed the red-promoted text; criterion 3 alone carries it now."
  - "AN INHERITED SUPPLY IN THE CLAUSE (dashboard UX review of v3, N4): verdictLine's in-warehouse branch reads promotionState.promoted and may miss an inherited supply, saying 'Nothing is in place'; criterion 4."
  - "A HAND PROMOTION NAMES WHO (dashboard UX review of v3, N5): criterion 3."
  - "THE JOINT PROMOTION ON THE HISTORY ROW (Keith, 2026-10-22, agreed batch): criterion 20, replacing v3's proposed 'cleared minutes later' note (dashboard Q-F)."
  - "'IN PLACE IN THE WAREHOUSE' (Keith, 2026-10-22): every shown sentence here uses the new wording; REQ-DASH-277 makes the same change everywhere else."
  - "REJECTING RETURNS THE PAGE TO THE WAREHOUSE (Keith, 2026-10-21): already today's behaviour; criterion 19 makes it a tested claim."
  - "COLLECTION AND AGENCY ROLLUPS FOLLOW EACH DATASET'S NEWEST SUPPLY (Keith, 2026-10-22, Q11 = A): unchanged; REQ-DASH-275 adds the card line."
  open_questions:
