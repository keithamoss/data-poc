  decisions:
  - "RE-CHECK WHEN A PACKAGE-MATE IS HELD BACK, AND CASCADE (Keith, 2026-10-20/21): 'the others' cross-table checks re-run against the warehouse partner before any of them can promote', and 'Re-checks cascade within a package until nothing changes'; 'Things that depend on each other don't promote until they're all happy.'"
  - "A TRANSITIVE GROUP GATE (Keith, 2026-10-22, architect N1, put to Keith as a clarification of 'things that depend on each other don't promote until they're all good'; no objection): a gate application is the newly checked supplies plus every waiting supply in the period connected to them through recorded cross-table verdicts, transitively, settled by the fixed point, never running a check for a waiting supply, at every gate entry. It folds v3's REQ-PIPE-268 (a waiting partner promoted with the later file, the scoper's Q1) and v3's criterion 14 (a single arrival re-checked against the warehouse when its partner waits for its own red, Q2) into one rule; both answers become A. REJECTED v3's REQ-PIPE-268 as drafted, which judged each waiting supply alone and deadlocked S10 (three staggered files) and S11 (two waiting on each other). REJECTED Q1 B (promote the later file alone and let the knock-on bring the partner in: a moment of half-and-half) and Q1 C (both wait for a person: every staggered pair, 312 on the bootstrapped history)."
  - "RE-GATED, NEVER RE-CHECKED (delivery-scoper, carrying v3 REQ-PIPE-268's reasoning): a joined waiting supply needs no new run - the arrival's own run already evaluated the shared check against it, and that verdict counts toward both (REQ-QAC-037). Where a joined supply's verdict would need re-running, it is simply not promoting (criterion 3). So Keith's 'other tables are re-checked only on promotion' holds; what changes is that a waiting supply is re-GATED when a connected file lands, which is why REQ-PIPE-121's staging decision is refined rather than left silently contradicted."
  - "EVERY GATE ENTRY, THE RE-CHECK EXECUTOR INCLUDED (architect, v3 draft review B2 and T14): re-files, un-supersedes and settlements gate through recheck.execute, the fourth entry v3 missed; a re-file batch is not a package (REQ-PIPE-265 criterion 1), but with every entry forming a connected gate application, re-filed partners clean together promote together."
  - "HOLDING A FAILING PAIR TOGETHER IS DELIBERATE (architect, v3 draft review): where two still-promoting supplies fail only against each other, both are held back; neither is promoted on a verdict about the other. Keith's 'don't promote until they're all happy'."
  - "ACCEPTED LIMIT: TWO TABLES PER CHECK (architect, v3 draft review): n-1 rounds and order-independence hold while every cross-table check reads exactly two tables - all ten reads_tables in the Child Protection Soda file name one other table today. A check reading three or more tables would make the outcome stricter than needed, never looser; accepted rather than designed for."
  - "NO HALF-AND-HALF VIEW (Keith, 2026-10-21): every result is either the warehouse view or the staging view. Criterion 1 is that principle at the gate: the gate's view is the warehouse as it will stand once this gate's promotions are made."
  - "STRICT: AN ABSENT PARTNER IS RED, NEVER EMPTY (Keith, 2026-10-21): 'It's the strictest rule. It's probably the easiest to sort of think about and understand.' REJECTED treating a table that was not supplied as empty. Red for the table that ASKS the question only (Keith, 2026-10-22, Q13 = B, REQ-PIPE-269 criterion 4)."
  - "RED ONLY (Keith, 2026-10-20/21): no new status, and no red that follows different rules. REJECTED v2's Incomplete status and red that promotes itself."
  - "A CARRIED VERDICT STOPS COUNTING WHEN A FILE IT READ IS HELD BACK (Keith, 2026-10-21): criterion 9. REQ-PIPE-265 itself is not amended."
  - "A SUPPLY ALREADY NOT PROMOTING IS NOT RE-CHECKED (delivery-scoper, 2026-10-21): no gate depends on its results. Accepted consequence: in S1's red branch Notifications v2's Client reference still shows its verdict against Clients v2, also waiting - a staging-view result in the 'Against what's staged' column (REQ-DASH-272) - and is judged against the warehouse by the knock-on if a person promotes it."
  - "THE STAGING VIEW, MADE PRECISE (delivery-scoper, from Keith's S1, for confirmation at the walk-through): once a package-mate is held back, 'what is staged for its dependencies' means what is staged AND still promoting with it - S1 step 3 has Clients v2 judged against Notifications v1, not the staged v2."
  - "REQ-PIPE-079'S OWN WORKED CASE AGREES (REQ-PIPE-079 decision 23, Keith 2026-09-26): 'judging notifications against a supply nobody accepted into Q3 would record a green that becomes retroactively meaningless if that supply is later rejected'. That is S3b, now handled by the transitive gate."
  - "TERMINAL WORDING LIVES IN REQ-PIPE-276 (delivery-scoper, 2026-10-22): v3's criteria 11 (exit code), 12 (next step) and 15 (override warning) moved there with the CLI review's corrections, so this requirement is the gate alone."
