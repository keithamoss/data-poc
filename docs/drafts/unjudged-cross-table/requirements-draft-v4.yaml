- id: REQ-PIPE-210
  title: "The terminal's queue lists a supply held back only by another table beneath that table's own item, says nothing needs deciding on it, and does not count it"
  date_written: "2026-10-14"
  story: "As the person working through supplies waiting on a decision in the terminal, I want a supply that is held back only by another table - a package-mate held back, or a table it reads that could not be read - listed beneath that table's own item, saying that nothing needs deciding on it and which decision clears it, so that I deal with the one item that clears it instead of rejecting or promoting a supply with nothing wrong in its own data."
  moscow: should
  status: not_started
  source: "Keith, 2026-10-14 morning, close-out Q19, option A: 'page and terminal; a small pipeline requirement drafted now for the terminal queue'. Re-folded for #95 on 2026-10-22 (delivery-scoper): Keith's Q8 = A ('the scoper's draft, not the CLI reviewer's A''): beneath the package-mate, not counted, 'nothing needs deciding', not pickable from the queue line, an override by naming it, its own counted row once the package-mate is rejected; Q10 = A. THIS VERSION REPLACES the close-out draft's when #95 is applied."
  acceptance_criteria:
  - "WHERE every red check on a supply waiting on a decision is another table's doing - held back with a package-mate (REQ-PIPE-266), or a cross-table check that could not run for want of another table, for any reason REQ-PIPE-270 criterion 4 names - THE SYSTEM SHALL show it in the terminal's queue ('mothman > Filing decisions > {collection name} > Supplies waiting on a decision') with a line saying that nothing needs deciding on this supply, naming the root cause (REQ-PIPE-278 criterion 1), and saying that its checks run again and the gate is applied again once that decision is made or a <period> <dataset> supply is promoted (REQ-PIPE-121)."
  - "WHERE the root cause has an item of its own in that queue - a supply waiting on a decision, an open contested pair or a held supply - THE SYSTEM SHALL list such supplies beneath that item, each named once, and where the hold-back runs through a chain, flat beneath the root, each line naming what it traces through; and SHALL NOT list them again as rows of their own."
  - "THE SYSTEM SHALL NOT offer a supply listed beneath its cause as a pickable decision from the queue line, and SHALL say on its line that a hand override is made by naming it (mothman supply decide --operation promote --dataset <id> --period <period> --reason ...)."
  - "WHEN a person reaches such a supply another way - by naming it, or from its period's door (REQ-GHUB-229) - THE SYSTEM SHALL say the same before offering any decision, SHALL name the root cause's decision first, and SHALL keep the supply's own decisions available on the same terms as today."
  - "WHERE a supply also has a red check of its own, THE SYSTEM SHALL list it and count it as today with a line naming the other table's cause, and SHALL NOT say that nothing needs deciding on it."
  - "WHEN the root cause's supply is rejected or superseded, THE SYSTEM SHALL list each supply it held back as a counted row of its own, worded from the decision log as it then stands ('The <dataset> file received with it was turned down; this supply now needs its own decision.'), and SHALL NOT show anywhere a 'waiting for' that can no longer happen."
  - "THE SYSTEM SHALL work out which waiting supplies this covers, their root cause and why, through the one function REQ-PIPE-278 criterion 1 names, which the dashboard's REQ-DASH-204 and REQ-DASH-275 lines also use, and SHALL NOT read supply rows or parse a reason's prose."
  - "THE SYSTEM SHALL count, wherever the terminal counts supplies waiting on a decision - the Filing decisions queue's own count and mothman supply queue - a cause with supplies listed beneath it once, and SHALL NOT count a supply listed beneath its cause, so that the count is the number of things to decide."
  - "THE SYSTEM SHALL have fixture tests, written first and seen to fail, that drive the real queue: with a contested cp_clients pair and its three readers (listed once beneath the pair, not counted); with S2 strict (Clients v2 listed beneath Notifications v2, not counted, not pickable, the override line shown); with Notifications v2 then rejected (Clients v2 its own counted row with the 'turned down' wording); and with a reader that has a failing check of its own (listed and counted as today)."
  non_functional_requirements:
  - "SCALE: at thirty datasets a widely read table can hold many readers red at once, and a delivery can hold several back; grouping them beneath the one item that clears them keeps the queue one row per cause."
  - "NO FALSE QUIET: the line is only shown where every red check is another table's doing (criterion 5); a supply with a fault of its own is never told nothing needs deciding."
  - "ONE ANSWER: the page and the terminal decide which supplies this covers through one function, so they cannot disagree."
  - "SECURITY: nothing is widened - an override keeps its allowlist, actor and reason; it is simply not offered from the queue line."
  - "TEST FIRST for criterion 5, the false-quiet guard."
  dependencies:
  - REQ-DASH-204
  - REQ-DASH-275
  - REQ-PIPE-121
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-GHUB-082
  - REQ-GHUB-229
  - REQ-PIPE-163
  - REQ-PIPE-202
  - REQ-PIPE-266
  - REQ-PIPE-270
  - REQ-PIPE-276
  - REQ-PIPE-278
  decisions:
  - "THE TERMINAL GETS ITS OWN REQUIREMENT (Keith, 2026-10-14, close-out Q19 = A). REJECTED the page half only, and leaving both."
  - "KEPT UNDER #95 (Keith, 2026-10-22, Q8 = A): a supply held back only because of a package-mate is listed beneath it, not counted, reads that nothing needs deciding on it, and is not offered as a pickable decision from the queue line; a hand override is still available by naming it; once the package-mate is rejected it becomes its own counted row. REJECTED Q8 B (drop this requirement and list it like any red: the queue invites a decision on the wrong supply) and the CLI reviewer's A' (pickable from the queue with 'Deciding cp-notifications settles this one'); Keith was told he can switch."
  - "A SUPPLY LISTED BENEATH ITS CAUSE IS NOT COUNTED (Keith, 2026-10-14, follow-up F6 = A): the count is the number of things to decide."
  - "THE ROOT CAUSE, NOT THE IMMEDIATE ONE (delivery-scoper, 2026-10-22, from Keith's S6 root naming = A and the CLI review's N2): a chain is listed flat under its root, each line naming what it traces through."
  - "THE READER'S OWN DECISIONS STAY (delivery-scoper, 2026-10-14), reached by naming it rather than from the queue line (Keith, Q8 = A)."
  - "SHOULD (Keith, 2026-10-14, follow-up F14 = B): REQ-PIPE-211 is must; this requirement is should."
  open_questions:
  - "1. A SUPPLY WITH NOTHING TO SIT BENEATH (follows F6; not yet answered). Scenario: Notifications v2 is red only because Clients is overdue, and an overdue slot has no item in this queue, so Notifications v2 is a row of its own saying nothing needs deciding on it. Is it counted? RECOMMENDED A: not counted either - F6's reason, 'the count is the number of things to decide', applies equally - with a line under the count saying how many supplies wait on another table. B: count it as today."
  - "2. THE PAGE'S OWN COUNTS (follows F6; not yet answered). The dashboard counts supplies waiting for a person in each agency and collection card's breakdown. RECOMMENDED A: the same rule there, through the same one function - a supply whose red is wholly another table's is not counted as waiting for a person, the cause's card line carrying it. B: the terminal only."
