- id: REQ-PIPE-269
  title: "A promoted supply's status counts a cross-table verdict only when every supply it read is the one now in the warehouse, and a check that could not run counts only against the table that asks"
  date_written: "2026-10-21"
  story: "As a data team leader reading a promoted dataset, I want its status to count only cross-table verdicts about the tables actually beside it in the warehouse, and a check that could not run to count only against the table asking the question, so that another table's file that never got in can neither turn it red nor leave it green, and one late or bad file does not hold back every table it touches."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-20 ('the promoted view reflects what's actually in the warehouse across rechecks') and 2026-10-21 ('A warehouse view counts a cross-table verdict only when every supply it read is the one in place, judged by supply'); the live flaw in supply_status.runs_about / latest_results established from the code 2026-10-20. Keith, 2026-10-22: Q13 = B (architect N2: a could-not-run counts only against the declaring table) and Q5 = A (an owed re-check reads red, worded, with no notification unless it fails). Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22."
  acceptance_criteria:
  - "WHERE a supply is in the warehouse for its table in a period at T - promoted, inherited or substituted - THE SYSTEM SHALL count toward its status at T a cross-table result only where every supply that result's run read (qa.tables_read) is the one in the warehouse for its table in that period at T, judged by supply and never by physical table name."
  - "THE SYSTEM SHALL NOT count toward an in-warehouse supply's status at T any result from a run that read a supply of another table not in the warehouse at T - the arrival run of a supply that was then held back, is still waiting, or was later rejected or superseded included."
  - "WHERE a supply is waiting, THE SYSTEM SHALL count toward its status the newest counted result per check from every run that read it, as today, its gate being subject to REQ-PIPE-267 criterion 1."
  - "THE SYSTEM SHALL count a cross-table result that was EVALUATED toward every supply its run read and toward no other; and SHALL count a result recorded NOT EVALUATED for want of a table only toward the supply of the table the check is DECLARED on, and toward nothing where the declaring table is the one that could not be read - so that an absent or held-back Placements leaves Clients' status alone, and an absent Clients turns only the table asking about it red."
  - "WHERE an in-warehouse supply has a cross-table check counted toward it for which no recorded result satisfies criterion 1 at T because a re-check owed by a promotion (REQ-PIPE-121) has not yet run, THE SYSTEM SHALL read that check as red with the structured reason 'recheck-owed', naming the supply promoted and its effective instant, and SHALL NOT fall back to a result about a supply no longer in the warehouse."
  - "THE SYSTEM SHALL NOT raise a ticket, write a still-failing record, or mark for notification a supply whose only red is 'recheck-owed', and SHALL treat it as any other red once the owed re-check has run and recorded its own result."
  - "THE SYSTEM SHALL answer criteria 1 to 5 through ONE record-selection function taking the view as an explicit argument - filtering to the results that count FIRST and then taking the newest per check, so that a check falls back to its newest counted result - used by the promotion gate, the knock-on (knock_on.readers), supply_status, red_promoted, the status recorded at promotion (REQ-PIPE-130 criterion 11), the dashboard build (build_dashboard_data.share_cross_table_results) and the terminal, and SHALL NOT keep a second rule anywhere for which results are about a supply."
  - "WHEN the knock-on decides whether a reader must run again (REQ-PIPE-121 non-functional requirement 4), THE SYSTEM SHALL treat a reading check as stale where its newest counted result read the moved table as a different supply than the period now holds, read nothing for it, or is not evaluated for want of a table, so that a reader that could not read a table is re-run rather than only re-gated."
  - "THE SYSTEM SHALL judge 'in the warehouse at T' from the decision log alone (REQ-PIPE-081 criterion 3), so that the dashboard's date-on-show view and the terminal give the same answer for the same T."
  - "THE SYSTEM SHALL amend, in the same change, REQ-QAC-037 criterion 7, REQ-DASH-264 criterion 1 and REQ-PIPE-121 non-functional requirement 4 with the wording in summary-v4.md once Keith has approved it."
  - "S4: THE SYSTEM SHALL have tests/test_warehouse_view.py::TestHeldBackPartnerDoesNotCount::test_promoted_clients_unaffected_by_a_held_back_notifications - Clients v1 and Notifications v1 promoted green; Notifications v2 arrives alone pointing at missing clients, its Client reference red, and is held back - asserting Clients v1 reads green through supply_status, promotion.status_of and the dashboard build's per-dataset status at a date after the hold-back - written first and seen to fail (today supply_status.runs_about counts Notifications v2's arrival run toward Clients v1)."
  - "THE OTHER DIRECTION: THE SYSTEM SHALL assert in the same class (test_promoted_notifications_unaffected_by_a_held_back_clients) Keith's 2026-10-20 case - Notifications promoted green, a Clients v2 red on its own checks held back - Notifications' status and its rows showing the verdict against the Clients in the warehouse - written first and seen to fail."
  - "S2, COUNTED WITH NO RE-RUN: THE SYSTEM SHALL assert in tests/test_warehouse_view.py::TestPromotedTogether::test_one_verdict_counts_toward_both that after a first-time zip promotes Clients v2 and Notifications v2 together, the single Client reference verdict counts toward both statuses, and no readers-only run is recorded."
  - "S14, ONE BAD PLACEMENTS FILE DOES NOT HOLD THE QUARTER: THE SYSTEM SHALL have tests/test_warehouse_view.py::TestCouldNotRunCountsTowardTheAsker::test_a_red_placements_holds_back_only_placements - a first-time zip of all six Child Protection tables with Placements v2 red on its own data - asserting that Placements v2 alone is held back, that Placements' checks re-run for Clients v2 against no Placements count toward nothing, and that the other five are promoted; and test_a_zip_without_placements_promotes_clients (S14b) - both written first and seen to fail (under v3's counting the whole quarter was held back)."
  - "THE SYSTEM SHALL assert in the same class (test_an_absent_clients_reddens_only_the_asker) that where Clients is absent, a reader's check that could not run counts toward that reader only, and no Clients supply's status is coloured by it."
  - "Q5: THE SYSTEM SHALL have tests/test_warehouse_view.py::TestOwedRecheck::test_owed_recheck_reads_red_and_raises_nothing - Clients v2 promoted (S1 green branch); a person promotes Notifications v2 and the knock-on is made to fail - asserting Clients v2 reads red with reason 'recheck-owed' naming Notifications v2, that no ticket, still-failing record or notification mark is written for it, and that once the owed re-check runs green it reads green - written first and seen to fail."
  - "B1: THE SYSTEM SHALL have tests/test_warehouse_view.py::TestKnockOnStaleness::test_not_evaluated_reader_is_rerun_not_only_regated, injecting a knock-on owed for a table the period still does not hold and asserting the reader's reading checks are re-run - written first and seen to fail at knock_on.readers (None == None, only re-gated)."
  non_functional_requirements:
  - "NO FALSE GREEN AND NO FALSE RED: a supply's status in the warehouse is about the warehouse as it stands, so a held-back partner cannot turn it red (S4) and a verdict about a supply that left cannot keep it green (criterion 5)."
  - "PROPORTIONATE STRICTNESS (Keith, Q13 = B): the absence is still red for the table asking the question, so nothing is promoted on a check nobody could run; but a referenced table no longer waits on every table that reads it."
  - "NO FLICKERING REDS (#113): an owed re-check reads red, honestly, but is never notified unless the re-check itself fails; normally the knock-on runs straight after the promotion and nobody sees it."
  - "THE BUILD RULE: computed from recorded QA results and the decision log only, never supply rows (REQ-DOCS-101)."
  - "PERFORMANCE: the build works out once, per recorded result, the window of dates in which every supply it read was in the warehouse, and the page filters by the date on show - no per-render walk of history; linear in recorded cross-table results at ~30 collections."
  - "DETERMINISM: 'in the warehouse at T' comes from the decision log alone, so a rebuild of the same history gives the same statuses."
  - "MAINTAINABILITY: one function (criterion 7) - the v2 architect review found four status rankings where two were expected; a second 'which results count' rule would drift the same way."
  - "AUDITABILITY: a result that does not count toward a supply is still recorded and still shown on the supply it does describe; nothing is deleted or rewritten."
  - "PRIVACY: unchanged - only supply ids and table names are compared."
  dependencies:
  - REQ-QAC-037
  - REQ-PIPE-121
  - REQ-PIPE-081
  - REQ-PIPE-130
  - REQ-DASH-264
  - REQ-DASH-126
  - REQ-PIPE-265
  - REQ-PIPE-278
  decisions:
  - "WAREHOUSE VIEW BY SUPPLY (Keith, 2026-10-21): 'A warehouse view counts a cross-table verdict only when every supply it read is the one in place, judged by supply.' So a first-time zip where both promote together counts with no re-run, and a held-back partner's arrival run never counts toward the other table's promoted status - the runs_about flaw fixed in both directions."
  - "A COULD-NOT-RUN COUNTS ONLY AGAINST THE TABLE ASKING THE QUESTION (Keith, 2026-10-22, Q13 = B, architect N2): where the declaring table (e.g. Placements) is absent or held back its record counts toward nothing; where the referenced table (e.g. Clients) is absent it counts toward the declaring table only. 'One bad or late Placements file no longer holds back the whole quarter.' REJECTED Q13 A (v3: every supply the run read), under which S14 - one red Placements in a first-time zip - held back Clients, then Notifications and Investigations against no Clients, then Case Workers and Carers: the whole quarter. This REVERSES v2's Q8 answer ('the other side of a check reads Incomplete too', 2026-10-20), which was given for the Incomplete status. It is not 'not supplied = empty': the absence is still red for the table that asks. An EVALUATED verdict still counts toward every supply it read (REQ-QAC-037 criterion 7)."
  - "AN OWED RE-CHECK READS RED, AND NOTHING SHOUTS ABOUT IT (Keith, 2026-10-22, Q5 = A): 'Not yet re-checked against the <dataset> promoted <instant>; the re-check runs on the next processing pass.' (REQ-DASH-272 shows it.) No notification is sent unless the re-check itself fails (plans/running-thoughts.md #113, no flickering reds). REJECTED Q5 B, showing the old verdict against the previous partner, as a half-and-half view. 'No notification' is read here as no ticket and no still-failing record, the only notifications that exist today, plus a structured reason so #113 can leave it out - for confirmation at the walk-through."
  - "THE LIVE FLAW, FROM BEFORE #95 (established from the code 2026-10-20, re-read 2026-10-21): supply_status.runs_about selects every completed run whose qa.tables_read names this supply, whatever else it read; latest_results then takes the newest per check. On the database queried 2026-10-21, 23 Child Protection arrival runs whose supply was never promoted recorded 144 results for checks declared on other datasets."
  - "BY SUPPLY, NOT BY PHYSICAL NAME (REQ-PIPE-265 criterion 5's own reasoning): a table promoted out of staging is read as cp_clients where it was read as cp_clients__<instant>, and is the same supply."
  - "REJECTED filtering by whose run it was (supply_status's own docstring): a refreshed cross-table result recorded in another table's run is exactly what REQ-DASH-126 needs; the filter is on what the run read, not who ran it."
  - "B1 LIVES HERE (delivery-scoper): it was v2's REQ-PIPE-215 criterion 1; REQ-PIPE-211 depends on it."
  open_questions:
  - "1. A HELD TABLE'S OWN PAGE UNDER Q13 = B (scenario: Clients is held with no period, REQ-PIPE-115 criterion 10; Notifications' Client reference could not run in Notifications' own run). REQ-DASH-264 criteria 3 to 5 (signed) show those could-not-run rows on Clients' page and let them turn its cross-table section pill red. Under criterion 4 they count toward Notifications only. RECOMMENDED: keep showing the rows on Clients' page (they describe its relationships, and its status is red already by REQ-PIPE-115 criterion 10), but leave them out of its section pill, amending REQ-DASH-264 criterion 5 by one clause. ALTERNATIVE: drop them from Clients' page altogether, which hides why the readers are red from the table that causes it."
- id: REQ-PIPE-270
  title: "A cross-table check that cannot read a table is red for the table that asks, whatever the reason, not yet due included"
  date_written: "2026-10-21"
  story: "As a data team leader, I want a cross-table check that could not run, because a table it reads has no supply it may read, to be red for the table asking the question whether that table is not yet due, overdue, waiting, contested or never sent, so that nothing reads green that nobody could check, and the red holds like any red until the table is in the warehouse or a person overrides it."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-21 ('STRICT, not relaxed. An absent partner stays could-not-run, which is red; things that depend on each other don't promote until they're all happy... A human can always overrule that using the terminal'); Keith, 2026-10-22, Q13 = B (red for the table that asks). The false green behind it: plans/running-thoughts.md #95, decision 103. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22."
  acceptance_criteria:
  - "WHERE a cross-table check cannot read a table because the period offers no supply of it the run may read - none in the warehouse, none promoting with it (REQ-PIPE-267), none staged that the run may read - THE SYSTEM SHALL record the check not evaluated, with status red, naming the table and the reason, for every reason, a table not yet due for the period included, counted as REQ-PIPE-269 criterion 4 says."
  - "THE SYSTEM SHALL write that status where not-evaluated cross-table records are written (unrunnable.results_for and held_blast_radius), and SHALL NOT record such a check as no data."
  - "THE SYSTEM SHALL NOT treat a table the period does not offer as empty, for any check."
  - "THE SYSTEM SHALL keep on the record, as a structured code, the reason the table could not be read - not yet due (with the instant it falls due), overdue, staged awaiting a decision, contested, could not be loaded, held, or held back with its package - and SHALL NOT let the reason change the status."
  - "THE SYSTEM SHALL give unrunnable.describe() a text for every reason code criterion 4 names, 'held back with its package' and 'not yet due' included, and SHALL NOT let any reason reach its catch-all text."
  - "THE SYSTEM SHALL treat a table the period holds by inheritance or substitution as readable, so that it makes no check red under this requirement."
  - "THE SYSTEM SHALL let a person promote a supply that is red only for this reason on the same terms as any red supply (REQ-PIPE-075 criterion 3; REQ-GHUB-082), shown as red promoted (REQ-DASH-126) until a re-evaluation clears it."
  - "THE SYSTEM SHALL leave a trial run's cross-table checks as REQ-PIPE-115 criterion 17 and REQ-PIPE-079 criterion 9 have them: a trial is filed to no period, so this requirement does not apply to it."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-079 criterion 14 and its decision 23's 'awaiting-supply (NOT red)', and REQ-PIPE-115 criterion 20, with the wording in summary-v4.md once Keith has approved it."
  - "S3, THE FALSE GREEN CLOSED: THE SYSTEM SHALL have tests/test_strict_cross_table.py::TestNotYetDuePartner::test_early_file_is_red_until_its_partner_is_in_the_warehouse - Notifications v2 arriving alone at 08:40 on Child Protection's due day, Clients due at 09:00 - asserting Notifications v2's Client reference records not evaluated and red with the not-yet-due code and Clients' due instant, and that it is held back rather than promoted - written first and seen to fail (today 'no data', and promoted on it, as decision 103 promoted cp-investigations@202408010100000000)."
  - "THE SYSTEM SHALL have tests/test_strict_cross_table.py::TestEveryReasonIsRed::test_each_reason_records_red_and_is_described, driving the real Child Protection orchestrator with an unreadable partner for each reason criterion 4 names and asserting red with that reason's code at qa.check_result and a describe() text other than the catch-all - written first and seen to fail for not yet due and for held back with its package."
  non_functional_requirements:
  - "NO FALSE GREEN (Keith, #95): 'we can't assert that it's complete and actually green' - a table nobody could check against never reads green."
  - "FLICKER ACCEPTED FOR STAGGERED FILES (Keith, 2026-10-20): an early file whose files arrive minutes apart reads red until its partner arrives; the remedy is supplier guidance (REQ-DOCS-274), not design."
  - "NOTIFICATIONS (plans/running-thoughts.md #113, not scoped): a red that lasts days because a partner is not due yet is legitimate but should not page anyone (Keith, 2026-10-22, N1); criterion 4 records the not-yet-due code and due instant structurally so the notification design can tell it apart, and REQ-PIPE-278 raises no ticket for it."
  - "SCALE: one missing, widely read table makes each of its readers red - only the readers, never the table itself (REQ-PIPE-269 criterion 4); REQ-DASH-204 and REQ-PIPE-210 say it once per table, never per reader or per check."
  - "THE BUILD RULE: decided at the run; the build reads the recorded status."
  - "REGENERATE, DO NOT MIGRATE (REQ-PIPE-089's standing rule): today's 'no data' not-yet-due records are replaced by a bootstrap from empty."
  dependencies:
  - REQ-PIPE-079
  - REQ-PIPE-115
  - REQ-PIPE-105
  - REQ-PIPE-078
  - REQ-PIPE-267
  - REQ-PIPE-269
  decisions:
  - "STRICT (Keith, 2026-10-21): 'things that depend on each other don't promote until they're all happy... A human can always overrule that using the terminal... It's the strictest rule. It's probably the easiest to sort of think about and understand.' REJECTED 'not supplied = empty'."
  - "RED FOR THE TABLE THAT ASKS (Keith, 2026-10-22, Q13 = B): the record is red; whom it counts against is REQ-PIPE-269 criterion 4's rule."
  - "SUPERSEDES REQ-PIPE-079 CRITERION 14 AND DECISION 23's 'awaiting-supply (NOT red)' (Keith, 2026-09-26): that carve-out was written so that an early arrival does not 'start life red', 'which is how people learn to ignore a signal'. It is reversed knowingly: it is also what produced the false green (decision 103), and Keith has accepted the early-arrival red for staggered files with supplier guidance as the remedy. The reason codes stay - awaiting-supply remains its own code, now red."
  - "NO REASON REACHES THE CATCH-ALL (CLI review of v3): unrunnable.describe() had no text for the new reason, so the terminal would have shown the wrong catch-all; criterion 5."
  - "RED ONLY (Keith, 2026-10-20/21): this red holds like every other red (REQ-PIPE-075 criterion 3)."
  - "RECORDED AT THE WRITERS (v1 architect H3): the status is written where the record is written, never derived later from the not-evaluated marker."
  - "WHAT THE STRICT RULE RESTORES: REQ-PIPE-115's 'not a new status', held_blast_radius's 'not a fourth status' and REQ-DASH-204's 'the line explains the red, never removes it' stand unchanged."
