- id: REQ-GEN-273
  title: "Target agreement compares a targeted supply with its own checks, and a few scenarios pin what the package gate decides"
  date_written: '2026-10-21'
  story: "As whoever maintains the synthetic history, I want the bootstrap's target check to compare each supply with what its own checks found, and a few scripted scenarios to declare what the package gate should decide, so that a supply built green is not reported as a disagreement because a package-mate built red was held back, and the gate itself is still pinned by the test history."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Delivery-scoper, 2026-10-21, tension T7: REQ-GEN-186 criterion 3 compares every targeted supply's verdict as the promotion gate reads it and fails the bootstrap on a difference; under REQ-PIPE-267 and REQ-PIPE-270 a supply built green can end red for want of a partner. Keith, 2026-10-22, Q7 = A, 'with a few scenario that explicitly exercise B'. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "WHEN a replay finishes, THE SYSTEM SHALL compare each targeted supply's target with the verdict of the file's own checks - leaving out the cross-table checks recorded not evaluated for want of a table (REQ-PIPE-270) and the re-evaluations REQ-PIPE-267 criterion 6 made because another supply was held back - and SHALL fail the bootstrap only on a difference in that comparison (REQ-GEN-186 criterion 3)."
  - "THE SYSTEM SHALL report, without failing the bootstrap, each targeted supply whose full gate reading differs from its target only because of the checks criterion 1 leaves out, naming the package-mate or the missing table."
  - "THE SYSTEM SHALL let a scripted scenario in the scenario map (REQ-GEN-045) declare the GATE OUTCOME it expects for named supplies - promoted, or held back, and where held back, because of which other supply and whether after a re-check against the warehouse - and WHEN a replay finishes, SHALL compare each declared outcome with the recorded promotions and 'promotion-withheld' entries and IF they differ, THEN fail the bootstrap naming the scenario and the supply."
  - "THE SYSTEM SHALL add scripted scenarios declaring gate outcomes for at least: S1 green (Clients v2 re-checked against Notifications v1 and promoted; Notifications v2 held back), S1 red (Clients v2 held back after the re-check), S2 strict as re-cast (Clients v2 held back on its own data; Notifications v2 held back because Clients v2 was, re-checked against no Clients in the warehouse), the S10 three-file staggered chain in its re-ordered form (Notifications 08:40, Investigations 09:00, Clients 09:20: all three promoted together at Clients' arrival), and Q13's Placements case (S14: Placements v2 held back alone, the other tables promoted), each with its own scenario id and each stating the content of every table in its period."
  - "THE SYSTEM SHALL NOT compute a predicted verdict (REQ-GEN-186 criterion 4) and SHALL change no filing, promotion, decision or verdict (REQ-GEN-186 criterion 6)."
  - "THE SYSTEM SHALL audit, in the same change, every scripted decision in the scenario map that names a supply this batch's gating changes the outcome of (scripted_decisions refuses a changed target), and REQ-PIPE-262 criterion 12's pins, TS-63 and REQ-GEN-251 criterion 3, and SHALL bring each changed expectation to Keith - with whether a generator fix keeps it - rather than re-pin it silently."
  - "THE SYSTEM SHALL amend, in the same change, REQ-GEN-186 criterion 3 with the wording in summary-v4.md once Keith has approved it."
  - "THE SYSTEM SHALL have tests/test_target_agreement.py::TestPackageMateHeldBack::test_green_target_agrees_when_only_a_held_back_partner_made_it_red, a fixture replay of S2 strict as re-cast, with Clients built red and Notifications built green, asserting no bootstrap failure and one reported difference, for Notifications, naming Clients; and tests/test_target_agreement.py::TestGateOutcomes::test_a_declared_gate_outcome_that_differs_fails_the_bootstrap, declaring S1 green's outcome wrongly and asserting the bootstrap fails naming the scenario - both written first and seen to fail."
  non_functional_requirements:
  - "NO MASKED DEFECT: only checks that could not read a partner, or were re-run because a partner was held back, are left out of the target comparison - and the gate's own outcome is pinned separately by criterion 4's scenarios (Keith, Q7: 'with a few scenario that explicitly exercise B')."
  - "MAINTAINABILITY: targets stay about the file's own data, so scenario authors do not encode the gating rule in every target; only the few gate-outcome scenarios carry it. The left-out set comes from recorded reasons and causes, never from prose."
  - "DETERMINISM: the same history gives the same report and the same gate-outcome comparison."
  - "BOOTSTRAP COST: five more scripted scenarios add their arrivals to a bootstrap already measured in CLAUDE.md; measured on the first bootstrap after build."
  dependencies:
  - REQ-GEN-186
  - REQ-GEN-045
  - REQ-PIPE-266
  - REQ-PIPE-267
  - REQ-PIPE-269
  - REQ-PIPE-270
  decisions:
  - "A TARGET DESCRIBES THE FILE (Keith, 2026-10-22, Q7 = A): compared against the file's own checks, leaving out could-not-run results and re-checks a package-mate caused. REJECTED Q7 B as the general rule (targets declare the strict red too, so every scenario author encodes the gating rule) and Q7 C (compare as today and fix each scenario that fails, including the early file of each of 312 staggered pairs)."
  - "WHY (delivery-scoper): the 312 staggered pairs each have an early file that is red under REQ-PIPE-270 until its partner arrives; Child Protection's targeted scenarios plant red tables beside green ones (TS-48, TS-75). Compared as today, the bootstrap would fail on supplies whose own data matched their target exactly."
  - "THE PINS MAY NEED A GENERATOR FIX, NOT A RE-PIN (architect, v3 draft review): criterion 6."
  - "A FEW SCENARIOS PIN THE GATE (Keith, 2026-10-22: 'with a few scenario that explicitly exercise B'): a few scripted scenarios declare the expected GATE outcome and are checked against it, so the package gate is pinned by the test history. Keith's suggestion taken whole: S1 green, S1 red, S2, the S10 chain, and Q13's Placements case."
  - "S2 IS PINNED AS THE MIRROR, AND S10 RE-ORDERED (Keith, 2026-10-22, V4-Q1 = A; architect and CLI review v4 B1): v4 pinned 'S2 strict' with Notifications v2 red and Clients v2 held back, which contradicts Q13 = B - Clients declares no cross-table check, so it promotes alone. The scenario that pins something new is the mirror, Clients v2 red holding Notifications v2 back. S10 in its original order promotes Clients alone at 09:00, so the pinned chain is the re-ordered one, which is genuinely transitive."
  open_questions: []
- id: REQ-DOCS-274
  title: "Supplier guidance says to send a delivery's files as one package, a zip"
  date_written: '2026-10-21'
  story: "As a supplying team, I want to be told that files sent separately are each judged as they arrive and may read red until the rest arrive, so that I send them as one zip and nobody is told about a red that clears by itself."
  moscow: should
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-20: 'we need to say, if you want to avoid a flicker, make sure you send us a package of files'. Keith, 2026-10-22, Q9 = A: packages are zip-only for now, and this guidance says to upload a zip. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22. Unchanged in v5 (2026-10-23). Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "THE SYSTEM SHALL carry, in a new docs/supplier-guidance.md linked from docs/delivery-format.md and docs/aws-event-driven-mvp-design.md, guidance that the files of one delivery should be sent as one zip, whichever way they are sent - a delivery directory or the cloud upload path - and that files sent separately, including separate uploads to the cloud path, are each checked as they arrive, so that an early file whose cross-table checks need a later one reads red until it arrives."
  - "THE SYSTEM SHALL state in that guidance that the red clears by itself once the later file arrives and is promoted, and that a zip avoids it."
  - "THE SYSTEM SHALL NOT describe a package as anything other than files sharing one receipt instant, which today means one zip, until another boundary marker is scoped (plans/running-thoughts.md #114, plans/supply-thoughts.md)."
  non_functional_requirements:
  - "NO FLICKERING REDS (#113): the remedy Keith chose for staggered files is this guidance, so it should exist before notification on red is switched on."
  - "MAINTAINABILITY: one place, linked from docs/delivery-format.md and docs/aws-event-driven-mvp-design.md, so a later boundary marker changes one text."
  dependencies:
  - REQ-PIPE-266
  - REQ-PIPE-270
  decisions:
  - "GUIDANCE, NOT DESIGN (Keith, 2026-10-20): 'I don't think we can really design around that.'"
  - "UPLOAD A ZIP, ON THE CLOUD PATH TOO (Keith, 2026-10-22, Q9 = A): the cloud ingest path forms no packages (REQ-PIPE-266 criterion 6), so a supplier there avoids the flicker only by uploading one zip."
  - "A SHORT NEW docs/supplier-guidance.md (Keith, 2026-10-23, D = A), linked from docs/delivery-format.md and the AWS design doc: no supplier-facing document existed, and this should exist before notification on red (#113). REJECTED D = B, a section of docs/delivery-format.md (the synthetic on-disk format, not a supplier's document), and D = C, waiting for the transport-layer work."
  open_questions: []
- id: REQ-DASH-275
  title: "A supply held back with its delivery says so at the top of its page, names the root of the chain, and the card says it once per delivery"
  date_written: '2026-10-22'
  story: "As a data team leader opening a dataset whose clean-looking supply was held back because another file in its delivery was, I want the top of the page to say which file held it back, what it was re-checked against and what clears it - naming the root where the chain is longer - and the collection card to say it once per delivery, so that I go to the one decision that clears the delivery instead of hunting through this dataset's checks."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-22: S1-red top line = A ('Held back with the Notifications received with it ...', no 'not a fault' clause); S6 root naming = A (links always, the root named when the chain is longer than one step, the root's page lists everything it holds back); Q11 = A (the card follows each dataset's newest supply, plus one line per held-back delivery); Q10 = A (a rejected package-mate rewords the line from the decision log). Dashboard UX review of v3 (D3, D5, the missing card criterion, links). Drafted by delivery-scoper 2026-10-22, split from REQ-DASH-204 so each stays small: REQ-DASH-204 is the check that could not run because another table is absent; this is the supply held back with its delivery. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Dashboard UX review of v4: the data- attribute, the notice order, the superseded partner, the root page's line. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "WHERE the supply a dataset page is about was held back (REQ-PIPE-266 criterion 9) because another supply of its gate application was not promoting and a re-check against the warehouse (REQ-PIPE-267 criterion 6) fails, THE SYSTEM SHALL show at the top of the page one notice in the existing .notice-exhausted role=status structure, marked with a data-held-back attribute (as data-blocked is), directly before REQ-DASH-204's notice where both apply, worded, for a package-mate, '<b>Held back with the <dataset> received with it.</b> That file (received <instant>) was held back, so this supply was re-checked against the <dataset> in place in the warehouse, and <n> cross-table check(s) fail against it. It is checked again by itself once a <dataset> supply is promoted.' or, for a joined supply waiting already, '<b>Held back by the <dataset> waiting for a decision.</b> That file (received <instant>) is held back, so this supply was re-checked against the <dataset> in place in the warehouse, and <n> cross-table check(s) fail against it. It is checked again by itself once a <dataset> supply is promoted.', and SHALL NOT add a 'not a fault' clause."
  - "WHERE the hold-back reaches this supply through more than one step - the root file held back, a package-mate held back because of it, and this supply because of that one - THE SYSTEM SHALL open the notice with the root and the chain, worded '<b>Held back with its delivery:</b> the <root dataset> file was held back, and the <dataset> with it.', naming each step in order."
  - "THE SYSTEM SHALL end the notice the ROOT supply's own page shows (its awaiting-a-decision line) with 'Holding back with it: <links>', naming every supply its hold-back is holding back, directly or through the chain, as at the date on show, and WHERE a supply it holds back failed a re-check against the warehouse, 'If this file is turned down, the <dataset> supply needs its own decision.'"
  - "THE SYSTEM SHALL show on the collection, agency and exec cards ONE line per root's held-back set, worded '[Red] Held back together: <names> (one delivery, received <instant>)' where they came in one delivery and '[Red] Held back together: <names> (received <instant> and <instant>)' where a joined supply came separately - the shared date written once ('received 9:00am and 9:05am, Monday 21 October 2024') where both instants fall on one day, and two full instants where they do not - naming up to three datasets and, past three, the first two and 'and <n> more', and SHALL NOT also show REQ-DASH-204 criterion 18's line for a cause that is part of that set."
  - "THE SYSTEM SHALL leave the cards' rollups following each dataset's newest supply - the staging view while it awaits a decision - so that red on a card keeps meaning 'a person is needed'."
  - "WHEN the root's package-mate or joined partner is rejected or superseded, THE SYSTEM SHALL word the notice from the decision log as it then stands - 'The <dataset> file received with it was turned down; this supply now needs its own decision.' or 'The <dataset> received with it has been replaced by the one received <instant>; this supply now needs its own decision.' where nothing has re-gated it since - and SHALL NOT show anywhere a 'held back', 'waiting for' or 'checked again once' that can no longer happen."
  - "THE SYSTEM SHALL render every dataset name in these lines as a real link (<a href>) to that dataset's page at the same date on show, built with navHref / affectsLinks, and every name as text, never markup."
  - "THE SYSTEM SHALL judge every line as at the date on show and compute it at build time from the recorded 'promotion-withheld' entries' structured fields (REQ-PIPE-267 criterion 13) and the decision log, never from prose and never from supply rows."
  - "THE SYSTEM SHALL have real-browser tests, tests/test_dashboard_e2e.py::TestHeldBackWithItsDelivery, against a dashboard built from a fixture history, written first and seen to fail: S1 red - Clients' page shows the notice naming Notifications with links that keep the date on show, carrying data-held-back, before any REQ-DASH-204 notice; staggered S1 red - the joined form; S6 chain - the Notifications page names the Investigations root and the Investigations page lists Notifications and Clients under 'Holding back with it'; the Child Protection card shows one 'Held back together' line for the delivery; after a person rejects the root the notice reads 'turned down', and after a later Notifications supersedes it the notice reads 'has been replaced', with no 'checked again once' left in either."
  non_functional_requirements:
  - "SCALE (~30 collections; one delivery may carry many tables): one card line per delivery, not per dataset, names truncated past three; the chain is named once on each page."
  - "NO FALSE QUIET: the notice never says or implies this supply has nothing wrong - S1 red is a real failing verdict against the warehouse, which is why it has no 'not a fault' clause (Keith)."
  - "NAVIGATION: every name is a real link that keeps the date on show, so a chain is never a dead end (dashboard UX review of v3)."
  - "ACCESSIBILITY AND CONSISTENCY: the page's existing notice structure and role=status; no new asset."
  - "THE BUILD RULE: recorded results and the decision log only."
