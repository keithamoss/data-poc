  - "SUPERSEDED AS WELL AS REJECTED (dashboard UX review v4, S15 half-carried): REQ-PIPE-210 criterion 6 already said 'rejected or superseded'; a Notifications v3 replacing the held-back v2 would have left 'That file (received <v2>) was held back' standing."
  - "A JOINED PARTNER'S FORM (delivery-scoper, 2026-10-23, found walking the staggered case Keith asked for): v4's wording assumed the partner 'received with it', which is false when the partner arrived minutes earlier in another delivery and was joined to the gate application (REQ-PIPE-267 criterion 2). The card line likewise could not say 'one delivery'. Wording only, within Keith's decisions; for the dashboard UX reviewer."
