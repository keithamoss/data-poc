- id: REQ-PIPE-271
  title: "A period is opened, and its non-participating datasets inherited, when the first supply is filed to it, and a person is warned when a newer supply could be carried forward"
  date_written: '2026-10-21'
  story: "As the person answerable for a quarterly collection, I want a quarter's inheritances made as soon as the first supply is filed to it, and to be told when a newer supply could be carried forward instead, so that a quarter in which a dataset owes nothing never waits for a first promotion every reader is waiting on, and nothing carried forward goes quietly stale."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-20 ('inherit when the quarter is filed, not when it is first promoted. That would align with the idea we have of having a command to open a quarter that's separate to any checks'). Keith, 2026-10-22, Q4 = B plus a warning: 'B, but include the warning on the dashboard et cetera when it goes stale'; confirmed the same day ('Happy with the wording you used and your interpretation'), the warning covering both the stale and the refused case. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Keith, 2026-10-22, V4-Q2 = A: one 'carry the newer one forward' step (REQ-PIPE-280). Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "WHEN the first supply is filed to a period whose schema does not yet exist, THE SYSTEM SHALL open that period through the one mechanism REQ-PIPE-098 criterion 4 names, making its inheritances (REQ-PIPE-098 criterion 1) in the same step, before any check runs over that supply."
  - "THE SYSTEM SHALL open the period before the run's overlay is built (REQ-PIPE-105 criterion 5), so that every check in the first package filed to the period reads the inherited tables."
  - "THE SYSTEM SHALL NOT open a period for a supply held with no period (REQ-PIPE-078) or for a trial."
  - "THE SYSTEM SHALL open a period shared by several collections on one calendar (REQ-PIPE-262) at the first filing of any of them, recording which collection's filing opened it."
  - "THE SYSTEM SHALL make a period's inheritance once, when the period opens (REQ-PIPE-098 criterion 2), and SHALL NOT later make, retry or re-point it automatically - neither where it was REFUSED for want of an earlier promoted supply (REQ-PIPE-098 criteria 9 and 10) nor where it was MADE on a supply that is no longer the newest promoted."
  - "WHEN a supply of a dataset is promoted into a period earlier than an open period that inherits that dataset - or whose inheritance of it was refused - and the newly promoted supply is newer than what that period carries forward, THE SYSTEM SHALL record a warning in the decision log, at the prominence of a refused inheritance (REQ-PIPE-098 criterion 10), naming the later period, the dataset, the supply it carries forward (or that it carries nothing) and the newer supply."
  - "WHILE such a warning stands, THE SYSTEM SHALL show it on the dashboard - on that dataset's page for the later period, and as one line on its collection card - and in the terminal - in the Filing decisions queue's period-items group above the slot rows (filing_tui.queue_flow), not counted, and in that period's door (REQ-GHUB-229) - worded 'A newer <dataset> could be carried forward into <period>. <period> carries forward the supply received <instant>; the one received <instant> has been promoted into <earlier period> since. A person can carry that one forward instead, in one step:' or, for a refused inheritance, '<period> carries nothing forward for <dataset>: there was no earlier promoted supply when it opened. The one received <instant> has been promoted into <earlier period> since, and a person can carry it forward, in one step:', each followed, on a line of its own, by REQ-PIPE-280's command in full with the real dataset id and period and only the reason left to fill in ('mothman supply decide --operation carry-forward --dataset cp-case-workers --period 2024-Q4 --reason '<why>''), and 'or from the 2024-Q4 door.'; in the terminal the lead-in reads, in the terminal's own voice, 'To carry that one forward instead, in one step:' in place of 'A person can carry that one forward instead, in one step:' (and 'To carry it forward, in one step:' for a refused inheritance), the command printed below any Rich table through _show's convention (soft_wrap, no markup) and never inside a cell; the warning appears in the Filing decisions queue, in mothman supply queue, and in the period's door; and SHALL NOT tell a person to un-inherit and then inherit. (NEW WORDING for Keith's approval, the terminal lead-in included.)"
  - "THE SYSTEM SHALL clear the warning once the later period carries forward the newer supply (REQ-PIPE-280, or an inheritance a person made), holds a supply of its own for that dataset, or the newer supply leaves its period, and SHALL NOT clear it any other way."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-098 criterion 4 with the wording in summary-v4.md once Keith has approved it; and WHERE the bootstrap moves REQ-PIPE-262 criterion 12's pinned inheritances, TS-63's expectations or REQ-GEN-251 criterion 3's, THE SYSTEM SHALL bring each to Keith with the cause - a generator fix that keeps the pin, or a new value - and SHALL NOT re-pin any silently."
  - "S6: THE SYSTEM SHALL have tests/test_period_opening.py::TestOweNothingQuarter::test_readers_of_case_workers_promote_in_a_quarter_it_sits_out - a 2024-Q4 in which cp-case-workers does not participate and a package of the other five tables, all green - asserting that 2024-Q4 is opened at the package's filing, cp-case-workers is inherited before any run, the readers' cross-table checks read the inherited table and pass, and all five promote - written first and seen to fail."
  - "STALE AND REFUSED: THE SYSTEM SHALL have tests/test_period_opening.py::TestCarryForwardWarning - test_a_stale_inheritance_is_warned_not_repointed (2024-Q4 opened on 2024-Q2's Case Workers while 2024-Q3's waits; a person promotes 2024-Q3's; 2024-Q4 still carries 2024-Q2's and the warning names both) and test_a_refused_inheritance_is_warned_not_retried (S9: nothing earlier when 2024-Q4 opened; an earlier supply promoted later; the readers stay red and the warning names it) - each also asserting the warning, with REQ-PIPE-280's command on a line of its own, in the terminal's queue output (not counted) and in the period's door and on the built dashboard page, and that it clears once a person carries the newer one forward with REQ-PIPE-280's one step - written first and seen to fail."
  non_functional_requirements:
  - "NO DEADLOCK: the owe-nothing quarter's first promotion no longer depends on a table that only its first promotion would bring."
  - "NO SILENT STALENESS: opening earlier makes a stale inheritance more likely; the warning on the dashboard, in the queue and in the door makes it visible instead of designing it away (Keith, Q4 = B)."
  - "DETERMINISM AND REPLAY: who opens a period depends only on receipt order across the stream (REQ-PIPE-262), never on process timing; nothing is re-pointed later, so a replay reaches the same inheritances."
  - "OBSERVABILITY: the opening is a recorded event naming the filing and collection that caused it (REQ-PIPE-098 criterion 3); the warning is a decision-log entry, so it is auditable after it clears."
  - "COMPATIBILITY: a consumer querying a period schema directly in SQL may now see a period holding only inherited views while everything else is staged; REQ-PIPE-081 criterion 11 already promises such a consumer nothing about as-at answers, and the _manifest view (REQ-PIPE-130) lists what it holds."
  - "SCALE (~30 collections): one warning per period and dataset, one card line per warning; nothing is listed per reader."
  - "MAINTAINABILITY: one opening mechanism (REQ-PIPE-098 decision 6) - filing calls it, as promotion, substitution and the future explicit command do."
  dependencies:
  - REQ-PIPE-098
  - REQ-PIPE-099
  - REQ-PIPE-262
  - REQ-PIPE-105
  - REQ-PIPE-270
  - REQ-GHUB-229
  - REQ-PIPE-280
  decisions:
  - "INHERIT WHEN THE QUARTER IS FILED (Keith, 2026-10-20): 'That would align with the idea we have of having a command to open a quarter that's separate to any checks.' The deadlock it removes: in an owe-nothing quarter every reader of Case Workers needs an inherited table that arrives only at a first promotion, which none of them can make under the strict rule."
  - "REQ-PIPE-098 CRITERION 4's EXPLICIT COMMAND STAYS UNMET AND UNOWNED (Keith, 2026-10-19, 'Leave until needed'): filing is a third trigger of the same mechanism, not the command."
  - "SHARED PERIODS (REQ-PIPE-262): Emergency Department and Child Protection share the quarterly calendar, so an Emergency Department filing can open a Child Protection quarter and make its inheritances; criterion 4 records which. Confirmed mechanically fine by the architect (v3 draft review): open_period runs outside other transactions, and inherit_into walks every dataset."
  - "NOTHING ASSUMES A PERIOD HOLDS A PROMOTION (architect, v3 draft review, answering v3's open question 2): the census is fine, and nothing reads qa.period as 'something was promoted'. A period holding only inherited views is new but harmless."
  - "S17, RECORDED AND ACCEPTED, NOT CHANGED (architect, v3 draft review): a period that inherits its predecessor at filing blocks a green resupply of the predecessor more often (promotion.py:983-995, a stood-on supply cannot be replaced while a later period stands on it). That is today's behaviour, widening; the person sees it as today's refusal and un-inherits first."
  - "THE PINS ARE AT RISK, AND A RE-PIN IS NOT THE DEFAULT FIX (architect, v3 draft review): REQ-PIPE-262 criterion 12's pins (requirements.yaml:39249-39252), TS-63 and REQ-GEN-251 criterion 3 can move under opening-at-filing and under strict red; they may need a generator fix rather than a new value. Criterion 9."
  - "CARRY FORWARD ONCE, WARN WHEN IT GOES STALE (Keith, 2026-10-22, Q4 = B: 'B, but include the warning on the dashboard et cetera when it goes stale'; confirmed: 'Happy with the wording you used and your interpretation'): no automatic retry of a refused inheritance and no automatic re-pointing of a made one. The warning covers both the stale and the refused case, so the architect's S9 (readers red with nothing carried forward) is cleared by a person acting on the warning, not by a retry. REJECTED Q4 A (retry the refused one) and Q4 C (retry and re-point both automatically). Keeps Keith's 2026-09-26 'any other inheritance would be per-dataset and by operator command' (REQ-PIPE-098 decision 8) whole."
  - "THE WARNING NAMES ONE STEP, NOT TWO (Keith, 2026-10-22, V4-Q2 = A; CLI review v4 B2): v4 told the person 'un-inherit, then inherit' - two decisions, each with its own knock-on (filing_decisions.py:728-730 refuses an inherit over an inherit). Between them the period held no Case Workers or Clients, so every reader's check went could-not-run red, promoted readers turned red-promoted and waiting readers raised tickets - the self-clearing red Keith ruled out (plans/running-thoughts.md #113). The person now carries the newer one forward in one decision (REQ-PIPE-280). REJECTED V4-Q2 B (two steps, a warning, an immediate offer of the inherit and no ticket for the gap): a real red window a script or an interrupted person can leave standing."
  - "THE TERMINAL'S PLACE FOR IT (CLI review v4 S13): the queue's period-items group above the slot rows, not counted, and the door; commands on their own lines so they can be copied."
  - "T18 STAYS OPEN FOR KEITH, WITH THE ARCHITECT'S MECHANISM (architect v4 reading of v4 open question C): if Keith takes the recommendation, a check whose table is not owed and has never been supplied is OUT OF THE RUN'S SCOPE for that period, recorded in left_out with its reason - not a third outcome."
  - "THE TERMINAL'S OWN VOICE AND REAL VALUES (CLI review v5 items 2, 3, 7, 11): the terminal says 'To carry that one forward instead, in one step:', as _recheck_panel says 'To take it out of {where}, demote it:'; the command carries the real dataset and period, prints outside any table so it can be copied, and appears in mothman supply queue too, which has no period-items group today. The lead-in is NEW wording for Keith's walk-through."
  - "T18 SETTLED (Keith, 2026-10-23, C = A): out of the run's scope where a table a check reads is not part of the agreement for the period and was never supplied; REQ-PIPE-270 criterion 9 carries it. REJECTED keeping it red with a person promoting each such period."
  open_questions: []
- id: REQ-DASH-272
  title: "A dataset page awaiting a decision also gives the warehouse's status, and its cross-table checks show each result against what's staged and against what's in the warehouse"
  date_written: '2026-10-21'
  story: "As a data team leader opening a dataset whose newest supply is awaiting a decision, I want the page to say whether the supply actually in the warehouse is green, and each cross-table check to show what it found against what's staged and against what's in the warehouse, so that I can tell 'a bad file is waiting' from 'the warehouse is broken' at a glance, while an engineer can still read the full explanation."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-20 evening and 2026-10-21 morning ('Warehouse view: option 2. The awaiting line gains a clause giving the in-place supply's status'). Keith, 2026-10-22: Q12 = A (every cross-table row says what it read, structured, as-at, two exempt kinds); S6 row display = A (a row whose staging verdict and warehouse re-check differ shows both); row density = Option C 'with stacked results on phone' (review-dashboard-ux-v3-density.md, after mock-ups mockup-density-option-c.png and -option-c-phone.png); Q5 = A wording; the joint-promotion history row. Dashboard UX review of v3: D1, D2, D3, D4, N4, N5. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Dashboard UX review of v4: B1, S1 to S5, the hide-empty-column recommendation, open questions A and B. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "WHERE a dataset page's verdict line says the newest supply is awaiting a decision and names the supply in the warehouse (REQ-PIPE-081 criterion 1), THE SYSTEM SHALL end it with that supply's status on the date on show, counted by REQ-PIPE-269, worded 'The supply in place in the warehouse is the one received <instant>, and is <status>.' with <instant> as fmtInstant gives it and <status> as STATUS_LABEL gives it - for example 'The supply in place in the warehouse is the one received 9:00am Monday, 1 July 2024, and is Green.'"
  - "THE SYSTEM SHALL show <status> with the status legend's own word and icon, never colour alone."
  - "THE SYSTEM SHALL word the clause for every case: green or amber '..., and is <status>.'; red and promoted while red '..., and is Red: it was promoted while red.'; red since promotion '..., and is Red: it turned red <time>, after <cause>' (redPromotedBadge's wording) - WHERE the cause is a person's promotion, naming that person from the decision log - and SHALL put the in-the-warehouse half on its own line at phone width."
  - "WHERE the supply in the warehouse for the period is inherited or substituted, THE SYSTEM SHALL word the clause 'The supply in place in the warehouse is the one carried forward from <period> (received <instant>), and is <status>.', judging it as at the date on show from the promotion timeline (promotionStateOn), not from the latest promotion state."
  - "WHERE nothing is in the warehouse for the period, THE SYSTEM SHALL say 'Nothing is in place in the warehouse for this period yet.'"
  - "THE SYSTEM SHALL show a dataset's cross-table checks as a grid with ONE ROW PER CHECK, not per tool, in crossTableRowOrder's relationship-then-name order, under the columns 'Check', 'Against what's staged' and 'Against what's in the warehouse', each row naming the check and, under its name, '<declared on> → <reads>' (REQ-DASH-264 criterion 2), and carrying one status pill that is the gate's reading of the check - the result REQ-PIPE-269 counts toward the supply on show; SHALL omit a result column that holds no result in any row of the page, keeping the other column's heading, and SHALL NOT show a column of dashes; and on the page of a supply awaiting a decision SHALL caption the grid, in the section blurb's slot, 'Results for the supply received <instant>, awaiting a decision', so that a lone 'Against what's in the warehouse' column is never read as the warehouse supply's own result."
  - "THE SYSTEM SHALL place a result, judged as at the date on show from the promotion timeline and decided in the Python build from REQ-PIPE-279's per-check read record (each other-table supply the check read, and whether from staging or the period) and the structured reason code, never from text: in the 'Against what's in the warehouse' cell where every other-table supply the check read was in the warehouse; in the 'Against what's staged' cell - on the page of a WAITING supply only - where an other-table supply it read was waiting and none had left; and in NEITHER cell where an other-table supply it read was neither waiting nor in the warehouse (superseded, rejected, or replaced in the warehouse since), that result staying only in the check's panel history under its 'Read against' sentence - taking the newest such result per cell by REQ-PIPE-279's rank, and showing a dash in a cell with no result."
  - "THE SYSTEM SHALL show in each filled cell the result's word - the WORST of its marks, through rollupStatuses, never the first tool's - then one mark per tool in the fixed order dbt, Soda, datacontract-cli (✓ for a pass, ✗ for a fail, the page's existing marks for any other result, and '·' holding the place of a tool that has no such check), and a short plain-text note of which supply of the other table was read - '<dataset> received <day>' (fmtDay, adding the time only where two supplies of that table share a day), '<dataset> received <day>, carried forward from <period>' for an inherited one, or 'no <dataset> in the warehouse for <period>' where none was."
  - "WHERE a check's two cells differ and the result counted toward the gate is the warehouse one - whichever run recorded it, a re-check of REQ-PIPE-267 criterion 6 or an earlier arrival's result against the warehouse - THE SYSTEM SHALL fill both cells, end the warehouse cell's note with '— why it is held back', carry criterion 14's 'read against a supply itself awaiting a decision' sentence in the row's accessible name, and take the row's pill from the gate - for S6, Escalation completeness reads 'Pass ✓ ✓ ✓, Investigations received 2 Oct' against what's staged and 'Fail ✗ ✗ ✗, Investigations received 1 Jul — why it is held back' against what's in the warehouse, with a Red pill."
  - "WHERE a check's result in the warehouse is the owed re-check of REQ-PIPE-269 criterion 5, THE SYSTEM SHALL show 'Not yet re-checked' in the warehouse cell with the note '<dataset> promoted <day>'."
  - "THE SYSTEM SHALL end the grid with a key line, 'The marks are dbt, Soda and datacontract-cli, in that order; · means that tool has no such check. Select a check for each tool's full result.', showing the marks themselves (✓ ✗ ·)."
  - "THE SYSTEM SHALL make each whole row the existing <button class=\"scope-check\"> that opens its check's panel, as every other scope section's row is, with its aria-label extended to spell out each tool's result by name and to carry the full sentences of this criterion and of criterion 13; SHALL keep the cell notes plain text with no link inside the row; and the panel SHALL show each tool's full result and, for each, the full sentence of what it read - 'Read against the <dataset> in place in the warehouse, received <instant>', 'Read against the <dataset> supply received <instant>, not in place in the warehouse yet', 'Read against the <dataset> in place in the warehouse for <period>, carried forward from <period> (received <instant>)' 'Read against: no <dataset> in place in the warehouse for <period>', or, for a result in neither cell (criterion 7), 'Read against the <dataset> received <instant>, since replaced in the warehouse by the one received <instant>' or 'Read against the <dataset> received <instant>, since turned down' - the same sentences in the compare list - with REQ-DASH-264 criterion 7's sentence, and, for a could-not-run result, one clause saying it counts only against the table that asks the question."
  - "WHERE a result was recorded by a re-evaluation REQ-PIPE-267 criterion 6 made, THE SYSTEM SHALL give it in the panel and the accessible name, in place of the 'Read against' sentence, as 'Re-checked <time and day> against the <dataset> in place in the warehouse (received <instant>): the <dataset> received with this supply was held back.' (or, for a joined supply, ': the <dataset> waiting for a decision (received <instant>) is held back.') or, where none was in the warehouse, 'Could not be checked <time and day>: no <dataset> is in place in the warehouse, and the <dataset> received with this supply was held back.' (or the joined form); and WHERE it is the owed re-check, 'Not yet re-checked against the <dataset> promoted <instant>; the re-check runs on the next processing pass.'"
  - "WHERE a waiting supply's staging result was read against a supply that is itself awaiting a decision, THE SYSTEM SHALL say so in the panel, naming that supply's receipt."
  - "THE SYSTEM SHALL render every dataset name in this requirement's panel sentences and in the verdict line's clause as a real link (<a href>) to that dataset's page at the same date on show, built with navHref / affectsLinks, SHALL NOT put a link inside a row's button, and SHALL render every name as text, never markup."
  - "AT PHONE WIDTH, THE SYSTEM SHALL stack each check's results under its name, each starting with its view's label - 'Staged:' or 'In the warehouse:' - SHALL omit a view with no result rather than show a bare dash, and SHALL keep the row's status pill wholly visible inside the viewport."
  - "THE SYSTEM SHALL show the re-evaluations of one gate application (REQ-PIPE-267 criterion 6) about a dataset's own supply as ONE re-check point keyed on that gate application (REQ-PIPE-279's point key as amended by REQ-PIPE-267 criterion 11), labelled 're-checked against the <dataset> in place in the warehouse', showing its last round only, and SHALL NOT merge it into that supply's delivery point or count it as a second arrival; and WHERE a panel compares a point with an earlier one (REQ-PIPE-279, N1 = B), THE SYSTEM SHALL compare within one grid bucket - staged with staged, warehouse with warehouse."
  - "THE SYSTEM SHALL take a supply's pill, counts, rollups and grid cells from the results REQ-PIPE-269 counts at the date on show, through the build's one function, and SHALL NOT show in those a result about a supply of another table not in the warehouse; and SHALL show in its history and its trend every evaluation of the supply on show (REQ-PIPE-279: every evaluation its own point), a result whose partner has since left included, so that a hold-back the history records is never missing from the trend."
  - "WHEN a waiting supply is rejected or superseded, THE SYSTEM SHALL show the page from the in-warehouse supply's results from that decision's date on, as clipDatasetToInPlaceOn does today for a withdrawn run."
  - "WHERE a supply was promoted in one gate application with others (REQ-PIPE-266 criterion 10) - a package, or supplies joined from an earlier hold-back (REQ-PIPE-267 criterion 2) - THE SYSTEM SHALL say so on its supply-history row, 'Promoted <time> with the <dataset> supply received <instant>, by the rule', naming up to three supplies and, past three, the first two and 'and <n> more'; and WHERE the rule promoted it after a re-check against the warehouse, 'Promoted <time> by the rule, re-checked against the <dataset> in place in the warehouse (received <instant>) because the <dataset> received with it was held back.' (or the joined form)."
  - "THE SYSTEM SHALL word a page's verdict line, WHILE its supply's gate is not yet applied or its gate application has not settled, in the form that applies, computed at build from the owed 'gate' item, the packages' runs and qa.gate_application: an arrival of a package whose own run is not yet recorded, 'Being checked with its delivery (received <instant>): <n> of <m> files checked. Nothing needs deciding yet.', with no status pill other than that line and no check results until its own run is recorded; a checked arrival whose package-mates are not all checked, 'Checked, waiting for the rest of its delivery (received <instant>): <n> of <m> files checked. Nothing needs deciding yet.'; a package every file of which is checked but not gated, a package of one whose gate is owed, or a supply of an application not yet settled, 'Checked, being gated (received <instant>). Nothing needs deciding yet.'; adding, where a package-mate's run stopped, '<dataset>'s run stopped; the next processing pass re-runs it.'; and SHALL NOT show any of them as 'Awaiting a decision' or green before its gate is applied."
  - "THE SYSTEM SHALL compute the clause, each cell, note and sentence, and the history row at build time in Python from recorded QA results and the decision log, naming every supply through ONE Python helper (so that the period-clarity work changes supply naming once), and SHALL NOT re-derive them in the page's script."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-081 criterion 1, REQ-DASH-264 criteria 2, 5 and 7 and non-functional requirement 2 with the wording in summary-v4.md, summary-v5.md and summary-v6.md once Keith has approved it."
  - "THE SYSTEM SHALL have real-browser tests, tests/test_dashboard_e2e.py::TestWarehouseAndStagingViews, against a dashboard built from a fixture history, written first and seen to fail: S1 green branch - Notifications' page reads 'Awaiting a decision' for v2 and 'The supply in place in the warehouse is the one received <v1 instant>, and is Green.'; S6 - Escalation completeness is one row with Pass in the staged cell, Fail and '— why it is held back' in the warehouse cell and a Red pill, and its accessible name carries both full sentences; S4 - Clients' page after Notifications v2's hold-back reads Green with no result from Notifications v2's run; STAGGERED (dashboard UX v4 B1) - Notifications v2 at 09:00 read against Clients v1, Clients v2 at 09:05 promoted alone, and Notifications v2's page shows its 09:00 result in neither cell and its 09:05 result in the warehouse cell; an in-warehouse page shows one result column, headed 'Against what's in the warehouse', and no '—' cell; each of criterion 21's forms - an unchecked package member reads 'Being checked with its delivery' with no pill and no results, a checked one 'Checked, waiting for the rest of its delivery', a fully checked or contended one 'Checked, being gated'; an awaiting page captions its grid 'Results for the supply received ..., awaiting a decision'; staggered Order B red at 09:05 - Clients' row shows both cells with '— why it is held back' though the warehouse result came from its 09:00 arrival; a result in neither cell carries 'since replaced in the warehouse' in its panel; Clients' trend after Order A keeps its 09:00 point; on a held table's page no red row sits under a non-red cross-table pill; an inherited supply's clause; the owed re-check; the joint-promotion history row; after a rejection the page reads the in-warehouse supply's verdict; and at 375px wide every row's pill is inside the viewport and each stacked result starts 'Staged:' or 'In the warehouse:'."
  - "THE SYSTEM SHALL have a JS test, tests-js/cross-table-grid.test.js, written first and seen to fail, asserting that a cell whose tools disagree (dbt pass, Soda fail) reads Fail, and that a two-tool check shows '·' in the missing tool's place."
  non_functional_requirements:
  - "NO FALSE GREEN AND NO FALSE ALARM: the newest supply's red stays the headline (REQ-PIPE-081 criterion 1's 2026-10-05 reason), and the clause stops a reader concluding the warehouse is broken when it is not."
  - "NO HALF-AND-HALF VIEW, MADE VISIBLE (Keith, Q12 = A): the two columns are the two views; no cell mixes them."
  - "DENSITY (Keith, 2026-10-22, Option C): about a third of the lines the per-tool rows took in the S6 mock-up; the long sentences are one selection away and always in the accessible name, for 'a sort of wider audience of engineers'."
  - "ACCESSIBILITY: status word and icon, never colour alone (REQ-DASH-070 criterion 6); the marks are explained by a visible key and spelled out in each row's accessible name; no interactive element nested in another."
  - "PERFORMANCE: the in-warehouse status, the cell placement and the notes are computed per result at build from REQ-PIPE-269's date windows; no per-render history walk."
  - "SCALE (~30 collections): one row per relationship however many tools ran it, so a table read by many others lists one labelled row per relationship (amended REQ-DASH-264 NFR 2)."
  - "COMPATIBILITY: no new asset; file:// and offline viewing unaffected; the in-place-on query parameter is kept by every link."
  dependencies:
