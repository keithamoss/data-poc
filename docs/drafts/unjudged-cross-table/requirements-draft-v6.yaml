- id: REQ-DASH-277
  title: "'In place' reads 'in place in the warehouse' wherever it is shown to a person"
  date_written: '2026-10-22'
  story: "As anyone reading the dashboard or the terminal, I want 'in place' to say where - 'in place in the warehouse' - so that I never have to guess whether a supply is merely received, staged, or actually in the warehouse that other people query."
  moscow: should
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-22, during #95 v3's sign-off: 'in place' becomes 'in place in the warehouse' wherever the phrase is shown to a person, in #95's wording and everywhere it is already exposed (about 33 uses in the dashboard template and 12 in the CLI, plans/running-thoughts.md #116). A change to built, signed wording, so its own small requirement, outside #95's batch but landing with it. Drafted by delivery-scoper 2026-10-22. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Open question A taken as both reviews recommended ('In the warehouse on', ids and parameter kept), to mention at the walk-through. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "THE SYSTEM SHALL show the phrase 'in place in the warehouse' wherever the dashboard shows a person 'in place' meaning a supply in a period's warehouse schema - the verdict line ('... which is not in place in the warehouse yet. The supply in place in the warehouse is ...', 'Nothing is in place in the warehouse for this period yet.', 'The results below are the supply in place in the warehouse, received ...'), the date control's panel heading and body ('What was in place in the warehouse on a date', 'Shows, for every dataset, the supply that was in place in the warehouse on the date ...'), and the past-date notices ('Showing what was in place in the warehouse on <date>', 'You are viewing what was in place in the warehouse on ...')."
  - "THE SYSTEM SHALL show the same phrase in the terminal wherever it means the same thing - the door's and the queue's state words ('in place in the warehouse (promoted)', 'in place in the warehouse, awaiting acknowledgement', 'in place in the warehouse - <reason>') and 'the supply in place in the warehouse is not one of these.'"
  - "THE SYSTEM SHALL label the date control 'In the warehouse on' - on its button and on the panel's <label for=\"in-place-on-input\"> - and use the same words, in lower case, wherever a shown label repeats it: the scenario label ('<scenario id> · in the warehouse on <date>'), the jump label, the scenario-not-found message, REQ-DASH-182's 'Pick a later date ...' sentence, the generated scenario register and mothman scenarios' 'where' line."
  - "THE SYSTEM SHALL NOT change the idiom 'in place of', code comments, docstrings, function and variable names, element ids or the date control's query-string parameter (in-place-on), so that every saved link and snapshot keeps working."
  - "THE SYSTEM SHALL use 'in place in the warehouse' in every wording drafted for #95 (REQ-DASH-204, REQ-DASH-272, REQ-DASH-275, REQ-PIPE-267, REQ-PIPE-271, REQ-PIPE-276, REQ-PIPE-280), and SHALL keep every terminal line it lengthens within 80 columns and meaningful when piped, shortening names with filing_tui's existing shortening rather than wrapping them."
  - "THE SYSTEM SHALL amend, in the same change, the quoted wording of REQ-PIPE-081 criteria 20 and 23, REQ-DASH-182 criterion 3, REQ-DASH-208 criterion 4, REQ-GEN-199 criterion 18 and REQ-GHUB-229 criterion 5, with the wording in summary-v4.md, summary-v5.md and summary-v6.md once Keith has approved it, changing nothing else any of them requires; and SHALL leave requirement prose that uses 'in place' as the register's own term, rather than quoting what a person sees, unchanged."
  - "THE SYSTEM SHALL update, in the same change, every existing test that asserts the old shown wording - each seen to fail against the new wording first - and SHALL add a real-browser test, tests/test_dashboard_e2e.py::TestInPlaceInTheWarehouse::test_no_visible_text_says_in_place_alone, which walks every visible text node of the DATASET and COLLECTION views of a dashboard built from a fixture history, with a past date selected and an awaiting supply on show, asserts that some do say 'in place in the warehouse' (so it cannot pass on an empty page), and asserts that none says 'in place' without 'in the warehouse' after it, other than 'in place of' - leaving out the Release Notes and Plans views, which render CHANGELOG.yaml and plans/ text that legitimately says 'in place'."
  - "THE SYSTEM SHALL carry a CHANGELOG.yaml entry for the change in the same push."
  non_functional_requirements:
  - "CLARITY FOR A WIDER AUDIENCE (Keith): the warehouse is the thing other people query; 'in place' alone left the reader to infer it."
  - "LENGTH: the phrase adds about 17 characters to every long sentence (dashboard UX density review); the verdict line's in-the-warehouse half already moves to its own line at phone width (REQ-DASH-272 criterion 3), and the date control's label is the one place the long form does not fit, hence its short form 'In the warehouse on'."
  - "COMPATIBILITY: identifiers and the query-string parameter are unchanged, so links, bookmarks and the scenario jump keep working; committed snapshots (dashboard/snapshots/*.html.gz) keep the wording of the day they were taken, deliberately."
  - "MAINTAINABILITY: shown wording only; no rename of code, so the change is small and reviewable."
  dependencies:
  - REQ-PIPE-081
  - REQ-DASH-182
  - REQ-DASH-208
  - REQ-GEN-199
  - REQ-GHUB-229
  decisions:
  - "SAY WHERE (Keith, 2026-10-22): 'in place' becomes 'in place in the warehouse' wherever the phrase is shown to a person, here and everywhere else it is already exposed. Its own requirement because it changes built, signed wording outside #95."
  - "THE COUNTS, CHECKED (delivery-scoper, 2026-10-22): 'about 33 uses in the dashboard template and 12 in the CLI' are raw counts that include code comments and the idiom 'in place of'. The SHOWN uses found on 2026-10-22 are about fourteen lines of the template (the verdict line, the date control and its panel, the past-date notices, the scenario labels) and five in the CLI (filing_tui's state words and its 'supply in place' line, and mothman scenarios' 'where' line). The build-time Python adds none of its own. The rest are comments or 'in place of'."
  - "SHOWN WORDING, NOT THE REGISTER'S VOCABULARY (delivery-scoper, PROPOSED): requirement prose using 'in place' as a term of art (REQ-DASH-180, 197, 225 and many others) is not changed; only criteria that QUOTE what a person sees are amended. REQ-PIPE-081 criterion 26's sweep of register prose for the 'In place on' rename is the precedent against which this is a deliberate narrowing: the register's term is fine for its readers; the page's reader is the one who needs 'in the warehouse'."
  - "THE PICKER LABEL IS REQ-PIPE-081 CRITERION 20, NOT CRITERION 6 (delivery-scoper, checked 2026-10-22): summary.md named criterion 6; criterion 6 is about saying a decision changed an earlier date's view."
  - "THE DATE CONTROL READS 'IN THE WAREHOUSE ON' (v4 open question A, taken as the dashboard UX review and the architect recommended, to mention at the walk-through): it answers the question the picker asks and fits the narrowest control. The element ids and the in-place-on parameter stay, so no saved link needs a second redirect (spa-best-practices: never break a shared link); the cost is a visible 'in-place-on' in a copied URL, accepted. Needs only REQ-PIPE-081 criterion 23's amendment. REJECTED 'In place in the warehouse on' in full (too long for the control), keeping 'In place on' for the control alone (the one bare 'in place' left), and renaming the ids and parameter (a second old-link redirect, criterion 24 again)."
  - "BOTH PLACES THE LABEL APPEARS (dashboard UX review v4): the button (template line 952) and the panel's <label for=\"in-place-on-input\"> (line 1058), plus REQ-DASH-182's sentence (line 7239)."
  - "THE TEXT WALK IS SCOPED (architect v4 note): Release Notes and Plans render CHANGELOG.yaml and plans/*.md, which say 'in place' as history; walking them would fail the test on text this requirement does not own."
  - "80 COLUMNS (CLI review v4 note): the phrase adds about 17 characters to queue state cells."
  - "ONE NARROW CONTROL, TWO REQUIREMENTS (dashboard UX review v5 P4; period-clarity Q2 = B): the period-clarity work adds the period to this same button ('· 2026-Q3'); the two are coordinated before either is built, this one owning the label's words."
  open_questions: []
- id: REQ-PIPE-278
  title: "One ticket and one still-failing record per root cause, naming everything it holds back"
  date_written: '2026-10-22'
  story: "As the person told about supplies that need a decision, I want one ticket and one 'still failing' record for the supply that actually caused a hold-back, naming every supply it holds back, so that one bad file does not raise a ticket for every table that reads it."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-22, agreed batch ('All four as recommended'): Q6 = A, one ticket and one 'still failing' record per root cause, naming everything it holds back. Keith, 2026-10-22, Q5 = A and N1: an owed re-check, and a red because a partner is not due yet, should not page anyone. Drafted by delivery-scoper 2026-10-22. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "THE SYSTEM SHALL identify, for every waiting supply whose only failing checks are another table's doing - held back because another supply of its gate application was not promoting, a package-mate or a joined waiting supply (REQ-PIPE-267), or cross-table checks that could not run for want of another table (REQ-PIPE-270) - its ROOT CAUSE: the supply, or the absent table's slot, that the chain of structured causes ends at, through ONE function shared with REQ-DASH-204, REQ-DASH-275 and REQ-PIPE-210; and WHERE that root has since been rejected or superseded, THE SYSTEM SHALL treat the held-back supply as its own root."
  - "WHERE the ticket policy is 'needs-action' (REQ-PIPE-083 criterion 21), THE SYSTEM SHALL raise no ticket of its own for such a supply's slot, and SHALL name it, with its period, in the root cause's ticket under 'Also held back by this', reconciled as the root's ticket is."
  - "WHERE the root cause is a table not yet due, THE SYSTEM SHALL raise no ticket for the hold-back at all until that table is overdue, at which point the overdue slot's own ticket names the supplies it holds back."
  - "WHEN a re-evaluation leaves waiting supplies failing (REQ-PIPE-121 criterion 12), THE SYSTEM SHALL write ONE still-failing record per root cause, naming every supply it holds back, SHALL NOT write a separate record for a supply whose failing checks are all another table's doing, and SHALL NOT write one for a waiting supply whose failure the re-evaluation did not change."
  - "THE SYSTEM SHALL NOT raise a ticket or write a still-failing record for a supply whose only red is an owed re-check (REQ-PIPE-269 criterion 5)."
  - "WHERE such a supply ALSO has a failing check of its own, THE SYSTEM SHALL ticket and record it as today, naming the root cause beside its own failure."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-121 criterion 12 and REQ-PIPE-083 criterion 21 with the wording in summary-v4.md once Keith has approved it."
  - "THE SYSTEM SHALL have tests, written first and seen to fail: tests/test_root_cause_shouts.py::test_s2_strict_raises_one_ticket_naming_both (S2 strict as re-cast: Clients v2's ticket names Notifications v2; Notifications v2's slot has none); test_a_supply_whose_root_was_turned_down_is_its_own_root (S1 red, then Notifications v2 rejected: Clients v2 gets a ticket of its own, Notifications v2's no longer names it); test_staggered_order_b_red_raises_two_tickets (Clients v2's own, a real failure against Notifications v1, and Notifications v2's; neither names the other as held back); test_s14_placements_root_names_nothing_it_does_not_hold (Q13: only Placements is ticketed, naming nothing else); test_s1_green_writes_no_still_failing_record_about_unchanged_blank_values; test_not_yet_due_root_raises_no_ticket_until_overdue; and test_owed_recheck_raises_nothing."
  non_functional_requirements:
  - "NO TICKET STORM (~30 collections): one bad, widely read file raises one ticket, not one per reader."
  - "NO FLICKERING REDS (plans/running-thoughts.md #113): nothing is raised for a red that clears by itself - an owed re-check, a partner not yet due."
  - "NO FALSE QUIET: a supply with a failure of its own is still ticketed (criterion 6); only a red that is wholly another's is folded into the root's ticket."
  - "ONE ANSWER: the page, the queue and the tickets name the same root through one function, so they cannot disagree."
  - "SECURITY AND PRIVACY: tickets name datasets and periods, never rows or filenames (REQ-DASH-204 NFR 4's rule)."
  dependencies:
  - REQ-PIPE-083
  - REQ-PIPE-121
  - REQ-PIPE-266
  - REQ-PIPE-267
  - REQ-PIPE-269
  - REQ-PIPE-270
  - REQ-DASH-204
  - REQ-PIPE-210
  - REQ-PIPE-279
  decisions:
  - "ONE PER ROOT CAUSE (Keith, 2026-10-22, Q6 = A, agreed batch): follows his v2 Q6 and Q7 answers ('the missing table's own ticket carries it') and is what red-driven notifications need at ~30 collections. The architect called it 'now necessary rather than tidier' once one bad file could hold back a delivery. REJECTED Q6 B (each red supply its own ticket and record, like any red): one bad Client Register file could raise a ticket for every table that reads it."
  - "NO RECORD FOR A FAILURE THE RE-EVALUATION DID NOT CHANGE (delivery-scoper, carried from v3's Q6 option A, which Keith accepted): in S1's green branch, Clients v2's promotion would otherwise write 'left 1 waiting supply failing: Notifications' about blank values nobody's promotion affected."
  - "NOTHING FOR A RED THAT CLEARS BY ITSELF (Keith, 2026-10-22, Q5 = A: 'No notification is sent for that red unless the re-check itself fails'; N1: a red lasting days because a partner isn't due yet 'should not page anyone'). Tickets and still-failing records are the notifications that exist today; #113 decides the rest."
  - "ITS OWN REQUIREMENT (delivery-scoper): the rule spans the decision log's record (REQ-PIPE-121) and the ticket policy (REQ-PIPE-083), and neither the gate nor any display requirement is the right home."
  - "A ROOT TURNED DOWN OR REPLACED STOPS BEING THE ROOT (architect v4 S8; Keith's Q10 = A): once the root is rejected or superseded, REQ-PIPE-210 criterion 6, REQ-DASH-275 criterion 6 and REQ-DASH-204 criterion 16 say the held-back supply needs its own decision, so it needs its own ticket - v4's criteria 1 and 2 would have left it with none."
  - "A JOINED WAITING SUPPLY IS A CAUSE TOO (delivery-scoper, 2026-10-23, walking the staggered case): with REQ-PIPE-267's transitive gate, the supply that holds another back may have arrived separately; v4 named only a package-mate."
  - "THIS REQUIREMENT OWNS 'NOTHING RAISED FOR AN OWED RE-CHECK' (architect v4 note): REQ-PIPE-269 criterion 6 of v4 said the same and is removed. A 'no-current-result' red (REQ-PIPE-269 criterion 5) is NOT exempt: it does not clear by itself."
  - "TWO TICKETS IN STAGGERED ORDER B RED (architect v5, agreeing with v5 reading 3): Clients v2's 9:00 hold-back is a real failure against Notifications v1 naming no other supply; joined at 9:05 its outcome is unchanged and no new entry is written (REQ-PIPE-266 criterion 9), so there is no cause linking it to Notifications v2. REQ-PIPE-276 links the two rows instead."
  open_questions: []
- id: REQ-PIPE-280
  title: "A person carries a newer supply forward into a later period in one decision, so no reader goes red in between"
  date_written: '2026-10-23'
  story: "As the person answerable for a quarterly collection, I want to carry a newer promoted supply forward into a later period in one step, replacing what that period carries forward (or giving it one where it had none), so that acting on a stale-inheritance warning never leaves the period holding nothing for that table, and no reader turns red and raises a ticket for a gap I am about to close."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-22, V4-Q2 = A, answering the CLI UX review of #95 v4 (review-cli-ux-v4.md B2): 'one carry the newer one forward step (door + flags) doing un-inherit + inherit as one decision with one re-check of the readers (same shape as 121 c9), so nothing turns red between. Widens REQ-PIPE-099 by one operation.' Drafted by delivery-scoper 2026-10-23 as its own small requirement, so REQ-PIPE-271 stays the warning and this the operation. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "THE SYSTEM SHALL offer a CARRY-FORWARD operation for one dataset and one period at a time - from that period's door (REQ-GHUB-229), by flags ('mothman supply decide --operation carry-forward --dataset <id> --period <period> --reason <why>'), and from every other operator route that offers inherit and un-inherit (REQ-PIPE-099 criterion 8) - outside the queue of supplies awaiting a decision (REQ-PIPE-099 criterion 7)."
  - "THE SYSTEM SHALL take the period's per-(collection, period) lock for a carry-forward as for any table-moving decision (REQ-PIPE-266 criterion 16), refusing with exit 75 while a gate application holds it."
  - "WHEN a person carries a dataset forward into a period, THE SYSTEM SHALL make that period stand on the newest promoted supply of that dataset in an earlier period - replacing the inherited view it had, or creating one where its inheritance was refused - as ONE decision-log entry, in one decision transaction, naming the operator, the period, the dataset, what the period stood on before (or that it stood on nothing) and what it stands on now, with a mandatory reason; and SHALL NOT record it as an un-inherit followed by an inherit."
  - "THE SYSTEM SHALL NOT let a committed state exist in which the period, having carried a supply of that dataset forward before the operation, carries none."
  - "WHEN a carry-forward commits, THE SYSTEM SHALL run ONE re-evaluation of every cross-table check that reads that dataset in that period, whichever dataset it is filed under (REQ-PIPE-099 criterion 11), after the decision commits - the shape of REQ-PIPE-121 criterion 9's one re-evaluation per decision - and SHALL owe it, as any re-evaluation is owed, if it cannot run at once."
  - "IF the period holds a promoted supply of its own for that dataset (REQ-PIPE-099 criterion 12), or the schedule says the dataset participates in that period (REQ-PIPE-099 criterion 9), THEN THE SYSTEM SHALL refuse, worded '<period> holds a <dataset> supply of its own, so nothing is carried forward into it.' or '<dataset> takes part in <period>, so it is supplied there, not carried forward.', record nothing and exit 1 on the flag route; and WHERE the period already carries forward the newest promoted supply, THE SYSTEM SHALL treat it as a NO-OP, not a refusal - '<period> already carries forward the newest promoted <dataset> (received <instant>). Nothing to do.' in the 'Already so' panel, nothing recorded, exit 0 (REQ-GHUB-082 criterion 26)."
  - "THE SYSTEM SHALL list among the operation's consequences, before confirming (REQ-GHUB-082's consequences key, needed with --yes), the supply it stops carrying, the supply it carries instead, and each reader whose cross-table checks are re-run against it, naming any whose last check against the new supply already failed."
  - "THE SYSTEM SHALL say, in the operation's undo line (REQ-PIPE-128 criterion 6), 'There is no step back to the supply received <instant>; un-inherit removes what <period> carries forward, and leaves its readers with no table.'; after it commits, SHALL list in _follow_up every reader re-checked and its outcome, or 'Re-evaluation owed' with 'mothman pipeline process' on a line of its own where the re-evaluation could not run, exiting 0; WHILE REQ-PIPE-271's warning stands, SHALL add to inherit's 'already inherits. Nothing to do.' (filing_decisions.py:728-730) 'A newer <dataset> could be carried forward:' and the carry-forward command; SHALL name carry-forward, in un-inherit's consequences, as the way to re-point without a gap; and SHALL describe it in --help as 'inherit the newest promoted supply, replacing what this period carries forward (or giving it one)'."
  - "WHEN a carry-forward commits, THE SYSTEM SHALL clear REQ-PIPE-271's warning for that period and dataset (REQ-PIPE-271 criterion 8)."
  - "WHILE the re-evaluation a carry-forward owes has not run, THE SYSTEM SHALL read each in-warehouse reader's affected checks as 'recheck-owed' (REQ-PIPE-269 criterion 5), raising no ticket or still-failing record for them (REQ-PIPE-278 criterion 5)."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-099 criteria 1, 2 and 10 with the wording in summary-v5.md once Keith has approved it."
  - "THE SYSTEM SHALL have tests/test_carry_forward.py, written first and seen to fail: test_stale_inheritance_is_repointed_in_one_decision (2024-Q4 carrying 2024-Q2's Case Workers while 2024-Q3's is promoted; one carry-forward; exactly one decision-log entry and one re-evaluation; 2024-Q4 then stands on 2024-Q3's); test_no_reader_is_ever_red_for_want_of_the_table (after every commit of the operation, no reader of Case Workers in 2024-Q4 records a could-not-run, and no ticket or still-failing record is written); test_a_refused_inheritance_is_made_by_the_same_operation; test_it_refuses_over_a_promoted_supply_or_where_the_dataset_participates (exit 1, each wording); test_a_second_carry_forward_is_a_no_op_exit_0; test_refused_while_a_gate_holds_the_period (exit 75); test_undo_and_follow_up_lines; test_inherit_noop_names_carry_forward_while_the_warning_stands; and tests/test_cli_carry_forward.py::test_door_and_flags_offer_it_with_its_consequences (the door and the flag form both offer it, list its consequences and need the key with --yes)."
  non_functional_requirements:
  - "NO FLICKERING REDS (plans/running-thoughts.md #113, Keith's reason for V4-Q2 = A): the re-point never passes through a state with no table, so no reader's red can appear and clear by itself, and no ticket is raised for it."
  - "AUDITABILITY: one decision-log entry says what the period stood on before and after, by whom and why; the knock-on names it as its cause."
  - "SCRIPTABILITY: one command, refusals exit 1, consequences keyed for --yes, as every other filing decision."
  - "DETERMINISM AND REPLAY: an operator action, never automatic (REQ-PIPE-098 decision 8, Keith's 'by operator command'); a replay reaches the same state from the same log."
  - "SCALE (~30 collections): one dataset and one period per operation, as inherit and un-inherit; the re-evaluation is bounded by that dataset's readers in that period."
  - "SECURITY: nothing widened - the operator allowlist, actor and mandatory reason of REQ-PIPE-099 apply."
  - "THE BUILD RULE: the dashboard reads the decision log; nothing here touches supply rows outside the run the re-evaluation already makes."
  dependencies:
  - REQ-PIPE-099
  - REQ-PIPE-271
  - REQ-PIPE-121
  - REQ-PIPE-269
  - REQ-PIPE-278
  - REQ-GHUB-082
  - REQ-GHUB-229
  - REQ-PIPE-098
  decisions:
