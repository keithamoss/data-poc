  - "THE EXEC VIEW'S EXTRA SENTENCE IS DROPPED KNOWINGLY (dashboard UX review v4, v3 shape item 4): the exec view has no explanation element of its own for a sentence to extend (renderExec), and the card line of criterion 4 already appears on the exec card."
