- id: REQ-PIPE-276
  title: "The terminal says what a package gate did: what was held back and by what, what to decide first, and what an override will set off"
  date_written: '2026-10-22'
  story: "As the person working through Child Protection supplies in the terminal, I want every place the terminal reports a gate to say which supply was held back by which, what was re-checked against the warehouse, which decision clears it, and what my own decision will set off, so that I decide the one thing that matters and am never surprised by what the rule does next."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-22: Q8 = A (queue placement, REQ-PIPE-210), the mid-gate refusal wording (REQ-PIPE-266 criterion 15), Q10 = A. The CLI UX review of v3 (review-cli-ux-v3-draft.md): the exit-code rewording and test, the next-step condition and named surfaces, the vocabulary, the locus clause, terminal grouping by root, the override consequence text including T13/S5, and new scenarios N1 to N5. Carries v3's REQ-PIPE-267 criteria 11, 12 and 15. Drafted by delivery-scoper 2026-10-22. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. The CLI UX review of v4 (review-cli-ux-v4.md): S1 to S13 and its notes. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "THE SYSTEM SHALL use 'held back' for EVERY 'promotion-withheld' outcome on every terminal surface - the package gate's, the amber-hold stand-back's and the replacement stand-back's alike, lifecycle_report.outcome_of's 'withheld by the rule' becoming 'held back by the rule' - SHALL NOT use 'held' (REQ-PIPE-078), 'refused' or 'rejected' (REQ-PIPE-163 criterion 20) for it, and SHALL NOT list a held-back supply under 'Held - no period yet'."
  - "THE SYSTEM SHALL word a person's rejection, wherever the terminal reports what it did to a held-back supply's partner, as 'turned down', SHALL NOT pass that text through _gate_words (which rewrites 'refused' and 'rejected' as 'held back'), and SHALL NOT show 'rejected' in any text it prints after such a rejection."
  - "WHERE mothman cp qa, mothman bdm qa or mothman pipeline process touched a supply that ends held back on a red - a red from a re-check against the warehouse (REQ-PIPE-267 criterion 6) included - THE SYSTEM SHALL count that red toward has_failures and PassReport.red, SHALL feed the gate's outcome and its re-checks' results into mothman cp qa's and mothman bdm qa's own exit decision (one_table.py and many_tables.py exit on their own run's results today), and SHALL keep exit_status's full order - a failure 2 over the agreement backstop's refusal 3 over red 1 over OK 0, with EXIT_LOCKED 75 raised separately - and SHALL show the re-check's results in its report as a table headed 're-checked against the warehouse'."
  - "WHERE the terminal shows a supply held back because of another supply - in outcome_panel and in _recheck_panel - THE SYSTEM SHALL, while that other supply is waiting, name its decision as the next step first ('Decide cp-notifications <period> (received <instant>) - promoting it re-checks this one'), say that nothing needs deciding on this supply, and give the override as a complete command on a line of its own, carrying the real dataset id, period and supply id and leaving only '<why>' to fill in, ('mothman supply decide --operation promote --dataset <dataset> --period <period> --supply <supply> --reason '<why>'') followed by 'or from the <period> door'; and once the other supply is rejected or superseded, SHALL offer this supply's own decisions instead, worded from the decision log as it stands (REQ-DASH-275 criterion 6's wording)."
  - "THE SYSTEM SHALL show a held-back supply's reason as its 'promotion-withheld' entry words it (REQ-PIPE-267 criterion 13), including 'This supply's checks of its own data passed.' where they did."
  - "WHERE one hold-back holds back several supplies - a package, a joined waiting supply, or a chain through a cascade - THE SYSTEM SHALL show it under _grouped as the root's own line first, then ONE line per resulting outcome naming its supplies up to eight (lifecycle_report._NAMED) and then 'and <n> more', each naming the root and what it traces through; SHALL NOT print a cascade's intermediate states; SHALL label a package-mate 'held back with it (same delivery)' and a joined supply 'held back by it', the header saying '(1 more held back with it, listed beneath)' or '(1 more held back by it, listed beneath)'; SHALL render this grouping in the one renderer the Filing decisions queue and mothman supply queue share; and SHALL NOT print a Rich markup tag such as the card's '[Red]', using dataset ids and state words instead - as in this layout: '1 supply waiting on a decision in Child Protection (1 more held back with it, listed beneath)' / 'cp-notifications  2024-Q3  received 21 Oct 09:00  red - 3 of its own checks fail' / '  held back with it (same delivery):' / '  - cp-clients  nothing needs deciding on this supply - Client reference failed against the cp-notifications in place in the warehouse (received 1 Jul). Deciding cp-notifications settles it. To override:' / '    mothman supply decide --operation promote --dataset cp-clients --period 2024-Q3 --supply <id> --reason '<why>''."
  - "WHEN a person is about to promote a supply and a counted cross-table verdict it holds read a supply that is not in the warehouse, THE SYSTEM SHALL say so before the person confirms, naming that supply and saying the check is re-run against the warehouse once it is promoted (REQ-PIPE-121), and SHALL keep the promotion available on the same terms as today."
  - "WHEN a person is about to promote a supply whose knock-on would re-run a check already recorded red for the same pair of supplies (T13, S5: promoting S1-red's held-back Clients v2 re-checks Notifications v1 against it), THE SYSTEM SHALL list among the decision's consequences (apply_decision's consequences key) both ends and the state it will very likely leave - 'cp-notifications (in the warehouse, received 1 Jul) is re-checked against this supply. Client reference already failed for that pair (re-check <instant>), so cp-notifications will very likely become \"Promoted, then re-checked worse\".' - so that confirming needs that key with --yes."
  - "WHEN a person is about to promote a supply whose promotion would change a waiting supply's counted verdict - one it holds back, or one whose verdict against it passes while the waiting supply's counted verdict against the warehouse fails - THE SYSTEM SHALL list among the consequences that it re-checks them ('re-checks cp-clients' waiting supply received <instant>; if it is green, the rule promotes it'); WHEN a person is about to reject or supersede such a root, 'cp-clients (received <instant>) is not re-checked; it becomes a decision of its own in the queue'; and WHEN a person is about to promote over a could-not-run whose table is not yet due (REQ-PIPE-270 criterion 7), 'Client reference could not run: cp-clients is not due until <instant>. Promoting now promotes on a check nobody could run; it is re-checked when cp-clients is promoted.'"
  - "WHEN a person's decision has been applied and its knock-on has run, THE SYSTEM SHALL list (in _follow_up) every supply the knock-on re-gated - promoted, or still held back - with its outcome, and SHALL NOT list only the ones left incomplete."
  - "WHEN a person asks to decide on a supply whose package is still being checked or gated, THE SYSTEM SHALL show REQ-PIPE-266 criterion 15's refusal, in whichever of its forms applies and with its next-pass line where no run holds the package, before asking for a reason, the flag form exiting 75; and the period's door SHALL show that slot's supply as 'checking with its delivery (<n> of <m> files checked)' and offer no decision on it, so that the refusal is a backstop for the flag route only."
  - "WHILE a delivery's 'gate' item is owed, THE SYSTEM SHALL print its supplies, in the Filing decisions queue and in mothman supply queue, as ONE dim line of its own, worded 'Checking a delivery received <instant> (<n> of <m> files checked)' or 'Gating a delivery received <instant> (<m> of <m> files checked)', SHALL NOT count it among supplies waiting on a decision, and SHALL NEVER add it to the queue's select() choices - unlike 'Received while turned off', which is pickable; WHERE it is all there is, THE SYSTEM SHALL say 'Nothing is waiting on a person in <collection>.' with the dim line beneath it and ask no 'Which one?'."
  - "THE SYSTEM SHALL word an owed 'gate' item in mothman supply queue's owed list (supply._say_owed) as 'gate of the delivery received <instant> (<n> of <m> files checked)', or for a retried application 'gate of <period>, re-applied from recorded results', and SHALL NOT word it as a re-evaluation of a period's readers."
  - "WHERE an in-warehouse supply reads red only for 'recheck-owed' (REQ-PIPE-269 criterion 5), THE SYSTEM SHALL word it in the door and in _follow_up with REQ-DASH-204 criterion 7's sentence ('Not yet re-checked against the <dataset> promoted <instant>; the re-check runs on the next processing pass:') followed by 'mothman pipeline process' on a line of its own, and SHALL NOT show or offer it as 'Promoted, then re-checked worse'."
  - "WHERE the rule promoted a supply after re-checking it against the warehouse, THE SYSTEM SHALL say so in the kept report (lifecycle_report) and in outcome_panel: 'promoted by the rule - Client reference re-checked against the cp-notifications in place in the warehouse (received <instant>), green, because the cp-notifications received with it was held back' (for a joined supply, 'because the cp-notifications waiting for a decision (received <instant>) is held back')."
  - "WHERE a waiting supply is red on its own counted verdict against the warehouse and a later waiting supply's verdict against it passes (staggered Order B red), THE SYSTEM SHALL add, on its queue row and in its door, 'Client reference passes against the cp-notifications waiting for a decision (received 21 Oct 09:05); promoting that one re-checks this one.', and MAY carry the same line on its ticket."
  - "WHERE an arrival of a package is checked and waits because a package-mate's run stopped, THE SYSTEM SHALL say 'checked, waiting for its package - <dataset>'s run stopped at the <stage> stage; the next pass re-runs it and gates both' (or 'gates them all') followed by 'mothman pipeline process' on a line of its own."
  - "WHEN a person re-files one supply of a package into another period without the other supplies of that package, THE SYSTEM SHALL warn before confirming, naming the supplies left behind, and SHALL keep the re-file available."
  - "WHERE a supply is held back by a joined supply that arrived separately, THE SYSTEM SHALL show one dim line beneath it: 'Files sent separately are gated as each arrives; sent as one zip they are gated together (supplier guidance, REQ-DOCS-274).'"
  - "WHEN mothman supply decide is refused because a decision transaction's lock wait timed out (decision_log.RUN_IN_PROGRESS, REQ-PIPE-129 criterion 16), THE SYSTEM SHALL exit 75, as for every other 'nothing changed, try later' refusal on that command, and SHALL list 75's three causes - the delivery still being checked, a gate running for the period, a lock wait timed out - in the command's documented exit codes."
  - "THE SYSTEM SHALL show every line this requirement adds with NO_COLOR set, when piped and at 80 columns, without losing meaning, SHALL print each command below any panel or Rich table through _show's convention (soft_wrap=True, markup=False, highlight=False; post-build-review #112), whole on a line of its own and never inside a table cell, so it can be copied, and SHALL shorten dataset names in table cells with filing_tui's existing shortening rather than wrap them."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-129 criterion 16 with the wording in summary-v6.md once Keith has approved it."
  - "THE SYSTEM SHALL have tests, written first and seen to fail: tests/test_cli_package_gate.py::test_s1_red_qa_commit_exits_1_and_shows_the_recheck (mothman cp qa --commit on S1 red, with Clients v2 checked last and green on its own run, exits 1 and prints a 're-checked against the warehouse' table); test_waiting_first_file_exits_as_its_own_results_say (a first file red on its own data exits 1, a green one 0); test_every_promotion_withheld_says_held_back (lifecycle_report.outcome_of included); test_turned_down_never_says_rejected (outcome_panel after a rejection); test_next_step_names_the_package_mate_then_the_supply_after_rejection (the override command complete with the real supply id, no '<id>' placeholder, printed outside any table); test_grouped_by_root_prints_final_states_only (S5 cascade, up to eight names then 'and <n> more'); test_override_lists_the_worse_recheck_consequence (T13); test_override_over_a_not_yet_due_check_says_so; test_follow_up_lists_every_regated_supply; test_mid_gate_decision_is_refused_before_the_reason_prompt (exit 75 on the flag form); test_a_delivery_being_gated_is_a_quiet_uncounted_group (never in select(), and the only-a-gating-group case asks no 'Which one?'); test_supply_queue_shows_grouping_gating_and_the_carry_forward_warning; test_owed_gate_item_is_worded_in_supply_queue; test_the_door_offers_no_decision_while_checking; test_order_b_red_links_the_two_rows; test_a_lock_timeout_refusal_exits_75 (V5-Q2); test_a_persons_decision_refused_while_a_gate_runs_exits_75; test_owed_recheck_is_never_shown_as_rechecked_worse; test_rule_promotion_after_a_warehouse_recheck_says_why; test_crashed_sibling_wording; test_partial_refile_warns; and each surface under NO_COLOR, a pipe and 80 columns."
  non_functional_requirements:
  - "ONE VOCABULARY (CLI reviews of v2, v3 and v4): 'held back' for every 'promotion-withheld', 'turned down' for a person's rejection, dataset ids, state first - as the terminal's other lines."
  - "SCALE (~30 collections): one line per root and one per outcome, names up to eight; a cascade prints its settled state only; a delivery being gated is one uncounted line; names shortened in cells."
  - "NO SURPRISE OVERRIDES: every consequence beyond the decision's own slot is named before confirming - both ends and the likely resulting state - and needs its key with --yes (REQ-GHUB-082's existing mechanism)."
  - "SCRIPTABILITY: the exit code still says whether anything is red, in exit_status's full order; 75 means 'nothing was changed, try later' on every command that returns it; every printed command is complete and copyable."
  - "NO FLICKERING REDS (#113): an owed re-check is never presented as a supply re-checked worse, so nobody demotes a supply that is about to clear by itself."
  - "SECURITY: nothing widened; a person's decision keeps its allowlist, actor and mandatory reason."
  dependencies:
  - REQ-PIPE-266
  - REQ-PIPE-267
  - REQ-PIPE-210
  - REQ-GHUB-082
