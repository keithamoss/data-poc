- id: REQ-PIPE-210
  title: "The terminal's queue lists a supply held back only by another table beneath that table's own item, says nothing needs deciding on it, and does not count it"
  date_written: '2026-10-14'
  story: "As the person working through supplies waiting on a decision in the terminal, I want a supply that is held back only by another table - a package-mate held back, or a table it reads that could not be read - listed beneath that table's own item, saying that nothing needs deciding on it and which decision clears it, so that I deal with the one item that clears it instead of rejecting or promoting a supply with nothing wrong in its own data."
  moscow: should
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-14 morning, close-out Q19, option A: 'page and terminal; a small pipeline requirement drafted now for the terminal queue'. Re-folded for #95 on 2026-10-22 (delivery-scoper): Keith's Q8 = A ('the scoper's draft, not the CLI reviewer's A''): beneath the package-mate, not counted, 'nothing needs deciding', not pickable from the queue line, an override by naming it, its own counted row once the package-mate is rejected; Q10 = A. THIS VERSION REPLACES the close-out draft's when #95 is applied. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "WHERE every red check on a supply waiting on a decision is another table's doing - held back because another supply of its gate application was not promoting, a package-mate or a joined waiting supply (REQ-PIPE-267), or a cross-table check that could not run for want of another table, for any reason REQ-PIPE-270 criterion 4 names - THE SYSTEM SHALL show it in the terminal's queue ('mothman > Filing decisions > {collection name} > Supplies waiting on a decision') with a line saying that nothing needs deciding on this supply, naming the root cause (REQ-PIPE-278 criterion 1), and saying that its checks run again and the gate is applied again once that decision is made or a <period> <dataset> supply is promoted (REQ-PIPE-121); EXCEPT WHERE its root cause has no item of its own in that queue, when criterion 9 applies instead."
  - "WHERE the root cause has an item of its own in that queue - a supply waiting on a decision, an open contested pair or a held supply - THE SYSTEM SHALL list such supplies beneath that item, each named once, and where the hold-back runs through a chain, flat beneath the root, each line naming what it traces through; and SHALL NOT list them again as rows of their own."
  - "THE SYSTEM SHALL NOT offer a supply listed beneath its cause as a pickable decision from the queue line, SHALL give on its line the override as a complete command on a line of its own, with the real dataset id, period and supply id and only '<why>' to fill in, printed outside any table (REQ-PIPE-276 criterion 21), ('mothman supply decide --operation promote --dataset <dataset> --period <period> --supply <supply> --reason '<why>'') followed by 'or from the <period> door', and SHALL let its being held back by the package or a joined supply win, on that line, over ANOTHER_VERSION_WAITING (filing_queue.py:226)."
  - "WHEN a person reaches such a supply another way - by naming it, or from its period's door (REQ-GHUB-229) - THE SYSTEM SHALL say the same before offering any decision, SHALL name the root cause's decision first, and SHALL keep the supply's own decisions available on the same terms as today."
  - "WHERE a supply also has a red check of its own, THE SYSTEM SHALL list it and count it as today with a line naming the other table's cause, and SHALL NOT say that nothing needs deciding on it."
  - "WHEN the root cause's supply is rejected or superseded, THE SYSTEM SHALL list each supply it held back as a counted row of its own, worded from the decision log as it then stands ('The <dataset> file received with it was turned down; this supply now needs its own decision.'), and SHALL NOT show anywhere a 'waiting for' that can no longer happen."
  - "THE SYSTEM SHALL work out which waiting supplies this covers, their root cause and why, through the one function REQ-PIPE-278 criterion 1 names, which the dashboard's REQ-DASH-204 and REQ-DASH-275 lines also use, and SHALL NOT read supply rows or parse a reason's prose."
  - "THE SYSTEM SHALL count, wherever the terminal counts supplies waiting on a decision - the Filing decisions queue's own count and mothman supply queue - a cause with supplies listed beneath it once, SHALL NOT count a supply listed beneath its cause, and SHALL count a supply criterion 9 covers as one decision, so that the count is the number of things to decide."
  - "WHERE every red check on a waiting supply is another table's doing but its root cause has no item of its own in the queue - a partner slot that is overdue, with no held-back supply to sit beneath - THE SYSTEM SHALL list it as an ORDINARY COUNTED ROW, pickable like any other decision waiting on a person, with a line naming the root cause ('red because <dataset> for <period> is overdue; its checks run again once one is promoted'), and SHALL NOT say that nothing needs deciding on it."
  - "THE SYSTEM SHALL count supplies waiting for a person in the dashboard's agency and collection card breakdowns by the same rule as the terminal - a supply listed beneath its cause not counted, a supply criterion 9 covers counted - through the same one function (criterion 7), so that the page's counts and the terminal's agree."
  - "THE SYSTEM SHALL have fixture tests, written first and seen to fail, that drive the real queue: with a contested cp_clients pair and its three readers (listed once beneath the pair, not counted); with S2 strict as re-cast (Notifications v2 listed beneath Clients v2, not counted, not pickable, the complete override command shown); with Clients v2 then rejected (Notifications v2 its own counted row with the 'turned down' wording); with staggered S1 red (Clients v2 beneath Notifications v2 as 'held back by it'); with Notifications v2 red only because Clients is overdue and nothing to sit beneath (a counted, pickable row of its own naming the overdue Clients, never 'nothing needs deciding'); with the dashboard's Child Protection card counting that supply as waiting for a person, as the terminal does; and with a reader that has a failing check of its own (listed and counted as today)."
  non_functional_requirements:
  - "SCALE: at thirty datasets a widely read table can hold many readers red at once, and a delivery can hold several back; grouping them beneath the one item that clears them keeps the queue one row per cause."
  - "NO FALSE QUIET: the line is only shown where every red check is another table's doing (criterion 5); a supply with a fault of its own is never told nothing needs deciding."
  - "ONE ANSWER: the page and the terminal decide which supplies this covers through one function, so they cannot disagree."
  - "SECURITY: nothing is widened - an override keeps its allowlist, actor and reason; it is simply not offered from the queue line."
  - "TEST FIRST for criterion 5, the false-quiet guard."
