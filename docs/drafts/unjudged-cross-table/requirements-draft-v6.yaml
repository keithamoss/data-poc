  decisions:
  - "OPTION 2, A CLAUSE ON THE AWAITING LINE (Keith, 2026-10-21 morning). REJECTED sending the reader to supply history to find the warehouse's state, Keith's first guess."
  - "THE PAGE STILL LEADS WITH THE NEWEST SUPPLY (REQ-PIPE-081 criterion 1, amended 2026-10-05 by Keith): the clause adds the warehouse's state; it does not replace the newest supply's."
  - "EVERY ROW SAYS WHAT IT READ (Keith, 2026-10-22, Q12 = A, confirmed after the mechanism was explained): on both views, decided in the Python build from structured fields (qa.tables_read, the run's from_warehouse marker, the structured reason code), never from text, 'in place' judged as at the date on show. Two kinds of result are excepted from the 'Read against' sentence because their own sentence already names the partner: a package re-check against the warehouse, and could-not-be-checked for want of a partner (criterion 13). REJECTED Q12 B (only re-checked rows)."
  - "BOTH RESULTS ON A ROW WHERE THEY DIFFER (Keith, 2026-10-22, S6 row display = A, 'definitely option A', after mockup-s6-cross-table.png): the staging result and the re-check against the warehouse partner, the latter saying it is why the supply is held back; the row's status is the gate's."
  - "A GRID: ONE ROW PER CHECK, STAGED AND WAREHOUSE COLUMNS, STACKED ON PHONE (Keith, 2026-10-22, density Option C 'with stacked results on phone', after mock-ups of B and C on the real page). His concern: 'I think we could do something better here than just layering in lots of text, but I think having the longer descriptions there is useful to explain it to a sort of wider audience of engineers.' REJECTED Option A (one row per check with per-tool pill buttons) and Option B (one row per tool, the sentence once per group heading), and the v3 layout of one row per tool with every sentence repeated (the S6 mock-up's dual lines x3). The reviewer's caution on C - most rows fill one column - was seen on the mock-up and accepted."
  - "VOCABULARY AND FORMATS (dashboard UX review of v3, D2 and D3): 'held back', never 'was not promoted' or plain 'held'; 'received <instant>' in fmtInstant's form ('9:00am Monday, 1 July 2024'); STATUS_LABEL's capitalised word. D1: v3's criterion 2 and criterion 7 both printed the red-promoted text; criterion 3 alone carries it now."
  - "AN INHERITED SUPPLY IN THE CLAUSE (dashboard UX review of v3, N4): verdictLine's in-warehouse branch reads promotionState.promoted and may miss an inherited supply, saying 'Nothing is in place'; criterion 4."
  - "A HAND PROMOTION NAMES WHO (dashboard UX review of v3, N5): criterion 3."
  - "THE JOINT PROMOTION ON THE HISTORY ROW (Keith, 2026-10-22, agreed batch): criterion 20, replacing v3's proposed 'cleared minutes later' note (dashboard Q-F)."
  - "'IN PLACE IN THE WAREHOUSE' (Keith, 2026-10-22): every shown sentence here uses the new wording; REQ-DASH-277 makes the same change everywhere else."
  - "REJECTING RETURNS THE PAGE TO THE WAREHOUSE (Keith, 2026-10-21): already today's behaviour; criterion 19 makes it a tested claim."
  - "COLLECTION AND AGENCY ROLLUPS FOLLOW EACH DATASET'S NEWEST SUPPLY (Keith, 2026-10-22, Q11 = A): unchanged; REQ-DASH-275 adds the card line."
  - "A THIRD BUCKET (dashboard UX review v4 B1): v4's two cells had no place for a result that read a partner which has since left - in the staggered case Notifications v2's 09:00 result read Clients v1, which Clients v2 then replaced; 'Against what's staged, Client Register received 1 Jul' would have been a false label in the column whose whole job is to say which view a result belongs to. Such a result goes in neither cell and stays in the panel's history."
  - "THE CELL'S WORD IS THE WORST OF ITS MARKS (dashboard UX review v4 S1): 'Pass ✓ ✗ ✓' is the false-green direction; rollupStatuses decides the word."
  - "THE MARKS ARE POSITIONAL (dashboard UX review v4 S2): the key only decodes if every check shows all three positions; '·' holds a missing tool's place and the accessible name spells each tool out."
  - "THE ROW STAYS ONE BUTTON (dashboard UX review v4 S3): v4 made the check's name the control and the cell notes links, which shrank the click target from the whole row (as in every other scope section, template line 7855) to the name and left the row's accessible name undefined. Links live in the panel sentences and the notices."
  - "PHONE LABELS (dashboard UX review v4 S4): once stacked, the column headings are gone, so each result names its view; an empty view is omitted, never a bare dash."
  - "A STATE FOR 'CHECKED, WAITING FOR THE REST OF ITS DELIVERY' (dashboard UX review v4 S5; architect v4 note on the transient green): without it the supply fell through to 'Awaiting a decision', inviting a decision the terminal refuses, and a build between two siblings' runs showed Clients v2 green and then red once gated."
  - "HIDE A COLUMN WITH NO RESULT IN ANY ROW (dashboard UX review v4, its answer to v4 open question 1; presentation within Keith's Option C, to mention at the walk-through rather than ask): an in-warehouse page - the common daily view - would otherwise carry a whole column of dashes, and 'Against what's staged' invites 'is something staged? did it not run?'. The second column appearing only when it holds something is itself a pre-attentive signal that a staged file is in play. REJECTED the scoper's v4 recommendation to keep it for a uniform layout."
  - "crossTableRowOrder STAYS (dashboard UX review v4, on 'M4'): post-build-review #258's M4 is the relationship-then-name-then-tool row order, built as crossTableRowOrder() and cited there. Option C keeps the relationship-then-name sort; its tool rank (_TOOL_RANK) becomes the order of the marks in criterion 8. Without this decision a builder may delete the function as dead. No signed requirement names M4."
  - "EVERY EVALUATION IS ITS OWN POINT (REQ-PIPE-279, Keith K3 = C and K4 = A): v4's criterion 17 counted a package re-check as part of the supply's delivery (sameDelivery). 279 retires 'part of the same delivery' as a placement rule, so the re-check is a re-check point of its own, keyed on its cause (the 'promotion-withheld' entry). In the staggered case, Clients v2's run re-checking Notifications' Client reference against Notifications v2 is likewise a second point on Notifications v2."
  - "THE RULE-MADE PROMOTION SAYS WHY ON THE HISTORY ROW (delivery-scoper, 2026-10-23, the page's half of the CLI review's v4 S7): a supply promoted after a re-check against the warehouse would otherwise look like any rule promotion."
  - "THE COULD-NOT-RUN CLAUSE GOES IN THE PANEL (dashboard UX review v4 note): the section blurb's 'so it counts against both' stays true for evaluated failures; for a could-not-run row the panel says it counts only against the table that asks."
  - "FOUR WAITING FORMS, NOT ONE (dashboard UX review v5 B1; architect v5 S5): v5's single 'waiting for the rest of its delivery' was false once every file was checked (a crash after checking, a budget stop, a contended lock) and meaningless for a package of one, and an unchecked member's page could show the one Pass a sibling's run had recorded about it - a half-built view and a possible false green. Mirrors REQ-PIPE-266 criterion 15's forms; a supply of an application not yet settled reads 'being gated' rather than 'Awaiting' green."
  - "A CAPTION ON AN AWAITING PAGE (dashboard UX review v5 S1): hiding the empty column removed the contrast that told a reader the results are the waiting supply's; Order A at 09:00 showed 'warehouse ... is Green' above a Fail under 'Against what's in the warehouse'."
  - "A TRUTHFUL SENTENCE FOR THE THIRD BUCKET (dashboard UX review v5 S2): none of v5's four sentences was true of Clients v1 after Clients v2 replaced it."
  - "'WHY IT IS HELD BACK' WHEREVER THE COUNTED RESULT IS THE WAREHOUSE ONE (dashboard UX review v5 S3): in staggered Order B red, Clients' warehouse Fail comes from its own 09:00 arrival, not a criterion 6 re-check, and v5 gave it no suffix and no notice."
  - "COUNTED FOR STATUS, EVERY EVALUATION FOR HISTORY (dashboard UX review v5 S4): v5's criterion 18 dropped from an in-warehouse page's sparklines any result about a supply not in the warehouse, so Clients' trend lost the 09:00 Fail its history recorded; REQ-PIPE-279 criterion 10 sides with the trend keeping it."
  - "THE STAGED BUCKET IS FOR A WAITING SUPPLY'S PAGE (dashboard UX review v5 S6): criteria 7 and 18 overlapped on an in-warehouse page."
  - "ONE POINT PER GATE APPLICATION, AND COMPARE WITHIN A BUCKET (architect v5 S2; REQ-PIPE-279 N1 = B's condition 'once #95's grid lands, compare within one bucket')."
  - "THE ONE FUNCTION FOR THE COMPARE DEFAULT AND ?cmp= IS REQ-PIPE-279's (dashboard UX review v5 S7, an existing defect: setCompareIdx, template line 8646, drops ?cmp= against history.length-2 while the default is defaultCompareIndex, line 5152): Keith's N1 = B carries it as a condition on 279, test first; logged as a road-testing sighting. Not repeated here. Likewise a non-own point naming its cause in the sparkline tooltip goes to 279's 'each entry names its cause'."
  - "HOOKS FOR THE PERIOD-CLARITY WORK (dashboard UX review v5 P1-P6), so the two do not collide: every supply named through one Python helper (criterion 22); period-clarity's period line goes ABOVE REQ-DASH-275's and REQ-DASH-204's notices and the verdict line, and is NOT a third rewording of REQ-PIPE-081 criterion 1, which REQ-DASH-277 rewords and this requirement extends; any <period> in these notices and in REQ-PIPE-271's warnings is formatted through fmtPeriodOrDay and leaves the open and close window to the period line; sparklines are NOT bucketed by period, which would merge REQ-PIPE-279 K3 = C's separate points. Period-clarity's Q3 = A row wording ('Not evaluated — Client Register has no 2025-Q2 supply') extends this requirement's cell notes and panel sentences through the same helper rather than adding a vocabulary of its own."
