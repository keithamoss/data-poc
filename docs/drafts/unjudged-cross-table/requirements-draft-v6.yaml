# into a gate application through recorded verdicts (REQ-PIPE-267 criterion
# 2); a PACKAGE-MATE is one received with it.
requirements:
- id: REQ-PIPE-266
  title: "Files that arrive together are gated together, once every one of them has been checked"
  date_written: '2026-10-21'
  story: "As the person answerable for a collection's supplies, I want the files that arrive in one package to be gated together, and only once every one of them has been checked, so that no file is promoted on a verdict about a package-mate that is then held back."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, settling plans/running-thoughts.md #95's shape, 2026-10-20 evening to 2026-10-21 morning (summary.md, 'Shape settled in principle'): 'A package of files is gated together, after every file in it has been checked'; zip as the stand-in for a package, plans/running-thoughts.md #114. Keith's answers on v3, 2026-10-22: Q3 = A, Q9 = A ('B later'), a decision on a package still being gated is refused, the joint-promotion history row. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22. Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "THE SYSTEM SHALL treat as ONE PACKAGE the arrivals of one collection that share a receipt instant and are filed to one period - the siblings of REQ-PIPE-265 criterion 1, read from the filing and delivery-file records (qa.filing, qa.delivery_file) as REQ-PIPE-279 reads them, never from run ids, and partitioned by period - and SHALL treat an arrival that shares its instant with no other as a package of one."
  - "THE SYSTEM SHALL gate a package through ONE package-gate function, reached from every place a gate is applied to an arrival - the per-arrival lifecycle, the orchestrator, the processing pass (its ungated path, processing_pass._one, included) and a person's hand-filed run - and SHALL NOT leave any of them gating one sibling alone."
  - "WHILE an arrival is checked and the rest of its package is not, THE SYSTEM SHALL classify it as CHECKED, WAITING FOR ITS PACKAGE - not a failure (processing_pass.fail_arrival), holding back later arrivals as an ungated one does - and SHALL record the package's gate as an owed item of a NEW owed kind, 'gate' (qa.owed_run.kind, beside 'recheck' and 'reevaluate') - an application owed from recorded results, never by re-running tools - whose cause is the load of the package's last arrival (or, for a retried application, the application it retries), cleared when the gate is applied and run by recheck.run_all_owed and the processing pass, so that a timeout, a budget stop, a crash or a contended period lock (REQ-PIPE-267 criterion 17) resumes it; THE SYSTEM SHALL NOT record it as a 'recheck', which would re-run that supply's full QA."
  - "THE SYSTEM SHALL give every promotion and every hold-back of one gate application - whether its entry is a package gate, a knock-on or a re-check (REQ-PIPE-267 criterion 2) - the same effective instant, rather than one seeded per arrival (orchestrate.promote_after's effective_at_for), and SHALL decide which of two results is newer by evaluation order (REQ-PIPE-279's run_seq), never by that instant."
  - "WHEN a person runs one file of a package that is not yet fully checked (mothman cp qa --commit), THE SYSTEM SHALL say the file is checked and not gated yet, worded 'checked, waiting for the rest of its delivery (<n> of <m> files checked)' - in its own output and in the kept report (lifecycle_report._gate_line, never its 'owed to the next processing pass' fallback) - SHALL exit as that file's own results say and never non-zero only because it is waiting for its package, and SHALL offer no decision on it."
  - "WHERE arrivals come from the cloud ingest path, which records each object as its own delivery at its own storage instant (s3_arrival.record_object), THE SYSTEM SHALL treat each as a package of one, and SHALL say so as a known limitation in docs/aws-event-driven-mvp-design.md, naming plans/running-thoughts.md #114 and plans/supply-thoughts.md as where a cloud package boundary (a manifest or an end marker) is to be scoped."
  - "WHEN an arrival of a package of more than one has been checked, THE SYSTEM SHALL NOT apply the promotion gate to it until every arrival of that package has been checked, an arrival counting as checked once its run is recorded or its supply is recorded as could not be loaded, held (REQ-PIPE-078) or contested."
  - "WHEN the last arrival of a package has been checked, THE SYSTEM SHALL gate the package's supplies together as one gate application (REQ-PIPE-267), and SHALL do so before any arrival received after the package is filed."
  - "THE SYSTEM SHALL record each supply a gate application holds back - one the gate entry has just checked - as a decision-log entry with the action 'promotion-withheld', with the rule as actor, naming the package's receipt instant and, where the cause is another supply, that supply, SHALL write it the moment it is final (once a supply is held back it is never promoted by the same gate application), not when the whole application has settled, and SHALL NOT write a new entry where a supply's outcome is unchanged - a joined waiting supply that stays not promoting keeps its existing entry (REQ-PIPE-267 criterion 4), and a repeat is judged on the entry's structured fields (REQ-PIPE-267 criterion 13), never on its reason text."
  - "THE SYSTEM SHALL record each promotion a gate application makes with the rule as actor, naming the package's receipt instant and every other supply promoted in the same gate application, so that the supply history can say what it was promoted with (REQ-DASH-272)."
  - "WHEN a gate application promotes one or more supplies, THE SYSTEM SHALL owe ONE re-evaluation (REQ-PIPE-121) covering every table it moved, after the last of those promotions commits, and SHALL NOT owe one per promotion."
  - "IF the processing pass stops after some arrivals of a package have been checked and before the package is gated, THEN THE SYSTEM SHALL leave the checked arrivals ungated, check the rest on its next pass and then gate the package, and SHALL NOT gate the checked arrivals on their own."
  - "IF an arrival of a package cannot be checked because its run fails to complete, THEN THE SYSTEM SHALL leave the whole package checked-and-waiting and its 'gate' item owed - not a failure of the package-mates - report which arrival stopped it and at which stage, re-run the crashed arrival on the next processing pass, and gate the package together once it is checked; THE SYSTEM SHALL NOT gate the package-mates without it."
  - "WHERE an arrival of a package is checked but left ungated because the agreement backstop refuses its dataset (REQ-PIPE-170), THE SYSTEM SHALL treat that supply as held back at the package gate, so that its package-mates are re-checked against what is in the warehouse and go ahead if green (REQ-PIPE-267), matching the backstop's own 'holding back nothing else'."
  - "IF a person asks to record a decision on a supply whose package is still being checked or gated - its 'gate' item owed and not cleared - THEN THE SYSTEM SHALL refuse before asking for a reason, worded 'The delivery received <instant> is still being checked (<n> of <m> files checked); decide once it is gated.' or, once every file is checked, 'The delivery received <instant> is being gated (<m> of <m> files checked); decide once it is gated.', adding on a line of its own, WHERE no run holds the package (a crash or a budget stop left it owed), 'It is finished by the next processing pass:' and 'mothman pipeline process'; SHALL record nothing; and on the flag route (mothman supply decide) SHALL exit 75 (EXIT_LOCKED, EX_TEMPFAIL, the code mothman pipeline process already uses for 'nothing was changed, try later'), listed in that command's documented exit codes."
  - "WHEN a person's decision would move a table into or out of a period - promote, reject, demote, un-inherit, de-substitute, re-file, or carry-forward (REQ-PIPE-280) - THE SYSTEM SHALL first try-lock that period's per-(collection, period) lock (REQ-PIPE-267 criterion 17), and IF a gate application holds it, THEN SHALL refuse before asking for a reason, worded 'A gate is running for <period>. Nothing was changed. Try again in a moment.', record nothing, and exit 75 on the flag route; the slot locks the decision already takes then order one person's decision against another's only."
  - "WHEN a person's promotion is applied (promotion.promote), THE SYSTEM SHALL compare, under the period lock and the slot locks, the supplies the promoted supply's counted cross-table verdicts read with the read holders its consequences showed (REQ-PIPE-276 criteria 7 to 9), and IF any has changed, THEN SHALL raise the existing consequences-changed refusal (filing_decisions.ConsequencesNotAcknowledged, REQ-GHUB-082 criterion 9): interactively 'Somebody else's decision changed what this one does while you were deciding. New:' with the new consequences and one more confirmation, refusing a second change with 'Not recorded: ... Look at the period again before deciding.'; with --yes, refuse naming the new key and exit 1; a person's promotion is not a gate application and SHALL NOT start or restart one."
  - "WHEN a replay of one collection is asked for a checkpoint before an arrival that is not the first of its package, THE SYSTEM SHALL refuse, naming the package's first arrival, and SHALL NOT save a checkpoint between two arrivals of one package."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-105 criterion 1, REQ-PIPE-121 criterion 9 and REQ-TEST-159 criterion 1 with the wording in summary-v4.md, summary-v5.md and summary-v6.md once Keith has approved it."
  - "S1, NOTHING IS GATED BEFORE THE LAST FILE IS CHECKED: THE SYSTEM SHALL have tests/test_package_gate.py::TestGatedTogether::test_no_sibling_is_gated_before_the_last_is_checked, driving the real Child Protection orchestrator with a zip of Clients v2 and Notifications v2 over the ESTABLISHED fixture (REQ-PIPE-267 criterion 19), asserting that no promotion or 'promotion-withheld' is recorded for either v2 before both runs are recorded and that a 'gate' item is owed between them - written first and seen to fail, because today each arrival is gated straight after its own run (arrival_lifecycle.process)."
  - "S2, ONE KNOCK-ON FOR A PACKAGE PROMOTED WHOLE: THE SYSTEM SHALL have tests/test_package_gate.py::TestGatedTogether::test_a_package_promoted_whole_owes_one_reevaluation, in which a zip of Clients v2 and Notifications v2, both green, over the FIRST-TIME fixture (REQ-PIPE-267 criterion 19) promotes both with one effective instant, each promotion naming the other, owes exactly one re-evaluation, and records no readers-only run for either - written first and seen to fail."
  - "THE SYSTEM SHALL have tests/test_package_gate.py::TestInterruptedPackage::test_a_part_checked_package_is_finished_and_gated_whole, which stops the processing pass between the two runs of S1's zip and asserts that the next pass checks the second, then gates both together; and test_a_crashed_sibling_keeps_the_package_waiting, which makes Notifications v2's run fail at the Soda stage and asserts Clients v2 is neither promoted nor held back, the package's gate is owed, and the next pass re-runs Notifications v2 and gates both - both written first and seen to fail."
  - "THE SYSTEM SHALL have tests/test_package_gate.py::TestBackstopSibling::test_a_backstop_refused_sibling_counts_as_held_back, in which the agreement backstop refuses cp-notifications and Clients v2 is re-checked against Notifications v1 and promoted - written first and seen to fail."
  - "THE SYSTEM SHALL have tests/test_package_gate.py::TestDecisionDuringTheGate - test_a_decision_on_a_package_still_being_gated_is_refused (both refusal wordings, the next-pass line where no run holds the package, nothing recorded, exit 75 from mothman supply decide); test_a_persons_decision_while_a_gate_holds_the_period_is_refused (architect v5 B3: an application holds 2024-Q3 promoting Clients v2 while a person promotes Notifications v2; the person is refused with exit 75 and the gate-running wording, nothing recorded, and the warehouse never holds Clients v2 and Notifications v2 each judged against the other's v1 - for each of promote, reject, demote, un-inherit, de-substitute, re-file and carry-forward); and test_a_promotion_whose_read_supply_moved_raises_the_consequences_refusal (S16: interactively re-asked once with the new consequences; with --yes refused naming the new key, exit 1) - each written first and seen to fail."
  non_functional_requirements:
  - "NO HALF-AND-HALF VIEW (Keith, 2026-10-21): nothing is promoted on a verdict about a package-mate that has not itself been gated."
  - "NO FLICKERING REDS (plans/running-thoughts.md #113): a hold-back is written only once it is final, so no decision a gate application later reverses is ever recorded; the results of re-checks that have not settled are not counted anywhere until it settles (REQ-PIPE-267 criterion 11)."
  - "PERFORMANCE: a package's gate waits only for its own files' checks - minutes on Child Protection - and never for any other arrival, so REQ-PIPE-105 criterion 2 (no supply held pending another's arrival) still holds."
  - "RELIABILITY: a crashed sibling keeps its package waiting and owed until the next pass re-runs it (Keith, Q3 = A); a backstop refusal, which can last until someone fixes the agreement, holds back only its own supply; a part-checked package is finished, never gated in part."
  - "DETERMINISM AND REPLAY: package membership comes from the recorded receipt instant, never from process timing, so a parallel and a sequential bootstrap still record the same decisions (REQ-PIPE-262 criterion 13), and a checkpoint is only ever at a package boundary."
  - "AUDITABILITY: every promotion and hold-back names its package's receipt instant, and every promotion names what it was promoted with, so 'what was gated together' is one query over qa.decision."
  - "SCALE (~30 collections on the quarterly asset): a package is one collection's files at one instant, so the cost is per package and does not grow with the number of collections."
  - "COMPATIBILITY (cloud path): on S3 every file stands alone and gets the accepted flicker until a boundary is scoped; recorded, not designed around (Keith, Q9 = A)."
  - "SECURITY AND PRIVACY: nothing widened; the package is identified from receipt records, never file contents."
  - "CONCURRENCY: a person's decision can neither land between a package's checks and its gate (refused, exit 75, 'try later') nor promote on a read supply that moved under it (compare-and-swap under the slot locks, refused, exit 1, 'look again'); two rule applications in one period never interleave (REQ-PIPE-267 criterion 17)."
  - "SCHEMA: the 'package-gate' owed kind, the hold-back's structured fields and the gate-application record go in ONE qa schema bump after REQ-PIPE-279's own, rebuilt from empty by mothman env reset-synthetic and mothman pipeline bootstrap, never migrated (REQ-PIPE-089's standing rule)."
  dependencies:
  - REQ-PIPE-265
  - REQ-PIPE-267
  - REQ-PIPE-105
  - REQ-PIPE-121
  - REQ-PIPE-151
  - REQ-PIPE-170
  - REQ-TEST-159
  - REQ-PIPE-279
  - REQ-PIPE-276
  decisions:
  - "GATED TOGETHER, AFTER ALL ARE CHECKED (Keith, 2026-10-20/21): 'A package of files is gated together, after every file in it has been checked.' REJECTED today's behaviour, gating each file straight after its own run (arrival_lifecycle.process calls promote_after per arrival), which in S1 promotes Clients v2 before Notifications v2 has been checked at all."
  - "A ZIP STANDS IN FOR A PACKAGE, AND A PACKAGE IS A SHARED RECEIPT INSTANT (Keith, 2026-10-20, plans/running-thoughts.md #114). Criterion 1 reads it from the record exactly as REQ-PIPE-265 does, so another boundary marker later changes one definition, not two. NOT the delivery directory: a delivery's files can land minutes apart (REQ-GEN-044), and those are staggered, not a package."
  - "ZIP-ONLY FOR NOW, THE CLOUD BOUNDARY LATER (Keith, 2026-10-22, Q9 = A, 'B later'): on the S3 path every file stands alone and gets the accepted flicker; this is a recorded limitation, REQ-DOCS-274 tells suppliers to upload a zip, and a cloud boundary (a manifest or an end marker) is transport-layer work for plans/running-thoughts.md #114 and plans/supply-thoughts.md. REJECTED defining a cloud package boundary now (Q9 B)."
  - "A CRASH WAITS, A BACKSTOP REFUSAL IS HELD BACK (Keith, 2026-10-22, Q3 = A): a crash is usually transient, so the package stays checked-and-waiting and owed, not failed, and the next pass re-runs the crashed file and gates the package together; a backstop refusal can last until the agreement is fixed, so it counts as held back and the siblings are re-checked against the warehouse partner, which matches the backstop's own 'holding back nothing else'. REJECTED both waiting (Q3 B: a long backstop refusal holds a clean file indefinitely) and both counting as held back (Q3 C: after a crash a file is judged without knowing what its package-mate would have found)."
  - "HOLD-BACKS ARE WRITTEN WHEN FINAL, NOT WHEN THE GATE SETTLES (architect, v3 draft review N3): v3 wrote every refusal only after the gate settled, but a re-check run's cause is the hold-back and qa.run requires a cause (qa_store.py:216-217). Within one gate application the held-back set only grows, so a hold-back is final the moment it is made and writing it then flickers nothing. The re-check RESULTS stay hidden until the application settles (REQ-PIPE-267 criterion 12). The owed package gate had no cause either (qa_store.py:1330), hence criterion 3."
  - "THE ACTION IS 'promotion-withheld' AND THE WORD IS 'HELD BACK' (CLI review of v3): v3's 'refusal' named no decision-log action and its wording opened 'Refused:', which REQ-PIPE-163 criterion 20 forbids for a gate outcome; the terminal already says 'held back' for the gate (decision_words, _gate_words), and Keith's own answers use it."
  - "A DECISION ON A PACKAGE STILL BEING GATED IS REFUSED (Keith, 2026-10-22, agreed batch 'All four as recommended'; architect T13; CLI review N3): Keith's wording, criterion 15. And promote() re-confirms the read holders under the slot locks (architect S16) - the refusal closes the ordinary race, the re-confirmation closes the one the refusal cannot see."
  - "THE JOINT PROMOTION IS RECORDED AND SHOWN (Keith, 2026-10-22, agreed batch): criterion 10 records what a supply was promoted with; REQ-DASH-272 shows 'Promoted <time> with the <dataset> supply received <instant>, by the rule' on the supply-history row, which replaces the v3 'cleared minutes later' note (dashboard Q-F)."
  - "NO COMPLETENESS IS INFERRED (REQ-PIPE-105 criteria 2 and 12, unchanged): a package's files share one instant and are all present when it is filed, so gating together waits on their checks, never on an arrival. The retired completion tracker stays retired."
  - "STAGGERED FILES FLICKER, ACCEPTED (Keith, 2026-10-20): 'I guess that's just going to have to flicker at that point. And we need to say, if you want to avoid a flicker, make sure you send us a package of files... I don't think we can really design around that.' REQ-DOCS-274 carries the supplier guidance."
  - "ONE KNOCK-ON PER GATE APPLICATION (delivery-scoper, 2026-10-21): a knock-on after the first of several promotions would re-run the next one's readers against a period about to change. Hence criterion 11 and the REQ-PIPE-121 criterion 9 amendment."
  - "A CHECKPOINT NEVER SPLITS A PACKAGE (delivery-scoper): refusing such a checkpoint is simpler than teaching resume about part-gated packages."
  - "A NEW OWED KIND, MANDATORY (architect v4 S2): qa.owed_run.kind is constrained to 'recheck' and 'reevaluate' (qa_store.py:1315), and a 'recheck' caused by the last arrival would make recheck._run_claimed re-run that supply's full QA. v4's 'or a new owed kind' was a false choice; 'package-gate' is the only correct one, and every gate that cannot be applied at once - a package of one whose period lock is contended included - is owed as one."
  - "A PERSON'S OVERRIDE IS COMPARE-AND-SWAP, NOT A RESTARTED GATE (architect v4 S3): v4's 'restart the gate application' would have failed every deliberate override of a supply whose verdict read a staged partner (promoting Notifications v2 in S1). A person's promotion is not a gate application. REJECTED restarting. The refusal exits 1, not 75: the consequences changed, and REQ-GHUB-082's confirmation key changes with them, so re-running the same command would be refused again; a person has to look again (V4-Q3's 75 is for a refusal that the same command, later, gets past - delivery-scoper's reading of Keith's reason, 'so a script can tell wait and retry from no', for confirmation at the walk-through)."
  - "NO REPEATED HOLD-BACK (architect v4 S4): v4's criterion 9 wrote one entry per supply each application held back, so a joined supply was re-recorded every time a connected file landed - log noise, ticket churn under REQ-PIPE-278, and, once 'promotion-withheld' was the latest entry, _record_refused (promotion.py:1097-1100) suppressed later refusals until the supply moved. Restores v3 REQ-PIPE-268 criterion 3's 'results and decisions unchanged' for a joined supply, and de-duplicates on structured fields because the reason text names instants."
  - "A REFUSAL BECAUSE THE DELIVERY IS STILL BEING CHECKED EXITS 75 (Keith, 2026-10-22, V4-Q3 = A): on the flag route apply_decision returned None and supply decide exited 1 (supply.py:1126-1127), the same as a permanent refusal. EXIT_LOCKED 75 is the code mothman pipeline process already uses for 'nothing was changed, try later'. REJECTED V4-Q3 B, exit 1 like every other refusal. The gating form and the next-pass line are the CLI review's (v4 S3a, S3b)."
  - "A WAITING FILE EXITS AS ITS OWN RESULTS SAY (architect v4 S7, CLI review v4 S2): v4's 'SHALL exit 0' masked a first file's own reds (one_table.py:460-486 exits 1 on any red). Waiting for a package never changes the exit code in either direction."
  - "ONE INSTANT PER APPLICATION, WHATEVER ITS ENTRY; NEWEST BY EVALUATION ORDER (architect v4 note; REQ-PIPE-279 K1 = A): the same effective instant for a knock-on's or a re-check's application as for a package's; at an equal instant a decision-caused run outranks an arrival because it is opened after it (run_seq), never by run_key text order (supply_status.py:58, where cp_notifications__X sorted after cp_clients__X__r1)."
  - "SIBLINGS FROM THE RECORD (REQ-PIPE-279's amendment of REQ-PIPE-265 criterion 1): a package is read from qa.filing and qa.delivery_file, never parsed from run ids, so this requirement inherits 279's reading rather than keeping its own."
  - "EVERY PERSON'S TABLE-MOVING DECISION TRY-LOCKS THE PERIOD (Keith, 2026-10-22, V5-Q1 = A; architect v5 B3): v5's compare-and-swap ran under the promoted supply's own slot locks only, so under READ COMMITTED a person promoting Notifications v2 and an application promoting Clients v2 could both commit, each re-confirmed against the other's v1 - a half-and-half warehouse. Every promote, reject, demote, un-inherit, de-substitute, re-file and carry-forward now try-locks the same per-(collection, period) lock the gate holds, refusing 'A gate is running for <period>. Nothing was changed. Try again in a moment.' with exit 75, V4-Q3's 'try later'. Slot locks then order person against person only. REJECTED V5-Q1 B, locking partner slots in one global sorted order (no wait, but it changes the lock set on every decision path). It also closes REQ-PIPE-279's open-to-run_seq gap (279 architect v3 S1) for #95's own runs."
  - "THE COMPARE-AND-SWAP IS THE EXISTING CONSEQUENCES-CHANGED REFUSAL (CLI review v5 item 4): apply_decision already re-asks once on ConsequencesNotAcknowledged and refuses a --yes naming the new key with exit 1 (REQ-GHUB-082 criterion 9, post-build-review #112). v5's own refusal text is withdrawn. Exit 1 for a stale consequence and 75 for contention (architect v5, agreeing with v5 reading 1): a retried --yes with the old key can never succeed, so 75 would invite retrying forever."
  - "'gate', NOT 'package-gate' (delivery-scoper, 2026-10-23, from architect v5 S4): the owed kind now also carries a retried application after a failed move or a contended re-confirmation, re-applied from recorded results without re-running any tool. A 'recheck' left owed would have re-run full QA through recheck._run_claimed's mint_run_id/reopen_run, with results invisible meanwhile."
  - "THE KEPT REPORT SAYS WHAT A WAITING FILE IS (CLI review v5 item 12): lifecycle_report._gate_line's fallback, 'owed to the next processing pass', is false for a file that waits only for its package."
  - "A PACKAGE IS NOT A POINT (architect v5 note): REQ-PIPE-266's package is REQ-PIPE-279's sibling group partitioned by PERIOD; 279's arrival-group cause is not partitioned. A zip filed to two periods is therefore one point-cause and two packages, gated separately. Deliberate: the gate is per period, the point per arrival."
  open_questions: []
- id: REQ-PIPE-267
  title: "A supply is promoted only on cross-table verdicts about what the warehouse will hold, and supplies that depend on each other are gated together, transitively, until nothing changes"
  date_written: '2026-10-21'
  story: "As a data team leader, I want a file promoted only on cross-table verdicts about the tables it will actually sit beside in the warehouse, and files that depend on each other promoted together or not at all, so that the warehouse never holds a table judged only against a file that did not get in, and two or three clean files never wait on each other for a person."
  moscow: must
  status: not_started
  signed_off:
    by: Keith
    date: '2026-10-23'
  source: "Keith, 2026-10-20/21 (summary.md, 'Shape settled in principle'): the no-half-and-half principle; 'When a file in the package is held, the others' cross-table checks re-run against the warehouse partner before any of them can promote'; 'Re-checks cascade within a package until nothing changes'; 'things that depend on each other don't promote until they're all happy... A human can always overrule that using the terminal'. Keith, 2026-10-22: the transitive group gate (architect N1), put to him as a clarification of 'things that depend on each other don't promote until they're all good', no objection; the scoper's Q1 and Q2 both A. Drafted by delivery-scoper 2026-10-21, re-folded 2026-10-22 (absorbs v3's REQ-PIPE-268 and criterion 14). Re-folded 2026-10-23 (v5) with Keith's answers on the v4 reviews (V4-Q1 to V4-Q3, 2026-10-22) and the three v4 reviews, standing on REQ-PIPE-279. Re-folded 2026-10-23 (v6) with Keith's V5-Q1 = A and V5-Q2 = A and the three v5 reviews (review-architect-279v3-95v5.md, review-dashboard-ux-279v3-95v5.md, review-cli-ux-279v3-95v5.md), standing on REQ-PIPE-279 v4 (N1 = B, N2 = A). SIGNED by Keith 2026-10-23 (Perth) after the v6 walk-through, with C = A, D = A and E = B applied (summary.md, 'Keith's sign-off walk-through, 2026-10-23')."
  acceptance_criteria:
  - "THE SYSTEM SHALL count toward a supply's promotion gate a cross-table verdict only where it is counted toward that supply (REQ-PIPE-269 criterion 4) and every supply of every table THAT CHECK read - as REQ-PIPE-279 records it per check in qa.check_read, compared by supply id and never by physical table name or by the tables the whole run read - is either the supply in the warehouse for its table in that period (promoted, inherited or substituted) or a supply still promoting in the same gate application, taking per check the newest qualifying verdict by evaluation order (REQ-PIPE-279's run_seq) through REQ-PIPE-279's one selection function."
  - "THE SYSTEM SHALL form a GATE APPLICATION at each GATE ENTRY - the package gate (REQ-PIPE-266), the owed-item runner recheck._run_claimed (a re-file, an un-supersede, a settlement), the knock-on's knock_on.complete, and the ungated path processing_pass._one - from the supplies that entry has just checked, together with every JOINABLE supply (criterion 3) WAITING in the same period that is connected to any of them through recorded cross-table verdicts, TRANSITIVELY, and SHALL apply criteria 5 to 10 to the whole set; a re-evaluation made under criterion 6 is never a gate entry and SHALL NOT form an application of its own."
  - "THE SYSTEM SHALL treat a waiting supply as JOINABLE only WHILE it has no uncleared owed 'recheck' or 'gate' item, belongs to no package that is not yet gated, and its current run (REQ-PIPE-140 criterion 5, qa.supply_current_run) has qa.run.period equal to the slot of its current filing - a held supply, whose filing has no slot, is never joinable; THE SYSTEM SHALL NOT join, mark not promoting, or write any decision for a waiting supply that is not joinable, and SHALL treat a verdict that read it, for the supplies of the application, as a verdict about a supply that is not promoting (criterion 6) - mirroring knock_on.readers' skip of a supply with an owed re-check (post-build-review #173, L3)."
  - "THE SYSTEM SHALL NOT run any check of a joined waiting supply, deciding it from its recorded results alone; WHERE, in any round of the fixed point, a counted verdict of a joined supply read a supply that is neither in the warehouse nor still promoting in the application, THE SYSTEM SHALL mark the joined supply not promoting rather than re-check it, so that no other table is re-checked because a file landed; and a joined supply that ends not promoting SHALL keep its results and its decisions unchanged, with no new decision-log entry."
  - "WHEN a gate application begins, THE SYSTEM SHALL mark as NOT PROMOTING every supply of it that would not be promoted on checks that read no other supply of the application - its own checks, and cross-table verdicts against supplies in the warehouse - or that is red, amber under 'hold', contested, held, could not be loaded, superseded, refused by the agreement backstop, or a resupply its slot's replacement setting does not let replace, and SHALL NOT mark a supply not promoting at this step only because a verdict against another supply of the application failed - judging each check by its newest qualifying verdict (criterion 1), so that a check whose newest qualifying verdict read a supply of the application is left to criteria 6 and 7 even where an older verdict of it against the warehouse failed."
  - "WHEN a supply of a gate application is not promoting and another supply of it - one the gate entry has just checked - is still promoting and has a counted cross-table verdict that read it, THE SYSTEM SHALL re-evaluate that check for the other supply against the period as it will stand - that table's supply in the warehouse, or none - reading the application's other still-promoting supplies as staged, before the gate decides on the other supply; EXCEPT that THE SYSTEM SHALL NOT re-evaluate a check DECLARED on the not-promoting supply's table where the period will hold no supply of that table in the warehouse, because that result could count toward nothing (REQ-PIPE-269 criterion 4), and SHALL then decide the other supply without that check."
  - "THE SYSTEM SHALL then mark not promoting every supply that a re-evaluation of criterion 6 left failing, repeat criterion 6, and - once no re-evaluation changes anything - mark not promoting together every still-promoting supply whose counted verdict against another still-promoting supply fails, and repeat from criterion 6, stopping only when the set of supplies not promoting stops growing; THE SYSTEM SHALL then promote the rest together, so that supplies that read each other promote together or not at all."
  - "THE SYSTEM SHALL evaluate each step of criteria 5 to 7 over the whole set of supplies at once, never one supply at a time, SHALL reach the same outcome whatever order the supplies are listed in, SHALL NOT re-check a supply already not promoting, SHALL open each round's runs in a fixed order, sorted by dataset id (REQ-PIPE-262 criterion 13), and SHALL NOT re-run a check whose read supplies, as REQ-PIPE-279 recorded them, have not changed since its last result - reusing that result only where it came from an arrival run, a re-check run, or a run of a SETTLED gate application, never from an abandoned one (criterion 12)."
  - "WHERE a re-evaluated check has no supply in the warehouse to read for a table, THE SYSTEM SHALL record it not evaluated and red with the reason that applies (REQ-PIPE-079 criteria 4, 15 and 16; REQ-PIPE-270), counted as REQ-PIPE-269 criterion 4 says, and SHALL NOT treat the absent table as empty."
  - "WHERE a check's verdict was carried from a sibling (REQ-PIPE-265) and a supply it read is not promoting, THE SYSTEM SHALL stop counting the carried verdict and re-evaluate the check under criterion 6, whose result replaces it; REQ-PIPE-265's criteria are unchanged."
  - "THE SYSTEM SHALL record each re-evaluation of criterion 6 as a readers-only run (REQ-PIPE-121 criterion 2) whose cause is its GATE APPLICATION (criterion 12) - the cause REQ-PIPE-279 keys its point on, so that every round of one application is ONE point and only its last round's result per check is shown (amending REQ-PIPE-279's point key, summary-v6.md) - recording as its caused_by_decision the 'promotion-withheld' entry it re-checks for (the lowest decision id where a round re-checks for several), that entry committed before the run that cites it; batching one run per supply per round; recording which tables it read from the warehouse rather than from staging only through REQ-PIPE-279's staging-or-period field; and SHALL NOT re-run any supply's own table and column checks for it."
  - "THE SYSTEM SHALL record each gate application as a row of its own (qa.gate_application: collection, period, entry, started, and an end that is either SETTLED or ABANDONED) and each run inside it on qa.run; WHILE an application has neither, THE SYSTEM SHALL NOT count the results its re-evaluations record toward any status, page, count, ticket or notification; THE SYSTEM SHALL mark it SETTLED once its last promotion or hold-back is written and ABANDONED when its outer transaction is rolled back (criterion 17), and SHALL NEVER count an abandoned application's results; the dashboard build SHALL filter on it; and the application's lifecycle (started, settled, abandoned) SHALL live in one module, read by the build's filter and by criterion 8's reuse."
  - "WHEN a supply is held back because of a re-evaluation under criterion 6, THE SYSTEM SHALL record on its 'promotion-withheld' entry, as structured fields, which checks are responsible, which supply in the warehouse each was checked against (or that there was none), which supply of the application was not promoting and whether it came with this supply (a package-mate) or was waiting already (a joined supply); and SHALL word its reason from those fields as 'Held back: <check>, re-checked against the <dataset> in place in the warehouse (received <instant>) because the <dataset> received with it was held back.' or, for a joined supply, '... because the <dataset> waiting for a decision (received <instant>) is held back.', and where none was in the warehouse 'Held back: <check> could not be checked - no <dataset> is in place in the warehouse, and the <dataset> received with it was held back.' (or '..., and the <dataset> waiting for a decision (received <instant>) is held back.'), each followed by 'This supply's checks of its own data passed.' where they did."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-075 criterion 2 and REQ-PIPE-121 decision 11 ('A FILE LANDING IN STAGING STAYS OUTSIDE THIS MECHANISM') with the wording in summary-v4.md, summary-v5.md and summary-v6.md once Keith has approved it."
  - "WHERE the only supply of a gate application that is not promoting is one whose checks read another supply of it, and that other supply's own table declares no check reading the not-promoting one, THE SYSTEM SHALL promote the other supply on its own verdicts, so that in a first-time zip a clean Clients promotes alone when the only failing table is a Notifications that reads it (Keith, V4-Q1 = A); this follows from criteria 1, 6 and REQ-PIPE-269 criterion 4 and adds no rule of its own."
  - "THE SYSTEM SHALL pin, in every fixture of this requirement's tests, a replacement setting (REQ-PIPE-123) that lets a green resupply replace a promoted one, and SHALL NOT inherit the setting from configuration, so that a 'hold' setting can never make S1 green read as a deadlock."
  - "THE SYSTEM SHALL take ONE advisory lock per (collection, period), through one helper whose docstring states the rule (try-lock; a rule entry left owed, a person refused with exit 75; released before the knock-on), held for the whole of a gate application and taken by try-lock; IF it is held by another application or by a person's decision (REQ-PIPE-266 criterion 16), THEN THE SYSTEM SHALL leave this entry owed (its 'gate', 'reevaluate' or 'recheck' item) and SHALL NOT wait; THE SYSTEM SHALL run no tool inside a decision transaction; THE SYSTEM SHALL make an application's promotions in ONE outer decision transaction, one savepoint per move, inserting the owed knock-on row inside it, holding AccessExclusive locks on the moved tables only, and re-confirming under the slot locks that every supply it promotes is still waiting and every supply its counted verdicts read is as the application saw it; IF a move fails, THEN SHALL roll the whole transaction back, promote nothing, mark the application ABANDONED, owe it again as a 'gate' item (never a 'recheck') and report the failure; IF the re-confirmation finds anything changed, THEN SHALL do the same but report it as contention, not as a failure of the pass; and SHALL RELEASE the period lock once the outer transaction commits and before the knock-on (knock_on.complete), which takes it afresh, running census.after_move after the commit."
  - "S2 STRICT (the mirror, V4-Q1): THE SYSTEM SHALL assert in tests/test_package_gate.py::TestFirstTimePackage::test_notifications_held_back_when_clients_is_held_back that in a zip of Clients v2 (red on its own data) and Notifications v2 (green) over the FIRST-TIME fixture, Clients v2 is held back, Notifications' Client reference is re-run for Notifications v2 with no Clients in the warehouse, records not evaluated and red counted toward Notifications, and Notifications v2 is held back with criterion 13's could-not-be-checked wording; and that a later promotion of Clients v2 by a person re-checks and promotes Notifications v2 through the knock-on - written first and seen to fail."
  - "THE SYSTEM SHALL build every fixture of tests/test_package_gate.py from a stated content for EVERY Child Protection table in its period - which supply of each is in the warehouse, staged or absent - so that no assertion depends on a table the fixture forgot (Notifications and Investigations both read cp_case_workers): ESTABLISHED, a 2024-Q3 holding v1 of all six tables, promoted green; FIRST-TIME, a 2024-Q4 holding Case Workers, Carers, Investigations and Placements in the warehouse (put there by the fixture's setup) and no Clients or Notifications ever supplied; and EMPTY-BUT-WORKERS, a 2024-Q4 holding only Case Workers and Carers in the warehouse."
  - "S1 GREEN BRANCH: THE SYSTEM SHALL have tests/test_package_gate.py::TestPackageMateHeldBack::test_clients_rechecked_against_notifications_in_the_warehouse_and_promoted - a zip of Clients v2 (green) and Notifications v2 (red on blank values of its own) over the ESTABLISHED fixture - asserting that Notifications v2 is held back, that Notifications' Client reference is re-run for Clients v2 against Notifications v1 and passes, that Clients v2 is promoted, that the period then holds Clients v2 and Notifications v1, and that the knock-on re-runs nothing (every reader's counted result already read Clients v2) - written first and seen to fail, because today Clients v2 is promoted on the verdict against Notifications v2."
  - "S1 RED BRANCH: THE SYSTEM SHALL assert in the same class (test_clients_held_back_when_it_drops_clients_notifications_v1_points_at) that where Clients v2 lacks clients Notifications v1 points at, the re-run fails, Clients v2 is held back, and its 'promotion-withheld' entry carries criterion 13's fields and wording naming Notifications v1 and the held-back Notifications v2."
  - "S1 STEP 4: THE SYSTEM SHALL assert in the same class (test_rejecting_the_held_back_package_mate_changes_nothing) that a person rejecting Notifications v2 afterwards owes no re-evaluation and leaves Clients v2's results and decision unchanged, and (test_promoting_it_later_rechecks_through_the_knock_on) that a person promoting Notifications v2 instead re-checks Clients v2 through REQ-PIPE-121's knock-on - characterization guards, not claimed to fail first."
  - "V4-Q1, A CLEAN TABLE PROMOTES ALONE: THE SYSTEM SHALL assert in tests/test_package_gate.py::TestFirstTimePackage::test_clients_promotes_alone_when_only_its_reader_is_held_back that in a zip of Clients v2 (green) and Notifications v2 (red on its own data) over the FIRST-TIME fixture, Notifications v2 is held back, no readers-only run is recorded for Clients v2 (criterion 6's exception), and Clients v2 is promoted - written first and seen to fail (under v4 both were held back)."
  - "S3 AND S2b, A WAITING PARTNER JOINS: THE SYSTEM SHALL have tests/test_package_gate.py::TestStaggered::test_waiting_partner_promoted_with_the_later_file - over the FIRST-TIME fixture, Notifications v2 arriving alone at 08:40, held back red because no Clients is in the warehouse or staged; Clients v2 arriving alone at 09:00 whose run passes Notifications' Client reference against the staged Notifications v2 - asserting both promoted in one gate application and no readers-only run; and test_correction_promotes_with_the_waiting_notifications - after S2 strict (the mirror) leaves both held back, a clean Clients v3 arriving alone the next day is promoted together with the waiting Notifications v2 - both written first and seen to fail."
  - "S3b, A PARTNER WAITING FOR ITS OWN RED: THE SYSTEM SHALL assert in the same class (test_arrival_rechecked_against_the_warehouse_when_its_partner_is_red) that where Clients v2 waits red on its own checks and Notifications v2 arrives alone twenty minutes later, Clients v2 joins the gate application (over the ESTABLISHED fixture) and is not promoting, and Notifications v2 is gated on its Client reference re-run against Clients v1, not on its verdict against Clients v2 - written first and seen to fail."
  - "S10, THREE STAGGERED ARRIVALS, RE-ORDERED (architect v4 B1): THE SYSTEM SHALL have tests/test_package_gate.py::TestTransitiveGate::test_three_staggered_files_promote_together - over the EMPTY-BUT-WORKERS fixture, Notifications v2 at 08:40 (held back: no Clients or Investigations), Investigations v2 at 09:00 (held back: no Clients for its Client reference and Closed-case hygiene), Clients v2 at 09:20 - asserting all three are promoted in Clients v2's gate application with no readers-only run; test_three_staggered_files_in_the_original_order (Notifications 08:40, Clients 09:00, Investigations 09:20), asserting that Clients v2 promotes alone at 09:00 and Notifications v2 and Investigations v2 together at 09:20; and test_mutual_waiters_join (S11: Notifications and Investigations waiting on each other are both joined by a third arrival) - each written first and seen to fail."
  - "S5 CASCADE: THE SYSTEM SHALL have tests/test_package_gate.py::TestCascade::test_mutual_readers_settle_in_any_order - a zip of Clients v2, Notifications v2 and Investigations v2 over v1s, Investigations v2 red on its own checks - asserting the same promotions and hold-backs whichever order the three are listed in, and that the cascade stops when nothing changes - written first and seen to fail."
  - "T14, RE-FILED PARTNERS ARE EACH GATED ON THEIR CURRENT FILING (architect v4 B3): THE SYSTEM SHALL have tests/test_package_gate.py::TestRecheckEntry::test_refiled_partners_are_gated_on_their_current_filing, in which a person re-files Clients v2 and Notifications v2 from 2024-Q3 into 2024-Q4 (two owed re-checks) - asserting that while Notifications v2's re-check is owed it is not joined to Clients v2's application and is never promoted on its 2024-Q3 results, and that once both re-checks have run, each is promoted on results recorded for 2024-Q4 - and test_a_package_member_still_being_checked_is_not_joined, in which an application reaches a member of a package with a 'gate' item owed and neither joins nor promotes it - both written first and seen to fail."
  - "CONCURRENCY: THE SYSTEM SHALL have tests/test_package_gate.py::TestOnePeriodOneApplication - test_a_second_application_in_the_same_period_is_left_owed (the processing pass gating a package while the terminal's owed items run in the same period: the second finds the lock held, leaves its item owed, never waits, and the next pass gates it) test_a_failed_move_promotes_nothing (the second of two promotions of one application is made to fail: neither is promoted, the application is ABANDONED and owed as a 'gate' item, and its retry re-runs no tool and reuses none of the abandoned application's results), test_the_knock_on_is_not_blocked_by_its_own_application (architect v5 S1: after an application promotes Clients v2, its knock-on takes the period lock and runs in the same pass, so Clients v2 never reads 'recheck-owed') and test_a_cascade_shows_only_its_last_round (architect v5 S2: an S5 cascade of three rounds leaves one point per supply, keyed on the application) - both written first and seen to fail (today promote_each commits Clients v2 before Notifications v2's move is attempted)."
  non_functional_requirements:
  - "NO HALF-AND-HALF VIEW (Keith, 2026-10-21): a supply is never promoted on a verdict about a supply that will not be beside it in the warehouse (criterion 1)."
  - "NO FALSE GREEN: an absent partner is could-not-run, which is red for the table asking the question (criterion 8, REQ-PIPE-269 criterion 4); nothing is promoted because a check that could not read a table was left out."
  - "NO DEADLOCK BETWEEN CLEAN FILES (architect N1): every waiting supply connected through recorded verdicts joins the gate application, so two, three or more clean files arriving apart, or re-filed together, promote together when the last of them is checked."
  - "NO FLICKERING REDS (plans/running-thoughts.md #113): hold-backs are written only when final, and a re-check's results are not counted until the application settles (criterion 11)."
  - "PERFORMANCE OF THE CASCADE: each round re-runs only cross-table checks (never a supply's own), only for supplies the gate entry just checked, and a set of n supplies settles in at most n-1 rounds - at most 5 for Child Protection's six tables. Joining waiting supplies costs one status computation each and no run. On the bootstrapped history queried 2026-10-21, 12 of 53 multi-file Child Protection packages held a file that was never promoted. The added runs and wall clock are measured on the first bootstrap after build and the bootstrap figure in CLAUDE.md updated."
  - "SCALE (~30 collections): the connected set is bounded by one collection's tables in one period, never by the asset's."
  - "DETERMINISM AND REPLAY: the outcome is a fixed point evaluated over the whole set at once, independent of order (criterion 7), and which waiting supplies join is decided from recorded results alone, so a replay, a resume and a parallel bootstrap reach the same decisions."
  - "AUDITABILITY: every re-run names the hold-back that caused it (criterion 10) and every hold-back names its cause and the supply it was checked against (criterion 12), so 'why was this held back when its own data was fine' is answerable from the decision log alone."
  - "SECURITY: a person's override (promote, accept) keeps its allowlist, actor and mandatory reason; nothing widened."
  - "THE BUILD RULE: everything here is decided at run time where a connection is legitimately open; the dashboard build reads only what was recorded."
  - "ALL OR NOTHING AT THE WAREHOUSE (architect v4 S1): an application's promotions commit together or not at all, so a half-promoted delivery - the half-and-half view in the warehouse itself - cannot be left by a failed move."
  - "NO NESTED WAITS: a gate never blocks on another gate's lock, so a nested call on a second connection cannot self-deadlock; contention costs one owed item and one pass."
  - "ORDER IS RECORDED, NOT INFERRED: which verdict is newest is REQ-PIPE-279's run_seq, the same order the page uses; the per-period lock is also where 279 draws run_seq for an application's runs (REQ-PIPE-279's own NFR)."
