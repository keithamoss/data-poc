  decisions:
  - "RE-CHECK WHEN A PACKAGE-MATE IS HELD BACK, AND CASCADE (Keith, 2026-10-20/21): 'the others' cross-table checks re-run against the warehouse partner before any of them can promote', and 'Re-checks cascade within a package until nothing changes'; 'Things that depend on each other don't promote until they're all happy.'"
  - "A TRANSITIVE GROUP GATE (Keith, 2026-10-22, architect N1, put to Keith as a clarification of 'things that depend on each other don't promote until they're all good'; no objection): a gate application is the newly checked supplies plus every waiting supply in the period connected to them through recorded cross-table verdicts, transitively, settled by the fixed point, never running a check for a waiting supply, at every gate entry. It folds v3's REQ-PIPE-268 (a waiting partner promoted with the later file, the scoper's Q1) and v3's criterion 14 (a single arrival re-checked against the warehouse when its partner waits for its own red, Q2) into one rule; both answers become A. REJECTED v3's REQ-PIPE-268 as drafted, which judged each waiting supply alone and deadlocked S10 (three staggered files) and S11 (two waiting on each other). REJECTED Q1 B (promote the later file alone and let the knock-on bring the partner in: a moment of half-and-half) and Q1 C (both wait for a person: every staggered pair, 312 on the bootstrapped history)."
  - "EVERY GATE ENTRY, THE RE-CHECK EXECUTOR INCLUDED (architect, v3 draft review B2 and T14): re-files, un-supersedes and settlements gate through recheck.execute, the fourth entry v3 missed; a re-file batch is not a package (REQ-PIPE-265 criterion 1), but with every entry forming a connected gate application, re-filed partners clean together promote together."
  - "HOLDING A FAILING PAIR TOGETHER IS DELIBERATE (architect, v3 draft review): where two still-promoting supplies fail only against each other, both are held back; neither is promoted on a verdict about the other. Keith's 'don't promote until they're all happy'."
  - "ACCEPTED LIMIT: TWO TABLES PER CHECK (architect, v3 draft review): n-1 rounds and order-independence hold while every cross-table check reads exactly two tables - all ten reads_tables in the Child Protection Soda file name one other table today. A check reading three or more tables would make the outcome stricter than needed, never looser; accepted rather than designed for."
  - "NO HALF-AND-HALF VIEW (Keith, 2026-10-21): every result is either the warehouse view or the staging view. Criterion 1 is that principle at the gate: the gate's view is the warehouse as it will stand once this gate's promotions are made."
  - "STRICT: AN ABSENT PARTNER IS RED, NEVER EMPTY (Keith, 2026-10-21): 'It's the strictest rule. It's probably the easiest to sort of think about and understand.' REJECTED treating a table that was not supplied as empty. Red for the table that ASKS the question only (Keith, 2026-10-22, Q13 = B, REQ-PIPE-269 criterion 4)."
  - "RED ONLY (Keith, 2026-10-20/21): no new status, and no red that follows different rules. REJECTED v2's Incomplete status and red that promotes itself."
  - "A CARRIED VERDICT STOPS COUNTING WHEN A FILE IT READ IS HELD BACK (Keith, 2026-10-21): criterion 9. REQ-PIPE-265 itself is not amended."
  - "A SUPPLY ALREADY NOT PROMOTING IS NOT RE-CHECKED (delivery-scoper, 2026-10-21): no gate depends on its results. Accepted consequence: in S1's red branch Notifications v2's Client reference still shows its verdict against Clients v2, also waiting - a staging-view result in the 'Against what's staged' column (REQ-DASH-272) - and is judged against the warehouse by the knock-on if a person promotes it."
  - "THE STAGING VIEW, MADE PRECISE (delivery-scoper, from Keith's S1, for confirmation at the walk-through): once a package-mate is held back, 'what is staged for its dependencies' means what is staged AND still promoting with it - S1 step 3 has Clients v2 judged against Notifications v1, not the staged v2."
  - "REQ-PIPE-079'S OWN WORKED CASE AGREES (REQ-PIPE-079 decision 23, Keith 2026-09-26): 'judging notifications against a supply nobody accepted into Q3 would record a green that becomes retroactively meaningless if that supply is later rejected'. That is S3b, now handled by the transitive gate."
  - "TERMINAL WORDING LIVES IN REQ-PIPE-276 (delivery-scoper, 2026-10-22): v3's criteria 11 (exit code), 12 (next step) and 15 (override warning) moved there with the CLI review's corrections, so this requirement is the gate alone."
  - "RE-GATED, NEVER RE-CHECKED (delivery-scoper, carrying v3 REQ-PIPE-268's reasoning): a joined waiting supply needs no new run - the arrival's own run already evaluated the shared check against it, and that verdict counts toward both (REQ-QAC-037). Where a joined supply's verdict would need re-running, it is simply not promoting (criterion 4), and its results and decisions stay unchanged (architect v4 S4, restoring v3 268 criterion 3, which the v4 fold had dropped). So Keith's 'other tables are re-checked only on promotion' holds; what changes is that a waiting supply is re-GATED when a connected file lands, which is why REQ-PIPE-121's staging decision is refined rather than left silently contradicted."
  - "A CLEAN TABLE PROMOTES ALONE WHEN ONLY ITS READER FAILS (Keith, 2026-10-22, V4-Q1 = A, raised by the architect's and the CLI review's v4 B1): Clients declares no cross-table check, so under Q13 = B the Client reference check (declared on Notifications) counts only toward Notifications; with Notifications held back and none in the warehouse, Clients promotes on its own. This SUPERSEDES Keith's 2026-10-21 'Clients is held too' for that case. REJECTED V4-Q1 B, a zip promoting all or nothing - a package rule on top of the dependency rule, holding back clean data nothing depends on. The mirror is unchanged: a red Clients holds Notifications back, because Notifications' check cannot run with no Clients in the warehouse - so S2 strict is RE-CAST as that mirror (criterion 18) and S10 is RE-ORDERED, with the original order kept as a second test (architect v4 B1)."
  - "NO RE-EVALUATION THAT COULD COUNT TOWARD NOTHING (delivery-scoper, 2026-10-23, following V4-Q1): re-running a check declared on the not-promoting table against a period that holds no supply of that table records a could-not-run that REQ-PIPE-269 criterion 4 counts toward nothing - a readers-only run with no effect on any status, and a confusing row on the clean table's page. Criterion 6's exception skips it. Where the warehouse DOES hold a supply of that table (S1), the re-evaluation is evaluated and counts, so it still runs."
  - "COUNTED PER CHECK, NOT PER RUN (architect v4 B2): qa.tables_read is one row per logical table per run and period_overlay.build resolves every agreed table, so 'every supply the run read' made every verdict of every run in a six-table zip stop counting once one table was held back - S14's whole-quarter hold-back returning through the counting rule. The grain is the supplies of the tables THAT CHECK reads, which REQ-PIPE-279 records per result (qa.check_read); carried._same_supplies already compared per check."
  - "JOINABLE IS DEFINED (architect v4 B3): without it an application could join, and promote from its old recorded results, a supply re-filed into a new period whose re-check had not yet run (its period-dependent own checks unchecked), or a package member still waiting for its package, breaching REQ-PIPE-266 criteria 2 and 7. Mirrors the knock-on's existing #173 L3 skip."
  - "THE GATE ENTRIES ARE NAMED BY WHERE THEY ARE (architect v4, section 2): recheck.execute only runs tools (recheck.py:185-247); the entries are recheck._run_claimed, knock_on.complete, the package gate and processing_pass._one. A criterion 6 re-evaluation goes through execute() and so is never an entry - otherwise a gate would nest inside a gate."
  - "ONE LOCK PER PERIOD, TRY-LOCK, AND ONE OUTER TRANSACTION (architect v4 S1): nothing locked above the slot (decision_log.py:790), so a terminal running owed items could interleave with the pass gating a package in the same period; a blocking wait on a second connection self-deadlocks; uncommitted table-move DDL inside a decision transaction blocks dbt and Soda reads (the shape of the 2026-09-27 Soda lock hunt); and promote_each committed Clients v2 before Notifications v2's move. One outer transaction also gives REQ-PIPE-121 criterion 9's one knock-on per application for free."
  - "PER CHECK AT THE FIRST STEP TOO (delivery-scoper, 2026-10-23, found walking Keith's staggered flicker case): Clients v2 at 09:00 fails Client reference against Notifications v1; a clean Notifications v2 at 09:05 passes it against the staged Clients v2. Read loosely, v4's criterion 4 would have marked Clients v2 not promoting on the 09:00 failure against the warehouse, and the accepted five-minute flicker would have become a wait for a person. Criterion 5 now judges each check by its newest qualifying verdict, so both promote together at 09:05, as Keith's staggered acceptance assumes."
  - "A FAILED MOVE OWES THE WHOLE APPLICATION (delivery-scoper, 2026-10-23, extending Keith's Q3 = A 'a crash waits'): the architect proposed returning the failed supply to the fixed point as not promoting. REJECTED for now, because a not-promoting supply gets a final 'promotion-withheld' - a gate verdict - for an infrastructure fault, and its package-mates would be re-checked against the warehouse for that fault; a failed move is usually transient (a lock timeout), as a crash is. The architect agreed in his v5 review, conditional on ABANDONED applications and a gate-only retry (criteria 12 and 17)."
  - "NO from_warehouse COLUMN (delivery-scoper, 2026-10-23, standing on REQ-PIPE-279): v4 put a from_warehouse marker on qa.run; REQ-PIPE-279 records, per table a check read, whether it was read from staging or from the period. One fact, one place: a re-check against the warehouse is a readers-only run whose cause is a 'promotion-withheld' entry, and what it read is 279's record."
  - "FIXTURES STATE EVERY TABLE (architect v4 S6): S3, S10, S11 and T14 said 'nothing in the warehouse', but Notifications and Investigations both read cp_case_workers (Soda file, Assigned worker reference and Lead worker reference), so with no Case Workers both were strictly red and the assertions could not hold. Criterion 19's three named contents."
  - "THE REPLACEMENT SETTING IS PINNED (architect v4 reading of v4 open question 1): criterion 16, so the open question is closed."
  - "THE KNOCK-ON IS NOT BLOCKED BY ITS OWN APPLICATION (architect v5 S1): knock_on.complete is a gate entry and try-locks on its own connection, so holding the period lock through it would have left every promotion reading 'recheck-owed' red for a whole pass. The lock is released after the outer commit and the knock-on takes it afresh."
  - "ONE POINT PER APPLICATION (Keith, 2026-10-22, V5-Q1's technical answers, taken as the architect recommended; architect v5 S2): with each round's run caused by its own hold-back, REQ-PIPE-279 K4 made each round its own point, so an S5 cascade left several points minutes apart, the earlier ones about a supply that ended not promoting - visible once settled, against 'an intermediate result is never shown'. Every run inside an application is keyed on the application, so REQ-PIPE-279's highest-run_seq rule within a point shows the last round. caused_by_decision keeps the hold-back for audit. Amends REQ-PIPE-279's point key (criterion 8 of its v3 draft), wording in summary-v6.md. REJECTED keying each run on its hold-back decision, as v5 drafted."
  - "ABANDONED, AND NO REUSE FROM IT (architect v5 S3): after a rolled-back outer transaction, the application's committed hold-backs and readers-only runs remain under an application that will never settle; criterion 8's reuse could otherwise promote on results no page will ever count."
  - "A FAILED MOVE OWES THE GATE, NOT THE TOOLS; CONTENTION IS NOT A FAILURE (architect v5 S4, withdrawing his v4 alternative and agreeing with v5 reading 2 on these two conditions): Keith's Q3 = A reading ('a crash waits') is kept."
  - "A FIXED ROUND ORDER (architect v5 note): runs of one round are opened in dataset-id order so run_seq, and so which result is newest, is the same in every bootstrap (REQ-PIPE-262 criterion 13)."
  - "JOINABLE CLAUSE 3, MADE PRECISE (architect v5 note): 'newest results from a run filed to its current period' is the current run's qa.run.period against the current filing's slot; a held supply has no slot and is never joinable."
