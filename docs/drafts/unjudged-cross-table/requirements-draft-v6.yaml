  decisions:
  - "SEPARATED FROM THE GATE (delivery-scoper, 2026-10-22): v3 carried the terminal's wording inside REQ-PIPE-267; it is its own small requirement now, with the CLI review's corrections, so the gate and its wording can be reviewed apart."
  - "THE NEXT STEP DEPENDS ON WHETHER THE CAUSE IS STILL WAITING (CLI review of v3): v3's criterion 12 named the package-mate's decision first unconditionally, which is wrong once it has been rejected (Keith, Q10 = A)."
  - "OVERRIDE BY NAMING IT (Keith, 2026-10-22, Q8 = A, 'the scoper's draft, not the CLI reviewer's A''): a supply held back only by another is not a pickable decision from the queue line, but a hand override stays available by naming it. REJECTED A' (pickable from the queue with 'Deciding cp-notifications settles this one'); Keith was told he can switch."
  - "AN OVERRIDE THAT WILL MAKE THINGS WORSE SAYS SO (CLI review of v3, T13/S5): in S1 red the held-back Clients v2's re-check read Notifications v1, which IS in the warehouse, so v3's warning was silent; criterion 7 covers it."
  - "EXIT CODES KEEP THEIR FULL ORDER, AND qa IS FED BY THE GATE (CLI review v4 S1): processing_pass.exit_status's real order is failure 2, refused 3, red 1, OK 0, with EXIT_LOCKED 75 raised separately - v4 stated only 'backstop 3 over red 1'. mothman cp qa has no exit_status of its own and exits on its own run's results; the warehouse re-check is a separate readers-only run, so without feeding it in, Clients v2 checked last, green against the staged v2 and red on the re-check, would have exited 0."
  - "ONE ACTION, ONE WORD (CLI review v4 S4): 'promotion-withheld' already served the amber-hold stand-back and the replacement stand-back, and lifecycle_report said 'withheld' where decision_words says 'held back'. Every promotion-withheld now says 'held back'. REJECTED a package-only 'held back' beside a 'withheld' for the rest. No signed requirement quotes 'withheld by the rule' (checked 2026-10-23)."
  - "'TURNED DOWN' NEVER THROUGH _gate_words (CLI review v4 S5): _gate_words (filing_tui.py:603-608) rewrites 'rejected' as 'held back', which would turn Keith's Q10 'turned down' sentence into a gate outcome."
  - "A DELIVERY BEING GATED IS A QUIET GROUP (CLI review v4 S3d): the refusal stays as the flag route's backstop; the queue never invites a decision it would refuse."
  - "THE OWED RE-CHECK HAS TERMINAL WORDS (CLI review v4 S6): the door words a red in-warehouse supply 'in place - <reason>' (filing_tui.py:709), so a person could read 'recheck-owed' as 're-checked worse' and demote a supply about to clear by itself."
  - "THE RULE-MADE PROMOTION SAYS WHY (CLI review v4 S7, carried from v3 shape point 2, which v4 dropped)."
  - "UP TO EIGHT (CLI review v4 S8): v4's 'one line per supply it holds back' drifted from v3's 'one line per resulting outcome' and lifecycle_report._NAMED = 8."
  - "CONSEQUENCES NAME BOTH ENDS (CLI review v4 S9): the T13 line, the root-rejection line and the not-yet-due line."
  - "COMPLETE, COPYABLE COMMANDS (CLI review v4 S10): the override includes --supply and --reason, as _recheck_panel's does (filing_tui.py:578-583), and names the door route too."
