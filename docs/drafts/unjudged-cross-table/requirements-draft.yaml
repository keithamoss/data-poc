- id: REQ-PIPE-210
  title: "The terminal's queue names the other table beside a waiting supply that also could not be checked against it"
  date_written: "2026-10-14"
  story: "As the person working through supplies waiting on a decision in the terminal, I want a waiting supply whose cross-table checks also could not run to name the other table, so that I know part of its picture is missing before I promote or reject it."
  moscow: should
  status: not_started
  source: "Keith, 2026-10-14 morning, close-out Q19 option A ('page and terminal; a small pipeline requirement drafted now for the terminal queue'). Drafted by delivery-scoper 2026-10-14; re-folded by delivery-scoper 2026-10-20 for #95 (Q2 option B), which removes most of it - whether to keep the remainder at all is question Q12. NOT REVIEWED by delivery-architect or by a UX reviewer. Supersedes the version in docs/drafts/calendar-close-out/requirements-draft.yaml."
  acceptance_criteria:
  - "WHERE a supply waiting on a decision - red on a check of its own, or amber under 'hold' - is also INCOMPLETE, THE SYSTEM SHALL list it in the terminal's queue ('mothman > Filing decisions > {collection name} > Supplies waiting on a decision') as today, with a line 'No promoted <dataset> for <period>' (REQ-DASH-204 criterion 15) per table it could not be checked against, and SHALL NOT say that nothing needs deciding on it."
  - "THE SYSTEM SHALL work out which tables those are through REQ-PIPE-213's one function, which the dashboard build's REQ-DASH-204 line also uses, and SHALL NOT read supply rows or parse a reason's prose."
  - "THE SYSTEM SHALL NOT list in that queue a supply whose only reason to wait would be that it is INCOMPLETE - under REQ-PIPE-214 it is promoted - and SHALL count the queue as today."
  - "THE SYSTEM SHALL have fixture tests, written first and seen to fail, that drive the real queue with a reader red of its own whose cp_clients could not be read, asserting the line and that it is listed and counted as today, and with an Incomplete-only reader, asserting it is not in the queue."
  non_functional_requirements:
  - "NO FALSE QUIET: a reader with a fault of its own is never told nothing needs deciding (criterion 1)."
  - "ONE ANSWER: the page (REQ-DASH-204) and the terminal decide which tables through one function, so they cannot disagree."
  - "SECURITY: nothing is widened - the reader's own decisions keep their allowlist, actor and reason."
  dependencies:
  - REQ-DASH-204
  - REQ-PIPE-213
  - REQ-PIPE-214
  - REQ-PIPE-121
  - REQ-PIPE-115
  - REQ-GHUB-082
  decisions:
  - "THE TERMINAL GETS ITS OWN REQUIREMENT (Keith, 2026-10-14, close-out Q19 option A): the queue, like the page, invited a decision on the reader when the decision that clears it is another table's. REJECTED the page half only, and leaving both."
  - "MOST OF IT GOES (delivery-scoper, 2026-10-20, following Keith's Q2 option B): the readers this was written for - red only because of another table - now read INCOMPLETE and promote themselves, so they leave the queue. REMOVED as NOT NEEDED, BECAUSE nothing Incomplete-only is in the queue: the 'nothing needs deciding' line (close-out criterion 1), listing readers beneath their cause's item (2), the open-the-reader flow (3), the grouped-queue test (6) and the counting rule (7). What stays is close-out criterion 4 (a reader red of its own is listed as today, naming the other table), now criterion 1, and 5 (one function), now 2."
  - "THE COUNTING RULE IS MOOT, NOT REVERSED (Keith, 2026-10-14, follow-up F6 option A, 'the count is the number of things to decide'): it still holds - an Incomplete-only reader is not a thing to decide and is not in the count, because it is not in the queue. Architect M5's 'not counted becomes essential' is met that way. The rule's two open questions (a reader with nothing to sit beneath; the page's own counts) are CLOSED, NOT NEEDED, BECAUSE no Incomplete-only reader waits."
  - "THE SAME CAUSES AS THE PAGE (delivery-scoper, derived from Keith's close-out Q17 and Q19): every reason a table could not be read, now with REQ-DASH-204's one wording."
  - "THE READER'S OWN DECISIONS STAY (delivery-scoper): a person may still have a reason to reject a reader."
  - "SHOULD (Keith, 2026-10-14, follow-up F14 option B): REQ-PIPE-211 is must; this requirement is should."
  - "FOLDED 2026-10-14 (delivery-scoper, Keith's follow-up answers F6 and F14): the close-out criteria 6 and 7; F6's two open questions, now closed (above)."
  open_questions: []
- id: REQ-PIPE-211
  title: "Settling a contested pair, whatever the outcome, re-checks the datasets whose checks the contest stopped"
  date_written: "2026-10-14"
  story: "As the person who settles a contested pair, I want the datasets whose cross-table checks could not run because of the pair to be re-checked once I have settled it - even when I reject both files - so that they do not keep, for good, a result that says the pair is still contested."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-14 morning, close-out Q21 option A: after 'reject both' the readers are re-checked via a small pipeline follow-up; kept a must as drafted, Keith 2026-10-20, #95 Q9 option B. Found by the round 3 architect review (D19): the knock-on re-evaluates only when a period's holding changes, and rejecting both files changes nothing held. Drafted by delivery-scoper 2026-10-14; re-folded by delivery-scoper 2026-10-20 only where #95's Incomplete status changes its words. Supersedes the version in docs/drafts/calendar-close-out/requirements-draft.yaml."
  acceptance_criteria:
  - "WHEN the contest of a table in a period ends - by a person's settlement of the pair (REQ-PIPE-193), whatever the outcome, 'reject both' included, or by a later arrival superseding the pair (REQ-PIPE-118 criterion 13, REQ-PIPE-194 criterion 9), whether or not that arrival is promoted - THE SYSTEM SHALL record, in the same transaction as the settlement or the supersession, that a re-evaluation is owed of every cross-table check in that period recorded as not evaluated because that table was contested, through REQ-PIPE-121's one handler (knock_on), and SHALL NOT add a settlement-specific or supersession-specific re-evaluation path."
  - "THE SYSTEM SHALL evaluate those checks against what the period holds for the table once the contest has ended, and WHERE it holds nothing - both files rejected, or the later file that superseded the pair still waiting - SHALL record each as not evaluated, reading INCOMPLETE (REQ-PIPE-213), for the reason that now applies (REQ-PIPE-115), never as contested."
  - "THE SYSTEM SHALL apply the promotion gate to each waiting supply the re-evaluation touched, exactly as REQ-PIPE-121 criterion 3 does, and SHALL NOT demote, supersede or reject a promoted one (REQ-PIPE-121 criterion 6)."
  - "WHERE the settlement or arrival that ends the contest also moves or promotes a file, THE SYSTEM SHALL run one re-evaluation for it, covering both (REQ-PIPE-121 criterion 9), and SHALL NOT run two."
  - "IF the re-evaluation fails to run, THEN THE SYSTEM SHALL leave the settlement or the supersession standing and the re-evaluation owed, and complete it on the next processing pass (REQ-PIPE-121 criteria 14 to 16)."
  - "THE SYSTEM SHALL amend, in the same change, REQ-PIPE-193 criterion 23 so that a settlement owes the knock-on whatever its outcome, and REQ-PIPE-121 criterion 1 so that the end of a contest - by a settlement or by a later arrival superseding the pair - is among the knock-on's triggers, with the exact wording in summary-v2.md, which folds REQ-PIPE-215's amendment of criterion 1 into the same text."
  - "THE SYSTEM SHALL have fixture tests, written first and seen to fail, that end a Child Protection contest three ways - a settlement rejecting both files, a settlement choosing a file that is left waiting red, and a later file superseding the pair and left waiting - and assert in each that no result recorded as contested remains current for the readers in that period; and one that settles a pair in the terminal and asserts that the readers are re-checked before the outcome panel is shown."
  - "WHEN a pair is settled in the terminal - through the settle flow or the flag form (REQ-PIPE-193 criterion 15) - THE SYSTEM SHALL run the owed re-evaluation while the person waits, after the settlement's own QA runs and gates (REQ-PIPE-193 criterion 21) and before its outcome panel; SHALL name it, with the readers it covers, among what follows in the settlement's warning panel (REQ-PIPE-193 criterion 17); and SHALL show in the outcome panel each reader re-checked, with its status afterwards."
  - "WHEN a later arrival supersedes a contested pair, THE SYSTEM SHALL run the owed re-evaluation in the processing pass that files that arrival."
  non_functional_requirements:
  - "NO FALSE GREEN: the re-evaluation re-runs the readers' cross-table checks against what is there; it never clears an INCOMPLETE or a red by dropping a check."
  - "COST: cross-table checks only, never a reader's own table-level checks (REQ-PIPE-121 criterion 2); at thirty datasets a widely read table may have many readers, all covered by the one re-evaluation per decision."
  - "RELIABILITY: owed in the settlement's transaction and finished by the processing pass if interrupted (criterion 5)."
  - "AUDITABILITY: every result it records names the settlement as its cause (REQ-PIPE-121 criterion 5)."
  - "TEST FIRST: criterion 7's 'reject both' case is today's defect - the readers keep a 'contested' result for good (red today; INCOMPLETE with a stale 'contested' reason once REQ-PIPE-213 lands without this)."
  - "PERFORMANCE: a person settling in the terminal now also waits for the readers' cross-table re-check (criterion 8) - one re-evaluation per settlement, cross-table checks only, named in the warning panel beforehand so the wait is expected."
  dependencies:
  - REQ-PIPE-193
  - REQ-PIPE-121
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-PIPE-202
  - REQ-PIPE-118
  - REQ-PIPE-213
  - REQ-PIPE-215
  decisions:
  - "THE READERS ARE RE-CHECKED AFTER 'REJECT BOTH' (Keith, 2026-10-14, close-out Q21 option A, the architect's recommendation): otherwise they keep a contested result for good. REJECTED leaving them for the next supply or a person's re-check (REQ-PIPE-164)."
  - "EVERY OUTCOME, NOT ONLY 'REJECT BOTH' (delivery-scoper, following the architect's wording of option A): a file chosen as this period's supply and left waiting red changes nothing held either, so its readers would keep a stale 'contested' result too."
  - "SUPERSEDED IN PART 2026-10-14 by follow-up F5 - REQ-PIPE-121 criterion 1 is amended too. WAS: amend REQ-PIPE-193 criterion 23, not REQ-PIPE-121."
  - "PROPOSED AMENDMENT WORDING, REQ-PIPE-193 criterion 23 (delivery-scoper, 2026-10-14), unchanged by #95 and repeated in summary-v2.md for Keith's approval."
  - "REQ-PIPE-121 CRITERION 1 AMENDED ONCE, WITH REQ-PIPE-215 (delivery-scoper, 2026-10-20): the close-out batch's amendment 27 and REQ-PIPE-215's staged-rejected-or-superseded trigger are folded into one text in summary-v2.md, so the criterion is not amended twice in one sprint. Why the contest trigger is needed at all is unchanged from amendment 27: neither a settlement that leaves nothing promoted nor a later file superseding the pair and left waiting moves a table into or out of the period schema."
  - "A PAIR ENDED BY A LATER FILE ALSO RE-CHECKS THE READERS (Keith, 2026-10-14, follow-up F5 option A): criteria 1, 2, 4, 5, 7 and 9. REJECTED settlements only."
  - "IN THE TERMINAL THE RE-CHECK RUNS WHILE YOU WAIT (Keith, 2026-10-14, follow-up F7 option A): criterion 8. REJECTED leaving it owed for the processing pass. No amendment to REQ-PIPE-193 criterion 17."
  - "A 'REJECT BOTH' CHILD PROTECTION SCENARIO IS PLANTED, AS TS-81, BY REQ-GEN-206 (Keith, 2026-10-14, follow-up F8 option B), owned there, built after this requirement so its Expect is written against the fix - which under #95 reads 'Incomplete promoted', not red. REJECTED REQ-GEN-203 as its owner."
  - "MUST, AS DRAFTED (Keith, 2026-10-14, follow-up F14 option B; reaffirmed 2026-10-20, #95 Q9 option B): REJECTED the scoper's 2026-10-14 recommendation (Q9 option A) to demote it to should and reduce it to the trigger, the owed-if-interrupted rule and the terminal's after-settlement display, and REJECTED dropping it (Q9 option C). Under #95 the readers no longer stay red for good, but without this they keep a result that says the pair is still contested."
  - "B1 MOVED TO REQ-PIPE-215 (delivery-scoper, 2026-10-14 summary, done 2026-10-20): the knock-on's 'not evaluated is stale by itself' fix is REQ-PIPE-215 criterion 1, so this requirement depends on 215 rather than restating it. REQ-GEN-203's signed note that it depends on this requirement stands (architect M4 asked whether it was still needed; with this kept a must, it is)."
  - "FOLDED 2026-10-14 (delivery-scoper, Keith's follow-up answers F5, F7, F8 and F14): moscow must; criteria 1, 2, 4, 5, 6 and 7 reworded; criteria 8 and 9 added; a performance NFR added; REQ-PIPE-118 added as a dependency; batch amendment 27 revised."
  - "RE-FOLDED 2026-10-20 (delivery-scoper): only the story, criterion 2, criterion 6's pointer, two NFRs, two dependencies and these decisions changed; every criterion Keith signed off in shape is kept."
  open_questions:
  - "CHECK AT BUILD (architect, not a question for Keith): REQ-PIPE-121 criteria 9 and 15 are worded for a decision and a promotion. Confirm that a contest ended by an arrival's supersession needs no amendment to either beyond the folded criterion 1 text, or say where the supersession trigger belongs instead (REQ-PIPE-118)."
