  - id: REQ-PIPE-352
    title: "Each asset is bootstrapped into its own database from its own configuration, within 12 minutes each, and the two bootstraps' cost is measured against today's single one"
    date_written: "2026-10-31"
    story: "As whoever runs the pipeline, I want each asset bootstrapped into its own database, separately, so that each holds only its own asset's history and a change to one asset never costs a rebuild of the other."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: two dashboards, each built only from its own asset's database); Keith's answer to draft Q5 (a), 2026-10-31. Drafted by delivery-scoper 2026-10-31, v2 the same day. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN `mothman pipeline bootstrap` runs, THE SYSTEM SHALL generate, stage, check and promote only the selected asset's collections, into the selected asset's database, and SHALL refuse where the database's identity is another asset's (REQ-PIPE-343)."
      - "THE SYSTEM SHALL replay every calendared collection of an asset as one receipt-ordered stream, since one baseline puts them all on one calendar (REQ-PIPE-262 criterion 1 as amended by A12), and each no-calendar collection as a stream of its own."
      - "THE SYSTEM SHALL generate each asset's scenario map from that asset's own history, at SCENARIOS-<asset>.md in the repository root where SCENARIOS.md is today (PROPOSED), the test scenario register in plans/supply-model.md staying one register; and IF a registered scenario names datasets of two assets, THEN `mothman check` SHALL fail, naming it."
      - "THE SYSTEM SHALL have the session-start hook start one database per asset, mark each (REQ-PIPE-343) and report each one's staged-table count, naming the asset."
      - "WHEN each asset's bootstrap runs from empty on this sandbox, THE SYSTEM SHALL finish within 12 minutes of wall clock (REQ-PIPE-250 criterion 2 as amended by A22)."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence, from empty on this sandbox, each asset's bootstrap wall clock alone and both run side by side, beside today's single bootstrap and its per-stream figures on the same commit (REQ-PIPE-336 evidence: Birth Registrations 814s, the quarterly stream 2507s, 3509s in all), with and without the two test collections."
    non_functional_requirements:
      - "PERFORMANCE: the split adds no work - today's bootstrap already runs Birth Registrations and the quarterly stream as separate processes (REQ-PIPE-262 criterion 6) - so side by side it should cost about what today's does, plus the two test collections. Today's 3509s exceeds the larger stream's 2507s by about Birth Registrations' 814s, which suggests the streams are not fully overlapping now; criterion 6's figures will say."
      - "PERFORMANCE, RISK: the quarterly stream alone took 2507s (about 42 minutes) on REQ-PIPE-336's commit, so criterion 5's 12 minutes rests on REQ-PIPE-250's speed-up work landing; the split does not make it faster."
      - "RELIABILITY: one asset's bootstrap failing leaves the other's database untouched, since no process holds both (REQ-PIPE-343 criterion 5)."
      - "PRIVACY: each database holds one asset's supply rows only."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-343
      - REQ-PIPE-345
      - REQ-PIPE-365
      - REQ-PIPE-262
      - REQ-PIPE-250
      - REQ-GEN-045
    decisions:
      - "TWO DATABASES, TWO BOOTSTRAPS (Keith, 2026-10-31, implied by 'each built only from its own asset's database')."
      - "ONE STREAM PER ASSET (delivery-scoper): REQ-PIPE-262 grouped collections by shared calendar; under one baseline that grouping is every calendared collection of the asset. plans/running-thoughts.md #111 is unchanged by this."
      - "A SCENARIO MAP PER ASSET, ONE REGISTER (delivery-scoper, PROPOSED): SCENARIOS.md is generated with the history (REQ-GEN-045 criterion 3), and each asset has its own history."
      - "THE 12-MINUTE TARGET APPLIES TO EACH ASSET ON ITS OWN (Keith, 2026-10-31, draft Q5 (a)): criterion 5. REJECTED (b), measure and report only, and (c), a ceiling on each bootstrap beyond REQ-PIPE-250's."
    open_questions: []

  - id: REQ-TEST-353
    title: "CI checks both assets on every push within 10 percent of today's billed minutes on a cache hit, each asset's bootstrapped database cached on its own key, and records the cache-miss cost"
    date_written: "2026-10-31"
    story: "As Keith paying for CI from a 2,000-minute monthly allowance, I want both assets checked on every push at about the cost of checking today's one combined asset, so that the split does not cut how often finished work can be pushed."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131; CLAUDE.md's CI minutes budget (REQ-TEST-260); Keith's answers to draft Q5 (a) and architect Q2 (a), 2026-10-31. Drafted by delivery-scoper 2026-10-31, v2 the same day. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL key each asset's cached bootstrap with REQ-PIPE-365 criterion 3's cache key, and SHALL cache that asset's data/<asset>/ paths beside its dump, so that a change to one asset's configuration restores the other asset's cache."
      - "THE SYSTEM SHALL bootstrap or restore both assets' databases in the one test-deployment job, side by side, each as its own process with its own MOTHMAN_ASSET and DSN, and SHALL NOT add a second deployment job."
      - "THE SYSTEM SHALL run `mothman dashboard rebuild-results` and `mothman dashboard build-data` once per asset in that job (test.yml lines 508-511 today), each with its own MOTHMAN_ASSET."
      - "THE SYSTEM SHALL run the deployment half's tests in one pytest session against both assets' databases, each test opening only its own asset's (REQ-PIPE-343 criterion 6), and the fast half's configuration tests against every asset folder."
      - "THE SYSTEM SHALL say in the job log, per asset, whether its database was restored or rebuilt and from which key (REQ-TEST-117 criterion 4)."
      - "THE SYSTEM SHALL keep the fast half's skip count at zero with both assets present."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence, from `mothman github ci-usage`, the billable minutes of a cache-hit run and of a cache-miss run before and after the split, and SHALL record the requirement as not met where the cache-hit run after bills more than 10 percent above the cache-hit run before (about 39 minutes today)."
    non_functional_requirements:
      - "COST: one runner, two databases, both bootstraps in parallel - billed about as today's single job, which already runs both streams. A second job would bill a second runner's setup and every install step again on every push."
      - "COST: per-asset cache keys mean a daily-only edit rebuilds only the daily bootstrap (814s on this sandbox) rather than the quarterly one. A shared-code edit misses both caches, which is why the cache-miss figure is recorded, without a ceiling of its own."
      - "RELIABILITY: a cache restore of one asset never restores into the other's database; each dump is named for its asset and checked by the guard after restore."
      - "NO LIVE DATA IN CI: both databases hold synthetic data generated on the runner (REQ-TEST-117 criterion 5)."
    dependencies:
      - REQ-PIPE-352
      - REQ-PIPE-365
      - REQ-TEST-117
      - REQ-TEST-260
    decisions:
      - "A CEILING ON CACHE-HIT CI MINUTES, AND THE CACHE-MISS FIGURE RECORDED (Keith, 2026-10-31, draft Q5 (a), with the architect's addition). REJECTED (b), measure and report only, and (c), a ceiling on both CI and each bootstrap."
      - "ONE DEPLOYMENT JOB, NOT TWO (Keith, 2026-10-31, architect Q2 (a)): criterion 2. REJECTED a job per asset, which would report a daily failure sooner but bill a second runner on every push."
    open_questions: []

  - id: REQ-PIPE-354
    title: "Each asset has its own Cloudflare Pages project and Access allow-list, built and published only from its own asset's database; today's project becomes the quarterly asset's, and an old Birth Registrations link says where it went"
    date_written: "2026-10-31"
    story: "As someone given access to one team's register, I want that asset's dashboard on a site of its own, behind its own sign-in, showing only its own asset, so that the two teams' registers are as separate as their data, and a link I saved before the split still tells me where to go."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131; Keith's answers of 2026-10-31 to architect Q1 (a), one Cloudflare project per asset, and on the old address (a). Rewritten by delivery-scoper 2026-10-31 from v1's two dashboards on one site. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN the dashboard is built, THE SYSTEM SHALL build it for the selected asset only, from that asset's recorded QA results and configuration, and SHALL embed no collection, calendar, person or result of another asset."
      - "THE SYSTEM SHALL name the asset in the built dashboard's masthead and title, from a name declared in its data-asset.yaml (PROPOSED: 'Quarterly data asset', 'Daily data asset'), as well as the environment and commit (REQ-PIPE-092 criteria 7 and 17)."
      - "THE SYSTEM SHALL publish each asset to the Cloudflare Pages project, production branch, address and Access sign-in domain its own data-asset.yaml declares (REQ-PIPE-255 criterion 8 and REQ-PIPE-257 criterion 8 as amended by A24 and A25), each project with its own Access applications and its own allow-list."
      - "THE SYSTEM SHALL configure for the quarterly asset the Pages project REQ-PIPE-255 sets up for today's asset, and for the daily asset a new project, and SHALL publish nothing at today's address for the daily asset."
      - "WHEN a publish runs, THE SYSTEM SHALL pass wrangler only the selected asset's project, shown by a test with REQ-PIPE-255 criterion 30's stub wrangler that publishes under each asset and asserts the project named."
      - "WHERE an asset's data-asset.yaml declares collections that moved to another asset (PROPOSED key: moved_to, each entry an agency, collection or dataset id, the name of the asset it moved to and that asset's dashboard address), WHEN the dashboard is opened at a route naming one of them, THE SYSTEM SHALL show in place of the not-found page one line - 'Birth Registrations has moved to the Daily data asset's dashboard' (PROPOSED wording) - with the address as a real link carrying the same route and query, and SHALL NOT redirect."
      - "THE SYSTEM SHALL declare in the quarterly asset's data-asset.yaml a moved_to entry for Registry Services, Civil Registration and Birth Registrations, and SHALL have a real-browser test that opens a pre-split Birth Registrations dataset route on the quarterly dashboard, asserts the line and the link's address, and asserts the page did not navigate."
      - "THE SYSTEM SHALL archive each publish's snapshot under dashboard/snapshots/<asset>/, and SHALL leave the archive already committed at dashboard/snapshots/ unchanged, published with the quarterly asset's site only (PROVISIONAL on open question Q3)."
      - "THE SYSTEM SHALL keep each built dashboard a single file openable from file:// with no live external dependency, with the fonts and vendor assets copied into each asset's site tree (REQ-PIPE-092 criterion 3)."
      - "THE SYSTEM SHALL keep the repository-wide tabs - Plans, Release Notes, Demo and Feedback - in each asset's dashboard, and the Scenarios tab showing that asset's own scenario map (REQ-PIPE-352 criterion 3)."
    non_functional_requirements:
      - "PRIVACY: a build may read recorded QA results, never actual data, and never anything else (Keith, 2026-09-27) - and now never another asset's results either. Each publish runs where its own asset's database is (REQ-PIPE-092)."
      - "SECURITY: one project per asset means one asset's publish cannot touch the other's site, and each team's allow-list admits only its own people (REQ-PIPE-257 criterion 3, per project)."
      - "NOTHING READS ANOTHER ASSET: the moved_to entry is the quarterly asset's own declaration about its own past, not a read of the daily asset's configuration; if the daily address changes, that entry changes with it by hand."
      - "PERFORMANCE: each dashboard embeds one asset, so each page is smaller than today's combined one; both sizes measured and reported beside today's."
      - "COMPATIBILITY: self-hosted fonts and vendor assets in each site, nothing from a CDN (government networks)."
      - "COST: a second Cloudflare Pages project and Access application on the free tier; no CI minutes, since publishing runs where the database is."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-352
      - REQ-PIPE-092
      - REQ-PIPE-255
      - REQ-PIPE-257
      - REQ-GHUB-258
    decisions:
      - "ONE CLOUDFLARE PROJECT PER ASSET, EACH WITH ITS OWN ACCESS ALLOW-LIST (Keith, 2026-10-31, architect Q1 (a)): matches the two-team target and removes per-path publishing. It SUPERSEDES v1's 'two dashboards on one site, /quarterly/ and /daily/' (Keith's earlier (a), which predated knowing REQ-PIPE-255 uploads a whole tree). REJECTED (b), one combined project rebuilt from both databases on every publish."
      - "TODAY'S PROJECT BECOMES THE QUARTERLY ASSET'S; THE DAILY ASSET GETS A NEW ONE; NO LANDING PAGE AND NO REDIRECT SCRIPT; AN OLD BIRTH REGISTRATIONS LINK SHOWS A ONE-LINE NOTICE (Keith, 2026-10-31, old address (a)). REJECTED (b), new projects for both with a linking page at today's address. This drops v1's landing page and old-link redirect, and with them UX MUST 5 and UX Q2."
      - "THE NOTICE IS CONFIGURATION, NOT A READ OF THE OTHER ASSET (delivery-scoper, PROPOSED): criterion 6's moved_to key, so the rule that nothing reads another asset's configuration holds. It links rather than redirects, keeping the route so the reader lands where they meant to."
      - "THE PRE-SPLIT SNAPSHOT ARCHIVE IS NOT REWRITTEN (CLAUDE.md: dashboard/snapshots/*.html.gz accumulate and are never deleted as generated cruft); where it is served is Q3."
      - "HOSTING AMENDMENTS (architect BLOCKING 1): REQ-PIPE-255, REQ-PIPE-257, REQ-GHUB-258 and REQ-DOCS-259 are amended for two projects (A24 to A27). They are signed but not built, so the amended text holds whichever lands first; Q2 says which order is recommended."
    open_questions:
      - "Q2 (Keith to decide; recommendation (a)) - ORDER OF THE CLOUDFLARE HOSTING AND THE SPLIT. REQ-PIPE-255, 257 and 258 are signed and not started. (a) RECOMMENDED: build them first, for today's one asset, so the split only adds a second project; the daily asset cannot publish until this requirement is built, because its data-asset.yaml has no project until then and REQ-PIPE-255 refuses a missing key. (b) The split first, then REQ-PIPE-255 built per asset from the start: no second pass over the hosting code, but between the move and REQ-PIPE-255 both assets would push to the one gh-pages branch and one would overwrite the other, so the daily asset's publish would have to be refused in the meantime."
      - "Q3 (Keith to decide; recommendation (a)) - WHERE THE PRE-SPLIT SNAPSHOT ARCHIVE IS SERVED. Every committed snapshot holds Birth Registrations beside Child Protection. (a) RECOMMENDED: with the quarterly site only - it is today's project's history, and the archive is synthetic. (b) With both sites: each team sees the combined past, and each sees the other's. (c) Neither, kept in the repository only. At real scale (a) would show the quarterly team daily-asset results; that is the trade to accept or reject."

  - id: REQ-DASH-355
    title: "A global period control sits beside the date control, is carried in the URL and across navigation, and with no period chosen every page renders as it did before the change"
    date_written: "2026-10-31"
    story: "As Keith during a quarterly refresh and release, I want to choose a period - 2026-Q2 - once in the header and have every page show what we know about that period as at the date on show, so that I can see a period's whole picture, including what arrived about it later, without losing my place."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: a period view alongside as-at; a global period control beside the global as-at control); dashboard UX review MUST 1-3 and SHOULDs; Keith's answer to UX Q4 (a), 2026-10-31. Drafted by delivery-scoper 2026-10-31, v2 the same day. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL show in the dashboard header, beside the date control, a period control reading 'For period: <period name>' when a period is chosen and 'Period: all current' when none is - 'For day: <date>' and 'Day: all current' WHERE the asset's baseline is daily (PROPOSED wording) - opening a labelled panel to choose or clear one."
      - "THE SYSTEM SHALL offer as choices the periods of the asset's baseline in the embedded PERIOD_SEQUENCES, from the first any dataset owes to the newest any slot has opened (REQ-DASH-054 criterion 3), newest first and grouped under year headings; and WHERE the baseline is daily, THE SYSTEM SHALL offer a date input bounded to that range in place of a list."
      - "THE SYSTEM SHALL carry the chosen period in a query parameter, period=<period name>, beside in-place-on, keep it across every navigation and in every link the page builds, as in-place-on is kept, and drop it only when the reader clears it."
      - "WHEN the period is chosen or cleared with the control, THE SYSTEM SHALL replace the current history entry rather than add one, as the date control does, so that Back and Forward do not step through period choices."
      - "THE SYSTEM SHALL keep the date on show when the period changes, and the period when the date on show changes."
      - "WHILE a period is chosen, THE SYSTEM SHALL show one statement in #in-place-on-past-notice, styled .in-place-on-range-notice, in place of the past-date notice - 'Showing <P> — results recorded by the end of <date> · Clear period' (PROPOSED wording), 'Clear period' a button that clears it - and SHALL label the date control 'Results recorded by: <date>' in place of 'In the warehouse on' (PROPOSED)."
      - "WHILE a period is chosen, THE SYSTEM SHALL add ' · <P>' to document.title, and SHALL announce 'Showing <P>' through #route-announcer when it is chosen and 'Showing all current' when it is cleared."
      - "IF the period parameter names no period of the asset's baseline, THEN THE SYSTEM SHALL say so in a notice naming the value, as the stale-link notice does, remove the parameter with replaceState, and show the page with no period chosen."
      - "WHILE a period is chosen and the date on show is before that period opened for a collection, THE SYSTEM SHALL show '<period> had not opened by <date>' in that collection's own panel on the agencies list and agency page, in place of that collection's content, leaving every other collection as it is."
      - "WHILE no period is chosen, THE SYSTEM SHALL render the agencies list, an agency page and a dataset page on two dates exactly as before this change, held by a real-browser test comparing each page's rendered text with a capture taken from the build of the commit before this change against the same recorded history, asserting first that each capture is non-empty and holds the page's heading."
      - "THE SYSTEM SHALL keep the in-place-on selection a calendar date in its own parameter (REQ-DASH-054 criterion 7, unchanged)."
    non_functional_requirements:
      - "PERFORMANCE: choosing a period re-renders from data already embedded, as changing the date does - no fetch, no rebuild - and should feel as immediate as the date control does today."
      - "SCALE: about 55 quarterly periods today, grouped by year so the list stays scannable; one per day on the daily asset, where the date input keeps it from becoming hundreds of items."
      - "COMPATIBILITY: a plain file:// open works; shared links keep both parameters (docs/spa-best-practices.md)."
      - "ACCESSIBILITY: the control is a real button with a labelled panel, keyboard-reachable, as the date control is; the period is in the title and announced (criterion 7)."
      - "ONE VOCABULARY: any status word the period view shows follows REQ-DASH-359."
    dependencies:
      - REQ-PIPE-345
      - REQ-PIPE-354
      - REQ-DASH-054
      - REQ-DASH-359
    decisions:
      - "A PERIOD VIEW, ALONGSIDE AS-AT (Keith, 2026-10-31, rejecting all three options put for the geocoding batch's J1/G1 surfacing question - accept, a quiet notice, or move the timing): 'what we need here is a new way to view the dashboard ... almost by period'. Supersedes the geocoding batch's J1 question."
      - "A GLOBAL PERIOD CONTROL, BESIDE THE GLOBAL AS-AT CONTROL (Keith, 2026-10-31): 'something like another global as at control ... that's what I want'. In the header, in the URL, kept across navigation like as-at; every page reads it; with no period chosen every page behaves as today. REJECTED growing only the existing period page (REQ-DASH-209) into the view."
      - "THIS REOPENS A RECORDED DECISION, AND KEITH WAS TOLD SO (2026-10-31): REQ-DASH-054 decision 14 (2026-09-23) rejected a period picker beside the date because a period name is ambiguous once several calendars exist. One baseline per asset (REQ-PIPE-345) removes that ambiguity. REQ-DASH-054 criterion 7 - the date stays a date - still holds."
      - "MOSTLY FOR THE QUARTERLY ASSET, APPLIED TO EVERY CADENCE (Keith, 2026-10-31); ON THE DAILY ASSET THE CONTROL STAYS, LABELLED 'For day' (Keith, 2026-10-31, UX Q4 (a)). REJECTED (b), hiding it on the daily asset."
      - "WRITTEN AGAINST THE POST-SPLIT SHAPE (Keith, 2026-10-31, sequencing (c)). REJECTED (b), a period control on today's combined asset with an interim rule for Birth Registrations."
      - "GLOBAL, NOT ONE DATASET (Keith, 2026-10-30 ~23:55): 'I'd also want this fix to apply globally, not just to one dataset.'"
      - "THE LIST ENDS AT THE NEWEST OPENED PERIOD, NOT AT TODAY'S (UX MUST 1): at files_go_to_period 1 collections are already filling the next quarter, so bounding by the build's date would hide a period with real supplies. REQ-DASH-054 decision 2's no-future rule is kept in its REQ-DASH-326 form: nothing no slot has opened."
      - "WHAT THE DATE MEANS WHILE A PERIOD IS SET (UX MUST 3): 'In the warehouse on' is false when the supply on show has since been replaced, and a period's results read as today's is a mode error. Criterion 6 says one true thing instead."
      - "BACK AND FORWARD DO NOT STEP THROUGH PERIODS (Keith's period-page answer, which made UX MUST 4 and UX Q3 moot): the period is set only by the control, which replaces the history entry as the date does (criterion 4)."
      - "'Period: all current' WHEN NONE IS CHOSEN (UX SHOULD), rather than v1's 'For period: none', which reads as an empty result."
      - "THE ARRIVAL-CONTEXT DRILL KEEPS SETTING THE DATE, NOT THE PERIOD (UX review, on Q1): REQ-DASH-085, 100 and 198 unchanged. A SCENARIO JUMP NEITHER SETS NOR CLEARS THE PERIOD (delivery-scoper): REQ-DASH-208 unchanged."
      - "A PERIOD MODE ON THE AS-AT SWITCHER WAS FLOATED AND DROPPED (Keith, about midnight 2026-10-30, then 'Hmm maybe it's OK as it is'): superseded by the separate control; recorded so it is not re-proposed."
      - "THE NO-PERIOD GUARD CAN FAIL (UX, proofs that cannot fail): v1's 'passing on today's page' compared the page with itself; criterion 10 compares against a capture of the build before the change."
    open_questions: []

  - id: REQ-DASH-356
    title: "With a period chosen, the agencies list, agency pages and dataset pages show that period's supplies and every result recorded about them as at the date on show, later linkage and geocoding verdicts included, source supplies and derived releases in separately named sections"
    date_written: "2026-10-31"
    story: "As Keith during a quarterly release, I want 2026-Q2 to show both what arrived for Q2 from the source agencies and what the linkage and geocoding releases for Q2 found about those supplies, kept apart, so that a verdict recorded hours after a supply was replaced as current is still seen on that supply's own page."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-30 ~23:50, 'How can we view the results for a whole period?'; 2026-10-31 morning: two distinct views, keyed by period); plans/post-build-review.md #289 J1; Keith's answer to UX Q1 (c), config-driven, 2026-10-31; dashboard UX review SHOULDs and proofs. Drafted by delivery-scoper 2026-10-31, v2 the same day. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHILE a period P is chosen, THE SYSTEM SHALL show on each dataset page the supply P holds for that dataset at the end of the date on show - Promoted, Inherited from <period>, Substituted from <period>, Not supplied or Not owed - found by the same lookup REQ-DASH-209 uses (promotionStateOn over the embedded slot timeline), headed 'For <P> · results recorded by <date>' (PROPOSED)."
      - "WHILE a period P is chosen, THE SYSTEM SHALL show on that dataset page its own checks' results about that supply recorded by the end of the date on show, and every result of another collection's check that read that supply (the reads the build embeds from qa.check_read) recorded by then, whenever it was recorded, grouped by the reading collection as REQ-DASH-337 groups them, each saying when it was recorded."
      - "WHILE a period P is chosen, THE SYSTEM SHALL compute each dataset's status for P from those results, counting another collection's verdict toward it as REQ-PIPE-332 counts it, and roll it up to its collection and agency by the page's existing rollup rule."
      - "WHILE a period P is chosen, THE SYSTEM SHALL show the agencies list and each agency page in two sections: 'Source supplies for <P>', holding every collection none of whose datasets declares linked_datasets, and a second section holding every collection whose datasets declare linked_datasets, headed '<the configured names of those collections> for <P>' - today 'Linkage Products for <P>' (PROPOSED; open question Q1) - each name taken from the asset's data-asset.yaml and never written in code, and each section's status rolled up on its own."
      - "WHERE an agency has collections in both sections, THE SYSTEM SHALL show it in each, each card rolling up only that section's collections; and WHERE a section would hold no collection, THE SYSTEM SHALL show neither it nor its heading."
      - "IF a collection holds both a dataset that declares linked_datasets and one that does not, THEN `mothman check` SHALL fail, naming the collection and both datasets (PROPOSED), so that a section heading never misdescribes a collection."
      - "THE SYSTEM SHALL take everything it shows under a chosen period from the timelines, results, reads and PERIOD_SEQUENCES the build already embeds; before adding anything to the build, THE SYSTEM SHALL record in evidence each fact the view needs, whether the build already embeds it (pipeline/build_dashboard_data.py and pipeline/slot_timeline.py, among them) and, where it does not, what is added; and SHALL NOT read supply rows, a period schema or its _manifest."
      - "THE SYSTEM SHALL have a real-browser test that, on the daily dashboard, first asserts the day chosen is not a Monday and that the Mental Health dataset is on the page, then asserts its row reads 'Inherited from <the previous Monday>' with the sub-line 'Not owed — it supplies only on Mondays' (REQ-DASH-347 criterion 2), and neither failing nor 'No data'."
      - "THE SYSTEM SHALL have a real-browser test, written first and seen to fail, against a dashboard built from the quarterly history: with a Child Protection period chosen, at a date after that period's linkage release, the Client Register page shows the linkage verdict about the supply filed to that period, which the same page with no period chosen does not show (post-build-review #289 J1); asserting first that the verdict exists in the recorded results."
      - "THE SYSTEM SHALL measure each built dashboard's size before and after this change and report both in evidence, with no size budget (REQ-DASH-209 criterion 11's precedent)."
    non_functional_requirements:
      - "PRIVACY: computed from recorded QA metadata only; people shown by display name, never email address (REQ-DASH-209 decision 21)."
      - "SCALE: at about thirty quarterly collections, the two-section split is derived from linked_datasets, so it holds as linkage and geocoding products grow, with no list to maintain; the second heading names collections, which stay few, rather than datasets, which grow."
      - "PERFORMANCE: a period choice is a lookup over embedded timelines, as the date is; page weight measured (criterion 10)."
      - "OBSERVABILITY: each result says when it was recorded, so a verdict that arrived after the supply was replaced as current is legible as such."
      - "ONE VOCABULARY: status words follow REQ-DASH-359."
    dependencies:
      - REQ-DASH-355
      - REQ-DASH-367
      - REQ-DASH-337
      - REQ-PIPE-331
      - REQ-PIPE-332
      - REQ-DASH-347
      - REQ-QAC-348
      - REQ-QAC-350
      - REQ-DASH-359
    decisions:
      - "KEYED BY PERIOD, NOT BY ROUND (Keith, 2026-10-31, (a)): a view of 2026-Q2 shows the source supplies filed to Q2, which arrived in an earlier round, and the linkage and geocoding releases for Q2, which arrive in a later round, in two sections, one per workstream, with the as-at time picked within it. REJECTED (b), a view by round or refresh, and (c), both views."
      - "TWO DISTINCT VIEWS FOR A QUARTERLY REFRESH (Keith, 2026-10-31): what we know about the source data arriving for its period, and what we know about the linkage products and geocoding for the current period - 'distinct, separate releases, almost separate work streams'."
      - "ONE GENERIC RULE (Keith, 2026-10-30): any result recorded about a period's supply, whenever it arrived and whichever collection's check recorded it."
      - "SECTION NAMES ARE CONFIG-DRIVEN (Keith, 2026-10-31, UX Q1 (c) as he amended it): 'Source supplies for <P>' and a second heading from the configured names of what derives from other collections' supplies, taken from data-asset.yaml's names and linked_datasets declarations. REJECTED (a) 'Derived releases' and (b) v1's 'Releases about other collections' supplies'."
      - "THE SECOND HEADING NAMES COLLECTIONS, NOT DATASETS (delivery-scoper, PROPOSED; Q1): Linkage Products holds Linkage Keys and several geocoding datasets, and the dataset list grows with each geocoding product while the collection name does not."
      - "THE WORKSTREAM IS DERIVED FROM linked_datasets (delivery-scoper): REJECTED a 'workstream:' key, which could disagree with what a collection reads; REJECTED files_go_to_period, which describes timing. Geocoding (REQ-QAC-294) declares linked_datasets too."
      - "A MIXED COLLECTION IS REFUSED (delivery-scoper, PROPOSED, answering the UX SHOULD): criterion 6. REJECTED placing it by any one dataset, which would put a source dataset under a derived heading; no collection is mixed today."
      - "REUSE WHAT THE BUILD ALREADY EMBEDS FIRST (architect NIT): much of it is (build_dashboard_data.py 247-252, 627, 942; slot_timeline.py 284), so criterion 7 records the gap before adding to it."
      - "THE OPTIONS BEFORE THE CONTROL WAS CHOSEN (2026-10-30, not taken): (a) results on the period page, (b) the dataset page opening by period, (c) both."
    open_questions:
      - "Q1 (Keith, at sign-off as he asked; recommendation (a)) - WHAT THE SECOND SECTION'S HEADING NAMES. (a) RECOMMENDED: the derived collections' names - 'Linkage Products for 2026-Q2' - short, and stable as geocoding products are added. (b) Their datasets' names - 'Linkage Keys and geocoding for 2026-Q2', using a configured group name for the geocoding datasets - closer to how you described it, but it grows with every dataset and needs a group name the configuration does not hold today."

  - id: REQ-DASH-367
    title: "With a period chosen, the agency page shows each collection's composition table for that period; the period page's route is retired and its old links open the agency page with the period set"
    date_written: "2026-10-31"
    story: "As Keith during a quarterly release, I want what each dataset holds in the chosen period, and how it got there, shown on the agency page itself, so that there is one 'period on show', set in one place, and a link I saved to an old period page still lands on the same answer."
    moscow: should
    status: not_started
    source: "Keith's answer to draft Q1 (b), 2026-10-31: fold the period page's table into the agency page and retire the route; dashboard UX review SHOULD (path against ?period=). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHILE a period P is chosen, THE SYSTEM SHALL show in each collection's panel on the agency page REQ-DASH-209's composition table for that collection and P - its rows, columns, count line, grouping and links (REQ-DASH-209 criteria 1 to 5 and 9 as amended by A28 to A32) - with a caption reading '<collection> · <P> — what each dataset held at the end of <date on show>'."
      - "THE SYSTEM SHALL show above the agency page's sections a link to the previous period and one to the next, reading 'Previous period: <P>' and 'Next period: <P>' - 'Previous day: <date>' and 'Next day: <date>' on a daily baseline - each setting the period control by replacing the history entry, and SHALL leave a link out, rather than disable it, where there is no earlier period or the next had not opened by the date on show."
      - "WHEN the dashboard is opened at a retired period route, /agency/<agency>/collection/<collection>/period/<period>, THE SYSTEM SHALL replace the history entry with the agency page and period=<period>, keeping in-place-on and every other parameter, and SHALL bring that collection's panel into view and move focus to its table caption."
      - "IF a retired period route's period and a period parameter disagree, THEN THE SYSTEM SHALL take the route's period and rewrite the parameter."
      - "IF a retired period route names an agency or collection the dashboard does not hold, THEN THE SYSTEM SHALL show the existing not-found page (renderNotFound) - or, where the asset declares it moved (REQ-PIPE-354 criterion 6), the moved notice - and IF it names a period the baseline does not hold, THEN THE SYSTEM SHALL open the agency page with REQ-DASH-355 criterion 8's notice."
      - "THE SYSTEM SHALL have every link the page built to a period's composition view - a period label in supply history, a gap or owed-nothing row, the standing-in pill's drill-down and TS-55's chip - go to the agency page with that period set and that collection's panel in view."
      - "THE SYSTEM SHALL have a real-browser test that opens a real retired period URL, asserts the final location's path and query, that history length did not grow, that the collection's table is in view and holds rows, and that Back leaves the dashboard rather than returning to the retired route; and SHALL re-point REQ-DASH-209 criterion 10's test at the agency page's table."
    non_functional_requirements:
      - "COMPATIBILITY: old period links keep working (criterion 3); routing stays as docs/spa-best-practices.md section A describes."
      - "ACCESSIBILITY: focus moves to the table caption on arrival from an old link (criterion 3), replacing REQ-DASH-209 criterion 12's h2 focus."
      - "SCALE: at about thirty collections an agency page with a period set holds one table per collection; the agency-page panels already group them, and each table keeps REQ-DASH-209's every-row-shown rule."
      - "PRIVACY: unchanged from REQ-DASH-209 - display names, never email addresses."
    dependencies:
      - REQ-DASH-355
      - REQ-DASH-209
      - REQ-DASH-208
    decisions:
      - "FOLD THE TABLE INTO THE AGENCY PAGE AND RETIRE THE ROUTE (Keith, 2026-10-31, draft Q1 (b)): old period links redirect to the agency page with that period set, and REQ-DASH-209's criteria are rewritten as amendments signed one by one (A28 to A36). REJECTED (a), keeping the page joined to the control, and (c), keeping it independent. This made UX MUST 4 and UX Q3 moot."
      - "THE ROUTE'S PERIOD WINS OVER THE PARAMETER (UX SHOULD): criterion 4, because a link to a period page always meant that period."
      - "A REDIRECT INSIDE THE DASHBOARD, NOT A SCRIPT ON ANOTHER PAGE (delivery-scoper): the retired route is this dashboard's own, so the page that opens it replaces the entry itself; unlike v1's landing-page redirect, which is gone."
    open_questions: []

  - id: REQ-TEST-357
    title: "The move to two assets changes nothing a collection records, generates, builds or offers - proven by the equivalence harness and the existing pins, never by re-capturing them"
    date_written: "2026-10-31"
    story: "As Keith, I want proof that splitting the configuration moved files and nothing else, so that the split can be trusted as a refactor before the new datasets and the period control are built on it."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: build the split first); Keith's answer to architect Q4 (a). Drafted by delivery-scoper 2026-10-31, v2 the same day. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL regenerate each asset's history from empty after the split rather than migrate today's single database, which `mothman env reset-synthetic` then clears (REQ-PIPE-089 criterion 25's precedent)."
      - "THE SYSTEM SHALL extend `mothman debug equivalence capture` so that a commit with asset folders is captured as one baseline per asset, and `compare` SHALL compare the union of a post-split commit's baselines with a pre-split commit's single baseline, collection by collection, normalising only the data_asset_id segment REQ-QAC-344 renames and the database identity row."
      - "WHEN the split's move lands, before the test collections, THE SYSTEM SHALL show that compare reporting no difference on any surface, and SHALL record both commits and the result in evidence."
      - "THE SYSTEM SHALL keep tests/fixtures/arrival_semantics_golden.json and tests/fixtures/calendar_move_pin.json as captured, each test reading each pinned dataset's agreement from its own asset, and SHALL NOT re-capture either."
      - "THE SYSTEM SHALL make the move in a commit that changes no configuration content beyond the moves and the renames REQ-QAC-344 makes, on a base that already holds geocoding's contract changes, with every content change of this batch in later commits; and the agreement-freeze and check-lifecycle gates SHALL pass on it through REQ-TEST-366's move map."
    non_functional_requirements:
      - "AUDITABILITY: the equivalence result goes in evidence, so 'the split changed nothing' is a recorded run of a named tree, never a claim."
      - "COST: two from-empty bootstraps per capture; captures are on demand, not on every push."
    dependencies:
      - REQ-PIPE-342
      - REQ-QAC-344
      - REQ-PIPE-352
      - REQ-TEST-366
      - REQ-TEST-239
      - REQ-PIPE-111
    decisions:
      - "REGENERATE, NOT MIGRATE (delivery-scoper, following Keith's REQ-PIPE-089 choice): the history is synthetic and seeded."
      - "THE PINS ARE NOT RE-CAPTURED (REQ-PIPE-110 criterion 20's rule): a pin captured from the post-split tree would prove only that the tree agrees with itself."
      - "v1's FREEZE-GATE CRITERION MOVED TO REQ-TEST-366 and widened to every base-commit read (architect BLOCKING 2)."
    open_questions: []

  - id: REQ-DOCS-358
    title: "Signed requirements, CLAUDE.md and the README are restated for two assets in the change that makes the split: path-only edits under one blanket rule, every meaning change quoted and signed"
    date_written: "2026-10-31"
    story: "As whoever reads the register next, I want every signed requirement that assumes one asset, one hierarchy file, several calendars, one site or a period page restated for the new shape, so that the register and the system agree the day the split lands."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning); Keith's answer to draft Q4 (a), 2026-10-31, widened by the architect. Drafted by delivery-scoper 2026-10-31, v2 the same day. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL apply amendments A1 to A36 recorded in this requirement's decisions, each in the change that builds the requirement it serves, marked 'AMENDED <date applied> by <requirement>', once Keith has signed its wording."
      - "THE SYSTEM SHALL apply one blanket rule, signed once, by one mechanical sweep in the move's change: a signed criterion naming an asset-wide file under contract/, an agency file under contract/<agency>/, a file under reports/ or data/, SCENARIOS.md, or a new archive under dashboard/snapshots/ reads as that file in the asset's own place - contract/<asset>/, reports/<asset>/, data/<asset>/, SCENARIOS-<asset>.md, dashboard/snapshots/<asset>/ - each touched criterion marked AMENDED, with a count before and after."
      - "THE SYSTEM SHALL amend CLAUDE.md's layout table, its scale paragraph, its PostgreSQL setup block (one database per asset, MOTHMAN_ASSET), its bootstrap figures and its hosting notes, and README's running instructions, in the change that lands the split."
      - "THE SYSTEM SHALL take plans/running-thoughts.md #131's split, baseline and period-control decisions, #55's decision and #109 out of the plans files once the last requirement of this batch they feed is built, each decision having been carried into a requirement first (CLAUDE.md's carry-over rule)."
    non_functional_requirements:
      - "AUDITABILITY: a signed criterion changes only by a quoted, signed amendment (criterion 1) or by the one signed blanket rule (criterion 2)."
      - "MAINTAINABILITY: a half-done sweep is worse than none (REQ-DOCS-101's NFR 1); criterion 2's sweep is one change, with a count before and after."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-345
      - REQ-PIPE-346
      - REQ-PIPE-352
      - REQ-PIPE-354
      - REQ-DASH-367
    decisions:
      - "A1 - REQ-PIPE-049 criterion 1 (serves REQ-PIPE-345). CURRENT: 'THE SYSTEM SHALL hold one or more NAMED delivery calendars per data asset, and each dataset SHALL name exactly one of them.' PROPOSED: 'THE SYSTEM SHALL hold at most one NAMED delivery calendar per data asset, its baseline, and SHALL put every dataset that does not declare no calendar on it (REQ-PIPE-345).'"
      - "A2 - REQ-PIPE-049 criterion 5 (serves REQ-PIPE-346). CURRENT: 'IF a dataset naming a cadence-rule calendar also names delivery months, THEN THE SYSTEM SHALL reject the configuration rather than ignoring the months.' PROPOSED: 'IF a dataset's participation names periods in a vocabulary its baseline calendar version does not take - months on a daily rule, weekdays on an authored calendar - THEN THE SYSTEM SHALL reject the configuration rather than ignoring them (REQ-PIPE-346).'"
      - "A3 - REQ-PIPE-049 criterion 7 (serves REQ-PIPE-345). CURRENT: 'THE SYSTEM SHALL let a dataset override its calendar with its own authored dates instead of subsetting it.' PROPOSED: 'THE SYSTEM SHALL NOT let a dataset state authored dates of its own; a dataset slower than its baseline owes a subset of the baseline's periods (REQ-PIPE-345).'"
      - "A4 - REQ-PIPE-110 criterion 1 (serves REQ-PIPE-342 and 345). CURRENT: 'THE SYSTEM SHALL hold every delivery agreement belonging to a data asset in one file, contract/calendar.yaml - its named calendars, which calendar each collection and dataset is on, and each dataset's participation.' PROPOSED: 'THE SYSTEM SHALL hold every delivery agreement belonging to a data asset in one file, its asset folder's calendar.yaml - its baseline calendar, each collection's files_go_to_period and participation defaults, and each dataset's participation.'"
      - "A5 - REQ-PIPE-110 criterion 5 (serves REQ-PIPE-346). CURRENT, in part: '... either as the keyword all or by naming delivery months in full and case-insensitively, naming the month of each round's CALENDAR DATE even where days before is set ...'. PROPOSED: the same sentence, with 'by naming delivery months in full and case-insensitively, naming the month of each round's CALENDAR DATE' replaced by 'by naming, in full and case-insensitively, the month - or, on a daily baseline, the weekday - of each round's CALENDAR DATE (REQ-PIPE-346)'."
      - "A6 - REQ-PIPE-110 criterion 7 (serves REQ-PIPE-346). CURRENT: 'IF participates resolves to delivery months for a dataset whose calendar version in force on any of its periods' dates is a cadence rule, THEN THE SYSTEM SHALL reject the configuration, checking each participation version against every calendar version it overlaps.' PROPOSED: 'IF participates resolves to months where the baseline calendar version in force on any of a dataset's periods' dates is a daily rule, or to weekdays where it is authored, THEN THE SYSTEM SHALL reject the configuration, checking each participation version against every calendar version it overlaps.'"
      - "A7 - REQ-PIPE-110 criteria 10 and 11 (serves REQ-PIPE-345). CURRENT: 'THE SYSTEM SHALL let a collection name a calendar, and SHALL apply that calendar to every dataset in the collection that names none of its own.' and 'WHERE a dataset names its own calendar, THE SYSTEM SHALL use it in preference to the one its collection names.' PROPOSED: both RETIRED, replaced by REQ-PIPE-345 criteria 2 and 3, their tests removed in the same change."
      - "A8 - REQ-PIPE-110 criteria 25 and 35 (serves REQ-PIPE-345). CURRENT: criterion 25, 'WHERE a dataset states its own authored dates in place of its calendar's, THE SYSTEM SHALL hold them as effective-dated versions ...'; criterion 35, 'IF a dataset's own authored dates use a period name that any calendar in the file also uses, THEN THE SYSTEM SHALL reject the configuration.' PROPOSED: both RETIRED, replaced by REQ-PIPE-345 criterion 3's refusal."
      - "A9 - REQ-PIPE-110 criterion 18 (serves REQ-PIPE-345). CURRENT: 'IF a dataset in the asset's hierarchy has neither a calendar nor a deliberate no-calendar declaration, or contract/calendar.yaml names a dataset or collection the hierarchy does not hold, THEN THE SYSTEM SHALL reject the configuration naming both files.' PROPOSED: 'IF the asset declares no baseline calendar while a dataset of its hierarchy has no deliberate no-calendar declaration, or the asset's calendar.yaml names a dataset or collection its hierarchy does not hold, THEN THE SYSTEM SHALL reject the configuration naming both files and the asset.'"
      - "A10 - REQ-PIPE-181 criterion 9 (serves REQ-PIPE-345). CURRENT: 'IF a dataset names a calendar other than its collection's and would take any participation value from its collection's participation_defaults, THEN THE SYSTEM SHALL reject the configuration unless the dataset states that value itself, naming the dataset, both calendars and each value.' PROPOSED: RETIRED - no dataset or collection names a calendar (REQ-PIPE-345); its tests removed."
      - "A11 - REQ-PIPE-181 criterion 8 (serves REQ-PIPE-346). CURRENT, in part: '... naming the item, each dataset affected, the months newly owed and the periods those rounds fill ...'. PROPOSED: 'the months newly owed' becomes 'the rounds newly owed, named as participates names them (REQ-PIPE-346)'; the rest unchanged."
      - "A12 - REQ-PIPE-262 criteria 1, 6 and 12 (serves REQ-PIPE-352). CURRENT 1: 'THE SYSTEM SHALL group a bootstrap's collections into streams derived from configuration alone, two collections falling in one stream whenever any dataset of one resolves (schedule.calendar_for_dataset) to a calendar any dataset of the other resolves to, transitively, and SHALL hold no list of collections or calendars of its own.' PROPOSED 1: 'THE SYSTEM SHALL replay every calendared collection of the selected asset as one stream, and each collection none of whose datasets names a calendar as a stream of its own, and SHALL hold no list of collections of its own.' CURRENT 6: 'WHEN a bootstrap of every collection runs without --sequential, THE SYSTEM SHALL run its streams side by side, each in a process of its own, so that a collection on a calendar no other collection uses (Birth Registrations, daily) still runs beside the quarterly stream.' PROPOSED 6: 'WHEN a bootstrap of every collection of the asset runs without --sequential, THE SYSTEM SHALL run its streams side by side, each in a process of its own, so that a no-calendar collection's stream runs beside the asset's calendared stream; the daily and quarterly assets are bootstrapped separately (REQ-PIPE-352).' Criterion 12's 'with all three collections' becomes 'the quarterly asset bootstrapped from empty'."
      - "A13 - REQ-PIPE-331 criterion 2 (serves REQ-PIPE-345 and 364). CURRENT: 'IF a check declares a read of a table no dataset in the hierarchy owns, or of a dataset that is never on the same calendar as the declaring dataset in any period, or that names no calendar at all, THEN `mothman check` SHALL fail, naming the check, the table and the reason; and WHERE the two datasets are on different calendars for a given period, THE SYSTEM SHALL record the check NOT APPLICABLE for that period - in left_out with the reason code calendar_differs (REQ-PIPE-332 criterion 10), counting toward nothing - and SHALL record neither red nor a result for it.' PROPOSED: 'IF a check declares a read of a table no dataset in its asset's hierarchy owns, or of a dataset that declares no calendar, THEN `mothman check` SHALL fail, naming the check, the table and the reason.' The calendar_differs code, its branch and its tests are RETIRED, and REQ-PIPE-332 criterion 10 is amended to drop that code."
      - "A14 - REQ-QAC-330 criterion 6 and REQ-QAC-294 criterion 4 (serves REQ-PIPE-345 and 364). CURRENT 330, in part: 'IF a linked dataset is not in the hierarchy, is never on the same calendar as linkage-keys in any period, or names no calendar at all, names a source column its contract does not declare ...'. PROPOSED 330: 'IF a linked dataset is not in its asset's hierarchy, or declares no calendar, names a source column its contract does not declare ...', the rest unchanged. CURRENT 294, in part: 'IF a dataset's linked_datasets entry names a source not in the hierarchy, one naming no calendar, or one never on the same calendar as the declaring dataset in any period (REQ-QAC-330 decision 15's period-by-period rule), or names a source column ...'. PROPOSED 294: 'IF a dataset's linked_datasets entry names a source not in its asset's hierarchy, or one naming no calendar, or names a source column ...', the rest unchanged. Geocoding lands first (Keith, architect Q4), so the split's change amends both."
      - "A15 - REQ-PIPE-107 criteria 1 and 12 (serves REQ-PIPE-343). CURRENT 1: 'THE SYSTEM SHALL record, in the database itself, the data asset id (contract/data-asset.yaml's data_asset_id) and the environment id that database belongs to.' PROPOSED 1: '... the data asset id (the selected asset's data_asset_id, REQ-PIPE-343) and the environment id that database belongs to.' CURRENT 12: 'THE SYSTEM SHALL mark the sandbox's database in the session-start hook, CI's database in its workflow, the dev container's database as local in .devcontainer/post-create.sh, and each test worker's database as test in its fixture, in the same change that adds the check.' PROPOSED 12: 'THE SYSTEM SHALL mark each asset's sandbox database in the session-start hook, each asset's CI database in its workflow, each asset's dev-container database as local in .devcontainer/post-create.sh, and each test worker's database as test, for the asset its fixture selects.'"
      - "A16 - REQ-PIPE-092 criterion 7 (serves REQ-PIPE-354). CURRENT: 'THE SYSTEM SHALL name, in the artifact itself, the environment it was built from.' PROPOSED: 'THE SYSTEM SHALL name, in the artifact itself, the data asset and the environment it was built from.' (v1's amendment to criterion 12, a path on the gh-pages branch, is WITHDRAWN: REQ-PIPE-255 criteria 2 and 31 replace that push.)"
      - "A17 - REQ-DASH-182 criteria 2 and 8 (serves REQ-DASH-347). CURRENT 8, in part: '... label its cycle in words - Yearly for one delivery month a year, Twice a year for two, Quarterly for four, Monthly for twelve, otherwise <N> times a year ...'. PROPOSED 8: the same, adding 'and, where a dataset participates by weekday, as REQ-DASH-347 criterion 1 words it'. Criterion 2's example 'it supplies only in the February and August rounds' gains the weekday form 'it supplies only on Mondays' by the same reference."
      - "A18 - REQ-PIPE-240 criteria 1 and 2 (serves REQ-PIPE-342 and 363). CURRENT 1: 'THE SYSTEM SHALL declare on each collection in contract/data-asset.yaml's hierarchy a short and a run_prefix ...'. PROPOSED 1: '... on each collection in its asset's data-asset.yaml hierarchy ...'. CURRENT 2: 'THE SYSTEM SHALL provide one registry module that lists collections only from the hierarchy, in hierarchy order, and resolves a collection by id, by short or by run_prefix ...'. PROPOSED 2: '... that lists collections only from the selected asset's hierarchy, in hierarchy order, and resolves a collection of that asset by id, by short or by run_prefix ...'. (v1's 'resolves one of another asset only to refuse it by name' is WITHDRAWN: Keith, architect Q3 (b).)"
      - "A19 - REQ-TEST-117 criteria 1 and 5 (serves REQ-TEST-353). CURRENT 1, in part: 'CI SHALL cache a dump of the bootstrapped database, keyed on a hash of every input that shapes it - generator/, synthetic_data_generator/, pipeline/, qa_tools/, contract/, dbt_project/, cli/pipeline.py, pyproject.toml, uv.lock and the workflow file itself.' PROPOSED 1: 'CI SHALL cache a dump of each asset's bootstrapped database, with that asset's data/<asset>/ paths, keyed on a hash of every input that shapes it - the same list, with contract/ replaced by that asset's folder and the repository-wide configuration (REQ-PIPE-365 criterion 3).' Criterion 5 is unchanged in meaning."
      - "A20 - REQ-TEST-239 criterion 1 (serves REQ-TEST-357). CURRENT, in part: '... runs that commit's own `mothman pipeline bootstrap` from empty into a scratch database named for the label, and writes one baseline file describing surfaces S1, S4, S5 and S7 ...'. PROPOSED: '... runs that commit's own bootstrap from empty for each asset it declares - or once, where it declares none - each into a scratch database named for the label and the asset, and writes one baseline file per asset describing surfaces S1, S4, S5 and S7 ...'."
      - "A21 - REQ-QAC-241 criterion 2 (serves REQ-PIPE-342). CURRENT: 'THE SYSTEM SHALL keep each agency's contract, Soda, Evidently and retired-check files under contract/<agency-id>/, and only the asset-wide files (data-asset.yaml, calendar.yaml, people.yaml, environments.yaml, file-checks.yaml, scripted_decisions.yaml) at the top of contract/; WHEN `mothman check` runs, IF a collection's file sits outside its agency's folder, THEN THE SYSTEM SHALL fail naming it.' PROPOSED: 'THE SYSTEM SHALL keep each agency's contract, Soda, Evidently and retired-check files under contract/<asset>/<agency-id>/, each asset's asset-wide files (data-asset.yaml, calendar.yaml, people.yaml, file-checks.yaml, scripted_decisions.yaml, presentation.yaml) at the top of contract/<asset>/, and only repository-wide files (environments.yaml and the split's move map, REQ-TEST-366) at the top of contract/; WHEN `mothman check` runs, IF a collection's file sits outside its agency's folder, THEN THE SYSTEM SHALL fail naming it.'"
      - "A22 - REQ-PIPE-250 criteria 2 and 5 (in progress, not built; serves REQ-PIPE-352 and REQ-TEST-353). CURRENT 2: 'WHEN `mothman pipeline bootstrap` runs from empty on this sandbox with all three collections, THE SYSTEM SHALL finish within 12 minutes of wall clock, in each of three consecutive runs recorded in evidence.' PROPOSED 2: 'WHEN each asset's `mothman pipeline bootstrap` runs from empty on this sandbox, THE SYSTEM SHALL finish within 12 minutes of wall clock, in each of three consecutive runs recorded in evidence.' CURRENT 5: 'THE SYSTEM SHALL record the CI deployment half's cache-miss bootstrap time alongside, without a budget of its own.' PROPOSED 5: 'THE SYSTEM SHALL record each asset's cache-miss bootstrap time in the CI deployment half alongside, without a budget of its own' (Keith, draft Q5 (a))."
      - "A23 - REQ-PIPE-248 criterion 7 (serves REQ-PIPE-364 and 365). CURRENT, in part: 'THE SYSTEM SHALL declare a `short` on each agency in contract/data-asset.yaml's hierarchy, unique across the asset (REQ-PIPE-240's gate extended to it), and SHALL write every collection's results as reports/results_<agency short>_<collection_id>.json ...'. PROPOSED: 'THE SYSTEM SHALL declare a `short` on each agency in its asset's data-asset.yaml hierarchy, unique across the asset and the same in every asset the agency appears in (REQ-PIPE-364 criterion 4), and SHALL write every collection's results as reports/<asset>/results_<agency short>_<collection_id>.json ...', the rest unchanged."
      - "A24 - REQ-PIPE-255 criteria 1, 8, 24 and 30 (signed, not built; serves REQ-PIPE-354). CURRENT 8: 'THE SYSTEM SHALL take the Pages project name, its production branch name, the dashboard's address and the expected Access sign-in domain from contract/data-asset.yaml, one site per data-asset deployment, and SHALL NOT hardcode any of them in code.' PROPOSED 8: '... from the selected asset's data-asset.yaml, one Cloudflare Pages project per asset (REQ-PIPE-354), and SHALL NOT hardcode any of them in code.' Criterion 1's 'snapshots/ with every snapshot' becomes 'snapshots/ with every snapshot in the selected asset's archive (REQ-PIPE-354 criterion 8)'. Criterion 24's 'the newest archived snapshot in dashboard/snapshots/' becomes 'the newest archived snapshot in the selected asset's archive'. Criterion 30's test SHALL publish under each asset."
      - "A25 - REQ-PIPE-257 criteria 1, 3, 6, 8, 12 and 14 (signed, not built; serves REQ-PIPE-354). CURRENT 1: 'THE SYSTEM SHALL require Cloudflare Access sign-in for the Pages project's production hostname, <project>.pages.dev, and for every deployment and branch-alias hostname under *.<project>.pages.dev.' PROPOSED 1: 'THE SYSTEM SHALL require Cloudflare Access sign-in for each asset's Pages project's production hostname ... under its own Access applications and policy.' CURRENT 3: 'THE SYSTEM SHALL admit only email addresses listed one by one in the Access policy ...'. PROPOSED 3: '... listed one by one in each asset's own Access policy ...', the rest unchanged. Criterion 6's runbook gives every step once per asset project. Criterion 8's 'from contract/data-asset.yaml' becomes 'from the selected asset's data-asset.yaml'. Criterion 12's verify-access checks the selected asset's project. Criterion 14 is verified for each asset's project."
      - "A26 - REQ-GHUB-258 criterion 1 (signed, not built; serves REQ-PIPE-354). CURRENT: 'THE SYSTEM SHALL take the published dashboard's address from contract/data-asset.yaml, beside the Pages project name, and SHALL NOT hardcode a dashboard address in product code.' PROPOSED: 'THE SYSTEM SHALL take each asset's published dashboard address from that asset's data-asset.yaml, beside its Pages project name, and SHALL NOT hardcode a dashboard address in product code.'"
      - "A27 - REQ-DOCS-259 criteria 2, 5 and 7 (signed, not built; serves REQ-PIPE-354). CURRENT 2, in part: '... a real publish is serving the current dashboard and every snapshot from the private host, and an allow-listed person other than Keith has signed in to it.' PROPOSED 2: '... a real publish is serving each asset's current dashboard and its snapshots from its own private project, and an allow-listed person other than Keith has signed in to each.' Criterion 5's '`mothman dashboard verify-access` passing' becomes '... passing for each asset'. Criterion 7's 'where the dashboard is hosted' becomes 'where each asset's dashboard is hosted'."
      - "A28 - REQ-DASH-209 criterion 1 (serves REQ-DASH-367). CURRENT, in part: 'THE SYSTEM SHALL offer, for each period of every collection - daily collections included, one view per day - a period-composition view with one row per dataset of that collection ...'. PROPOSED: 'WHILE a period is chosen (REQ-DASH-355), THE SYSTEM SHALL show in each collection's panel on the agency page - daily collections included, one per day - a composition table with one row per dataset of that collection ...', the rest unchanged."
      - "A29 - REQ-DASH-209 criterion 5 (serves REQ-DASH-367). CURRENT: '... each dataset's name a real link (<a href>) to that dataset's page at the same date on show, and each from <period> a real link to that period's composition view.' PROPOSED: '... to that dataset's page at the same date on show and period, and each from <period> a real link to the agency page with that period set (REQ-DASH-367 criterion 6).'"
      - "A30 - REQ-DASH-209 criterion 6 (serves REQ-DASH-367). CURRENT, in part: 'THE SYSTEM SHALL give the view its own address in the dashboard's existing routing - #/agency/<agency>/collection/<collection>/period/<period> ...'. PROPOSED: RETIRED, replaced by REQ-DASH-367 criteria 3 and 6: the route is retired, old links open the agency page with the period set, and every link to the view goes there."
