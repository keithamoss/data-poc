    acceptance_criteria:
      - "WHERE a dataset participates by weekday, THE SYSTEM SHALL label its cycle on its SLA tile 'Weekly (<weekday>)' for one weekday, 'Weekdays' for Monday to Friday exactly, '<N> days a week (<weekdays>)' for any other two to six, and 'Daily' for all seven, with its delivery time as REQ-DASH-182 criteria 7 and 11 word it (PROPOSED wording)."
