# v6 (2026-11-21): v5 as signed by Keith that day, plus the three post-sign-off
# reviews (docs/drafts/deferred-rescope-reviews-v5.md) and Keith's answers to
# them. Every requirement here is a PROPOSAL until Keith re-signs it. Every
# change from v5 carries a "v6:" decision naming the finding or answer behind it;
# docs/drafts/deferred-rescope-v6-changes.md lists them in plain English.
- id: REQ-GHUB-433
  title: "The processing pass reads new slot-ticket comments from GitHub and hands each to the GitHub filing route once, so a comment reaches the decision log without GitHub Actions reaching the database"
  date_written: "2026-11-21"
  story: "As a data engineer working a slot's ticket, I want a filing command I post there to be acted on by the next processing pass in the environment that holds the decision log, so that the GitHub route of REQ-GHUB-082 works now that no workflow can reach the database."
  moscow: should
  status: not_started
  source: "Keith, delivery-architect triage of REQ-GHUB-082 criterion 1, 2026-11-21; plans/running-thoughts.md #53 (Keith, 2026-09-27); Thread H's drain-the-backlog rule (plans/supply-model.md sprint 12). Drafted by delivery-scoper 2026-11-21; SETTLED as polling by Keith the same day (Q2.1 (a)); v5 signed by Keith 2026-11-21; v6 folds in the post-sign-off reviews (architect C, dashboard UX 433 c12, CLI UX C6) and Keith's answers. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "WHEN `mothman pipeline process` runs in an environment whose ticketing is on, THE SYSTEM SHALL, as a stage before ticket reconciliation, read the comments on the asset's ticket repository that it has not yet handled, and SHALL pass each one on a slot ticket to filing_from_github.handle(), oldest first by its creation time."
    - "THE SYSTEM SHALL read them with two repository-level paged listings per pass - the repository's issue comments updated since the creation instant of the newest comment it has already handled (all of them, on a pass with none handled), and the slot tickets with their labels, which say each ticket's slot - and SHALL NOT make a request per ticket."
    - "THE SYSTEM SHALL read those comments by an outbound request from inside the environment that holds the asset's database, and SHALL NOT require any inbound connection to that environment."
    - "THE SYSTEM SHALL record the id of every comment it has handled in the asset's own database, and SHALL NOT keep that record in the repository or on local disk."
    - "THE SYSTEM SHALL hand any one comment id to the handler at most once, whatever GitHub's listing returns again, so that a pass re-run after a failure, or a comment edited later, does not raise a decision twice."
    - "THE SYSTEM SHALL leave out every comment authored by the identity the service itself posts as, so that its own replies and reconciliations are never read as commands."
    - "THE SYSTEM SHALL give each decision raised the comment's GitHub creation instant as its effective_at."
    - "IF reading or handling comments fails partway through a pass, THEN THE SYSTEM SHALL keep every id handled so far, SHALL report the stage as failed in the pass's exit status naming the cause (the GitHub call that failed, or the comment whose handling failed), and SHALL read the rest on the next pass."
    - "THE SYSTEM SHALL take each comment's author from GitHub's own record of who posted it, and SHALL NOT read an author from the comment's body (REQ-GHUB-082 criterion 4)."
    - "WHERE a comment is on a ticket whose slot is not a dataset of the selected asset, THE SYSTEM SHALL neither handle it nor reply to it."
    - "WHERE the environment's ticketing is off, THE SYSTEM SHALL read no comments and SHALL say so in one line of the pass's report."
    - "THE SYSTEM SHALL say, in every slot ticket's reconciled body, that commands posted on it are acted on at the next processing pass, and how often passes run as the environment's own configuration declares it, never a figure written into code, so that nobody re-posts a command that has not yet been read. SETTLED by Keith 2026-11-21 (round 6 Q1 (a))."
    - "THE SYSTEM SHALL delete the disabled .github/workflows/ticket-sync.yml in the same change, and SHALL close REQ-GHUB-082 criterion 1's unmet entry citing this requirement."
    - "WHEN the stage finishes, THE SYSTEM SHALL report in the pass's report how many comments it read, how many decisions it raised and how many it refused, and SHALL NOT report the stage as 'nothing to process' when it read comments that raised nothing."
  non_functional_requirements:
    - "COMPATIBILITY: the environment already calls GitHub outbound for ticket reconciliation (ticket_reconciler.service_from_env), so this adds reads over the same route and the same credential; no new network path is opened."
    - "SECURITY: the credential is read-and-write on one repository's issues only, never contents; a comment's authority still comes from its GitHub author being in people.yaml, never from the poller."
    - "SECURITY: when the repository goes private (REQ-DOCS-259), commenting already needs repository access; the people.yaml allowlist stays the gate either way."
    - "SCALABILITY: two paged listings per pass, independent of the number of tickets, well inside GitHub's per-token rate limit at about 30 collections an asset."
    - "RELIABILITY: a GitHub outage delays decisions until the next pass and never loses one; handled ids only grow over comments actually handled."
    - "LATENCY: a comment is acted on at the next processing pass, so the scheduler's interval is the response time, and criterion 12 tells the person so."
    - "STATE: the handled-comment ids are state, so they live in the database."
    - "ROLLOUT COST: criterion 12 changes every slot ticket's body, so the first reconciliation after it lands rewrites every open ticket once - one GitHub write and one notification per open ticket, once - and never again unless the declared interval changes."
  dependencies:
    - REQ-GHUB-082
    - REQ-PIPE-151
    - REQ-PIPE-083
  decisions:
    - "SETTLED by Keith 2026-11-21 (Q2.1 (a)): POLLED BY THE PROCESSING PASS. The environment already calls GitHub outbound to reconcile tickets, so polling adds no new path or credential. A scheduled Lambda is the scheduler that already calls `mothman pipeline process` (REQ-PIPE-151), so it is not a separate option."
    - "REJECTED a webhook into the environment: an inbound endpoint, a public address and secret verification for each of two separated environments, to save at most one scheduler interval on a decision that is not urgent."
    - "REJECTED reviving ticket-sync.yml with database access: a runner with a route to the database breaks REQ-PIPE-089/092's line."
    - "REJECTED retiring the GitHub route and keeping the terminal one: it reverses Keith's 2026-09-22 'not PoC-only' and 2026-09-26 'both routes first-class' decisions."
    - "HANDLED IDS, NOT A TIME MARKER (delivery-architect, v4 review): GitHub's `since` filters on UPDATED time, so an edited old comment returns in a later listing; a time high-water mark would either re-raise it or skip a comment created earlier but listed later. Recording ids is the only exactly-once."
    - "TWO LISTINGS (delivery-architect): ticket_github.comments() reads one ticket and returns bodies only, and a comment says nothing about its slot; the slot is the ticket's label, so the issue listing is the second read."
    - "DRAIN THE BACKLOG, carried from Thread H (2026-09-22): each pass reads everything unhandled rather than reacting to one event; applied serially, oldest first, last wins."
    - "ONE ASSET PER ENVIRONMENT READS ONLY ITS OWN SLOTS: both assets name the same ticket_repository today, so each ignores the other's tickets in silence."
    - "CRITERION 12 IS THE UX REVIEW'S (delivery-dashboard-ux, 2026-11-21): a command that is not acted on at once reads as ignored and gets posted again."
    - "SETTLED by Keith 2026-11-21 (round 6 Q1 (a)): the ticket says commands are acted on at the next pass and how often passes run, with no last-pass time. REJECTED showing when a pass last ran: that time changes every pass, so REQ-PIPE-083's reconciler - which writes a ticket only when its state changes - would rewrite every open ticket on every pass. What says a command WAS read is already there: a decision taken shows in the reconciled ticket (REQ-GHUB-082 criterion 8) and a refusal is replied to directly (criterion 23)."
    - "v6, THE LISTING ANCHOR (delivery-architect post-sign-off finding C): v5's 'updated since the oldest unhandled comment' named an instant the pass cannot know before it has listed. The anchor is the creation instant of the newest comment already handled: every comment not yet handled was created after it or edited since, and either way has been updated since it, so the listing is a superset and the handled ids make it exactly-once."
    - "v6, NO CUT-OVER CRITERION (Keith 2026-11-21, architect Q-A1: 'No one has used GitHub, this is still a local poc.'): the first pass, with nothing handled, reads every comment on the repository, and there is no comment history to replay. REJECTED (a) marking every comment before the deploy handled without acting, and (b) acting only on comments since ticket-sync was disabled - both answer a history that does not exist."
    - "v6, THE ROLLOUT NFR (delivery-architect finding C): stated so the one-time rewrite of every open ticket is expected rather than read as a fault."
    - "v6, HOW OFTEN COMES FROM CONFIGURATION (delivery-dashboard-ux post-sign-off, 433 c12): an interval written into the ticket code would go false the day a deployment's scheduler changes."
    - "v6, CRITERION 14 AND THE NAMED CAUSE IN CRITERION 8 (delivery-cli-ux C6): a pass that read three comments and raised nothing must not read as idle, and a failed stage must say what failed."
    - "v6, ONE-OFFS NEVER USE GITHUB (Keith 2026-11-21): that rule is REQ-PIPE-446's; this stage cannot reach a one-off, because `mothman pipeline process` is refused while a one-off is selected (REQ-PIPE-446 criterion 9)."
  open_questions:
    - "Which GitHub credential an environment holds for this and for reconciliation - a GitHub App installation per environment, or a fine-grained token on a service account. A deployment decision; it does not change what is built."
    - "Where the environment declares its processing interval for criterion 12 (assets/environments.yaml is the likely home), and what the ticket says where an environment declares none. A build decision; it does not change the settled wording."

- id: REQ-PIPE-434
  title: "A supply for a dataset with no calendar is filed to no period, never held for placing, and checked when it arrives"
  date_written: "2026-11-21"
  story: "As whoever runs QA on a one-off, or develops checks before a schedule is agreed, I want a supply for a dataset with no calendar to be checked as soon as it arrives, so that the shape REQ-PIPE-106 declares actually runs rather than stopping in filing."
  moscow: must
  status: not_started
  source: "Keith, plans/running-thoughts.md #141 and post-build-review #473 (2026-11-18: scope it separately); plans/supply-model.md sprint 29 point 4 (Keith, 2026-09-27). Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; unchanged in v6. Buildable at once (Keith, round 5, architect Q1). v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "WHEN a supply arrives for a dataset that declares `no_calendar` (either value), THE SYSTEM SHALL record the arrival with no slot and no period, and SHALL NOT let NoCalendarAgreed escape filing."
    - "THE SYSTEM SHALL NOT hold such a supply for a person to place (REQ-PIPE-064), because no period exists to place it in."
    - "WHEN such a supply is staged, THE SYSTEM SHALL run its dataset's active checks over it in the same pass as any other arrival, against a run view of the newest version of each no-calendar table (REQ-PIPE-106)."
    - "THE SYSTEM SHALL NOT compute a claim window, lateness, runway, a missing slot or a schedule-ended hold for such a dataset, and SHALL NOT report any of them as failing for want of a calendar."
  non_functional_requirements:
    - "SCALABILITY: no work per period, so the cost is per arrival only."
    - "RELIABILITY: a supply that cannot be loaded or checked reads could-not-load or could-not-check as for any arrival, and is never silently skipped."
    - "MAINTAINABILITY: one rule at the filing boundary, asked of the declaration (sample_data.is_sample, which stays the ROUTING question for both no_calendar values - REQ-PIPE-438), not a branch per caller."
  dependencies:
    - REQ-PIPE-106
  decisions:
    - "BOTH no_calendar VALUES ARE FILED THE SAME WAY (delivery-scoper): neither has a period, so filing, holding and lateness cannot differ; what the record COUNTS for differs, and that is REQ-PIPE-438's."
    - "THE DEFECT, from #141 (2026-11-18), confirmed by the delivery-architect at filing.py:446-469: NoCalendarAgreed is not a ValueError, so file_arrivals' handlers missed it; past that the supply was held as waiting for a person to place it, so no tool checked it."
    - "REJECTED holding a no-period supply for a person: there is nothing a person could choose."
    - "REJECTED inventing a pseudo-period (the receipt date, or one period per one-off) so the ordinary filing path runs: it would put a period into the arithmetic REQ-PIPE-106 criterion 5 excludes by construction."
    - "v6: no criterion changed. The MAINTAINABILITY NFR now says is_sample stays the routing question, because REQ-PIPE-438 v6 splits routing from counted state (delivery-architect finding G)."

- id: REQ-PIPE-435
  title: "A person records one release-or-withhold decision for a whole one-off, with a reason, in an append-only table the publisher can read; nothing about it is ever promoted"
  date_written: "2026-11-21"
  story: "As the person accountable for handing a one-off's data to a project, I want to record whether it is released or withheld, and why, so that there is a named, dated account of who let the data go - or stopped it."
  moscow: must
  status: not_started
  source: "Keith, 2026-11-21, Q4.2 (b) and round 2 Q4 (a); plans/running-thoughts.md #141 (the promotion gate raises); the delivery-architect's v4 review (a new qa table, not decision_log). Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-cli-ux G1, G5 and C2 and Keith's answers (copy nothing; never GitHub; --id). Shared by every one-off kind. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "WHEN every dataset of a one-off has a recorded outcome for its checks - a could-not-load or could-not-check result counting as one (PROVISIONAL, question 4 of the v6 changes) - THE SYSTEM SHALL offer, in the `mothman one-off` TUI and as `mothman one-off decide --id <id>`, one decision for the whole one-off - release or withhold."
    - "WHEN a person records that decision, THE SYSTEM SHALL append it to an append-only table of one-off decisions in the qa schema with the person as actor, the instant, the decision and their reason, and SHALL refuse it without a reason."
    - "THE SYSTEM SHALL grant the publisher role read on that table (REQ-PIPE-092), and SHALL grant no role update or delete on it."
    - "IF the person is not named in the people.yaml of the one-off's kind template (one-offs/<kind>/_template/people.yaml), read at the moment of deciding, or is a placeholder, THEN THE SYSTEM SHALL refuse the decision and say why."
    - "THE SYSTEM SHALL NOT accept a decision for a single dataset of a one-off, only for the whole one-off."
    - "WHERE more than one decision has been recorded for a one-off, THE SYSTEM SHALL treat the latest as standing, and SHALL keep and show every earlier one."
    - "THE SYSTEM SHALL NOT put a supply for a `no_calendar` dataset to the promotion gate; IF the gate is asked about one, THEN THE SYSTEM SHALL refuse it as having no period, and SHALL NOT raise NoCalendarAgreed."
    - "THE SYSTEM SHALL NOT open a ticket for a one-off, nor accept its decision from GitHub, by REQ-PIPE-446's rule that one-offs never use GitHub."
    - "THE SYSTEM SHALL record the decision only, and SHALL NOT itself move, copy or send a one-off's data to anyone."
    - "WHEN a person decides, THE SYSTEM SHALL take the steps in filing_tui.apply_decision's order - the actor from git identity, then any refusal, then the reason, then a confirmation - each with a flag form (`--decision release|withhold`, `--reason`, `--yes` for the confirmation), and SHALL show, before the confirmation, the one-off's QA summary (each dataset's QA result, with every dataset that could not be loaded or checked named) and the decision in force, or that there is none."
    - "WHEN a decision is recorded for a one-off whose page is already published, THE SYSTEM SHALL say that the published page still shows the earlier state until the one-off is published again, and SHALL name the publish command."
  non_functional_requirements:
    - "OBSERVABILITY / COMPLIANCE: the database is dropped once the work is done (REQ-PIPE-442), so the latest published page is the only lasting copy of every decision; REQ-DASH-444 carries them, and criterion 11 and REQ-PIPE-443's stale-page warning are what keep a decision from being dropped unpublished without anyone being told."
    - "SECURITY: the same identity rules as a filing decision - a named, non-placeholder person, the actor from git identity on the terminal."
  dependencies:
    - REQ-PIPE-434
    - REQ-PIPE-446
  decisions:
    - "SETTLED by Keith 2026-11-21 (Q4.2 (b)): one release-or-withhold decision for the WHOLE one-off, with actor and reason. REJECTED (a) report only, the v1 recommendation, and (c) a decision per dataset."
    - "SETTLED by Keith 2026-11-21 (round 2 Q4 (a)): recorded only - the system never moves data. REJECTED (b) withholding blocking a hand-over step."
    - "ITS OWN TABLE, NOT THE DECISION LOG (delivery-architect, v4 review): decision_log entries are keyed to a dataset's slot and carry filing semantics; a release has neither. An append-only qa table read by the publisher is what puts it on the page without the build reading anything else."
    - "TERMINAL ONLY: GitHub tickets are per slot (REQ-PIPE-083) and a one-off has none; this is not a breach of REQ-GHUB-082's two-route parity, which governs filing decisions."
    - "LAST WINS, ALL KEPT, carried from Thread H's rule for filing decisions: a withheld one-off can be released after discussion, and both entries stay visible."
    - "v6, PEOPLE.YAML IS READ LIVE FROM THE KIND'S TEMPLATE (Keith 2026-11-21, answering CLI Q4: 'copy nothing'): criterion 4 named 'the one-off's people.yaml', a copy made at open, so a decider added after open failed the digest check (delivery-cli-ux G5). REJECTED the reviewer's recommendation (a), keeping a copied people.yaml outside the digest: it would still leave a stale copy per folder."
    - "v6, NEVER GITHUB (Keith 2026-11-21: 'One offs should never use GitHub.'): criterion 8 now rests on REQ-PIPE-446's stated rule rather than on this requirement alone."
    - "v6, CRITERION 10 IS apply_decision's FLOW (delivery-cli-ux C2): one order for every recorded decision in mothman, so a person who has filed a supply already knows this one; the QA summary is shown because the decision is about it."
    - "PROVISIONAL, v6 (delivery-cli-ux C2 asked to say it): a could-not-load or could-not-check result counts as an outcome, so such a one-off can be decided - withholding is the expected answer, and releasing one is a person's recorded call with a reason. The alternative is a one-off that can never be decided while one table will not load. Question 4 of the v6 changes."
    - "v6, CRITERION 11 (delivery-cli-ux G1): a decision recorded after the last publish is otherwise invisible on the page and lost at drop."

- id: REQ-DASH-436
  title: "The dashboard builds and reads correctly for no-calendar datasets, and a one-off's page drops every control and route that only means something for a schedule or a removed tool"
  date_written: "2026-11-21"
  story: "As a reader of a one-off's dashboard, I want each dataset's checks and supplies shown without any schedule language or controls, so that I see what was checked rather than a page that failed to build, calls everything missing or offers buttons that do nothing."
  moscow: must
  status: not_started
  source: "Keith, plans/running-thoughts.md #141 (2026-11-18); sprint 29 point 8; delivery-dashboard-ux's v4 review findings 6 and 10. Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-dashboard-ux post-sign-off A, C and D. Buildable at once (Keith, round 5). v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "WHEN the dashboard is built for an asset or one-off holding a dataset that declares `no_calendar`, THE SYSTEM SHALL build it, and SHALL NOT raise NoCalendarAgreed from agreement.cadence() (build_dashboard_data.py) or any other cadence read."
    - "THE SYSTEM SHALL list such a dataset's supplies by receipt instant, and SHALL NOT show a period, a slot, a due date or lateness for it; WHERE a one-off's declared table did not arrive, THE SYSTEM SHALL show that dataset as Fail, from its failing default-layer result (REQ-QAC-441 criterion 3), and SHALL NOT show it as No data."
    - "THE SYSTEM SHALL show such a dataset's checks with their real verdicts, on a rendered page."
    - "WHERE a dataset of a one-off has arrived but has no recorded check outcome yet, THE SYSTEM SHALL show it as 'Not yet checked' - a dataset-level status of its own in STATUS_WORDS and status-cases.json, distinct from the check-level `notchecked` ('Not checked'), drawn in the same dashed, muted style - leave it out of the rollup with that reason, and SHALL NOT show it as No data."
    - "WHERE the page is built for a folder under one-offs/, THE SYSTEM SHALL NOT show the in-the-warehouse date, the period control or its tier, trends, sparklines, run comparison or the supply-history list."
    - "IF a link into a one-off's page carries an in-place-on date, a period, a `cmp=` comparison or a `?panel=` naming a removed tool, or names a removed tool's route - #/plans, #/demo, #/scenarios or #/feedback - THEN THE SYSTEM SHALL open the nearest view that exists without them, show a notice naming what this page does not have, and SHALL NOT show a blank page."
    - "THE SYSTEM SHALL roll such datasets up as REQ-PIPE-438 decides, and SHALL NOT decide it a second time here."
  non_functional_requirements:
    - "COMPATIBILITY: the built page opens from file:// with no network, as every dashboard does."
    - "PERFORMANCE: a one-off is tens of tables with one supply each; no budget beyond the existing build."
    - "CORRECTNESS: 'Not yet checked' is a status, so it changes with every other status implementation under REQ-PIPE-438's item-74 parity NFR."
  dependencies:
    - REQ-PIPE-434
    - REQ-PIPE-438
  decisions:
    - "KEYED ON THE FOLDER ROOT, NOT ON EVERY DATASET DECLARING no_calendar (delivery-dashboard-ux): a recurring asset can hold a not-yet-agreed dataset and must keep its schedule controls; a one-off never needs them. The root is the one fact that says which."
    - "'NOT YET CHECKED' IS ITS OWN STATE (delivery-dashboard-ux, finding 6): publishing at any time (REQ-PIPE-443) means a page can go out before QA finishes; No data says nothing arrived, which would be false."
    - "THE ROLLUP LIVES IN ONE PLACE: REQ-PIPE-438 amends REQ-PIPE-106, and this requirement follows it."
    - "v6, A DECLARED TABLE THAT NEVER ARRIVED IS FAIL (delivery-dashboard-ux post-sign-off A): v5's criterion 2 forbade 'anything marked missing', while REQ-QAC-441 criterion 3 makes that table a failing result; read literally the page would have shown grey No data for the one failure that matters most. REJECTED showing it as No data, which reads as nothing owed."
    - "v6, 'NOT YET CHECKED' IS A DATASET STATUS OF ITS OWN (delivery-dashboard-ux C): v5 borrowed the `.pill.notchecked` style, whose words are the check-level 'Not checked' (REQ-DASH-299 criterion 17). REJECTED reusing `notchecked`, which would make two different facts read alike."
    - "v6, REMOVED TOOLS' ROUTES (delivery-dashboard-ux D): REQ-DASH-444 removes the tools from the header, but #/plans, #/demo, #/scenarios, #/feedback, ?panel= and cmp= still resolve from a pasted link; criterion 6 now covers them with the same notice as a stray date."

- id: REQ-PIPE-438
  title: "A `never` dataset's results are real quality history and roll up within its one-off - except a dataset declared derived; REQ-PIPE-106's not-counted rules apply to `not-yet-agreed` only; an asset under assets/ refuses `never`"
  date_written: "2026-11-21"
  story: "As a reader of a one-off's dashboard, I want its tables' verdicts to count and roll up, so that the page answers whether the data is fit to release rather than reading 'Not counted' throughout."
  moscow: must
  status: not_started
  source: "Keith, 2026-11-21, Q4.1 (a), Q4.7 (a), round 5 architect Q3 (a); delivery-architect v4 finding 5; delivery-dashboard-ux v4 findings 7 to 9. Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-architect post-sign-off B and G and delivery-dashboard-ux B, C and the display-words point. Amends REQ-PIPE-106 (built). Buildable at once (Keith, round 5). The rollup half is shared by every one-off kind. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL amend REQ-PIPE-106 criteria 7, 9 and 10 in the same change so that each applies to a dataset declaring `no_calendar: not-yet-agreed` only."
    - "THE SYSTEM SHALL record the QA results of a dataset declaring `no_calendar: never` as agreed results, unless calendar.yaml declares that dataset `derived: true` beside its `no_calendar`, whose results are recorded in development; THE SYSTEM SHALL read `derived:` from calendar.yaml only."
    - "THE SYSTEM SHALL roll a `never` dataset's verdicts up into its collection and its one-off, as for any dataset with a calendar, and SHALL leave a derived dataset's out."
    - "WHERE a cross-table check spans a derived dataset and a counted one, THE SYSTEM SHALL record its result as agreed, share it with every participating dataset (share_cross_table_results), count it toward each counted participant's status only, and exclude it from each derived participant's; WHERE every participant is derived, THE SYSTEM SHALL record it in development."
    - "THE SYSTEM SHALL label a derived dataset in words as 'Derived product, not counted in the <kind>'s status', <kind> being the kind's display word (REQ-PIPE-446 criterion 2), never its folder name, and SHALL name derived products in the line that says what was not counted."
    - "THE SYSTEM SHALL NOT label a `never` dataset row by row as a one-off; the page says that once (REQ-DASH-444)."
    - "THE SYSTEM SHALL show the no-schedule marker and tooltip (unagreedMarker()) for a `not-yet-agreed` dataset only, SHALL show none on a `never` dataset, and SHALL remove the tooltip's wording about `never`."
    - "IF an asset under assets/ declares a dataset `no_calendar: never` or `derived`, THEN the schedule gate of `mothman check` SHALL fail, naming the dataset; the calendar loader SHALL NOT refuse it itself."
    - "IF a one-off declares a dataset `no_calendar: not-yet-agreed` or with a calendar, THEN the schedule gate of `mothman check` SHALL fail, naming the dataset, and so SHALL a one-off's load, which runs its kind's gates (REQ-PIPE-442 criterion 3)."
  non_functional_requirements:
    - "CORRECTNESS: every status implementation changes together - the template's rollup and unagreedMarker(), dataset_status.py, sample_data.state_for_participants, build_dashboard_data.share_cross_table_results, status-cases.json and REQ-DASH-436's 'Not yet checked' state - with one test driving the same inputs through each (the item-74 lesson)."
    - "MAINTAINABILITY: sample_data is split along the line criterion 2 draws - is_sample stays the ROUTING question (no period, both no_calendar values, REQ-PIPE-434), and supply_state answers the COUNTED question (in development for `not-yet-agreed` and `derived`, agreed otherwise); no caller asks one for the other."
    - "SCALABILITY: the refusals are per dataset, so they cost nothing extra at 30 collections."
  dependencies:
    - REQ-PIPE-106
  decisions:
    - "SETTLED by Keith 2026-11-21 (Q4.1 (a)): a one-off's QA IS the deliverable, so its verdicts count. REJECTED (b), REQ-PIPE-106 as built, under which an all-`never` folder reads 'Not counted' at every level."
    - "WHY 106 GOT THIS WRONG: its 'one mechanism, two exits' (2026-09-27) gave both exits the check-development semantics, and sprint 29 point 5 - only DERIVED products are excluded - implied otherwise. Nobody reconciled the two until 2026-11-21."
    - "A `derived:` DECLARATION OF ITS OWN (delivery-architect, v4 finding 5): once `never` is counted, routing (the no-period schema) and state (in development) come apart, and `not-yet-agreed` is refused in a one-off, so a derived product needs a key that says only that."
    - "SETTLED by Keith 2026-11-21 (round 5 architect Q3 (a)): a cross-table check over a derived and a counted table counts on the counted side and is excluded only from the derived product's - one new rule. Today state_for_participants records the whole result in development if any participant has no calendar; that rule stays for not-yet-agreed, where it protects an agreed dataset from a check under development."
    - "SETTLED by Keith 2026-11-21 (Q4.7 (a)): `never` lives only under one-offs/; an asset under assets/ refuses it. REJECTED allowing both."
    - "THE WORDS ARE THE UX REVIEW'S (findings 7 to 9): derived products had no words; the current tooltip would become false; a marker on 30 rows is noise."
    - "WHAT STAYS FROM 106 for `never`: criteria 4 and 5 (the no-period schema, excluded from period arithmetic by construction) and the hierarchy criteria 11 to 15. Criterion 17's discard is superseded for a one-off by dropping it (REQ-PIPE-442)."
    - "v6, `derived:` LIVES IN calendar.yaml ONLY (delivery-architect post-sign-off B): v5 declared it in data-asset.yaml (REQ-PIPE-440 criterion 2) and read it here as 'its configuration', so two files could disagree. It sits beside `no_calendar`, which the one calendar loader already reads. REJECTED data-asset.yaml as its home: the hierarchy says where a dataset sits, the calendar says how its supplies count."
    - "v6, THE SCHEDULE GATE OWNS THE REFUSALS (delivery-architect B): criteria 8 and 9 said 'the system shall refuse', which a loader-level raise would satisfy and which would then break every reader of a bad folder, the dashboard build included. The gate names the dataset; the loader reads what it is given."
    - "v6, HOW CRITERION 4 WORKS (delivery-architect G): record the result agreed, share it with every participant as share_cross_table_results already does, and count it only where the participant is counted. All participants derived means nothing counted it, so in development. This is the mechanism under Keith's round 5 answer, not a new rule."
    - "v6, THE MARKER IS FOR NOT-YET-AGREED ONLY (delivery-dashboard-ux B): v5's criterion 6 removed the marker from `never` rows while criterion 7 rewrote its tooltip for them, leaving a tooltip with nothing to hang on. REJECTED keeping a `never` sentence in the tooltip."
    - "v6, THE KIND'S DISPLAY WORD (delivery-dashboard-ux smaller points): '<kind>' in criterion 5 is the plug-in's display word ('extraction'), never the folder name."

- id: REQ-PIPE-446
  title: "one-offs/<kind>/<id>/ is read by the resolver beside assets/ - selected by `mothman one-off --id`, one id namespace across assets and every kind, each (gate, kind) declared, changed folders fully gated with a digest pass over the rest, and no one-off ever using GitHub"
  date_written: "2026-11-21"
  story: "As whoever maintains the pipeline, I want one-offs of any kind found and selected like assets while staying out of everything that serves the enduring assets, so that hundreds of them cost the gates little and never touch CI."
  moscow: must
  status: not_started
  source: "Keith 2026-11-21, round 3 (one-offs apart from the enduring assets), round 4 (one-offs/<kind>/<id>/, the extraction the first kind) and round 5 (architect Q2 (b)); delivery-architect v4 findings 6, 7 and 9 and its reuse list. Checked against asset_model/assets.py, cli/check.py's _GATES and _asset_passes, qa_tools/common/diff_base.py and REQ-PIPE-342/363. Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-architect post-sign-off A, H, J, K, L and M, delivery-cli-ux G4, G7 and C5, and Keith's answers (--id; never GitHub; every kind declares a project; copy nothing). Shared by every kind. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL list one-offs from one-offs/<kind>/ for every kind folder under one-offs/ - directories only, '_' and '.' names skipped - and SHALL NOT hold a list of one-offs anywhere in code; IF a one-off folder's name does not meet NAME_PATTERN, THEN `mothman check` SHALL fail, naming it, and THE SYSTEM SHALL NOT select any other folder in its place."
    - "IF a kind folder under one-offs/ has no kind plug-in registered in code - the reader for its package, its generator, its check layers and its display words (the kind's name in the singular and plural, e.g. 'extraction' and 'extractions', and the name of its own check layer, e.g. 'Recipe check') - THEN THE SYSTEM SHALL fail `mothman check`, naming the folder."
    - "WHEN a `mothman one-off` step is given `--id <id>`, or the `mothman one-off` TUI has a one-off chosen, THE SYSTEM SHALL select it - its configuration in one-offs/<kind>/<id>/, its state paths data/<id>/ and reports/<id>/, and its database supply_<id> - and IF MOTHMAN_ASSET is set and names anything other than that id, THEN THE SYSTEM SHALL refuse, naming both, before reading any configuration or opening any connection."
    - "IF one id is a folder under assets/ and under any kind, or under two kinds, THEN THE SYSTEM SHALL refuse to select it, and `mothman check` SHALL fail, naming every folder - since they would share data/, reports/, a database and a module tag."
    - "IF a folder's data-asset.yaml states a data_asset_id other than its folder name, THEN `mothman check` SHALL fail, naming both, for assets and one-offs alike."
    - "THE SYSTEM SHALL keep assets.names(), and every reader that iterates the enduring assets through it, to assets/ alone, and SHALL list one-offs only through a reader of their own."
    - "THE SYSTEM SHALL let a deployment point the one-offs root elsewhere as use_root does for assets/ (REQ-PIPE-342), SHALL let a test point it at a temporary folder, and SHALL carry that root to a child process in assets.handoff() as it carries the assets root."
    - "WHILE a one-off is selected, THE SYSTEM SHALL build no per-collection command group and read no collection at import (REQ-PIPE-363 criterion 2 as amended), and SHALL reach every one-off step through `mothman one-off` (the TUI, open, load, decide, publish, drop, list), so that a one-off's collection short can never clash with a top-level command."
    - "WHILE a one-off is selected - by `--id`, by the TUI, or by MOTHMAN_ASSET naming it - THE SYSTEM SHALL run only `mothman one-off`, `mothman check` and `--help`, and SHALL refuse every other command, naming the one-off."
    - "THE SYSTEM SHALL have every per-asset gate in `mothman check` declare, for each one-off kind, whether it applies, SHALL refuse to run a gate with any (gate, kind) pair undeclared, SHALL decide a one-off's synthetic gates from that declaration and never from _has_synthetic's default for a name it does not find, and SHALL word a gate that does not apply to a kind 'not applicable (<kind>)' with the kind's display word, keeping 'not applicable (no synthetic/ folder)' for an enduring asset."
    - "WHEN `mothman check` runs, THE SYSTEM SHALL run each applicable gate in full over every one-off folder changed since the diff base (MOTHMAN_DIFF_BASE) and check that folder's digest too, and SHALL check every other one-off folder in one in-process pass that its files still match the digest it recorded when generated - counting untracked files in both, and leaving out only the gitignored dbt artefacts (REQ-PIPE-440 criterion 11)."
    - "THE SYSTEM SHALL show one row per applicable gate for all one-offs of a kind - how many folders were gated in full and how many by digest, and the name of each that failed - SHALL show every gate that does not apply to a kind on one line, 'not applicable (<kind>): <gate>, <gate>, ...', never as passed and never a row each, SHALL name the folder and the first file that differs in a digest failure, SHALL count folders gated in full and by digest in the run's one-line result, and SHALL show nothing about one-offs where there are none."
    - "THE SYSTEM SHALL let the collections gate accept a one-off's collections served by its kind's shared adapter, resolved through the adapter registry, and SHALL go on failing any enduring asset's collection without an adapter of its own."
    - "THE SYSTEM SHALL have a test that no CI workflow and no session-start hook loops over, selects or loads a one-off folder."
    - "THE SYSTEM SHALL amend REQ-PIPE-342 criterion 5 and REQ-PIPE-363 criteria 1, 2, 4, 5 and 6 in the same change, as amendments-v6 states."
    - "THE SYSTEM SHALL have assets.selected(), assets.select(), assets.why_not_selected() and assets.adopt() consult the one-off listing as well as assets/, and SHALL hold each kind's root in the resolver's layout (_layout) beside the assets root."
    - "THE SYSTEM SHALL have the selected Asset state its kind - the kind folder it was found under, or none for an enduring asset - read from where its folder is, never from a declaration inside it."
    - "THE SYSTEM SHALL require every one-off folder, of every kind, to name its project in its data-asset.yaml, and IF one does not, THEN `mothman check` SHALL fail, naming the folder."
    - "THE SYSTEM SHALL NOT, for any one-off of any kind, open, read, update or comment on a GitHub ticket, read a ticket comment, or make any GitHub API call; pushing the one-off's configuration with git (REQ-PIPE-440 criterion 9) is not a GitHub API call and SHALL be allowed."
    - "WHEN `mothman check` runs and a kind's template (one-offs/<kind>/_template/) has changed since the diff base, THE SYSTEM SHALL gate it with every gate its kind declares as applying to the template, since every one-off of that kind reads it live (REQ-PIPE-440 criterion 13)."
  non_functional_requirements:
    - "SCALABILITY: each per-asset gate is a subprocess, so full gating of 200 folders would be about 2,000 interpreter starts (delivery-architect); changed-only plus a digest pass is what keeps `mothman check` near today's time."
    - "SCALABILITY: the two-level listing cannot use assets.py's single-directory stat cache; each kind folder needs its own stat stamp, or the listing is re-read on every selected() call."
    - "COST: the shell loops in test.yml (about 15) and the session-start hook (3) list assets/ and so never see one-offs. CI does still PARSE them - `yamllint --strict .` in critical.yml and test.yml reads every YAML file - which reads no data and is cheap, but is why criterion 14 says loops over, selects or loads, not names."
    - "SECURITY: a one-off's database holds real supply rows, so nothing CI runs may select one; and criterion 19 keeps every one-off off GitHub's API, so no ticket, comment or API record of a one-off exists outside the repository's own commits."
    - "PRIVACY: a real deployment's one-off folders name projects, cohorts and filters, so a real deployment would keep them in a private repository; this PoC's fixture and folders are synthetic, so the public repository is accepted for them (Keith 2026-11-21)."
    - "MAINTAINABILITY: validate-config.yml never checks one-offs; their configuration is gated locally by criterion 11 and at load by REQ-PIPE-442 criterion 3, and that is a deliberate limit."
  dependencies:
    - REQ-PIPE-342
    - REQ-PIPE-363
    - REQ-PIPE-385
  decisions:
    - "SETTLED by Keith 2026-11-21 (round 3): one-offs live apart from the enduring assets, get a database as any asset does, and are never listed by the enduring-asset loops."
    - "SETTLED by Keith 2026-11-21 (round 4): one-offs/<kind>/<id>/, the kind a folder level, each kind's template beside its folders; shared by every kind - the listing, the database, the release decision and publishing - each kind plugging in its own recipe reader and checks. REJECTED one root with a declared `kind:`, the recommendation."
    - "ONE ID NAMESPACE ACROSS ASSETS AND EVERY KIND (Keith, round 4 note): MOTHMAN_ASSET, supply_<name> and data/<name> do not carry a kind, so an id must be unique across all of them, not only within its kind."
    - "THE BARE ID, NOT A PREFIX (delivery-scoper, v4): a prefix with a slash breaks NAME_PATTERN, the module tag and the data/<name> paths; a name prefix would be cosmetic. Criterion 4 refuses the clash a prefix would have prevented."
    - "EACH (GATE, KIND) DECLARES, NO DEFAULT: a default of 'applies' fails every calendar or scenario gate; 'does not apply' silently leaves a new gate unrun. A new kind therefore declares every gate before its first folder can pass."
    - "THE EXTRACTION KIND'S DECLARATIONS, matched to cli/check.py's real per-asset gates (delivery-architect, v4 finding 6; caches moved in v6). APPLY - hierarchy, collections, schedule (it gates the `never` and `derived` declarations in the minimal calendar.yaml), patterns, soda, columns, people (over the template's people.yaml). DO NOT APPLY - caches, providers, scenarios and scenario map (synthetic), guard (it opens a database), and the docs gates plans, requirements, sprints, provisional, changelog, feedback and premise (repository-wide reads with nothing of a one-off in them). The repository-wide gates (ruff, yamllint, agents, imports, dbt packages, layout, npm test, pytest) run once; layout learns the one-offs/<kind>/<id>/ layout, and dbt packages accepts a one-off's dbt project pointing at dbt_shared and the deployment's local dbt_utils copy."
    - "SETTLED by Keith 2026-11-21 (round 5 architect Q2 (b)): full gates on folders changed since the diff base, plus one cheap pass over the rest checking each still matches its recorded digest. It replaces v4's 'under one second per folder', which the architect showed unreachable."
    - "NO PER-COLLECTION COMMANDS FOR A ONE-OFF (delivery-scoper, v5; delivery-architect v4 finding 9): REQ-PIPE-363 criterion 2 builds a command group per collection short, so a one-off's shorts would become top-level commands and could clash with `pipeline` or `dashboard`. One group, `mothman one-off`, removes the clash rather than refusing it."
    - "REUSE (delivery-architect): the adapter registry already loads by path, so a kind's shared adapter is resolved there; check.py's per-gate rows gain one new 'checked by digest' state."
    - "REJECTED putting one-offs under assets/ (v3): every enduring-asset loop would have needed teaching to skip them - about 18 shell loops and every Python reader."
    - "v6, SELECTED BY --id, NOT BY MOTHMAN_ASSET (Keith 2026-11-21, CLI Q2): load, decide, publish and drop take `--id`, and the TUI browses and selects. Still refused when MOTHMAN_ASSET names something else (delivery-cli-ux G4), so the environment can never quietly point a step at a different one-off or asset. REJECTED MOTHMAN_ASSET as the only way to name a one-off: every step would need the variable re-exported per one-off. Whether MOTHMAN_ASSET may still NAME a one-off at all, and what REQ-PIPE-363's refusal then says about one-offs, is question 2 of the v6 changes."
    - "v6, AN ALLOWLIST, NOT A BLOCKLIST (delivery-cli-ux G7, delivery-architect A): v5's criterion 9 listed commands to refuse, which cannot be verified complete and missed `mothman pipeline process`, which would have reconciled tickets for a one-off against REQ-PIPE-435 criterion 8. Three things run; everything else is refused."
    - "v6, NO GROUPS AT IMPORT (delivery-architect A, L): cli/app.py builds the collection groups when it is imported, so with a one-off selected it would still build them; criterion 8 now says so and REQ-PIPE-363 criterion 2 is amended to match."
    - "v6, THE RESOLVER'S OWN FUNCTIONS (delivery-architect J): selected, select, why_not_selected and adopt read only assets/ today, _layout holds one root, and handoff carries one root to a child process, so a one-off selected in a parent would be unknown in its child. Criteria 7 and 16 cover them, and criterion 1 makes a bad one-off name a check failure rather than a fall-through to another selection."
    - "v6, THE ASSET STATES ITS KIND (delivery-architect M): every kind-specific reader (the page's masthead, the gate wording, the plug-in lookup) needs it, and reading it from the folder's location keeps 'the folder's location is its kind' (REQ-PIPE-440) true."
    - "v6, GATES (delivery-architect K): caches moves to DO NOT APPLY (it is about the enduring assets' build caches); _has_synthetic returns True for a name it does not find, so left alone it would run the synthetic gates on every one-off; the not-applicable words are per kind, because 'no synthetic/ folder' is not why a gate skips a one-off."
    - "v6, DIGEST HOLES (delivery-architect H): a changed folder was gated in full but never digest-checked, so an edited generated file passed if it still validated; untracked files were outside the digest, so a file added by hand was invisible. Both closed in criterion 11. Load's own gate run is REQ-PIPE-442 criterion 3 (Keith, Q-A4 (a))."
    - "v6, check's OUTPUT (delivery-cli-ux C5): counts so a green line cannot overclaim, the failing file named, the not-applicable gates on one line, and silence where there are no one-offs."
    - "SETTLED by Keith 2026-11-21 (dashboard question (a)): EVERY KIND DECLARES A PROJECT - criterion 18. REJECTED (b) showing a project only where a kind declares one; REQ-DASH-444's title relies on it."
    - "SETTLED by Keith 2026-11-21: 'One offs should never use GitHub.' Criterion 19 states it for every kind. Keith the same day: pushing the folder commit is fine; the rule covers tickets, comments and API calls."
    - "v6, THE TEMPLATE IS GATED (delivery-scoper, following Keith's 'copy nothing'): once people.yaml, the default check layer and the destination are read live from _template/ by every one-off of the kind, an unchecked edit to the template reaches every one of them, so criterion 20 gates it when it changes. The listing still skips it as a one-off."
    - "v6, NO 259 HOLD (Keith 2026-11-21, architect Q-A2: 'Happy for it to go while the repo is public, this is a poc with fake data.'): REVERSES round 5's 'block on going private'. The PRIVACY NFR says what a real deployment would need instead. REJECTED the architect's (a) a guard on `one-off open` and (b) keeping REQ-DOCS-259 as a dependency."
    - "v6, REQ-PIPE-363 CRITERION 5 IS AMENDED after all (Keith 2026-11-21, yes to delivery-cli-ux D3): the architect's L proposed leaving it alone; Keith chose to have --help's Collections panel match criteria 4 and 6."

- id: REQ-PIPE-442
  title: "Each one-off is worked from its own `mothman one-off` TUI or by --id, loaded into a database of its own after its folder is gated, resumed if a load stops, and dropped - with its local files, reports and dbt scratch - only by a person typing its id"
  date_written: "2026-11-21"
  story: "As whoever QAs a one-off, I want it worked in a database of its own that I remove, with everything it left on disk, when I am done, so that one one-off's rows never sit beside another's and never outlast the work."
  moscow: must
  status: not_started
  source: "plans/supply-model.md sprint 29 points 7 and 9 (Keith, 2026-09-27); Keith 2026-11-21 Q4.3 (a), Q4.6 (a), round 2 Q1 (a) and Q5 (b), round 5 architect Q4 (a); delivery-architect v4 findings 2 and 9 and its reuse list. Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-cli-ux G1-G3, G6, C1, C7, C8, D1 and D2, delivery-architect A2, F, L and the two contradictions, and Keith's answers (the TUI; --id; drop by typed id only; load gates its folder; no 259 hold). Shared by every kind. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL run every `mothman one-off` command with MOTHMAN_ASSET unset, as an exemption from REQ-PIPE-363 criteria 6 and 7 - bare `mothman one-off`, open and list selecting nothing, and load, decide, publish and drop selecting the one-off their `--id` names (REQ-PIPE-446 criterion 3): open reads the package, the kind's template and the folder names under assets/ and one-offs/, and connects to nothing; list reads the one-offs root and git, and connects to the configured local server only through an administrative connection that lists its databases and claims no asset for the process."
    - "WHEN a person runs bare `mothman one-off`, THE SYSTEM SHALL open a menu of its own, needing no asset set, that lists the one-offs as criterion 10 does and lets the person choose one to work on or open a new package; once one is chosen, THE SYSTEM SHALL act on that one-off for every step for the rest of the session, and SHALL need a new session to work on another."
    - "WHEN a person loads a one-off from the TUI or `mothman one-off load --id <id>`, THE SYSTEM SHALL select it (REQ-PIPE-446 criterion 3), run every gate its kind declares over its folder and refuse on a failure, naming the gate and the folder, and only then create supply_<id> on the configured local server, mark that database's identity as the one-off's (db_identity.mark), record the package's digest in it, and stage, check and record the package there through the same pipeline as any arrival, filing one delivery per collection."
    - "WHERE a package holds a file its recipe does not declare, THE SYSTEM SHALL record it as a failing default-layer result (REQ-QAC-441 criterion 3), naming the file, and SHALL NOT file it."
    - "IF supply_<id> exists holding a different package's digest, THEN THE SYSTEM SHALL refuse the load and say a re-send is a new one-off; WHERE it holds the same package's digest, THE SYSTEM SHALL resume the load from where it stopped rather than refusing it."
    - "WHEN a person drops a one-off from the TUI or `mothman one-off drop --id <id>`, THE SYSTEM SHALL list in the confirmation each thing that will be removed, each with what it holds - the database supply_<id> (its tables and rows), data/<id>/ and reports/<id>/ (their files), the dbt scratch, and the one-off's dbt target/, logs/ and dbt_packages - with any warning REQ-PIPE-443 adds, SHALL require the person to type the id, and SHALL NOT remove anything otherwise."
    - "THE SYSTEM SHALL accept nothing but the typed id as the drop's confirmation - no flag stands in for it and `--yes` never skips it - and IF no terminal is attached, THEN THE SYSTEM SHALL refuse the drop in NeedsATerminal's words."
    - "WHEN the id is typed, THE SYSTEM SHALL remove every item the confirmation listed, saying 'Deleted <item>' as each goes, and SHALL leave the one-off's committed configuration in place; IF any item cannot be removed, THEN THE SYSTEM SHALL name each one it could not remove and SHALL let the same drop be run again to finish."
    - "THE SYSTEM SHALL NOT drop a one-off automatically - not on publishing, not on a schedule, and not as a side effect of anything else."
    - "THE SYSTEM SHALL list, in the TUI and `mothman one-off list`, every one-off with its stage - opened, committed, pushed, or loaded - how long since its database was created where it has one, and the command for its next step, and every one-off database still on the server with its age; WHERE there are no one-offs, THE SYSTEM SHALL say so and name `mothman one-off open`."
    - "THE SYSTEM SHALL NOT run any part of a one-off in CI."
    - "WHEN any `mothman one-off` command finishes, THE SYSTEM SHALL end its output with the command for the next step - after open, the git commands to commit and push the folder and then `mothman one-off load --id <id>`; after load, decide or publish; after publish, decide or drop."
    - "THE SYSTEM SHALL name the selected one-off, in words, wherever REQ-PIPE-363 criterion 8 names the asset - 'Environment: Sandbox (not production) · One-off: <id> (extraction)', the kind in its display word - in the TUI's toolbar and the line at the first connection."
    - "THE SYSTEM SHALL list `mothman one-off` as a Tier 1 command in `mothman --help`'s Tools panel."
    - "THE SYSTEM SHALL use the words 'one-off' only for a one-off, and SHALL reword cli/app.py's 'one-off command' (a single command run outside the wizard) to say that instead."
  non_functional_requirements:
    - "SECURITY: creating a database needs CREATEDB on the local server; the role that holds it is the operator's, never a CI or service identity."
    - "PRIVACY: a one-off's rows sit on a shared local server between load and drop, and copies of its files and its failing-row keys sit under data/<id>/ and reports/<id>/ until the drop removes them (criterion 8). A real deployment's one-off folders would need a private repository (REQ-PIPE-446's PRIVACY NFR)."
    - "COMPLIANCE / RETENTION: a forgotten one-off is the retention risk, which is why criterion 10 lists them with their age; nothing drops one for the person."
    - "RELIABILITY: a failed load leaves the database in place and is resumed by loading the same package again (criterion 5); a drop that fails partway names what it could not remove and can be run again (criterion 8)."
  dependencies:
    - REQ-PIPE-440
    - REQ-PIPE-446
  decisions:
    - "SETTLED by Keith 2026-09-27 (point 7) and confirmed 2026-11-21 (round 2 Q1 (a)): one ephemeral PostgreSQL database per one-off, on the local server, driven by a human through the TUI, with no CI anywhere near it."
    - "REJECTED by Keith 2026-11-21 (round 2 Q1), after drafting it as a real alternative at his own ask ('maybe it doesn't have a database'): checking a one-off in process over its files with no database, its record a file beside the package. Its gain was real - rows never copied, no server or CREATEDB - but it reversed REQ-PIPE-087's 'one engine, and it is PostgreSQL' for dbt, Soda and datacontract-cli (a second DuckDB adapter each, and soda-core-duckdb's old duckdb pin back), gave every check a second SQL dialect, forked staging, run views, the results writer and the decision record into a second implementation (the item-74 pattern), and kept the record append-only by convention only. The published page is the lasting record either way. Also REJECTED: a shape with no engine at all, dropping three of the four tools."
    - "SETTLED by Keith 2026-09-27 (point 9), A REVERSAL: a corrected re-send is a NEW one-off. He first chose resupply, then reversed because a package arriving months later finds the first database dropped and its dashboard a static file that cannot be merged into. REJECTED with it: re-running QA over both packages from disk, a non-ephemeral database, and the new dashboard merely linking back."
    - "SETTLED by Keith 2026-11-21 (Q4.3 (a)): a second package is refused; the committed folder is the lasting guard (REQ-PIPE-440 criterion 6), the server is checked here (criterion 5) and the destination by REQ-PIPE-443 criterion 7."
    - "SETTLED by Keith 2026-11-21 (Q4.6 (a), round 2 Q5 (b), round 5 architect Q4 (a)): a person drops it with a typed confirmation, never automatically; an unpublished one may be dropped with a warning; the drop removes the database AND data/<id>/, reports/<id>/ and the dbt scratch, each listed. Found by the architect: hand-filing copies the delivery under data/<id>/ and reports/<id>/ holds failing-row keys, so dropping the database alone would have left the extract on disk."
    - "THE OPEN EXEMPTION (delivery-architect, v4 finding 9): the TUI refuses with no asset selected and the first connection claims the process, so a one-off that does not exist yet cannot be opened under the normal rule. Open reads no asset and connects to nothing; load selects the one-off before it connects."
    - "REUSE (delivery-architect): hand_filing.file_supply and s3_source for loading; bootstrap/checkpoints' administrative create-and-drop; db_identity for marking; cli/env.py's database ages for criterion 10; env reset-synthetic's confirmation flow for the drop."
    - "v6, THE EXEMPTION COVERS THE WHOLE `mothman one-off` GROUP (following Keith's CLI Q1 and Q2): v5 exempted open and list only; once the later steps select by `--id` and the TUI needs no asset, every one-off command runs with MOTHMAN_ASSET unset, and REQ-PIPE-363 criterion 6's amendment says so."
    - "v6, THE TUI IS BARE `mothman one-off` (Keith 2026-11-21, CLI Q1 (a); delivery-cli-ux G3): bare `mothman` refuses without an asset (REQ-PIPE-363 criterion 7) and claim_for_connection claims one asset per process, so the one-off TUI is its own entry point with its own menu, and one one-off per session is what the per-process claim allows. REJECTED putting one-offs inside the asset wizard."
    - "v6, --id ON EVERY LATER STEP (Keith, CLI Q2): load, decide, publish and drop take `--id`; the TUI browses and selects. REQ-PIPE-446 criterion 3 holds the selection rule and the MOTHMAN_ASSET refusal."
    - "v6, LOAD GATES ITS OWN FOLDER (Keith 2026-11-21, architect Q-A4 (a)): `mothman check` gates a folder only when someone runs it; a load that ran an ungated folder could publish a page from configuration no gate had read. REJECTED (b) accepting that limit."
    - "v6, RESUME, NOT REFUSE (delivery-cli-ux G2 and the architect's first contradiction): v5's criterion 3 refused any existing database, which contradicted its own RELIABILITY NFR - a load that crashed could never be finished. A database holding the same package's digest is resumed; only a different package's is refused. Re-loading the same package after an unpublished drop is question 3 of the v6 changes; as drafted it is allowed, because nothing records that a drop happened."
    - "v6, THE PUBLISHED-PAGE REFUSAL AND BOTH DROP WARNINGS MOVED TO REQ-PIPE-443 (the architect's second contradiction): each needs the destination, so keeping them here made this requirement depend on publishing, which depends on this. REQ-DOCS-259 and REQ-PIPE-443 both leave the dependencies."
    - "v6, ONE DELIVERY PER COLLECTION, UNDECLARED FILES NOT FILED (delivery-architect A2): hand_filing refuses a file that matches no arrival pattern, which would have stopped the whole load on the undeclared file REQ-QAC-441 criterion 3 says is a failing result. REQ-PIPE-440 generates a pattern per declared table; an undeclared file is recorded failing and never filed."
    - "SETTLED by Keith 2026-11-21: DROP BY TYPED ID ONLY - `--yes` never skips it and a session with no terminal is refused in NeedsATerminal's words. REJECTED a `--confirm <id>` flag form (delivery-cli-ux C1 offered it as Keith's possible preference). The flow is reset-synthetic's - counts per item, the typed id, 'Deleted ...' - with a partial failure re-runnable."
    - "v6, THE dbt ARTEFACTS IN THE DROP LIST (delivery-architect F): dbt writes target/, logs/ and dbt_packages into the one-off's own dbt project, which v5's list missed."
    - "v6, CRITERION 1 SAYS WHAT EACH COMMAND READS (delivery-cli-ux G6, delivery-architect L): v5 said `list` read only files while criterion 8 had it list databases, and open also reads the package and assets/ folder names for the clash check."
    - "PROVISIONAL, v6, LIST'S STAGES (delivery-cli-ux D2 asked for a status board): stage, age and next step, from what list can see without opening each one-off's own database - the folder, git, and the server's list of databases. Checked, decided and published are shown on the one-off's own view in the TUI, because reading them for every one-off would open a database per row and read the destination (REQ-PIPE-443) from here. Question 5 of the v6 changes."
    - "v6, THE ENVIRONMENT LINE, TIER 1 AND THE app.py WORDING (delivery-cli-ux C7, C8): one line names what a command acts on whether it is an asset or a one-off; `mothman one-off` sits beside the other Tier 1 commands; and 'one-off command' in cli/app.py, meaning a command run outside the wizard, would read as a one-off's command."
    - "v6, EACH COMMAND NAMES ITS NEXT STEP (delivery-cli-ux D1): five commands in a fixed order, used a few times a year, so the next one is said rather than remembered."
    - "v6, NO 259 HOLD (Keith 2026-11-21, architect Q-A2): REVERSES round 5. REQ-DOCS-259 leaves the dependencies, and v5's 'running any REAL one-off waits for REQ-DOCS-259' is gone from the source."
  open_questions:
    - "Where load finds the package: given again as an argument, or recorded at open. A build decision - the recipe digest check (REQ-PIPE-440 criterion 8) refuses a wrong package either way."

- id: REQ-PIPE-443
  title: "A one-off's dashboard can be published at any time, after a confirmation, to the shared folder or S3 location its kind's template names, showing its decision once there is one, never retired and never overwriting another one-off; the destination also guards load and drop"
  date_written: "2026-11-21"
  story: "As a project team member or auditor, I want each one-off's QA page in one known place, permanently, so that what was checked and decided can be found years later."
  moscow: must
  status: not_started
  source: "plans/supply-model.md sprint 29 point 8 and its durable-record paragraph (Keith, 2026-09-27); Keith 2026-11-21 round 2 Q3 (b); delivery-architect v4 finding 10. Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-architect post-sign-off D and D2 and the 442-on-443 contradiction, delivery-cli-ux G1 and C3, and Keith's answers (copy nothing; --id). Shared by every kind. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "WHEN a person publishes a one-off from the TUI or `mothman one-off publish --id <id>`, THE SYSTEM SHALL build its dashboard by the rebuild, reshape, embed and render-gate steps of any asset's build, and write it as one page named by the id to the destination named in the kind's template (one-offs/<kind>/_template/), read at the moment of publishing - a filesystem path or an S3 prefix - with the page's fonts/ beside it, whether or not a decision has been recorded."
    - "THE SYSTEM SHALL NOT, in publishing a one-off, archive a snapshot into the committed dashboard/snapshots/, compare a build fingerprint, or apply the publish-environment gate of the recurring assets' publish()."
    - "WHEN a person publishes, THE SYSTEM SHALL first show the address it will write to, the decision in force or that there is none, and how many datasets are not yet checked, and SHALL ask them to confirm, `--yes` confirming; WHEN the page is written, THE SYSTEM SHALL print its address."
    - "WHEN a person publishes a one-off already published, THE SYSTEM SHALL replace its own page at the same address, the new page showing every decision recorded so far."
    - "IF a page at that address was published for a different package, THEN THE SYSTEM SHALL refuse to write over it."
    - "THE SYSTEM SHALL NOT delete or retire a published page, and SHALL NOT build an index of published pages."
    - "IF a load is asked for (REQ-PIPE-442 criterion 3) for a one-off whose page is already published at its destination, THEN THE SYSTEM SHALL refuse the load and say a re-send is a new one-off."
    - "WHERE a one-off being dropped (REQ-PIPE-442 criterion 6) has no published page, THE SYSTEM SHALL warn, in the drop's confirmation, that no record of its QA results or decisions will remain once it is dropped - only its committed configuration - and SHALL drop it if the id is typed."
    - "WHERE a one-off being dropped has a published page older than its latest recorded decision, THE SYSTEM SHALL warn, in the drop's confirmation, that the page does not show that decision, and SHALL offer to publish first before the person types the id."
    - "THE SYSTEM SHALL NOT publish any one-off from CI or to the recurring assets' hosting."
  non_functional_requirements:
    - "SCALABILITY: 30-40 extraction pages a year, about 200 after five years, in one place with no index; Keith accepted that cost out loud."
    - "SECURITY: who can read the destination is the destination's access control, not this system's; the page carries failing-row identifier keys (Q4.5 (b)), so the destination must be restricted to people entitled to them."
    - "COMPATIBILITY: the page needs no network; its fonts load from a fonts/ folder beside it, which publishing writes to the destination, and it references nothing under vendor/ (REQ-DASH-444 criterion 11). A copy of the page alone, downloaded elsewhere, still opens and reads, falling back to system fonts."
    - "MAINTAINABILITY: the destination is read live from the kind's template, so changing where a kind publishes is one edit; a page already published stays where it was written."
    - "COST: S3 storage for a few hundred small files is negligible."
  dependencies:
    - REQ-DASH-444
    - REQ-PIPE-442
  decisions:
    - "SETTLED by Keith 2026-09-27 (point 8): one dashboard per one-off, to a shared filesystem or S3, never retired, with no index."
    - "SETTLED by Keith 2026-11-21 (round 2 Q3 (b)): publish at any time as a QA report, showing the decision once there is one. REJECTED (a) refusing until a decision exists, the recommendation, and (c) publishing once only."
    - "REJECTED by Keith 2026-09-27: a generated index page, with the cost accepted out loud - after five years, 200 files and no way to answer 'which extractions did we QA for that project'."
    - "THE FONTS NFR WAS FALSE IN v4 (delivery-architect, finding 10): it said fonts and vendor assets were self-contained 'as today', and they load from fonts/ beside the page."
    - "A LATER PUBLISH REPLACES ONLY ITS OWN PAGE: replacing is how an undecided report becomes a decided one; refusing another package's overwrite keeps 'never retired' true for everyone else's."
    - "v6, NOT publish() WHOLE (delivery-architect post-sign-off D2): v5 said 'the same build sequence as any asset's', and publish() also archives a snapshot into the committed dashboard/snapshots/, compares a fingerprint and applies the publish-environment gate - none of which fits a page written once to a project's folder. Criterion 1 names the four steps reused and criterion 2 the three that are not."
    - "v6, NO vendor/ ON THE PAGE (delivery-architect D): v5's decision said the page needed no vendor/ because the Demo tab is removed, but the template loads asciinema's files in its head whether or not the tab exists. REQ-DASH-444 criterion 11 builds the one-off page without those references. REJECTED publishing vendor/ beside the page, which would ship a player for a tab that is not there."
    - "v6, THE DESTINATION IS READ LIVE FROM THE KIND'S TEMPLATE (Keith 2026-11-21, 'copy nothing'): REVERSES v5's copy of the destination into each folder (REQ-PIPE-440). The page's commit records which version of the template ran (REQ-DASH-444 criterion 8)."
    - "v6, THE DESTINATION'S GUARDS LIVE HERE (the architect's second contradiction): the already-published load refusal and both drop warnings read the destination, so they moved from REQ-PIPE-442 to this requirement, which now depends on 442 instead of the reverse."
    - "v6, THE STALE-PAGE WARNING (delivery-cli-ux G1): a decision recorded after the last publish would be lost at drop with nothing said; criterion 9 says so and offers to publish first."
    - "v6, PUBLISH CONFIRMS (delivery-cli-ux C3): it writes outside the repository to a place other people read, so the address, the decision and the unchecked count are shown first."

- id: REQ-DASH-444
  title: "A one-off's page names itself '<id> · <project> · QA report' and its kind once, shows its release decision - or that there is none - above the QA result on every view, and says when, where and from what it was published"
  date_written: "2026-11-21"
  story: "As someone reading a one-off's page, possibly a downloaded copy long after the work, I want it to say plainly whether the data was released or withheld, by whom and why - or that nobody has decided - and how current the copy is, so that a green QA result is never read as a release."
  moscow: must
  status: not_started
  source: "plans/supply-model.md sprint 29, 'the durable record is a static file' (2026-09-27); Keith 2026-11-21 Q4.2 (b) and round 5 UX Q1 (a), Q2 (a), Q3 (a); delivery-dashboard-ux v4 findings 1 to 5, 9, 11 and 14. Drafted by delivery-scoper 2026-11-21 (split from v4's REQ-DASH-444; the recipe display is REQ-DASH-447); v5 signed by Keith 2026-11-21; v6 folds in delivery-dashboard-ux post-sign-off E and its smaller points, delivery-architect D, and Keith's answers (every kind declares a project; copy nothing). Shared by every kind. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL give a one-off's page the site name '<id> · <project> · QA report', SHALL head its masthead with it and use it as the suffix of every view's title, and SHALL say once, in the masthead, which kind of one-off it is in the kind's display word, never its folder name."
    - "THE SYSTEM SHALL show the standing decision as one line above the QA status on every view of the page, a cold-loaded deep link included, in words of its own - 'Released by <actor>, <instant>: <reason>' or 'Withheld by <actor>, <instant>: <reason>' - and SHALL NOT show it as a Pass, Warn or Fail pill or by colour."
    - "WHERE no release-or-withhold decision has been recorded, THE SYSTEM SHALL say, on every view of the page and above its QA status, 'No release decision recorded. This page reports QA results only; it does not release or withhold the data.', and SHALL NOT use the words released, withheld, approved, cleared or pending anywhere else in that line."
    - "THE SYSTEM SHALL label the QA status on a one-off's page 'QA result' wherever it appears, so that it cannot be read as the release decision."
    - "WHERE the standing decision is withhold, THE SYSTEM SHALL show its reason in full in that line, in neutral words."
    - "THE SYSTEM SHALL list every decision on the home view, newest first, the standing one marked 'Current' and each earlier one 'Replaced by the decision of <instant>'."
    - "THE SYSTEM SHALL word decisions from a word table of their own, and SHALL NOT use decisionWords() or causeNoun(), whose filing vocabulary ('held back') would clash."
    - "THE SYSTEM SHALL show, beside the decision line, the instant the page was published, the address it was published to, the commit of this repository that built it and the commit its checks were run at (PROVISIONAL, question 1 of the v6 changes), and SHALL say that a decision recorded after that instant appears only on a later publish."
    - "THE SYSTEM SHALL NOT show, on a one-off's page, the Plans, Requirements, Release notes, Demo, Feedback, Leaderboard, Scenarios, Past snapshots or Recent activity controls."
    - "THE SYSTEM SHALL label every check on a one-off's page with one of two layer names - 'Default check' for the layer every one-off of the kind gets, or the kind's own layer name from its display words ('Recipe check' for an extraction) - and SHALL use the same two names wherever the page names a layer, REQ-DASH-447 included."
    - "THE SYSTEM SHALL build a one-off's page with no reference to anything under vendor/, so that it opens from its destination with no request for a file that is not there."
  non_functional_requirements:
    - "OBSERVABILITY / COMPLIANCE: the page is the only lasting record of the decisions once the one-off is dropped, so criterion 8's instant, address and commits are what make a found copy trustworthy - and, because the default checks, people.yaml and the destination are read live from the kind's template (REQ-PIPE-440 criterion 13), a commit is the only record of which version of them ran."
    - "PRIVACY: the page shows failing-row identifier keys as recurring dashboards do (Q4.5 (b)); REQ-PIPE-443's destination access control is what limits who reads them."
    - "COMPATIBILITY: no vendor/ reference and fonts/ beside the page (REQ-PIPE-443), so the page needs no network."
  dependencies:
    - REQ-DASH-436
    - REQ-PIPE-435
  decisions:
    - "SPLIT FROM v4's REQ-DASH-444 (Keith, round 4 kinds; delivery-dashboard-ux finding 14): the decision block, the undecided wording, the header and routes are every kind's; the recipe display is the extraction's and is REQ-DASH-447."
    - "SETTLED by Keith 2026-11-21 (round 5 UX Q2 (a)): one line above the QA status on every view, deep links included, in its own words, never a pill or colour; the QA status labelled as the QA result. REJECTED (b) a section on the home view only."
    - "SETTLED by Keith 2026-11-21 (round 5 UX Q3 (a)): the undecided words, exactly as criterion 3 has them. REJECTED 'Awaiting a release decision', which reads as though one is coming."
    - "SETTLED by Keith 2026-11-21 (round 5 UX Q1 (a)): the PoC development tools come out of a one-off's header. REJECTED keeping them."
    - "WHY THE UNDECIDED LINE IS SO EXPLICIT (delivery-dashboard-ux, finding 1): a filled green Pass with a small 'undecided' line reads as cleared, and REQ-PIPE-443 lets a page go out before anyone decides."
    - "'RELEASED' MEANS RECORDED AS RELEASED (finding 4): the line names the actor and the instant because the system never moves data (REQ-PIPE-435)."
    - "THE MARKER ONCE, IN THE MASTHEAD (finding 9), not on 30 rows."
    - "THE BUILD COMMIT IS A CRITERION, NOT ONLY AN NFR (finding 11); its value comes from snapshot_dashboard._git_short_sha (delivery-architect reuse)."
    - "v6, THE SITE NAME AND EACH VIEW'S TITLE (delivery-dashboard-ux post-sign-off E): v5 made '<id> · <project> · QA report' the whole title, which loses each view's own name in a browser tab or history; it is now the suffix. The kind is said in its display word ('extraction'), since a folder name is a developer's word."
    - "SETTLED by Keith 2026-11-21 (dashboard question (a)): every kind has a project (REQ-PIPE-446 criterion 18), so the site name always has one. REJECTED (b) a title without a project for a kind that declares none."
    - "v6, THE BANNED WORDS ARE SCOPED TO THE UNDECIDED LINE (delivery-dashboard-ux smaller points): read page-wide, criterion 3 would have banned 'pending' and 'cleared' from every check description on the page."
    - "v6, 'QA result' EVERYWHERE (delivery-dashboard-ux smaller points): one fixed label, not a description of what the label should convey."
    - "v6, A LATER DECISION APPEARS ONLY ON A LATER PUBLISH (delivery-dashboard-ux's optional point, paired with delivery-cli-ux G1): a downloaded copy says it may be behind, in the place the reader is already looking."
    - "PROVISIONAL, v6, TWO COMMITS (delivery-scoper, following Keith's 'the page's commit records which version ran' under 'copy nothing'): the checks run at load and the page is built at publish, and the template - read live by both - can change between them, so the build commit alone may not be the version that checked the data. Question 1 of the v6 changes."
    - "v6, ONE VOCABULARY FOR LAYERS (delivery-dashboard-ux smaller points): v5's criterion 10 said 'the default layer and the kind's own' while REQ-DASH-447 said 'from the recipe'; two fixed names now serve both."
    - "v6, NO vendor/ (delivery-architect D): see REQ-PIPE-443's decision; this is where the page is built without it."

- id: REQ-DASH-447
  title: "An extraction's page shows what its recipe declared - recipe format version, digest and filter on the home view, each table's declared columns, cohort and expected rows on its own view"
  date_written: "2026-11-21"
  story: "As someone reading an extraction's page long after its working data is gone, I want it to say what the extraction claimed to contain, so that the declaration survives the database and can be compared with what the checks found."
  moscow: must
  status: not_started
  source: "plans/supply-model.md sprint 29, 'the durable record is a static file' (2026-09-27); delivery-dashboard-ux v4 findings 12 and 14. Drafted by delivery-scoper 2026-11-21, split from v4's REQ-DASH-444; v5 signed by Keith 2026-11-21; v6 folds in delivery-dashboard-ux post-sign-off smaller points (447 c1 to c3) and delivery-architect M. The extraction kind's own. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL show on an extraction's home view its recipe format version, its recipe digest and its filter text, and SHALL NOT repeat the id and project the masthead already carries (REQ-DASH-444 criterion 1)."
    - "THE SYSTEM SHALL show on each table's own view its declared columns with their types and identifier marks, its placement, whether it is a derived product in REQ-PIPE-438 criterion 5's words, its cohort bounds and its expected row count where the recipe gave one."
    - "THE SYSTEM SHALL show each recipe-derived check beside the declaration it came from, labelled 'Recipe check' (REQ-DASH-444 criterion 10)."
    - "THE SYSTEM SHALL read all of this from the extraction's committed folder (REQ-PIPE-440 criterion 2), and SHALL NOT read the recipe file at build time."
  non_functional_requirements:
    - "PERFORMANCE: tens of tables; progressive disclosure keeps the home view short whatever the column count."
  dependencies:
    - REQ-DASH-444
    - REQ-PIPE-440
  decisions:
    - "LOAD-BEARING, NOT A NICETY (sprint 29, 2026-09-27): the recipe never enters a database and the working data is removed, so leave the declaration off the page and it is gone the moment the work ends."
    - "PROGRESSIVE DISCLOSURE (delivery-dashboard-ux, finding 12): the summary on the home view, each table's detail on its own view, so the home view stays the release decision and the result."
    - "v6, THE DIGEST IN, THE REPEATS OUT (delivery-dashboard-ux post-sign-off, 447 c1): the recipe digest is what ties a found page to one package; the id and project are already in the masthead on every view."
    - "v6, ONE SET OF WORDS (delivery-dashboard-ux smaller points, 447 c2 and c3): 'derived product' in 438's words and 'Recipe check' as 444 names the layer, so the same thing never reads two ways."
    - "v6, THE FOLDER NOW CARRIES WHAT THIS READS (delivery-architect M): v5's criterion 4 read column types, identifier marks, cohort bounds and expected rows from a folder that did not declare them; REQ-PIPE-440 criterion 2 now generates them."

- id: REQ-PIPE-439
  title: "An extraction arrives as a package - CSV files plus a recipe JSON whose format we define, with optional expected row counts - and a package with no valid recipe is refused"
  date_written: "2026-11-21"
  story: "As whoever QAs a project extraction, I want the extraction to declare itself in a recipe beside its files, so that what it claims to contain is stated before anything checks it."
  moscow: must
  status: not_started
  source: "plans/supply-model.md sprint 29 points 1-3 (Keith, 2026-09-27); Keith 2026-11-21 Q4.4 (b) and round 2 Q6 (b); delivery-architect v4 finding 4. Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; unchanged in v6. The extraction kind's own. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL read an extraction as a package - a directory on local disk or an S3 prefix - holding one recipe file and the data files it names."
    - "THE SYSTEM SHALL read the recipe as JSON against a schema committed in this repository, carrying a recipe format version."
    - "THE SYSTEM SHALL require the recipe to declare an extraction id, the project it is for, each table with its file and that file's format, its columns (name, type and whether it is a primary identifier) and whether it is a derived product, the cohort bounds as structured values (column, lower and upper bound) per table, the filter as descriptive text, and each table's agency, collection and dataset placement."
    - "THE SYSTEM SHALL accept, for each table, an optional expected row count."
    - "THE SYSTEM SHALL accept CSV as the only file format in recipe format version 1, and IF a recipe names any other format, THEN THE SYSTEM SHALL refuse it, naming the table."
    - "IF the recipe is missing, does not parse, or fails the schema, THEN THE SYSTEM SHALL refuse the package before anything is generated or loaded, naming each problem."
    - "IF the extraction id is not lowercase letters, digits and single hyphens, or is already a folder under assets/ or any one-off kind, THEN THE SYSTEM SHALL refuse the package, naming the id and any folder it clashes with."
    - "THE SYSTEM SHALL NOT write the recipe into any database."
  non_functional_requirements:
    - "MAINTAINABILITY: the recipe schema is versioned and each file names its format, so a later version adds formats without guessing."
    - "PORTABILITY: S3 is read with the environment's own credentials; no new third-party domain beyond AWS's."
    - "SECURITY: the recipe is untrusted input; it is parsed as data, its filter text is never executed, and a file name in it is refused if it escapes the package directory."
  dependencies:
    - REQ-PIPE-446
  decisions:
    - "SETTLED by Keith 2026-09-27 (sprint 29 point 1): a package of files, local or S3; format may change, so nothing ASSUMES CSV - each file states its format."
    - "CSV ONLY IN VERSION 1 (delivery-architect, v4 finding 4): staging is CSV-only (qa_tools/tools/stage.py, read_csv_explicit_nulls into a staging CSV), so another format is new work. Version 1 says so and refuses the rest rather than half-supporting them."
    - "SETTLED by Keith 2026-09-27 (point 2): the recipe is OURS to define - tables, columns, filter/cohort/date range, placement."
    - "SETTLED by Keith 2026-09-27 (point 3): the recipe lives beside the package and never enters the database. REJECTED, deferred not refused, recording it in the database. What it declares is carried into the committed folder (REQ-PIPE-440), which is configuration in the repository, not the database."
    - "SETTLED by Keith 2026-11-21 (round 2 Q6 (b)): the core fields plus an optional expected row count per table. REJECTED (a) the core fields only, the recommendation."
    - "COHORT BOUNDS ARE STRUCTURED, THE FILTER IS PROSE: only a structured bound can become a check; filter text is shown, never parsed."
    - "v6: no change. The project the recipe already requires is what REQ-PIPE-446 criterion 18 (every kind declares a project) is met from for the extraction kind."

- id: REQ-PIPE-440
  title: "Opening an extraction generates one-offs/extraction/<id>/ from its recipe alone - hierarchy, a minimal calendar.yaml, contracts, recipe checks and wording - copying nothing from the kind's template, which is read live; the folder must be committed and pushed before the package loads"
  date_written: "2026-11-21"
  story: "As whoever QAs a project extraction, I want its configuration generated from its recipe into a committed folder of its own, apart from the enduring assets, so that each extraction's checks and declaration are reviewable configuration and nothing is typed by hand."
  moscow: must
  status: not_started
  source: "plans/supply-model.md sprint 29 points 2, 4 and 5 and the rejected list (Keith, 2026-09-27); Keith 2026-11-21 round 2 Q2 (b), round 3 Q1 (a) and addition, round 4 (one-offs/<kind>/<id>/); delivery-architect v4 findings 1, 3 and 5. Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-architect post-sign-off A2, B, F, H, I and M, delivery-cli-ux C4, and Keith's answers (copy nothing; pushed before load; dbt_utils a local copy; no 259 hold). The extraction kind's own. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "WHEN a person runs `mothman one-off open --kind extraction` on a package, or opens one from the `mothman one-off` TUI, THE SYSTEM SHALL generate one-offs/extraction/<id>/ from its recipe alone, SHALL NOT read any hierarchy or check authored by hand for that extraction, and SHALL NOT copy any file from the kind's template (one-offs/extraction/_template/) into it."
    - "THE SYSTEM SHALL generate in that folder a data-asset.yaml whose data_asset_id is the id, naming its project, recipe format version and recipe digest, its filter text, and the agency, collection and dataset hierarchy of the recipe's placements, and declaring for each dataset an arrival_pattern matching only its table's declared file name, its columns' types and identifier marks, its cohort bounds and its expected row count where the recipe gives one."
    - "THE SYSTEM SHALL generate in that folder a minimal calendar.yaml declaring every dataset `no_calendar: never`, with `derived: true` beside it on each dataset the recipe marks derived (REQ-PIPE-438 criterion 2), and nothing else."
    - "THE SYSTEM SHALL generate in that folder each dataset's contract and recipe check layer (REQ-QAC-441), a presentation.yaml whose wording is taken from the recipe's own names, and a dbt project whose macro-paths and test-paths reach dbt_shared at the repository root from the project's own depth (four levels up from one-offs/extraction/<id>/dbt/) and whose packages name the deployment's local dbt_utils copy (criterion 12) at the version the enduring assets lock; and SHALL generate no people.yaml, no default check layer, no publishing destination, no synthetic/ folder and no QA adapter module of its own."
    - "THE SYSTEM SHALL record in the folder a digest of every file it generated, for REQ-PIPE-446's digest pass."
    - "IF one-offs/extraction/<id>/, assets/<id>/ or any other kind's <id>/ already exists, THEN THE SYSTEM SHALL refuse the package, naming which, and say a re-send is a new extraction."
    - "IF two tables of one recipe claim the same dataset placement, or an id does not meet the hierarchy's naming rules, THEN THE SYSTEM SHALL refuse the package before generating anything, naming them."
    - "IF the recipe beside the package no longer matches the digest its folder records, THEN THE SYSTEM SHALL refuse to load or check the package, naming both digests."
    - "IF the generated folder, or the kind's template, has uncommitted changes or untracked files (the gitignored dbt artefacts of criterion 11 aside), or the commit holding it is not on the remote branch the working branch tracks, THEN THE SYSTEM SHALL refuse to load the package, giving the git commands that would commit and push it - `git add`, `git commit` and `git push <remote> <branch>`, filled in - and the reason: the published page names the commit it ran from, and only a pushed commit is one anyone else can find. (The template half is PROVISIONAL, question 1 of the v6 changes.)"
    - "THE SYSTEM SHALL NOT add any level above agency, nor any hierarchy or naming scheme of an extraction's own."
    - "THE SYSTEM SHALL gitignore every one-off's dbt target/, logs/ and dbt_packages (one-offs/*/*/dbt/target/ and their siblings) in the same change, so that dbt's own artefacts never read as uncommitted configuration."
    - "THE SYSTEM SHALL install dbt_utils for one-offs once per deployment, by a `mothman` setup command of its own, into a local path the deployment's configuration names; a load SHALL make no network fetch for it, and IF that copy is absent or is not the version the enduring assets lock, THEN THE SYSTEM SHALL refuse the load, naming the setup command."
    - "THE SYSTEM SHALL read the default check layer (REQ-QAC-441 criterion 1), people.yaml (REQ-PIPE-435 criterion 4) and the publishing destination (REQ-PIPE-443 criterion 1) from the kind's template at each step that needs them, and SHALL NOT keep a copy of any of them in the one-off's folder."
  non_functional_requirements:
    - "STATE, THE COST FLAGGED AND ACCEPTED: 30-40 generated folders a year, about 200 after five, each with a dbt project. Configuration in the CLAUDE.md sense - they declare how that extraction is checked - but generated from a supplier's input rather than authored; one-offs/ keeps that distinction visible in the tree."
    - "PRIVACY: a committed folder carries the project name, the cohort and the filter text, readable by everyone with repository access. This PoC's folders are synthetic, so the public repository is accepted (Keith 2026-11-21); a real deployment's one-off folders would need a private repository."
    - "PORTABILITY: each dbt project needs its packages at load; dbt_shared is read in place and dbt_utils from one local copy per deployment, so a load makes no network fetch, which matters on a government network that may not reach the package hub or GitHub."
    - "MAINTAINABILITY: the template is the one place the default checks, people.yaml and the destination are edited, and every one-off of the kind reads it live; the commits the page names (REQ-DASH-444 criterion 8) record which version of it ran."
    - "MAINTAINABILITY: the dbt_utils copy is one more installed thing per deployment, kept at the version the enduring assets lock; its setup command and the version check in criterion 12 are what stop it drifting silently."
    - "OBSERVABILITY: the commit of criterion 9 is git-identity-authored and pushed, so who generated and committed an extraction's configuration, and when, is in git and on the remote."
  dependencies:
    - REQ-PIPE-439
    - REQ-PIPE-446
    - REQ-PIPE-438
  decisions:
    - "SETTLED by Keith 2026-11-21 (round 2 Q2 (b)): a generated folder committed per extraction. REJECTED (a) one committed template with each extraction's hierarchy built in memory from its recipe - the scoper's recommendation, flagged as keeping 30-40 a year of folders closer to state than configuration out of the repository - and (c) a generated folder beside the package, not committed."
    - "SETTLED by Keith 2026-11-21 (round 3 and round 4): apart from the enduring assets, at one-offs/<kind>/<id>/, the extraction the first kind and each kind's template beside its folders. Replaces v3's assets/<id>/ and v4's extractions/<id>/."
    - "SETTLED by Keith 2026-11-21 (round 3 Q1 (a)): loading is refused until the folder is committed. REJECTED (b) loading at once and committing afterwards."
    - "A MINIMAL calendar.yaml (delivery-architect, v4 finding 3): v4 said 'no calendar.yaml', and agreement.load reads `no_calendar:` from calendar.yaml's datasets, so a missing file raises. One file of declarations, no versions, no dates."
    - "data_asset_id IS THE FOLDER NAME, gated for every folder (REQ-PIPE-446 criterion 5; delivery-architect reuse)."
    - "THE TEMPLATE KEEPS ITS UNDERSCORE, as one-offs/extraction/_template/: the listing already skips '_' names, so no extraction id needs reserving."
    - "THE FOLDER'S LOCATION IS ITS KIND: no `kind:` or `shape:` declaration that could disagree with where the folder is."
    - "ONE SHARED ADAPTER PER KIND, NOT A GENERATED ONE: generating Python per extraction would commit 30-40 code files a year."
    - "THE COMMITTED FOLDER IS THE LASTING DUPLICATE GUARD: a dropped database forgets an id and a page may never have been published, but the folder stays in git."
    - "SETTLED by Keith 2026-09-27 (points 4 and 5): each table its own calendar-less dataset; derived products in development, real verdicts, out of the extraction's rollup."
    - "REJECTED by Keith 2026-09-27: a new concept above agency ('there would be some convenience to have them all in one dashboard, but then we have to add a new concept above agency'); deriving the hierarchy by convention from the package or extraction name; and hand-authoring it per extraction."
    - "SETTLED by Keith 2026-11-21, REVERSING v5 (answering CLI Q4, 'not sure that's the model I want'): COPY NOTHING FROM THE KIND'S TEMPLATE. The folder holds only what is generated from the recipe, under the digest; the default check layer, people.yaml and the destination are read live from _template/ at each step (criterion 13), and the page's commit records which version ran. REJECTED, and removed: v5's copies of people.yaml, presentation.yaml, the default check layer and the destination, its 'DEFAULTS ARE COPIED, NOT READ AT RUN TIME' decision ('the committed folder is then the whole account of what that extraction ran') and its MAINTAINABILITY NFR ('a folder keeps the copy it was generated with'). Also REJECTED the reviewer's recommendation (a), keeping a copied people.yaml outside the digest."
    - "v6, presentation.yaml IS GENERATED, NOT COPIED (Keith, the same answer): its wording comes from the recipe's own names, so it belongs with the generated files under the digest."
    - "SETTLED by Keith 2026-11-21 (CLI Q3): THE FOLDER'S COMMIT MUST BE PUSHED to the remote branch before load, and the refusal gives the push command. REJECTED a local commit being enough: the page names a commit, and a commit only on one person's machine cannot be looked up by anyone reading the page. The refusal's git commands and reason are delivery-cli-ux C4's. A git push is not a GitHub API call, so REQ-PIPE-446 criterion 19 allows it (Keith, the same day)."
    - "SETTLED by Keith 2026-11-21 (architect Q-A3 (b)): dbt_utils FROM A SEPARATE LOCAL COPY, one shared copy configured per deployment and installed by its own setup step; a load makes no network fetch. REJECTED (a) a git fetch per one-off. The setup command's name is left to the build; it is a `mothman` command because every entry point is (CLAUDE.md)."
    - "v6, dbt_shared BY RELATIVE PATH FROM THE RIGHT DEPTH (delivery-architect I): the enduring assets' projects reach it three levels up; a one-off's project is one level deeper, so four. Its packages and lock match the assets' version, which the dbt packages gate checks."
    - "v6, AN ARRIVAL PATTERN PER DATASET (delivery-architect A2): hand_filing refuses a file that matches no arrival pattern, and REQ-PIPE-442 files each collection's declared tables and records an undeclared file as failing rather than filing it."
    - "v6, `derived:` MOVED TO calendar.yaml (delivery-architect B): v5 put it in data-asset.yaml, while REQ-PIPE-438 read it from 'its configuration'; one home now, beside `no_calendar`."
    - "v6, THE FOLDER DECLARES WHAT THE PAGE SHOWS (delivery-architect M): column types, identifier marks, cohort bounds and expected rows are generated into data-asset.yaml so REQ-DASH-447 reads them from the folder rather than the recipe."
    - "v6, dbt ARTEFACTS GITIGNORED (delivery-architect F): without it, dbt's target/, logs/ and dbt_packages make every resumed load fail criterion 9 as uncommitted changes."
    - "v6, UNTRACKED FILES COUNT (delivery-architect H): a file added by hand to a generated folder and never committed is refused at load, as an edited one is."
    - "v6, NO 259 HOLD (Keith 2026-11-21, architect Q-A2: 'Happy for it to go while the repo is public, this is a poc with fake data.'): REVERSES round 5's 'blocked on going private'. REQ-DOCS-259 leaves the dependencies; the PRIVACY NFR says a real deployment's folders would need a private repository. REJECTED the architect's (a) a guard criterion on `one-off open` into the repository's own root."

- id: REQ-QAC-441
  title: "An extraction is checked in two layers - a default set every extraction gets, read live from the kind's template, and a set derived from its recipe - separate from the recurring datasets' checks, plus the shared file checks, and stated as assertions, not tools"
  date_written: "2026-11-21"
  story: "As whoever QAs a project extraction, I want a standard floor of checks on every extraction plus checks derived from what its recipe declares, so that every extract is held to the same baseline and to its own promises."
  moscow: must
  status: not_started
  source: "plans/supply-model.md sprint 29 point 6 and its tool-agnostic note (Keith, 2026-09-27); Keith 2026-11-21 Q4.5 (b), round 2 Q6 (b), Q7 (a), Q8 (a). Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in Keith's 'copy nothing' and delivery-architect A2. The extraction kind's own. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL apply a default check layer to every extraction, defined once in the kind's template (one-offs/extraction/_template/) and read from it at each load (REQ-PIPE-440 criterion 13), and SHALL NOT copy it into any extraction's folder."
    - "THE SYSTEM SHALL assert, in that default layer, at least that every table the recipe declares arrived, every declared column arrived in each, and no primary identifier the recipe declares is null."
    - "WHERE a declared table did not arrive, or a file arrived that the recipe does not declare, THE SYSTEM SHALL record it as a failing default-layer result, and SHALL go on checking everything else; an undeclared file is recorded without being filed (REQ-PIPE-442 criterion 4)."
    - "THE SYSTEM SHALL derive a recipe layer from each recipe, asserting at least that each declared column has its declared type and each table's structured cohort bounds hold."
    - "WHERE the recipe declares an expected row count for a table, THE SYSTEM SHALL assert that the table arrived with exactly that many rows."
    - "WHERE the recipe declares a cross-table relationship, THE SYSTEM SHALL check it as a cross-table check (REQ-PIPE-106 criterion 13), counted as REQ-PIPE-438 criterion 4 says where a derived table takes part."
    - "THE SYSTEM SHALL keep both layers separate from the recurring datasets' check definitions, and SHALL NOT import or share them."
    - "THE SYSTEM SHALL run the shared file checks (the root file-checks.yaml) over every extraction file, as for any delivery."
    - "THE SYSTEM SHALL record every result with up to the same number of failing-row identifier keys per check as a recurring dataset's (FAILING_SAMPLE_LIMIT), and SHALL NOT record row content."
  non_functional_requirements:
    - "MAINTAINABILITY: each criterion names what is ASSERTED and no tool; which tool evaluates each is a build decision, revisitable once the PoC settles which tools stay."
    - "MAINTAINABILITY: a change to the default layer reaches every extraction loaded after it, because it is read live; which version checked a given extraction is the commit its page names (REQ-DASH-444 criterion 8)."
    - "PRIVACY: failing-row identifier keys are recorded exactly as for recurring datasets, and so reach a page that is never retired (Keith, Q4.5 (b))."
  dependencies:
    - REQ-PIPE-439
    - REQ-PIPE-440
  decisions:
    - "SETTLED by Keith 2026-09-27 (point 6): two layers, a default set (his example: primary identifiers must not be null) and a customised layer from the recipe. REJECTED reusing the recurring datasets' own checks - his word was SEPARATE, similar but not shared."
    - "SETTLED by Keith 2026-09-27: write it tool-agnostically - 'it would depend on which tools we stabilise on after this POC'."
    - "SETTLED by Keith 2026-11-21 (Q4.5 (b)): failing-row identifier keys exactly as recurring datasets carry them. REJECTED counts only, the recommendation."
    - "SETTLED by Keith 2026-11-21 (round 2 Q7 (a)): a missing declared table or an undeclared file is a failing default-layer check, and QA carries on. REJECTED (b) refusing the package before QA."
    - "SETTLED by Keith 2026-11-21 (round 2 Q8 (a)): the root file-checks.yaml applies; 'separate' governs the dataset checks. REJECTED (b) not applying it."
    - "SETTLED by Keith 2026-11-21 (round 2 Q6 (b)): an expected row count is checked when given, as an exact count, because the recipe describes this extract rather than a feed that drifts."
    - "NOT IN SCOPE, by Keith's call 2026-09-27: lineage, and plans/wider.md #9's reconciliation and aggregation checks, which stay parked there."
    - "v6, THE DEFAULT LAYER IS READ LIVE (Keith 2026-11-21, 'copy nothing'): REVERSES v5's criterion 1, 'copied into each generated folder'. REJECTED keeping a copy per folder."
    - "v6, AN UNDECLARED FILE IS NOT FILED (delivery-architect A2): recording it as failing without filing it is what lets QA carry on past it, as round 2 Q7 (a) requires, given that hand_filing refuses a file with no arrival pattern."

- id: REQ-TEST-437
  title: "A real recipe package is run end to end through `mothman one-off` to a published page, and a not-yet-agreed dataset is run beside a calendared one, replacing REQ-PIPE-379 criterion 5"
  date_written: "2026-11-21"
  story: "As whoever maintains the pipeline, I want one test that takes a real recipe package from opening to a published page, so that the one-off shape cannot quietly stop working again."
  moscow: must
  status: not_started
  source: "REQ-PIPE-379 criterion 5 (signed 2026-11-14), deferred by Keith 2026-11-18 to #141; Keith 2026-11-21 Q4.4 (b). Drafted by delivery-scoper 2026-11-21; v5 signed by Keith 2026-11-21; v6 folds in delivery-dashboard-ux post-sign-off A and the v6 changes to REQ-PIPE-440, 442, 443 and 446. v6, PROPOSAL until re-signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL have a test that opens a committed synthetic fixture package - a recipe and at least three CSV files, one a derived product, one table with an expected row count, one table the recipe declares that is absent from the package, one file the recipe does not declare, and a cross-table relationship between the derived table and a counted one - through `mothman one-off --id` steps into a temporary one-offs root, commits and pushes it to a temporary local remote, loads it into a test database, publishes it undecided, records a release decision and publishes it again, to a temporary destination."
    - "THE SYSTEM SHALL have that test assert each table checked and recorded with no slot and no period, the absent declared table shown as Fail and never as No data, the undeclared file recorded failing and not filed, the derived table out of the rollup and labelled a derived product, the cross-table result counted on the counted table only, the row count checked, the first page carrying the undecided line and the second the decision line above the QA result, no vendor/ reference on either page, and no console error."
    - "THE SYSTEM SHALL have that test assert that loading is refused while the folder is uncommitted and while its commit is not pushed, that a load is refused when MOTHMAN_ASSET names something other than the --id, that a load stopped partway is resumed by loading the same package again, that a different package with the same id is refused, that an id already under assets/ is refused, that a drop is refused with no terminal and removes nothing without the typed id, and that a drop with it removes the database, data/<id>/, reports/<id>/, the dbt scratch and the dbt artefacts."
    - "THE SYSTEM SHALL have that test assert that no GitHub API call is made at any step."
    - "THE SYSTEM SHALL have a second test that runs a `no_calendar: not-yet-agreed` dataset beside a calendared one on one recurring asset, and shows the calendared dataset's status and rollup unchanged in the rendered page."
    - "THE SYSTEM SHALL assert, in each test, that the fixture holds at least one calendar-less dataset and at least one recorded result before asserting anything about them."
    - "WHEN this requirement is built, THE SYSTEM SHALL retire REQ-PIPE-379 criterion 5, replaced_by this requirement."
  non_functional_requirements:
    - "COST: the test database, a temporary local git remote and temporary folders, never a bootstrap, never the real one-offs/ tree and never the real remote; not marked critical."
    - "PORTABILITY: no network and no gitignored artefact assumed present - the dbt_utils copy is installed into a temporary path by the setup command (REQ-PIPE-440 criterion 12) or the test is refused with that command named; the fixture is small synthetic test data."
  dependencies:
    - REQ-PIPE-434
    - REQ-PIPE-435
    - REQ-DASH-436
    - REQ-PIPE-438
    - REQ-PIPE-439
    - REQ-PIPE-440
    - REQ-QAC-441
    - REQ-PIPE-442
    - REQ-PIPE-443
    - REQ-DASH-444
    - REQ-DASH-447
    - REQ-PIPE-446
  decisions:
    - "SETTLED by Keith 2026-11-21 (Q4.4 (b)): the end-to-end test runs a real recipe package. REJECTED (a) the lifecycle only, the recommendation."
    - "MOVED OUT OF REQ-PIPE-379: 379 is about one calendar mechanism, which is built; the proof belongs with the requirements that make the shape run."
    - "GENERATES INTO A TEMPORARY ONE-OFFS ROOT, never the real one-offs/, by the rule tests/conftest.py's _no_test_files_a_real_delivery enforces for deliveries."
    - "REUSE (delivery-architect): tests/real_asset.py's fixture-asset machinery."
    - "THE not-yet-agreed CASE IS ADDED because REQ-PIPE-106's decisions record that its criteria 8, 13 and 14 were never exercised on a rendered page."
    - "v6, A DECLARED TABLE ABSENT (delivery-dashboard-ux post-sign-off A): the fixture now carries one, and criterion 2 asserts it reads Fail, never No data."
    - "v6, THE NEW REFUSALS AND THE RESUME ARE TESTED (following REQ-PIPE-440 criterion 9, REQ-PIPE-442 criteria 5 and 7 and REQ-PIPE-446 criterion 3): the push check needs a remote, so the test pushes to a temporary local one and never to the real remote."
    - "v6, NO GITHUB (Keith 2026-11-21: 'One offs should never use GitHub.'): criterion 4 asserts REQ-PIPE-446 criterion 19 on the real path."
    - "v6, NO 259 HOLD (Keith 2026-11-21, architect Q-A2): v5's PORTABILITY NFR said the fixture 'is not held for REQ-DOCS-259'; nothing is held now, so the sentence is gone."
