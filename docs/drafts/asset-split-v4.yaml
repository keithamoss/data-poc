      - "A12 - REQ-PIPE-262 criteria 1, 6 and 12 (serves REQ-PIPE-352). CURRENT 1: 'THE SYSTEM SHALL group a bootstrap's collections into streams derived from configuration alone, two collections falling in one stream whenever any dataset of one resolves (schedule.calendar_for_dataset) to a calendar any dataset of the other resolves to, transitively, and SHALL hold no list of collections or calendars of its own.' PROPOSED 1: 'THE SYSTEM SHALL replay every calendared collection of the selected asset as one stream, and each collection none of whose datasets names a calendar as a stream of its own, and SHALL hold no list of collections of its own.' CURRENT 6: 'WHEN a bootstrap of every collection runs without --sequential, THE SYSTEM SHALL run its streams side by side, each in a process of its own, so that a collection on a calendar no other collection uses (Birth Registrations, daily) still runs beside the quarterly stream.' PROPOSED 6: 'WHEN a bootstrap of every collection of the asset runs without --sequential, THE SYSTEM SHALL run its streams side by side, each in a process of its own, so that a no-calendar collection's stream runs beside the asset's calendared stream; the daily and quarterly assets are bootstrapped separately (REQ-PIPE-352).' Criterion 12's 'with all three collections' becomes 'the quarterly asset bootstrapped from empty'."
