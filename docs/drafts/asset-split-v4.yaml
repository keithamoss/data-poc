  - id: REQ-PIPE-352
    title: "Each asset is bootstrapped into its own database from its own configuration, within 12 minutes each, and the two bootstraps' cost is measured against today's single one"
    date_written: "2026-10-31"
    story: "As whoever runs the pipeline, I want each asset bootstrapped into its own database, separately, so that each holds only its own asset's history and a change to one asset never costs a rebuild of the other."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: two dashboards, each built only from its own asset's database); Keith's answer to draft Q5 (a), 2026-10-31. Drafted by delivery-scoper 2026-10-31, v2 the same day. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN `mothman pipeline bootstrap` runs, THE SYSTEM SHALL generate, stage, check and promote only the selected asset's collections, into the selected asset's database, and SHALL refuse where the database's identity is another asset's (REQ-PIPE-343)."
      - "THE SYSTEM SHALL replay every calendared collection of an asset as one receipt-ordered stream, since one baseline puts them all on one calendar (REQ-PIPE-262 criterion 1 as amended by A12), and each no-calendar collection as a stream of its own."
      - "THE SYSTEM SHALL generate each asset's scenario map from that asset's own history, at SCENARIOS-<asset>.md in the repository root where SCENARIOS.md is today (PROPOSED), the test scenario register in plans/supply-model.md staying one register; and IF a registered scenario names both a dataset the asset being checked holds and one it does not, THEN `mothman check` SHALL fail, naming the scenario and the asset - each asset's pass reading only its own hierarchy."
      - "THE SYSTEM SHALL have the session-start hook start one database per asset, mark each (REQ-PIPE-343), install each asset's dbt packages (REQ-QAC-368 criterion 4) and report each one's staged-table count, naming the asset."
      - "WHEN each asset's bootstrap runs from empty on this sandbox, THE SYSTEM SHALL finish within 12 minutes of wall clock (REQ-PIPE-250 criterion 2 as amended by A22)."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence, from empty on this sandbox, each asset's bootstrap wall clock alone and both run side by side, beside today's single bootstrap and its per-stream figures on the same commit (REQ-PIPE-336 evidence: Birth Registrations 814s, the quarterly stream 2507s, 3509s in all), with and without the two test collections."
    non_functional_requirements:
      - "PERFORMANCE: the split adds no work - today's bootstrap already runs Birth Registrations and the quarterly stream as separate processes (REQ-PIPE-262 criterion 6) - so side by side it should cost about what today's does, plus the two test collections. Today's 3509s exceeds the larger stream's 2507s by about Birth Registrations' 814s, which suggests the streams are not fully overlapping now; criterion 6's figures will say."
      - "PERFORMANCE, RISK: the quarterly stream alone took 2507s (about 42 minutes) on REQ-PIPE-336's commit, so criterion 5's 12 minutes rests on REQ-PIPE-250's speed-up work landing; the split does not make it faster."
      - "RELIABILITY: one asset's bootstrap failing leaves the other's database untouched, since no process holds both (REQ-PIPE-343 criterion 5)."
      - "PRIVACY: each database holds one asset's supply rows only."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-343
      - REQ-PIPE-345
      - REQ-PIPE-365
      - REQ-PIPE-262
      - REQ-PIPE-250
      - REQ-GEN-045
    decisions:
      - "TWO DATABASES, TWO BOOTSTRAPS (Keith, 2026-10-31, implied by 'each built only from its own asset's database')."
      - "ONE STREAM PER ASSET (delivery-scoper): REQ-PIPE-262 grouped collections by shared calendar; under one baseline that grouping is every calendared collection of the asset. plans/running-thoughts.md #111 is unchanged by this."
      - "A SCENARIO MAP PER ASSET, ONE REGISTER (delivery-scoper, PROPOSED): SCENARIOS.md is generated with the history (REQ-GEN-045 criterion 3), and each asset has its own history."
      - "THE 12-MINUTE TARGET APPLIES TO EACH ASSET ON ITS OWN (Keith, 2026-10-31, draft Q5 (a)): criterion 5. REJECTED (b), measure and report only, and (c), a ceiling on each bootstrap beyond REQ-PIPE-250's."
      - "THE SCENARIO-REGISTER CHECK IS PER ASSET (delivery-scoper, v4): v2's 'a scenario naming datasets of two assets' needed a gate that knew both hierarchies, which Q4's closure rules out; criterion 3 asks each asset's pass whether a scenario names one of its datasets and one it does not hold."
    open_questions: []

  - id: REQ-TEST-353
    title: "CI checks both assets on every push within 10 percent of today's billed minutes on a cache hit, each asset's bootstrapped database cached on its own key, and records the cache-miss cost"
    date_written: "2026-10-31"
    story: "As Keith paying for CI from a 2,000-minute monthly allowance, I want both assets checked on every push at about the cost of checking today's one combined asset, so that the split does not cut how often finished work can be pushed."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131; CLAUDE.md's CI minutes budget (REQ-TEST-260); Keith's answers to draft Q5 (a) and architect Q2 (a), 2026-10-31. Drafted by delivery-scoper 2026-10-31, v2 the same day. Architect v3 SHOULD 4 and 6. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL key each asset's cached bootstrap with REQ-PIPE-365 criterion 3's cache key, and SHALL cache that asset's data/<asset>/ paths beside its dump, so that a change to one asset's configuration restores the other asset's cache."
      - "THE SYSTEM SHALL bootstrap or restore both assets' databases in the one test-deployment job, side by side, each as its own process with its own MOTHMAN_ASSET and DSN, and SHALL NOT add a second deployment job."
      - "THE SYSTEM SHALL run `mothman dashboard rebuild-results` and `mothman dashboard build-data` once per asset in that job (test.yml lines 508-511 today), each with its own MOTHMAN_ASSET."
      - "THE SYSTEM SHALL run the deployment half's tests in one pytest session against both assets' databases, each test opening only its own asset's (REQ-PIPE-343 criterion 6), and the fast half's configuration tests against every asset folder."
      - "THE SYSTEM SHALL say in the job log, per asset, whether its database was restored or rebuilt and from which key (REQ-TEST-117 criterion 4)."
      - "THE SYSTEM SHALL keep the fast half's skip count at zero with both assets present."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence, from `mothman github ci-usage`, the billable minutes of a cache-hit run and of a cache-miss run before and after the split, and SHALL record the requirement as not met where the cache-hit run after bills more than 10 percent above the cache-hit run before (about 39 minutes today)."
      - "THE SYSTEM SHALL install each asset's dbt packages once per asset, through `mothman env dbt-deps` (REQ-QAC-368 criterion 5), in every job that runs dbt - three in test.yml today, at lines 234, 345 and 449 - in place of the bare `dbt deps` each runs now."
      - "THE SYSTEM SHALL measure the adapters and providers loaded by path in every job that records coverage, adding assets to coverage's source and --cov=assets to test.yml (REQ-PIPE-369 criterion 6), so that the combined figure fail_under is held against still includes them."
    non_functional_requirements:
      - "COST: one runner, two databases, both bootstraps in parallel - billed about as today's single job, which already runs both streams. A second job would bill a second runner's setup and every install step again on every push."
      - "COST: per-asset cache keys mean a daily-only edit rebuilds only the daily bootstrap (814s on this sandbox) rather than the quarterly one. A shared-code edit misses both caches, which is why the cache-miss figure is recorded, without a ceiling of its own."
      - "RELIABILITY: a cache restore of one asset never restores into the other's database; each dump is named for its asset and checked by the guard after restore."
      - "NO LIVE DATA IN CI: both databases hold synthetic data generated on the runner (REQ-TEST-117 criterion 5)."
    dependencies:
      - REQ-PIPE-352
      - REQ-PIPE-365
      - REQ-TEST-117
      - REQ-TEST-260
      - REQ-QAC-368
      - REQ-PIPE-369
    decisions:
      - "A CEILING ON CACHE-HIT CI MINUTES, AND THE CACHE-MISS FIGURE RECORDED (Keith, 2026-10-31, draft Q5 (a), with the architect's addition). REJECTED (b), measure and report only, and (c), a ceiling on both CI and each bootstrap."
      - "ONE DEPLOYMENT JOB, NOT TWO (Keith, 2026-10-31, architect Q2 (a)): criterion 2. REJECTED a job per asset, which would report a daily failure sooner but bill a second runner on every push."
      - "dbt deps RUNS IN THREE JOBS, NOT ONE (architect v3 SHOULD 6): criterion 8 names every job that runs dbt, once per asset."
    open_questions: []

  - id: REQ-PIPE-372
    title: "Until REQ-PIPE-255 gives an asset its own hosting, a publish is refused for any asset whose data-asset.yaml does not hold today's publish setting - only the quarterly asset holds it - exiting non-zero and pointing to `mothman dashboard rebuild`"
    date_written: "2026-10-31"
    story: "As whoever publishes the dashboards between the move and the new hosting, I want the daily asset's publish refused plainly, so that it can never overwrite the quarterly asset's dashboard on the one gh-pages branch, and a script can never mistake a refusal for a publish."
    moscow: must
    status: not_started
    source: "Keith's sign-off answer Q2 (b), 2026-10-31 (the split first, the daily publish refused in between); Keith, 2026-10-31 (v3 item 2, a setting, not code); Keith, 2026-11-01 (refusal exits non-zero); CLI/TUI UX review of v3 SHOULD 5; architect v3 NIT (prepare_deploy_site). Drafted by delivery-scoper 2026-10-31 (v3); v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL let each asset's data-asset.yaml hold a setting allowing it to publish through today's one publish path, `mothman dashboard publish` to the gh-pages branch (PROPOSED key: publish_to_gh_pages: true), and SHALL set it in the quarterly asset's file only."
      - "IF `mothman dashboard publish` runs for an asset whose data-asset.yaml does not hold the setting, THEN THE SYSTEM SHALL refuse before building, writing or pushing anything, exit non-zero, and say without blame that this asset's dashboard is not published until its own hosting is built (REQ-PIPE-255), and that `mothman dashboard rebuild` builds it for viewing locally."
      - "THE SYSTEM SHALL run any automated publish - a workflow step or a scheduled job - only for an asset whose configuration holds the setting, selected by reading that setting and never by an asset's name; no workflow publishes today."
      - "WHEN a publish runs from the push that carries the move onward, THE SYSTEM SHALL have prepare_deploy_site copy only the selected asset's snapshot folder, dashboard/snapshots/<asset>/, so that a local daily snapshot cannot reach the quarterly publish."
      - "WHEN REQ-PIPE-255 is built, THE SYSTEM SHALL replace the setting by each asset's own Pages project keys (REQ-PIPE-255 criterion 8 as amended by A24) and remove it, in that change."
      - "THE SYSTEM SHALL have tests, seen failing first, that a publish for an asset without the setting exits non-zero with the message of criterion 2 and pushes nothing (against a stub git remote), that a publish for an asset with it proceeds, and that prepare_deploy_site copies only the selected asset's snapshot folder."
    non_functional_requirements:
      - "NOTHING CODED FOR ONE ASSET: the hold is configuration; no code names 'daily'."
      - "RELIABILITY: a refusal is non-zero, so a script or a loop over assets cannot read it as a publish (Keith, 2026-11-01)."
      - "USABILITY, ERROR STATES: the refusal is expected, not a fault, and says so, with the next step (CLI UX v3 SHOULD 5)."
      - "COST: no CI minutes - publishing runs where the database is (REQ-PIPE-092)."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-363
      - REQ-PIPE-092
      - REQ-PIPE-255
    decisions:
      - "THE SPLIT FIRST, THE DAILY PUBLISH REFUSED IN BETWEEN (Keith, 2026-10-31, sign-off Q2 (b)): both assets would otherwise push to the one gh-pages branch and one would overwrite the other. REJECTED (a), building the hosting first for today's one asset."
      - "A SETTING IN EACH ASSET'S data-asset.yaml, NOT CODE (Keith, 2026-10-31, v3 item 2 (a)): only the quarterly asset holds it until REQ-PIPE-255 gives the daily asset its own project. REJECTED a check of the asset's name in the publish command."
      - "NON-ZERO, POINTING TO `mothman dashboard rebuild` (Keith, 2026-11-01): a script cannot mistake a refusal for a publish. REJECTED exiting zero with a notice, which never turns a loop red but cannot tell 'published' from 'refused'."
      - "AUTOMATED PUBLISHES GATED BY CONFIG (delivery-scoper's reading of 'CI's publish step limited to quarterly by config', signed with v4): criterion 3. Nothing publishes automatically today, so it binds the future."
      - "ONLY THE SELECTED ASSET'S SNAPSHOTS ARE DEPLOYED (architect v3 NIT): prepare_deploy_site copies all of dashboard/snapshots/ today."
    open_questions: []

  - id: REQ-DASH-373
    title: "The snapshot archive taken before the split is deleted from the tree, not rewritten out of git history; each asset's archive starts at its first publish after the split and says so when empty"
    date_written: "2026-10-31"
    story: "As someone given access to one team's register, I want that asset's snapshot archive to hold only pages built from its own asset, so that no archived page shows me the other team's results, and an empty archive tells me when it will start."
    moscow: must
    status: not_started
    source: "Keith's sign-off answer Q3, 2026-10-31 (delete the pre-split archive, his own answer beyond the options); v3 Q7 (a), 2026-10-31 (git history not rewritten); C1 signed as drafted, 2026-10-31; dashboard UX review of v3 SHOULD (the empty state); architect v3 NIT. Drafted by delivery-scoper 2026-10-31 (v3); v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL delete from the tree, in the split's change, every snapshot archived before the split - the eight dashboard/snapshots/*.html.gz files, 2026-09-16 to 2026-10-22, and dashboard/snapshots/manifest.json's entries for them - because each of those pages shows both assets' results together."
      - "THE SYSTEM SHALL NOT rewrite git history to remove them: the main branch's history keeps them, and nothing force-pushes."
      - "THE SYSTEM SHALL archive each asset's snapshots, from its first publish after the split, under dashboard/snapshots/<asset>/ with a manifest of its own, and every reader of the archive - the snapshots panel, sync_local_snapshots(), REQ-PIPE-255's unchanged-site check and prepare_deploy_site - SHALL read the selected asset's folder only."
      - "THE SYSTEM SHALL declare in each asset's data-asset.yaml the date its archive starts from (PROPOSED key: snapshots_from), the date of the split's change."
      - "WHILE an asset's archive holds no snapshot, THE SYSTEM SHALL show in the snapshots panel 'Snapshots start from this asset's first publish after the split, <snapshots_from>' (PROPOSED wording) in place of today's 'No snapshots yet — run mothman pipeline run --snapshot', and SHALL have a real-browser test asserting that text, not only zero console errors."
      - "THE SYSTEM SHALL amend, in the deletion's change, CLAUDE.md's three statements that the archive accumulates and is never deleted, with the wording Keith signed (REQ-DOCS-358 C1), and REQ-PIPE-089 criterion 10, REQ-PIPE-081 criterion 21 and REQ-DOCS-259 criterion 6 (A40, A42, A41)."
      - "THE SYSTEM SHALL record REQ-DASH-013's decision that snapshots 'are committed and accumulate' as superseded for the pre-split archive only, in REQ-DASH-013's decisions, without editing the decision itself."
    non_functional_requirements:
      - "PRIVACY AT REAL SCALE: an archived page for one team holds no other team's results; the deletion is about which assets' results one page may hold, not tidiness."
      - "AUDITABILITY: git history still holds every deleted snapshot, so the deletion loses nothing that cannot be recovered by someone with repository access."
      - "COMPATIBILITY: every new snapshot stays a self-contained file openable from file:// (REQ-DASH-292)."
    dependencies:
      - REQ-PIPE-342
      - REQ-DASH-013
      - REQ-DASH-292
    decisions:
      - "DELETED, NOT SERVED (Keith, 2026-10-31, sign-off Q3, his own answer beyond the options offered): overrides CLAUDE.md's 'snapshots accumulate and are never deleted' for that archive only. REJECTED (a) serving it with the quarterly site only, (b) with both sites, and (c) keeping it in the repository unserved."
      - "GIT HISTORY NOT REWRITTEN - Q7 CLOSED (Keith, 2026-10-31, v3 Q7 (a)): deleted from the tree only. REJECTED purging history with a force-push."
      - "ONE DELIBERATE DELETION, NOT A PRECEDENT (C1, signed as drafted, 2026-10-31): the signed CLAUDE.md wording says the deletion licenses no other deletion."
      - "THE EMPTY STATE SAYS WHEN THE ARCHIVE STARTS (dashboard UX v3 SHOULD): today's wording is developer instructions; the date comes from the snapshots_from key (delivery-scoper's choice, signed with v4; the scoper's reason: a shallow CI clone has no git log to derive it from)."
    open_questions: []

  - id: REQ-PIPE-354
