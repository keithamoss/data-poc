# DRAFT v4 - the asset split, one baseline calendar per asset, the global
# period control and two test datasets (plans/running-thoughts.md #131, #55,
# #109, #134's configuration half). delivery-scoper. A PROPOSAL for sign-off,
# not a settled requirement. Nothing here is built until Keith has signed it.
#
# REGENERATED 2026-11-01 (Perth). The original v3 and v4 were lost with a
# replaced container (plans/running-thoughts.md #135). This file is rebuilt
# from docs/drafts/asset-split-v2.yaml, docs/drafts/asset-split-answers.md,
# the v1 reviews, docs/drafts/decisions-2026-11-01.md (section 'Asset split',
# the authority for every later decision) and the three v3 reviews as they
# survive in the main session's transcript. Its words are a reconstruction:
# every DECISION is Keith's as recorded, but wording marked PROPOSED was
# written again and may differ from the lost text.
#
# WHAT v4 IS: v2 plus
#  - v3: Keith's sign-off answers Q1-Q4c of 2026-10-31 - the assets/<asset>/
#    layout (contract/ RENAMED assets/; each asset folder holds its checks, a
#    dbt project of its own under dbt/, its QA adapters under collections/ and
#    its synthetic-only configuration and providers under synthetic/); one
#    shared local dbt package, dbt_shared/; no per-collection file in the
#    shared code tree; Q4 (cross-asset ids) closed; the split before the
#    hosting; the pre-split snapshot archive deleted; adapters and providers
#    LOADED BY PATH, never a package; and six new requirements, REQ-QAC-368
#    (dbt per asset), REQ-PIPE-369 (adapters by path), REQ-GEN-370 (the
#    synthetic/ folder and providers), REQ-GEN-371 (synthetic eras),
#    REQ-PIPE-372 (daily publish refused until hosting) and REQ-DASH-373 (the
#    pre-split archive deleted);
#  - v4: the architect, CLI/TUI UX and dashboard UX reviews of v3, every
#    BLOCKING/MUST, SHOULD and NIT, with Keith's answers of 2026-11-01; Q5, Q6
#    and Q7 closed as decisions. The move map AND REQ-QAC-344's id transform
#    fire only for the push carrying the move and are deleted in the next
#    push, confirmed by a one-off check, not a kept absence test; a branch cut
#    before the move must be rebased before it is pushed (accepted risk).
#  - the post-sign-off amendment of REQ-PIPE-369 criterion 6 (Keith,
#    2026-11-01): coverage source plus include_namespace_packages.
#
# THERE ARE NO OPEN QUESTIONS. Q1-Q7 are all closed, each recorded as a
# decision on the requirement it settled.
#
# SEQUENCING (Keith, 2026-10-31 and 2026-11-01): Pass / Warn / Fail first,
# then geocoding (its contract changes land before the move), then this split.
# BUILD PLAN (Keith, 2026-11-01): GROUNDWORK first, in parallel with geocoding
# - an asset resolver that maps today's contract/ as one asset, MOTHMAN_ASSET
# and the CLI around it, one asset per process, loading by path, the
# per-asset dbt mechanics, and the ~200 hard-coded data/ and report paths
# made per-asset call-time lookups - all passing on today's layout; then ONE
# move commit proven by REQ-TEST-239 (REQ-TEST-357); then four post-move
# streams: the dashboard; the Cancer and Mental Health collections; CI and
# publishing; docs and the amendments. Between the move and REQ-PIPE-255 the
# daily asset's publish is refused (REQ-PIPE-372).
#
# IDS: REQ-*-342 to REQ-*-358 and 363 to 367 as in v2, plus 368 to 373.
# 359-362 are Pass / Warn / Fail's; 374 is the provisional-choice gate's.
#
# STATUS WORDS: every new displayed status word is in Pass / Warn / Fail's
# vocabulary (REQ-DASH-359 criterion 3); stored values are unchanged.
#
# CHANGES TO SIGNED TEXT are listed in full, CURRENT and PROPOSED, on
# REQ-DOCS-358's decisions (A1 to A43, and C1 for CLAUDE.md), each signed on
# its own (Keith Q4 (a)). Path-only edits go under one blanket rule signed
# once, applied by one sweep.

requirements:
  - id: REQ-PIPE-342
    title: "One repository holds one folder per data asset under assets/, holding everything for that asset, and one call-time resolver is the only way any reader finds an asset's configuration or its state paths"
    date_written: "2026-10-31"
    story: "As whoever maintains the pipeline, I want everything for each data asset - its configuration, checks, dbt project, QA adapters and synthetic-only configuration - in one folder of its own inside this one repository, found by one resolver every reader goes through, so that the quarterly and daily assets can be configured separately - as two teams in two environments will - without a second copy of the code."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: the split, repository shape (a)) and #55. Drafted by delivery-scoper 2026-10-31; v2 the same day, split after the architect review (with REQ-PIPE-363, REQ-PIPE-364, REQ-PIPE-365). Keith's sign-off answers Q4, Q4b and Q4c, 2026-10-31 (the layout); the build plan, 2026-11-01. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold everything for each data asset in one folder named for its data_asset_id - assets/quarterly/ and assets/daily/ - holding that asset's data-asset.yaml, calendar.yaml, presentation.yaml, people.yaml and file-checks.yaml at its top, its agencies' folders below it as REQ-QAC-241 lays them out today, its dbt project under dbt/ (REQ-QAC-368), its QA adapters under collections/ (REQ-PIPE-369) and its synthetic-only configuration and generator providers under synthetic/ (REQ-GEN-370)."
      - "THE SYSTEM SHALL rename the top-level folder contract/ to assets/, and SHALL keep at the top of assets/ only environments.yaml, the one configuration file the same for every asset - and, in the push that carries the move alone, REQ-TEST-366's move map, which the next push deletes."
      - "THE SYSTEM SHALL place Child Protection and Family Support's Child Protection collection and Department of Health's Emergency Department and Linkage Products collections (geocoding's datasets included) in the quarterly asset, and Registry Services' Civil Registration collection in the daily asset, moving each collection's check files, dbt models, tests and retired files, adapter and provider with it, and changing no file's content except where another criterion of this batch says so."
      - "THE SYSTEM SHALL let one agency appear in both assets, each asset holding its own folder for it - as Department of Health will once REQ-QAC-350 adds Mental Health to the daily asset - and SHALL compare nothing between the two folders."
      - "THE SYSTEM SHALL discover the asset folders from assets/ itself, and SHALL NOT hold a list of assets, or name an asset, anywhere in code."
      - "THE SYSTEM SHALL find every asset-wide file, and every path under data/ and reports/ that a reader uses today (about 200 references, about 50 in product code and 150 in tests, DELIVERIES_DIR and PLACEMENTS_PATH among them), through one resolver grown from qa_tools/common/hierarchy.py's DATA_ASSET_YAML and validate_schedule.Source, which SHALL resolve the selected asset's folder and state paths at CALL TIME, replacing every module-level path constant that names an asset-wide file or a per-asset state path today (among them hierarchy.DATA_ASSET_YAML, validate_schedule.DATA_ASSET_YAML and asset_time.DATA_ASSET_YAML)."
      - "THE SYSTEM SHALL let a test point the resolver at an asset folder through one fixture, and SHALL remove the monkeypatching of the retired path constants (about 27 test files today) in the same change."
      - "THE SYSTEM SHALL NOT let any reader that runs for a selected asset open another asset's folder."
      - "WHEN the move is made, THE SYSTEM SHALL update .github/CODEOWNERS's paths (lines 12-14 today) in the same commit."
      - "THE SYSTEM SHALL keep no per-collection file in the shared code tree - qa_tools/collections/ and generator/collections/ holding only their shared base modules, and dbt_shared/ only the shared macros and generic tests - and WHEN `mothman check` runs, IF a module or dbt file belonging to one collection sits in the shared tree, THEN THE SYSTEM SHALL fail naming it."
    non_functional_requirements:
      - "CONFIGURATION, NOT STATE: an asset folder holds only authored configuration and the small modules that describe its collections; everything generated stays under data/<asset>/ and reports/<asset>/ (REQ-PIPE-365)."
      - "NOTHING CODED FOR ONE ASSET: as nothing is coded for one collection (CLAUDE.md), no code names 'quarterly' or 'daily'; a third asset folder - project extractions, later - is picked up by discovery or refused by a gate, never silently ignored."
      - "MAINTAINABILITY: about 137 Python files (tests included) name an asset-wide file today and about 200 references name a data/ or reports/ path; one call-time resolver means the next change of layout - #55's (b) or (c) - is one function rather than another sweep, and no import-time default can capture the wrong asset before a test selects one."
      - "PORTABILITY, #55: an asset folder is found by path and is not a Python package (REQ-PIPE-369), so a later deployment can inject an asset folder from outside this repository without renaming any import."
      - "SCALE: nothing assumes two assets or a fixed number of collections in either."
    dependencies:
      - REQ-PIPE-240
      - REQ-QAC-241
      - REQ-QAC-294
      - REQ-QAC-368
      - REQ-PIPE-369
      - REQ-GEN-370
    decisions:
      - "ONE REPOSITORY, A CONFIGURATION FOLDER PER ASSET, FOR THE PoC (Keith, 2026-10-31, #55 option (a)). FLAGGED AS A FUTURE DECISION POINT, in his words 'once this needs to migrate out of PoC stage': (b) a repository per asset, or (c) shared code and checks with each asset's configuration injected at deploy time. Sample datasets, project extractions and ad hoc QA are not part of this decision."
      - "EVERYTHING FOR AN ASSET IN ONE FOLDER, assets/<asset>/ (Keith, 2026-10-31, sign-off Q4c, 'Yep'): data-asset.yaml, the agency folders, dbt/, collections/ and synthetic/, removable as one folder. contract/ is RENAMED assets/ because it now holds dbt and code too. SUPERSEDES the shape confirmed earlier the same day, contract/<asset>/ beside synthetic/<asset>/, and the question of where providers sit. REJECTED a separate synthetic/<asset>/ tree. Diagram: docs/drafts/repo-layout-after-split.svg, both assets naming a Cloudflare project."
      - "dbt GOES UNDER EACH ASSET (Keith, 2026-10-31, sign-off Q4, after asking what the dbt folders hold): the models and tests are per-dataset checks and live with that asset's other checks (REQ-QAC-368). REJECTED one shared dbt_project/ keyed only by collection id with a repository gate refusing a repeated id. SUPERSEDES v2's 'one dbt project, folders by collection'."
      - "PER-COLLECTION PYTHON MOVES INTO THE ASSET FOLDER (Keith, 2026-10-31, sign-off Q4b): the QA adapters and generator providers live beside that asset's checks. REJECTED staying in the code tree with a repository gate, and REJECTED namespacing by asset inside the code tree."
      - "SPLIT THE PoC INTO TWO FAKE ASSETS, quarterly and daily (Keith, 2026-10-31): 'the thing we've been putting off for a while ... splitting this to have two different fake data assets'. It is what CLAUDE.md's scale target already describes - two assets, each with its own team, environment, deployment and dashboard."
      - "THE FOLDER IS NAMED FOR THE data_asset_id (delivery-scoper, following Keith's Q2 (b), meaningful ids): one name per asset, not a folder name and a separate id."
      - "ONE AGENCY MAY BE IN BOTH ASSETS (Keith's Q3 answer puts Mental Health under Department of Health on the daily asset): the first agency spanning two assets, as a real agency supplying both would. Each asset holds its own department-of-health folder, and nothing compares the two (REQ-PIPE-364 decision 1)."
      - "GEOCODING'S CONTRACT CHANGES LAND BEFORE THE MOVE (Keith, 2026-10-31, architect Q4 (a)): the move commit carries them with everything else. REJECTED holding contract/ while the move is in flight."
      - "environments.yaml STAYS SHARED (delivery-scoper): its production entry already says 'a second asset is a second deployment of this same configuration, not another entry here'. people.yaml GOES PER ASSET: a team's people are a fact about that team, and a correction's approver must be one of the asset's own people."
      - "CALL-TIME RESOLUTION (architect SHOULD): several path constants are import-time defaults, so a module imported before a test selects its asset would keep the wrong folder. REJECTED keeping the constants and pointing them per asset, which is the same capture with more steps."
      - "v1's CRITERIA 5-13 MOVED: selecting the asset and the CLI to REQ-PIPE-363, the gates to REQ-PIPE-364, per-asset state to REQ-PIPE-365 (architect NIT: v1's REQ-PIPE-342 was extra-large)."
      - "CALL TIME FOR STATE PATHS TOO, BEFORE THE MOVE (Keith, 2026-11-01, the groundwork-first plan): the ~200 hard-coded data/ and reports/ references become per-asset call-time lookups as their own groundwork stream before the move, because the groundwork builder found the sweep is not mechanical move work. Criterion 6 carries it, with REQ-PIPE-365 criterion 1."
      - "GROUNDWORK FIRST (Keith, 2026-11-01): the resolver is built first and maps today's contract/ as one asset, so every existing test passes on today's layout; the move then only switches it on. Then ONE move commit proven by REQ-TEST-239 (REQ-TEST-357), then four post-move streams: the dashboard; the Cancer and Mental Health collections; CI and publishing; docs and the amendments."
      - "UNTIL REQ-QAC-344 RENAMES IT, TODAY'S ONE ASSET IS NAMED data-asset-1 in statements and module names (groundwork builder, 2026-11-01): expected, not a defect."
    open_questions: []

  - id: REQ-PIPE-363
    title: "A command is told which asset it acts for by MOTHMAN_ASSET, with no default; only that asset's commands exist, the terminal names the asset, and check and --help work with none set"
    date_written: "2026-10-31"
    story: "As whoever runs either asset, I want every command told which asset it is for, and to see only that asset's commands, so that a command can never quietly act for the other team's asset."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 and #55; architect review BLOCKING 4; Keith's answer to architect Q3 (b), 2026-10-31. Split out of v1's REQ-PIPE-342 by delivery-scoper, 2026-10-31. CLI/TUI UX review of v3, 2026-11-01 (MUST 1-3, SHOULD 6, NIT 8). v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL take the asset a command acts for from MOTHMAN_ASSET, naming an asset folder under assets/, beside MOTHMAN_ENVIRONMENT and MOTHMAN_SUPPLY_DSN (PROPOSED, on REQ-PIPE-091's precedent)."
      - "WHEN mothman starts, THE SYSTEM SHALL build the command groups of the selected asset's collections only, and SHALL build none and read no asset configuration WHILE MOTHMAN_ASSET is unset or names no asset folder."
      - "IF a command names a collection the selected asset does not hold - `mothman bdm ...` under the quarterly asset, for example - THEN THE SYSTEM SHALL answer as for any unknown command, 'No such command', followed by one line naming the selected asset - 'Commands for asset 'quarterly':' (PROPOSED wording) - and the selected asset's own collection commands beneath it, reading nothing of any other asset."
      - "IF a command that is not one of the tool commands of criterion 5 is given WHILE MOTHMAN_ASSET is unset or names no asset folder, THEN THE SYSTEM SHALL answer not 'No such command' but that MOTHMAN_ASSET is not set, or names no asset folder, naming the variable, listing the folder names found under assets/ and saying there is deliberately no default, in the form environments.current() uses for MOTHMAN_ENVIRONMENT - reading nothing but those folder names."
      - "WHILE MOTHMAN_ASSET is unset, THE SYSTEM SHALL run `mothman check`, `mothman --help` and every command that reads no asset configuration and opens no connection, and `mothman --help` SHALL say, as one line inside its Collections panel (REQ-TEST-252 criterion 2's two-panel layout kept), 'Set MOTHMAN_ASSET to one of: <the folder names found>' (PROPOSED wording)."
      - "IF a command that reads asset configuration or opens a connection runs WHILE MOTHMAN_ASSET is unset or names no asset folder, THEN THE SYSTEM SHALL refuse before reading any asset configuration or opening any connection, naming the variable and every asset folder found, and SHALL NOT fall back to a default, a last-used value or the only asset present."
      - "WHEN `mothman` is run bare, to open the wizard, WHILE MOTHMAN_ASSET is unset or names no asset folder, THE SYSTEM SHALL refuse before the banner with criterion 6's message, as REQ-TEST-114 criterion 8 refuses for the environment, and SHALL NOT fail on an empty collection list."
      - "THE SYSTEM SHALL name the selected asset, in words and never by colour alone, wherever REQ-TEST-114 names the environment - the toolbar on every wizard prompt and the stderr line at the first connection, e.g. 'Environment: Sandbox (not production) · Asset: quarterly' (PROPOSED wording) - and in `mothman env current` and `mothman env list`."
      - "THE SYSTEM SHALL let each test select its asset explicitly through REQ-PIPE-342 criterion 7's fixture, and SHALL NOT let a test's outcome depend on an ambient MOTHMAN_ASSET."
      - "THE SYSTEM SHALL have tests, seen failing first and each run in a real non-TTY session where it is a refusal, of `mothman --help` and `mothman check` with MOTHMAN_ASSET unset, of `mothman bdm` under the quarterly asset answering 'No such command' with the asset line, of `mothman cp qa` with the variable unset and with it mistyped, of bare `mothman` refused before the banner, of the asset named on a wizard prompt and in `mothman env current`, and of an asset-reading command refused with the variable unset and with it naming no folder."
    non_functional_requirements:
      - "SECURITY: a command that does not exist cannot be run against the wrong asset; nothing reads another asset's configuration, not even its ids (Keith, architect Q3). Reading the folder NAMES under assets/ to say which values are valid is not reading an asset's configuration."
      - "PORTABILITY: a fresh clone with MOTHMAN_ASSET unset can still run `mothman check` in full (REQ-PIPE-092 criterion 9)."
      - "USABILITY, ERROR STATES: every refusal says what to do next and blames no one; 'No such command' is never the answer when the real cause is an unset variable (CLI UX MUST 1), and when it is the answer it says which asset the list belongs to (CLI UX SHOULD 6)."
      - "USABILITY, SETUP: people will not read --help first (the Paradox of the Active User), so the variable is named in the first refusal they meet, not only in the docs."
      - "OBSERVABILITY: the asset is visible on every prompt, so a person switching assets can see which one the terminal is acting on (REQ-TEST-114's reason, applied to the asset)."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-091
      - REQ-PIPE-093
      - REQ-TEST-114
      - REQ-TEST-252
    decisions:
      - "THE ASSET IS NAMED BY AN ENVIRONMENT VARIABLE, AS THE ENVIRONMENT IS (delivery-scoper, following REQ-PIPE-091's decision for MOTHMAN_ENVIRONMENT, Keith 2026-10-04 option A). REJECTED a mandatory --asset flag, for the reason REQ-PIPE-091 rejected --env: a flag cannot move the DSN. REJECTED one DSN variable per asset, as REQ-PIPE-091 rejected one per environment; a machine working both assets switches two variables together, and REQ-PIPE-343's guard catches a mismatched pair."
      - "THE WRONG ASSET'S COMMANDS SIMPLY DO NOT EXIST (Keith, 2026-10-31, architect Q3 (b)): 'mothman bdm' under the quarterly asset gets 'No such command'. REJECTED (a), a repository-wide identifiers-only read so the refusal could name the right asset. This removes v1's criterion naming the other asset."
      - "GROUPS BUILT ONLY FOR THE SELECTED ASSET (architect BLOCKING 4): cli/app.py builds every collection's group at import by reading the hierarchy, which clashed with refusing before any read and with check and --help needing no asset."
      - "AN UNSET ASSET IS NAMED, NOT HIDDEN BEHIND 'No such command' (CLI UX v3 MUST 1): with no groups built, `mothman cp qa` would wrongly read as a command that does not exist. Criterion 4 reads only the folder names under assets/, which Keith's Q3 answer allows. REJECTED leaving 'No such command' for every unknown command."
      - "THE BARE WIZARD REFUSES BEFORE ITS BANNER (CLI UX v3 MUST 2): _main_menu_loop builds its flag hint from _COLLECTIONS[0], which raises IndexError with no collections; criterion 7 follows REQ-TEST-114 criterion 8's pattern for the environment."
      - "THE ASSET IS NAMED WHERE THE ENVIRONMENT IS (CLI UX v3 MUST 3): environment_statement() gains the asset, and `mothman env current` and `env list` name it."
      - "NO NEW OR RENAMED COMMANDS beyond `mothman env dbt-deps` (REQ-QAC-368), which sits in the env group beside reset-synthetic and mark (CLI UX v3)."
    open_questions: []

  - id: REQ-PIPE-364
    title: "mothman check runs every configuration gate once per asset folder, needing no asset and no database, keeps identifiers unique within each asset, and compares nothing across assets"
    date_written: "2026-10-31"
    story: "As whoever maintains both assets' configuration, I want one `mothman check` to validate every asset folder, each on its own terms, so that a change to either asset is checked before it is pushed without anyone having to select an asset first."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131; architect review SHOULD (reuse check_id.py's asset segment). Split out of v1's REQ-PIPE-342 by delivery-scoper, 2026-10-31. Keith's sign-off answers Q4, Q4b and Q4c, 2026-10-31, which closed Q4. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN `mothman check` runs, THE SYSTEM SHALL run every configuration gate - registry, collections, providers, hierarchy, schedule, check-source, check-id, dbt-folder, patterns, check-lifecycle, agreement-freeze, people and presentation - once for each asset folder, each pass reading that folder alone, needing no MOTHMAN_ASSET and no database, and SHALL name the asset in every failure it reports."
      - "THE SYSTEM SHALL enforce each check id's asset segment through qa_tools/common/check_id.py's existing check, run for each asset folder against that asset's data_asset_id, and SHALL NOT add a second one."
      - "THE SYSTEM SHALL keep collection ids, collection shorts, run prefixes, dataset ids, table names, agency shorts and provider seed ranges unique within each asset, and `mothman check` SHALL fail on a duplicate within an asset, naming the asset and both items; it SHALL NOT compare any identifier across assets."
      - "IF a check's reads_tables, or a dataset's linked_datasets, names a table or dataset its own asset's hierarchy does not hold, THEN `mothman check` SHALL fail, naming the declaring dataset, the item and the asset folder checked, and SHALL NOT look the item up in another asset."
      - "IF a file other than environments.yaml - or, in the push that carries the move alone, REQ-TEST-366's move map - sits at the top of assets/, or a folder under assets/ holds no data-asset.yaml, THEN `mothman check` SHALL fail, naming it."
      - "THE SYSTEM SHALL have tests, seen failing first, of each refusal above, each against a fixture repository holding two asset folders, including one in which both assets reuse a collection id and pass."
    non_functional_requirements:
      - "SCALE: the gates loop over asset folders and over collections within each; nothing assumes two of either."
      - "PERFORMANCE: about twice today's configuration-gate time with two folders, inside `mothman check --no-pytest`'s ~45s budget."
      - "PORTABILITY: no database and no asset needed (REQ-PIPE-092 criterion 9)."
      - "SECURITY: no gate reads one asset's folder while checking another, so the rule that nothing reads another asset's configuration holds for `mothman check` too."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-363
      - REQ-QAC-344
    decisions:
      - "NO CROSS-ASSET COMPARISON - Q4 CLOSED (Keith, 2026-10-31, sign-off Q4, Q4b and Q4c): dbt, adapters and providers live in each asset's folder, so nothing per-collection is keyed by id alone in a shared place and no id can collide across assets. REJECTED v2's (a), a repository gate comparing ids across folders, which was the one reader that opened every folder against 'nothing reads another asset's configuration, not even its ids'; REJECTED v2's (b), namespacing the shared code by asset. v2's agency-consistency criterion goes with it, NOT NEEDED because each asset is its own deployment and shows its agencies only on its own dashboard; two Department of Health folders may differ and nothing compares them."
      - "UNIQUE WITHIN AN ASSET (delivery-scoper, v3): ids, shorts, run prefixes, table names and seed ranges must not repeat inside one asset, where they share a database, a command tree and a generator run; across assets they may."
      - "A CROSS-ASSET READ IS A CONFIGURATION ERROR, AND ITS REFUSAL DOES NOT NAME THE OTHER ASSET (Keith, architect Q3): criterion 4. Today Birth Registrations is kept out of linkage by the calendar rule (REQ-QAC-330 criterion 6); after the split, by the asset boundary, which is the honest reason."
      - "THE MOVE MAP IS ALLOWED AT THE TOP OF assets/ FOR ONE PUSH ONLY (architect v3 NIT): the next push deletes it and drops it from criterion 5 (REQ-TEST-366 criterion 3)."
    open_questions: []

  - id: REQ-PIPE-365
    title: "Each asset's generated state - deliveries, receipts, bookkeeping, scenario placements, results files, checkpoints and the replay cache key - lives under that asset's own name"
    date_written: "2026-10-31"
    story: "As whoever runs both assets on one machine, I want each asset's generated files kept apart, so that bootstrapping or resetting one never reads, overwrites or replays the other's."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131; architect review SHOULD (scenario_placements.json, checkpoints, cache_key, rebuild-results/build-data). Split out of v1's REQ-PIPE-342 by delivery-scoper, 2026-10-31. Architect v3 SHOULD 5 (providers out of the replay inputs); the build plan, 2026-11-01 (call-time lookups before the move). v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL keep each asset's deliveries, receipts, generator bookkeeping and scenario placements under data/<asset>/ (deliveries/, receipts/, generator_bookkeeping.json, scenario_placements.json) and its results and dashboard data files under reports/<asset>/, all gitignored, every reader finding each path at call time through REQ-PIPE-342 criterion 6's resolver - a lookup built before the move, resolving to today's data/ and reports/ while there is one asset."
      - "THE SYSTEM SHALL keep `mothman env reset-synthetic`, checkpoints and resume per asset, each reading and writing the selected asset's checkpoints only, and each refusing an asset not declared synthetic."
      - "THE SYSTEM SHALL key qa_tools/common/replay_inputs.py's cache_key() and `mothman pipeline cache-key` on the selected asset - the shared inputs, that asset's folder under assets/ and assets/environments.yaml, never another asset's folder - and SHALL leave the asset's synthetic/collections/ out of the replay inputs (REPLAY_INPUTS) as generator/ is left out today, since providers are compared as deliveries; KEY_PREFIX SHALL be bumped in the move (REQ-TEST-160 criterion 1 as amended by A43)."
      - "THE SYSTEM SHALL run `mothman dashboard rebuild-results` and `mothman dashboard build-data` for the selected asset only, reading its database and writing under reports/<asset>/."
      - "THE SYSTEM SHALL NOT let a command run for one asset read or write anything under the other asset's data/ or reports/ folder, shown by a test that runs each command above for one asset beside a populated folder of the other and compares that folder byte for byte before and after."
    non_functional_requirements:
      - "CONFIGURATION, NOT STATE: everything here stays gitignored state (CLAUDE.md)."
      - "RELIABILITY: one asset's reset or failed bootstrap leaves the other's files untouched (criterion 5)."
      - "PORTABILITY: the test asserts on folders whether or not they exist beforehand (CLAUDE.md: a fresh clone has no data/)."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-363
      - REQ-TEST-117
      - REQ-TEST-160
    decisions:
      - "STATE FOLLOWS THE ASSET (delivery-scoper): the four data/ paths test.yml caches (lines 410-414 today) and every reports/ file become per asset; scenario_placements.json was missing from v1 (architect SHOULD)."
      - "PROVIDERS STAY OUT OF THE REPLAY INPUTS (architect v3 SHOULD 5): REPLAY_INPUTS excludes generators, which are compared as deliveries; providers moved under assets/<asset>/synthetic/ would otherwise land in 'the asset's whole folder', and any provider edit would restart a resume. Amendment A43."
      - "THE LOOKUP COMES BEFORE THE MOVE (Keith, 2026-11-01): criterion 1's call-time half is groundwork, built and passing on today's layout, so the move changes where the resolver points, not every reader."
    open_questions: []

  - id: REQ-QAC-368
    title: "Each asset has a dbt project of its own under assets/<asset>/dbt/, sharing one local dbt package for the shared macro and generic tests, and its packages are installed by `mothman env dbt-deps`"
    date_written: "2026-10-31"
    story: "As whoever maintains the checks, I want each asset's dbt models and tests to live with that asset's other checks, in a dbt project of its own, so that one asset's dbt run never compiles the other's models and a missing install is named rather than surfacing as a stray manifest error."
    moscow: must
    status: not_started
    source: "Keith's sign-off answer Q4, 2026-10-31 (dbt goes under each asset) and Q4c (the layout); CLI/TUI UX review of v3 SHOULD 4; architect v3 SHOULD 6. Drafted by delivery-scoper 2026-10-31 (v3); v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold each asset's dbt project under assets/<asset>/dbt/ - its dbt_project.yml (project name mothman_<asset>, PROPOSED), packages.yml, models/<collection-id>/, tests/<collection-id>/ and retired/<collection-id>/schema-retired.yml for each of the asset's collections - moving each collection's files from dbt_project/ unchanged in content."
      - "THE SYSTEM SHALL hold the shared macro (matches_regex.sql today) and any generic tests in one local dbt package, dbt_shared/ at the repository root, pulled into each asset's project by its packages.yml, and SHALL keep no per-collection file there."
      - "WHEN a run invokes dbt, THE SYSTEM SHALL point it at the selected asset's project only, with the shared profiles directory (qa_tools/dbt_profiles) and each run's own target path (supply_db.dbt_target_path) unchanged."
      - "THE SYSTEM SHALL install each asset's dbt packages through `mothman env dbt-deps` in the session-start hook, .devcontainer/post-create.sh and every CI job that runs dbt (REQ-TEST-353 criterion 8), once per asset, in place of the bare `dbt deps` each runs today."
      - "WHEN `mothman env dbt-deps` runs, THE SYSTEM SHALL install the selected asset's dbt packages into assets/<asset>/dbt/dbt_packages/, and WHEN they are already installed and packages.yml is unchanged, SHALL change nothing and say 'already installed' (PROPOSED wording)."
      - "IF a run that invokes dbt finds the selected asset's dbt_packages/ missing, THEN THE SYSTEM SHALL refuse before invoking dbt, naming the asset and `mothman env dbt-deps`, rather than failing later with a FileNotFoundError on manifest.json."
      - "THE SYSTEM SHALL keep each asset project's dbt_packages/, target/ and logs/ gitignored."
      - "THE SYSTEM SHALL run REQ-QAC-241's dbt-folder gate per asset, against that asset's project and dbt_shared/ (A21)."
      - "THE SYSTEM SHALL include dbt_shared/ and each asset's dbt folders in the changelog gate (REQ-QAC-223, as amended by A38), in validate_check_lifecycle.sources_fingerprint() (REQ-QAC-241 criterion 11, as amended by A21) and in REQ-PIPE-157's partial-parse rule, which SHALL hold per asset project (A37)."
      - "THE SYSTEM SHALL have tests, seen failing first, of `mothman env dbt-deps` installing the selected asset's packages and saying 'already installed' when run again, of the refusal naming the command when dbt_packages/ is missing, and of each asset's project compiling a check that uses dbt_shared/'s macro."
    non_functional_requirements:
      - "MAINTAINABILITY: the near-identical files per asset are dbt_project.yml (about 30 lines, mostly comments, differing by project name) and packages.yml (3 lines) - about 35 lines per asset and none of it logic; the one shared macro is not copied."
      - "COMPATIBILITY: dbt_utils is still installed from the dbt hub by `dbt deps`, now once per asset; a government network that cannot reach it fails the same way it does today, named by criterion 6."
      - "PERFORMANCE: each asset's run parses only its own project, so a quarterly run no longer compiles Birth Registrations' models."
      - "USABILITY: the refusal names the one command that fixes it (CLI UX v3 SHOULD 4)."
    dependencies:
      - REQ-PIPE-342
      - REQ-QAC-241
      - REQ-PIPE-157
      - REQ-QAC-223
    decisions:
      - "dbt PER ASSET (Keith, 2026-10-31, sign-off Q4): the models and tests are per-dataset checks. REJECTED one shared dbt_project/ keyed only by collection id with a gate refusing a repeated id."
      - "ONE SHARED LOCAL PACKAGE, NOT A COPY (Keith, 2026-10-31, sign-off Q4c): dbt_shared/ holds the regex macro and generic tests. REJECTED copying the macro into each project, which two assets could let drift."
      - "`mothman env dbt-deps` IN THE env GROUP (CLI UX v3 SHOULD 4): beside reset-synthetic and mark; idempotent. REJECTED leaving a bare `dbt deps` per asset in each setup script, which every new setup would have to learn the paths of."
      - "PROJECT NAMED FOR THE ASSET (delivery-scoper, v3, PROPOSED): mothman_<asset>, so dbt's own logs and artefacts say which asset they came from."
    open_questions: []

  - id: REQ-PIPE-369
    title: "Each asset's QA adapters live under assets/<asset>/collections/ and are loaded by file path, never as a package, and a spawned process is handed the asset and the collection id"
    date_written: "2026-10-31"
    story: "As whoever maintains the pipeline, I want each collection's QA adapter to sit with its asset's checks and be found by path from the asset and the collection id, so that an asset folder is configuration a deployment could supply from outside this repository, and two assets' adapters can never shadow one another."
    moscow: must
    status: not_started
    source: "Keith's sign-off answer Q4b, 2026-10-31 (per-collection Python moves into the asset folder); Keith's switch to load-by-path, 2026-10-31; architect v3 SHOULD 3 and 4; REQ-PIPE-369 criterion 6 amended by Keith 2026-11-01. Drafted by delivery-scoper 2026-10-31 (v3); v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold each collection's QA adapter at assets/<asset>/collections/<module>.py, its module name derived from the collection id as today, and SHALL keep in qa_tools/collections/ only the shared base module and shared code."
      - "THE SYSTEM SHALL load an adapter from its file path - built from the selected asset's folder and the collection id only after the id has matched the hierarchy's id pattern - through importlib's file-location loader, registered under a module name built from the asset and the module name (PROPOSED: mothman_adapter_<asset>_<module name>) that no package on sys.path provides, and SHALL NOT import a module path taken from configuration, put an asset folder on sys.path, or give any asset folder an __init__.py."
      - "THE SYSTEM SHALL let an adapter import only shared code (qa_tools.collections.base and other shared modules) and the standard library; and IF an adapter imports another adapter, a provider, or anything under assets/, THEN `mothman check` SHALL fail naming it."
      - "WHEN a process is started for a collection - REQ-PIPE-262's spawned bootstrap streams and parallel_orchestrate's workers among them - THE SYSTEM SHALL pass it the asset and the collection id, never an adapter object, and the process SHALL select that asset and load the adapter itself by criterion 2's lookup."
      - "THE SYSTEM SHALL move every test that imports an adapter or a provider by package name (about ten test modules today) onto one test helper in tests/ that loads it by criterion 2's lookup, in the same change, and SHALL keep no test whose only assertion is that the old package path is gone."
      - "THE SYSTEM SHALL measure the files loaded by path in the coverage figure, through coverage's source setting naming assets together with include_namespace_packages, so that moving the adapters and providers neither drops them from the measured figure nor moves fail_under. AMENDED 2026-11-01 (Keith): include is ignored when source is set; source plus include_namespace_packages measures path-loaded files."
      - "WHEN `mothman check` runs, THE SYSTEM SHALL run the collections gate per asset: IF a collection in an asset's hierarchy has no adapter in that asset's collections/, or that folder holds an adapter for no collection of the asset, THEN it SHALL fail, naming the asset and the file or collection."
      - "THE SYSTEM SHALL have tests, seen failing first, that an adapter is found by path under each asset, that a collection id failing the id pattern is refused before any path is built, that two assets' adapters of the same module name load as two distinct modules, that a spawned process loads its adapter from the asset and id it is handed, and that an adapter importing another adapter fails the gate."
    non_functional_requirements:
      - "SECURITY: no import path is ever taken from configuration, and the id is validated before it becomes part of a path, so a hostile or mistyped hierarchy cannot load arbitrary code."
      - "PORTABILITY, #55: an asset folder is not a Python package, so a deployment can supply it from outside this repository without renaming an import."
      - "MAINTAINABILITY: no __init__.py in any asset folder - an asset folder is configuration with a few small modules in it (22 to 108 lines each today), not a Python package."
      - "COMPATIBILITY: path loading needs nothing beyond the standard library's importlib."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-240
      - REQ-PIPE-262
    decisions:
      - "LOADED BY PATH, NEVER AS A PACKAGE (Keith, 2026-10-31): Keith first chose assets/ as a Python package, then switched on hearing that a package ties assets/ to this repository's layout and would complicate #55's injected configuration. REJECTED assets/ as a namespace package imported as assets.<asset>.collections.<module>; REJECTED putting each asset folder on sys.path, where two assets' same-named modules would shadow each other. (v3's further reason, that a third asset would need code naming it, was wrong - an import name can be built from the asset id - and is dropped; #55 is the reason.)"
      - "THE ASSET CROSSES PROCESS BOUNDARIES, NOT JUST THE ID (architect v3 SHOULD 3): tests select the asset in-process by fixture, but bootstrap.py's spawn context (line 765 today) starts a fresh interpreter that never sees that selection, and re-imports by module name what it unpickles, which a path-loaded module does not have. Criterion 4 hands over both ids. REJECTED passing the collection id alone, as v3 had it."
      - "COVERAGE BY source PLUS include_namespace_packages - criterion 6 AMENDED (Keith, 2026-11-01): coverage.py does not walk into folders without an __init__.py, and include is ignored when source is set, so v4's 'list them in include' could not work. The intent - path-loaded files are measured - is unchanged. coverage's source_dirs refuses a folder that does not exist, so assets joins source in the move. REJECTED include."
      - "ONE TEST HELPER (delivery-scoper, v3): about ten test modules import an adapter or provider by package name today; they move onto one loader so the lookup is tested once."
    open_questions: []

  - id: REQ-GEN-370
    title: "Each asset's synthetic-only configuration and generator providers live under assets/<asset>/synthetic/, read only by the generator, the bootstrap and the gates, and an asset with that folder removed still runs on real supplies"
    date_written: "2026-10-31"
    story: "As whoever would take this to a real deployment, I want everything that exists only to fake an asset's history in one folder per asset, so that deleting that folder leaves an asset that runs on real supplies, and nothing in the real pipeline can come to depend on it."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31, (a)); Keith's sign-off answer Q4c, 2026-10-31; Keith's answers to v3 Q5 (a), 2026-10-31, and on the population generator, 2026-11-01; architect v3 BLOCKING 3 and 4, SHOULD 1. Drafted by delivery-scoper 2026-10-31 (v3); v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold each asset's synthetic-only configuration under assets/<asset>/synthetic/ - its generator providers under synthetic/collections/, scripted_decisions.yaml, synthetic_inputs.yaml where the asset has one (the quarterly asset's, from geocoding), and eras.yaml (REQ-GEN-371) - moving each from contract/ and generator/collections/ unchanged in content."
      - "THE SYSTEM SHALL load a provider by path from the selected asset's synthetic/collections/ folder and the collection id, by REQ-PIPE-369 criterion 2's lookup (PROPOSED module name: mothman_provider_<asset>_<module name>), and SHALL keep in generator/collections/ only the shared base module."
      - "THE SYSTEM SHALL let only the generator, the bootstrap, the configuration gates that validate synthetic configuration (validate_collections, validate_providers and validate_schedule among them) and the setting resolver that merges eras.yaml (REQ-GEN-371 criterion 2) read anything under synthetic/; and staging, the checks, the gate, promotion and the dashboard build SHALL read nothing there, shown by a test."
      - "THE SYSTEM SHALL fold generator/daily_batch.py into the Civil Registration provider, and each collection's apply_*_presets function in generator/dirty.py into that collection's provider, importing pandas and numpy inside functions so that each provider stays importable without them (REQ-GEN-246 criterion 7), and SHALL leave in generator/ only collection-generic helpers."
      - "THE SYSTEM SHALL let a provider import only shared code and the standard library; and IF a provider imports another provider, an adapter, or anything under assets/, THEN `mothman check` SHALL fail naming it."
      - "WHEN `mothman population` runs, THE SYSTEM SHALL take the asset from MOTHMAN_ASSET (REQ-PIPE-363) and apply only that asset's presets, loaded from its own providers, in place of today's one process applying Birth Registrations' and Child Protection's presets together (synthetic_data_generator/generate.py lines 76-77 today)."
      - "THE SYSTEM SHALL run the providers gate per asset, refusing two providers of one asset whose seed ranges overlap (REQ-GEN-246 criterion 3 as amended by A39), and SHALL NOT compare seed ranges across assets."
      - "WHERE an asset folder has no synthetic/ folder, THE SYSTEM SHALL pass every configuration gate for it and run its staging, checks, gate, promotion and dashboard build, refusing only the commands that generate synthetic data, by name."
      - "THE SYSTEM SHALL have tests, seen failing first, of a provider found by path under each asset, of a fixture asset with its synthetic/ folder removed passing criterion 8, of a provider importing another provider refused, of `mothman population` applying only the selected asset's presets, and SHALL show through REQ-TEST-239's compare that folding daily_batch and the presets changes no byte any collection generates."
    non_functional_requirements:
      - "PRIVACY AT REAL SCALE: a real deployment deletes synthetic/ and nothing that reads real supplies depends on what was in it; criterion 3 makes the boundary checkable rather than a convention."
      - "NOTHING CODED FOR ONE COLLECTION: the shared generator keeps no collection's row makers or presets."
      - "MAINTAINABILITY: providers are 260 to 1,100 lines each - the synthetic data makers themselves - which is why they belong in the part a real deployment deletes."
      - "PERFORMANCE: importing pandas inside functions keeps the providers gate and the CLI's import time as today (REQ-GEN-246 criterion 7)."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-369
      - REQ-GEN-246
      - REQ-PIPE-363
      - REQ-TEST-239
    decisions:
      - "SYNTHETIC CONFIGURATION GETS ITS OWN HOME INSIDE EACH ASSET (Keith, 2026-10-31, #134 (a), then sign-off Q4c): synthetic/<asset>/ folded into assets/<asset>/synthetic/. The code separation of the generator and the bootstrap follows as its own batch (#134's code half, queued behind the split)."
      - "daily_batch AND THE PRESETS FOLD INTO THEIR PROVIDERS - Q5 CLOSED (Keith, 2026-10-31, v3 Q5 (a), built as the architect showed it can be, v3 BLOCKING 3): providers are one file each and loaded by path, and a provider may import nothing under assets/, so daily_batch.py cannot sit beside civil_registration.py as a second module. REJECTED leaving daily_batch.py and the per-collection presets in shared code."
      - "THE POPULATION GENERATOR APPLIES ONLY THE SELECTED ASSET'S PRESETS (Keith, 2026-11-01, on architect v3 BLOCKING 4): `mothman population` takes MOTHMAN_ASSET. REJECTED the architect's recommendation of dropping its preset step, and REJECTED one process reading both assets' providers, which breaks REQ-PIPE-342 criterion 8."
      - "THE GATES AND THE SETTING RESOLVER ARE ALLOWED READERS (architect v3 SHOULD 1): validate_collections reads scripted_decisions.yaml and synthetic_inputs.yaml today, and REQ-GEN-371 makes the setting resolver and validate_schedule read eras.yaml; v3's criterion would have failed working code."
      - "SEED RANGES UNIQUE WITHIN AN ASSET (delivery-scoper, v3): providers of two assets never run in one generator process."
    open_questions: []

  - id: REQ-GEN-371
    title: "Each asset's synthetic-era setting versions - back-dated, or named a synthetic era in their changelog - move from data-asset.yaml to synthetic/eras.yaml, and the merged timeline is unchanged"
    date_written: "2026-10-31"
    story: "As whoever would take this to a real deployment, I want the setting versions that exist only to shape the fake history kept apart from the asset's real settings, so that deleting the synthetic folder leaves a data-asset.yaml that says only what a real asset was configured to do."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31: the synthetic eras now inside data-asset.yaml's amber setting); Keith's answer to v3 Q6 (a), 2026-10-31, widened 2026-11-01 on architect v3 BLOCKING 5; architect v3 SHOULD 2. Drafted by delivery-scoper 2026-10-31 (v3); v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL move every setting version that is synthetic - at the asset level and on a collection or dataset - from the asset's data-asset.yaml into assets/<asset>/synthetic/eras.yaml, keeping each version's level, effective_from, value and changelog, and SHALL leave every other version in data-asset.yaml; a version is synthetic WHERE its effective_from is earlier than the date of its first changelog entry (back-dated), or its changelog calls it a 'synthetic era', or it is the version whose changelog says that era ends."
      - "THE SYSTEM SHALL have the setting resolver and validate_schedule read each setting as one timeline merged from data-asset.yaml and eras.yaml, and WHERE an asset has no eras.yaml, from data-asset.yaml alone."
      - "WHERE moving a setting level's versions to eras.yaml leaves that level in data-asset.yaml with none, THE SYSTEM SHALL remove the level from data-asset.yaml - Child Protection's collection-level replacement setting among them - so that without eras.yaml it falls back as an undeclared level does."
      - "WHEN the versions are moved, THE SYSTEM SHALL resolve every setting for every dataset on every date of each asset's history exactly as before, shown by comparing the merged timelines before and after, and SHALL go through REQ-TEST-366's move map only if the extraction lands in the push that carries the move."
      - "THE SYSTEM SHALL hold eras.yaml to the same freeze as data-asset.yaml's setting versions, comparing merged timeline with merged timeline at the base, so that moving a version between the two files is not a change and editing a past-dated one in either is."
      - "THE SYSTEM SHALL have tests, seen failing first, of a back-dated version and a named-era version each moved, of an era-ends version moved with its era, of an emptied level removed, of the merged timeline unchanged, and of an edit to a past-dated version in eras.yaml refused by the freeze."
    non_functional_requirements:
      - "CONFIGURATION, NOT STATE: eras.yaml is authored configuration about the synthetic history, as scripted_decisions.yaml is."
      - "AUDITABILITY: each moved version keeps its changelog, so why a past period was configured as it was stays readable."
      - "RELIABILITY: criterion 5 keeps the freeze from being bypassed by moving a version between files."
    dependencies:
      - REQ-GEN-370
      - REQ-PIPE-112
      - REQ-PIPE-123
      - REQ-TEST-366
    decisions:
      - "BACK-DATED OR NAMED A SYNTHETIC ERA, WITH ITS 'era ends' VERSION - Q6 CLOSED (Keith, 2026-10-31, v3 Q6 (a), widened 2026-11-01 on architect v3 BLOCKING 5): the 2026-09-01, 09-10 and 09-18 versions (contract/data-asset.yaml lines 172-189 today) were re-dated by REQ-PIPE-112 so their changelog dates equal their effective_from, and 'back-dated' alone caught only 2013-01-01 and 2026-08-30. Keith's intent was the named eras and the history-growth versions alike. REJECTED back-dated only; REJECTED named eras only; REJECTED deferring to #134."
      - "MERGED AGAINST MERGED (architect v3 SHOULD 2): the extraction may land in a later push than the move, by when the map is gone; comparing merged timelines needs no map. REJECTED going through the map unconditionally."
      - "AN EMPTIED LEVEL IS REMOVED (delivery-scoper's choice, signed with v4): a real deployment then falls back to the asset default there, which is what a level declaring nothing means."
    open_questions: []

  - id: REQ-PIPE-343
    title: "Each asset's database carries that asset's own identity, and a checkout refuses a database belonging to the other asset on every route"
    date_written: "2026-10-31"
    story: "As whoever runs either asset, I want a command configured for one asset to refuse the other asset's database before it does anything, so that two teams sharing one repository can never write to each other's history by a mistyped variable."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 and #55 (REQ-PIPE-107 named as load-bearing for shared configuration); Keith's answer to architect Q2 (a), 2026-10-31. Drafted by delivery-scoper 2026-10-31, v2 the same day. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL record in each asset's database the selected asset's data_asset_id, through REQ-PIPE-107's one marking command, which SHALL require the person to type both the asset's data_asset_id and the environment id."
      - "WHEN a connection is opened, THE SYSTEM SHALL compare the database's recorded data_asset_id with the selected asset's, as REQ-PIPE-107 criterion 5 does today, so that a quarterly checkout pointed at the daily database is refused before any statement runs."
      - "IF the two differ, THEN THE SYSTEM SHALL refuse, naming the data_asset_id the database carries and the one expected, as REQ-PIPE-107 criterion 6 does, and SHALL NOT include any part of the connection string."
      - "THE SYSTEM SHALL mark, in the same change, each asset's sandbox database in the session-start hook, each asset's CI database in test.yml, each asset's dev-container database in .devcontainer/post-create.sh, and each test worker's database for the asset its fixture selects."
      - "THE SYSTEM SHALL NOT open connections to two assets' databases from one process, in anything that ships; a step that needs both - CI's two bootstraps - SHALL run as one process per asset, each with its own MOTHMAN_ASSET and MOTHMAN_SUPPLY_DSN, and a process spawned for a collection SHALL be handed the asset as well as the collection id (REQ-PIPE-369 criterion 4)."
      - "WHERE the process is the test suite, THE SYSTEM SHALL exempt it from criterion 5, and SHALL have each individual test open only one asset's database; a process a test spawns SHALL NOT inherit the exemption."
      - "THE SYSTEM SHALL name each asset's database on the sandbox's, CI's and the dev container's one local server supply_<data_asset_id> (PROPOSED), so that the deployment fixture finds each asset's database by that name; nothing that ships SHALL rely on the name."
      - "THE SYSTEM SHALL have a test, seen failing first, that points a checkout configured for each asset at the other asset's marked database and asserts the refusal on every route REQ-PIPE-107 criterion 10 names - mothman, a test worker's database, and the connection details handed to dbt, Soda Core and datacontract-cli - with the database left exactly as it was found."
    non_functional_requirements:
      - "SECURITY: the guard is what makes one shared repository safe for two separately managed assets (#55); it must hold on every route, so criterion 8 tests each."
      - "SECURITY: no credential and no connection-string fragment in any refusal (REQ-PIPE-093 criterion 3)."
      - "PRIVACY AT REAL SCALE: in a real deployment the two databases sit in separately managed cloud environments, and a refusal is the last line behind network separation, not the only one."
      - "TODAY'S DATABASE IS REFUSED BY BOTH: it carries data-asset-1, which neither asset declares, so it cannot be used by accident after the split; REQ-TEST-357 regenerates rather than migrates."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-363
      - REQ-PIPE-107
      - REQ-QAC-344
    decisions:
      - "TWO ASSETS NEED TWO data_asset_ids FOR THE GUARD TO WORK AT ALL (delivery-scoper, from qa_tools/common/db_identity.py): REQ-PIPE-107 compares data_asset_id and environment."
      - "ONE PROCESS PER ASSET FOR EVERYTHING THAT SHIPS; PYTEST EXEMPT, EACH TEST ONE ASSET (Keith, 2026-10-31, architect Q2 (a)). CI keeps one deployment job. REJECTED (b), the deployment half run once per asset. REJECTED one bootstrap process holding both DSNs, which puts both assets' credentials in one process."
      - "THE REFUSAL NAMES IDS FROM THE DATABASE, NOT ANOTHER FOLDER (Keith, architect Q3): v1's criterion naming the other asset's folder needed a cross-asset read; REQ-PIPE-107's existing found-and-expected message needs none."
      - "ONE NAMING CONVENTION FOR LOCAL DATABASES (delivery-scoper, PROPOSED): criterion 7 lets one pytest session reach both assets' databases without a second DSN variable or a variable named for an asset."
    open_questions: []

  - id: REQ-QAC-344
    title: "Both assets' check ids carry their own meaningful data_asset_id - quarterly and daily - renamed once under a narrow, signed exception whose transform lives for the one push that carries the move"
    date_written: "2026-10-31"
    story: "As whoever maintains the checks, I want every check id to name the asset it belongs to by a meaningful name, so that two assets sharing one repository never have two checks with one id, and an id says which asset it is from at a glance."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131; Keith's answer to draft Q2 (b), 2026-10-31; architect review BLOCKING 3. Drafted by delivery-scoper 2026-10-31, v2 the same day. Architect v3 BLOCKING 2 (the transform outlived the map it reads). v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL declare data_asset_id 'quarterly' in the quarterly asset's data-asset.yaml and 'daily' in the daily asset's (PROPOSED exact ids, for confirmation at sign-off), replacing data-asset-1."
      - "THE SYSTEM SHALL write every check id of an asset's collections - in its contracts, Soda, Evidently and retired-check files under assets/<asset>/ and in its own dbt project's models and retired files (REQ-QAC-368) - with that asset's data_asset_id as the first segment."
      - "WHERE a check id is renamed by criterion 2, THE SYSTEM SHALL change nothing else about the check: its config_hash SHALL be unchanged, shown by comparing every renamed check's hash before and after, as REQ-QAC-039's rename was measured."
      - "THE SYSTEM SHALL excuse the rename in find_disappeared_check_ids through one narrow transform beside migrate_pre_039_check_id: an id whose first segment is the former data_asset_id REQ-TEST-366's move map declares SHALL be read with that segment replaced by the data_asset_id of the asset folder its file moved to, and SHALL be excused only where the result is present in the new files."
      - "THE SYSTEM SHALL take the former data_asset_id from the move map, and SHALL NOT write it in code."
      - "THE SYSTEM SHALL let the transform apply only to the push that carries the move - a push whose diff base holds no assets/ folder (REQ-TEST-366 criterion 7) - and SHALL delete the transform, with the move map it reads, in the next push (REQ-TEST-366 criterion 3); from then on the asset-segment check (REQ-PIPE-364 criterion 2) refuses the former id in any file."
      - "THE SYSTEM SHALL have tests, seen failing first, that the move's renamed ids pass the check-lifecycle gate against a pre-move base, that an id renamed in any other way still fails as disappeared, and that a renamed id whose config_hash also changed fails."
      - "THE SYSTEM SHALL record the rename as one narrow exception to the rule that a check id never changes, approved by Keith in the change that applies it and licensing this rename only, as REQ-QAC-039's decisions record the 2026-09-22 one."
    non_functional_requirements:
      - "AUDITABILITY: history is regenerated rather than migrated (REQ-TEST-357), so no recorded result carries an id that no longer exists; the exception is recorded here."
      - "MAINTAINABILITY: about 390 ids and up to 86 test files change once; the transform is the only code the rename leaves behind, and it lives for one push."
    dependencies:
      - REQ-PIPE-342
      - REQ-QAC-039
      - REQ-TEST-366
    decisions:
      - "MEANINGFUL IDS FOR BOTH ASSETS (Keith, 2026-10-31, draft Q2 (b)): every check id in both assets changes. REJECTED (a), keeping data-asset-1 for the quarterly asset and renaming only Birth Registrations to data-asset-2. Keeping data-asset-1 for both was never offered: the guard (REQ-PIPE-343) could not tell the databases apart."
      - "THE SEGMENT STAYS (delivery-scoper, from check_id.py and Keith 2026-09-22): this is exactly the case it was kept for - 'the cost of that only appears when a second asset arrives'."
      - "A NARROW, SELF-EXPIRING TRANSFORM (architect BLOCKING 3): find_disappeared_check_ids excuses only REQ-QAC-039's transform today, so once the base-commit reads follow the move (REQ-TEST-366) every renamed id would fail as disappeared. REJECTED waiving the gate for the move commit, which would also let a real deletion through."
      - "THE DASHBOARD URL STILL CARRIES NO ASSET SEGMENT (REQ-QAC-039 criterion 6, kept): each asset has its own site (REQ-PIPE-354)."
      - "DELETED IN THE NEXT PUSH, WITH THE MAP IT READS (architect v3 BLOCKING 2, following Keith's move-map answer of 2026-10-31): v3 called the transform 'inert' once no base predated the move, but it reads its former id from a map deleted in the next push. REJECTED leaving it in the code inert. Its one-off confirmation is REQ-TEST-366 criterion 4's, not a kept test."
    open_questions: []

  - id: REQ-TEST-366
    title: "One committed move map, from each old path to its new one, is followed by every read of a base commit in the push that carries the move, and is deleted with its readers in the next push"
    date_written: "2026-10-31"
    story: "As Keith, I want the freeze and lifecycle gates to see a moved file as the same file, so that the move commit cannot carry a frozen or check change through unseen just because the file has a new path."
    moscow: must
    status: not_started
    source: "Architect review BLOCKING 2, 2026-10-31, widening v1's REQ-TEST-357 criterion 5. Drafted by delivery-scoper 2026-10-31. Keith, 2026-10-31 ('I don't want moved paths hanging around'); architect v3 BLOCKING 1 and NITs; the accepted pre-move-branch risk, 2026-11-01. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL commit, in the push that carries the move, one move map at the top of assets/, assets/moved-paths.yaml (PROPOSED name, from the agreed layout), listing every file the split moves or divides - configuration, check files, dbt files, adapters, providers and synthetic configuration - from its old path to its new path or paths, and the former data_asset_id."
      - "WHEN a gate reads a file at the base commit of the push that carries the move and the file's current path does not exist there, THE SYSTEM SHALL read the old path the move map gives for it, in every reader of a base commit: validate_check_lifecycle._sources(ref), the amber-setting and replacement-setting freeze in validate_schedule (lines 993-996 today), the people file read at the base (PEOPLE_REL), _version_added_on, and correction_trial's base reads (lines 623 and 651-653 today)."
      - "WHEN the push after the one carrying the move is made, THE SYSTEM SHALL delete assets/moved-paths.yaml, every line of code that reads it and REQ-QAC-344's id transform, in that push, with the tests of criterion 8, and SHALL drop the map from the files REQ-PIPE-342 criterion 2, REQ-PIPE-364 criterion 5 and amendment A21 allow at the top of assets/."
      - "WHEN that next push is made, THE SYSTEM SHALL confirm once, by a check run in that push and recorded in its evidence, that the map, every reader of it and the id transform are gone and that the push's diff base already holds assets/, and SHALL keep no test that asserts their absence (CLAUDE.md test rule 2)."
      - "WHERE a file was divided between assets, THE SYSTEM SHALL compare each part with the matching part of the old file, so that a frozen item or a check's config changed in the move fails as it would have in place."
      - "THE SYSTEM SHALL have _version_added_on follow the move map when walking base..HEAD of the push that carries the move, so that a check's first version is still found before the move."
      - "THE SYSTEM SHALL consult the map only for a push whose diff base (MOTHMAN_DIFF_BASE, read through diff_base()) holds no assets/ folder, which after the move is only the push that carries it."
      - "THE SYSTEM SHALL have a test, seen failing first, for each reader in criterion 2: against a temporary repository whose base has the old layout and whose head has the new, a frozen item or a check's config changed in the move fails, and the same move with no change passes."
    non_functional_requirements:
      - "RELIABILITY: the freeze gates exempt a file brand new at its path (validate_check_lifecycle.py's docstring; validate_schedule._content_at returns None for a missing path), so without this the move commit bypasses the freeze silently - including any past-date change made in the same commit."
      - "MAINTAINABILITY: one map, read by one helper every reader calls, alive for one push; nothing about the move is left in the code afterwards."
      - "RELIABILITY, ACCEPTED RISK (Keith, 2026-11-01): a branch or worktree cut before the move loses freeze coverage once the map is gone, so it must be rebased onto the move before it is pushed. Nothing refuses such a push mechanically."
      - "CONFIGURATION, NOT STATE: the map is authored and reviewed with the move."
    dependencies:
      - REQ-PIPE-342
    decisions:
      - "ONE MAP FOR EVERY BASE-COMMIT READ (architect BLOCKING 2): v1 fixed only the agreement-freeze and check-lifecycle gates; six readers lose the old file after the move. REJECTED a per-reader fix, which is six chances to miss one."
      - "DELETED IN THE NEXT PUSH, NOT LEFT INERT (Keith, 2026-10-31: 'I don't want moved paths hanging around'): every gate compares a push with its own base (MOTHMAN_DIFF_BASE = github.event.before) and _version_added_on walks only base..HEAD, so the map fires only for the push that carries the move; the next push deletes it with the code that reads it. REJECTED leaving it inert at the top of assets/, and REJECTED deriving the moves from git's rename detection, which cannot see a divided file and would leave a path rule in code."
      - "FIRES ONLY FOR THE PUSH CARRYING THE MOVE (architect v3 BLOCKING 1): v3's 'for any push whose base predates the move, however many commits later' and 'removable once no open branch predates the move' contradicted the deletion and are REMOVED."
      - "A ONE-OFF CHECK, NOT A KEPT ABSENCE TEST (architect v3 NIT; CLAUDE.md test rule 2): criterion 4 confirms the deletion once, in the push that makes it. A post-move base is recognised by assets/ existing at diff_base()."
      - "A BRANCH CUT BEFORE THE MOVE MUST BE REBASED BEFORE IT IS PUSHED - AN ACCEPTED RISK (Keith, 2026-11-01). The scoper noted that nothing refuses such a push mechanically and recommended leaving it so; Keith signed v4 on that basis. REJECTED keeping the map so long-lived branches stay covered, which is the inert map he declined."
    open_questions: []

  - id: REQ-PIPE-345
    title: "Each data asset declares one baseline calendar; no collection or dataset names a calendar or dates of its own, and a gate refuses anything faster than the baseline"
    date_written: "2026-10-31"
    story: "As whoever maintains the delivery agreement, I want each asset to nominate one baseline calendar that every dataset fits around, owing all or some of its periods, so that a period means one thing within an asset and nothing can quietly run on a faster cadence than the asset's releases."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: one baseline calendar per asset; #109 settled). Drafted by delivery-scoper 2026-10-31, v2 the same day. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL let an asset's calendar.yaml declare at most one calendar, its baseline - effective-dated and versioned as calendars are today - and SHALL accept none only WHERE every dataset of the asset declares no calendar (REQ-PIPE-110 criterion 36)."
      - "THE SYSTEM SHALL put every dataset of the asset that does not declare no calendar (REQ-PIPE-106) on the asset's baseline calendar, and SHALL NOT read a calendar named on a collection or a dataset."
      - "IF an asset's calendar.yaml declares a second calendar, a collection or dataset names a calendar, or a dataset states authored dates of its own, THEN `mothman check` SHALL fail, naming the asset, the item and the file, and saying: a dataset may not be faster than its asset's baseline; a slower one owes a subset of the baseline's periods, stated under participates; to go faster, change the asset's baseline."
      - "THE SYSTEM SHALL express a dataset slower than the baseline only as participation in a subset of the baseline's periods, under participates in its asset's calendar.yaml, with the reason a list of some periods already needs (REQ-PIPE-110 criterion 8)."
      - "THE SYSTEM SHALL hold one period schema per baseline period in an asset's database, and SHALL never create a schema for a period not on its asset's baseline calendar."
      - "THE SYSTEM SHALL NOT name a calendar in shared code: where code needs a dataset's periods it SHALL ask for the asset's baseline, and where it needs to know whether the baseline is a cadence rule or authored dates it SHALL ask the baseline's kind - replacing generator/scenario_injection.py's test that a calendar is named 'daily' (line 1315 today) and generator/collections/child_protection.py's request for the calendar named 'quarterly' (line 736 today; assets/quarterly/synthetic/collections/child_protection.py after the move)."
      - "THE SYSTEM SHALL have a gate test, seen failing first, that feeds the schedule validator an asset configuration with a monthly calendar beside a quarterly baseline, a collection naming it, and a dataset with its own authored dates, and asserts each is refused with the message of criterion 3 - proving the refusal by a test, not by a dataset."
      - "WHEN the configuration is moved into the two asset folders, THE SYSTEM SHALL produce for every dataset exactly the rounds, slots, instants and periods it produces today, compared against tests/fixtures/calendar_move_pin.json round by round and not re-captured."
    non_functional_requirements:
      - "SCALE: at about 30 quarterly datasets, roughly 70 percent owing every quarter and the rest once or twice a year, one baseline plus participation is the shape that stays legible; thirty calendars would drift."
      - "MAINTAINABILITY: removes branches rather than adding one - collection and dataset calendar resolution and per-dataset authored dates go, with their tests (CLAUDE.md test rule 2)."
      - "PRIVACY AT REAL SCALE: a period schema never again holds Birth Registrations beside Child Protection records - period_schema.py's own docstring calls that co-location the most sensitive artefact the design creates."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-049
      - REQ-PIPE-110
      - REQ-PIPE-181
    decisions:
      - "ONE BASELINE CALENDAR PER ASSET (Keith, 2026-10-31): 'each data asset needs to have a single baseline calendar'. It makes the period control unambiguous, since a period means one thing within an asset."
      - "WHAT A PERIOD SCHEMA IS, SETTLED (Keith, 2026-10-31, answering #109; none of the three options put): 'a data asset has to nominate a baseline calendar, whether that's quarterly or monthly or daily. And then everything else has to fit around that.' A period schema is one baseline period, which is one release. REJECTED per-cadence schemas, with or without a release layer on top."
      - "NOTHING FASTER THAN THE BASELINE (Keith, 2026-10-31): a quarterly asset cannot hold a monthly dataset. SLOWER IS PARTICIPATION IN A SUBSET OF BASELINE PERIODS: owed in two quarters a year, or annually, meaning one quarter a year. TO GO FASTER, CHANGE THE ASSET: change the baseline to monthly and re-express every quarterly dataset as owed only in certain months. Changing an asset's baseline is NOT built here; it is a future requirement."
      - "THE REFUSAL IS PROVEN BY A GATE TEST, NOT BY A DATASET (Keith, 2026-10-31): criterion 7."
      - "PER-DATASET AUTHORED DATES ARE RETIRED (delivery-scoper, following Keith's rule): REQ-PIPE-049 criterion 7 and REQ-PIPE-110 criterion 25 let a dataset replace its calendar's dates, a second calendar by another name. No dataset uses it today. REJECTED keeping it constrained to a subset of baseline dates, which is participation stated twice."
      - "THE PER-COLLECTION CALENDAR CHOICE GOES (Keith, 2026-10-31): REQ-PIPE-110 criteria 10 and 11 and REQ-PIPE-181 criterion 9 have nothing left to choose between. files_go_to_period stays on the collection (REQ-PIPE-320): an offset is not a cadence."
      - "AN ASSET WITH NO CALENDAR STAYS POSSIBLE (delivery-scoper, from CLAUDE.md's project-extraction shape): 'at most one', with REQ-PIPE-110 criterion 36's empty list kept."
      - "THE calendar_differs RULE BECOMES UNREACHABLE (delivery-scoper): with every calendared dataset of an asset on one baseline, REQ-PIPE-331 criterion 2's not-applicable branch and REQ-QAC-330 criterion 6's calendar clause can never fire. Amendments A13 and A14 retire them and their tests."
      - "SHARED CODE NAMING A CALENDAR (architect SHOULD): criterion 6. After the split the calendar names happen to match the asset ids, which is exactly why a name test in shared code must go - it would read as working."
    open_questions: []

  - id: REQ-PIPE-346
    title: "A dataset owes a subset of its baseline's periods, named in the baseline's own terms - delivery months on an authored calendar, weekdays on a daily one"
    date_written: "2026-10-31"
    story: "As whoever maintains the delivery agreement, I want participates to name which of the baseline's periods a dataset owes in whatever terms that baseline has - months for a quarterly asset, weekdays for a daily one - so that a weekly dataset on the daily asset is stated as plainly as a twice-yearly one on the quarterly asset."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: a weekly dataset in the daily asset needs NEW participation by weekday). Drafted by delivery-scoper 2026-10-31. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL read participates as a subset of the baseline calendar's rounds, named in the vocabulary of the baseline calendar version in force on each round's date - the month of the round's calendar date for an authored calendar, and the weekday of the round's calendar date, on the asset's clock, for a daily cadence rule - or as the keyword all."
      - "THE SYSTEM SHALL accept weekday names in full, case-insensitively, and SHALL NOT accept an abbreviation, a number or a positional index, as month names are accepted today (REQ-PIPE-049 criterion 6)."
      - "IF participates names months for a round whose calendar version is a daily rule, or weekdays for a round whose calendar version is authored, THEN THE SYSTEM SHALL reject the configuration, naming the dataset, the version and the vocabulary that version takes, checking each participation version against every calendar version it overlaps."
      - "THE SYSTEM SHALL apply every existing participation rule to weekdays exactly as to months - the reason a list of some needs, the restate rule, inherit and participation_defaults value by value (REQ-PIPE-181), the newly-owed refusal, which SHALL name the rounds newly owed in the version's own vocabulary, and days_before, naming the weekday of the round's calendar date whatever days_before says."
      - "THE SYSTEM SHALL treat a period a dataset owes nothing in by weekday exactly as one it owes nothing in by month - inherited when the period is born (REQ-PIPE-098), and an arrival in it classified as for any round the dataset does not supply in - with no rule of its own."
      - "THE SYSTEM SHALL show, in the terminal's Calendar entry and `mothman schedule show --dataset <id> --on <date>` (REQ-PIPE-181 criterion 13, REQ-PIPE-327), the weekdays a dataset supplies on, in the form months are shown."
      - "THE SYSTEM SHALL have tests, seen failing first, of a weekday list resolved on a daily calendar, each refusal of criterion 3, an abbreviation refused, and a weekly dataset's non-owed days inheriting its newest supply."
    non_functional_requirements:
      - "GENERIC, NOT A WEEKLY FEATURE (Keith's no-special-case rule): a subset of the baseline's periods in the baseline's own terms, so a later vocabulary - days of the month on a daily baseline, say - is one more entry in one place, not a new key."
      - "SCALE ON A DAILY ASSET: a weekly dataset owes nothing on six days of seven, each inherited by a view created when the day's schema is born - about six inheritance views a week per weekly dataset, measured by REQ-PIPE-352's bootstrap figures."
      - "CONFIGURATION ONLY: resolving participation reads no database (REQ-PIPE-110 criterion 23)."
    dependencies:
      - REQ-PIPE-345
      - REQ-PIPE-110
      - REQ-PIPE-181
      - REQ-PIPE-098
    decisions:
      - "WEEKDAY PARTICIPATION IS NEW AND NEEDED (Keith, 2026-10-31): participates names months only today, and REQ-PIPE-110 criterion 7 refuses months on a cadence-rule calendar."
      - "ONE KEY, ITS VOCABULARY SET BY THE BASELINE (delivery-scoper): criterion 1. REJECTED a second key (participates_weekdays), which every reader would have to learn and which two versions could both state."
      - "THE WEEKDAY OF THE ROUND'S CALENDAR DATE, NOT OF THE DUE INSTANT (delivery-scoper, following REQ-PIPE-110 criterion 5's month rule): with days_before 1, a Monday supply due 22:00 on Sunday is still a Monday round."
    open_questions: []

  - id: REQ-DASH-347
    title: "The dashboard words a dataset's participation in its baseline's own terms - 'Weekly (Monday)', 'Weekdays', 'Not owed — it supplies only on Mondays' - wherever it words months today"
    date_written: "2026-10-31"
    story: "As a data team leader glancing at the daily asset, I want a weekly dataset's tile and its quiet days to say 'Weekly' and which day, so that six quiet days a week read as expected rather than as something missing."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: a weekly dataset in the daily asset); dashboard UX review NIT ('Weekdays'). Drafted by delivery-scoper 2026-10-31, v2 the same day. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHERE a dataset participates by weekday, THE SYSTEM SHALL label its cycle on its SLA tile 'Weekly (<weekday>)' for one weekday, 'Weekdays' for Monday to Friday exactly, '<N> days a week (<weekdays>)' for any other two to six, and 'Daily' for all seven, with its delivery time as REQ-DASH-182 criteria 7 and 11 word it (PROPOSED wording)."
      - "THE SYSTEM SHALL word a participation row for a day a dataset owes nothing in as 'Not owed — it supplies only on <weekdays>', from REQ-DASH-182 criterion 14's one label function, and SHALL show consecutive such days as one run, in days, as REQ-DASH-182 criterion 13 does."
      - "THE SYSTEM SHALL show the authored reason once, on the SLA tile, as for month participation (REQ-DASH-182 criterion 11)."
      - "THE SYSTEM SHALL have a tests-js test of each label form of criterion 1, and a real-browser test that first asserts the weekly test dataset is on the page and the day on show is one it owes nothing in, then asserts its row reads neither failing, stale nor 'No data' (REQ-DASH-182 criterion 15's guard, applied to it)."
    non_functional_requirements:
      - "SCALE: at about thirty daily-asset datasets, a weekly one's quiet days collapse into runs (criterion 2), so its history stays readable."
      - "COMPUTED FROM CONFIGURATION AND RECORDED RESULTS ONLY (REQ-DASH-182 criterion 5)."
      - "ONE VOCABULARY: any status word this requirement shows follows REQ-DASH-359 (Pass / Warn / Fail)."
    dependencies:
      - REQ-PIPE-346
      - REQ-DASH-182
      - REQ-DASH-359
    decisions:
      - "WORDING FOLLOWS REQ-DASH-182 CRITERION 8'S FREQUENCY WORDS (delivery-scoper, PROPOSED), with 'Weekdays' for Monday to Friday (UX NIT) rather than '5 days a week'."
      - "THE PERIOD VIEW AND THIS ROW AGREE (UX SHOULD, the 356/347 clash): on a not-owed day the composition table's kind is 'Inherited from <Monday>' and its sub-line is this requirement's 'Not owed — it supplies only on Mondays' (REQ-DASH-356 criterion 8). One sentence, two places."
    open_questions: []

  - id: REQ-QAC-348
    title: "The quarterly asset gains Department of Health's Cancer collection, one annual dataset owed in the August round through participates as built, with its contract and checks"
    date_written: "2026-10-31"
    story: "As Keith designing the period control, I want a real dataset on the quarterly asset that is owed only once a year, so that the period view is designed and seen working against an off-baseline cadence from the start, not retrofitted to one."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: #109's test datasets replaced, (a)); Keith's answer to draft Q3, 2026-10-31, naming it 'Cancer'. Drafted by delivery-scoper 2026-10-31, v2 the same day. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL declare in the quarterly asset's hierarchy (assets/quarterly/data-asset.yaml), under Department of Health, a new collection holding one dataset (PROPOSED for confirmation at sign-off: collection cancer 'Cancer', short can, run prefix can_run_; dataset cancer-notifications 'Cancer Notifications', table cancer_notifications, one file cancer_notifications.csv), with its delivery boundary and an exact arrival pattern."
      - "THE SYSTEM SHALL declare its participation in the quarterly asset's calendar.yaml as participates [August] with a reason, at files_go_to_period 0, with its expected time and grace on its collection's participation_defaults, owed from the first quarter of Child Protection's synthetic history."
      - "THE SYSTEM SHALL declare its ODCS contract and its Soda and Evidently checks in assets/quarterly/department-of-health/ (REQ-QAC-241) and its dbt models and tests in assets/quarterly/dbt/models/cancer/ and tests/cancer/ (REQ-QAC-368), with at least one active check in each of the four tools on its own rows, each check's description, failure_indicates and technical_note written to docs/check-authoring-rules.md."
      - "THE SYSTEM SHALL say in its contract's description that it is synthetic, a test dataset made to exercise annual participation, and stands in for no real supply."
      - "THE SYSTEM SHALL add the collection's QA adapter (assets/quarterly/collections/cancer.py) as a short adapter on Emergency Department's pattern, loaded by path (REQ-PIPE-369), naming no other collection."
      - "WHEN `mothman check` runs, THE SYSTEM SHALL pass every configuration gate with the collection present, with no exemption added for it."
    non_functional_requirements:
      - "SYNTHETIC ONLY: no real cancer, patient or diagnosis data; at real scale cancer registrations are among the most sensitive health data an asset could hold, which this stand-in assumes nothing about."
      - "NOTHING CODED FOR ONE COLLECTION: the registry, adapter, provider and dashboard pick it up by configuration."
      - "BOOTSTRAP COST: about one supply a year across the quarterly history (about 14, plus resupplies) on the quarterly stream, the critical path; measured by REQ-PIPE-352."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-345
      - REQ-QAC-241
      - REQ-PIPE-240
      - REQ-QAC-368
      - REQ-PIPE-369
    decisions:
      - "AN ANNUAL DATASET IN THE QUARTERLY ASSET, USING participates AS BUILT (Keith, 2026-10-31, (a)). REJECTED #109's monthly dataset, now refused by design (REQ-PIPE-345). Annual rather than twice-yearly because cp-case-workers already participates [February, August]."
      - "ITS OWN ONE-DATASET COLLECTION WITH ITS OWN PROVIDER, NAMED 'Cancer' (Keith, 2026-10-31, draft Q3 (a)): no existing collection's generated bytes change. REPLACES v1's School Census. REJECTED (b), a new dataset inside an existing collection."
      - "UNDER DEPARTMENT OF HEALTH, OWED IN AUGUST (PROPOSED for Keith's sign-off, 2026-10-31)."
    open_questions: []

  - id: REQ-GEN-349
    title: "The Cancer collection's provider writes one supply a year in its August round, the ordinary severity mix, and scenarios for an arrival in a quarter not owed and an inherited quarter"
    date_written: "2026-10-31"
    story: "As Keith planting scenarios, I want the annual dataset's synthetic history to hold ordinary supplies and the awkward cases an annual cadence invites, so that the period view can be seen on a quarter it is owed in and on the three it is not."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: the replacement test datasets); draft Q3 answer. Drafted by delivery-scoper 2026-10-31, v2 the same day. v3 2026-10-31 (the assets/<asset>/ layout), v4 2026-11-01 (the v3 reviews and Keith's answers), regenerated 2026-11-01 after the container loss from docs/drafts/decisions-2026-11-01.md. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL add a provider for the Cancer collection (assets/quarterly/synthetic/collections/cancer.py), loaded by path (REQ-GEN-370 criterion 2) and importable without pandas or numpy, declaring a seed range disjoint from every other provider's in its asset (REQ-GEN-246's gate as amended by A39; PROPOSED [73000, 74000))."
      - "THE SYSTEM SHALL write one delivery for each round the dataset owes across the quarterly history, received inside its claim window and before its due time, never sharing a receipt instant with another delivery (REQ-GEN-334 criterion 13's refusal applied)."
      - "THE SYSTEM SHALL draw the ordinary severities from its own seed with the collections' mix - about a quarter warning, at least one failing with a passing resupply five to twenty days later, the oldest supply passing - and SHALL have the real tools confirm every planned verdict (REQ-GEN-186)."
      - "THE SYSTEM SHALL plant, each as a named scenario in plans/supply-model.md's register: a supply received in a round the dataset owes nothing in; and a quarter it owes nothing in standing on the previous August's supply, to be seen with the period control set to that quarter."
      - "WHEN its generator runs twice with the same seed and configuration, THE SYSTEM SHALL write byte-identical deliveries and receipts both times, and adding the provider SHALL change no byte any other collection writes (REQ-TEST-239's compare)."
    non_functional_requirements:
