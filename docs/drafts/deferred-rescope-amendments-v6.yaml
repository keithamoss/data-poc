REQ-PIPE-363:
  acceptance_criteria_replace:
    1: "THE SYSTEM SHALL take the asset a command acts for from MOTHMAN_ASSET, naming an asset folder under assets/ by its bare name, beside MOTHMAN_ENVIRONMENT and MOTHMAN_SUPPLY_DSN (SETTLED by Keith 2026-11-01, on REQ-PIPE-091's precedent); a one-off is named by `mothman one-off`'s `--id` or chosen in its TUI (REQ-PIPE-446 criterion 3), and WHERE MOTHMAN_ASSET is set while a one-off is named, it SHALL name that same one-off. AMENDED 2026-11-21 by REQ-PIPE-446. v6: PROVISIONAL on question 2 of the v6 changes (whether MOTHMAN_ASSET may name a one-off at all)."
    2: "WHEN mothman starts, THE SYSTEM SHALL build the command groups of the selected asset's collections only, and SHALL build none and read no asset configuration WHILE MOTHMAN_ASSET is unset, names no asset folder, or a one-off is selected (REQ-PIPE-446 criterion 8). AMENDED 2026-11-21 by REQ-PIPE-446 (v6, delivery-architect A and L)."
    4: "IF a command that is not one of the tool commands of criterion 5 is given WHILE MOTHMAN_ASSET is unset or names no asset or one-off folder, THEN THE SYSTEM SHALL answer not 'No such command' but that MOTHMAN_ASSET is not set, or names no folder, naming the variable, listing the folder names found under assets/, saying how many one-offs of each kind there are - leaving out any kind with no folders - and how to list them, and saying there is deliberately no default, in the form environments.current() uses for MOTHMAN_ENVIRONMENT - reading nothing but those folder names. AMENDED 2026-11-21 by REQ-PIPE-446 (v6: a kind with no folders left out, Keith's yes to delivery-cli-ux D3)."
    5: "WHILE MOTHMAN_ASSET is unset, THE SYSTEM SHALL run `mothman check`, `mothman --help`, every `mothman one-off` command (REQ-PIPE-442 criterion 1) and every command that reads no asset configuration and opens no connection, and `mothman --help` SHALL say, as one line inside its Collections panel (REQ-TEST-252 criterion 2's two-panel layout kept), 'Set MOTHMAN_ASSET to one of: <the asset folder names found> - or one of <n> <kind plural> (mothman one-off list)', one count per kind with folders and every kind with none left out, in the same words as criteria 4 and 6 (wording SETTLED by Keith 2026-11-01; the one-off half AMENDED 2026-11-21, Keith's yes to delivery-cli-ux D3)."
    6: "IF a command that reads asset configuration or opens a connection runs WHILE MOTHMAN_ASSET is unset or names no asset or one-off folder, THEN THE SYSTEM SHALL refuse before reading any asset configuration or opening any connection, naming the variable, every asset folder found and how many one-offs of each kind there are - leaving out any kind with no folders - and SHALL NOT fall back to a default, a last-used value or the only asset present - except every `mothman one-off` command (REQ-PIPE-442 criterion 1), which selects its one-off by `--id` or in its TUI. AMENDED 2026-11-21 by REQ-PIPE-446 and REQ-PIPE-442 (v6: the exemption widened from open and list to the whole group, following Keith's CLI Q1 and Q2; a kind with no folders left out, Keith's yes to D3)."
  acceptance_criteria_append:
    11: "THE SYSTEM SHALL have tests, seen failing first, of `mothman --help` naming a one-off count per kind and leaving out a kind with no folders, of criterion 4's and 6's refusals doing the same, of a collection command refused while a one-off is selected with no collection group built, and of every `mothman one-off` command running with MOTHMAN_ASSET unset. ADDED 2026-11-21 by REQ-PIPE-446 (v6)."
  wording_for_keith: "NEEDS KEITH'S EXPLICIT YES AGAIN. v5's wording for criteria 4 and 6 was APPROVED (round 6); v6 changes it in two ways: (i) a kind with no folders is left out, and criterion 5's --help line uses the same words - both Keith's yes to delivery-cli-ux D3, 2026-11-21, but the exact text of criterion 5 is new; (ii) criterion 6's exemption now covers the whole `mothman one-off` group. AND AN OPEN POINT (question 2 of the v6 changes): the approved words 'Set it to one of: daily, quarterly - or one of 37 extractions (mothman one-off list)' tell a person to SET MOTHMAN_ASSET to an extraction, while Keith's CLI Q2 answer names a one-off by --id. Kept as approved until he says which; the recommended rewording is '... Set it to one of: daily, quarterly. For one of 37 extractions, use mothman one-off.'"
  decisions_add:
    - "ONE-OFFS ARE NAMED BY THEIR BARE ID (REQ-PIPE-446, 2026-11-21): one namespace across assets and every kind, a clash refused; the refusal counts one-offs per kind. REJECTED a prefix, since data/, reports/ and supply_<name> are one namespace either way."
    - "v6, A ONE-OFF IS NAMED BY --id (Keith 2026-11-21, CLI Q2): REPLACES v5's 'MOTHMAN_ASSET names a one-off folder' in criterion 1; MOTHMAN_ASSET, if set, must name the same one-off (REQ-PIPE-446 criterion 3)."
    - "v6, EVERY `mothman one-off` COMMAND RUNS WITH NO ASSET SELECTED (REQ-PIPE-442 criterion 1): v5 exempted open, because the one-off does not exist yet, and list; Keith's CLI Q1 (bare `mothman one-off` needs no asset) and Q2 (--id) extend it to the group. REPLACES v5's 'TWO ONE-OFF COMMANDS RUN WITH NO ASSET SELECTED'."
    - "v6, NO COLLECTION GROUPS FOR A ONE-OFF (delivery-architect A and L): cli/app.py builds groups at import, so criterion 2 says none are built while a one-off is selected."
    - "v6, A KIND WITH NO FOLDERS IS LEFT OUT, AND --help MATCHES (Keith 2026-11-21, yes to both delivery-cli-ux D3 edge cases): '0 extractions' is noise, and --help saying less than the refusal would be two answers to one question. REJECTED the architect's L 'leave criterion 5 deliberately'."
