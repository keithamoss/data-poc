    - criterion: 5
      date: "2026-11-21"
      by: Keith
      replaced_by: [REQ-PIPE-250]
      reason: "One requirement owns one claim (REQ-PIPE-403's decisions, Keith 2026-11-14): the per-asset 12-minute budget is REQ-PIPE-250 criterion 2, as amended by this requirement on 2026-11-15, and its measurements are REQ-PIPE-403's evidence."
