# DRAFT - plans/running-thoughts.md #92 (the "you told us / we built" view of
# road-testing feedback), scoped by delivery-scoper 2026-10-14 and revised the
# same afternoon with Keith's answers to Q1-Q8 and RQ1-RQ3, then with the
# delivery-architect and delivery-dashboard-ux reviews and Keith's answers to
# them (all option A). See summary.md, 'Reviews folded'.
# A PROPOSAL for Keith's sign-off, not a settled requirement. Nothing here is
# in requirements.yaml.
requirements:
- id: REQ-DOCS-219
  title: "Every road-testing entry carries a short feedback card - what was raised, what we heard, what we built, evidence - checked by mothman check and kept when the entry lands"
  date_written: "2026-10-14"
  story: "As Keith going back to the person who road-tested the PoC, I want every entry in plans/road-testing.md to carry a four-line plain-language card saying what was raised, what we took it to mean, what we built and where to see it, kept after the work lands, so that I can talk them through how each piece of feedback was handled without re-reading the analysis or digging through git."
  moscow: should
  status: not_started
  source: "Keith, plans/running-thoughts.md #92, 2026-10-13 evening (the feedback came from someone he showed the PoC to; he wants a short, high-level answer per item; nothing deleted as items are built; the view is fed by road-testing.md itself), and his answers to delivery-scoper's eight questions, 2026-10-14 afternoon. Drafted by delivery-scoper 2026-10-14. Reviewed the same afternoon by delivery-architect and delivery-dashboard-ux (docs/drafts/unsigned-triage/review-architect.md, docs/drafts/road-testing-feedback/review-dashboard-ux.md); Keith answered RQ1-RQ3 and the reviews' questions, all option A, and they are folded in."
  acceptance_criteria:
  - "THE SYSTEM SHALL recognise a feedback card in a numbered entry of plans/road-testing.md as one contiguous bullet list placed directly after the entry's opening paragraph, whose lines are labelled, in this order, `- **You told us:**` or `- **We noticed:**` (exactly one of the two), `- **What we heard:**`, `- **What we built:**`, `- **Evidence:**` and `- **Card status:**`, each label appearing at most once."
  - "IF a numbered entry of plans/road-testing.md carries no feedback card, THEN `mothman dashboard validate-feedback` SHALL fail naming the entry number, whoever spotted the entry."
  - "THE SYSTEM SHALL NOT make a feedback card from any plans file other than plans/road-testing.md."
  - "IF a card lacks its first line or its `What we heard` line, or carries a label out of order or twice, THEN the validator SHALL fail, naming the entry number and the label at fault."
  - "WHERE a card has no `What we built` line, THE SYSTEM SHALL accept it as a card for something not yet built, with or without an `Evidence` line, and SHALL NOT require placeholder text such as 'Not yet' in its place."
  - "IF a card carries a `What we built` line and no `Evidence` line, and its `Card status` is not `parked`, `wont-do` or `not-reproduced`, THEN the validator SHALL fail naming the entry, so that no card claims a build it cannot point at."
  - "THE SYSTEM SHALL accept as an `Evidence` item only a requirement id (REQ-<CODE>-NNN), a road-testing sprint written `sprint <n>`, or a markdown link `[label](target)` whose target is a relative dashboard address beginning `?` or `#/`, items separated by semicolons; IF an item is anything else - an absolute URL, a bare path, a commit hash, free text - THEN the validator SHALL fail naming the item."
  - "IF an `Evidence` link's address names a requirement through the query string (`req=`), THEN the validator SHALL fail naming the link and the bare id to write instead, so that a requirement is cited one way only and its link is built by REQ-DASH-222's single address function."
  - "IF an `Evidence` item names a requirement id that requirements.yaml does not hold, THEN the validator SHALL fail naming the id; IF it names a retired requirement, THEN the validator SHALL fail naming the requirement that replaced it."
  - "IF a dashboard link's route names an agency, collection or dataset that contract/data-asset.yaml's hierarchy does not hold, or a route the dashboard does not have, THEN the validator SHALL fail naming the link - reading committed configuration only, never the database."
  - "THE SYSTEM SHALL accept `fixed`, `parked`, `wont-do` and `not-reproduced` as the only values of a `Card status` line; IF it carries any other value, or carries `fixed` alongside a requirement id in `Evidence`, THEN the validator SHALL fail."
  - "IF a card's status is `parked`, `wont-do` or `not-reproduced`, THEN the validator SHALL require a `What we built` line saying why, in place of what was built, so that a card is never silent about why nothing happened."
  - "IF plans/road-testing.md is missing, or holds no numbered entry at all, THEN the validator SHALL fail rather than report a clean pass over nothing."
  - "THE SYSTEM SHALL run `mothman dashboard validate-feedback` as a named gate of `mothman check` and as a step of .github/workflows/validate-config.yml."
  - "WHEN a road-testing entry lands, THE SYSTEM SHALL keep the entry's numbered title line and its card, set the entry's status to `done`, and remove the rest of its prose once its decisions are in the owning requirements, as for any other plans entry."
  - "THE SYSTEM SHALL amend, in the same change, plans/road-testing.md's introduction (to say that every entry is filed with a card and that the card stays when the entry lands) and CLAUDE.md's 'requirements.yaml is the permanent artifact' bullet (to name the card as the one piece of a landed entry that stays, and why), in wording Keith has approved before it is applied."
  - "THE SYSTEM SHALL restore, as card-only entries with status `done`, each entry deleted from plans/road-testing.md that this requirement's decisions list, numbered after the file's highest number, each carrying in its status tag the date the deleted entry was first raised and saying the number it had; the card text SHALL be rebuilt from the last commit that held the entry and from the requirements and commits that resolved it."
  - "THE SYSTEM SHALL NOT name, describe by role or employer, or quote verbatim the person who gave the feedback, in any card or in the validator's messages."
  - "THE SYSTEM SHALL take the date an entry was first raised from the date in its `[status, date]` tag, and plans/road-testing.md's introduction SHALL say, in the wording criterion 16 brings to Keith, that this date is the date first raised and is not changed when the entry's status changes."
  - "IF a card's `Evidence` names a road-testing sprint that the list of proposed sprints in plans/road-testing.md's introduction does not hold, THEN the validator SHALL fail naming the item."
  - "IF an `Evidence` link's address carries `in-place-on=` with anything other than a date written YYYY-MM-DD, THEN the validator SHALL fail naming the link; a well-formed date SHALL be accepted, so that a card can point at what the dashboard showed on a past date."
  - "THE SYSTEM SHALL make criterion 7's relative-address check inside the one card parser the validator and the dashboard build share (dashboard/plans_md.py), so that a card whose target is not a relative dashboard address cannot reach the build even if the gate is skipped."
  non_functional_requirements:
  - "PRIVACY, PUBLIC REPO: the repository and the published dashboard are both public, so a card speaks of 'you' and never identifies the reviewer - no name, role, agency or verbatim quote. The validator cannot detect a name; this is an authoring rule, stated in road-testing.md's introduction."
  - "CONFIGURATION, NOT STATE: the cards are authored prose in a committed plans file, and the validator reads only plans/road-testing.md, requirements.yaml and contract/data-asset.yaml - no database, no data/, no reports/."
  - "FAIL LOUDLY: a missing or malformed card fails the gate, naming the entry, rather than being skipped. plans_md.py's own skip-what-does-not-match philosophy is right for historical prose and wrong here, where a silently dropped card is a piece of feedback Keith forgets to mention."
  - "FILING COST: because every entry needs a card, a new sighting is filed with at least its first line and a `What we heard` line from the start. That is two short lines on top of a sighting, and is the ongoing price of 'every entry' - stated in the file's introduction so the gate's failure is never a surprise."
  - "MAINTAINABILITY: no new dependency. One small parser reused by the validator and the dashboard build, so the two can never disagree about what a card is. It lives in dashboard/plans_md.py, built on _parse_numbered_items, which already reads every numbered entry with its tag (delivery-architect, 2026-10-14)."
  - "EPHEMERAL: expected to live a few months. Retiring it is deleting the cards' lines, this gate, REQ-DASH-220's tab and the CLAUDE.md exception in one change; nothing else may come to depend on the card format."
  - "SCALE: ten current entries plus eleven restored ones, so twenty-one cards. No paging, filtering or indexing is needed or proposed."
  - "MOTHMAN ONLY: the validator is invoked as `mothman dashboard validate-feedback`, never as a bare script, per CLAUDE.md's standing rule - beside the other file validators in `mothman dashboard`, since cli/plans.py's own docstring keeps `mothman plans` for 'where has the work got to'."
  dependencies: []
  decisions:
  - "EVERY ENTRY GETS A CARD, WHOEVER SPOTTED IT (Keith, 2026-10-14, Q1). The gate requires a card on every numbered entry rather than recognising cards opt-in, so there is no provenance judgement for the gate or the author to make. REJECTED: the scoper's recommendation, a card only on entries carrying a `You told us` line, with Keith confirming which entries were the reviewer's."
  - "NOT BUILT YET IS AN ABSENT LINE, NOT A SENTINEL. An entry with nothing built simply has no `What we built` line, and the tab shows 'Not built yet' and derives Heard or Planned from its evidence. REJECTED: a typed 'Not yet' value - a sentinel string is a second way to say the same thing, and drifts ('Not yet', 'nothing yet', 'TBC') unless the validator polices its spelling."
  - "THE FIRST LINE HAS TWO LABELS (Keith, 2026-10-14, RQ1, option A). With every entry carded, entries a session, critic or regenerate found (#7, #13, #15 to #19) would otherwise tell the reviewer 'You told us' something they never said, on a public page. `We noticed` says the same thing honestly; the author picks one per card and the gate requires exactly one. REJECTED (option B): `You told us` on every card, which is simpler and is what he chose knowing the headings."
  - "KEEP THE CARD, DELETE THE REST (Keith, 2026-10-14, Q3, option A). A card does not compete with a requirement - it is four plain lines and a pointer at the requirement, and its status (REQ-DASH-220) is derived from that requirement rather than typed - so it can stay without re-creating the drift CLAUDE.md's delete-as-it-lands rule exists to stop. The analysis prose still goes. The wording change to road-testing.md's introduction and CLAUDE.md comes to Keith for approval before it is applied. REJECTED: keeping whole entries (the two-records problem, in a file already 1,778 lines); a separate plans/feedback.md (Keith asked for road-testing.md itself to feed the tab)."
  - "WHAT WE HEARD IS ITS OWN LINE (Keith, 2026-10-14, Q4, option A). A short line in our own words; the entries' existing analysis is not something to read aloud. REJECTED: reusing the entry's bold headline, which is already our interpretation and would make the first two lines read the same."
  - "THE BLOCK IS A LABELLED BULLET LIST. plans_md.py already keeps `- ` bullets as separate lines, so the Plans tab renders the card readably with no change, and the parser is a label match rather than a new syntax. REJECTED: YAML front matter inside the markdown (a second format, rendered as noise by the Plans tab); a sidecar YAML file keyed by entry number (two files to keep in step, against Keith's 'fed by road-testing.md itself')."
  - "EVIDENCE IS RELATIVE DASHBOARD LINKS AND BARE REQUIREMENT IDS ONLY. Relative links work from GitHub Pages and from a plain file:// open alike, and can be checked against configuration. A requirement is cited by its bare id and REQ-DASH-220 turns it into a link through REQ-DASH-222, so the address format lives in one place. REJECTED: GitHub commit or file links (an absolute URL cannot be validated offline, may not be reachable from a government network, and points the reviewer at code rather than at what they saw); hand-written `?panel=requirements&req=` links (a second way to cite a requirement)."
  - "RESTORE THE DELETED ENTRIES AS CARDS UNDER NEW NUMBERS (Keith, 2026-10-14, Q2, option A). Card-only, status done, rebuilt from git and the requirements that fixed them. New numbers because the file's numbers have been reused - 'Client reference three times' (added fcf9133, 2026-09-26) and 'Arrived at is the earliest row' (added 8392873, 2026-09-27) were both #14 at the same time - so restoring under the old number would collide; each card says the number it had."
  - "ALL ELEVEN DELETED ENTRIES COME BACK (Keith, 2026-10-14, RQ2, option A), each rebuilt from the commit that last held it (git show <sha>:plans/road-testing.md): old #5 'times shown in UTC, not Perth time' (35edcab; REQ-DASH-071), #8 'closing a check panel jumped back two levels' (e6aa094; defect fix 03cb93e, status fixed), #11 'supply-history columns out of line, raw dates' (e6aa094; 5c5a616 and REQ-DASH-071), the first #14 'Arrived at was the earliest row' (8a942e7; REQ-PIPE-080), the second #14 'Client reference three times' (e6aa094; REQ-QAC-037), #7 'a misconfigured Soda check passed silently' (e99ae3c; REQ-QAC-001, REQ-QAC-002), #13 'Soda Core cannot run a change-over-time check' (8a942e7; REQ-QAC-108), #15 'bootstrap --force no longer reproduces the same content' (8a942e7; REQ-PIPE-144), the unnumbered 'seventeen missing supply items in a column' (8a942e7; REQ-DASH-133), #17 'the same trial gave different verdicts once' (cd57aaf; status not-reproduced) and #18 'a past date warned about files from years later' (8393db2; REQ-DASH-197, REQ-DASH-198). The first line of each follows RQ1 - `You told us` for #5, #8, #11 and both #14s, `We noticed` for the rest - and the two #14s' attribution is checked with Keith when their cards are written. REJECTED (option B) restoring only the reviewer's five: the tab would then hold every current entry and only some past ones. This adds the `not-reproduced` status (criterion 11)."
  - "THE VALIDATOR IS `mothman dashboard validate-feedback` (Keith, 2026-10-14, review-architect Q2, option A): it answers 'is this file well-formed', as the other `mothman dashboard validate-*` gates do; cli/plans.py's own docstring keeps `mothman plans` for 'where has the work got to'. REJECTED `mothman plans validate-feedback` (option B), the scoper's first draft."
  - "THE DATE FIRST RAISED IS THE TAG'S DATE (delivery-architect, 2026-10-14): the tab orders cards by it, so it needs one home that a status change does not move. Every entry's `[status, date]` tag already carries a date, and _parse_numbered_items already reads it; criterion 19 fixes its meaning as the date first raised. REJECTED a card line for the date (a second date on one entry, free to disagree with the tag) and the git date of the line (moved by every reflow)."
  - "A CARD MAY CITE ITS ROAD-TESTING SPRINT, WHICH DERIVES 'PLANNED' (Keith, 2026-10-14, review-dashboard-ux Q2, option A): six current entries (#1, #2, #4, #6, #9, #10) sit in a road-testing sprint Keith confirmed on 2026-10-13 with no requirement yet, and 'Heard' would undersell them. `sprint <n>` in Evidence is checked against the sprint list in plans/road-testing.md's introduction (criterion 20). REJECTED keeping 'Heard' (option B) and renaming 'Heard' (option C)."
  - "PAST-DATE LINKS ARE ALLOWED (Keith, 2026-10-14, review-dashboard-ux Q3, option A): entries #18 and #19 are about what the dashboard showed on a past date, so `in-place-on=` is accepted in a link (criterion 21) and REQ-DASH-220 lands it as a Scenarios jump does. REJECTED today-only links (option B): those cards could not show what they are about."
  - "THE RELATIVE-ADDRESS CHECK LIVES IN THE SHARED PARSER (delivery-architect, 2026-10-14, a security finding on a public site): a check only in the validator is a check only in the gate, and the build would publish whatever href a card held if the gate were skipped. Criterion 22 puts it where the build reads cards too; REQ-DASH-220 criterion 21 refuses the build."
  - "THE REVIEWER IS NEVER NAMED (Keith, 2026-10-14, Q7, option A). No name, role, agency or verbatim quote anywhere; cards say 'you'. REJECTED: a first name with their agreement."
  - "#3 IS A CURRENT ENTRY, NOT A RESTORED ONE. It was deleted on 2026-10-12 (03cb93e) as fixed by REQ-PIPE-167 and reopened by Keith the same evening (35edcab) as a different concept, so it gets an ordinary card in place. Its card names REQ-PIPE-167 only if the card says plainly that REQ-PIPE-167 is the half that was built - otherwise its derived status would read Built for something still unscoped."
  open_questions:
  - "If a second person road-tests the PoC, do their cards share this file and tab (which would need a 'who' grouping without naming anyone)? Out of scope for this draft and not asked now; recorded so it is asked rather than assumed."

- id: REQ-DASH-220
  title: "A Feedback tab shows one card per road-testing entry - what was raised, what we heard, what we built, the evidence - with a status derived from the requirements"
  date_written: "2026-10-14"
  story: "As Keith sitting beside the person who road-tested the PoC, I want a top-level dashboard tab with one card per road-testing entry, each saying in plain words what we heard and what we built, with a link straight to the place on the dashboard or the requirement where they can see it, so that I can walk them through how their feedback was handled in a few minutes, on the real dashboard rather than from notes."
  moscow: should
  status: not_started
  source: "Keith, plans/running-thoughts.md #92, 2026-10-13 evening: 'ITS OWN top-level dashboard tab, fed by road-testing.md itself ... one card per item', and his answers to delivery-scoper's eight questions, 2026-10-14 afternoon. Drafted by delivery-scoper 2026-10-14. Reviewed the same afternoon by delivery-architect and delivery-dashboard-ux (docs/drafts/unsigned-triage/review-architect.md, docs/drafts/road-testing-feedback/review-dashboard-ux.md); Keith answered RQ1-RQ3 and the reviews' questions, all option A, and they are folded in."
  acceptance_criteria:
  - "THE SYSTEM SHALL offer a top-level tab headed by an h2 reading 'Feedback', opened from a header entry that is a real link to `#/feedback` carrying an emoji like its siblings Plans, Demo and Scenarios, at the route `#/feedback`, which Back, Forward and a reload restore like those tabs."
  - "THE SYSTEM SHALL embed the cards at build time, through dashboard/embed_dashboard_data.py, into a `const FEEDBACK` placeholder that the template holds empty, using the same parser REQ-DOCS-219's validator uses, and SHALL NOT fetch anything when the tab renders."
  - "THE SYSTEM SHALL open the tab with a one-line introduction saying the cards are what someone who road-tested the PoC raised and what we noticed ourselves while using it, without naming anyone."
  - "THE SYSTEM SHALL show one card per entry of plans/road-testing.md - first every card whose first line is `You told us`, then, under a 'We noticed' heading, every card whose first line is `We noticed`, each group ordered by the date the entry was first raised (REQ-DOCS-219 criterion 19) and then by entry number - each card showing its first line under the label it carries, the 'What we heard' and 'What we built' text, the evidence under the label 'Where to see it', its status, and that date, and SHALL NOT show the entry's number."
  - "WHERE a card has no 'What we built' line, THE SYSTEM SHALL show 'Not built yet' in its place."
  - "THE SYSTEM SHALL derive each card's status at build time from the requirements its evidence names - 'Built' when every one is built with no unmet criteria, 'In progress' when any is in progress or built with unmet criteria or when some are built and some not started, 'Planned' when all are not started, or when it names no requirement but names a road-testing sprint - and 'Heard' when it names neither; WHERE the card carries a `Card status` override, THE SYSTEM SHALL show 'Fixed', 'Parked', 'Won't do' or 'Couldn't reproduce' instead."
  - "THE SYSTEM SHALL draw the status pill in a palette of its own and SHALL NOT use the red, amber or green classes a data verdict uses, as the requirements panel's priority pills do (post-build-review #56)."
  - "THE SYSTEM SHALL show a one-line summary above the cards counting the `You told us` cards and the `We noticed` cards separately, each by status - for example 'You told us 14 things - 5 built, 1 in progress, 6 planned, 1 parked, 1 fixed. We noticed 7 - 6 built, 1 couldn't reproduce.'"
  - "THE SYSTEM SHALL render each requirement in a card's evidence as its id, title and status in plain words within the link text, with no status pill or status colour of its own, read from the REQUIREMENTS data the page already embeds, inside a real `<a href>` holding that requirement's own address from REQ-DASH-222; WHEN it is clicked with the primary button and no modifier key, THE SYSTEM SHALL open the Requirements panel at that requirement, and SHALL leave every other click to the browser."
  - "THE SYSTEM SHALL render each dashboard link in a card's evidence as a real `<a href>` holding its relative address; WHEN it is clicked with the primary button and no modifier key, THE SYSTEM SHALL navigate within the page as any in-app link does, and SHALL leave every other click to the browser so that open-in-new-tab and copy-link work (docs/spa-best-practices.md section D)."
  - "IF a card's dashboard link no longer resolves when followed, THEN THE SYSTEM SHALL land as any stale link does today, with the page's stale-link notice, and SHALL log no console error."
  - "THE SYSTEM SHALL escape all card text and SHALL render from it only bold and inline code, as the Plans tab does."
  - "THE SYSTEM SHALL NOT show on a card the entry's analysis prose, its git author, or any identity from contract/people.yaml."
  - "IF there are no cards, THEN THE SYSTEM SHALL show the tab with a one-line empty state and SHALL log no console error."
  - "WHEN the dashboard is opened from a plain file:// path, THE SYSTEM SHALL render the tab and follow its links exactly as it does from GitHub Pages."
  - "THE SYSTEM SHALL be covered by a browser test against the real built dashboard that first asserts the parsed card count is above zero, then asserts the tab shows that many cards with the derived statuses and that a requirement link opens the panel at that requirement, so that an empty source cannot pass as a match."
  - "THE SYSTEM SHALL show exactly one status pill on a card - the card's own derived or overridden status - and SHALL NOT colour a requirement it cites by that requirement's status (REQ_STATUS_CLASS), so that a built requirement's green never reads as a verdict on the card or on the data."
  - "WHERE a card's status is Parked, Won't do or Couldn't reproduce, THE SYSTEM SHALL label its 'What we built' text 'Why not'."
  - "WHEN a card's link carries `in-place-on=` and is followed with the primary button and no modifier key, THE SYSTEM SHALL set that date and navigate as a Scenarios jump does (the date set quietly, without rewriting the entry being left), SHALL show the jump bar in neutral wording - 'Viewing <date>. The whole dashboard is showing that date, not today.' with its way back to today - and on Back SHALL restore the Feedback tab at the date it was on."
  - "WHERE a card's evidence names a road-testing sprint, THE SYSTEM SHALL show it as plain text naming the sprint's number and title from plans/road-testing.md, not as a link."
  - "IF a card's evidence target is not a relative dashboard address beginning `?` or `#/`, THEN THE SYSTEM SHALL refuse to build the dashboard, naming the entry, through the shared parser's own check (REQ-DOCS-219 criterion 22)."
  - "WHEN the Requirements panel opened from a card's link is closed, THE SYSTEM SHALL return keyboard focus to that link and SHALL keep the Feedback tab's scroll position."
  non_functional_requirements:
  - "PRIVACY, PUBLIC SITE: the tab is published to the public GitHub Pages site; it carries only what the cards carry, and REQ-DOCS-219's no-identity rule is what keeps the reviewer anonymous there."
  - "THE BUILD READS CONFIGURATION AND PLANS ONLY: the tab's data comes from committed plans/road-testing.md and requirements.yaml at build time; nothing in it needs, or may read, the qa schema, supply rows, data/ or reports/."
  - "OFFLINE AND GOVERNMENT NETWORKS: no fetch, no third-party asset, no absolute link - the tab works from a file:// open and from a network that reaches nothing but the page."
  - "SCALE: twenty-one cards. No filter chips, search or paging; one list, one summary line. Load cost is negligible beside the embedded QA data."
  - "MAINTAINABILITY AND EPHEMERALITY: a few months' life is expected. The tab, its const, its header button and its test are self-contained, so that retiring it is one change that touches nothing else; no other view may link to it. REQ-DASH-222's requirement addresses are NOT part of that retirement - they outlive the tab."
  - "OBSERVABILITY: a card's status can never be stale against the register, because it is derived from requirements.yaml at each build; an override is visible as an override in the file."
  - "ACCESSIBILITY: the status reads by label as well as colour (REQ-DASH-070), and each card is a list item a screen reader can step through."
  - "ONE ESCAPING, ONE MEANING OF BUILT (delivery-architect, 2026-10-14): card text is escaped and marked up by renderPlansMarkdown's own escaping, not a second renderer; and 'built with no unmet criteria' is sprint_state.survey's own predicate for a met requirement, shared rather than restated, so the Feedback tab and the sprint gate can never disagree about what built means."
  - "SECURITY, PUBLIC SITE: an evidence href is checked by the shared parser at build time as well as by the gate (criterion 21), so a `javascript:` or absolute URL cannot reach the published page even if the gate is skipped (delivery-architect, 2026-10-14)."
  dependencies:
  - "REQ-DOCS-219"
  - "REQ-DASH-222"
  decisions:
  - "A TOP-LEVEL TAB, NOT A SIDE PANEL. Keith's own call, 2026-10-13: 'its own top-level dashboard tab', like Plans and Demo, so it has a route Keith can open directly in front of someone."
  - "LABELLED 'Feedback' AT `#/feedback` (Keith, 2026-10-14, Q8, option A). REJECTED: `#/you-told-us` / 'You told us' (warmer, but odd to anyone else opening the dashboard, and wrong for entries the project found itself); 'Road testing' (matches the file, jargon to the reviewer)."
  - "STATUS IS DERIVED, NOT TYPED (Keith, 2026-10-14, Q5, option A). A typed status on a card is a second record of the same fact as the requirement's status. Overrides exist only for what no requirement can say: a defect fixed without one (#8), parked (#12) and won't do. REJECTED: typed on every card and cross-checked by the validator - more to keep in step for no gain. Accepted cost, recorded so it is not rediscovered: a card names requirements, not criteria, so a requirement built with unmet criteria unrelated to the card's point reads 'In progress' (REQ-QAC-037 on the 'Client reference' card)."
  - "REQUIREMENTS ARE DEEP-LINKED (Keith, 2026-10-14, Q6, option B). Each requirement in a card links to its own address, which REQ-DASH-222 adds as a requirement of its own because it is useful well beyond this tab. This requirement depends on REQ-DASH-222 and is not built before it. REJECTED: the scoper's recommendation of ids shown inline with a click opening the Requirements panel at the top; plain ids only."
  - "NO PER-CARD URL. One route, `#/feedback`, for about twenty cards Keith scrolls through with the person beside him. REJECTED: `#/feedback/<n>` - worth it only if he wants to send a single card as a link, which nobody has asked for."
  - "AMENDED 2026-10-14 by Keith's review-dashboard-ux Q1 answer (decision below): date order now applies within each of the two groups. ORDERED BY WHEN EACH WAS RAISED, NOT BY ENTRY NUMBER OR STATUS. Restored cards take new numbers after #19 (REQ-DOCS-219), so number order would push the earliest, already-fixed feedback (Perth time, closing a panel) to the bottom; date order puts each card where it was raised, which is the order Keith will talk them through. REJECTED: number order (the reason above); grouping 'built' first (reads as salesmanship to the person whose unbuilt items sit at the bottom)."
  - "'YOU TOLD US' FIRST, THEN A 'WE NOTICED' SECTION (Keith, 2026-10-14, review-dashboard-ux Q1, option A): the reviewer's cards first by date, then the project's own under a heading of their own, with the summary line counting each group, so the person beside Keith sees their feedback answered before anything the project raised for itself. REJECTED one list interleaving both (option B)."
  - "THE INTRODUCTION NAMES BOTH SOURCES (Keith, 2026-10-14, RQ1, option A): `We noticed` on entries the project found itself, `You told us` on the reviewer's, exactly one per card (REQ-DOCS-219 criterion 1), so criterion 3's introduction says the tab holds both. REJECTED `You told us` on every card (option B)."
  - "'COULDN'T REPRODUCE' IS A STATUS (Keith, 2026-10-14, RQ2, option A): #17 was closed as not reproduced, and with all eleven deleted entries restored it needs a status of its own. REJECTED restoring only the reviewer's five, which needed no new status."
  - "ONE STATUS PILL A CARD, REQUIREMENT STATUS IN WORDS (delivery-dashboard-ux H3, 2026-10-14): REQ_STATUS_CLASS colours a built requirement green, and a second green pill on a card would read as a data verdict and compete with the card's own status. The divergence from the Plans tab and the Requirements panel, which do colour requirement status, is deliberate: there a requirement is the subject, here the card is. REJECTED reusing the panel's pills."
  - "'WHY NOT' FOR PARKED, WON'T DO AND COULDN'T REPRODUCE (delivery-dashboard-ux M2, 2026-10-14): 'What we built' over a reason nothing was built reads as a contradiction."
  - "'WHERE TO SEE IT', NOT 'EVIDENCE' (Keith, 2026-10-14, review-dashboard-ux Q5, option A): the tab's label for the evidence line. The card's source label in plans/road-testing.md stays `Evidence` (main session, low stakes, 2026-10-14): it is the author's and the validator's vocabulary, and renaming it would change REQ-DOCS-219's format for no reader's gain. REJECTED 'Evidence' on the tab (option B)."
  - "PAST-DATE LINKS LAND AS A SCENARIOS JUMP DOES (Keith, 2026-10-14, review-dashboard-ux Q3, option A): the as-of date is global and sticky, so a link to a past date needs the landing a Scenarios jump already has - the date set quietly (setInPlaceOnQuietly) without rewriting the entry being left, a jump bar saying so, and Back restoring the date the Feedback tab was on. The bar's wording is neutral because there is no scenario to name. REJECTED today-only links (option B)."
  - "A SPRINT IS TEXT, NOT A LINK (main session, low stakes, 2026-10-14): a road-testing sprint has no dashboard address of its own, and a link into the Plans tab would point the reviewer at planning prose. Keith's Q2 answer lets a card cite its sprint (REQ-DOCS-219); criterion 20 shows it among the evidence without an href."
  - "NO ENTRY NUMBERS, AN h2, A REAL HEADER LINK (delivery-dashboard-ux low findings, 2026-10-14): the numbers are the file's bookkeeping and have been reused once (the two #14s); the tab is a page with a heading like its siblings, and its header entry is a real link so it can be opened in a new tab."
  - "REVIEWS FOLDED, 2026-10-14: changed in place 1 (h2, header link), 3 (no longer provisional), 4 (two groups, 'Where to see it', no entry number), 6 (sprint derives Planned; Couldn't reproduce), 8 (counts per group), 9 (requirement status in words, no pill); added 17 to 22 (one pill, 'Why not', past-date landing, sprint as text, the build refuses a bad href, focus back to the link)."
  open_questions:
  - "Does the tab show on every deployment of this codebase, or only on this PoC's own site? Today every tab is on every build; a real deployment for an asset team would not want a tab about one reviewer of the PoC. Recommended: no switch now (the tab is ephemeral and there is only one deployment); not asked now, recorded so it is not forgotten."

- id: REQ-DASH-222
  title: "Each requirement has its own dashboard address that opens the Requirements panel at it"
  date_written: "2026-10-14"
  story: "As someone reading or discussing the PoC's requirements, I want a link that opens the dashboard's Requirements panel at one particular requirement, so that I can point a person, a feedback card or a note straight at the requirement I mean instead of telling them to open the panel and scroll for its id among two hundred."
  moscow: should
  status: not_started
  source: "Keith, answer to delivery-scoper's question 6 on the Feedback tab draft, 2026-10-14 afternoon: add a deep link - each requirement gets its own URL (e.g. `?req=REQ-DASH-197`) that opens the Requirements panel at it, as a separate requirement which REQ-DASH-220's cards then use. Drafted by delivery-scoper 2026-10-14. Reviewed the same afternoon by delivery-architect and delivery-dashboard-ux (docs/drafts/unsigned-triage/review-architect.md, docs/drafts/road-testing-feedback/review-dashboard-ux.md); Keith answered RQ1-RQ3 and the reviews' questions, all option A, and they are folded in."
  acceptance_criteria:
  - "THE SYSTEM SHALL give each requirement an address of its own, `?panel=requirements&req=<id>` with the id exactly as requirements.yaml writes it, kept alongside whatever path and other query parameters the page is on, and SHALL build every link to a requirement through one function."
  - "WHEN a requirement's address is cold-loaded, THE SYSTEM SHALL render the view the rest of the address names, open the Requirements panel, scroll the panel to that requirement and mark it as the one linked to with the left accent bar the page's .arrival-notice already uses."
  - "WHEN the Requirements panel opens at a requirement, THE SYSTEM SHALL move keyboard focus to that requirement's heading, which carries tabindex=-1 (docs/spa-best-practices.md section F)."
  - "WHEN a reader follows an in-page link to a requirement with the primary button and no modifier key, THE SYSTEM SHALL push one history entry, so that Back returns to the view they left with the panel as it was and Forward reopens the panel at the requirement; THE SYSTEM SHALL leave every other click to the browser."
  - "WHILE the panel's status filter would hide the requirement being opened, THE SYSTEM SHALL reset the filter to All before scrolling to it."
  - "WHERE the requirement opened is retired, THE SYSTEM SHALL open at it with its retirement note showing, as for any other requirement."
  - "IF `req=` names an id that the embedded REQUIREMENTS data does not hold, THEN THE SYSTEM SHALL open the Requirements panel at the top, show the page's existing .stale-link-notice inside the panel with role=status, naming the id (escaped) - not forgetStaleSegment(), which removes a stale path segment - remove `req=` from the address with replaceState so that Back does not pass through the broken link, and log no console error."
  - "IF the address carries `req=` together with a `panel=` other than `requirements`, THEN THE SYSTEM SHALL honour `panel=` and remove `req=` from the address with replaceState."
  - "WHEN the reader closes a Requirements panel opened at a requirement, THE SYSTEM SHALL remove `req=` from the address together with `panel=`, closing the panel as every side panel closes once post-build-review #180 is built - in place, with replaceState, where the page did not push the panel."
  - "THE SYSTEM SHALL show beside each requirement's id in the panel a real `<a href>` holding that requirement's own address, so that a reader can copy or open a link to it."
  - "WHEN the dashboard is opened from a plain file:// path, THE SYSTEM SHALL resolve a requirement's address exactly as it does from GitHub Pages."
  - "THE SYSTEM SHALL be covered by browser tests against the real built dashboard that cold-load a requirement's address, follow a link and step Back and Forward, load an unknown id, load an id hidden by the status filter, and close a cold-loaded panel, each first asserting the embedded requirements are non-empty."
  - "WHEN the Requirements panel is opened from its header button, THE SYSTEM SHALL open it at the top and SHALL drop any `req=` from the address."
  - "WHEN the reader navigates to another view while the address carries `req=`, THE SYSTEM SHALL NOT carry `req=` or `panel=requirements` into the new view's address."
  - "WHEN a Requirements panel opened from an in-page link is closed, THE SYSTEM SHALL return keyboard focus to the link that opened it."
  - "THE SYSTEM SHALL mark each requirement's row in the panel with a data-req-id attribute holding its id, and SHALL find the row to open at by comparing each row's attribute with the id, never by a selector built from the address."
  non_functional_requirements:
  - "FOLLOWS THE EXISTING URL CONVENTION: the path says which page, the query string carries orthogonal view state (docs/spa-best-practices.md section A, stateToPath()'s own comment); `panel=` stays the one parameter that says which drawer is open, so no second mechanism for opening a panel is added."
  - "OFFLINE AND GOVERNMENT NETWORKS: a requirement's address is relative and resolved from data already embedded in the page - no fetch, works from file:// and from GitHub Pages alike."
  - "SECURITY: the `req=` value is only ever compared against embedded ids and escaped where it is shown; it is never inserted into the page as markup or used to build a selector at all (criterion 16)."
  - "SCALE: one drawer already renders every requirement (two hundred and more, growing). Opening at one renders the panel as today and scrolls; no per-requirement page, paging or index is proposed. If the panel's render ever becomes slow, that is the panel's problem, not this requirement's."
  - "MAINTAINABILITY: no new dependency; one address function is the single place the format lives, so REQ-DASH-220, a future feedback card or any other view never hand-builds the string."
  - "DURABILITY: an address is only as stable as the id, and ids are never reused (one global sequence; a retired requirement keeps its id), so a link written today still opens the same requirement, or its retirement note, later."
  - "ACCESSIBILITY: focus moves to the opened requirement's heading, and the 'linked to' mark is not conveyed by colour alone."
  - "STATE, NOT THE DOM: the requirement opened is held in STATE beside STATE.panel and written to the address by the one address function, as every other view parameter is (delivery-dashboard-ux, 2026-10-14)."
  dependencies: []
  decisions:
  - "A REQUIREMENT OF ITS OWN (Keith, 2026-10-14, Q6, option B). Useful well beyond the Feedback tab - from a note, a conversation or another view - and it outlives that tab, so it is not folded into REQ-DASH-220."
  - "`panel=requirements` PLUS `req=` (Keith, 2026-10-14, RQ3, option A). Keith's example was a bare `?req=<id>`. The draft keeps `panel=` as the only thing that says which drawer is open (SIDE_PANELS, openPanel()), with `req=` as the drawer's own view state, the same way `cmp=` qualifies a check. REJECTED (option B): a bare `?req=` that implies the panel - shorter, but a second way to open a drawer that every panel-handling path would then have to know about."
  - "THE ID AS WRITTEN, UPPERCASE. docs/spa-best-practices.md prefers lowercase URLs, but also says to prefer the id a reader already recognises over a re-spelt one; REQ-DASH-197 is what people say and search for. Matched exactly. REJECTED: a lowercased slug (a second spelling of every id); case-insensitive matching (more to test, and every link is generated by one function anyway)."
  - "THE STALE ID IS A NOTICE, NOT A NOT-FOUND PAGE. As for a stale column (post-build-review #11), everything except the one requirement is still worth showing, so the panel opens and the notice says what was missing. REJECTED: renderNotFound()'s full-page treatment, which is for a missing dataset or agency."
  - "OUT OF SCOPE: turning requirement ids mentioned inside the panel's own prose (decisions, dependencies, unmet criteria) into links, and changing document.title when the panel opens. Both are natural follow-ups once an address exists; neither is needed for REQ-DASH-220, and this one is meant to stay small."
  - "SUPERSEDED 2026-10-14 (decision below). WAS: THE COLD-LOAD CLOSE CRITERION IS HERE BECAUSE A SHARED LINK MAKES IT THE COMMON CASE. Today closePanel() calls history.back() whenever STATE.panel is set, which (read from the code, not driven) would leave the dashboard when the panel came from the address of a fresh tab - the side-panel twin of road-testing #8. A requirement link opened from a message is exactly that case."
  - "THE GENERAL CLOSE FIX IS post-build-review #180, NOT THIS REQUIREMENT (Keith, 2026-10-14, review-architect Q1 and review-dashboard-ux Q4, option A both): the main session confirmed the defect in a browser - a cold-loaded `?panel=requirements` closed with Escape stepped Back to about:blank, and in a truly fresh tab the panel could not be closed at all - and it affects all five SIDE_PANELS. It is being fixed now, test-first, for all five, as #180. So criterion 9 adds only what is this requirement's own - dropping `req=` with `panel=` - and relies on #180's guard for closing in place, and criterion 12's cold-load close test checks that `req=` goes too. REJECTED fixing it here for the Requirements panel alone (option B of both questions): the other four panels would keep the defect."
  - "THE MARK, THE NOTICE AND THE ROWS REUSE WHAT THE PAGE HAS (delivery-dashboard-ux and delivery-architect low findings, 2026-10-14): .arrival-notice's left accent bar for the linked-to mark; .stale-link-notice with role=status for an unknown id, not forgetStaleSegment(); rows found by data-req-id by iteration; the header button opens at the top; focus returns to the opening link. navUrl carries panel= and req= across navigate() today; criterion 14 drops both for the Requirements panel, and whether other panels should drop panel= on navigation is left to #180."
  - "REVIEWS FOLDED, 2026-10-14: changed in place 1 (no longer provisional), 2 (the accent bar), 3 (tabindex=-1), 7 (.stale-link-notice, role=status), 9 (drops req=, relies on #180); added 13 to 16 (header button at the top, navigation drops req=, focus back to the link, data-req-id rows)."
