  acceptance_criteria_replace:
    5: "THE SYSTEM SHALL discover the asset folders from assets/ itself, and the one-off folders from one-offs/<kind>/ itself for every kind (REQ-PIPE-446), and SHALL NOT hold a list of assets, kinds or one-offs, or name any of them, anywhere in code. AMENDED 2026-11-21 by REQ-PIPE-446."
