REQ-PIPE-363:
  acceptance_criteria_replace:
    1: "THE SYSTEM SHALL take the asset a command acts for from MOTHMAN_ASSET, naming an asset folder under assets/ by its bare name, beside MOTHMAN_ENVIRONMENT and MOTHMAN_SUPPLY_DSN (SETTLED by Keith 2026-11-01, on REQ-PIPE-091's precedent), and SHALL NOT take a one-off from it: a one-off is named only by `mothman one-off`'s `--id` or chosen in its TUI, and MOTHMAN_ASSET set beside either is refused (REQ-PIPE-446 criterion 3). AMENDED 2026-11-21 by REQ-PIPE-446 (v7, Keith's v6 Q2 (b))."
    4: "IF a command that is not one of the tool commands of criterion 5 is given WHILE MOTHMAN_ASSET is unset or names no asset folder - a one-off's id included (REQ-PIPE-446 criterion 9) - THEN THE SYSTEM SHALL answer not 'No such command' but that MOTHMAN_ASSET is not set, or names no asset folder, naming the variable, listing the folder names found under assets/, then - WHERE one-off folders exist - saying 'For one of <n> <kinds>, use mothman one-off.', and saying there is deliberately no default, in the form environments.current() uses for MOTHMAN_ENVIRONMENT - reading nothing but those folder names; <n> <kinds> is each kind that has folders, counted in its plural display word, joined with 'or' (e.g. '37 extractions or 2 audits'), and WHERE no one-off folder exists the sentence is left out. AMENDED 2026-11-21 by REQ-PIPE-446 (one-off sentence: wording SETTLED by Keith 2026-11-21, v6 Q2 (b))."
    5: "WHILE MOTHMAN_ASSET is unset, THE SYSTEM SHALL run `mothman check`, `mothman --help`, every `mothman one-off` command (REQ-PIPE-442 criterion 1) and every command that reads no asset configuration and opens no connection, and `mothman --help` SHALL say, as one line inside its Collections panel (REQ-TEST-252 criterion 2's two-panel layout kept), 'Set MOTHMAN_ASSET to one of: <the asset folder names found>.' followed - WHERE one-off folders exist - by criterion 4's sentence 'For one of <n> <kinds>, use mothman one-off.' (wording SETTLED by Keith 2026-11-01; the one-off sentence AMENDED 2026-11-21, Keith's yes to delivery-cli-ux D3 and his v6 Q2 (b))."
    6: "IF a command that reads asset configuration or opens a connection runs WHILE MOTHMAN_ASSET is unset or names no asset folder - a one-off's id included (REQ-PIPE-446 criterion 9) - THEN THE SYSTEM SHALL refuse before reading any asset configuration or opening any connection, naming the variable and every asset folder found, followed - WHERE one-off folders exist - by criterion 4's sentence 'For one of <n> <kinds>, use mothman one-off.', and SHALL NOT fall back to a default, a last-used value or the only asset present - except every `mothman one-off` command (REQ-PIPE-442 criterion 1), which runs with MOTHMAN_ASSET unset, is refused with it set, and selects its one-off by `--id` or in its TUI. AMENDED 2026-11-21 by REQ-PIPE-446 and REQ-PIPE-442 (v7, Keith's v6 Q2 (b))."
  acceptance_criteria_append:
    11: "THE SYSTEM SHALL have tests, seen failing first, of `mothman --help` ending its Collections line with 'For one of <n> <kinds>, use mothman one-off.' and leaving the sentence out where there are no one-offs, of criterion 4's and 6's refusals doing the same, of MOTHMAN_ASSET naming a one-off's id refused as naming no asset folder, and of every `mothman one-off` command running with MOTHMAN_ASSET unset and refused with it set. ADDED 2026-11-21 by REQ-PIPE-446 (v7)."
  withdrawn_from_v6:
    2: "v6 amended criterion 2 to build no collection group 'while a one-off is selected'. WITHDRAWN in v7: MOTHMAN_ASSET never names a one-off (Keith, v6 Q2 (b)), so criterion 2 as built - none built WHILE MOTHMAN_ASSET is unset or names no asset folder - already covers it. Criterion 2 is left as signed."
  exact_messages_for_keith:
    note: "NEEDS KEITH'S EXPLICIT YES. The full texts below assume asset folders daily and quarterly and 37 extraction folders; the first two sentences and the last are the built refusal (asset_model/assets.py _refusal), unchanged."
    c4_and_c6_unset: "MOTHMAN_ASSET is not set, so this command cannot say which data asset it acts for. Set it to one of: daily, quarterly. For one of 37 extractions, use mothman one-off. There is deliberately no default - a command that guesses is a command that can act for an asset it was not meant to."
    c4_and_c6_names_no_folder: "MOTHMAN_ASSET is 'quartely', which names no asset folder. Set it to one of: daily, quarterly. For one of 37 extractions, use mothman one-off. There is deliberately no default - a command that guesses is a command that can act for an asset it was not meant to."
    c4_and_c6_names_a_one_off: "MOTHMAN_ASSET is 'cohort-2026-a', which names no asset folder. Set it to one of: daily, quarterly. For one of 37 extractions, use mothman one-off. There is deliberately no default - a command that guesses is a command that can act for an asset it was not meant to."
    c4_and_c6_no_one_offs: "MOTHMAN_ASSET is not set, so this command cannot say which data asset it acts for. Set it to one of: daily, quarterly. There is deliberately no default - a command that guesses is a command that can act for an asset it was not meant to."
    c5_help_line: "Set MOTHMAN_ASSET to one of: daily, quarterly. For one of 37 extractions, use mothman one-off."
    c5_help_line_no_one_offs: "Set MOTHMAN_ASSET to one of: daily, quarterly."
    two_kinds_example: "For one of 37 extractions or 2 audits, use mothman one-off."
  decisions_add:
    - "ONE-OFFS ARE NAMED BY THEIR BARE ID (REQ-PIPE-446, 2026-11-21): one namespace across assets and every kind, a clash refused. REJECTED a prefix, since data/, reports/ and supply_<name> are one namespace either way."
    - "SETTLED by Keith 2026-11-21 (v6 Q2 (b)): MOTHMAN_ASSET IS FOR ENDURING ASSETS ONLY. A one-off is named by `--id` or in the TUI; MOTHMAN_ASSET set beside one is refused, and MOTHMAN_ASSET naming a one-off's id names no asset folder. REJECTED (a), MOTHMAN_ASSET naming the same one-off as `--id`. REPLACES v6's 'A ONE-OFF IS NAMED BY --id' (which let MOTHMAN_ASSET match) and v5's 'MOTHMAN_ASSET names a one-off folder'."
    - "SETTLED by Keith 2026-11-21 (v6 Q2 (b)): THE ONE-OFF SENTENCE IS 'For one of 37 extractions, use mothman one-off.', after 'Set it to one of: daily, quarterly.'; with no one-off folders there is no sentence. REPLACES the round 6 approved '- or one of 37 extractions (mothman one-off list)', which told a person to set MOTHMAN_ASSET to an extraction. Joining several kinds with 'or' is the scoper's extension of his words, for his yes."
    - "EVERY `mothman one-off` COMMAND RUNS WITH NO ASSET SELECTED (REQ-PIPE-442 criterion 1), and v7 adds that it is refused with one set (Keith, CLI Q1 and Q2, v6 Q2 (b))."
    - "v7, THE CRITERION 2 AMENDMENT IS WITHDRAWN: see withdrawn_from_v6. The architect's A concern (groups built at import) is met by the criterion as built, because a one-off never sits in MOTHMAN_ASSET."
    - "A KIND WITH NO FOLDERS IS LEFT OUT, AND --help MATCHES (Keith 2026-11-21, yes to both delivery-cli-ux D3 edge cases); under v6 Q2 (b) 'left out' means the whole one-off sentence goes when there are none. REJECTED the architect's L 'leave criterion 5 deliberately'."
