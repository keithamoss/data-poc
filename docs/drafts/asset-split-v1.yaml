  - id: REQ-PIPE-352
    title: "Each asset is bootstrapped into its own database from its own configuration, and the two bootstraps' cost is measured against today's single one"
    date_written: "2026-10-31"
    story: "As whoever runs the pipeline, I want each asset bootstrapped into its own database, separately, so that each holds only its own asset's history and a change to one asset never costs a rebuild of the other."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: the split; two dashboards, each built only from its own asset's database). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN `mothman pipeline bootstrap` runs, THE SYSTEM SHALL generate, stage, check and promote only the selected asset's collections, into the selected asset's database, and SHALL refuse where the database's identity is another asset's (REQ-PIPE-343)."
      - "THE SYSTEM SHALL replay every calendared collection of an asset as one receipt-ordered stream, since one baseline puts them all on one calendar (REQ-PIPE-262 criterion 1 as amended by A12), and each no-calendar collection as a stream of its own."
      - "THE SYSTEM SHALL keep `mothman env reset-synthetic`, checkpoints and resume per asset, each refusing an asset not declared synthetic."
      - "THE SYSTEM SHALL generate each asset's scenario map from that asset's own history, at SCENARIOS-<asset>.md in the repository root where SCENARIOS.md is today (PROPOSED), the test scenario register in plans/supply-model.md staying one register; and IF a registered scenario names datasets of two assets, THEN `mothman check` SHALL fail, naming it."
      - "THE SYSTEM SHALL have the session-start hook start one database per asset, mark each (REQ-PIPE-343) and report each one's staged-table count, naming the asset."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence, from empty on this sandbox, each asset's bootstrap wall clock alone and both run side by side, beside today's single bootstrap and its per-stream figures on the same commit (REQ-PIPE-336 evidence: Birth Registrations 814s, the quarterly stream 2507s, 3509s in all), with and without the two test collections."
    non_functional_requirements:
      - "PERFORMANCE: the split adds no work - today's bootstrap already runs Birth Registrations and the quarterly stream as separate processes (REQ-PIPE-262 criterion 6) - so side by side it should cost about what today's does, plus the two test collections. Today's 3509s total exceeds the larger stream's 2507s by about Birth Registrations' 814s, which suggests the two streams are not fully overlapping now; criterion 6's figures will say."
      - "RELIABILITY: one asset's bootstrap failing leaves the other's database untouched, since no process holds both (REQ-PIPE-343 criterion 5)."
      - "PRIVACY: each database holds one asset's supply rows only; a quarterly period schema never sits in a database with a daily one."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-343
      - REQ-PIPE-345
      - REQ-PIPE-262
      - REQ-GEN-045
    decisions:
      - "TWO DATABASES, TWO BOOTSTRAPS (Keith, 2026-10-31, implied by 'each built only from its own asset's database')."
      - "ONE STREAM PER ASSET (delivery-scoper): REQ-PIPE-262 grouped collections by shared calendar so the quarterly ones replayed together; under one baseline that grouping is simply every calendared collection of the asset. plans/running-thoughts.md #111 (a one-collection bootstrap is not its slice of the stream) is unchanged by this."
      - "A SCENARIO MAP PER ASSET, ONE REGISTER (delivery-scoper, PROPOSED): SCENARIOS.md is generated with the history (REQ-GEN-045 criterion 3), and each asset has its own history; the register in plans/supply-model.md says what each scenario is and is not state, so it stays one."
      - "THE BOOTSTRAP BUDGET IS Q5 (on REQ-TEST-353)."
    open_questions: []

  - id: REQ-TEST-353
    title: "CI checks both assets on every push and stays within the monthly minutes allowance, each asset's bootstrapped database cached on its own key"
    date_written: "2026-10-31"
    story: "As Keith paying for CI from a 2,000-minute monthly allowance, I want both assets checked on every push at about the cost of checking today's one combined asset, so that the split does not cut how often finished work can be pushed."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: the split); CLAUDE.md's CI minutes budget (REQ-TEST-260). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed; its budget waits on Q5."
    acceptance_criteria:
      - "THE SYSTEM SHALL key each asset's cached bootstrap on the shared inputs REQ-TEST-117 criterion 1 names less contract/, plus that asset's own folder and the repository-wide files of REQ-PIPE-342 criterion 2, so that a change to one asset's configuration restores the other asset's dump."
      - "THE SYSTEM SHALL bootstrap or restore both assets' databases in the one test-deployment job, side by side, each as its own process with its own MOTHMAN_ASSET and DSN, and SHALL NOT add a second deployment job."
      - "THE SYSTEM SHALL run the deployment half's tests against each asset's database, each test selecting its asset (REQ-PIPE-342 criterion 13), and the fast half's configuration tests against every asset folder."
      - "THE SYSTEM SHALL say in the job log, per asset, whether its database was restored or rebuilt and from which key (REQ-TEST-117 criterion 4)."
      - "THE SYSTEM SHALL keep the fast half's skip count at zero with both assets present."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence, from `mothman github ci-usage`, the billable minutes of a cache-hit run and of a cache-miss run before and after the split (PROVISIONAL on Q5 (a): and SHALL record the requirement as not met where a cache-hit run bills more than 10 percent above the before figure)."
    non_functional_requirements:
      - "COST: one runner, two databases, both bootstraps in parallel - billed about as today's single job, which already runs both streams. A second job would bill a second runner's setup, about a minute, and a second copy of every install step on every push."
      - "COST: per-asset cache keys mean a daily-only edit rebuilds only the daily bootstrap (814s on this sandbox) rather than the quarterly one, the critical path - a likely net saving on misses."
      - "RELIABILITY: a cache restore of one asset never restores into the other's database; each dump is named for its asset and checked by the guard after restore."
      - "NO LIVE DATA IN CI: both databases hold synthetic data generated on the runner (REQ-TEST-117 criterion 5)."
    dependencies:
      - REQ-PIPE-352
      - REQ-TEST-117
      - REQ-TEST-260
    decisions:
      - "ONE DEPLOYMENT JOB, NOT TWO (delivery-scoper, PROPOSED, for the minutes budget): criterion 2. REJECTED a job per asset, which would report a daily-asset red sooner but bill a second runner on every push."
    open_questions:
      - "Q5 (Keith to decide) - A BUDGET FOR THE SPLIT'S COST, OR MEASURE AND REPORT. (a) RECOMMENDED: a ceiling on CI - a cache-hit run bills no more than 10 percent above today's measured figure (about 39 minutes) - with REQ-PIPE-250's 12-minute bootstrap target re-read as applying to each asset's bootstrap on its own (amendment A22), and bootstrap wall clock otherwise measured and reported. (b) Measure and report both, no ceiling, as REQ-DASH-209 did for page weight. (c) A ceiling on both CI minutes and each asset's bootstrap. The allowance is a real monthly limit, which is why a CI ceiling is recommended where page weight had none."

  - id: REQ-PIPE-354
    title: "Two dashboards on one site - /quarterly/ and /daily/ - each built and published only from its own asset's database, with a plain landing page linking them"
    date_written: "2026-10-31"
    story: "As someone opening the published register, I want a landing page that takes me to the quarterly or the daily asset's dashboard, each showing only its own asset, so that the two teams' registers sit side by side for the PoC without either build ever reading the other's data."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: two dashboards on one site, (a)). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN the dashboard is built, THE SYSTEM SHALL build it for the selected asset only, from that asset's recorded QA results and configuration, and SHALL embed no collection, calendar, person or result of another asset."
      - "THE SYSTEM SHALL name the asset in the built dashboard's masthead and title, from a name declared in its data-asset.yaml (PROPOSED: 'Quarterly data asset', 'Daily data asset'), as well as the environment and commit (REQ-PIPE-092 criteria 7 and 17)."
      - "WHEN a dashboard is published, THE SYSTEM SHALL replace only its own asset's path on the Pages branch, /<asset>/, and SHALL leave every other path byte-identical, shown by a test that publishes one asset into a branch holding both and compares the other."
      - "THE SYSTEM SHALL publish at the site's root a plain landing page, generated from the asset folders' declared names and nothing else, linking each asset's dashboard, written identically by either asset's publish."
      - "WHEN the landing page is opened with a route a single-asset dashboard used to take - an agency, collection, dataset or period address - THE SYSTEM SHALL send the reader to the asset whose hierarchy holds that agency, keeping the route and its query (PROPOSED), so that links shared before the split still land."
      - "THE SYSTEM SHALL archive each publish's snapshot under dashboard/snapshots/<asset>/, and SHALL leave the archive already committed at dashboard/snapshots/ where it is, unchanged."
      - "THE SYSTEM SHALL keep each built dashboard a single file openable from file:// with no live external dependency, and SHALL copy the fonts and vendor assets under each asset's path (REQ-PIPE-092 criterion 3)."
      - "THE SYSTEM SHALL keep the repository-wide tabs - Plans, Release Notes, Demo and Feedback - in each asset's dashboard, unchanged (PROPOSED)."
    non_functional_requirements:
      - "PRIVACY: a build may read recorded QA results, never actual data, and never anything else (Keith, 2026-09-27) - and now never another asset's results either. Each publish runs where its own asset's database is (REQ-PIPE-092)."
      - "SECURITY: one asset's publish cannot delete or overwrite the other's published dashboard (criterion 3)."
      - "PERFORMANCE: each dashboard embeds one asset, so each page is smaller than today's combined one; both sizes measured and reported beside today's."
      - "COMPATIBILITY: self-hosted fonts and vendor assets under each path, nothing from a CDN (government networks)."
      - "AT REAL SCALE: two separately managed teams would more likely publish to two sites. One site is the PoC's choice; the real shape belongs to #55's future decision point."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-352
      - REQ-PIPE-092
    decisions:
      - "TWO DASHBOARDS ON ONE SITE (Keith, 2026-10-31, (a)): two separately built dashboards, /quarterly/ and /daily/, each built only from its own asset's database, with a plain landing page linking them. REJECTED (b), one dashboard with an asset switcher, which mixes both assets into one build; REJECTED (c), two entirely separate sites."
      - "OLD LINKS REDIRECT BY AGENCY (delivery-scoper, PROPOSED): criterion 5 costs a static map from agency to asset. REJECTED letting pre-split links fall on the landing page, which loses the reader's place. Worth the UX review's reaction."
      - "THE EXISTING SNAPSHOT ARCHIVE IS NOT REWRITTEN (CLAUDE.md: dashboard/snapshots/*.html.gz accumulate and are never deleted as generated cruft)."
    open_questions: []

  - id: REQ-DASH-355
    title: "A global period control sits beside the 'In the warehouse on' control, is carried in the URL and across navigation, and with no period chosen every page behaves exactly as today"
    date_written: "2026-10-31"
    story: "As Keith during a quarterly refresh and release, I want to choose a period - 2026-Q2 - once in the header and have every page show what we know about that period as at the date on show, so that I can see a period's whole picture, including what arrived about it later, without losing my place."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: a period view alongside as-at; keyed by period; a global period control beside the global as-at control). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed; its relation to the period page waits on Q1."
    acceptance_criteria:
      - "THE SYSTEM SHALL show in the dashboard header, beside the '📅 In the warehouse on' control, a period control reading 'For period: <period name>' when a period is chosen and 'For period: none' when none is (PROPOSED wording), opening a panel to choose or clear one."
      - "THE SYSTEM SHALL offer as choices every period of the asset's baseline calendar from the first any dataset owes to the period the build's own date falls in, newest first, and none in the future (REQ-DASH-054 decision 2); WHERE the baseline is daily, THE SYSTEM SHALL offer a date input bounded to that range in place of a list."
      - "THE SYSTEM SHALL carry the chosen period in a query parameter, period=<period name>, beside in-place-on, keep it across every navigation and in every link the page builds, as in-place-on is kept, and drop it only when the reader clears it."
      - "THE SYSTEM SHALL keep the date on show when the period changes, and the period when the date on show changes."
      - "IF the period parameter names no period of the asset's baseline, THEN THE SYSTEM SHALL say so in a notice naming the value, as the stale-link notice does, and show the page with no period chosen."
      - "WHILE a period is chosen and the date on show is before that period opened, THE SYSTEM SHALL show '<period> had not opened by <date>' on each page in place of its content (REQ-DASH-209 criterion 8's wording)."
      - "WHILE no period is chosen, THE SYSTEM SHALL render every page exactly as it renders today, held by a real-browser regression guard over the agencies list, an agency page and a dataset page on two dates, passing on today's page."
      - "THE SYSTEM SHALL keep the in-place-on selection a calendar date in its own parameter (REQ-DASH-054 criterion 7, unchanged)."
      - "WHERE a reader opens a period-composition view (REQ-DASH-209), THE SYSTEM SHALL set the period control to that view's period, and choosing another period while on it SHALL open that period's view (PROVISIONAL on Q1, option (a))."
    non_functional_requirements:
      - "PERFORMANCE: choosing a period re-renders from data already embedded, as changing the date does - no fetch, no rebuild - and should feel as immediate as the date control does today."
      - "SCALE: about 55 quarterly periods today, one per day on the daily asset; criterion 2's date input for a daily baseline keeps the list from becoming hundreds of items."
      - "COMPATIBILITY: a plain file:// open works; shared links keep both parameters (docs/spa-best-practices.md)."
      - "ACCESSIBILITY: the control is a real button with a labelled panel, keyboard-reachable, as the date control is."
    dependencies:
      - REQ-PIPE-345
      - REQ-PIPE-354
      - REQ-DASH-054
      - REQ-DASH-209
    decisions:
      - "A PERIOD VIEW, ALONGSIDE AS-AT (Keith, 2026-10-31, rejecting all three options put for the geocoding batch's J1/G1 surfacing question - accept, a quiet notice, or move the timing): 'what we need here is a new way to view the dashboard ... almost by period'. Supersedes the geocoding batch's J1 question."
      - "A GLOBAL PERIOD CONTROL, BESIDE THE GLOBAL AS-AT CONTROL (Keith, 2026-10-31): 'something like another global as at control ... that's what I want'. In the header, in the URL, kept across navigation like as-at; every page reads it; with no period chosen every page behaves as today. REJECTED growing only the existing period page (REQ-DASH-209) into the view."
      - "THIS REOPENS A RECORDED DECISION, AND KEITH WAS TOLD SO (2026-10-31): REQ-DASH-054 decision 14 (2026-09-23) kept the picker a plain date and REJECTED a period picker beside it, because a period name is ambiguous at asset level once several calendars exist, so it 'could only ever sit beside the date, not replace it'. Beside the date is what Keith now proposes, and one baseline calendar per asset (REQ-PIPE-345) removes the ambiguity that reason rested on. REQ-DASH-054 criterion 7 - the date stays a date - still holds."
      - "MOSTLY FOR THE QUARTERLY ASSET, APPLIED TO EVERY CADENCE (Keith, 2026-10-31): it does no harm on a daily asset, where you would just choose the day, and is valuable for weekly or monthly ones."
      - "WRITTEN AGAINST THE POST-SPLIT SHAPE (Keith, 2026-10-31, sequencing (c)): scoped with the split, built after it. REJECTED (b), a period control on today's combined asset with an interim rule for Birth Registrations. Geocoding builds in parallel and waits on neither."
      - "GLOBAL, NOT ONE DATASET (Keith, 2026-10-30 ~23:55): 'I'd also want this fix to apply globally, not just to one dataset.'"
      - "NO FUTURE PERIODS (REQ-DASH-054 decision 2, carried): criterion 2."
      - "THE ARRIVAL-CONTEXT DRILL IS UNCHANGED HERE (delivery-scoper, PROPOSED): REQ-DASH-085, REQ-DASH-100 and REQ-DASH-198's drill to a period sets the DATE and its 'from' banner; whether it should set the period control instead is left for the UX review to raise, not decided in this draft."
      - "A SCENARIO JUMP NEITHER SETS NOR CLEARS THE PERIOD (delivery-scoper, PROPOSED): REQ-DASH-208's behaviour is unchanged; a jump to a scenario's period is a possible later refinement."
      - "A PERIOD MODE ON THE AS-AT SWITCHER WAS FLOATED AND DROPPED (Keith, about midnight 2026-10-30, then 'Hmm maybe it's OK as it is'): superseded by the separate control he chose the next morning; recorded so it is not re-proposed."
    open_questions:
      - "Q1 (Keith to decide; the brief left it open) - HOW THE PERIOD CONTROL RELATES TO THE PERIOD PAGE (REQ-DASH-209). (a) RECOMMENDED: keep the period page as the period's composition table; opening it sets the period control to its period, and with a period chosen each collection panel links to its composition view - one notion of 'the period on show', and REQ-DASH-209's previous and next links simply move the control. (b) Fold the composition table into each collection panel on the agency page while a period is chosen, and redirect the period route there - one fewer page, but REQ-DASH-209's route, focus, heading and TS-55 chip criteria are rewritten. (c) Leave them independent - the page keeps its own period in its route and ignores the control - least work, but two different 'periods on show' can then disagree on one screen."

  - id: REQ-DASH-356
    title: "With a period chosen, the agencies list, agency pages and dataset pages show that period's supplies and every result recorded about them as at the date on show - later linkage and geocoding verdicts included - with source supplies and the releases about them in separate sections"
    date_written: "2026-10-31"
    story: "As Keith during a quarterly release, I want 2026-Q2 to show both what arrived for Q2 from the source agencies and what the linkage and geocoding releases for Q2 found about those supplies, kept apart, so that a verdict recorded hours after a supply was replaced as current is still seen on that supply's own page."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-30 ~23:50, 'How can we view the results for a whole period?'; 2026-10-31 morning: two distinct views, keyed by period); plans/post-build-review.md #289 J1. Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHILE a period P is chosen, THE SYSTEM SHALL show on each dataset page the supply P holds for that dataset at the end of the date on show - Promoted, Inherited from <period>, Substituted from <period>, Not supplied or Not owed - found by the same lookup REQ-DASH-209 uses (promotionStateOn over the embedded slot timeline), headed 'For <P> · as at <date>' (PROPOSED)."
      - "WHILE a period P is chosen, THE SYSTEM SHALL show on that dataset page its own checks' results about that supply recorded by the end of the date on show, and every result of another collection's check that read that supply (the reads the build embeds from qa.check_read) recorded by then, whenever it was recorded, grouped by the reading collection as REQ-DASH-337 groups them."
      - "WHILE a period P is chosen, THE SYSTEM SHALL compute each dataset's status for P from those results, counting another collection's verdict toward it as REQ-PIPE-332 counts it, and roll it up to its collection and agency by the page's existing rollup rule."
      - "WHILE a period P is chosen, THE SYSTEM SHALL show the agencies list and each agency page in two sections, 'Source supplies for <P>' and 'Releases about other collections' supplies for <P>' (PROPOSED wording), a collection falling in the second where any of its datasets declares linked_datasets - derived from configuration, never named - and each section's status rolled up on its own."
      - "THE SYSTEM SHALL take everything it shows under a chosen period from the timelines, results and reads the build already embeds, adding to the build only what it lacks to attribute a result to the supply it read, and SHALL NOT read supply rows, a period schema or its _manifest."
      - "THE SYSTEM SHALL have a real-browser test, written first and seen to fail, against a dashboard built from the quarterly history: with a Child Protection period chosen, at a date after that period's linkage release, the Client Register page shows the linkage verdict about the supply filed to that period, which the same page with no period chosen does not show (post-build-review #289 J1)."
      - "THE SYSTEM SHALL have a real-browser test that, on the daily dashboard with a day chosen on which the weekly test dataset owes nothing, its row reads 'Not owed' with 'Inherited from <Monday>' rather than red or 'No data'."
      - "THE SYSTEM SHALL measure each built dashboard's size before and after this change and report both in evidence, with no size budget (REQ-DASH-209 criterion 11's precedent)."
    non_functional_requirements:
      - "PRIVACY: computed from recorded QA metadata only; people shown by display name, never email address (REQ-DASH-209 decision 21)."
      - "SCALE: at about thirty quarterly collections, the two-section split is derived from linked_datasets, so it holds as linkage and geocoding products grow, with no list to maintain."
      - "PERFORMANCE: a period choice is a lookup over embedded timelines, as the date is; page weight measured (criterion 8)."
      - "OBSERVABILITY: each result shown says when it was recorded, so a verdict that arrived after the supply was replaced as current is legible as such."
    dependencies:
      - REQ-DASH-355
      - REQ-DASH-209
      - REQ-DASH-337
      - REQ-PIPE-331
      - REQ-PIPE-332
      - REQ-QAC-348
      - REQ-QAC-350
    decisions:
      - "KEYED BY PERIOD, NOT BY ROUND (Keith, 2026-10-31, (a)): a view of 2026-Q2 shows everything known about Q2 - the source supplies filed to Q2, which arrived in an earlier round, and the linkage and geocoding releases for Q2, which arrive in a later round - in two sections, one per workstream, with the as-at time picked within it. REJECTED (b), a view by round or refresh (sources for Q3 beside linkage for Q2), and (c), both views."
      - "TWO DISTINCT VIEWS FOR A QUARTERLY REFRESH (Keith, 2026-10-31): what we know about the source data arriving for its period, and what we know about the linkage products and geocoding for the current period - 'distinct, separate releases, almost separate work streams'."
      - "ONE GENERIC RULE (Keith, 2026-10-30): any result recorded about a period's supply, whenever it arrived and whichever collection's check recorded it. Linkage Products and Client Register are the first case to show the gap, not the scope of the fix."
      - "THE WORKSTREAM IS DERIVED FROM linked_datasets (delivery-scoper, PROPOSED): REJECTED a new 'workstream:' key on each collection, which could disagree with what the collection actually reads; REJECTED deriving it from files_go_to_period, which describes timing, not what a release is about. Geocoding (REQ-QAC-294) declares linked_datasets too, so it lands in the same section with no change."
      - "THE PERIOD PAGE IS NOT GROWN INTO THE VIEW (Keith, 2026-10-31, rejected): every page reads the control instead."
      - "THE OPTIONS BEFORE THE CONTROL WAS CHOSEN (2026-10-30, not taken): (a) results on the period page, (b) the dataset page opening by period, (c) both."
    open_questions: []

  - id: REQ-TEST-357
    title: "The move to two assets changes nothing a collection records, generates, builds or offers - proven by the equivalence harness and the existing pins, never by re-capturing them"
    date_written: "2026-10-31"
    story: "As Keith, I want proof that splitting the configuration moved files and nothing else, so that the split can be trusted as a refactor before the new datasets and the period control are built on it."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: build the split first). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL regenerate each asset's history from empty after the split rather than migrate today's single database, which `mothman env reset-synthetic` then clears (REQ-PIPE-089 criterion 25's precedent)."
      - "THE SYSTEM SHALL extend `mothman debug equivalence capture` so that a commit with asset folders is captured as one baseline per asset, and `compare` SHALL compare the union of a post-split commit's baselines with a pre-split commit's single baseline, collection by collection, normalising only the data_asset_id segment REQ-QAC-344 renames and the database identity row."
      - "WHEN the split's move lands, before the test collections, THE SYSTEM SHALL show that compare reporting no difference on any surface, and SHALL record both commits and the result in evidence."
      - "THE SYSTEM SHALL keep tests/fixtures/arrival_semantics_golden.json and tests/fixtures/calendar_move_pin.json as captured, each test reading each pinned dataset's agreement from its own asset, and SHALL NOT re-capture either."
      - "WHEN the change moving the configuration is checked, THE SYSTEM SHALL have the agreement-freeze and check-lifecycle gates compare each moved file, or each part of a divided one, with its content at the base commit under its old path, and SHALL fail where a frozen item or a check's config changed in the move - so that a file at a new path is not taken for a brand-new one."
      - "THE SYSTEM SHALL make the move in a commit that changes no configuration content beyond the moves and the renames REQ-QAC-344 makes, with every content change of this batch in later commits."
    non_functional_requirements:
      - "RELIABILITY: the freeze gates exempt a file brand new at its path (validate_check_lifecycle.py's docstring; validate_schedule._content_at returns None for a missing path), so without criterion 5 the move commit would bypass the freeze silently - including any past-date change made in the same commit."
      - "AUDITABILITY: the equivalence result goes in evidence, so 'the split changed nothing' is a recorded run of a named tree, never a claim."
      - "COST: two from-empty bootstraps per capture; captures are on demand, not on every push."
    dependencies:
      - REQ-PIPE-342
      - REQ-QAC-344
      - REQ-PIPE-352
      - REQ-TEST-239
      - REQ-PIPE-111
    decisions:
      - "REGENERATE, NOT MIGRATE (delivery-scoper, following Keith's REQ-PIPE-089 choice): the history is synthetic and seeded."
      - "THE PINS ARE NOT RE-CAPTURED (REQ-PIPE-110 criterion 20's rule, carried): a pin captured from the post-split tree would prove only that the tree agrees with itself."
      - "THE FREEZE MUST FOLLOW THE MOVE (delivery-scoper, found reading the gates): criterion 5."
    open_questions: []

  - id: REQ-DOCS-358
    title: "Built requirements, CLAUDE.md and the README are restated for two assets in the change that makes the split, each amendment to signed text quoted and signed"
    date_written: "2026-10-31"
    story: "As whoever reads the register next, I want every built requirement that assumes one asset, one hierarchy file or several calendars restated for two assets with one baseline each, so that the register and the system agree the day the split lands."
    moscow: must
    status: not_started
