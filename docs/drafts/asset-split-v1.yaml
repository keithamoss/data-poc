# DRAFT v1 - the asset split, one baseline calendar per asset, the global
# period control and two test datasets (plans/running-thoughts.md #131,
# 2026-10-31 morning; #55; #109). delivery-scoper, 2026-10-31 (Perth).
# A PROPOSAL for sign-off, not a settled requirement. Nothing here is built
# until Keith has signed it.
#
# SEQUENCING (Keith, 2026-10-31, (c)): scoped together, built split first and
# period control after. The period control is REQ-DASH-355 and REQ-DASH-356,
# which depend on the split; everything else is the split and its test
# datasets. Geocoding (docs/drafts/geocoding-v5.yaml) builds in parallel and
# waits on neither.
#
# IDS: REQ-*-342 to REQ-*-358, one global sequence. requirements.yaml's last
# entry is REQ-TEST-339; geocoding v5 reserves 294-300, 340 and 341; 338 is
# named (and cut) in REQ-DASH-337's decisions. 301-319 and 328-329 appear
# nowhere in requirements.yaml, docs/drafts or plans, but were left alone in
# case another worktree holds them - renumber freely when applying.
#
# CHANGES TO BUILT, SIGNED TEXT are listed in full, CURRENT and PROPOSED, on
# REQ-DOCS-358's decisions (A1 to A22) so Keith can sign the wording on its
# own. None applies until he has. Whether the 88 path-only edits (50 built
# requirements naming contract/<file>.yaml) are signed one by one or under one
# blanket rule is open question Q4 on REQ-DOCS-358.
requirements:
  - id: REQ-PIPE-342
    title: "One repository holds a configuration folder per data asset; a deployment is told which asset it is, with no default, and every reader reads only that asset's folder"
    date_written: "2026-10-31"
    story: "As whoever maintains the pipeline, I want each data asset's configuration in a folder of its own inside this one repository, and every command told which asset it is acting for, so that the quarterly and daily assets can be configured, checked and run separately - as two teams in two environments will - without a second copy of the code."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: the split, repository shape (a)) and #55 (decided (a) for the PoC the same morning). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold each data asset's configuration in a folder of its own, contract/<asset>/ (PROPOSED: contract/quarterly/ and contract/daily/), each holding that asset's data-asset.yaml, calendar.yaml, presentation.yaml, people.yaml, scripted_decisions.yaml and file-checks.yaml, and its agencies' folders below it as REQ-QAC-241 lays them out today."
      - "THE SYSTEM SHALL keep at the top of contract/ only configuration that is the same for every asset - environments.yaml (PROPOSED) - and `mothman check` SHALL refuse any other file there, naming it and the asset folders it could belong to."
      - "THE SYSTEM SHALL place Child Protection and Family Support's Child Protection collection and Department of Health's Emergency Department and Linkage Products collections in the quarterly asset, and Registry Services' Civil Registration collection in the daily asset, moving each file without changing its content except where another criterion of this batch says so."
      - "THE SYSTEM SHALL discover the asset folders from contract/ itself, and SHALL NOT hold a list of assets, or name an asset, anywhere in code."
      - "THE SYSTEM SHALL take the asset a command acts for from MOTHMAN_ASSET, naming an asset folder, beside MOTHMAN_ENVIRONMENT and MOTHMAN_SUPPLY_DSN (PROPOSED, on REQ-PIPE-091's precedent)."
      - "IF MOTHMAN_ASSET is unset or names no asset folder, THEN THE SYSTEM SHALL refuse before reading any asset configuration or opening any connection, naming the variable and every asset folder found, and SHALL NOT fall back to a default, a last-used value or the only asset present."
      - "THE SYSTEM SHALL read the hierarchy, calendar, presentation words, people, scripted decisions and file checks only from the selected asset's folder, through one shared resolver, and SHALL NOT let any reader open another asset's folder - the configuration gates of criterion 10 excepted."
      - "IF a command names a collection, short, run prefix or dataset that belongs to another asset - `mothman bdm ...` under the quarterly asset, for example - THEN THE SYSTEM SHALL refuse before connecting, naming the item and the asset it belongs to."
      - "THE SYSTEM SHALL keep collection ids, collection shorts, run prefixes, agency shorts, dataset ids and table names unique across the whole repository, not only within an asset, because adapters, providers, dbt folders and mothman command groups are shared code keyed by them; and `mothman check` SHALL fail on a duplicate, naming both assets."
      - "WHEN `mothman check` runs, THE SYSTEM SHALL run every configuration gate - registry, collections, hierarchy, schedule, check-source, dbt-folder, patterns, check-lifecycle, agreement-freeze, people and presentation - once for each asset folder, needing no MOTHMAN_ASSET and no database, and SHALL name the asset in every failure it reports."
      - "IF a check's reads_tables, or a dataset's linked_datasets, names a table or dataset of another asset, THEN `mothman check` SHALL fail, naming the declaring dataset, the item and the asset it belongs to, since a check may read only its own asset's tables."
      - "THE SYSTEM SHALL keep each asset's generated deliveries, receipts and generator bookkeeping under data/<asset>/ and its results files under reports/<asset>/, both gitignored, and no command run for one asset SHALL read or write the other's."
      - "THE SYSTEM SHALL let each test select its asset explicitly through a fixture, and SHALL NOT let a test's outcome depend on an ambient MOTHMAN_ASSET."
    non_functional_requirements:
      - "CONFIGURATION, NOT STATE: an asset folder holds only authored configuration; data/<asset>/ and reports/<asset>/ stay gitignored state."
      - "NOTHING CODED FOR ONE ASSET: as nothing is coded for one collection (CLAUDE.md), no code names 'quarterly' or 'daily'; a third asset folder - project extractions, later - is picked up by discovery or refused by a gate, never silently ignored."
      - "PORTABILITY: a fresh clone with MOTHMAN_ASSET unset can still run `mothman check` in full, since the configuration gates need no asset and no database (REQ-PIPE-092 criterion 9)."
      - "MAINTAINABILITY: about 137 Python files (tests included) name an asset-wide configuration file today; they go through one resolver, so the next change of layout - #55's (b) or (c) - is one function rather than another sweep."
      - "SCALE: the gates loop over asset folders and over collections within each; nothing assumes two of either."
    dependencies:
      - REQ-PIPE-240
      - REQ-QAC-241
      - REQ-PIPE-091
      - REQ-PIPE-093
    decisions:
      - "ONE REPOSITORY, A CONFIGURATION FOLDER PER ASSET, FOR THE PoC (Keith, 2026-10-31, #55 option (a)). FLAGGED AS A FUTURE DECISION POINT, in his words 'once this needs to migrate out of PoC stage': (b) a repository per asset, or (c) shared code and checks with each asset's configuration injected at deploy time. Sample datasets, project extractions and ad hoc QA are not part of this decision."
      - "SPLIT THE PoC INTO TWO FAKE ASSETS, quarterly and daily (Keith, 2026-10-31): 'the thing we've been putting off for a while ... splitting this to have two different fake data assets'. It is what CLAUDE.md's scale target already describes - two assets, each with its own team, environment, deployment and dashboard."
      - "THE SPLIT FOLLOWS THE AGENCIES TODAY (delivery-scoper, from contract/data-asset.yaml): every quarterly collection belongs to Child Protection and Family Support or Department of Health, and the daily one to Registry Services, so no agency is in both assets. Nothing in the design relies on that - an agency may appear in both, each with its own folder."
      - "THE ASSET IS NAMED BY AN ENVIRONMENT VARIABLE, AS THE ENVIRONMENT IS (delivery-scoper, PROPOSED, following REQ-PIPE-091's decision for MOTHMAN_ENVIRONMENT, Keith 2026-10-04 option A). REJECTED a mandatory --asset flag on every command, for the reason REQ-PIPE-091 rejected --env: a flag cannot move the DSN, so it is one more value to agree with it. REJECTED one DSN variable per asset, as REQ-PIPE-091 rejected one per environment - though a machine working both assets, the sandbox and CI, pays for that choice by switching two variables together, and REQ-PIPE-343's guard is what catches a mismatched pair."
      - "environments.yaml STAYS SHARED (delivery-scoper, PROPOSED): its own production entry already says 'a second asset is a second deployment of this same configuration, not another entry here'. people.yaml GOES PER ASSET: each team's people and assignments are a fact about that team, and a correction's approver must be one of the asset's own people."
      - "THE dbt PROJECT STAYS ONE PROJECT, FOLDERS BY COLLECTION (delivery-scoper, PROPOSED): dbt_project/models/<collection-id>/ already separates collections, and an asset's runs select only its own; criterion 9's repository-wide uniqueness keeps the folders unambiguous. REJECTED a dbt project per asset folder, which duplicates macros, tests/generic and profiles for no isolation a selector does not already give. Worth Keith's reaction: it is the one piece of check configuration that does not sit in the asset's folder."
      - "IDENTIFIERS UNIQUE ACROSS THE REPOSITORY, NOT PER ASSET (delivery-scoper): adapters (qa_tools/collections/<id>.py), providers (generator/collections/<id>.py), dbt folders and command groups are shared code keyed by collection id, so two assets reusing an id would collide in code even though their databases never meet. Under #55's (b) or (c) this may relax; it is part of that future decision."
      - "A CROSS-ASSET READ IS A CONFIGURATION ERROR (delivery-scoper, from CLAUDE.md's strict separation): criterion 11. Today Birth Registrations is kept out of linkage by the calendar rule (REQ-QAC-330 criterion 6; geocoding-v5's 'BIRTH REGISTRATIONS IS OUT'); after the split it is kept out by the asset boundary, which is the honest reason."
    open_questions: []

  - id: REQ-PIPE-343
    title: "Each asset's database carries that asset's own identity, and a checkout refuses a database belonging to the other asset on every route"
    date_written: "2026-10-31"
    story: "As whoever runs either asset, I want a command configured for one asset to refuse the other asset's database before it does anything, so that two teams sharing one repository can never write to each other's history by a mistyped variable."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: the split) and #55 (REQ-PIPE-107 named as load-bearing for shared configuration). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL record in each asset's database the data_asset_id of that asset's own data-asset.yaml, through REQ-PIPE-107's one marking command, which SHALL take the asset from MOTHMAN_ASSET and require the person to type both the asset's data_asset_id and the environment id."
      - "WHEN a connection is opened, THE SYSTEM SHALL compare the database's recorded data_asset_id with the selected asset's, as REQ-PIPE-107 criterion 5 does today, so that a quarterly checkout pointed at the daily database is refused before any statement runs."
      - "IF the two differ, THEN THE SYSTEM SHALL refuse, naming the asset folder whose data_asset_id the database carries where one does, and SHALL NOT include any part of the connection string."
      - "THE SYSTEM SHALL mark, in the same change, each asset's sandbox database in the session-start hook, each asset's CI database in test.yml, each asset's dev-container database in .devcontainer/post-create.sh, and each test worker's database for the asset its fixture selects."
      - "THE SYSTEM SHALL NOT open connections to two assets' databases from one process; a step that needs both - CI's two bootstraps - SHALL run as one process per asset, each with its own MOTHMAN_ASSET and MOTHMAN_SUPPLY_DSN."
      - "THE SYSTEM SHALL have a test, seen failing first, that points a checkout configured for each asset at the other asset's marked database and asserts the refusal on every route REQ-PIPE-107 criterion 10 names - mothman, a test worker's database, and the connection details handed to dbt, Soda Core and datacontract-cli - with the database left exactly as it was found."
    non_functional_requirements:
      - "SECURITY: the guard is what makes one shared repository safe for two separately managed assets (#55). It must hold on every route, so criterion 6 tests each route rather than one."
      - "SECURITY: no credential and no connection-string fragment in any refusal (REQ-PIPE-093 criterion 3)."
      - "PRIVACY AT REAL SCALE: in a real deployment the two databases sit in separately managed cloud environments, and a refusal is the last line behind network separation, not the only one."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-107
      - REQ-QAC-344
    decisions:
      - "TWO ASSETS NEED TWO data_asset_ids FOR THE GUARD TO WORK AT ALL (delivery-scoper, from qa_tools/common/db_identity.py): REQ-PIPE-107 compares data_asset_id and environment, so two assets both called data-asset-1 would pass each other's check. Which ids is REQ-QAC-344's question Q2."
      - "ONE PROCESS PER ASSET (delivery-scoper, PROPOSED): criterion 5. REJECTED one bootstrap process holding both DSNs and switching between them, which puts both assets' credentials in one process, exactly what strict separation rules out."
    open_questions: []

  - id: REQ-QAC-344
    title: "Each asset's check ids carry its own data_asset_id, so a check id stays globally unique across the two assets"
    date_written: "2026-10-31"
    story: "As whoever maintains the checks, I want every check id to name the asset it belongs to, so that two assets sharing one repository - and probably the same table names and some of the same checks - never have two checks with one id."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: the split). The need follows from qa_tools/common/check_id.py's own docstring (Keith, 2026-09-22: the data_asset segment is what keeps a check_id globally unique across several assets). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed; its ids wait on Q2."
    acceptance_criteria:
      - "THE SYSTEM SHALL give the quarterly and the daily asset different data_asset_ids, each declared in its own data-asset.yaml (PROVISIONAL on Q2: the quarterly asset keeps data-asset-1 and the daily asset becomes data-asset-2)."
      - "THE SYSTEM SHALL write every check id of an asset's collections - in its contracts, Soda, Evidently and retired-check files and in dbt_project's models and retired files for its collections - with that asset's data_asset_id as the first segment."
      - "IF a check id's first segment is not its asset's data_asset_id, THEN `mothman check` SHALL fail, naming the check, the file and the expected segment."
      - "WHERE a check id is renamed by criterion 2, THE SYSTEM SHALL change nothing else about the check: its config_hash SHALL be unchanged, shown by comparing every renamed check's hash before and after, as REQ-QAC-039's rename was measured."
      - "THE SYSTEM SHALL record the rename as one narrow exception to the rule that a check id never changes, approved by Keith in the change that applies it and licensing this rename only, as REQ-QAC-039's decisions record the 2026-09-22 one."
    non_functional_requirements:
      - "AUDITABILITY: history is regenerated rather than migrated (REQ-TEST-357), so no recorded result carries an id that no longer exists; the exception is recorded on this requirement's decisions."
      - "SCALE: at about 30 collections on the quarterly asset, most check ids are quarterly ones, so keeping its segment unchanged is where the churn is smallest."
    dependencies:
      - REQ-PIPE-342
      - REQ-QAC-039
    decisions:
      - "THE SEGMENT STAYS (delivery-scoper, from check_id.py and Keith 2026-09-22): this is exactly the case it was kept for - 'the cost of that only appears when a second asset arrives'."
      - "THE DASHBOARD URL STILL CARRIES NO ASSET SEGMENT (REQ-QAC-039 criterion 6, kept): each asset's dashboard has its own path on the site (REQ-PIPE-354), so the URL does not need it."
    open_questions:
      - "Q2 (Keith to decide) - WHICH data_asset_ids, AND SO WHICH CHECK IDS ARE RENAMED. (a) RECOMMENDED: the quarterly asset keeps data-asset-1 and the daily asset becomes data-asset-2 - about 82 Birth Registrations ids in contract files and 84 occurrences in dbt_project are renamed, nothing quarterly changes, and the folder names (quarterly, daily) stay separate from the ids. (b) Meaningful ids for both (quarterly, daily), the folder name being the id: one name per asset rather than two, but every one of about 390 ids is renamed and up to 86 test files touched. Keeping data-asset-1 for both is not offered, because the guard (REQ-PIPE-343) could not then tell the two databases apart."

  - id: REQ-PIPE-345
    title: "Each data asset declares one baseline calendar; no collection or dataset names a calendar or dates of its own, and a gate refuses anything faster than the baseline"
    date_written: "2026-10-31"
    story: "As whoever maintains the delivery agreement, I want each asset to nominate one baseline calendar that every dataset fits around, owing all or some of its periods, so that a period means one thing within an asset and nothing can quietly run on a faster cadence than the asset's releases."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: one baseline calendar per asset; #109 settled). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL let an asset's calendar.yaml declare at most one calendar, its baseline - effective-dated and versioned as calendars are today - and SHALL accept none only WHERE every dataset of the asset declares no calendar (REQ-PIPE-110 criterion 36)."
      - "THE SYSTEM SHALL put every dataset of the asset that does not declare no calendar (REQ-PIPE-106) on the asset's baseline calendar, and SHALL NOT read a calendar named on a collection or a dataset."
      - "IF an asset's calendar.yaml declares a second calendar, a collection or dataset names a calendar, or a dataset states authored dates of its own, THEN `mothman check` SHALL fail, naming the asset, the item and the file, and saying: a dataset may not be faster than its asset's baseline; a slower one owes a subset of the baseline's periods, stated under participates; to go faster, change the asset's baseline."
      - "THE SYSTEM SHALL express a dataset slower than the baseline only as participation in a subset of the baseline's periods, under participates in its asset's calendar.yaml, with the reason a list of some periods already needs (REQ-PIPE-110 criterion 8)."
      - "THE SYSTEM SHALL hold one period schema per baseline period in an asset's database, and SHALL never create a schema for a period not on its asset's baseline calendar."
      - "THE SYSTEM SHALL have a gate test, seen failing first, that feeds the schedule validator an asset configuration with a monthly calendar beside a quarterly baseline, a collection naming it, and a dataset with its own authored dates, and asserts each is refused with the message of criterion 3 - proving the refusal by a test, not by a dataset."
      - "WHEN the configuration is moved into the two asset folders, THE SYSTEM SHALL produce for every dataset exactly the rounds, slots, instants and periods it produces today, compared against tests/fixtures/calendar_move_pin.json round by round and not re-captured."
    non_functional_requirements:
      - "SCALE: at about 30 quarterly datasets, roughly 70 percent owing every quarter and the rest once or twice a year (contract/calendar.yaml's own header), one baseline plus participation is the shape that stays legible; thirty calendars would drift."
      - "MAINTAINABILITY: removes branches rather than adding one - collection and dataset calendar resolution and per-dataset authored dates go, with their tests (CLAUDE.md test rule 2)."
      - "PRIVACY AT REAL SCALE: one schema per baseline period in one asset's database means a period schema never again holds Birth Registrations beside Child Protection records - qa_tools/common/period_schema.py's own docstring calls that co-location the most sensitive artefact the design creates."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-049
      - REQ-PIPE-110
      - REQ-PIPE-181
    decisions:
      - "ONE BASELINE CALENDAR PER ASSET (Keith, 2026-10-31): 'each data asset needs to have a single baseline calendar'. It makes the period control unambiguous, since a period means one thing within an asset."
      - "WHAT A PERIOD SCHEMA IS, SETTLED (Keith, 2026-10-31, answering #109; none of the three options put): 'a data asset has to nominate a baseline calendar, whether that's quarterly or monthly or daily. And then everything else has to fit around that.' A period schema is one baseline period, which is one release, and there is never a second cadence of schemas inside an asset. REJECTED per-cadence schemas, with or without a release layer on top."
      - "NOTHING FASTER THAN THE BASELINE (Keith, 2026-10-31): a quarterly asset cannot hold a monthly dataset. SLOWER IS PARTICIPATION IN A SUBSET OF BASELINE PERIODS: a dataset on a quarterly asset may be owed in two quarters a year, or annually, meaning one quarter a year. TO GO FASTER, CHANGE THE ASSET: a monthly dataset on a quarterly asset means changing the baseline to monthly and re-expressing every quarterly dataset as owed only in certain months. Changing an asset's baseline is NOT built here; it is a future requirement."
      - "THE REFUSAL IS PROVEN BY A GATE TEST, NOT BY A DATASET (Keith, 2026-10-31): criterion 6."
      - "PER-DATASET AUTHORED DATES ARE RETIRED (delivery-scoper, PROPOSED, following Keith's rule): REQ-PIPE-049 criterion 7 and REQ-PIPE-110 criterion 25 let a dataset replace its calendar's dates, which is a second calendar by another name and can be faster than, or offset from, the baseline. No dataset uses it today (contract/calendar.yaml's datasets section states no dates). REJECTED keeping it, constrained to a subset of baseline dates, which is participation stated twice."
      - "THE PER-COLLECTION CALENDAR CHOICE GOES (Keith, 2026-10-31; brief): REQ-PIPE-110 criteria 10 and 11 and REQ-PIPE-181 criterion 9 have nothing left to choose between. files_go_to_period stays on the collection (REQ-PIPE-320): an offset is not a cadence."
      - "AN ASSET WITH NO CALENDAR STAYS POSSIBLE (delivery-scoper, from CLAUDE.md's project-extraction shape): 'at most one', with REQ-PIPE-110 criterion 36's empty list kept, so the seam for a no-cadence asset is not closed by this rule."
      - "THE calendar_differs RULE BECOMES UNREACHABLE (delivery-scoper): with every calendared dataset on one baseline, two datasets of one asset are never on different calendars, so REQ-PIPE-331 criterion 2's not-applicable branch and REQ-QAC-330 criterion 6's calendar clause can never fire. Amendments A13 and A14 retire them and their tests; the cross-asset case is REQ-PIPE-342 criterion 11's."
    open_questions: []

  - id: REQ-PIPE-346
    title: "A dataset owes a subset of its baseline's periods, named in the baseline's own terms - delivery months on an authored calendar, weekdays on a daily one"
    date_written: "2026-10-31"
    story: "As whoever maintains the delivery agreement, I want participates to name which of the baseline's periods a dataset owes in whatever terms that baseline has - months for a quarterly asset, weekdays for a daily one - so that a weekly dataset on the daily asset is stated as plainly as a twice-yearly one on the quarterly asset."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: #109's test datasets replaced, (a) - a weekly dataset in the daily asset needs NEW participation by weekday, because participates names months only). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL read participates as a subset of the baseline calendar's rounds, named in the vocabulary of the baseline calendar version in force on each round's date - the month of the round's calendar date for an authored calendar, and the weekday of the round's calendar date, on the asset's clock, for a daily cadence rule - or as the keyword all."
      - "THE SYSTEM SHALL accept weekday names in full, case-insensitively, and SHALL NOT accept an abbreviation, a number or a positional index, as month names are accepted today (REQ-PIPE-049 criterion 6)."
      - "IF participates names months for a round whose calendar version is a daily rule, or weekdays for a round whose calendar version is authored, THEN THE SYSTEM SHALL reject the configuration, naming the dataset, the version and the vocabulary that version takes, checking each participation version against every calendar version it overlaps."
      - "THE SYSTEM SHALL apply every existing participation rule to weekdays exactly as to months - the reason a list of some needs, the restate rule, inherit and participation_defaults value by value (REQ-PIPE-181), the newly-owed refusal, which SHALL name the rounds newly owed in the version's own vocabulary, and days_before, naming the weekday of the round's calendar date whatever days_before says."
      - "THE SYSTEM SHALL treat a period a dataset owes nothing in by weekday exactly as one it owes nothing in by month - inherited when the period is born (REQ-PIPE-098), and an arrival in it classified as for any round the dataset does not supply in - with no rule of its own."
      - "THE SYSTEM SHALL show, in the terminal's Calendar entry and `mothman schedule show --dataset <id> --on <date>` (REQ-PIPE-181 criterion 13, REQ-PIPE-327), the weekdays a dataset supplies on, in the form months are shown."
      - "THE SYSTEM SHALL have tests, seen failing first, of a weekday list resolved on a daily calendar, each refusal of criterion 3, an abbreviation refused, and a weekly dataset's non-owed days inheriting its newest supply."
    non_functional_requirements:
      - "GENERIC, NOT A WEEKLY FEATURE (brief; Keith's no-special-case rule): the rule is a subset of the baseline's periods in the baseline's own terms, so a later vocabulary - days of the month on a daily baseline, say - is one more entry in one place, not a new key."
      - "SCALE ON A DAILY ASSET: a weekly dataset owes nothing on six days of seven, each inherited by a view created when the day's schema is born - about six inheritance views a week per weekly dataset, measured by REQ-PIPE-352's bootstrap figures."
      - "CONFIGURATION ONLY: resolving participation reads no database (REQ-PIPE-110 criterion 23)."
    dependencies:
      - REQ-PIPE-345
      - REQ-PIPE-110
      - REQ-PIPE-181
      - REQ-PIPE-098
    decisions:
      - "WEEKDAY PARTICIPATION IS NEW AND NEEDED (Keith, 2026-10-31): participates names months only today, and REQ-PIPE-110 criterion 7 refuses months on a cadence-rule calendar."
      - "ONE KEY, ITS VOCABULARY SET BY THE BASELINE (delivery-scoper, PROPOSED): criterion 1. REJECTED a second key (participates_weekdays), which every reader would have to learn and which two versions could both state."
      - "THE WEEKDAY OF THE ROUND'S CALENDAR DATE, NOT OF THE DUE INSTANT (delivery-scoper, following REQ-PIPE-110 criterion 5's month rule): with days_before 1, a Monday supply due 22:00 on Sunday is still a Monday round."
    open_questions: []

  - id: REQ-DASH-347
    title: "The dashboard words a dataset's participation in its baseline's own terms - 'Weekly (Monday)', 'Not owed — it supplies only on Mondays' - wherever it words months today"
    date_written: "2026-10-31"
    story: "As a data team leader glancing at the daily asset, I want a weekly dataset's tile and its quiet days to say 'Weekly' and which day, so that six quiet days a week read as expected rather than as something missing."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #131 (2026-10-31 morning: a weekly dataset in the daily asset). Drafted by delivery-scoper 2026-10-31. A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHERE a dataset participates by weekday, THE SYSTEM SHALL label its cycle on its SLA tile as 'Weekly (<weekday>)' for one weekday, '<N> days a week (<weekdays>)' for two to six and 'Daily' for all seven, with its delivery time as REQ-DASH-182 criteria 7 and 11 word it (PROPOSED wording)."
      - "THE SYSTEM SHALL word a participation row for a day a dataset owes nothing in as 'Not owed — it supplies only on <weekdays>', from REQ-DASH-182 criterion 14's one label function, and SHALL show consecutive such days as one run, in days, as REQ-DASH-182 criterion 13 does."
      - "THE SYSTEM SHALL show the authored reason once, on the SLA tile, as for month participation (REQ-DASH-182 criterion 11)."
      - "THE SYSTEM SHALL have a tests-js test of each label form of criterion 1, and a real-browser test that a weekly dataset on a day it owes nothing reads neither stale nor 'No data' (REQ-DASH-182 criterion 15's guard, applied to it), asserting first that the day is one it owes nothing in."
    non_functional_requirements:
      - "SCALE: at about thirty daily-asset datasets, a weekly one's quiet days collapse into runs (criterion 2), so its history stays readable."
      - "COMPUTED FROM CONFIGURATION AND RECORDED RESULTS ONLY (REQ-DASH-182 criterion 5)."
    dependencies:
      - REQ-PIPE-346
      - REQ-DASH-182
    decisions:
      - "WORDING IS THE SCOPER'S, FOR KEITH AND THE UX REVIEW (delivery-scoper, PROPOSED): criteria 1 and 2 follow REQ-DASH-182 criterion 8's frequency words."
    open_questions: []

  - id: REQ-QAC-348
    title: "The quarterly asset gains a test collection with one annual dataset - owed in one quarter a year through participates as built - with its contract and checks"
    date_written: "2026-10-31"
    story: "As Keith designing the period control, I want a real dataset on the quarterly asset that is owed only once a year, so that the period view is designed and seen working against an off-baseline cadence from the start, not retrofitted to one."
    moscow: should
    status: not_started
