      - "A19 - REQ-TEST-117 criterion 1 (serves REQ-TEST-353). CURRENT, in part: 'CI SHALL cache a dump of the bootstrapped database, keyed on a hash of every input that shapes it - generator/, synthetic_data_generator/, pipeline/, qa_tools/, contract/, dbt_project/, cli/pipeline.py, pyproject.toml, uv.lock and the workflow file itself.' PROPOSED: 'CI SHALL cache a dump of each asset's bootstrapped database, keyed on a hash of every input that shapes it - the same list, with contract/ replaced by that asset's folder and the repository-wide configuration (REQ-TEST-353 criterion 1).'"
      - "A20 - REQ-TEST-239 criterion 1 (serves REQ-TEST-357). CURRENT, in part: '... runs that commit's own `mothman pipeline bootstrap` from empty into a scratch database named for the label, and writes one baseline file describing surfaces S1, S4, S5 and S7 ...'. PROPOSED: '... runs that commit's own bootstrap from empty for each asset it declares - or once, where it declares none - each into a scratch database named for the label and the asset, and writes one baseline file per asset describing surfaces S1, S4, S5 and S7 ...'."
      - "A21 - REQ-QAC-241 criterion 2 (serves REQ-PIPE-342). CURRENT: 'THE SYSTEM SHALL keep each agency's contract, Soda, Evidently and retired-check files under contract/<agency-id>/, and only the asset-wide files (data-asset.yaml, calendar.yaml, people.yaml, environments.yaml, file-checks.yaml, scripted_decisions.yaml) at the top of contract/; WHEN `mothman check` runs, IF a collection's file sits outside its agency's folder, THEN THE SYSTEM SHALL fail naming it.' PROPOSED: 'THE SYSTEM SHALL keep each agency's contract, Soda, Evidently and retired-check files under contract/<asset>/<agency-id>/, each asset's asset-wide files (data-asset.yaml, calendar.yaml, people.yaml, file-checks.yaml, scripted_decisions.yaml, presentation.yaml) at the top of contract/<asset>/, and only repository-wide files (environments.yaml) at the top of contract/; WHEN `mothman check` runs, IF a collection's file sits outside its agency's folder, THEN THE SYSTEM SHALL fail naming it.'"
      - "A22 - REQ-PIPE-250 criterion 2 (in progress, not built; listed for completeness; serves REQ-PIPE-352). CURRENT: 'WHEN `mothman pipeline bootstrap` runs from empty on this sandbox with all three collections, THE SYSTEM SHALL finish within 12 minutes of wall clock, in each of three consecutive runs recorded in evidence.' PROPOSED (PROVISIONAL on Q5 (a)): 'WHEN each asset's `mothman pipeline bootstrap` runs from empty on this sandbox, THE SYSTEM SHALL finish within 12 minutes of wall clock, in each of three consecutive runs recorded in evidence.'"
