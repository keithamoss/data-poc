      - "THE SYSTEM SHALL restate every built criterion that names contract/data-asset.yaml, contract/calendar.yaml, contract/presentation.yaml, contract/people.yaml, contract/scripted_decisions.yaml or contract/file-checks.yaml - 88 criteria across 50 built requirements on 2026-10-31 - to name the asset's file in its folder (PROVISIONAL on Q4 (a): under one blanket rule recorded here, each touched criterion marked AMENDED, with a count before and after)."
