    non_functional_requirements:
      - "AUDITABILITY: a signed criterion changes only by a quoted, signed amendment (criterion 1)."
      - "MAINTAINABILITY: a half-done sweep is worse than none (REQ-DOCS-101's NFR 1); criterion 2's sweep is one change, with a count before and after."
    dependencies:
      - REQ-PIPE-342
      - REQ-PIPE-345
      - REQ-PIPE-346
      - REQ-PIPE-352
      - REQ-PIPE-354
    decisions:
      - "A1 - REQ-PIPE-049 criterion 1 (serves REQ-PIPE-345). CURRENT: 'THE SYSTEM SHALL hold one or more NAMED delivery calendars per data asset, and each dataset SHALL name exactly one of them.' PROPOSED: 'THE SYSTEM SHALL hold at most one NAMED delivery calendar per data asset, its baseline, and SHALL put every dataset that does not declare no calendar on it (REQ-PIPE-345).'"
      - "A2 - REQ-PIPE-049 criterion 5 (serves REQ-PIPE-346). CURRENT: 'IF a dataset naming a cadence-rule calendar also names delivery months, THEN THE SYSTEM SHALL reject the configuration rather than ignoring the months.' PROPOSED: 'IF a dataset's participation names periods in a vocabulary its baseline calendar version does not take - months on a daily rule, weekdays on an authored calendar - THEN THE SYSTEM SHALL reject the configuration rather than ignoring them (REQ-PIPE-346).'"
      - "A3 - REQ-PIPE-049 criterion 7 (serves REQ-PIPE-345). CURRENT: 'THE SYSTEM SHALL let a dataset override its calendar with its own authored dates instead of subsetting it.' PROPOSED: 'THE SYSTEM SHALL NOT let a dataset state authored dates of its own; a dataset slower than its baseline owes a subset of the baseline's periods (REQ-PIPE-345).'"
      - "A4 - REQ-PIPE-110 criterion 1 (serves REQ-PIPE-342 and 345). CURRENT: 'THE SYSTEM SHALL hold every delivery agreement belonging to a data asset in one file, contract/calendar.yaml - its named calendars, which calendar each collection and dataset is on, and each dataset's participation.' PROPOSED: 'THE SYSTEM SHALL hold every delivery agreement belonging to a data asset in one file, its asset folder's calendar.yaml - its baseline calendar, each collection's files_go_to_period and participation defaults, and each dataset's participation.'"
      - "A5 - REQ-PIPE-110 criterion 5 (serves REQ-PIPE-346). CURRENT, in part: 'THE SYSTEM SHALL state, under the key participates, which of its calendar's rounds a dataset supplies in ... either as the keyword all or by naming delivery months in full and case-insensitively, naming the month of each round's CALENDAR DATE even where days before is set and whatever the collection's files_go_to_period ...'. PROPOSED: the same sentence, with 'by naming delivery months in full and case-insensitively, naming the month of each round's CALENDAR DATE' replaced by 'by naming, in full and case-insensitively, the month - or, on a daily baseline, the weekday - of each round's CALENDAR DATE (REQ-PIPE-346)'."
      - "A6 - REQ-PIPE-110 criterion 7 (serves REQ-PIPE-346). CURRENT: 'IF participates resolves to delivery months for a dataset whose calendar version in force on any of its periods' dates is a cadence rule, THEN THE SYSTEM SHALL reject the configuration, checking each participation version against every calendar version it overlaps.' PROPOSED: 'IF participates resolves to months where the baseline calendar version in force on any of a dataset's periods' dates is a daily rule, or to weekdays where it is authored, THEN THE SYSTEM SHALL reject the configuration, checking each participation version against every calendar version it overlaps.'"
      - "A7 - REQ-PIPE-110 criteria 10 and 11 (serves REQ-PIPE-345). CURRENT: 'THE SYSTEM SHALL let a collection name a calendar, and SHALL apply that calendar to every dataset in the collection that names none of its own.' and 'WHERE a dataset names its own calendar, THE SYSTEM SHALL use it in preference to the one its collection names.' PROPOSED: both RETIRED, replaced by REQ-PIPE-345 criteria 2 and 3, their tests removed in the same change."
      - "A8 - REQ-PIPE-110 criteria 25 and 35 (serves REQ-PIPE-345). CURRENT: criterion 25, 'WHERE a dataset states its own authored dates in place of its calendar's, THE SYSTEM SHALL hold them as effective-dated versions ...'; criterion 35, 'IF a dataset's own authored dates use a period name that any calendar in the file also uses, THEN THE SYSTEM SHALL reject the configuration.' PROPOSED: both RETIRED, replaced by REQ-PIPE-345 criterion 3's refusal."
      - "A9 - REQ-PIPE-110 criterion 18 (serves REQ-PIPE-345). CURRENT: 'IF a dataset in the asset's hierarchy has neither a calendar nor a deliberate no-calendar declaration, or contract/calendar.yaml names a dataset or collection the hierarchy does not hold, THEN THE SYSTEM SHALL reject the configuration naming both files.' PROPOSED: 'IF the asset declares no baseline calendar while a dataset of its hierarchy has no deliberate no-calendar declaration, or the asset's calendar.yaml names a dataset or collection its hierarchy does not hold, THEN THE SYSTEM SHALL reject the configuration naming both files and the asset.'"
      - "A10 - REQ-PIPE-181 criterion 9 (serves REQ-PIPE-345). CURRENT: 'IF a dataset names a calendar other than its collection's and would take any participation value from its collection's participation_defaults, THEN THE SYSTEM SHALL reject the configuration unless the dataset states that value itself, naming the dataset, both calendars and each value.' PROPOSED: RETIRED - no dataset or collection names a calendar (REQ-PIPE-345); its tests removed."
      - "A11 - REQ-PIPE-181 criterion 8 (serves REQ-PIPE-346). CURRENT, in part: '... naming the item, each dataset affected, the months newly owed and the periods those rounds fill ...'. PROPOSED: 'the months newly owed' becomes 'the rounds newly owed, named as participates names them (REQ-PIPE-346)'; the rest unchanged."
      - "A12 - REQ-PIPE-262 criteria 1 and 6 (serves REQ-PIPE-352). CURRENT 1: 'THE SYSTEM SHALL group a bootstrap's collections into streams derived from configuration alone, two collections falling in one stream whenever any dataset of one resolves (schedule.calendar_for_dataset) to a calendar any dataset of the other resolves to, transitively, and SHALL hold no list of collections or calendars of its own.' PROPOSED 1: 'THE SYSTEM SHALL replay every calendared collection of the selected asset as one stream, and each collection none of whose datasets names a calendar as a stream of its own, and SHALL hold no list of collections of its own.' CURRENT 6: 'WHEN a bootstrap of every collection runs without --sequential, THE SYSTEM SHALL run its streams side by side, each in a process of its own, so that a collection on a calendar no other collection uses (Birth Registrations, daily) still runs beside the quarterly stream.' PROPOSED 6: 'WHEN a bootstrap of every collection of the asset runs without --sequential, THE SYSTEM SHALL run its streams side by side, each in a process of its own, so that a no-calendar collection's stream runs beside the asset's calendared stream; the daily and quarterly assets are bootstrapped separately (REQ-PIPE-352).' Criterion 12's 'with all three collections' becomes 'the quarterly asset bootstrapped from empty'."
      - "A13 - REQ-PIPE-331 criterion 2 (serves REQ-PIPE-342 and 345). CURRENT: 'IF a check declares a read of a table no dataset in the hierarchy owns, or of a dataset that is never on the same calendar as the declaring dataset in any period, or that names no calendar at all, THEN `mothman check` SHALL fail, naming the check, the table and the reason; and WHERE the two datasets are on different calendars for a given period, THE SYSTEM SHALL record the check NOT APPLICABLE for that period - in left_out with the reason code calendar_differs (REQ-PIPE-332 criterion 10), counting toward nothing - and SHALL record neither red nor a result for it.' PROPOSED: 'IF a check declares a read of a table no dataset in its asset's hierarchy owns - naming the other asset where one does (REQ-PIPE-342 criterion 11) - or of a dataset that declares no calendar, THEN `mothman check` SHALL fail, naming the check, the table and the reason.' The calendar_differs code, its branch and its tests are RETIRED, and REQ-PIPE-332 criterion 10 is amended to drop that code."
      - "A14 - REQ-QAC-330 criterion 6 (serves REQ-PIPE-342 and 345). CURRENT, in part: 'IF a linked dataset is not in the hierarchy, is never on the same calendar as linkage-keys in any period, or names no calendar at all, names a source column its contract does not declare ...'. PROPOSED: 'IF a linked dataset is not in its asset's hierarchy, or declares no calendar, names a source column its contract does not declare ...', the rest unchanged. The same edit applies to geocoding-v5's REQ-QAC-294 criterion 4; whichever of the two batches lands second reconciles it."
      - "A15 - REQ-PIPE-107 criteria 1 and 12 (serves REQ-PIPE-343). CURRENT 1: 'THE SYSTEM SHALL record, in the database itself, the data asset id (contract/data-asset.yaml's data_asset_id) and the environment id that database belongs to.' PROPOSED 1: '... the data asset id (the selected asset's data_asset_id, REQ-PIPE-343) and the environment id that database belongs to.' CURRENT 12: 'THE SYSTEM SHALL mark the sandbox's database in the session-start hook, CI's database in its workflow, the dev container's database as local in .devcontainer/post-create.sh, and each test worker's database as test in its fixture, in the same change that adds the check.' PROPOSED 12: 'THE SYSTEM SHALL mark each asset's sandbox database in the session-start hook, each asset's CI database in its workflow, each asset's dev-container database as local in .devcontainer/post-create.sh, and each test worker's database as test, for the asset its fixture selects.'"
      - "A16 - REQ-PIPE-092 criteria 7 and 12 (serves REQ-PIPE-354). CURRENT 7: 'THE SYSTEM SHALL name, in the artifact itself, the environment it was built from.' PROPOSED 7: 'THE SYSTEM SHALL name, in the artifact itself, the data asset and the environment it was built from.' CURRENT 12: 'THE SYSTEM SHALL deliver the built artifact by pushing it to a branch GitHub Pages serves directly, and SHALL NOT ask any GitHub Actions job to build it, deploy it, or hold a database credential.' PROPOSED 12: 'THE SYSTEM SHALL deliver each asset's built artifact by pushing it to its own path on a branch GitHub Pages serves directly, replacing nothing outside that path (REQ-PIPE-354), and SHALL NOT ask any GitHub Actions job to build it, deploy it, or hold a database credential.'"
      - "A17 - REQ-DASH-182 criteria 2 and 8 (serves REQ-DASH-347). CURRENT 8, in part: '... label its cycle in words - Yearly for one delivery month a year, Twice a year for two, Quarterly for four, Monthly for twelve, otherwise <N> times a year ...'. PROPOSED 8: the same, adding 'and, where a dataset participates by weekday, as REQ-DASH-347 criterion 1 words it'. Criterion 2's example 'it supplies only in the February and August rounds' gains the weekday form 'it supplies only on Mondays' by the same reference."
