# plans/publishing-and-history.md item 6 - generalising the per-collection code.
# Drafted by delivery-scoper 2026-10-15 night; revised in rounds 2 and 3/4 with
# the main session's calls (docs/drafts/item6/position.md calls 1-28), after the
# dashboard UX, CLI UX and delivery-architect reviews. PROPOSALS, none signed.

- id: REQ-TEST-239
  title: "A before-and-after equivalence harness captures a commit in its own git worktree and proves a refactor changed nothing a bootstrap records, generates, builds or offers"
  date_written: "2026-10-15"
  story: "As whoever generalises the per-collection code, I want one command that captures everything a from-empty bootstrap produces at a named commit, run by that commit's own code, and compares two such captures, so that every refactor step can show it changed no recorded result, generated file, built page or command, rather than assert it."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6, reopened 2026-10-15 night ('small adapter per collection'); main session position.md calls 2, 20, 24 and 28. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL offer `mothman debug equivalence capture --ref <commit> --label <name>`, which checks the commit out into a git worktree of its own, runs that commit's own `mothman pipeline bootstrap` from empty into a scratch database named for the label, and writes one baseline file describing surfaces S1 to S7, without patching any module of the code under capture."
    - "THE SYSTEM SHALL record in every baseline the commit captured, the harness version and the normaliser version, and `compare` SHALL refuse two baselines whose harness or normaliser versions differ, naming both."
    - "THE SYSTEM SHALL offer `mothman debug equivalence compare <a> <b> [--surfaces ...]`, taking surfaces by name or by code, which reports every difference surface by surface, prints both baselines' commits and the number of commits between them, and exits non-zero IF any compared surface differs; its `--help` SHALL list all seven surfaces by name and code."
    - "THE SYSTEM SHALL capture as S1 every row of every base table in the qa schema, under the clock, surrogate, ordinal and derived-column rules tests/equiv_support.py applies today, so that a column added to the qa schema later is compared by default."
    - "THE SYSTEM SHALL capture as S2 every schema name and every supply table's name, row count and digest of its sorted rows."
    - "THE SYSTEM SHALL capture as S3 every tool_output row's raw_output in a per-tool normalised form, whose every rule (a key removed, a path rewritten, a float rounded, a list sorted) is named in one place with the measured reason for it."
    - "WHEN two full captures are taken of the same commit, THE SYSTEM SHALL compare them equal on all seven surfaces - the self-check that proves the normaliser quiet - and this self-check SHALL be run and recorded in this requirement's evidence before any other requirement in this set uses the harness, and kept as an on-demand test."
    - "IF a value cannot be normalised to equality by the self-check, THEN THE SYSTEM SHALL leave it out by name with the measured reason, and SHALL keep every exclusion on every surface in one named list, comparing everything not on it."
    - "THE SYSTEM SHALL capture as S4 the path and sha256 of every file the generators wrote - every delivery, every receipt, the generator bookkeeping and the scenario placements."
    - "THE SYSTEM SHALL capture as S5 every results JSON and dashboard JSON the bootstrap wrote under the worktree's reports/, parsed and compared as JSON with only generated_at removed."
    - "THE SYSTEM SHALL capture as S6, in a real browser with the page clock pinned to the newest recorded receipt instant, the visible text of the executive view and of every real dataset's page each cold-loaded from its own URL, plus the page's own buildDatasetsOn() output for each collection's first, middle and newest receipt dates, and SHALL record the embedded GitHub link values separately, reported but never failing a compare."
    - "THE SYSTEM SHALL capture as S7 the `--help` text of every mothman group and command, and the TUI's menu text, with COLUMNS fixed and NO_COLOR=1."
    - "IF the scratch database's DSN equals MOTHMAN_SUPPLY_DSN, THEN THE SYSTEM SHALL refuse before writing anything, naming both."
    - "IF the data asset is not declared synthetic, THEN THE SYSTEM SHALL refuse to capture."
    - "THE SYSTEM SHALL write nothing under the main working tree's data/, reports/ or dashboard/, and SHALL remove its worktree and drop its scratch database when a capture ends."
    - "IF a baseline with the given label exists, THEN capture SHALL refuse unless `--yes` is given; WHEN a capture succeeds, THE SYSTEM SHALL print the baseline's path."
    - "IF a capture fails at any stage, THEN THE SYSTEM SHALL drop its scratch database, leave no readable baseline, name the stage that failed and exit non-zero."
    - "THE SYSTEM SHALL keep scripted decisions ON in a full capture; WHERE `--reduced` is given, THE SYSTEM SHALL capture over REQ-TEST-116's reduced corpus with scripted decisions off and mark the baseline reduced, and `compare` SHALL refuse a reduced baseline against a full one, naming both."
    - "WHERE `--rebuild-from <dsn>` is given, THE SYSTEM SHALL capture only S5, S6 and S7, building the commit's results and dashboard from that existing database without bootstrapping and without writing to it, so that two commits that differ only in their build can be compared over one kept database."
    - "WHEN a capture finishes, THE SYSTEM SHALL record its bootstrap wall-clock time per collection in the baseline, and `compare` SHALL report both times and their difference."
  non_functional_requirements:
    - "BASELINES ARE STATE, NOT CONFIGURATION (CLAUDE.md, Keith 2026-09-27): a baseline file lives in a scratch directory outside the repository and is never committed."
    - "NEVER THE REAL DATABASE, NEVER A REAL ASSET: criteria 13 and 14; the 2026-09-27 TRUNCATE incident is why."
    - "COST, STATED SO IT IS PLANNED FOR, ACROSS THE WHOLE SET: captures are CHAINED - requirement N's 'after' is N+1's 'before' - so each full capture (a from-empty bootstrap, measured 31m52s on 2026-10-15, plus worktree setup) is taken once. Full captures for REQ-PIPE-240, 241, 242, 243 and 246; `--rebuild-from` for REQ-DASH-244; S7 plus a reduced capture for REQ-TEST-245; one end-to-end compare across the series (REQ-TEST-249). About 4 to 5 hours of captures in total. The reduced corpus (about 3-4 minutes) is the inner loop within a requirement, never its evidence."
    - "BOOTSTRAP TIME, MEASURED NOT GUESSED: each requirement's before and after captures are timed back to back on the sandbox, and a difference is a finding for Keith only above a threshold set from the self-check's own measured noise. Keith's hard 12 minutes is separate work (plans/data-generation.md #12, Q5) and nothing in this set may make it harder."
    - "WORKTREE SETUP IS PART OF THE COST: a worktree needs the project environment, dbt_packages and the Playwright browser; reuse the main checkout's rather than installing per capture."
    - "ONLY THROUGH mothman: the snapshot code moves out of tests/equiv_support.py into a module the command imports, and the existing on-demand tests import it from there."
    - "NO NEW DEPENDENCY: git worktrees, PostgreSQL, Playwright and the generators are already required."
  dependencies: []
  decisions:
    - "BYTE-IDENTICAL REFACTOR FIRST, BEHAVIOUR CHANGES AFTER, NEVER MIXED (main session, position.md call 2, delegated by Keith 2026-10-15). This harness is what makes that checkable."
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - CAPTURES BY COMMIT, IN A GIT WORKTREE, CHAINED (main session's round-4 call 24, after delivery-architect finding E1a). `capture --ref` runs that commit's own code, so the harness is never edited per step and nothing is patched; about 4-5 hours of captures rather than ~10. REJECTED a full before-and-after per requirement with module-patching redirection, as tests/equiv_support does today: the series deletes the very modules it would patch, so the harness would need rewriting at every step and could not capture the 'before' of a change that removed its own patch targets."
    - "SELF-CHECK AND NAMED EXCLUSIONS (main session's round-2 call): raw_output is compared only under a normaliser the same-commit self-check proves quiet; the round-3/4 calls extend named exclusions to every surface (call 24). tests/equiv_support.py excludes raw_output today because 464 of 627 rows differed between two bootstraps of the SAME code (dbt invocation ids, timings and target paths; Soda timestamps, log indices and metric ordering; datacontract-cli run ids; Evidently PSI in the last digit) - ordering and float noise, not only keys."
    - "SCRIPTED DECISIONS STAY ON IN A FULL CAPTURE; ONLY --reduced TURNS THEM OFF; THE HARNESS REFUSES A NON-SYNTHETIC ASSET; HARNESS AND NORMALISER VERSIONS ARE RECORDED AND A CROSS-VERSION COMPARE IS REFUSED (main session's round-4 call 24)."
    - "SURFACES BY NAME, FIXED COLUMNS AND NO_COLOR FOR S7, LABEL REFUSAL WITHOUT --yes, NO READABLE BASELINE AFTER A FAILURE, NO REDUCED-AGAINST-FULL COMPARE (main session's round-3 call 20, after the CLI UX review)."
    - "S6 COLD-LOADS EACH DATASET URL AND ADDS buildDatasetsOn() OUTPUT FOR SAMPLED AS-OF DATES; S7 ADDS THE TUI MENU TEXT (main session's round-3/4 calls 18 and 28). S6 is rendered text, not built HTML: the built file embeds the commit SHA in its links."
    - "SUPERSEDED - round 2's CI ceiling ('a CI cache-miss bootstrap no more than 5% slower across the series') is REPLACED by back-to-back sandbox timings with a threshold from the self-check's measured noise (main session's round-4 call 28): CI runner timings vary too much run to run for a 5% line to mean anything."
  open_questions: []

- id: REQ-PIPE-240
  title: "One collection registry, derived from the hierarchy, behind the dispatch sites whose code survives the series - with a gate, and an allowlist that hands every other site to the requirement that rewrites it"
  date_written: "2026-10-15"
  story: "As someone adding a collection, I want every part of the system to learn the collections from one registry read from contract/data-asset.yaml, so that a new collection is either picked up everywhere or refused by name, never silently skipped or handed another collection's behaviour."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night) and plans/data-generation.md #12 (the delivery-architect's dispatch findings); main session position.md calls 1, 4, 10, 18, 27 and 28. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL declare on each collection in contract/data-asset.yaml's hierarchy a `short` and a `run_prefix` - bdm and run_ for Civil Registration, cp and cp_run_ for Child Protection."
    - "THE SYSTEM SHALL provide one registry module that lists collections only from the hierarchy, in hierarchy order, and resolves a collection by id, by short or by run_prefix, and a dataset by id through one dataset-id index across every collection."
    - "IF a lookup names a collection, short, run prefix or dataset the hierarchy does not declare, THEN THE SYSTEM SHALL refuse with an error naming the value and every known one."
    - "THE SYSTEM SHALL load each collection's adapter only from the qa_tools.collections package, by a module name derived from the collection id, and SHALL NOT import a module path taken from configuration."
    - "THE SYSTEM SHALL make processing_pass, recheck, checkpoints, bootstrap (resume() included) and ticket_sync obtain their collections from the registry, and SHALL leave none of them holding a fixed collection list, map or two-way branch."
    - "WHEN a test hierarchy declares a third collection with an adapter, THE SYSTEM SHALL, at each entry point criterion 5's sites serve, either include the collection or refuse it by name, and SHALL NOT give it another collection's behaviour - one test per site, driving the entry point rather than reading its source."
    - "WHEN `mothman check` runs, IF a collection has no adapter, an adapter names no declared collection, two collections share a short or a run_prefix, one run_prefix begins with another, a run_prefix is not made only of a-z, 0-9 and underscore, a run_prefix leaves any schema or run name derived from it (every suffix, and the adhoc_ and ref_ forms) longer than PostgreSQL's 63 bytes, two collections declare the same dataset id or table name, or a collection's contract file is missing, THEN THE SYSTEM SHALL fail naming each."
    - "WHEN `mothman check` runs, IF a product file under qa_tools/, pipeline/, generator/, cli/ or dashboard/ (the template included) holds a string literal equal to a hierarchy id or short, containing a hierarchy id as a whole hyphen-, dot- or slash-delimited segment, or beginning an f-string with a run_prefix followed by a format field or digit, and the literal is neither exempt nor in a file on the migration allowlist, THEN THE SYSTEM SHALL fail naming the file, line and literal."
    - "THE SYSTEM SHALL exempt from criterion 8 contract/, qa_tools/collections/, generator/collections/ and aws/, and in the scenario register only the INJECTIONS and INHERITING_DATASET values, each exemption listed in the gate with its reason."
    - "THE SYSTEM SHALL list on the migration allowlist every file still holding a dispatch site once this lands, each with the requirement in this set that rewires it, and IF the allowlist names a file that no longer holds such a literal, THEN `mothman check` SHALL fail, so that the allowlist only shrinks."
    - "WHEN `mothman pipeline bootstrap` or `mothman pipeline run` runs over every collection, THE SYSTEM SHALL run each registered collection in its own spawned process, as it does for two today."
    - "WHEN `mothman debug equivalence compare` runs between the full capture of the commit before this change and the full capture of this change (REQ-TEST-239), THE SYSTEM SHALL report no difference on S1 to S7, and the comparison SHALL be this requirement's evidence."
    - "THE SYSTEM SHALL delete every constant this replaces - processing_pass.COLLECTIONS, recheck's map, checkpoints' collection lookup, bootstrap's per-collection names and branches - in the same change."
    - "THE SYSTEM SHALL amend REQ-PIPE-170 criterion 31 in this change to the wording in this requirement's decisions, ONLY IF Keith has approved that wording."
  non_functional_requirements:
    - "BYTE-IDENTICAL (REQ-TEST-239): criterion 12."
    - "BOOTSTRAP TIME, MEASURED: before and after captures timed back to back; a difference above the self-check's measured noise is a finding (REQ-TEST-239). Nothing here may add a per-run cost."
    - "SECURITY: criterion 4 - configuration chooses WHICH adapter of a fixed package loads, never an arbitrary import path; a collection id must match the hierarchy's id pattern before it becomes a module name."
    - "PRIVACY UNCHANGED: a build may read recorded QA results, never actual data, and never anything else (Keith, 2026-09-27); the registry is configuration and opens no connection."
    - "SCALE: the target is about 30 datasets on one asset and a project-extraction asset with no cadence; nothing here may assume a collection is on a calendar."
    - "TEST COST: the third-collection tests use one small fixture collection shared across sites, never a bootstrap per site."
    - "DOCS: CLAUDE.md, README.md and docs/components.md name the registry and drop the constants it deletes, in the same change."
  dependencies:
    - REQ-TEST-239
    - REQ-QAC-039
  decisions:
    - "SHAPE (main session, position.md call 1, delegated): shared per-tool modules built from Child Protection's N-table code, a registry derived from contract/data-asset.yaml, one QA adapter module per collection behind a CollectionAdapter Protocol, one COLLECTION_DATA const in the dashboard. REJECTED config-only with no Python, and fixing only the dispatch points (Keith, 2026-10-15: 'small adapter per collection'). REJECTED the delivery-architect's registry plus copied runners (offered to Keith and declined, plans/data-generation.md #12 Q1)."
    - "SHORT AND RUN_PREFIX ARE DECLARED, NOT DERIVED (position.md call 4): deriving them would rename every recorded Birth Registrations run."
    - "EACH DISPATCH SITE IS REWIRED ONCE (main session's round-4 call 27, after architect finding E4a): this requirement rewires only sites whose code survives the series; every other site sits on the allowlist and is rewired, with its third-collection test, by the requirement that rewrites its file. REJECTED rewiring all ~45 sites here, which would rewire code the next requirement deletes."
    - "DEPARTED FROM call 27's LIST IN TWO PLACES, delivery-scoper round 3, for call 27's own reason: the check-source lists move to REQ-QAC-241 (it changes what the sources ARE - Evidently YAML, per-collection dbt folders - so deriving them here first would rewire them twice) and github_links moves to REQ-DASH-244 (calls 16 and 17 rewrite what it links to). Neither site is reached by a third collection before Emergency Department, so nothing is exposed in the gap."
    - "REGISTRY AND SURVIVING DISPATCH SITES IN ONE REQUIREMENT: a registry with no consumers would be product code only tests call, which Keith's 2026-10-12 rule calls dead code."
    - "THE ADAPTER PROTOCOL GROWS STEP BY STEP, AS PER-TOOL SUB-OBJECTS (.dbt, .soda, .datacontract, .evidently, .staging, .stats, .present; main session's round-4 call 28): here it carries identity plus temporary pointers to each collection's existing orchestrator and warehouse builder, which REQ-PIPE-243 removes."
    - "ADAPTER MODULES ARE NAMED BY COLLECTION ID with hyphens as underscores (qa_tools/collections/civil_registration.py, child_protection.py)."
    - "GATE ADDITIONS (main session's round-3/4 calls 18 and 28): dataset ids and table names unique across collections, one dataset-id index; run_prefix limited to a-z, 0-9 and underscore and short enough that every derived name fits PostgreSQL's 63 bytes. dbt singular-test name uniqueness needs the per-collection dbt folders, so it is gated in REQ-QAC-241."
    - "ALL FOUR LITERAL-GATE NARROWINGS (main session's round-2 call): run prefixes matched only at an f-string head before a format field or digit (bdm's prefix is run_, and a substring match would flag run_id everywhere); shorts as exact literals; an allowlist that only shrinks; an orphan adapter fails on this asset today. The scenario register's exemption names INJECTIONS and INHERITING_DATASET only (round-4 call 28)."
    - "AN ORPHAN ADAPTER FAILS - ON THIS ASSET, TODAY. The real target is two assets in separate deployments from one codebase (CLAUDE.md, Keith 2026-09-21), where this rule would fail both; whether a second asset's adapters share this package is out of scope and must revisit this rule."
    - "ELEVEN REQUIREMENTS, NOT position.md call 12's EIGHT (main session's round-2 call): dashboard and CLI split; behavioural retirement and shape unification split; the fake-collection proof added."
    - "AWS IS SCOPED OUT (position.md call 9): the ingest handlers reach collections only through s3_arrival and the processing pass, which this rewires; tests/test_lambda_handlers.py must still pass."
    - "PROPOSED WORDING FOR REQ-PIPE-170 CRITERION 31, for Keith (built behaviour, outside the delegation; position.md call 13): 'WHEN a replay of every collection the data asset declares finishes - a bootstrap, or `mothman pipeline run` over all of them - THE SYSTEM SHALL confirm every pending correction dated up to now, the oldest first, through the same confirmation a person uses, as the synthetic actor holding the asset manager role during playback, and SHALL rebuild every collection's results if any was confirmed; a replay of fewer than every collection SHALL leave them pending. AMENDED <date applied> by REQ-PIPE-240.'"
  open_questions:
    - "FOR KEITH: approve criterion 14's wording for REQ-PIPE-170 criterion 31, or say otherwise. Without it, criterion 14 drops and the code still reads 'every collection', with the built criterion's text lagging."
    - "CHECK AT BUILD (not for Keith): that adding short and run_prefix to a collection entry is not a change agreement_freeze (REQ-PIPE-111) refuses."

- id: REQ-QAC-241
  title: "Every tool's checks are found the same way - Evidently's definitions in contract YAML, each collection's dbt files in a folder of its own, and every check-source list from the registry"
  date_written: "2026-10-15"
  story: "As someone adding a collection, I want its checks for all four tools to sit in files found by convention from the registry, so that the lifecycle gate, the band and table-read gates and the runners pick up a new collection's checks without anyone editing a list in code."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); main session position.md calls 5, 27 and 28. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL define each collection's Evidently checks in contract/<stem>-evidently-checks.yml, and its retired ones in contract/<stem>-evidently-checks-retired.yml, where <stem> is the collection's contract file name less '-contract.yaml'."
    - "THE SYSTEM SHALL write every date in those files quoted, or coerce it to a string on reading, and SHALL carry every Evidently check's check_id, category, introduced_date, description, failure_indicates, technical_note, column, method, thresholds and changelog unchanged, with an unchanged config_hash for every one."
    - "THE SYSTEM SHALL keep each collection's dbt models, sources, schema files and singular tests under dbt_project/models/<collection_id>/ and dbt_project/tests/<collection_id>/, leaving shared macros and generic tests where they are."
    - "WHEN `mothman check` runs, IF a dbt model, source, schema file or singular test sits outside every collection's folder and is not a shared macro or generic test, or two collections declare a singular test of the same name, THEN THE SYSTEM SHALL fail naming each."
    - "WHEN `mothman check`'s lifecycle gate runs against a base commit from before this change, THE SYSTEM SHALL report no check added, removed, retired or changed, for any of the five check sources (dbt, Soda, the contracts, file checks, Evidently)."
    - "WHEN the lifecycle gate reads a base ref, THE SYSTEM SHALL derive that side's check sources from the base ref's own hierarchy, and SHALL read Evidently checks of a ref predating this change through a legacy Python reader that carries its own removal note and is deleted by REQ-PIPE-248."
    - "THE SYSTEM SHALL derive the check-source lists in validate_check_lifecycle.py, tables_read.py, soda_common.py, check_bands.py and check_lifecycle.py from the registry - each collection's contract, Soda, Evidently and retired-sibling files and its dbt folders - plus the shared dbt files and contract/file-checks.yaml."
    - "IF a registered collection lacks its contract, Soda or Evidently check file, THEN `mothman check` SHALL fail naming the collection and the file; a missing retired sibling SHALL remain allowed, as today."
    - "WHEN Evidently runs for a collection, THE SYSTEM SHALL read its checks from that collection's Evidently YAML, and no Evidently check_id SHALL remain as a Python constant."
    - "THE SYSTEM SHALL include the new Evidently files and the per-collection dbt folders in validate_check_lifecycle.sources_fingerprint(), so that REQ-PIPE-192's cache sees an edit to them."
    - "THE SYSTEM SHALL NOT change docs/check-authoring-rules.md, and SHALL keep Evidently's config-hash exclusion an explicit list of names, so that that document's 'one real trap' passage stays true; IF the design needs that passage changed, THEN the exact wording SHALL go to Keith before the edit."
    - "WHEN `mothman debug equivalence compare` runs between the full capture of the commit before this change and the full capture of this change, THE SYSTEM SHALL report no difference on S1, S2, S4, S5 and S7; S3's differences SHALL be confined to dbt's own file paths for the moved files and S6's to the reported GitHub link values, each listed in this requirement's evidence."
    - "THE SYSTEM SHALL delete the four evidently_check_lifecycle*.py modules under qa_tools/bdm/ and qa_tools/cp/ in the same change, and SHALL remove from the migration allowlist every file whose dispatch sites this requirement rewires."
  non_functional_requirements:
    - "BYTE-IDENTICAL (REQ-TEST-239): criterion 12, and criterion 5 is the check-definition equivalent - zero lifecycle changes proves moving a definition did not change it."
    - "THE AUTHORING STANDARD IS UNTOUCHED (CLAUDE.md, Keith 2026-09-20): criterion 11."
    - "YAML HYGIENE: the new files pass pre-commit's check-yaml hook; every threshold parses to the same float it was in Python, and every date to the same string (criterion 2)."
    - "SCALE: at 30 datasets the source lists are found by convention, not maintained by hand."
    - "CONFIGURATION ONLY AT GATE TIME: no database and nothing under data/."
  dependencies:
    - REQ-PIPE-240
  decisions:
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - EVIDENTLY CHECKS MOVE OUT OF PYTHON (main session, position.md call 5): every tool's checks found the same way. Ids and prose unchanged; the authoring standard untouched."
    - "PER-CHECK PRESENTATION METADATA STAYS IN THE ADAPTERS FOR NOW (position.md call 6); moving it into the check files is a logged follow-up."
    - "PER-COLLECTION dbt FOLDERS LIVE HERE (main session's round-4 call 28, placed here by delivery-scoper): it is a change to where a collection's checks are found, which is this requirement's subject; the runner scoping nodes by the adapter's table set is REQ-QAC-242's. It is a precondition of REQ-TEST-249, whose fake collection adds dbt files only inside its own folders."
    - "DATES QUOTED OR COERCED (round-4 call 28): an unquoted YAML date parses to a date object, not the string the Python dict held, and would move config_hash."
    - "THE BASE SIDE FROM THE BASE REF'S OWN HIERARCHY, WITH A TIME-BOXED LEGACY READER (round-4 call 28): collect_checks() reads each source at the base ref, so deriving the list from today's tree would find no Evidently YAML at a pre-move ref. REJECTED keeping the legacy reader indefinitely - it is dead the moment no diff base predates this change."
    - "THE SOURCE LISTS ARE REWIRED HERE, NOT IN REQ-PIPE-240 - delivery-scoper's departure from call 27's list, for call 27's own one-rewire reason; see REQ-PIPE-240's decisions."
    - "CRITERION 5 IS THE REAL TEST: REQ-QAC-039's 258-id rename was proved the same way - zero config_hash changes against the previous commit."
  open_questions:
    - "CHECK AT BUILD (not for Keith): whether moving a singular test changes its dbt definition hash (it covers 'the text and the files it came from') or its recorded node identity; criterion 5 fails if so, and the fix belongs in how the hash names files, not in a tolerance."

- id: REQ-QAC-242
  title: "One shared module per QA tool and one staging module serve every collection, with each collection's differences preserved behind named legacy flags on its own adapter"
  date_written: "2026-10-15"
  story: "As someone adding a collection, I want dbt-core, Soda Core, datacontract-cli and Evidently each run by one shared module, and supplies staged by one, reading what differs from the collection's adapter, so that a new collection gets all four tools without copying a runner."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); groundwork.md section 1; main session position.md calls 1, 2, 11, 25, 27 and 28. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL run dbt-core, Soda Core, datacontract-cli and Evidently for every collection through one shared module per tool, and stage every collection's supplies through one shared staging module, built from Child Protection's N-table code."
    - "THE SYSTEM SHALL take every collection-specific input those modules need from the adapter's per-tool sub-objects - .dbt, .soda, .datacontract, .evidently and .staging."
    - "WHEN dbt runs for a collection, THE SYSTEM SHALL select only the nodes for the tables in that collection's adapter."
    - "THE SYSTEM SHALL preserve each place either collection's recorded output differs from what the shared code would produce behind a named legacy flag on that collection's own adapter, every flag listed in this requirement's decisions with what it preserves, so that no refactor step changes either collection's output."
    - "IF an adapter declares a legacy flag the shared modules do not know, THEN `mothman check` SHALL fail naming it."
    - "THE SYSTEM SHALL NOT, in a shared module, compare a collection's id, short or run prefix to choose behaviour; a difference is an adapter value or a legacy flag."
    - "WHEN `mothman debug run-dbt`, `run-soda`, `run-datacontract` or `run-evidently` runs for any registered collection, THE SYSTEM SHALL record the same results as before this change."
    - "WHEN `mothman debug equivalence compare` runs between the full capture of the commit before this change and the full capture of this change, THE SYSTEM SHALL report no difference on S1 to S7, S3 included under its normaliser."
    - "THE SYSTEM SHALL delete the eight run_*_bdm.py and run_*_cp.py modules, build_per_run_warehouses.py and build_cp_warehouses.py in the same change, and SHALL remove from the migration allowlist every file whose dispatch sites this requirement rewires, each rewired site carrying a third-collection test."
    - "THE SYSTEM SHALL move every test that monkeypatches an attribute of a deleted module to the shared module in the same change, and SHALL NOT keep a test whose only assertion is that a deleted module is gone."
  non_functional_requirements:
    - "BYTE-IDENTICAL (REQ-TEST-239): criterion 8."
    - "BOTH COLLECTIONS MOVE IN ONE CHANGE: never a period where one collection runs the shared module and the other its copy."
    - "BOOTSTRAP TIME, MEASURED (REQ-TEST-239). REQ-TEST-116's tool overlap (dbt beside the other three) is preserved exactly."
    - "TEST COST: shared-tool tests run against one one-table and one N-table fixture, never parametrised over every real collection - at 30 that would multiply the suite by 30."
    - "PRIVACY UNCHANGED: a shared module records no more row-level failing values than the copy it replaces did."
  dependencies:
    - REQ-TEST-239
    - REQ-PIPE-240
    - REQ-QAC-241
  decisions:
