    - REQ-PIPE-240
    - REQ-QAC-241
  decisions:
    - "SHARED MODULES START FROM CHILD PROTECTION'S CODE (groundwork.md): its copy carries the N-table, multi-table and cross-table logic. plans/qa-pipeline.md #84's caveat - do not force genuinely different logic into one abstraction - is honoured by the adapter and the legacy flags."
    - "LEGACY FLAGS ON BOTH ADAPTERS (main session's round-4 call 25, after architect finding E2a), REPLACING round 1's 'no legacy flag on the Child Protection adapter': the copies are a NEAR superset, not a strict one. REJECTED changing Child Protection's output inside a refactor step."
    - "LEGACY FLAGS, PROVISIONAL LIST (each confirmed at build by a failing comparison without it). Birth Registrations: no left_out.note; no dbt built-model guard; no skipped status case; no unrunnable results; Evidently raw output carries a row_count snapshot; the Soda '[scope]' check-name suffix. Child Protection: empty Soda dimensions on 88 checks. Either or both, adapter to be confirmed at build: the divergent row_count_invalid branches; dbt model-level-test routing; test-shape sampling."
    - "PER-TOOL SUB-OBJECTS (round-4 call 28): an adapter is .dbt, .soda, .datacontract, .evidently, .staging (here), .stats (REQ-PIPE-243) and .present (REQ-DASH-244), so each shared module reads only its own part."
    - "THE dbt RUNNER SCOPES BY THE ADAPTER'S TABLE SET (round-4 call 28), relying on REQ-QAC-241's per-collection folders."
    - "TESTS FOLLOW THE CODE (position.md call 11)."
  open_questions: []

- id: REQ-PIPE-243
  title: "One shared orchestrator, dataset-stats computation and results-from-history rebuild serve every collection"
  signed_off:
    by: Keith
    date: "2026-10-16"
  date_written: "2026-10-15"
  story: "As someone adding a collection, I want the run orchestration, the dataset statistics and the rebuild of results from recorded history shared, so that a new collection's supplies are run, summarised and rebuilt without more copied modules."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); groundwork.md sections 1 and 4; main session position.md calls 1, 2, 12, 19 and 27. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL run every collection's single runs and batch pipeline through one shared orchestrator, compute every collection's dataset statistics through one shared module reading the adapter's .stats, and rebuild every collection's results from recorded history through one shared module."
    - "THE SYSTEM SHALL take each collection's aggregate specification, value-count column and claim-window dataset from its adapter, and SHALL NOT fall back to a named dataset when an adapter gives none (groundwork site 25, `_claim_window`'s default of cp-clients)."
    - "THE SYSTEM SHALL preserve Birth Registrations' recorded dataset-stats shape (row_count rather than row_counts, aggregates keyed by column, zeros kept) and its results JSON shape behind named legacy flags."
    - "THE SYSTEM SHALL remove qa_tools/cp/dataset_stats.py's import of qa_tools.bdm.dataset_stats and cli/common.py's import of RUN_STEPS from orchestrate_bdm."
    - "THE SYSTEM SHALL keep every adapter module importable without importing any QA tool library, so that the registry and the CLI can read an adapter's declarations cheaply."
    - "WHEN the processing pass, a recheck or a bootstrap runs a collection, THE SYSTEM SHALL reach the shared orchestrator through the registry, and the adapters SHALL lose the temporary orchestrator and warehouse-builder pointers REQ-PIPE-240 gave them."
    - "WHEN `mothman debug equivalence compare` runs between the full capture of the commit before this change and the full capture of this change, THE SYSTEM SHALL report no difference on S1, S4, S5 and S7, and that capture SHALL serve as REQ-GEN-246's 'before'."
    - "THE SYSTEM SHALL delete both orchestrators, both dataset_stats.py, both build_results_from_history.py, bdm_common.py and cp_common.py, and with them the qa_tools/bdm/ and qa_tools/cp/ packages, in the same change, and SHALL remove from the migration allowlist every file whose dispatch sites this requirement rewires, each with a third-collection test."
  non_functional_requirements:
    - "BYTE-IDENTICAL (REQ-TEST-239): criterion 7."
    - "A BUILD MAY READ RECORDED QA RESULTS, NEVER ACTUAL DATA, AND NEVER ANYTHING ELSE (Keith, 2026-09-27): the shared rebuild-from-history reads only the qa schema."
    - "BOOTSTRAP TIME, MEASURED (REQ-TEST-239): the orchestrator is the inner loop, so a per-run cost added here multiplies by every arrival (150 or more today)."
    - "RELIABILITY: a run that fails partway records what it recorded before, exactly as the copies do."
    - "DOCS: CLAUDE.md's layout table, README.md and docs/components.md stop naming the deleted packages in the same change."
  dependencies:
    - REQ-QAC-242
  decisions:
    - "STATS, RESULTS AND ORCHESTRATOR IN ONE REQUIREMENT (position.md call 12): they are the last users of the per-collection packages, so together they let qa_tools/bdm/ and qa_tools/cp/ go whole."
    - "ADAPTERS IMPORTABLE WITHOUT TOOL CODE (main session's round-3 call 19, after the CLI UX review): criterion 5 is what lets REQ-TEST-245's `--help` stay import-free at 30 collections."
    - "THE claim-window FALLBACK silently defaults to a Child Protection dataset; a third collection would claim under cp-clients' window."
    - "THE SHAPE LEGACY FLAGS HERE ARE RETIRED BY REQ-PIPE-248: they change formats, not verdicts."
    - "REQ-GEN-246 LANDS STRAIGHT AFTER THIS ONE (main session's round-5 call 30, P2): its 'before' is this requirement's kept 'after', so the chain needs no extra full capture; REQ-DASH-244 and REQ-TEST-245 follow REQ-GEN-246."
  open_questions: []

- id: REQ-DASH-244
  title: "The dashboard is built for every collection by one Python builder and rendered from one COLLECTION_DATA const, with a dataset's GitHub link opening its contract and the agency pill removed"
  signed_off:
    by: Keith
    date: "2026-10-16"
  date_written: "2026-10-15"
  story: "As a data team leader, I want every real collection on the register built and shown the same way, so that a newly added collection appears with its real results - or plainly as not yet supplied - rather than looking as though it has no data because nobody wired it in."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); groundwork.md sites 17 to 20; main session position.md calls 1 and 14 to 18 (after the dashboard UX review), 27 and 28. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL build every collection's dashboard data through one shared pipeline/build_dashboard_data.py, taking each column's and table's type and description from the collection's ODCS contract, with no per-collection presentation code, and SHALL delete pipeline/build_cp_dashboard_data.py in the same change."
    - "BEFORE the builder switches source, THE SYSTEM SHALL move each collection's richer column and table notes from today's builders into its contract's description fields, so that the page's text is unchanged."
    - "THE SYSTEM SHALL NOT have one collection's dashboard build import or mutate another's module state."
    - "THE SYSTEM SHALL embed every collection's dashboard data into one template const, COLLECTION_DATA, keyed by collection id in hierarchy order, each entry self-contained, and SHALL remove REAL_BIRTH_REG_DATA and REAL_CP_DATA."
    - "THE SYSTEM SHALL build every real collection's datasets in the page through one function, replacing buildBirthRegistrations and buildChildProtectionDatasets, resolving a dataset through one dataset-id index."
    - "WHEN a registered collection has no recorded runs, THE SYSTEM SHALL emit an entry holding every declared dataset with an empty history, and the page SHALL render the existing never-supplied or not-owed-yet notice for each."
    - "IF the hierarchy declares a real collection that has no entry when the page is embedded, THEN THE SYSTEM SHALL fail naming the collection, the file it expected and the command that makes it, and SHALL write no page."
    - "WHEN `mothman check` runs, IF a registered collection's adapter has no .present part the builder can read, THEN THE SYSTEM SHALL fail naming the collection, before any build."
    - "THE SYSTEM SHALL derive embed_dashboard_data.py's targets, cli/dashboard.py's, snapshot_dashboard.py's and check_dashboard_renders.py's collection lists, and github_links, from the registry."
    - "THE SYSTEM SHALL move the template's AGENCY_BLURB into a presentation configuration file under contract/, separate from data-asset.yaml, read by the builder, rendering the same text."
    - "THE SYSTEM SHALL preserve Birth Registrations' dashboard JSON shape and its two display drifts (dropping empty pseudo-columns, the reference-reason fallback for not_evaluated) behind named legacy flags."
    - "WHEN a reader opens a real dataset's 'View on GitHub', THE SYSTEM SHALL open its collection's ODCS contract, under its agency's folder, anchored at that dataset's entry, with a tooltip naming the file."
    - "THE SYSTEM SHALL keep the agency-level GitHub pill, linking to that agency's folder, contract/<agency-id>/, on GitHub."
    - "THE SYSTEM SHALL carry one CHANGELOG.yaml entry for criteria 11 and 12 in the same push."
    - "WHEN `mothman debug equivalence compare` runs between the full capture of the commit before this change and the full capture of this change, THE SYSTEM SHALL report no difference on S1, S4 and S7, and on S5 none outside the dataset and agency links' targets and tooltips, each listed in this requirement's evidence; the links themselves SHALL be proved in a real browser by tests/test_dashboard_e2e.py."
    - "WHEN the raw template is opened with its illustrative mock data, THE SYSTEM SHALL render with zero console errors, as tests-js/dashboard-loads.test.js holds it to today."
    - "THE SYSTEM SHALL remove from the migration allowlist every file whose dispatch sites this requirement rewires, each with a third-collection test."
  non_functional_requirements:
    - "WHAT A READER SEES CHANGES ONLY WHERE NAMED: criterion 14, under a pinned clock and cold-loaded URLs; tests/test_dashboard_e2e.py's TestStatusMatchesEachToolsOwnVerdict also passes."
    - "SELF-CONTAINED ENTRIES (main session's round-3 call 18): no COLLECTION_DATA entry references another, so loading collections lazily stays possible later."
    - "PAGE SIZE AND RENDER TIME: the built page within 1% of the baseline's size and tests/test_dashboard_e2e.py's duration reported before and after; growth beyond about 10% is a finding."
    - "A BUILD MAY READ RECORDED QA RESULTS, NEVER ACTUAL DATA, AND NEVER ANYTHING ELSE (Keith, 2026-09-27): the shared builder keeps the publisher's least-privilege grant."
    - "COMPATIBILITY: the page still opens from a plain file:// with no network, assets self-hosted."
    - "BOTH TOOLCHAINS: npm test, the Python suite and tests/test_dashboard_e2e.py all run for the template change."
  dependencies:
    - REQ-PIPE-243
    - REQ-GEN-246
  decisions:
    - "KEITH, 2026-10-16: asked why each collection needed a Python builder; none does. .present dropped - types and descriptions come from each ODCS contract, the builders' richer notes moved into the contracts first ('Contract, enrich first'). The agency pill KEPT, linked to the agency's folder ('Make agency folders'), which REQ-QAC-241 now creates. REJECTED keeping .present, reading the contracts as they stand, linking the pill to the hierarchy entry or a code search."
    - "ONE COLLECTION_DATA CONST (position.md call 1), iterated in hierarchy order, with one dataset-id index and dataset ids unique across collections (main session's round-3 call 18)."
    - "A ZERO-RUN COLLECTION IS NOT A MISSING ONE (main session's round-3 call 14, after dashboard UX finding 1): it renders the existing never-supplied or not-owed-yet notice; only a declared collection with no entry fails, and `mothman check` catches an unwired collection before any build."
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - ONE MISSING COLLECTION FAILS THE WHOLE BUILD (main session's round-3 call 15, UX Q1 (a)): with call 14's gate an unwired collection never reaches a build, so a missing entry means a builder crashed, and publishing a page that silently lacks a collection is the false quiet item 6 exists to remove. REJECTED (b), a 'results not built' tile, for now; revisit when a real deployment has more than a handful of collections."
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - A DATASET'S 'View on GitHub' OPENS ITS ODCS CONTRACT, ANCHORED AT THE DATASET (main session's round-3 call 16, UX Q2 (b)): the contract is what the dataset is held to, and the tooltip names the target. This REPLACES round 2's call that it point at the collection's adapter module - REJECTED because an adapter is code a data team leader cannot read, and it says nothing specific to the dataset."
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - THE AGENCY-LEVEL PILL IS REMOVED (main session's round-3 call 17, UX Q3 (a)): no single file stands for an agency once it owns several collections, and a link to a config entry answers no reader's question. A second visible change, sharing criterion 13's CHANGELOG entry."
    - "AGENCY_BLURB MOVES TO PRESENTATION CONFIGURATION (round-4 call 28), not into data-asset.yaml: the template's own comment says the hierarchy has no business knowing how the page describes an agency."
    - "github_links IS REWIRED HERE, NOT IN REQ-PIPE-240 - delivery-scoper's departure from call 27's list, since calls 16 and 17 rewrite what it links to."
    - "SPLIT FROM THE CLI FACTORY (main session's round-2 call): different component, proof and reviewers."
    - "REBUILT OVER REQ-PIPE-243's KEPT 'AFTER' (main session's round-5 call 30, P1): REQ-GEN-246 lands between them but is proved byte-identical on S1, so the recorded results that database holds are those this commit's own bootstrap would record. Follows REQ-GEN-246 in sequence (P2)."
    - "THE TWO DISPLAY DRIFTS ARE RETIRED BY REQ-QAC-247; THE JSON SHAPE BY REQ-PIPE-248."
  open_questions: []

- id: REQ-TEST-245
  title: "One factory builds each collection's mothman command group, labelled and listed from the registry, with help that imports no tool and a broken adapter that takes down only its own commands - a refactor that changes no help or menu text"
  signed_off:
    by: Keith
    date: "2026-10-16"
  date_written: "2026-10-15"
  story: "As someone adding a collection, I want `mothman <short>` and the TUI's menus to appear for it from the registry, labelled as people already know them, so that a new collection gets its generate and qa commands without a copied CLI module and without slowing or breaking anyone else's."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); groundwork.md sites 13 to 16; main session position.md calls 1, 12 and 19 to 23 (after the CLI UX review), and 27. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; re-scoped by delivery-scoper 2026-10-16 after Keith's two decisions that day, which split the ~30-collection behaviour out into REQ-TEST-252. A PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL create the `mothman <short>` group for every registered collection through one factory, and SHALL delete cli/bdm.py and cli/cp.py in the same change."
    - "THE SYSTEM SHALL label a one-table collection by its dataset's name and an N-table collection by its collection's name, in the TUI menus and in group help, so that today's 'Birth Registrations' and 'Child Protection' read exactly as they do."
    - "THE SYSTEM SHALL give a one-table collection's `qa` command a --file option, and an N-table collection's a --folder option and a --table choice listing its tables from the hierarchy."
    - "WHERE a collection's generator provider declares the target-trial capability, THE SYSTEM SHALL offer `--skip-target-trial` on its generate-synthetic-data command, reading that one declaration, and SHALL NOT offer it otherwise."
    - "THE SYSTEM SHALL build the TUI's two 'Which dataset?' menus in cli/app.py (Quality Assurance and Generate synthetic data) from the registry in hierarchy order, dispatching the choice to that collection's own group, with no branch that sends an unknown choice to Child Protection, proved by driving both menus with scripts/dev/tui_drive.py."
    - "THE SYSTEM SHALL provide one shared --collection option in cli/common.py, generated from the registry and used by every command that takes --collection in cli/pipeline.py, cli/debug.py and cli/supply.py, which in this change accepts exactly the values each of those commands accepts today and renders exactly today's help text, legend and refusal for each."
    - "WHEN `mothman --help`, any `mothman <short> --help` or any `mothman <short> qa --help` runs, THE SYSTEM SHALL import none of pandas, numpy, duckdb, soda, dbt, datacontract or evidently, checked by a test that inspects sys.modules in a fresh interpreter, against a measurement of today's imports and time taken before the change and recorded in this requirement's evidence (2026-10-16 sandbox, informally: `mothman --help` imports pandas, numpy, duckdb and soda, cli.app import about 1.0s, the whole command about 1.45s under uv)."
    - "IF a collection's adapter cannot be loaded, THEN its own commands SHALL refuse naming the collection and the error, every other command SHALL work, and no traceback SHALL be shown."
    - "WHEN any existing collection command runs with the same arguments as before, THE SYSTEM SHALL exit with the same code and the same output."
    - "WHEN `mothman debug equivalence compare` runs between captures of the commit before this change and of this change, THE SYSTEM SHALL report no difference on S7, the TUI menu text included, nor on S1, S4 or S5."
    - "THE SYSTEM SHALL remove from the migration allowlist cli/app.py, cli/pipeline.py, cli/debug.py and cli/supply.py, each rewired site with a third-collection test."
  non_functional_requirements:
    - "BYTE-IDENTICAL (REQ-TEST-239): S7 is the CLI's public surface; criterion 9 covers what help text cannot. Every help or menu change at ~30 collections is REQ-TEST-252's, never this requirement's."
    - "RESPONSIVENESS: criterion 7 - a factory that imports every adapter's tool dependencies to build a menu would make every command slower at 30 collections. Relies on REQ-PIPE-243 criterion 5 and REQ-GEN-246 criterion 7. REQ-TEST-252 holds the same rule at 30."
    - "RELIABILITY: criterion 8 - one broken adapter never takes the whole CLI down."
    - "ONLY THROUGH mothman: the factory adds no command a user could not reach before, and no new entry point outside cli/."
    - "DEMO: dashboard/demos/qa_wizard.cast stays true, since the TUI text is unchanged."
  dependencies:
    - REQ-PIPE-243
    - REQ-GEN-246
  decisions:
    - "ALL FOUR CLI UX GAPS ADOPTED (main session's round-3 call 19): the label rule with a tui_drive check; an import-free `--help` measured against today first; a 30-collection fixture; a broken adapter refused by name without a traceback. Plus one shared --collection helper with a registry-generated legend. The 30-collection fixture MOVED to REQ-TEST-252 (delivery-scoper, 2026-10-16), which is the requirement that changes behaviour at that size; this one proves the refactor at today's two."
    - "LABEL BY DATASET FOR ONE TABLE, BY COLLECTION FOR SEVERAL (main session's round-3 call 21): reproduces today exactly. REJECTED the collection's name always (changes what users see, mid-refactor) and a declared display label (one more field, nothing needs it yet)."
    - "SUPERSEDED - round 3's call 22 ('THE CLI AT 30 COLLECTIONS ... IS NOT IN THIS SERIES') is REVERSED by Keith, 2026-10-16 ~07:10 Perth, verbatim: \"their code is in scope for what we're doing here\" - the CLI and TUI at ~30 collections is part of item 6 (proposal.md significant call 9, position.md call 22; plans/running-thoughts.md #101). It is scoped as REQ-TEST-252, landing straight after this requirement, so this step stays byte-identical and the behaviour change is its own reported step - position.md call 2's 'byte-identical refactor first, behaviour changes after, never mixed', which Keith's decision does not touch."
    - "ANSWERED - position.md call 23's question. Keith, 2026-10-16 ~06:50 Perth, verbatim: \"~30 collections\" - thirty collections, each with its own command group, not a handful of collections holding about 30 datasets."
    - "ONE COMMAND GROUP PER COLLECTION STANDS (proposal.md significant call 9's first half; Keith 2026-10-16, 'all ten significant calls stand otherwise'). REJECTED for this series a single `mothman qa --collection <short>` replacing the per-collection groups: it would change every documented invocation, and Keith kept the per-collection groups."
    - "THE OPTION SHAPE FOLLOWS THE TABLE COUNT, NOT THE COLLECTION, so an Emergency Department group behaves as Birth Registrations' does without a branch on its name."
    - "TARGET TRIAL IS DECLARED ONCE, ON THE GENERATOR PROVIDER (position.md call 8; main session's round-5 call 30, P3), and this group reads it there - not a second declaration on the QA adapter. REJECTED declaring it on the adapter as round 1 had it: two declarations of one capability can disagree. REQ-GEN-246 owns the refusal. Because REQ-GEN-246 lands before this (P2), the factory reads the provider directly and never the temporary pointer."
    - "THE --collection HELPER LIVES HERE: cli/pipeline.py, cli/debug.py and cli/supply.py are rewritten here, so under call 27 their sites are rewired here, not in REQ-PIPE-240. It PRESERVES each site's accepted values and wording in this step (today supply accepts an id or a short and refuses with its own 'Known: ...' line, while pipeline and debug accept shorts only with Click's own refusal); making them uniform is REQ-TEST-252's, because it changes help text."
  open_questions: []

- id: REQ-TEST-252
  title: "The CLI and TUI stay usable at about thirty collections - help splits collections from tools, collection pickers group by agency and filter by typing above a stated size, and --collection hints point somewhere rather than listing everything - while two collections read as they do today"
  signed_off:
    by: Keith
    date: "2026-10-16"
  date_written: "2026-10-16"
  story: "As a data engineer running mothman on an asset with about thirty collections, I want `mothman --help`, the TUI's collection and dataset pickers and every --collection hint to stay as quick to read and choose from as they are with two, so that finding my collection is a recognition task rather than a scroll through thirty lines, and the tool commands are not lost among the collection groups."
  moscow: must
  status: not_started
  source: "Keith, 2026-10-16 ~06:50 and ~07:10 Perth, answering position.md call 23 ('~30 collections') and bringing plans/running-thoughts.md #101 into item 6's scope ('their code is in scope for what we're doing here'); #101 itself from the CLI UX review of item 6's drafts (position.md call 22). Drafted by delivery-scoper 2026-10-16. A PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL define one collection-list threshold, N_LIST, in one place in cli/common.py, used by every criterion below that changes behaviour by the number of registered collections, set to 9 (Keith, 2026-10-16)."
    - "THE SYSTEM SHALL render `mothman --help` with every registered collection group in a 'Collections' panel, in hierarchy order, and every other group and command in a 'Tools' panel in today's order, so that no tool command sits between two collection groups, at every size, today's two collections included (Keith, 2026-10-16)."
    - "WHILE the registry holds more than N_LIST collections, THE SYSTEM SHALL show, on each Collections-panel line, the collection's short, its label under REQ-TEST-245's label rule, and its agency's name, so that a reader can tell two similarly named collections apart without opening either."
    - "WHILE the registry holds N_LIST or fewer collections, THE SYSTEM SHALL present the TUI's collection pickers - the two 'Which dataset?' menus in cli/app.py and the 'Which collection?' menus in cli/filing_tui.py - with today's choices and text, in hierarchy order."
    - "WHILE the registry holds more than N_LIST collections, THE SYSTEM SHALL present each of those pickers grouped by agency in hierarchy order, each group headed by a non-selectable agency name, and SHALL accept typed text that narrows the visible choices to those whose label or agency name contains it, case-insensitively, with the prompt saying that typing filters."
    - "WHILE the hierarchy declares more than N_LIST datasets, THE SYSTEM SHALL apply the same grouping, by collection, and the same typed filter to every TUI picker that lists datasets across the whole asset - today cli/schedule.py's calendar menu 'Which dataset?'."
    - "IF the typed filter matches no choice, THEN THE SYSTEM SHALL say that nothing matches the typed text, keep the prompt open, and let the operator delete characters to widen it again or leave with Ctrl-C as from any other picker."
    - "WHEN a filtered picker is answered, THE SYSTEM SHALL dispatch exactly the collection or dataset chosen, never one the filter had hidden, and Ctrl-C SHALL return to the previous menu, as common.select() does today."
    - "THE SYSTEM SHALL accept, on every --collection option, a registered collection's short or its id, and `all` wherever `all` is accepted today, so that the option means the same thing on every command."
    - "WHILE the registry holds N_LIST or fewer collections, THE SYSTEM SHALL render each --collection option's help as a generated legend of every short and id - today's 'bdm = civil-registration, cp = child-protection.' - and its metavar as the list of choices."
    - "WHILE the registry holds more than N_LIST collections, THE SYSTEM SHALL render each --collection option's metavar as COLLECTION and its help as one line saying it takes a collection's short or id and naming `mothman collections` as where every collection is listed (Keith, 2026-10-16), never a legend of every collection."
    - "THE SYSTEM SHALL provide `mothman collections`, listing every registered collection's short, id, label and agency in hierarchy order, one per line, readable through a pipe with NO_COLOR=1 and importing no tool library (Keith, 2026-10-16: 'New command')."
    - "IF a --collection value names no registered collection, THEN THE SYSTEM SHALL refuse naming the value, up to three registered shorts or ids closest to it, and where every collection is listed, and SHALL list every collection in the refusal only WHILE the registry holds N_LIST or fewer."
    - "WHILE the registry holds more than N_LIST collections, THE SYSTEM SHALL write every flag hint and NotInteractive refusal that today names each collection's command - for example the Quality Assurance menu's 'mothman bdm qa [--run-id/--file] / mothman cp qa [--run-id/--folder]' - in the generic form 'mothman <collection> qa ...' with one real example, never one entry per collection."
    - "WHEN the test suite runs, THE SYSTEM SHALL build, in a temporary copy of the tracked working tree as REQ-TEST-249 builds its copy, a fixture hierarchy of 30 collections across at least five agencies with names that share leading words - one-table and N-table, with and without the target-trial capability - and an adapter and provider for each that import no tool library, and SHALL write nothing to the repository's own contract/, data/ or reports/."
    - "WHEN `mothman --help` runs in that copy, THE SYSTEM SHALL show all 30 collection groups in the Collections panel and every tool group in the Tools panel, at COLUMNS=80 and COLUMNS=120 with NO_COLOR=1, with no line wrapped mid-word in the Collections panel."
    - "WHEN `mothman --help`, `mothman <short> --help` or `mothman <short> qa --help` runs in that copy, THE SYSTEM SHALL import none of pandas, numpy, duckdb, soda, dbt, datacontract or evidently, and SHALL take no more than 10% longer than the same command at today's two collections, both absolute times recorded in this requirement's evidence."
    - "WHEN the TUI runs in that copy under scripts/dev/tui_drive.py, THE SYSTEM SHALL show the Quality Assurance and Generate synthetic data 'Which dataset?' menus and the filing 'Which collection?' menu grouped by agency, SHALL narrow each to one collection by typing a fragment of its label, and SHALL reach that collection's own next prompt by Enter, using the keyboard only."
    - "WHEN `mothman pipeline run --help`, `mothman debug run-dbt --help` and `mothman supply load --help` run in that copy, THE SYSTEM SHALL render the --collection option as criterion 11 states, and WHEN each is given an unknown collection, THE SYSTEM SHALL refuse as criterion 13 states."
    - "WHEN `mothman debug equivalence compare` runs between captures of REQ-TEST-245's change and of this change, THE SYSTEM SHALL report no difference on S1, S4 or S5 of a full capture, and every S7 difference SHALL be one this requirement names, each listed in this requirement's evidence and reported to Keith rather than accepted silently."
    - "WHEN the TUI runs at today's two collections, THE SYSTEM SHALL show every collection picker's text exactly as REQ-TEST-245's capture recorded it, so that dashboard/demos/qa_wizard.cast stays true."
    - "THE SYSTEM SHALL carry one CHANGELOG.yaml entry for the help panels and the uniform --collection option in the same push."
  non_functional_requirements:
    - "BEHAVIOUR CHANGE, ON PURPOSE AND REPORTED (position.md call 2): this is the step after REQ-TEST-245's byte-identical refactor, never mixed with it; criterion 19's S7 diff is the record of what changed, and no other surface may move."
    - "TODAY'S TWO COLLECTIONS NOT WORSE: criteria 4, 10 and 20 keep every picker, legend and refusal at two collections as it reads today; the only change a two-collection user sees is criterion 2's panels (if Keith keeps them at every size) and criterion 9's id-or-short acceptance, which only adds."
    - "IMPORT-TIME BUDGET: help imports no tool library at any size (criterion 16), and grows no more than 10% from two collections to thirty; the absolute figure is reported against the Doherty Threshold's 400ms (docs/hci-ux-psychology.md) as a finding, never a gate, since uv's own start-up is outside this project's control (provisional, pending Keith)."
    - "DISCOVERABILITY (docs/hci-ux-psychology.md - recognition rather than recall, Hick's Law, Miller's Law, the Paradox of the Active User): grouping by agency chunks thirty choices into a handful of recognisable sets; the typed filter is announced in the prompt, never a hidden accelerator; every hint names where the full list lives rather than expecting a short to be remembered."
    - "CONSISTENCY WITH EXISTING CLI CONVENTIONS: every picker still goes through common.select()'s non-TTY guard, its '<- Back' choice and its environment toolbar (REQ-TEST-114); every refusal is a ClickException naming the remedy, never a traceback; the tier colours and the Tier wording in each group's help are unchanged; the wizard/flags duality holds - every pick has a flag form named in its hint (plans/tooling.md #1)."
    - "KEYBOARD ONLY: every criterion here is reachable with arrows, typing, Backspace, Enter and Ctrl-C; no mouse. Escape is NOT bound by the installed questionary (2.1.1) and this requirement does not claim it; questionary's typed filter cannot coexist with its j/k keys, so a filtered picker gives up j/k and keeps the arrows."
    - "NO NEW DEPENDENCY: rich-click 1.9.9 already supports command panels and questionary 2.1.1 already supports grouping headings (Separator) and a typed search filter; this requirement adds neither library nor version."
    - "SCALE BEYOND THIRTY: nothing here may assume the asset has about thirty collections rather than any number above N_LIST; a project-extraction asset with no cadence still lists its collections the same way."
    - "TEST COST: criteria 14 to 18 use one copy and no database and no bootstrap - help and menus read configuration only - so they run in the fast half of CI, not the on-demand job."
    - "SECURITY: the fixture reaches the CLI only through a copy of the tree (criterion 14), never through a new environment variable or path that would let configuration choose where adapters load from (REQ-PIPE-240 criterion 4)."
    - "OBSERVABILITY: criterion 21's CHANGELOG.yaml entry, since a person running `mothman --help` will see the panels."
    - "OUT OF SCOPE, CHECKED: privacy, compliance and cost - help and menus read configuration only, touch no supply rows and no database; reliability beyond REQ-TEST-245 criterion 8, which already covers one broken adapter."
  dependencies:
    - REQ-TEST-245
  decisions:
    - "IN ITEM 6'S SCOPE - Keith, 2026-10-16 ~07:10 Perth, verbatim: \"their code is in scope for what we're doing here\" - the CLI and TUI code at ~30 collections is part of item 6, reversing proposal.md significant call 9's deferral (position.md call 22) to later work; plans/running-thoughts.md #101 is this requirement's source."
    - "~30 MEANS COLLECTIONS - Keith, 2026-10-16 ~06:50 Perth, verbatim: \"~30 collections\" - about thirty collections, each with its own command group, not about thirty datasets in a handful of collections. Hence a 30-collection fixture, not a 30-dataset one."
    - "A REQUIREMENT OF ITS OWN, AFTER REQ-TEST-245 (delivery-scoper, 2026-10-16): REQ-TEST-245 stays the byte-identical factory refactor and this is the reported behaviour change, so position.md call 2 - never mixed - holds. REJECTED folding the 30-collection behaviour into REQ-TEST-245: its S7 compare could no longer be zero, and a factory bug would hide inside an intended diff."
    - "BELOW THE THRESHOLD, TODAY'S TEXT (delivery-scoper, 2026-10-16; Keith set N_LIST to 9 the same day): pickers, legends, hints and refusals change shape only above N_LIST, so the two-collection experience Keith and the demo cast know is unchanged. REJECTED always grouping and always filtering: at two choices an agency heading per choice doubles the menu for nothing."
    - "GROUP BY AGENCY AND FILTER BY TYPING, BOTH (delivery-scoper, from plans/running-thoughts.md #101's two options): grouping helps someone who knows the agency but not the label, the filter helps someone who knows a word of the label; the filter also matches the agency name so the two never disagree. REJECTED a two-step picker (agency, then collection): one more prompt for every pick at every size, and an agency with one collection becomes a pointless step."
    - "THE FIXTURE IS A COPY OF THE TREE, AS REQ-TEST-249's IS (delivery-scoper, 2026-10-16): REQ-PIPE-240 criterion 4 loads adapters only from qa_tools.collections by name, so thirty fixture adapters must exist there in some tree. REJECTED an environment variable pointing the registry at a fixture hierarchy and package: product code only tests call is dead code (Keith, 2026-10-12), and it would let configuration choose an import path, which REQ-PIPE-240 criterion 4 forbids."
    - "THE --collection OPTION BECOMES UNIFORM HERE, NOT IN REQ-TEST-245: accepting an id or a short everywhere only adds (no invocation that works today stops working), but it changes pipeline's and debug's help text, so it belongs to the step whose S7 diff is expected."
    - "PICKERS INSIDE ONE COLLECTION ARE OUT OF SCOPE (delivery-scoper, 2026-10-16): cli/filing_tui.py's per-collection 'Which dataset?' is bounded by one collection's tables, not by the number of collections; Keith's decision is about thirty collections."
    - "ONE GROUP PER COLLECTION STANDS (proposal.md significant call 9's first half, which Keith left standing): this requirement makes thirty groups readable rather than replacing them with one `--collection`-taking group."
  open_questions:
    - "ANSWERED (Keith, 2026-10-16): N_LIST is 9; the Collections/Tools help split applies at every size; a --collection hint above N_LIST points at a new `mothman collections` command."
    - "CHECK AT BUILD (not for Keith): how questionary 2.1.1's search filter treats Separator headings (it matches on each choice's title, so a heading may survive or vanish with the filter) and an empty filtered list on Enter; criteria 5, 7 and 8 fix the behaviour, the build finds the mechanism, and a gap there is a defect found with a failing test first."

- id: REQ-GEN-246
  title: "One generator driver runs every collection's slot loop, with a provider module per collection, seeds inside each provider's declared range, and target trial refused where a collection lacks it"
  signed_off:
    by: Keith
    date: "2026-10-16"
  date_written: "2026-10-15"
  story: "As Keith planting scenarios, I want the generator's slot loop, bookkeeping, delivery writing and injection placement shared, with only each collection's rows, seeds and period plan in its own provider, so that the Emergency Department generator is a provider from its first day rather than a third copy to unpick later."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); groundwork.md section 4; main session position.md calls 7, 8, 27 and 28. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL generate every collection's synthetic history through one shared driver - the slot loop, bookkeeping, delivery and receipt writing, and injection placement - with each collection's rows, seed schedule and period plan in a provider module of its own at generator/collections/<id>.py, separate from the collection's QA adapter."
    - "THE SYSTEM SHALL make each provider's seed schedule a provider method, and IF any seed a provider derives falls outside the range it declares, THEN generation SHALL refuse naming the provider and the seed."
    - "WHEN `mothman check` runs, IF two providers' declared seed ranges overlap, THEN THE SYSTEM SHALL fail naming both."
    - "WHEN `mothman debug equivalence compare` runs between REQ-PIPE-243's 'after' capture, as this change's 'before', and the full capture of this change, THE SYSTEM SHALL report no difference on S4 - every delivery, receipt, the bookkeeping and the scenario placements byte-identical - nor on S1, S5 and S7."
    - "THE SYSTEM SHALL declare the target-trial capability once, on the collection's generator provider, read there by the generator, the CLI (REQ-TEST-245) and bootstrap's _TARGET_DATASETS, and SHALL remove the adapter's temporary target-trial pointer from REQ-PIPE-240 in the same change."
    - "WHERE a collection's provider declares the target-trial capability, THE SYSTEM SHALL run its target trial; IF a target trial is asked of a collection without it, THEN THE SYSTEM SHALL refuse naming the collection, replacing the silent fallbacks in generator/targeting.py and generator/targets.py."
    - "THE SYSTEM SHALL keep every provider module importable without importing pandas or numpy at module level, so that reading its declarations costs no tool import."
    - "THE SYSTEM SHALL route scenario_injection.generated_periods() and generator/output.py's generated_into through the registry, and IF a scenario names a dataset whose collection has no provider, THEN generation SHALL refuse naming it before writing anything."
    - "THE SYSTEM SHALL delete generator/generate_runs.py and generator/generate_cp_runs.py in the same change, and SHALL remove from the migration allowlist every file whose dispatch sites this requirement rewires, each with a third-collection test."
  non_functional_requirements:
    - "BYTE-IDENTICAL, HARDEST HERE (position.md call 7): random draw order is part of the output; a comparison that differs is a failed build, not a tolerance to set."
    - "DETERMINISM: `mothman <short> generate-synthetic-data` run twice with the same seed writes byte-identical files."
    - "BOOTSTRAP TIME, MEASURED (REQ-TEST-239): generation is the bootstrap's first phase."
    - "SYNTHETIC ONLY: providers draw from the same synthetic sources as today."
    - "ISOLATION: tests/generator_isolation's redirection covers the driver, so no test writes into the real data/ tree (the 2026-09-28 handfiled incident)."
  dependencies:
    - REQ-TEST-239
    - REQ-PIPE-240
    - REQ-PIPE-243
  decisions:
    - "A SHARED DRIVER, AND BEFORE EMERGENCY DEPARTMENT (position.md call 7)."
    - "LANDS STRAIGHT AFTER REQ-PIPE-243 (main session's round-5 call 30, P2), REPLACING round 1's 'last among the refactor steps': it takes REQ-PIPE-243's kept 'after' as its 'before', so the chain never needs an extra full capture, and REQ-DASH-244 and REQ-TEST-245 follow it. Still the riskiest step for byte-identity; the order changes when, not how hard, it is proved."
    - "TARGET TRIAL DECLARED ONCE, ON THE PROVIDER, WHICH STAYS IMPORTABLE WITHOUT pandas OR numpy AT MODULE LEVEL (main session's round-5 call 30, P3): the CLI and bootstrap read the same declaration, so it cannot disagree with itself, and reading it costs no tool import."
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - A GENERATOR PROVIDER IS ITS OWN MODULE, generator/collections/<id>.py (main session's round-2 call), and the 'small adapter per collection' budget measures the QA and dashboard adapter only. A real deployment's collections have no synthetic generator, and groundwork puts bdm's generator part at ~280 lines and cp's at ~210, larger than either's QA part. Cost: a synthetic collection is two short modules rather than one. REJECTED (b), the provider inside the one adapter: it would import generator code into every real deployment and swamp the adapter's budget with synthetic-only content."
    - "SEED SCHEDULES ARE A PROVIDER METHOD AND A GENUINE, NEVER-RETIRED DIFFERENCE (main session's round-4 call 28), not a legacy flag; criteria 2 and 3 make REQ-GEN-232 criterion 2's disjoint Emergency Department seeds a check rather than a promise."
    - "TARGET TRIAL IS AN OPTIONAL CAPABILITY, REFUSED BY NAME ELSEWHERE (position.md call 8)."
    - "THE EMPTY-ALLOWLIST CHECK LIVES IN REQ-TEST-249 (delivery-scoper, round 3): this requirement lands before REQ-DASH-244 and REQ-TEST-245, whose files are still on the allowlist when it does."
  open_questions: []

- id: REQ-QAC-247
  title: "Both adapters' behavioural legacy flags are retired one at a time, each change reported, so every collection is checked and shown by the same rules"
  date_written: "2026-10-15"
  story: "As an accountable data owner, I want my collection's QA held to the same rules as every other - skipped and unrunnable checks recorded, the same guards, the same check names and dimensions - with every result that changes as a consequence put in front of me, so that a behaviour difference left over from copied code does not quietly decide what I see."
  moscow: should
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); main session position.md calls 2, 3 and 25. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL resolve every behavioural legacy flag on either adapter - for Birth Registrations left_out.note, dbt's built-model guard, the skipped status case, unrunnable results, dropping empty pseudo-columns, the not_evaluated reference-reason fallback and the Soda '[scope]' check-name suffix; for Child Protection the empty Soda dimensions on 88 checks; and whichever adapter carries the row_count_invalid branches, dbt model-level-test routing and test-shape sampling - either by retiring it, so the collection takes the shared behaviour, or by reclassifying it as a genuine collection difference with its reason recorded in this requirement's decisions."
    - "THE SYSTEM SHALL retire each flag in a change of its own, carrying no refactor."
    - "WHEN a flag is retired, THE SYSTEM SHALL compare full REQ-TEST-239 captures before and after, and every difference SHALL be one the flag's description predicts."
    - "IF a retirement changes any check's status, name or dimension on any recorded run of either collection, THEN the change SHALL be reported to Keith as a finding with the count of changed results by check, before the requirement is marked built."
    - "WHEN every flag is resolved, THE SYSTEM SHALL fail `mothman check` IF any adapter declares a behavioural legacy flag."
  non_functional_requirements:
    - "OUTPUT-CHANGING, ON PURPOSE: the comparison is a diff to explain, not a zero to reach."
    - "HISTORY: synthetic history is regenerated (`mothman env reset-synthetic` then `mothman pipeline bootstrap`), as REQ-PIPE-038 and REQ-PIPE-144 allow; reset-synthetic already refuses on a non-synthetic asset."
    - "OBSERVABILITY: one CHANGELOG.yaml entry per retirement a reader could notice - the '[scope]' suffix and the empty dimensions certainly."
  dependencies:
    - REQ-QAC-242
    - REQ-DASH-244
  decisions:
    - "BEHAVIOUR AND SHAPE SPLIT INTO TWO REQUIREMENTS (main session's round-2 call)."
    - "BOTH ADAPTERS, NOT BIRTH REGISTRATIONS ONLY (main session's round-4 call 25): the reader-visible flags - the '[scope]' suffix and the empty Soda dimensions - join the list. REJECTED changing Child Protection's output inside a refactor step."
    - "THE NON-VISIBLE FLAGS ARE OWNED HERE TOO (delivery-scoper, round 3): call 25 named only the reader-visible ones for this list, which would have left row_count_invalid, model-level-test routing and test-shape sampling with no owner while REQ-PIPE-248 criterion 6 fails on any flag left. They change recorded results, so they are behavioural, so they belong here."
    - "A FLAG MAY TURN OUT TO BE A REAL DIFFERENCE (criterion 1): forcing it into the shared behaviour would repeat the mistake plans/qa-pipeline.md #84 warned about."
    - "NOT NEEDED BEFORE EMERGENCY DEPARTMENT: ED takes the shared behaviour from the start."
  open_questions: []

- id: REQ-PIPE-248
  title: "Every collection records and publishes the same N-table shapes under file names from its collection id, so Birth Registrations stops being a special case"
  date_written: "2026-10-15"
  story: "As whoever maintains the pipeline, I want every collection's recorded and published shapes to be the N-table forms, so that nothing downstream reads one collection differently from another and a single-table collection is simply N equal to one."
  moscow: should
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night); main session position.md call 3 and its round-2 and round-4 calls. Drafted by delivery-scoper 2026-10-15, revised rounds 2 and 3/4; a PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL record Birth Registrations' dataset stats in Child Protection's form - row_counts per table, aggregates keyed table.column, zero counts treated as Child Protection treats them."
    - "THE SYSTEM SHALL write Birth Registrations' results JSON in the collection-and-datasets form and its dashboard JSON in the datasets-list form Child Protection uses."
    - "THE SYSTEM SHALL stop writing the row_count snapshot into Birth Registrations' Evidently raw output, ONLY IF no check or reader depends on it."
    - "THE SYSTEM SHALL delete every template and Python reading path that exists only for Birth Registrations' old shapes, the shape legacy flags with them, and REQ-QAC-241's legacy Python Evidently reader."
    - "WHEN Birth Registrations' history is regenerated after this change, THE SYSTEM SHALL report no difference on REQ-TEST-239's S6, while S1 and S5 differ only in the shapes this requirement names."
    - "WHEN every shape is unified, THE SYSTEM SHALL fail `mothman check` IF any adapter declares a legacy flag of any kind."
    - "THE SYSTEM SHALL write every collection's results as reports/results_<collection_id>.json and its dashboard data as reports/<collection_id>_dashboard.json, replacing the four current names, and every reader of those paths, in the same change."
    - "WHEN REQ-TEST-239's S5 comparison is run for this requirement, THE SYSTEM SHALL map each old file name to its new one before comparing, and this mapping SHALL be available to this requirement only."
  non_functional_requirements:
    - "INVISIBLE TO A READER: criterion 5 - a shape change that shows on the page is a defect here."
    - "HISTORY REGENERATED, SYNTHETIC ONLY: on a real asset this would need a migration of recorded history, out of scope and refused by reset-synthetic."
    - "SCALE: one shape for N tables makes the 30th dataset a configuration and adapter exercise."
  dependencies:
    - REQ-PIPE-243
    - REQ-DASH-244
    - REQ-QAC-241
  decisions:
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - UNIFY ON CHILD PROTECTION'S N-TABLE FORMS (main session, position.md call 3): Birth Registrations' history is regenerated. REJECTED keeping two shapes behind a per-collection switch: every reader would carry both forever."
    - "RESULT FILE NAMES FOLLOW THE COLLECTION ID, CHANGED HERE (main session's round-2 call): never in a byte-identical step; S5 maps old names to new for this requirement only. REJECTED short-based names (delivery-scoper's round-1 proposal): the id is the identity."
    - "THE LEGACY EVIDENTLY READER GOES HERE (round-4 call 28's time box): by the time this lands no diff base predates REQ-QAC-241."
    - "NOT NEEDED BEFORE EMERGENCY DEPARTMENT: ED is born in the N-table forms."
  open_questions:
    - "CHECK AT BUILD (not for Keith): whether Birth Registrations' row-count-growth check reads the previous run's row_count from its Evidently raw output; if it does, criterion 3 moves that read to the dataset stats first, as its own behaviour-preserving step."

- id: REQ-TEST-249
  title: "A fake collection added to a copy of the repository - its configuration, check files, adapter and provider, nothing else - goes from generation to a rendered page, proving a collection is a small adapter"
  date_written: "2026-10-15"
  story: "As Keith, I want a test that adds a collection the way the next real one will be added - configuration, check files, an adapter and a provider, no other edit - and follows it all the way to the page, so that 'adding a collection is a small adapter' is a fact the suite keeps proving rather than a claim made once."
  moscow: must
  status: not_started
  source: "Keith, plans/publishing-and-history.md item 6 (2026-10-15 night: 'small adapter per collection' as the definition of done). Added by delivery-scoper 2026-10-15; mechanism per main session position.md call 26. A PROPOSAL, not signed."
  acceptance_criteria:
    - "THE SYSTEM SHALL keep, under tests/, a fake collection's files - a hierarchy entry, a contract, Soda and Evidently check files, dbt files for its own folders, a QA adapter and a generator provider - for one agency, one collection and one one-table dataset with at least one check in each of the four tools."
    - "WHEN the test runs, THE SYSTEM SHALL copy every file git tracks, as it stands in the working tree, into a temporary directory, add the fake collection's files to the copy, and from the copy run mothman to generate its history, bootstrap it into a scratch database, record results from all four tools, build its dashboard data and render its dataset page in a real browser, with each check's status matching its recorded verdict."
    - "WHEN the test runs, THE SYSTEM SHALL assert the copy differs from the tracked working tree by additions only, meaning - every tracked file is present and byte-identical except contract/data-asset.yaml; every other differing file is a new file under contract/, dbt_project/models/<id>/, dbt_project/tests/<id>/, qa_tools/collections/ or generator/collections/; and contract/data-asset.yaml differs only by the fake agency's entry inserted whole into hierarchy.agencies, every pre-existing line unchanged and in order."
    - "WHEN `mothman <short> qa` runs in the copy for the fake collection, THE SYSTEM SHALL record its results."
    - "WHEN `mothman check` runs, THE SYSTEM SHALL report each QA adapter's code lines - logic and presentation metadata separately - against a soft budget of 150 lines for its logic, SHALL report each generator provider's lines separately and outside that budget, and SHALL never fail on either."
    - "THE SYSTEM SHALL never register the fake collection in the repository's own contract/data-asset.yaml, and the test SHALL write nothing under the repository's own data/ or reports/."
    - "WHEN this requirement is built, `mothman debug equivalence compare` between the capture before REQ-PIPE-240 and the capture after the last of REQ-PIPE-240 to REQ-GEN-246 SHALL report no difference outside those requirements' named and evidenced differences."
    - "WHEN this requirement is built, THE SYSTEM SHALL hold REQ-PIPE-240's migration allowlist empty, and REQ-QAC-039 criterion 1 SHALL be recorded as met with this requirement's evidence."
    - "WHEN `mothman check` runs after this requirement is built, IF any adapter carries one of REQ-PIPE-240's temporary pointers, THEN THE SYSTEM SHALL fail naming the adapter and the pointer."
  non_functional_requirements:
    - "TEST COST: run in CI's on-demand job beside REQ-TEST-116's equivalence test, not the fast half - it bootstraps. The copy reuses the main checkout's environment, dbt_packages and browser rather than installing its own; the measured time goes in evidence."
    - "WHAT IT PROVES: no dispatch site still assumes the collections it knew about; the adapter Protocol and provider are sufficient for a one-table collection; the line count of what a new collection costs. WHAT IT DOES NOT PROVE: multi-table or cross-table generality beyond Child Protection's real corpus, real data shapes, or performance at 30 collections."
    - "ADAPTER LINE BUDGET IS REPORTED, NOT ENFORCED (position.md call 10): groundwork estimates bdm ~230 and cp ~260 lines with presentation metadata, so both report over 150 from the start; the split shows the overage is presentation metadata, position.md call 6's follow-up."
  dependencies:
    - REQ-PIPE-240
    - REQ-QAC-241
    - REQ-QAC-242
    - REQ-PIPE-243
    - REQ-DASH-244
    - REQ-TEST-245
    - REQ-GEN-246
  decisions:
    - "A REQUIREMENT OF ITS OWN (main session's round-2 call): every other requirement proves nothing CHANGED; this one proves the goal."
    - "SIGNIFICANT, FOR KEITH TO SENSE-CHECK - THE PROOF RUNS IN A REPOSITORY COPY (main session's round-4 call 26, after architect finding E3a): the fake's files added to a copy, mothman run from the copy against a scratch database, the copy's diff asserted additions-only in the allowed paths. REJECTED in-process redirection, which would first need a single configuration root across 41 modules."
    - "THE COPY IS THE WORKING TREE'S TRACKED FILES, NOT git archive OF HEAD (main session's round-5 call 30, P4): a copy of HEAD would prove the last commit while looking like a proof of the edit in progress. This REPLACES round 3's dirty-tree refusal, which made the test unusable mid-edit, the moment it is most wanted. 'Additions only' is defined in criterion 3 so the one permitted edit - the fake's hierarchy entry - cannot hide a change to a real collection's."
    - "NO TEMPORARY POINTER SURVIVES THE SERIES (main session's round-5 call 30, P6): criterion 9 is the mechanical check that REQ-PIPE-240's list was worked through."
    - "THE PER-COLLECTION dbt FOLDERS (REQ-QAC-241, round-4 call 28) ARE A PRECONDITION: without them the fake's dbt files would have to edit a shared schema file, which criterion 4 forbids."
    - "THE SERIES-WIDE COMPARE AND THE EMPTY ALLOWLIST LIVE HERE (round-4 call 24; delivery-scoper, round 3): this is the one requirement that depends on all seven refactors."
    - "ONE TABLE, NOT N: the next real collection (Emergency Department) is one table, and Child Protection's corpus already exercises N tables."
  open_questions: []
