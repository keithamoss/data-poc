  - id: REQ-GEN-408
    title: "A demo regeneration replaces the whole history - the reset deleting the asset's generated delivery and receipt files and the generator's bookkeeping with the database - so two regenerations on different dates leave one history, not two"
    date_written: "2026-11-14"
    story: "As Keith, I want regenerating the demo on a new date to leave exactly one history behind, so that a rolled anchor never brings back the doubled history that pinning the anchor was introduced to stop."
