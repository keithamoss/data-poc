  - id: REQ-GEN-408
    title: "A demo regeneration replaces the whole history - the reset deleting the asset's generated delivery and receipt files and the generator's bookkeeping with the database - so two regenerations on different dates leave one history, not two"
    date_written: "2026-11-14"
    story: "As Keith, I want regenerating the demo on a new date to leave exactly one history behind, so that a rolled anchor never brings back the doubled history that pinning the anchor was introduced to stop."
    moscow: must
    status: not_started
    source: "Keith, R4 of 'Rolling anchor date scoping', SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN `mothman env reset-synthetic` is confirmed on a synthetic asset, THE SYSTEM SHALL delete, with the database schemas it drops today, that asset's generated delivery tree, its receipt tree and the generator's bookkeeping, and SHALL name each with its file count in what it says it deletes (synthetic_reset.what_it_deletes, qa_tools/common/synthetic_reset.py line 127) and in the typed confirmation's description."
      - "THE SYSTEM SHALL keep every refusal reset-synthetic has today - not synthetic, in production, the typed phrase (REQ-PIPE-144 criteria 21-23 and 43) - for the files as for the database, deleting nothing when it refuses."
      - "THE SYSTEM SHALL delete only the selected asset's trees, never another asset's, and nothing outside the asset's data folder."
      - "THE SYSTEM SHALL have a guard test, seen failing first, that regenerates a test asset at one anchor, resets, regenerates at a later anchor and bootstraps, and finds exactly one history - every delivery, receipt and qa.run of the second and none of the first."
    non_functional_requirements:
      - "RELIABILITY: a reset interrupted part-way leaves the next reset able to finish; a later generation into a half-deleted tree is refused by the bootstrap's existing staged-table and history checks."
      - "AUDITABILITY: the reset's confirmation names the files as well as the schemas, so what was deleted is said before it goes."
      - "PRIVACY AT REAL SCALE: refused on a real asset and in production, as today; deleting files widens what the one deliberate command deletes, never who may run it."
    dependencies:
      - "REQ-GEN-404"
      - "REQ-PIPE-144"
      - "REQ-GEN-381"
    decisions:
      - "REPLACE, DO NOT ARCHIVE (R4, SETTLED by Keith 2026-11-14): a regeneration replaces the whole history - the generated delivery and receipt files and the database, through the existing typed-confirmation reset - with one history up to the new date; a guard test proves two regenerations on different dates leave one history. REJECTED archiving the previous history."
      - "THE RESET DELETES THE FILES, NOT THE GENERATOR ALONE (delivery-scoper, from the code): reset-synthetic drops schemas only today, and a generation deletes what its bookkeeping says it wrote last time (generator/driver.py previous_delivery_names, line 83) - which misses anything the bookkeeping does not list, as the 26 handfiled-* directories of 2026-09-28 showed. One deliberate command deleting both is R4's 'replaces the whole history'."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-430
    title: "Within a pinned bootstrap the delivery tree is recognised once per collection and answered from that, not re-read on every arrival and every next-receipt look-up, and a tree that changes mid-replay stops the bootstrap"
    date_written: "2026-11-14"
    story: "As whoever regenerates the demo, I want the replay to read the generated delivery tree once rather than hundreds of times, so that a quarter of the replay's time stops going on re-reading files that cannot have changed."
    moscow: must
    status: not_started
    source: "Keith, SA Q3 (SETTLED 2026-11-14, option (b)): REQ-PIPE-250's first profiled speed-up ('recognise the delivery tree once per tree content rather than on every arrival and every next_receipt call') into this batch; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHILE a REQ-PIPE-397 pin is installed, THE SYSTEM SHALL recognise each collection's arrivals from the delivery tree at most once (arrivals.arrivals_for, qa_tools/common/arrivals.py line 245), and SHALL answer every later call for that collection and those folders from that recognition, including the calls from orchestrate (qa_tools/tools/orchestrate.py line 590), stage (qa_tools/tools/stage.py line 297), the bootstrap (qa_tools/common/bootstrap.py line 611) and the next-receipt look-ups (qa_tools/common/promotion.py lines 479 and 510), wherever REQ-PIPE-382 leaves them."
      - "WHEN a pin is installed, THE SYSTEM SHALL record a digest of each recognised tree's listing and receipts, and WHEN the pinned bootstrap ends, IF a tree's digest differs, THEN THE SYSTEM SHALL say so, naming the collection and the folders, and mark the bootstrap's result as not to be trusted."
      - "WHILE no pin is installed, THE SYSTEM SHALL recognise the tree as it does today, on every call, so that a live processing pass sees a delivery the moment it lands."
      - "THE SYSTEM SHALL return each caller its own list, or an immutable one, so that no caller's change to a recognised arrival reaches another (REQ-PIPE-254 criterion 7's rule)."
      - "THE SYSTEM SHALL have tests, seen failing first, counting tree recognitions in a pinned replay of a test asset (one per collection), of an unpinned call seeing a delivery added since the last call, and of a tree changed mid-pin being reported at the end."
    non_functional_requirements:
      - "PERFORMANCE: REQ-PIPE-250's profile put 25% of the quarterly stream's samples in recognising the whole tree, half of it inside promotion.next_receipt; arrivals_for took 0.6s on 229 deliveries and is called several times per arrival. Target: that share near zero in REQ-PIPE-403's after profile - an upper bound of about 1,500s of today's 6242s replay."
      - "SCALABILITY: this is the term that grows with the history (REQ-PIPE-250 decisions: every arrival re-reads every delivery), so the saving grows with each roll of the anchor and each new collection."
      - "RELIABILITY: generation finishes before any replay starts (bootstrap.py lines 254-275, 'so no pipeline recognises a delivery tree a generator is still writing'), which is what makes one recognition per pin safe; criterion 2 catches the case that breaks it."
      - "SECURITY AND PRIVACY: recognition reads file names and receipts, never supply rows; a real asset is never pinned, so a live pass is unchanged."
    dependencies:
      - "REQ-PIPE-397"
      - "REQ-GEN-399"
      - "REQ-PIPE-380"
      - "REQ-PIPE-250"
    decisions:
      - "ADDED TO THIS BATCH (SA Q3, SETTLED by Keith 2026-11-14, option (b)): REQ-PIPE-250's speed-up (1). REJECTED building S1-S3 only, and revisiting the budget."
      - "KEYED ON THE PIN, NOT ON THE TREE'S CONTENT (delivery-scoper, Keith may change it): REQ-PIPE-250 suggested 'once per tree content', but checking a tree's content on every call costs a read of every receipt, which is most of what recognition costs. In a pinned replay the tree is fixed by construction, so the pin is the key and criterion 2 checks the assumption once at the end. Outside a pin nothing changes. REJECTED a content-keyed cache for the live pass, whose saving is not budgeted and whose stale answer would hide a newly landed delivery."
      - "NOT A CONFIGURATION CACHE (delivery-scoper): the delivery tree is supplier files, not configuration, so REQ-PIPE-254's content rule does not govern it; it is asset_model's 'the delivery tree' half (QB)."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-431
    title: "datacontract-cli runs for each run in a long-lived worker process of its own, beside Soda Core and Evidently in the foreground and dbt in its worker, with the run's results kept in tool order"
    date_written: "2026-11-14"
    story: "As whoever regenerates the demo, I want datacontract-cli's share of each run to overlap the other tools rather than follow them, so that once dbt is no longer the longest step a run takes only as long as its slowest tool."
    moscow: should
    status: not_started
    source: "Keith, SA Q3 (SETTLED 2026-11-14, option (b)): the datacontract time sink of REQ-PIPE-250's profile, and its speed-up (2) ('run the four tools of one run side by side'), into this batch; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL run each run's datacontract-cli evaluation (run_datacontract.evaluate, qa_tools/tools/run_datacontract.py line 79) in a long-lived worker process, one per pipeline process, started on first use and reused, as dbt_worker does for dbt (qa_tools/common/dbt_worker.py), spawned rather than forked."
      - "WHEN a run's tools are evaluated, THE SYSTEM SHALL run dbt in its worker, datacontract-cli in its worker, and Soda Core then Evidently in the foreground, all three lanes at once, and SHALL keep the recorded results in today's tool order - dbt, Soda Core, datacontract-cli, Evidently (orchestrate.py lines 191-213)."
      - "IF two lanes fail, THEN THE SYSTEM SHALL report the failure of the tool earliest in that order, as parallel_orchestrate.beside does for dbt today, and SHALL leave no worker running a request behind the exception."
      - "IF the datacontract worker dies mid-request, THEN THE SYSTEM SHALL fail that run's datacontract step as a tool error naming the worker, and start a new worker for the next request, as dbt_worker.WorkerLost does."
      - "WHERE TOOLS_CONCURRENTLY is off (`--sequential`'s debugging mode, parallel_orchestrate.py line 120), THE SYSTEM SHALL run all four one after another in tool order, in this process, as today."
      - "THE SYSTEM SHALL have tests, seen failing first, of a run's datacontract evaluation happening in a different process from Soda Core's, of results in tool order whichever lane finishes first, of a killed worker failing only that step and the next run succeeding, and of the sequential mode running in-process."
    non_functional_requirements:
      - "PERFORMANCE, HONESTLY: datacontract-cli was 18% of the stream's samples; the profile's 49% waiting on dbt says dbt already outlasts the whole foreground, so this saves time per run only once REQ-PIPE-432 has made dbt shorter than Soda plus datacontract plus Evidently. Measured with REQ-PIPE-403, per run, before and after; built after REQ-PIPE-432 for that reason."
      - "RELIABILITY: a worker is a process, so a datacontract-cli crash cannot take the run's process with it; Soda's reload of .env into os.environ (plans/tooling.md #26) cannot reach it."
      - "COST: on this 4-core sandbox two streams side by side, each with a dbt worker, a datacontract worker and a foreground, is six busy processes on four cores; REQ-PIPE-403's after measurement says whether that oversubscribes."
      - "MAINTAINABILITY: one worker pattern for both out-of-process tools - REQ-PIPE-431 SHALL share dbt_worker's request, lock and restart code rather than copy it."
    dependencies:
      - "REQ-PIPE-432"
      - "REQ-PIPE-250"
      - "REQ-TEST-116"
    decisions:
      - "ADDED TO THIS BATCH (SA Q3, SETTLED by Keith 2026-11-14, option (b)). REJECTED building S1-S3 only, and revisiting the budget."
      - "A WORKER PROCESS, NOT A THREAD (delivery-scoper, from the code): Soda Core, datacontract-cli and Evidently run in-process and stay one after another because none was written to share an interpreter concurrently (parallel_orchestrate.beside's docstring), and Soda rewrites os.environ; the only safe way to overlap one with the others is a process, which is how dbt already runs beside them (REQ-TEST-116 criterion 3, REQ-PIPE-157). REJECTED threads for the in-process tools."
      - "DATACONTRACT, NOT SODA OR EVIDENTLY (delivery-scoper, Keith may change it): it is the largest foreground share (18% against Soda's 5% and Evidently's 2%), so it is the one worth a process."
      - "AFTER REQ-PIPE-432 (delivery-scoper): with dbt the critical path, overlapping the foreground changes nothing until dbt is shorter; building it second makes its effect measurable."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-432
    title: "A run's dbt step costs less: one dbt invocation profiled by phase, then dbt allowed to run a run's tests side by side and the per-invocation overhead the profile names cut, with the time per run recorded before and after"
    date_written: "2026-11-14"
    story: "As whoever regenerates the demo, I want each run's dbt step to stop being the longest part of every run, so that the replay's critical path shortens rather than only the work that already finishes first."
    moscow: must
    status: not_started
    source: "Keith, SA Q3 (SETTLED 2026-11-14, option (b)): the dbt time sink of REQ-PIPE-250's profile, and its speed-up (3) ('the dbt worker round trip, about half the stream's active samples'), into this batch; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "BEFORE this requirement's first change, THE SYSTEM SHALL record in its evidence one profile of a quarterly run's dbt step inside the worker (qa_tools/common/dbt_worker.py _serve), split into partial parse, compile, opening the database connection, running the selected nodes and writing run_results.json and manifest.json, over at least ten consecutive runs of one collection."
      - "THE SYSTEM SHALL let dbt run a run's selected tests side by side, setting the profile's threads (qa_tools/dbt_profiles/profiles.yml, `threads: 1` today) to a value read from one named setting, and SHALL record in evidence the dbt time per run at 1, 2 and 4 threads on this sandbox with both streams running, choosing the value from that measurement."
      - "WHERE the profile in criterion 1 shows a phase that repeats identical work every run - a re-parse, a re-compile of unchanged nodes, a connection opened per invocation - THE SYSTEM SHALL cut it using dbt's documented options only (as REQ-PIPE-157 used only dbt's documented API), and SHALL record the phase and its time before and after."
      - "THE SYSTEM SHALL keep every recorded dbt verdict coming from that run's own run_results.json, parsed as today (evaluate_dbt_*), so that faster dbt never means a verdict read from another run's artefacts."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in evidence the dbt time per run before and after, and the share of the stream's samples spent waiting on the dbt worker, against the profile's 49%."
      - "THE SYSTEM SHALL have tests, seen failing first, of the threads setting reaching the profile dbt is invoked with, and of two runs' verdicts each read from their own target directory with threads above one."
    non_functional_requirements:
      - "PERFORMANCE: about 3.8s a run on one thread when REQ-PIPE-157 landed (dbt_worker's docstring), and the replay's critical path - 49% of the quarterly stream's samples waiting on it. Target: dbt no longer the longest lane of a run, so that REQ-PIPE-431 can pay. Measured per run from qa.run_attempt's tool times on this sandbox, and in REQ-PIPE-403's bootstrap totals."
      - "RELIABILITY: a dbt test failing or erroring reads exactly as at one thread; dbt's threads run the selected nodes of one invocation, never two runs at once in one worker (dbt_worker's one-request lock stays)."
      - "COST: more dbt threads mean more PostgreSQL connections per worker; with two streams that is about 2 x threads connections from dbt, well under PostgreSQL's default 100, and a real deployment with thirty collections still runs one pass at a time."
      - "COMPATIBILITY: dbt's documented options only, so a dbt upgrade does not break it (REQ-PIPE-157's rule)."
    dependencies:
      - "REQ-PIPE-157"
      - "REQ-PIPE-250"
      - "REQ-PIPE-403"
    decisions:
      - "ADDED TO THIS BATCH (SA Q3, SETTLED by Keith 2026-11-14, option (b)). REJECTED building S1-S3 only, and revisiting the budget."
      - "DBT FIRST OF THE THREE (delivery-scoper): it is the critical path of every run - the main thread waits on it after Soda, datacontract and Evidently have finished - so every second cut here is a second off the replay, which is not true of the foreground tools."
      - "THREADS ARE THE FIRST LEVER, MEASURED NOT ASSUMED (delivery-scoper, from the code): the profile runs dbt with threads 1, so a run's tests execute one at a time though they are independent reads; criterion 2 measures 1, 2 and 4 with both streams running before choosing, because on four cores more threads can cost more than they save."
      - "PROFILE THE INVOCATION BEFORE CUTTING IT (delivery-scoper): REQ-PIPE-157 already removed process start and the full re-parse; what is left of 3.8s is not yet known by phase, so criterion 1 comes before criterion 3. This profiles one step inside a settled build, not the 'profile first, decide later' Keith rejected for S2."
    open_questions: []
    signed_off: null
