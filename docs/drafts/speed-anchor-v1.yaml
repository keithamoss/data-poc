      - "WHEN `mothman env reset-synthetic` is confirmed on a synthetic asset, THE SYSTEM SHALL delete, with the database schemas it drops today, that asset's generated delivery tree, its receipt tree and the generator's bookkeeping, and SHALL name each with its file count in what it says it deletes (synthetic_reset.what_it_deletes, qa_tools/common/synthetic_reset.py line 127) and in the typed confirmation's description."
      - "THE SYSTEM SHALL keep every refusal reset-synthetic has today - not synthetic, in production, the typed phrase (REQ-PIPE-144 criteria 21-23 and 43) - for the files as for the database, deleting nothing when it refuses."
      - "THE SYSTEM SHALL delete only the selected asset's trees, never another asset's, and nothing outside the asset's data folder."
