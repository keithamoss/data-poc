# PROPOSAL - the speed batch (plans/post-build-review.md #318, plans/running-
# thoughts.md #136) and the rolling anchor date (plans/running-thoughts.md
# #138), scoped together as Keith's S4 and R5 asked (docs/drafts/decisions-
# 2026-11-01.md, 'Speed scoping' S1-S4 and 'Rolling anchor date scoping'
# R1-R5, all SETTLED by Keith 2026-11-14).
# Drafted by delivery-scoper 2026-11-14 (Perth), v1, against HEAD 5b502c46.
# UPDATED IN PLACE 2026-11-14 with Keith's answers to v1's five questions and
# its amendments (docs/drafts/decisions-2026-11-01.md, 'Speed + rolling anchor
# v1 ... Keith's answers'): every open question is closed as SETTLED; Q3 (b)
# adds REQ-PIPE-250's three profiled speed-ups as REQ-PIPE-430 to 432 (ids from
# 430, clear of timing-attempts-v1.yaml's 409-416, at the coordinator's ask).
# NOT SIGNED. Nothing here is built until Keith signs it. Ids 397-408 were free
# in requirements.yaml, docs/drafts/ and plans/ on 2026-11-14; whoever applies
# this re-checks.
#
# THE HEADLINE (evidence walk-through [8], Keith 2026-11-14): the quarterly
# asset's from-empty bootstrap measured 6666s against REQ-PIPE-250's and
# REQ-PIPE-352's 720s budget ('Took Child Protection and Emergency Department
# and Linkage Products 6242s, in total 6653s'; docs/drafts/unmet-evidence-
# 2026-11-14.md [8]). The daily asset took 681s, within budget. Both were
# measured BEFORE post-build-review #318's two fixes, so they are an upper
# bound and REQ-PIPE-403 re-takes the baseline first.
#
# THE STANDING RULE APPLIES (Keith, 2026-11-14, twice): 'I do not give two
# shits if the synthetic demo history moves.' No criterion here exists to keep
# the synthetic history unchanged, and none is 'proven by the compare' -
# REQ-TEST-239 is retired. The test suite is the proof.
#
# BUILD ORDER (proposed): after #134 v6's REQ-PIPE-380, REQ-PIPE-382,
# REQ-PIPE-383 and REQ-GEN-381 (the architect: the pinned mode must go through
# 382's seam or it puts back the replay flag 382 removes).
#   1. REQ-PIPE-403 criterion 1 (the re-baseline), then REQ-PIPE-397,
#      REQ-PIPE-401, REQ-GEN-398, REQ-PIPE-400, REQ-GEN-399
#   1b. REQ-PIPE-432 (dbt, the critical path), REQ-PIPE-430 (the tree read
#      once), then REQ-PIPE-431 (datacontract beside the rest), in that order
#   2. REQ-GEN-404, REQ-GEN-405, REQ-GEN-406, REQ-GEN-408, REQ-DASH-407
#   3. REQ-TEST-402 (it shares a history built at REQ-GEN-405's fixed anchor)
#   4. REQ-PIPE-403's remaining criteria (the after measurement), last.
#
# REGISTER EDITS TO BUILT REQUIREMENTS this batch makes - all three APPROVED AS
# WORDED by Keith 2026-11-14, each applied when its requirement is built:
#   - REQ-PIPE-254 criterion 15 scoped to 'outside a pinned run' (REQ-PIPE-397
#     criterion 9).
#   - REQ-GEN-042 criteria 7 and 8 amended for an anchor recorded with the
#     history (REQ-GEN-404 criterion 8).
#   - REQ-PIPE-250 criterion 4 (proven by REQ-TEST-239's compare) retired with
#     REQ-TEST-239's approved reason, and its BEHAVIOUR-PRESERVING NFR dropped
#     (REQ-PIPE-403 criterion 6). REQ-PIPE-250 is in_progress, not built.
requirements:
  - id: REQ-PIPE-397
    title: "The shared reading code can pin an asset's configuration for one run - every configuration file read once at the start and answered from that read until the run ends - installed only by the synthetic side, refused on an asset that is not synthetic, and invisible to the pipeline modules that read through it"
    date_written: "2026-11-14"
    story: "As whoever maintains the pipeline, I want one place that can hold an asset's configuration still for the length of a generation or a replay, so that the millions of configuration reads a synthetic history makes stop costing a file read each, without the pipeline ever knowing it is in a replay."
    moscow: must
    status: not_started
    source: "Keith, post-build-review #318 (2026-11-03) and S1/S2 of 'Speed scoping', SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL offer in asset_model/ one installation call that pins the selected asset's configuration for the span of a with-block: while it is installed, every configuration read made through config_yaml (read, load and every config_yaml.Built store, qa_tools/common/config_yaml.py lines 110-221 at 5b502c46) SHALL be answered from the text read when that file was first read inside the pin."
      - "WHILE no pin is installed, THE SYSTEM SHALL read every configuration file as it reads now, on every call (REQ-PIPE-254 criterion 15)."
      - "IF the selected asset does not declare `synthetic: true` (read through REQ-PIPE-382's one reader, asset_time.declared_synthetic), THEN THE SYSTEM SHALL refuse to install the pin, naming the asset and its data-asset.yaml, so that the refusal holds with the bootstrap package absent."
      - "THE SYSTEM SHALL have no real pipeline module test whether a pin is installed: the pin SHALL act inside config_yaml's readers only, as REQ-PIPE-382's installed clock acts inside asset_time.now()."
      - "WHILE a pin is installed and a staged correction is in force for an arrival (correction_trial.configured, qa_tools/common/correction_trial.py lines 172-196), THE SYSTEM SHALL answer the agreement and the time-zone versions from the staged configuration for the span of that arrival's event context, the pin answering everything else."
      - "WHEN a configuration file is edited while a pin is installed, THE SYSTEM SHALL go on answering from the pinned text until the pin is released, and the next read after release SHALL see the edit (S1)."
      - "THE SYSTEM SHALL route through config_yaml every read of a configuration file under the asset's folder, the shared file-checks default and assets/environments.yaml that a pinned run makes, including the readers that read the file directly today (synthetic_reset.is_synthetic and asset_id, qa_tools/common/synthetic_reset.py lines 39-60, which call read_text), so that no configuration read inside a pin escapes it."
      - "THE SYSTEM SHALL pin every configuration read mothman's own code makes, and SHALL leave the QA tools' own reads of their project files (dbt's project and Soda's check files, read by the tools themselves) unpinned, so that a mid-run edit of those reaches the tool as it does today and is caught after the run by the replay cache key (REQ-TEST-117) and the resume digest (REQ-TEST-160) (SA Q4, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL record, when a pin is installed, a digest of every file it pinned, which the run that installed it can report and compare (REQ-GEN-399 criterion 3)."
      - "WHEN this requirement is built, THE SYSTEM SHALL amend REQ-PIPE-254 criterion 15 to read: 'OUTSIDE A PINNED RUN (REQ-PIPE-397), THE SYSTEM SHALL decide whether a file has changed by reading its content on every call, and SHALL NOT use its modification time, size or inode to skip that read.' - wording APPROVED AS WORDED by Keith 2026-11-14."
      - "THE SYSTEM SHALL have tests, seen failing first, of a value read inside a pin unchanged after its file is edited mid-pin, of the edit seen after release, of the pin refused on a non-synthetic asset in a process where the bootstrap package cannot be imported, of a staged correction answered over the pin within its arrival's context only, and of a read outside any pin seeing an edit that leaves size and modification time unchanged (REQ-PIPE-254 criterion 2 still holding), and of a dbt model edited inside a pin reaching dbt (criterion 8's unpinned tool reads)."
    non_functional_requirements:
      - "PERFORMANCE: inside a pin a configuration read makes no system call; outside one it costs what it costs today. Measured with REQ-PIPE-403."
      - "RELIABILITY: the pin is process-wide, not a context variable, for the reason replay_clock's own docstring gives - a run's four tools write from worker threads a context variable would not reach; it is released however the with-block ends."
      - "SECURITY: a real asset cannot be pinned (criterion 3), so a long-running real process never answers from a stale configuration; the refusal lives in shared code a real deployment keeps."
      - "MAINTAINABILITY: one seam, beside the clock, so nothing in the 17 real pipeline modules REQ-PIPE-382 lists learns a second replay concept."
      - "COMPATIBILITY: no new dependency; runs through `uv run`."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-382"
      - "REQ-PIPE-254"
    decisions:
      - "PIN ONCE PER RUN (S1, SETTLED by Keith 2026-11-14): a generation and a bootstrap read the configuration at the start and use it throughout, with the slots and periods derived from it worked out once (REQ-PIPE-400); an edit made mid-run is seen by the next run. REJECTED caching by file change (it is what REQ-PIPE-254 criterion 15 forbids, and a stat check still costs a system call per read), and pinning everywhere, which would withdraw criterion 15."
      - "CRITERION 15 STAYS FOR EVERYTHING ELSE (S1): the pipeline, the CLI and the dashboard build outside a bootstrap read whole on every call, as REQ-PIPE-254 decided."
      - "THROUGH THE SEAM, NOT A FLAG (the architect, docs/drafts/separation-v5-reviews.md line 357): a pinned mode the pipeline tested for would put back the replay flag REQ-PIPE-382 removes, so the pin is installed by the synthetic side and acts inside config_yaml, as the clock acts inside asset_time."
      - "THE CHOKE POINT IS config_yaml.read (delivery-scoper, from the code): hierarchy._load (qa_tools/common/hierarchy.py lines 113-117), agreement and asset_time all build through config_yaml.read and a Built store, so pinning the text there makes every Built lookup hit on identity; post-build-review #318 counted hierarchy._load at 2.7 million calls and agreement.standing_on at 1.5 million in one generation."
      - "STAGED CORRECTIONS OVERLAY THE PIN (delivery-scoper, from the code): correction_trial.configured swaps agreement.current and asset_time.timezone_versions in memory for an arrival's span (correction_trial.py lines 184-196); the pin is the base those overlays sit on, so a replay still files each arrival against the agreement as it stood (REQ-PIPE-170 criterion 23)."
      - "REFUSED ON A REAL ASSET (delivery-scoper, following REQ-PIPE-382 criterion 6's pattern, Keith may change it): S2 says the pinned mode is used only by the synthetic replay; refusing it in shared code is what makes 'only' true on a deployment without the bootstrap."
      - "NO EQUIVALENCE COMPARE (QD and the standing rule, Keith 2026-11-14): the tests in criterion 11 are the proof; the synthetic history may move."
      - "MOTHMAN'S OWN READS ONLY (SA Q4, SETTLED by Keith 2026-11-14): dbt and Soda read their project files themselves, outside config_yaml; the replay cache key and the resume digest catch a mid-run edit of those after the run. REJECTED copying each dbt project and its check files into a pinned scratch folder at the start."
      - "REQ-PIPE-254 CRITERION 15 AMENDED AS WORDED (SA amendments, APPROVED by Keith 2026-11-14): 'OUTSIDE A PINNED RUN (REQ-PIPE-397), ...', applied when this requirement is built."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-398
    title: "A generation - `mothman <collection> generate-synthetic-data` and a bootstrap's generation step, its target trials included - runs with its asset's configuration pinned"
    date_written: "2026-11-14"
    story: "As whoever regenerates the synthetic history, I want a generation to read its configuration once rather than millions of times, so that generating the quarterly asset stops taking minutes of file reads before any real check runs."
    moscow: must
    status: not_started
    source: "Keith, post-build-review #318 (2026-11-03: 'a real fix memoizes per generation, which needs a decision on how a generation pins its configuration') and S1, SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN a generation of a synthetic asset starts - the shared driver (generator/driver.py generate, line 153), the target trial, the scenario map writer and checkpoints.arrivals_of (qa_tools/common/checkpoints.py line 201) - THE SYSTEM SHALL install REQ-PIPE-397's pin before its first configuration read and release it when the generation ends."
      - "WHEN a bootstrap generates its collections before replaying them (qa_tools/common/bootstrap.py lines 254-275), THE SYSTEM SHALL generate every collection under one pin, so that every collection of the asset is generated from the same configuration."
      - "WHEN a generation ends, THE SYSTEM SHALL print one line naming how long generation took, so that the generation's share of a bootstrap is visible without a profiler."
      - "THE SYSTEM SHALL have a test, seen failing first, of a configuration file edited while a generation runs leaving that generation's output unchanged and the next generation reading the edit."
    non_functional_requirements:
      - "PERFORMANCE: measured with REQ-PIPE-403 - a generation's wall clock before and after, per asset, on this 4-core sandbox, nothing else running. Today's quarterly generation step is about 411s of the 6666s (6653s total less the stream's 6242s), its trials 53s on 4 workers (unmet-evidence [13]); post-build-review #318 profiled one arrivals_of generation at 906s before its two fixes and 457s after."
      - "RELIABILITY: a generation that fails part-way releases the pin and leaves nothing pinned for the next command."
      - "OBSERVABILITY: criterion 3's line sits beside the bootstrap's 'Took ...' line and budget line (bootstrap.py lines 304 and 317)."
    dependencies:
      - "REQ-PIPE-397"
      - "REQ-PIPE-400"
    decisions:
      - "THE GENERATOR FIRST (S1, SETTLED by Keith 2026-11-14): #318 found the generator's cost in hierarchy._load, agreement.standing_on and the slot and period arithmetic it recomputes inside its loops (slots_for_dataset, periods_for_dataset, correction_claims)."
      - "#318's TWO POLISH FIXES STAY (post-build-review #318): the asset listing remembered by the folder's stat and the dbt schema parses remembered per file; REQ-PIPE-401 brings the second back in line with REQ-PIPE-254."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-399
    title: "The replay inside a bootstrap runs the real pipeline with the asset's configuration pinned - installed by the bootstrap around its own call, every stream process pinned to the same contents - while `mothman pipeline run`, the processing pass, the CLI and the dashboard build read as now"
    date_written: "2026-11-14"
    story: "As whoever regenerates the demo, I want the replay's thousands of real pipeline runs to read the configuration the bootstrap started with, so that a bootstrap spends its time on the checks rather than on re-reading the same files, and a real run's behaviour is untouched."
    moscow: must
    status: not_started
    source: "Keith, S2 of 'Speed scoping' (SETTLED 2026-11-14, NOT THE RECOMMENDATION) and the architect's note on this batch (docs/drafts/separation-v5-reviews.md line 357); drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN a bootstrap or a resume replays a synthetic asset, THE SYSTEM SHALL install REQ-PIPE-397's pin around the replay from the bootstrap's own call, as it installs REQ-PIPE-382's replay clock, and no real pipeline module SHALL install, test or know of it."
      - "WHEN a bootstrap replays its streams in processes of their own (bootstrap._run_concurrently, bootstrap.py lines 754-779, spawn context), THE SYSTEM SHALL pin each stream process to the configuration contents the bootstrap pinned, handed to it rather than read again, so that two streams never replay against two versions of a file."
      - "WHEN a bootstrap finishes, THE SYSTEM SHALL print the digest of the configuration it pinned beside its budget line, and IF any stream process reports a different digest, THEN THE SYSTEM SHALL stop and say which file differed."
      - "WHILE no bootstrap or resume is running, THE SYSTEM SHALL have `mothman pipeline run`, the processing pass, every CLI command and the dashboard build read configuration as REQ-PIPE-254 criterion 15 requires, with no pin installed."
      - "THE SYSTEM SHALL keep the bootstrap's later steps that run after the replay (confirming due corrections, target agreement, bootstrap.py lines 296-311) under the same pin, released only when the bootstrap returns."
      - "THE SYSTEM SHALL have tests, seen failing first, of a calendar or check file edited mid-replay leaving that replay's filings and verdicts as the pinned file says, of the next bootstrap reading the edit, of two stream processes receiving the same digest, and of `mothman pipeline run` on a synthetic asset seeing an edit made since the last call."
    non_functional_requirements:
      - "PERFORMANCE: measured with REQ-PIPE-403; the replay is today's 6242s of the quarterly 6666s, so it is where the budget is won or lost."
      - "RELIABILITY: a crash in a stream process releases nothing the parent holds; the parent's pin is released when the bootstrap returns or raises."
      - "SECURITY AND PRIVACY: a real asset is never pinned (REQ-PIPE-397 criterion 3), so a real deployment's long-running pass always reads the configuration as it is."
      - "OBSERVABILITY: the pinned digest printed with the budget line (criterion 3) says which configuration a history was replayed from, next to how long it took."
      - "COST: the replay cache key (replay_inputs.INPUTS, qa_tools/common/replay_inputs.py line 47) already hashes every pinned file, so pinning changes no CI cache behaviour."
    dependencies:
      - "REQ-PIPE-397"
      - "REQ-PIPE-382"
      - "REQ-PIPE-383"
      - "REQ-GEN-381"
      - "REQ-PIPE-262"
    decisions:
      - "THE REPLAY ALSO RUNS PINNED (S2, SETTLED by Keith 2026-11-14, NOT THE RECOMMENDATION): the pipeline gains a pinned mode used only by the synthetic replay; outside a bootstrap it reads as now (criterion 15). REJECTED profiling first and deciding later (the recommendation), and pinning the generator only."
      - "THROUGH REQ-PIPE-382's SEAM, SO 382 AND 383 LAND FIRST (the architect, docs/drafts/separation-v5-reviews.md line 357): the bootstrap installs the pin around its own call, as it will install its clock once replay_clock.on_replay_clock leaves orchestrate (REQ-PIPE-382 criterion 11)."
      - "HANDED, NOT RE-READ (delivery-scoper, Keith may change it): each stream is a spawned process (bootstrap.py line 778), so a child re-reading at its own start could pin a file edited between two children starting; handing the parent's contents makes S1's 'read at the start' true across processes. REJECTED each process pinning at its own start."
      - "pipeline run STAYS UNPINNED ON A SYNTHETIC ASSET TOO (delivery-scoper, following REQ-PIPE-383's decision that pipeline run on a synthetic asset is the real path): it is a real processing pass over what has arrived."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-400
    title: "While a configuration is pinned, the values derived from it - each dataset's slots and periods, a calendar's periods, the agreement standing on a date - are worked out once per pinned configuration and answered from that, never across a staged correction"
    date_written: "2026-11-14"
    story: "As whoever regenerates the demo, I want the schedule arithmetic a generation and a replay repeat inside their loops worked out once for the configuration they pinned, so that a long history does not recompute the same calendar millions of times."
    moscow: must
    status: not_started
    source: "Keith, S1 of 'Speed scoping' ('with slots and periods derived from it worked out once'), SETTLED 2026-11-14, and post-build-review #318's profile; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHILE a REQ-PIPE-397 pin is installed, THE SYSTEM SHALL work out each of schedule.slots_for_dataset, schedule.periods_for_dataset, schedule.periods_for_calendar and agreement.standing_on at most once per distinct argument set per pinned configuration, and SHALL answer every later call with the same arguments from that result."
      - "WHILE a staged correction is in force (REQ-PIPE-397 criterion 5), THE SYSTEM SHALL key every remembered value on the agreement actually in force, so that no value worked out under the pinned agreement answers a call made under a staged one, or the reverse."
      - "WHILE no pin is installed, THE SYSTEM SHALL remember none of these values beyond what REQ-PIPE-254's content-keyed stores already hold."
      - "THE SYSTEM SHALL return each remembered value as an immutable value or a caller's own copy (REQ-PIPE-254 criterion 7), and SHALL NOT use functools.lru_cache or functools.cache for it (REQ-PIPE-254 criterion 16)."
      - "THE SYSTEM SHALL have tests, seen failing first, counting each function's real computations in one pinned generation of a test asset (once per argument set), of a staged correction getting values worked out under it, and of an unpinned call seeing an edited calendar."
    non_functional_requirements:
      - "PERFORMANCE: measured with REQ-PIPE-403, and by counting calls in a profiled generation before and after (post-build-review #318's method: hierarchy._load 2.7 million calls, agreement.standing_on 1.5 million)."
      - "SCALABILITY: the remembered set grows with the number of distinct dataset and date arguments a run asks, which at thirty collections is thousands of small values, not millions; it is released with the pin."
      - "MAINTAINABILITY: one memo keyed on the pin and the agreement in force, in asset_model/, rather than a cache per function."
    dependencies:
      - "REQ-PIPE-397"
      - "REQ-PIPE-380"
      - "REQ-PIPE-377"
    decisions:
      - "DERIVED VALUES ONCE (S1, SETTLED by Keith 2026-11-14): 'with slots and periods derived from it worked out once'. #318 named slots_for_dataset, periods_for_dataset and correction_claims as recomputed inside the generator's loops."
      - "KEYED ON THE AGREEMENT IN FORCE, NOT ONLY THE PIN (delivery-scoper, from correction_trial.configured): a replay swaps agreement.current per arrival while a correction is staged, so a memo keyed on the pin alone would answer a staged arrival with the unstaged calendar - a wrong filing, silently."
      - "AFTER REQ-PIPE-377 (delivery-scoper): 377 writes each repeated schedule rule once; memoising the copies first would memoise code about to be deleted."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-401
    title: "The two caches post-build-review #318 keyed on a file's stat answer as REQ-PIPE-254 requires - the dbt schema parses in list_setting_members by content outside a pin and by the pin within one"
    date_written: "2026-11-14"
    story: "As whoever maintains the pipeline, I want the speed fixes made in #318 to keep REQ-PIPE-254's promise that a configuration cache always answers for what the file says now, so that an edit keeping a file's size and modification time is never missed."
    moscow: should
    status: not_started
    source: "delivery-scoper, found 2026-11-14 while scoping S1 against REQ-PIPE-254 criterion 15; to Keith with this batch. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL key list_setting_members' parsed dbt schema files (qa_tools/common/list_setting_members.py lines 170-185, keyed today on (path, st_mtime_ns, st_size)) on the file's content through config_yaml, as REQ-PIPE-254 criterion 1's nine caches are, outside a pin, and on the pin within one."
      - "WHEN a dbt schema file is edited in place leaving its size and modification time unchanged, THE SYSTEM SHALL answer list_setting_members.declared from the new content on the next unpinned call (REQ-PIPE-254 criterion 2)."
      - "THE SYSTEM SHALL leave the asset resolver's folder listing remembered by the assets/ directory's stat (qa_tools/common/assets.py lines 155-164), because it lists which folders exist rather than reading a configuration file, and SHALL say so in its docstring with REQ-PIPE-254's rule named."
      - "THE SYSTEM SHALL have a test, seen failing first against today's code, of a same-size, same-mtime edit to a dbt schema file being seen by declared()."
    non_functional_requirements:
      - "PERFORMANCE: inside a pin the parse is free (REQ-PIPE-397); outside one, a content-keyed read costs one file read per call, which #318 measured as the expensive part only when the generator called it per geocoding file - now pinned."
      - "RELIABILITY: no false 'unchanged' answer is possible, which is the failure REQ-PIPE-254 exists to prevent."
    dependencies:
      - "REQ-PIPE-397"
      - "REQ-PIPE-254"
    decisions:
      - "A DEFECT AGAINST A BUILT CLAIM, NOT POLISH (delivery-scoper, Keith may change it): #318's second fix keys a configuration file on mtime and size, which REQ-PIPE-254 criterion 15 forbids and criterion 2 tests against; it was recorded as polish with no behaviour change. Under the pin the reason for it - the generator asking once per geocoding file - goes away."
      - "THE FOLDER LISTING IS NOT A CONFIGURATION FILE (delivery-scoper): it answers which asset folders exist; a directory's mtime moves whenever an entry is added, removed or renamed, which is all it needs to see."
    open_questions: []
    signed_off: null

  - id: REQ-TEST-402
    title: "The test suite generates each asset's synthetic history once and shares it - built once for the run, or restored from a cache keyed on the generator's inputs and the fixed test anchor, read-only to every test that reads it, and copied cheaply for a test that must change it"
    date_written: "2026-11-14"
    story: "As whoever runs the full local gate before every push, I want the suite to stop regenerating the same history test after test, so that the gate fits in one sitting and the slowest part of the suite is the checks it exists to test."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #136 (2026-11-02: 'I'd like to do another test audit and really dig into it') and S3 of 'Speed scoping', SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "BEFORE this requirement's first change, THE SYSTEM SHALL record in its evidence a `uv run pytest --durations=0` profile of the full suite (in chunks where one run cannot finish inside the 2-hour background limit, as REQ-TEST-375 criterion 9's stand-in does), with each module's total and the number of synthetic generations the run made."
      - "THE SYSTEM SHALL provide one session fixture per asset that yields that asset's generated delivery and receipt trees, built at REQ-GEN-405's fixed test anchor, so that a test needing a generated history requests it rather than generating its own."
      - "THE SYSTEM SHALL build each asset's shared history at most once per test run across every xdist worker - the first worker building it under a file lock, the others waiting and reading it - or restore it from a cache keyed on a digest of the generator's inputs (replay_inputs.INPUTS, qa_tools/common/replay_inputs.py line 47) and the fixed test anchor, building and saving it on a miss."
      - "IF a test writes into a shared history, THEN THE SYSTEM SHALL fail that test naming the file it wrote, as tests/conftest.py's _no_test_files_a_real_delivery refuses a write into the real tree."
      - "WHERE a test must change a generated history, THE SYSTEM SHALL give it its own copy of the shared one (a copy, or hard links with copy-on-write for the files it changes), never a regeneration."
      - "THE SYSTEM SHALL move every test that generates a history today onto the shared fixture - at 5b502c46 the callers of cli.pipeline.generated_into and checkpoints.arrivals_of in tests/test_arrival_history.py (7), tests/test_generator_providers.py (4), tests/test_hand_filing.py (2) and tests/test_checkpoints.py, and the driver.generate callers in tests/test_generate_to_target.py, tests/test_generate_runs.py, tests/test_collection_cli.py and tests/test_generate_cp_runs.py - except a test whose subject is generation itself, which SHALL say so in its docstring."
      - "THE SYSTEM SHALL keep the shared history and its cache outside /tmp's pytest session folders, under a gitignored folder of the repository, and SHALL remove a cached history whose key no longer matches when a new one is saved (plans/running-thoughts.md #139: old session folders filled the sandbox disk)."
      - "WHEN this requirement is built, THE SYSTEM SHALL record in its evidence the same profile as criterion 1, with the number of generations, and report both to Keith against the suite's target of under 30 minutes on this 4-core sandbox, saying plainly whether it is met."
      - "IF the full suite is still over 30 minutes once this requirement is built, THEN THE SYSTEM SHALL record in its evidence the slowest modules and classes from the after profile, each with its share of the wall clock and what it spends it on, as the start of the next test-level work, and SHALL NOT call the target met."
    non_functional_requirements:
      - "PERFORMANCE TARGET, REPORTED AND NEVER GATED (SA suite runtime, Keith 2026-11-14): the full suite UNDER 30 MINUTES on this 4-core sandbox, reported against in CLAUDE.md's running log and never failing a build. Today a whole local run goes past the 2-hour background limit (post-build-review #318) and the full gate is run in chunks ([30]); criterion 1 takes the real baseline."
      - "WHAT BEYOND S3 THE TARGET LIKELY TAKES (delivery-scoper, an estimate to check against criterion 1's profile): sharing one history removes the repeated generations, but much of the suite is real tool runs and real browsers. Known costs, from the register: tests/test_dashboard_e2e.py alone took 659-717s across all workers at REQ-TEST-281 (2026-10-25), its floor one class, TestEveryScenarioJumpLands, at 400-500s on one worker; every test that drives the real pipeline pays the per-run tool cost REQ-PIPE-430 to 432 cut; the deployment half needs a bootstrapped database, which locally is a one-off and on CI is the cache hit. Reaching 30 minutes is therefore likely to need, beyond S3: the speed-ups of this batch reaching the tests that run real pipelines; splitting or trimming the slowest browser classes (one scenario jump per scenario family rather than every scenario, for example); and moving integration tests that re-run all four tools onto shared, already-evaluated runs where the subject is not the tool itself. Each of those changes which tests exist, so each is a requirement of its own for Keith, not part of this one."
      - "PERFORMANCE, HOW MEASURED: on this 4-core sandbox with the default `-n auto`, one MOTHMAN_TEST_DB_TAG, nothing else running, and the load average recorded; CI's figure is the hand-started test.yml run's pytest steps, recorded, never gated (CLAUDE.md: runtime is tracked, not a CI gate)."
      - "RELIABILITY: a test that changes the shared history fails at once (criterion 4) rather than poisoning later tests, which is the arrival-pin incident of 2026-09-28 in another form."
      - "COST: a cache hit on CI's hand-started test.yml skips every generation the suite makes; the key includes the generator's inputs, so a stale history is never restored (REQ-TEST-117 criterion 3's rule)."
      - "MAINTAINABILITY: one fixture per asset; every new test module still names its asset (C11)."
      - "PORTABILITY: the cache folder is inside the repository's gitignored area, so the suite needs nothing outside the checkout."
    dependencies:
      - "REQ-GEN-405"
      - "REQ-TEST-375"
      - "REQ-TEST-117"
    decisions:
      - "GENERATE ONCE AND SHARE (S3, SETTLED by Keith 2026-11-14): one generated history per test session or a cached one keyed by the generator's inputs, read-only to every test that needs it, a cheap copy for a test that must change it; measured with --durations before and after. REJECTED smaller test-only histories, and both."
      - "ONCE PER RUN, NOT PER WORKER (delivery-scoper, Keith may change it): under xdist each worker is its own pytest session, so 'per session' would generate four times on this sandbox; the file lock or the input-keyed cache makes it once. The cache is the half Keith named as an alternative, used here as the way to share across workers and across runs."
      - "THE FIXED TEST ANCHOR (R1, SETTLED by Keith 2026-11-14): the shared history is built at 2026-09-25, so the cache key does not move with the calendar and the pins built on it stay byte-stable."
      - "A TARGET, NOT A GATE: UNDER 30 MINUTES (SA suite runtime, SETTLED by Keith 2026-11-14): chosen knowingly as the ambitious figure, likely needing test-level work beyond S3. REJECTED measuring with no target (the recommendation), a gated target, and 60 and 90 minutes."
      - "THE INTERIM FAST SET IS NOT THIS (plans/running-thoughts.md #136): REQ-TEST-375's critical mark is built and stays; this is the audit's first finding, scoped by S3."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-403
    title: "Each asset's from-empty bootstrap is measured before and after this batch - S1-S3 and REQ-PIPE-250's three profiled speed-ups - by stage, on this sandbox and on CI, against the 12-minute budget, and REQ-PIPE-250's compare-proof criterion is retired"
    date_written: "2026-11-14"
    story: "As Keith, I want to know what the speed work actually bought against the 12-minute budget, stage by stage, so that I can decide what comes next from a measurement rather than a hope."
    moscow: must
    status: not_started
    source: "Keith, evidence walk-through [8] (2026-11-14: the bootstrap at about 9x its budget goes to the speed batch as its headline problem) and S4 (REQ-PIPE-352's 12-minute budget); drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "BEFORE REQ-PIPE-397's first change, THE SYSTEM SHALL record in this requirement's evidence a from-empty bootstrap of each asset on this sandbox - `mothman env reset-synthetic` then `mothman pipeline bootstrap`, the quarterly asset then the daily one, nothing else running, the load average noted - giving the generation step, the target trials, each stream's replay, the confirmations and the budget line's total, and, within the replay, the shares the 2026-10-26 profile named - waiting on the dbt worker, recognising the delivery tree, datacontract-cli, Soda Core, recording results, filing, Evidently, staging and the gate - so that REQ-PIPE-430 to REQ-PIPE-432 each have their own before."
      - "WHEN REQ-GEN-398, REQ-GEN-399, REQ-PIPE-400, REQ-TEST-402 and REQ-PIPE-430 to REQ-PIPE-432 are built, THE SYSTEM SHALL record the same measurement after them, three consecutive runs per asset (REQ-PIPE-250 criterion 2's form), and report it to Keith against the 720s budget whether or not it is met."
      - "THE SYSTEM SHALL record beside each sandbox measurement the hand-started test.yml run's cache-miss bootstrap step time for the same commit, without a budget of its own (REQ-PIPE-250 criterion 5)."
      - "WHEN the after measurement is recorded, THE SYSTEM SHALL add it to CLAUDE.md's running log in the same change."
      - "IF an asset's bootstrap is still over 720s after this batch, THEN THE SYSTEM SHALL record where the remaining time goes by stage, and name the next speed-ups from that profile, rather than calling the budget met."
      - "WHEN this requirement is built, THE SYSTEM SHALL retire REQ-PIPE-250 criterion 4 under retired_criteria with REQ-TEST-239's approved reason, and drop REQ-PIPE-250's BEHAVIOUR-PRESERVING NFR (APPROVED AS WORDED by Keith 2026-11-14)."
    non_functional_requirements:
      - "PERFORMANCE, THE BASELINE TODAY: quarterly 6666s (generation about 411s, of it trials 53s on 4 workers; the Child Protection, Emergency Department and Linkage Products stream 6242s), daily 681s, both before post-build-review #318's fixes; budget 720s per asset (REQ-PIPE-352 criterion 5). An upper bound, which is why criterion 1 re-measures."
      - "PERFORMANCE, AN HONEST EXPECTATION: REQ-PIPE-250's profile (2026-10-26, py-spy, 240s of the quarterly stream) put 49% of the replay's samples waiting on the dbt worker, 25% recognising the delivery tree, 18% in datacontract-cli, 5% Soda, 5% recording, 3% filing, 2% Evidently, 2% staging, 1.5% the gate. Applied to today's 6242s replay: removing the tree work (REQ-PIPE-430) saves up to about 1,500s; dbt is the critical path of every run, so the run's share falls only as far as dbt falls (REQ-PIPE-432), and datacontract beside the rest (REQ-PIPE-431) pays only once dbt is shorter than the foreground tools. Even if all three land well, the quarterly replay is estimated at about 2,000-3,000s plus generation - several times 720s - because the asset now replays roughly 450 runs (302 Child Protection, 57 Emergency Department, about 105 geocoding and the Linkage Products runs, before knock-ons), and 720s would need well under 1.5s a run, everything included. The daily asset (681s today) should stay within. This is an estimate from one profile, not a measurement; criterion 2 is the measurement."
      - "NOT A CI GATE (REQ-PIPE-250's decision, CONFIRMED by Keith 2026-10-18): timing varies by runner; the budget is an acceptance measurement on this sandbox and a printed line."
      - "COST: each from-empty quarterly bootstrap is about 1h50m of sandbox time today, and a CI cache miss about 145 billable minutes (CLAUDE.md, 2026-11-02); the CI figure is read off a hand-started run that is due anyway, never one started for this."
    dependencies:
      - "REQ-PIPE-250"
      - "REQ-PIPE-352"
      - "REQ-GEN-398"
      - "REQ-GEN-399"
      - "REQ-PIPE-400"
      - "REQ-TEST-402"
      - "REQ-PIPE-430"
      - "REQ-PIPE-431"
      - "REQ-PIPE-432"
    decisions:
      - "THE HEADLINE PROBLEM (evidence walk-through [8], Keith 2026-11-14): record the 'after' figures as evidence, retire the 'before' halves of REQ-PIPE-296 c7, REQ-GEN-298 c13 and REQ-DASH-299 NFR 6, and send the bootstrap at about 9x its 720s budget here - not called met. REJECTED capturing befores, and retiring all three."
      - "A FRESH BASELINE HERE IS NOT A 'BEFORE' FOR ITS OWN SAKE (delivery-scoper): Keith retired the befores nobody needs; this one is the denominator of what this batch buys, and #318's fixes landed after the 6666s run, so without it the batch's effect cannot be told from #318's."
      - "THE BUDGET STAYS WHERE IT IS (S4: 'likely touches REQ-PIPE-352's 12-minute budget'): REQ-PIPE-250 and REQ-PIPE-352 keep the 720s; this requirement measures against it rather than adding a third budget."
      - "REQ-PIPE-250 CRITERION 4 GOES (QD and the standing rule, Keith 2026-11-14; SA amendments APPROVED AS WORDED by Keith 2026-11-14): a speed-up can no longer be proved by REQ-TEST-239's compare, which is retired; the test suite is the proof."
      - "THE THREE PROFILED SPEED-UPS JOIN THIS BATCH (SA Q3, SETTLED by Keith 2026-11-14, option (b)): REQ-PIPE-250's dbt, delivery-tree re-read and datacontract time sinks are REQ-PIPE-432, REQ-PIPE-430 and REQ-PIPE-431 here, beside S1-S3, so the batch aims at where the time actually goes. REJECTED (a) building S1-S3 only and reporting (the recommendation), and (c) revisiting the budget."
