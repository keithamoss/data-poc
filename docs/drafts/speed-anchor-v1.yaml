  - id: REQ-GEN-404
    title: "The synthetic history's anchor date is an input recorded with the history - one place the generator and the bootstrap take it from, the date used written with the generated history and into the qa schema, and a re-run given that date reproducing the same bytes"
    date_written: "2026-11-14"
    story: "As whoever regenerates the demo, I want the date a history was generated up to to be an input I can see and give back, rather than a constant edited by hand, so that a rolling anchor stays reproducible and a resume regenerates the same history it is comparing against."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #138 (2026-11-03, morning report 12 Q4: 'make it rolling') and R2 of 'Rolling anchor date scoping', SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL take a generation's anchor from one function, generator.anchor_date.get_anchor_date (generator/anchor_date.py line 49), given the anchor by its caller - REQ-GEN-405 decides which date - and SHALL hold no other default anywhere in the generator or a provider."
      - "THE SYSTEM SHALL read the anchor at call time in every provider, so that no module reads it at import: the Child Protection provider's module-level `_anchor = get_anchor_date()` and START_DATE (assets/quarterly/synthetic/collections/child_protection.py lines 273-274) SHALL become functions."
      - "WHEN a generation writes a history, THE SYSTEM SHALL record the anchor it used with that history, in the generator's bookkeeping (generator/driver.py write_bookkeeping, line 59) for the generator's own readers."
      - "WHEN a bootstrap replays a history, THE SYSTEM SHALL record the anchor the history was generated with in the qa schema, once per history, so that the dashboard build and `mothman` can read it as a recorded fact (REQ-DASH-407) without reading the bookkeeping, which no pipeline, QA or build module may read (REQ-GEN-043 criterion 7)."
      - "WHEN a generation or a bootstrap is given an anchor explicitly (`--anchor <date>`, replacing the GENERATOR_ANCHOR_DATE override, generator/anchor_date.py line 57), THE SYSTEM SHALL generate the history that anchor gives, byte for byte the same as any earlier generation with that anchor and the same inputs."
      - "WHEN a resume or a checkpoint regenerates a collection's deliveries to compare with a checkpoint (REQ-TEST-160 criterion 2; checkpoints.arrivals_of), THE SYSTEM SHALL regenerate with the anchor recorded for the history being resumed, never with today's, and IF none is recorded, THEN it SHALL refuse, naming `mothman env reset-synthetic` then `mothman pipeline bootstrap`."
      - "IF a generation is asked for an anchor that is not a valid date, or is later than today on the asset's clock, THEN THE SYSTEM SHALL refuse, naming the date, before anything is written."
      - "WHEN this requirement is built, THE SYSTEM SHALL amend REQ-GEN-042 criterion 7 to read 'THE SYSTEM SHALL derive the generated schedule from one anchor date, given to the generation and recorded with the history, rather than from the day it is run.' and criterion 8 to read 'WHEN the generator is re-run with the same anchor and unchanged configuration, THE SYSTEM SHALL produce an identical history, and SHALL NOT add a second copy of it alongside the first.' - wording APPROVED AS WORDED by Keith 2026-11-14."
      - "THE SYSTEM SHALL have tests, seen failing first, of two generations with one anchor writing identical trees, of a provider imported before the anchor is given generating for the anchor given later, of a resume regenerating with the recorded anchor on a later day, and of a future anchor refused."
    non_functional_requirements:
      - "REPRODUCIBILITY: everything stays seeded; the anchor is the one input that varies, and it is recorded, so a history can always be rebuilt (R2)."
      - "AUDITABILITY: the recorded anchor sits with the history in the qa schema, beside run_by and run_timestamp, so 'what date was this generated to' is answered from the record, not from a remembered command."
      - "PRIVACY AT REAL SCALE: only a synthetic asset has an anchor; a real asset's history is what arrived, and nothing here applies to it."
      - "MAINTAINABILITY: the hand bump of ANCHOR_DATE, and the docstring that tells a person to do it (generator/anchor_date.py lines 25-27), go; the fixed test anchor stays as one named constant (REQ-GEN-405)."
    dependencies:
      - "REQ-GEN-042"
      - "REQ-GEN-043"
      - "REQ-TEST-160"
    decisions:
      - "RECORDED WITH THE HISTORY (R2, SETTLED by Keith 2026-11-14): a demo regeneration rolls the anchor to today on the asset's own clock, and the date used is recorded with the history so a re-run with that date reproduces the same bytes. REJECTED the start of the week, and the last quarterly round - the rounding rule #138 offered so the anchor would move rarely."
      - "TWO RECORDS OF ONE FACT, EACH FOR A READER THE OTHER CANNOT SERVE (delivery-scoper, Keith may change it): the generator reads its bookkeeping (a resume), and nothing on the pipeline side may (REQ-GEN-043 criterion 7); the build may read recorded QA results and nothing else, so the bootstrap writes the anchor into the qa schema. Both are written from the one value the generation used."
      - "WHY THE ANCHOR WAS PINNED, AND WHY THIS DOES NOT UNDO IT (generator/anchor_date.py lines 4-23, Keith 2026-09-22): a floating anchor with dated run ids doubled the history (176 runs counted as 352). Run ids carry no date (REQ-GEN-042 criterion 5) and REQ-GEN-408 makes a regeneration replace the whole history, so a rolled anchor rewrites one history in place rather than adding a second."
      - "A FUTURE ANCHOR IS REFUSED (delivery-scoper): a history generated up to a date that has not happened would record receipts in the real future, which REQ-PIPE-382's replay clock cap ('never after the real present') cannot honour."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-405
    title: "A bootstrap rolls the demo's anchor only when asked with --roll-anchor, to the latest day on the asset's own clock whose planned receipts have all passed; otherwise - and always for the test suite and CI - it generates at the fixed test anchor 2026-09-25, and a test reading a deployment's history refuses one generated at any other anchor"
    date_written: "2026-11-14"
    story: "As Keith, I want the demo to show supplies up to today when I regenerate it, while the tests and CI keep testing one fixed date, so that the dashboard I put in front of people is never quiet for want of a supply and the pins and the CI cache never move with the calendar."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #138 (2026-11-03) and R1, R2 and R3 of 'Rolling anchor date scoping', SETTLED 2026-11-14, with the architect's note (docs/drafts/separation-v5-reviews.md line 357); drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL name one fixed test anchor, 2026-09-25 (today's ANCHOR_DATE, generator/anchor_date.py line 46), as a constant in the generator."
      - "WHEN the test suite generates a history, or a CI workflow bootstraps one (MOTHMAN_ENVIRONMENT test or ci), THE SYSTEM SHALL generate at the fixed test anchor, whatever the date."
      - "WHEN a person regenerates the demo data of a synthetic asset with `mothman env reset-synthetic` then `mothman pipeline bootstrap --roll-anchor`, THE SYSTEM SHALL generate at today's date on the asset's own clock (asset_time, the asset's time zone), subject to criterion 5, and SHALL say which date it used before generating (SA Q2, SETTLED by Keith 2026-11-14)."
      - "WHEN `mothman pipeline bootstrap` runs without `--roll-anchor`, THE SYSTEM SHALL generate at the fixed test anchor, on every environment."
      - "IF a planned receipt on the anchor day would fall after the instant the regeneration starts on the asset's clock, THEN THE SYSTEM SHALL take the anchor as the latest day on the asset's clock whose every planned receipt has already passed, and say so (SA Q5, SETTLED by Keith 2026-11-14)."
      - "IF a test that reads a deployment's history - the deployment half's fixtures (tests/conftest.py deployment_history, line 755) and the arrival pin (tests/test_asset_time_semantics.py, tests/fixtures/arrival_semantics_golden.json) - finds the history's recorded anchor is not the fixed test anchor, THEN THE SYSTEM SHALL fail it at collection with one clear message naming the anchor found, the fixed one, and the commands that rebuild the deployment at the fixed anchor (`mothman env reset-synthetic` then `mothman pipeline bootstrap`, without `--roll-anchor`), never skip it and never compare against it."
      - "IF `--roll-anchor` is given where MOTHMAN_ENVIRONMENT is test or ci, THEN THE SYSTEM SHALL refuse before anything is generated, saying that tests and CI always use the fixed test anchor (R1)."
      - "THE SYSTEM SHALL have every test whose result depends on today take its date from the fixed test anchor, never from the wall clock, as tests/test_dashboard_e2e.py line 563 already does for the as-of date."
      - "THE SYSTEM SHALL keep CI's bootstrap cache key (`mothman pipeline cache-key`, .github/workflows/test.yml line 443) unchanged by the calendar date, because it is built at the fixed anchor from committed inputs only."
      - "THE SYSTEM SHALL have tests, seen failing first, of the suite's generation using the fixed anchor on a different wall-clock date, of a bootstrap without the flag using the fixed anchor, of `--roll-anchor` using today on the asset's clock (a pinned clock standing in for today) and the day before when today's last planned receipt is still to come, of `--roll-anchor` refused under test and ci, of the deployment-half refusal on a history recorded at another anchor, and of the cache key equal on two different wall-clock dates."
    non_functional_requirements:
      - "COST: the CI cache key never changes with the date, so rolling the demo costs CI nothing; only a change to committed inputs misses (REQ-TEST-117)."
      - "RELIABILITY: a test meeting a rolled history fails loudly at collection with the fix named (criterion 6), never a skip that reads green (CLAUDE.md: the number to watch is the skip count)."
      - "COMPATIBILITY: today on the asset's clock, not the machine's, so a regeneration in a UTC container and one in Perth agree (CLAUDE.md, 2026-09-18 incident)."
      - "MAINTAINABILITY: the accepted cost (R1) is that tests exercise one fixed date, not the demo's; nothing here tests the rolled demo except criterion 10's unit tests."
    dependencies:
      - "REQ-GEN-404"
      - "REQ-PIPE-382"
      - "REQ-TEST-117"
      - "REQ-TEST-375"
    decisions:
      - "ONLY A DEMO REGENERATION ROLLS (R1, SETTLED by Keith 2026-11-14): the test suite and CI always build from one fixed test anchor, so the arrival pin, the CI bootstrap cache key and the pins stay byte-stable. Accepted cost: tests exercise one fixed date, not the demo's. REJECTED everything rolling (pins rewritten relative to the anchor; the CI cache missing on every roll)."
      - "TO TODAY ON THE ASSET'S CLOCK (R2, SETTLED by Keith 2026-11-14). REJECTED the start of the week, and the last quarterly round."
      - "REGENERATION STAYS DELIBERATE (R3, SETTLED by Keith 2026-11-14): a reset then a bootstrap. REJECTED a scheduled regeneration, and a staleness warning."
      - "THE FIXED TEST ANCHOR IS 2026-09-25 (the architect, docs/drafts/separation-v5-reviews.md line 357): equal to today's ANCHOR_DATE, so the pins REQ-GEN-392 re-captures are not re-captured a third time."
      - "ROLL ONLY ON REQUEST (SA Q2, SETTLED by Keith 2026-11-14, option (a)): on this sandbox the deployment-half tests and the arrival pin read the local `supply` database - the same one a demo regeneration fills - so a bootstrap rolls only with --roll-anchor, and the tests refuse a rolled database with a clear message. A demo and a gate-ready history can sit side by side in two databases (MOTHMAN_SUPPLY_DSN). REJECTED (b) rolling by default with the local gate failing until a rebuild, and (c) the gate bootstrapping a test deployment of its own (a second from-empty bootstrap per asset)."
      - "THE REPLAY'S 'NEVER AFTER THE REAL PRESENT' CAP IS WHY TODAY'S LATE RECEIPTS MATTER (REQ-PIPE-382 decision 'NEVER AFTER THE REAL PRESENT'; Keith's later answer puts the seeded lag in the replay clock, 2026-11-14): a receipt planned for 14:30 on a history generated at 09:00 is in the real future, and a decision on it could not take effect after it. SA Q5 (SETTLED by Keith 2026-11-14, option (a)) anchors on the latest day whose planned receipts have all passed - criterion 5. REJECTED (b) anchoring today and dropping the receipts not yet due, and (c) anchoring today and keeping receipts in the real future."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-406
    title: "When the anchor rolls, the dates a synthetic asset's configuration uses to frame its generated history move with it, so that no slot is owed before the history starts and no scenario falls outside the era it was built for"
    date_written: "2026-11-14"
    story: "As Keith, I want a rolled demo to look like the fixed one - every slot owed has a supply, every scenario still shows what it was built to show - so that rolling the date does not quietly turn into a supplier who stopped delivering or a scenario that refuses to generate."
    moscow: must
    status: not_started
    source: "delivery-scoper, found 2026-11-14 by probing the real generator with the anchor moved (plans/running-thoughts.md #138's 'to scope before building'); put to Keith as SA Q1 and SETTLED by him 2026-11-14 (option (a)). A PROPOSAL, not signed."
    acceptance_criteria:
      - "WHEN a synthetic asset's history is generated at any anchor from the fixed test anchor to today, THE SYSTEM SHALL leave no slot owed before the dataset's first generated supply that is not owed at the fixed test anchor."
      - "WHEN a synthetic asset's history is generated at any such anchor, THE SYSTEM SHALL place every scenario it places at the fixed test anchor, within the era its configuration requires, with no CannotPlace."
      - "WHERE a synthetic asset's configuration writes a date as an offset from its history's anchor, THE SYSTEM SHALL resolve it in asset_model/ against the anchor recorded for the history (REQ-GEN-404), so that the pipeline, the dashboard build and the CLI read the resolved date and none of them computes the anchor; IF an asset that does not declare `synthetic: true` writes one, THEN reading it SHALL refuse, naming the file and the line (SA Q1, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL write the daily asset's calendar versions, its corrections' dates and its setting-era versions that frame the generated history as offsets from the anchor, resolving at the fixed test anchor to the dates they hold today, and SHALL leave the quarterly calendar's authored rounds and every date older than the generated history absolute."
      - "THE SYSTEM SHALL have the Child Protection provider generate from its configured start to the anchor, as Emergency Department, Linkage Products and the geocoding sources already do, rather than a fixed count of quarters ending at the anchor (child_protection.py generated_periods, lines 714-719)."
      - "IF the anchor falls after a calendar's last authored round (the quarterly calendar's last is 2027-11-01, assets/quarterly/calendar.yaml), THEN THE SYSTEM SHALL refuse to generate, naming the calendar and `mothman schedule candidate-dates`, before anything is written."
      - "THE SYSTEM SHALL have tests, seen failing first, generating each synthetic asset's plan (periods and placements only, nothing written) at the fixed anchor and at a later one, asserting criteria 1 and 2, and of the refusal past the last authored round."
    non_functional_requirements:
      - "PERFORMANCE: the daily history keeps its 100 supplies whatever the date; the quarterly asset grows by one quarter for each quarter rolled (about one quarter's replay each), so REQ-PIPE-403's budget is not eroded day by day."
      - "MAINTAINABILITY: the quarterly calendar's authored dates need extending each year before they run out, as a real asset's do; criterion 5 says so when they have."
      - "SECURITY: an offset date is refused on a real asset (criterion 3), so a deployment's agreement is only ever the dates it wrote."
    dependencies:
      - "REQ-GEN-404"
      - "REQ-GEN-405"
      - "REQ-PIPE-380"
    decisions:
      - "MEASURED, NOT ASSUMED (delivery-scoper, 2026-11-14, read-only probe of scenario_injection.resolve and periods_for_dataset with GENERATOR_ANCHOR_DATE set): at 2026-09-25 every dataset's owed periods equal its generated ones; at 2026-11-14 Birth Registrations owes 150 days and is generated 100 (50 unsupplied days from the daily calendar's 2026-06-18 start - the front tail tests/test_schedule.py line 135's guard describes), each Child Protection dataset owes one quarter before its first supply (a fixed 47-quarter window sliding), and TS-78a refuses to place (outside its hold amber-setting era in assets/daily/data-asset.yaml). The quarterly asset placed all 52 scenarios at 2026-11-14 and 2027-03-01; Emergency Department, Linkage Products and the geocoding sources grow and owe nothing new."
      - "WHAT ELSE IS BUILT ON 2026-09-25 (delivery-scoper, from the configuration): the daily calendar's versions 2026-06-18 to 2026-09-25, TS-62's six-hour window version on the history's last day and its correction dated 2026-09-24 (assets/daily/calendar.yaml lines 74-140), and the daily data-asset.yaml's setting versions 2026-08-30 to 2026-09-22. Under a rolled anchor these would no longer sit where their scenarios need them, even where placement does not refuse."
      - "THE QUARTERLY ROUNDS STAY ABSOLUTE (delivery-scoper): they are an authored agreement of real quarter dates; shifting them by days would move rounds off their quarters."
      - "OFFSETS FROM THE ANCHOR (SA Q1, SETTLED by Keith 2026-11-14, option (a)): a synthetic asset may write a date as an offset from its history's anchor, resolved in asset_model/ and refused on a real asset; Child Protection grows like its neighbours; quarterly rounds stay fixed. REJECTED (b) histories growing from their configured start (Birth Registrations would gain a supply a day and pass its budget within about a week), and (c) rolling only the quarterly asset."
    open_questions: []
    signed_off: null

  - id: REQ-DASH-407
    title: "The dashboard and `mothman` say which date a synthetic asset's demo data was generated up to, from the anchor recorded with its history"
    date_written: "2026-11-14"
    story: "As someone shown the demo dashboard, I want to see the date its synthetic data was generated up to, so that a quiet current period reads as an old demo rather than a supplier who stopped delivering."
    moscow: should
    status: not_started
    source: "Keith, R3 of 'Rolling anchor date scoping', SETTLED 2026-11-14; drafted by delivery-scoper 2026-11-14 (speed-anchor v1). A PROPOSAL, not signed."
