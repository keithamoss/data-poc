REQ-PIPE-065:
  acceptance_criteria_replace:
    3: "WHEN a supply is recorded as a resupply of a slot already filled by a promoted supply, THE SYSTEM SHALL say, in the queue item that offers its decision, when the promoted supply was accepted. AMENDED 2026-11-21 (Keith): it asked for a separate report; the awaiting-decision queue item is that report (REQ-PIPE-131, REQ-DASH-070)."
    4: "WHERE such a resupply was received within an hour before the next slot's claim window opened, THE SYSTEM SHALL say so in that queue item, naming the next slot. AMENDED 2026-11-21 (Keith)."
  acceptance_criteria_append:
    10: "WHERE a resupply replaces a promoted supply automatically under the replacement setting (REQ-PIPE-123), THE SYSTEM SHALL carry the same accepted-at and proximity wording in the supply-history entry recording the replacement, and SHALL NOT give that entry more prominence than REQ-PIPE-123 criterion 6 allows. ADDED 2026-11-21 (Keith)."
  retired_criteria:
    - criterion: 7
      date: "2026-11-21"
      by: Keith
      replaced_by: [REQ-GHUB-082]
      reason: "The queue item offers its operations itself - promote, which supersedes the holder, re-file and reject (filing_queue.operations_for, REQ-GHUB-082 criterion 16) - so naming them again in prose is a second list that can drift from the first."
    - criterion: 8
      date: "2026-11-21"
      by: Keith
      replaced_by: [REQ-PIPE-131, REQ-DASH-070]
      reason: "There is no separate warning to emit. Under REQ-PIPE-131 a supply received into a filled slot is recorded as a resupply and waits in the awaiting-decision queue, which never stops processing; a second, parallel warning for the same supply would say the same thing twice."
  unmet_criteria: "REMOVE the criterion-8 entry (retired); add entries for criteria 3, 4 and 10 as not yet built, owned by this requirement's rework."
  status_note: "Criteria 3, 4 and 10 become unbuilt by this amendment, so the status moves from built to in_progress until the rework lands."
  implemented_by_replace:
    remove:
      - qa_tools/common/landed_on_accepted.py::report
      - qa_tools/common/landed_on_accepted.py::may_auto_promote
      - qa_tools/common/landed_on_accepted.py::LandedOnAccepted
    add:
      - qa_tools/common/promotion.py::should_promote
      - "qa_tools/common/filing_queue.py::waiting_over_promoted   # the rework adds the wording here"
  linked_tests_remove:
    - tests/test_landed_on_accepted.py
  code_to_delete:
    - qa_tools/common/landed_on_accepted.py
    - tests/test_landed_on_accepted.py
    - "the 'qa_tools/common/landed_on_accepted' entry in tests/test_sample_data.py's module list (line 283)"
  decisions_add:
    - "THE FILLED-SLOT REPORT IS THE QUEUE ITEM, NOT A SECOND WARNING (SETTLED by Keith 2026-11-21, Q1.1 (a)): landed_on_accepted.report() was built in September, before REQ-PIPE-131 made every such arrival a resupply waiting in the queue, and nothing ever called it. Its wording moves into the queue item's reason; the module and its test go. REJECTED (c) wiring report() as a separate warning, which shows one supply twice, and (b) retiring criteria 3 to 8 outright, which loses the accepted-at instant and the near-the-next-window hint."
    - "THE AUTOMATIC REPLACEMENT CARRIES THE SAME WORDS (SETTLED by Keith 2026-11-21, Q1.2 (a)): with replacement set to green, a green file sent early for the next period and received just before its window opens replaces accepted data with no queue item; criterion 10 gives that history entry the same diagnosis, wording only, no added prominence."
    - "CRITERION 9 IS THE PROMOTION GATE'S (2026-11-21): promotion.should_promote's slot-filled refusal implements it and REQ-PIPE-075 criterion 4 restates it; landed_on_accepted.may_auto_promote was called only by tests and is deleted with the module."
    - "CRITERIA 3 TO 7 HAD BEEN CLAIMED BY TESTS OF CODE NOTHING RAN (found 2026-11-21 by the delivery-architect triage); this amendment ends that over-claim rather than carrying it."
