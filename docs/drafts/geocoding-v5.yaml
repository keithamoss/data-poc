requirements:
  - id: REQ-QAC-294
    title: "Each geocoded source dataset gets a geocoding dataset of its own in Department of Health's Linkage Products collection, declaring - as a linked dataset with no code - the one source it geocodes and how its rows are identified, keyed by those identifiers plus census year, carrying area codes and a match level and no address"
    date_written: "2026-10-25"
    story: "As whoever maintains the pipeline, I want a geocoding dataset declared for each source dataset that carries an address, in the collection Department of Health already releases each quarter, each naming the source it geocodes and the source columns its identifiers hold, so that each can be checked on its own rows and against the source supply it was built from."
    moscow: should
    status: not_started
    source: "Keith, plans/road-testing.md #12 (2026-09-24, unparked 2026-10-25) and his answers of 2026-10-25 (Q1a, Q9b, the shape, L5, L10, road-testing #31) and 2026-10-31 (Q1 a, GA2 a, GA4 a, Q6 a, Q9 a). Drafted by delivery-scoper 2026-10-25 (v1-v3); refreshed 2026-10-31 (v4) against REQ-QAC-330 as built; v5 2026-10-31 with the architect's v4 delta (B1, S7). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL declare, in contract/data-asset.yaml's hierarchy, inside the linkage-products collection REQ-QAC-330 declares, one geocoding dataset per geocoded source dataset, each with an exact arrival pattern for one file per period: geo-cp-clients 'Client Register Geocodes', table geo_cp_clients, file geo_cp_clients.csv; and geo-ed-presentations 'ED Presentations Geocodes', table geo_ed_presentations, file geo_ed_presentations.csv (Keith, 2026-10-31, Q1 a; names L5)."
      - "THE SYSTEM SHALL declare beside each geocoding dataset, as its linked_datasets, exactly ONE entry with NO code - the source dataset it geocodes and the ordered list of the source columns id_1, id_2 and onward hold: geo-cp-clients linking cp-clients by cp_client_id, geo-ed-presentations linking ed-presentations by presentation_id - read by the same schema (qa_tools/common/schemas.py LinkedDataset, its code made optional) and the same validator (qa_tools/common/linked_datasets.py) as Linkage Keys' entries, and SHALL carry a missing code through qa_tools/common/hierarchy.py as None, never as the text 'None' (architect B1)."
      - "THE SYSTEM SHALL declare in that same entry the source's address columns, each with the match level it supports - postcode for both synthetic sources, and suburb for cp-clients only - each refused by the gate where the source's contract does not declare it (Keith, 2026-10-31, GA2 a)."
      - "IF a dataset's linked_datasets entry names a source not in the hierarchy, one naming no calendar, or one never on the same calendar as the declaring dataset in any period (REQ-QAC-330 decision 15's period-by-period rule), or names a source column the source's contract does not declare, or declares more identifier columns than its table's id_N; or IF an entry has no code while the declaring table has a dataset column, or has a code while it has none; or IF a dataset declares more than one entry without a code; or IF two datasets of one collection each declare a single code-less entry naming the same source, THEN `mothman check` SHALL fail, naming the declaring dataset and the reason."
      - "THE SYSTEM SHALL scope every check-file rule of linked_datasets.py to the declaring dataset's own 'checks for <table>' block - valid values, stated codes, id_counts, identifier joins and the referential-and-coverage pair - so that one dataset's checks can neither satisfy nor break another's, and SHALL key a check's id_counts by the source dataset id where the entry has no code (architect B1, S7); and a test SHALL show, seen failing first, that with the geocoding check blocks present a linkage referential check deleted from linkage_keys' block still fails the gate."
      - "THE SYSTEM SHALL declare each geocoding dataset's table in the Linkage Products contract with the columns id_1 to id_N, census_year, sa2_code, lga_code and match_level, N being the same as the Linkage Keys table's (2 today; Keith, 2026-10-31, GA4 a), each with its type and whether it is required; id_1, census_year and match_level SHALL be required, id_2 to id_N, sa2_code and lga_code SHALL NOT be, and every id column SHALL be text whatever the source column's type."
      - "THE SYSTEM SHALL declare match_level's allowed values as exactly 'address', 'postcode', 'suburb' and 'not geocoded'."
      - "THE SYSTEM SHALL declare sa2_code and lga_code as codes in the ABS ASGS formats - a nine-digit SA2 code and a five-digit LGA code (PROPOSED) - present when the row is geocoded and empty when match_level is 'not geocoded'."
      - "THE SYSTEM SHALL declare each geocoding table's key as the identifier columns its source declares together with census_year, and SHALL NOT declare single-column uniqueness on any id column in any tool."
      - "THE SYSTEM SHALL declare no column holding address text, coordinates, a mesh block or SA1 code, a name, a date of birth or any other attribute of the person or presentation."
      - "THE SYSTEM SHALL declare, in contract/calendar.yaml, each geocoding dataset's own participation - owing exactly the periods its source owes, each side compared after its own collection's files_go_to_period (REQ-PIPE-321), geo-cp-clients owing period P where cp-clients owes the round before P and geo-ed-presentations owing what ed-presentations owes, its 2015-Q4 gap included (REQ-GEN-251) - with its own expected time 19:00 and 8 hours' grace (Keith, 2026-10-31, Q6 a and Q9 a); and IF a geocoding dataset's owed periods and its source's disagree for any period, THEN `mothman check` SHALL fail, naming the dataset and the first period they disagree."
      - "THE SYSTEM SHALL say, in each geocoding table's description in the contract, that it is synthetic, stands in for a geocoding product, and holds area codes and a match level only, no real address, location or person; and SHALL reword the contract's own description (REQ-QAC-330 criterion 7) and the collection's entry in contract/presentation.yaml (REQ-QAC-330 criterion 8) to cover a linkage release and a geocoding release."
      - "WHEN `mothman check` runs, THE SYSTEM SHALL pass every configuration gate with the geocoding datasets present - the registry, collections, check-source, dbt-folder, patterns, schedule, zero-active-checks, check-lifecycle and agreement-freeze gates - with no exemption added for them."
    non_functional_requirements:
      - "CONFIGURATION ONLY: hierarchy, calendar, contract and presentation files and their gates; nothing here reads supply rows or the database."
      - "NOTHING CODED FOR ONE COLLECTION: a code-less linked dataset is a generic shape any dataset of any collection may declare; no shared module names Linkage Products, a geocoding dataset or a source (REQ-PIPE-336 criterion 2's no-name rule)."
      - "PRIVACY AT REAL SCALE: a geocode of a child's or patient's address is location data about that person, and the source's identifier values plus an area code plus a census year re-attach it to the source row. The shape carries no coordinates, no address text and nothing finer than SA2, so it is safe to copy into a real deployment; the remaining sensitivity is said in the contract description."
      - "SYNTHETIC GEOGRAPHY: SA2 and LGA codes are drawn in the ABS code formats from a synthetic pool, never from a real ABS correspondence or a licensed address product."
      - "SCALE AT 30 COLLECTIONS: one geocoding dataset per address-bearing source could mean dozens in Linkage Products. Nothing assumes two; criteria 4, 5 and 11's gates keep the list, its check blocks and its participation honest as it grows. Both synthetic sources declare one identifier (Keith, L10); the several-identifier case is exercised on REQ-TEST-339's pattern (REQ-QAC-340 criterion 11)."
      - "NO NEW DEPENDENCY: the four installed tools only."
    dependencies:
      - REQ-QAC-330
      - REQ-PIPE-320
      - REQ-PIPE-321
      - REQ-PIPE-240
      - REQ-QAC-241
    decisions:
      - "ONE GEOCODING DATASET PER SOURCE DATASET (Keith, 2026-10-25). REJECTED v1's single tall table for every source, which would mix sources in one file and make every result about several collections."
      - "IN DEPARTMENT OF HEALTH'S LINKAGE PRODUCTS COLLECTION, BESIDE THE LINKAGE PRODUCT (Keith, Q1a). REJECTED v1's new Location Services agency, a collection of its own, and a second dataset inside Emergency Department."
      - "IDS, TABLES AND FILES AS PROPOSED (Keith, 2026-10-31, Q1 a): geo-cp-clients, geo-ed-presentations; geo_cp_clients, geo_ed_presentations; geo_cp_clients.csv, geo_ed_presentations.csv."
      - "SYNTHETIC SOURCES ARE cp-clients AND ed-presentations ONLY (Keith, Q9b). From the contracts: ed-presentations' only address column is postcode, optional; cp-clients carries suburb and postcode, both required. cp-placements' placement_suburb is out by Keith's 'cp-clients only'."
      - "BIRTH REGISTRATIONS IS OUT (Keith, option i): daily, and standing in for a separate data asset. Criterion 4's calendar rule enforces it from configuration, period by period, as REQ-QAC-330 criterion 6 does for linked datasets."
      - "ONE ROW PER DISTINCT IDENTIFIER SET PER CENSUS YEAR (Keith, 2026-10-25, restated 2026-10-31 GA1 a): an ED patient with three presentations has three sets of rows; a source row repeating another's identifiers is geocoded once, and the repeat is reported by the source's own uniqueness check, never as a geocoding duplicate year."
      - "KEYED BY THE SOURCE'S OWN IDENTIFIERS ON THE LINKAGE KEYS PATTERN (Keith, 2026-10-25 evening): id_1 to id_n, key = ids plus census_year. REJECTED v2's single source_row_id, and REJECTED a line number in the file, which changes with every resupply."
      - "A GEOCODING DATASET IS A LINKED PRODUCT WITH ONE SOURCE AND NO CODE (architect B1, v5): v4's 'a linked-dataset entry less the supplier's code' reused the validator without seeing that it reads the whole collection's check file - a geocoding check naming cp-clients would have counted toward linkage's referential-and-coverage pair, masking a deleted linkage check, and its codes would have been checked against linkage's valid values. Criterion 5 scopes each rule to its own check block. REJECTED a parallel declaration and validator (architect D2, kept), and REJECTED a geocoding-only key such as 'geocodes:', which every generic reader would have to learn by name."
      - "EXACTLY ONE ENTRY WHEN THERE IS NO CODE (delivery-scoper, v5): with no dataset column, a row cannot say which source it is about, so a code-less declaration of two sources is ambiguous by construction. Generic, not a geocoding rule."
      - "THE GEOCODING MAPPING IS ITS OWN, AND NO GATE COMPARES IT WITH THE LINKAGE ONE (Keith, 2026-10-25; REQ-QAC-330 decision 17): which columns a geocoder identifies a record by is an agreement with the geocoder."
      - "DECLARED BESIDE THE GEOCODING DATASET, NOT BESIDE linkage-keys (delivery-scoper, v4): each geocoding dataset has exactly one source, so the entry sits on it."
      - "ADDRESS COLUMNS ON THE ENTRY (Keith, 2026-10-31, GA2 a): the synthetic geocode follows from the source row's own address columns, so the provider must know which they are; read only by the generator, validated against the source contract. REJECTED (b), a geocoder failure rate independent of the source's addresses."
      - "THE SAME id_N AS LINKAGE KEYS (Keith, 2026-10-31, GA4 a): N = 2 today, so every id-keyed table in the collection has one shape and the no-surplus check has a column to read (REQ-GEN-335 decision 12's WHERE 1 = 0). REJECTED (b), each table only its source's count. Stated, not gated: no gate compares the two contracts' N (PROPOSED); revisit if a third id-keyed table joins."
      - "PARTICIPATION MIRRORS THE SOURCE, DECLARED AND GATED (Keith, 2026-10-31, Q6 a; architect S1, S2): owed exactly the source's periods after each side's offset, so geo-ed-presentations is not owed in ED's 2015-Q4 gap. REJECTED (b), owed every quarter the collection is with the gaps scripted not supplied; REJECTED v3's 'from the first quarter its source has a generated supply filed to', which read generated state; REJECTED a calendar feature ('participation follows <dataset>') for two datasets, worth revisiting at dozens."
      - "DUE 19:00 AS THE DATASET'S OWN EXPECTED TIME (Keith, 2026-10-31, Q9 a; architect nit): the collection's default stays linkage's 18:00, so each geocoding dataset states its own."
      - "ID COLUMNS ARE TEXT (as REQ-QAC-330 decision 12)."
      - "THE SHAPE IS KEITH'S (2026-10-25 evening): one file per geocoding dataset; census_year, sa2_code, lga_code, match_level; no address, coordinates, name or date of birth; no mesh block or SA1. REJECTED v1's statistical_area_code, match_score, geocoded_date and geocoder_version."
      - "NOT GEOCODED IS A ROW, NOT AN ABSENCE (Keith, road-testing #31 = a). REJECTED no row at all, which would make the missing-year check red for a geocoder's honest failure."
      - "SA2 AND LGA, NOT SA1 OR MESH BLOCK (Keith, agreeing v2): SA2 is the coarsest ABS area commonly used for analysis; codes differ by ASGS edition, hence a row per census year."
      - "NO COORDINATES, NO ADDRESS TEXT (v1, kept): a coordinate is the address. REJECTED synthetic jittered coordinates."
      - "EVERY QUARTER, AT files_go_to_period 0 (Keith, Q2): the collection's offset (REQ-QAC-330 criterion 2), never one of their own (REQ-PIPE-320 criterion 3)."
      - "THE CONTRACT IS THE COLLECTION'S: further schema entries in the Linkage Products contract, as Child Protection's six tables share one."
      - "NO ROW-COUNT CHECK (Keith, Q8): an empty or short geocoding supply is REQ-QAC-340's coverage check's to find."
      - "NO AMENDMENT TO REQ-QAC-330 (delivery-scoper, v5, from its text): its criteria 5 and 6 are about Linkage Keys' own entries, which keep their codes; an optional code on the shared schema changes none of them."
    open_questions: []

  - id: REQ-GEN-295
    title: "The Linkage Products provider, restructured into declared delivery streams, writes for every quarter each source has a geocoding delivery of its own due 19:00, after the linkage delivery, built from the last source supply received before it - one row per distinct identifier set per census year in force, codes from a keyed hash, a record with no address written not geocoded"
    date_written: "2026-10-25"
    story: "As Keith planting scenarios, I want each quarter's synthetic geocoding built from exactly the source rows a geocoder could have seen, in every quarter Child Protection's and Emergency Department's histories hold, so that the ordinary history's verdicts are known by construction and every fault in it is one the generator put there on purpose."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-25 (Q3a full snapshots, Q9b, L4 all quarters, Q13 last source supply received before, road-testing #31, L9 = b), 2026-10-28 (REQ-GEN-334 decision 3: a geocoding delivery of its own) and 2026-10-31 (GA1 a, GA2 a, Q9 a). Drafted by delivery-scoper 2026-10-25; refreshed 2026-10-31 (v4) against REQ-GEN-334 as built; v5 2026-10-31 with the architect's v4 delta (S1, S2, S5, nits) and the UX delta's ED-resupply concern, verified from the code. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL restructure the Linkage Products provider (generator/collections/linkage_products.py) so that each kind of delivery it writes is a declared DELIVERY STREAM - the linkage stream and the geocoding stream - each with its own datasets, slot ids, seed range, receipt window, due time, severity draw, scenario lookup and refusals, the provider's targeting declarations (target_datasets, amber_dataset) generalised wherever they assume one dataset, and the geocoding stream generic over the code-less linked datasets REQ-QAC-294 criterion 2 declares, naming no source collection, geocoding dataset or table (architect S1)."
      - "WHEN the restructured provider generates, THE SYSTEM SHALL write every linkage delivery, receipt and bookkeeping entry byte-identical to what it wrote before the restructure, shown by REQ-TEST-239's compare."
      - "THE SYSTEM SHALL build each geocoding file for quarter P from the source dataset's LAST generated supply filed to P and RECEIVED BEFORE the geocoding delivery's own receipt, obtained through REQ-GEN-334 criterion 6's declared row interface (generator.collections.base.generated_supplies), reusing the one cached plan the linkage stream already holds, never by reading data/deliveries."
      - "THE SYSTEM SHALL write, in an ordinary geocoding supply, exactly one row for each DISTINCT set of identifier values in the source supply and each census year in the set in force for P (REQ-QAC-300), and no other row; a source row whose identifiers are null or blank SHALL be written nowhere, and a source row repeating another's identifiers SHALL be written once (Keith, 2026-10-31, GA1 a)."
      - "THE SYSTEM SHALL derive each geocoded row's sa2_code, lga_code and match_level from a keyed hash of the stream's seed, the geocoding dataset and the identifier values, the census year changing only the codes, never from a random draw's state - so the same record carries the same codes and match level in every quarter and every resupply, and is placed or not placed for all its census years together."
      - "THE SYSTEM SHALL write a source record 'not geocoded', codes empty, when none of its declared address columns (REQ-QAC-294 criterion 3) holds a value, and otherwise SHALL place it no finer than the finest match level its present address columns support (Keith, 2026-10-31, GA2 a); and SHALL, independently of the source, write a further 0.5 to 1.5 percent of records 'not geocoded' from the stream's seed (PROPOSED), the synthetic geocoder's own failures."
      - "THE SYSTEM SHALL compute in the provider each geocoding supply's not-geocoded share from the rows it writes, band it by the share check's own bands as the check catalogue reads them (qa_tools/common/check_bands.py, REQ-GEN-183), and record that planned verdict, so that a supply whose source's missing addresses carry it into the amber or red band is planned as such and never written as though green; and SHALL have the real tools confirm every planned verdict (REQ-GEN-186), the geocoding datasets declared among the provider's target_datasets (architect S2)."
      - "THE SYSTEM SHALL generate a geocoding delivery for every quarter any geocoding dataset's source has a generated supply filed to, holding one file for each geocoding dataset whose source has one there, and none for a quarter whose round is after the generator's anchor date."
      - "THE SYSTEM SHALL write each quarter's geocoding files as ONE delivery of their own, separate from the linkage delivery (REQ-GEN-334 decision 3), received on the quarter's own round between 18:05 and 18:55, before its 19:00 due time (REQ-QAC-294 criterion 11; Keith, 2026-10-31, Q9 a), scheduled under REQ-GEN-334 criterion 12's rule after the effective instant of each same-round source promotion, with that criterion's refusal applied to this delivery as to the linkage one."
      - "IF the geocoding delivery would share a receipt instant with any other delivery - another provider's (REQ-GEN-334 criterion 13) or this provider's own linkage stream's - THEN generation SHALL refuse before writing anything, naming both (architect nit: the driver's check reads other collections' bookkeeping only)."
      - "THE SYSTEM SHALL declare both geocoding datasets beside linkage-keys in generator/scenario_injection.py's CORRECTION_RIDERS for REQ-GEN-205, unconditionally, so that every geocoding supply in a period an altered round's slot fills rides that correction, its outcome recorded from the impact preview at confirmation (REQ-GEN-334 decision 23), with no further amendment to REQ-GEN-237 or REQ-GEN-205 (architect S5)."
      - "WHERE Child Protection's routine supply is suppressed for a period - at files_go_to_period 1 the period after each corrected round (REQ-GEN-325 criterion 5) - THE SYSTEM SHALL write no geo_cp_clients.csv for that period and SHALL add a scripted mark-not-supplied entry for geo-cp-clients there (contract/scripted_decisions.yaml, REQ-GEN-135); WHERE such a period is also one an altered round's slot fills (2015-Q2 and 2015-Q3 by the architect's reading, to be confirmed against correction_claims.altered at build), geo-cp-clients SHALL be both ridden and marked; and the test deriving the expected marks (tests/test_scripted_decisions.py) SHALL derive them for every dataset reading a suppressed source, not for cp-clients by name (architect S5)."
      - "THE SYSTEM SHALL draw each geocoding dataset's ordinary severities from the geocoding stream's own seed with the collections' mix - about a quarter amber, two reds each with a green resupply five to twenty days later, the oldest supply clean - applying REQ-GEN-298's presets, separately from the linkage stream's draw."
      - "THE SYSTEM SHALL keep every seed the geocoding stream derives inside a second seed range declared by the provider, [71000, 72000) (PROPOSED; the first, [70000, 71000), is mostly used by linkage), disjoint from every other provider's (REQ-GEN-246's overlap gate)."
      - "WHEN `mothman lp generate-synthetic-data` runs twice with the same seed and configuration, THE SYSTEM SHALL write byte-identical deliveries and receipts both times; and adding the geocoding stream SHALL change no byte any other collection writes, nor any linkage delivery (REQ-TEST-239's compare)."
      - "THE SYSTEM SHALL apply, in the change that adds this requirement to requirements.yaml, amendment A4 to REQ-GEN-334 criterion 8, recorded as FINAL TEXT in this requirement's decisions and marked 'AMENDED <date applied> by REQ-GEN-295', once Keith has signed its wording."
    non_functional_requirements:
      - "BOOTSTRAP BUDGET, TO BE MEASURED (Keith, L4): about 55 geocoding deliveries plus resupplies and knock-on re-checks on the quarterly stream, the critical path, already 2,789 seconds over REQ-PIPE-250's 720 (REQ-PIPE-336 evidence). Measured by REQ-PIPE-296."
      - "VOLUME, WITH FOUR VERSIONS OF THE SET (Keith, Q10 b): about 2,000 ED presentations and 500 Client Register records a supply, times the years in force - one year to 2017-Q2 (about 2,500 rows a delivery), two to 2022-Q2 (5,000), three to 2026-Q2 (7,500) and four from 2026-Q3 (10,000). The share and drift checks read proportions, so the growth at each widening moves no ordinary verdict (REQ-QAC-297's decision on drift at a widening)."
      - "GENERATION TIME: the provider already re-plans Child Protection and Emergency Department in memory (about 15 seconds, REQ-GEN-334 decision 24); the geocoding stream reuses that one cached plan (criterion 3)."
      - "SYNTHETIC ONLY: no real address, geocode, ABS correspondence or licensed address product. Importable without pandas or numpy (REQ-GEN-246)."
    dependencies:
      - REQ-QAC-294
      - REQ-QAC-300
      - REQ-GEN-334
      - REQ-GEN-246
      - REQ-GEN-325
      - REQ-GEN-205
      - REQ-GEN-135
      - REQ-GEN-183
      - REQ-GEN-184
      - REQ-GEN-186
      - REQ-TEST-239
    decisions:
      - "FULL SNAPSHOTS, SO EVERY RECORD (Keith, Q3a). REJECTED v1's 'records geocoded since the last supply'."
      - "THE PERIOD, NOT THE ROUND (REQ-PIPE-321, REQ-GEN-325): Child Protection is at files_go_to_period 1, so the geocoding delivery on 2026-Q2's round (1 May) geocodes the cp_clients supply filed to 2026-Q2, received on 1 February; Emergency Department is at 0, so it geocodes ED's supply of the same round."
      - "FROM THE LAST SOURCE SUPPLY RECEIVED BEFORE THE DELIVERY (Keith, Q13): REQ-GEN-334 criterion 5's rule, applied to this delivery's own receipt."
      - "ED RESUPPLY BETWEEN RELEASE AND PROMOTION, VERIFIED FROM THE BUILT CODE (delivery-scoper, 2026-10-31, answering the UX delta's medium concern): in an ordinary ED red quarter the geocoding delivery describes the red routine supply, received hours earlier and held. Emergency Department's red routine supply and its resupply carry the SAME presentation_id values - generator/collections/emergency_department.py's dirty() blanks 8 percent of postcodes and alters stay, departure, triage and sex values, never presentation_id, and churn() changes only departure_status - and the orphan and coverage checks compare identifiers only. So: at the geocoding check ed_presentations is not in the period's warehouse, both checks record not evaluated, red, could not run (REQ-PIPE-331 criterion 4), counting only toward the geocoding supply (REQ-QAC-340 criterion 6), and the geocoding supply is held back; five to twenty days later the resupply is promoted, the knock-on re-evaluates both against it (no orphan, 100 percent coverage) and re-gates the geocoding supply. NOTHING COUNTS AGAINST ED's GREEN RESUPPLY THAT IT DOES NOT DESERVE, so the concern does not arise in the ordinary history and NO NEW CRITERION is needed. What does differ is the own-row share: the geocoding was built from rows missing 8 percent of postcodes, so it reads about 8.5 to 9.5 percent not geocoded - amber, on the geocoding supply alone (the share check reads no source table) - though the promoted resupply has the postcodes. That is honest, the geocoder geocoded what it was sent, and criterion 7 plans it. In ED's amber quarters (3 percent missing) the share is 3.5 to 4.5 percent, green. WHERE A FUTURE SOURCE'S resupply changes its identifiers, the orphan and coverage verdicts WOULD count against the resupply - G1 (b) working as Keith chose, as linkage's do, and nothing geocoding-specific."
      - "A GEOCODING DELIVERY OF ITS OWN (Keith, 2026-10-28, REQ-GEN-334 decision 3): REVERSES Q13's one zip with linkage_keys.csv. Both geocoding files share one delivery and so one package (REQ-PIPE-266); neither reads the other, so each dataset is gated on its own verdicts."
      - "DUE 19:00, RECEIVED 18:05 TO 18:55, THE DATASET'S OWN EXPECTED TIME (Keith, 2026-10-31, Q9 a): an hour after the linkage delivery (17:05 to 17:55, due 18:00), so the two receipt windows never interleave and criterion 10's tie refusal is not invited. SUPERSEDES v4's provisional 19:00 and REQ-GEN-334's stale 15:00 (amendment A4). REJECTED 17:xx beside the linkage delivery."
      - "DECLARED DELIVERY STREAMS, NOT A SECOND PROVIDER (architect S1): the provider is one-dataset throughout - DATASET_ID, amber_dataset, target_datasets, lp_slot_ ids, one seed range, one receipt window and refusals keyed to linkage-keys' slots. REJECTED a separate geocoding provider (REQ-GEN-246's one provider per collection; REQ-GEN-334 criterion 1 and decision 17), and REJECTED bolting geocoding onto the linkage code paths with conditionals, which is the second copy of every scheduling rule the stream shape avoids. Criterion 2 is what proves the restructure moved nothing."
      - "GENERIC OVER THE DECLARATION (Keith's no-special-case rule): the provider reads which datasets to geocode, how they are identified and which address columns they have from configuration, as it already reads linked_datasets."
      - "ALL QUARTERS EACH SOURCE HAS (Keith, L4, overriding Q9b's twelve)."
      - "THE CORRECTED QUARTERS (architect M5, then S5): the five corrections (REQ-GEN-205, TS-57 to TS-61) alter nine rounds. REPLACED v4's 'geo-ed-presentations rides; geo-cp-clients is marked' with criterion 11's unconditional rider declaration for both, because CORRECTION_RIDERS is unconditional by design and REQ-GEN-237 criterion 3 as amended needs every supply in an altered period named by a riding scenario - a geo-cp-clients supply on an altered round sits in that round's own period. Where Child Protection was suppressed the period before, geo-cp-clients is also marked (criterion 12)."
      - "NO NEW AMENDMENT TO REQ-GEN-237 OR REQ-GEN-205 (delivery-scoper, v4, kept): their amended text (REQ-GEN-334 decisions 10, 12 and 13, signed 2026-10-30) already covers 'every supply of another collection that a slot due on its altered round fills'."
      - "CODES FROM A KEYED HASH (architect S12): a hash of seed, dataset and identifiers cannot drift between resupplies, and placing a record for all its years together keeps rows and records agreeing on the share (REQ-QAC-297). REJECTED a seeded random draw per supply."
      - "THE PLANNED VERDICT IS COMPUTED IN THE PROVIDER, NOT BY A NEW TARGETING LEVER (architect S2): generator/targeting.py lets a provider declare one lever set and evaluates no row rule, so v4's 'by that check's own rule and bands (generator/targeting.py's catalogue)' named machinery that does not exist. The provider computes the share and reads only the band from the catalogue; the real-tool trial confirms. REJECTED adding a second lever set per provider, which targeting's gate refuses, and REJECTED re-implementing Soda's rule in Python (architect Q3 (b), declined by Keith)."
      - "A NOT-GEOCODED ROW IS ORDINARY (Keith, road-testing #31 = a; GA2 a): 0.5 to 1.5 percent of the geocoder's own (PROPOSED) keeps an ED amber supply under the 5 percent amber line and puts an ED red one in the amber band (see the ED decision above)."
      - "GA1 (a) IS WHAT KEEPS THE YEAR CHECKS CLEAN BY CONSTRUCTION (Keith, 2026-10-31): ordinary rows satisfy the three year checks exactly, so any missing, duplicate or unexpected year is an injection (REQ-GEN-298). Under (b), Child Protection's own duplicated cp_client_id rows (generator/dirty.py apply_cp_clients_presets, about 2 amber and 10 red) would be duplicate years on most amber and red Child Protection quarters (architect headline 1). REJECTED (b)."
      - "THE SET IN FORCE FOR THE PERIOD, not today's: criterion 4 reads REQ-QAC-300's one resolution, so generator and checks cannot disagree."
      - "A SECOND SEED RANGE (architect nit): [70000, 71000) holds linkage's 70001.. slots, their +500 resupplies and two fixed seeds near 70999, so geocoding's slots and resupplies would leave little room. [71000, 72000) is unclaimed by every provider as of 2026-10-31 (the seed_ranges of child_protection, civil_registration, emergency_department and linkage_products read)."
      - "AMENDMENT A4, FINAL TEXT PROPOSED - REQ-GEN-334 criterion 8 (Keith, 2026-10-31, Q9 a: 'REQ-GEN-334 c8's stale 14:00/15:00 amended'; WORDING NOT YET SIGNED). CURRENT, as signed 2026-10-30: 'THE SYSTEM SHALL write each quarter's linkage product as its own delivery on the quarter's own round date - linkage_keys.csv due 14:00 (PROVISIONAL), after Emergency Department's morning arrivals for that quarter - filed, checked and gated as its own package (REQ-PIPE-266, REQ-PIPE-336 criterion 6); the geocoding delivery due 15:00 is added by the geocoding requirements (REQ-GEN-295).' PROPOSED: 'THE SYSTEM SHALL write each quarter's linkage product as its own delivery on the quarter's own round date - linkage_keys.csv due 18:00 with 8 hours' grace and received 17:05 to 17:55, after Emergency Department's afternoon arrivals for that quarter (15:00 to 17:00) - filed, checked and gated as its own package (REQ-PIPE-266, REQ-PIPE-336 criterion 6); the geocoding delivery, due 19:00 with 8 hours' grace and received 18:05 to 18:55, is added by REQ-GEN-295. AMENDED <date applied> by REQ-GEN-295.' NOTE FOR SIGNING: this states 18:00 without 'PROVISIONAL', so signing it settles linkage's due time too, which REQ-GEN-334's decision 'DUE 18:00, NOT 14:00' still marks PROVISIONAL; and 'morning' was wrong as built (ED lands 15:00 to 17:00 Perth). Wording only - it describes what is built (contract/calendar.yaml, linkage_products.RECEIVED_FROM)."
    open_questions: []

  - id: REQ-PIPE-296
    title: "The geocoding datasets run end to end through Linkage Products' existing QA adapter and its dbt folder, their delivery its own package in the quarterly bootstrap stream, the bootstrap's cost measured before and after"
    date_written: "2026-10-25"
    story: "As whoever maintains the pipeline, I want the geocoding datasets filed, staged, checked, recorded, gated and bootstrapped through the Linkage Products adapter like every other dataset, so that nothing about geocoding is special-cased and its cost is known."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-25. Drafted by delivery-scoper on REQ-PIPE-233's pattern; refreshed 2026-10-31 (v4) against REQ-PIPE-336 as built; v5 2026-10-31 with the architect's v4 delta (S3). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL serve the geocoding datasets from the collection's existing adapter, qa_tools/collections/linkage_products.py, extending only its declarations - each geocoding table's failing-sample key (REQ-PIPE-341), its Soda column attachments, its value-count statistics (REQ-QAC-297 criterion 11) and a DbtSpec declaring the year tests it counts and samples (REQ-QAC-297 criterion 2) - and SHALL report its logic against REQ-TEST-249's 150-line soft budget."
      - "THE SYSTEM SHALL give each geocoding dataset the collection's dbt side under dbt_project/models/linkage-products/ - a staging model, its entry in the folder's sources.yml beside the source relation of REQ-QAC-297 criterion 3, and its year tests in schema.yml - by the convention REQ-QAC-241 finds (architect S3)."
      - "WHEN a geocoding delivery arrives, THE SYSTEM SHALL file, stage, check with all four tools, record and gate it through the shared modules as its OWN package (REQ-PIPE-266, REQ-PIPE-336 criterion 6), waiting on no linkage delivery, with no geocoding name in any file outside configuration, check files, the dbt folder, the adapter and the provider."
      - "WHEN `mothman pipeline bootstrap` runs over an empty database, THE SYSTEM SHALL replay the geocoding deliveries in the quarterly stream in receipt order with Child Protection, Emergency Department and the linkage deliveries (REQ-PIPE-262)."
      - "WHERE a geocoding delivery omits a geocoding dataset's file for a quarter, THE SYSTEM SHALL treat that dataset's slot as any unfilled slot (REQ-PIPE-132), the delivery's other file filed and checked as usual."
      - "WHEN the dashboard is built from recorded results holding the geocoding datasets, THE SYSTEM SHALL show each as a dataset of Linkage Products with the same status, as-at and supply-history behaviour as every other dataset."
      - "THE SYSTEM SHALL measure a from-empty bootstrap before and after the geocoding datasets are added, by collection and stream, the geocoding runs and the knock-on re-checks they cause counted separately, and SHALL record both in this requirement's evidence and in CLAUDE.md's running log, reported to Keith against REQ-PIPE-250's budget."
      - "THE SYSTEM SHALL run CI's deployment half against a bootstrap holding the geocoding datasets and record its duration against REQ-TEST-260's monthly allowance."
    non_functional_requirements:
      - "A BUILD MAY READ RECORDED QA RESULTS, NEVER ACTUAL DATA, AND NEVER ANYTHING ELSE (Keith, 2026-09-27): nothing here widens the publisher's grant."
      - "ENUMERATE EVERY CONSUMER OF THE KEY (CLAUDE.md's shape-change rule): REQ-PIPE-341 owns the composite failing-sample key; this end-to-end run is where a missed consumer would show, so its evidence names the readers checked."
      - "PARTIAL BOOTSTRAPS: `--collection lp` already carries what its checks read (REQ-PIPE-336 criterion 7), and --resume and checkpoints already refuse by name for a collection reading others (REQ-PIPE-336 decision 9); the geocoding datasets inherit both unchanged."
      - "CI COST: the deployment half took 62m17s on a cache miss with linkage (REQ-PIPE-336 evidence); geocoding adds to it, which matters against REQ-TEST-260's 2,000 minutes a month."
    dependencies:
      - REQ-QAC-294
      - REQ-GEN-295
      - REQ-PIPE-336
      - REQ-PIPE-262
      - REQ-PIPE-341
      - REQ-QAC-241
    decisions:
      - "NO ADAPTER OF ITS OWN (REQ-PIPE-240, REQ-PIPE-336 criterion 1). REJECTED v1's geocoding adapter."
      - "ITS OWN PACKAGE (REQ-PIPE-336 decision 3 and criterion 6): REPLACES v3's 'a Health release holding geocoding files' (architect M6)."
      - "THE dbt SIDE IS NAMED (architect S3): v4 criterion 1 listed only Soda and statistics declarations, though the year checks are dbt's (Keith, Q6) and need a staging model, a source and schema tests the collection does not have, its dbt folder holding Linkage Keys' only."
      - "ITS OWN MEASUREMENT (delivery-scoper, v4): linkage was built and measured first (REQ-PIPE-336 decision 8). REVERSES v3's 'one measurement, not two'."
      - "CROSS-COLLECTION READS ARE IN THIS BATCH (Keith, 2026-10-31, G1 = b, REQ-PIPE-331 built): REVERSES v3's 'no cross-collection read in v1'; REQ-QAC-340's checks read the source tables through REQ-PIPE-331's resolver."
      - "MOSTLY ITEM 6's ALREADY: what remains is the end-to-end facts only real datasets make true, as REQ-PIPE-233 and REQ-PIPE-336 found."
    open_questions: []

  - id: REQ-QAC-297
    title: "Every geocoding dataset gets three generic set-member checks in dbt on census_year, red on a single row, a not-geocoded share check amber above 5 percent and red above 10, and the ordinary checks - Linkage Keys' two identifier checks, match level allowed values, area-code format and match-level drift"
    date_written: "2026-10-25"
    story: "As whoever maintains the pipeline, I want, for a geocoding table, checks that say whether every record has exactly one row for each census year in force - missing, duplicated and unexpected years each its own result - beside a banded share of rows not geocoded and a few structural checks, so that an incomplete geocode, a double-load, a year nobody agreed and a geocoder placing fewer addresses are different alarms."
    moscow: should
    status: not_started
    source: "Keith, plans/road-testing.md #12, and his answers of 2026-10-25 (Q6, Q7, Q8, road-testing #31, Q14). Drafted by delivery-scoper 2026-10-25; refreshed 2026-10-31 (v4) against REQ-QAC-333 as built; v5 2026-10-31 with the architect's v4 delta (B2, S4, S7 and the _SAMPLED_DIRECTLY nit). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL implement the three year checks as ONE dbt macro in dbt_project/macros/, taking the key columns, the member column and the name of the list setting holding the declared set (member_setting), called by THREE thin generic tests in dbt_project/tests/generic/ named for the set and not for census - missing, duplicated and unexpected set members (names PROPOSED) - so that dbt_check_id_lookup's (model, column, test) key gives each its own check_id on census_year (architect headline 2), with no geocoding dataset carrying SQL of its own for them and no shared macro or test naming census or geocoding (architect S4)."
      - "THE SYSTEM SHALL let a collection adapter's DbtSpec declare which generic tests record a row-counted violation count and which are sampled directly, read by qa_tools/tools/run_dbt.py beside its own built-in sets, and SHALL declare the three set-member tests there in Linkage Products' adapter - so that each records its violation count and its failing pairs and run_dbt.py names none of them (architect S4; _SAMPLED_DIRECTLY is an alias of _AUDIT_COUNTED today, so one declaration serves both, said in the code)."
      - "THE SYSTEM SHALL build, in period_overlay.rebuild_for_arrival's one build of a run's view schema, a relation holding the declared set in force for the run's period (REQ-QAC-300), read by the year tests through dbt's source() (REQ-PIPE-331 criterion 11's pattern), and SHALL NOT declare it in any check's reads_tables, which REQ-PIPE-331 criterion 2's gate would refuse as a table no dataset owns, nor pass the set through dbt --vars (architect headline 3, B2) - PROVEN BY EXPERIMENT against the installed dbt before this criterion is called met: partial parsing survives, and two runs of different periods read different sets."
      - "WHERE a run is filed to no period, so no set is in force for it, THE SYSTEM SHALL leave the three year checks out of the run's dbt selection and record each not evaluated with a structured reason saying the declared set needs the run's period, never as a pass or a tool error (architect B2)."
      - "WHEN a record's identifier values present in the table lack a row for a census year in the set in force, THE SYSTEM SHALL fail the missing-year check, counting one violation per absent record and year."
      - "WHEN a record's identifier values have more than one row for the same census year, THE SYSTEM SHALL fail the duplicate-year check, counting one violation per duplicated record and year."
      - "WHEN a row carries a census year outside the set in force, or none, THE SYSTEM SHALL fail the unexpected-year check, counting one violation per such row."
      - "THE SYSTEM SHALL band each year check red at a single violation, with no amber band, and SHALL record for each failing pair the record's identifier values and the census year (REQ-PIPE-341)."
      - "THE SYSTEM SHALL define, for each geocoding dataset, a Soda NOT-GEOCODED SHARE check - the percentage of the supply's rows whose match_level is 'not geocoded' - amber above 5 percent and red above 10, recorded with its unit (percent) and its direction (above), of a generic VALUE-SHARE check kind of its own (any column, any declared value), never Soda's invalid_percent, its MEASURES phrase declared on the check (REQ-DASH-299 criterion 1)."
      - "THE SYSTEM SHALL define, for each geocoding dataset, as Soda checks each red on one violation, in the table's own 'checks for' block: REQ-QAC-333 criterion 1's EXPECTED-IDENTIFIERS (3) and NO-SURPLUS-IDENTIFIERS (4) checks, of the same check kinds with id_counts keyed by the source dataset id (REQ-QAC-294 criterion 5), so that REQ-QAC-333 criterion 3's gate fails a geocoding check file whose identifier count or columns disagree with REQ-QAC-294 criterion 2's mapping; match_level in its four allowed values, an empty one a violation; and sa2_code and lga_code each in its ABS format when match_level is not 'not geocoded' and empty when it is."
      - "THE SYSTEM SHALL define, for each geocoding dataset, an Evidently drift check on match_level with 'not geocoded' excluded from both reference and current, by a value exclusion declared on the check and applied generically by the Evidently runner (qa_tools/tools/run_evidently.py), which has none today (architect S7, v4 delta) - proven by experiment against the installed Evidently - with the bands Emergency Department's drift checks use (PROPOSED), and SHALL declare match_level's value counts in the adapter's StatsSpec, which the drift reference and the page's value bars both read."
      - "WHEN a geocoding supply holds no rows, THE SYSTEM SHALL evaluate the year checks and the share check as it would any table and record each as passed, the share's zero-of-zero proven by experiment against the installed Soda - the empty supply being REQ-QAC-340's coverage check's to fail."
      - "IF a geocoding dataset lacks any of the three year checks, the share check or either identifier check, or declares a year check without key columns, a member column or a member_setting naming a declared list setting, THEN `mothman check` SHALL fail, naming the dataset."
      - "THE SYSTEM SHALL give every check here a name, description, failure_indicates and technical_note written to docs/check-authoring-rules.md as it stands, with reads_columns declared and an introduced_date on or before the claim-window opening of the dataset's first generated period, each failure_indicates naming the likely causes on both sides - the geocoder's run or the source's addresses - where both can produce it (UX QAC-297 c12), in the files REQ-QAC-241 finds by convention."
      - "THE SYSTEM SHALL record no value count, aggregate or distribution of sa2_code, lga_code or any id column, in dataset statistics or any check result (architect S9)."
    non_functional_requirements:
      - "PRIVACY: a failing sample records identifier values and census year only, never an area code; the only distribution recorded is match_level's, four values and no location."
      - "NO PERMISSIVE FALLBACK: a misdeclared check is refused by the gate (criterion 13), and a run with no period records not evaluated (criterion 4), never a silent green."
      - "VERIFIED BY EXPERIMENT, NOT DOCS: criteria 3, 11 and 12 each name the behaviour to prove against the installed tool before they are called met."
      - "SCALE: one GROUP BY over key and year, linear in rows; at dozens of geocoding datasets every check is declared, never copied, and criterion 13's gate keeps each present."
      - "ONE IMPLEMENTATION OF EACH IDENTIFIER CHECK: REQ-QAC-333's kinds under its gate, so the two kinds of id-keyed table cannot drift."
      - "NOTHING CODED FOR GEOCODING IN SHARED CODE: the macro, the tests, the value-share kind, the value exclusion and the DbtSpec fields are generic; census and geocoding appear only in configuration, check files, the dbt folder and the adapter."
    dependencies:
      - REQ-QAC-294
      - REQ-QAC-300
      - REQ-PIPE-296
      - REQ-PIPE-341
      - REQ-QAC-333
      - REQ-PIPE-331
    decisions:
      - "THE GENERALISABLE RULE (road-testing #12): for every key, exactly one row for each member of a declared set - one reusable test; the key is the ids together, hence a list of key columns."
      - "THREE CHECKS, NOT ONE WITH THREE COUNTS (Keith, Q6). REJECTED one combined count and one result with sub-counts."
      - "ONE MACRO, THREE THIN TESTS (architect headline 2): one generic test used three times on census_year would collide in dbt_check_id_lookup, keyed (model, column, test). Three thin tests over one macro keep Keith's 'one dbt generic test reused' (Q6) in substance. REJECTED reusing accepted_values and unique_combination_of_columns (Keith, Q6)."
      - "NAMED FOR THE SET, NOT FOR CENSUS (architect S4): the macro and tests are shared code, so they take member_setting and carry no census or geocoding word; the words a reader sees are declared with the check (REQ-DASH-299 criterion 1)."
      - "COUNTED AND SAMPLED BY DECLARATION (architect S4): v4 criterion 2 added the three test names to run_dbt.py's frozensets, which would have put collection-specific names in a shared runner. REPLACED by a DbtSpec declaration."
      - "dbt, NOT SODA, FOR THE YEAR CHECKS (Keith, Q6)."
      - "THE SET REACHES dbt AS A RELATION BUILT WITH THE PERIOD'S VIEWS, NOT AT STAGING (architect headline 3, then B2): staging runs before filing, when the period - and so the set in force - is not known (period_overlay's own docstring: 'WHY IT RUNS AFTER FILING, NOT AT STAGING'). v4's 'built where the run's views are built' read as the staging-time build. REJECTED --vars (re-parses every run), REJECTED the set written into the test's YAML (one set for every period), and REJECTED declaring the relation in reads_tables."
      - "NO PERIOD, NOT EVALUATED (architect B2): a held, unfiled or trial supply has no period, so its year checks are not run and say why. REJECTED evaluating against the newest set, which would judge a supply against a period it may never fill."
      - "A TOOL PER CHECK (architect S8): year checks dbt (Keith); share, identifier, allowed-values and format checks Soda, as Linkage Keys' are; drift Evidently; the schema datacontract-cli's from the contract as for every collection."
      - "RED ON ANY, ALL THREE YEAR CHECKS (Keith, Q7)."
      - "NOT GEOCODED IS A BANDED SHARE (Keith, road-testing #31 = a): amber above 5 percent, red above 10, of ROWS (PROPOSED), which equals the share of records because REQ-GEN-295 criterion 5 places or fails a record for all its years together - in every version of the set."
      - "THE SHARE IS ITS OWN GENERIC KIND (UX review Q1, MEASURES): built as invalid_percent it would read 'Invalid values', and a not-geocoded row is valid. A generic value-share kind (column, value) rather than a geocoding kind, so any collection may use it. UNIT AND DIRECTION RECORDED (UX QAC-297 c7), as REQ-QAC-333 decision 9 does for coverage."
      - "EXACT IDS ARE LINKAGE'S TWO CHECKS (architect D3, after REQ-QAC-333 decision 2's split): REPLACES v3's single exact-ids check. The gate is REQ-QAC-333 criterion 3's (architect M4), scoped per check block (REQ-QAC-294 criterion 5)."
      - "THE ORDINARY CHECK SET IS KEITH'S (Q14): exact ids, match_level allowed values, SA2/LGA format when geocoded and empty when not, match_level drift. REJECTED 'source_row_id never empty', a row-count band (Q8), drift on sa2_code and any address-text check."
      - "DRIFT OVER GEOCODED ROWS ONLY, BY A DECLARED EXCLUSION (PROPOSED v3; architect S7 twice): with 'not geocoded' a value, drift over all rows would fire whenever the share does - one fault, two alarms. The v4 delta found no value exclusion in the Evidently runner, so it is added generically (criterion 11). REJECTED a geocoding-only filter."
      - "NO DRIFT AT A WIDENING (delivery-scoper, v5, from REQ-GEN-295 criterion 5): adding a census year adds a row per record, but every record carries one match level in every year, so match_level's proportions do not move and a widening raises no drift alarm."
      - "VALUE COUNTS ON match_level ONLY (architect S9; UX Q3 and QAC-297 c9): the drift check needs them anyway, and the page's existing value bars read them (Keith, 2026-10-31, G3 a). REJECTED value counts on sa2_code or lga_code - a published distribution of where people live."
      - "AN EMPTY SUPPLY PASSES THESE CHECKS (Keith, Q8): REQ-QAC-340's coverage check fails it in this batch, so v3's 'KNOWN GAP until REQ-QAC-340' is closed rather than carried."
      - "A NULL CENSUS YEAR IS UNEXPECTED (PROPOSED v2, kept)."
    open_questions: []

  - id: REQ-GEN-298
    title: "The geocoding history carries each fault on purpose - missing, duplicate and unexpected census years, an amber and a red not-geocoded share, and REQ-QAC-340's five cross-collection routes - in ordinary supplies and in one named scenario for each, every drafted injection confirmed by a real-tool trial"
    date_written: "2026-10-25"
    story: "As Keith showing the checks to the participant who asked for them, I want each fault planted in ordinary supplies and once each in a named scenario I can find from the scenario map - a promoted Client Register changing colour when its quarter's geocodes are checked among them - so that each check can be seen going amber or red for its own reason on a real page."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-25 (Q10a presets and one named scenario per fault; Q11a the TS register; Q14 hosts and 2026 before 2026-Q3) and 2026-10-31 (G1 = b; Q7 a; architect Q3 a; Q10 b). Drafted by delivery-scoper 2026-10-25; refreshed 2026-10-31 (v4) against REQ-GEN-335 as built; v5 2026-10-31 with the architect's v4 delta (S2, the 298 c1 nit). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL provide five geocoding row faults in the geocoding stream, named as data as REQ-GEN-335's are (ExtraArrival.row_faults, 'name@<geocoding dataset id>', the dataset being the geocoding dataset a fault is applied to): drop one census year's rows for chosen records; duplicate one year's row for chosen records, identical in every column (generator/dirty.py's inject_duplicate_rows with no near-duplicate columns); add a row for a census year outside the set in force; and raise the not-geocoded share into the amber band or into the red band, its share computed by the stream itself against the share check's catalogue band (REQ-GEN-295 criterion 7), adding no lever set to generator/targeting.py (architect S2) - each seeded."
      - "WHEN an ordinary geocoding supply is drawn amber or red (REQ-GEN-295 criterion 13), THE SYSTEM SHALL apply the share faults for amber and one or more of the five for red, choosing the missing-year fault only in a period whose set in force holds two or more census years (from 2017-Q3, REQ-QAC-300), and SHALL confirm the verdict with the real tools (REQ-GEN-186)."
      - "THE SYSTEM SHALL plant five named scenarios, one per own-row fault, each the only fault in its supply with every other check of that supply green: missing-year and unexpected-year on Client Register Geocodes, the missing-year one in a quarter whose set holds two or more years; duplicate-year on ED Presentations Geocodes; and the amber share on ED Presentations Geocodes and the red share on Client Register Geocodes (share hosts PROPOSED)."
      - "THE SYSTEM SHALL plant a named scenario for each of REQ-QAC-340's five verdict routes, each the only fault in its supply (Keith, 2026-10-31, Q7 a; hosts PROPOSED): (1) coverage amber on ED Presentations Geocodes, 0.5 to 1.5 percent of records left out in every year; (2) coverage red on Client Register Geocodes, 3 to 6 percent left out; (3) an orphan on ED Presentations Geocodes, one record's rows naming a presentation the quarter does not hold; (4) an empty geo_cp_clients.csv for a quarter whose Client Register holds rows; and (5) the G1 route - a quarter whose Client Register supply, promoted green on the round before, reads with the amber tag promoted from the instant that quarter's Client Register Geocodes supply, amber on coverage, is promoted (REQ-PIPE-332 criterion 4's route, as TS-94 shows it for linkage), placed in a period whose amber setting promotes."
      - "WHEN an unexpected-year injection runs, THE SYSTEM SHALL use 2026, in a quarter before 2026-Q3 when 2026 joins the set (REQ-QAC-300), so that only the unexpected-year check catches it (Keith, Q14)."
      - "WHEN a share injection runs, THE SYSTEM SHALL turn whole records to 'not geocoded' in every census year, codes emptied, so that only the share check catches it; and WHEN a coverage injection runs, THE SYSTEM SHALL leave whole records out in every year, so that the missing-year check, which counts only records present in the table, does not catch it."
      - "IF a drafted injected supply, run through the real tools before anything is written (REQ-GEN-186's trial), moves the verdict of any check it is not aimed at, or cannot be placed, or would land on a round REQ-GEN-205's corrections alter, or in a quarter holding another scenario of its source dataset or of the linkage delivery, THEN generation SHALL refuse before writing anything, naming the injection and the check it moved, and SHALL NOT shift, drop or relax it (Keith, 2026-10-31, architect Q3 a)."
      - "THE SYSTEM SHALL name in the scenario map, without planting anything, the ordinary geocoding supply of each quarter whose source a source-side scenario keeps out of the period's warehouse when the geocoding is checked - TS-93a's rejected Client Register (2019-Q1), TS-100a's held one (2019-Q3) and TS-101's held ED supply (2021-Q4) - with what it shows: could-not-run red until the source is promoted and the knock-on clears it, and for TS-93a's quarter, where nothing ever replaces the source, could-not-run red and held back for the rest of the history, as TS-93b's linkage release already is."
      - "THE SYSTEM SHALL record each named scenario in plans/supply-model.md's TS register under the next free TS numbers when applied - TS-102 onward as of 2026-10-31, re-verified - and in the scenario map with its dataset, supply, period and as-at date (REQ-GEN-045)."
    non_functional_requirements:
      - "DETERMINISM: the same seed and configuration place the same injections in the same supplies."
      - "SYNTHETIC ONLY, AND SAID SO: the TS register and the scenario map are the list that says which red was on purpose."
      - "QUARTERS ARE SCARCE: about 55 quarters already hold ED's correction rounds (nine), linkage's sixteen scenarios (TS-86 to TS-101) and Child Protection's own, and v5 adds ten geocoding scenarios. Criterion 7 refuses rather than shifts, so the dry run is where a collision shows; anchors are chosen clear of every claim, as REQ-GEN-335 decision 14 did."
      - "TRIAL COST: criterion 7 runs the real tools over ten scenario supplies and the ordinary ambers and reds before writing - seconds each at a few thousand rows, but on every generation, so its time is reported with REQ-PIPE-296's measurement."
      - "BYTE-IDENTICAL NEIGHBOURS: no injection touches another collection's files or the linkage deliveries, except where a scenario needs a Child Protection supply shaped for it, said in its scenario entry (REQ-GEN-335 decision 13's precedent); route (5) needs none, its Client Register being an ordinary green one."
    dependencies:
      - REQ-GEN-295
      - REQ-QAC-297
      - REQ-QAC-300
      - REQ-QAC-340
      - REQ-GEN-184
      - REQ-GEN-186
      - REQ-GEN-045
    decisions:
      - "PRESETS AND NAMED SCENARIOS, BOTH (Keith, Q10a)."
      - "IN THE TS REGISTER (Keith, Q11a). RE-VERIFIED 2026-10-31 against plans/supply-model.md: TS-101 is the highest, so TS-102 is next free; numbers are assigned at application."
      - "SCENARIO HOSTS ARE KEITH'S FOR THE YEAR FAULTS (Q14): missing and unexpected on Client Register Geocodes, duplicate on ED Presentations Geocodes. The share and route hosts are the scoper's (PROPOSED), spread across both datasets so each page shows something."
      - "A SCENARIO FOR EVERY ROUTE, THE ORDINARY CHECKS ON PRESETS (Keith, 2026-10-31, Q7 a): REQ-GEN-335's one-scenario-per-verdict-route rule; allowed values, format, identifier and drift checks are seen through the presets only."
      - "THE G1 ROUTE BY AMBER, NOT BY A PERSON'S PROMOTION (delivery-scoper, v5, PROPOSED): an amber coverage promotes by rule wherever the amber setting promotes, so the route needs no scripted decision; linkage's TS-94 already shows the person-promotes-a-red route. Because Child Protection is at files_go_to_period 1, the colour change lands on the Client Register supply BEFORE the one on show (#289 J1), visible on its history row and badge - which REQ-DASH-299 criterion 15 proves in a real browser, J1 being accepted as built (Keith, 2026-10-31)."
      - "NAMED AS DATA, APPLIED BY THE PROVIDER (REQ-GEN-335 decision 10): nothing shared names geocoding. REJECTED a callable or a per-scenario branch."
      - "THE GUARD IS A REAL-TOOL TRIAL (Keith, 2026-10-31, architect Q3 a): v3 refused by overlap of reads_columns, which refused every share injection though a 'not geocoded' row with empty codes passes the allowed-values, format and drift checks; v4 replaced it with the targeting catalogue's rule-and-band judgement, which the v4 delta found does not evaluate row rules. REPLACED by REQ-GEN-186's trial over each drafted injected supply. REJECTED (b), a Python re-evaluation of each check's rule, a second implementation to drift."
      - "NO NEW LEVER SET (architect S2, replacing v4's D5 'generic value-share lever in targeting.py'): targeting.py allows one lever set per provider (its gate) and does not evaluate row rules; the share faults are computed in the stream. The duplicate is still dirty.inject_duplicate_rows, reused. REJECTED a geocoding-only injector for either."
      - "MISSING-YEAR NEEDS TWO YEARS IN FORCE (delivery-scoper, v5, after Q10 b): before 2017-Q3 the set is 2011 alone, and dropping a record's only year removes the record, which is coverage's fault, not missing-year's. So the missing-year preset and scenario are placed from 2017-Q3."
      - "RED PRESETS FOR THE YEAR CHECKS, AMBER AND RED FOR THE SHARE: the year checks are red on any (Keith, Q7)."
      - "EACH NAMED SCENARIO CARRIES ONE FAULT ALONE (v1, kept): hence whole records in criterion 6 and drift over geocoded rows only."
      - "2026, BEFORE 2026-Q3 (Keith, Q14). REJECTED a malformed year, which a type check would catch first. Still right under Q10 b: 2026 is in no version before 2026-08-01."
      - "THE SOURCE-SIDE SCENARIOS' GEOCODING IS NAMED, NOT PLANTED (delivery-scoper, v5, PROPOSED, from TS-93b's 'stays could-not-run, since its source never promotes', morning-reports #11): the ordinary geocoding in those quarters reads the same source the linkage release does, so it shows the same could-not-run and clears or not the same way; naming it says the red was on purpose. REJECTED a scripted person decision to clear TS-93a's geocoding, which would be a second planted scenario in a quarter criterion 7 reserves."
      - "NOT ON THE CORRECTED ROUNDS (v3, kept): they carry TS-57 to TS-61 and their riders."
    open_questions: []

  - id: REQ-DASH-299
    title: "The dashboard names the geocoding checks by what they find, heads every check's examples 'Examples: <what it measures> (key only)', shows a failing sample as record and year, shows the census years in force and the dataset geocoded in the page's strip, and keeps a left-out cross-collection check in its group"
    date_written: "2026-10-25"
    story: "As a data team leader glancing at a geocoding dataset, I want the three year checks to read as three different problems, a failing sample to say which record and which census year without pretending a missing year is a row, and the page to say which census years the period was held to and which dataset it geocodes, so that I can tell an incomplete geocode from a double-load without opening a tool's output."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-25 (Q12a the constructed sample, worded as such; Q5a the set in force per period) and 2026-10-31 (G3 a, G4 a, Q11 a, sample heading a site-wide, J3 a, J4 a; J1 accepted as built). Drafted by delivery-scoper 2026-10-25; refreshed 2026-10-31 (v4) with the 2026-10-29 UX and architect reviews; v5 2026-10-31 with the UX v4 delta (N1-N5, the G1 route, #289 D1/D2) and the architect's v4 delta (S8, B3's page half). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL let a check declare its own MEASURES phrase in its check file, read generically by the dashboard build ahead of pipeline/dashboard_check_labels.py's MEASURES for its kind (tests/test_check_measures.py accepting either), and SHALL declare on each geocoding dataset's checks 'Missing census years', 'Duplicated census years' and 'Unexpected census years' for the three year checks on census_year, shown in that order, and 'Rows not geocoded' for the share check on match_level (wording PROPOSED), so that no census or geocoding phrase is written into shared code."
      - "THE SYSTEM SHALL word the two shared cross-collection kinds generically as siblings, in MEASURES - soda:referential 'Rows matching no source record' and soda:coverage 'Source records matched' - for Linkage Keys' built checks and the geocoding checks alike (Keith, 2026-10-31, Q11 a), SHALL write the change up in plans/post-build-review.md as a change to built page wording, and SHALL update every test asserting the old phrases in the same change."
      - "THE SYSTEM SHALL head every check's failing-sample list 'Examples: <the check's MEASURES phrase> (key only)' - e.g. 'Examples: Duplicate values (key only)' - with today's count suffix (' — <shown> of <total>'), SHALL label its count stat '<the phrase>, <this run | latest result>' and the compared run's '<the phrase>, compared run' rather than 'Rows flagged, ...', and SHALL head the compare block 'Examples vs. the compared run' rather than 'Failing rows vs. the compared run', for every check of every collection whose phrase is declared - which, under tests/test_check_measures.py, is every committed check today (Keith, 2026-10-31, sample heading a; UX N1)."
      - "WHERE a check declares no phrase, so measure() falls back to 'Value', THE SYSTEM SHALL keep today's wording - 'Example failing rows (primary key only)', 'Rows flagged, ...' and 'Failing rows vs. the compared run' - unchanged (PROPOSED)."
      - "WHERE a result records violations and no failing sample, THE SYSTEM SHALL say 'No examples were recorded for this result.', for every check of every collection, replacing today's 'No failing-row sample available for this check - not every check type this pipeline runs supports per-row samples yet (see plans/qa-pipeline.md #15).' (UX N2, #291's failure mode); a result recording a percentage only and no row count SHALL show neither a heading nor that sentence."
      - "WHEN a missing-year failing sample is shown, THE SYSTEM SHALL show each failing pair as a constructed line, 'source record <identifier values> · <census year>: no row' (Keith's Q12a wording, 'row' read as 'record' - see open question 1), so that it never reads as a row that exists in the data."
      - "WHEN a duplicate-year or unexpected-year failing sample is shown, THE SYSTEM SHALL show each as its identifier values and census year - 'source record 4821 · 2021: 2 rows', 'source record 4821 · 2026' - adding '(in force from <period>)' to an unexpected year that a later version of the set adds, e.g. '(in force from 2026-Q3)' (UX Q2) (wording PROPOSED)."
      - "WHERE a sample key has several columns, THE SYSTEM SHALL show each sample's values in declared order separated by ' / ', each part escaped (escHtml) on its own before joining and a null part shown as '—' (REQ-PIPE-341 criterion 4; UX c2, architect B3)."
      - "WHILE a dataset's page is shown for a date and its checks' results recorded a version of a list setting (REQ-QAC-300 criterion 9), THE SYSTEM SHALL ALWAYS show a tile in its .sla-strip, keyed by that setting's display name from contract/presentation.yaml ('Census years' for geocoding), naming the years of the version the period's results RECORDED, never by re-resolving configuration (architect S6), with a sub-line '<year> added from <period>' only when that version is not the first (UX c6) (Keith, 2026-10-31, G4 a; sub-line wording PROPOSED)."
      - "WHILE a dataset's page is shown whose linked_datasets is a single entry with no code (REQ-QAC-294 criterion 2), THE SYSTEM SHALL show a tile in its .sla-strip keyed by that dataset's word for the relation from contract/presentation.yaml ('Geocodes' for geocoding), naming the source dataset in REQ-DASH-337 criterion 11's long form with a real link to the source's page at the same date on show, through the template's one long-form dataset link (datasetRefLink) (UX c9, N4)."
      - "THE SYSTEM SHALL show match_level's recorded value counts on its column as the existing value bars (StatsSpec.value_counts), as for any categorical column (Keith, 2026-10-31, G3 a)."
      - "THE SYSTEM SHALL draw a break on each year check's trend chart at each widening of the set, from the breaking changelog entries REQ-QAC-300 criterion 7 requires, as for any breaking definition change - three breaks, at 2017-Q3, 2022-Q3 and 2026-Q3."
      - "THE SYSTEM SHALL NOT show an area code, address text or any source attribute other than its identifier values in a geocoding dataset's samples, headings or tiles."
      - "THE SYSTEM SHALL apply, in the change that builds this requirement, amendments A1, A2 and A3 to REQ-DASH-337, recorded as FINAL TEXT in this requirement's decisions and each marked 'AMENDED <date applied> by REQ-DASH-299', once Keith has signed each wording, updating every test that asserts the wording they replace (tests/test_dashboard_e2e.py's not-supplied assertion, tests-js/not-in-agreement.test.js) in the same change (Keith, 2026-10-31, J3 a, J4 a)."
      - "WHEN the test suite runs, THE SYSTEM SHALL prove in a real browser against the built dashboard: the three year checks on census_year in order with their phrases; a missing-year sample worded 'no row' under 'Examples: Missing census years (key only)'; the unexpected-year scenario's '(in force from 2026-Q3)'; the census-years tile on a date in each of the set's four versions, its sub-line absent only in the first; the geocodes tile's link to the source page; match_level's value bars; an existing check of another collection headed 'Examples: <its phrase> (key only)'; the G1 route scenario's older Client Register supply showing its amber tag naming Linkage Products' <period> Client Register Geocodes as the cause on its history row from the geocoding promotion's date and not before (UX delta, the G1 browser proof); ED Presentations' own page showing the coverage verdict about its own supply (#289 D1); the coverage card's run comparison reading a drop as worse (#289 D2); a left-out geocoding check as a quiet row inside its collection group (A1, A2); and the agency page's 'Across collections' sub-heading (A3)."
      - "WHEN the JS suite runs, THE SYSTEM SHALL prove, seen failing first, that a check declaring no phrase keeps 'Example failing rows (primary key only)', in place of v4's browser assertion of an unchanged no-phrase page, which could not fail because no committed check lacks a phrase (UX N3)."
    non_functional_requirements:
      - "ASSERT AT THE LAYER A HUMAN SEES (CLAUDE.md): criterion 15, in a real browser; criterion 16 in Vitest because no real page can reach that branch."
      - "NOTHING CODED FOR GEOCODING: the heading, the composite sample, the setting tile (from any recorded list-setting version) and the relation tile (from any single code-less linked dataset) are generic, their words in configuration, under REQ-DASH-337 criterion 15's no-name rule."
      - "SITE-WIDE CHANGE TO BUILT BEHAVIOUR, SAID PLAINLY: criteria 2, 3 and 5 change every check page of every collection, Birth Registrations included, and are written up in plans/post-build-review.md in the building change, with a CHANGELOG.yaml release note saying so."
      - "POLISH BAR: the three year checks read as siblings, same wording shape; the two cross-collection kinds read as siblings (Keith's Apple-level bar)."
      - "A BUILD READS RECORDED QA RESULTS AND CONFIGURATION ONLY."
      - "RENDER BUDGET: page size and tests/test_dashboard_e2e.py's duration measured before and after; growth beyond about 10 percent reported to Keith."
    dependencies:
      - REQ-QAC-297
      - REQ-QAC-300
      - REQ-PIPE-296
      - REQ-PIPE-341
      - REQ-DASH-337
      - REQ-DASH-228
      - REQ-GEN-298
    decisions:
      - "A CONSTRUCTED PAIR, WORDED AS SUCH (Keith, Q12a): a missing year has no row, so its sample is a pair the check builds."
      - "'source record', NOT 'source row' (delivery-scoper, v4, PROPOSED; still unanswered, open question 1): with GA1 (a) a geocode is per distinct identifier set, and a heading written to avoid 'rows' should not have its lines call the thing that exists a row."
      - "THE HEADING IS 'Examples: <phrase> (key only)', SITE-WIDE (Keith, 2026-10-31, sample heading a; UX N1). REJECTED the architect's per-kind declared heading defaulting to today's (architect Q2 (b)). The count stat and compare heading follow it (PROPOSED), because 'Rows flagged' and 'Failing rows' are what make an absent pair read as a row."
      - "NO PHRASE, TODAY'S TEXT (delivery-scoper, v5, PROPOSED, as Keith asked the scoper to state): measure()'s fallback is 'Value', and 'Examples: Value (key only)' says nothing. Under tests/test_check_measures.py no committed check reaches this branch; a new kind added without a phrase would, and today's wording is the honest default for it."
      - "THE FINE PRINT IS NOT CHANGED (delivery-scoper, v5, PROPOSED): sampleFinePrint says how the tool chose its sample ('Soda returns up to 100 of the failing rows...'), and for every check, the year checks included, each example IS a row of the tool's own output. Keith may extend criterion 3 to it at sign-off."
      - "'No examples were recorded for this result' (UX N2): today's sentence guesses a reason and points readers at a plans file; #291 showed a check that does sample recording none, where the guess was wrong."
      - "PHRASES ON THE CHECK, NOT IN SHARED CODE (architect S4, S8): 'Missing census years' in MEASURES would put a census word in a shared module keyed by a generic kind. REJECTED generic phrases for the set-member kinds ('Missing set members'), which fail the polish bar."
      - "THE Q11 WORDING IS A CHANGE OF BUILT BEHAVIOUR, NOT AN AMENDMENT (delivery-scoper, v5, from the register): no signed criterion quotes 'Links to records that are not there' or 'Records linked' - they were added to MEASURES by post-build-review #290 D2 - and no test asserts them (grep, 2026-10-31). So Keith signs criterion 2 rather than an amended criterion; 'matched', not 'covered' (UX delta)."
      - "THE SET ON THE PAGE, NO ADVANCE WARNING (Keith, Q5a)."
      - "FROM THE RECORDED VERSION (architect S6): the page shows what a result was judged against, so a later configuration edit cannot rewrite what an old page says."
      - "AN ALWAYS-PRESENT TILE (Keith, 2026-10-31, G4 a): REJECTED a tile only after a widening, and REJECTED v1's completeness-by-key panel. Its words come from contract/presentation.yaml, so the tile is generic."
      - "THE GEOCODES TILE, LONG FORM (UX N4): keyed 'Geocodes', the source named and linked through datasetRefLink. IN ADDITION TO REQ-DASH-337's GROUP (v4): the group is collapsed and absent on a date with no result; the tile always says what the dataset geocodes."
      - "THE CLIENT REGISTER PAGE NEEDS NOTHING NEW (G1 = b; UX delta: 'G2 drop is right'): crossTableGridRows' group heading already links every dataset in the Linkage Products group."
      - "J1 IS ACCEPTED AS BUILT FOR GEOCODING (Keith, 2026-10-31): at Child Protection files_go_to_period 1 a geocoding verdict for P lands on the Client Register supply BEFORE the one on show, so the headline never moves; the change shows on the older supply's history row and badge. REJECTED (a), (b) a quiet notice (the UX recommendation) and (c) moving the timing; Keith wants a PERIOD VIEW instead (plans/running-thoughts.md #131), scoped as its own requirement alongside this build. Geocoding does not wait for it."
      - "#289 D1 AND D2 ARE DEPENDENCIES, CARRIED AS REQ-DASH-337 (UX delta): both were fixed under REQ-DASH-337 (TestCrossCollectionReviewFixes, its evidence 2026-10-31); a plans item cannot be a dependency, so criterion 15 re-proves both on the geocoding pages rather than trusting the linkage proof."
      - "J3 AND J4 ARE DECIDED ONCE FOR LINKAGE AND GEOCODING (UX N5; Keith, 2026-10-31): both are generic, so amending REQ-DASH-337 covers geocoding with no criterion of its own."
      - "VALUE BARS, NOT A HISTOGRAM (Keith, 2026-10-31, G3 a): four categories are a value-count distribution; REQ-DASH-337 criterion 14's histogram is for binned numbers."
      - "CRITERIA 6 AND 7's WORDING IS THE SCOPER'S EXTENSION of Keith's missing-year example."
      - "AMENDMENT A1, FINAL TEXT PROPOSED - REQ-DASH-337 criterion 6 (Keith, 2026-10-31, J3 a; WORDING NOT YET SIGNED). CURRENT, as signed 2026-10-30: <<<WHERE a dataset page shows cross-table checks involving another collection - declared on it or reading it - THE SYSTEM SHALL group those checks by that other collection, the groups in hierarchy order, and SHALL show the checks involving only the page's own collection first and ungrouped, exactly as today; WHERE a page has no check involving another collection, it SHALL show no group heading and render as before.>>> PROPOSED: the same text, followed by: <<<A check involving another collection that a run left out of scope for the period - for any left_out reason code - SHALL stay in its collection group as a quiet row worded under criterion 12, counted in the group heading as not checked and never toward its worst status, so that a group keeps its shape from period to period; a left-out check involving only the page's own collection stays where it is shown today. AMENDED <date applied> by REQ-DASH-299.>>> (SUBSTANTIVE: today left-out checks sit in a separate 'Not run for this supply' block outside the groups; the not-checked count in the heading, and applying it to every reason code rather than only not-supplied, are the scoper's reading, PROPOSED.)"
      - "AMENDMENT A2, FINAL TEXT PROPOSED - REQ-DASH-337 criterion 12 (Keith, 2026-10-31, J3 a; WORDING NOT YET SIGNED). CURRENT, as signed: <<<THE SYSTEM SHALL word each left_out entry from its structured reason code (REQ-PIPE-332 criterion 10) - 'Not part of the agreement for <period>' for not_in_agreement 'Not supplied for <period>, by decision' for not_supplied_by_decision and 'Not checked: <dataset> was on the <calendar> calendar for <period>' for calendar_differs - and SHALL NOT word any entry by matching its reason text.>>> PROPOSED: the same, with 'Not supplied for <period>, by decision' replaced by 'Not checked: <dataset> not supplied for <period>', <dataset> being the hierarchy name of the dataset whose supply a person marked not supplied - e.g. 'Not checked: Client Register not supplied for 2024-Q2' (Keith's example) - and the line 'AMENDED <date applied> by REQ-DASH-299.' (The short name rather than the long form, because the row sits inside that dataset's collection group, whose heading names the collection; PROPOSED. The recorded reason REQ-PIPE-332 criterion 7 writes is unchanged.)"
      - "AMENDMENT A3, FINAL TEXT PROPOSED - a new REQ-DASH-337 criterion 17 (Keith, 2026-10-31, J4 a; WORDING NOT YET SIGNED). There is no current text: no signed criterion covers the agency page's collection panel, whose blurb (the template's collectionCrossTableSection) calls every cross-table check one 'between two tables in this collection'. PROPOSED: <<<WHERE a collection's panel on the agency page lists a cross-table check that reads a dataset of another collection, THE SYSTEM SHALL list it after the collection's own cross-table checks under an 'Across collections' sub-heading, naming each other collection's dataset it reads in criterion 11's long form without the period - e.g. Child Protection's Client Register - and SHALL NOT describe it as between two tables in this collection; WHERE a collection has no such check, its panel SHALL render as before. AMENDED <date applied> by REQ-DASH-299.>>> Criterion 16's browser list is not amended; the sub-heading is proven by this requirement's criterion 15. (The sub-heading's own blurb, e.g. 'Checks that read a table of another collection; a failure counts against every table the check reads.', is PROPOSED wording.)"
    open_questions:
      - "1. 'source record' or Keith's own 'source row' in the constructed sample lines (criteria 6 and 7) - carried from v4, where it was put to Keith for sign-off, and not among his 2026-10-31 answers. Recommended: 'source record'."

  - id: REQ-QAC-300
    title: "The census years every geocoding dataset owes are declared once for the collection as an effective-dated, frozen-past list setting by the existing setting mechanism - 2011 alone from 2013, 2016 added from 2017-Q3, 2021 from 2022-Q3 and 2026 from 2026-Q3 - and each supply is judged against the set in force for its period"
    date_written: "2026-10-25"
    story: "As an agency's accountable data owner, I want the expected census years to widen on dates we declare, as a real geocoder's deliveries would, with earlier supplies judged against the earlier set, so that the day a new census is processed does not turn every historical geocode red for a reason that is not a data-quality failure."
    moscow: should
    status: not_started
    source: "Keith, plans/road-testing.md #12 (the set grows on a five-year cadence) and 2026-10-25 (Q4, Q5a, Q14) and 2026-10-31 (Q10 b: four versions, each adding a year). Drafted by delivery-scoper 2026-10-25; refreshed 2026-10-31 (v4); v5 2026-10-31 with Q10 b and the architect's v4 delta (S6). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL declare the census years once, on the linkage-products collection in contract/data-asset.yaml, as a LIST-VALUED setting under its own key, read by the same functions that read amber_setting and replacement_setting (qa_tools/common/amber_setting.py - effective-dated versions with changelogs, nearest level wins, frozen past) by the year checks, the generator and the page alike, with no second implementation of 'which version is in force' and no new module named census (qa_tools/common/census.py is the decision-log census)."
      - "THE SYSTEM SHALL generalise that mechanism to a list value without changing any existing setting's resolution: a resolved value SHALL carry a list as a list, not its str() (today's _resolve_on returns str(version['value'])); a public resolver SHALL resolve on a DATE as well as an instant; timeline() SHALL take the setting key; the configuration schema SHALL accept a list of years for this key only, where declared list-valued; and the module docstring SHALL say so (architect S6)."
      - "THE SYSTEM SHALL state four versions, each adding one year to the one before it (Keith, 2026-10-31, Q10 b): [2011] effective 2013-01-01, on or before the first period any geocoding dataset owes; [2011, 2016] effective 2017-08-01 (2017-Q3, PROVISIONAL - open question 1); [2011, 2016, 2021] effective 2022-08-01 (2022-Q3, PROVISIONAL - open question 1); and [2011, 2016, 2021, 2026] effective 2026-08-01 (2026-Q3, Keith Q14) - with geocoding supplies on both sides of each."
      - "WHEN a supply is checked, THE SYSTEM SHALL judge it against the version in force on its period's own date - not its receipt or a decision's instant, which amber_setting resolves on - through that one resolution."
      - "IF no version covers a period a geocoding dataset owes, THEN `mothman check` SHALL refuse the configuration, naming the dataset and the period, and SHALL NOT use the nearest version."
      - "THE SYSTEM SHALL write each version's changelog entry saying which year it adds and why that quarter - the first round after the ABS's first release of that census's data (PROPOSED)."
      - "WHEN a version adds a census year, THE SYSTEM SHALL require a breaking changelog entry, dated the version's effective_from, on each year check whose set it changes, saying that supplies before that date are still judged against the earlier set (UX QAC-300 c6) - three entries per year check for the four versions; and IF one is missing, THEN `mothman check` SHALL fail, naming the check and the version - the set being no part of a check's definition fingerprint, which no other gate would notice (architect S5)."
      - "IF a version whose effective_from has passed is altered or removed, or one of its changelog entries changed, THEN `mothman check` SHALL refuse it; and a new version dated before the day it is added SHALL be refused except on an asset declared synthetic - amber_setting's own frozen-past guard (past_change_problems), not a copy (architect S4)."
      - "THE SYSTEM SHALL record, with each result of the three year checks, the effective_from of the version it was judged against and the years it held."
    non_functional_requirements:
      - "ONE RESOLUTION: one mechanism for every effective-dated setting, so census years, amber and replacement cannot drift (amber_setting.py's reason for being reused, REQ-PIPE-123); criterion 2 is shown to change no existing setting's resolution by the existing amber and replacement tests passing unchanged."
      - "AUDITABILITY: every recorded result names its version (criterion 9), so 'why was this red' is answerable after the set has moved."
      - "SCALE: one declaration for the collection, so dozens of geocoding datasets cannot disagree; a dataset-level override comes with the mechanism and is not used. Four versions today, one more every five years."
      - "CONFIGURATION, NOT STATE: authored, reviewed and versioned in git."
      - "REAL-DEPLOYMENT FIT: a real geocoder's editions are an agreement with that geocoder, so in production each version is a reviewed configuration change dated when the geocoder began delivering the year, never derived from ABS release dates by code."
    dependencies:
      - REQ-QAC-294
      - REQ-PIPE-123
    decisions:
      - "IN THIS BATCH (Keith, Q4)."
      - "FOUR VERSIONS, EACH ADDING A YEAR, AS A REAL GEOCODER WOULD DELIVER (Keith, 2026-10-31, Q10 b): 2011 alone from 2013; 2016 added about 2017-Q3; 2021 added about 2022-Q3; 2026 added from 2026-Q3. SUPERSEDES Q4's '2016 and 2021' and v4's first version of both from 2013, which no real 2013 geocode could carry. REJECTED (a), keeping 2016 and 2021 from 2013."
      - "THE 2016 AND 2021 QUARTERS ARE PROVISIONAL (delivery-scoper, v5): proposed 2017-Q3 and 2022-Q3 - the first round (1 August) after the ABS's first release of each census's data, late June 2017 and late June 2022 by the scoper's knowledge (not checked against abs.gov.au in this session), which is when a geocoder could first deliver codes against the new census's areas with counts behind them. The alternative is the round after each ASGS edition's boundaries were published (July 2016, July 2021), 2016-Q3 and 2021-Q3. Open question 1."
      - "2026 FROM 2026-Q3 (Keith, Q14, restated in Q10 b). REJECTED v2's 2026-Q1. Said plainly because it does not follow the rule the other three versions follow: census night was August 2026 and its first release would be mid-2027, so by 'first round after first release' 2026 would join about 2027-Q3, after today's history ends. Keith set 2026-Q3 twice, so it stands; flagged, not re-asked."
      - "NO ADVANCE WARNING (Keith, Q5a)."
      - "THE SET GROWS, A CERTAINTY (Keith, 2026-09-24): ABS runs a census every five years."
      - "DECLARED, DATED, NEITHER READING ALONE (road-testing #12): 'every census year that exists' turns the table red the day a census is processed; 'every year it was geocoded against' hides a backfill that never happened. REJECTED deriving the set from the data."
      - "VERSIONED, NOT ONE EDITED LIST: a bootstrap replays every historical supply against today's check files, so one edited list would re-judge the whole history."
      - "THE EXISTING SETTING MECHANISM, GENERALISED TO A LIST (architect D1, S3, then S6): v3's 'one shared resolution function' would have been a third copy of amber_setting.py's machinery. The v4 delta found the places the generalisation must touch (str() of the value, a date resolver, timeline's key, the schema, the docstring), now criterion 2. REJECTED a new module, and REJECTED naming one census.py."
      - "RESOLVED ON THE PERIOD'S OWN DATE (as REQ-PIPE-320 resolves an offset): this question is what a period owed, so the caller passes the period's date."
      - "THE FREEZE IS AMBER_SETTING'S (architect S4): only a NEW version dated in the past is allowed, and only on a synthetic asset. All four versions are such when added on or after 2026-10-31."
      - "ONLY ADDING IS NOT GATED (delivery-scoper, v5, PROPOSED): Keith's versions each add a year, but a real deployment may one day retire an old edition, so no gate refuses a version that drops a year; the breaking-entry gate (criterion 7) still fires on any change to the set."
      - "ONCE FOR THE COLLECTION, NOT PER DATASET (Keith, Q14)."
      - "A BREAKING ENTRY IS GATED, NOT REMEMBERED (architect S5): the trend-chart break and the changelog breaking flag exist (check_lifecycle.py), but nothing ties them to a setting outside the check's own text."
      - "WHAT FOUR VERSIONS CHANGE ELSEWHERE (delivery-scoper, v5, re-checked): volume (REQ-GEN-295's volume NFR, up to 10,000 rows a delivery); the missing-year fault needs two years in force (REQ-GEN-298 criteria 2 and 3); the unexpected-year scenario's 2026 is still in no version before 2026-08-01 (REQ-GEN-298 criterion 5); the always-present tile and its proof on each version (REQ-DASH-299 criteria 9 and 15); three trend-chart breaks (REQ-DASH-299 criterion 12); no drift at a widening (REQ-QAC-297)."
    open_questions:
      - "1. The 2016 and 2021 additions' quarters. Recommended (PROVISIONAL): 2017-Q3 (effective 2017-08-01) and 2022-Q3 (2022-08-01), the first round after the ABS's first release of each census's data. Alternative: 2016-Q3 and 2021-Q3, the round after each ASGS edition's boundaries were published - earlier, but before any census counts existed for those areas."

  - id: REQ-QAC-340
    title: "Each geocoding dataset is checked against its source supply for the period - an orphan check and a coverage check, amber below 100 percent and red below 98, that fails when source records have no geocoding row at all - on Linkage Keys' referential and coverage pattern, generic, its verdicts counting against the source supply as linkage's do"
    date_written: "2026-10-25"
    story: "As a data team leader, I want each period's geocoding checked against the source supply it was built from, with the result showing on the source's own page and counting there, so that a source record left out entirely, an empty geocoding file, or geocodes for records that do not exist are found rather than reading green."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-25 (Q1b cross-collection checks definitely needed; Q7 amber kept for these checks; Q8 they close the empty-supply gap; Q14 re-scoped once REQ-PIPE-331 is built) and 2026-10-31 (G1 = b; N1 a; Q11 a; J1 accepted as built). Placeholder 2026-10-25; RE-SCOPED by delivery-scoper 2026-10-31 (v4); v5 2026-10-31 with the UX v4 delta (attribution, #289 D1/D2) and the architect's B1. A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL define, for each geocoding dataset, as Soda checks in its own table's 'checks for' block, one ORPHAN check, red on one geocoding row whose identifier values match no record of the source dataset's supply in the period, and one COVERAGE check, the percentage of the source supply's rows whose identifier values have at least one geocoding row in ANY census year (architect S10) - each declaring reads_tables for the source dataset's table, of REQ-QAC-333 criterion 2's two check kinds (referential, coverage), carrying the same attributes (linked_dataset, linked_check, id_columns)."
      - "THE SYSTEM SHALL band the coverage check amber below 100 percent and red below 98 percent (Keith, 2026-10-31, N1 a), recorded as a percentage with its unit and its direction ('below') and no failing rows; and SHALL record the orphan check's failing rows as identifier values (REQ-PIPE-341)."
      - "THE SYSTEM SHALL compare identifiers under REQ-QAC-294 criterion 2's mapping, both sides cast to text (post-build-review #288 D1); and IF a check file states an identifier column or count that disagrees with that mapping, or a geocoding dataset lacks either check, THEN `mothman check` SHALL fail, naming the check and the dataset - REQ-QAC-333 criteria 3 and 8's gate, scoped to each declaring dataset's own check block (REQ-QAC-294 criterion 5), not copied."
      - "WHEN a geocoding supply holds no rows and the period's source supply holds some, THE SYSTEM SHALL fail the coverage check at 0 percent, closing REQ-QAC-297's empty-supply gap."
      - "THE SYSTEM SHALL count each EVALUATED result of these checks toward every supply it read - the geocoding supply and the source dataset's supply - under REQ-PIPE-269 criterion 4, exactly as REQ-PIPE-332 criterion 1 counts a linkage check's, with no new mechanism and no amendment to either (Keith, 2026-10-31, G1 = b)."
      - "THE SYSTEM SHALL count a result recorded NOT EVALUATED for want of the source table only toward the geocoding supply (REQ-PIPE-332 criterion 2's rule), so that a source not yet in the warehouse never colours the source."
      - "WHEN a geocoding supply is promoted, THE SYSTEM SHALL from that instant count its evaluated verdicts toward the source supply each read, and WHERE that leaves a promoted source supply red or amber, THE SYSTEM SHALL show it red promoted (REQ-DASH-126) or with the amber tag (REQ-DASH-337 criterion 9), naming the geocoding dataset in REQ-DASH-337 criterion 11's long form as the cause, and SHALL NOT demote it; WHILE the date on show is before that promotion, the source supply SHALL show as it did (REQ-PIPE-332 criteria 4 and 5)."
      - "WHERE a source supply moves into or out of the period after the geocoding supply was checked, THE SYSTEM SHALL re-evaluate these checks through REQ-PIPE-331 criterion 5's knock-on with Linkage Products' adapter; and WHERE a person has marked the source not supplied for the period, THE SYSTEM SHALL leave both checks out of scope there (REQ-PIPE-332 criterion 7), shown under REQ-DASH-337 criteria 6 and 12 as amended by A1 and A2."
      - "WHEN the dashboard is built, THE SYSTEM SHALL show these checks on the source dataset's page in a Linkage Products group and on the geocoding page in the source's collection group, each with its link, and on the agency page under 'Across collections' (A3), as REQ-DASH-337 already does for any cross-collection check, with no geocoding-specific page code - ED Presentations' own page showing the verdict about its own supply (#289 D1) and the coverage comparison reading by its recorded direction (#289 D2)."
      - "THE SYSTEM SHALL write each orphan and coverage check's failure_indicates naming the likely causes on both sides - the geocoding product (a record left out or misidentified by the geocoder) and the source supply (a record added, removed or re-identified since the geocoder was sent it, or a null or blank identifier) - with names, descriptions and technical notes to docs/check-authoring-rules.md as it stands, the source named by the same two names the page shows (UX delta, attribution)."
      - "THE SYSTEM SHALL extend REQ-TEST-339's thirty-dataset test so that fake geocoding datasets - one with two identifier columns and one with three - each with its orphan and coverage checks in its own check block, are checked end to end in the same copy of the repository, with no product file outside configuration, check files, adapters and providers changed."
    non_functional_requirements:
      - "PRIVACY: the first join of a geocoding table to the records it was built from. The orphan check's failing rows carry identifier values only, the coverage check a percentage only (REQ-QAC-333 decision 7's precedent); neither records an area code."
      - "SCALE: two checks per geocoding dataset, each one join against one source table; a supply moving in one source re-runs only the two checks reading it (REQ-TEST-339's assertion)."
      - "NOTHING NEW IN THE PIPELINE: reads, resolution, counting, out-of-scope, knock-on and display are REQ-PIPE-331, REQ-PIPE-332 and REQ-DASH-337's, all generic; if building this needs a change to any of them, that is a defect in them, raised separately."
      - "SCALE OF COLOUR AT 30 COLLECTIONS, SAID PLAINLY BECAUSE KEITH CHOSE IT: with amber below 100 percent, any one source record missing from a geocode turns the promoted source supply amber when the geocoding is promoted; at dozens of geocoded sources that is dozens of datasets one bad geocoder run can colour. What limits it is REQ-PIPE-332's: a red geocoding supply is held back and counts toward nothing until a person promotes it."
    dependencies:
      - REQ-PIPE-331
      - REQ-PIPE-332
      - REQ-QAC-333
      - REQ-DASH-337
      - REQ-TEST-339
      - REQ-QAC-294
      - REQ-QAC-297
      - REQ-PIPE-341
      - REQ-DASH-299
    decisions:
      - "IN THIS BATCH NOW REQ-PIPE-331 IS BUILT (Keith, Q14, 're-scoped once 331 is built'): REPLACES the 2026-10-25 placeholder. MoSCoW raised from could to should to match the batch (PROPOSED)."
      - "COUNTS AGAINST THE SOURCE SUPPLY, AS LINKAGE DOES (Keith, 2026-10-31, G1 = b): a promoted Client Register supply may read amber or red promoted from the instant its period's geocoding supply is promoted - at Child Protection's files_go_to_period 1 about three months after its own promotion. REJECTED (a), counting only toward the geocoding supply with an information line on the source page - the scoper's and UX review's recommendation - which would have needed the only exception REQ-PIPE-269 criterion 4 has."
      - "THE CLIENT REGISTER HEADLINE NEVER MOVES (UX delta HIGH, said plainly; Keith, 2026-10-31, J1): Child Protection's next supply lands on the round the geocoding for P arrives, so the verdict always lands on the supply BEFORE the one on show; the change shows on that supply's history row and badge only. ED, at offset 0, is the supply on show. ACCEPTED AS BUILT; the period view (plans/running-thoughts.md #131) is Keith's answer and is scoped separately."
      - "BANDS 100 AND 98 (Keith, 2026-10-31, N1 a): stricter than linkage's 90 and 85, because a geocoder is sent every record and should return a row for each, where a linkage unit legitimately links only some. In the ordinary synthetic history coverage is exactly 100 percent: neither source writes a null or blank identifier, and REQ-GEN-295 writes every distinct identifier set."
      - "WHAT G1 = b MEANS FOR AN EMPTY GEOCODING FILE (delivery-scoper, v4): criterion 4's 0 percent coverage is red, so the supply is held back (REQ-PIPE-266 criterion 9); only if a person promotes it (REQ-PIPE-332 criterion 8) does that red count against the promoted source supply."
      - "LINKAGE KEYS' PAIR, GENERIC (architect D6): the same two check kinds, attributes and gate as REQ-QAC-333's. REJECTED geocoding-only check kinds or a second gate. Their phrases are reworded generically for both (Keith, 2026-10-31, Q11 a; REQ-DASH-299 criterion 2): 'Rows matching no source record', 'Source records matched'. REJECTED keeping linkage's 'Links to records that are not there' and 'Records linked' for both."
      - "IN ITS OWN CHECK BLOCK (architect B1): without REQ-QAC-294 criterion 5's block scoping, these checks would have counted toward linkage's referential-and-coverage pair and could have masked a deleted linkage check."
      - "COVERAGE IS 'NO ROW IN ANY YEAR' (architect S10): a record present for one year and missing another is REQ-QAC-297's missing-year check's; counting it here too would raise two alarms for one fault. REJECTED v3's 'no geocoding row for some census year in force'."
      - "A PERCENTAGE OF SOURCE ROWS, AS LINKAGE's IS: so a source row with a null or blank identifier counts as not covered - a source fault which, under G1 = b, also counts against the source, and which criterion 10's failure_indicates names."
      - "AMBER IS KEPT FOR THESE CHECKS (Keith, Q7): coverage has an amber band; the orphan check is red on one, as linkage's referential is (L7)."
      - "BOTH SIDES CAST TO TEXT (post-build-review #288 D1): the loader infers types from the file, so an all-digit identifier stages as a number."
      - "DECLARED ON THE GEOCODING TABLE, NONE ON THE SOURCE (REQ-QAC-333 decision 12): a check declared on cp_clients reading the geocoding table would read red, not yet due, for three months of every period."
      - "ATTRIBUTION ON BOTH SIDES (UX delta, PARTLY): v4 asked it of REQ-QAC-297 only; these are the checks most likely to be the source's fault, hence criterion 10."
    open_questions: []

  - id: REQ-PIPE-341
    title: "A failing-row sample may name a row by several columns - each table's sample key an ordered list - so a sample can say which record and which census year, and Linkage Keys' referential sample, recorded empty today, names its dataset and identifiers"
    date_written: "2026-10-31"
    story: "As whoever maintains the pipeline, I want a failing sample to carry every column that identifies a row, not one, so that a check on a table keyed by several columns - a geocoding table's identifiers and census year, a linkage row's dataset and identifiers - records something a person can look up."
    moscow: should
    status: not_started
    source: "Architect review 2026-10-29, D4 ('composite sample key: one shape change, owned by linkage'), which linkage did not build; post-build-review #291 (Keith, 2026-10-31, b: fixed here, REQ-QAC-333 criterion 6 unmet until then). Drafted by delivery-scoper 2026-10-31 (v4); v5 the same day with the architect's v4 delta (B3, the datacontract-cli nit). A PROPOSAL, not signed."
    acceptance_criteria:
      - "THE SYSTEM SHALL let a collection adapter declare each table's failing-sample key as an ordered list of columns, a single column remaining a list of one, so that every existing collection's declaration and recorded samples are unchanged."
      - "THE SYSTEM SHALL have every tool's sample extraction - Soda's failing_sample_keys, dbt's failing_sample_keys_direct and failing_sample_keys_via_values, datacontract-cli's failing_sample_keys - record, for a several-column key, each sample as an ordered list of that row's values of every key column and only those, a null value kept as null, ordered and limited as today, and for a one-column key the bare value exactly as today; datacontract-cli's sample columns PROVEN BY EXPERIMENT against the installed version before this criterion is called met (architect B3, nit)."
      - "THE SYSTEM SHALL declare Linkage Keys' sample key as dataset and id_1 to id_N, and each geocoding table's as id_1 to id_N and census_year."
      - "THE SYSTEM SHALL have the results writer, the results reader and the dashboard build carry a several-column sample unchanged to the page; and the page SHALL render each part escaped and joined in declared order (REQ-DASH-299 criterion 8), SHALL compare a run's samples with the compared run's BY VALUE - today's Set of the samples compares arrays by reference, so every several-column sample would read 'new' - and SHALL escape every sample it shows, a one-column one included (today's sample and compare pills interpolate the key unescaped) (architect B3)."
      - "IF a Soda failed-rows query on a table does not select every column of that table's sample key, THEN `mothman check` SHALL fail, naming the check and the missing columns; and THE SYSTEM SHALL amend Linkage Keys' referential, expected-identifiers and no-surplus-identifiers queries to select dataset and id_1 to id_N - the last two select dataset and linkage_key today and would otherwise record nothing under the new key (architect B3)."
      - "WHEN a several-column sample is recorded, THE SYSTEM SHALL NOT record any column outside the declared key (plans/qa-pipeline.md #15)."
      - "WHEN the change that builds this is made, THE SYSTEM SHALL show by REQ-TEST-239's before-and-after compare of a from-empty bootstrap that no recorded sample of Birth Registrations, Child Protection or Emergency Department changed, SHALL list what changed for Linkage Keys, and SHALL show that the three failing linkage referential results post-build-review #291 found recorded empty (linkage_keys__201808011730000800 for ed-presentations, linkage_keys__202205011730000800 and linkage_keys__202211011730000800 for cp-clients, or their counterparts in the new bootstrap) now record their failing rows as dataset code and identifier values - which MEETS REQ-QAC-333 criterion 6, whose unmet_criteria entry SHALL be removed in that change, its evidence citing this compare (Keith, 2026-10-31, #291 b)."
    non_functional_requirements:
      - "ENUMERATE EVERY CONSUMER (CLAUDE.md's shape-change rule): every reader of failing_sample_keys is found by grep and listed in this requirement's evidence before it is called done - the template's sample block, its compare block and their pills among them - the last transform, the page, asserted in a real browser."
      - "PRIVACY: a wider key is still key columns only; no area code is a key column, so architect S9's rule holds. Keith read and kept failing rows for the referential check (REQ-QAC-333's 'REFERENTIAL KEEPS FAILING ROWS')."
      - "NOTHING CODED FOR ONE COLLECTION: the list shape, the gate and the by-value compare are generic."
      - "ORDER WITHIN THE BATCH (delivery-scoper, PROPOSED): #291 leaves a signed, built criterion unmet, and this requirement depends on nothing else here, so it is the natural first build."
    dependencies:
      - REQ-QAC-333
      - REQ-TEST-239
    decisions:
      - "ITS OWN REQUIREMENT, NOT A CRITERION OF REQ-PIPE-296 (delivery-scoper, v4): a shape change through four tools' samplers, the writer, the reader and the page, needed by three requirements of this batch and one already built - small and self-contained, as Keith asks."
      - "FIXES #291 HERE, NOT AS A SEPARATE DEFECT FIRST (Keith, 2026-10-31, #291 b; the architect's Q1 recommended building this first on its own, which Keith had already settled by folding it in). CONFIRMED against lp_boot4's recorded results (post-build-review #291): all three failing referential results recorded failing_sample_keys [] with row_count_invalid 1 each, because the queries select dataset and id_1 while the Soda sampler keeps only the adapter's one key column, linkage_key."
      - "A LIST OF ORDERED VALUE LISTS (architect B3): each sample is one list, in declared order. REJECTED a joined string (the page joins with ' / '; storing the parts keeps the separator a display choice and an identifier containing it unambiguous), and REJECTED dropping a null part, which would shift every later part one column left."
      - "A ONE-COLUMN SAMPLE KEEPS ITS SHAPE (delivery-scoper, v5): a bare value as today, so criterion 7's compare can show Birth Registrations, Child Protection and Emergency Department unchanged. REJECTED wrapping every sample in a list of one, which would rewrite every recorded sample."
      - "THE QUERY-SELECTS-THE-KEY GATE (architect B3): with a several-column key, a query selecting fewer columns silently records nothing - exactly #291's shape. A gate makes the next one loud rather than another post-build finding."
      - "ESCAPING THE PILLS IS IN SCOPE (architect B3): the same renderer is being changed, and an unescaped identifier is a defect for any key, so it is fixed generically here, test first."
      - "NO AMENDMENT TO REQ-QAC-333's CRITERION TEXT (delivery-scoper, v5): criterion 6 already says 'the referential check SHALL record its failing rows as dataset code and identifier values'; it was the build that fell short, so the fix meets it as written and only its unmet_criteria entry changes."
    open_questions: []
