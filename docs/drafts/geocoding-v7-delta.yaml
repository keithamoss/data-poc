    proposed: 'WHEN the generator has written a supply with a planned verdict for ANY collection whose checks declare reads of another collection''s tables, THE SYSTEM SHALL run its target trial (REQ-GEN-186) IN THE PERIOD OF THE SLOT the generator built it for, naming no collection (Keith, 2026-10-31, v5 round (a); architect v5 BLOCKING 1): the trial SHALL be a method of the shared collection command, moved from cli/one_table.py''s try_targets - which today runs a local file with no period (:78-81) - and SHALL take each tried supply''s dataset, table, file and reference from that supply''s own record (criterion 12) rather than from the command''s one dataset - today self.table (:171, :217) and provider.dataset_id (:65, :87, whose delivery names are also what a refusal removes) - so that a collection of several datasets tries each dataset''s supplies against its own table and, on refusal, removes every stream''s just-written deliveries (REQ-GEN-295 criterion 1); cli/pipeline.py''s refusal of a trial for such a collection (:345-351) SHALL be lifted; and qa_tools/common/period_overlay.py SHALL build the trial run''s view schema for that declared period, where today it returns None for a supply with no filing (:10-17, :334-336), through criterion 11''s trial branch, so the trial''s cross-collection checks and its year checks (REQ-QAC-297 criterion 3) are evaluated (architect v6 SHOULD).'
