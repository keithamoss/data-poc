: A6 lets a trial have a period; it says nothing about which supply another collection''s table resolves to, which is this criterion''s, and the code enforces ''never a staged one'' in three places (period_overlay.py:122-124 and :303-306, stage.py:99-105, filed_tables :70).'
    why: v7
  - field: decisions
    proposed: 'OWN_RESULTS IS NOT CHANGED (architect v6 SHOULD): v6 criterion 11 had own_results keep every cross-table result for a trial; own_results also serves the post-replay comparison (target_agreement.py:201, REQ-GEN-273 criterion 1), where that change would turn criterion 8''s could-not-run quarters into failures. The rule lives in the trial (criterion 15). REJECTED a flag on own_results, which would leave one function meaning two things.'
