    proposed: THE SYSTEM SHALL resolve a trial's supply AND its reference each by the dataset's own file name (generator/targets.py csv_of with its filename argument, which the reference call omits today, cli/one_table.py:79-80), so that a delivery of two CSVs - every geocoding delivery - is tried file by file, and SHALL refuse by name a delivery holding no file for the dataset; generator/targets.written SHALL give every supply any provider records a target for its day, its file name and its slot's period - where for a provider without a target trial it gives ordinary ambers only, with none of the three (targets.py:84-93) - and SHALL refuse by name a record lacking any of them rather than try it with no period; and a test SHALL show, seen failing first, that a two-CSV delivery's reference no longer raises 'holds 2 CSV files, not one' (targets.py:180-182) (architect v5 BLOCKING 1; architect v6 SHOULD).
