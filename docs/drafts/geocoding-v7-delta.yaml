      >>> PROPOSED: <<<IF a supply has no filing, THEN THE SYSTEM SHALL NOT invent a period for it and SHALL NOT include it in any period-scoped run - except a generation-time target trial (REQ-GEN-186), which runs in the period of the slot the generator built it for, reads every table other than its own only from the copies REQ-GEN-298 criterion 11 stages in its own trial scope, never from the real database''s period, and records and files nothing. AMENDED <date applied> by REQ-GEN-298.>>>'
