    current: 'THE SYSTEM SHALL generalise that mechanism to list values without changing any existing setting''s resolution: a resolved value SHALL carry a list as a list, not its str() (today''s _resolve_on returns str(version[''value''])); a public resolver SHALL resolve on a DATE as well as an instant; timeline() and describe() SHALL take the setting''s key, describe() wording a list value generically - e.g. ''2011, 2016 and 2021 (set for Linkage Products, since 1 Aug 2022)'' - where today it is worded for amber and assumes a string (amber_setting.py:126, :150); the configuration schema (qa_tools/common/schemas.py) SHALL accept, under list_settings, any entry whose versions'' values are lists, by one generic model; validate_schedule.py''s frozen-date lookup (:856, which names amber_setting.KEY and ''replacement_setting'') SHALL also iterate every entry list_settings declares rather than naming one; and the module docstring SHALL say so (architect S6; architect v5 SHOULD).'
    proposed: 'THE SYSTEM SHALL generalise that mechanism to list values without changing any existing setting''s resolution: every function reading a setting - _settings (:197-208), _resolve_on (:99), resolve, timeline, describe, standing_problems and past_change_problems - SHALL take the setting''s key as a PATH, so that an entry nested in a container, (''list_settings'', ''census_years''), is read at the asset, collection and dataset levels as amber_setting and replacement_setting are read at the top; Resolved.value (:61) SHALL be typed as the setting''s value - a str for amber_setting and replacement_setting, a tuple of the declared members in declared order for a list setting - never a list''s str() (today''s _resolve_on returns str(version[''value''])); a public resolver SHALL resolve on a DATE as well as an instant; timeline() SHALL read its version dates from the key it is given, where today it reads amber_setting''s alone (:115) whatever it resolves, and describe() SHALL word a list value generically - e.g. ''2011, 2016 and 2021 (set for Linkage Products, since 1 Aug 2022)'' - where today it is worded for amber and assumes a string (:126, :150); the configuration schema (qa_tools/common/schemas.py) SHALL accept, under list_settings at any level, any entry whose versions'' values are lists of scalars, by one generic model; validate_schedule.py''s frozen-date lookup (:856, which names amber_setting.KEY and ''replacement_setting'') SHALL also iterate every entry list_settings declares rather than naming one; and the module docstring SHALL say so (architect S6; architect v5 and v6 SHOULD).'
