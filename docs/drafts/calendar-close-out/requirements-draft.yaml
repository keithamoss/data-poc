- id: REQ-GEN-205
  title: The synthetic history holds the calendar-correction scenarios TS-57 to TS-62 - a correction confirmed by a scripted
    asset manager who keeps one supply, with others moved, held, parked and re-judged, and one left awaiting confirmation
  date_written: '2026-10-14'
  story: As Keith showing what happens when a delivery calendar turns out to have been wrong, I want the synthetic history
    to hold a correction merged part way through it and confirmed by the asset manager - one supply moved, one kept, one held,
    one parked behind an inheriting quarter and one only re-judged - and a second correction still awaiting confirmation,
    so that every shape of REQ-PIPE-170 can be shown on the real dashboard and in the terminal rather than only in unit tests.
  moscow: must
  status: not_started
  source: 'REQ-PIPE-170 criterion 23''s first half (signed 2026-10-07; TS-63 moved to REQ-PIPE-179 criterion 39 by Keith 2026-10-13).
    Keith, 2026-10-13: the fictional past corrections are declared in contract/calendar.yaml. Scoped to design by the main
    session overnight 2026-10-13 to 14 (plans/morning-reports.md entry 4, forks (e) to (h)), which stopped short of building
    because a wrong guess would write fictional corrections into the real calendar file. Drafted by delivery-scoper the same
    night while Keith was asleep, so every fork is an open question.'
  acceptance_criteria:
  - 'THE SYSTEM SHALL declare the corrections these scenarios need in contract/calendar.yaml itself, in the corrections: list
    of each owner a correction changes, each with a change_reference, a date inside the synthetic history, an author, Keith''s
    real identity as approver (agreement_freeze''s approvers exclude the synthetic identities) and a reason that says it is
    a fictional correction made to demonstrate the correction route on this synthetic asset, and SHALL NOT declare them in
    a synthetic-only overlay file.'
  - THE SYSTEM SHALL generate, through REQ-GEN-044's injection mechanism, only the arrivals the corrections act on, and SHALL
    NOT generate any filing, move, hold, park, keep, verdict or confirmation the scenarios expect (REQ-GEN-044 criterion 6).
  - WHEN the synthetic history is replayed, THE SYSTEM SHALL file and judge each of these arrivals against the agreement as
    it stood at its receipt (REQ-PIPE-170 criterion 30), so that an arrival received before a correction's date is filed without
    it.
  - 'THE SYSTEM SHALL let contract/scripted_decisions.yaml declare a scripted correction confirmation, in a top-level corrections:
    list separate from its decisions: list - naming a declared correction by change_reference, with no dataset of its own,
    and saying either confirm, optionally with a list of supplies kept - each named by scenario, dataset and that scenario''s
    supply index (never a generated id) - and one keep_reason covering them, or pending - read only by correction_replay.confirm_due,
    outside the Player that plays filing decisions and outside filing_decisions'' operation validation, each kept supply resolved
    to its supply id as scripted decisions resolve theirs (scripted_decisions._supply_of).'
  - IF a scripted correction confirmation names an undeclared change reference, an unknown scenario or supply index, a dataset
    that scenario's arrival does not carry, keeps without a keep_reason, a keep_reason without keeps, pending together with
    keeps, any timing field (after_hours, at, day_offset), or a change reference another confirmation already names - or IF
    a correction declared in contract/calendar.yaml has no scripted confirmation at all - THEN `mothman scenarios validate`
    SHALL refuse it, naming the entry and the fault; and THE SYSTEM SHALL describe the new entry in the file's own header.
  - WHEN a replay of both collections confirms the due corrections (REQ-PIPE-170 criterion 31) - a bootstrap, a resumed bootstrap
    or `mothman pipeline run` over both - THE SYSTEM SHALL confirm through correction_apply.confirm only a correction whose
    scripted confirmation says confirm, with exactly the keeps and reason it names, and SHALL leave every other correction
    pending, so that TS-62's is never confirmed by default.
  - IF a scripted keep names a supply its correction does not propose to move, or a scripted confirmation is refused for any
    other reason, THEN THE SYSTEM SHALL stop the replay naming the scenario and the change reference, SHALL NOT drop the keep
    or confirm without it, and SHALL list in that message the correction's proposed moves by scenario, dataset and supply
    index where a scenario names them, so that the script can be put right.
  - WHEN a bootstrap has confirmed corrections, THE SYSTEM SHALL run every QA run the confirmations owe - each moved or placed
    supply's re-check and gate, and the knock-on re-evaluation of each period a move left or reached (REQ-PIPE-121) - through
    recheck.run_all_owed inside the bootstrap's own pass lock and under the replay clock, before it rebuilds both collections'
    results; SHALL say, before starting, how many runs are owed and that each takes about a minute; and IF any does not complete,
    THEN SHALL stop the bootstrap naming it, as a refused scripted decision does.
  - 'THE SYSTEM SHALL generate, as registered scenarios: TS-57, a supply re-judged by a confirmed correction with no move;
    TS-58, a supply moved by it, re-checked and judged against the period it moved to; TS-59, a supply it would move that
    the scripted asset manager keeps, with a reason; TS-60, a supply the corrected agreement gives no period, held on confirmation
    with a hold naming the correction; TS-61, a cp-case-workers supply whose move is blocked because a later quarter inherits
    it, parked on confirmation (REQ-PIPE-170 criterion 25); and TS-62, a correction merged and left awaiting confirmation
    - a new Birth Registrations daily calendar version with a different claim window - with an arrival for a dataset it affects
    received after its date.'
  - THE SYSTEM SHALL count as claimed by each correction, once however many scenarios ride it, every period whose slot a declared
    change alters together with the period before and the period after it - except that for a version-level change (TS-62's),
    only the days whose filing it would change, as its impact preview (REQ-PIPE-169) computes them, for supplies received
    before its effective date and for every arrival received on or after it, together with the day before and the day after
    each; SHALL check that claim against every injection, every post-generation placement (TS-52, TS-79a, TS-79b) and REQ-PIPE-179's
    TS-63 correction; and IF it meets a period another claims, THEN generation SHALL refuse naming both, and SHALL NOT shift
