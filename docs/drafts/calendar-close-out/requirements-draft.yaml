- id: REQ-DASH-209
  title: A period-composition view shows, for one period of a collection, what each dataset holds there and how it got there
    - promoted, inherited or substituted
  date_written: '2026-10-14'
  story: As the person who looks after the pipeline, or a data owner asked what a period's data actually is, I want one view
    per period of a collection saying what each of its datasets holds there - its own promoted supply, a supply inherited
    from an earlier period, or one substituted onto an earlier period - so that I can see what a query against that period
    reads without opening the database, and so that TS-55 has a page to show.
  moscow: should
  status: not_started
  source: 'Keith, 2026-10-14 morning, close-out Q16, option B, against the recommendation (plans/running-thoughts.md #93):
    draft a dashboard view of a period''s _manifest so that TS-55 (REQ-GEN-137 criterion 6) has a page, and it must work at
    about thirty datasets per period. Drafted by delivery-scoper the same morning; NOT REVIEWED by delivery-architect or by
    a UX reviewer.'
  acceptance_criteria:
  - THE SYSTEM SHALL offer, for each period of every collection - daily collections included, one view per day - a period-composition
    view with one row per dataset of that collection, each saying what the dataset holds in that period as at the end of the
    date on show - 'Promoted', 'Inherited from <period>', 'Substituted from <period>', 'Not supplied' where the dataset owes
    the period a supply and none is held there, or 'Not owed' where it owes none (turned off, REQ-PIPE-179; not expected;
    outside its agreed months) - and, for 'Not supplied' and 'Not owed', the one-word state the dataset's supply history shows
    for that period.
  - THE SYSTEM SHALL take every row from the per-dataset timelines the build already embeds (pipeline/slot_timeline.py and
    pipeline/promotion_timeline.py), looked up by the date on show with the same lookup REQ-DASH-198's standing-in qualifier
    uses (promotionStateOn), and SHALL NOT work out a second derivation, nor read a period schema, its catalogue, its _manifest
    or any supply row.
  - THE SYSTEM SHALL show, for each table held, the supply's receipt on the asset's clock, when the decision that put it there
    took effect, who made it - worded as the rest of the page words it, 'Decided by <name>' or 'Applied automatically by the
    schedule', exactly as REQ-DASH-198's drill-down words it, <name> being the person's display name from contract/people.yaml
    and never an email address - its reason, the status it was promoted on, in a column headed 'Status when promoted' and
    never its health since (REQ-PIPE-130 criterion 12), and, where an acknowledgement is owed, whether it was given.
  - 'THE SYSTEM SHALL open the view with one line counting the period''s datasets by kind - for example ''30 datasets: 1 not
    supplied, 1 substituted, 2 inherited, 25 promoted, 1 not owed'' - and SHALL list the rows grouped by kind in that order,
    ''Not supplied'' first and ''Not owed'' last, each group in dataset display-name order, with every row shown and no group
    collapsed.'
  - THE SYSTEM SHALL make each dataset's name a real link (<a href>) to that dataset's page at the same date on show, and
    each 'from <period>' a real link to that period's composition view.
  - 'THE SYSTEM SHALL give the view its own address in the dashboard''s existing routing - #/agency/<agency>/collection/<collection>/period/<period>,
    with the date on show as the existing in-place-on query parameter (docs/spa-best-practices.md section A) - and SHALL link
    to it, by a real <a href>, from each period''s label in a dataset''s supply history and from that history''s gap and owed-nothing
    rows, never from inside a delivery row, and from the standing-in pill''s drill-down (REQ-DASH-198).'
  - THE SYSTEM SHALL let TS-55's chip in the test-scenarios panel open its period's composition view, TS-55's coordinate in
    the scenario map still naming the substituted dataset, with the view as its link's target, so that REQ-GEN-045 criterion
