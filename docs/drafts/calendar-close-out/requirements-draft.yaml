  - 'A SHAPE CHANGE WITH MANY CONSUMERS - enumerate them mechanically and route each through the one helper (criterion 27).
    Found by delivery-architect, 2026-10-10: schedule.periods_for_dataset, slots.slots_for_dataset and _calendar_periods,
    period_overlap.overlaps_for, runway.calendar_runway, exhausted_datasets and schedule_ends_on, filing.final_period_for,
    assignment.schedule_ended, supply_holds.reason_for/describe/responses/Tally, schedule_ended.refile_covered, inheritance._does_not_participate,
    slots.is_owed_supplies, validate_schedule._expects_nothing_errors, dashboard/embed_dashboard_data.py, cli/schedule.py,
    dataset_blockers.py and both pipeline/build_*_dashboard_data.py. supply_holds.SCHEDULE_FILE hardcodes a configuration
    path and must read the agreement value instead. _version_in_force''s fallback to the first version must never apply to
    participation. RE-ENUMERATED 2026-10-13 (delivery-scoper, by grep for participation_on, resolved_versions, participates,
    is_owed, .expected, periods_for_dataset and not_expected): built since that list and missing from it - agreement_drift
    (REQ-PIPE-173), agreement_freeze.flatten (REQ-PIPE-111), participation_view (REQ-PIPE-181), verdict (REQ-PIPE-168), correction_trial
    and correction_apply (REQ-PIPE-170), settlement''s hold judgement (REQ-PIPE-193 criterion 11), cli/env.py, and both generators
    (generate_runs.py, generate_cp_runs.py), which read a dataset''s periods to decide what to generate - a turned-off gap
    generates no supply the dataset owes - the whole-delivery generator still writes the dataset''s file into each gap delivery,
    which is received and held as turned off (architect E21). Re-run the grep at build time rather than trusting either list.'
  - 'No false quiet: a turn-off never hides anything about a period that was owed. That is the line every criterion here is
    held to, because a turn-off read as ''ignore it'' is the way an overdue supply would go unnoticed.'
  - Config only for every rule about what is owed; no supply rows.
  - 'PERFORMANCE: the helper is called per dataset per date by every consumer, so it works from REQ-PIPE-110''s one agreement
    value and never re-reads the file; a dashboard build over thirty datasets and years of daily periods stays within its
    existing time.'
  - 'AUDITABLE: every effective_to and turned_off_reason sits on a version with a structured changelog entry (REQ-PIPE-110),
    so who turned a dataset off, when and why is in the file, and changes after the freeze are declared corrections with an
    approver.'
  - 'TEST FIRST: each criterion that guards against a false quiet - criteria 14, 15, 16, 18 and 23 above all - gets a test
    written first and seen to fail, because a turn-off that hides an owed period looks exactly like one that works.'
  - 'SECURITY: turned_off_reason is free text from configuration and is rendered as text, never as markup, everywhere it is
