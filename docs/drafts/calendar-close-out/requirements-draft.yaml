  - 'PROPOSED AMENDMENT WORDING, for Keith''s approval (delivery-scoper, 2026-10-14) - REQ-GEN-199 criterion 37 (signed; criterion
    6 here) to read: ''IF the Expect''s element is outside the 1280x800 viewport once the scenario jump (REQ-DASH-208) has
