- id: REQ-DASH-180
  title: 'The dashboard shows a turned-off dataset honestly: its real verdict, a marker, and nothing owed gone quiet'
  date_written: '2026-10-10'
  story: As a data team leader glancing across thirty datasets, I want a dataset that has been turned off to read as turned
    off - not as missed, not as failing, and not hiding a red verdict or an overdue period it still owed - so that I neither
    chase a supplier we stopped asking nor miss one who is late with the last file we did ask for.
  moscow: must
  status: not_started
  source: Keith's 2026-10-10 answers to the delivery-dashboard-ux reviews of REQ-PIPE-110 (2026-10-08 and 2026-10-10). Split
    out of REQ-PIPE-110 and drafted by the main session on 2026-10-10. NOT YET THROUGH delivery-scoper as a requirement of
    its own - say so when it is presented for sign-off. NOR THROUGH the 2026-10-13 joint scoper pass on REQ-PIPE-163, 179
    and 182 (dashboard UX 16, 2026-10-14) - say both when presenting it.
  acceptance_criteria:
  - WHILE a dataset is turned off on the date on show, THE SYSTEM SHALL keep showing the verdict of the supply in place, red
    included, with a 'Turned off since <date>' marker beside it, the date being the day after effective_to on the data asset's
    clock, worded as criterion 4 says instead while that criterion applies.
  - THE SYSTEM SHALL show the turned_off_reason as visible text in the dataset's header, and as the marker's title on the
    collection table's row; and WHERE the turn-off is its collection's, the marker SHALL read 'Turned off with <collection>
    since <date>', its title naming the level, and the collection card SHALL show the collection's turned_off_reason.
  - THE SYSTEM SHALL draw the marker as an outline in the family of 'No delivery schedule agreed yet' with a solid border,
    and SHALL NOT use the style or words of 'Schedule ended', 'Late (excused)' or 'Accepted'.
  - WHILE a dataset is past its effective_to and its last owed slot before the gap has not yet closed, THE SYSTEM SHALL word
    the marker 'Turning off - <period> supply still owed, open until <date and time>' while that period has no supply, and
    'Turned off since <date> - <period> open for resupply until <date and time>' once it has one.
  - THE SYSTEM SHALL NOT treat the verdict of the supply in place as stale because of a period the dataset owes nothing in
    by being turned off; the participation and not_expected cases are REQ-DASH-182 criterion 15's.
  - THE SYSTEM SHALL keep counting in every needs-action count every item about a period the dataset owed - any period outside
    a turned-off gap - a slot closed unfilled and overdue, a supply on an owed period waiting for a person's decision (red
    included), a promoted supply listed as 'Promoted, then re-checked <verdict>' (REQ-PIPE-164) - until it is resolved, whether
    or not the dataset is turned off; a promoted red supply counts as resolved for this purpose and keeps its red-promoted
    badge on the dataset (criterion 7).
  - THE SYSTEM SHALL leave a turned-off dataset out of its collection's and asset's colour rollup only WHILE its last owed
    slot before the gap has closed and no item criterion 6 counts is waiting, returning it to the rollup whenever one is,
    and SHALL keep showing a red verdict on the dataset itself beside its marker.
  - WHERE every dataset in a collection, an agency or the asset's executive tier is left out of its rollup on the date on
    show, all of them by criterion 7, THE SYSTEM SHALL show that group a 'Turned off' status, and SHALL NOT show it green.
  - 'WHERE every dataset in a group is left out of its rollup but not all by criterion 7, THE SYSTEM SHALL show the group
    a quiet ''Not counted'' status with a line saying why - e.g. ''3 datasets not counted: 2 turned off, 1 no schedule agreed
    yet'' - and SHALL NOT show it green.'
  - 'WHERE some but not all of a group''s datasets are left out of its rollup, THE SYSTEM SHALL say so in one quiet line on
    every collection card, every agency card and the executive tier concerned - ''N datasets not counted in this status: <counts
    by reason>'' - and SHALL show each such dataset''s marker on its row in the collection table; that line SHALL NOT count
    an exhausted dataset, which the exhausted-schedule line already states, and SHALL be left out where it would only repeat
    the group''s own status.'
  - THE SYSTEM SHALL add 'Turned off' and 'Not counted', keyed turnedoff and notcounted, to the group statuses the page already
    has (nodata, green, amber, red, exhausted, inactive) - in the template's status lists, in qa_tools/common/dataset_status.py,
    in the shared status cases and in the legend alike - SHALL leave both out of every worst-of rollup as nodata, exhausted
    and inactive are left out, and WHERE more than one would apply, SHALL show the first of exhausted, inactive, nodata, notcounted,
    turnedoff.
  - THE SYSTEM SHALL draw the group 'Turned off' and 'Not counted' statuses in the dataset turn-off marker's own style, and
    SHALL NOT use the inactive status's struck-through icon.
  - THE SYSTEM SHALL place the turn-off marker immediately after the status pill and the red-promoted badge, and before the
    marker on a period standing on an inherited supply, with an icon none of the 'No delivery schedule agreed yet', inactive
    or inherited markers uses.
  - THE SYSTEM SHALL show a supply held as turned off in its own quiet section of supply history, 'Received while turned off',
    and one quiet line on the dataset - 'N received while turned off, earliest <date>', counted as at the date on show - and
    SHALL NOT show it red, under 'Waiting for a person', in a 'Waiting since' tile or in the outstanding count, and SHALL
    NOT treat the dataset as blocked (REQ-PIPE-115 criterion 10) because of it, so that such a supply neither turns the dataset's
    status red nor brings the dataset back into its group's rollup; the quiet line SHALL sit where the accepted-gaps note
    sits (.accepted-gaps-note).
  - THE SYSTEM SHALL show a turned-off gap's periods as owed-nothing rows (REQ-DASH-182) whose kind reads 'Turned off' with
    the turned_off_reason, starting a new group wherever the kind or reason changes.
  - WHILE a dataset is turned off on the date on show and owes no period whose slot is still open, THE SYSTEM SHALL show its
    SLA tile as 'Turned off — nothing due' and SHALL NOT show the last version's due time as though it applied; and WHILE
    it still owes a period whose slot is open, SHALL show that period's due time labelled with the period.
  - THE SYSTEM SHALL NOT show a dataset turned off for good in the exhausted-schedule notice, its marker or the runway warning;
    SHALL show a dataset in a temporary gap in the runway warning by the periods it owes once back on (REQ-PIPE-179 criterion
    25); and SHALL show those for a dataset turned back on with no dates left from the moment it is back on.
  - WHEN a dataset is turned back on, THE SYSTEM SHALL show it as any dataset between deliveries - the verdict of the supply
    in place, never 'No data' - until its first owed period's slot opens, and SHALL keep the gap's owed-nothing rows in its
    history.
  - WHERE a supply for a still-owed period arrived after effective_to, THE SYSTEM SHALL show its arrival as plain Late where
    it is late, never 'Late (excused)' because of the turn-off alone - a lateness a person excused reads as REQ-DASH-162 says
    - with a note in the row's provenance cell that the period was still owed after the turn-off.
  - THE SYSTEM SHALL judge every turned-off reading from the participation versions in force on the date on show, so that
    a link to a date before or after a turn-off shows the dataset as it was then, and SHALL add nothing to the URL for it.
  - THE SYSTEM SHALL render turned_off_reason as text, never as markup.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-053 criteria 16 to 19 so that a turned-off dataset is never shown
    as exhausted, and REQ-DASH-155 criteria 1 and 3 so that the exhausted-schedule backlog counts only schedule-ended holds.
  - THE SYSTEM SHALL compute all of this from committed configuration and recorded results, and SHALL NOT read supply rows.
  - THE SYSTEM SHALL judge every instant these criteria turn on at the end of the date on show on the data asset's clock,
    as the page already judges whether a blocker is open on the date on show.
  - WHILE a dataset's last owed slot before a turn-off has closed and its effective_to has not yet passed, THE SYSTEM SHALL
    show the marker 'Turning off after <effective_to> - nothing more owed', and SHALL apply criterion 7 from that close.
  - WHERE a turned-off dataset has a red promoted supply, THE SYSTEM SHALL keep naming it in its collection card's red-promoted
    line, with '(turned off)' after its name.
  - WHILE the date on show falls on or after the date the turn-off was authored and on or before a dataset's effective_to,
    THE SYSTEM SHALL show, in the turn-off marker's place and style (criteria 3 and 13), a marker reading 'Turning off after
    <effective_to>' - 'Turning off with <collection> after <effective_to>' where the turn-off is its collection's - with the
    turned_off_reason as its title, SHALL keep the dataset in its rollups and counts as any owed dataset, and SHALL give way
    to criterion 4's or criterion 25's wording once either applies; the date the turn-off was authored SHALL be the date of
    the changelog entry recording effective_to on its participation version, carried into what the build reads with REQ-PIPE-179's
    other turn-off data. (NEW WORDING - for Keith's approval.)
  - IF a turn-off was authored after its effective_to, THEN THE SYSTEM SHALL show no 'Turning off after' marker for it on
    any date, and criteria 4 and 25 SHALL apply on their own terms. (NEW WORDING - for Keith's approval.)
  non_functional_requirements:
  - 'At thirty datasets a per-dataset marker becomes noise unless it aggregates: the group card carries one line of counts
    by reason, never a list of names.'
  - Rendered from data REQ-PIPE-179 computes; this only consumes it (docs/components.md).
  - Same date formatting as everything else on the page (REQ-DASH-071).
  dependencies:
  - REQ-PIPE-179
  - REQ-PIPE-110
  - REQ-DASH-182
  - REQ-DASH-071
  - REQ-DASH-155
  - REQ-PIPE-053
  - REQ-PIPE-181
  - REQ-PIPE-164
  - REQ-DASH-162
  - REQ-PIPE-115
  open_questions:
  - '1. WHICH CHANGELOG ENTRY DATES THE TURN-OFF (follows F9). A participation version''s changelog is a list of free-text
    entries, and effective_to is often added to a version that already exists, so ''the version''s changelog date'' can mean
    the day the version was first written - years before anyone decided the turn-off, the failure F9''s option C was rejected
    for. Recommended (A): the entry that adds effective_to says so in a structured field (for example turns_off: true), and
    REQ-PIPE-179''s configuration check refuses a version stating effective_to with no such entry. (B) the newest changelog
    entry on that version - no new key, but any later edit to the version moves the marker''s start. (C) the earliest entry
    - simplest, and wrong whenever effective_to was added later.'
  - '2. A TURN-OFF DECLARED AS A CORRECTION (follows F9). Every synthetic changelog entry is dated the real day it was written
    (2026-10-11 to 2026-10-14 in contract/calendar.yaml today), after the synthetic history ends on 2026-09-22, while TS-63''s
    turn-off is a declared correction dated inside the history, before its gap (close-out Q4). Read literally, F9 shows TS-63
    no foreshadow marker on any date, and no scenario demonstrates criterion 27. Recommended (A): where a declared correction
    set or moved effective_to, the marker starts from that correction''s date - the date the agreement records the turn-off
    as known - and otherwise from the changelog entry; TS-63''s register entry then quotes it. (B) the changelog entry only,
    as answered; criterion 27 is shown by fixture tests alone. (C) date the changelog entry on TS-63''s version inside the
    history, fictionally, as its correction is.'
  decisions:
  - 'SPLIT FROM REQ-PIPE-110, 2026-10-10 (Keith), as REQ-DASH-155 was split from REQ-PIPE-154: the decision and its record
    are one reviewable unit, the rendering another.'
  - 'REFINED 2026-10-10 by Q-A and T2 below - items about an owed period keep counting; only the gap is left out. WAS: A TURNED-OFF
    DATASET KEEPS ITS REAL VERDICT, WITH A ''TURNED OFF'' MARKER BESIDE IT (Keith, 2026-10-10, on the delivery-dashboard-ux
    review): its status pill shows what the checks found, red included, with a quiet outline marker reading ''Turned off since
    <date>'' and the reason - the pattern unagreedMarker already uses for ''No delivery schedule agreed yet'' - and the dataset
    is left out of every collection and asset rollup and every needs-action count. Criterion 1 here is that rewording: not
    red BECAUSE it is turned off, never hiding a verdict the data in place earned. REJECTED letting ''Turned off'' replace
    the status pill: a red period still holding data people may query would be hidden one click down - a false quiet.'
  - 'ITS MARKER WORDING SUPERSEDED 2026-10-10 by T8 below; the rest stands. WHILE TURNED OFF, ONLY THE GAP IS QUIET (Keith,
    2026-10-10, open question Q-A, recommended by all four reviewers): anything about a period the dataset still owes - an
    open late slot, a resupply waiting for a person, a slot closing unfilled, a red verdict - keeps counting among things
    needing a person as normal; only the gap''s own periods are excluded. The dataset leaves the collection''s and asset''s
    status once its last owed slot has closed (15 April in the worked example), and until then its marker reads ''Turning
    off - last supply owed: <period>, open until <date>''. REJECTED leaving the whole dataset out from the day after effective_to:
    an overdue or red owed period would go quiet - the false quiet Keith already turned down when choosing to keep the real
    verdict.'
  - 'CORRECTED 2026-10-10 (delivery-dashboard-ux, second pass): the page already has six status values (No data, green, amber,
    red, exhausted, inactive), so ''Turned off'' is the seventh and ''Not counted'' the eighth, not the sixth; and its STILL
    OPEN point is answered by the decision below. WAS: A COLLECTION OR AGENCY WHOSE DATASETS ARE ALL TURNED OFF READS AS A
