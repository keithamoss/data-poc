  status: not_started
  source: 'Keith, 2026-10-14 morning, close-out Q21, option A: after ''reject both'' the readers are re-checked via a small
    pipeline follow-up. Found by the round 3 architect review (D19): the knock-on re-evaluates only when a period''s holding
    changes (decision_log.apply_decision), and rejecting both files changes nothing held. Drafted by delivery-scoper the same
    morning; NOT REVIEWED by delivery-architect or by a UX reviewer.'
  acceptance_criteria:
  - WHEN the contest of a table in a period ends - by a person's settlement of the pair (REQ-PIPE-193), whatever the outcome,
    'reject both' included, or by a later arrival superseding the pair (REQ-PIPE-118 criterion 13, REQ-PIPE-194 criterion
    9), whether or not that arrival is promoted - THE SYSTEM SHALL record, in the same transaction as the settlement or the
    supersession, that a re-evaluation is owed of every cross-table check in that period recorded as not evaluated because
    that table was contested, through REQ-PIPE-121's one handler (knock_on), and SHALL NOT add a settlement-specific or supersession-specific
    re-evaluation path.
  - THE SYSTEM SHALL evaluate those checks against what the period holds for the table once the contest has ended, and WHERE
    it holds nothing - both files rejected, or the later file that superseded the pair still waiting - SHALL record each as
    not evaluated for the reason that now applies (REQ-PIPE-115), never as contested.
  - THE SYSTEM SHALL apply the promotion gate to each waiting supply the re-evaluation touched, exactly as REQ-PIPE-121 criterion
    3 does, and SHALL NOT demote, supersede or reject a promoted one (REQ-PIPE-121 criterion 6).
  - WHERE the settlement or arrival that ends the contest also moves or promotes a file, THE SYSTEM SHALL run one re-evaluation
    for it, covering both (REQ-PIPE-121 criterion 9), and SHALL NOT run two.
  - IF the re-evaluation fails to run, THEN THE SYSTEM SHALL leave the settlement or the supersession standing and the re-evaluation
    owed, and complete it on the next processing pass (REQ-PIPE-121 criteria 14 to 16).
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-193 criterion 23 so that a settlement owes the knock-on whatever
    its outcome, and REQ-PIPE-121 criterion 1 so that the end of a contest - by a settlement or by a later arrival superseding
    the pair - is among the knock-on's triggers.
  - THE SYSTEM SHALL have fixture tests, written first and seen to fail, that end a Child Protection contest three ways -
    a settlement rejecting both files, a settlement choosing a file that is left waiting red, and a later file superseding
    the pair and left waiting - and assert in each that no result recorded as contested remains current for the readers in
    that period; and one that settles a pair in the terminal and asserts that the readers are re-checked before the outcome
    panel is shown.
  - WHEN a pair is settled in the terminal - through the settle flow or the flag form (REQ-PIPE-193 criterion 15) - THE SYSTEM
    SHALL run the owed re-evaluation while the person waits, after the settlement's own QA runs and gates (REQ-PIPE-193 criterion
    21) and before its outcome panel; SHALL name it, with the readers it covers, among what follows in the settlement's warning
    panel (REQ-PIPE-193 criterion 17); and SHALL show in the outcome panel each reader re-checked, with its status afterwards.
  - WHEN a later arrival supersedes a contested pair, THE SYSTEM SHALL run the owed re-evaluation in the processing pass that
    files that arrival.
  non_functional_requirements:
  - 'NO FALSE GREEN: the re-evaluation re-runs the readers'' cross-table checks against what is there; it never clears a red
    by dropping a check.'
  - 'COST: cross-table checks only, never a reader''s own table-level checks (REQ-PIPE-121 criterion 2); at thirty datasets
    a widely read table may have many readers, all covered by the one re-evaluation per decision.'
  - 'RELIABILITY: owed in the settlement''s transaction and finished by the processing pass if interrupted (criterion 5).'
  - 'AUDITABILITY: every result it records names the settlement as its cause (REQ-PIPE-121 criterion 5).'
  - 'TEST FIRST: criterion 7''s ''reject both'' case is today''s defect - the readers stay red for good.'
  - 'PERFORMANCE: a person settling in the terminal now also waits for the readers'' cross-table re-check (criterion 8) -
    one re-evaluation per settlement, cross-table checks only, named in the warning panel beforehand so the wait is expected.'
