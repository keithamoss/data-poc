  decisions:
  - 'SPLIT FROM REQ-PIPE-110, 2026-10-10 (Keith, on the delivery-scoper review): the turn-off mechanism - added to REQ-PIPE-110
    in its 2026-10-07 sign-off commit without any agent review, which is why that sign-off was withdrawn - is its own requirement,
    with its own review and sign-off, on the REQ-PIPE-154 / REQ-DASH-155 pattern. REJECTED keeping it all in REQ-PIPE-110:
    39 criteria and growing, harder to review and to build against.'
  - 'SUPERSEDED 2026-10-10 - three of its rulings were changed by Keith that day (arrivals go through the filing rule, the
    real verdict is kept with a marker, effective_to has its own freeze point); see the decisions below. WAS: A DATASET IS
    TURNED OFF BY effective_to ON ITS PARTICIPATION VERSION (Keith, 2026-10-07, while signing this off): he asked for a dataset
    to stay in the calendar and stay configured but be turned off, permanently or for a time, and proposed effective_to himself.
    The gap after a version''s effective_to and before the next version is the off period; no later version is permanent.
    A reason is required. Arrivals while off are received, file-checked and held as turned off, and filed by the rule once
    a later version turns it back on (Keith''s choice, over recording only or ignoring them). Shown quietly grey with its
    reason, never red, never needing a person (his choice, over hiding it from rollups). Rejected: an `active:`/`connected:`/`enabled:`
    flag - effective_to uses the versioning already there, so ''temporarily'' needs no second mechanism. A future effective_to
    is freely editable; once in effect it changes only by a declared correction (REQ-PIPE-111).'
  - 'SUPERSEDED 2026-10-10 by the Q-K wording below, which says under which configuration the freeze is judged. WAS: effective_to
    FREEZES ON ITS OWN, LIKE not_expected (Keith, 2026-10-10, on the delivery-scoper and delivery-architect reviews of 2026-10-08):
    a participation version''s effective_to is its own frozen item, frozen from the earliest claim-opening instant of the
    first period it would stop the dataset owing; before that instant it may be added, moved or removed without a declared
    correction even where the version itself is frozen, and after it only by a correction. So turning a running dataset off
    from now on is an ordinary edit, and changing a turn-off already in effect goes through the correction route. REJECTED
    treating it as part of the whole frozen version: every routine turn-off would need a CAB-approved correction - the ''gate
    that fires on legitimate work'' REQ-PIPE-111''s own first NFR warns against. Needs REQ-PIPE-111 criterion 2 (freeze points)
    and criterion 4 (what a dataset''s corrections cover) amended in the same change; Keith approved the substance 2026-10-10.'
  - 'ARRIVALS WHILE TURNED OFF GO THROUGH THE FILING RULE AS NORMAL (Keith, 2026-10-10, on the delivery-scoper and delivery-architect
    reviews): periods inside an off gap generate no slot for the dataset; a supply that arrives while the dataset is off but
    finds an owed slot still open files there as usual - late if past its due date, a resupply waiting for a person if the
    slot is already filled; only a supply that finds no open owed slot is held, labelled turned off, and may be placed by
    hand (REQ-PIPE-163). Worked example agreed with Keith - quarterly, period dates on the 15th of Feb/May/Aug/Nov, claim
    window 30 days before due, 2 days'' grace, effective_to 2026-03-31: a February supply arriving 10 March files to February,
    late; one arriving 5 April (dataset off, February''s slot still open) files to February, late; one arriving 20 April (February
    closed, May owed nothing) is held as turned off. REJECTED holding everything received during the gap (criterion 38 as
    first drafted): it judged by receipt date where the rest of the design judges by the period''s date, and it hid a late
    supply for an owed period as ''turned off'' - the false-green direction. Criterion 38 (REQ-PIPE-110''s, as it then stood;
    now criteria 15 to 19 here) is to be rewritten to match.'
  - 'THE LAST OWED SLOT BEFORE A GAP CLOSES WHEN THE NEXT PERIOD''S CLAIM WINDOW WOULD HAVE OPENED (Keith, 2026-10-10): computed
    with the inputs of the participation version that last applied, as if the next calendar period were still owed - in the
    example, February closes on 15 April. Needed because REQ-PIPE-113 criterion 4 closes a slot at the next period''s claim-opening
    instant, and inside a gap that period has no slot, so without this rule the last slot before a turn-off would have no
    closing instant. REQ-PIPE-113 to be amended to match (it is signed off; the wording goes to Keith first).'
  - 'A TURNED-OFF HOLD IS RE-FILED BY THE RULE IF CONFIGURATION LATER GIVES ITS RECEIPT AN OPEN OWED SLOT, AND OTHERWISE WAITS
    FOR A PERSON (Keith, 2026-10-10, open question Q-B, option B): REQ-PIPE-154''s schedule-ended re-file (schedule_ended.refile_covered)
    is generalised to cover both labels, with no second re-filer; a supply the new configuration still gives no open owed
    slot stays held for a person to place (REQ-PIPE-163) or reject. Criterion 38 (REQ-PIPE-110''s, as it then stood; now criteria
    15 to 19 here)''s second half is rewritten to that. REJECTED letting a person place a turned-off hold into a period inside
    the gap (option C) - Keith: if someone wants that period owed, they change the effective_to and effective_from dates;
    placing into a gap period would nullify the point of having them. REJECTED leaving every such hold to a person (option
    A): a supply the configuration now covers would sit waiting for work the rule can do.'
  - 'A COLLECTION CAN BE TURNED OFF AS A UNIT (Keith, 2026-10-10, open question Q-F, option B): a collection''s participation_defaults
    version may carry effective_to and turned_off_reason, turning off every dataset that inherits from it, each showing the
    collection''s reason - Keith: ''in the case of Child Protection we''d probably be turning it off at collection level''.
    The same freeze, closing and arrival rules apply as for a dataset''s own effective_to. REJECTED turn-off per dataset only:
    thirty edits for one decision about one unit. ANSWERED BY THE DECISION BELOW - was STILL OPEN: whether one dataset''s
    own later version may turn itself back on inside a collection-level turn-off (Keith''s dictated answer leaned both ways
    - ''a collection is a unit'' and ''let''s leave the option open'').'
  - 'REFINED 2026-10-10 by T1 below - on/off is NOT nearest-level-wins. WAS: A DATASET MAY TURN ITSELF BACK ON INSIDE A COLLECTION-LEVEL
    TURN-OFF (Keith, 2026-10-10, answering the point left open by the decision above: ''let''s leave the option open''): a
    dataset''s own participation version whose effective_from falls inside its collection''s turned-off gap brings that dataset
    alone back on from that date, the rest of the collection staying off; nearest level wins, as for every other participation
    value. Every display of whether a dataset is on (the TUI Calendar entry and schedule show, REQ-PIPE-169) must then say
    which level decided it, since a reader would otherwise have to check two places. REJECTED treating the collection as an
    indivisible unit: bringing one dataset back would then mean changing the collection''s dates for all of them.'
  - 'TURNED-OFF PERIODS INHERIT THE LAST PROMOTED SUPPLY, AS A MONTH A DATASET DOES NOT PARTICIPATE IN DOES (Keith, 2026-10-10,
    open question Q-G, option A): a gap period is treated by REQ-PIPE-098''s inheritance exactly as an owed-nothing period
    is, so the table is present in every period and cross-table checks do not read it as missing. Keith''s reasoning: for
    a temporary turn-off ''we probably do want to inherit it''. ACCEPTED COST: after a permanent turn-off the inherited copy
    can be years old, and drift after a turn-back-on compares against it. Keith questioned whether a dataset that will never
    be received again should be inherited or kept at all, and possibly whether this should be configurable - that is the larger
    notion of a dataset being removed altogether, logged as plans/running-thoughts.md #77 rather than decided here. REJECTED
    no inheritance in a gap (queries for those periods would find no table) and REJECTED inheriting only in a temporary gap
    (''permanent'' only means ''no later version yet'', so behaviour would flip when someone turns it back on).'
  - 'WHEN CHANGING effective_to NEEDS A CORRECTION - WORDING APPROVED (Keith, 2026-10-10, open question Q-K): a change to
    effective_to - adding it, moving it or removing it - is an ordinary edit only if, for every period whose owed-or-not status
    the change flips, that period''s earliest claim-opening instant has not yet passed; otherwise it needs a declared correction
    (REQ-PIPE-111). This replaces the same morning''s ''frozen from the first period it would stop being owed'', which did
    not say whether that was judged under the old value or the new one: moving effective_to from 2026-03-31 back to 2026-02-01
    on 10 April would have passed under the old reading (first stopped period May, not yet frozen) while silently erasing
    February''s obligation. Found by delivery-scoper and delivery-architect independently. Covers moving earlier, moving later,
    adding and removing with one rule.'
  - 'CLOSING RULE BEFORE A GAP: REJECTED closing the last owed slot at effective_to (a late supply for it would then be held,
    the false quiet Keith turned down), and REJECTED closing it at its own late-after instant (a supply a day late would find
    nothing open). The rule chosen is the one slots.py already applies in every other case, with the gap treated as if absent.'
  - 'CORRECTED 2026-10-10 by T5 below: a hold is labelled by the slot that would be current at its receipt instant, not by
    its receipt date. WAS: WHICH DATE DECIDES WHAT (delivery-architect, 2026-10-10): whether a period is owed follows its
    period date; a hold''s label follows the receipt date on the asset clock; the dashboard follows the date on show. One
    definition of ''turned off on D'' - D after effective_to and before the next version''s effective_from at that level -
    with each consumer passing in its own date. A following-period dataset (REQ-PIPE-167) can have a period due before effective_to
    that it nonetheless does not owe, because its period date falls after; that is consistent, and is stated so nobody reads
    it as a defect.'
  - 'THE TURNED-OFF HOLD REUSES REQ-PIPE-064''S KIND WITH A FLAG (delivery-architect, 2026-10-10), as schedule-ended holds
    do: no new hold kind. A hold is written once (ON CONFLICT DO NOTHING), so its label is worked out from current configuration
    when shown - otherwise a schedule-ended hold raised before a turn-off would advise adding dates for ever.'
  - 'ON OR OFF FOLLOWS THE MOST RECENT VERSION AT EITHER LEVEL, SO A COLLECTION TURN-OFF REACHES EVERY DATASET (Keith, 2026-10-10,
    T1, option A, recommended by delivery-scoper and delivery-architect): a dataset is turned off on date D if its own latest
    participation version starting on or before D ended (effective_to) before D, or if its collection''s latest participation_defaults
    version starting on or before D ended before D and the dataset has no version of its own whose effective_from falls after
    that effective_to and on or before D. So a collection turn-off reaches a dataset whose own version began years earlier;
    only a dataset version starting inside the gap brings that dataset back; and a later collection version never ends a dataset''s
    own turn-off. Inside a collection gap the collection supplies no values, so a dataset version bringing itself back on
    must state its own due time and grace (REQ-PIPE-110''s unresolved-value refusal). On/off is therefore NOT resolved by
    per-value nearest-wins. REJECTED nearest-level-wins for on/off: a dataset with its own version would ignore the collection''s
    turn-off, defeating ''turning Child Protection off as a unit''.'
  - 'ITEMS ABOUT AN OWED PERIOD KEEP COUNTING UNTIL RESOLVED; THE DATASET LEAVES THE COLOUR ROLLUP ONCE ITS LAST OWED SLOT
    HAS CLOSED AND NOTHING IS WAITING (Keith, 2026-10-10, T2, option A, recommended by all four reviewers): a slot that closed
    unfilled and is overdue, a red verdict on an owed period, or a resupply waiting for a decision stays among the states
    needing a person (REQ-PIPE-064 criterion 5, REQ-PIPE-132 criterion 10) until resolved, whether or not the dataset is turned
    off; the dataset leaves its collection''s and asset''s colour rollup only once its last owed slot before the gap has closed
    and no such item is still waiting; a red verdict keeps showing on the dataset itself beside its marker. REQ-DASH-180 criterion
    6 is to be split into these two statements. REJECTED keeping it in the colour rollup until everything is resolved (a permanently
    turned-off dataset with a red last supply would colour its collection for ever) and REJECTED dropping everything at the
    close as drafted (an overdue last period would go quiet the moment the miss became real).'
  - 'A SUPPLY HELD AS TURNED OFF DOES NOT NEED A PERSON; IT SHOWS AS A QUIET COUNT (Keith, 2026-10-10, T3, option A, recommended
    by three reviewers): it is not among the states needing a person anywhere - pipeline, terminal queue or dashboard - and
    shows on the dataset as one quiet line, ''N received while turned off, earliest <date>'', counted as at the date on show,
    never red. It still waits for a person to place or reject it unless configuration later gives it an open owed slot (Q-B).
    This also settles REQ-PIPE-179''s earlier open question on the same point, and REQ-DASH-180 criterion 10 stands. The built
    REQ-PIPE-064 criterion 5 and REQ-PIPE-083 criterion 21, which count every held supply as needing action, are to be amended
    in the same change; that wording comes to Keith at sign-off. REJECTED counting it like every other hold: a supplier still
    sending files after being asked to stop would raise a needs-action item, and a ticket, each time.'
  - 'ANSWERED BY T3 (Keith, 2026-10-10): a supply held as turned off is not among the states needing a person; it shows as
    a quiet count on the dataset. See the T3 decision.'
  - 'A HOLD''S LABEL IS WORKED OUT FROM CURRENT CONFIGURATION EVERYWHERE IT IS USED (Keith, 2026-10-10, T4, option A, the
    delivery-architect''s recommendation): the label (turned off, schedule ended, or the plain assignment-rule hold), its
    advice and its responses are computed from the configuration in force when they are read - for display, for re-filing
    (schedule_ended.refile_covered''s filter), for the processing pass''s tally, for the dashboard''s backlog line and for
    every count - so what is shown always agrees with what is re-filed and counted. The structured reason recorded when the
    hold was raised stays as history. The built REQ-PIPE-154 criteria 2 and 6 and REQ-PIPE-064 criterion 8, which read the
    recorded flag, are to be amended in the same change; that wording comes to Keith at sign-off. Cost accepted: a small per-hold
    calculation, and holds are few. REJECTED keeping the recorded flag authoritative for re-filing and counts while only the
    advice text is recomputed: the label shown could disagree with what is re-filed.'
  - 'OWED-NESS GOES BY THE PERIOD''S DATE EVEN FOR A DATASET SUPPLYING AHEAD, AND HOLDS ARE LABELLED BY SLOT, NOT RECEIPT
    DATE (Keith, 2026-10-10, T5, option A, the delivery-architect''s recommendation): a period is owed if the participation
    in force on its period date owes it, never because its due date falls before effective_to - so for a dataset due 60 days
    ahead and turned off after 2026-03-31, the May 2026 period (dated 15 May, due 16 March) is not owed, and a May supply
    sent on 16 March finds no open owed slot and is held as turned off. A hold is labelled turned off where no owed slot is
    open at its receipt instant and the calendar period whose slot would then be current (computed with criterion 12''s inputs)
    is a turned-off period - so the stretch between the last owed slot closing and effective_to is labelled correctly too
    (the architect found the receipt-date rule mislabelled it as schedule ended, advising ''add the next dates''). The ''WHICH
    DATE DECIDES WHAT'' decision is to be corrected to this, and criterion 14 reworded. REJECTED owing a period whose due
    date falls on or before effective_to: a second rule applying only to datasets that supply ahead.'
  - 'A PERMANENT TURN-OFF AFTER THE CALENDAR''S LAST AUTHORED DATE IS ACCEPTED (Keith, 2026-10-10, T6, option A, recommended
    by delivery-scoper and delivery-cli-ux): the refusal of a gap that contains no calendar period applies only where a later
    version follows the effective_to - a temporary gap that turns nothing off; a permanent turn-off (no later version) is
    accepted even where the calendar has no dates after effective_to, and it takes the dataset out of the exhausted-schedule
    and runway warnings (criterion 21). So a supplier can be turned off the day they stop, which is the likeliest moment to
    need it. Criterion 7 is to be reworded to ''...or leaves a gap before a later version that contains no period...''. REJECTED
    refusing it until the next dates are authored.'
  - 'A TURNED_OFF_REASON CHANGED AFTER ITS TURN-OFF HAS TAKEN EFFECT NEEDS A DECLARED CORRECTION, EVEN FOR A TYPO (Keith,
    2026-10-10, T7, option A): turned_off_reason freezes with its effective_to (criterion 10), and any change to it after
    the freeze - wording or meaning - is a declared correction with an approver; `mothman schedule draft-correction` prints
    the entry. Consistent and fully auditable. REJECTED freezing only the meaning and allowing wording-only edits: no gate
    can tell a typo fix from a rewritten reason.'
  - 'TURNED OFF OUTRANKS SCHEDULE ENDED (main session, 2026-10-10, giving the reason the second review found missing - delivery-scoper
    5 - for Keith to confirm at sign-off): a schedule-ended hold''s advice is ''add the next dates'', which would not make
    a turned-off dataset owe anything, so the turned-off label is the one whose advice is true. The delivery-scoper''s earlier
    suggestion, schedule ended first, is REJECTED for that reason.'
  - 'FOLDED 2026-10-10 (main session), the second review round''s fixes and Keith''s T1-T7 answers now criteria: on/off by
    the most recent version at either level, with a collection supplying no values while off (T1, delivery-architect F1, delivery-scoper
    B2); owed items count until resolved, citing REQ-PIPE-064 and REQ-PIPE-132 rather than REQ-PIPE-083 (T2, delivery-scoper
    B1 and 19); a turned-off hold is not needs-action, with REQ-PIPE-064 criterion 5 and REQ-PIPE-083 criterion 21 amended
    (T3, delivery-scoper 22); the label computed from current configuration everywhere, the recorded reason kept as history
    (T4, delivery-architect F4); holds labelled by slot (T5, delivery-architect F3); a permanent turn-off after the last authored
    date accepted (T6, delivery-cli-ux F1); turned_off_reason changed only by correction (T7); the closing rule resolved per
    value across levels (delivery-architect F2); the freeze instant for a gap period and under both configurations (delivery-scoper
    17, delivery-architect F6); the display names the level and says ''Turned off - nothing due'' (delivery-cli-ux F2, F8;
    delivery-scoper 4); a hint where reason is written for turned_off_reason (delivery-cli-ux F11); the overlap gate checks
    across a gap (delivery-architect F5); REQ-PIPE-163, REQ-PIPE-154, REQ-PIPE-064 and REQ-PIPE-098 amendments numbered (delivery-scoper
    check 5); runway wording (delivery-scoper 18); NFRs for performance, auditability, test-first and security (delivery-scoper
    20 and 26); dependencies on REQ-PIPE-181, 132, 169, 167, 106 and 053 (delivery-scoper 21 and 26, delivery-architect F9).
    How long a turned-off dataset''s history is kept is the larger question of removing a dataset, plans/running-thoughts.md
    #77, not decided here. Criterion numbers in earlier decisions refer to the list before this fold.'
  - 'REQ-PIPE-181 IS A MUST (Keith, 2026-10-10, round 3 Q2, option A): this requirement''s collection-level turn-off and its
    display depend on REQ-PIPE-181, which was raised to must for that reason, so nothing here is conditional on it.'
  - 'TURNED-OFF HOLDS ARE A QUIET LAST GROUP IN THE TERMINAL''S QUEUE (Keith, 2026-10-10, round 3 Q3, option A, the delivery-cli-ux
    recommendation): listed after the slot rows as ''Received while turned off (N)'', outside the count of supplies waiting
    on a decision, so place and reject stay one keypress away as on the dashboard''s quiet line (REQ-DASH-180). Each says
    why: ''Received while <dataset> is turned off (<reason>, set for <level>). Place it into a period it still owes, reject
    it, or change effective_to/effective_from in contract/calendar.yaml if this period should be owed.'' REQ-PIPE-163 criterion
    17''s placement of held supplies is to be amended to match. REJECTED showing them only in `mothman supply holds`.'
  - 'A DATASET BACK ON INSIDE ITS COLLECTION''S GAP MUST STATE EVERY VALUE THE COLLECTION GAVE IT (Keith, 2026-10-10, round
    3 Q6, option A, recommended by delivery-architect and delivery-scoper): T1 left the collection supplying no values while
    off and required only due time and grace, so a back-on version that left out participates would owe every period and one
    that left out days before would drop to zero - a silent widening, the trap REQ-PIPE-050 exists for. Criterion 7 now refuses
