- id: REQ-GEN-218
  title: 'TS-63 is planted in the synthetic history: a Child Protection dataset turned off for two quarters by a declared
    correction, with a late supply for the quarter it still owed and one received inside the gap'
  date_written: '2026-10-14'
  story: As someone evaluating the PoC, I want the synthetic history to show a dataset being turned off for a while and turned
    back on, through the same declared-correction gate a real turn-off would go through, so that I can see on the real dashboard
    and terminal what a turn-off does - the marker before it, a supply for a quarter it still owed filed there, a supply received
    inside the gap held quietly, and the gap's owed-nothing rows.
  moscow: must
  status: not_started
  source: 'Keith, 2026-10-14, answering REQ-PIPE-179''s own delivery-scoper pass, question 1, option A (docs/drafts/calendar-close-out/req-179-own-pass.md):
    TS-63 split out of REQ-PIPE-179 criterion 39 into a generator requirement of its own, built after REQ-DASH-180. Drafted
    by delivery-scoper, 2026-10-14, from criterion 39 and the TS-63 decisions REQ-PIPE-179 carried (Keith, 2026-10-13 and
    2026-10-14). TS-63 came to REQ-PIPE-179 from REQ-PIPE-170 criterion 23 (Keith, 2026-10-13, set 2 Q8). Not reviewed by
    delivery-architect or a UX reviewer as a requirement of its own; its content was reviewed in round 3 as REQ-PIPE-179 criterion
    39 (architect A4, A5 and E21).'
  acceptance_criteria:
  - THE SYSTEM SHALL generate, as registered scenario TS-63, a Child Protection dataset turned off for two quarters in the
    synthetic history and turned back on by a later participation version with its own effective_from, the dataset's participation
    first split from the shared *cp_participation alias in contract/calendar.yaml, so that no other dataset is turned off
    with it and no dataset's resolved participation changes on any date outside TS-63's gap.
  - 'THE SYSTEM SHALL declare TS-63''s turn-off AS A CORRECTION in contract/calendar.yaml (REQ-PIPE-111), dated before the
    gap''s first period so that the gap''s arrivals are filed under the corrected agreement as they arrive, with Keith''s
    real identity as its approver and a reason saying it is a fictional correction made for this synthetic asset''s demonstration,
    giving the participation version an effective_to, a turned_off_reason and the changelog entry carrying turns_off: true
    that REQ-PIPE-179 criterion 40 requires.'
  - THE SYSTEM SHALL place TS-63's correction, its gap and the quarters either side of it in quarters REQ-GEN-207 adds by
    growing the Child Protection history earlier, so that no existing scenario's quarter moves; and IF any of them meets a
    period another scenario or correction claims, THEN generation SHALL refuse, naming both, through the collision refusal
    REQ-GEN-207's dry run uses, and SHALL NOT shift either.
  - THE SYSTEM SHALL inject, through REQ-GEN-044's injection mechanism, one supply for the dataset's last owed quarter arriving
    after the effective_to but while that quarter's slot is open, so that it files to that quarter (REQ-PIPE-179 criterion
    15), and one supply arriving inside the gap with no owed slot open, so that it is held as turned off (REQ-PIPE-179 criterion
    16).
  - THE SYSTEM SHALL rewrite TS-63's register entry in plans/supply-model.md to the Child Protection calendar's real dates
    and the marker wording REQ-DASH-180 now uses, in place of the 15th-of-the-month configuration and the wording from before
    Keith's T8, saying that the ordinary deliveries inside the gap still carry the dataset's file, which is received, held
    as turned off and counted in REQ-DASH-180's quiet line; that cp-carers reads 'awaiting confirmation' from the correction's
    date to the end of the history, because a replay confirms a correction only at its end; and quoting the 'Turning off after
    <effective_to>' marker REQ-DASH-180 criterion 27 shows from the correction's date (REQ-PIPE-179 criterion 41).
  - THE SYSTEM SHALL give TS-63 a unit test in the scenario register's tests (TestScenarioRegister), as REQ-PIPE-170 criterion
