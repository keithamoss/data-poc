  - THE SYSTEM SHALL have fixture tests, written first and seen to fail, that replay a small history with two declared corrections
    and assert that a scripted keep is recorded as KEEP naming the change reference and the script's reason, that the other
    move is carried out and re-checked before the replay ends, and that the correction scripted pending is still pending afterwards.
  - THE SYSTEM SHALL clear REQ-PIPE-170's unmet entry for criterion 23, naming this requirement, in the change that builds
    it.
  - IF a correction's date, or a period one of its declared changes names, falls outside the generated history - as a date
    fixed in configuration can once ANCHOR_DATE moves - THEN generation SHALL refuse naming the scenario and the change reference,
    and SHALL NOT drop or shift it.
  - WHEN a bootstrap is resumed (bootstrap.resume), THE SYSTEM SHALL confirm the due corrections and run what they owe exactly
    as a bootstrap from empty does.
  - 'THE SYSTEM SHALL declare exactly two corrections for these scenarios: one, confirmed by its scripted confirmation, whose
    changes carry TS-57 to TS-61, so that one applied summary shows all five shapes; and one for TS-62, whose scripted confirmation
