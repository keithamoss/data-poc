  status: not_started
  source: 'REQ-PIPE-170 criterion 23''s first half (signed 2026-10-07; TS-63 moved to REQ-PIPE-179 criterion 39 by Keith 2026-10-13).
    Keith, 2026-10-13: the fictional past corrections are declared in contract/calendar.yaml. Scoped to design by the main
    session overnight 2026-10-13 to 14 (plans/morning-reports.md entry 4, forks (e) to (h)), which stopped short of building
    because a wrong guess would write fictional corrections into the real calendar file. Drafted by delivery-scoper the same
    night while Keith was asleep, so every fork is an open question.'
  acceptance_criteria:
  - 'THE SYSTEM SHALL declare the corrections these scenarios need in contract/calendar.yaml itself, in the corrections: list
    of each owner a correction changes, each with a change_reference, a date inside the synthetic history, an author, an approver
    and a reason that says it is a fictional correction made to demonstrate the correction route on this synthetic asset,
    and SHALL NOT declare them in a synthetic-only overlay file.'
  - THE SYSTEM SHALL generate, through REQ-GEN-044's injection mechanism, only the arrivals the corrections act on, and SHALL
    NOT generate any filing, move, hold, park, keep, verdict or confirmation the scenarios expect (REQ-GEN-044 criterion 6).
  - WHEN the synthetic history is replayed, THE SYSTEM SHALL file and judge each of these arrivals against the agreement as
    it stood at its receipt (REQ-PIPE-170 criterion 30), so that an arrival received before a correction's date is filed without
    it.
  - THE SYSTEM SHALL let contract/scripted_decisions.yaml declare a scripted correction confirmation - naming a declared correction
    by change_reference, with no dataset of its own, and saying either keep, a list of supplies each named by scenario, dataset
    and that scenario's supply index (never a generated id) with one keep_reason covering them, or pending - read only by
    correction_replay.confirm_due, outside the Player that plays filing decisions and outside filing_decisions' operation
    validation, each kept supply resolved to its supply id as scripted decisions resolve theirs (scripted_decisions._supply_of).
  - IF a scripted correction confirmation names an undeclared change reference, an unknown scenario or supply index, a dataset
    that scenario's arrival does not carry, keeps without a keep_reason, a keep_reason without keeps, pending together with
    keeps, a confirmation with no keeps (which says nothing the default does not), any timing field (after_hours, at, day_offset),
    or a change reference another confirmation already names, THEN `mothman scenarios validate` SHALL refuse it, naming the
    entry and the fault; and THE SYSTEM SHALL describe the new entry in the file's own header.
  - WHEN a replay of both collections confirms the due corrections (REQ-PIPE-170 criterion 31), THE SYSTEM SHALL confirm a
