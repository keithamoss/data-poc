- id: REQ-PIPE-179
  title: A dataset, or a whole collection, can be turned off for a time or for good, and nothing still owed goes quiet
  date_written: '2026-10-10'
  story: As the person who looks after a delivery agreement, I want to turn a dataset - or a whole collection - off when its
    supplier stops supplying for a while or for good, without deleting its configuration or history, so that it stops owing
    supplies from the right date while anything it still owed before then is chased as usual.
  moscow: must
  status: not_started
  source: 'Keith, 2026-10-07 (effective_to, proposed by him while signing off REQ-PIPE-110) and 2026-10-10 (his answers to
    the four-agent review of REQ-PIPE-110: delivery-scoper, delivery-architect, delivery-cli-ux, delivery-dashboard-ux). Split
    out of REQ-PIPE-110 and drafted by the main session on 2026-10-10. NOT YET THROUGH delivery-scoper as a requirement of
    its own - say so when it is presented for sign-off. Re-scoped jointly with REQ-PIPE-163 by delivery-scoper, 2026-10-13
    - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182 with the Child Protection pattern widening (Keith, 2026-10-13:
    close out the calendar group before the road-testing review; scope 163 WITH 179 so 179 does not amend a requirement that
    may change under it).'
  acceptance_criteria:
  - THE SYSTEM SHALL let a participation version - a dataset's, or a collection's participation_defaults version - state an
    effective_to date, the last day it governs on the data asset's clock, inclusive.
  - IF a participation version states effective_to without turned_off_reason, or turned_off_reason without effective_to, THEN
    THE SYSTEM SHALL reject the configuration; and WHERE such a version states reason in place of turned_off_reason, the refusal
    SHALL say that turned_off_reason is the key for a turn-off, reason being the explanation for owing only some periods.
  - THE SYSTEM SHALL treat a dataset as turned off on a date WHERE its own latest participation version starting on or before
    that date states an effective_to before it, or WHERE its collection's latest participation_defaults version starting on
    or before that date states an effective_to before it and the dataset has no version of its own whose effective_from falls
    after that effective_to and on or before the date.
  - WHILE a dataset is turned off on a period's date, THE SYSTEM SHALL treat it as owing nothing in that period, and SHALL
    keep the dataset and its configuration in contract/calendar.yaml.
  - WHERE no later version follows an effective_to, THE SYSTEM SHALL treat the dataset as turned off from then on, with no
    end.
  - WHERE a dataset's own participation version takes effect inside its collection's turned-off gap, THE SYSTEM SHALL treat
    that dataset alone as owing again from that version's effective_from, the rest of the collection staying off; and a later
    collection version SHALL NOT end a dataset's own turn-off.
  - WHILE a collection is turned off, THE SYSTEM SHALL take none of its participation values for any dataset, so that a dataset
    bringing itself back on states its own due time and grace (REQ-PIPE-110 criterion 29); and IF a dataset's own version
    taking effect inside its collection's turned-off gap leaves unstated any participation value its collection supplied it
    on the day before the gap, THEN THE SYSTEM SHALL reject the configuration, naming the dataset, each value and the collection's
    last value for it, and saying to state it.
