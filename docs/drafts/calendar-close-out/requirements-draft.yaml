  - 'THE CRITERION NUMBER IS 36, NOT 34 (delivery-scoper, 2026-10-14): post-build-review #174 cites REQ-GEN-199 ''criterion
    34''; in the register the viewport assertion is criterion 36 and its ''a finding against the page'' rule is criterion
