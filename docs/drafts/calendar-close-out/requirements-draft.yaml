  open_questions:
  - 'Criterion 38''s premise is unverified: whether agreement_drift already flags a slot that vanished. Check at build, test
    first.'
  - 'ARCHITECT Q2 - WHEN TS-63''s CORRECTION IS DATED. Recommended (A): before the gap, so that the gap''s arrivals are filed
    under the corrected agreement as they arrive and the turn-off is seen as it happens (the ''Turning off'' marker, the hold
    at arrival, criterion 39''s expectations) - at the cost of cp-carers reading ''awaiting confirmation'' from the grown
