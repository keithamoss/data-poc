requirements:
- id: REQ-DASH-204
  title: A dataset turned red by another table it reads says so at the top of its page, naming that table and what clears
    it
  date_written: '2026-10-14'
  story: As a data team leader opening a Child Protection dataset that reads red, I want the top of its page to tell me when
    the red comes from ANOTHER table - two files for one table, a file that could not be loaded, a supply held, overdue or
    waiting on a decision - naming that table and what clears it, so that I go to the one decision or arrival that clears
    it instead of hunting through this dataset's checks for a fault it does not have.
  moscow: must
  status: not_started
  source: 'Keith, 2026-10-13 evening, answering the CLI and dashboard UX reviews of the calendar close-out batch (plans/running-thoughts.md
    #92): ''a reader dataset turned red by ANOTHER table''s contest gets a NEW DASHBOARD REQUIREMENT NOW (a top-of-page line
    naming the contested table), not a later sighting.'' Drafted by delivery-scoper overnight 2026-10-13 to 14 while Keith
    was asleep, so every fork is an open question rather than a decision.'
  acceptance_criteria:
  - WHERE the run the dataset's status is computed from on the date on show includes a cross-table check recorded as not evaluated
    because a table belonging to ANOTHER dataset was contested, could not be loaded, held with no period, past due or staged
    and awaiting a decision (REQ-PIPE-115 criteria 14 to 16, held_blast_radius), THE SYSTEM SHALL show at the top of that
    dataset's page ONE notice in the page's red notice style - after the waiting-blocker banner and before the exhausted-schedule
    banner - holding one line per such table, each beginning in bold with criterion 15's wording for its cause, and naming
    the period; and SHALL NOT show a line for a table that is merely not yet due.
  - THE SYSTEM SHALL say in that line how many of this dataset's checks read that table and could not run, that those checks
    did not fail on this dataset's own data, and what runs them again - criterion 15's next step for the cause.
  - THE SYSTEM SHALL NOT word the line so that it says or implies this dataset has nothing else wrong, and SHALL NOT change
    the dataset's status because of it - the line explains the red and never removes it.
  - THE SYSTEM SHALL show one line per contested table however many of the dataset's checks read it, and SHALL NOT show a
    line per check.
  - THE SYSTEM SHALL make the contested dataset's name in the line a real link (<a href>) to that dataset's page at the same
    date on show, built as affectsLinks() builds its links, so that middle-click and copying the link keep the date.
  - THE SYSTEM SHALL judge the line as at the date on show - from the run the dataset's status is computed from on that date
    and the contest's opening and resolving instants on the asset's clock (REQ-PIPE-194 criteria 9 and 14) - and SHALL NOT
    judge it as at the build.
  - WHILE a contest is resolved on the date on show but the run the dataset's status is computed from still carries checks
    not evaluated because of it, THE SYSTEM SHALL say in the line that the pair was settled, or superseded, on <date on the
    asset's clock>, that these checks have not run again since, and what runs them again - the re-check settling the pair
    owes (REQ-PIPE-211), a later supply of <dataset> promoted into the period, or a person's re-check of this supply (REQ-PIPE-164,
    once built) - and SHALL NOT say that the red is waiting on the pair.
  - WHEN the dataset's checks have been re-evaluated (REQ-PIPE-121's knock-on) so that the run its status is computed from
    carries no check not evaluated because of another table, THE SYSTEM SHALL show no line.
  - THE SYSTEM SHALL NOT show the line on the page of the dataset whose table is the cause, which carries criterion 17's 'Affects'
    instead.
  - THE SYSTEM SHALL record, for every not-evaluated cross-table result, the reason's code for EACH table it names (unrunnable_codes_by_table,
    beside today's single unrunnable_code), SHALL carry it and a held-supply record's held_tables into the dashboard data,
    and SHALL identify the blocking table and its cause from those fields alone, never by parsing the reason's prose; records
    written before this change SHALL be read by their single unrunnable_code.
  - THE SYSTEM SHALL compute the line at build time from recorded QA results and recorded decisions only, and SHALL NOT read
    supply rows.
  - THE SYSTEM SHALL render every name in the line as text, never as markup.
  - THE SYSTEM SHALL have real-browser tests, against a dashboard built from a fixture history, written first and seen to
    fail, in which a reader dataset shows one line naming the contested table while the pair is open - though three of its
    checks read that table - and no line once its checks have been re-evaluated after the settlement; and in which a reader
    of a table that could not be loaded shows that cause's line.
  - WHERE the synthetic history holds TS-42 or TS-80 (REQ-GEN-203), THE SYSTEM SHALL quote the line, as the page words it,
    in each scenario's register entry for its three reader datasets on the pair's arrival day.
  - 'THE SYSTEM SHALL word each cause''s line, and its next step, as follows, rendering <dataset> as criterion 5''s link:
    contested - ''Red because <dataset> has two files for one table'', next step settling the pair (''say what each file is'',
    REQ-PIPE-194 criterion 15) or a later file superseding it; could not be loaded - ''Red because <dataset>''s file for <period>
    could not be loaded'', next step a corrected file or a person rejecting it (REQ-PIPE-153); held - ''Red because <dataset>''s
    supply is held with no period'', next step placing or rejecting it (REQ-PIPE-163); past due - ''Red because <dataset>''s
    supply for <period> is overdue'', next step the supply arriving or a person marking it not supplied (REQ-PIPE-132); staged
    and awaiting a decision - ''Red because <dataset>''s supply for <period> is waiting on a decision'', next step a person
    promoting or rejecting it. (NEW WORDING - for Keith''s approval.)'
  - WHERE every red check on a reader's waiting supply is one not evaluated because of another table, THE SYSTEM SHALL word
    the reader's verdict line and its outstanding item to say that nothing needs deciding on this supply, and that its checks
    run again and the gate is applied again once <criterion 15's next step> (REQ-PIPE-121), and SHALL NOT offer promote or
    reject as its next step.
  - THE SYSTEM SHALL end the notice the causing dataset's own page shows for that cause - the 'Two files for one table' banner,
    or the notice it shows for a file that could not be loaded, a held, an overdue or a waiting supply - with 'Affects <reader
    links>', built by affectsLinks(), naming each dataset this criterion's line appears on at the date on show.
  - THE SYSTEM SHALL show, in the collection table, a quiet note under each such reader's status pill naming the causing table,
    in the noSupplyNote shape, and on the collection card ONE line per causing table, in the redPromotedMarker shape, naming
    that table once with the number of readers it holds red, and SHALL NOT list each reader on the card.
  non_functional_requirements:
  - 'SCALE (CLAUDE.md''s ~30-datasets rule): one line per contested table, never per check - cp-investigations alone carries
    several checks reading cp_clients (Soda and dbt referential checks, reads_tables [cp_clients]), and on a thirty-dataset
    asset a widely read table could hold many readers red at once; each reader''s page says the cause once.'
  - 'PERFORMANCE: computed once per dataset per build from the results already embedded; no per-render scan of history, so
    page load does not grow with the number of past runs.'
  - 'THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else (criterion 11).'
  - 'PRIVACY: the line names the other dataset and the period, never the two filenames - those stay on the contested dataset''s
    own banner (REQ-PIPE-194 criterion 1) - so a supplier''s file naming is shown in one place, not repeated on every reader.'
  - 'ACCESSIBILITY AND CONSISTENCY: the same notice styling and role=''status'' the page''s other top-of-page banners use,
    and the one label REQ-PIPE-194 criterion 15 fixes; no new asset, so the self-hosted, file:// and offline viewing paths
    are unaffected.'
  - 'TEST FIRST for criterion 3 above all: a line that read as ''this dataset is fine'' would be the false-green direction.'
  dependencies:
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-PIPE-121
  - REQ-DASH-197
  - REQ-PIPE-202
  - REQ-GEN-203
  - REQ-PIPE-164
  - REQ-PIPE-211
  - REQ-PIPE-163
  - REQ-PIPE-132
  - REQ-PIPE-153
  decisions:
  - 'A NEW REQUIREMENT NOW (Keith, 2026-10-13): a top-of-page line on the reader naming the contested table. REJECTED leaving
    it for a later road-testing sighting.'
  - 'WHY A READER GOES RED, VERIFIED IN CODE 2026-10-14 (delivery-scoper): qa_tools/common/unrunnable.py records each cross-table
    check that reads a contested table as status fail with unrunnable_code ''contested'', in the reader''s OWN run (REQ-PIPE-115
    criteria 14 to 16; period_schema.CONTESTED outranks every slot reason); promotion.status_of counts every contributing
    check, so the reader''s status is red and the gate withholds it. Child Protection''s readers of cp_clients are cp-notifications,
    cp-investigations and cp-placements (reads_tables [cp_clients] in contract/child-protection-soda-checks.yml and dbt_project/models/staging/schema.yml),
    several checks each.'
  - 'WHAT THE PAGE SAYS TODAY, VERIFIED IN THE TEMPLATE 2026-10-14: the reader''s pill is red; each affected check card carries
    ''not evaluated in the latest run''; the reason appears only inside the check''s drawer, under ''Not evaluated in the
    current run''. The top-of-page banners (blockedBanner, waitingBanner) are about the dataset''s OWN supply only, so nothing
    at the top names the other table. pipeline/build_cp_dashboard_data.py carries only the reason''s prose to the page, not
    its code or table - hence criterion 10.'
  - 'THE SAME SHAPE IS ON THE REAL PAGE TODAY FOR AN UNLOADABLE TABLE: the bootstrapped database (queried 2026-10-14) holds
    ''could-not-be-loaded'' records against cp_clients in all three readers'' runs, from TS-12''s quarter, and no ''contested''
    ones - Child Protection cannot be contested until REQ-PIPE-202 widens the pattern. Whether the line covers that kind too
    is open question 1.'
  - 'THE LINE EXPLAINS THE RED, NEVER REMOVES IT (delivery-scoper, PROPOSED): a check that could not run counts as red until
    it can - the template''s own drawer text says so, and REQ-PIPE-115 records it red. REJECTED showing such a reader amber
    or with its status recomputed without those checks: that is the false-green direction, and the gate would disagree with
    the page.'
  - 'NAMES THE DATASET AND PERIOD, NOT THE FILES (delivery-scoper, PROPOSED): the contested dataset''s own banner names both
    files; repeating them on every reader multiplies a supplier''s naming across pages for no gain in what to do.'
  - 'ONE LINE PER CONTESTED TABLE (CLAUDE.md scale rule, the caller''s brief): REJECTED a line per affected check, which on
    cp-investigations would repeat one cause several times.'
  - 'ROUND 3 REVIEWS FOLDED (round 3 fold, delivery-scoper, 2026-10-14): architect D17 (criterion 10 - unrunnable.py writes
    ONE unrunnable_code per record, the first table''s by name order, and keeps no per-table reason, while held tables are
    recorded separately by held_blast_radius as tool ''held'' with held_tables; so the recorder gains a per-table code, which
    makes this requirement touch the PIPE recorder, said here rather than hidden); architect D18 (''results in place'' was
    undefined for a red reader - now ''the run the dataset''s status is computed from on the date on show''); dashboard UX
    4 (criterion 1 - one notice in the red notice style, its place among the banners, a bold first sentence); dashboard UX
    5 (criterion 5 - a real href built as affectsLinks() builds them, verified in the template); dashboard UX 8 (criterion
    7 names what runs the checks again).'
  - 'OPEN QUESTION 1''s FIRST PREMISE WAS WRONG, CORRECTED (dashboard UX 3, verified 2026-10-14): a held table''s readers
    are recorded by held_blast_radius (tool ''held'', held_tables, held_reason), not under an unrunnable_code; and unrunnable
    records also carry past-due and staged-awaiting-decision, so ''another table is overdue'' - the commonest such red at
    thirty datasets - is a candidate too. The question is re-offered below with that option.'
  - 'EVERY RED ROOTED IN ANOTHER TABLE GETS THE LINE (Keith, 2026-10-14, close-out Q17, option A, the dashboard UX recommendation):
    contested, could not be loaded, held with no period, past due and staged awaiting a decision, each with its own wording
    and next step (criteria 1 and 15), never a not-yet-due one. At thirty datasets ''another table is overdue'' is the commonest
    such red. REJECTED contested and could-not-be-loaded only, and contested only (Keith''s original wording of the ask).
    The per-cause wording in criterion 15 is new and the scoper''s, for Keith''s approval.'
  - 'COLLECTION LEVEL: ROW NOTE, ''AFFECTS'', AND ONE CARD LINE (Keith, 2026-10-14, close-out Q18, option A as the summary
    put it, the dashboard UX review''s recommended set): criteria 17 and 18. One cause reads once on the card however many
    readers it holds red. REJECTED the row note and ''Affects'' only, and nothing at collection level.'
  - 'THE READER''S OWN WAITING ITEM SAYS NOTHING NEEDS DECIDING THERE (Keith, 2026-10-14, close-out Q19, option A): criterion
    16 is the page half; the terminal half is REQ-PIPE-210, drafted the same morning. Both surfaces today invite a decision
    on the reader when the decision that clears it is the other table''s. REJECTED the page half only, and leaving both.'
  - 'MUST (Keith, 2026-10-14, close-out Q20, option A): REQ-GEN-203 puts three red readers on the real page. REJECTED should.'
  - 'AFTER ''REJECT BOTH'' THE READERS ARE RE-CHECKED (Keith, 2026-10-14, close-out Q21, option A): REQ-PIPE-211, drafted
    the same morning, so settling a pair owes the readers a re-check whatever the outcome; criterion 7 names it as what runs
    them again.'
  - 'FOLDED 2026-10-14 (delivery-scoper, Keith''s close-out answers): title, story, criteria 1, 2, 7, 8, 9 and 13 generalised
    from the contested case to every cause; criteria 15 to 18 added. Criterion 15''s wording is new.'
  open_questions:
  - 'CHECK AT BUILD (not a question for Keith): criterion 17 assumes the causing dataset''s page already shows a notice for
    each cause to end with ''Affects''. The ''Two files for one table'' banner exists; for an unloadable, held, overdue or
    waiting supply, confirm which notice or outstanding item carries it, and bring any cause with none back to Keith rather
    than inventing a banner.'
- id: REQ-DASH-182
  title: The dashboard shows every period a dataset owes nothing in, with its reason, and the delivery time in force on the
    date on show
  date_written: '2026-10-10'
  story: As a data team leader reading a dataset's supply history, I want a period it owes nothing in to say so, with the
    reason, and its delivery time to be the one in force on the date I am looking at, so that I never read a deliberate gap
    as a missed supply or judge a supply against a due time that did not apply.
  moscow: must
  status: not_started
  source: 'Split out of REQ-PIPE-110 on 2026-10-10 (Keith, T9, option A, the delivery-scoper''s recommendation) with the criteria
    and decision it carried. NOT YET THROUGH delivery-scoper as a requirement of its own - say so when it is presented for
    sign-off. Scoper pass 2026-10-13: delivery-scoper, 2026-10-13 - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182
    with the Child Protection pattern widening (Keith, 2026-10-13: close out the calendar group before the road-testing review;
    scope 163 WITH 179 so 179 does not amend a requirement that may change under it).'
  acceptance_criteria:
  - THE SYSTEM SHALL show, in a dataset page's supply history - and, once REQ-DASH-209 is built, in its period-composition
    view's 'Not owed' group - every period the dataset owes nothing in, whether by participation or by not_expected, together
    with its reason; SHALL NOT omit it; and SHALL show those rows even where the dataset has no supply cycles yet.
  - WHERE the dashboard shows a period a dataset owes nothing in, THE SYSTEM SHALL show it as a quiet row stating its kind
    - a participation row 'Not owed — outside its agreed months (Feb, Aug)', 'Not expected — <reason>', and WHERE the dataset
    is turned off (REQ-PIPE-179), 'Turned off — <reason>' (REQ-DASH-180 criterion 15) - in its chronological place among the
    supply cycles, only for periods up to the date on show, and SHALL NOT show it red, among things needing action, or as
    'No supply'; a participation row, which recurs, SHALL carry that short label generated from the configuration, and the
    authored reason SHALL be shown once, on the dataset's SLA tile (criterion 11), not on every row.
  - WHERE the dashboard shows a dataset's delivery time or cycle - on its SLA tile or anywhere else - THE SYSTEM SHALL take
    it from the values resolved for the dataset on the date on show - expected time, grace, participates and days before -
    each from the level REQ-PIPE-181 resolves it to; WHERE the date on show falls before the dataset's first participation
    version, SHALL show 'Not owed yet — owes supplies from <date>', the date that version takes effect, on the SLA tile and
    as the heading of the notice that today reads 'Nothing had been supplied by this date', which it replaces, that notice's
    body keeping only its way-back sentence, 'Pick a later date, or reset to the default, using the 📅 In place on control
    above.', and dropping 'There is no QA run within the accepted freshness window as of <date>.'; and WHERE the dataset is
    turned off on that date (REQ-PIPE-179), SHALL show it as REQ-DASH-180 criterion 16 says.
  - THE SYSTEM SHALL render every reason it shows as text, never as markup.
  - THE SYSTEM SHALL compute all of this from committed configuration and recorded results, and SHALL NOT read supply rows.
  - THE SYSTEM SHALL NOT show periods before a dataset's first participation version as owed-nothing rows.
  - WHERE a dataset's supply for a period is due on an earlier day than the period's date (days_before above 0), THE SYSTEM
    SHALL say so in the delivery-time label on the SLA tile - 'by 22:00 the day before' where it is one day, 'by 22:00, N
    days before each date' where it is more - SHALL NOT show the time alone, and SHALL have a test of each of the two forms.
  - WHERE a dataset's calendar is not exactly four delivery months a year, or its periods fall on different days of the month,
    THE SYSTEM SHALL still label its cycle in words - 'Yearly' for one delivery month a year, 'Twice a year' for two, 'Quarterly'
    for four, 'Monthly' for twelve, otherwise '<N> times a year' - and 'various days' in place of the day where its periods
    fall on different days of the month, for a calendar of the 'authored' type as for any other, and SHALL NOT render the
    label blank.
  - 'WHERE an owed-nothing period stands on an earlier supply by inheritance (REQ-PIPE-098), THE SYSTEM SHALL say so on the
    same row, as muted text ''Inherited from <period>'' with no pill, rather than as a second row or a second pill for the
    same period; and the heading of the standing-in panel near the top of the dataset page (standingInHeading, in standingInDetail)
    SHALL read, for an owed-nothing period, the row''s kind label alone on the present date and ''On <date>: <kind label>''
    on a past date, where it now reads ''Nothing was owed for this period'' and ''On <date> this period held an earlier period''s
    data - nothing was owed for it'', with the reason in that panel''s .promo-why line and not in the heading; the substituted
    heading is unchanged.'
  - WHERE the current cycle on the date on show is a period the dataset owes nothing in, THE SYSTEM SHALL show that period's
    owed-nothing row in place of 'No deliveries in the current cycle yet.'
  - THE SYSTEM SHALL show on a dataset's SLA tile the delivery months the dataset itself participates in on the date on show,
    not its calendar's, in the same form as its participation row, with the frequency word criterion 8 gives for that number
    of months - for example 'Twice a year (Feb, Aug, day 1), by 09:00' for cp-case-workers, never 'Quarterly (Feb/May/Aug/Nov)'
    - and WHILE that participation is not every period of its calendar, SHALL show the authored reason as a muted second line
    on the tile.
  - THE SYSTEM SHALL draw a period a dataset owes nothing in as a label-only block in the style of a supply cycle's heading
    (.supply-cycle-label) with no table beneath it, headed by cycleLabel() as its neighbouring cycles are, with its kind label
    where a cycle shows its number of deliveries, in muted text and with no pill of any kind, so that it ranks below a red
    'No supply' and an 'Accepted' tag; SHALL order it newest first among the supply cycles; and SHALL NOT list it under 'Periods
    with no supply'.
  - WHERE consecutive owed-nothing periods share a kind, a reason and the period they stand on, THE SYSTEM SHALL show them
    as one row reading '<kind label>, <first> to <last> (<n> periods)' - 'days' for a daily dataset - with the range and unit
    worded as gapText() words a gap, and a single period as '<kind label>' under its own heading with no count; WHERE such
    a run is still open on the date on show, its count SHALL read '(<n> periods so far)'; WHERE the run holds the current
    period, its row SHALL be the current-cycle block, with its 'Current cycle' tag, and SHALL NOT be shown a second time among
    the older cycles; and 'Show all history (N cycles)' SHALL count the rows it hides, owed-nothing rows included.
  - THE SYSTEM SHALL produce every owed-nothing period's kind word, label and reason from one function in the page, used alike
    by the rows here, REQ-DASH-180 criterion 15's turned-off rows, the standing-in heading (criterion 9) and, once it is built,
    REQ-DASH-209's 'Not owed' group and its counting line; SHALL separate kind and reason with the page's em dash (—); and
    SHALL show the same label on every page, REQ-DASH-209's 'Not owed' group included, not shortened there.
  - THE SYSTEM SHALL NOT show a dataset as stale, as 'No data', or with the line 'nothing has landed yet in this dataset's
    current expected cycle' - on its page or in its collection table - because the period current on the date on show is one
    it owes nothing in by participation or by not_expected, and SHALL show the verdict of the supply in place as for any dataset
    between deliveries; THE SYSTEM SHALL have a real-browser test against the built dashboard, a REGRESSION GUARD that passes
    on today's page, holding this for cp-case-workers on a date in a May or November quarter after its first supply - asserting
    first that the date is one the dataset owes nothing in, so that the test cannot pass vacuously - and a tests-js test holding
    the same for a not_expected period.
  non_functional_requirements:
  - Rendered from REQ-PIPE-110's agreement value; this only consumes it (docs/components.md).
  - Same date formatting as everything else on the page (REQ-DASH-071).
  - 'SCALE: rows are collapsed per run of periods (criterion 13), so the page carries one row per change of kind or reason,
    not one per period - a daily dataset owing nothing for a year is one row, and thirty datasets over years stay a handful
    of rows each.'
  - 'PERFORMANCE: computed at build time from configuration through REQ-PIPE-181''s one resolution function, never per period
    in the browser; the build''s time does not grow with the length of history beyond reading the calendar once.'
  - 'PRIVACY: reasons are authored configuration text, rendered as text (criterion 4); nothing here reads or shows supply
    rows.'
  - 'ACCESSIBILITY: every owed-nothing state is said in words, never by colour alone (dashboard UX 11, REQ-DASH-182 review
    2026-10-14).'
  - 'NO ROUTE OR URL WORK: everything here is judged on the date on show, so a cold-loaded link to a past date rebuilds that
    date''s rows and SLA tile - one for the post-build critic to check (dashboard UX 11).'
  dependencies:
  - REQ-PIPE-110
  - REQ-DASH-071
  - REQ-PIPE-181
  - REQ-PIPE-098
  - REQ-DASH-198
  - REQ-PIPE-113
  - REQ-PIPE-106
  - REQ-DASH-054
  decisions:
  - 'SPLIT FROM REQ-PIPE-110, 2026-10-10 (Keith, T9, option A), on the REQ-PIPE-154 / REQ-DASH-155 pattern: the configuration
    and its rendering are separate reviewable units. REQ-DASH-180''s turned-off rows are owed-nothing rows of a third kind
    and depend on this. The decision below travelled from REQ-PIPE-110 unchanged.'
  - 'PERIODS OWED NOTHING ARE QUIET, NEVER RED (delivery-dashboard-ux pre-build review, 2026-10-07): a reason row, grouped
    in supply history, never ''No supply'' and never in needs-action. The SLA tile follows the participation version in force
    on the date on show.'
  - 'ROUND 3 FOLDED, 2026-10-10 (main session): the three kind labels fixed in one place so REQ-DASH-180 cannot drift (delivery-dashboard-ux
    15); rows in chronological place, a run of periods collapsed to one row, nothing after the date on show - a daily dataset
    turned off for a year would otherwise show 365 rows (14); the delivery time taken from resolved values with their levels,
    and said for a date before the first version (13, delivery-scoper F, delivery-architect 15); periods before the first
    version are not owed-nothing rows (delivery-scoper L).'
  - 'TWO LABEL DEFECTS LEFT HERE BY BUILT WORK (verified 2026-10-13): post-build-review #138 #5 - the delivery-time label
    ignores days_before (''by 22:00'' for a supply due the evening before); #137 L9 - a calendar not four months a year labels
    as ''authored'', which the page renders blank, and mixed days give day_of_month None. agreement.cadence() still takes
    the newest version only, its docstring saying ''Which version applies on the date on show is REQ-DASH-182''s''. Criteria
    7 and 8 carry the first two; criterion 3 the third.'
  - 'BUILDABLE BEFORE REQ-PIPE-179 (DECIDED Keith, 2026-10-13, set 3 Q9, option A): the three labels stay fixed in this one
    requirement, the turned-off one as a WHERE clause that is vacuous until a turn-off can be configured; REQ-DASH-180 criterion
    15 stays the owner of the turned-off row''s behaviour. REJECTED waiting for 179.'
  - 'ONE ROW FOR AN INHERITED OWED-NOTHING PERIOD (DECIDED Keith, 2026-10-13, set 3 Q10, option A): every owed-nothing period
    inherits (REQ-PIPE-098), and the page already marks an inherited period with a standing-in pill saying ''Nothing was owed
    for this period'' (REQ-DASH-198); criterion 9 puts the period it stands on in the owed-nothing row. REJECTED a reason
    row beside the existing pill, which says the same thing twice.'
  - 'NO ''Not expected'' ROW INSIDE A TURNED-OFF GAP (DECIDED Keith, 2026-10-13, on REQ-PIPE-179 criterion 21): such an entry
    is rejected as configuration, so the two kinds never meet on one period.'
  - 'KEITH''S THREE ANSWERS OF 2026-10-13 (DECIDED Keith, 2026-10-13 evening, answering the CLI and dashboard UX reviews -
    plans/running-thoughts.md #92; carried in by dashboard UX 1, 2026-10-14, as a carry-over gap): owed-nothing rows that
    recur (cp-case-workers'' May and November) read a SHORT generated label, ''Not owed - outside its agreed months (Feb,
    Aug)'', with the authored reason once on the SLA tile (criterion 2); the current cycle shows its owed-nothing row in place
    of ''No deliveries in the current cycle yet.'' (criterion 10); and the due-before label reads ''by 22:00 the day before''
    for one day and ''by 22:00, N days before each date'' for more (criterion 7). REJECTED repeating the authored reason on
    every recurring row.'
  - 'ROUND 3 REVIEWS FOLDED (round 3 fold, delivery-scoper, 2026-10-14): dashboard UX 1 (the three answers above, which had
    not reached the criteria); dashboard UX 12 (criterion 9 - the standing-in heading names the kind). This requirement had
    the 2026-10-13 joint scoper pass, not one of its own (dashboard UX 16).'
  - 'REQ-DASH-182 SENT TO ITS OWN UX REVIEW (Keith, 2026-10-14, at sign-off: ''send it to the UX reviewer first''; docs/drafts/calendar-close-out/review-182-ux.md).
    Its findings 2 to 11 and Keith''s four answers are folded below; finding 1 is folded differently from how it was proposed
    (see the next decision).'
  - 'FINDING 1 DID NOT REPRODUCE AS STATED; A GUARD, NOT A FIX (main session''s real-browser check, 2026-10-14; Keith, 2026-10-14,
    REQ-DASH-182 review Q2, option A): cp-case-workers at 2025-06-15 and 2026-06-15 shows no ''No data'' and no ''nothing
    has landed yet'', so an owed-nothing period does not read stale today. A DIFFERENT false ''No data'' did reproduce - a
    supply received inside its claim window but before its period''s start read stale for its whole period - and is FIXED
    as post-build-review #178, recorded on REQ-DASH-054. Keith''s Q2 gives the participation and not_expected cases to this
    requirement and leaves REQ-DASH-180 criterion 5 only the turned-off case, so criterion 15 is a regression guard with a
    real-browser test that passes today rather than a test written to fail first. REJECTED the reviewer''s proposed staleness
    criterion, which described a defect the page does not have.'
  - 'THE SLA TILE NAMES THE DATASET''S OWN MONTHS (Keith, 2026-10-14, REQ-DASH-182 review Q1, option A; dashboard UX 2, HIGH,
    confirmed in the browser): criterion 11. agreement.cadence() takes its months from the calendar, so cp-case-workers''
    tile read ''Quarterly (Feb/May/Aug/Nov)'' directly above a row saying ''outside its agreed months (Feb, Aug)''. The tile
    now names the dataset''s months in the row''s form with a matching frequency word, and the authored reason on a muted
    line. The page calls it the SLA tile (its key reads SLA, .sla-tile), so the draft''s ''agreement tile'' and ''delivery-time
    tile'' are both now ''SLA tile'', here and in REQ-DASH-180 criterion 16.'
  - '''NOT OWED YET'' REPLACES ''NOTHING HAD BEEN SUPPLIED'' (Keith, 2026-10-14, REQ-DASH-182 review Q3, option A; dashboard
    UX 6): criterion 3. Before a dataset''s first participation version the page takes its never-supplied branch, so the draft''s
    ''Not yet owing - first version takes effect <date>'' had nowhere to appear; the notice''s heading and the SLA tile now
    read ''Not owed yet — owes supplies from <date>''. REJECTED keeping ''Nothing had been supplied by this date'', which
    reads as a supply missed.'
  - 'LABELS UNCHANGED ON EVERY PAGE (Keith, 2026-10-14, REQ-DASH-182 review Q4, option A): criterion 14 - REQ-DASH-209''s
    ''Not owed'' group shows the full label, not one shortened because the group heading already says ''Not owed''.'
  - 'THE REVIEWER''S PROPOSALS FOLDED AS CRITERIA (REQ-DASH-182 dashboard UX review, 2026-10-14): finding 3 (criterion 12
    - what a quiet row looks like; it is deliberately NEVER under ''Periods with no supply'', recorded here so the post-build
    critic does not flag the contrast with a gap); finding 4 (criterion 13 - runs worded as gapText() words a gap, ''so far''
    while open, the current period''s run is the current-cycle block, ''Show all history'' counts what it hides); finding
    5 (criterion 9 - the standing-in panel''s heading, standingInHeading, not ''the heading above that row'', and the row''s
    ''Inherited from <period>'' as muted text); finding 7 (criterion 14 - one function for kind, label and reason, and the
    page''s em dash); finding 8 (criterion 7 - tested in both forms); finding 9 (criterion 8 - the frequency words and ''various
    days''); finding 10 (criterion 1 - scoped to supply history and 209''s view, and shown with no supply cycles yet); finding
    11 (two NFRs). The new user-facing wording in criteria 3, 9, 11, 13 and 14 is the reviewer''s and the scoper''s, for Keith''s
    approval.'
  - 'CRITERION 7 REWORDS BUILT BEHAVIOUR (dashboard UX 8): cadenceLabel already handles days_before (post-build-review #142),
    reading ''due N days before each date, by 22:00''; criterion 7 replaces that with the wording Keith chose on 2026-10-13.
    The terminal''s `mothman schedule show` probably needs the same words - not this requirement''s (DASH); flagged for delivery-cli-ux
    rather than folded.'
  - 'THE EM DASH IN EVERY LABEL (Keith, 2026-10-14, H1, option A): criteria 2, 3 and 14 separate kind and reason with the
    page''s own em dash (—) - ''Not owed — outside its agreed months (Feb, Aug)'', ''Not expected — <reason>'', ''Turned off
    — <reason>'', ''Not owed yet — owes supplies from <date>'' - and REQ-DASH-180 criterion 16''s ''Turned off — nothing due''
    follows suit. Keith''s answers of 2026-10-13, quoted above with a hyphen, chose the words, not the separator. REJECTED
    (B) a plain hyphen.'
  - 'THE ''NOT OWED YET'' NOTICE KEEPS ONLY ITS WAY BACK (Keith, 2026-10-14, H2, option A): criterion 3 - the body keeps ''Pick
    a later date, or reset to the default, using the 📅 In place on control above.'' and drops ''There is no QA run within
    the accepted freshness window as of <date>.'', which reads as a missed supply. REJECTED (B) today''s body unchanged under
    the new heading.'
  - 'THE STANDING-IN HEADING NAMES THE KIND, DATED ON A PAST DATE (Keith, 2026-10-14, H3, option A; dashboard UX 5): criterion
    9 - ''On <date>: <kind label>'' on a past date, the kind label alone on the present, the reason in .promo-why. REJECTED
    (B) keeping today''s heading sentences with the kind label only in .promo-why.'
- id: REQ-PIPE-179
  title: A dataset, or a whole collection, can be turned off for a time or for good, and nothing still owed goes quiet
  date_written: '2026-10-10'
  story: As the person who looks after a delivery agreement, I want to turn a dataset - or a whole collection - off when its
    supplier stops supplying for a while or for good, without deleting its configuration or history, so that it stops owing
    supplies from the right date while anything it still owed before then is chased as usual.
  moscow: must
  status: not_started
  source: 'Keith, 2026-10-07 (effective_to, proposed by him while signing off REQ-PIPE-110) and 2026-10-10 (his answers to
    the four-agent review of REQ-PIPE-110: delivery-scoper, delivery-architect, delivery-cli-ux, delivery-dashboard-ux). Split
    out of REQ-PIPE-110 and drafted by the main session on 2026-10-10. Re-scoped jointly with REQ-PIPE-163 by delivery-scoper,
    2026-10-13 - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182 with the Child Protection pattern widening (Keith,
    2026-10-13: close out the calendar group before the road-testing review; scope 163 WITH 179 so 179 does not amend a requirement
    that may change under it). OWN delivery-scoper pass, 2026-10-14 (Keith asked for one before signing): docs/drafts/calendar-close-out/req-179-own-pass.md.
    Keith answered that pass''s four questions 2026-10-14 (all option A); folded by delivery-scoper the same day, TS-63 moving
    to REQ-GEN-218.'
  acceptance_criteria:
  - THE SYSTEM SHALL let a participation version - a dataset's, or a collection's participation_defaults version - state an
    effective_to date, the last day it governs on the data asset's clock, inclusive.
  - IF a participation version states effective_to without turned_off_reason, or turned_off_reason without effective_to, THEN
    THE SYSTEM SHALL reject the configuration; and WHERE such a version states reason in place of turned_off_reason, the refusal
    SHALL say that turned_off_reason is the key for a turn-off, reason being the explanation for owing only some periods.
  - THE SYSTEM SHALL treat a dataset as turned off on a date WHERE its own latest participation version starting on or before
    that date states an effective_to before it, or WHERE its collection's latest participation_defaults version starting on
    or before that date states an effective_to before it and the dataset has no version of its own whose effective_from falls
    after that effective_to and on or before the date.
  - WHILE a dataset is turned off on a period's date, THE SYSTEM SHALL treat it as owing nothing in that period, and SHALL
    keep the dataset and its configuration in contract/calendar.yaml.
  - WHERE no later version follows an effective_to, THE SYSTEM SHALL treat the dataset as turned off from then on, with no
    end.
  - WHERE a dataset's own participation version takes effect inside its collection's turned-off gap, THE SYSTEM SHALL treat
    that dataset alone as owing again from that version's effective_from, the rest of the collection staying off; and a later
    collection version SHALL NOT end a dataset's own turn-off.
  - WHILE a collection is turned off, THE SYSTEM SHALL take none of its participation values for any dataset, so that a dataset
    bringing itself back on states its own due time and grace (REQ-PIPE-110 criterion 29); and IF a dataset's own version
    taking effect inside its collection's turned-off gap leaves unstated any participation value its collection supplied it
    on the day before the gap, THEN THE SYSTEM SHALL reject the configuration, naming the dataset, each value and the collection's
    last value for it, and saying to state it.
  - THE SYSTEM SHALL decide whether a dataset owes a period from the participation in force on that period's date, and SHALL
    NOT decide it from the period's due date or from any supply's receipt date.
  - IF effective_to is earlier than its own version's effective_from, falls on or after the next version's effective_from
    at the same level, or leaves a gap before a later version that contains no period of the dataset's calendar - at collection
    level, of any inheriting dataset's calendar - THEN THE SYSTEM SHALL reject the configuration, naming the dataset or collection
    and the version, which rule it broke and the date to change; and THE SYSTEM SHALL accept a permanent turn-off even where
    the calendar has no period after its effective_to.
  - 'THE SYSTEM SHALL exclude effective_to and turned_off_reason from REQ-PIPE-110''s restate rule and from inherit: each
    belongs to the one version that states it.'
  - THE SYSTEM SHALL treat a change to effective_to - adding it, moving it or removing it - as an ordinary edit only where,
    for every dataset and period whose owed-or-not status the change flips, that period's earliest claim-opening instant has
    not yet passed - that instant computed, for a period inside a gap, with the inputs criterion 14 uses, and taken as the
    earlier of its values under the configuration before and after the change - and SHALL otherwise require a declared correction
    (REQ-PIPE-111), the refusal naming each period whose status the change flips and the claim-opening instant that has passed
    for it, and printing `mothman schedule draft-correction` on a line of its own.
  - THE SYSTEM SHALL freeze turned_off_reason together with its effective_to, and SHALL require a declared correction for
    any change to it after that freeze, a change of wording included.
  - THE SYSTEM SHALL generate no slot for a dataset in a period it owes nothing in by being turned off.
  - THE SYSTEM SHALL close the last owed slot before a turned-off gap at the claim-opening instant the next calendar period
    would have had for that dataset, each of its values resolved across levels as if every effective_to on or before that
    period's date were absent; and WHERE there is no next calendar period, as REQ-PIPE-131 criterion 16 closes the last authored
    period.
  - WHEN a supply arrives for a dataset, THE SYSTEM SHALL apply the filing rule against the slots of the periods the dataset
    owes, so that a supply finding an owed slot open at its receipt instant files there - late where past its due instant,
    as a resupply where the slot is filled - whether or not the dataset is turned off on its receipt date.
  - WHERE no owed slot is open at a supply's receipt instant and the calendar period whose slot would then be current - computed
    with criterion 14's inputs - is one the dataset is turned off in, THE SYSTEM SHALL receive the supply, record it and run
    its file checks, and SHALL hold it under REQ-PIPE-064's assignment-rule hold, recording as history a structured reason
    naming the effective_to, the turned_off_reason and the level that turned it off.
  - WHERE criterion 16 applies to a supply and its dataset's schedule has also ended (REQ-PIPE-154 criterion 1), THE SYSTEM
    SHALL label the hold turned off rather than schedule ended.
  - THE SYSTEM SHALL work out a held supply's label - turned off, schedule ended, or the plain assignment-rule hold - and
    its advice and responses from the configuration in force when they are read, for display, for re-filing, for the processing
    pass's tally, for the dashboard's backlog line and for every count, and SHALL keep the reason recorded when the hold was
    raised as history only.
  - WHEN configuration later gives any outstanding assignment-rule hold's receipt instant an open owed slot, whatever its
    label, THE SYSTEM SHALL file it by the rule on the next processing pass, through REQ-PIPE-163 criterion 40's one shared
    placer, generalising REQ-PIPE-154's schedule-ended re-file rather than adding a second re-filer, and SHALL leave every
    other hold for a person to place (REQ-PIPE-163) or reject, except a schedule-ended hold, which offers only adding dates;
    and WHERE the hold is one file of a held contested pair, SHALL re-file both files together, still contested (REQ-PIPE-163
    criterion 37).
  - THE SYSTEM SHALL NOT let any supply be placed (REQ-PIPE-163), re-filed (REQ-PIPE-141), moved by a confirmed correction
    or carried out from a parked move (REQ-PIPE-170 criteria 7 and 26) into a period inside a turned-off gap; and a refusal
    SHALL name the gap and its turned_off_reason and say that changing effective_to or effective_from in contract/calendar.yaml
    is how a period becomes owed; for a placement this SHALL be the one refusal given, in place of REQ-PIPE-163 criterion
    7's rather than beside it; and THE SYSTEM SHALL amend, in the same change, REQ-PIPE-141 criterion 12 so that for a period
    inside a turned-off gap this refusal is given in place of its un-inherit advice.
  - IF a not_expected entry - a dataset's own - names a period inside a turned-off gap that applies to that dataset, whether
    the turn-off is its own or its collection's, THEN THE SYSTEM SHALL reject the configuration, naming the dataset, the not_expected
    entry's period, the gap (the effective_to it follows and the effective_from that ends it, or 'for good'), the level that
    turned it off and its turned_off_reason, and saying to remove the entry - by a declared correction (REQ-PIPE-111) where
    the entry is frozen.
  - THE SYSTEM SHALL treat a turned-off period as REQ-PIPE-098's inheritance treats a period the dataset does not participate
    in, so that the dataset's last promoted supply stands in it.
  - THE SYSTEM SHALL keep counting among the states needing a person (REQ-PIPE-064 criterion 5, REQ-PIPE-132 criterion 10)
    every item about a period the dataset owed - any period outside a turned-off gap - an open late slot, a supply on an owed
    period waiting for a person's decision (red included), a slot closed unfilled, a promoted supply listed as 'Promoted,
    then re-checked <verdict>' (REQ-PIPE-164) - until it is resolved, whether or not the dataset is turned off; a promoted
    red supply counts as resolved for this purpose and keeps its red-promoted badge on the dataset.
  - THE SYSTEM SHALL NOT count a supply held as turned off among the states needing a person - in the pipeline, the terminal's
    queue or the dashboard - and SHALL amend, in the same change, REQ-PIPE-064 criterion 5 to except it.
  - THE SYSTEM SHALL leave a dataset turned off for good out of the runway minimum and the exhausted-schedule list, and for
    a dataset in a temporary gap SHALL count towards its runway only the periods it owes once it is turned back on.
  - THE SYSTEM SHALL count turned-off holds separately in the processing pass's summary, as REQ-PIPE-154 criterion 6 counts
    schedule-ended holds.
  - 'THE SYSTEM SHALL resolve participation through one helper that returns, for a dataset on a date, one of: not yet owing;
    turned off, with its turned_off_reason, the level that turned it off and the last applying version''s resolved timing;
    or the values REQ-PIPE-181 criterion 2 resolves for that date, each with its level - the one resolution function REQ-PIPE-181
    names - and SHALL route every consumer of participation through it.'
  - 'THE SYSTEM SHALL show, in the terminal''s Calendar entry (REQ-PIPE-169) and in `mothman schedule show --dataset <id>
    --on <date>` (REQ-PIPE-181''s one renderer), for a dataset with an effective_to: the level that turned it off, and for
    a dataset back on inside its collection''s gap, that its own version brought it back; the date it is turned off after
    and its reason; which periods it still owes and until when their slots stay open; which periods it owes nothing in and
    whether the turn-off is permanent; and the instant until which the turn-off can be changed by an ordinary edit.'
  - WHILE a dataset is turned off on the date asked about and owes no period whose slot is still open, THE SYSTEM SHALL show
    'Turned off - nothing due', and SHALL show the due time and grace of its last version only labelled 'when last on'; and
    WHILE its last owed slot before a turn-off has closed and its effective_to has not yet passed, SHALL show 'Turning off
    after <effective_to> - nothing more owed'.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-111 criterion 2 to give effective_to and turned_off_reason their
    own freeze point as criterion 11 of this requirement states, and to count a turned-off dataset in a dated calendar entry's
    freeze only for the first period of its gap; criterion 4 to add effective_to and turned_off_reason to what a dataset's
    or collection's corrections cover; and criterion 15 to name mark-as-not-supplied (REQ-PIPE-132) as the after-the-fact
    route for an effective_to as it does for not_expected.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-113 criteria 2 and 4 and REQ-PIPE-131 criteria 1 and 2 so that a
    slot's inputs and closing instant follow criterion 14 of this requirement around a turned-off gap; and REQ-PIPE-134 criterion
    1 so that the overlap gate skips a pair of consecutive periods both inside one turned-off gap, checks the last owed period
    before a gap against the closing instant criterion 14 gives it, and checks that the first owed slot after a temporary
    gap opens after the last owed slot before it closes.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-154 criteria 1, 2, 6 and 7 so that turned off outranks schedule ended
    and every label they read is the one criterion 18 works out; REQ-PIPE-064 criterion 8 likewise; REQ-PIPE-098 criterion
    1 to name a turned-off period beside one the dataset does not participate in; and REQ-PIPE-053 criteria 10 and 15 so that
    a dataset turned off for good is neither warned about nor counted; each amending the text as REQ-PIPE-181 left it.
  - THE SYSTEM SHALL read all of this from committed configuration and recorded facts, and SHALL NOT read supply rows to decide
    it.
  - THE SYSTEM SHALL list supplies held as turned off in the terminal's queue in a quiet last group, 'Received while turned
    off (N)', N counting supplies, after the slot rows and outside the count of supplies waiting on a decision, as ONE ROW
    PER DATASET reading '<dataset> - <n> received while turned off, earliest <date>', the receipt date of its earliest such
    supply, which opens to list that dataset's supplies, each saying 'Received while <dataset> is turned off (<reason>, set
    for <level>). Place it into a period it still owes, reject it, or change effective_to/effective_from in contract/calendar.yaml
    if this period should be owed.'
  - WHEN a declared correction changes effective_to, THE SYSTEM SHALL propose the filing moves that result through REQ-PIPE-170's
    confirmation, a supply left in a period inside the new gap becoming a turned-off hold.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-170 criteria 5 and 28 so that IF a corrected configuration makes
    a supply's current period one its dataset owes nothing in - by participation, not_expected or a turn-off - THEN keep is
    not offered for that supply, neither when the correction's moves are confirmed nor later while its move is parked, and
    the correction proposes moving it to the owed slot the filing rule gives it or holding it, saying that the period no longer
    owes a supply.
  - IF a parked move's confirmed period lies inside a turned-off gap when its blocker clears, THEN THE SYSTEM SHALL leave
    the move parked, say so naming the gap, its turned_off_reason and what ends it - keeping the supply where it is, where
    criterion 36 still allows that, or changing effective_to or effective_from in contract/calendar.yaml - and list it among
    the states needing action, as REQ-PIPE-170 criterion 27 does for a supply no longer where it was parked from; and THE
    SYSTEM SHALL amend, in the same change, REQ-PIPE-170 criterion 26 to except such a move.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-173 criterion 12 so that a judged period which an effective_to added
    or moved without a declared correction now leaves owed nothing counts as changed, as one a not_expected entry declares
    owed nothing does - the refusal naming the turn-off rather than calling the period not expected - and is accounted for
    only by a declared correction of that effective_to.
  - 'THE SYSTEM SHALL NOT plant TS-63 in the change that builds this requirement: TS-63 - a Child Protection dataset turned
    off for a while, declared as a correction - is planted by REQ-GEN-218, built after REQ-DASH-180 (Keith, 2026-10-14, own
    pass Q1). This criterion keeps its number, as criteria 40 and 41 keep theirs, because signed REQ-PIPE-163, REQ-PIPE-170
    and REQ-PIPE-181 cite this requirement''s criteria by number.'
  - 'IF a participation version - a dataset''s, or a collection''s participation_defaults version - states effective_to and
    none of its changelog entries carries turns_off: true, or IF any changelog entry in contract/calendar.yaml carries turns_off
    with a value other than true, THEN THE SYSTEM SHALL reject the configuration, naming the dataset or collection and the
    version by its effective_from, and printing a ready-to-paste changelog entry - date, author, change and turns_off: true
    - on lines of their own.'
  - 'THE SYSTEM SHALL take the date a turn-off was authored as the date of the newest declared correction (REQ-PIPE-111) that
    set or moved that version''s effective_to, where there is one, and otherwise as the date of the newest changelog entry
    on that version carrying turns_off: true; and SHALL carry, for every participation version stating effective_to, its effective_to,
    its turned_off_reason, its level and the date it was authored into what the dashboard build reads, for REQ-DASH-180 criteria
    27 and 28.'
  non_functional_requirements:
  - 'A SHAPE CHANGE WITH MANY CONSUMERS - enumerate them mechanically and route each through the one helper (criterion 27).
    Found by delivery-architect, 2026-10-10: schedule.periods_for_dataset, slots.slots_for_dataset and _calendar_periods,
    period_overlap.overlaps_for, runway.calendar_runway, exhausted_datasets and schedule_ends_on, filing.final_period_for,
    assignment.schedule_ended, supply_holds.reason_for/describe/responses/Tally, schedule_ended.refile_covered, inheritance._does_not_participate,
    slots.is_owed_supplies, validate_schedule._expects_nothing_errors, dashboard/embed_dashboard_data.py, cli/schedule.py,
    dataset_blockers.py and both pipeline/build_*_dashboard_data.py. supply_holds.SCHEDULE_FILE hardcodes a configuration
    path and must read the agreement value instead. _version_in_force''s fallback to the first version must never apply to
    participation. RE-ENUMERATED 2026-10-13 (delivery-scoper, by grep for participation_on, resolved_versions, participates,
    is_owed, .expected, periods_for_dataset and not_expected): built since that list and missing from it - agreement_drift
    (REQ-PIPE-173), agreement_freeze.flatten (REQ-PIPE-111), participation_view (REQ-PIPE-181), verdict (REQ-PIPE-168), correction_trial
    and correction_apply (REQ-PIPE-170), settlement''s hold judgement (REQ-PIPE-193 criterion 11), cli/env.py, and both generators
    (generate_runs.py, generate_cp_runs.py), which read a dataset''s periods to decide what to generate - a turned-off gap
    generates no supply the dataset owes - the whole-delivery generator still writes the dataset''s file into each gap delivery,
    which is received and held as turned off (architect E21). Re-run the grep at build time rather than trusting either list.'
  - 'No false quiet: a turn-off never hides anything about a period that was owed. That is the line every criterion here is
    held to, because a turn-off read as ''ignore it'' is the way an overdue supply would go unnoticed.'
  - Config only for every rule about what is owed; no supply rows.
  - 'PERFORMANCE: the helper is called per dataset per date by every consumer, so it works from REQ-PIPE-110''s one agreement
    value and never re-reads the file; a dashboard build over thirty datasets and years of daily periods stays within its
    existing time.'
  - 'AUDITABLE: every effective_to and turned_off_reason sits on a version with a structured changelog entry (REQ-PIPE-110),
    and the entry that turns a dataset off says so in a validated field, turns_off: true (criterion 40), so who turned a dataset
    off, when and why can be filtered rather than read from prose; changes after the freeze are declared corrections with
    an approver. ACCEPTED (F9): the changelog line is not frozen, so the date the foreshadow marker starts from is authored
    text rather than a recorded event.'
  - 'TEST FIRST: each criterion that guards against a false quiet - criteria 14, 15, 16, 18 and 23 above all - gets a test
    written first and seen to fail, because a turn-off that hides an owed period looks exactly like one that works.'
  - 'SECURITY: turned_off_reason is free text from configuration and is rendered as text, never as markup, everywhere it is
    shown; turns_off accepts only true (criterion 40).'
  - 'FAIL LOUD: where participation cannot be resolved for a dataset and date - a configuration error, a version missing -
    every consumer stops with the configuration error; none falls back to treating the dataset as owing, or as turned off.'
  - 'SCALE: a collection is turned off by one edit however many datasets inherit from it (Keith, Q-F); every count of turned-off
    holds is one line per label; and the terminal''s quiet group lists one row per dataset, opening to its supplies, so a
    supplier still sending daily files after a turn-off adds one row, not 365 a year (Keith, 2026-10-14, own pass Q3; criterion
    34).'
  - 'PRIVACY: a supply held as turned off is staged and kept like any held supply until a person places or rejects it (Keith,
    2026-10-14, own pass Q4). Harmless on synthetic data; in a real deployment those are records the agency asked the supplier
    to stop sending, and how long they are kept, and whether anything purges them, is plans/running-thoughts.md #77''s retention
    question, not decided here.'
  - 'AMENDMENTS NOBODY ELSE STATES get tests of their own in this build: REQ-PIPE-111 criterion 15''s after-the-fact route
    for an effective_to, all three clauses of REQ-PIPE-134 criterion 1, REQ-PIPE-141 criterion 12''s narrowing and REQ-PIPE-170
    criteria 5, 26 and 28.'
  - 'PER DEPLOYMENT: a turn-off lives in one asset''s own contract/calendar.yaml and is read by that deployment alone; nothing
    here reads across assets.'
