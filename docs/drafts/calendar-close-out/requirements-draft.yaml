    close as drafted (an overdue last period would go quiet the moment the miss became real).'
  - 'A SUPPLY HELD AS TURNED OFF DOES NOT NEED A PERSON; IT SHOWS AS A QUIET COUNT (Keith, 2026-10-10, T3, option A, recommended
