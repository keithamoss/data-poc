    names who decided. Criterion 10 maps each to _manifest''s ''person'' or ''rule'' when comparing the two. REJECTED ''rule''
    or ''person'' only, as _manifest says (REQ-PIPE-130 criterion 5).'
  - 'PAGE WEIGHT MEASURED AND REPORTED, NO BUDGET (Keith, 2026-10-14, follow-up F15, option A, the recommendation): criterion
    11. REJECTED setting a budget now.'
  - 'SHOULD (Keith, 2026-10-14, follow-up F14, option B): REQ-PIPE-211 is must; this requirement and REQ-PIPE-210 are should.'
  - 'FOLDED 2026-10-14 (delivery-scoper, Keith''s follow-up answers F1 to F4, F14 and F15): criteria 1, 3 and 10 reworded,
