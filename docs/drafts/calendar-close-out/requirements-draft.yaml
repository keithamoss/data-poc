- id: REQ-DASH-208
  title: A scenario link from the test-scenarios panel lands with what the scenario is about in view
  date_written: '2026-10-14'
  story: As Keith showing someone a scenario from the test-scenarios panel, I want its link to land with the thing the scenario
    is about on screen, so that I am not scrolling below the fold to find the quoted text while they watch.
  moscow: should
  status: not_started
  source: 'plans/post-build-review.md #174 (REQ-GEN-199''s first bootstrapped build, overnight 2026-10-13: six quoted texts
    open below the fold at 1280x800 - TS-75a, TS-75b, TS-77b and TS-78a in the as-at panel, TS-76 and TS-77a in the substitution
    drill-down). PROPOSED by the round 3 dashboard UX review (finding 14, option A) and drafted by delivery-scoper overnight
    2026-10-13 to 14 while Keith was asleep; not yet reviewed as a requirement of its own.'
  acceptance_criteria:
  - WHEN a scenario link (REQ-GEN-201) is followed from the test-scenarios panel, THE SYSTEM SHALL scroll the page so that
    the element the scenario is about is in the viewport, and SHALL move focus to it, as drillToPeriod brings a period into
    view.
  - THE SYSTEM SHALL name each scenario's subject semantically in its placement record - the as-at panel, the verdict line,
    the substitution drill-down, the standing-in pill or a supply-history row - and SHALL NOT name it by a CSS selector or
    a pixel offset.
  - WHERE the subject is inside a collapsed section of supply history, THE SYSTEM SHALL expand that section before scrolling
    to it.
  - THE SYSTEM SHALL mark the subject with a static accent border until the reader next scrolls or navigates, and SHALL NOT
    animate it, scrolling instantly where the reader's system asks for reduced motion.
  - WHEN the page is reloaded after a jump, THE SYSTEM SHALL open at the top as any reload does, the jump not surviving the
    reload.
  - 'THE SYSTEM SHALL amend, in the same change, REQ-GEN-199 criterion 36 so that each quoted text is asserted inside the
    viewport once the jump has brought it there, rather than inside the initial viewport without scrolling, and SHALL remove
    each strict expected failure naming post-build-review #174 as its text comes into view.'
  - IF a scenario's subject is not on the page on its link's date, THEN THE SYSTEM SHALL leave the page at the top and SHALL
    NOT scroll to a different element.
  non_functional_requirements:
  - 'ORDER: built before REQ-GEN-205''s and REQ-GEN-206''s bootstraps, so their new chips are written against a jump that
    works (dashboard UX 14).'
  - 'SCALE: the subject is named per scenario, so the panel''s growth (thirty-odd scenarios today) adds records, not code
    paths.'
  - 'ACCESSIBILITY: focus moves to the subject so a keyboard or screen-reader user lands where a sighted one does; no animation
    (criterion 4).'
  - 'NO NEW ASSET: template JavaScript and CSS only; the file:// and offline viewing paths are unaffected.'
  dependencies:
  - REQ-GEN-201
  - REQ-GEN-199
  - REQ-GEN-045
  decisions:
  - 'A PAGE FIX, NOT A LOOSER TEST (REQ-GEN-199 criterion 37; post-build-review #174): the six below-the-fold texts are findings
    against the page, carried as strict expected failures. REJECTED accepting below-the-fold and loosening the assertion.'
  - 'THE CRITERION NUMBER IS 36, NOT 34 (delivery-scoper, 2026-10-14): post-build-review #174 cites REQ-GEN-199 ''criterion
    34''; in the register the viewport assertion is criterion 36 and its ''a finding against the page'' rule is criterion
    37 (34 is the as-at test''s date source).'
  - 'THE SHAPE (dashboard UX 14, PROPOSED): subject named semantically (a), collapsed history expanded (b), a static accent
    border with no animation (c), a reload lands at the top with the jump state in history.state (d), REQ-GEN-199''s assertion
    reworded (e). Criterion 5 is written to the review''s recommendation on Set B Q1.'
  open_questions:
  - 'SET B Q1 - SHOULD THE JUMP SURVIVE A RELOAD? Recommended (A): no - a reload opens at the top, as every reload does, the
    jump state kept in history.state only (criterion 5 is written to this). (B) yes - the subject carried in the URL''s query
