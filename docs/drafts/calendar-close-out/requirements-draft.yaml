  decisions:
  - 'BUILT ON THE EXISTING MACHINERY (Keith, 2026-10-04, REQ-GEN-136): the register in plans/supply-model.md, REQ-GEN-044''s
    injection table, REQ-GEN-045''s map and REQ-GEN-135''s scripts. EVERY SHAPE OF THE BATCH GETS A PLANTED SCENARIO (Keith,
    2026-10-04) - so a shape is dropped only by Keith''s decision, never quietly.'
  - TS-42 IS REQ-GEN-203's (Keith, 2026-10-13, widen one Child Protection pattern), and is not repeated here.
  - 'KEITH LEFT TS-48, TS-49 AND TS-51 OUT OF REQ-GEN-183..186 (Keith, 2026-10-11, question 4, recorded on REQ-GEN-184: ''OUT
    OF SCOPE: Child Protection''s cross-table outcomes TS-48, TS-49 and TS-51 ... They need named red targets and referential
    closure across six tables''). Asked again in open question 1 rather than assumed either way.'
  - 'TS-52 BY A POST-GENERATION PLACEMENT, NOT AN INJECTION: its register entry already says the ordinary history produces
    it - Case Workers files arrive in every delivery and are held where cp-case-workers does not deliver (TS-33a, REQ-PIPE-131)
    - and ''an injection would record a placement for what is already there''. REQ-GEN-199 built the writer for that (inheritance_placements,
    delivery-architect B4) for TS-79.'
  - 'REQ-GEN-137 CRITERION 5''s BLOCKER IS GONE: its unmet ''why'' says the script has no field for the period stood on; REQ-GEN-200
    added stands_on, and TS-76 and TS-77a now substitute onto an earlier promoted supply (REQ-GEN-199). TS-76 is the proposed
    carrier because its substitution stands for eleven weeks with a link already on 17 February 2025.'
  - 'NO PERIOD HOLDS ALL THREE KINDS TODAY: TS-77''s substitution was replaced and TS-76''s removed, and both sit in quarters
    cp-case-workers delivers in. TS-55 needs a substitution that still stands at the end of the history in a quarter cp-case-workers
    inherits in (a May or November quarter). REQ-GEN-137''s NFR that ''no dataset declares'' a non-participating period is
