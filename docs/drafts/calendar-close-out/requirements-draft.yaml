- id: REQ-DASH-208
  title: A scenario link from the test-scenarios panel lands with what the scenario is about in view
  date_written: '2026-10-14'
  story: As Keith showing someone a scenario from the test-scenarios panel, I want its link to land with the thing the scenario
    is about on screen, so that I am not scrolling below the fold to find the quoted text while they watch.
  moscow: should
  status: not_started
  source: 'plans/post-build-review.md #174 (REQ-GEN-199''s first bootstrapped build, overnight 2026-10-13: six quoted texts
    open below the fold at 1280x800 - TS-75a, TS-75b, TS-77b and TS-78a in the as-at panel, TS-76 and TS-77a in the substitution
    drill-down). PROPOSED by the round 3 dashboard UX review (finding 14, option A) and drafted by delivery-scoper overnight
    2026-10-13 to 14 while Keith was asleep; not yet reviewed as a requirement of its own.'
  acceptance_criteria:
  - WHEN a scenario link (REQ-GEN-201) is followed from the test-scenarios panel, THE SYSTEM SHALL scroll the page so that
    the element the scenario is about is in the viewport, and SHALL then move focus to it without scrolling again (focus with
    preventScroll), as drillToPeriod brings a period into view.
  - THE SYSTEM SHALL name each scenario's subject semantically in its placement record - the as-at panel, the verdict line,
    the substitution drill-down, the standing-in pill, a supply-history row, or the period-composition view's table once REQ-DASH-209
    adds it (REQ-DASH-209 criterion 7) - and SHALL NOT name it by a CSS selector or a pixel offset.
  - WHERE the subject is inside a collapsed section of supply history, THE SYSTEM SHALL expand that section before scrolling
    to it.
  - THE SYSTEM SHALL mark the subject with a static left rule in the accent colour, as the arrival notice (.arrival-notice)
    carries, and a text label reading '<scenario id> · in place on <date>', kept until the reader navigates away or changes
    the date on show; SHALL NOT mark it with the 2px accent outline, which is this page's focus ring, nor animate it; and
    SHALL scroll instantly where the reader's system asks for reduced motion.
  - WHEN a scenario jump is made, THE SYSTEM SHALL carry the scenario's id in the URL of the history entry the jump creates,
    as a query parameter named scenario holding the id in lowercase (docs/spa-best-practices.md section A), and WHEN a page
    is loaded or reloaded with that parameter, SHALL repeat the jump once the page has rendered - expanding, scrolling to,
    focusing and marking the subject as criteria 1 to 4 say - and SHALL show the scenario jump bar. (NEW WORDING - for Keith's
    approval.)
  - 'THE SYSTEM SHALL amend, in the same change, REQ-GEN-199 criteria 36 and 37 so that each quoted text is asserted inside
    the viewport once the jump has brought it there, and again after a cold reload of the jump''s URL, rather than inside
    the initial viewport without scrolling, and SHALL remove each strict expected failure naming post-build-review #174 as
    its text comes into view.'
  - IF a scenario's subject is not on the page on its link's date, THEN THE SYSTEM SHALL leave the page at the top, SHALL
    say so in one line in the page's stale-link notice (.stale-link-notice, as forgetStaleSegment does for a link segment
    that no longer resolves), naming the scenario and the date, and SHALL NOT scroll to a different element.
  - WHEN the reader navigates from the page a jump landed on, changes the date on show by any means, or chooses 'Back to today'
    on the scenario jump bar, THE SYSTEM SHALL leave the scenario parameter out of the new URL and SHALL clear the jump from
    the page's state - its jump bar and its mark - so that the jump does not follow the reader to another page or another
    date.
  - IF the scenario parameter names a scenario the test-scenarios panel does not hold, or one whose subject is not on the
    page at the date in the URL, THEN THE SYSTEM SHALL open the page at the top, show no jump bar for it, say so in one line
    in the stale-link notice as criterion 7 does, remove the parameter with replaceState, and log no console error.
  - THE SYSTEM SHALL make each scenario chip in the test-scenarios panel a real link (<a href>) whose address carries the
    scenario's date as the existing in-place-on parameter and its id as the scenario parameter (criterion 5); WHEN a chip
    is clicked with the primary button and no modifier key, THE SYSTEM SHALL make the jump in the page without a full reload,
    as clicking the chip does today, and SHALL leave every other click - a modifier key held, a middle click - to the browser,
    so that open in a new tab and copy link work (docs/spa-best-practices.md section D).
  - THE SYSTEM SHALL read the scenario parameter's name case-insensitively, SHALL match its value case-insensitively against
    the ids the test-scenarios panel holds before any use, and SHALL NOT use an unmatched value in a selector, a lookup or
    the page's markup.
  - WHEN the reader returns by Back or Forward to a history entry a scenario jump created, THE SYSTEM SHALL restore that entry's
    date on show, and SHALL NOT scroll the page or move focus again.
  non_functional_requirements:
  - 'ORDER: built before REQ-GEN-205''s and REQ-GEN-206''s bootstraps, so their new chips are written against a jump that
    works (dashboard UX 14).'
  - 'SCALE: the subject is named per scenario, so the panel''s growth (thirty-odd scenarios today) adds records, not code
    paths.'
  - 'ACCESSIBILITY: focus moves to the subject without a second scroll, so a keyboard or screen-reader user lands where a
    sighted one does; the mark is a labelled rule rather than colour alone, and is never the focus ring; no animation (criteria
    1 and 4).'
  - 'NO NEW ASSET: template JavaScript and CSS only; the file:// and offline viewing paths are unaffected.'
  - 'URL HYGIENE (docs/spa-best-practices.md sections A to C): one optional, order-independent query parameter, read case-insensitively,
    beside the existing in-place-on parameter; the jump''s own history entry is pushed as today, any navigation or date change
    drops it, and corrections to the URL on a stale parameter use replaceState so Back is not polluted.'
  - 'ROBUSTNESS: a URL is input from whoever sends the link, so the parameter is matched against the panel''s own ids before
    any use, and only the matched record is used (criterion 11).'
  dependencies:
  - REQ-GEN-201
  - REQ-GEN-199
  - REQ-GEN-045
  decisions:
  - 'A PAGE FIX, NOT A LOOSER TEST (REQ-GEN-199 criterion 37; post-build-review #174): the six below-the-fold texts are findings
