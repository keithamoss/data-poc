requirements:
- id: REQ-GEN-207
  title: The Child Protection history is grown earlier, once, by as many quarters as the batch's planned scenarios need, with
    every existing quarter unchanged
  date_written: '2026-10-14'
  story: As Keith adding scenarios to Child Protection's synthetic history, I want it to start earlier by as many quarters
    as the planned scenarios need, so that each new scenario has a quarter of its own without moving any scenario already
    planted and quoted.
  moscow: must
  status: not_started
  source: PROPOSED by the round 3 architect review (2026-10-14, Q1 option A), following Keith's own call of 2026-10-13 to
    grow the Child Protection history earlier for TS-63 (REQ-PIPE-179). Drafted by delivery-scoper overnight 2026-10-13 to
    14 while Keith was asleep; not yet reviewed as a requirement of its own.
  acceptance_criteria:
  - THE SYSTEM SHALL add Child Protection quarters before 2023-Q1 at the old end - dated entries in the quarterly calendar,
    and versions of the collection's participation_defaults and of each dataset's participation taking effect from the first
    added quarter - as Birth Registrations' history was grown (REQ-GEN-196), each with a changelog line saying why.
  - THE SYSTEM SHALL size the growth by a dry run of the generator's collision refusal over every scenario this batch plans
    - TS-42 and TS-80 (REQ-GEN-203), TS-57 to TS-62 (REQ-GEN-205), TS-63 (REQ-PIPE-179), TS-50 and TS-55 (REQ-GEN-206) - adding
    the fewest whole years that leave the dry run with no refusal, and SHALL record the count and the dry run's output in
    this requirement's evidence.
  - THE SYSTEM SHALL count the period a scenario's substitution stands on (stands_on) as claimed by that scenario under REQ-GEN-044's
    collision rule, so that 2023-Q1, which TS-77a stands on, is no longer read as free.
  - THE SYSTEM SHALL leave every existing Child Protection quarter's generated deliveries byte-identical - drawing the added
    quarters' run plan, seeds and slots separately from the existing fifteen - so that every planted scenario, the characterization
    pin (tests/fixtures/arrival_semantics_golden.json) and every quoted register text stay as they are, and SHALL keep TS-79b
    on the quarter it names today rather than the new oldest inherited quarter.
  - THE SYSTEM SHALL add, in the same change, amber_setting and replacement_setting versions taking effect on or before the
    earliest claim-opening instant of the first added quarter, carrying the values today's 2023-01-01 versions carry, so that
    no grown supply meets a setting with no version in force.
  - THE SYSTEM SHALL record, in the register beside the scenarios placed in grown quarters, that checks introduced on 2023-01-15
    did not exist for supplies before that date, and what the page shows for them there as observed on the first bootstrapped
    build.
  - THE SYSTEM SHALL generate the added quarters as ordinary deliveries - the usual six files, whole - and SHALL NOT plant
    any scenario in them in this change.
  - THE SYSTEM SHALL land the growth in a change of its own, before any declared correction edits a grown quarter.
  - THE SYSTEM SHALL measure a bootstrap from empty before and after the growth and log both in CLAUDE.md's running log.
  non_functional_requirements:
  - 'BOOTSTRAP COST: Child Protection replays about 17s a quarter beside Birth Registrations'' ~330s. The architect counts
    about seventeen quarters of demand (A3), not the scoper''s eight, which would take Child Protection to roughly 550s and
    make it the critical path - a bootstrap of about nine to ten minutes (architect E22) against 7m00s on 2026-10-13. The
    dry run (criterion 2) gives the real count; measure rather than estimate.'
  - 'CONFIGURATION ONLY: calendar, participation and setting versions plus generator configuration; every effect is in the
    database.'
  - 'DETERMINISM: seeded, so a regenerate reproduces the grown history; criterion 4 is checked by diffing the existing quarters''
    deliveries before and after.'
  - 'NO SILENCED WARNING: growing earlier leaves the quarterly calendar''s forward runway, and its warning, as they are.'
  dependencies:
  - REQ-GEN-044
  - REQ-GEN-196
  - REQ-PIPE-110
  - REQ-PIPE-111
  - REQ-PIPE-122
  - REQ-PIPE-123
  decisions:
  - 'GROW EARLIER, NOT INTO TODAY''S QUARTERS (Keith, 2026-10-13, architect review answers, for TS-63): REQ-GEN-199 found
    no clean Child Protection quarter left. REJECTED fitting new scenarios among the fifteen.'
  - 'ITS OWN REQUIREMENT, BUILT FIRST, SIZED BY A DRY RUN (architect Q1 option A, PROPOSED - Keith to confirm): four requirements
    need grown quarters (REQ-GEN-203, REQ-GEN-205, REQ-GEN-206, REQ-PIPE-179), so one owner grows the history once. REJECTED
    each growing what it needs (three edits to one calendar''s old end) and REQ-GEN-205 owning it (the scoper''s first recommendation,
    superseded by the architect''s).'
  - 'THE BUDGET WAS UNDER-COUNTED (architect A3): about seventeen quarters of demand, not eight; and the collision rule ignores
    a substitution''s stood-on period, so 2023-Q1 (TS-77a''s) read as free. Criteria 2 and 3.'
  - 'A BLOCKER: SETTINGS HAVE NO DEFAULT (architect A1, verified 2026-10-14): amber_setting and replacement_setting in contract/data-asset.yaml
    start 2023-01-01 and carry no default, so a supply received before then has no setting in force - criterion 5.'
  - 'A BLOCKER: ''NO EXISTING SCENARIO MOVES'' WAS FALSE AS DRAFTED (architect A2, verified 2026-10-14): generator/generate_cp_runs.py
    builds RUN_PLAN from N_QUARTERS = 15 and one seeded shuffle, its seeds and slots run from the oldest quarter and the first
    delivery is kept clean - so adding quarters redraws every existing one, and TS-79b (the oldest inherited quarter) moves.
    Criterion 4 is written to option A of Keith''s question; option B accepts the redraw and recaptures the golden and every
    Child Protection quote.'
  - 'ITS OWN CHANGE, CORRECTIONS LATER (architect A4, verified 2026-10-14): agreement_freeze exempts a newly ADDED version
    or date on a synthetic asset, but a declared correction that changes nothing is refused - so the growth lands alone and
    the corrections of REQ-GEN-205 and REQ-PIPE-179 come in later changes against the grown calendar. Criterion 8.'
  - 'SUGGESTED BUILD ORDER FOR THE WHOLE CLOSE-OUT BATCH (architect, 2026-10-14): this requirement; REQ-PIPE-202; REQ-GEN-203;
    REQ-DASH-204; REQ-DASH-182; REQ-PIPE-163; REQ-PIPE-179; REQ-DASH-180; REQ-GEN-205; REQ-GEN-206 - with REQ-DASH-208 before
    the first of REQ-GEN-205 and 206''s bootstraps (dashboard UX 14).'
  - 'THE RUNWAY WARNING STAYS (Keith, 2026-10-13): ''the point of the warning is to demonstrate the proof of concept of what
    it does''. Growth is at the old end only.'
  open_questions:
  - 'ARCHITECT Q1 - WHO GROWS THE HISTORY, AND DO EXISTING QUARTERS STAY BYTE-IDENTICAL. Recommended (A): this requirement,
    built first and sized by a dry run, existing quarters byte-identical (criterion 4) - no quoted text, golden or scenario
    moves. (B) REQ-GEN-205 owns the growth and the existing quarters are redrawn - the golden, every Child Protection quote
    and any refused placement recaptured. (C) this requirement, but redrawn - simpler generator code, the same recapture cost
    as B.'
- id: REQ-PIPE-202
  title: Child Protection's Client Register recognises its file under more than one name, so two of its files in one delivery
    are a contested pair
  date_written: '2026-10-13'
  story: As Keith showing how one contested table ripples through a collection with cross-table checks, I want Child Protection's
    Client Register to recognise its extract under more than one file name, so that two of its files in one delivery are recognised
    as the contested pair the pipeline already knows how to handle, rather than one supply and one unrecognised file.
  moscow: should
  status: not_started
  source: 'Keith, 2026-10-13, closing out the calendar group (plans/running-thoughts.md, the close-out entry): widen ONE Child
    Protection arrival pattern so TS-42 (REQ-GEN-136 criterion 3) can be planted - a behaviour change with its own requirement,
    superseding REQ-GEN-196''s ''no pattern is widened'' decision. Drafted by delivery-scoper the same evening.'
  acceptance_criteria:
  - THE SYSTEM SHALL declare cp-clients' arrival pattern in contract/data-asset.yaml as `cp_clients(_[^/]+)?\.csv`, matching
    `cp_clients.csv` and every name of the form `cp_clients_<suffix>.csv`, and SHALL leave every other dataset's pattern unchanged.
  - THE SYSTEM SHALL keep TS-38's names - `CLIENTS_EXTRACT_FINAL.csv` and `placements (2).csv` - unrecognised under the new
    pattern, and the arrival-pattern gate (REQ-PIPE-058 criterion 8) SHALL pass against the recorded delivery log after the
    change.
  - WHEN one delivery carries two files the new pattern matches, THE SYSTEM SHALL recognise them as one contested arrival
    of cp-clients (REQ-PIPE-105 criterion 6), staging both and checking neither, through the same recognition Birth Registrations'
    pairs use and with no path specific to Child Protection.
  - WHILE cp_clients is contested for an arrival, THE SYSTEM SHALL raise the contested outstanding item for cp-clients naming
    both files (REQ-PIPE-115 criterion 8), and SHALL record each cross-table check that reads cp_clients, in the runs of that
    arrival's other tables, once as not evaluated, red, with contested as its reason (REQ-PIPE-115 criteria 14 to 16).
  - THE SYSTEM SHALL run the file checks on each file of a Child Protection pair separately, recording each under its own
    filename, and WHERE the load refuses one of them SHALL keep the pair contested (REQ-PIPE-115 criterion 24).
  - WHEN a later arrival's cp_clients file is filed to the pair's period, THE SYSTEM SHALL supersede both files and treat
    the contest as resolved (REQ-PIPE-118 criteria 1 and 13, REQ-PIPE-194 criterion 9), and WHEN that file is promoted SHALL
    re-evaluate the readers waiting in that period through the one knock-on handler (REQ-PIPE-121).
  - THE SYSTEM SHALL let a person settle a Child Protection pair through REQ-PIPE-193's choose-file on exactly the terms a
    Birth Registrations pair is settled, and SHALL have fixture tests, written first, that drive the real Child Protection
    orchestrator to settle one pair as this period's supply plus a spare copy and one as this period's supply plus a re-file,
    asserting each supply's own run id and period and that the readers' cross-table checks are re-evaluated by the knock-on.
  - WHEN Child Protection files are loaded from a folder on any route - the trial (`mothman cp qa --trial`), the Synthetic-mode
    check of a recorded arrival (cli/cp.py run_check) and a trial's reference folder - THE SYSTEM SHALL attribute them by
    arrival pattern as the commit route does, and SHALL leave a contested table out of the load as Birth Registrations' load
    does; and IF any dataset matches no file or several files, THEN SHALL refuse naming the dataset, the files and where the
    pair is settled, and SHALL NOT check either file.
  - 'THE SYSTEM SHALL change, in the same change, every test that pins cp_clients to one exact filename - tests/test_holds.py''s
    test_two_files_for_one_dataset_are_held asserts `cp_clients_2.csv` is unmatched - to assert the reachable shape instead,
    and SHALL add TS-39''s unit test: `cp_clients.csv` beside `cp_clients_part2.csv` is held as contested, never chosen between.'
  - THE SYSTEM SHALL reproduce the arrival-semantics characterization pin (tests/fixtures/arrival_semantics_golden.json) unchanged
    across the change, so that widening the pattern changes no existing arrival's attribution, verdict or instant.
  - THE SYSTEM SHALL say, beside the pattern in contract/data-asset.yaml, that it was widened for the synthetic asset's demonstration
    of a contested Child Protection table and why, and SHALL leave the ODCS contract's arrivalPattern keyPattern unchanged,
    it being a transport value rather than the matcher (REQ-PIPE-058 criterion 4).
  - THE SYSTEM SHALL record, in the same change, a decision on REQ-GEN-196 that its 'BIRTH REGISTRATIONS, NOT CHILD PROTECTION'
    decision was superseded by this requirement, and SHALL update TS-39's and TS-34's register entries in plans/supply-model.md
    - TS-39 now reachable for cp_clients, TS-34 still not, cp_placements' pattern being exact.
  non_functional_requirements:
  - 'CONFIGURATION ONLY: one line of contract/data-asset.yaml plus its comment; recognition, staging, contest detection, settlement
    and supersession are all built and collection-agnostic (arrivals.Arrival.contested, build_cp_warehouses.stage_arrival
    stages every matched file, dataset_blockers, settlement) - verified by reading them 2026-10-13. Choose-file has no Child
    Protection test today (tests/test_choose_file.py names no CP dataset), which is what criterion 7 closes.'
  - 'LOUD, NOT QUIET, BY DESIGN - AND THE COST AT SCALE: after this, any stray `cp_clients_<anything>.csv` sent beside the
    real extract contests the table and turns three readers red (cp_notifications, cp_investigations, cp_placements carry
    referential checks on cp_client_id) until a person settles it or a later file supersedes it. That is the correct direction
    - a quiet choice between files is the false green REQ-PIPE-059 exists to prevent - but it is a real availability cost,
    which is why criterion 11 says this is a demonstration choice for the synthetic asset and not advice for a real Child
    Protection pattern.'
  - 'SECURITY: a widened pattern lets more supplier-controlled names reach recognition. Matching stays re.fullmatch over names
    capped at MAX_FILENAME_LENGTH (the bounded ReDoS residual Keith accepted for REQ-PIPE-058), a filename never reaches a
    SQL identifier (staging uses an ordinal), and every filename shown on the dashboard is rendered as text.'
  - 'PRIVACY: filenames are shown on the dashboard and in the terminal (REQ-PIPE-194). Synthetic names carry nothing; a real
    supplier''s naming could, so this changes nothing about what is shown, only which names are recognised.'
  - 'NO SUPPLY ROWS: everything here is decided from filenames, receipts and recorded results.'
  - 'AUDITABILITY: the pattern is not a frozen agreement item (REQ-PIPE-111 covers contract/calendar.yaml), so its history
    is git''s and the comment''s; a CHANGELOG.yaml entry goes in the same push.'
  dependencies:
  - REQ-PIPE-058
  - REQ-PIPE-105
  - REQ-PIPE-115
  - REQ-PIPE-118
  - REQ-PIPE-121
  - REQ-PIPE-193
  - REQ-PIPE-194
  decisions:
  - 'WIDEN ONE CHILD PROTECTION PATTERN (Keith, 2026-10-13): so TS-42 can be planted. SUPERSEDES REQ-GEN-196''s ''BIRTH REGISTRATIONS,
    NOT CHILD PROTECTION ... No pattern is widened; TS-42 stays not injectable''.'
  - REJECTED widening all six (it would make TS-34 plantable too, but Keith asked for one, and every widened table is another
    table a stray file can contest).
  - 'cp_clients WITH AN UNDERSCORE SUFFIX, `cp_clients(_[^/]+)?\.csv` (DECIDED Keith, 2026-10-13, set 3 Q11, option A): the
    most-read table in the collection, so a contested cp_clients shows the blast radius TS-34 calls the interesting part on
    three readers at once; it owes every quarter, unlike cp-case-workers; TS-12 and TS-38 already use it. The suffix needs
    a separator and keeps TS-38''s names unrecognised, matching Birth Registrations'' own `_` convention. REJECTED a free
    suffix `cp_clients[^/]*\.csv`, and a quieter table such as cp_carers - quiet is the opposite of what TS-42 is for.'
  - 'THE TRIAL ROUTE ATTRIBUTES BY PATTERN TOO (DECIDED Keith, 2026-10-13, set 4 Q14, option A): cli/cp.py''s _require_all_six
    and the trial''s own path list assumed `<table>.csv`, while the commit route attributes by pattern - after the widening
    a folder could commit but not trial. REJECTED keeping exact names for trials.'
  - 'A DEMONSTRATION CHOICE, SAID IN A COMMENT (DECIDED Keith, 2026-10-13, set 4 Q16, option A): the widened pattern is the
    synthetic asset''s, for showing a contested Child Protection table, and the comment beside it in contract/data-asset.yaml
    says so (criterion 11). REJECTED presenting it as the pattern recommended for a real Child Protection supply, where a
    stray suffixed file would contest the table.'
  - 'THE PLANTING IS ITS OWN REQUIREMENT (DECIDED Keith, 2026-10-13, set 3 Q12, option A): REQ-GEN-203 plants TS-42 and TS-80.'
  - 'EVERY CHILD PROTECTION LOAD ROUTE, NOT ONLY THE TRIAL (CLI UX 1, round 3 fold, delivery-scoper, 2026-10-14): cli/cp.py''s
    _load_delivery_from_folder loads f"{table}.csv" after _require_all_six, and run_check and the reference folder go through
    it - so after the widening a Synthetic-mode check of a pair''s arrival would silently check `cp_clients.csv` and never
    its partner, a quiet choice between files. Verified 2026-10-14. Criterion 8 widened from the trial to every route.'
  open_questions:
  - 'CLI UX C - WHAT THE CHILD PROTECTION SYNTHETIC-MODE PICKER SHOWS FOR A PAIR''S ARRIVAL. Recommended (A): list the arrival
    marked ''two files for one table'', and refuse when it is picked, naming both files and where the pair is settled. (B)
    leave the arrival out of the picker. (C) list it unmarked and refuse only on pick.'
- id: REQ-GEN-203
  title: Child Protection's generated history has a contested Client Register pair that a later file supersedes (TS-42) and
    one a scripted person settles (TS-80)
  date_written: '2026-10-13'
  story: As Keith showing what a contested table does to a collection with cross-table checks, I want one Child Protection
    delivery in the synthetic history to carry two Client Register files that a later resend supersedes, and another whose
    two files a person settles, so that I can show the table read contested, its three readers read red for it, and both ways
    the contest ends clear them - on a real page rather than in a test.
  moscow: should
  status: not_started
  source: Keith, 2026-10-13 (widen one Child Protection pattern so TS-42 can be planted). Drafted by delivery-scoper the same
    evening as the planting half of that decision, delivering REQ-GEN-136 criterion 3.
  acceptance_criteria:
  - THE SYSTEM SHALL generate, as registered scenario TS-42, through REQ-GEN-044's injection mechanism, one Child Protection
    delivery in a quarter no other scenario claims, carrying the six usual files plus a second Client Register file, `cp_clients_v2.csv`
    - a re-export whose rows differ from `cp_clients.csv`'s - with the two Client Register files received ten minutes apart,
    both inside the quarter's claim window and before its due time.
  - THE SYSTEM SHALL let each file of an injected Child Protection delivery carry its own receipt instant where the scenario
    states one, as REQ-GEN-196's pairs do for Birth Registrations, and SHALL keep the one shared instant for every injected
    delivery that states none.
  - THE SYSTEM SHALL generate, for the same quarter, a later delivery carrying `cp_clients.csv` alone, received after the
    quarter's due time and before the next quarter's claim window opens, built green (REQ-GEN-184) so the gate's own promotion
    and the knock-on re-evaluation of its readers can be seen.
  - THE SYSTEM SHALL generate only those arrival shapes, and SHALL NOT generate any contest, supersession, verdict or promotion
    the scenario expects (REQ-GEN-044 criterion 6).
  - 'THE SYSTEM SHALL give TS-42 two scenario links (REQ-GEN-201): one on the pair''s arrival day, where cp-clients reads
    ''Two files for one table'' and its three readers'' cross-table checks read contested, and one on the later file''s asset
    day, where the pair''s row reads ''superseded by the supply received <instant>'' (REQ-PIPE-194 criterion 10).'
  - IF TS-42 cannot be placed - its quarter falls outside the generated history or shares a claimed quarter with another scenario
    - THEN generation SHALL refuse before writing anything, naming the scenario, and SHALL NOT drop, shift or relax it.
  - THE SYSTEM SHALL update TS-42's register entry in plans/supply-model.md with its configuration, what it expects and how
    it would break, and SHALL clear REQ-GEN-136's unmet entry for criterion 3, naming this requirement.
  - THE SYSTEM SHALL generate, as registered scenario TS-80, through REQ-GEN-044's injection mechanism, one Child Protection
    delivery in a quarter no other scenario claims, carrying the six usual files plus a stray test file, `cp_clients_TEST.csv`
    - well-formed and loaded, the Client Register's real columns with rows that are plainly test data (every client named
    'TEST', from a fixed seed) - received at 08:20 on the quarter's due day, and the real `cp_clients.csv` at 08:30, both
    before the 09:00 due time.
  - THE SYSTEM SHALL have TS-80's pair settled by a scripted person (REQ-GEN-135) through REQ-PIPE-193's choose-file, at 11:00
    the following day on the asset's clock, as file one (the test file) rejected and file two (the real extract) this quarter's
    supply, naming each file by its receipt position as REQ-GEN-196 criterion 7 does, and SHALL have the QA run and promotion
    gate the settlement owes run in the replay at that instant through the playback hook (REQ-GEN-196 criterion 10).
  - THE SYSTEM SHALL build TS-80's real extract to green (REQ-GEN-184), keyed by its delivery and filename (REQ-GEN-196 criterion
    19), and SHALL NOT target the rejected test file.
  - WHEN the synthetic history is bootstrapped, THE SYSTEM SHALL show on the built dashboard, on TS-80's arrival day, cp-clients
    reading 'Two files for one table' and its three readers' cross-table checks reading contested, and from the settlement's
    asset day the pair's settled row with the test file rejected, the real extract early and promoted, and the readers re-checked
    by the knock-on (REQ-PIPE-121).
  non_functional_requirements:
  - 'BOOTSTRAP COST: three Child Protection deliveries, one settlement''s QA run and the knock-on re-checks they cause. Measure
    a bootstrap from empty before and after (4m42s on 2026-10-13) and log both in CLAUDE.md''s running log, as REQ-GEN-196
    did.'
  - 'NOISE: the pair turns three readers red for one quarter until the later file is promoted; count it in the scenario''s
    register entry so the red is known rather than discovered by someone reading the dashboard cold.'
  - DETERMINISM and loud failure are REQ-GEN-044's, inherited (criteria 3 and 4).
  - 'CONFIGURATION ONLY: the injection and register; every effect lives in the database.'
  dependencies:
  - REQ-PIPE-202
  - REQ-GEN-044
  - REQ-GEN-136
  - REQ-GEN-184
  - REQ-GEN-201
  - REQ-PIPE-193
  - REQ-GEN-135
  - REQ-GEN-196
  - REQ-GEN-207
  decisions:
  - 'THE PATH NO BIRTH REGISTRATIONS SCENARIO SHOWS (delivery-scoper, 2026-10-13): TS-68 to TS-74 are each settled by a scripted
    person; none ends by a later arrival. REQ-PIPE-194 criterion 10''s ''superseded by the supply received {instant}'' row,
    and dataset_blockers counting the rule''s supersession as the end of a contest, have no real page until TS-42 - which
    is why it is resolved by a later file, as REQ-GEN-136 criterion 3 already says, rather than settled.'
  - 'ITS OWN REQUIREMENT (DECIDED Keith, 2026-10-13, set 3 Q12, option A), delivering REQ-GEN-136 criterion 3: the Child Protection
    generator has no per-file receipts for an injected delivery and PairFile is Birth Registrations-only - real generator
    work criterion 3''s one line does not specify. REJECTED building it under REQ-GEN-136 criterion 3 directly.'
  - 'TS-42''s FILES: `cp_clients.csv` PLUS A DIFFERING RE-EXPORT `cp_clients_v2.csv`, LATER SUPERSEDED BY A CLEAN `cp_clients.csv`
    (DECIDED Keith, 2026-10-13, set 4 Q13, option A): two files where nobody can tell which is right and only a later file
    settles it. REJECTED a byte-identical duplicate (TS-68 already shows a duplicate send) and a split extract (TS-39''s unit
    test covers that shape).'
  - 'ONE CHILD PROTECTION PAIR IS ALSO SETTLED BY A SCRIPTED PERSON - TS-80 (DECIDED Keith, 2026-10-13, set 4 Q15, option
    B, against the scoper''s recommendation): settlement is shown seven ways for Birth Registrations, but only Child Protection
    has cross-table readers, so only here can a settlement be seen clearing the readers it turned red. TS-80 is the next free
    scenario id (TS-75 to TS-79 belong to REQ-GEN-199 and its siblings).'
  - 'PROPOSED, NOT KEITH''S - TS-80''s OUTCOME: a stray test file rejected and the real extract this quarter''s supply (TS-71''s
    shape). Chosen because it is the commonest real cause of two files - a test extract sent by mistake - and because it makes
    a supply, so the settlement''s QA run, its gate and the knock-on re-check of all three readers are all on the page. REJECTED
    a spare copy (TS-68''s duplicate, which a later reader cannot tell from TS-42 at a glance) and ''reject both'' (no supply,
    so no knock-on to see). The real extract `cp_clients.csv` sorts before `cp_clients_TEST.csv`, so the chosen file is #1
    by name here; REQ-GEN-196''s TS-68 and TS-70 already exercise the opposite order.'
  - 'PROPOSED, NOT KEITH''S - QUARTERS (corrected 2026-10-14): after REQ-GEN-199 the claimed Child Protection anchors are
    -3 to -12, -14 and -15, and -13 too - TS-67''s early delivery files into 2023-Q3 and REQ-GEN-199 criterion 28 makes that
    a claim, so the earlier suggestion of -13 for TS-42 would be refused. Free today: -15''s neighbourhood none; -2 (2026-Q2)
    and -1 (current) only, plus 2024-Q3 (-9, a red chain) by the scoper''s count. So TS-42 and TS-80 need the Child Protection
    history GROWN EARLIER - REQ-GEN-205''s open question proposes growing it once, by about eight quarters, for TS-42, TS-80,
    TS-63 and TS-57 to TS-61 together.'
  - 'ROUND 3 REVIEWS FOLDED (round 3 fold, delivery-scoper, 2026-10-14): architect A5 (REQ-GEN-207 is a dependency - the one
    growth owner); architect E20 raised as open question 2 rather than amended, being a real fork (Q5).'
  open_questions:
  - 'WHICH QUARTERS - answered by REQ-GEN-207 if Keith takes architect Q1 option A: TS-42 and TS-80 go in quarters the grown
    history adds, sized by its dry run (-13 is NOT free: TS-67 files into it; 2023-Q1 is NOT free either: TS-77a stands on
    it, architect A3).'
  - 'ARCHITECT Q5 - CRITERIA 3 AND 10 SAY ''BUILT GREEN (REQ-GEN-184)'', WHICH THE CHILD PROTECTION GENERATOR REFUSES TODAY
    for a targeted supply without lead-ins (generate_cp_runs.py''s targeting refusal, architect E20). Recommended (A): this
    requirement builds the Child Protection lead-in quarters and targeting the green needs, as REQ-GEN-185 did for Birth Registrations.
    (B) ''built clean'' - an ordinary clean delivery with no target, accepting that its verdict is whatever the draw gives
    and recording it in the register.'
- id: REQ-DASH-204
  title: A dataset turned red by another table's two files says so at the top of its page, naming that table
  date_written: '2026-10-14'
  story: As a data team leader opening a Child Protection dataset that reads red, I want the top of its page to tell me when
    the red comes from ANOTHER table having two files for one table, naming that table, so that I go to the one decision that
    clears it instead of hunting through this dataset's checks for a fault it does not have.
  moscow: should
  status: not_started
  source: 'Keith, 2026-10-13 evening, answering the CLI and dashboard UX reviews of the calendar close-out batch (plans/running-thoughts.md
    #92): ''a reader dataset turned red by ANOTHER table''s contest gets a NEW DASHBOARD REQUIREMENT NOW (a top-of-page line
    naming the contested table), not a later sighting.'' Drafted by delivery-scoper overnight 2026-10-13 to 14 while Keith
    was asleep, so every fork is an open question rather than a decision.'
  acceptance_criteria:
  - WHERE the run the dataset's status is computed from on the date on show includes a cross-table check recorded as not evaluated
    because a table belonging to ANOTHER dataset was contested (REQ-PIPE-115 criteria 14 to 16), THE SYSTEM SHALL show at
    the top of that dataset's page ONE notice in the page's red notice style - after the waiting-blocker banner and before
    the exhausted-schedule banner - holding one line per such table, each beginning, in bold, 'Red because <that dataset's
    display name> has two files for one table' and naming the period.
  - THE SYSTEM SHALL say in that line how many of this dataset's checks read the contested table and could not run, that those
    checks did not fail on this dataset's own data, and that they run again once the pair is settled - 'say what each file
    is' (REQ-PIPE-194 criterion 15) - or a later file supersedes it.
  - THE SYSTEM SHALL NOT word the line so that it says or implies this dataset has nothing else wrong, and SHALL NOT change
    the dataset's status because of it - the line explains the red and never removes it.
  - THE SYSTEM SHALL show one line per contested table however many of the dataset's checks read it, and SHALL NOT show a
    line per check.
  - THE SYSTEM SHALL make the contested dataset's name in the line a real link (<a href>) to that dataset's page at the same
    date on show, built as affectsLinks() builds its links, so that middle-click and copying the link keep the date.
  - THE SYSTEM SHALL judge the line as at the date on show - from the run the dataset's status is computed from on that date
    and the contest's opening and resolving instants on the asset's clock (REQ-PIPE-194 criteria 9 and 14) - and SHALL NOT
    judge it as at the build.
  - WHILE the contest is resolved on the date on show but the run the dataset's status is computed from still carries checks
    not evaluated because of it, THE SYSTEM SHALL say in the line that the pair was settled, or superseded, on <date on the
    asset's clock>, that these checks have not run again since, and what runs them again - a later supply of <dataset> promoted
    into the period, or a person's re-check of this supply (REQ-PIPE-164, once built) - and SHALL NOT say that the red is
    waiting on the pair.
  - WHEN the dataset's checks have been re-evaluated (REQ-PIPE-121's knock-on) so that the run its status is computed from
    carries no check not evaluated because of the contest, THE SYSTEM SHALL show no line.
  - THE SYSTEM SHALL NOT show the line on the contested dataset's own page, whose banner already says 'Two files for one table'.
  - THE SYSTEM SHALL record, for every not-evaluated cross-table result, the reason's code for EACH table it names (unrunnable_codes_by_table,
    beside today's single unrunnable_code), SHALL carry it and a held-supply record's held_tables into the dashboard data,
    and SHALL identify the blocking table and its cause from those fields alone, never by parsing the reason's prose; records
    written before this change SHALL be read by their single unrunnable_code.
  - THE SYSTEM SHALL compute the line at build time from recorded QA results and recorded decisions only, and SHALL NOT read
    supply rows.
  - THE SYSTEM SHALL render every name in the line as text, never as markup.
  - THE SYSTEM SHALL have a real-browser test, against a dashboard built from a fixture history, written first and seen to
    fail, in which a reader dataset shows one line naming the contested table while the pair is open - though three of its
    checks read that table - and shows no line once its checks have been re-evaluated after the settlement.
  - WHERE the synthetic history holds TS-42 or TS-80 (REQ-GEN-203), THE SYSTEM SHALL quote the line, as the page words it,
    in each scenario's register entry for its three reader datasets on the pair's arrival day.
  non_functional_requirements:
  - 'SCALE (CLAUDE.md''s ~30-datasets rule): one line per contested table, never per check - cp-investigations alone carries
    several checks reading cp_clients (Soda and dbt referential checks, reads_tables [cp_clients]), and on a thirty-dataset
    asset a widely read table could hold many readers red at once; each reader''s page says the cause once.'
  - 'PERFORMANCE: computed once per dataset per build from the results already embedded; no per-render scan of history, so
    page load does not grow with the number of past runs.'
  - 'THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else (criterion 11).'
  - 'PRIVACY: the line names the other dataset and the period, never the two filenames - those stay on the contested dataset''s
    own banner (REQ-PIPE-194 criterion 1) - so a supplier''s file naming is shown in one place, not repeated on every reader.'
  - 'ACCESSIBILITY AND CONSISTENCY: the same notice styling and role=''status'' the page''s other top-of-page banners use,
    and the one label REQ-PIPE-194 criterion 15 fixes; no new asset, so the self-hosted, file:// and offline viewing paths
    are unaffected.'
  - 'TEST FIRST for criterion 3 above all: a line that read as ''this dataset is fine'' would be the false-green direction.'
  dependencies:
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-PIPE-121
  - REQ-DASH-197
  - REQ-PIPE-202
  - REQ-GEN-203
  - REQ-PIPE-164
  decisions:
  - 'A NEW REQUIREMENT NOW (Keith, 2026-10-13): a top-of-page line on the reader naming the contested table. REJECTED leaving
    it for a later road-testing sighting.'
  - 'WHY A READER GOES RED, VERIFIED IN CODE 2026-10-14 (delivery-scoper): qa_tools/common/unrunnable.py records each cross-table
    check that reads a contested table as status fail with unrunnable_code ''contested'', in the reader''s OWN run (REQ-PIPE-115
    criteria 14 to 16; period_schema.CONTESTED outranks every slot reason); promotion.status_of counts every contributing
    check, so the reader''s status is red and the gate withholds it. Child Protection''s readers of cp_clients are cp-notifications,
    cp-investigations and cp-placements (reads_tables [cp_clients] in contract/child-protection-soda-checks.yml and dbt_project/models/staging/schema.yml),
    several checks each.'
  - 'WHAT THE PAGE SAYS TODAY, VERIFIED IN THE TEMPLATE 2026-10-14: the reader''s pill is red; each affected check card carries
    ''not evaluated in the latest run''; the reason appears only inside the check''s drawer, under ''Not evaluated in the
    current run''. The top-of-page banners (blockedBanner, waitingBanner) are about the dataset''s OWN supply only, so nothing
    at the top names the other table. pipeline/build_cp_dashboard_data.py carries only the reason''s prose to the page, not
    its code or table - hence criterion 10.'
  - 'THE SAME SHAPE IS ON THE REAL PAGE TODAY FOR AN UNLOADABLE TABLE: the bootstrapped database (queried 2026-10-14) holds
    ''could-not-be-loaded'' records against cp_clients in all three readers'' runs, from TS-12''s quarter, and no ''contested''
    ones - Child Protection cannot be contested until REQ-PIPE-202 widens the pattern. Whether the line covers that kind too
    is open question 1.'
  - 'THE LINE EXPLAINS THE RED, NEVER REMOVES IT (delivery-scoper, PROPOSED): a check that could not run counts as red until
    it can - the template''s own drawer text says so, and REQ-PIPE-115 records it red. REJECTED showing such a reader amber
    or with its status recomputed without those checks: that is the false-green direction, and the gate would disagree with
    the page.'
  - 'NAMES THE DATASET AND PERIOD, NOT THE FILES (delivery-scoper, PROPOSED): the contested dataset''s own banner names both
    files; repeating them on every reader multiplies a supplier''s naming across pages for no gain in what to do.'
  - 'ONE LINE PER CONTESTED TABLE (CLAUDE.md scale rule, the caller''s brief): REJECTED a line per affected check, which on
    cp-investigations would repeat one cause several times.'
  - 'ROUND 3 REVIEWS FOLDED (round 3 fold, delivery-scoper, 2026-10-14): architect D17 (criterion 10 - unrunnable.py writes
    ONE unrunnable_code per record, the first table''s by name order, and keeps no per-table reason, while held tables are
    recorded separately by held_blast_radius as tool ''held'' with held_tables; so the recorder gains a per-table code, which
    makes this requirement touch the PIPE recorder, said here rather than hidden); architect D18 (''results in place'' was
    undefined for a red reader - now ''the run the dataset''s status is computed from on the date on show''); dashboard UX
    4 (criterion 1 - one notice in the red notice style, its place among the banners, a bold first sentence); dashboard UX
    5 (criterion 5 - a real href built as affectsLinks() builds them, verified in the template); dashboard UX 8 (criterion
    7 names what runs the checks again).'
  - 'OPEN QUESTION 1''s FIRST PREMISE WAS WRONG, CORRECTED (dashboard UX 3, verified 2026-10-14): a held table''s readers
    are recorded by held_blast_radius (tool ''held'', held_tables, held_reason), not under an unrunnable_code; and unrunnable
    records also carry past-due and staged-awaiting-decision, so ''another table is overdue'' - the commonest such red at
    thirty datasets - is a candidate too. The question is re-offered below with that option.'
  open_questions:
  - 'SET A Q1 - WHICH CAUSES GET THE LINE (dashboard UX 3, superseding the scoper''s first question). Recommended (A): every
    red not-evaluated cause rooted in another table - two files for one table, could not be loaded, held with no period, overdue
    (past-due), staged and awaiting a decision - each with its own wording and next step, never a ''no data'' (not-yet-due)
    one. (B) contested and could-not-be-loaded only (TS-12''s readers are red that way today). (C) contested only, as Keith
    worded the ask.'
  - 'SET A Q2 - WHAT THE COLLECTION LEVEL SHOWS. Recommended (B): a note under each such reader''s pill in the collection
    table (the noSupplyNote shape), the contested dataset''s own banner ending ''Affects <reader links>'' (affectsLinks()),
    and one line on the collection card in the redPromotedMarker shape naming the contested table once. (A) the row note and
    ''Affects'' only, no card line. (C) none - each reader simply counts red.'
  - 'SET A Q3 WITH CLI UX B - WHAT A RED READER''S WAITING ITEM SAYS, ON THE PAGE AND IN THE TERMINAL. Today the reader''s
    verdict line and outstanding item (''awaiting a decision - you can promote / reject'') and the terminal queue all invite
    a decision on the reader, when the decision that clears it is the pair''s. Recommended (A): both halves - on the page,
    a criterion here that the reader''s item says nothing needs deciding here and that settling <dataset>''s pair re-checks
    and re-gates it (REQ-PIPE-121); in the terminal, a small PIPE requirement drafted now, the queue grouping such readers
    under the pair. (B) the page half only, the terminal left to the road-testing review. (C) leave both.'
  - 'SET A Q4 - MoSCoW. Recommended (A): must, since REQ-GEN-203 puts three red readers on the real page and the architect''s
    build order puts this before it. (B) should - the red is explained one click down, confusing rather than false.'
  - 'ARCHITECT Q3 WITH THE SCOPER''S SETTLED-NOT-RE-CHECKED STATE - AFTER ''REJECT BOTH'', THE READERS STAY RED FOR GOOD:
    the knock-on re-evaluates only when a period''s holding changes (decision_log.apply_decision), and rejecting both files
    changes nothing held. Recommended (A): yes, re-check them - a small PIPE follow-up so that settling a pair, any outcome,
    re-evaluates the readers waiting in its period; criterion 7''s wording here covers the meantime. (B) no - the readers
    wait for the next supply or a person''s re-check (REQ-PIPE-164), and criterion 7 says so.'
- id: REQ-DASH-182
  title: The dashboard shows every period a dataset owes nothing in, with its reason, and the delivery time in force on the
    date on show
  date_written: '2026-10-10'
  story: As a data team leader reading a dataset's supply history, I want a period it owes nothing in to say so, with the
    reason, and its delivery time to be the one in force on the date I am looking at, so that I never read a deliberate gap
    as a missed supply or judge a supply against a due time that did not apply.
  moscow: must
  status: not_started
  source: 'Split out of REQ-PIPE-110 on 2026-10-10 (Keith, T9, option A, the delivery-scoper''s recommendation) with the criteria
    and decision it carried. NOT YET THROUGH delivery-scoper as a requirement of its own - say so when it is presented for
    sign-off. Scoper pass 2026-10-13: delivery-scoper, 2026-10-13 - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182
    with the Child Protection pattern widening (Keith, 2026-10-13: close out the calendar group before the road-testing review;
    scope 163 WITH 179 so 179 does not amend a requirement that may change under it).'
  acceptance_criteria:
  - THE SYSTEM SHALL show every period a dataset owes nothing in - whether by participation or by not_expected - together
    with its reason, and SHALL NOT omit it.
  - WHERE the dashboard shows a period a dataset owes nothing in, THE SYSTEM SHALL show it as a quiet row stating its kind
    - a participation row, 'Not expected - <reason>', and WHERE the dataset is turned off (REQ-PIPE-179), 'Turned off - <reason>'
    (REQ-DASH-180 criterion 15) - in its chronological place among the supply cycles, each run of consecutive periods of the
    same kind and reason as one row giving its first and last period and their count, only for periods up to the date on show,
    and SHALL NOT show it red, among things needing action, or as 'No supply'; a participation row, which recurs, SHALL carry
    a short label generated from the configuration - 'Not owed - outside its agreed months (Feb, Aug)' - and the authored
    reason SHALL be shown once, on the dataset's agreement tile, not on every row.
  - WHERE the dashboard shows a dataset's delivery time or cycle, THE SYSTEM SHALL take it from the values resolved for the
    dataset on the date on show - expected time, grace, participates and days before - each from the level REQ-PIPE-181 resolves
    it to; WHERE the date falls before its first participation version, SHALL show 'Not yet owing - first version takes effect
    <date>'; and WHERE the dataset is turned off on that date (REQ-PIPE-179), SHALL show it as REQ-DASH-180 criterion 16 says.
  - THE SYSTEM SHALL render every reason it shows as text, never as markup.
  - THE SYSTEM SHALL compute all of this from committed configuration and recorded results, and SHALL NOT read supply rows.
  - THE SYSTEM SHALL NOT show periods before a dataset's first participation version as owed-nothing rows.
  - WHERE a dataset's supply for a period is due on an earlier day than the period's date (days_before above 0), THE SYSTEM
    SHALL say so in the delivery-time label - 'by 22:00 the day before' where it is one day, 'by 22:00, N days before each
    date' where it is more - and SHALL NOT show the time alone.
  - WHERE a dataset's calendar is not exactly four delivery months a year, or its periods fall on different days of the month,
    THE SYSTEM SHALL still label its cycle in words, and SHALL NOT render the label blank.
  - WHERE an owed-nothing period stands on an earlier supply by inheritance (REQ-PIPE-098), THE SYSTEM SHALL show that on
    the same row - the period it stands on - rather than as a second row or a second pill for the same period; and the standing-in
    heading above that row SHALL name the row's kind label.
  - WHERE the current cycle on the date on show is a period the dataset owes nothing in, THE SYSTEM SHALL show that period's
    owed-nothing row in place of 'No deliveries in the current cycle yet.'
  non_functional_requirements:
  - Rendered from REQ-PIPE-110's agreement value; this only consumes it (docs/components.md).
  - Same date formatting as everything else on the page (REQ-DASH-071).
  - 'SCALE: rows are collapsed per run of periods (criterion 2), so the page carries one row per change of kind or reason,
    not one per period - a daily dataset owing nothing for a year is one row, and thirty datasets over years stay a handful
    of rows each.'
  - 'PERFORMANCE: computed at build time from configuration through REQ-PIPE-181''s one resolution function, never per period
    in the browser; the build''s time does not grow with the length of history beyond reading the calendar once.'
  - 'PRIVACY: reasons are authored configuration text, rendered as text (criterion 4); nothing here reads or shows supply
    rows.'
  dependencies:
  - REQ-PIPE-110
  - REQ-DASH-071
  - REQ-PIPE-181
  - REQ-PIPE-098
  - REQ-DASH-198
  - REQ-PIPE-113
  - REQ-PIPE-106
  decisions:
  - 'SPLIT FROM REQ-PIPE-110, 2026-10-10 (Keith, T9, option A), on the REQ-PIPE-154 / REQ-DASH-155 pattern: the configuration
    and its rendering are separate reviewable units. REQ-DASH-180''s turned-off rows are owed-nothing rows of a third kind
    and depend on this. The decision below travelled from REQ-PIPE-110 unchanged.'
  - 'PERIODS OWED NOTHING ARE QUIET, NEVER RED (delivery-dashboard-ux pre-build review, 2026-10-07): a reason row, grouped
    in supply history, never ''No supply'' and never in needs-action. The SLA label follows the participation version in force
    on the date on show.'
  - 'ROUND 3 FOLDED, 2026-10-10 (main session): the three kind labels fixed in one place so REQ-DASH-180 cannot drift (delivery-dashboard-ux
    15); rows in chronological place, a run of periods collapsed to one row, nothing after the date on show - a daily dataset
    turned off for a year would otherwise show 365 rows (14); the delivery time taken from resolved values with their levels,
    and said for a date before the first version (13, delivery-scoper F, delivery-architect 15); periods before the first
    version are not owed-nothing rows (delivery-scoper L).'
  - 'TWO LABEL DEFECTS LEFT HERE BY BUILT WORK (verified 2026-10-13): post-build-review #138 #5 - the delivery-time label
    ignores days_before (''by 22:00'' for a supply due the evening before); #137 L9 - a calendar not four months a year labels
    as ''authored'', which the page renders blank, and mixed days give day_of_month None. agreement.cadence() still takes
    the newest version only, its docstring saying ''Which version applies on the date on show is REQ-DASH-182''s''. Criteria
    7 and 8 carry the first two; criterion 3 the third.'
  - 'BUILDABLE BEFORE REQ-PIPE-179 (DECIDED Keith, 2026-10-13, set 3 Q9, option A): the three labels stay fixed in this one
    requirement, the turned-off one as a WHERE clause that is vacuous until a turn-off can be configured; REQ-DASH-180 criterion
    15 stays the owner of the turned-off row''s behaviour. REJECTED waiting for 179.'
  - 'ONE ROW FOR AN INHERITED OWED-NOTHING PERIOD (DECIDED Keith, 2026-10-13, set 3 Q10, option A): every owed-nothing period
    inherits (REQ-PIPE-098), and the page already marks an inherited period with a standing-in pill saying ''Nothing was owed
    for this period'' (REQ-DASH-198); criterion 9 puts the period it stands on in the owed-nothing row. REJECTED a reason
    row beside the existing pill, which says the same thing twice.'
  - 'NO ''Not expected'' ROW INSIDE A TURNED-OFF GAP (DECIDED Keith, 2026-10-13, on REQ-PIPE-179 criterion 21): such an entry
    is rejected as configuration, so the two kinds never meet on one period.'
  - 'KEITH''S THREE ANSWERS OF 2026-10-13 (DECIDED Keith, 2026-10-13 evening, answering the CLI and dashboard UX reviews -
    plans/running-thoughts.md #92; carried in by dashboard UX 1, 2026-10-14, as a carry-over gap): owed-nothing rows that
    recur (cp-case-workers'' May and November) read a SHORT generated label, ''Not owed - outside its agreed months (Feb,
    Aug)'', with the authored reason once on the agreement tile (criterion 2); the current cycle shows its owed-nothing row
    in place of ''No deliveries in the current cycle yet.'' (criterion 10); and the due-before label reads ''by 22:00 the
    day before'' for one day and ''by 22:00, N days before each date'' for more (criterion 7). REJECTED repeating the authored
    reason on every recurring row.'
  - 'ROUND 3 REVIEWS FOLDED (round 3 fold, delivery-scoper, 2026-10-14): dashboard UX 1 (the three answers above, which had
    not reached the criteria); dashboard UX 12 (criterion 9 - the standing-in heading names the kind). This requirement had
    the 2026-10-13 joint scoper pass, not one of its own (dashboard UX 16).'
  open_questions: []
- id: REQ-PIPE-163
  title: A person can place a held supply into a period, from the terminal
  date_written: '2026-10-07'
  story: As the person working through supplies the filing rule refused to place, I want to say which period a held supply
    belongs to and have it filed, checked and gated there, so that a supply held because of a calendar mistake - ours or the
    supplier's - is not stuck forever with rejection as the only way out.
  moscow: must
  status: not_started
  source: 'delivery-scoper, 2026-10-07 - a gap found auditing Keith''s condition on REQ-PIPE-111 (''assuming the TUI offers
    users ALL of the tools a human would need to undo mistakes ... and otherwise undo and fix up everything that automated
    rules decide''). Verified against built code: qa_tools/common/refiling.py refuses a held supply with ''Place it instead;
    `mothman supply holds` shows how'', no filing decision named place exists (filing_decisions.OPERATIONS), and `mothman
    supply holds` lists ''file it to a slot yourself'' with no command. Re-scoped jointly with REQ-PIPE-179 by delivery-scoper,
    2026-10-13 - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182 with the Child Protection pattern widening (Keith,
    2026-10-13: close out the calendar group before the road-testing review; scope 163 WITH 179 so 179 does not amend a requirement
    that may change under it).'
  acceptance_criteria:
  - 'THE SYSTEM SHALL offer PLACE as a filing decision a person raises about a supply held by the assignment rule (REQ-PIPE-064)
    - whichever path raised the hold: the rule at arrival, a confirmed correction (REQ-PIPE-170 criterion 8) or a settlement
    whose file landed where no slot was open (REQ-PIPE-193 criterion 11) - naming the period it is to be filed to, on the
    same terms as every other filing decision - actor, mandatory reason, allowlist, refusal, one implementation behind every
    route.'
  - WHEN a person places a held supply, THE SYSTEM SHALL, in one transaction, record a filing of it to the named period AS
    A RE-FILE FROM NO PERIOD BY THAT PERSON - the same filing row and decision a re-file appends, its from-period empty, with
    no decision-log action of its own - resolve its hold naming that decision (REQ-PIPE-078 criterion 6) and record an owed
    re-check (REQ-PIPE-140); the terminal, the flag route's output and the dashboard SHALL still call it a placement, criterion
    41 saying how; and criterion 39 amends the decision log so that it accepts such a re-file from a person.
  - WHEN a placement is recorded in the terminal's filing-decisions door, THE SYSTEM SHALL run its owed re-check straight
    after the transaction commits, while the person waits, applying the promotion gate exactly as for a re-filed supply (REQ-PIPE-141
    criteria 7, 9, 13, 15 and 18).
  - WHEN a placement is recorded through `mothman supply decide`, THE SYSTEM SHALL say that its checks are owed, SHALL print
    `mothman pipeline process` on a line of its own, saying that it runs every owed QA run and not only this one, and SHALL
    NOT wait for them.
  - THE SYSTEM SHALL NOT run any QA inside the transaction that records a placement.
  - THE SYSTEM SHALL allow placing into a closed period and into a period whose claim window had not opened at the supply's
    receipt instant, because a person deciding is not the assignment rule (REQ-PIPE-062 criterion 5 and REQ-PIPE-064 criterion
    2 bind the rule).
  - IF the named period is not one the dataset's calendar generates, or is one the dataset owes nothing in - not participating,
    listed not_expected, or for any other reason the one participation resolution gives (REQ-PIPE-179 criterion 27 once built)
    - THEN THE SYSTEM SHALL refuse it, saying which and quoting the reason the configuration gives, and print the command
    that lists the dataset's periods - `mothman schedule show --dataset <id>` - on a line of its own; and WHERE the period
    lies inside a turned-off gap, the refusal SHALL be the one REQ-PIPE-179 criterion 20 words, given in place of this one
    rather than beside it.
  - IF the named period is owed and its slot is resolved by a person's inheritance, THEN THE SYSTEM SHALL refuse it and name
    un-inherit as the step that must come first, as a re-file does (REQ-PIPE-141 criterion 12); a period owed nothing SHALL
    be refused under criterion 7 instead, never with advice to un-inherit.
  - THE SYSTEM SHALL compute the placed supply's arrival classification against the slot it was placed in, so that a supply
    placed after its slot closed reads late, and SHALL record it as a verdict carrying the slot's resolved inputs and the
    agreement that judged it (REQ-PIPE-168 criterion 1).
  - THE SYSTEM SHALL list every held supply in the terminal's filing-decisions door, saying why it was held in the hold's
    own reason, never as a choice between files, and SHALL offer place and reject on each, except a hold labelled schedule
    ended (REQ-PIPE-154), which offers only adding dates.
  - THE SYSTEM SHALL let a person reject a held supply from the terminal and through mothman supply decide, with a reason,
    ending its hold.
  - THE SYSTEM SHALL name, in `mothman supply holds`, in the dashboard's held-supply item and in every refusal that points
    at placing, both the exact command that places a held supply - its supply and dataset filled in from what was typed or
    shown - and the terminal screen that offers it, printing the command on a line of its own; and SHALL replace supply_holds.RESPONSES'
    'file it to a slot yourself' with place, the operation that now exists.
  - THE SYSTEM SHALL amend, in the same change, REQ-GHUB-082 criterion 1 and REQ-PIPE-074 criterion 1 to list place among
    the filing decisions.
  - THE SYSTEM SHALL offer place on the terminal route only - the filing-decisions door and mothman supply decide - and SHALL
    NOT offer it on the GitHub route; THE SYSTEM SHALL amend, in the same change, REQ-GHUB-082 criterion 3 to name place beside
    choose-file (REQ-PIPE-193) and REQ-PIPE-170's correction confirmation as operations offered on the terminal route only.
  - THE SYSTEM SHALL take a placement through --supply and --to-period, SHALL refuse a placement without --supply, SHALL refuse
    --period for a placement, which a held supply does not have, SHALL refuse a --dataset that does not match the supply's
    own dataset, and SHALL name place among the operations in `mothman supply decide --help`.
  - WHEN the terminal asks for the period to place a supply in, or to re-file one to, THE SYSTEM SHALL offer periods as a
    choice rather than asking for a typed period - opening on the periods whose claim windows were nearest the supply's receipt
    instant on both sides, each marked closed or not yet open and showing its one-word current state, with inherited periods
    marked as needing un-inherit first, a period where an unaccepted version is waiting or an open contested pair stands marked
    as needing that decided first, and any period the dataset owes nothing in shown in its place, marked with why and not
    selectable - and SHALL offer a choice that pages to earlier or later periods; on the flag route --to-period SHALL accept
    any period criterion 6 allows; and THE SYSTEM SHALL collapse each run of consecutive owed-nothing periods into one unselectable
    row, as REQ-DASH-182 criterion 2 collapses them on the page, so that the nearest owed periods on either side are always
    among those first shown.
  - THE SYSTEM SHALL list held supplies in the queue of supplies waiting on a decision, grouped under their own heading, 'Held
    - no period yet (N)', above the slot rows, each showing its dataset and receipt instant in place of a period - except
    supplies held as turned off, which REQ-PIPE-179 criterion 34 lists in a quiet group of their own outside that count.
  - WHEN a period has been chosen, and before the reason is asked for, THE SYSTEM SHALL show how the supply would classify
    against that period's slot, what the slot holds now and what placing does to it, and SHALL NOT run any QA to predict a
    verdict.
  - WHEN a placement's QA finishes, THE SYSTEM SHALL end with one panel saying where the supply now stands - its period, its
    verdict and what the gate did; WHERE it is waiting, SHALL say that it is filed and nothing is lost and SHALL offer the
    next decision; and WHERE the checks did not run, SHALL say that they are owed, that the processing pass will finish them,
    and that the placement stands; and WHERE the supply was placed, SHALL say that it had not been checked in <period> before,
    and SHALL NOT say 'again' or that an earlier verdict stands.
  - THE SYSTEM SHALL NOT use the words rejected or refused for a gate outcome in that panel, those words naming a person's
    decision.
  - WHEN the reason for a placement is asked for, THE SYSTEM SHALL say that it is published on the dashboard.
  - THE SYSTEM SHALL NOT offer place or reject on a hold labelled schedule ended, which the rule re-files once dates cover
    it (REQ-PIPE-154 criterion 7), keeping REQ-PIPE-154's decision that such a hold offers only adding dates; and WHERE the
    filing-decisions door shows such a hold, THE SYSTEM SHALL show its reason, the advice to add the next dates to contract/calendar.yaml
    and `mothman schedule draft-correction` on a line of its own for where a declared correction is needed, and SHALL NOT
    end on 'nothing to decide'.
  - IF the run that follows a placement - in the door or under --wait - is interrupted or fails to complete, THEN THE SYSTEM
    SHALL leave it owed for the processing pass, the placement standing.
  - THE SYSTEM SHALL NOT count a placement as a person's decision about the supply, so that a placed supply checked green
    may promote itself under the gate; and SHALL amend, in the same change, REQ-PIPE-076 criterion 7 to name place beside
    re-file and re-check.
  - WHERE a placement or a re-file is recorded through `mothman supply decide --wait`, THE SYSTEM SHALL run its owed re-check
    straight after the transaction commits, in the foreground, as the door does, and SHALL end with the shared outcome panel;
    and SHALL amend, in the same change, REQ-PIPE-141 so that a re-file through decide accepts --wait likewise.
  - THE SYSTEM SHALL end a placement, a re-file and a re-check with one shared outcome panel - criterion 19's - which SHALL
    NOT use the words rejected or refused for a gate outcome.
  - IF --wait is given with a decision that owes no QA run, THEN THE SYSTEM SHALL refuse it, naming the operation.
  - WHERE `mothman supply decide --wait` records a decision whose checks then do not finish - the run failing, Ctrl-C, or
    the run claimed elsewhere - THE SYSTEM SHALL exit with a code of its own, distinct from 0 and from 1, the panel saying
    that the decision stands and its checks are still owed.
  - IF a person stops a placement's run with Ctrl-C, THEN THE SYSTEM SHALL end without a traceback, say that the placement
    stands and its checks are still owed, and print `mothman pipeline process` on a line of its own.
  - WHERE the runner a person is waiting on - the door or decide --wait - finds the owed run already claimed, THE SYSTEM SHALL
    say that it is being run elsewhere and will finish there, and SHALL NOT show a verdict.
  - 'THE SYSTEM SHALL amend, in the same change, REQ-PIPE-140''s text to state the claim every runner of an owed run already
    takes - the door, decide --wait and the processing pass claim it before running it, a claim is released if the process
    holding it ends, and a runner finding it claimed skips it and leaves it owed - which was BUILT on 2026-10-11 (post-build-review
    #136) and is not yet in that requirement''s criteria.'
  - THE SYSTEM SHALL state in `mothman supply decide --help` that it leaves a decision's checks owed unless --wait is given.
  - IF the named period's slot holds an open contested pair (REQ-PIPE-194 criterion 9), THEN THE SYSTEM SHALL refuse the placement,
    append nothing, and say the pair is settled first, at 'mothman > Filing decisions > {collection name} > Supplies waiting
    on a decision'.
  - IF an unaccepted version of the supply's table - waiting in staging for the named period, neither promoted nor rejected
    - is in that period, THEN THE SYSTEM SHALL refuse the placement and append nothing, naming the waiting supply and its
    receipt on the asset's clock, and saying that it is decided first - promoted or rejected - at 'mothman > Filing decisions
    > {collection name} > Supplies waiting on a decision', with the flag form `mothman supply decide --operation <promote|reject>
    --dataset <id> --period <period> --supply <waiting supply> --reason '<why>'` printed on a line of its own; WHERE the waiting
    version is one file of an open contested pair, criterion 33's refusal applies instead.
  - IF the agreement backstop refuses the dataset (REQ-PIPE-173), THEN THE SYSTEM SHALL refuse the placement, saying that
    the dataset's judged past changed without a declared correction, and SHALL NOT record anything.
  - IF a GitHub comment names place, THEN THE SYSTEM SHALL append nothing and SHALL reply that the decision is made in the
    terminal, at 'mothman > Filing decisions > {collection name} > Supplies waiting on a decision', as it does for choose-file
    (REQ-PIPE-193 criterion 16).
  - WHERE the held supply is one file of a held contested pair - both files of one delivery held for the same table (REQ-PIPE-194)
    - THE SYSTEM SHALL list the pair as one row naming both files, counted once; SHALL place BOTH files into the named period
    in the one transaction, still contested, so that the pair is settled there by choose-file (REQ-PIPE-193) and neither file
    is checked or promoted before it is; SHALL name the second file's move as a consequence before the person confirms, requiring
    --acknowledge on the flag route; SHALL end with the outcome panel offering to settle the pair now; and IF --wait is given,
    THEN SHALL refuse it under criterion 27, printing where choose-file is offered and both filenames.
  - 'THE SYSTEM SHALL keep refusing a person''s PROMOTE of a held supply (post-build-review #173, built 2026-10-13), and that
    refusal SHALL give the hold''s own responses as its label works them out (REQ-PIPE-179 criterion 18) - place, with its
    menu path and flag form, and reject for a plain or turned-off hold; adding dates for a schedule-ended one - each command
    on a line of its own rather than inline.'
  - THE SYSTEM SHALL amend, in the same change, the decision log's re-file rule - which today accepts a re-file naming no
    period left only from the rule (qa_tools/common/decision_log.py) - so that a PERSON's re-file naming no period left is
    accepted where, and only where, it places a supply with an open assignment-rule hold, and is refused otherwise, naming
    place.
  - THE SYSTEM SHALL file a held supply into a period through ONE shared placer - used by a person's placement, a confirmed
    correction's placement (correction_apply._place) and the rule's re-file of holds configuration now covers (schedule_ended.refile_holds)
    - which records the filing, resolves the hold and owes the re-check, so that no second implementation of placing exists;
    and refiling.plan SHALL keep refusing a held supply as a re-file, pointing at place.
  - THE SYSTEM SHALL call a placement 'placed into <period>' on every route that reports a decision - the decision's own confirmation
    message, the filing-decisions door, `mothman supply decisions`, `mothman supply filings` and the refusal given when another
    decision holds the supply's lock - and SHALL NOT show it as a re-file, as 'None -> <period>' or by a machine name, the
    operation keeping the name place in filing_decisions.OPERATIONS.
  non_functional_requirements:
  - AT THE TARGET SCALE THIS IS NOT RARE. The synthetic database held 9 assignment-rule holds for Case Workers on 2026-10-07
    and 8 on 2026-10-13 (`mothman supply holds`, re-run by the scoper), every one waiting on an action no route offers. A
    schedule-ended backlog (REQ-PIPE-154) on a daily feed is a hold per day, and since 2026-10-13 a settlement can raise one
    too (REQ-PIPE-193 criterion 11).
  - A person's placement is the strongest form of 'I know which period this is', and it is recorded with actor and reason
    like everything else - no placement without a reason, because a year later somebody will ask why a supply that arrived
    in March sits in January.
  - Gated exactly as a first arrival, under the settings in force at the instant of placing (REQ-PIPE-122, REQ-PIPE-123) -
    a person placing a supply is not a person promoting it.
  - 'PRIVACY: the placement''s reason is published on the dashboard (criterion 21). Today''s data is synthetic; in a real
    deployment of Child Protection data the reason prompt is the one free-text field that could carry a child''s or family''s
    details, so the prompt says it is published and the reason is rendered as text, never markup.'
  - 'SECURITY: placing widens nothing - same allowlist, same actor recording, terminal only; the GitHub route replies and
    records nothing (criterion 36).'
  - TEST FIRST for every refusal that guards a false quiet or a double version - criteria 7, 33 and 34 above all - because
    a placement that lands two waiting versions in one period looks exactly like one that works.
