- id: REQ-DASH-209
  title: A period-composition view shows, for one period of a collection, what each dataset holds there and how it got there
    - promoted, inherited or substituted
  date_written: '2026-10-14'
  story: As the person who looks after the pipeline, or a data owner asked what a period's data actually is, I want one view
    per period of a collection saying what each of its datasets holds there - its own promoted supply, a supply inherited
    from an earlier period, or one substituted onto an earlier period - so that I can see what a query against that period
    reads without opening the database, and so that TS-55 has a page to show.
  moscow: should
  status: not_started
  source: 'Keith, 2026-10-14 morning, close-out Q16, option B, against the recommendation (plans/running-thoughts.md #93):
    draft a dashboard view of a period''s _manifest so that TS-55 (REQ-GEN-137 criterion 6) has a page, and it must work at
    about thirty datasets per period. Drafted by delivery-scoper the same morning; NOT REVIEWED by delivery-architect or by
    a UX reviewer.'
  acceptance_criteria:
  - THE SYSTEM SHALL offer, for each period of every collection - daily collections included, one view per day - a period-composition
    view with one row per dataset of that collection, each saying what the dataset holds in that period as at the end of the
    date on show - 'Promoted', 'Inherited from <period>', 'Substituted from <period>', 'Not supplied' where the dataset owes
    the period a supply and none is held there, or 'Not owed' where it owes none (turned off, REQ-PIPE-179; not expected;
    outside its agreed months) - and, for 'Not supplied' and 'Not owed', the one-word state the dataset's supply history shows
    for that period.
  - THE SYSTEM SHALL take every row from the per-dataset timelines the build already embeds (pipeline/slot_timeline.py and
    pipeline/promotion_timeline.py), looked up by the date on show with the same lookup REQ-DASH-198's standing-in qualifier
    uses (promotionStateOn), and SHALL NOT work out a second derivation, nor read a period schema, its catalogue, its _manifest
    or any supply row.
  - THE SYSTEM SHALL show, for each table held, the supply's receipt on the asset's clock, when the decision that put it there
    took effect, who made it - worded as the rest of the page words it, 'Decided by <display name>' or 'Applied automatically
    by the schedule' (REQ-DASH-198), the display name from contract/people.yaml and never an email address - its reason, the
    status it was promoted on, in a column headed 'Status when promoted' and never its health since (REQ-PIPE-130 criterion
    12), and, where an acknowledgement is owed, whether it was given.
  - 'THE SYSTEM SHALL open the view with one line counting the period''s datasets by kind - for example ''30 datasets: 1 not
    supplied, 1 substituted, 2 inherited, 25 promoted, 1 not owed'' - and SHALL list the rows grouped by kind in that order,
    ''Not supplied'' first and ''Not owed'' last, each group in dataset display-name order, with every row shown and no group
    collapsed.'
  - THE SYSTEM SHALL make each dataset's name a real link (<a href>) to that dataset's page at the same date on show, and
    each 'from <period>' a real link to that period's composition view.
  - 'THE SYSTEM SHALL give the view its own address in the dashboard''s existing routing - #/agency/<agency>/collection/<collection>/period/<period>,
    with the date on show as the existing in-place-on query parameter (docs/spa-best-practices.md section A) - and SHALL link
    to it, by a real <a href>, from each period''s label in a dataset''s supply history and from that history''s gap and owed-nothing
    rows, never from inside a delivery row, and from the standing-in pill''s drill-down (REQ-DASH-198).'
  - THE SYSTEM SHALL let TS-55's chip in the test-scenarios panel open its period's composition view, TS-55's coordinate in
    the scenario map still naming the substituted dataset, with the view as its link's target, so that REQ-GEN-045 criterion
    1 needs no change; and SHALL add the view's table to REQ-DASH-208 criterion 2's subjects, so that TS-55's chip lands with
    it in view.
  - WHERE no dataset of the collection holds anything in the period on the date on show, THE SYSTEM SHALL say so in one line
    above the rows; and WHERE the date on show is before the period opened, THE SYSTEM SHALL show '<period> had not opened
    by <date>' in place of the rows.
  - 'THE SYSTEM SHALL have the build embed the answers and the page look them up: the build SHALL add to each per-dataset
    timeline entry the period it stands on (stands_on), and SHALL embed each supply''s receipt, status when promoted and acknowledgements
    once per supply, not once per period or per day; and THE SYSTEM SHALL render every name and reason in the view as text,
    never as markup.'
  - 'THE SYSTEM SHALL have a real-browser test, against a dashboard built from a fixture history, written first and seen to
    fail, in which one period holds a promoted, an inherited and a substituted table and one owed dataset holds nothing: at
    the build''s own date the view''s rows SHALL agree with that period''s _manifest, queried by the test, in both directions
    - every table _manifest lists is a row of the matching kind, and every row other than ''Not supplied'' and ''Not owed''
    is a table _manifest lists - with ''Decided by <name>'' matching _manifest''s ''person'' and ''Applied automatically by
    the schedule'' its ''rule''; and at a date on show before the substitution the view SHALL show the composition then, held
    against decision_log''s as-at readers at that date as REQ-DASH-198 criterion 13 does, since _manifest answers only for
    the present.'
  - THE SYSTEM SHALL measure the built dashboard's size before and after this change, from the same recorded history, and
    SHALL report both figures in this requirement's evidence, with no size budget set.
  - THE SYSTEM SHALL head the view with an h2 reading '<collection> · <period name>' over a sub-line 'What each dataset held
    at the end of <date on show>', SHALL show the rail as Agencies › <agency> › <collection> › <period name>, SHALL give the
    table a caption saying the same, and SHALL move focus to the h2 on arrival.
  - IF the address names an agency, collection or period the dashboard does not hold, THEN THE SYSTEM SHALL show the existing
    not-found page (renderNotFound) naming what was not found, and SHALL NOT show an empty view.
  non_functional_requirements:
  - 'SCALE (CLAUDE.md''s ~30-datasets rule, Keith''s own condition for this view): one row per dataset with its kind readable
    without expanding anything, every row shown (Keith, round 4 R6), the counting line first, and ''Not supplied'' at the
    top, so that the one owed dataset holding nothing is not the twenty-eighth row of thirty.'
  - 'PERFORMANCE AND GROWTH: the view shows one period at a time and is looked up from the per-dataset timelines the build
    already embeds, with each supply''s details embedded once per supply (criterion 9), not from a second copy of the history
    per period. The number of periods grows with every year of history, and every collection has the view - daily ones included,
    one per day (criterion 1) - so the built page''s size is measured before and after and reported (criterion 11), with no
    budget set (Keith, 2026-10-14, follow-up F15).'
  - 'THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else. _manifest itself reads
    the period schema''s catalogue - a schema that holds supply rows - so the build reads only what it already reads for REQ-DASH-198
    (qa.slot_holds through slot_timeline, the decision log through promotion_timeline), never _manifest.'
  - 'ONE ANSWER (REQ-PIPE-130 criterion 9): what a slot holds is answered once, by the timelines REQ-DASH-198''s lookup already
    reads, and this view adds no second derivation in Python or in the page.'
  - 'MULTI-AGENCY: the view is per collection and lists that collection''s datasets only.'
  - 'PRIVACY: the view names the person who decided by display name, never by email address (round 4 architect M7), as the
    rest of the page already does (REQ-DASH-198), and a person''s reason is already published on the page (REQ-PIPE-163 criterion
    21); both are rendered as text. The view publishes nothing about a person that the page does not already show.'
  - 'ACCESSIBILITY AND PORTABILITY: a real table with a caption and column headers, focus moved to the view''s h2 on arrival
    (docs/spa-best-practices.md section F, criterion 12); no new asset, so the file:// and offline viewing paths are unaffected.'
