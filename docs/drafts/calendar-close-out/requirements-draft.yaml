- id: REQ-PIPE-210
  title: The terminal's queue says a waiting supply turned red only by another table needs nothing decided on it, and lists
    it under that table's own item
  date_written: '2026-10-14'
  story: As the person working through supplies waiting on a decision in the terminal, I want a reader whose red comes only
    from another table to say that nothing needs deciding on it and which table clears it, so that I deal with the one item
    that clears it instead of rejecting or promoting a supply with nothing wrong in its own data.
  moscow: should
  status: not_started
  source: 'Keith, 2026-10-14 morning, close-out Q19, option A: ''page and terminal; a small pipeline requirement drafted now
    for the terminal queue'' - the terminal half of what REQ-DASH-204 criterion 16 does on the page (CLI UX round 3, question
    B). Drafted by delivery-scoper the same morning; NOT REVIEWED by delivery-architect or by a UX reviewer.'
  acceptance_criteria:
  - WHERE every red check on a supply waiting on a decision is a cross-table check recorded as not evaluated because of another
    dataset's table, for any cause REQ-DASH-204 criterion 1 names, THE SYSTEM SHALL show it in the terminal's queue ('mothman
    > Filing decisions > {collection name} > Supplies waiting on a decision') with a line saying that nothing needs deciding
    on this supply, naming the other dataset and the cause, and saying that its checks run again and the gate is applied again
    once <REQ-DASH-204 criterion 15's next step> (REQ-PIPE-121).
  - WHERE the causing table has an item of its own in that queue - an open contested pair, a held supply or a supply waiting
    on a decision - THE SYSTEM SHALL list such readers beneath that item, each named once, and SHALL NOT list them again as
    rows of their own.
  - WHEN a person opens such a reader, THE SYSTEM SHALL say the same before offering any decision, SHALL offer going to the
    causing table's item first, and SHALL keep the reader's own decisions available on the same terms as today.
  - WHERE a reader also has a red check of its own, THE SYSTEM SHALL list it as today with a line naming the other table's
    cause, and SHALL NOT say that nothing needs deciding on it.
  - THE SYSTEM SHALL work out which waiting supplies this covers, and why, through one function that the dashboard build's
    REQ-DASH-204 line also uses, reading the per-table codes and held tables REQ-DASH-204 criterion 10 records, and SHALL
    NOT read supply rows or parse a reason's prose.
  - THE SYSTEM SHALL have fixture tests, written first and seen to fail, that drive the real queue with a contested cp_clients
    pair and its three readers, asserting that the readers are listed once beneath the pair with the nothing-to-decide line
    and are not included in the queue's count, and that a reader with a failing check of its own is listed and counted as
    today.
  - THE SYSTEM SHALL count, wherever the terminal counts supplies waiting on a decision - the Filing decisions queue's own
    count and `mothman supply queue` - a cause with readers listed beneath it once, and SHALL NOT count a reader listed beneath
    its cause, so that the count is the number of things to decide; a reader with a red check of its own (criterion 4) SHALL
    be counted as today.
  non_functional_requirements:
  - 'SCALE: at thirty datasets a widely read table can hold many readers red at once; grouping them beneath the one item that
    clears them keeps the queue one row per cause, not one per reader.'
  - 'NO FALSE QUIET: the line is only shown where every red check is another table''s (criterion 4); a reader with a fault
    of its own is never told nothing needs deciding.'
  - 'ONE ANSWER: the page (REQ-DASH-204) and the terminal decide which readers this covers through one function, so they cannot
    disagree.'
  - 'SECURITY: nothing is widened - the reader''s own decisions keep their allowlist, actor and reason.'
  - TEST FIRST for criterion 4, the false-quiet guard.
  dependencies:
  - REQ-DASH-204
  - REQ-PIPE-121
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-GHUB-082
  - REQ-PIPE-163
  - REQ-PIPE-202
  decisions:
  - 'THE TERMINAL GETS ITS OWN REQUIREMENT, DRAFTED NOW (Keith, 2026-10-14, close-out Q19, option A): the queue, like the
    page, invited a decision on the reader when the decision that clears it is another table''s. REJECTED the page half only,
    and leaving both.'
  - 'THE SAME CAUSES AS THE PAGE (delivery-scoper, derived from Keith, 2026-10-14, close-out Q17 and Q19, not asked separately):
    Keith chose every cross-table cause for the page and ''both'' for page and terminal, so the terminal covers the same causes
    rather than contested only.'
  - 'THE READER''S OWN DECISIONS STAY (delivery-scoper, PROPOSED): a person may still have a reason to reject a reader, and
    removing the choice is a bigger change than Keith asked for.'
  - 'A READER LISTED BENEATH ITS CAUSE IS NOT COUNTED (Keith, 2026-10-14, follow-up F6, option A, the recommendation): criterion
    7 - the count is the number of things to decide. REJECTED counting every waiting supply as today, with the grouping only
    changing where it is shown.'
  - 'SHOULD (Keith, 2026-10-14, follow-up F14, option B): REQ-PIPE-211 is must; this requirement and REQ-DASH-209 are should.'
  - 'FOLDED 2026-10-14 (delivery-scoper, Keith''s follow-up answers F6 and F14): criterion 6 extended, criterion 7 added.
    F6 left two cases open - a reader with no item to sit beneath, and the page''s own counts - now open questions 1 and 2.'
  open_questions:
  - '1. A READER WITH NOTHING TO SIT BENEATH (follows F6). Criterion 2 lists a reader beneath its cause only where the cause
    has an item of its own in this queue. An overdue cp_clients supply has none, so its readers are rows of their own, each
    saying nothing needs deciding on it. F6 covered readers listed beneath a cause. PROVISIONAL in criterion 7: these readers
    are counted as today. Recommended (A): do not count them either - F6''s reason, ''the count is the number of things to
    decide'', applies equally, and a line under the count says how many readers are waiting on another table. (B) count them,
    as drafted - every row in the queue is counted, and nothing needs explaining.'
  - '2. THE PAGE''S OWN COUNTS (follows F6; NFR 3 says the page and the terminal decide through one function). The dashboard
    counts supplies waiting for a person in each agency and collection card''s breakdown. Recommended (A): the same rule there
    - a reader whose red is wholly another table''s is not counted as waiting for a person, through the same one function,
    the cause carrying it (REQ-DASH-204 criterion 18''s line). This would add a criterion to REQ-DASH-204. (B) the terminal
    only, as F6 was asked - the page keeps counting every waiting supply.'
- id: REQ-PIPE-211
  title: Settling a contested pair, whatever the outcome, re-checks the datasets whose checks the contest stopped
  date_written: '2026-10-14'
  story: As the person who settles a contested pair, I want the datasets whose cross-table checks could not run because of
    the pair to be re-checked once I have settled it - even when I reject both files - so that they do not stay red for good
    on a contest that has ended.
