  - 'PLACEMENT RUNS QA EXACTLY AS A RE-FILE DOES (Keith, 2026-10-10, on the delivery-architect''s review): the placement,
    the hold''s resolution and an owed re-check commit in one transaction; the terminal then runs the owed check straight
