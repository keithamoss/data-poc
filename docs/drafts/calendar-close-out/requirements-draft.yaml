    change alters together with the period before and the period after it; SHALL check that claim against every injection,
    every post-generation placement (TS-52, TS-79a, TS-79b) and REQ-PIPE-179's TS-63 correction; and IF it meets a period
    another claims, THEN generation SHALL refuse naming both, and SHALL NOT shift either or relax the rule.
