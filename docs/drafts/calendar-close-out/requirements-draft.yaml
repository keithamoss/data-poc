- id: REQ-GEN-205
  title: The synthetic history holds the calendar-correction scenarios TS-57 to TS-62 - a correction confirmed by a scripted
    asset manager who keeps one supply, with others moved, held, parked and re-judged, and one left awaiting confirmation
  date_written: '2026-10-14'
  story: As Keith showing what happens when a delivery calendar turns out to have been wrong, I want the synthetic history
    to hold a correction merged part way through it and confirmed by the asset manager - one supply moved, one kept, one held,
    one parked behind an inheriting quarter and one only re-judged - and a second correction still awaiting confirmation,
    so that every shape of REQ-PIPE-170 can be shown on the real dashboard and in the terminal rather than only in unit tests.
