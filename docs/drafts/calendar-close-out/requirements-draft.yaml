    date and before its confirmation, where the affected datasets read awaiting confirmation (REQ-DASH-172 criterion 4), and
    'b' on the history's last day, after the confirmation - and TS-62 one link on the history's last day; and SHALL extend
    REQ-GEN-201's event vocabulary so that a link may be bounded by a declared correction's date, named by its change_reference,
