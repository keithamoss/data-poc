- id: REQ-PIPE-210
  title: The terminal's queue says a waiting supply turned red only by another table needs nothing decided on it, and lists
    it under that table's own item
  date_written: '2026-10-14'
  story: As the person working through supplies waiting on a decision in the terminal, I want a reader whose red comes only
    from another table to say that nothing needs deciding on it and which table clears it, so that I deal with the one item
    that clears it instead of rejecting or promoting a supply with nothing wrong in its own data.
  moscow: should
  status: not_started
  source: 'Keith, 2026-10-14 morning, close-out Q19, option A: ''page and terminal; a small pipeline requirement drafted now
    for the terminal queue'' - the terminal half of what REQ-DASH-204 criterion 16 does on the page (CLI UX round 3, question
    B). Drafted by delivery-scoper the same morning; NOT REVIEWED by delivery-architect or by a UX reviewer.'
  acceptance_criteria:
  - WHERE every red check on a supply waiting on a decision is a cross-table check recorded as not evaluated because of another
    dataset's table, for any cause REQ-DASH-204 criterion 1 names, THE SYSTEM SHALL show it in the terminal's queue ('mothman
    > Filing decisions > {collection name} > Supplies waiting on a decision') with a line saying that nothing needs deciding
    on this supply, naming the other dataset and the cause, and saying that its checks run again and the gate is applied again
    once <REQ-DASH-204 criterion 15's next step> (REQ-PIPE-121).
  - WHERE the causing table has an item of its own in that queue - an open contested pair, a held supply or a supply waiting
    on a decision - THE SYSTEM SHALL list such readers beneath that item, each named once, and SHALL NOT list them again as
    rows of their own.
  - WHEN a person opens such a reader, THE SYSTEM SHALL say the same before offering any decision, SHALL offer going to the
    causing table's item first, and SHALL keep the reader's own decisions available on the same terms as today.
  - WHERE a reader also has a red check of its own, THE SYSTEM SHALL list it as today with a line naming the other table's
    cause, and SHALL NOT say that nothing needs deciding on it.
  - THE SYSTEM SHALL work out which waiting supplies this covers, and why, through one function that the dashboard build's
    REQ-DASH-204 line also uses, reading the per-table codes and held tables REQ-DASH-204 criterion 10 records, and SHALL
    NOT read supply rows or parse a reason's prose.
  - THE SYSTEM SHALL have fixture tests, written first and seen to fail, that drive the real queue with a contested cp_clients
    pair and its three readers, asserting that the readers are listed once beneath the pair with the nothing-to-decide line
    and are not included in the queue's count, and that a reader with a failing check of its own is listed and counted as
    today.
  - THE SYSTEM SHALL count, wherever the terminal counts supplies waiting on a decision - the Filing decisions queue's own
    count and `mothman supply queue` - a cause with readers listed beneath it once, and SHALL NOT count a reader listed beneath
    its cause, so that the count is the number of things to decide; a reader with a red check of its own (criterion 4) SHALL
    be counted as today.
  non_functional_requirements:
  - 'SCALE: at thirty datasets a widely read table can hold many readers red at once; grouping them beneath the one item that
    clears them keeps the queue one row per cause, not one per reader.'
  - 'NO FALSE QUIET: the line is only shown where every red check is another table''s (criterion 4); a reader with a fault
    of its own is never told nothing needs deciding.'
  - 'ONE ANSWER: the page (REQ-DASH-204) and the terminal decide which readers this covers through one function, so they cannot
    disagree.'
  - 'SECURITY: nothing is widened - the reader''s own decisions keep their allowlist, actor and reason.'
  - TEST FIRST for criterion 4, the false-quiet guard.
  dependencies:
  - REQ-DASH-204
  - REQ-PIPE-121
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-GHUB-082
  - REQ-PIPE-163
  - REQ-PIPE-202
  decisions:
  - 'THE TERMINAL GETS ITS OWN REQUIREMENT, DRAFTED NOW (Keith, 2026-10-14, close-out Q19, option A): the queue, like the
    page, invited a decision on the reader when the decision that clears it is another table''s. REJECTED the page half only,
    and leaving both.'
  - 'THE SAME CAUSES AS THE PAGE (delivery-scoper, derived from Keith, 2026-10-14, close-out Q17 and Q19, not asked separately):
    Keith chose every cross-table cause for the page and ''both'' for page and terminal, so the terminal covers the same causes
    rather than contested only.'
  - 'THE READER''S OWN DECISIONS STAY (delivery-scoper, PROPOSED): a person may still have a reason to reject a reader, and
    removing the choice is a bigger change than Keith asked for.'
  - 'A READER LISTED BENEATH ITS CAUSE IS NOT COUNTED (Keith, 2026-10-14, follow-up F6, option A, the recommendation): criterion
    7 - the count is the number of things to decide. REJECTED counting every waiting supply as today, with the grouping only
    changing where it is shown.'
  - 'SHOULD (Keith, 2026-10-14, follow-up F14, option B): REQ-PIPE-211 is must; this requirement and REQ-DASH-209 are should.'
  - 'FOLDED 2026-10-14 (delivery-scoper, Keith''s follow-up answers F6 and F14): criterion 6 extended, criterion 7 added.
    F6 left two cases open - a reader with no item to sit beneath, and the page''s own counts - now open questions 1 and 2.'
  open_questions:
  - '1. A READER WITH NOTHING TO SIT BENEATH (follows F6). Criterion 2 lists a reader beneath its cause only where the cause
    has an item of its own in this queue. An overdue cp_clients supply has none, so its readers are rows of their own, each
    saying nothing needs deciding on it. F6 covered readers listed beneath a cause. PROVISIONAL in criterion 7: these readers
    are counted as today. Recommended (A): do not count them either - F6''s reason, ''the count is the number of things to
    decide'', applies equally, and a line under the count says how many readers are waiting on another table. (B) count them,
    as drafted - every row in the queue is counted, and nothing needs explaining.'
  - '2. THE PAGE''S OWN COUNTS (follows F6; NFR 3 says the page and the terminal decide through one function). The dashboard
    counts supplies waiting for a person in each agency and collection card''s breakdown. Recommended (A): the same rule there
    - a reader whose red is wholly another table''s is not counted as waiting for a person, through the same one function,
    the cause carrying it (REQ-DASH-204 criterion 18''s line). This would add a criterion to REQ-DASH-204. (B) the terminal
    only, as F6 was asked - the page keeps counting every waiting supply.'
- id: REQ-PIPE-211
  title: Settling a contested pair, whatever the outcome, re-checks the datasets whose checks the contest stopped
  date_written: '2026-10-14'
  story: As the person who settles a contested pair, I want the datasets whose cross-table checks could not run because of
    the pair to be re-checked once I have settled it - even when I reject both files - so that they do not stay red for good
    on a contest that has ended.
  moscow: must
  status: not_started
  source: 'Keith, 2026-10-14 morning, close-out Q21, option A: after ''reject both'' the readers are re-checked via a small
    pipeline follow-up. Found by the round 3 architect review (D19): the knock-on re-evaluates only when a period''s holding
    changes (decision_log.apply_decision), and rejecting both files changes nothing held. Drafted by delivery-scoper the same
    morning; NOT REVIEWED by delivery-architect or by a UX reviewer.'
  acceptance_criteria:
  - WHEN the contest of a table in a period ends - by a person's settlement of the pair (REQ-PIPE-193), whatever the outcome,
    'reject both' included, or by a later arrival superseding the pair (REQ-PIPE-118 criterion 13, REQ-PIPE-194 criterion
    9), whether or not that arrival is promoted - THE SYSTEM SHALL record, in the same transaction as the settlement or the
    supersession, that a re-evaluation is owed of every cross-table check in that period recorded as not evaluated because
    that table was contested, through REQ-PIPE-121's one handler (knock_on), and SHALL NOT add a settlement-specific or supersession-specific
    re-evaluation path.
  - THE SYSTEM SHALL evaluate those checks against what the period holds for the table once the contest has ended, and WHERE
    it holds nothing - both files rejected, or the later file that superseded the pair still waiting - SHALL record each as
    not evaluated for the reason that now applies (REQ-PIPE-115), never as contested.
  - THE SYSTEM SHALL apply the promotion gate to each waiting supply the re-evaluation touched, exactly as REQ-PIPE-121 criterion
    3 does, and SHALL NOT demote, supersede or reject a promoted one (REQ-PIPE-121 criterion 6).
  - WHERE the settlement or arrival that ends the contest also moves or promotes a file, THE SYSTEM SHALL run one re-evaluation
    for it, covering both (REQ-PIPE-121 criterion 9), and SHALL NOT run two.
  - IF the re-evaluation fails to run, THEN THE SYSTEM SHALL leave the settlement or the supersession standing and the re-evaluation
    owed, and complete it on the next processing pass (REQ-PIPE-121 criteria 14 to 16).
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-193 criterion 23 so that a settlement owes the knock-on whatever
    its outcome, and REQ-PIPE-121 criterion 1 so that the end of a contest - by a settlement or by a later arrival superseding
    the pair - is among the knock-on's triggers.
  - THE SYSTEM SHALL have fixture tests, written first and seen to fail, that end a Child Protection contest three ways -
    a settlement rejecting both files, a settlement choosing a file that is left waiting red, and a later file superseding
    the pair and left waiting - and assert in each that no result recorded as contested remains current for the readers in
    that period; and one that settles a pair in the terminal and asserts that the readers are re-checked before the outcome
    panel is shown.
  - WHEN a pair is settled in the terminal - through the settle flow or the flag form (REQ-PIPE-193 criterion 15) - THE SYSTEM
    SHALL run the owed re-evaluation while the person waits, after the settlement's own QA runs and gates (REQ-PIPE-193 criterion
    21) and before its outcome panel; SHALL name it, with the readers it covers, among what follows in the settlement's warning
    panel (REQ-PIPE-193 criterion 17); and SHALL show in the outcome panel each reader re-checked, with its status afterwards.
  - WHEN a later arrival supersedes a contested pair, THE SYSTEM SHALL run the owed re-evaluation in the processing pass that
    files that arrival.
  non_functional_requirements:
  - 'NO FALSE GREEN: the re-evaluation re-runs the readers'' cross-table checks against what is there; it never clears a red
    by dropping a check.'
  - 'COST: cross-table checks only, never a reader''s own table-level checks (REQ-PIPE-121 criterion 2); at thirty datasets
    a widely read table may have many readers, all covered by the one re-evaluation per decision.'
  - 'RELIABILITY: owed in the settlement''s transaction and finished by the processing pass if interrupted (criterion 5).'
  - 'AUDITABILITY: every result it records names the settlement as its cause (REQ-PIPE-121 criterion 5).'
  - 'TEST FIRST: criterion 7''s ''reject both'' case is today''s defect - the readers stay red for good.'
  - 'PERFORMANCE: a person settling in the terminal now also waits for the readers'' cross-table re-check (criterion 8) -
    one re-evaluation per settlement, cross-table checks only, named in the warning panel beforehand so the wait is expected.'
  dependencies:
  - REQ-PIPE-193
  - REQ-PIPE-121
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-PIPE-202
  - REQ-PIPE-118
  decisions:
  - 'THE READERS ARE RE-CHECKED AFTER ''REJECT BOTH'' (Keith, 2026-10-14, close-out Q21, option A, the architect''s recommendation):
    otherwise they stay red for good. REJECTED leaving them for the next supply or a person''s re-check (REQ-PIPE-164), with
    REQ-DASH-204''s line saying so.'
  - 'EVERY OUTCOME, NOT ONLY ''REJECT BOTH'' (delivery-scoper, following the architect''s wording of option A - ''settling
    a pair, any outcome, re-evaluates the readers waiting in its period''): a file chosen as this period''s supply and left
    waiting red changes nothing held either, so its readers would keep a stale ''contested'' result too.'
  - 'SUPERSEDED IN PART 2026-10-14 by follow-up F5 below - REQ-PIPE-121 criterion 1 is now amended too. WAS: AMEND REQ-PIPE-193
    CRITERION 23, NOT REQ-PIPE-121 (delivery-scoper, PROPOSED - for the architect to confirm): 193 criterion 23 is where a
    settlement''s knock-on is stated, and REQ-PIPE-121 criterion 8 already forbids a second path.'
  - 'PROPOSED AMENDMENT WORDING, for Keith''s approval (delivery-scoper, 2026-10-14) - REQ-PIPE-193 criterion 23 (signed;
    criterion 6 here) to read: ''WHEN a pair is settled, whatever its outcome (REQ-PIPE-211), WHEN a settlement moves a file
    into or out of a period, and WHEN a settled supply is promoted, THE SYSTEM SHALL owe the knock-on through REQ-PIPE-121''s
    one handler (knock_on), which selects the checks by reevaluation.reading_checks() and the datasets by reevaluation.counts_toward(),
    and SHALL NOT add a settlement-specific path or restate either rule.'''
  - 'PROPOSED AMENDMENT WORDING, for Keith''s approval (delivery-scoper, 2026-10-14, revised the same day for follow-up F5;
    batch amendment 27) - REQ-PIPE-121 criterion 1 (signed 2026-10-04, built; criteria 1 and 6 here). OLD: "WHEN a table arrives
    in or leaves a period schema - promoted by a rule or a person, re-filed in or out, superseded, demoted or rejected - THE
    SYSTEM SHALL re-evaluate, within that period only, every cross-table check that declares it reads the moved table, whether
    it belongs to a supply WAITING in that period or one PROMOTED there, and SHALL NOT re-evaluate any check that does not
    read a moved table." NEW: "WHEN a table arrives in or leaves a period schema - promoted by a rule or a person, re-filed
    in or out, superseded, demoted or rejected - or the contest of a table in that period ends, by a person''s settlement
    of the pair whatever its outcome or by a later arrival superseding the pair whether or not that arrival is promoted (REQ-PIPE-211),
    THE SYSTEM SHALL re-evaluate, within that period only, every cross-table check that declares it reads the moved table
    or the table whose contest ended, whether it belongs to a supply WAITING in that period or one PROMOTED there, and SHALL
    NOT re-evaluate any check that reads neither. AMENDED <date built> by REQ-PIPE-211 criterion 1." WHY: neither a settlement
    that leaves nothing promoted nor a later file superseding the pair and left waiting moves a table into or out of the period
    schema - a contested pair''s files are staged, never in it - so as worded criterion 1 does not trigger, and its last clause
    forbids re-evaluating a check that reads no moved table. BUILT BEHAVIOUR: BUILT CODE CHANGES with REQ-PIPE-193 criterion
    23 (knock_on gains a trigger); built and tested by REQ-PIPE-211. NOTE: NO LONGER CONTINGENT in the scoper''s reading,
    since F5: REQ-PIPE-193 criterion 23 can carry a settlement''s knock-on, but a later arrival''s supersession is not a settlement,
    and REQ-PIPE-121 criterion 1 is the list of the one handler''s triggers. The architect''s review may still place the supersession
    trigger elsewhere (REQ-PIPE-118).'
  - 'A PAIR ENDED BY A LATER FILE ALSO RE-CHECKS THE READERS (Keith, 2026-10-14, follow-up F5, option A, the recommendation):
    criteria 1, 2, 4, 5, 7 and 9. The contest ending by supersession owes the same re-evaluation; otherwise the readers keep
    a ''contested'' result until the later file is promoted, which may be never. REJECTED settlements only, as Keith''s close-out
    Q21 answer was worded. This is what makes the REQ-PIPE-121 criterion 1 amendment (batch amendment 27) needed rather than
    contingent.'
  - 'IN THE TERMINAL THE RE-CHECK RUNS WHILE YOU WAIT (Keith, 2026-10-14, follow-up F7, option A, the recommendation): criterion
    8 - with the settlement''s own runs, so the outcome panel shows the readers re-checked. REJECTED leaving it owed for the
    processing pass. No amendment to REQ-PIPE-193 criterion 17: it says the panel lists the QA runs that follow, and naming
    the re-evaluation as well adds to that list without contradicting it.'
  - 'A ''REJECT BOTH'' CHILD PROTECTION SCENARIO IS PLANTED, AS TS-81, BY REQ-GEN-206 (Keith, 2026-10-14, follow-up F8, option
