  - IF the address names an agency, collection or period the dashboard does not hold, THEN THE SYSTEM SHALL show the existing
    not-found page (renderNotFound) naming what was not found, and SHALL NOT show an empty view.
  - 'THE SYSTEM SHALL show beside the view''s h2 a link to the previous period''s composition view and one to the next period''s,
    reading ''Previous period: <period name>'' and ''Next period: <period name>'' - ''Previous day: <date>'' and ''Next day:
    <date>'' for a daily collection - each a real <a href> to that period''s route (criterion 6) keeping the date on show
    in the in-place-on parameter; and SHALL leave a link out, rather than show it disabled, where the collection''s history
    has no earlier period or where the next period had not opened by the date on show.'
  non_functional_requirements:
