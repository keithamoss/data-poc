  non_functional_requirements:
  - AT THE TARGET SCALE THIS IS NOT RARE. The synthetic database held 9 assignment-rule holds for Case Workers on 2026-10-07
    and 8 on 2026-10-13 (`mothman supply holds`, re-run by the scoper), every one waiting on an action no route offers. A
    schedule-ended backlog (REQ-PIPE-154) on a daily feed is a hold per day, and since 2026-10-13 a settlement can raise one
    too (REQ-PIPE-193 criterion 11).
  - A person's placement is the strongest form of 'I know which period this is', and it is recorded with actor and reason
    like everything else - no placement without a reason, because a year later somebody will ask why a supply that arrived
    in March sits in January.
  - Gated exactly as a first arrival, under the settings in force at the instant of placing (REQ-PIPE-122, REQ-PIPE-123) -
    a person placing a supply is not a person promoting it.
  - 'PRIVACY: the placement''s reason is published on the dashboard (criterion 21). Today''s data is synthetic; in a real
    deployment of Child Protection data the reason prompt is the one free-text field that could carry a child''s or family''s
    details, so the prompt says it is published and the reason is rendered as text, never markup.'
