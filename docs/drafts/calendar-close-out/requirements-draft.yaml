- id: REQ-PIPE-179
  title: A dataset, or a whole collection, can be turned off for a time or for good, and nothing still owed goes quiet
  date_written: '2026-10-10'
  story: As the person who looks after a delivery agreement, I want to turn a dataset - or a whole collection - off when its
    supplier stops supplying for a while or for good, without deleting its configuration or history, so that it stops owing
    supplies from the right date while anything it still owed before then is chased as usual.
  moscow: must
  status: not_started
  source: 'Keith, 2026-10-07 (effective_to, proposed by him while signing off REQ-PIPE-110) and 2026-10-10 (his answers to
    the four-agent review of REQ-PIPE-110: delivery-scoper, delivery-architect, delivery-cli-ux, delivery-dashboard-ux). Split
    out of REQ-PIPE-110 and drafted by the main session on 2026-10-10. NOT YET THROUGH delivery-scoper as a requirement of
    its own - say so when it is presented for sign-off. Re-scoped jointly with REQ-PIPE-163 by delivery-scoper, 2026-10-13
    - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182 with the Child Protection pattern widening (Keith, 2026-10-13:
    close out the calendar group before the road-testing review; scope 163 WITH 179 so 179 does not amend a requirement that
    may change under it).'
  acceptance_criteria:
  - THE SYSTEM SHALL let a participation version - a dataset's, or a collection's participation_defaults version - state an
    effective_to date, the last day it governs on the data asset's clock, inclusive.
  - IF a participation version states effective_to without turned_off_reason, or turned_off_reason without effective_to, THEN
    THE SYSTEM SHALL reject the configuration; and WHERE such a version states reason in place of turned_off_reason, the refusal
    SHALL say that turned_off_reason is the key for a turn-off, reason being the explanation for owing only some periods.
  - THE SYSTEM SHALL treat a dataset as turned off on a date WHERE its own latest participation version starting on or before
    that date states an effective_to before it, or WHERE its collection's latest participation_defaults version starting on
    or before that date states an effective_to before it and the dataset has no version of its own whose effective_from falls
    after that effective_to and on or before the date.
  - WHILE a dataset is turned off on a period's date, THE SYSTEM SHALL treat it as owing nothing in that period, and SHALL
    keep the dataset and its configuration in contract/calendar.yaml.
  - WHERE no later version follows an effective_to, THE SYSTEM SHALL treat the dataset as turned off from then on, with no
    end.
  - WHERE a dataset's own participation version takes effect inside its collection's turned-off gap, THE SYSTEM SHALL treat
    that dataset alone as owing again from that version's effective_from, the rest of the collection staying off; and a later
    collection version SHALL NOT end a dataset's own turn-off.
  - WHILE a collection is turned off, THE SYSTEM SHALL take none of its participation values for any dataset, so that a dataset
    bringing itself back on states its own due time and grace (REQ-PIPE-110 criterion 29); and IF a dataset's own version
    taking effect inside its collection's turned-off gap leaves unstated any participation value its collection supplied it
    on the day before the gap, THEN THE SYSTEM SHALL reject the configuration, naming the dataset, each value and the collection's
    last value for it, and saying to state it.
  - THE SYSTEM SHALL decide whether a dataset owes a period from the participation in force on that period's date, and SHALL
    NOT decide it from the period's due date or from any supply's receipt date.
  - IF effective_to is earlier than its own version's effective_from, falls on or after the next version's effective_from
    at the same level, or leaves a gap before a later version that contains no period of the dataset's calendar - at collection
    level, of any inheriting dataset's calendar - THEN THE SYSTEM SHALL reject the configuration, naming the dataset or collection
    and the version, which rule it broke and the date to change; and THE SYSTEM SHALL accept a permanent turn-off even where
    the calendar has no period after its effective_to.
  - 'THE SYSTEM SHALL exclude effective_to and turned_off_reason from REQ-PIPE-110''s restate rule and from inherit: each
    belongs to the one version that states it.'
  - THE SYSTEM SHALL treat a change to effective_to - adding it, moving it or removing it - as an ordinary edit only where,
    for every dataset and period whose owed-or-not status the change flips, that period's earliest claim-opening instant has
    not yet passed - that instant computed, for a period inside a gap, with the inputs criterion 14 uses, and taken as the
    earlier of its values under the configuration before and after the change - and SHALL otherwise require a declared correction
    (REQ-PIPE-111), the refusal naming each period whose status the change flips and the claim-opening instant that has passed
    for it, and printing `mothman schedule draft-correction` on a line of its own.
  - THE SYSTEM SHALL freeze turned_off_reason together with its effective_to, and SHALL require a declared correction for
    any change to it after that freeze, a change of wording included.
  - THE SYSTEM SHALL generate no slot for a dataset in a period it owes nothing in by being turned off.
  - THE SYSTEM SHALL close the last owed slot before a turned-off gap at the claim-opening instant the next calendar period
    would have had for that dataset, each of its values resolved across levels as if every effective_to on or before that
    period's date were absent; and WHERE there is no next calendar period, as REQ-PIPE-131 criterion 16 closes the last authored
    period.
  - WHEN a supply arrives for a dataset, THE SYSTEM SHALL apply the filing rule against the slots of the periods the dataset
    owes, so that a supply finding an owed slot open at its receipt instant files there - late where past its due instant,
    as a resupply where the slot is filled - whether or not the dataset is turned off on its receipt date.
  - WHERE no owed slot is open at a supply's receipt instant and the calendar period whose slot would then be current - computed
    with criterion 14's inputs - is one the dataset is turned off in, THE SYSTEM SHALL receive the supply, record it and run
    its file checks, and SHALL hold it under REQ-PIPE-064's assignment-rule hold, recording as history a structured reason
    naming the effective_to, the turned_off_reason and the level that turned it off.
  - WHERE criterion 16 applies to a supply and its dataset's schedule has also ended (REQ-PIPE-154 criterion 1), THE SYSTEM
    SHALL label the hold turned off rather than schedule ended.
  - THE SYSTEM SHALL work out a held supply's label - turned off, schedule ended, or the plain assignment-rule hold - and
    its advice and responses from the configuration in force when they are read, for display, for re-filing, for the processing
    pass's tally, for the dashboard's backlog line and for every count, and SHALL keep the reason recorded when the hold was
    raised as history only.
  - WHEN configuration later gives any outstanding assignment-rule hold's receipt instant an open owed slot, whatever its
    label, THE SYSTEM SHALL file it by the rule on the next processing pass, generalising REQ-PIPE-154's schedule-ended re-file
    rather than adding a second re-filer, and SHALL leave every other hold for a person to place (REQ-PIPE-163) or reject,
    except a schedule-ended hold, which offers only adding dates; and WHERE the hold is one file of a held contested pair,
    SHALL re-file both files together, still contested (REQ-PIPE-163 criterion 37).
  - THE SYSTEM SHALL NOT let any supply be placed (REQ-PIPE-163), re-filed (REQ-PIPE-141), moved by a confirmed correction
    or carried out from a parked move (REQ-PIPE-170 criteria 7 and 26) into a period inside a turned-off gap; and a refusal
    SHALL name the gap and its turned_off_reason and say that changing effective_to or effective_from in contract/calendar.yaml
    is how a period becomes owed; for a placement this SHALL be the one refusal given, in place of REQ-PIPE-163 criterion
    7's rather than beside it.
  - IF a not_expected entry - a dataset's own - names a period inside a turned-off gap that applies to that dataset, whether
    the turn-off is its own or its collection's, THEN THE SYSTEM SHALL reject the configuration, naming the dataset, the not_expected
    entry's period, the gap (the effective_to it follows and the effective_from that ends it, or 'for good'), the level that
    turned it off and its turned_off_reason, and saying to remove the entry - by a declared correction (REQ-PIPE-111) where
    the entry is frozen.
  - THE SYSTEM SHALL treat a turned-off period as REQ-PIPE-098's inheritance treats a period the dataset does not participate
    in, so that the dataset's last promoted supply stands in it.
  - THE SYSTEM SHALL keep counting among the states needing a person (REQ-PIPE-064 criterion 5, REQ-PIPE-132 criterion 10)
    every item about a period the dataset owed - any period outside a turned-off gap - an open late slot, a supply on an owed
    period waiting for a person's decision (red included), a slot closed unfilled, a promoted supply listed as 'Promoted,
    then re-checked <verdict>' (REQ-PIPE-164) - until it is resolved, whether or not the dataset is turned off; a promoted
    red supply counts as resolved for this purpose and keeps its red-promoted badge on the dataset.
  - THE SYSTEM SHALL NOT count a supply held as turned off among the states needing a person - in the pipeline, the terminal's
    queue or the dashboard - and SHALL amend, in the same change, REQ-PIPE-064 criterion 5 and REQ-PIPE-083 criterion 21 to
    except it.
  - THE SYSTEM SHALL leave a dataset turned off for good out of the runway minimum and the exhausted-schedule list, and for
    a dataset in a temporary gap SHALL count towards its runway only the periods it owes once it is turned back on.
  - THE SYSTEM SHALL count turned-off holds separately in the processing pass's summary, as REQ-PIPE-154 criterion 6 counts
    schedule-ended holds.
  - 'THE SYSTEM SHALL resolve participation through one helper that returns, for a dataset on a date, one of: not yet owing;
    turned off, with its turned_off_reason, the level that turned it off and the last applying version''s resolved timing;
    or the values REQ-PIPE-181 criterion 2 resolves for that date, each with its level - the one resolution function REQ-PIPE-181
    names - and SHALL route every consumer of participation through it.'
  - 'THE SYSTEM SHALL show, in the terminal''s Calendar entry (REQ-PIPE-169) and in `mothman schedule show --dataset <id>
    --on <date>` (REQ-PIPE-181''s one renderer), for a dataset with an effective_to: the level that turned it off, and for
    a dataset back on inside its collection''s gap, that its own version brought it back; the date it is turned off after
    and its reason; which periods it still owes and until when their slots stay open; which periods it owes nothing in and
    whether the turn-off is permanent; and the instant until which the turn-off can be changed by an ordinary edit.'
  - WHILE a dataset is turned off on the date asked about and owes no period whose slot is still open, THE SYSTEM SHALL show
    'Turned off - nothing due', and SHALL show the due time and grace of its last version only labelled 'when last on'; and
    WHILE its last owed slot before a turn-off has closed and its effective_to has not yet passed, SHALL show 'Turning off
    after <effective_to> - nothing more owed'.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-111 criterion 2 to give effective_to and turned_off_reason their
    own freeze point as criterion 11 of this requirement states, and to count a turned-off dataset in a dated calendar entry's
    freeze only for the first period of its gap; criterion 4 to add effective_to and turned_off_reason to what a dataset's
    or collection's corrections cover; and criterion 15 to name mark-as-not-supplied (REQ-PIPE-132) as the after-the-fact
    route for an effective_to as it does for not_expected.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-113 criteria 2 and 4 and REQ-PIPE-131 criteria 1 and 2 so that a
    slot's inputs and closing instant follow criterion 14 of this requirement around a turned-off gap; and REQ-PIPE-134 criterion
    1 so that the overlap gate skips a pair of consecutive periods both inside one turned-off gap, checks the last owed period
    before a gap against the closing instant criterion 14 gives it, and checks that the first owed slot after a temporary
    gap opens after the last owed slot before it closes.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-154 criteria 1, 2, 6 and 7 so that turned off outranks schedule ended
    and every label they read is the one criterion 18 works out; REQ-PIPE-064 criterion 8 likewise; REQ-PIPE-098 criterion
    1 to name a turned-off period beside one the dataset does not participate in; and REQ-PIPE-053 criteria 4, 10 and 15 so
    that a dataset turned off for good is neither warned about nor counted; each amending the text as REQ-PIPE-181 left it.
  - THE SYSTEM SHALL read all of this from committed configuration and recorded facts, and SHALL NOT read supply rows to decide
    it.
  - THE SYSTEM SHALL list supplies held as turned off in the terminal's queue in a quiet last group, 'Received while turned
    off (N)', after the slot rows and outside the count of supplies waiting on a decision, each saying 'Received while <dataset>
    is turned off (<reason>, set for <level>). Place it into a period it still owes, reject it, or change effective_to/effective_from
    in contract/calendar.yaml if this period should be owed.'
  - WHEN a declared correction changes effective_to, THE SYSTEM SHALL propose the filing moves that result through REQ-PIPE-170's
    confirmation, a supply left in a period inside the new gap becoming a turned-off hold.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-170 so that IF a corrected configuration makes a supply's current
    period one its dataset owes nothing in - by participation, not_expected or a turn-off - THEN keep is not offered for that
    supply, and the correction proposes moving it to the owed slot the filing rule gives it or holding it, saying that the
    period no longer owes a supply.
  - IF a parked move's confirmed period lies inside a turned-off gap when its blocker clears, THEN THE SYSTEM SHALL leave
    the move parked, say so naming the gap and its turned_off_reason, and list it among the states needing action, as REQ-PIPE-170
    criterion 27 does for a supply no longer where it was parked from.
  - THE SYSTEM SHALL amend, in the same change, REQ-PIPE-173 so that a slot a recorded verdict was judged in, which the configuration
    no longer owes because an effective_to was added or moved without a declared correction, counts as a difference the backstop
    refuses, as a changed slot input does.
  - THE SYSTEM SHALL generate, as registered scenario TS-63, in the same change that builds this requirement, a Child Protection
    dataset turned off for a while in the synthetic history - DECLARED AS A CORRECTION in contract/calendar.yaml (REQ-PIPE-111),
    dated before the gap's first period so that the gap's arrivals are filed under the corrected agreement as they arrive,
    with Keith's real identity as its approver and a reason saying it is a fictional correction made for this synthetic asset's
    demonstration, giving a participation version an effective_to and a turned_off_reason and a later version turning it back
    on two quarters later, the dataset's participation first split from the shared *cp_participation alias so that no other
    dataset is turned off with it - placed in quarters REQ-GEN-207 adds by growing the Child Protection history earlier, so
    no existing scenario's quarter moves; with, through REQ-GEN-044's injection mechanism, one supply for its last owed quarter
    arriving after the effective_to but while that quarter's slot is open, and one supply arriving inside the gap with no
    owed slot open; and SHALL update TS-63's register entry to the Child Protection calendar's real dates, saying that the
    ordinary deliveries inside the gap still carry the dataset's file, which is received, held as turned off and counted in
    REQ-DASH-180's quiet line, and that cp-carers reads 'awaiting confirmation' from the correction's date to the end of the
    history, because a replay confirms a correction only at its end.
  - THE SYSTEM SHALL record, in the same change, that REQ-PIPE-170 criterion 23's TS-63 is delivered by criterion 39 of this
    requirement, re-pointing REQ-PIPE-170's unmet entry for criterion 23 so that it names TS-57 to TS-62 only.
  non_functional_requirements:
  - 'A SHAPE CHANGE WITH MANY CONSUMERS - enumerate them mechanically and route each through the one helper (criterion 27).
    Found by delivery-architect, 2026-10-10: schedule.periods_for_dataset, slots.slots_for_dataset and _calendar_periods,
    period_overlap.overlaps_for, runway.calendar_runway, exhausted_datasets and schedule_ends_on, filing.final_period_for,
    assignment.schedule_ended, supply_holds.reason_for/describe/responses/Tally, schedule_ended.refile_covered, inheritance._does_not_participate,
    slots.is_owed_supplies, validate_schedule._expects_nothing_errors, dashboard/embed_dashboard_data.py, cli/schedule.py,
    dataset_blockers.py and both pipeline/build_*_dashboard_data.py. supply_holds.SCHEDULE_FILE hardcodes a configuration
    path and must read the agreement value instead. _version_in_force''s fallback to the first version must never apply to
    participation. RE-ENUMERATED 2026-10-13 (delivery-scoper, by grep for participation_on, resolved_versions, participates,
    is_owed, .expected, periods_for_dataset and not_expected): built since that list and missing from it - agreement_drift
    (REQ-PIPE-173), agreement_freeze.flatten (REQ-PIPE-111), participation_view (REQ-PIPE-181), verdict (REQ-PIPE-168), correction_trial
    and correction_apply (REQ-PIPE-170), settlement''s hold judgement (REQ-PIPE-193 criterion 11), cli/env.py, and both generators
    (generate_runs.py, generate_cp_runs.py), which read a dataset''s periods to decide what to generate - a turned-off gap
    generates no supply the dataset owes - the whole-delivery generator still writes the dataset''s file into each gap delivery,
    which is received and held as turned off (architect E21). Re-run the grep at build time rather than trusting either list.'
  - 'No false quiet: a turn-off never hides anything about a period that was owed. That is the line every criterion here is
    held to, because a turn-off read as ''ignore it'' is the way an overdue supply would go unnoticed.'
  - Config only for every rule about what is owed; no supply rows.
  - 'PERFORMANCE: the helper is called per dataset per date by every consumer, so it works from REQ-PIPE-110''s one agreement
    value and never re-reads the file; a dashboard build over thirty datasets and years of daily periods stays within its
    existing time.'
  - 'AUDITABLE: every effective_to and turned_off_reason sits on a version with a structured changelog entry (REQ-PIPE-110),
    so who turned a dataset off, when and why is in the file, and changes after the freeze are declared corrections with an
    approver.'
  - 'TEST FIRST: each criterion that guards against a false quiet - criteria 14, 15, 16, 18 and 23 above all - gets a test
    written first and seen to fail, because a turn-off that hides an owed period looks exactly like one that works.'
  - 'SECURITY: turned_off_reason is free text from configuration and is rendered as text, never as markup, everywhere it is
    shown.'
