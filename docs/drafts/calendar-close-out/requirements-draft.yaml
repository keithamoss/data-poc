requirements:
- id: REQ-DASH-204
  title: A dataset turned red by another table it reads says so at the top of its page, naming that table and what clears
    it
  date_written: '2026-10-14'
  story: As a data team leader opening a Child Protection dataset that reads red, I want the top of its page to tell me when
    the red comes from ANOTHER table - two files for one table, a file that could not be loaded, a supply held, overdue or
    waiting on a decision - naming that table and what clears it, so that I go to the one decision or arrival that clears
    it instead of hunting through this dataset's checks for a fault it does not have.
  moscow: must
  status: not_started
  source: 'Keith, 2026-10-13 evening, answering the CLI and dashboard UX reviews of the calendar close-out batch (plans/running-thoughts.md
    #92): ''a reader dataset turned red by ANOTHER table''s contest gets a NEW DASHBOARD REQUIREMENT NOW (a top-of-page line
    naming the contested table), not a later sighting.'' Drafted by delivery-scoper overnight 2026-10-13 to 14 while Keith
    was asleep, so every fork is an open question rather than a decision.'
  acceptance_criteria:
  - WHERE the run the dataset's status is computed from on the date on show includes a cross-table check recorded as not evaluated
    because a table belonging to ANOTHER dataset was contested, could not be loaded, held with no period, past due or staged
    and awaiting a decision (REQ-PIPE-115 criteria 14 to 16, held_blast_radius), THE SYSTEM SHALL show at the top of that
    dataset's page ONE notice in the page's red notice style - after the waiting-blocker banner and before the exhausted-schedule
    banner - holding one line per such table, each beginning in bold with criterion 15's wording for its cause, and naming
    the period; and SHALL NOT show a line for a table that is merely not yet due.
  - THE SYSTEM SHALL say in that line how many of this dataset's checks read that table and could not run, that those checks
    did not fail on this dataset's own data, and what runs them again - criterion 15's next step for the cause.
  - THE SYSTEM SHALL NOT word the line so that it says or implies this dataset has nothing else wrong, and SHALL NOT change
    the dataset's status because of it - the line explains the red and never removes it.
  - THE SYSTEM SHALL show one line per contested table however many of the dataset's checks read it, and SHALL NOT show a
    line per check.
  - THE SYSTEM SHALL make the contested dataset's name in the line a real link (<a href>) to that dataset's page at the same
    date on show, built as affectsLinks() builds its links, so that middle-click and copying the link keep the date.
  - THE SYSTEM SHALL judge the line as at the date on show - from the run the dataset's status is computed from on that date
    and the contest's opening and resolving instants on the asset's clock (REQ-PIPE-194 criteria 9 and 14) - and SHALL NOT
    judge it as at the build.
  - WHILE a contest is resolved on the date on show but the run the dataset's status is computed from still carries checks
    not evaluated because of it, THE SYSTEM SHALL say in the line that the pair was settled, or superseded, on <date on the
    asset's clock>, that these checks have not run again since, and what runs them again - the re-check settling the pair
    owes (REQ-PIPE-211), a later supply of <dataset> promoted into the period, or a person's re-check of this supply (REQ-PIPE-164,
    once built) - and SHALL NOT say that the red is waiting on the pair.
  - WHEN the dataset's checks have been re-evaluated (REQ-PIPE-121's knock-on) so that the run its status is computed from
    carries no check not evaluated because of another table, THE SYSTEM SHALL show no line.
  - THE SYSTEM SHALL NOT show the line on the page of the dataset whose table is the cause, which carries criterion 17's 'Affects'
    instead.
  - THE SYSTEM SHALL record, for every not-evaluated cross-table result, the reason's code for EACH table it names (unrunnable_codes_by_table,
    beside today's single unrunnable_code), SHALL carry it and a held-supply record's held_tables into the dashboard data,
    and SHALL identify the blocking table and its cause from those fields alone, never by parsing the reason's prose; records
    written before this change SHALL be read by their single unrunnable_code.
  - THE SYSTEM SHALL compute the line at build time from recorded QA results and recorded decisions only, and SHALL NOT read
    supply rows.
  - THE SYSTEM SHALL render every name in the line as text, never as markup.
  - THE SYSTEM SHALL have real-browser tests, against a dashboard built from a fixture history, written first and seen to
    fail, in which a reader dataset shows one line naming the contested table while the pair is open - though three of its
    checks read that table - and no line once its checks have been re-evaluated after the settlement; and in which a reader
    of a table that could not be loaded shows that cause's line.
  - WHERE the synthetic history holds TS-42 or TS-80 (REQ-GEN-203), THE SYSTEM SHALL quote the line, as the page words it,
    in each scenario's register entry for its three reader datasets on the pair's arrival day.
  - 'THE SYSTEM SHALL word each cause''s line, and its next step, as follows, rendering <dataset> as criterion 5''s link:
    contested - ''Red because <dataset> has two files for one table'', next step settling the pair (''say what each file is'',
    REQ-PIPE-194 criterion 15) or a later file superseding it; could not be loaded - ''Red because <dataset>''s file for <period>
    could not be loaded'', next step a corrected file or a person rejecting it (REQ-PIPE-153); held - ''Red because <dataset>''s
    supply is held with no period'', next step placing or rejecting it (REQ-PIPE-163); past due - ''Red because <dataset>''s
    supply for <period> is overdue'', next step the supply arriving or a person marking it not supplied (REQ-PIPE-132); staged
    and awaiting a decision - ''Red because <dataset>''s supply for <period> is waiting on a decision'', next step a person
    promoting or rejecting it. (NEW WORDING - for Keith''s approval.)'
  - WHERE every red check on a reader's waiting supply is one not evaluated because of another table, THE SYSTEM SHALL word
    the reader's verdict line and its outstanding item to say that nothing needs deciding on this supply, and that its checks
    run again and the gate is applied again once <criterion 15's next step> (REQ-PIPE-121), and SHALL NOT offer promote or
    reject as its next step.
  - THE SYSTEM SHALL end the notice the causing dataset's own page shows for that cause - the 'Two files for one table' banner,
    or the notice it shows for a file that could not be loaded, a held, an overdue or a waiting supply - with 'Affects <reader
    links>', built by affectsLinks(), naming each dataset this criterion's line appears on at the date on show.
  - THE SYSTEM SHALL show, in the collection table, a quiet note under each such reader's status pill naming the causing table,
    in the noSupplyNote shape, and on the collection card ONE line per causing table, in the redPromotedMarker shape, naming
    that table once with the number of readers it holds red, and SHALL NOT list each reader on the card.
  non_functional_requirements:
  - 'SCALE (CLAUDE.md''s ~30-datasets rule): one line per contested table, never per check - cp-investigations alone carries
    several checks reading cp_clients (Soda and dbt referential checks, reads_tables [cp_clients]), and on a thirty-dataset
    asset a widely read table could hold many readers red at once; each reader''s page says the cause once.'
  - 'PERFORMANCE: computed once per dataset per build from the results already embedded; no per-render scan of history, so
    page load does not grow with the number of past runs.'
  - 'THE BUILD RULE: a build may read recorded QA results, never actual data, and never anything else (criterion 11).'
  - 'PRIVACY: the line names the other dataset and the period, never the two filenames - those stay on the contested dataset''s
    own banner (REQ-PIPE-194 criterion 1) - so a supplier''s file naming is shown in one place, not repeated on every reader.'
  - 'ACCESSIBILITY AND CONSISTENCY: the same notice styling and role=''status'' the page''s other top-of-page banners use,
    and the one label REQ-PIPE-194 criterion 15 fixes; no new asset, so the self-hosted, file:// and offline viewing paths
    are unaffected.'
  - 'TEST FIRST for criterion 3 above all: a line that read as ''this dataset is fine'' would be the false-green direction.'
  dependencies:
  - REQ-PIPE-115
  - REQ-PIPE-194
  - REQ-PIPE-121
  - REQ-DASH-197
  - REQ-PIPE-202
  - REQ-GEN-203
  - REQ-PIPE-164
  - REQ-PIPE-211
  - REQ-PIPE-163
  - REQ-PIPE-132
  - REQ-PIPE-153
  decisions:
  - 'A NEW REQUIREMENT NOW (Keith, 2026-10-13): a top-of-page line on the reader naming the contested table. REJECTED leaving
    it for a later road-testing sighting.'
  - 'WHY A READER GOES RED, VERIFIED IN CODE 2026-10-14 (delivery-scoper): qa_tools/common/unrunnable.py records each cross-table
    check that reads a contested table as status fail with unrunnable_code ''contested'', in the reader''s OWN run (REQ-PIPE-115
    criteria 14 to 16; period_schema.CONTESTED outranks every slot reason); promotion.status_of counts every contributing
    check, so the reader''s status is red and the gate withholds it. Child Protection''s readers of cp_clients are cp-notifications,
    cp-investigations and cp-placements (reads_tables [cp_clients] in contract/child-protection-soda-checks.yml and dbt_project/models/staging/schema.yml),
    several checks each.'
  - 'WHAT THE PAGE SAYS TODAY, VERIFIED IN THE TEMPLATE 2026-10-14: the reader''s pill is red; each affected check card carries
    ''not evaluated in the latest run''; the reason appears only inside the check''s drawer, under ''Not evaluated in the
    current run''. The top-of-page banners (blockedBanner, waitingBanner) are about the dataset''s OWN supply only, so nothing
    at the top names the other table. pipeline/build_cp_dashboard_data.py carries only the reason''s prose to the page, not
    its code or table - hence criterion 10.'
  - 'THE SAME SHAPE IS ON THE REAL PAGE TODAY FOR AN UNLOADABLE TABLE: the bootstrapped database (queried 2026-10-14) holds
    ''could-not-be-loaded'' records against cp_clients in all three readers'' runs, from TS-12''s quarter, and no ''contested''
    ones - Child Protection cannot be contested until REQ-PIPE-202 widens the pattern. Whether the line covers that kind too
    is open question 1.'
  - 'THE LINE EXPLAINS THE RED, NEVER REMOVES IT (delivery-scoper, PROPOSED): a check that could not run counts as red until
    it can - the template''s own drawer text says so, and REQ-PIPE-115 records it red. REJECTED showing such a reader amber
    or with its status recomputed without those checks: that is the false-green direction, and the gate would disagree with
    the page.'
  - 'NAMES THE DATASET AND PERIOD, NOT THE FILES (delivery-scoper, PROPOSED): the contested dataset''s own banner names both
    files; repeating them on every reader multiplies a supplier''s naming across pages for no gain in what to do.'
  - 'ONE LINE PER CONTESTED TABLE (CLAUDE.md scale rule, the caller''s brief): REJECTED a line per affected check, which on
    cp-investigations would repeat one cause several times.'
  - 'ROUND 3 REVIEWS FOLDED (round 3 fold, delivery-scoper, 2026-10-14): architect D17 (criterion 10 - unrunnable.py writes
    ONE unrunnable_code per record, the first table''s by name order, and keeps no per-table reason, while held tables are
    recorded separately by held_blast_radius as tool ''held'' with held_tables; so the recorder gains a per-table code, which
    makes this requirement touch the PIPE recorder, said here rather than hidden); architect D18 (''results in place'' was
    undefined for a red reader - now ''the run the dataset''s status is computed from on the date on show''); dashboard UX
    4 (criterion 1 - one notice in the red notice style, its place among the banners, a bold first sentence); dashboard UX
    5 (criterion 5 - a real href built as affectsLinks() builds them, verified in the template); dashboard UX 8 (criterion
    7 names what runs the checks again).'
  - 'OPEN QUESTION 1''s FIRST PREMISE WAS WRONG, CORRECTED (dashboard UX 3, verified 2026-10-14): a held table''s readers
    are recorded by held_blast_radius (tool ''held'', held_tables, held_reason), not under an unrunnable_code; and unrunnable
    records also carry past-due and staged-awaiting-decision, so ''another table is overdue'' - the commonest such red at
    thirty datasets - is a candidate too. The question is re-offered below with that option.'
  - 'EVERY RED ROOTED IN ANOTHER TABLE GETS THE LINE (Keith, 2026-10-14, close-out Q17, option A, the dashboard UX recommendation):
    contested, could not be loaded, held with no period, past due and staged awaiting a decision, each with its own wording
    and next step (criteria 1 and 15), never a not-yet-due one. At thirty datasets ''another table is overdue'' is the commonest
    such red. REJECTED contested and could-not-be-loaded only, and contested only (Keith''s original wording of the ask).
    The per-cause wording in criterion 15 is new and the scoper''s, for Keith''s approval.'
  - 'COLLECTION LEVEL: ROW NOTE, ''AFFECTS'', AND ONE CARD LINE (Keith, 2026-10-14, close-out Q18, option A as the summary
    put it, the dashboard UX review''s recommended set): criteria 17 and 18. One cause reads once on the card however many
    readers it holds red. REJECTED the row note and ''Affects'' only, and nothing at collection level.'
  - 'THE READER''S OWN WAITING ITEM SAYS NOTHING NEEDS DECIDING THERE (Keith, 2026-10-14, close-out Q19, option A): criterion
    16 is the page half; the terminal half is REQ-PIPE-210, drafted the same morning. Both surfaces today invite a decision
    on the reader when the decision that clears it is the other table''s. REJECTED the page half only, and leaving both.'
  - 'MUST (Keith, 2026-10-14, close-out Q20, option A): REQ-GEN-203 puts three red readers on the real page. REJECTED should.'
  - 'AFTER ''REJECT BOTH'' THE READERS ARE RE-CHECKED (Keith, 2026-10-14, close-out Q21, option A): REQ-PIPE-211, drafted
    the same morning, so settling a pair owes the readers a re-check whatever the outcome; criterion 7 names it as what runs
    them again.'
  - 'FOLDED 2026-10-14 (delivery-scoper, Keith''s close-out answers): title, story, criteria 1, 2, 7, 8, 9 and 13 generalised
    from the contested case to every cause; criteria 15 to 18 added. Criterion 15''s wording is new.'
  open_questions:
  - 'CHECK AT BUILD (not a question for Keith): criterion 17 assumes the causing dataset''s page already shows a notice for
    each cause to end with ''Affects''. The ''Two files for one table'' banner exists; for an unloadable, held, overdue or
    waiting supply, confirm which notice or outstanding item carries it, and bring any cause with none back to Keith rather
    than inventing a banner.'
- id: REQ-DASH-182
  title: The dashboard shows every period a dataset owes nothing in, with its reason, and the delivery time in force on the
    date on show
  date_written: '2026-10-10'
  story: As a data team leader reading a dataset's supply history, I want a period it owes nothing in to say so, with the
    reason, and its delivery time to be the one in force on the date I am looking at, so that I never read a deliberate gap
    as a missed supply or judge a supply against a due time that did not apply.
  moscow: must
  status: not_started
  source: 'Split out of REQ-PIPE-110 on 2026-10-10 (Keith, T9, option A, the delivery-scoper''s recommendation) with the criteria
    and decision it carried. NOT YET THROUGH delivery-scoper as a requirement of its own - say so when it is presented for
    sign-off. Scoper pass 2026-10-13: delivery-scoper, 2026-10-13 - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182
    with the Child Protection pattern widening (Keith, 2026-10-13: close out the calendar group before the road-testing review;
    scope 163 WITH 179 so 179 does not amend a requirement that may change under it).'
  acceptance_criteria:
  - THE SYSTEM SHALL show every period a dataset owes nothing in - whether by participation or by not_expected - together
    with its reason, and SHALL NOT omit it.
  - WHERE the dashboard shows a period a dataset owes nothing in, THE SYSTEM SHALL show it as a quiet row stating its kind
    - a participation row, 'Not expected - <reason>', and WHERE the dataset is turned off (REQ-PIPE-179), 'Turned off - <reason>'
    (REQ-DASH-180 criterion 15) - in its chronological place among the supply cycles, each run of consecutive periods of the
    same kind and reason as one row giving its first and last period and their count, only for periods up to the date on show,
    and SHALL NOT show it red, among things needing action, or as 'No supply'; a participation row, which recurs, SHALL carry
    a short label generated from the configuration - 'Not owed - outside its agreed months (Feb, Aug)' - and the authored
    reason SHALL be shown once, on the dataset's agreement tile, not on every row.
  - WHERE the dashboard shows a dataset's delivery time or cycle, THE SYSTEM SHALL take it from the values resolved for the
    dataset on the date on show - expected time, grace, participates and days before - each from the level REQ-PIPE-181 resolves
    it to; WHERE the date falls before its first participation version, SHALL show 'Not yet owing - first version takes effect
    <date>'; and WHERE the dataset is turned off on that date (REQ-PIPE-179), SHALL show it as REQ-DASH-180 criterion 16 says.
  - THE SYSTEM SHALL render every reason it shows as text, never as markup.
  - THE SYSTEM SHALL compute all of this from committed configuration and recorded results, and SHALL NOT read supply rows.
  - THE SYSTEM SHALL NOT show periods before a dataset's first participation version as owed-nothing rows.
  - WHERE a dataset's supply for a period is due on an earlier day than the period's date (days_before above 0), THE SYSTEM
    SHALL say so in the delivery-time label - 'by 22:00 the day before' where it is one day, 'by 22:00, N days before each
    date' where it is more - and SHALL NOT show the time alone.
  - WHERE a dataset's calendar is not exactly four delivery months a year, or its periods fall on different days of the month,
    THE SYSTEM SHALL still label its cycle in words, and SHALL NOT render the label blank.
  - WHERE an owed-nothing period stands on an earlier supply by inheritance (REQ-PIPE-098), THE SYSTEM SHALL show that on
    the same row - the period it stands on - rather than as a second row or a second pill for the same period; and the standing-in
    heading above that row SHALL name the row's kind label.
  - WHERE the current cycle on the date on show is a period the dataset owes nothing in, THE SYSTEM SHALL show that period's
    owed-nothing row in place of 'No deliveries in the current cycle yet.'
  non_functional_requirements:
  - Rendered from REQ-PIPE-110's agreement value; this only consumes it (docs/components.md).
  - Same date formatting as everything else on the page (REQ-DASH-071).
  - 'SCALE: rows are collapsed per run of periods (criterion 2), so the page carries one row per change of kind or reason,
    not one per period - a daily dataset owing nothing for a year is one row, and thirty datasets over years stay a handful
    of rows each.'
  - 'PERFORMANCE: computed at build time from configuration through REQ-PIPE-181''s one resolution function, never per period
    in the browser; the build''s time does not grow with the length of history beyond reading the calendar once.'
  - 'PRIVACY: reasons are authored configuration text, rendered as text (criterion 4); nothing here reads or shows supply
    rows.'
  dependencies:
  - REQ-PIPE-110
  - REQ-DASH-071
  - REQ-PIPE-181
  - REQ-PIPE-098
  - REQ-DASH-198
  - REQ-PIPE-113
  - REQ-PIPE-106
  decisions:
  - 'SPLIT FROM REQ-PIPE-110, 2026-10-10 (Keith, T9, option A), on the REQ-PIPE-154 / REQ-DASH-155 pattern: the configuration
    and its rendering are separate reviewable units. REQ-DASH-180''s turned-off rows are owed-nothing rows of a third kind
    and depend on this. The decision below travelled from REQ-PIPE-110 unchanged.'
  - 'PERIODS OWED NOTHING ARE QUIET, NEVER RED (delivery-dashboard-ux pre-build review, 2026-10-07): a reason row, grouped
    in supply history, never ''No supply'' and never in needs-action. The SLA label follows the participation version in force
    on the date on show.'
  - 'ROUND 3 FOLDED, 2026-10-10 (main session): the three kind labels fixed in one place so REQ-DASH-180 cannot drift (delivery-dashboard-ux
    15); rows in chronological place, a run of periods collapsed to one row, nothing after the date on show - a daily dataset
    turned off for a year would otherwise show 365 rows (14); the delivery time taken from resolved values with their levels,
    and said for a date before the first version (13, delivery-scoper F, delivery-architect 15); periods before the first
    version are not owed-nothing rows (delivery-scoper L).'
  - 'TWO LABEL DEFECTS LEFT HERE BY BUILT WORK (verified 2026-10-13): post-build-review #138 #5 - the delivery-time label
    ignores days_before (''by 22:00'' for a supply due the evening before); #137 L9 - a calendar not four months a year labels
    as ''authored'', which the page renders blank, and mixed days give day_of_month None. agreement.cadence() still takes
    the newest version only, its docstring saying ''Which version applies on the date on show is REQ-DASH-182''s''. Criteria
    7 and 8 carry the first two; criterion 3 the third.'
  - 'BUILDABLE BEFORE REQ-PIPE-179 (DECIDED Keith, 2026-10-13, set 3 Q9, option A): the three labels stay fixed in this one
    requirement, the turned-off one as a WHERE clause that is vacuous until a turn-off can be configured; REQ-DASH-180 criterion
    15 stays the owner of the turned-off row''s behaviour. REJECTED waiting for 179.'
  - 'ONE ROW FOR AN INHERITED OWED-NOTHING PERIOD (DECIDED Keith, 2026-10-13, set 3 Q10, option A): every owed-nothing period
    inherits (REQ-PIPE-098), and the page already marks an inherited period with a standing-in pill saying ''Nothing was owed
    for this period'' (REQ-DASH-198); criterion 9 puts the period it stands on in the owed-nothing row. REJECTED a reason
    row beside the existing pill, which says the same thing twice.'
  - 'NO ''Not expected'' ROW INSIDE A TURNED-OFF GAP (DECIDED Keith, 2026-10-13, on REQ-PIPE-179 criterion 21): such an entry
    is rejected as configuration, so the two kinds never meet on one period.'
  - 'KEITH''S THREE ANSWERS OF 2026-10-13 (DECIDED Keith, 2026-10-13 evening, answering the CLI and dashboard UX reviews -
    plans/running-thoughts.md #92; carried in by dashboard UX 1, 2026-10-14, as a carry-over gap): owed-nothing rows that
    recur (cp-case-workers'' May and November) read a SHORT generated label, ''Not owed - outside its agreed months (Feb,
    Aug)'', with the authored reason once on the agreement tile (criterion 2); the current cycle shows its owed-nothing row
    in place of ''No deliveries in the current cycle yet.'' (criterion 10); and the due-before label reads ''by 22:00 the
    day before'' for one day and ''by 22:00, N days before each date'' for more (criterion 7). REJECTED repeating the authored
    reason on every recurring row.'
  - 'ROUND 3 REVIEWS FOLDED (round 3 fold, delivery-scoper, 2026-10-14): dashboard UX 1 (the three answers above, which had
    not reached the criteria); dashboard UX 12 (criterion 9 - the standing-in heading names the kind). This requirement had
    the 2026-10-13 joint scoper pass, not one of its own (dashboard UX 16).'
  open_questions: []
- id: REQ-PIPE-163
  title: A person can place a held supply into a period, from the terminal
  date_written: '2026-10-07'
  story: As the person working through supplies the filing rule refused to place, I want to say which period a held supply
    belongs to and have it filed, checked and gated there, so that a supply held because of a calendar mistake - ours or the
    supplier's - is not stuck forever with rejection as the only way out.
  moscow: must
  status: not_started
  source: 'delivery-scoper, 2026-10-07 - a gap found auditing Keith''s condition on REQ-PIPE-111 (''assuming the TUI offers
    users ALL of the tools a human would need to undo mistakes ... and otherwise undo and fix up everything that automated
    rules decide''). Verified against built code: qa_tools/common/refiling.py refuses a held supply with ''Place it instead;
    `mothman supply holds` shows how'', no filing decision named place exists (filing_decisions.OPERATIONS), and `mothman
    supply holds` lists ''file it to a slot yourself'' with no command. Re-scoped jointly with REQ-PIPE-179 by delivery-scoper,
    2026-10-13 - joint pass on REQ-PIPE-163, REQ-PIPE-179 and REQ-DASH-182 with the Child Protection pattern widening (Keith,
    2026-10-13: close out the calendar group before the road-testing review; scope 163 WITH 179 so 179 does not amend a requirement
    that may change under it).'
  acceptance_criteria:
  - 'THE SYSTEM SHALL offer PLACE as a filing decision a person raises about a supply held by the assignment rule (REQ-PIPE-064)
    - whichever path raised the hold: the rule at arrival, a confirmed correction (REQ-PIPE-170 criterion 8) or a settlement
    whose file landed where no slot was open (REQ-PIPE-193 criterion 11) - naming the period it is to be filed to, on the
    same terms as every other filing decision - actor, mandatory reason, allowlist, refusal, one implementation behind every
    route.'
  - WHEN a person places a held supply, THE SYSTEM SHALL, in one transaction, record a filing of it to the named period AS
    A RE-FILE FROM NO PERIOD BY THAT PERSON - the same filing row and decision a re-file appends, its from-period empty, with
    no decision-log action of its own - resolve its hold naming that decision (REQ-PIPE-078 criterion 6) and record an owed
    re-check (REQ-PIPE-140); the terminal, the flag route's output and the dashboard SHALL still call it a placement, criterion
    41 saying how; and criterion 39 amends the decision log so that it accepts such a re-file from a person.
  - WHEN a placement is recorded in the terminal's filing-decisions door, THE SYSTEM SHALL run its owed re-check straight
    after the transaction commits, while the person waits, applying the promotion gate exactly as for a re-filed supply (REQ-PIPE-141
    criteria 7, 9, 13, 15 and 18).
  - WHEN a placement is recorded through `mothman supply decide`, THE SYSTEM SHALL say that its checks are owed, SHALL print
    `mothman pipeline process` on a line of its own, saying that it runs every owed QA run and not only this one, and SHALL
    NOT wait for them.
  - THE SYSTEM SHALL NOT run any QA inside the transaction that records a placement.
  - THE SYSTEM SHALL allow placing into a closed period and into a period whose claim window had not opened at the supply's
    receipt instant, because a person deciding is not the assignment rule (REQ-PIPE-062 criterion 5 and REQ-PIPE-064 criterion
    2 bind the rule).
  - IF the named period is not one the dataset's calendar generates, or is one the dataset owes nothing in - not participating,
    listed not_expected, or for any other reason the one participation resolution gives (REQ-PIPE-179 criterion 27 once built)
    - THEN THE SYSTEM SHALL refuse it, saying which and quoting the reason the configuration gives, and print the command
    that lists the dataset's periods - `mothman schedule show --dataset <id>` - on a line of its own; and WHERE the period
    lies inside a turned-off gap, the refusal SHALL be the one REQ-PIPE-179 criterion 20 words, given in place of this one
    rather than beside it.
  - IF the named period is owed and its slot is resolved by a person's inheritance, THEN THE SYSTEM SHALL refuse it and name
    un-inherit as the step that must come first, as a re-file does (REQ-PIPE-141 criterion 12); a period owed nothing SHALL
    be refused under criterion 7 instead, never with advice to un-inherit.
  - THE SYSTEM SHALL compute the placed supply's arrival classification against the slot it was placed in, so that a supply
    placed after its slot closed reads late, and SHALL record it as a verdict carrying the slot's resolved inputs and the
    agreement that judged it (REQ-PIPE-168 criterion 1).
  - THE SYSTEM SHALL list every held supply in the terminal's filing-decisions door, saying why it was held in the hold's
    own reason, never as a choice between files, and SHALL offer place and reject on each, except a hold labelled schedule
    ended (REQ-PIPE-154), which offers only adding dates.
  - THE SYSTEM SHALL let a person reject a held supply from the terminal and through mothman supply decide, with a reason,
    ending its hold.
  - THE SYSTEM SHALL name, in `mothman supply holds`, in the dashboard's held-supply item and in every refusal that points
    at placing, both the exact command that places a held supply - its supply and dataset filled in from what was typed or
