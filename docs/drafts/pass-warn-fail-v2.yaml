  - id: REQ-TEST-360
    title: "The terminal and the GitHub Issue text word every status Pass, Warn or Fail (or passing, warning, failing) through one Python statusWords, with code that read worded text moved onto status values, and colour styles, exit codes, option values and stored values unchanged"
    date_written: "2026-10-31"
    story: "As whoever works the filing queue in the terminal, I want a supply's status in the same words the dashboard uses, so that 'failing because ...' in the queue and 'Promoted, failing' on the page are plainly the same thing."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-31, option (c) - 'the terminal's words and the Python status mirror all change' (plans/running-thoughts.md #132); answers 2026-10-31 and 2026-11-01. Drafted by delivery-scoper 2026-10-31 (v1, v2); v2 regenerated 2026-11-01. SIGNED by Keith 2026-11-01."
    signed_off:
      by: Keith
      date: "2026-11-01"
    acceptance_criteria:
      - "THE SYSTEM SHALL word every status the terminal prints through one Python statusWords(value, form) beside qa_tools/common/dataset_status.py, form 'label', 'verb' or 'count', its words held equal to status-cases.json's 'labels' block by tests/test_status_parity.py (REQ-DASH-359 NFR 1); and IF it meets a status value it has no word for, THEN THE SYSTEM SHALL refuse it as unrecognised (REQ-QAC-047)."
      - "THE SYSTEM SHALL carry each re-gated outcome as (dataset_id, status_value or None, words, result) - knock_on.py's re-gating, filing_tui.py's outcomes (:686), settle_tui.py's (:755) and lifecycle_report.outcome_lines alike - so that a plain phrase ('no verdict', 'verdict could not be read', 'not yet re-checked') travels as words with no value and is never passed to statusWords, and a worded status ('failing - could not run: ...') travels beside its value; and a test SHALL pin the tuple's field order."
      - "THE SYSTEM SHALL decide from STRUCTURED values, never from worded text, at each place that reads words today, each replaced test-first with a test seen failing on the reworded text: lifecycle_report.outcome_lines' sort (:284) and 'more' pointer (:288) by the status value, so REQ-PIPE-276 criterion 10's failing-first order holds; knock_on._fails_the_rules (:378) by a structured refusal kind returned with the gate's reason (promotion.py :533) rather than '\"status is red\" in why'; the three comparisons with promotion.AMBER_WAITING_REASON (knock_on.py :378, promotion.py :1094, gate.py :1155) by that same refusal kind; filing_tui.py :1205 by root_cause giving the overdue reason without its status word, rather than stripping 'red because '; and filing_tui.py :1251 by the re-checked-worse state carrying its verdict value, rather than cutting the heading from the reason at its first colon."
      - "THE SYSTEM SHALL reword the root-cause and outcome lines: 'red because <dataset> for <period> is overdue; ...' -> 'failing because ...'; 'red - <n> of its own checks fail(s)' -> 'failing - ...' (filing_tui.py :1080); 'red - <check> failed against the warehouse; decide ...' -> 'failing - ...'; 'red - could not run: <period> holds no <dataset>' -> 'failing - could not run: ...' (settle_tui.py :755); '(measured <x> - red because <reason>)' -> '(measured <x> - failing because <reason>)' (common.py :1185); '..., green, because the <dataset> ... was held back' -> '..., passing, because ...' (lifecycle_report.py :214); and 'if it is green, the rule promotes it' -> 'if it passes, the rule promotes it' (filing_decisions.py :528)."
      - "THE SYSTEM SHALL word the filing queue's 'amber, waiting for a person (amber setting: hold)' as 'warning, waiting for a person (warn setting: hold)' (filing_tui.py :180), 'amber and held for a person' as 'warning and held for a person' (:200), the acknowledge choice's 'this amber supply' as 'this supply, now warning' (:97), and 'Amber setting:' as 'Warn setting:' (:2269, :2271)."
      - "THE SYSTEM SHALL word a promoted supply whose re-check came back worse 'Promoted, then <verb form> on re-check' - in filing_queue's reason (:208-212), the queue heading (filing_tui.py :1251), bulk_recheck's summary (:694) - and its reason SHALL carry the date it was promoted, read from the decision log: 'Promoted, then failing on re-check: <supply> in <period> was promoted passing on <date>, and the re-check recorded <instant> (decision <id>) came back failing. ...' (SETTLED by Keith 2026-11-01)."
      - "THE SYSTEM SHALL print every stored status value the terminal shows through statusWords, never raw: a listed supply's verdict (REQ-GHUB-229 criterion 4; filing_tui.py :738, :1302), lifecycle_report's outcome lines (:287), bulk_recheck's 'now <x>, was <y>' (bulk_recheck.py :689, cli/bulk_recheck_tui.py :165), scenario_map's 'Built to' (:207-208) and target_agreement's verdict words (:71-75)."
      - "THE SYSTEM SHALL reword the qa_tools refusals and notices a person reads - acknowledgement.py, decision_log.py, filing_decisions.py, promotion.py, replacement_setting.py, validate_schedule.py, gate.py, held_blast_radius.py, own_table.py, knock_on.py, root_cause.py, amber_setting.py and dataset_status.py :135 ('read as green' -> 'read as a pass') - by REQ-DASH-359 criterion 4's rule, each listed at build by grepping their string literals for the three words."
      - "THE SYSTEM SHALL print 'At least one recorded result is a Fail.' for `mothman pipeline run`'s exit 1 (cli/pipeline.py :298), word the exit-code help in cli/pipeline.py (:189-190) and cli/schedule.py (:525) 'failing' rather than 'red', with the exit codes themselves unchanged; and word `mothman scenarios rules`' bands 'warn at <band>' and 'no warn band - closed by ...' (cli/scenarios.py :179, :181)."
      - "THE SYSTEM SHALL word a GitHub Issue's title '<name> is failing' or '<name> is warning' (ticket_sync.py :235), its bodies 'currently reading **Fail**' (:215), 'Still **failing** as of this run' (:292) and 'Resolved to **Pass**' (:295), and its result lines (:277, :278, :309, :310) through statusWords, even though the workflow is disabled today, so it uses the dashboard's words when turned back on."
      - "THE SYSTEM SHALL reword the generator's scenario configuration strings that SCENARIOS.md carries to the dashboard by REQ-DASH-359 criterion 4's rule, and SHALL leave unchanged every Rich colour style (green, yellow, red are colours, not statuses), every exit code and its name (EXIT_RED), the `mothman population --dirty none|amber|red` values, the generator's target verdicts and its developer error messages."
      - "THE SYSTEM SHALL show every reworded line correctly with NO_COLOR set, piped and at 80 columns, as REQ-PIPE-276 criterion 21 requires, and SHALL update in the same change every test asserting a changed terminal word, re-run and seen to pass."
    non_functional_requirements:
      - "ONE VOCABULARY (REQ-DASH-359 NFR 1): the terminal and the page read words held equal by one committed table."
      - "NO COLOUR-ONLY MEANING: the words carry the status with NO_COLOR set, as REQ-PIPE-211 criterion 16 already requires for the settlement panel."
      - "COMPATIBILITY: nothing a script types changes - no option value, exit code or config key - so no workflow or runbook breaks."
      - "RECORDS ARE NOT REWRITTEN: recorded decision reasons and ticket comments keep their words; only new text uses the new ones (Keith, architect Q-B)."
      - "RELIABILITY: no behaviour may hang on the wording again - criterion 3's structured checks are what stop a later rewording from silently changing the queue's order or what the knock-on counts as failing the rules."
      - "COST: the qa_tools/** change misses CI's cached bootstrap (REQ-DASH-359's COST NFR); it ships in the same one push."
    dependencies:
      - REQ-DASH-359
      - REQ-QAC-047
      - REQ-PIPE-276
      - REQ-PIPE-164
    decisions:
      - "THE TERMINAL FOLLOWS THE PAGE, SETTLED by Keith 2026-10-31: 'the terminal's words and the Python status mirror all change'. dataset_status.py, the Python status mirror, holds VALUES and no words (one error message aside), so changing the mirror means adding statusWords, not renaming its values."
      - "STRUCTURED CHECKS, NOT TEXT (architect BLOCKING 1, signed 2026-11-01): knock_on.py :378 tested '\"status is red\" in why'; rewording promotion.py would have made it return False silently. Every such read moves to a value, test-first, as for lifecycle_report."
      - "THE OUTCOME TUPLE CARRIES VALUE AND WORDS (architect BLOCKING 2, signed 2026-11-01): refusing an unknown status (criterion 1) would otherwise crash the terminal on the plain phrases the status slot carries today. REJECTED refusing only some callers, and REJECTED a word-to-value reverse lookup, which is text-reading again."
      - "filing_tui.py :1251 FOUND AT REGENERATION (2026-11-01), not in either review: it takes the heading as the reason's text before its first colon. Same class as BLOCKING 1, folded into criterion 3 rather than left for a critic."
      - "THE PROMOTION DATE IS CARRIED, SETTLED by Keith 2026-11-01 (build-time decision 1): the re-checked-worse reason says 'was promoted passing on <date>', the date from the decision log, where today it says only 'was promoted on green'."
      - "THE TICKET DUPLICATE IS ACCEPTED AND NOTED, NOT FIXED, SETTLED by Keith 2026-11-01: ticket_sync._already_said (:300, :313) compares worded bodies, so if the disabled workflow is re-enabled each open ticket gets one duplicate 'Still failing' comment, once. REJECTED fixing it now: the workflow is disabled and its replacement (plans/running-thoughts.md #53) inverts the integration."
      - "GENERATOR STRINGS: those SCENARIOS.md shows are reworded (architect SHOULD, resolving v1's REQ-TEST-360 c10 against REQ-DASH-359 c12); developer error messages are not - nobody but a developer reads them."
      - "COMPONENT TEST, because cli/ belongs to TEST (docs/components.md). The ticket_sync criterion is a GHUB file, folded in as one line rather than given its own requirement."
    open_questions: []
  - id: REQ-TEST-361
    title: "A guard stops a colour word for a status coming back - a real-browser scan of the built dashboard's text and accessible names, collapsed and hover-only text included, and a scan of the terminal's worded statuses"
    date_written: "2026-10-31"
    story: "As Keith, I want a test that fails when a person can read 'Green', 'Amber' or 'Red' as a status anywhere on the dashboard or in the terminal, so that the vocabulary I chose does not drift back one provisional wording at a time, as the grid's did."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-31 (plans/running-thoughts.md #132; the process gap is plans/post-build-review.md #292). Drafted by delivery-scoper 2026-10-31 (v1, v2); v2 regenerated 2026-11-01. SIGNED by Keith 2026-11-01."
    signed_off:
      by: Keith
      date: "2026-11-01"
    acceptance_criteria:
      - "WHEN the test suite runs, THE SYSTEM SHALL drive the built dashboard in a real browser across the Executive, Agencies and collection tiers, the Scenarios tab, one dataset page of every registered collection, a column panel, the cross-table grid, the needs-action queue and its markers, and datasets showing a promoted-failing, a promoted-warning, an acknowledgement-owed and a re-checked-worse supply, an 'Arrived <X>' row, a 'Re-checked <t>: became <X>' row and scenario (j)'s period (REQ-DASH-337 criterion 16) - each found from the scenario map and first asserted to exist - and SHALL fail on any match of /\\b(green|amber|red)\\b/i, naming the page, the element and the text."
      - "THE SYSTEM SHALL scan each page's textContent, not only visible text, so that groups collapsed on load are covered; every title and aria-label attribute and SVG title; and the chart tooltip after hovering at least one point of each trend kind on the page."
      - "THE SYSTEM SHALL exclude from that scan only the Plans, Requirements, Release Notes, Feedback and Demo tabs, which show records or a recording; text inside elements showing data values - failing samples and value bars - marked by a data attribute the template sets (a synthetic surname such as 'Green', generator/names_au.py, is a data value, not a status); and text inside elements marked as recorded text (REQ-DASH-359 criterion 14) - a check's changelog description, a decision's reason, a ticket comment - each exclusion in a short named list with its reason."
      - "THE SYSTEM SHALL assert, before scanning, that each page holds at least one status pill and that the scanned text is not empty, so an empty page cannot pass (CLAUDE.md test rule 3); and tests SHALL show, each seen failing first, that restoring the literal 'Red promoted' in the template makes the guard fail, AND that restoring a raw-value leak - 'Arrived ${entry.status}' printed raw - makes it fail."
      - "WHEN the test suite runs, THE SYSTEM SHALL run the Python statusWords and the outcome, root-cause, queue-state and ticket wordings (REQ-TEST-360 criteria 2 to 10) over every status in status-cases.json with NO_COLOR set, and SHALL fail on any colour word in the result."
      - "THE SYSTEM SHALL NOT scan source text, CSS, unshown attribute values or comments - only what a person reads (CLAUDE.md test rule 1)."
    non_functional_requirements:
      - "COST: the browser half adds classes to tests/test_dashboard_e2e.py, reusing its per-worker built dashboard rather than building again, in the needs_deployment half where that module already runs. A few seconds per page; at 30 collections it scans one dataset page per collection, not every dataset."
      - "PRIVACY: a failure names the element and the matched text, never a whole sample, so a real deployment's failure output holds no row values."
      - "MAINTAINABILITY: the exclusions are a short named list in the test, each with its reason; a new tab that shows records is added on purpose, not by accident."
      - "RELIABILITY: every page and scenario the guard visits is asserted present first, so a scenario dropped from the synthetic history fails loudly rather than shrinking the scan."
    dependencies:
      - REQ-DASH-359
      - REQ-TEST-360
    decisions:
      - "BY BEHAVIOUR, NOT BY GREPPING THE TEMPLATE (CLAUDE.md test rule 1): a grep would hit about 190 comment lines and 85 identifier lines nobody reads, and would miss the stored values printed raw, which the browser does show."
      - "REJECTED a mothman check gate over string literals: cheaper, but it would test display through source text, which rule 1 allows only for architecture rules."
      - "textContent AND HOVER (UX SHOULD 5, signed 2026-11-01): a visible-text scan passes while collapsed groups and hover-only tooltips leak; the self-test restores a raw-value leak as well as a literal, because the raw values are the leak a relabel alone misses."
      - "THE PAGE SET NAMES THE SCENARIOS TAB, THE QUEUE AND THE GRID, AND EXCLUDES DEMO (architect SHOULD, signed 2026-11-01); the recorded-text marker covers check changelog descriptions that say 'read red' (bdm-birth-registrations-soda-checks.yml :200 :218 :540; bdm-birth-registrations-contract.yaml :370 :566 :611), which are history."
    open_questions: []
