# exactly this, and both sides' statusWords(value, form) are held equal to it.
# Stored values (column 1) do not change (Keith, Q2 (a), 2026-10-31).
#
#   value       label            verb (prose)       count form         e.g.
#   green       Pass             passing            passing            '1 passing'
#   amber       Warn             warning            warning            '1 warning'
#   red         Fail             failing            failing            '2 failing'
#   notchecked  Not checked      not checked        not checked        '2 not checked'
#               (joins when geocoding builds - REQ-DASH-299 criterion 17,
#               display only: no tool records it and the store refuses it)
#   nodata      No data          no data            no data            unchanged
#   exhausted   Schedule ended   schedule ended     schedule ended     unchanged
#   inactive    No rule defined  no rule defined    no rule defined    unchanged
#   notcounted  Not counted      not counted        not counted        unchanged
#   turnedoff   Turned off       turned off         turned off         unchanged
#
# THE RULES OF USE (Keith, 2026-10-31, Q1 (a), Q5 (a), UX Q1 (b), UX Q2 (a)):
#   - A pill, legend, table header or state reached says the LABEL, in title
#     case: 'Pass', 'Re-checked <t>: became Fail - <cause>', 'stays at Fail'.
#   - Running prose says the VERB form: 'Promoted, failing', 'went in failing,
#     failing since 3 May', 'Promoted, then failing on re-check'.
#   - A count says the COUNT form: '2 failing, 1 warning', '1 passing, 2 not
#     checked', 'latest 2 failing and 1 warning of 15'. Never '1 pass' (it
#     reads as 'a processing pass').
#   - 'Not passing' never stands alone: its split goes beside it, accessible
#     names included (UX Q3 (a)).
#   - The cross-table grid's Pass / Warn / Fail / No result stay as they are.
#
# =============================================================================
