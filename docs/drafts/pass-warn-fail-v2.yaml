requirements:
  - id: REQ-DASH-359
    title: "The dashboard words every status Pass, Warn or Fail - pills, legends, counts, badges, tooltips, accessible names and prose - through one statusWords function, with colours, stored values and identifiers unchanged"
    date_written: "2026-10-31"
    story: "As a data team leader glancing at the register, I want every status in the three words the cross-table grid already uses - Pass, Warn, Fail - so that one page never says 'Amber' in a pill beside 'Warn' in a cell, and a status reads the same whether or not I can see its colour."
    moscow: should
    status: not_started
    source: "Keith, 2026-10-31 late morning, choosing option (c) on finding the cross-table grid's Pass / Warn / Fail beside Green / Amber / Red elsewhere (plans/running-thoughts.md #132, plans/post-build-review.md #292); answers 2026-10-31 and 2026-11-01. Drafted by delivery-scoper 2026-10-31 (v1, v2); v2 regenerated 2026-11-01. SIGNED by Keith 2026-11-01."
    signed_off:
      by: Keith
      date: "2026-11-01"
    acceptance_criteria:
      - "THE SYSTEM SHALL turn every status the page shows as a word into words through ONE function, statusWords(value, form), form being 'label', 'verb' or 'count', giving exactly the words of status-cases.json's 'labels' block (the vocabulary table in this file's header): green, amber and red as 'Pass' / 'passing' / 'passing', 'Warn' / 'warning' / 'warning' and 'Fail' / 'failing' / 'failing'; and SHALL keep 'No data', 'Schedule ended', 'No rule defined', 'Not counted' and 'Turned off' as today, lower-cased in the verb and count forms."
      - "THE SYSTEM SHALL route through statusWords every pill (pill() :4986), chart tooltip (:4842), status-dot title (:10352), legend count (:8318), the grid's accessible name 'Status <label>' (:6277), and the three places that print a STORED value directly today - 'went in ${promotedOn}' (:8808), markerKindLabel (:7282) and outstandingKindLabel (:7287) - and IF statusWords meets a status it has no word for, THEN THE SYSTEM SHALL refuse it as unrecognised (REQ-QAC-047's rule) and never show the raw value."
      - "THE SYSTEM SHALL count statuses in every group heading and rollup count line in the count form, worst first - '3 checks: 1 failing, 1 warning, 1 passing' (xtStatusCounts :5885) - so that REQ-DASH-299's left-out count reads '3 checks: 1 passing, 2 not checked'."
      - "THE SYSTEM SHALL word a status in running prose in its verb form ('passing', 'warning', 'failing'), a status REACHED or HELD in its label ('became Fail', 'stays at Fail', 'a Fail anywhere below'), and SHALL NOT use the words green, amber or red for a status in any text a person reads, recorded text apart (criterion 14)."
      - "THE SYSTEM SHALL word the compound labels as follows: 'Red promoted' -> 'Promoted, failing' (:8821, :8832); '<n> red promoted: <names>' -> '<n> promoted while failing: <names>' (:9054); 'Amber promoted' -> 'Promoted, warning' (:8864); 'Amber, promoted - awaiting acknowledgement' -> 'Promoted, warning - awaiting acknowledgement'; 'Promoted green, re-checked amber - awaiting acknowledgement' and '... - acknowledged by <who>' -> 'Promoted, then warning on re-check - awaiting acknowledgement' and '... - acknowledged by <who>' (:9010-9011); 'Turned red later - <t>, after <cause>' -> 'Started failing later - <t>, after <cause>' (:8838); 'went in red. Red since <cause>, <t>; promoted <t>' -> 'went in failing. Failing since <cause>, <t>; promoted <t>'; 'promoted while red' -> 'promoted while failing'; 'turned red <t> after <cause>' -> 'started failing <t>, after <cause>' (:8826-8828); 'Went in green. Amber since <cause>, <date>.' -> 'Went in passing. Warning since <cause>, <date>.' (:8864); 'Arrived <status>' -> 'Arrived <verb form>' (:8893, :8975); 'Re-checked <t>: became <status> - <cause>' -> 'Re-checked <t>: became <label> - <cause>', e.g. 'became Fail' (:8948)."
      - "THE SYSTEM SHALL word a promoted supply whose re-check came back worse, in the outstanding queue, every outstanding marker and its kind label, 'Promoted, then <verb form> on re-check' - 'Promoted, then failing on re-check', 'Promoted, then warning on re-check' - replacing 'Promoted, then re-checked <verdict>' (:7287) and 're-checked <verdict> after promotion' (:7282, e.g. '1 re-checked red after promotion'), with markerKindLabel's fallback reading 'Promoted, then worse on re-check' where no verdict is recorded."
      - "THE SYSTEM SHALL word the counts and trends in the count form: '<r> red, <a> amber' -> '<r> failing, <a> warning' (both numbers always given); 'All <M> green' -> 'All <M> passing'; 'All <M> datasets green' and 'All <M> counted datasets green' -> 'All <M> datasets passing' and 'All <M> counted datasets passing'; '<N> of <M> datasets not green' -> '<N> of <M> datasets not passing'; the header and key 'Columns not green' -> 'Columns not passing', the key reading 'Columns not passing — <solid line> failing · <dotted line> warning, share of columns on each QA run. ...'; 'Columns red and amber, each QA run', 'Datasets red and amber, each week' and 'Checks on this column red and amber, each QA run' -> '... failing and warning, each ...', their accessible names likewise ('latest 2 failing and 1 warning of 15'); 'Each column's lines: share of its checks red (solid) and amber (dotted), each QA run' -> '... failing (solid) and warning (dotted) ...'; and the trend table's headers 'Red | Amber | Not green' -> 'Failing | Warning | Not passing'."
      - "WHEREVER 'not passing' is shown, THE SYSTEM SHALL show its split beside or directly beneath it ('2 of 6 datasets not passing' over '1 failing, 1 warning'), and SHALL carry both in the same accessible name (Keith, UX Q3 (a))."
      - "THE SYSTEM SHALL word the legends 'Pass — within threshold', 'Warn — in the warn band' and 'Fail — in the fail band' on the Agencies tier (:8339-8341) and 'Pass · Warn · Fail' on the dataset page (:9980), each dot keeping its colour; and a check's band 'warn above <value>' and 'fail above <value>' (:2005, and the other directions BAND_WORD gives), as its fallback already reads 'warn > <value>'."
      - "THE SYSTEM SHALL reword the remaining prose with no colour word for a status: 'Makes its dataset red' -> 'Puts its dataset at Fail' (:8216); 'each turn their dataset red until someone resolves them' -> 'each hold their dataset at Fail until someone resolves them' (:8257); 'The dataset stays red' -> 'The dataset stays at Fail' (:9834); 'it counts as red until it can be' -> 'it counts as a Fail until it can be' (:10615); 'neither red nor a result' -> 'neither a Fail nor a result' (:6493); 'this check is red because of the gap' -> 'this check is at Fail because of the gap' (:1984); 'A red anywhere below makes the parent red; an amber with no red makes it amber' -> 'A Fail anywhere below makes the parent Fail; a Warn with no Fail makes it Warn' (:8334); 'never a misleading blank, green, or red' -> 'never a misleading blank, Pass or Fail' (:1179); 'no column reads red/amber/green as CURRENT status' -> 'no column reads Pass, Warn or Fail as its CURRENT status' (:9963); 'Which red was on purpose' and 'the list that says which red was on purpose' -> 'Which problems were on purpose' and 'the list that says which problems were on purpose' (:11783, :11804); and the refused-status error's 'read as green' -> 'read as a pass' (:2113)."
      - "THE SYSTEM SHALL word the warehouse clause (REQ-DASH-272 criteria 1 and 3) '..., and is passing.', '..., and is warning.', '..., and is failing: it was promoted while failing.' and '..., and is failing: it started failing <time>, after <cause>', in the page and in pipeline/cross_table_grid.py (:491, :495) alike."
      - "THE SYSTEM SHALL show the amber setting (REQ-PIPE-122) as 'Warn setting: <text>', titled 'What happens to a supply whose checks come back warning, and where that was set' (:7971), and a replacement setting's value (REQ-PIPE-123) as 'never', 'when passing' or 'when passing or warning', never as the raw value green or green-or-amber; the configuration key amber_setting is unchanged."
      - "THE SYSTEM SHALL word the scenario map the dashboard shows without a colour word for a status: scenario_map.py's intro (:169-173) as 'which problems were on purpose', its 'Built to' line (:207-208) and target_agreement.py's verdict words (:71-75) through REQ-TEST-360's statusWords, 'false green' as 'false pass' in scenario headings and titles (e.g. 'the false-pass family'; Keith, architect Q-A), the column descriptions 'dirty(amber/red) presets' (child-protection-contract.yaml :460, :628) as 'the warning and failing dirty presets'; and SHALL regenerate SCENARIOS.md (`mothman scenarios map`) once REQ-DOCS-362 has reworded its sources."
      - "THE SYSTEM SHALL show recorded text as it was recorded - a decision's reason, a ticket comment, a check's changelog description (template :10841) - never translated into the new words (Keith, architect Q-B), each rendered inside an element marked as recorded text (a data attribute named at build) so REQ-TEST-361's guard can pass over it."
      - "THE SYSTEM SHALL leave unchanged every colour (--good, --warn-fill, --warn, --bad and every use of them), every CSS class, every data-status, data-red-promoted, data-amber-promoted and data-amber-setting attribute value, every function name, every status value in the build's JSON and in status-cases.json, and the cross-table grid's Pass / Warn / Fail / No result words and marks."
      - "THE SYSTEM SHALL update, in the same change, every Python and Vitest test asserting a displayed word this requirement changes (about 27 files on 2026-10-31, re-counted at build by the checklist in this requirement's NFRs), each re-run and seen to pass on the new words, and SHALL change no test that asserts an identifier or stored value."
      - "THE SYSTEM SHALL have a Vitest test, seen failing first, that renders a promoted supply turned failing, one turned warning, a re-checked-worse one, an 'Arrived <X>' row and a 'Re-checked <t>: became <X>' row, each with a STORED promotedOn, verdict or status of 'red' or 'amber', and asserts that every badge, note and sentence reads the new words and contains neither stored value."
      - "THE SYSTEM SHALL draw a trend's dated x-axis labels without overprinting one another, on the dataset page, the agency card and the column grid, at phone and desktop widths (plans/post-build-review.md #289 D8d)."
      - "IF a QA run's point on a unit-count trend was not evaluated, THEN THE SYSTEM SHALL leave it out of the line, as plotted() leaves a not-evaluated point out of a check's own trend, and SHALL NOT draw it as a 0% point; a Vitest test, seen failing first, SHALL show it (plans/post-build-review.md #289 D8e)."
    non_functional_requirements:
      - "ONE VOCABULARY, TWO SIDES HELD EQUAL (REQ-QAC-047): the words sit beside the values in status-cases.json's 'labels' block (the header's table, notchecked's row joining with REQ-DASH-299). The template keeps its own copy, held equal to the file by tests-js/status-parity.test.js; the Python twin's words are held equal by tests/test_status_parity.py (REQ-TEST-360). So the page's words and the terminal's cannot drift apart the way the grid's word did."
      - "NO PERMISSIVE FALLBACK: an unknown status is refused, as today, never shown as its raw value or as a pass (criterion 2)."
      - "ACCESSIBILITY: every accessible name and title follows the words (criteria 2, 7 and 8), so a screen-reader user and a colour-blind reader get the status the colour shows."
      - "SCALE AT 30 COLLECTIONS: the words change in one table and one function per side, never per collection; no word names a collection."
      - "WORDING ONLY: every status, rollup, pixel and colour stays as it is (D8d and D8e apart, which change drawing, not status), so TestStatusMatchesEachToolsOwnVerdict passes unchanged."
      - "BUILDER GUIDANCE: build statusWords and its table first; then move each raw-value site onto it; then the literal rewording, one file at a time; then tests. Grep each old phrase to zero rather than trusting the list here, which was counted on 2026-10-31 and re-verified 2026-11-01."
      - "SCRIPTED BEFORE / AFTER CHECKLIST: criteria 5 to 13 and REQ-TEST-360 criteria 4 to 10 are the checklist's rows, old phrase -> new phrase. A throwaway script in the session's scratchpad (never committed, so no new mothman entry point) counts each OLD phrase in the built dashboard's visible text and in the terminal tests' captured output before and after, and each NEW phrase after; the per-phrase counts go in evidence. A row whose surface shows only for data the synthetic history may lack is checked by a zero count of the old phrase only (SETTLED by Keith 2026-11-01)."
      - "COST: no new e2e module - changed assertions stay in their classes - and the whole batch goes out in ONE push (REQ-TEST-260). qa_tools/** is in qa_tools/common/replay_inputs.py's INPUTS (:39), so that push misses CI's cached bootstrap and pays a full cache-miss bootstrap, and it invalidates every local checkpoint keyed on those inputs; budget for it, and do not push twice."
      - "THE REGISTER CLAIMS ONLY PROOFS RUN: each criterion whose proof waits on the end-of-run bootstrap goes in unmet_criteria with blocked_by {unowned: true}, owner 'the end-of-run bootstrap (2026-11-01 build run)', cleared once it passes and before the push (SETTLED by Keith 2026-11-01; applies to every batch)."
      - "OBSERVABILITY: a CHANGELOG.yaml entry in the same push, and a plans/post-build-review.md entry recording a change to built wording (REQ-DOCS-362)."
    dependencies:
      - REQ-QAC-047
      - REQ-DASH-272
      - REQ-DASH-126
      - REQ-DASH-221
      - REQ-DASH-337
    decisions:
      - "PASS / WARN / FAIL EVERYWHERE, SETTLED by Keith 2026-10-31 (option (c)). REJECTED (a), Green / Amber / Red everywhere, which would reword the grid back; REJECTED (b), Pass / Warn / Fail in the grid only, which keeps two vocabularies on one page, the very thing he found."
      - "DISPLAY ONLY, SETTLED by Keith 2026-10-31 (Q2 (a)): page, terminal and GitHub Issue text change; stored values, CSS classes, data attributes, amber_setting and --dirty amber|red stay. PARKED, not rejected: (b) renaming configuration people type and (c) renaming stored values (plans/running-thoughts.md #133). The colour and its value stay together: green is still the colour of a Pass."
      - "LABELS AND VERB FORMS, SETTLED by Keith 2026-10-31 (Q1 (a)): labels Pass / Warn / Fail, prose passing / warning / failing; 'Red promoted' -> 'Promoted, failing', 'Amber promoted' -> 'Promoted, warning'. REJECTED (b), the exact words in prose ('Fail, promoted'), and (c), a straight swap ('Fail promoted' reads as 'the promotion failed')."
      - "TITLE CASE, SETTLED by Keith 2026-10-31 (Q5 (a)): 'Pass', 'Warn', 'Fail', matching the grid and every other pill. REJECTED capitals."
      - "COUNT FORM, SETTLED by Keith 2026-10-31 (UX Q1 (b)): '2 failing, 1 warning', matching '2 not checked' and the prose rule, and avoiding '1 pass', ambiguous with 'processing pass'. REJECTED (a), '2 fail, 1 warn'. Amends A6, A7, A9, A12, A14, A15 and B1 (B1's count now carried by the geocoding v7 delta)."
      - "RE-CHECK TAG, SETTLED by Keith 2026-10-31 (UX Q2 (a)): 'Re-checked <t>: became Fail - <cause>', keeping his verb 'became' (template :8948, 2026-10-29) and the label for a status reached. REJECTED 'became failing', and v1's 'now failing', which goes stale on a history row once a later re-check changes the verdict."
      - "'NOT PASSING' PAIRED WITH ITS SPLIT, SETTLED by Keith 2026-10-31 (UX Q3 (a)): alone it reads as failing."
      - "THE RE-CHECK HEADING, SETTLED by Keith 2026-11-01 (v2 Q1): 'Promoted, then failing on re-check' (and 'warning on re-check'). Replaces the 2026-10-29 wordings 'Promoted green, re-checked amber', '1 re-checked red after promotion' and the heading 'Promoted, then re-checked <verdict>' (A19, A28-A34). REJECTED 'Promoted, then re-checked: became Fail'. UX MUST 3's reason: 're-checked failing' reads as the re-check itself failing."
      - "COUNTS SAY 'PROMOTED WHILE FAILING' (UX MUST 2, signed with the batch 2026-11-01): in '3 waiting for a person: 2 no supply, 1 promoted, failing' the comma makes four items, so a count says '1 promoted while failing' and the standalone badge keeps 'Promoted, failing'."
      - "LABEL NOUNS, NOT LOWER-CASE EVENTS (UX SHOULD 4, signed 2026-11-01): 'makes its dataset fail' and 'keeps failing' read as events; 'Puts its dataset at Fail' and 'stays at Fail' read as states."
      - "'FALSE PASS' ON THE DASHBOARD, SETTLED by Keith 2026-10-31 (architect Q-A): scenario headings and titles say 'false pass'; history keeps 'false green'."
      - "RECORDED TEXT SHOWN AS RECORDED, SETTLED by Keith 2026-10-31 (architect Q-B): an old reason is shown with its original words, never translated as the page renders it."
      - "THE TEMPLATE KEEPS ITS OWN COPY OF THE WORDS, SETTLED by Keith 2026-11-01 (build-time decision 2): held equal to status-cases.json by a parity test, rather than the page reading the file. Same arrangement as STATUS_ORDER under REQ-QAC-047."
      - "THE WORDS MATCH WHAT IS ALREADY UNDERNEATH (from the code): a tool's per-check status is already stored as pass / warn / fail / error, Soda and band thresholds are already warn / fail, and the terminal's per-check results already say pass / warn / fail. Only the dataset-level layer says green / amber / red, and that layer stays as values."
      - "'NO DATA' STAYS, AND SO DOES THE GRID'S 'NO RESULT': 'No data' is a dataset with nothing supplied, 'No result' a check with nothing recorded - two facts, so two words."
