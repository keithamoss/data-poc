      - "status_words MOVES WITH THE ORDER (B3, SETTLED by Keith 2026-11-14): the scenario map's writer, which the generator keeps, imports it (scenario_map.py line 56), and the generator may import only asset_model/ and scenarios/."
      - "THE PAGE KEEPS ITS COPY (delivery-scoper, from the split overview): the page has no build step and ticketing runs without a browser, so the shared test cases are the agreement."
      - "THE PAGE'S OWN THREE INTERNAL COPIES STAY AS THEY ARE (SPLIT RISK 6, SETTLED by Keith 2026-11-03): RECHECK_RANK, xtStatusCounts' order list and XT_WORD ('No result') are left alone. REJECTED reading STATUS_ORDER from both repeats, and one wording everywhere."
      - "THE RANKING RULE IS A RULE OF THE IMPORTS GATE (architect, non-blocking): one syntax-tree walker, not another scanner."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's compare in criterion 2 and its BEHAVIOUR-PRESERVING NFR are gone; the per-reader tests are the proof."
    open_questions: []
    signed_off: null

  - id: REQ-GEN-391
    title: "The Child Protection provider takes its quarters only from the quarterly calendar, and the geocoding faults' planned verdicts are derived from the bands of the checks they aim at"
    date_written: "2026-11-03"
    story: "As whoever maintains the generator, I want the providers to read the calendar and the check bands rather than restate them, so that a changed calendar date or band moves what the generator plans with it."
    moscow: could
    status: not_started
    source: "Keith, the split overview's decision 4 (SPLIT D4, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14; v6 2026-11-14, the stop-on-difference and compare criteria removed (QD). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL remove the Child Protection provider's own statement of the quarterly calendar - _quarter_start, _add_quarters and START_DATE (assets/quarterly/synthetic/collections/child_protection.py lines 240-274), which nothing reads - so that its quarters come only from the quarterly calendar through asset_model/, as generated_periods and drawn_grown_periods already do."
      - "THE SYSTEM SHALL derive each geocoding row fault's planned verdict (GEO_FAULT_VERDICT, hand-written at linkage_products.py line 138) from the check it is aimed at (GEO_FAULT_AIMS, line 144) and that check's warn and fail bands in check_bands' catalogue, at the size the fault plants."
