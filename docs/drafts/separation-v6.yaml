# v6 2026-11-14 (Perth) carrying Keith's answers to the v5 review batch
# (docs/drafts/decisions-2026-11-01.md, '#134 v5 review batch - Keith's
# answers, 2026-11-14' and after) and the architect's blocking findings B2-B6
# (docs/drafts/separation-v5-reviews.md).
# NOT SIGNED. Nothing here is built until Keith signs it. Ids kept from v5;
# four new: REQ-TEST-393 (the equivalence harness deleted), REQ-DASH-394 (a
# configuration error on the 'needs a person' queue), REQ-TEST-395 (four stale
# commands deleted) and REQ-GHUB-396 (the sync-tickets guard), the last two
# from Keith's COMMAND CLEAN-UP and sync-tickets GUARD of 2026-11-14.
# Whoever applies this re-checks all four are still free.
#
# THE STANDING RULE v6 APPLIES EVERYWHERE (QD, Keith 2026-11-14): 'I do not
# give two shits if the synthetic demo history moves.' Every criterion proven
# by REQ-TEST-239's compare and every BEHAVIOUR-PRESERVING NFR is gone; the
# test suite is the proof, and the synthetic history regenerates whenever a
# change needs it. No captures, no compare evidence, no lists of moved records.
# The three 'stop and report' criteria that survive (REQ-PIPE-377 c5,
# REQ-GEN-392 c12, and REQ-PIPE-380 c14's mid-build report) each say why they
# are not about protecting the synthetic history.
#
# PARKED, NOT IN THIS BUILD: the look-ahead horizons (v5's REQ-PIPE-378
# criteria 12-14, open questions 3 and 4, and Q8's 'one named horizon' itself).
# REQ-PIPE-378 now says to leave every horizon as it is; its decisions keep the
# site inventory so the later thinking starts from it.
#
# Re-scanned at 72ec04d7 (2026-11-14 Perth). No product code changed since
# v5's a35066ff (git diff over qa_tools, pipeline, dashboard, cli, generator,
# assets and synthetic_data_generator is empty), so a35066ff line numbers are
# still exact; the one v5 figure that was off is knock_on.py's streams call
# (line 478, not 475) and scenario_injection's calendar-name test (line 1418).
#
# BUILD ORDER (the architect's, captures removed; a decision on REQ-PIPE-380):
#   1. REQ-TEST-393 + REQ-TEST-395 + REQ-GHUB-396, then REQ-TEST-384 +
#      REQ-TEST-388 (gate-only)
#   2. REQ-PIPE-380 + REQ-PIPE-376 + REQ-PIPE-390
#   3. REQ-PIPE-383 + REQ-PIPE-382 + REQ-GEN-381
#   4. REQ-GEN-386 + REQ-GEN-391
#   5. REQ-PIPE-385 + REQ-PIPE-379
#   6. REQ-PIPE-377, then REQ-PIPE-378, then REQ-DASH-394
#   7. REQ-QAC-387   8. REQ-QAC-389   9. REQ-GEN-392, last
#   One reset-synthetic + bootstrap per asset after step 9, then the
#   deployment-half tests; expect one hand-started test.yml cache miss then.
requirements:
  - id: REQ-PIPE-380
    title: "The shared reading code - asset time and its clock, the hierarchy, the schedule, slots, the check-file readers, drift arithmetic, arrival recognition and the whole of what they need - is one package, asset_model/, reading configuration and the delivery tree and never the database, which the pipeline, the generator and the bootstrap may all import and which imports none of them"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want the code that reads each asset's time zone, hierarchy, calendar, checks and delivery tree in one package of its own, so that the real pipeline and the synthetic side read every asset's definitions the same way without either depending on the other."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; the code half queued behind the asset split, (a)); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14; v6 2026-11-14 with the v5 review batch (QB, QD, 380 Q1, B3) and the architect's B4 closure, re-scanned at 72ec04d7. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold in one top-level package, asset_model/ (SPLIT D1, SETTLED by Keith 2026-11-03), the shared reading code and its whole closure, so that nothing it imports lies outside it (B4). WHOLE MODULES at 72ec04d7: asset_time 387 lines, hierarchy 247, schedule 961, slots 544, assets 610 (less criteria 4 and 5), config_yaml 226, in_force 39, agreement 635, assignment 277, arrival_classification 99, check_bands 520, check_lifecycle 1,065, check_id 324, check_fingerprint 197, frozen_defaults 46, amber_setting 388, linked_datasets 318, every_asset 53, arrival_patterns 171, delivery_boundary 98 and holds 105 - 7,310 lines; plus the parts of modules named in criterion 2. About 9,000 lines in all, the builder re-measuring at build."
      - "THE SYSTEM SHALL move into asset_model/ only these parts of these modules, the rest staying where it is: the collection registry's declaration half (qa_tools/collections/__init__.py, 288 lines; criterion 3); validate_check_lifecycle.collect_checks' working-tree read (the ref-reading half, _old_file_content, diff_base and moved_paths, stays); file_checks' definitions half (definitions_path, TOOL, the severity and check-name constants, Definition, definitions, active, check_id_for); evidently_common's drift arithmetic (criterion 10); arrivals' tree recognition (Arrival, Recognition, recognise, arrivals_for, unplaceable), arrivals_from_records staying (QB); delivery's tree reading (Delivery, list_deliveries, read_delivery, the receipt readers, survey, dataset_for_filename, files_by_dataset, default_deliveries_dir, default_receipts_dir) and its writer as open question 1 settles; promotion.effective_at_for, next_receipt staying because it queries qa.delivery_file (B4); list_setting_members' declaration half (declared, SetMemberCheck and their problem readers), the functions taking a connection staying; the declared-corrections readers (correction_apply._declared and Pending, correction_trial.working and its readers, agreement_freeze's _corrections_by_owner, _owner_label and revert with their helpers, correction_replay.merge_instant and docs_at), agreement_freeze's git half staying; dataset_status' status order and status_words (REQ-PIPE-390); and schemas.AMBER_SETTINGS, which moves into amber_setting so that asset_model/ does not import the 801-line requirements schema."
      - "THE SYSTEM SHALL split the collection registry so that which collections an asset declares, with each one's short, run_prefix and check-file paths (check_file, check_files, file_checks, all_collections, by_id, by_short), is in asset_model/, and loading a collection's QA adapter by path (line 273) stays in the real pipeline; loading a provider by path already sits in the generator (generator/collections/__init__.py line 45) and stays there."
      - "THE SYSTEM SHALL remove asset_model's one import of the real pipeline - assets.adapter_file importing qa_tools.collections (qa_tools/common/assets.py line 575) - by moving adapter_file into the real pipeline's half of the registry."
      - "THE SYSTEM SHALL keep the dbt readiness check (assets.dbt_project_ready and DbtPackagesMissing, REQ-QAC-368 criterion 6 as amended by Q10 of 2026-11-03) in the real pipeline, not in asset_model/."
      - "THE SYSTEM SHALL move the asset resolver's refusals with it unchanged - OutsideTheRepository raised only where code builds a repository path (REQ-PIPE-342 decisions 18 and 20), BadAssetName, ModuleNameClash and OneAssetPerProcess - with their existing tests passing."
      - "THE SYSTEM SHALL keep every asset's definitions - its hierarchy, calendar, time zone, contracts and checks - under assets/<asset>/, and SHALL hold in asset_model/ no agency, collection, dataset, calendar date or time zone of its own."
      - "THE SYSTEM SHALL import no database driver, pandas, numpy or QA tool library at module level anywhere in asset_model/, SHALL import subprocess nowhere in it and run no git command (B4), and SHALL open no database connection; asset_model/ reads committed configuration and the delivery tree, never the database (QB, SETTLED by Keith 2026-11-14)."
      - "IF an asset_model module imports qa_tools, pipeline, dashboard, cli, generator, synthetic_data_generator, bootstrap, scenarios or any file under assets/, THEN `mothman check` SHALL fail, naming the file, the line and the imported module (REQ-TEST-384)."
      - "THE SYSTEM SHALL hold drift arithmetic in one asset_model module (Q1 of 2026-11-14, SETTLED by Keith 2026-11-14) holding today's evidently_common.fold_value_counts, INVALID_CODE, NO_REFERENCE, status_for, excluding, frame_from_value_counts, psi_of_counts and compute_psi, and collection_checks, with pandas and Evidently imported inside functions only; qa_tools/tools/run_evidently.py, qa_tools/tools/dataset_stats.py and the Linkage Products provider (three imports of evidently_common) SHALL call that module, and no second copy of any of them SHALL remain."
      - "THE SYSTEM SHALL keep in the real pipeline what of evidently_common reads recorded results - recorded_stats, recorded_row_counts and reference_value_counts, which read qa_results_reader - so that the drift module reads committed configuration and the values its callers pass it, nothing else."
      - "THE SYSTEM SHALL move check_lifecycle whole (it parses committed check files and runs no git) and collect_checks' working-tree read into asset_model/, so that the generator reads checks exactly as the lifecycle gate does, and SHALL leave the gate's git-comparing half - reading a check file at a ref - in the real pipeline (380 Q1 (a), SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL move the reader of every asset's declared agencies, collections and datasets (qa_tools/common/every_asset.py) into asset_model/ unchanged, reading configuration only (Q6 and Q8, SETTLED by Keith 2026-11-03)."
      - "IF, during the build, a function the generator calls turns out to need more than criteria 1 and 2 name, and cannot move without importing the real pipeline, a QA tool library at module level, subprocess or the database, THEN THE SYSTEM SHALL report it to Keith for a decision rather than allowlist it permanently or hand its value to the generator as data. (Kept: it guards the shape of the separation, not the synthetic history.)"
      - "WHEN a module moves into asset_model/, THE SYSTEM SHALL rewrite every importer and every monkeypatch target naming it in the same change, SHALL leave no forwarding module under its old path, and a search for the old dotted path across product code, tests (monkeypatch strings included) and requirements.yaml's implemented_by and linked_tests entries SHALL find nothing."
      - "WHEN a module moves, THE SYSTEM SHALL rewrite each requirements.yaml implemented_by and linked_tests entry naming it, changing the path only, as one path-only register edit Keith signs by signing this requirement."
      - "WHEN asset_model/ lands, THE SYSTEM SHALL add it in the same change to validate_caches.SCANNED (line 50), validate_collections.SCANNED (line 39) and that module's registry-path special case (line 93), the coverage sources (pyproject.toml [tool.coverage.run] source, line 175; cli/check.py COVERAGE_PACKAGES, line 302; .github/workflows/test.yml's --cov lines 304 and 589), replay_inputs.INPUTS with KEY_PREFIX bumped (line 61), and validate-config.yml's push paths, so that no gate, coverage floor or cache key stops covering the moved code (B6)."
      - "WHEN asset_model/ lands, THE SYSTEM SHALL name it, with its charter 'configuration and the delivery tree, never the database', in CLAUDE.md's layout table, README's layout tour and docs/components.md in the same change."
    non_functional_requirements:
      - "PERFORMANCE: each asset's bootstrap from empty is no slower than before the change by more than 5 percent (SETTLED by Keith 2026-11-02), measured on the same sandbox; `mothman --help`'s import time is REQ-PIPE-385's NFR."
      - "PORTABILITY: no new third-party dependency; everything still runs through `uv run` from the repository root; an asset folder injected from outside the repository (REQ-PIPE-342) is read by asset_model/ exactly as today; the providers stay importable without pandas or numpy (REQ-GEN-246 criterion 7), which the drift module's function-level imports keep true."
      - "SCALABILITY: nothing in asset_model/ is per collection or per asset, so a thirtieth collection or a third asset adds no module to it."
      - "MAINTAINABILITY: every new test module names its asset (C11, SETTLED by Keith 2026-11-02); every asset_model name used outside its own module is public (REQ-PIPE-376); where a module is split (the registry, arrivals, delivery, check-lifecycle collection, file_checks, evidently_common, the corrections readers, dataset_status), each half's docstring names the other half and why the cut sits there."
      - "SECURITY: asset_model/ reads committed configuration, the delivery tree and the values its callers pass, runs no adapter or provider code and no git itself, and what it loads by path is decided by the caller's side, which REQ-TEST-384 checks."
      - "PRIVACY AT REAL SCALE: the drift module computes from value counts a caller passes and arrival recognition reads file names and receipts, never supply rows; reading recorded results stays in the real pipeline (criterion 11), so the shared code never reaches the warehouse."
      - "OBSERVABILITY: a moved module's implemented_by and linked_tests entries follow it (criterion 16), so the register still says where each requirement is built."
    dependencies:
      - "REQ-PIPE-342"
      - "REQ-PIPE-369"
      - "REQ-TEST-384"
      - "REQ-TEST-393"
      - "REQ-QAC-368"
      - "REQ-GEN-295"
    decisions:
      - "THE PACKAGE IS asset_model/ (SPLIT D1, SETTLED by Keith 2026-11-03), replacing domain/ (Q2, SETTLED by Keith 2026-11-02), because domain/ read as though it held the definitions, which stay in each asset's folder. REJECTED shared/, model/ and core/."
      - "THE CUT IS RIGHT (SPLIT D1, SETTLED by Keith 2026-11-03): each asset defines its own hierarchy, calendar and time zone in assets/<asset>/; the shared code that only reads those definitions sits in one package the real pipeline and the generator both import; the generator, the bootstrap and scenarios/ stay out of a real deployment."
      - "THE CODE HALF IS ITS OWN BATCH, AFTER THE SPLIT (Keith, 2026-10-31, #134 (a)). REJECTED (b), the whole separation after the split, which moves the configuration twice, and (c), the whole separation before the split."
      - "THE CHARTER IS 'CONFIGURATION AND THE DELIVERY TREE, NEVER THE DATABASE' (QB, SETTLED by Keith 2026-11-14): the generator checks its placements against the pipeline's own arrival recognition, which reads the delivery tree; arrivals_from_records (database and S3) stays in the pipeline, and generate-synthetic-data keeps writing placements with run ids. REJECTED moving those checks into the bootstrap (it would change what generate-synthetic-data writes), and a permanent allowlist entry."
      - "THE WHOLE CLOSURE IS NAMED BEFORE SIGN-OFF (architect B4, 2026-11-14): v5 quoted 3,649 lines for eight modules and listed the generator's calls; following each call's imports finds about 9,000. v5's list named promotion.next_receipt, which opens supply_db and queries qa.delivery_file (promotion.py lines 466-472) and which the generator only mentions in docstrings, so it stays; and it left out arrivals.arrivals_for (generator/driver.py line 273), correction_apply._declared with correction_trial.working (generator/correction_claims.py, scenario_injection.py line 237), check_lifecycle's own closure (check_fingerprint, check_id, file_checks' definitions) and amber_setting's import of schemas. All are in criteria 1 and 2 now."
      - "NO SUBPROCESS, NO GIT (architect B4): agreement_freeze imports subprocess at module level (line 47) and runs git (line 442); only its pure correction readers move, so git-reading code never ships as shared code. correction_apply._declared reached agreement_freeze through a function-level import; moving the readers it calls is what lets it come too."
      - "AMBER_SETTINGS MOVES INTO amber_setting (delivery-scoper, v6, from the code): amber_setting imports schemas only for that one three-word tuple (schemas.py line 520), and schemas is the requirements.yaml and CHANGELOG.yaml pydantic model; schemas then imports it from asset_model, an allowed edge. REJECTED moving schemas whole into the shared reading code."
      - "check_lifecycle MOVES WHOLE (380 Q1 (a), SETTLED by Keith 2026-11-14; found whole in v6): Keith's answer moved 'check_lifecycle's parsing half'; at 72ec04d7 the whole module is that half - it imports only config_yaml at module level, runs no git and takes a ref's file content from its caller. The git-comparing half is validate_check_lifecycle's ref read, which stays. REJECTED deciding mid-build, and a second parser for check_bands."
      - "THE DECLARED-CORRECTIONS READERS ARE CONFIGURATION (delivery-scoper, v6): the generator's correction claims call correction_replay.docs_at and merge_instant (generator/correction_claims.py lines 34-36), which revert declared corrections in the committed calendar.yaml and data-asset.yaml as they stood at an instant. They move with what they call; correction_replay's player half (staged, for_arrival, confirm_due, history_end) goes to the bootstrap (REQ-GEN-381)."
      - "NO FORWARDING MODULES (delivery-scoper): a re-export left at the old path keeps an old import working, so the import gate would stop seeing it. REJECTED shims kept for one push."
      - "THE REGISTRY IS SPLIT, NOT MOVED WHOLE (delivery-scoper): which collections exist is shared, but loading an adapter is the pipeline's and loading a provider is the generator's."
      - "DBT READINESS STAYS IN THE PIPELINE (delivery-scoper, v4): only the real pipeline runs dbt; dbt_project_ready moving with assets.py would put a QA tool's install state into the shared reading code."
      - "THE GENERATOR'S PURE PIPELINE FUNCTIONS MOVE INTO asset_model/ (Q1 of 2026-11-02, SETTLED by Keith 2026-11-02): REJECTED a permanent list of pipeline modules the generator may import, and REJECTED handing the generator everything as data, which would let its predictions drift from what the pipeline does."
      - "ONE DRIFT MODULE IN asset_model/ (Q1 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)), holding what its five functions need (frame_from_value_counts, NO_REFERENCE, INVALID_CODE, collection_checks). REJECTED (b) a second PSI copy in the generator, against A2 (SETTLED by Keith 2026-11-02), and (c) a permanent allowlist entry."
      - "asset_model/ REACHES A QA TOOL LIBRARY AT CALL TIME, ACCEPTED (Q1 of 2026-11-14): compute_psi imports Evidently when called. Criterion 8 forbids it at module level only, so importing asset_model/ still needs no QA tool."
      - "THE BOTH-HIERARCHIES READ'S PREMISE (Q6/Q8 follow-up, critic H1, SETTLED by Keith 2026-11-03): scenarios exist only for synthetic assets, and both synthetic assets are always present together for demo and test, so the read always finds both; a single-asset injected deployment is a real one, which carries no scenarios. REJECTED staying quiet when the other folder is absent, and deferring to REQ-PIPE-354."
      - "NO EQUIVALENCE COMPARE (QD and the standing rule, Keith 2026-11-14: 'Just delete the equivalence thing ... we don't need to assure that [the] demo hasn't moved'): v5's criterion 17 and its BEHAVIOUR-PRESERVING NFR are gone. The test suite is the proof; REQ-TEST-239 is retired and its harness deleted (REQ-TEST-393)."
      - "THE PATH-ONLY REGISTER REWRITE (architect, non-blocking, 2026-11-14): about 323 implemented_by and evidence lines name the moving files. v6 rewrites implemented_by and linked_tests (criterion 16), which the requirements gate checks against real files; evidence and decisions prose is left as the record of its day, because rewriting it would make a past claim read as if it had been verified against code that did not exist yet."
      - "MOVED MONKEYPATCHES ARE PROVED TO TAKE EFFECT (architect's code-quality expectations, for the builder and delivery-critic): about 57 monkeypatches of module attributes such as asset_time and schedule; a patch left on the old module silently stops applying and its test passes testing nothing, so each re-pointed patch is broken once and seen to fail. Also for the builder: extend asset_time with the clock rather than add a third time module (REQ-PIPE-382); every failure of the imports gate names file, line, both sides and the module; every fallback caller of the Q6 error has a failing-first test naming that caller (REQ-PIPE-378)."
      - "BUILD ORDER (the architect's, captures removed under QD): 393, then 384 and 388; 380 with 376 and 390; 383, 382 and 381; 386 and 391; 385 and 379; 377 then 378 then 394; 387; 389; 392 last. 377's report-to-Keith criterion lands before 392, so a disagreement between copies is settled before the history is regenerated."
      - "#137 GROUP A IS NOT A DEPENDENCY (Keith, 2026-11-02): it has landed; line counts here are re-taken at build."
    open_questions:
      - "1 (NEW in v6). THE ONE DELIVERY WRITER (found in the code, 2026-11-14). v5 sent delivery writing (write_delivery and its receipts) to the generator, but the real pipeline's hand filing writes a delivery through the same function (qa_tools/common/hand_filing.py line 275) and the generator's driver writes through it too (generator/driver.py line 234); remove_deliveries, existing_delivery_names and the bookkeeping file are the generator's alone. Options: (a) write_delivery and write_receipts into asset_model/ beside the tree readers, under QB's charter 'configuration and the delivery tree', the generator-only removers going to the generator; (b) a second writer in the generator, hand filing keeping the pipeline's - two writers of one layout; (c) hand filing calls the generator's writer - the real pipeline importing the generator, forbidden. RECOMMENDED (a): one writer keeps the layout the readers expect in one place, and it touches files under data/deliveries/ only, never the database; it does widen asset_model/ from reading to writing the tree, which is why it is asked rather than assumed."
    signed_off: null

  - id: REQ-GEN-381
    title: "The bootstrap and replay machinery - bootstrap, checkpoints, replay inputs, the replay clock that acts on the pipeline's clock events, the scripted-decision and correction players, target agreement and the synthetic reset - is a package of its own outside qa_tools/, and the real pipeline never imports it"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want everything that exists only to replay a synthetic history in one package outside the pipeline, so that a deployment leaves it out and the pipeline cannot come to depend on it."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; 'the bootstrap and replay machinery out of qa_tools'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14; v6 2026-11-14 with B3 (the register parser to scenarios/), QA (clock events), CLI A and the architect's B6. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold in one top-level package, bootstrap/ (Q2, SETTLED by Keith 2026-11-02), the modules that exist only to replay a synthetic history: today's qa_tools/common/bootstrap (783 lines at 72ec04d7), checkpoints (335), replay_inputs (263), target_agreement (387), synthetic_reset (211) and scripted_corrections (190); the player half of scripted_decisions (Player and what plays a scripted decision; its file reader goes to scenarios/, REQ-GEN-386); the player half of correction_replay (staged, for_arrival, confirm_due, history_end; merge_instant and docs_at go to asset_model/, REQ-PIPE-380); and the replay clock that acts on REQ-PIPE-382's clock events. None of them SHALL remain under qa_tools/."
      - "IF `mothman pipeline bootstrap` is asked to run for an asset that does not declare `synthetic: true`, THEN THE SYSTEM SHALL refuse, naming the asset and its data-asset.yaml, saying that nothing was generated, and naming `mothman pipeline run` as a real asset's first run (Q5, SETTLED by Keith 2026-11-02; the wording follows `mothman env reset-synthetic`'s refusal, cli/env.py lines 113-116), reading the declaration through REQ-PIPE-382's one reader; replay_clock.replaying's wall-clock branch for a real asset's bootstrap SHALL go."
      - "THE SYSTEM SHALL let the bootstrap package import asset_model/, scenarios/ (REQ-GEN-386 criterion 4), the real pipeline and the generator's one public module (REQ-GEN-386 criterion 3), and SHALL NOT let it import cli/: the 7 statements reaching cli.pipeline (bootstrap.py lines 392, 488, 493, 511 and 695; replay_inputs.py line 155; checkpoints.py line 211) SHALL go."
      - "IF any module under qa_tools/, pipeline/, dashboard/ or an asset's collections/ imports the bootstrap package, THEN `mothman check` SHALL fail, naming it (REQ-TEST-384)."
      - "THE SYSTEM SHALL move into the real pipeline what real commands read of bootstrap.py today: how collections are grouped into streams (streams and StreamRefused; knock_on.py line 478, cli/pipeline.py lines 123-124) and the refusal over recorded history (holds_history and HISTORY_REFUSAL; cli/pipeline.py lines 109-111), so that `mothman pipeline run` needs nothing of the bootstrap package."
      - "THE SYSTEM SHALL keep `mothman pipeline bootstrap`, resume, checkpoints, `mothman pipeline cache-key`, `mothman scenarios map|list|validate`, the target trial and `mothman env reset-synthetic` working for each synthetic asset (REQ-PIPE-352, REQ-PIPE-365 criteria 2 and 3), with their tests passing; `mothman scenarios bands` is deleted by REQ-PIPE-385 and `pipeline run`'s generation by REQ-PIPE-385 criterion 4."
      - "THE SYSTEM SHALL key the replay cache (replay_inputs.INPUTS and REPLAY_INPUTS, lines 47-57) on asset_model/**, scenarios/** and bootstrap/** as well as today's inputs, drop cli/pipeline.py from INPUTS once the bootstrap no longer reaches it (criterion 3), and bump KEY_PREFIX (line 61, 'bootstrap-v3-' today), so that a change to code moved out of qa_tools/** restarts a resume and misses the cache as it does today."
      - "WHEN bootstrap/ lands, THE SYSTEM SHALL add it in the same change to validate_caches.SCANNED, validate_collections.SCANNED, the coverage sources (pyproject.toml line 175, cli/check.py COVERAGE_PACKAGES line 302, test.yml's --cov lines 304 and 589) and validate-config.yml's push paths (B6)."
      - "WHEN bootstrap/ lands, THE SYSTEM SHALL name it in CLAUDE.md's layout table, README's layout tour and docs/components.md in the same change, and rewrite each requirements.yaml implemented_by and linked_tests entry naming a moved module, path only, as REQ-PIPE-380 criterion 16 does."
    non_functional_requirements:
      - "PERFORMANCE: each asset's bootstrap from empty is no slower than before the change by more than 5 percent (SETTLED by Keith 2026-11-02), and it still meets REQ-PIPE-352 criterion 5's 12 minutes wherever it met it before."
      - "RELIABILITY: a resume after the move still restarts when the machinery or the shared reading code changes (criterion 7), so a checkpoint never outlives the code that wrote it."
      - "COST: a CI cache hit stays a hit only when nothing it depends on changed; criterion 7 stops a stale cache passing silently, which would make a cheap push prove nothing; the KEY_PREFIX bump costs one cache miss on the next hand-started test.yml."
      - "PRIVACY AT REAL SCALE: the package that can invent a record's time and play a scripted person is the part a real deployment leaves out."
      - "MAINTAINABILITY: about 3,000 lines change address once; nothing gains a new dependency; every new test module names its asset (C11)."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-382"
      - "REQ-PIPE-383"
      - "REQ-TEST-384"
      - "REQ-GEN-386"
      - "REQ-PIPE-352"
      - "REQ-PIPE-365"
      - "REQ-TEST-117"
      - "REQ-TEST-160"
    decisions:
      - "OUT OF qa_tools, NOT A SUBPACKAGE OF IT (Keith, 2026-10-31, #134: 'strict separation ... with the actual pipelines'). REJECTED (b) and (c) of #134 as in REQ-PIPE-380."
      - "SEPARATE FROM THE GENERATOR, NOT ONE 'synthetic' PACKAGE (Keith, 2026-10-31: 'a strict separation between themselves'). REJECTED one package holding both, with the separation left to convention."
      - "THE TS REGISTER PARSER IS NOT THE BOOTSTRAP'S (B3, SETTLED by Keith 2026-11-14): qa_tools/common/scenarios.py goes to scenarios/ with the placements reader, the map vocabulary and the scripted_decisions.yaml reader, so v5's criterion 1 no longer lists it. SUPERSEDES the split overview's 'the TS register's parser goes to bootstrap/'. REJECTED the map writer moving to the bootstrap."
      - "SYNTHETIC RESET GOES WITH THE BOOTSTRAP (delivery-scoper): it is refused unless the asset is synthetic and exists only to start a replay from empty."
      - "THE BOOTSTRAP IS SYNTHETIC-ONLY (Q5, SETTLED by Keith 2026-11-02): REJECTED keeping a bootstrap for a real asset, whose first run is `mothman pipeline run`."
      - "THE BOOTSTRAP STAYS GEN (SETTLED by Keith 2026-11-02): REJECTED PIPE, and REJECTED a new eighth component code."
      - "SEVEN REACHES INTO cli/ (the split overview, corrected 2026-11-02; re-counted 2026-11-14): all seven go through the generator's public module, which offers what cli/pipeline.py offers the bootstrap today."
      - "pipeline run READS TWO THINGS OF bootstrap.py (delivery-scoper, v6, from cli/pipeline.py): v5 moved only streams; the history refusal is a real command's too, so it moves with it. targets_agree and _confirm_corrections leave `pipeline run` altogether (CLI A, REQ-PIPE-385 criterion 4)."
      - "THE CACHE KEY FOLLOWS THE CODE (delivery-scoper, v5; architect B6): INPUTS lists qa_tools/**, generator/**, assets/** and cli/pipeline.py; the new packages are outside every pattern, and the KEY_PREFIX bump stops an old cache matching a new meaning, as its own comment says it exists to do."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's criterion 9 and BEHAVIOUR-PRESERVING NFR are gone; the test suite is the proof. REQ-TEST-239 leaves the dependencies."
    open_questions: []
