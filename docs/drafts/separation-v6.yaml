  - id: REQ-PIPE-379
    title: "Every asset reads its delivery calendar through one mechanism in asset_model/ - named calendars of authored dates or the daily cadence rule, each dataset picking one - and a project extraction owes no slot by declaring `no_calendar: never`"
    date_written: "2026-11-03"
    story: "As whoever would stand up a new asset - including a one-off project extraction - I want its delivery calendar to be configuration read by the same code as every other asset's, so that a new asset needs no calendar code of its own."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 1b (SPLIT D1b, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14 with Q2; v6 2026-11-14, the compare NFR removed (QD) and the fixture shared with REQ-PIPE-385 (architect). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL read every asset's calendar.yaml through one loader in asset_model/, with the calendars' dates and versions per asset (SPLIT D1b, SETTLED by Keith 2026-11-03)."
      - "THE SYSTEM SHALL keep both calendar shapes a version may take today - authored dates, and the daily cadence rule (`cadence: {rule: daily}`, Birth Registrations') - read by that one loader (Q2 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL NOT branch on an asset's name or a calendar's name anywhere outside that asset's own folder: generator/scenario_injection.py line 1418's test for a calendar named 'daily' SHALL read whether the calendar version in force is a cadence rule instead."
      - "WHERE a dataset declares `no_calendar: never` (REQ-PIPE-106), THE SYSTEM SHALL give it no slot, no period and nothing owed, as today, and SHALL keep `no_calendar`'s distinction between a schedule not yet agreed and one that will never exist (Q2 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL have a test that runs a fixture asset whose only collection is a project extraction, its datasets declaring `no_calendar: never`, through `mothman pipeline run` and `mothman dashboard rebuild`, and shows each supply staged, checked and recorded with no slot, no period and nothing marked missing."
      - "WHERE a new asset declares its calendars in its own calendar.yaml, THE SYSTEM SHALL need no code change to read them, and the schedule gate SHALL check them as it checks today's."
    non_functional_requirements:
      - "SCALABILITY: a third or fourth asset shape (the project extraction, CLAUDE.md's scale note) adds configuration, not code."
      - "COST: criterion 5's test shares REQ-PIPE-385 criterion 14's fixture asset (copied dbt packages, no network) and the test database, not a bootstrap; a real four-tool run takes tens of seconds, so it is not marked critical."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-106"
      - "REQ-PIPE-385"
    decisions:
      - "ONE MECHANISM, PER-ASSET DATES (SPLIT D1b, SETTLED by Keith 2026-11-03): named calendars, each dataset picking one; a project extraction has no slots. REJECTED a per-asset calendar plug-in."
      - "ONE MECHANISM MEANS TODAY'S MECHANISM (Q2 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)). REJECTED (b) authored dates only, which would write the daily calendar out date by date and lose 'not yet agreed' against 'never'; and (c) an extraction naming an empty calendar instead of `no_calendar: never`."
      - "D1b's WORDING READ THROUGH Q2 (delivery-scoper, v5): D1b said 'a calendar with no slots'; Q2 settles that the form is a dataset declaring `no_calendar: never`."
      - "MOSTLY ALREADY TRUE (delivery-scoper, 2026-11-03): what is missing is a proof that a whole asset of that shape runs (criterion 5) and one name-based branch in the generator (criterion 3)."
      - "ONE FIXTURE ASSET FOR TWO TESTS (architect, non-blocking): this test and REQ-PIPE-385's import-blocking test both need an asset with no synthetic/ folder; one fixture serves both, and 'costs seconds' was unrealistic."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's BEHAVIOUR-PRESERVING NFR for criterion 3 is gone."
    open_questions: []
    signed_off: null

  - id: REQ-QAC-387
    title: "One shared file-checks default beside dbt_shared/ applies to every asset, which an asset may add to, override by check name, or retire for itself in its own file-checks.yaml"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want the checks asked of every delivered file written once for every asset, so that a new file-level check reaches every asset at once and an asset that needs something different says so in its own folder."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 2, file-checks.yaml (SPLIT D2, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14 with Q3; v6 2026-11-14 with the architect's B6 and lifecycle-base points and the CLI review's finding 5. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold the file checks every asset runs in one shared file at the repository root beside dbt_shared/ (file-checks.yaml), holding today's six checks - encoding, delimiter, header_row, header_names_unique, fields_per_row and column_order - byte-identical in both assets' folders at 72ec04d7."
      - "WHERE an asset's file-checks.yaml holds an entry whose `check:` names a shared check, THE SYSTEM SHALL use that entry in place of the shared one, whole, for that asset only; no field of the shared entry SHALL be inherited (Q3 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "WHERE an asset's file-checks.yaml holds an entry whose `check:` names no shared check, THE SYSTEM SHALL run it as a check for that asset only."
      - "WHERE an asset's override of a shared check carries `retired_as_of`, THE SYSTEM SHALL stop running that shared check for that asset from that date, as a retired check is stopped today, and SHALL keep running it for every other asset."
      - "WHERE an asset's folder holds no file-checks.yaml, THE SYSTEM SHALL run the shared default unchanged, and `mothman check`'s collections gate SHALL no longer require the file in each asset folder (validate_collections.ASSET_WIDE today, line 286)."
      - "THE SYSTEM SHALL read the merged checks through one function in asset_model/, beside file_checks' definitions half (REQ-PIPE-380 criterion 2), used by every reader of file-checks.yaml at 72ec04d7 (file_checks.py line 49, qa_tools/collections/__init__.py line 150, check_bands' file bands, check_lifecycle.parse_file_check_metadata through validate_check_lifecycle, and validate_collections)."
      - "THE SYSTEM SHALL derive each file check's id per dataset as today (`<asset>.<agency>.<collection>.<dataset>.<check>_file`, REQ-QAC-096 criterion 4), so that no recorded check id changes, an override included."
      - "THE SYSTEM SHALL hold the shared default and each asset's additions and overrides to the check-lifecycle gate, the authoring rules and the changelog rule a file check is held to today (REQ-QAC-096 criteria 5 and 6); IF an override changes what a check does, or retires it, without a changelog entry of its own, THEN the lifecycle gate (`mothman dashboard validate-check-lifecycle`, which validate-config.yml runs and `mothman check` does not) SHALL fail naming the asset and the check."
      - "WHEN the push that moves the two per-asset copies into the shared file is gated, THE SYSTEM SHALL have the lifecycle gate read the shared default's checks at the base from the two former per-asset files, so that no file check reads as new on that push (architect, non-blocking: moved_paths.py consults its map only where the base holds no assets/ folder, which this base does)."
      - "IF an asset's file-checks.yaml names a key the shared default does not allow, or names one check twice, THEN the collections gate (`mothman check --only collections`) SHALL refuse it naming the asset, the file and the entry."
      - "WHERE the selected asset's folder is outside the repository (REQ-PIPE-342's injection), THE SYSTEM SHALL read the shared default from the code's own checkout and the asset's additions and overrides from the asset folder."
      - "WHEN this lands, THE SYSTEM SHALL delete both assets' identical copies, and SHALL add the root file-checks.yaml to replay_inputs.INPUTS (with a KEY_PREFIX bump) and to validate-config.yml's push paths, so that a change to it restarts a resume, misses the cache and runs the configuration gates (B6)."
      - "THE SYSTEM SHALL have tests, seen failing first, of an asset adding a check, of an asset overriding one whole (a field the override leaves out is not taken from the shared entry), of an asset retiring a shared check for itself while another asset still runs it, of an asset with no file of its own running exactly today's six checks, and of a check named twice refused."
    non_functional_requirements:
      - "SCALABILITY: at thirty collections and a third asset, a new file-level check is one entry, not one per asset."
      - "COMPATIBILITY: the shared default ships with the code, as dbt_shared/ does, so an injected asset folder outside the repository still gets it."
      - "AUDITABILITY: an asset's override or retirement carries its own changelog entry, so which asset departs from the shared default, and why, is on the record."
      - "MAINTAINABILITY: an override is read whole in one place, so a reader never has to merge two files in their head to know what an asset runs."
      - "RELIABILITY: the move itself is not read by the lifecycle gate as six new checks per asset (criterion 9), and a change to the shared file cannot hit a stale bootstrap cache (criterion 12)."
    dependencies:
      - "REQ-QAC-096"
      - "REQ-PIPE-342"
      - "REQ-QAC-368"
      - "REQ-PIPE-380"
    decisions:
      - "ONE SHARED DEFAULT, BESIDE dbt_shared/ (SPLIT D2, SETTLED by Keith 2026-11-03). REJECTED a copy per asset, with or without a gate."
      - "OVERRIDE BY CHECK NAME (Q3 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)). REJECTED (b) field-by-field inheritance, and (c) additions only, which does not meet D2's 'or override'."
      - "THE FILE NAME IS THE SCOPER'S PROPOSAL (delivery-scoper, 2026-11-03): file-checks.yaml at the repository root. Keith may change it at sign-off."
      - "IDS STAY PER ASSET (delivery-scoper): a file check's id already carries the asset, so sharing the definition shares no recorded result between assets."
      - "THE GATES ARE NAMED (CLI review finding 5): criteria 8 and 10 say which `mothman check` gate fails, so each can be driven after the build. The lifecycle gate is not a `mothman check` row at 72ec04d7 (cli/check.py has none); it runs in validate-config.yml, so criterion 8 names its command."
      - "people.yaml AND data-asset.yaml STAY COPIED (SPLIT D2, SETTLED by Keith 2026-11-03), with no gate."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's criterion 10 compare and BEHAVIOUR-PRESERVING NFR are gone; criterion 13's no-file-of-its-own test pins today's six."
