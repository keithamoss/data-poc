  - id: REQ-PIPE-382
    title: "The real pipeline reads the time through one clock in asset_model/ - the instant it stamps on a record and 'today' alike - and announces neutral clock events that only an installed replay of a synthetic asset acts on, so no real pipeline module imports replay_clock or knows a replay is running"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want the pipeline to ask one clock for the time and to say only what happened - an arrival received, a decision taking effect - never whether a replay is running, so that the replay can leave with the bootstrap and a real record's time can still never be invented."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; 'the replay clock untangled from the real pipeline'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14; v6 2026-11-14 with QA (neutral clock events) and B1 (one clock), SETTLED by Keith 2026-11-14. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL give the real pipeline one clock, asset_time.now() in asset_model/ (asset_time extended, no third time module), and every real pipeline module that reads replay_clock today SHALL read the time from it and import nothing of replay_clock: 17 modules at 72ec04d7 (stage and orchestrate in qa_tools/tools/; arrival_lifecycle, census, correction_apply, decision_log, delivery_log, file_checks, filing, gate, inheritance, knock_on, period_schema, qa_store, recheck, schedule_ended and supply_holds in qa_tools/common/)."
      - "THE SYSTEM SHALL answer the instant stamped on a record and 'today' from that one clock (B1, SETTLED by Keith 2026-11-14), so that promotion.effective_at_for (promotion.py line 421), orchestrate's pass delay and every other reader of 'now' read the replay's instant during a replay and the wall clock otherwise."
      - "WHILE no clock is installed, THE SYSTEM SHALL answer with the wall clock, as asset_time.now() does today."
      - "THE SYSTEM SHALL let the clock be replaced only by one installation call for the span of a replay; IF the selected asset does not declare `synthetic: true`, THEN asset_model/ SHALL refuse the installation itself, so that the refusal holds with the bootstrap package absent (Q6 of 2026-11-02, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL read an asset's `synthetic: true` declaration in one place, asset_time.declared_synthetic in asset_model/, and the other two readers (replay_clock._is_synthetic, synthetic_reset.is_synthetic) SHALL call it (#137 group D); the dashboard footer's synthetic wording (REQ-PIPE-385 criterion 12) SHALL take its answer from the same reader."
      - "THE SYSTEM SHALL offer, in asset_model's clock, neutral events the pipeline announces at every site that sets the simulated time today (QA, SETTLED by Keith 2026-11-14): an arrival received at an instant is being processed, as a context spanning its processing (orchestrate.py lines 557-558 on resume, arrival_lifecycle.py lines 199-200); a delivery or file received at an instant is being staged or recorded (stage.py line 163, arrival_lifecycle.py line 241, delivery_log.py line 395); and a decision takes effect at an instant, as it is recorded (decision_log.py lines 971-972, rule-made decisions inside promotion included)."
      - "THE SYSTEM SHALL have the pipeline announce each event unconditionally, with no test of whether a replay is running, and SHALL have the wall clock and a pinned clock ignore every event; only an installed replay clock (REQ-GEN-381) acts on them."
      - "THE SYSTEM SHALL stage the agreement as it stood at an arrival's receipt through the arrival event's context (today arrival_lifecycle._as_it_stood, lines 168-179): an installed replay may stage the configuration for the span of that context, the wall clock stages nothing, and arrival_lifecycle SHALL import nothing of correction_replay."
      - "THE SYSTEM SHALL remove every replay_clock.active() read (orchestrate.py line 557, arrival_lifecycle.py lines 175 and 199, decision_log.py line 971) and the 2 @replay_clock.on_replay_clock decorations (orchestrate.py lines 548 and 658) from real pipeline modules, the bootstrap installing its clock around its own call instead."
      - "WHERE MOTHMAN_PINNED_NOW is set, THE SYSTEM SHALL pin the time through the same installation call and the same refusal (Q7, SETTLED by Keith 2026-11-02); WHERE a replay installs its clock while the time is pinned, the replay clock SHALL read the pinned instant until its first event."
      - "THE SYSTEM SHALL have tests, seen failing first, of a real pipeline module stamping a record with an installed clock, of promotion.effective_at_for reading the installed clock, of each event ignored by the wall clock and acted on by an installed replay clock, of an arrival's agreement staged only within its event's context, of installation refused on a non-synthetic asset in a process where the bootstrap package cannot be imported, and of a record stamped with the wall clock when no clock is installed."
    non_functional_requirements:
      - "SECURITY AND PRIVACY: a real asset's record of when something happened is evidence; the refusal to invent it lives in code a real deployment keeps (criterion 4), and the events a real pipeline announces change nothing on a real asset."
      - "PERFORMANCE: reading the clock, and announcing an event the wall clock ignores, costs about what asset_time.now() costs today; the bootstrap is no slower than before by more than 5 percent (SETTLED by Keith 2026-11-02)."
      - "RELIABILITY: the clock stays process-wide, as replay_clock's own docstring explains (a run's four tools write from worker threads a context variable would not reach)."
      - "AUDITABILITY: run_by and run_timestamp keep coming from the same places; only which module supplies the instant changes."
      - "MAINTAINABILITY: the stamp-versus-today rule is stated once, in asset_time's docstring: there is one reading; a replay replaces it, nothing else does."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-383"
      - "REQ-PIPE-081"
    decisions:
      - "ONE SEAM, NOT A FLAG IN EVERY MODULE (Keith, 2026-10-31, #134: replay_clock 'woven into about 20 real pipeline modules'; 17 at every count since)."
      - "NEUTRAL CLOCK EVENTS (QA, SETTLED by Keith 2026-11-14, option (a)): the pipeline says what happened - received at X, takes effect at Y - and imports nothing of the replay; the wall clock ignores the events and an installed replay clock acts on them. REJECTED (b) a hook protocol of before, around, per-staged-file and on-each-decision calls threaded down to promotion, and (c) v5's two hooks with rule-made decisions no longer moving the clock. Answers the architect's B2: the correction scope around an arrival and the per-decision advance, which no bootstrap hook could reach, are events now."
      - "ONE CLOCK (B1, SETTLED by Keith 2026-11-14, and confirmed when asked again): the merge stamp and 'today' are one reading, as v5 said. REJECTED keeping two readings (stamp versus today). Recorded instants may move - promotions in the synthetic history get new effective times - and that is ACCEPTED; under QD they are not listed. QA's 'no recorded instant moves' no longer holds, because of this answer."
      - "WHERE PIN AND REPLAY MEET (delivery-scoper, v6, from the architect's B1): with one clock the two cannot both answer, so the replay takes over and starts from the pinned instant until its first event, as it starts from the wall clock today (replay_clock.now() falls back to asset_time.now() before its first anchor). The equivalence harness, which needed both at once, is deleted (REQ-TEST-393), so nothing else needs them together."
      - "MOTHMAN_PINNED_NOW STAYS (delivery-scoper, v6): it was REQ-TEST-239 criterion 16's, and that requirement is retired, but tests/test_cli_cp.py (lines 255 and 328) pins it to capture arrival rows, and tests/test_pinned_now.py tests it; its docstrings stop naming the harness (REQ-TEST-393)."
      - "THE PIPELINE ONLY ANNOUNCES, THE REPLAY ACTS (delivery-scoper, carried from v5's 'the pipeline only reads the clock, the bootstrap sets it'): anchoring at an arrival's receipt and advancing to a decision's instant are replay acts."
      - "THE REFUSAL LIVES IN THE SHARED CLOCK (Q6 of 2026-11-02, SETTLED by Keith 2026-11-02): REJECTED leaving it to the bootstrap, which a real deployment does not have."
      - "MOTHMAN_PINNED_NOW GOES THROUGH THE SAME SEAM (Q7, SETTLED by Keith 2026-11-02): REJECTED leaving it as a second way to set the time."
      - "REJECTED passing a clock argument through every call (delivery-scoper): it would widen the signature of every stamping function in 17 modules for a replay-only need."
      - "ONE READER OF synthetic: true (#137 group D): three hand-written readers of one declaration would eventually disagree, and the refusal in criterion 4 depends on it. asset_time.declared_synthetic is already the one the clock uses, so it stays the one."
      - "NO REFUSAL KEYED ON THE ENVIRONMENT (delivery-scoper, v6, answering the architect's optional security point): refusing the installation where MOTHMAN_ENVIRONMENT is a publishing one would also refuse the published demo, which is a synthetic asset, and environments.yaml keys behaviour off properties rather than the word 'production'; `synthetic: true` is the declaration that means a history may be invented."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's criteria 9 and 10 (the moved-instant list) and the BEHAVIOUR-PRESERVING-EXCEPT NFR are gone; the architect also found the compare normalised those instants away, so it could not have evidenced them."
      - "FOR THE NEXT BATCH (architect): the speed batch's pinned mode (S2) must go through this seam, or it puts back the replay flag this requirement removes; so this lands before it."
    open_questions:
      - "1 (NEW in v6). WHAT effective_at_for BECOMES UNDER ONE CLOCK. It answers min(now, received + seeded lag), capped at the next receipt and the claim window (REQ-PIPE-081; Keith's 2026-10-02 lag, chosen so the receipt-to-promotion interval 'shows a spread rather than a column of zeros'). Under B1 a replay's 'now' is about the arrival's own receipt, so the lag and both caps never bind on any asset - a synthetic promotion takes effect seconds after receipt, as a real one already does - and Birth Registrations' near-constant 'awaiting a decision' (a lag artefact, REQ-PIPE-081's 2026-10-05 decision) goes. Options: (a) keep the function as written, reading the one clock; rewrite its docstring and add one REQ-PIPE-081 decision saying the lag no longer binds in a replay; (b) remove the lag, its seed and both caps, effective_at_for answering the clock's now - less code, but it deletes a built requirement's design and REQ-PIPE-378's orchestrate._claim_window criterion with it. RECOMMENDED (a): it is exactly what B1 settled, the smallest change, and (b) can follow as its own tidy-up once Keith has seen the regenerated history."
    signed_off: null

  - id: REQ-PIPE-383
    title: "Scripted decisions are played by the bootstrap through the player a replay takes, scripted corrections are staged through REQ-PIPE-382's arrival event, and the real pipeline neither builds a player nor imports scripted_decisions or correction_replay"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want the real pipeline to offer a place to act between arrivals rather than to play scripted decisions itself, so that a synthetic history's scripted people go with the bootstrap and the pipeline only ever processes what arrived."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31 scan: 'orchestrate plays scripted decisions'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14; v6 2026-11-14 with QA (corrections through the arrival event, not a hook) and CLI review finding 11. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL let a caller of a collection's replay and of a stream's replay (orchestrate.run_pipeline and run_stream today) pass a player run before each arrival and after the last, the shape scripted_decisions.Player and orchestrate.StreamPlayer have today, and SHALL run none WHERE none is passed."
      - "THE SYSTEM SHALL NOT build a scripted-decision player inside the real pipeline: orchestrate._begin's default of scripted_decisions.Player(coll.id) (line 606, imported at line 586) SHALL go, and the bootstrap SHALL build each collection's player and each stream's combined player and pass it in, StreamPlayer (line 640) moving with it."
      - "THE SYSTEM SHALL stage an arrival's scripted corrections through REQ-PIPE-382's arrival event (its criterion 8) rather than through a player hook or an import of correction_replay (arrival_lifecycle.py line 177)."
      - "WHEN the bootstrap replays a synthetic asset, THE SYSTEM SHALL play every scripted decision that takes effect before an arrival's receipt before that arrival is processed, and every scripted correction from the start of its merge date, through the same decision path a person uses (REQ-GEN-135), refused unless the asset declares itself synthetic."
      - "WHEN `mothman pipeline run` or the processing pass runs, on any asset, THE SYSTEM SHALL play no scripted decision and no scripted correction; only the bootstrap plays them (Q5, SETTLED by Keith 2026-11-02)."
      - "WHERE `mothman pipeline run` runs on an asset that declares `synthetic: true`, THE SYSTEM SHALL print one dim line saying that scripted decisions are played only by `mothman pipeline bootstrap` and this run played none (CLI review finding 11)."
      - "THE SYSTEM SHALL have tests, seen failing first, of a replay given no player playing nothing, of a stream's player called before an arrival of another collection received after a decision's instant (REQ-PIPE-262 criterion 4), and of `mothman pipeline run` on a synthetic asset recording no decision by the synthetic actor."
    non_functional_requirements:
      - "AUDITABILITY: scripted decisions keep their synthetic actor and recorded instants (REQ-GEN-135), so a replayed history still says who decided and when."
      - "SECURITY: the real pipeline keeps its refusal of the synthetic actor outside a replay (filing_decisions.py, people.py), because a guard is not machinery and must stay where a real deployment runs it."
      - "PERFORMANCE: a player call per arrival is what it costs today."
      - "OBSERVABILITY: criterion 6's line answers 'why is my queue full' at the moment it would be asked, rather than in a document."
    dependencies:
      - "REQ-GEN-381"
      - "REQ-PIPE-382"
      - "REQ-GEN-135"
      - "REQ-PIPE-262"
    decisions:
      - "THE PLAYER SEAM EXISTS, THE CORRECTION SEAM IS AN EVENT (delivery-scoper, v6, under QA): the replay already takes a player argument, so only its default reaches the scripts. The correction lookup was a scope around an arrival's processing (correction_replay.for_arrival is a context manager - the architect's B2), which a before-call cannot carry; QA (SETTLED by Keith 2026-11-14) makes it the arrival event's context. REJECTED growing the player into a protocol of before, around and per-staged-file calls (QA (b))."
      - "THE SYNTHETIC-ACTOR REFUSAL STAYS IN THE PIPELINE (delivery-scoper): REJECTED moving it with the player, because a real deployment would then have no guard against the synthetic actor."
      - "ONLY THE BOOTSTRAP PLAYS SCRIPTED DECISIONS (Q5, SETTLED by Keith 2026-11-02): REJECTED `mothman pipeline run` playing them on a synthetic asset as it does today. Any test asserting that `pipeline run` plays them changes with this requirement."
      - "pipeline run ON A SYNTHETIC ASSET IS THE REAL PATH (delivery-scoper, v6, following CLI A and Q5): it generates nothing (REQ-PIPE-385 criterion 4), plays nothing and installs no replay clock, so its records carry the wall clock - exactly what it would do on a real asset. A replayed history is the bootstrap's. Recorded so that wall-clock stamps on a `pipeline run` over generated files are not read as a regression of REQ-PIPE-081."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5 criterion 6's 'every decision-log entry is unchanged' and the BEHAVIOUR-PRESERVING NFR are gone; the tests in criterion 7 are the proof."
    open_questions: []
    signed_off: null

  - id: REQ-TEST-384
    title: "An imports gate in mothman check and the validate-config workflow fails any import, or any load by path, across a forbidden edge between asset_model/, the real pipeline, the generator, scenarios/, the bootstrap and cli/, and any file in no side, with a shrink-only allowlist whose every entry names the requirement that removes it"
    date_written: "2026-11-02"
    story: "As whoever maintains the pipeline, I want a gate that fails a forbidden import in either direction, including code run by file path, on every change and every push, so that the separation is checked rather than remembered."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31: 'a strict separation'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14 with Q11; v6 2026-11-14 with the CLI review's findings 4 and 5 and the architect's non-blocking points (one walker, a named subcommand, no file in no side). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL offer an `imports` gate, run as `mothman dashboard validate-imports` and needing no asset and no database, that reads every Python file of the repository outside tests/, scripts/ and docs/ by its syntax tree - module-level and function-level imports, imports under `if TYPE_CHECKING:`, and importlib.import_module calls with a literal name - and assigns each file to one side: asset_model/; the real pipeline (qa_tools/, pipeline/, dashboard/, aws/ and each asset's collections/); the generator (generator/, synthetic_data_generator/ and each asset's synthetic/collections/); scenarios/; bootstrap/; or cli/."
      - "IF a Python file the gate reads falls in no side, THEN the gate SHALL fail naming it, so that a new top-level package must be given a side before it can land."
      - "IF asset_model/ imports any other side, or the real pipeline imports the generator, scenarios/, the bootstrap or cli/, or scenarios/ imports anything but asset_model/, or the generator imports the bootstrap, cli/ or the real pipeline (Q1, SETTLED by Keith 2026-11-02), or the bootstrap imports cli/, THEN the gate SHALL fail."
      - "THE SYSTEM SHALL print each finding as one line of the form `<path>:<line>: <side> imports <side> (<module>) - forbidden edge`, followed by one closing line giving the count and saying the fix is to move the code across the boundary, not to add an allowlist entry (CLI review finding 5)."
      - "THE SYSTEM SHALL treat each call of asset_model's path loader as an import of the side its kind names - 'adapter' the real pipeline, 'provider' the generator - so that a load by path across a forbidden edge fails as an import would; IF a call passes its kind as anything but a literal, THEN the gate SHALL fail, naming the call."
      - "THE SYSTEM SHALL read the gate's exceptions from one committed allowlist whose every entry names a file, the module it imports and the requirement that removes it; WHERE an entry names no requirement the gate SHALL fail, and WHERE an entry matches no import any more it SHALL fail saying '<allowlist file>: entry <file> imports <module> (<requirement>) matches no import any more - delete it'."
      - "IF a change adds an allowlist entry absent at the base commit, THEN the gate SHALL fail, saying the list only shrinks (REQ-TEST-384) and naming the base commit it compared against."
      - "WHEN this gate lands, THE SYSTEM SHALL hold in the allowlist exactly the gate's own findings on that commit, so that it lands green, and each of REQ-PIPE-380, REQ-GEN-381, REQ-PIPE-382, REQ-PIPE-383, REQ-PIPE-385, REQ-GEN-386, REQ-QAC-389 and REQ-PIPE-390 SHALL remove the entries it names."
      - "THE SYSTEM SHALL build the gate on one syntax-tree walker shared with validate_caches (which already walks syntax trees), and SHALL carry as rules of this gate, rather than as scanners of their own, REQ-PIPE-376 criterion 8 (no underscore-led asset_model name used outside it) and REQ-PIPE-390 criterion 4 (no status ranking of its own)."
      - "THE SYSTEM SHALL run the gate once per `mothman check` whatever MOTHMAN_ASSET says (cli/check.py's _REPOSITORY_WIDE, line 190), under the label `imports`, reachable by `mothman check --only imports`, with a one-line 'What it covers' entry in the summary table, placed among the cheap gates before `schedule`."
      - "THE SYSTEM SHALL run the gate as its own step in .github/workflows/validate-config.yml beside the other configuration gates, in both legs of its per-asset matrix (post-build-review #321), as that workflow already runs every repository-wide gate (Q11 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL add to validate-config.yml's push `paths:` (lines 48-57) every directory the gate reads that the filter does not already name - at 72ec04d7 generator/**, synthetic_data_generator/**, pipeline/**, dashboard/**, cli/** and aws/** - and the gate's allowlist file, so that a push changing only one of them still runs the gate; asset_model/**, scenarios/** and bootstrap/** are added by the requirements that create them."
      - "THE SYSTEM SHALL mark every test of the gate `critical` (REQ-TEST-375), each needing no deployment, no browser and no database, so that push CI's critical set runs them (Q11 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL have tests, seen failing first, of each forbidden edge failing, of each allowed edge passing, of a function-level import caught, of a file in no side failing, of a provider loaded by path from the real pipeline failing, of a non-literal loader kind failing, of a stale allowlist entry failing, of an added entry failing with the base commit named, and of every top-level package the gate gives a side being named in validate-config.yml's paths filter, validate_caches.SCANNED, validate_collections.SCANNED, the coverage sources and replay_inputs.INPUTS (B6), so that a package given a side and left out of any of them fails."
    non_functional_requirements:
      - "PERFORMANCE: the gate reads syntax trees and imports nothing, and runs in under 5 seconds over the repository; run in both matrix legs it adds seconds, not minutes."
      - "MAINTAINABILITY: each allowlist entry names its requirement, so the list is a to-do list that can only get shorter; one walker serves this gate, the underscore-name rule, the status-ranking rule and validate_caches."
      - "OBSERVABILITY: a finding is `path:line:`, which editors make clickable and ruff - the first gate in the same command - already prints."
      - "COST: no database and no bootstrap; its critical tests run in the critical job's existing five-minute budget (REQ-TEST-375), and validate-config.yml bills seconds per leg."
      - "SCALABILITY: a thirtieth collection's adapter and provider are sorted by folder, so the gate needs no change for a new collection or a new asset."
      - "COMPATIBILITY: the gate reads committed files only, so it runs on a government network with no package index or GitHub access."
    dependencies:
      - "REQ-PIPE-342"
      - "REQ-PIPE-369"
      - "REQ-GEN-370"
      - "REQ-TEST-375"
      - "REQ-TEST-393"
    decisions:
      - "THE GATE COMES FIRST, AFTER THE HARNESS GOES (delivery-scoper; v6 order): landing it with today's findings allowlisted makes it the measure each later requirement shrinks. REQ-TEST-393 lands just before it, so the allowlist never carries the deleted harness's edges."
      - "BOTH DIRECTIONS IN ONE GATE (the brief, 2026-11-02): the pipeline never imports the generator today, but nothing holds that true; the generator imports the pipeline in 97 statements."
      - "SYNTAX TREE, NOT IMPORTING (delivery-scoper): importing every module to watch sys.modules would need pandas, a database and an asset. REJECTED a runtime import hook as the gate (REQ-PIPE-385's import-blocking test is the runtime check)."
      - "ONE WALKER (architect, non-blocking): three syntax-tree readers were proposed (this gate, REQ-PIPE-376 c8, REQ-PIPE-390 c4) beside validate_caches' own; one walker with three rules replaces them."
      - "A NAMED SUBCOMMAND (architect, non-blocking): validate-config.yml runs individual commands rather than `mothman check`, so the gate needs one of its own; `mothman dashboard validate-*` is where the configuration validators already live."
      - "NO FILE IN NO SIDE (architect, non-blocking). aws/ IS THE REAL PIPELINE'S, docs/ IS EXEMPT (delivery-scoper, v6, from the tree; Keith may change it): aws/lambda_handlers import qa_tools.common.s3_arrival and are a real deployment's ingestion, and aws/cdk imports nothing of ours; docs/quarantine_sex_column.py is an illustration beside a design note, like scripts/dev/."
      - "tests/ AND scripts/ ARE EXEMPT (delivery-scoper): a test of the bootstrap imports the pipeline and the bootstrap together by design; scripts/dev/ holds throwaway dev-only tools that ship with nothing."
      - "PROVIDERS ARE ON THE GENERATOR SIDE (delivery-scoper, v3 and v4): a provider importing generator/ or synthetic_data_generator/ is inside one side and allowed."
      - "LOADS BY PATH ARE EDGES TOO (delivery-scoper, v4): assets.load runs adapter and provider files with no import statement. Today the two calls are literal and on the right sides (qa_tools/collections line 273, generator/collections line 45). REJECTED leaving it to REQ-PIPE-385's runtime test alone."
      - "dashboard/, pipeline/ AND qa_tools/ ARE ONE SIDE (the split overview, 2026-11-02): qa_tools/ imports pipeline/ and dashboard/ in three places, and nothing in #134 asks to separate them."
      - "ON A PUSH, IN validate-config.yml WITH ITS TESTS critical (Q11 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): REJECTED (b) the local gate only, and (c) the critical tests only."
      - "BOTH MATRIX LEGS, NOT ONE (delivery-scoper, v5, Keith may change it): validate-config.yml's own comment runs every repository-wide gate in both legs because each costs seconds."
      - "ONE TEST KEEPS EVERY LIST HONEST (delivery-scoper, v6, answering the architect's B6): five lists must each name a moved package - the paths filter, two SCANNED tuples, the coverage sources, the cache inputs - and each would otherwise fail silently, a false green. Each requirement that creates a package adds it (REQ-PIPE-380, REQ-GEN-381, REQ-GEN-386 criteria), and criterion 14's last test fails the one it forgets."
      - "NO FAULT-RATE GATE (Q11 of 2026-11-14 with Q5, SETTLED by Keith 2026-11-14): REQ-GEN-392 derives the rates."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-385
    title: "An asset with no synthetic/ folder runs, publishes and passes every mothman check gate that applies with neither the generator, scenarios/ nor the bootstrap importable; the synthetic commands, flags, menu entries, check gates and page features are absent or refused by name; and mothman pipeline run never generates"
    date_written: "2026-11-02"
    story: "As whoever would take this to a real deployment, I want to leave the generator and the bootstrap out entirely and meet nothing that mentions them, so that what runs on real supplies is only the pipeline and its configuration, and its first-time user is never offered something that cannot work."
    moscow: must
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31); extends REQ-GEN-370 criterion 8 from configuration to code. Scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14; v6 2026-11-14 with CLI A-D, Dash C-D, the CLI and dashboard reviews' surface lists and the architect's B5. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "WHERE the generator, synthetic_data_generator, scenarios/ and the bootstrap package cannot be imported and the selected asset has no synthetic/ folder, THE SYSTEM SHALL stage, check, gate, promote, re-check and record that asset's real supplies, build and publish its dashboard, and pass every `mothman check --no-pytest` gate that applies, criterion 8's three reporting as not applicable (B5)."
      - "THE SYSTEM SHALL keep one `mothman` entry point, and SHALL list a synthetic command in `mothman --help`, its group's help and the terminal's menus only WHERE the components it needs are present AND the selected asset has a synthetic/ folder (Q3, SETTLED by Keith 2026-11-02); at the build commit the synthetic commands are `mothman <short> generate-synthetic-data`, `mothman pipeline bootstrap`, `resume`, `checkpoint` and `cache-key`, `mothman scenarios`, `mothman population` and `mothman env reset-synthetic`."
      - "THE SYSTEM SHALL decide whether a component is present with importlib.util.find_spec, never by importing it, and criterion 14's blocker SHALL act at the same step, so that what the CLI detects and what the test blocks agree (B5)."
      - "WHEN `mothman pipeline run` runs, on any asset, THE SYSTEM SHALL generate nothing, process what has arrived and build the dashboard, compare no targets and confirm no correction (cli/pipeline.py's generate_synthetic_data calls, lines 35-61, targets_agree and _confirm_corrections, lines 135 and 146, go), and its help and `mothman pipeline --help` SHALL say nothing of synthetic data, manifests, regeneration or targets (CLI A, SETTLED by Keith 2026-11-14)."
      - "WHERE criterion 2 leaves the synthetic commands out, THE SYSTEM SHALL offer in the main menu neither 'Generate synthetic data' nor 'Set up this environment', and its flag hint (cli/app.py lines 86-91) SHALL name neither command."
      - "IF a synthetic command is invoked by name where criterion 2 leaves it out, at whatever level it sits (`mothman pipeline bootstrap`, `mothman <short> generate-synthetic-data` and `mothman env reset-synthetic` included), THEN THE SYSTEM SHALL exit 1 as a refusal, in one sentence of the form '`mothman pipeline bootstrap` generates synthetic data, and asset <asset> has no synthetic/ folder (assets/<asset>/synthetic/) - this deployment processes real supplies only.', or naming the missing component, never an ImportError or 'No such command' (REQ-GEN-370 criterion 8's refusal by name, kept)."
      - "WHERE criterion 2 leaves the synthetic commands out, THE SYSTEM SHALL NOT offer the QA wizard's 'Synthetic - pick or generate a run' source (cli/one_table.py line 30, cli/many_tables.py line 31), SHALL NOT list --run-id or --reference-run-id in `<short> qa --help` or the qa usage line (cli/collection_cli.py lines 422-423), and SHALL refuse either flag by name as criterion 6 does (CLI B, SETTLED by Keith 2026-11-14)."
      - "WHERE the selected asset has no synthetic/ folder, `mothman check` SHALL show the providers, scenarios and scenario map gates (cli/check.py lines 87, 139 and 144) each as one row reading 'not applicable (no synthetic/ folder)', and its closing line and paste-into-commit line SHALL say 'every gate that applies passed', naming the three (CLI C, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL delete `mothman scenarios bands` (cli/scenarios.py lines 142-168) with the helpers only it uses (_say, _short, _band_text, _bounds_text, lines 205-235) and its tests (tests/test_check_bands.py's TestTheCommand and TestTheListing, tests/test_status_words_shown.py lines 200-210), keep check_bands for the generator and REQ-GEN-392, and remove REQ-GEN-183's claims naming the command in the same change (CLI D, SETTLED by Keith 2026-11-14; the register edit's wording approved by Keith 2026-11-14)."
      - "IF the asset has no scenario map (SCENARIOS-<asset>.md, REQ-PIPE-352 criterion 3), THEN the dashboard build SHALL embed an empty SCENARIO_MAP rather than fail, reading it through scenario_map.read_map_data in the real pipeline, outside the generator, scenarios/ and the bootstrap package (B3)."
      - "WHILE the embedded scenario map is empty, THE SYSTEM SHALL show no scenario control, tab, link, count, jump bar or label anywhere on the page (SETTLED by Keith 2026-11-02): the header button #scenarios-btn (template line 1094) SHALL carry the hidden attribute, its listener (line 12228) SHALL not throw, and the raw template's 'No scenario map embedded' empty state (renderScenariosPanel's empty branch, lines 12185-12190) SHALL be removed rather than left unreachable."
      - "WHERE the asset does not declare `synthetic: true`, read through REQ-PIPE-382's one reader and embedded with the build, THE SYSTEM SHALL drop the footer's 'against generated synthetic supplies' (template line 1121) and read 'against each agency's supplies' in its place; the Demo tab stays as it is, labelled as a recording (Dash C, SETTLED by Keith 2026-11-14)."
      - "WHILE the embedded scenario map is empty, a cold load of /scenarios SHALL render the dashboard's plain not-found page (renderNotFound, template line 8784) naming the address's word back to the reader, with the document title and the route announcement reading as not found and never as 'Scenarios' (Dash D, SETTLED by Keith 2026-11-14); ?panel=scenarios and ?scenario= SHALL behave as open question 1 settles."
      - "THE SYSTEM SHALL have a test, seen failing first, that in a subprocess where importing the generator, synthetic_data_generator, scenarios/ or the bootstrap package fails at find_spec, runs a fixture asset with no synthetic/ folder through `mothman pipeline run`, `mothman dashboard rebuild` and `mothman check --no-pytest`, shows `mothman --help`, `mothman pipeline --help` and `mothman <short> --help` exiting 0 and listing no synthetic command, and shows bare `mothman` without a terminal giving its existing flag-hint refusal (NotInteractive), never an ImportError (Q8 of 2026-11-02, SETTLED by Keith 2026-11-02)."
      - "THE SYSTEM SHALL have a real-browser test, seen failing first, that builds the dashboard for a fixture asset with no synthetic/ folder and finds no scenario control, tab, link, count, jump bar or label in the header, the drill-down pages (exec, agency, collection, period, dataset, column, check) or their accessible names, no synthetic wording in the footer, and that a cold load of /scenarios, ?panel=scenarios and ?scenario=<any id> each lands as criterion 13 and open question 1 settle; authored text in the Requirements, Plans, Feedback and Release notes tabs is excluded; and that the same page built with a non-empty map shows the button, the tab and a working jump."
    non_functional_requirements:
      - "PRIVACY AT REAL SCALE: a real deployment can show that no code able to invent a record's time or play a scripted person is present."
      - "PORTABILITY: works from a plain checkout through `uv run`, with no extra install step to leave a component out."
      - "RELIABILITY: a missing component is a named refusal with exit 1, never a traceback; a gate that did not run is never shown as passed (cli/check.py's own rule)."
      - "PERFORMANCE: `mothman --help`'s wall-clock time is measured before and after on the same sandbox and stays within 5 percent; deciding what is listed imports nothing (criterion 3), keeping it under the 400ms Doherty threshold it meets today."
      - "COST: criterion 14's test and REQ-PIPE-379 criterion 5's share one fixture asset (copied dbt packages, no network) and the test database, not a bootstrap; a real four-tool run takes tens of seconds, so neither is marked critical."
      - "FIRST-TIME USE: on a real deployment the first `mothman`, its menu and the most-used flow's first question offer only what can run (Hick's Law; the CLI review's first-time-use context)."
    dependencies:
      - "REQ-GEN-370"
      - "REQ-GEN-381"
      - "REQ-PIPE-382"
      - "REQ-PIPE-383"
      - "REQ-GEN-386"
      - "REQ-TEST-384"
      - "REQ-GEN-183"
    decisions:
      - "ONE mothman, SYNTHETIC COMMANDS PRESENT ONLY WHERE THEY CAN RUN (Q3, SETTLED by Keith 2026-11-02): REJECTED a second entry point, and REJECTED listing them always and refusing at run time."
      - "pipeline run NEVER GENERATES, ON ANY ASSET (CLI A, SETTLED by Keith 2026-11-14): one meaning per command name - it processes what has arrived, then builds; generation is generate-synthetic-data and the bootstrap. REJECTED generating on synthetic assets only (the command would mean two things, and its target comparison could fail on a target that needs a scripted decision), and making it synthetic-only (a real asset's first run is `pipeline run`, REQ-GEN-381 criterion 2)."
      - "THE WIZARD'S SYNTHETIC SOURCE AND FLAGS FOLLOW Q3 FULLY (CLI B, SETTLED by Keith 2026-11-14): REJECTED hiding the choice but keeping the flags, and leaving both with a run-time refusal."
      - "NOT-APPLICABLE ROWS (CLI C, SETTLED by Keith 2026-11-14): REJECTED leaving them out of the table (it makes 'did that gate run?' unanswerable) and showing them as passed (a false green)."
      - "scenarios bands IS DELETED (CLI D, SETTLED by Keith 2026-11-14, after asking why a human would run it): it was REQ-GEN-183's debug print of check_bands, rarely run, and REQ-GEN-392's refusal names an empty band anyway. REJECTED keeping it synthetic-only, and moving it to `debug`."
      - "THE pytest GATE ON A REAL DEPLOYMENT (delivery-scoper, v6, answering the architect's B5): the suite tests the whole codebase, synthetic side included, so it imports the generator; criteria 1 and 14 run `mothman check --no-pytest`, and the suite runs where the whole codebase is, as today."
      - "find_spec, NOT IMPORT (architect B5): a real import at start-up would break the help-time NFR, and a find_spec check under a blocker that only fails at import would list commands the test then cannot run; so detection and blocking act at the same step."
      - "cli/app.py IMPORTS cli.scenarios AT MODULE LEVEL (CLI review finding 6, lines 44-45): it imports scenario_map and scenarios, which move out, so `mothman --help` itself would fail on a real deployment; criterion 14 tests the first thing anyone runs, which is why --help and bare mothman are in it."
      - "THE PAGE'S SCENARIO SURFACES, NAMED (dashboard review finding 3): the header button (static HTML whose unguarded listener would throw if deleted), the /scenarios route (stateToPath/pathToState lines 5933 and 5952, COLLECTION_TIERS line 7383), ?panel=scenarios (lines 7157 and 13192), ?scenario= (SCENARIO_ON_LOAD, line 13197, whose not-found line names 'a test scenario'), and the jump bar and subject mark, already unreachable with an empty map. The browser test excludes authored text in the Requirements, Plans, Feedback and Release notes tabs, which legitimately mention scenarios - v5's 'no scenario label in the page's text' could not pass on an honest build."
      - "A PLAIN NOT-FOUND PAGE AT /scenarios (Dash D, SETTLED by Keith 2026-11-14): REJECTED the overview with one neutral line (recommended), and a silent drop."
      - "FOOTER ONLY (Dash C, SETTLED by Keith 2026-11-14): REJECTED gating the Demo tab too, and deferring. The replacement wording is the scoper's proposal; Keith may change it at sign-off."
      - "AN IMPORT-BLOCKING TEST ONLY (Q8 of 2026-11-02, SETTLED by Keith 2026-11-02): REJECTED a recorded run in a copy of the tree with the packages deleted."
      - "THE GATE IS NOT ENOUGH ON ITS OWN (delivery-scoper): an import gate catches what is written, but not a command that would crash at run time without a package. Criterion 14 runs it."
      - "scenarios/ IS PART OF WHAT A REAL DEPLOYMENT LEAVES OUT (SPLIT D1, SETTLED by Keith 2026-11-03)."
      - "EXIT 1, NOT 2 (CLI review finding 11): a refusal is a ClickException like every other by design; 2 is Click's usage error."
    open_questions:
      - "1 (NEW in v6, asked for by Dash D). HOW ?panel=scenarios AND ?scenario= BEHAVE ON A REAL ASSET. Keith settled a plain not-found page for /scenarios. ?panel=scenarios is an older link to the same tab (REQ-DASH-139); ?scenario=<id> is a jump carried on ANY page's address, whose page underneath is usually real. Options: (a) ?panel=scenarios lands on the same not-found page as /scenarios (address rewritten to /scenarios with replaceState, so Back still works); ?scenario= is dropped silently with replaceState and the page underneath renders as normal, with no line about scenarios; (b) both land on the not-found page - a reader with a working link to a real dataset page plus a stale ?scenario= would lose the page they could have used; (c) both dropped silently, ?panel=scenarios then opening the overview - which treats one old link to the missing page two ways. RECOMMENDED (a): each link lands where its own address points - the missing page reads as missing, a real page with one stale parameter reads as that real page - and nothing anywhere names scenarios except the not-found page's echo of the address, which is what Keith chose."
    signed_off: null

  - id: REQ-GEN-386
    title: "The generator side - generator/, synthetic_data_generator/ and each asset's providers - imports from outside itself only asset_model/ and scenarios/, which holds the register parser, the placements reader, the map vocabulary and the scripted_decisions.yaml reader; the generator keeps the map writer and offers the bootstrap and cli/ one public module"
    date_written: "2026-11-02"
    story: "As whoever maintains the generator, I want it to depend only on the shared reading code and the shared scenario readers, so that it can change, or be left out, without touching the pipeline or the bootstrap."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #134 (2026-10-31; 'the generator's imports narrowed to the shared domain model'); scoping asked 2026-11-02. Drafted by delivery-scoper 2026-11-02 (v1-v3); v4 2026-11-03; v5 2026-11-14; v6 2026-11-14 with B3 (all four scenario readers into scenarios/), QB and the delivery writer found in the code. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL let the generator side - generator/, synthetic_data_generator/ and each asset's synthetic/collections/ providers - import from outside itself only asset_model/, scenarios/ (criterion 4), the standard library and declared third-party dependencies (Q1, SETTLED by Keith 2026-11-02); inside the side, a provider may import generator/ and synthetic_data_generator/, and synthetic_data_generator/ may import generator/."
      - "THE SYSTEM SHALL remove every import of the real pipeline from the generator side - 97 statements in 13 files at 72ec04d7 - each function it calls having moved into asset_model/ (REQ-PIPE-380 criteria 1 and 2) or scenarios/ (criterion 4), and SHALL record where each module the generator imported went in this requirement's decisions when built."
      - "THE SYSTEM SHALL give the generator one public module, used by the bootstrap and cli/, offering what cli/pipeline.py's generate_collection, has_target_trial, target_datasets, generated_collections, generated_targets, generated_gate_outcomes and generated_into (lines 301-410) offer the bootstrap today; the bootstrap SHALL import nothing else of the generator and nothing of cli/."
      - "THE SYSTEM SHALL hold in one small shared package, scenarios/ at the top level (Q4 and its name, SETTLED by Keith 2026-11-02), the TS register parser (today's qa_tools/common/scenarios.py, 178 lines, parse_register and the Scenario it returns), the placements reader (scenario_map's Placement, read_placements, PLACEMENTS_FILE and placements_path), the map vocabulary (SUBJECTS, AS_AT_PANEL, VERDICT_LINE, SUBSTITUTION_DRILL_DOWN, STANDING_IN_PILL, SUPPLY_HISTORY_ROW and PERIOD_COMPOSITION, scenario_map.py lines 88-95) and the reader of each asset's scripted_decisions.yaml (load, PERIOD, CHAIN_MARK, CHAIN_OPERATIONS and the due-instant helpers _due_at and _wall_clock_after, made public); the generator and the bootstrap may import it, it imports only asset_model/, and nothing in the real pipeline imports it (B3, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL keep the scenario map's writer (build_map, build_for_selected, write_map and the formatting they use) in the generator, importing the register parser from scenarios/ and status_words from asset_model/ (REQ-PIPE-390), and SHALL keep in the real pipeline only read_map_data and map_path, which the dashboard build reads (REQ-PIPE-385 criterion 10)."
      - "IF the generator side imports the bootstrap package, THEN `mothman check` SHALL fail (REQ-TEST-384); today's 8 statements that would (scripted_decisions in scenario_injection.py and linkage_products.py, scenario_map in scenario_injection.py and targets.py, correction_replay in correction_claims.py) SHALL go - the first two to scenarios/, the last to asset_model's declared-corrections readers (REQ-PIPE-380 criterion 2)."
      - "THE SYSTEM SHALL keep the generator-only delivery functions (delivery.remove_deliveries, existing_delivery_names and the bookkeeping file's names, bookkeeping_path and BOOKKEEPING_FILE) in the generator, and SHALL write a delivery through the one writer REQ-PIPE-380's open question 1 settles."
      - "THE SYSTEM SHALL use no underscore-led name of a module outside the generator side: at 72ec04d7 correction_apply._declared, linked_datasets._asset_folder, _walk and _columns, scripted_decisions._due_at and _wall_clock_after, and schedule._agreement each become a public name where they land (REQ-PIPE-376)."
      - "WHEN scenarios/ lands, THE SYSTEM SHALL add it in the same change to validate_caches.SCANNED, validate_collections.SCANNED, the coverage sources (pyproject.toml line 175, cli/check.py line 302, test.yml lines 304 and 589), replay_inputs.INPUTS and validate-config.yml's push paths (B6), and name it in CLAUDE.md's layout table, README's layout tour and docs/components.md."
    non_functional_requirements:
      - "PERFORMANCE: providers stay importable without pandas or numpy (REQ-GEN-246 criterion 7), so the providers gate's time is unchanged."
      - "MAINTAINABILITY: a generator that predicts what the pipeline will do (target trials, correction claims, drift planning, arrival recognition) through the pipeline's own code stays in step with it; one that takes data instead can drift - which is why Q1 settled on moving the functions rather than passing data."
      - "PRIVACY AT REAL SCALE: scenarios/ holds only readers of committed synthetic configuration and is left out of a real deployment with the generator (REQ-PIPE-385)."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-390"
      - "REQ-TEST-384"
      - "REQ-GEN-370"
      - "REQ-GEN-246"
      - "REQ-QAC-389"
    decisions:
      - "NARROWED TO THE SHARED READING CODE (Keith, 2026-10-31, #134's code half). REJECTED (b) and (c) of #134 as in REQ-PIPE-380."
      - "ALL FOUR SCENARIO READERS INTO scenarios/ (B3, SETTLED by Keith 2026-11-14): the architect found v5's split contradicting itself - the map writer moved to the generator imports parse_register, which v5 sent to bootstrap/ (an edge the gate forbids), and status_words from the pipeline; the placements reader had no home; and the vocabulary sits in scenario_map.py, not scripted_decisions. Now the register parser, the placements reader, the vocabulary and the scripted_decisions.yaml reader are in scenarios/, the generator keeps the writer, status_words moves with the status order (REQ-PIPE-390) and the dashboard keeps only read_map_data. SUPERSEDES the split overview's 'the TS register's parser goes to bootstrap/'. REJECTED the writer moving to the bootstrap."
      - "ONE ENTRY POINT, NOT A SUBPROCESS (delivery-scoper): REJECTED having the bootstrap run the generator only as a `mothman` subprocess, which would lose the in-process resume comparison (REQ-TEST-160) for no gain the gate does not already give."
      - "A SHARED SYNTHETIC-CONFIG PACKAGE (Q4, SETTLED by Keith 2026-11-02): REJECTED the generator owning the readers (the bootstrap would then import the generator beyond its entry point), and REJECTED the bootstrap owning them (the generator would import the bootstrap)."
      - "SHARED READING CODE ONLY (Q1, SETTLED by Keith 2026-11-02): REJECTED a permanent list of allowed pipeline modules, and REJECTED taking everything as data."
      - "THE DRIFT PLANNING GOES THROUGH asset_model/ (Q1 of 2026-11-14, SETTLED by Keith 2026-11-14). REJECTED a generator-side PSI copy and a permanent allowlist entry."
      - "ARRIVAL RECOGNITION GOES THROUGH asset_model/ (QB, SETTLED by Keith 2026-11-14): generator/driver.py line 273 checks placements with arrivals.arrivals_for, which reads the delivery tree; it is asset_model's under the widened charter, so the driver keeps writing placements with run ids."
      - "THE DELIVERY WRITER IS NOT THE GENERATOR'S ALONE (delivery-scoper, v6, from the code): v5's criterion 7 moved write_delivery to the generator, but the real pipeline's hand filing calls it too (hand_filing.py line 275). Only the removers and the bookkeeping file are generator-only; where the one writer goes is REQ-PIPE-380's open question 1."
      - "THE SHARED PACKAGE IS NAMED scenarios/, AT THE TOP LEVEL (SETTLED by Keith 2026-11-02): REJECTED synthetic_config/. Imports are absolute, so the module names inside it do not clash with cli/scenarios.py."
      - "THE RULE IS ABOUT THE SIDE'S BOUNDARY, NOT EACH FILE (delivery-scoper, v4): REJECTED moving the helpers providers use into asset_model/, which would put synthetic machinery into code a real deployment ships, and REJECTED a narrow provider-facing generator API for now."
      - "THE ENTRY POINT OFFERS SEVEN THINGS, NOT TWO (delivery-scoper, v4)."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's criterion 9 ('no byte any collection generates changes') and the BEHAVIOUR-PRESERVING NFR are gone; the suite is the proof."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-376
    title: "The shared reading code's names say what they mean as it moves into asset_model/: the two claim_window and two _calendar_periods functions renamed apart, every name used outside its module public, fall_hold with its one caller, two dead functions removed with their register claims, and a table two datasets share refused"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want each function in the shared schedule code to have one name that says what it does and to be public if anything else calls it, so that a reader does not mistake one claim window for another or rely on a private name that may change without warning."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #137 group B (2026-11-02, 'renames ride the #134 move'). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14; v6 2026-11-14, the underscore-name test made a rule of REQ-TEST-384's gate (architect) and the compare removed (QD). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "WHEN schedule.py and slots.py move into asset_model/ (REQ-PIPE-380), THE SYSTEM SHALL rename slots.claim_window (line 234, the widest window a dataset has ever had) to slots.widest_claim_window, keeping schedule.claim_window (line 757, the window in force on a date) as it is, and rewrite every caller in the same change."
      - "WHEN they move, THE SYSTEM SHALL rename slots._calendar_periods (line 366, a dataset's period sequence, 18 uses outside slots.py) to the public slots.period_sequence, and schedule._calendar_periods (line 569, an authored calendar's periods, one caller) to schedule._authored_periods."
      - "THE SYSTEM SHALL give a public name to every asset_model function, class or constant used outside its own module - at 72ec04d7 schedule._agreement (29 uses outside schedule.py), slots._calendar_periods (18), slots._participation_for (4), hierarchy._require (4), schedule._as_date (3), slots._timing, schedule._parse_version, schedule._load, schedule._files_go_to_period_errors, hierarchy._from_text, and those REQ-PIPE-380's closure brings in (among them agreement_freeze._corrections_by_owner and _owner_label, correction_apply._declared, linked_datasets._asset_folder, _walk and _columns) - and no module outside asset_model/ or tests/ SHALL use an underscore-led asset_model name. schedule._version_in_force (3 uses) is removed by REQ-PIPE-378 criterion 1 rather than renamed; whichever lands first, it is not left private and used."
      - "THE SYSTEM SHALL move slots.fall_hold (line 477) into asset_model's assignment module beside assign, its one caller (assignment.py line 232)."
      - "THE SYSTEM SHALL remove schedule.schema_name (line 626), an unused copy of period_schema.period_schema, and repoint REQ-PIPE-051's implemented_by entry 'qa_tools/common/schedule.py::schema_name' at period_schema.period_schema in the same change."
      - "THE SYSTEM SHALL remove schedule.will_graduate (line 444), which nothing calls, and remove REQ-PIPE-106's implemented_by entry 'qa_tools/common/schedule.py::will_graduate' in the same change."
      - "IF two datasets in one asset's hierarchy name the same table, THEN THE SYSTEM SHALL refuse the hierarchy, naming both datasets and the table, rather than keep the first (hierarchy._build's by_table.setdefault, line 174), so that dataset_for_table is the inverse its docstring claims."
      - "THE SYSTEM SHALL have a test, seen failing first, of the duplicate-table refusal, and SHALL carry the underscore-name rule of criterion 3 as a rule of REQ-TEST-384's imports gate, failing WHERE a module outside asset_model/ and tests/ reads an underscore-led asset_model name, with a test of its own."
    non_functional_requirements:
      - "MAINTAINABILITY: a public name is a promise the shared code keeps; a private one used in 29 places is a promise nobody knows was made."
      - "AUDITABILITY: the two implemented_by edits are register claim changes, so they are named here for Keith to sign rather than made in passing."
      - "PERFORMANCE: names only; nothing runs differently."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-TEST-384"
      - "REQ-PIPE-051"
      - "REQ-PIPE-106"
      - "REQ-PIPE-378"
    decisions:
      - "RENAMES RIDE THE #134 MOVE (#137 group B, Keith 2026-11-02): every importer is rewritten once, when its module changes address, rather than twice."
      - "THE NEW NAMES ARE THE SCOPER'S PROPOSAL (delivery-scoper, 2026-11-03): widest_claim_window, period_sequence and _authored_periods say what each returns. Keith may change any of them at sign-off; the criterion is that the two pairs stop sharing names."
      - "schedule.claim_window KEEPS ITS NAME (delivery-scoper): it is the one most callers mean, so renaming the rarer one moves fewer lines."
      - "DEAD CODE GOES WITH ITS CLAIMS (#137 group B, Keith's to sign): both verified to have no product callers on 2026-11-02 and 2026-11-03."
      - "THE DUPLICATE-TABLE SIGHTING IS CONFIRMED (delivery-scoper, 2026-11-03): no configuration has one today, so refusing it changes no current behaviour."
      - "_version_in_force IS REMOVED, NOT RENAMED (delivery-scoper, v5): Q6 of 2026-11-14 ends its fallback, which is all it adds to Calendar.version_in_force."
      - "THE UNDERSCORE RULE IS A RULE OF THE IMPORTS GATE (architect, non-blocking, 2026-11-14): one syntax-tree walker, not a second scanner. It reads source for an architecture rule with no behaviour to observe, which CLAUDE.md's test rule allows when said."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's criterion 9 and BEHAVIOUR-PRESERVING NFR are gone."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-377
    title: "Each schedule rule written more than once is written once in asset_model/: a round to the period its files fill, which participation version gives a slot its inputs, and whether a dataset supplies in a round"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want each schedule rule answered by one function, so that the dashboard, the pipeline and the generator cannot quietly disagree about which period a supply fills or whether it was owed."
    moscow: should
    status: not_started
    source: "Keith, plans/running-thoughts.md #137 group C (2026-11-02, 'REAL DUPLICATION (scope with Keith)'). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14; v6 2026-11-14, the compare removed (QD). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
