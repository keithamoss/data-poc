  - id: REQ-GEN-392
    title: "The older providers' fault rates in generator/dirty.py are derived at generation time from the warn and fail bands of the checks they aim at, read through check_bands as Linkage Products reads them, planted as exact counts, and the history they shape is regenerated"
    date_written: "2026-11-03"
    story: "As whoever maintains the generator, I want each fault rate that is sized to a check's band to be computed from that band as the check file states it, so that a band changed in a check file moves the planted fault with it and a Warn or Fail supply lands where it was meant to without a second edit."
    moscow: could
    status: not_started
    source: "Keith, the split overview's decision 4 (SPLIT D4, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14 with Q5; v6 2026-11-14 with 392 Q1-Q3 and QC (SETTLED), the evidence lists removed (QD), and the reviews' release note and lasting-cost points. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL declare, for every fault in generator/dirty.py's presets (apply_birth_registrations_presets and the six apply_cp_*_presets, wherever they sit when this is built), which rule or rules it aims at, by check_bands' rule key, in one table per preset as GEO_FAULT_AIMS does for geocoding faults; the band each rate aims at SHALL no longer be written only in a comment."
      - "WHEN a provider's preset dirties a frame, THE SYSTEM SHALL compute each band-sized fault's size from its aimed rules' warn and fail bands, read through check_bands' catalogue at the frame's own row count, each tool's unit and operator honoured as check_bands' amber intersection already does (Q5 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "WHERE a fault aims at Warn, THE SYSTEM SHALL size it at the middle of the aimed rules' amber intersection at the frame's row count, in rows, rounded down - targeting._target's rule (392 Q1, SETTLED by Keith 2026-11-14)."
      - "WHERE a fault aims at Fail, THE SYSTEM SHALL size it at the lowest failing count plus the width of the rule's amber band (392 Q2, SETTLED by Keith 2026-11-14)."
      - "WHERE an aimed rule is single-tier (any violation fails, no amber band), THE SYSTEM SHALL plant nothing on it for a Warn preset, as REQ-GEN-184 already does, and a fixed 5 rows for a Fail preset, the 5 declared once beside the derivation (392 Q3 (i), SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL plant exactly the derived count of faulty rows, as targeting's _set_nulls does, never a per-row probability, each injector keeping its own seed (392 Q3 (ii), SETTLED by Keith 2026-11-14)."
      - "IF no size lands a fault on the verdict asked on every rule it aims at - an empty band intersection, or a band the frame's row count cannot reach - THEN THE SYSTEM SHALL refuse to generate, naming the preset, the fault, the rules and the bands, rather than plant a size that lands elsewhere."
      - "THE SYSTEM SHALL keep as literals only the preset parameters that are not sized to a check's band - the stale-delivery coin flip (inject_stale_delivery's whole-run rate) among them - each named in this requirement's decisions when built with why it is not band-sized."
      - "WHEN `mothman population --dirty` dirties a frame, THE SYSTEM SHALL plant its faults at literal rates held in synthetic_data_generator/ as exploratory defaults - today's rates - reading no asset's bands (QC, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL keep the amber-by-construction paths of REQ-GEN-184 (targeting.bdm_amber and cp_amber) as they are; this requirement changes the presets they do not replace - every Fail supply, and a Child Protection Warn whose payload holds no cp_clients."
      - "WHEN this is built, THE SYSTEM SHALL regenerate Birth Registrations' and Child Protection's dirty supplies and bootstrap each asset from empty, and SHALL re-capture every committed artefact captured from the generated history that the regeneration moves - SCENARIOS-daily.md and SCENARIOS-quarterly.md (REQ-PIPE-352 criterion 3), tests/fixtures/arrival_semantics_golden.json if it moves, and every test or scenario expectation asserting a recorded count or verdict of a regenerated supply."
      - "IF a scenario or target that today lands on a named verdict (REQ-GEN-186's agreement check) no longer does after regeneration, THEN the build SHALL stop and report it to Keith rather than re-aim the scenario."
      - "THE SYSTEM SHALL ship, in the same push, a CHANGELOG.yaml entry telling a reader that Birth Registrations' and Child Protection's sample history was regenerated on purpose, why, and that some supplies' Pass, Warn and Fail moved with it (dashboard review finding 4)."
      - "THE SYSTEM SHALL have tests, seen failing first against today's literal rates, that a band changed in a check file moves the derived size of the fault aimed at it, that a Fail fault lands past every aimed rule's fail threshold at the frame's row count, that a Warn fault lands inside every aimed rule's amber band, that a single-tier rule gets nothing from a Warn preset and 5 rows from a Fail one, that the planted count is exact, and that an unreachable band is refused - each on a small frame, with no bootstrap."
      - "THE SYSTEM SHALL NOT add a `mothman check` gate holding literal rates to their bands: the rates are derived, so there is no literal to hold (Q11 of 2026-11-14 with Q5, SETTLED by Keith 2026-11-14)."
    non_functional_requirements:
      - "REPRODUCIBILITY: the derivation is seeded and deterministic - the same configuration and the same seed give the same bytes - so a later diff of generated output stays a real correctness check (CLAUDE.md: everything is seeded)."
      - "MAINTAINABILITY: a band edited in a check file moves the planted fault without a second edit; a fault with no declared aim fails at generation (criterion 7) rather than silently planting a stale size."
      - "MAINTAINABILITY, A LASTING COST (architect): from now on every band edit in a Birth Registrations or Child Protection check file regenerates part of the history and may break REQ-GEN-186's scenario agreement, which criterion 12 then stops for Keith; that is the price of Q5's 'derive', named so it is not a surprise later."
      - "COST: one bootstrap per asset from empty to regenerate (about an hour on this sandbox at the 2026-10-31 measure), and the next hand-started test.yml is a cache miss (about 145 billable minutes at the 2026-11-02 measure); push CI's critical set is unaffected."
      - "PERFORMANCE: the catalogue is read once per generation, not per frame; the bootstrap is no slower by more than 5 percent beyond the regeneration itself."
      - "SCALABILITY: at thirty collections the derivation needs one aims table per preset and nothing per asset; population output stays exploratory and recorded nowhere (criterion 9)."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-377"
      - "REQ-GEN-183"
      - "REQ-GEN-184"
      - "REQ-GEN-186"
      - "REQ-PIPE-352"
    decisions:
      - "dirty.py's RATES JOIN #134 (SPLIT D4, SETTLED by Keith 2026-11-03), read through check_bands, the reader Linkage Products uses."
      - "DERIVE THE RATES AT GENERATION TIME (Q5 of 2026-11-14, SETTLED by Keith 2026-11-14, option (b), NOT the recommendation). REJECTED (a) literal rates checked by a gate (the recommendation), and (c) both."
      - "WARN AT THE MIDDLE (392 Q1, SETTLED by Keith 2026-11-14): the most margin either side, and the rule targeting already uses. REJECTED the lower third and the upper third."
      - "FAIL AT THE FAIL LINE PLUS THE AMBER WIDTH (392 Q2, SETTLED by Keith 2026-11-14): scales with how wide the rule's tolerance is and lands near today's sizes (facility nulls at 1,900 rows: 965 rows, today about 1,045). REJECTED 1.5x and 2x the fail line."
      - "SINGLE-TIER RULES (392 Q3 (i), SETTLED by Keith 2026-11-14): a Warn preset plants nothing; a Fail plants a fixed 5 rows, told plainly it is a chosen number that only sets how many failing rows the page shows. Child Protection's Warn partial resupplies move from Fail to Warn. REJECTED planting in Warn presets, and 1 row."
      - "EXACT COUNTS (392 Q3 (ii), SETTLED by Keith 2026-11-14): 'aimed at the middle of the band' is then true of every file rather than on average; dirty.py gives each injector its own seed, so an exact count moves only the faulted rows (architect). REJECTED a per-row probability."
      - "POPULATION KEEPS ITS OWN LITERAL RATES (QC, SETTLED by Keith 2026-11-14): it runs with no asset selected and dirties both assets' tables in one process, and its output is recorded nowhere. REJECTED reading both assets' bands (a third exception to REQ-PIPE-342 criterion 8), and requiring one asset."
      - "AT THE FRAME'S OWN ROW COUNT (delivery-scoper, v5): today's rates are calibrated to a typical size, and dbt bands are absolute counts while Soda's are percentages; generation knows the frame's size, which the literal rates could not see."
      - "THE PRESETS STILL MATTER DESPITE REQ-GEN-184 (delivery-scoper, v5): what this changes is every Fail supply and Child Protection's Warn partial resupplies - not the whole history."
      - "CRITERION 12 IS KEPT, AND IT IS NOT ABOUT THE SYNTHETIC HISTORY (delivery-scoper, v6, under QD): a scenario is a designed demonstration of a dashboard feature, and REQ-GEN-186's agreement check already fails the bootstrap when a target misses; re-aiming one changes what the demo demonstrates, which is Keith's call. Everything else that moves is accepted without a list."
      - "NO MOVED-RECORD EVIDENCE (QD, Keith 2026-11-14, and the morning report's 'I don't care about reviewing the list of moved verdicts'): v5's criterion 6 (every moved supply, verdict, filing and decision in evidence) and criterion 7's accounting are gone, and with them the dashboard review's supply-history chain list and the CLI review's terminal-count list. The re-capture stays, because the suite cannot pass without it."
      - "THE DEMO RECORDING IS NOT RE-CAPTURED (delivery-scoper, v6, answering the CLI review's finding 10): dashboard/demos/qa_wizard.cast is a dated recording of the tool being driven, and no test compares it to the history; it stays honest as a recording of its day."
      - "THE ANCHOR DATE IS NOT THIS REQUIREMENT'S (delivery-scoper, v5; architect): ANCHOR_DATE stays 2026-09-25 until plans/running-thoughts.md #138's rolling anchor is built, and R1's fixed test anchor (SETTLED by Keith 2026-11-14) should equal it, so these pins are not re-captured a third time."
      - "LAST IN THE BUILD (architect): REQ-PIPE-377's report-to-Keith criterion lands first, so the history is regenerated once."
      - "NO FAULT-RATE GATE (Q11 of 2026-11-14, SETTLED by Keith 2026-11-14)."
    open_questions: []
    signed_off: null

  - id: REQ-TEST-393
    title: "The equivalence harness's code is deleted - the mothman debug equivalence commands, qa_tools/common/equivalence.py and the tests of the harness itself - while the four tests that compare two runs of today's code keep a smaller helper of their own in tests/"
    date_written: "2026-11-14"
    story: "As whoever maintains the pipeline, I want the before-and-after harness gone from the product code, so that nobody spends a 58-minute bootstrap proving the synthetic demo history did not move, while the tests that prove two real routes through today's code agree keep working."
    moscow: must
    status: not_started
    source: "Keith, 2026-11-14, answering the architect's QD: 'Just delete the equivalence thing, I told you I do not care.' Asked how far: delete it everywhere. REQ-TEST-239's retirement wording approved by Keith 2026-11-14 ('Yes, as worded'), applied separately; this requirement is the code half. The read-only command audit of 2026-11-14 (docs/drafts/command-audit-2026-11-14.md) supplied the callers. Drafted by delivery-scoper 2026-11-14 (v6). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL delete `mothman debug equivalence capture` and `mothman debug equivalence compare` (cli/debug.py lines 247-323, with the --renamed-by option REQ-PIPE-248 criterion 8 added) and qa_tools/common/equivalence.py (1,312 lines at 72ec04d7)."
      - "THE SYSTEM SHALL delete the tests whose only subject is the harness or a before-and-after capture: tests/test_equivalence.py, tests/test_equivalence_assets.py and tests/test_sample_keys_equivalence.py (REQ-PIPE-341 criterion 7's on-demand capture test), with conftest.py's --run-full-capture option and full_capture mark (lines 1225-1298) and tests/test_ci_on_demand.py's test_no_job_takes_full_captures (line 41), which exist only for it."
      - "THE SYSTEM SHALL keep tests/test_checkpoints.py (REQ-TEST-159, a resumed replay against a full one), tests/test_replay_clock.py (REQ-PIPE-081, a replay's records stamped with its own time), tests/test_bootstrap_equivalence.py (REQ-TEST-116 criterion 4, a parallel bootstrap against a sequential one) and tests/test_kept_routes_agree.py (REQ-PIPE-086 criterion 11, one delivery kept three ways), each passing and asserting what it asserts today, by moving the code they use from equivalence.py - snapshot, differences, summary and the *_COLUMNS constants - into tests/equiv_support.py, which already holds their redirection."
      - "THE SYSTEM SHALL leave no product module that only tests call: whatever equivalence.py held that the four tests need lives under tests/ (CLAUDE.md's test rule: test helpers live in tests/, never in product code)."
      - "THE SYSTEM SHALL remove test.yml's `fetch-depth: 0` (lines 212-216 and 348-352), which exists only for tests/test_equivalence.py, and run the affected jobs' tests in a depth-1 clone before the push to show nothing else needed the history; IF something else does, THEN the line stays with its comment rewritten to name what needs it."
      - "THE SYSTEM SHALL keep MOTHMAN_PINNED_NOW (tests/test_cli_cp.py lines 255 and 328 pin it) and rewrite the docstrings that justify it by the harness (qa_tools/common/asset_time.py lines 187-190, tests/test_pinned_now.py's module docstring) to say what it is for now."
      - "THE SYSTEM SHALL remove, in the same change, every requirements.yaml linked_tests and implemented_by entry naming a deleted file or function (at 72ec04d7 among them REQ-TEST-239's own, REQ-PIPE-248's tests/test_equivalence.py and equivalence.py::compare, and REQ-PIPE-341's test_sample_keys_equivalence.py), each listed for Keith as a built-requirement claim edit; evidence prose naming past captures stays as the record of its day."
      - "WHEN the harness goes, THE SYSTEM SHALL remove its mentions from README.md, CLAUDE.md and docs/ where they describe it as a tool to run."
    non_functional_requirements:
      - "MAINTAINABILITY: about 1,500 lines of product code and tests leave, and no gate, cache key or workflow keeps a reference to them (the imports gate, REQ-TEST-384, lands after this, so its allowlist never carries the harness's edges)."
      - "COST: the 58-minute captures are never taken again; full-depth checkouts in test.yml go with them (criterion 5)."
      - "RELIABILITY: the four kept tests still prove two runs of today's code agree - resume against full, parallel against sequential, three keep routes, replay stamps - which is real behaviour, not the synthetic history (criterion 3)."
      - "AUDITABILITY: every register claim the deletion makes untrue is named for Keith in the same change (criterion 7), and REQ-TEST-239's retirement reason records why."
    dependencies:
      - "REQ-TEST-239"
      - "REQ-TEST-116"
      - "REQ-TEST-159"
      - "REQ-PIPE-081"
      - "REQ-PIPE-086"
      - "REQ-PIPE-248"
      - "REQ-PIPE-341"
    decisions:
      - "DELETE THE EQUIVALENCE COMPARE EVERYWHERE (QD, Keith 2026-11-14, dictated): 'Just delete the equivalence thing, I told you I do not care. Synthetic [can] be removed. We have tests approved and we don't need to assure that [the] demo hasn't moved.' The same stance as plans/supply-model.md's 'I don't care. This is all just fake data'. REJECTED (the architect's QD options) a capture per build group, per requirement, or a first and a last."
      - "ITS OWN SMALL REQUIREMENT, FIRST IN THE BUILD (delivery-scoper, v6): Keith's rule is small, self-contained requirements, and this deletion touches CLI, product code, five test files, conftest and a workflow, none of it part of any other requirement's subject. It lands before the imports gate so the gate's first allowlist does not list edges about to vanish. It could fold into REQ-TEST-384 if Keith prefers one fewer id."
      - "FOUR TESTS STAY ON A SMALLER HELPER (delivery-scoper, v6, from the audit): they import equivalence.py's snapshot and diff code through tests/equiv_support.py, but what they compare is two runs of today's code in one test session, never a before and an after; each guards a signed criterion of its own (REQ-TEST-159, REQ-PIPE-081, REQ-TEST-116 criterion 4, REQ-PIPE-086 criterion 11). Deleting them would delete real coverage. REJECTED deleting them with the harness."
      - "test_sample_keys_equivalence.py GOES (delivery-scoper, v6): it is a before-and-after capture of REQ-PIPE-341, exactly what QD retires."
      - "REQ-PIPE-248 CRITERION 8 BECOMES UNTRUE (delivery-scoper, v6, from the register): it added --renamed-by to the compare; the option goes with the command. Retiring that criterion with REQ-TEST-239's reason is a built-requirement edit, so its wording goes to Keith (open question 1)."
      - "MOTHMAN_PINNED_NOW OUTLIVES ITS ORIGIN (delivery-scoper, v6): it began as REQ-TEST-239 criterion 16 but test_cli_cp.py uses it; REQ-PIPE-382 criterion 10 routes it through the one clock."
    open_questions:
      - "1 (NEW in v6). THE WORDING FOR REQ-PIPE-248 CRITERION 8. Options: (a) retire criterion 8 with REQ-TEST-239's approved reason ('Retired by Keith, 2026-11-14: the synthetic demo history may move whenever a change needs it, and the test suite is the proof that a refactor is sound...'), REQ-PIPE-248 otherwise unchanged; (b) amend it to say the option existed until 2026-11-14. RECOMMENDED (a): the same reason, already approved, for the same deletion; criterion 7's other claim edits (removing linked_tests and implemented_by entries for deleted files) need no wording of their own."
    signed_off: null

  - id: REQ-DASH-394
    title: "A processing step stopped by a schedule configuration error is recorded and shown on the 'needs a person' queue as our configuration problem, naming the file to fix, so the page never reads it as a supplier's late or missing supply"
    date_written: "2026-11-14"
    story: "As a data team leader glancing at the register, I want a supply that could not be processed because of our own schedule configuration to say so, so that I do not chase the supplier for a fault that is ours and will repeat on every run until someone fixes a file."
    moscow: should
    status: not_started
    source: "Keith, 2026-11-14, answering the dashboard UX review's question B on #134 v5: yes, a new blocking kind in the 'needs a person' queue, as its own small requirement rather than widening REQ-PIPE-378. Drafted by delivery-scoper 2026-11-14 (v6). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "WHEN a processing step stops on a ScheduleConfigError (REQ-PIPE-378 criterion 15: arrival recognition, the arrival-patterns check, promotion), THE SYSTEM SHALL record the stop in the qa schema - the step, the dataset or datasets and the supply it was working on, the asset's configuration file the error names, the error's own words and when - before the step's existing failure report."
      - "THE SYSTEM SHALL put on the 'needs a person' queue (qa_tools/common/outstanding.py) an item of a new kind, schedule-configuration-error, at needs-action and blocking each dataset it names, for every recorded stop not yet cleared."
      - "THE SYSTEM SHALL word the item as a fault on our side - 'a configuration problem on our side, not a problem with anyone's data', the framing agreementNotice already uses (template line 5199) - naming the file to fix and saying the step will stop the same way on every pass until it is fixed and `mothman schedule validate` passes; it SHALL NOT attribute the unprocessed supply to the supplier."
      - "WHEN a later pass runs the same step for the same dataset without the error, THE SYSTEM SHALL clear the item."
      - "WHERE one configuration error stops steps for several datasets, THE SYSTEM SHALL show the items as open question 1 settles."
      - "THE SYSTEM SHALL show the item through the queue's existing rendering on the dashboard and on every other reader of outstanding.py, with no banner of its own (REQ-DASH-070's one-queue rule)."
      - "WHEN this requirement is built, THE SYSTEM SHALL first have shown, by driving it before criteria 2-6 are built, what a supply whose step stopped shows today on the dataset page and the queue, recorded in this requirement's evidence; the dashboard review called 'shows as late or missing' likely, not verified."
      - "THE SYSTEM SHALL have tests, seen failing first, of a recorded stop producing the item with the file named, of the item cleared by a later clean pass, of NoCalendarAgreed producing no item (its answer is a deliberate 'nothing owed'), and a real-browser test that a dataset whose step stopped shows the item."
    non_functional_requirements:
      - "SCALABILITY: at thirty collections one broken calendar is not thirty unrelated alarms (criterion 5); the queue aggregates, as REQ-DASH-070 exists to make it."
      - "RELIABILITY: the stop is recorded before the step reports failure, so a crash after it still leaves the item; and it clears only on a clean pass, never by timing out."
      - "PRIVACY AT REAL SCALE: the recorded words are the configuration error's - a calendar, a date, a version, a file - never a supply row's values."
      - "OBSERVABILITY: who sees it and when follows the queue's existing rules; the record carries when the step stopped and which run it belonged to."
      - "PERFORMANCE: the item is derived from a recorded row as the queue's other kinds are; the dashboard build reads recorded results only (CLAUDE.md's build rule)."
    dependencies:
      - "REQ-PIPE-378"
      - "REQ-DASH-070"
    decisions:
      - "A NEW BLOCKING KIND, ITS OWN REQUIREMENT (Dash B, SETTLED by Keith 2026-11-14). REJECTED CLI and log only, under which our fault would read as the supplier's on the page and repeat every run (the dashboard review's attribution point)."
      - "DASH, NOT PIPE (delivery-scoper): the user-facing outcome is what the page says; outstanding.py is REQ-DASH-070's module. The recording half is small and exists only to feed it."
      - "WHERE THIS MEETS THE BUILD REFUSAL (delivery-scoper, v6): Dash A makes the dashboard build refuse on a schedule configuration error it meets itself, and the build reads every dataset's slots up to a year ahead. So this item mostly shows for errors the build does not meet - for example an arrival dated before the calendar's first version, which a pipeline step meets and the build's own slot reading does not. Where the build also meets it, the build refuses and the page stays at its last good state, so the item appears once the build can run again. Recorded so the two answers are read together; open question 2 asks whether that is what Keith expects."
      - "STATE IN THE DATABASE (CLAUDE.md, 'the repository holds configuration, not state'): the stop is a recorded row, never a file."
    open_questions:
      - "1 (NEW in v6). ONE ITEM PER ERROR, OR PER DATASET. Options: (a) one item per distinct configuration error, listing every dataset it stopped, blocking each - like PENDING_CORRECTION's one asset-wide item; (b) one item per dataset, each naming the error - like FAILED_LOAD. RECOMMENDED (a): one broken calendar entry stops every dataset on it, and at thirty collections (b) is thirty items for one fix; each dataset's page still shows it is blocked."
      - "2 (NEW in v6). THE ITEM AND THE BUILD REFUSAL TOGETHER. Options: (a) as drafted - the item appears whenever the build can run, which is mostly for errors confined to dates the build does not read; (b) the build also refuses while any such item is uncleared, so a configuration error of either kind holds the page at its last good build - consistent with Dash A, but the item would then never be seen on a published page. RECOMMENDED (a): (b) would make the item pointless, and Dash A's reason - never publish a dataset as owing nothing - does not apply to a dataset whose slots the build read correctly."
    signed_off: null

  - id: REQ-TEST-395
    title: "Four stale or unsafe developer commands are deleted - mothman debug build-warehouses, mothman debug changelog, mothman debug capture-arrival-golden and the mothman dashboard snapshot command - with their tests, help mentions and register claims, while the functions other commands call stay"
    date_written: "2026-11-14"
    story: "As whoever runs or reads the mothman CLI, I want commands whose help describes retired designs, whose own example returns nothing, or which can quietly destroy a shared pin to be gone, so that every command listed is one that does what it says."
    moscow: should
    status: not_started
    source: "Keith, 2026-11-14, COMMAND CLEAN-UP, from the read-only command audit (docs/drafts/command-audit-2026-11-14.md), recorded in docs/drafts/decisions-2026-11-01.md: the deletions go into #134 v6 beside scenarios bands and the equivalence commands. Drafted by delivery-scoper 2026-11-14 (v6). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL delete `mothman debug build-warehouses` (cli/debug.py from line 165), whose help describes a per-run DuckDB warehouse and a synthetic manifest that no longer exist and which duplicates `mothman supply load` (cli/supply.py lines 309-345, the same stage.build_all with a report of what changed); stage.build_all and tests/test_build_warehouses_rebuild.py, which tests it directly, stay."
      - "THE SYSTEM SHALL delete `mothman debug changelog` (cli/debug.py from line 176), whose help says it reads committed qa_results/ history (gone) and whose own --dataset example returns [] because the query filters on collection_id (changelog.py line 79); qa_tools/common/changelog.build_changelog, which the dashboard embed calls directly (embed_dashboard_data.py line 296), stays."
      - "THE SYSTEM SHALL delete `mothman debug capture-arrival-golden` (cli/debug.py from line 186), which collects only the selected asset's collections and then rewrites the whole shared tests/fixtures/arrival_semantics_golden.json, dropping the other asset's pinned arrivals; tests/test_asset_time_semantics.py's references to it as 'the recorded procedure' (lines 20 and 168) SHALL say how the golden is re-captured instead, per asset, so that REQ-GEN-392 criterion 11's re-capture has a procedure that keeps both assets."
      - "THE SYSTEM SHALL delete the `mothman dashboard snapshot` COMMAND only (cli/dashboard.py line 239), whose --prepare-site help describes a GitHub Pages deploy step no CI runs; dashboard/snapshot_dashboard.py's prepare_deploy_site and take_snapshot stay, because `mothman dashboard publish` and `mothman pipeline run` call them as functions."
      - "THE SYSTEM SHALL delete each command's own tests (tests/test_cli_debug.py's build-warehouses and changelog tests, tests/test_cli_app.py line 198's --dataset assertion for debug changelog, tests/test_cli_dashboard.py line 146's snapshot test) and remove the commands from README.md (lines 46-48, which also still list the retired github acceptance sync), CLAUDE.md and docs/ wherever they are described as commands to run."
      - "THE SYSTEM SHALL remove, in the same change, every requirements.yaml linked_tests and implemented_by entry naming a deleted command function or test (at 72ec04d7 among them REQ-GEN-043's claims on capture-arrival-golden and the snapshot command's under REQ-DASH-013, REQ-DASH-292 and REQ-PIPE-089, the builder re-grepping at build), each listed for Keith as a built-requirement claim edit; evidence prose stays as the record of its day."
      - "THE SYSTEM SHALL keep `mothman debug snapshot-worktrees`, `mothman pipeline cache-key`, `mothman dashboard rebuild-results`, `build-data`, `embed` and `check-renders`, `mothman population`, `mothman github sync-tickets` (guarded by REQ-GHUB-396) and `mothman github sync-leaderboard` as they are."
      - "WHEN any deleted command name is invoked, THE SYSTEM SHALL answer as for any unknown command ('No such command' with the asset's commands beneath it, cli/app.py line 259), leaving no forwarding alias."
    non_functional_requirements:
      - "MAINTAINABILITY: four commands and their tests stop needing upkeep; no function another command calls is removed (criteria 1-4)."
      - "RELIABILITY: the one command that could silently destroy a committed pin (criterion 3) is gone, and the pin keeps a documented per-asset re-capture route."
      - "FIRST-TIME USE: `mothman debug --help` and `mothman dashboard --help` list only commands whose help is true."
      - "AUDITABILITY: every register claim the deletion makes untrue is named for Keith in the same change (criterion 6)."
    dependencies:
      - "REQ-TEST-393"
      - "REQ-GEN-043"
      - "REQ-DASH-013"
      - "REQ-GEN-392"
    decisions:
      - "DELETE FOUR, KEEP THE REST (COMMAND CLEAN-UP, SETTLED by Keith 2026-11-14): build-warehouses, changelog, the snapshot command and capture-arrival-golden go. KEPT, not chosen for deletion: sync-tickets, sync-leaderboard, snapshot-worktrees, cache-key, rebuild-results, build-data, embed, check-renders, population."
      - "INSIDE #134 v6, NOT A FIX BATCH NOW (Keith, 2026-11-14): beside scenarios bands (REQ-PIPE-385) and the equivalence commands (REQ-TEST-393). REJECTED a small fix batch now."
      - "ITS OWN SMALL REQUIREMENT (delivery-scoper, v6): none of the four belongs to another requirement's subject; this one could fold into REQ-TEST-393 if Keith prefers one fewer id."
      - "THE SNAPSHOT FUNCTIONS STAY (Keith, 2026-11-14: 'the dashboard snapshot COMMAND only'): publish and pipeline run call prepare_deploy_site and take_snapshot as Python functions (the audit)."
      - "capture-arrival-golden IS 'LIKELY DESTRUCTIVE' FROM READING THE CODE, NOT FROM RUNNING IT (the audit, 2026-11-14): its deletion needs no run to justify it, and nobody should run it to find out."
      - "NO DEFECT TEST FOR capture-arrival-golden (delivery-scoper): the command is deleted rather than fixed, so a regression test would guard nothing (CLAUDE.md's test rule 2)."
    open_questions: []
    signed_off: null

  - id: REQ-GHUB-396
    title: "mothman github sync-tickets refuses to run unless the environment turns ticketing on, as the ticket reconciler already does"
    date_written: "2026-11-14"
    story: "As whoever maintains the pipeline, I want the old ticket sync to open no issue from an environment where ticketing is off, so that running it by hand in a sandbox cannot post tickets to the data asset's real repository."
    moscow: must
    status: not_started
    source: "Keith, 2026-11-14, sync-tickets GUARD, from the read-only command audit (docs/drafts/command-audit-2026-11-14.md: it never reads env.ticketing, so run by hand it would open per-dataset issues in the ticket_repository from any environment, sandbox included); recorded in docs/drafts/decisions-2026-11-01.md, into #134 v6. Drafted by delivery-scoper 2026-11-14 (v6). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "IF `mothman github sync-tickets` (cli/github.py line 18) runs where environments.current_or_none() is None or the environment's `ticketing` is not true, THEN THE SYSTEM SHALL refuse before reading any report or calling GitHub, exiting 1 and naming the environment (or MOTHMAN_ENVIRONMENT being unset) and that its ticketing is off in assets/environments.yaml - the same rule ticket_reconciler.py line 334 applies (REQ-PIPE-093 criteria 10 and 12)."
      - "WHERE the environment turns ticketing on, THE SYSTEM SHALL run sync-tickets as it does today."
      - "THE SYSTEM SHALL apply the guard in ticket_sync itself, not only in the command, so that any caller of ticket_sync.main meets it."
      - "THE SYSTEM SHALL have a regression test, seen failing against today's code first, that sync-tickets with ticketing off makes no GitHub call and exits 1 naming the environment, and a test that with ticketing on it proceeds."
    non_functional_requirements:
      - "SECURITY: one switch - the environment's `ticketing` - decides whether anything posts to GitHub, for both ticket paths; GITHUB_REPOSITORY or a token being present is never enough."
      - "RELIABILITY: the refusal comes before any network call, so a refused run has no partial effect."
      - "OBSERVABILITY: the refusal names the environment and the file that switches ticketing, so the fix is one line to find."
      - "COMPATIBILITY: the guard reads committed configuration and an environment variable only; no network is needed to refuse."
    dependencies:
      - "REQ-PIPE-093"
      - "REQ-GHUB-027"
      - "REQ-PIPE-083"
    decisions:
      - "ADD THE GUARD (sync-tickets GUARD, SETTLED by Keith 2026-11-14): a defect fix, test seen failing first. REJECTED a small fix batch now; it goes into #134 v6."
      - "KEEP sync-tickets OTHERWISE (COMMAND CLEAN-UP, SETTLED by Keith 2026-11-14): not deleted, although its only workflow caller (ticket-sync.yml) is disabled and it overlaps REQ-PIPE-083's reconciler; that overlap and the empty leaderboard behind sync-leaderboard are still for Keith to raise, not this requirement."
      - "THE SAME RULE AS THE RECONCILER (delivery-scoper): ticket_reconciler.py line 334 returns nothing unless env.ticketing; one rule for both ticket paths, so the environment list remains the only switch (REQ-PIPE-093)."
      - "IN ticket_sync, NOT ONLY THE COMMAND (delivery-scoper): the disabled workflow calls the same module; a guard in the command alone would leave the module unguarded if the workflow were re-enabled."
    open_questions: []
    signed_off: null
