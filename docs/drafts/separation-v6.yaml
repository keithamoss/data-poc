      - "THE CHILD PROTECTION RESTATEMENT IS DEAD (delivery-scoper, re-checked 2026-11-14): no reader of START_DATE, _quarter_start or _add_quarters outside the provider's own definitions; a removal, not a rewire. Its round-to-period step is folded by REQ-PIPE-377."
      - "DERIVED THROUGH check_bands (delivery-scoper): the reader Linkage Products already uses for its planned verdicts, and the one D4 names."
      - "THE GEOCODING CHECK FILES STAY HAND-WRITTEN (SPLIT RISK 5, SETTLED by Keith 2026-11-03). REJECTED a template from the three facts, and waiting for a third source."
      - "IF THE DERIVED VERDICT DIFFERS FROM TODAY'S TABLE, THE DERIVED ONE STANDS (QD and the standing rule, Keith 2026-11-14): v5's criterion 3 stopped the build to report a difference; that protected only the synthetic history, so it is gone, and so is v5's compare criterion. Any scenario that then stops landing is caught by REQ-GEN-186's own target check in the bootstrap."
