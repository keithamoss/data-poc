  - id: REQ-TEST-388
    title: "Every asset's dbt project declares the same dbt packages and versions, and a gate in mothman check and the validate-config workflow fails when two assets' packages.yml or package-lock.yml differ"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want every asset to run its checks on the same dbt packages, so that a check behaves the same on every asset and a package upgrade cannot land in one asset and be forgotten in the other."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 2, the dbt package files (SPLIT D2, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14 unchanged; v6 2026-11-14 with the CLI review's findings 4 and 5 and the architect's named-subcommand point. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL keep a packages.yml and a package-lock.yml in every asset's dbt project (assets/<asset>/dbt/), because dbt reads them from each project, and `mothman env dbt-deps` SHALL install each asset's from its own (REQ-QAC-368)."
      - "IF any two asset folders in the repository declare different dbt packages or versions - their packages.yml, or their package-lock.yml, differing once parsed as YAML - THEN the gate SHALL fail, naming both assets, the file and the first entry that differs, and ending 'make both match, then run `mothman env dbt-deps` for each asset'."
      - "WHERE only one asset folder can be seen, THE SYSTEM SHALL pass the gate and report that it compared one asset."
      - "THE SYSTEM SHALL run the gate as `mothman dashboard validate-dbt-packages`, without a database, an asset selection or network access, as its own step in validate-config.yml."
      - "THE SYSTEM SHALL run the gate once per `mothman check` whatever MOTHMAN_ASSET says (cli/check.py's _REPOSITORY_WIDE), under the label `dbt packages`, reachable by `mothman check --only 'dbt packages'`, with a one-line 'What it covers' entry in the summary table, among the cheap gates before `schedule` - a per-asset run would compare across assets twice and print the same finding twice."
      - "THE SYSTEM SHALL have tests, seen failing first, of a differing package revision failing, of a differing lock hash failing, of a difference in comments alone passing, and of one asset passing."
    non_functional_requirements:
      - "PERFORMANCE: two small YAML files per asset; the gate runs in under a second."
      - "MAINTAINABILITY: an upgrade is one edit per asset, held together by the gate, and `mothman env dbt-deps` per asset as today."
      - "COMPATIBILITY: the gate reads committed files only, so it runs on a government network with no access to dbt Hub or GitHub."
      - "COST: no database and no bootstrap; seconds in CI."
    dependencies:
      - "REQ-QAC-368"
    decisions:
      - "SAME PACKAGES, KEPT PER PROJECT, GATED (SPLIT D2, SETTLED by Keith 2026-11-03). REJECTED packages per asset, and one shared install folder."
      - "PARSED, NOT BYTES (delivery-scoper): a comment is not a package."
      - "THE LOCK FILE IS COMPARED TOO (delivery-scoper): REQ-QAC-368 decision 5 as changed by C6 (SETTLED by Keith 2026-11-02) makes dbt's own package-lock.yml the meaning of 'installed'."
      - "REPOSITORY-WIDE, AND A NAMED SUBCOMMAND (CLI review finding 4; architect): with no asset selected a per-asset gate runs once per asset folder; validate-config.yml runs individual commands, so the gate needs one."
      - "people.yaml AND data-asset.yaml HAVE NO GATE (SPLIT D2, SETTLED by Keith 2026-11-03): see REQ-QAC-387."
    open_questions: []
    signed_off: null

  - id: REQ-QAC-389
    title: "Each QA adapter's statistics read a column's allowed values from the collection's contract at run time, the adapters hold no hand-copied list, and Emergency Department's age_group gains a real contract rule that datacontract-cli checks"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want the statistics a run records to count against the allowed values the contract declares, and every counted column's list to be a rule a tool checks, so that a list edited in the contract is the list the statistics use, whichever tool is later dropped."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 3 (SPLIT D3, 2026-11-03, Perth). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14 with Q4; v6 2026-11-14 with 389 Q1 (SETTLED), the compare removed (QD), the CLI review's finding 5 and the dashboard review's release note. A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "WHEN a run records a collection's statistics, THE SYSTEM SHALL read each counted column's allowed values from the collection's ODCS contract at that moment, through one reader in asset_model/ - the column's `enum:` or its datacontract `invalidValues` rule's `validValues`."
      - "THE SYSTEM SHALL remove every hand-copied allowed-value list from the QA adapters - _SEX_VALID and _SUBURB_VALID (assets/daily/collections/civil_registration.py lines 11-12), _POSTCODE_VALID and _CONCERN_TYPE_VALID (assets/quarterly/collections/child_protection.py lines 30 and 35), TRIAGE_CATEGORIES and AGE_GROUPS (emergency_department.py lines 5-6) and MATCH_LEVELS (linkage_products.py line 10) - and an adapter SHALL name only which columns its statistics count and test."
      - "THE SYSTEM SHALL keep the order the contract declares a list in, so that recorded value counts keep their declared order (REQ-QAC-247)."
      - "IF a column an adapter names has no allowed-value list in its contract, or the contract declares it twice and the two disagree, THEN THE SYSTEM SHALL refuse the run before any tool runs, naming the contract, the column, what is missing or different and the fix ('add an invalidValues rule or `enum:` to <column> in <contract>'), and the collections gate (`mothman check --only collections`) SHALL fail on the same condition without a database."
      - "THE SYSTEM SHALL add to Emergency Department's contract (assets/quarterly/department-of-health/emergency-department-contract.yaml, the ed_presentations table's age_group column, line 108) a datacontract quality rule of metric invalidValues whose validValues are the ten bands AGE_GROUPS holds today, in the same order ('0-4', '5-14', '15-24', '25-34', '35-44', '45-54', '55-64', '65-74', '75-84', '85+'), mustBe 0, severity error and dimension conformity - the shape the triage_category and sex rules on the same table already take (Q4 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL give that rule the id quarterly:department-of-health:emergency-department:ed-presentations:age_group:invalidValues_datacontract and the check_id customProperty quarterly.department-of-health.emergency-department.ed-presentations.age_group.invalidValues_datacontract, following its siblings' convention, and the check-lifecycle gate SHALL accept it as a new check_id."
      - "THE SYSTEM SHALL give that rule its lifecycle customProperties as its siblings carry them - introduced_date '2013-01-01' (389 Q1, SETTLED by Keith 2026-11-14), changelog '[]', and the authored prose of docs/check-authoring-rules.md: description 'A single unrecognised value fails.'; failure_indicates 'The source system has started emitting a value that was never agreed in the contract, usually a new age banding introduced upstream without notice.'; and no technical_note - and `mothman dashboard validate-check-lifecycle --require-explanations` SHALL pass."
      - "THE SYSTEM SHALL have the statistics read age_group's allowed values from that rule through criterion 1's reader, so that the datacontract-cli check and the recorded value counts read one list."
      - "THE SYSTEM SHALL have the Linkage Products provider's drift planning read a column's known values through the same reader (known_values, assets/quarterly/synthetic/collections/linkage_products.py line 353) rather than by loading the collection's QA adapter (line 359), so that a planned reference folds as the recorded one does."
      - "THE SYSTEM SHALL keep each tool's own copy of a list - the contract's, Soda's and dbt's - as it is, with no gate holding them equal, and SHALL leave the generator's value pools (generator/names_au.py and the providers' own, Emergency Department's AGE_GROUPS draw included) independent of the contract (SPLIT D3)."
      - "THE SYSTEM SHALL ship, in the same push, a CHANGELOG.yaml entry telling a reader that Emergency Department's age_group is now also checked by datacontract-cli, with results across the whole sample history."
      - "THE SYSTEM SHALL have tests, seen failing first, of a value added to a contract list being counted by the next run's statistics, of a column with no list refused before any tool runs, and of an age_group value outside the ten bands failing the new datacontract check."
    non_functional_requirements:
      - "PERFORMANCE: the contract is read once per run, not per row or per column; a run is no slower than today beyond one more datacontract rule on one table."
      - "RELIABILITY: a list the statistics cannot find is a named refusal before the tools run, never an empty list that would count every value invalid."
      - "PRIVACY AT REAL SCALE: allowed-value lists (suburbs, postcodes, triage categories, age bands) are reference data, not records; reading them at run time touches no supply row beyond what the statistics already read."
      - "SCALABILITY: a thirtieth collection's adapter declares columns, not lists, so it cannot drift from its own contract."
      - "AUDITABILITY: the new check carries its own check_id, introduced_date and changelog from its first run, and the release note and this requirement record when it was actually written."
      - "COST: one more check result per Emergency Department run; no new tool, no new dependency."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-QAC-247"
      - "REQ-QAC-024"
    decisions:
      - "THE THREE PER-TOOL COPIES STAY (SPLIT D3, SETTLED by Keith 2026-11-03): the tool comparison is still running and one or more checks, or a whole tool, will go. REJECTED declaring once with every tool reading, an agreement gate, and one check per rule."
      - "THE ADAPTER READS THE CONTRACT AT RUN TIME (SPLIT D3, SETTLED by Keith 2026-11-03): the contract is the copy that survives whichever tool is dropped. Applies to every collection."
      - "THE GENERATOR'S POOLS STAY INDEPENDENT (SPLIT D3, CHANGED by Keith 2026-11-03): test data need not follow the rule exactly. REJECTED the contract driving the generator."
      - "THE PROVIDER'S known_values IS NOT A POOL (delivery-scoper, 2026-11-03): it mirrors what the statistics record so a planned drift reference has the recorded one's shape (A2, SETTLED by Keith 2026-11-02)."
      - "EITHER DECLARATION IS READ (delivery-scoper): today's contracts use `enum:` (Linkage Products' match_level) and `validValues` (every other list); a disagreement fails loudly rather than picking one."
      - "AGE_GROUP GETS A REAL RULE, A NEW CHECK (Q4 of 2026-11-14, SETTLED by Keith 2026-11-14, option (b), NOT the recommendation). REJECTED (a) a contract customProperty no tool checks (the recommendation), and (c) a hand copy in the adapter."
      - "AN invalidValues RULE, NOT A FIELD-LEVEL enum: (delivery-scoper, v5, from the code): run_datacontract.py records only the quality-rule check types (_QUALITY_CHECK_TYPES, line 44), and a field-level `enum:` carries no customProperties for a check_id or lifecycle, so it would be checked and never recorded - Linkage Products' match_level is in that state today."
      - "introduced_date IS 2013-01-01 (389 Q1, SETTLED by Keith 2026-11-14): its siblings' date; the changelog and this requirement record when it was written. REJECTED the build date, which would leave results dated years before the check's own introduction. The dashboard never shows introduced_date (dashboard review finding 5)."
      - "THE NEW CHECK'S WORDING FOLLOWS ITS SIBLINGS (delivery-scoper, v5; the dashboard review agreed): failure_indicates is the dbt accepted_values sibling's sentence on the same column, because the reader sees one column's checks together. Writing a check's prose is ordinary work, so Keith reviews it here rather than approving a rule."
      - "A RELEASE NOTE, NOTHING ON THE PAGE (dashboard review finding 4): the check is one more card beside its dbt sibling, with no new chrome; the release note is what tells a returning reader why age_group has a second check."
      - "NOTHING IS EXPECTED TO FAIL IT (delivery-scoper, v5): the provider draws age_group only from its own ten bands (emergency_department.py line 79), and no fault writes age_group; if one ever aims at it, the single-tier rule empties that rule's amber band and REQ-GEN-392 refuses to generate, which is loud (architect)."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's criterion 12 (compare, and stop if any result is not a pass or a verdict moves) is gone; criterion 12's tests are the proof, and an Emergency Department verdict moving with the regenerated history is accepted."
    open_questions: []
    signed_off: null

  - id: REQ-PIPE-390
    title: "The order of the dataset statuses and the words for them are held once, in asset_model/, and the pipeline's, the bootstrap's, the map writer's and the providers' copies read them"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want one definition of which status is worse than which, and one set of words for them, so that a re-check, a target trial, a planned verdict and the scenario map cannot rank or name green, amber and red differently from the dashboard."
    moscow: should
    status: not_started
    source: "Keith, the split overview's decision 4 (SPLIT D4, 2026-11-03, Perth: 'the status order moves into asset_model/'). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14; v6 2026-11-14 with status_words (B3) and the ranking test made a rule of the imports gate (architect). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL hold the order of the dataset statuses (nodata below green below amber below red, dataset_status.ORDERED_STATUSES today, line 62) once, in asset_model/, and the pipeline, the bootstrap and the providers SHALL read it there: dataset_status.py line 62, rechecking.py line 117, target_agreement.py line 25 and assets/quarterly/synthetic/collections/linkage_products.py line 345."
      - "THE SYSTEM SHALL hold dataset_status.status_words (line 132) beside the order in asset_model/, so that the scenario map's writer (REQ-GEN-386 criterion 5) and the pipeline read one set of words (B3, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL rank green, amber and red in each former copy exactly as it does today, proven by a test of each reader."
      - "THE SYSTEM SHALL keep the dashboard page's own copy of the order, held equal to the Python one by status-cases.json's shared cases as today."
      - "THE SYSTEM SHALL carry, as a rule of REQ-TEST-384's imports gate with a test of its own, a failure WHERE a module outside asset_model/ and tests/ defines its own ranking of the status words; the rule reads Python modules only, never the template."
    non_functional_requirements:
