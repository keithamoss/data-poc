  - id: REQ-PIPE-378
    title: "The schedule code answers #137 group D's settled questions one way: a date before a calendar's first version raises for every caller, the cadence check is made per round only, the slot helpers and the dashboard build stop swallowing configuration errors, a configuration error reaches a person as a refusal naming what to fix, and a period's round is required; the look-ahead horizons are parked"
    date_written: "2026-11-03"
    story: "As whoever maintains the pipeline, I want each place where the schedule code answers one question two ways settled on purpose, so that a supply's period, window and slot do not depend on which function happened to be asked, and a configuration mistake is never read as an answer."
    moscow: could
    status: not_started
    source: "Keith, plans/running-thoughts.md #137 group D (2026-11-02, 'WOULD CHANGE BEHAVIOUR (Keith's)'). Drafted by delivery-scoper 2026-11-03 (v4); v5 2026-11-14 with Q6-Q10; v6 2026-11-14 with 378 Q1 and Q2, Dash A, the CLI review's findings 2 and 9, and the horizons PARKED (Keith, 2026-11-14). A PROPOSAL, not signed until Keith signs v6."
    acceptance_criteria:
      - "THE SYSTEM SHALL answer which calendar version is in force on a date through one function, Calendar.version_in_force (schedule.py line 172), which raises ScheduleConfigError naming the calendar, the date and its earliest version for a date before the first version; schedule._version_in_force (line 809), which falls back to the first version, SHALL go, and its callers SHALL call Calendar.version_in_force (Q6 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL apply criterion 1 to calendar versions only: the participation-version fallback (slots._participation_for, REQ-PIPE-113 criterion 2) is unchanged, and a period before a dataset's first participation version keeps reading as not owed (378 Q1, SETTLED by Keith 2026-11-14)."
      - "IF schedule.claim_window is asked for a date before the dataset's calendar's first version and no participation version states the window, THEN it SHALL raise criterion 1's error rather than take the first version's window (line 806 today); a window a participation version states is answered as today."
      - "IF schedule.periods_for_dataset's per-round cadence check (line 691) meets a round before the calendar's first version, THEN it SHALL raise criterion 1's error."
      - "IF a dataset's own dates name a round before its calendar's first version, THEN `mothman schedule validate` SHALL fail, reported in the gate's existing form (validate_schedule._report: under the calendar file, scoped to the dataset, a problem line and a fix line), naming the dataset, the round, the calendar and its first version. (No dataset in either asset declares own dates at 72ec04d7.)"
      - "WHEN orchestrate._claim_window (qa_tools/tools/orchestrate.py line 461) meets criterion 1's error for a dataset on an arrival's receipt date, THE SYSTEM SHALL leave that dataset out of the shortest-window minimum, answering none if none remain - its docstring's own 'never a borrowed one' rule (REQ-PIPE-243 criterion 2) standing (378 Q2 (a), SETTLED by Keith 2026-11-14)."
      - "WHEN verdict.resolved (verdict.py lines 92 and 94) meets criterion 1's error, THE SYSTEM SHALL keep its callers' existing handling of a slot that cannot be built: verdict.judge records the classification with no inputs and no fingerprint (its never-raises rule), and verdict.compared reports the slot as one that cannot be built now, naming the error."
      - "WHEN agreement_drift's keys for a period (agreement_drift.py line 132) meet criterion 1's error, THE SYSTEM SHALL leave out the calendar-version key, because no calendar version governed the period, and SHALL still add the calendar-period key; every other exception there is handled as today."
      - "WHEN participation_view.view (participation_view.py lines 183 and 218) meets criterion 1's error, THE SYSTEM SHALL show the claim window as stated by no calendar version on that date, naming the calendar's earliest version, and show no source date for it, rather than raise; `mothman schedule show --dataset cp-clients --on 2012-06-01` SHALL exit 0 showing exactly that, naming 2013-01-01, with no traceback (CLI review finding 9)."
      - "WHEN the Linkage Products provider's release timing (linkage_products.py lines 1745 and 1800) meets criterion 1's error, THE SYSTEM SHALL refuse to generate, naming the release and the date (its CannotGenerate), rather than time a release against a borrowed window."
      - "THE SYSTEM SHALL keep files_go.py line 57 and pipeline/period_slots.py line 40, which already call Calendar.version_in_force and so already raise, as they are."
      - "THE SYSTEM SHALL keep only the per-round cadence check - months named by a participation in force on a round whose calendar version is a cadence rule, judged on the round's date (schedule.py line 691) - and SHALL remove the check against the calendar's current version (lines 732-738, cal.current); the refusal of an unbounded ask of a cadence-rule calendar (line 739) is not a months check and stays (Q7 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "IF slots.is_owed_supplies (line 444) or slots.period_claimed_at (line 529) meets a ScheduleConfigError, THEN it SHALL raise it rather than answer False or None; NoCalendarAgreed SHALL keep its deliberate quiet answer ('nothing owed'), and an unknown dataset (UnknownDatasetError, a KeyError) its answer as today (Q9 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL narrow period_claimed_at's `except ValueError` (line 538) so that it no longer catches ScheduleConfigError, which is a subclass of ValueError (schedule.py line 73); any other ValueError it still serves SHALL be named in this requirement's decisions when built."
      - "WHEN the error of criterion 13 reaches the helpers' callers - arrivals.py line 222, validate_arrival_patterns.py line 99 and promotion.py line 514 - THE SYSTEM SHALL let it stop the step and name the configuration, never continue as though nothing were owed; REQ-DASH-394 records the stop for the 'needs a person' queue."
      - "WHEN the dashboard build meets a ScheduleConfigError for a dataset (dashboard/embed_dashboard_data._slots_by_dataset, lines 359-371, and pipeline/period_slots.for_dataset, lines 44-48), THE SYSTEM SHALL refuse the build, naming the dataset and the asset's calendar file, and SHALL NOT publish that dataset as having no slots; the live page stays at the last good build, and NoCalendarAgreed keeps its quiet answer (Dash A, SETTLED by Keith 2026-11-14)."
      - "WHEN a ScheduleConfigError reaches a `mothman` command, THE SYSTEM SHALL show it as a refusal of one paragraph with exit 1, never a traceback (cli/app.py's _MothmanGroup.invoke, lines 264-290, catching it beside the errors it catches today), naming the asset's calendar file (assets/<asset>/calendar.yaml), the dataset whose date asked WHERE the caller knows one, the date and the calendar's earliest version, and ending 'Fix the configuration, then `mothman schedule validate` checks it.'; in the terminal's menus the menu SHALL carry on, as for any refusal."
      - "WHEN `mothman pipeline process` or `mothman pipeline run` stops a step on a ScheduleConfigError, its report SHALL say what was recorded before the stop (the existing StageFailed report) and that the step will stop the same way on every pass until the named configuration is fixed."
      - "THE SYSTEM SHALL make DatasetPeriod.round (schedule.py line 126) required, with no default, and SHALL remove the 'or period' fallbacks at slots.py line 307 and schedule.py line 142; both product constructors (schedule.py line 675 and the Child Protection provider line 742) already set it (Q10 of 2026-11-14, SETTLED by Keith 2026-11-14)."
      - "THE SYSTEM SHALL leave every look-ahead reach exactly as it is (the inventory in this requirement's decisions), slots.relative_period included; their shape is PARKED by Keith, 2026-11-14, and is not part of this build."
      - "THE SYSTEM SHALL have, for each criterion that changes behaviour (3 to 10 and 12 to 19), a test seen failing first against today's behaviour, each fallback caller's test naming that caller, and a real-browser or build test that a dataset with broken schedule configuration is refused rather than published as owing nothing."
    non_functional_requirements:
      - "RELIABILITY: a configuration error is the one thing the pipeline and the dashboard must not read as 'nothing owed' (criteria 13-16); a date no calendar version covers is an error the caller meets on purpose, never a borrowed answer (criteria 1-10)."
      - "OBSERVABILITY: an error reaching a person names the file to edit, the dataset that asked, the date, the earliest version and the next step (criterion 17), and a stopped step says it will recur until fixed (criterion 18) - attribution the reader can act on."
      - "PERFORMANCE: the bootstrap is no slower than before by more than 5 percent; nothing here changes how far anything looks ahead."
      - "SCALABILITY: at thirty collections one broken calendar refuses one build naming every dataset it breaks, rather than thirty silent timelines."
    dependencies:
      - "REQ-PIPE-380"
      - "REQ-PIPE-376"
      - "REQ-PIPE-377"
      - "REQ-PIPE-243"
      - "REQ-PIPE-113"
      - "REQ-DASH-394"
    decisions:
      - "A DATE BEFORE A CALENDAR'S FIRST VERSION RAISES, FOR EVERY CALLER (Q6 of 2026-11-14, SETTLED by Keith 2026-11-14, option (b), NOT the recommendation). REJECTED (a) falling back to the first version everywhere (the recommendation), and (c) keeping both policies, renamed."
      - "CALENDAR VERSIONS ONLY (378 Q1, SETTLED by Keith 2026-11-14): explained first that under (b) the Child Protection build would likely refuse (Dash A) over a dataset that merely starts later than its calendar. REJECTED participation versions too."
      - "orchestrate._claim_window LEAVES THE DATASET OUT (378 Q2, SETTLED by Keith 2026-11-14, option (a), re-asked with an example after an earlier answer was withdrawn): it caps only the replay's simulated pass delay (live it is simply now), and (c), the adapter's claim_window_dataset, would raise too, because the adapter's default dataset has no early window either. REJECTED raising, and the withdrawn fall-back to the adapter's dataset."
      - "THE FALLBACK'S CALLERS, NAMED (delivery-scoper, v5, from the code): schedule._version_in_force had five direct callers - the per-round cadence check (line 691), claim_window (line 806), agreement_drift.py line 132, participation_view.py line 218 and verdict.py line 94 - and claim_window carries it to slots.slot_instants, verdict.py line 92, orchestrate._claim_window, participation_view.py line 183 and the Linkage Products provider. The architect added a sixth reader that swallows it, the dashboard build, which is criterion 16."
      - "WHY NOTHING IS EXPECTED TO MOVE FOR CRITERIA 1-10 (delivery-scoper, v5): every calendar period lies on or after its calendar's first version and no dataset declares own dates (quarterly 2013-01-01; daily 2026-06-18). The error guards configuration not yet written, which is why criterion 5 refuses it in the schedule gate."
      - "EACH CALLER'S ANSWER IS THE SCOPER'S PROPOSAL (delivery-scoper, v5, Keith may change any): verdict keeps its cannot-be-built handling; agreement_drift drops only the key with nothing to name; participation_view words the gap, as a view; the generator refuses, as it refuses any release it cannot time."
      - "ONLY THE PER-ROUND CADENCE CHECK (Q7 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)). REJECTED only the current-version check, and keeping both."
      - "SWALLOWED CONFIGURATION ERRORS RAISE (Q9 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)): NoCalendarAgreed keeps its quiet 'nothing owed'. REJECTED keep swallowing. ScheduleConfigError subclasses ValueError, so criterion 14 is what makes the answer true."
      - "THE BUILD REFUSES (Dash A, SETTLED by Keith 2026-11-14): REJECTED one asset-wide notice with the build carrying on (the dashboard reviewer's recommendation, which matched the 2026-10-25 'one bad file no longer blocks the page' call - this answer narrows that call for schedule configuration), and hiding it as today."
      - "AN UNKNOWN DATASET KEEPS ITS QUIET ANSWER (delivery-scoper, v5, Keith may change it): UnknownDatasetError means the dataset is not in this asset's hierarchy, which is_owed_supplies' callers already treat as nothing owed."
      - "DatasetPeriod.round REQUIRED (Q10 of 2026-11-14, SETTLED by Keith 2026-11-14, option (a)). REJECTED leaving it optional."
      - "THE SIXTH ITEM IS ALREADY FOLDED (#137 group D): the three readers of `synthetic: true` become one in REQ-PIPE-382 criterion 5."
      - "THE HORIZONS ARE PARKED (Keith, 2026-11-14, after the 17 sites were listed for him: 'that needs a separate focused bit of thinking ... I'm not happy with the shape of that, guessing random numbers'). v5's criteria 12-14, its open questions 3 and 4 and Q8's 'one named horizon' itself are out of this build; the shape, not just the number, is reopened. Criterion 20 says to leave them so a builder does not tidy one in passing. Not split into a requirement of its own, because any criterion written now would assert a shape Keith has said he is not happy with."
      - "THE HORIZON INVENTORY, KEPT FOR THE PARKED THINKING (delivery-scoper, v5, at 72ec04d7): reaching from now - slots.lookup_horizon (3 years; slot_named, placing.py lines 206 and 348, turned_off.py line 142), schedule.date_of and round_of (365 days, lines 903 and 925), agreement_freeze.py line 398 (400 days), pipeline/period_slots.py line 42 (400 days), dashboard/embed_dashboard_data.py line 365 (366 days, a display window), period_overlap.py line 63 (end of next year), correction_trial.py line 329 (400 days past the later of the latest period and today); reaching from a given date - slots.fall_hold (731 days, line 499), inheritance.py line 697, scripted_decisions.py line 527, correction_trial.py line 723, verdict.compared (line 338), validate_schedule.py lines 1906, 2140 and 2258, agreement_freeze.py line 311 and _FLIP_REACH (800 days, line 669). promotion._READER_REACH (400 days, line 523) bounds a reader's delivery search, not a schedule, and is not a horizon. The reviews' points for that thinking: the dashboard's 366 days is a display window that a 3-year reach would triple at 30 collections (architect); a longer reach slows settle_tui, the filing TUI and `supply queue` per keypress, and a shorter one turns a re-filing into a refusal that should name the horizon (CLI review finding 8)."
      - "THE STEP-STOP IS VISIBLE ON THE PAGE AS ITS OWN SMALL REQUIREMENT (Dash B, SETTLED by Keith 2026-11-14): REQ-DASH-394, rather than widening this one."
      - "NO EQUIVALENCE COMPARE (QD, Keith 2026-11-14): v5's criterion 20 (record every difference; stop if a recorded result moves) and its 'BEHAVIOUR CHANGES ONLY BY DECISION' NFR are gone. The failing-first tests of criterion 21 are the proof."
      - "ONE REQUIREMENT, SEVERAL SETTLED ITEMS (delivery-scoper, v5): kept whole because the ids were kept; it could split into the in-force items (Q6, Q7), the swallowed-error items (Q9, Dash A, the refusal wording) and the field item (Q10) if Keith prefers smaller pieces."
