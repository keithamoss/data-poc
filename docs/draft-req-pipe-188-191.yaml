- id: REQ-PIPE-188
  title: A run asks its tools only for the checks it records, and refuses if one it should record goes missing
  date_written: "2026-10-11"
  story: "As someone regenerating or processing QA history, I want each run to ask its QA tools only for the checks it will actually record, with a guard that no check it should record silently goes missing, so that a Child Protection run stops paying to evaluate five sibling tables' checks it then throws away, without one recorded verdict changing."
  moscow: should
  status: not_started
  source: "Keith, plans/running-thoughts.md #65 (scoped 2026-10-06 morning: a full bootstrap under 5 minutes, output identical, proven by an equivalence test; the finding profiled 2026-10-11 evening). Drafted by delivery-scoper 2026-10-11."
  acceptance_criteria:
    - "THE SYSTEM SHALL decide which checks a run asks each tool to evaluate from the same rule the results writer uses to decide which results it records (qa_results_writer.scope_of_run), and SHALL NOT hold a second implementation of that rule in any tool runner."
    - "WHERE a run's id names a table, THE SYSTEM SHALL ask each scoped tool for that run's own dataset's checks (none where its own table is contested, REQ-PIPE-079 criterion 13) plus every cross-table check that declares it reads that table."
    - "WHERE a run is a readers-only run (REQ-PIPE-121 criterion 2), THE SYSTEM SHALL ask each scoped tool for only that dataset's checks that read a moved table."
    - "WHERE a run's id names no table, such as a trial (`mothman cp qa --trial`), THE SYSTEM SHALL ask each tool for the whole collection's checks, as today."
    - "THE SYSTEM SHALL leave every sibling table a scoped cross-table check reads readable to it, so that the check reads the same rows it reads today."
    - "IF a check inside a run's scope has neither a recorded result nor a not-evaluated record once the run's tools have finished, THEN THE SYSTEM SHALL refuse the run and stop the batch, naming the check and the tool."
    - "THE SYSTEM SHALL keep the results writer's own filter to the run's scope (_scope_to_run), so that a tool asked for more than the scope still records only the scope."
    - "THE SYSTEM SHALL take Birth Registrations through the same scoped path, where the scope is every check on its one table, and SHALL record for it exactly what it records today."
    - "THE SYSTEM SHALL record the same filings, decisions, verdicts and supply tables from a full bootstrap from empty, once REQ-PIPE-189, REQ-PIPE-190 and REQ-PIPE-191 are built, as the commit before the first of them, compared by tests/equiv_support.snapshot with only the columns it already excludes allowed to differ, and SHALL state in the evidence how many arrival runs, re-check runs and readers-only runs the comparison covered."
    - "THE SYSTEM SHALL report a full bootstrap's wall-clock time from empty, and each collection's, before the first of REQ-PIPE-189 to 191 and after the last, on the same machine on the same day with nothing else running, using REQ-TEST-116 criterion 6's timing output."
    - "THE SYSTEM SHALL complete a full bootstrap from empty in under 5 minutes, on the machine that measured 10m39s on 2026-10-11."
  non_functional_requirements:
    - "IDENTICAL OUTPUT IS THE BAR, not close output (Keith, #65, 2026-10-06). This is a speed change, and a speed change that moves any verdict is a defect."
    - "ONE ANSWER TO 'WHICH CHECKS TOUCH THIS TABLE' (REQ-PIPE-121 NFR 1, REQ-PIPE-140 NFR 1). The scope comes from reevaluation.plan() and the reads declarations through scope_of_run, never from a per-tool list of what each table needs."
    - "NO SCENARIO-ONLY CODE PATH. The scoped path is the only path for every real run, synthetic or not; nothing in it knows about the generator or a planted test scenario."
    - "SCALE (CLAUDE.md, ~30 datasets on the quarterly asset). Today every run evaluates every table, so a collection's per-run cost grows with its table count and its total cost with the square of it. Scoped, a run costs roughly its own table plus its readers. This matters more at 30 datasets than at 6."
    - "FAILS LOUDLY. An in-scope check that went missing refuses the run, the same treatment the left-out reconciliation gives a disagreement (REQ-PIPE-115 criterion 17), because an absent check reads like a pass."
    - "NO NEW DEPENDENCY and no version pin. dbt's node selection, Soda's handed checks text and datacontract-cli 1.2.0's own `schema_name`/`quality_ids` options are all in the installed versions (checked 2026-10-11)."
    - "SUPPLY ROWS stay where they are: the tools read the run's view schema exactly as today, and nothing on a read-committed-history path gains any access."
    - "COST. Less compute per arrival. That carries over to the per-arrival Lambda shape in plans/wider.md's AWS MVP, where every second of tool time is paid for per arrival."
    - "CI: changes qa_tools/, so REQ-TEST-117's cache key misses once, as intended."
  dependencies: []
  decisions:
    - "PREMISE VERIFIED AGAINST THE CODE, 2026-10-11. dbt: run_dbt_cp selects all six stg_cp_* models plus the three singular tests, so every CP test runs (61 nodes, as REQ-PIPE-157's spike counted). Soda: run_soda_cp hands the whole checks file, less only unreadable tables (readable_checks_yaml). datacontract-cli: run_against_warehouse tests the whole contract. The results writer then cuts every tool's results down to the run's own dataset plus the cross-table checks that read its table (_scope_to_run, REQ-PIPE-105 criterion 11). A reader's result lands in the _cross-table scope, which is why the database shows one dataset per run in scope 'dataset'."
    - "WHAT A RUN'S SCOPE ACTUALLY HOLDS, counted from the check declarations 2026-10-11. Of Child Protection's 55 dbt checks, a run records own plus readers. That is 11+4 for clients, 12+1 for notifications, 11+1 for investigations, 10+0 for placements, 6+2 for carers and 5+2 for case workers. Soda (60) and datacontract-cli (62) are in the same proportions. So roughly a fifth of the evaluation is kept. The rest is computed and thrown away."
    - "THE SAVING IS SMALLER THAN THE HALVING #65 SUGGESTED. This is an estimate, not a measurement. First, every tool has a fixed per-run cost that does not shrink: dbt's partial parse and schema set-up, datacontract-cli's contract resolution (0.21-0.46s) and Soda's checks parse (0.17-0.25s). Second, our own steps (~1.3-1.6s an arrival) do not shrink at all. Third, dbt runs beside the other three, so an arrival costs whichever half is slower. A rough per-arrival figure after all three tools are scoped is dbt ~1.5-2s beside ~2-2.5s for the rest, plus ~1.3s, which is ~3.4s against ~5.5s. That puts Child Protection near 6 minutes and the whole bootstrap near 6, not under 5. Criterion 11 is therefore open question 1."
    - "BOTH HALVES OF beside() HAVE TO SHRINK. Scoping dbt alone moves the critical path onto Soda + datacontract-cli + Evidently (~3.5s), which saves only about a second an arrival. That is why the tools are split into three requirements, each worth little alone, and the target sits here rather than on any one of them."
    - "'THE TOOLS CANNOT BE ASKED FOR A SUBSET' IS WRONG for the installed versions. REQ-PIPE-121's decision on readers-only runs says so, and so does the comment in run_datacontract_cp.py. But dbt takes an explicit selection, Soda is already handed an edited checks text, and datacontract-cli 1.2.0's DataContract() takes schema_name (one model) and quality_ids. When this is built, mark that REQ-PIPE-121 decision superseded rather than leave two claims standing."
    - "READERS-ONLY RUNS GAIN MOST. Today a knock-on re-evaluation runs all four tools over the whole collection to keep a handful of checks (REQ-PIPE-121's decision on readers-only runs). Under criterion 3 it asks for only those checks."
    - "THE WRITER'S FILTER STAYS (criterion 7). REJECTED: removing it once the tools are scoped. If a tool is asked for too much, the result is extra work with the same records. Without the filter, it would change the records."
    - "THE MISSING-CHECK GUARD IS NEW, AND NEEDED ONLY BECAUSE OF THIS CHANGE (criterion 6). Today every check is asked for, so the only way to lose one is a tool leaving it out, which the left-out reconciliation already covers. Once each run asks for a computed subset, a wrong subset becomes a new way to lose a check. dbt would then simply produce no result, which reads exactly like a pass."
    - "REJECTED: a hand-kept list per table of which checks its run needs. That would be a second implementation of 'which checks touch this table', which REQ-PIPE-121 and REQ-PIPE-140 both forbid."
    - "REJECTED: dropping sibling views from the run schema so the tools skip the siblings' checks. Cross-table checks read those views (criterion 5), and a missing view is how a held table is signalled today, which would turn every sibling into a not-evaluated record."
    - "OUT OF SCOPE: our own dataset_stats step. It reads all six tables, but what it reads is recorded in qa.dataset_stats, which the equivalence snapshot compares, and it is cheap. Also out of scope: Evidently, at ~0.2s a run, already evaluates only the volume and PSI checks that apply."
    - "NOT A RE-PROPOSAL OF REQ-PIPE-161, which Keith declined on 2026-10-06 as too risky. That draft handed datacontract-cli a contract resolved once per process and reused across runs. This requirement changes what each run asks for, not how often anything is parsed. One of REQ-PIPE-190's options does touch the same seam, though (the contract text handed to the tool), so it goes to Keith as a question rather than being assumed."
    - "NOT the other lever #65 names, running different datasets' chains side by side. That changes the order work happens in. This changes how much work there is. Keep them separate so each can be proven identical on its own."
  open_questions:
    - "PROVISIONAL, criterion 11: the estimate says scoping lands near 6 minutes, not under 5. Keep under 5 here, and widen this to take in the smaller per-arrival costs #65 lists (config_yaml.parse called 53,068 times, _declared_reads re-collected 402 times)? Or set this requirement's target at what scoping alone can reach, with under 5 staying #65's goal? Or measure first and set the number afterwards?"
    - "PROVISIONAL, criterion 6: when an in-scope check goes missing, should the run be refused and the batch stopped, as the left-out reconciliation does (Keith, 2026-10-04)? Or should the check be recorded red and not evaluated, with the run carrying on, as Soda's unreported checks are?"
    - "Each tool's raw output (qa.tool_output.raw_output, not compared by equiv_support) will now cover only what the run asked for, so a Child Protection run's dbt output will no longer show five sibling tables' tests. Is that acceptable as it is, given qa.run already records the run's scope? Or should the run also record the check ids each tool was asked for, so that a reader years later can see why the output is narrower?"

- id: REQ-PIPE-189
  title: dbt builds only the tests inside a run's scope, and the models they read
  date_written: "2026-10-11"
  story: "As someone regenerating or processing QA history, I want dbt to run only the tests a run will record, building just the staging models those tests read, so that dbt stops spending most of each Child Protection run on tests whose results are thrown away."
  moscow: should
  status: not_started
  source: "Keith, plans/running-thoughts.md #65 (scoped 2026-10-06; the finding profiled 2026-10-11 evening). Drafted by delivery-scoper 2026-10-11, split out of REQ-PIPE-188 per tool."
  acceptance_criteria:
    - "WHEN a run evaluates dbt, THE SYSTEM SHALL run only the tests inside the run's scope (REQ-PIPE-188 criterion 1), and build the staging model of every table those tests read."
    - "THE SYSTEM SHALL NOT run a test outside the run's scope because a model it depends on was built for a test inside it."
    - "IF a table a scoped test reads has no view, whether held, contested with nothing promoted or absent, THEN THE SYSTEM SHALL leave out every scoped test that depends on it, as exclude_unreadable does today, and report those tests to the left-out reconciliation (REQ-PIPE-115 criterion 17)."
    - "THE SYSTEM SHALL apply the audit-table re-count (_AUDIT_AGGREGATE_SQL) and the failing-sample capture to every scoped test exactly as today."
    - "THE SYSTEM SHALL keep using the long-lived dbt worker and its partial parse (REQ-PIPE-157), and SHALL NOT bring back a full parse per run by varying anything parse-relevant per run."
    - "THE SYSTEM SHALL record the same filings, decisions, verdicts and supply tables from a full bootstrap from empty as the commit before this change, compared by tests/equiv_support.snapshot with only the columns it already excludes allowed to differ."
    - "THE SYSTEM SHALL report dbt's mean time per Child Protection run over a full bootstrap from empty, before and after, on the same machine on the same day."
  non_functional_requirements:
    - "The selection is computed from check ids through the existing node-to-check-id lookup (_check_id_for), never from a list of node names kept by hand."
    - "dbt's own DAG still decides what an unreadable model takes with it (dbt_common.exclude_unreadable's docstring), because this project does not keep a copy of the DAG."
  dependencies:
    - REQ-PIPE-188
  decisions:
    - "WHY dbt FIRST: it is the larger half of beside() at 4.6s an arrival, measured in its own worker process, so that figure is not inflated by the profiler. Of the node phase (~3.0-3.8s for 61 nodes, REQ-PIPE-157's measurements), the 55 tests are most of it. The six models are views (dbt_project.yml), so building a sibling model costs little."
    - "HOW dbt IS TOLD, deliberately NOT settled here and left for the build. Two candidates are an explicit list of test nodes plus the models they read with indirect selection turned off, and model selection with dbt's own indirect-selection modes. Which of them dbt 1.12 honours with the worker's partial parse, without re-parsing, is a fact to establish against the installed package, as REQ-PIPE-157's spike did. It is not something to assume."
    - "REJECTED: leaving a sibling's tests in so the node count stays stable for dbt. Under the worker, the selection is an invocation argument, not a parse input. If it turns out to invalidate the partial parse, that is a measurement to bring back, not a reason to keep the waste."
  open_questions: []

- id: REQ-PIPE-190
  title: datacontract-cli tests only the rules and checks inside a run's scope
  date_written: "2026-10-11"
  story: "As someone regenerating or processing QA history, I want datacontract-cli to test only the rules a run will record, so that the second half of each run stops spending most of its time on sibling tables' rules whose results are thrown away."
  moscow: should
  status: not_started
  source: "Keith, plans/running-thoughts.md #65 (scoped 2026-10-06; the finding profiled 2026-10-11 evening). Drafted by delivery-scoper 2026-10-11, split out of REQ-PIPE-188 per tool."
  acceptance_criteria:
    - "WHEN a run evaluates datacontract-cli, THE SYSTEM SHALL have it test only the quality rules and built-in checks inside the run's scope (REQ-PIPE-188 criterion 1)."
    - "THE SYSTEM SHALL test each scoped rule exactly as the committed contract writes it, and SHALL NOT alter any rule's SQL, threshold, severity or check id to scope a run."
    - "IF a scoped rule reads a table the run cannot read, THEN THE SYSTEM SHALL leave it out and report it to the left-out reconciliation, as today."
    - "THE SYSTEM SHALL record the same filings, decisions, verdicts and supply tables from a full bootstrap from empty as the commit before this change, compared by tests/equiv_support.snapshot with only the columns it already excludes allowed to differ."
    - "THE SYSTEM SHALL report datacontract-cli's mean time per Child Protection run over a full bootstrap from empty, before and after, on the same machine on the same day, measured without a profiler."
  non_functional_requirements:
    - "datacontract-cli stays in-process and in the same thread as Soda and Evidently (REQ-TEST-116's decision on running dbt beside the other three)."
    - "Credentials still reach the tool only through its `config=` argument, never in the contract text (datacontract_common.run_against_warehouse)."
  dependencies:
    - REQ-PIPE-188
  decisions:
    - "VERIFIED IN THE INSTALLED SOURCE (datacontract-cli 1.2.0, engines/data_contract_test.py, 2026-10-11). `schema_name` limits a test to ONE model. `quality_ids` keeps only quality rules whose ODCS `id` matches, and drops every built-in schema check while it does. It also raises on an id it cannot find. The Child Protection contract's quality rules carry their check id in customProperties, not as an ODCS `id`. And a run's scope spans its own model plus reader rules on other models."
    - "WHY THIS IS WORTH DOING DESPITE BEING SMALLER: datacontract-cli is the largest part of the beside() half that is not dbt. #65's 3.1s an arrival was inflated by the profiler. Its checks are ~1.5s of it, the rest being resolution (0.21-0.46s) and a JSON-schema check. Without this, scoping dbt alone moves the critical path rather than shortening it (REQ-PIPE-188's decision on both halves of beside())."
  open_questions:
    - "PROVISIONAL, the mechanism behind criterion 1. Option (a) uses the tool's own options: add an ODCS `id` to every quality rule in both contracts (a configuration change), then call with schema_name for the own model and quality_ids for reader rules on other models. That is two invocations where readers exist. Option (b) hands datacontract-cli a copy of the contract with out-of-scope models and rules removed. That is the same seam run_against_warehouse already uses to append the server, and the same seam the declined REQ-PIPE-161 touched. Option (c) leaves datacontract-cli unscoped this round."

- id: REQ-PIPE-191
  title: Soda scans only the checks inside a run's scope
  date_written: "2026-10-11"
  story: "As someone regenerating or processing QA history, I want Soda Core handed only the checks a run will record, so that the second half of each run stops scanning sibling tables whose results are thrown away."
  moscow: could
  status: not_started
  source: "Keith, plans/running-thoughts.md #65 (scoped 2026-10-06; the finding profiled 2026-10-11 evening). Drafted by delivery-scoper 2026-10-11, split out of REQ-PIPE-188 per tool."
  acceptance_criteria:
    - "WHEN a run evaluates Soda Core, THE SYSTEM SHALL hand the scan only the checks inside the run's scope (REQ-PIPE-188 criterion 1), removing the others from the checks text by check id, as readable_checks_yaml already removes checks over unreadable tables."
    - "THE SYSTEM SHALL keep recording as red and not evaluated every handed check the scan did not report (unreported_checks), and SHALL NOT count a check outside the run's scope as unreported."
    - "THE SYSTEM SHALL record the same filings, decisions, verdicts and supply tables from a full bootstrap from empty as the commit before this change, compared by tests/equiv_support.snapshot with only the columns it already excludes allowed to differ."
    - "THE SYSTEM SHALL report Soda's mean time per Child Protection run over a full bootstrap from empty, before and after, on the same machine on the same day, measured without a profiler."
  non_functional_requirements:
    - "Soda keeps its own `.env` reload behaviour contained, as today (plans/tooling.md #26). Nothing here changes how the scan is configured, only which checks it is handed."
  dependencies:
    - REQ-PIPE-188
  decisions:
    - "THE SMALLEST OF THE THREE, hence could rather than should. Soda is ~1.4s an arrival under the profiler, of which parsing the checks (0.17-0.25s without a profiler, REQ-PIPE-161's re-measure) and dumping check definitions do not shrink. The queries (~0.46s) and much of the result handling do. Kept separate so Keith can take dbt and datacontract-cli without it."
    - "THE MECHANISM EXISTS: readable_checks_yaml already edits the SodaCL text per run, and unreported_checks already compares against what was handed rather than against the whole file. So this extends a working seam rather than adding one."
  open_questions: []
