# SCRIPTED PERSON DECISIONS, played back into the synthetic history
# (REQ-GEN-135). Configuration, reviewed like the injection table: each
# names its scenario and which of that scenario's recorded supplies it acts
# on (by index - never a generated id), and takes effect `after_hours` after
# that supply was received. Raised through the one decision path as the
# synthetic person in contract/people.yaml, only on a synthetic asset, and a
# refusal stops the replay. `mothman scenarios validate` gates it in CI.
#
decisions:
  - scenario: TS-47
    operation: mark-not-supplied
    dataset: birth-registrations
    supply: 0
    after_hours: 2
    names_supply: false
    period_from: placement
    reason: "The supplier's file for this day arrived the next morning and filled that day instead; this day was not supplied."
  # REQ-GEN-185 criterion 7: TS-43's held amber is promoted by a person, so the
  # gap it opens is closed before the next day's supply is measured. FIVE
  # HOURS, so it comes after the rule has held it: a replayed rule decision
  # lands within the 4-hour claim window (promotion.effective_at_for).
  - scenario: TS-43
    operation: promote
    dataset: birth-registrations
    supply: 0
    after_hours: 5
    reason: "Facility details missing on more registrations than usual, explained by the supplier; accepted for this day."
  # REQ-GEN-137 criterion 4: TS-45's promoted amber is acknowledged by a person,
  # five hours after it arrived - after the rule has promoted it.
  - scenario: TS-45
    operation: acknowledge
    dataset: birth-registrations
    supply: 0
    after_hours: 5
    reason: "Second-parent names missing on more registrations than usual; checked with the supplier, expected for this day."
