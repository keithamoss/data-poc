      warn: when < 150
      fail:
        when < 50
        when > 1000

  - missing_count(carer_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - duplicate_count(carer_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - missing_count(given_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(family_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - invalid_percent(carer_type):
      valid values: ["Kinship", "Foster", "Residential-staff"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - invalid_percent(approval_status):
      valid values: ["Approved", "Provisional", "Under review"]
