# SodaCL checks for the Child Protection Casework collection - the
# relationships + cross-table business rules half of Phase 2 (see
# plans/wider.md action 2 and contract/child-protection-contract.yaml's
# matching ODCS quality rules, which cover the same 7 FKs and 3 business
# rules in the contract-native vocabulary).
#
# Real SodaCL syntax, confirmed by actually running `soda scan` against a
# real per-run CP warehouse (qa_tools/cp/build_cp_warehouses.py), not just
# written to look plausible - the two real tokens this file leans on:
#   - a reference check: `values in (<fk column>) must exist in <parent
#     table> (<parent column>)` - soda's own dedicated FK check type.
#   - a `failed rows` check with a nested `fail query:` - the rows a full
#     SQL query returns ARE the failing rows, which is what a cross-table
#     business rule needs (a reference check only ever compares one
#     column to one other column).
# One real gotcha, found by actually running this (not visible from the
# SodaCL docs alone): plain YAML forbids two top-level `checks for <table>:`
# keys for the same table in one file - a later duplicate silently replaces
# the earlier one before Soda ever parses it. Each table's checks (row
# count, FK references, business rule) are combined into one block below
# rather than split by "kind of check" the way this repo's comments might
# otherwise group them.
#
# Usage: the pipeline runs this via Soda's Python Scan API, one scan per
# run (qa_tools/cp/run_soda_cp.py - see its docstring for why one per
# run). A direct `soda scan` CLI invocation would need its own
# data-source config YAML pointed at a specific per-run warehouse file -
# not kept in this repo since the CLI path isn't actually used here.
#
# Every check below carries an `attributes:` block with check-lifecycle
# metadata (check_id/introduced_date/description/changelog) - plans/
# publishing-and-history.md Thread D, Phase 1. Relationship/business-rule
# checks here are deliberately given a `_soda`-suffixed check_name -
# the ODCS contract implements the same 7 FKs and 3 business rules in
# its own vocabulary, and a real collision was found (and fixed) between
# Soda's and the contract's identically-named checks on the BDM side
# before this suffix convention was adopted - applied proactively here.

checks for cp_clients:
  - row_count:
      warn: when < 300
      fail:
        when < 100
        when > 2000
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.row_count_soda
        introduced_date: "2023-01-15"
        description: "Client row count should stay in a plausible band."
        changelog: []

  # --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) ---------
  # Every check below already exists in the ODCS contract's cp_clients
  # quality block; postcode's invalid-value check and the date_of_birth
  # range check (further down) were previously the ONLY column-level
  # checks in this whole table - added here so Soda implements the full
  # rule set, not just the hand-picked demo checks.
  - missing_count(cp_client_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.cp_client_id.missing_count_soda
        introduced_date: "2023-01-15"
        description: "Every client record must carry a client ID."
        changelog: []

  - duplicate_count(cp_client_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.cp_client_id.duplicate_count_soda
        introduced_date: "2023-01-15"
        description: "Client IDs must not be duplicated."
        changelog: []

  - missing_count(given_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.given_name.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A client's given name must be recorded."
        changelog: []

  - missing_count(family_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.family_name.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A client's family name must be recorded."
        changelog: []

  - missing_count(date_of_birth):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.date_of_birth.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A client record must carry a date of birth."
        changelog: []

  - invalid_percent(sex):
      valid values: [M, F, X]
      warn: when > 0%
      fail: when > 2%
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.sex.invalid_percent_soda
        introduced_date: "2023-01-15"
        description: "Sex must be one of the closed value set M, F, or X."
        changelog: []

  - missing_count(suburb):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.suburb.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A client's suburb must be recorded."
        changelog: []

  - missing_count(case_opened_date):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.case_opened_date.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A client record must carry the date its case was opened."
        changelog: []

  # Closed value set - the same postcode pool paired with
  # generator/names_au.py's SUBURBS - see the ODCS contract's matching
  # rule (previously no invalid-value check on this column at all).
  - invalid_percent(postcode):
      valid values: ["6007", "6008", "6014", "6018", "6019", "6027", "6028", "6030", "6035", "6036", "6050", "6056", "6061", "6062", "6064", "6069", "6100", "6102", "6107", "6109", "6110", "6112", "6122", "6148", "6151", "6155", "6160", "6162", "6163", "6164", "6167", "6168", "6171", "6210", "6215", "6225", "6230", "6258", "6280", "6285", "6312", "6330", "6401", "6430", "6450", "6530", "6714", "6721", "6725"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.postcode.invalid_percent_soda
        introduced_date: "2023-01-15"
        description: "Postcode must be one of the closed value set paired with the suburb reference pool."
        changelog: []

  - missing_count(postcode):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.postcode.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A client's postcode must be recorded."
        changelog: []

  # Out-of-range date_of_birth - a "failed rows" check (not invalid_count/
  # valid min, which reject a bare date bound as a numeric parse error in
  # this Soda version - confirmed empirically) with a count-based amber/
  # red band, so "creeping past a handful" reads as the real signal,
  # matching Keith's own framing when this was scoped: up to 10 bad dates
  # is tolerable amber noise, meaningfully more is a real problem. New
  # check - generator/dirty.py's apply_cp_clients_presets is what makes
  # this fail on amber/red runs (clean runs never produce an out-of-range
  # date_of_birth by construction).
  - failed rows:
      name: date_of_birth out of range
      fail query: |
        SELECT cp_client_id FROM cp_clients WHERE date_of_birth < DATE '1900-01-01'
      warn: when > 10
      fail: when > 20
      # Explicit high ceiling, not reliance on Soda's own (documented,
      # unfixed) bug that "failed rows" checks ignore samples limit
      # entirely (GitHub sodadata/soda-core#1985 - see plans/qa-
      # pipeline.md #29's correction). Same rationale on all 4 "failed
      # rows" checks in this file.
      samples limit: 100000
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.date_of_birth.range_check_soda
        introduced_date: "2023-01-15"
        description: "Date of birth must not be implausibly old."
        changelog: []

