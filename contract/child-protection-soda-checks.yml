# SodaCL checks for the Child Protection Casework collection - the
# relationships + cross-table business rules half of Phase 2 (see
# plans/wider.md action 2 and contract/child-protection-contract.yaml's
# matching ODCS quality rules, which cover the same 7 FKs and 3 business
# rules in the contract-native vocabulary).
#
# Real SodaCL syntax, confirmed by actually running `soda scan` against a
# real per-run CP warehouse (qa_tools/cp/build_cp_warehouses.py), not just
# written to look plausible - the two real tokens this file leans on:
#   - a reference check: `values in (<fk column>) must exist in <parent
#     table> (<parent column>)` - soda's own dedicated FK check type.
#   - a `failed rows` check with a nested `fail query:` - the rows a full
#     SQL query returns ARE the failing rows, which is what a cross-table
#     business rule needs (a reference check only ever compares one
#     column to one other column).
# One real gotcha, found by actually running this (not visible from the
# SodaCL docs alone): plain YAML forbids two top-level `checks for <table>:`
# keys for the same table in one file - a later duplicate silently replaces
# the earlier one before Soda ever parses it. Each table's checks (row
# count, FK references, business rule) are combined into one block below
# rather than split by "kind of check" the way this repo's comments might
# otherwise group them.
#
# Usage: the pipeline runs this via Soda's Python Scan API, one scan per
# run (qa_tools/cp/run_soda_cp.py - see its docstring for why one per
# run). A direct `soda scan` CLI invocation would need its own
# data-source config YAML pointed at a specific per-run warehouse file -
# not kept in this repo since the CLI path isn't actually used here.

checks for cp_clients:
  - row_count:
      warn: when < 300
      fail:
        when < 100
        when > 2000

  # --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) ---------
  # Every check below already exists in the ODCS contract's cp_clients
  # quality block; postcode's invalid-value check and the date_of_birth
  # range check (further down) were previously the ONLY column-level
  # checks in this whole table - added here so Soda implements the full
  # rule set, not just the hand-picked demo checks.
  - missing_count(cp_client_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - duplicate_count(cp_client_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - missing_count(given_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(family_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(date_of_birth):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - invalid_percent(sex):
      valid values: [M, F, X]
      warn: when > 0%
      fail: when > 2%
      samples limit: 5

  - missing_count(suburb):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(case_opened_date):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  # Closed value set - the same postcode pool paired with
  # generator/names_au.py's SUBURBS - see the ODCS contract's matching
  # rule (previously no invalid-value check on this column at all).
  - invalid_percent(postcode):
      valid values: ["6007", "6008", "6014", "6018", "6019", "6027", "6028", "6030", "6035", "6036", "6050", "6056", "6061", "6062", "6064", "6069", "6100", "6102", "6107", "6109", "6110", "6112", "6122", "6148", "6151", "6155", "6160", "6162", "6163", "6164", "6167", "6168", "6171", "6210", "6215", "6225", "6230", "6258", "6280", "6285", "6312", "6330", "6401", "6430", "6450", "6530", "6714", "6721", "6725"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - missing_count(postcode):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  # Out-of-range date_of_birth - a "failed rows" check (not invalid_count/
  # valid min, which reject a bare date bound as a numeric parse error in
  # this Soda version - confirmed empirically) with a count-based amber/
  # red band, so "creeping past a handful" reads as the real signal,
  # matching Keith's own framing when this was scoped: up to 10 bad dates
  # is tolerable amber noise, meaningfully more is a real problem. New
  # check - generator/dirty.py's apply_cp_clients_presets is what makes
  # this fail on amber/red runs (clean runs never produce an out-of-range
  # date_of_birth by construction).
  - failed rows:
      name: date_of_birth out of range
      fail query: |
        SELECT cp_client_id FROM cp_clients WHERE date_of_birth < DATE '1900-01-01'
      warn: when > 10
      fail: when > 20

checks for cp_notifications:
  - row_count:
      warn: when < 600
      fail:
        when < 200
        when > 3000

  # --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) ---------
  # Every check below already exists in the ODCS contract's cp_notifications
  # quality block, previously implemented nowhere but the contract -
  # concern_type in particular is this collection's own "traffic light
  # demo column" (dirty.py injects bad values into it specifically), yet
  # had no Soda check at all until now.
  - missing_count(notification_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - duplicate_count(notification_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - missing_count(cp_client_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(notification_date):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - invalid_percent(source_type):
      valid values: ["School", "Police", "Health service", "Family member", "Neighbour", "Anonymous", "Self-report"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - invalid_percent(concern_type):
      valid values: ["Neglect", "Physical abuse", "Emotional abuse", "Sexual abuse", "Domestic violence exposure", "Parental substance use", "Parental mental health concern"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - invalid_percent(risk_rating):
      valid values: ["Low", "Medium", "High", "Critical"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - missing_count(assigned_worker_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - invalid_percent(outcome):
      valid values: ["No further action", "Referred to family support", "Investigation opened"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  # --- 2 of the 7 real foreign-key relationships (the rest are on the ---
  # other tables' blocks below). All pass on every run, dirty or clean, on
  # this fixture - generator/dirty.py only ever touches cp_notifications'
  # concern_type/notification_id columns, never the FK columns themselves.
  # Kept as real checks anyway: the same genuine backstop against a
  # dropped join or truncated parent-table extract that
  # child-protection-contract.yaml's matching SQL rules explain in more
  # depth.
  - values in (cp_client_id) must exist in cp_clients (cp_client_id):
      samples limit: 5
  - values in (assigned_worker_id) must exist in cp_case_workers (worker_id):
      samples limit: 5

  # --- Business rule 1 of 3: escalation completeness ---------------------
  - failed rows:
      name: Escalation completeness
      fail query: |
        SELECT n.notification_id
        FROM cp_notifications n
        LEFT JOIN cp_investigations i ON n.notification_id = i.notification_id
        WHERE n.outcome = 'Investigation opened' AND i.investigation_id IS NULL
      # 0/0 on clean runs (cp_investigations is only ever built from
      # notifications with this exact outcome) - genuinely catches the
      # dirty(amber/red) near-duplicate notifications
      # apply_cp_notifications_presets injects, since each duplicate keeps
      # its source row's outcome but gets a perturbed notification_id that
      # cp_investigations never references. Confirmed for real: 0 clean,
      # 2-3 amber, 6 on the red run - same numbers
      # child-protection-contract.yaml's matching rule found.

checks for cp_investigations:
  # --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) ---------
  - missing_count(investigation_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - duplicate_count(investigation_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - missing_count(notification_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(cp_client_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(lead_worker_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(start_date):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - invalid_percent(substantiated):
      valid values: ["Substantiated", "Not substantiated", "Inconclusive"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - values in (notification_id) must exist in cp_notifications (notification_id):
      samples limit: 5
  - values in (cp_client_id) must exist in cp_clients (cp_client_id):
      samples limit: 5
  - values in (lead_worker_id) must exist in cp_case_workers (worker_id):
      samples limit: 5

  # --- Business rule 2 of 3: closed-case investigation hygiene -----------
  - failed rows:
      name: Closed-case investigation hygiene
      fail query: |
        SELECT i.investigation_id
        FROM cp_investigations i
        JOIN cp_clients c ON i.cp_client_id = c.cp_client_id
        WHERE c.case_status = 'Closed' AND i.end_date IS NULL
      # Passes 0/0 on every clean run - child_protection.py only ever
      # marks a case Closed once none of that client's investigations are
      # still open. dirty.py's apply_cp_investigations_presets (amber/red
      # only) reopens a controlled number to demonstrate a real violation:
      # 0 clean, 1-3 amber, 6 on the red run. See child-protection-
      # contract.yaml's matching rule and plans/qa-pipeline.md #9 for the
      # fuller account (this rule used to always fail - fixed, not hidden).

checks for cp_placements:
  # --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) ---------
  - missing_count(placement_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - duplicate_count(placement_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - missing_count(cp_client_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - invalid_percent(placement_type):
      valid values: ["Kinship care", "Foster care", "Residential care", "Family group home"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - missing_count(carer_id):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(placement_start):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(placement_suburb):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - values in (cp_client_id) must exist in cp_clients (cp_client_id):
      samples limit: 5
  - values in (carer_id) must exist in cp_carers (carer_id):
      samples limit: 5

  # --- Business rule 3 of 3: placement/carer approval compliance ---------
  - failed rows:
      name: Placement/carer approval compliance
      fail query: |
        SELECT p.placement_id
        FROM cp_placements p
        JOIN cp_carers c ON p.carer_id = c.carer_id
        WHERE c.approval_status != 'Approved'
      # Passes 0/0 on every clean run - child_protection.py only ever
      # assigns an Approved carer to a placement. dirty.py's
      # apply_cp_placements_presets (amber/red only) reassigns a
      # controlled number to a non-Approved carer to demonstrate a real
      # violation: 0 clean, 3 amber, 17 on the red run. See
      # child-protection-contract.yaml's matching rule and
      # plans/qa-pipeline.md #9 for the fuller account (this rule used to
      # always fail - fixed, not hidden).

# --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) -------------
# cp_carers and cp_case_workers previously had NO "checks for" block at
# all in this file - the biggest single gap found auditing this contract
# against Soda/dbt (both tables' contract-defined rowCount/nullValues/
# invalidValues rules were implemented nowhere but the contract itself).
