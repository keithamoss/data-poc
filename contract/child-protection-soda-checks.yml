        description: "The carer_id must reference a real, existing carer record."
        changelog: []

  # --- Business rule 3 of 3: placement/carer approval compliance ---------
  - failed rows:
      name: Placement/carer approval compliance
      fail query: |
        SELECT p.placement_id
        FROM cp_placements p
        JOIN cp_carers c ON p.carer_id = c.carer_id
        WHERE c.approval_status != 'Approved'
      # Passes 0/0 on every clean run - child_protection.py only ever
      # assigns an Approved carer to a placement. dirty.py's
      # apply_cp_placements_presets (amber/red only) reassigns a
      # controlled number to a non-Approved carer to demonstrate a real
      # violation: 0 clean, 3 amber, 17 on the red run. See
      # child-protection-contract.yaml's matching rule and
      # plans/qa-pipeline.md #9 for the fuller account (this rule used to
      # always fail - fixed, not hidden).
      # Explicit high ceiling - see escalation completeness's own comment
      # above for why (GitHub sodadata/soda-core#1985).
      samples limit: 100000
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-placements.stg_cp_placements.carer_id.approval_compliance_soda
        introduced_date: "2023-01-15"
        description: "A placement's carer must have Approved status."
        changelog: []

# --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) -------------
# cp_carers and cp_case_workers previously had NO "checks for" block at
# all in this file - the biggest single gap found auditing this contract
# against Soda/dbt (both tables' contract-defined rowCount/nullValues/
# invalidValues rules were implemented nowhere but the contract itself).
checks for cp_carers:
  - row_count:
      warn: when < 150
      fail:
        when < 50
        when > 1000
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-carers.stg_cp_carers.row_count_soda
        introduced_date: "2023-01-15"
        description: "Carer row count should stay in a plausible band."
        changelog: []

  - missing_count(carer_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-carers.stg_cp_carers.carer_id.missing_count_soda
        introduced_date: "2023-01-15"
        description: "Every carer record must carry a carer ID."
        changelog: []

  - duplicate_count(carer_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-carers.stg_cp_carers.carer_id.duplicate_count_soda
        introduced_date: "2023-01-15"
        description: "Carer IDs must not be duplicated."
        changelog: []

  - missing_count(given_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-carers.stg_cp_carers.given_name.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A carer's given name must be recorded."
        changelog: []

  - missing_count(family_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-carers.stg_cp_carers.family_name.missing_count_soda
        introduced_date: "2023-01-15"
        description: "A carer's family name must be recorded."
        changelog: []

  - invalid_percent(carer_type):
      valid values: ["Kinship", "Foster", "Residential-staff"]
