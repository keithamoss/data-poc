      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.outcome.invalid_percent_soda
        introduced_date: "2023-01-15"
        description: "Notification outcome must be one of the closed value set."
        changelog: []

  # --- 2 of the 7 real foreign-key relationships (the rest are on the ---
  # other tables' blocks below). Pass 0/0 on every CLEAN run always -
  # child_protection.py's own generation logic never produces a dangling
  # FK by construction. On amber/red runs, plans/qa-pipeline.md #27's
  # dangling-FK pass (2026-09-15) means these can now genuinely fail too:
  # generator/dirty.py's apply_cp_notifications_presets reassigns a
  # fraction of cp_client_id/assigned_worker_id to an ID that doesn't
  # exist in cp_clients/cp_case_workers at all - a real backstop against
  # a dropped join or truncated parent-table extract, not just a check
  # that child-protection-contract.yaml's matching SQL rules describe in
  # theory but nothing ever exercises.
  - values in (cp_client_id) must exist in cp_clients (cp_client_id):
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.cp_client_id.relationships_soda
        introduced_date: "2023-01-15"
        description: "A notification's client_id must reference a real, existing client record."
        changelog: []
  - values in (assigned_worker_id) must exist in cp_case_workers (worker_id):
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.assigned_worker_id.relationships_soda
        introduced_date: "2023-01-15"
        description: "The assigned worker_id must reference a real, existing case worker record."
        changelog: []

  # --- Business rule 1 of 3: escalation completeness ---------------------
  - failed rows:
      name: Escalation completeness
      fail query: |
        SELECT n.notification_id
        FROM cp_notifications n
        LEFT JOIN cp_investigations i ON n.notification_id = i.notification_id
        WHERE n.outcome = 'Investigation opened' AND i.investigation_id IS NULL
      # 0/0 on clean runs (cp_investigations is only ever built from
      # notifications with this exact outcome) - genuinely catches the
      # dirty(amber/red) near-duplicate notifications
      # apply_cp_notifications_presets injects, since each duplicate keeps
      # its source row's outcome but gets a perturbed notification_id that
      # cp_investigations never references. Confirmed for real: 0 clean,
      # 2-3 amber, 6 on the red run - same numbers
      # child-protection-contract.yaml's matching rule found.
      # Explicit high ceiling, not reliance on Soda's own (documented,
      # unfixed) bug that "failed rows" checks ignore samples limit
      # entirely (GitHub sodadata/soda-core#1985 - see plans/qa-
      # pipeline.md #29's correction).
      samples limit: 100000
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.notification_id.escalation_completeness_soda
        introduced_date: "2023-01-15"
        description: "Every notification with outcome 'Investigation opened' must have a matching investigation record."
        changelog: []

