        description: "Carer type must be one of the closed value set."
        changelog: []

  - invalid_percent(approval_status):
      valid values: ["Approved", "Provisional", "Under review"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-carers.stg_cp_carers.approval_status.invalid_percent_soda
        introduced_date: "2023-01-15"
        description: "Approval status must be one of the closed value set."
        changelog: []

