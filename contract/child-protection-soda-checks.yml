  # --- Business rule 2 of 3: closed-case investigation hygiene -----------
  - failed rows:
      name: Closed-case investigation hygiene
      fail query: |
        SELECT i.investigation_id
        FROM cp_investigations i
        JOIN cp_clients c ON i.cp_client_id = c.cp_client_id
        WHERE c.case_status = 'Closed' AND i.end_date IS NULL
      # Passes 0/0 on every clean run - child_protection.py only ever
      # marks a case Closed once none of that client's investigations are
      # still open. dirty.py's apply_cp_investigations_presets (amber/red
      # only) reopens a controlled number to demonstrate a real violation:
      # 0 clean, 1-3 amber, 6 on the red run. See child-protection-
      # contract.yaml's matching rule and plans/qa-pipeline.md #9 for the
      # fuller account (this rule used to always fail - fixed, not hidden).
      # Explicit high ceiling - see escalation completeness's own comment
      # above for why (GitHub sodadata/soda-core#1985).
      samples limit: 100000
      attributes:
        check_id: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.investigation_id.closed_case_hygiene_soda
        introduced_date: "2023-01-15"
        description: "A closed case's investigations must all have an end date - none should still be open."
        changelog: []

