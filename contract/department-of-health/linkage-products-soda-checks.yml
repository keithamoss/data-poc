        reads_columns: ["geo_ed_presentations.id_1", "geo_ed_presentations.census_year", "geo_ed_presentations.match_level", "geo_ed_presentations.sa2_code"]
        category: conformity
        introduced_date: "2013-01-01"
        description: >
          A placed row must carry a Statistical Area Level 2 code in the agreed
          format, and an unplaced row none; one that breaks either fails.
        failure_indicates: >
          The geocoder released a code from the wrong classification, truncated
          one, or gave a code to a record it could not place.
        changelog: []
  - failed rows:
      name: LGA code in its format
      fail query: |
        SELECT id_1, census_year FROM geo_ed_presentations
        WHERE (match_level <> 'not geocoded'
               AND (lga_code IS NULL OR NOT regexp_like(CAST(lga_code AS TEXT), '^[0-9]{5}$')))
           OR (match_level = 'not geocoded'
               AND lga_code IS NOT NULL AND TRIM(CAST(lga_code AS TEXT)) <> '')
      samples limit: 100000
      attributes:
        check_id: data-asset-1.department-of-health.linkage-products.geo-ed-presentations.lga_code.invalid_count_soda
        reads_columns: ["geo_ed_presentations.id_1", "geo_ed_presentations.census_year", "geo_ed_presentations.match_level", "geo_ed_presentations.lga_code"]
        category: conformity
        introduced_date: "2013-01-01"
        description: >
          A placed row must carry a Local Government Area code in the agreed
          format, and an unplaced row none; one that breaks either fails.
        failure_indicates: >
          The geocoder released a code from the wrong classification, truncated
          one, or gave a code to a record it could not place.
        changelog: []

  # Against the source supply for the period (REQ-QAC-340): the orphan and
  # coverage pair, of Linkage Keys' two check kinds.
  - failed rows:
      name: Rows matching no source record
      fail query: |
        SELECT g.id_1, g.census_year FROM geo_ed_presentations g
        LEFT JOIN ed_presentations s ON CAST(s.presentation_id AS TEXT) = CAST(g.id_1 AS TEXT)
        WHERE s.presentation_id IS NULL
      samples limit: 100000
      attributes:
        check_id: data-asset-1.department-of-health.linkage-products.geo-ed-presentations.ed-presentations.referential_soda
        reads_columns: ["geo_ed_presentations.id_1", "geo_ed_presentations.census_year", "ed_presentations.presentation_id"]
        reads_tables: [ed_presentations]
        linked_dataset: ed-presentations
        linked_check: referential
        id_columns: [presentation_id]
        category: consistency
        introduced_date: "2013-01-01"
        description: >
          Every row must match a record in Emergency Department's ED Presentations for the same quarter;
          one that matches none fails.
        failure_indicates: >
          Either the geocoder misidentified a record or placed one it was never
          sent, or Emergency Department's ED Presentations supply for the quarter has lost or re-identified
          records since the geocoder was sent it.
        changelog: []
  - geo_ed_presentations_coverage_percent:
      geo_ed_presentations_coverage_percent query: |
        SELECT 100.0 * COUNT(g.id_1) / NULLIF(COUNT(*), 0)
        FROM ed_presentations s
        LEFT JOIN (SELECT DISTINCT CAST(id_1 AS TEXT) AS id_1 FROM geo_ed_presentations) g
          ON g.id_1 = CAST(s.presentation_id AS TEXT)
      warn: when < 100
      fail: when < 98
      attributes:
        check_id: data-asset-1.department-of-health.linkage-products.geo-ed-presentations.ed-presentations.coverage_soda
        reads_tables: [ed_presentations]
        linked_dataset: ed-presentations
        linked_check: coverage
        id_columns: [presentation_id]
        unit: percent
        direction: below
        category: completeness
        introduced_date: "2013-01-01"
        description: >
          Every record in Emergency Department's ED Presentations for the quarter must have at least one
          row in this release; fewer warns, and a larger shortfall fails.
        failure_indicates: >
          Either the geocoder left records out, or Emergency Department's ED Presentations supply for the
          quarter carries records added since the geocoder was sent it, or
          records with an empty identifier.
        changelog: []
