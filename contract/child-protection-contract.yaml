# Open Data Contract Standard (ODCS) v3.2.0 contract for the Child
# Protection Casework collection - six related tables, one contract,
# matching how a real "collection" (Agency -> Collection -> Dataset ->
# Column, per docs/data-contract-engines-landscape.md's QA reporting
# layers section) is genuinely one governed unit, not six independent
# datasets that happen to share a name.
#
# Phase 2 adds the seven real foreign-key relationships between these
# tables, plus three cross-table business rules (escalation completeness,
# placement/carer approval compliance, closed-case investigation hygiene) -
# all as `type: sql` rules on the child table, referencing the parent
# table's view by its literal name (datacontract-cli only substitutes
# `{model}` for the rule's OWN schema object; every other schema object's
# name is created as a real view/table on the same connection, so a
# literal join to it works - confirmed by actually running `datacontract
# test`, not assumed from the docs).
#
# Two of the three business rules are REAL FINDINGS, not bugs in these
# rules: child_protection.py (the generator) doesn't enforce them, so they
# fail at a stable, nonzero rate on every run, dirty or clean - see each
# rule's own description below and plans/qa-pipeline.md for the tracked
# follow-up. Left in and documented rather than quietly dropped or
# loosened, same practice as the dbt-duckdb bug in
# dbt_project/models/staging/schema.yml.
#
# Vocabulary matches contract/bdm-birth-registrations-contract.yaml exactly
# (metric: nullValues/invalidValues/duplicateValues/rowCount, the real
# dimension enum, apiVersion v3.2.0) - see that file's comments and
# README.md's known-disagreements section for why, found the hard way by
# actually running datacontract-cli against the birth-registrations
# contract first.

apiVersion: v3.2.0
kind: DataContract
id: child-protection-casework
status: draft
version: 1.0.0

name: Child Protection Casework Collection
domain: child-and-family-safety
description:
  purpose: >
    The Child Protection Casework collection: notifications received about
    a child, the investigations they may escalate to, the carer placements
    that may result, and the case workers and carers involved. Six related
    tables under one collection, with real foreign keys between them -
    unlike the single-table Birth Registrations feed, this is where the
    QA pipeline demonstrates whole-collection checks (see phase 2).

team:
  members:
    - role: dataOwner
      name: Department for Child Protection and Family Support
      username: cp-data-owner@example.gov.au  # placeholder - update before use
    - role: dataSteward
      username: cp-data-steward@example.gov.au  # placeholder - update before use
      description: Child Protection data governance contact - update with a real name/email before use
    - role: consumer
      name: Central multi-agency data asset
      username: multi-agency-data-asset@example.gov.au  # placeholder - update before use

support:
  - channel: email
    tool: email
    description: Child Protection data supply team - replace with a real contact before use

servers:
  - server: production
    type: s3
    location: s3://gov-data-exchange/child-protection/casework/
    format: csv
    delimiter: comma
    description: >
      Current delivery mechanism: a full periodic extract of the active
      casework collection, dropped into this bucket. No direct source
      connection yet.

schema:
  - name: cp_clients
    physicalType: table
    description: One row per child with a Child Protection casework history.
    properties:
      - name: cp_client_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        description: This agency's unique client identifier. Primary key of this table.
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
      - name: given_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: family_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: date_of_birth
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: sex
        logicalType: string
        physicalType: varchar(1)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["M", "F", "X"]
            mustBe: 0
            severity: error
      - name: suburb
        logicalType: string
        physicalType: varchar(100)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: postcode
        logicalType: string
        physicalType: varchar(4)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: case_opened_date
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: case_status
        logicalType: string
        physicalType: varchar(10)
        required: true
        description: Open or Closed.
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Open", "Closed"]
            mustBe: 0
            severity: error
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
        description: When this snapshot was extracted from the casework system.
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [300, 900]
        severity: warning
        description: >
          A rough sanity band for the active client population per
          extract - catches a truncated or duplicated-file extract, same
          rationale as the Birth Registrations contract's rowCount rule.

  - name: cp_notifications
    physicalType: table
    description: >
      One row per notification (a report of concern about a child) -
      1-4 per client, more for children with a higher-risk history.
    properties:
      - name: notification_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
            description: >
              The dirty(amber/red) presets on this table (see
              generator/dirty.py's apply_cp_notifications_presets)
              deliberately inject near-duplicate notifications - a real
              double-submission scenario - so this rule has something
              genuine to catch on those runs.
      - name: cp_client_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: notification_date
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: source_type
        logicalType: string
        physicalType: varchar(30)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["School", "Police", "Health service", "Family member", "Neighbour", "Anonymous", "Self-report"]
            mustBe: 0
            severity: error
      - name: concern_type
        logicalType: string
        physicalType: varchar(50)
        required: true
        description: >
          Closed value set. The dirty(amber/red) presets inject unknown
          codes here - the deliberate traffic-light demo column for this
          collection, same role sex plays for Birth Registrations.
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Neglect", "Physical abuse", "Emotional abuse", "Sexual abuse",
                            "Domestic violence exposure", "Parental substance use", "Parental mental health concern"]
            mustBe: 0
            severity: error
      - name: risk_rating
        logicalType: string
        physicalType: varchar(10)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Low", "Medium", "High", "Critical"]
            mustBe: 0
            severity: error
      - name: assigned_worker_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: outcome
        logicalType: string
        physicalType: varchar(30)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["No further action", "Referred to family support", "Investigation opened"]
            mustBe: 0
            severity: error
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [600, 1600]
        severity: warning
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} n LEFT JOIN cp_clients c ON n.cp_client_id = c.cp_client_id WHERE c.cp_client_id IS NULL"
        mustBe: 0
        severity: error
        description: Every notification's cp_client_id must reference an existing cp_clients row.
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} n LEFT JOIN cp_case_workers w ON n.assigned_worker_id = w.worker_id WHERE w.worker_id IS NULL"
        mustBe: 0
        severity: error
        description: Every notification's assigned_worker_id must reference an existing cp_case_workers row.
      - type: sql
        dimension: completeness
        query: >-
          SELECT COUNT(*) FROM {model} n LEFT JOIN cp_investigations i
          ON n.notification_id = i.notification_id
          WHERE n.outcome = 'Investigation opened' AND i.investigation_id IS NULL
        mustBe: 0
        severity: error
        description: >
          Escalation completeness: a notification recorded with outcome
          'Investigation opened' must have a matching cp_investigations row.
          Passes 0/0 on every clean run (child_protection.py only ever
          builds cp_investigations from notifications with this exact
          outcome, so the two tables start in sync) - genuinely catches
          the dirty(amber/red) near-duplicate notifications
          apply_cp_notifications_presets injects, since each duplicate
          keeps its source row's outcome but gets a perturbed
          notification_id that cp_investigations was built before and
          never references. Confirmed for real: 0 on clean runs, 2-3 on
          amber runs, 6 on the red run.

  - name: cp_investigations
    physicalType: table
    description: One row per investigation opened from an escalated notification.
    properties:
      - name: investigation_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
      - name: notification_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: cp_client_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: start_date
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: end_date
        logicalType: date
        physicalType: date
        required: false
        description: Nullable - the investigation may still be open (~12% of them are, by generator design).
      - name: substantiated
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Substantiated", "Not substantiated", "Inconclusive"]
            mustBe: 0
            severity: error
      - name: lead_worker_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [80, 350]
        severity: warning
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} i LEFT JOIN cp_notifications n ON i.notification_id = n.notification_id WHERE n.notification_id IS NULL"
        mustBe: 0
        severity: error
        description: Every investigation's notification_id must reference an existing cp_notifications row.
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} i LEFT JOIN cp_clients c ON i.cp_client_id = c.cp_client_id WHERE c.cp_client_id IS NULL"
        mustBe: 0
        severity: error
        description: Every investigation's cp_client_id must reference an existing cp_clients row.
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} i LEFT JOIN cp_case_workers w ON i.lead_worker_id = w.worker_id WHERE w.worker_id IS NULL"
        mustBe: 0
        severity: error
        description: Every investigation's lead_worker_id must reference an existing cp_case_workers row.
      - type: sql
        dimension: consistency
        query: >-
          SELECT COUNT(*) FROM {model} i JOIN cp_clients c
          ON i.cp_client_id = c.cp_client_id
          WHERE c.case_status = 'Closed' AND i.end_date IS NULL
        mustBe: 0
        severity: error
        description: >
          Closed-case investigation hygiene: an investigation should not
          still be open (end_date NULL) once its client's case_status is
          Closed. REAL FINDING, not a bug in this rule: currently fails on
          every run at a stable rate (16/181 investigations, ~9%, on the
          base collection - confirmed by actually running this query)
          because child_protection.py generates case_status and
          investigation end_date independently, with no invariant tying
          them together. dirty.py has no preset for this table, so the
          count never varies run to run - a genuine, currently-unaddressed
          business-process risk this rule is right to keep surfacing
          rather than hide. Tracked as a generator follow-up in
          plans/qa-pipeline.md.

  - name: cp_placements
    physicalType: table
    description: One row per out-of-home-care placement (0-2 per client; not every client has one).
    properties:
      - name: placement_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
      - name: cp_client_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: placement_type
        logicalType: string
        physicalType: varchar(30)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Kinship care", "Foster care", "Residential care", "Family group home"]
            mustBe: 0
            severity: error
      - name: carer_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: placement_start
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: placement_end
        logicalType: date
        physicalType: date
        required: false
        description: Nullable - the placement may still be ongoing (~22% of them are, by generator design).
      - name: placement_suburb
        logicalType: string
        physicalType: varchar(100)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [100, 450]
        severity: warning
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} p LEFT JOIN cp_clients c ON p.cp_client_id = c.cp_client_id WHERE c.cp_client_id IS NULL"
        mustBe: 0
        severity: error
        description: Every placement's cp_client_id must reference an existing cp_clients row.
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} p LEFT JOIN cp_carers c ON p.carer_id = c.carer_id WHERE c.carer_id IS NULL"
        mustBe: 0
        severity: error
        description: Every placement's carer_id must reference an existing cp_carers row.
      - type: sql
        dimension: consistency
        query: >-
          SELECT COUNT(*) FROM {model} p JOIN cp_carers c
          ON p.carer_id = c.carer_id
          WHERE c.approval_status != 'Approved'
        mustBe: 0
        severity: error
        description: >
          Placement/carer approval compliance: a placement's carer must be
          Approved, not Provisional or Under review. REAL FINDING, not a
          bug in this rule: currently fails on every run at a stable rate
          (37/242 placements, ~15%, on the base collection - confirmed by
          actually running this query) because child_protection.py assigns
          carer_for_placement from the full carer pool regardless of
          approval_status. dirty.py has no preset for this table either,
          so the count never varies run to run. Same honest-finding
          treatment as the investigation-hygiene rule above; tracked
          alongside it in plans/qa-pipeline.md.

  - name: cp_carers
    physicalType: table
    description: One row per approved (or in-approval) carer available for placements.
    properties:
      - name: carer_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
      - name: given_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: family_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: carer_type
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Kinship", "Foster", "Residential-staff"]
            mustBe: 0
            severity: error
      - name: approval_status
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Approved", "Provisional", "Under review"]
            mustBe: 0
            severity: error
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [150, 500]
        severity: warning

  - name: cp_case_workers
    physicalType: table
    description: One row per case worker who may be assigned notifications or lead investigations.
    properties:
      - name: worker_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
      - name: given_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: family_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
      - name: team_region
        logicalType: string
        physicalType: varchar(30)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Metro North", "Metro South", "Metro East", "South West", "Great Southern",
                            "Goldfields", "Kimberley", "Pilbara", "Wheatbelt", "Midwest-Gascoyne"]
            mustBe: 0
            severity: error
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [40, 80]
        severity: warning

slaProperties:
  - property: frequency
    value: 7
    unit: d
    element: cp_clients
  - property: latency
    value: 24
    unit: h
    element: cp_clients
    description: Maximum acceptable delay between an extract being pulled and it landing in S3.

customProperties:
  - property: currentDeliveryFormat
    value: csv
  - property: piiClassification
    value: "Contains sensitive personal information about children and families. Confirm and record the correct security/handling classification for your agency before this leaves draft status."
