          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} p LEFT JOIN cp_clients c ON p.cp_client_id = c.cp_client_id WHERE c.cp_client_id IS NULL"
        mustBe: 0
        severity: error
