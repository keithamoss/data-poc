          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} p LEFT JOIN cp_carers c ON p.carer_id = c.carer_id WHERE c.carer_id IS NULL"
        mustBe: 0
        severity: error
        description: Every placement's carer_id must reference an existing cp_carers row.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-placements.stg_cp_placements.carer_id.relationships_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: >-
          SELECT COUNT(*) FROM {model} p JOIN cp_carers c
          ON p.carer_id = c.carer_id
          WHERE c.approval_status != 'Approved'
        mustBe: 0
        severity: error
        description: >
          Placement/carer approval compliance: a placement's carer must be
          Approved, not Provisional or Under review. Passes 0/0 on every
          clean run - child_protection.py only ever assigns an Approved
          carer to a placement, so this holds by construction.
          dirty.py's apply_cp_placements_presets (amber/red only)
          reassigns a controlled number of placements to a non-Approved
          carer to demonstrate a real violation - confirmed for real: 0 on
          clean runs, 3 on amber runs, 17 on the red run. Previously (see
          plans/qa-pipeline.md #9) this rule failed on every run at a
          stable ~15% rate because the generator drew from the full carer
          pool regardless of approval_status - fixed, not hidden.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-placements.stg_cp_placements.carer_id.approval_compliance_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"

