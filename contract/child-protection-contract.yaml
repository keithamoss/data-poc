slaProperties:
  # frequency here was stale at "7 d" (weekly) - a leftover from before
  # this collection's real cadence was migrated to calendar quarters
  # (2026-09-16) and then re-anchored to Feb/May/Aug/Nov (2026-09-17,
  # plans/qa-pipeline.md) - neither migration updated this value, since
  # nothing downstream ever actually read it. Corrected here alongside
  # adding the real, computable cadence below.
  - property: frequency
    value: 3
    unit: mo
    element: cp_clients
  # Real, computable cadence (Phase 5j) - replaces AS_OF_OFFSET_DAYS'
  # flat global staleness offset and the dashboard's own former
  # decorative "within 24h of extract"/"latencyHours: 24" text, neither
  # of which anything ever actually checked. Parsed by pipeline/
  # cadence.py's parse_cadence_from_contract() - see that module's own
  # docstring for exactly how each property below is used.
  # cadenceAnchorMonths/cadenceDayOfMonth mirror generator/generate_cp_
  # runs.py's own _quarter_start() anchor exactly (Feb/May/Aug/Nov,
  # day 1) - this is the same real cadence rule the data is actually
  # generated against, not a separate, potentially-drifting copy of it.
  # latency (8 business hours) is deliberately much larger than BDM's
  # daily 60 min - Keith's own call: a quarterly refresh's own latency
  # tolerance is a real but much less pressing concern than a daily
  # feed's.
  - property: cadenceType
    value: quarterly
    element: cp_clients
  - property: cadenceAnchorMonths
    value: "2,5,8,11"
    element: cp_clients
  - property: cadenceDayOfMonth
    value: 1
    element: cp_clients
  - property: expectedTime
    value: "09:00"
    element: cp_clients
    description: Agreed quarterly delivery time, AWST.
  - property: latency
    value: 480
    unit: min
    element: cp_clients
    description: How late (past expectedTime) a delivery can arrive before it counts as late rather than on time.

customProperties:
  - property: currentDeliveryFormat
    value: csv
  - property: piiClassification
    value: "Contains sensitive personal information about children and families. Confirm and record the correct security/handling classification for your agency before this leaves draft status."
  # mothman CLI Phase 3 (plans/tooling.md #1) - S3 QA source mode config.
  # s3Source/localSource verified 2026-09-19 against real datacontract-cli
  # parsing (qa_tools/cp/run_datacontract_cp.py) before landing here.
  # arrivalPattern was previously a design-doc-only proposal
  # (docs/aws-event-driven-mvp-design.md's own flagged "confirm in the
  # morning" item) - Keith's own explicit go-ahead, 2026-09-19, to wire
  # it into the real contract now that it's been verified this way.
  - property: s3Source
    value: "cp/"
    # Real prefix within the raw-data landing bucket
    # (aws/cdk/data_pipeline_stack.py's RawDataBucket) - matches the
    # exact prefix its own S3 event-notification wiring already filters
    # on. The bucket's own name is env-provided (MOTHMAN_RAW_BUCKET_NAME),
    # never hardcoded here, since CDK auto-generates a globally-unique
    # name at deploy time.
  - property: localSource
    value: data/cp_raw
    # Default local root `mothman cp qa`'s Local files source mode
    # browses from - the same real CP_RAW_DIR
    # qa_tools/cp/build_cp_warehouses.py already uses.
  - property: arrivalPattern
    value:
      - type: nested_folder
        keyPattern: "cp/{delivery_id}/cp_clients.csv"
        dataset_id: child-protection-casework
        extractTo: cp_clients
      - type: nested_folder
        keyPattern: "cp/{delivery_id}/cp_notifications.csv"
        dataset_id: child-protection-casework
        extractTo: cp_notifications
      - type: nested_folder
        keyPattern: "cp/{delivery_id}/cp_investigations.csv"
        dataset_id: child-protection-casework
        extractTo: cp_investigations
      - type: nested_folder
        keyPattern: "cp/{delivery_id}/cp_placements.csv"
        dataset_id: child-protection-casework
        extractTo: cp_placements
      - type: nested_folder
        keyPattern: "cp/{delivery_id}/cp_carers.csv"
        dataset_id: child-protection-casework
        extractTo: cp_carers
      - type: nested_folder
        keyPattern: "cp/{delivery_id}/cp_case_workers.csv"
        dataset_id: child-protection-casework
        extractTo: cp_case_workers
    # qa_tools/common/file_arrival.py's real, tested pattern-matching
    # shape - one nested_folder pattern per real table, since one CP
    # delivery is all 6 tables landing together under a shared
    # {delivery_id}/ prefix, not a single flat key the way BDM's is.
