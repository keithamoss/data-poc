# Open Data Contract Standard (ODCS) v3.2.0 contract for the Child
# Protection Casework collection - six related tables, one contract,
# matching how a real "collection" (Agency -> Collection -> Dataset ->
# Column, per docs/data-contract-engines-landscape.md's QA reporting
# layers section) is genuinely one governed unit, not six independent
# datasets that happen to share a name.
#
# Phase 2 adds the seven real foreign-key relationships between these
# tables, plus three cross-table business rules (escalation completeness,
# placement/carer approval compliance, closed-case investigation hygiene) -
# all as `type: sql` rules on the child table, referencing the parent
# table's view by its literal name (datacontract-cli only substitutes
# `{model}` for the rule's OWN schema object; every other schema object's
# name is created as a real view/table on the same connection, so a
# literal join to it works - confirmed by actually running `datacontract
# test`, not assumed from the docs).
#
# All three business rules pass cleanly (0 violations) on every clean run,
# by construction: child_protection.py only ever assigns Approved carers
# to a placement, and only ever closes a case once none of its own
# investigations are still open. Two of the three business rules used to
# fail on EVERY run, dirty or clean, before that fix (see
# plans/qa-pipeline.md #9 for the full account, kept as a resolved entry
# rather than deleted) - generator/dirty.py's apply_cp_placements_presets
# and apply_cp_investigations_presets are what reintroduce a controlled,
# real violation count on amber/red runs now, the same traffic-light
# pattern as concern_type/escalation completeness.
#
# Vocabulary matches contract/bdm-birth-registrations-contract.yaml exactly
# (metric: nullValues/invalidValues/duplicateValues/rowCount, the real
# dimension enum, apiVersion v3.2.0) - see that file's comments and
# README.md's known-disagreements section for why, found the hard way by
# actually running datacontract-cli against the birth-registrations
# contract first.
#
# Every quality rule below carries a `customProperties:` block with
# check-lifecycle metadata (check_id/introduced_date/changelog) - plans/
# publishing-and-history.md Thread D, Phase 1. FK and cross-table
# business-rule checks are deliberately given a `_datacontract`-suffixed
# check_name - the Soda checks file implements the same 7 FKs and 3
# business rules in its own vocabulary, and a real collision was found
# (and fixed) between Soda's and the contract's identically-named checks
# on the BDM side before this suffix convention was adopted - applied
# proactively here, mirroring Soda's own `_soda` suffix.

apiVersion: v3.2.0
kind: DataContract
id: child-protection-casework
status: draft
version: 1.0.0

name: Child Protection Casework Collection
domain: child-and-family-safety
description:
  purpose: >
    The Child Protection Casework collection: notifications received about
    a child, the investigations they may escalate to, the carer placements
    that may result, and the case workers and carers involved. Six related
    tables under one collection, with real foreign keys between them -
    unlike the single-table Birth Registrations feed, this is where the
    QA pipeline demonstrates whole-collection checks (see phase 2).

team:
  members:
    - role: dataOwner
      name: Department for Child Protection and Family Support
      username: cp-data-owner@example.gov.au  # placeholder - update before use
    - role: dataSteward
      username: cp-data-steward@example.gov.au  # placeholder - update before use
      description: Child Protection data governance contact - update with a real name/email before use
    - role: consumer
      name: Central multi-agency data asset
      username: multi-agency-data-asset@example.gov.au  # placeholder - update before use

support:
  - channel: email
    tool: email
    description: Child Protection data supply team - replace with a real contact before use

servers:
  - server: production
    type: s3
    location: s3://gov-data-exchange/child-protection/casework/
    format: csv
    delimiter: comma
    description: >
      Current delivery mechanism: a full periodic extract of the active
      casework collection, dropped into this bucket. No direct source
      connection yet.

# `nullValues` (a project convention on top of ODCS, not a real ODCS
# property) - see bdm-birth-registrations-contract.yaml's identical
# comment for the full rationale. No property here sets one today.
schema:
  - name: cp_clients
    physicalType: table
    description: One row per child with a Child Protection casework history.
    properties:
      - name: cp_client_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        description: This agency's unique client identifier. Primary key of this table.
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.cp_client_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every client record must carry a client ID."
              - property: changelog
                value: "[]"
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.cp_client_id.duplicateValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Client IDs must not be duplicated."
              - property: changelog
                value: "[]"
      - name: given_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        classification: pii
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.given_name.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "A client's given name must be recorded."
              - property: changelog
                value: "[]"
      - name: family_name
        logicalType: string
        physicalType: varchar(200)
        required: true
        classification: pii
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.family_name.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "A client's family name must be recorded."
              - property: changelog
                value: "[]"
      - name: date_of_birth
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.date_of_birth.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "A client record must carry a date of birth."
              - property: changelog
                value: "[]"
          # Reverse gap, closed 2026-09-15 (plans/qa-pipeline.md's full-
          # triplication pass): both Soda (a `failed rows` check) and dbt
          # (tests/cp_client_date_of_birth_range.sql) already implement
          # this range check - the contract was the one place it was
          # missing. Same shape as bdm-birth-registrations-contract.yaml's
          # matching date_of_birth rule, but no upper bound (> CURRENT_DATE)
          # here - Soda's/dbt's own versions of this check only ever test
          # the lower bound (generator/dirty.py's apply_cp_clients_presets
          # only ever injects implausibly old dates, never future ones,
          # same as BDM's own _BAD_DATE_OF_BIRTH_POOL) - mirroring their
          # actual condition rather than silently adding stricter coverage
          # than either real tool enforces.
          - type: sql
            dimension: conformity
            query: "SELECT COUNT(*) FROM {model} WHERE date_of_birth < DATE '1900-01-01'"
            mustBe: 0
            severity: error
            description: >
              Guards against a type/format change upstream turning into
              silently unparseable or nonsensical dates downstream - same
              rationale as the Birth Registrations contract's matching rule.
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.date_of_birth.range_check_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: changelog
                value: "[]"
      - name: sex
        logicalType: string
        physicalType: varchar(1)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["M", "F", "X"]
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.sex.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Sex must be one of the closed value set M, F, or X."
              - property: changelog
                value: "[]"
      - name: suburb
        logicalType: string
        physicalType: varchar(100)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.suburb.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "A client's suburb must be recorded."
              - property: changelog
                value: "[]"
      - name: postcode
        logicalType: string
        physicalType: varchar(4)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.postcode.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "A client's postcode must be recorded."
              - property: changelog
                value: "[]"
          # Closed value set - generator/names_au.py's SUBURBS pool's own
          # postcodes (49 distinct values paired with the 51 suburb names),
          # same real-and-bounded rationale as BDM's place_of_birth_suburb
          # conversion (plans/qa-pipeline.md #15's aggregate-invalid-values
          # follow-up) - previously had no invalid-value check at all.
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["6007", "6008", "6014", "6018", "6019", "6027", "6028", "6030", "6035", "6036", "6050", "6056", "6061", "6062", "6064", "6069", "6100", "6102", "6107", "6109", "6110", "6112", "6122", "6148", "6151", "6155", "6160", "6162", "6163", "6164", "6167", "6168", "6171", "6210", "6215", "6225", "6230", "6258", "6280", "6285", "6312", "6330", "6401", "6430", "6450", "6530", "6714", "6721", "6725"]
            mustBe: 0
            severity: error
            description: An unrecognised postcode means a data-entry typo or a source-system change.
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.postcode.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: changelog
                value: "[]"
      - name: case_opened_date
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.case_opened_date.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "A client record must carry the date its case was opened."
              - property: changelog
                value: "[]"
      - name: case_status
        logicalType: string
        physicalType: varchar(10)
        required: true
        description: Open or Closed.
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Open", "Closed"]
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.case_status.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Case status must be one of Open or Closed."
              - property: changelog
                value: "[]"
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
        description: When this snapshot was extracted from the casework system.
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [300, 900]
        severity: warning
        description: >
          A rough sanity band for the active client population per
          extract - catches a truncated or duplicated-file extract, same
          rationale as the Birth Registrations contract's rowCount rule.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-clients.stg_cp_clients.rowCount_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"

  - name: cp_notifications
    physicalType: table
    description: >
      One row per notification (a report of concern about a child) -
      1-4 per client, more for children with a higher-risk history.
    properties:
      - name: notification_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.notification_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every notification must carry a notification ID."
              - property: changelog
                value: "[]"
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
            description: >
              The dirty(amber/red) presets on this table (see
              generator/dirty.py's apply_cp_notifications_presets)
              deliberately inject near-duplicate notifications - a real
              double-submission scenario - so this rule has something
              genuine to catch on those runs.
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.notification_id.duplicateValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: changelog
                value: "[]"
      - name: cp_client_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.cp_client_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every notification must reference a client."
              - property: changelog
                value: "[]"
      - name: notification_date
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.notification_date.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every notification must carry the date it was made."
              - property: changelog
                value: "[]"
      - name: source_type
        logicalType: string
        physicalType: varchar(30)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["School", "Police", "Health service", "Family member", "Neighbour", "Anonymous", "Self-report"]
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.source_type.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Notification source must be one of the closed value set."
              - property: changelog
                value: "[]"
      - name: concern_type
        logicalType: string
        physicalType: varchar(50)
        required: true
        description: >
          Closed value set. The dirty(amber/red) presets inject unknown
          codes here - the deliberate traffic-light demo column for this
          collection, same role sex plays for Birth Registrations.
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Neglect", "Physical abuse", "Emotional abuse", "Sexual abuse",
                            "Domestic violence exposure", "Parental substance use", "Parental mental health concern"]
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.concern_type.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: changelog
                value: "[]"
      - name: risk_rating
        logicalType: string
        physicalType: varchar(10)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Low", "Medium", "High", "Critical"]
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.risk_rating.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Risk rating must be one of the closed value set."
              - property: changelog
                value: "[]"
      - name: assigned_worker_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.assigned_worker_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every notification must be assigned to a case worker."
              - property: changelog
                value: "[]"
      - name: outcome
        logicalType: string
        physicalType: varchar(30)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["No further action", "Referred to family support", "Investigation opened"]
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.outcome.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Notification outcome must be one of the closed value set."
              - property: changelog
                value: "[]"
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [600, 1600]
        severity: warning
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.rowCount_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} n LEFT JOIN cp_clients c ON n.cp_client_id = c.cp_client_id WHERE c.cp_client_id IS NULL"
        mustBe: 0
        severity: error
        description: Every notification's cp_client_id must reference an existing cp_clients row.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.cp_client_id.relationships_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} n LEFT JOIN cp_case_workers w ON n.assigned_worker_id = w.worker_id WHERE w.worker_id IS NULL"
        mustBe: 0
        severity: error
        description: Every notification's assigned_worker_id must reference an existing cp_case_workers row.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.assigned_worker_id.relationships_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: completeness
        query: >-
          SELECT COUNT(*) FROM {model} n LEFT JOIN cp_investigations i
          ON n.notification_id = i.notification_id
          WHERE n.outcome = 'Investigation opened' AND i.investigation_id IS NULL
        mustBe: 0
        severity: error
        description: >
          Escalation completeness: a notification recorded with outcome
          'Investigation opened' must have a matching cp_investigations row.
          Passes 0/0 on every clean run (child_protection.py only ever
          builds cp_investigations from notifications with this exact
          outcome, so the two tables start in sync) - genuinely catches
          the dirty(amber/red) near-duplicate notifications
          apply_cp_notifications_presets injects, since each duplicate
          keeps its source row's outcome but gets a perturbed
          notification_id that cp_investigations was built before and
          never references. Confirmed for real: 0 on clean runs, 2-3 on
          amber runs, 6 on the red run.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-notifications.stg_cp_notifications.notification_id.escalation_completeness_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"

  - name: cp_investigations
    physicalType: table
    description: One row per investigation opened from an escalated notification.
    properties:
      - name: investigation_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        unique: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.investigation_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every investigation record must carry an investigation ID."
              - property: changelog
                value: "[]"
          - metric: duplicateValues
            dimension: uniqueness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.investigation_id.duplicateValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Investigation IDs must not be duplicated."
              - property: changelog
                value: "[]"
      - name: notification_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.notification_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every investigation must reference the notification that escalated into it."
              - property: changelog
                value: "[]"
      - name: cp_client_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.cp_client_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every investigation must reference a client."
              - property: changelog
                value: "[]"
      - name: start_date
        logicalType: date
        physicalType: date
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.start_date.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every investigation must carry the date it started."
              - property: changelog
                value: "[]"
      - name: end_date
        logicalType: date
        physicalType: date
        required: false
        description: Nullable - the investigation may still be open (~12% of them are, by generator design).
      - name: substantiated
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: invalidValues
            dimension: conformity
            arguments:
              validValues: ["Substantiated", "Not substantiated", "Inconclusive"]
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.substantiated.invalidValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Investigation outcome must be one of the closed value set."
              - property: changelog
                value: "[]"
      - name: lead_worker_id
        logicalType: string
        physicalType: varchar(20)
        required: true
        quality:
          - metric: nullValues
            dimension: completeness
            mustBe: 0
            severity: error
            customProperties:
              - property: check_id
                value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.lead_worker_id.nullValues_datacontract
              - property: introduced_date
                value: "2023-01-15"
              - property: description
                value: "Every investigation must have a lead case worker assigned."
              - property: changelog
                value: "[]"
      - name: extract_timestamp
        logicalType: date
        physicalType: timestamp
        required: true
    quality:
      - metric: rowCount
        dimension: completeness
        mustBeBetween: [80, 350]
        severity: warning
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.rowCount_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} i LEFT JOIN cp_notifications n ON i.notification_id = n.notification_id WHERE n.notification_id IS NULL"
        mustBe: 0
        severity: error
        description: Every investigation's notification_id must reference an existing cp_notifications row.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.notification_id.relationships_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} i LEFT JOIN cp_clients c ON i.cp_client_id = c.cp_client_id WHERE c.cp_client_id IS NULL"
        mustBe: 0
        severity: error
        description: Every investigation's cp_client_id must reference an existing cp_clients row.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.cp_client_id.relationships_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: "SELECT COUNT(*) FROM {model} i LEFT JOIN cp_case_workers w ON i.lead_worker_id = w.worker_id WHERE w.worker_id IS NULL"
        mustBe: 0
        severity: error
        description: Every investigation's lead_worker_id must reference an existing cp_case_workers row.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.lead_worker_id.relationships_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"
      - type: sql
        dimension: consistency
        query: >-
          SELECT COUNT(*) FROM {model} i JOIN cp_clients c
          ON i.cp_client_id = c.cp_client_id
          WHERE c.case_status = 'Closed' AND i.end_date IS NULL
        mustBe: 0
        severity: error
        description: >
          Closed-case investigation hygiene: an investigation should not
          still be open (end_date NULL) once its client's case_status is
          Closed. Passes 0/0 on every clean run - child_protection.py only
          ever marks a case Closed once none of that client's own
          investigations are still open, so the two are consistent by
          construction. dirty.py's apply_cp_investigations_presets
          (amber/red only) reopens a controlled number of Closed-case
          investigations to demonstrate a real violation - confirmed for
          real: 0 on clean runs, 1-3 on amber runs, 6 on the red run.
          Previously (see plans/qa-pipeline.md #9) this rule failed on
          every run at a stable ~9% rate because the generator didn't tie
          case_status to investigation state at all - fixed, not hidden.
        customProperties:
          - property: check_id
            value: data-asset-1.child-protection-family-support.cp-investigations.stg_cp_investigations.investigation_id.closed_case_hygiene_datacontract
          - property: introduced_date
            value: "2023-01-15"
          - property: changelog
            value: "[]"

