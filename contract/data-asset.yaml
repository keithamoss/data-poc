# Data-asset-level configuration - genuinely global (the whole system,
# every agency/collection/dataset), not attached to any one dataset's
# own contract. `data_asset_id` is the same "data-asset-1" placeholder
# literal already baked into every check_id across all 4 tools' check
# definitions (a real name can replace it later, everywhere it appears,
# without changing the check_id scheme itself - see
# plans/publishing-and-history.md Thread D). This file is the one place
# that placeholder is declared, not repeated as a hardcoded string per
# dataset's own config.
#
# Corrected 2026-09-16 (Keith's call): `as_of_offset_days` previously
# lived as dataset-level `customProperties` on this repo's Child
# Protection ODCS contract only (`contract/child-protection-
# contract.yaml`), reasoned from that one collection's own quarterly
# cadence. Wrong attachment point - Keith's explicit correction: this
# is data-asset-level config, genuinely global. ONE offset applies to
# every dataset's "as of" view, not a different value derived from each
# dataset's own refresh cadence.
#
# Removed entirely, 2026-09-17 (plans/qa-pipeline.md Phase 5j, Keith's
# own call, a proper brainstorm not just a number tweak): a flat global
# day-count was never the right shape for "is this dataset's most
# recent data still current" - a quarterly dataset's real ~92-day gap
# between deliveries made this trip constantly even when nothing was
# wrong (CP read "no data" on the plain default view for roughly
# two-thirds of every quarter). Replaced by real, per-dataset,
# computable cadence config living in each dataset's own ODCS contract
# (`slaProperties:` - see pipeline/cadence.py) - "no data" now means
# "nothing has landed yet in the CURRENT expected cycle," not "the
# latest delivery is more than N days old." See that plan file's own
# entry for the full design history (including the earlier "grow the
# offset" / "revisit global-vs-per-dataset" options this superseded).

data_asset_id: data-asset-1

# ---------------------------------------------------------------------
# THE DATA ASSET'S OWN TIMEZONE (REQ-PIPE-048) - read from here and
# nowhere else.
#
# Until 2026-09-23 this was a hardcoded `AWST_OFFSET = timedelta(hours=8)`
# in pipeline/cadence.py, and every wall-clock computation in the repo
# leaned on it. An offset is not a timezone: it is one zone's answer for
# one moment, and a second asset in a daylight-saving jurisdiction would
# need a rule, not a number.
#
# An IANA name, not an offset, for that reason. Western Australia does
# not observe daylight saving, so today the two happen to agree - which
# is exactly why this is worth fixing now rather than when they stop
# agreeing.
#
# Changing this does NOT reinterpret anything already stored: every
# instant in qa_results/ carries its own offset, so it keeps the meaning
# it was written with. That is the whole reason the offset is stored
# alongside the value rather than inferred from this line at read time.
timezone: Australia/Perth

# ---------------------------------------------------------------------
# DELIVERY CALENDARS (REQ-PIPE-049) - what QA judges a supply against.
#
# THE DATES ARE THE SUPPLIER AGREEMENT. That is the whole design, in one
# line (plans/supply-model.md Thread C). A holiday library PREDICTS what
# was probably agreed; it does not CONSTITUTE it. So the quarterly dates
# below are AUTHORED, never computed at evaluation time - which is also
# the only shape with somewhere to record a date that differs from what
# a rule would have generated, because a supplier asked for it.
# `mothman schedule candidate-dates` prints next year's suggestions for
# a human to review, edit and commit; nothing evaluates against its
# output.
#
# SEVERAL NAMED CALENDARS, each dataset naming exactly one. Not
# generality bought for a hypothetical future: two cadences already
# share this one asset - Birth Registrations daily, Child Protection
# quarterly - so one asset-wide calendar could never have worked here.
#
# WHY THE ASSET OWNS THE CALENDAR AND A DATASET OWNS ITS PARTICIPATION:
# the quarterly asset is heading for ~30 datasets, of which roughly 70%
# arrive every quarter and the rest once or twice a year, still landing
# on one of the same four dates. Thirty independent date lists would
# drift - dataset A saying 2 February and dataset B saying 3 February
# for the same window is a class of bug nothing would ever flag.
#
# EVERY CALENDAR IS VERSIONED, effective-dated, with a changelog entry
# per version - the same shape check lifecycle already uses. A supply is
# judged against the calendar that was in force when it was due, so
# editing next year's dates can never retroactively make a past supply
# late.
#
# A CALENDAR DATE CARRIES NO TIME OF DAY, deliberately. The instant a
# supply is due comes from the dataset's own expectedTime in its own
# contract, applied to the calendar's date - so a per-dataset deadline
# stays per-dataset instead of being flattened into one per period.
calendars:
  - name: quarterly
    # HOW FEW FUTURE SLOTS LEFT BEFORE WE SAY SO (REQ-PIPE-053).
    # Counted in SLOTS, never in months - three months of runway on a
    # quarterly calendar is ONE slot, which is already too late to act
    # on. Four is a year of quarterly supplies: long enough that
    # "please send next year's dates" is a calm request.
    #
    # Deliberately NOT inside `versions:` - the dates and the claim
    # window are the supplier agreement and are effective-dated; this
    # is an operational threshold for when WE want telling that they
    # are running out.
    runway_warning_slots: 4
    description: >
      Four authored delivery dates a year, anchored on the 1st of
      February, May, August and November. Child Protection's real
      agreed cadence (Keith, 2026-09-17: "1 February being the expected
      date of supply, then working forwards in three month
      increments") - deliberately NOT calendar quarters.
    versions:
      - effective_from: "2023-01-01"
        changelog:
          - "2023-01-01: Initial quarterly calendar - Feb/May/Aug/Nov, authored through 2027."
        # Default claim window for datasets on this calendar. A duration
        # carrying its own unit, so the same property reads naturally at
        # quarterly and daily scale - 14 days here, hours on the daily
        # calendar below. A dataset may override it in its own contract.
        claim_window: 14d
        # PERIOD NAMES ARE AUTHORED, not derived from the date. A period
        # is a named bucket on the asset's calendar; the name is what
        # people call it, and deriving it would lose that. Q1 here is
        # the February-anchored quarter, matching the anchor above
        # rather than the calendar year - Keith's to rename if the
        # agency calls them something else.
        dates:
          - period: "2023-Q1"
            date: "2023-02-01"
          - period: "2023-Q2"
            date: "2023-05-01"
          - period: "2023-Q3"
            date: "2023-08-01"
          - period: "2023-Q4"
            date: "2023-11-01"
          - period: "2024-Q1"
            date: "2024-02-01"
          - period: "2024-Q2"
            date: "2024-05-01"
          - period: "2024-Q3"
            date: "2024-08-01"
          - period: "2024-Q4"
            date: "2024-11-01"
          - period: "2025-Q1"
            date: "2025-02-01"
          - period: "2025-Q2"
            date: "2025-05-01"
          - period: "2025-Q3"
            date: "2025-08-01"
          - period: "2025-Q4"
            date: "2025-11-01"
          - period: "2026-Q1"
            date: "2026-02-01"
          - period: "2026-Q2"
            date: "2026-05-01"
          - period: "2026-Q3"
            date: "2026-08-01"
          - period: "2026-Q4"
            date: "2026-11-01"
          - period: "2027-Q1"
            date: "2027-02-01"
          - period: "2027-Q2"
            date: "2027-05-01"
          - period: "2027-Q3"
            date: "2027-08-01"
          - period: "2027-Q4"
            date: "2027-11-01"

  - name: daily
    description: >
      Every day, expressed as a rule rather than an enumerated list -
      365 authored dates a year would be absurd, and the agreement
      genuinely IS "every day". Birth Registrations' real cadence.
    versions:
      - effective_from: "2026-08-24"
        changelog:
          - "2026-08-24: Daily supply begins."
          - "2026-09-26: Start date corrected from 2023-01-01, which predated the
            first real supply by three and a half years. A cadence rule generates
            periods from its own effective_from, so that gap was 1,333 owed slots
            nothing had ever delivered against - and because 'oldest claimable
            unfilled slot' is a real branch of the assignment rule, a supply not
            on time for its own day filed to 2023-01-01 rather than to the day it
            was for. Keith's call, over generating three and a half years of
            daily history instead."
        claim_window: 4h
        cadence:
          rule: daily

# ---------------------------------------------------------------------
# THE HIERARCHY, stated once (REQ-QAC-039).
#
# Until 2026-09-23 this lived as literals in TWELVE Python files - four
# copy-pasted BDM tool scripts, a hand-maintained table-to-dataset map
# in cp_common.py, plus ticket_sync.py, acceptance_sync.py,
# github_links.py, the two orchestrators and two build scripts. Every
# consumer that needed a piece of the tree took its own copy, and
# ticket_sync.py's own comment had already noted it was the FOURTH and
# that consolidating was overdue.
#
# It lives HERE, rather than in a new file or derived by scanning the
# dataset contracts, because this file already exists for genuinely
# data-asset-level config, and because REQ-PIPE-049's named delivery
# calendars land here too - so the asset's shape and its schedule sit
# together, and a dataset naming a calendar resolves through one file
# (Keith, 2026-09-23).
#
# WHERE THE IDS CAME FROM, and why the contracts were changed to match
# rather than the other way round (Keith, same conversation): these ids
# are already baked into every check_id, every qa_results/ path and
# every dashboard URL. The dataset contracts disagreed - BDM declared
# `id: bdm-birth-registrations` against the code's `birth-registrations`,
# and CP declared `domain: child-and-family-safety`, which matched
# NEITHER its collection (`child-protection`) nor its agency. Changing
# the code would have churned committed history for nothing; the
# contract fields were read by nothing load-bearing, so they were
# corrected instead.
#
# `table:` is the replacement for cp_common.py's hand-maintained
# TABLE_DATASET_ID/TABLE_DATASET_NAME pair. A dataset maps to exactly
# one logical table - by construction under the supply model, not by
# today's accident (plans/supply-model.md Thread F) - so the mapping
# belongs beside the dataset rather than in a dict somebody maintains.
hierarchy:
  agencies:
    - id: registry-services
      name: Registry Services
      collections:
        - id: civil-registration
          name: Civil Registration
          # The ODCS contract covering this collection - where its
          # arrivalPattern lives, so "which dataset does this file
          # belong to" resolves through one lookup rather than a map
          # somebody maintains (REQ-GEN-043).
          contract: bdm-birth-registrations-contract.yaml
          # REQ-PIPE-057. What ONE DELIVERY is, for this source. The
          # boundary comes from the TRANSPORT - one folder drop, one S3
          # prefix, one SFTP session - and is stated rather than
          # assumed, because a source that states nothing must FAIL
          # rather than have a grouping inferred from filenames,
          # timestamps or arrival proximity. Those are guesses that
          # look like facts, and every arrival fact downstream is
          # derived from the boundary.
          delivery_boundary: directory
          datasets:
            - id: birth-registrations
              name: Birth Registrations
              table: birth_registrations
              # Names a calendar, and says nothing else - a dataset that
              # names no delivery_months participates in every period
              # its calendar generates, which for a cadence rule is the
              # only coherent reading. Naming months here would be an
              # ERROR rather than an ignored key: a daily feed that
              # "participates in February" is a config author saying
              # something the model cannot honour, and accepting it
              # silently is how a dataset ends up expecting something
              # other than what its author wrote.
              calendar: daily
              # REQ-PIPE-058. How this dataset's files are named, as a
              # regular expression matched with re.fullmatch against a
              # delivered file's own name - never the delivery's name,
              # its path, or the file's position in it. Deliberately NOT
              # the ODCS contract's arrivalPattern keyPattern, which is
              # an S3 key and a transport concern, and stays there.
              #
              # SINGLE-QUOTED, because YAML reads `\.` in a
              # double-quoted scalar as an unknown escape and refuses
              # the file. Found the hard way while writing this.
              #
              # These were written to match exactly what the retired
              # matcher matched, so this requirement moved WHERE the
              # pattern lives without changing WHAT it claims. Narrowing
              # one is the dangerous direction and nothing at config
              # time catches it, so narrow deliberately, not in passing.
              arrival_pattern: 'birth_registrations_[^/]+\.csv'

    - id: child-protection-family-support
      name: Department for Child Protection and Family Support
      collections:
        - id: child-protection
          name: Child Protection
          contract: child-protection-contract.yaml
          delivery_boundary: directory   # REQ-PIPE-057 - see above.
          datasets:
            - id: cp-clients
              name: Client Register
              table: cp_clients
              calendar: quarterly
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_clients\.csv'
            - id: cp-notifications
              name: Notifications
              table: cp_notifications
              calendar: quarterly
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_notifications\.csv'
            - id: cp-investigations
              name: Investigations
              table: cp_investigations
              calendar: quarterly
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_investigations\.csv'
            - id: cp-placements
              name: Placements
              table: cp_placements
              calendar: quarterly
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_placements\.csv'
            - id: cp-carers
              name: Carer Register
              table: cp_carers
              calendar: quarterly
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_carers\.csv'
            - id: cp-case-workers
              name: Case Workers
              table: cp_case_workers
              calendar: quarterly
              # The worked example of partial participation. Month
              # NAMES, in full, never numbers or positions - an index
              # breaks silently the moment the calendar is edited or
              # reordered, and a name stays meaningful and matches how
              # people talk about it. Case Workers is a staffing
              # register rather than casework, so it is resupplied
              # twice a year rather than quarterly.
              #
              # Note the key is delivery_months and never `months`: it
              # names when a supply ARRIVES, not the period it covers.
              # A February delivery is often for the November-January
              # window, so the short form invites exactly the wrong
              # reading.
              delivery_months: [February, August]
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_case_workers\.csv'
