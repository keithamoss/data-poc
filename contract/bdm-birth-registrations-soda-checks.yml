# SodaCL checks for the BDM birth-registrations feed, demonstrating a
# traffic-light (warn/fail) threshold model on top of the same feed described
# in bdm-birth-registrations-contract.yaml.
#
# This is real Soda Core syntax (warn:/fail: blocks with `when <condition>`),
# confirmed against current Soda docs and third-party integration guides.
# The exact keywords for scoping a check to "records since a date" (the
# `filter` block below) are a documented SodaCL concept but I haven't
# independently executed this file - Soda Core isn't pip-installable in this
# environment (see the tts-repo README from earlier in this thread for why).
# Run `soda scan` against this yourself to confirm before treating it as
# final, same caveat as the ODCS contract.
#
# Usage (once you have Soda Core set up):
#   pip install soda-core-postgres   # or whichever source connector you need
#   soda scan -d birth_registrations -c configuration.yml bdm-birth-registrations-soda-checks.yml
#
# Every check below carries an `attributes:` block with check-lifecycle
# metadata (check_id/introduced_date/description/changelog) - plans/
# publishing-and-history.md Thread D, Phase 1. `attributes:` is real
# SodaCL (confirmed against the installed soda-core package's own
# SodaCL parser - see qa_tools/common/check_lifecycle.py's own
# docstring), not something invented for this.
#
# Writing the reader-facing prose (description/failure_indicates/
# technical_note): docs/check-authoring-rules.md is the standing
# authoring standard - read it before adding or editing any of the
# three. The lifecycle gate only checks that failure_indicates is
# present; nothing enforces the wording rules.

# --- Data drift: a row count that's structurally "fine" but wrong ----------
# (a doubled or truncated file passes every column-level check; only a
# volume check catches it - same rule as the ODCS contract's rowCount rule,
# now with a real amber tier instead of one flat threshold)
checks for birth_registrations:
  - row_count:
      warn: when < 500
      fail:
        when < 100
        when > 20000
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.row_count_soda
        category: completeness
        introduced_date: "2026-01-15"
        description: >
          The number of rows in the supply must fall inside the expected band.
        failure_indicates: >
          self-evident
        changelog: []

  # --- Column rename / type change: missing_count on a required column ----
  # A silent rename makes this column disappear from the source query
  # entirely, which Soda surfaces as 100% missing - an immediate fail, no
  # amber tier needed since there's no acceptable partial-rename state.
  - missing_count(date_of_birth):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.date_of_birth.missing_count_soda
        category: completeness
        introduced_date: "2026-01-15"
        description: >
          This value must never be empty.
        failure_indicates: >
          self-evident
        changelog: []

  # --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) -----------
  # Every check below already exists in the ODCS contract (nullValues/
  # invalidValues/duplicateValues/type: sql), and most already exist in
  # dbt's schema.yml too - added here so Soda implements the same rule set
  # rather than only the handful of hand-picked "traffic light demo"
  # checks. Same warn>0/fail>5 buffer as date_of_birth above for every
  # contract column with a near-zero-tolerance nullValues rule (mustBe: 0,
  # or mustBeLessThan a small integer), rather than a bespoke band per
  # column - date_of_birth already established that pattern in this file.
  - missing_count(registration_number):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.registration_number.missing_count_soda
        category: completeness
        introduced_date: "2026-09-15"
        description: >
          A few empty values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - duplicate_count(registration_number):
      warn: when > 0
      fail: when > 3
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.registration_number.duplicate_count_soda
        category: uniqueness
        introduced_date: "2026-09-15"
        description: >
          A few duplicates are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - missing_count(child_given_names):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.child_given_names.missing_count_soda
        category: completeness
        introduced_date: "2026-09-15"
        description: >
          A few empty values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - missing_count(child_family_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.child_family_name.missing_count_soda
        category: completeness
        introduced_date: "2026-09-15"
        description: >
          A few empty values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  # mustBeLessThan: 2 in the contract (up to 1 null tolerated, 2+ fails) -
  # a tighter, explicit threshold rather than the generic 0/5 buffer above.
  - missing_count(place_of_birth_suburb):
      warn: when > 0
      fail: when > 1
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.place_of_birth_suburb.missing_count_soda
        category: completeness
        introduced_date: "2026-09-15"
        description: >
          A few empty values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - missing_count(date_registered):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.date_registered.missing_count_soda
        category: completeness
        introduced_date: "2026-09-15"
        description: >
          A few empty values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - missing_count(extract_timestamp):
      warn: when > 0
      fail: when > 5
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.extract_timestamp.missing_count_soda
        category: completeness
        introduced_date: "2026-09-15"
        description: >
          A few empty values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  # These two mirror the contract's own explicit, wider tolerances
  # (mustBeLessThan: 5%/severity: warning, mustBeLessThan: 30%/severity:
  # info) rather than the 0/5-count buffer above - both properties are
  # optional (required: false) with a real, non-zero expected null rate
  # (single-parent registrations), same rationale as place_of_birth_
  # facility's missing_percent check below. SodaCL has no "info" severity,
  # so the info-tier rule below only sets warn (there's nothing stricter
  # than "worth a look" to escalate it to).
  - missing_percent(registering_parent_1_name):
      warn: when > 5%
      fail: when > 15%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.registering_parent_1_name.missing_percent_soda
        category: completeness
        introduced_date: "2026-01-15"
        description: >
          This value is often empty for good reason; the check only fails if that becomes much more common.
        failure_indicates: >
          self-evident
        changelog:
          - date: "2026-09-18T00:00:00Z"
            description: "Added a real fail threshold (>15%) - previously warn-only (item 74, plans/qa-pipeline.md): a missing fail threshold silently defaulted to 0 in the dashboard-build code, making this check read red on almost every run despite never being designed to fail at all."
            author: "Keith Moss"
            breaking: true

  - missing_percent(registering_parent_2_name):
      warn: when > 30%
      fail: when > 50%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.registering_parent_2_name.missing_percent_soda
        category: completeness
        introduced_date: "2026-01-15"
        description: >
          This value is often empty for good reason; the check only fails if that becomes much more common.
        failure_indicates: >
          self-evident
        changelog:
          - date: "2026-09-18T00:00:00Z"
            description: "Added a real fail threshold (>50%) - previously warn-only (item 74, plans/qa-pipeline.md): a missing fail threshold silently defaulted to 0 in the dashboard-build code, making this check read red on almost every run despite never being designed to fail at all."
            author: "Keith Moss"
            breaking: true

  # --- The traffic-light example you asked for: sex -----------------------
  # A closed value set that downstream systems depend on. Red/amber here
  # means genuinely different responses: a handful of invalid codes might be
  # a known source-system quirk worth a dashboard flag (amber); a sustained
  # spike means BDM's source system changed its coding and every downstream
  # consumer is about to silently misclassify records (red).
  - invalid_percent(sex):
      valid values: [M, F, X]
      warn: when > 0%
      fail: when > 2%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.sex.invalid_percent_soda
        category: conformity
        introduced_date: "2026-01-15"
        description: >
          A few unrecognised values are tolerated; a sustained rise fails.
        failure_indicates: >
          The source system has started emitting a value that was never agreed in the
          contract, usually a new code introduced upstream without notice.
        changelog: []

  # --- Null rate creeping up, with a genuine amber band --------------------
  # Unlike date_of_birth above, some null rate here is expected (home births
  # without a recorded facility) - the amber tier exists specifically to
  # catch "creeping up" before it becomes bad enough to matter operationally.
  - missing_percent(place_of_birth_facility):
      warn: when > 15%
      fail: when > 35%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.place_of_birth_facility.missing_percent_soda
        category: completeness
        introduced_date: "2026-01-15"
        description: >
          This value is often empty for good reason; the check only fails if that becomes much more common.
        failure_indicates: >
          self-evident
        changelog: []

  # --- source_system_record_id: uniqueness + format ------------------------
  # BDM's internal record ID - a duplicate means a re-extract landed twice;
  # an unexpected format means an upstream ID-scheme change, same rationale
  # as registration_number's own checks.
  - duplicate_count(source_system_record_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.source_system_record_id.duplicate_count_soda
        category: uniqueness
        introduced_date: "2026-01-15"
        description: >
          A few duplicates are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - invalid_percent(source_system_record_id):
      valid regex: '^SRC-[0-9]{9}$'
      warn: when > 0%
      fail: when > 1%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.source_system_record_id.invalid_percent_soda
        category: conformity
        introduced_date: "2026-01-15"
        description: >
          A few badly-formatted values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  # --- Text field format/junk checks ----------------------------------------
  # A name should be letters, spaces, periods and hyphens only - same rule
  # as the ODCS contract's matching invalidValues rules on these 5 columns
  # (see that file's own comment for why this is a character-set check,
  # not a dictionary of known junk words: DuckDB's regex engine - the same
  # one Soda's `valid regex` compiles down to here - is RE2, which has no
  # lookahead support at all, so "reject any value containing a digit or
  # symbol" is as precise as this check can get).
  - invalid_percent(child_given_names):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.child_given_names.invalid_percent_soda
        category: conformity
        introduced_date: "2026-09-15"
        description: >
          A few badly-formatted values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - invalid_percent(child_family_name):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.child_family_name.invalid_percent_soda
        category: conformity
        introduced_date: "2026-09-15"
        description: >
          A few badly-formatted values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  # Closed value set (generator/names_au.py's SUBURBS pool, 51 real WA
  # suburb names) rather than a character-set regex - see the ODCS
  # contract's matching invalidValues rule for the full rationale.
  - invalid_percent(place_of_birth_suburb):
      valid values: ["Fremantle", "Subiaco", "Joondalup", "Rockingham", "Mandurah", "Midland", "Armadale", "Cannington", "Morley", "Cockburn Central", "Scarborough", "Victoria Park", "Bunbury", "Albany", "Geraldton", "Kalgoorlie", "Broome", "Karratha", "Port Hedland", "Busselton", "Northam", "Narrogin", "Esperance", "Collie", "Mount Lawley", "Leederville", "Wembley", "Innaloo", "Success", "Baldivis", "Ellenbrook", "Butler", "Balga", "Girrawheen", "Maddington", "Gosnells", "Kwinana", "Hamilton Hill", "Beaconsfield", "South Perth", "Bentley", "Willetton", "Riverton", "Karrinyup", "Currambine", "Clarkson", "Yanchep", "Byford", "Waroona", "Manjimup", "Margaret River"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.place_of_birth_suburb.invalid_percent_soda
        category: conformity
        introduced_date: "2026-01-15"
        description: >
          A few unrecognised values are tolerated; a sustained rise fails.
        failure_indicates: >
          The source system has started emitting a value that was never agreed in the contract, usually a new code introduced upstream without notice.
        changelog: []

  - invalid_percent(registering_parent_1_name):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.registering_parent_1_name.invalid_percent_soda
        category: conformity
        introduced_date: "2026-09-15"
        description: >
          A few badly-formatted values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  - invalid_percent(registering_parent_2_name):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.registering_parent_2_name.invalid_percent_soda
        category: conformity
        introduced_date: "2026-09-15"
        description: >
          A few badly-formatted values are tolerated; a sustained rise fails.
        failure_indicates: >
          self-evident
        changelog: []

  # --- Date-of-birth range (item 28's decision) -----------------------------
  # Same rule as the ODCS contract's matching type: sql check on
  # date_of_birth - see plans/qa-pipeline.md #26 (the bug found in the
  # independent aggregate's copy of this same condition) and #28 (the
  # decision to add this here and to dbt specifically so a PK-yielding
  # tool exists for it, since datacontract-cli's type: sql rules never
  # expose one). Selects date_of_birth itself alongside the PK - not just
  # registration_number - per #29's own lesson: a "failed rows" check
  # costs nothing extra to also return the column that explains why a row
  # failed, unlike most of this file's other business-rule checks below,
  # which only ever return a bare PK.
  - failed rows:
      fail query: |
        SELECT registration_number, date_of_birth
        FROM birth_registrations
        WHERE date_of_birth < DATE '1900-01-01' OR date_of_birth > CURRENT_DATE
      name: date_of_birth is within a plausible range
      # Explicit high ceiling, not reliance on Soda's own (documented,
      # unfixed) bug that "failed rows" checks ignore samples limit
      # entirely (GitHub sodadata/soda-core#1985 - see plans/qa-
      # pipeline.md #29). Today this check's own true failing-row count
      # never comes close to it on this fixture; the point is that this
      # project's *intent* - "get every failing row this check finds" -
      # is now stated explicitly, so a future Soda release that starts
      # enforcing samples limit properly doesn't silently reintroduce a
      # 100-row cap here without anyone having decided that's acceptable.
      samples limit: 100000
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.date_of_birth.range_check_soda
        name: Date of birth in a plausible range
        category: conformity
        introduced_date: "2026-09-13"
        description: >
          This value must be a plausible real date, neither in the future nor absurdly old.
        failure_indicates: >
          self-evident
        changelog: []

  # --- Registration/birth date ordering ---------------------------------
  # Same rule as the ODCS contract's matching type: sql check on
  # date_registered (a cross-field consistency rule, not a format check -
  # ODCS's "consistency" dimension). A registration date earlier than the
  # birth date indicates a corrupt or misjoined record.
  - failed rows:
      fail condition: date_registered < date_of_birth
      name: date_registered is not earlier than date_of_birth
      samples limit: 100000
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.date_registered.date_ordering_soda
        name: Registered on or after birth
        category: consistency
        introduced_date: "2026-01-15"
        description: >
          A registration must not be dated earlier than the birth it records.
        failure_indicates: >
          The record is corrupt, or two different registrations have been joined together into one.
        changelog: []

  # --- Supply timestamp ordering --------------------------------------------
  # A "failed rows" check with a custom fail condition - real SodaCL, not a
  # column metric, so run_soda_real.py routes this custom-named check to
  # the extract_timestamp column explicitly (it has no natural `column`
  # of its own to report). Same rule as the ODCS contract's matching
  # type: sql check on extract_timestamp.
  - failed rows:
      fail condition: extract_timestamp < date_registered OR extract_timestamp > date_registered + INTERVAL '1' DAY
      name: extract timestamp is logically ordered after date_registered
      samples limit: 100000
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.extract_timestamp.timestamp_ordering_soda
        name: Supply timestamp ordering
        category: consistency
        introduced_date: "2026-01-15"
        description: >
          A record must be timestamped on or after the registration it describes, and delivered inside the agreed window.
        failure_indicates: >
          self-evident
        changelog: []

  # --- Multiple-birth sibling match -----------------------------------------
  # A self-join "failed rows" check via a custom fail query - real SodaCL.
  # Flags every is_multiple_birth record with no matching sibling row (same
  # birth event). See daily_batch.py's generator fix: previously this flag
  # had no sibling logic behind it, so this would have failed on every
  # flagged row, every run, by construction. Routed to the is_multiple_birth
  # column explicitly, same reason as the check above.
  - failed rows:
      fail query: |
        SELECT a.registration_number
        FROM birth_registrations a
        WHERE a.is_multiple_birth = true
          AND NOT EXISTS (
            SELECT 1 FROM birth_registrations b
            WHERE b.is_multiple_birth = true
              AND b.registration_number != a.registration_number
              AND b.date_of_birth = a.date_of_birth
              AND b.place_of_birth_facility IS NOT DISTINCT FROM a.place_of_birth_facility
              AND b.registering_parent_1_name IS NOT DISTINCT FROM a.registering_parent_1_name
          )
      name: multiple birth records have a matching sibling
      samples limit: 100000
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.is_multiple_birth.sibling_match_soda
        name: Multiple-birth sibling match
        category: consistency
        introduced_date: "2026-01-15"
        description: >
          Every record flagged as a multiple birth must have a matching sibling in the same supply.
        failure_indicates: >
          self-evident
        changelog: []

  # --- Freshness / relative-date check ---------------------------------------
  # Another "failed rows" check via a custom fail query, real SodaCL - but
  # unlike every other check in this file (which counts VIOLATING rows),
  # this one's healthy state is "at least one row exists" - so the query
  # itself flips that back into "0 or 1 failing rows" (a single synthetic
  # row when the inner EXISTS finds nothing) rather than needing a new
  # check shape. Same rule as the ODCS contract's matching type: sql check
  # on date_of_birth. Routed to the date_of_birth column explicitly, same
  # reason as the two checks above. No samples limit here (unlike the
  # other failed rows checks above) - this query structurally returns 0
  # or 1 synthetic row regardless of any cap, so an explicit ceiling
  # would be meaningless.
  #
  # Anchored to date_registered rather than real wall-clock CURRENT_DATE
  # (Phase 5f, plans/qa-pipeline.md #61, 2026-09-17 - was permanently red
  # before this, same fix as the dbt/datacontract-cli versions of this
  # check): every row's date_registered is exactly this run's own
  # run_date (daily_batch.py's own comment: "this run's registrations
  # cluster on run_date"), so this is genuinely anchored per-run, not to
  # a fixed date. Not trivially always-passing either - ordinary
  # registration lag alone (0-9 days on every row) already puts most rows
  # within the 7-day window, so generator/dirty.py's inject_stale_
  # delivery (an occasional whole-run defect) is what gives this a real,
  # occasional failure to catch: on a stale run every row's date_of_birth
  # sits 15-45 days before date_registered.
  - failed rows:
      fail query: |
        SELECT 1 WHERE NOT EXISTS (
          SELECT 1 FROM birth_registrations WHERE date_of_birth >= date_registered - INTERVAL '7' DAY
        )
      name: recent birth dates present (freshness)
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.date_of_birth.freshness_soda
        name: Recent births present
        category: timeliness
        introduced_date: "2026-01-15"
        description: >
          Each supply must contain recent records rather than only old ones.
        failure_indicates: >
          self-evident
        changelog:
          - date: "2026-09-17T00:00:00Z"
            description: "Anchored to this run's own date_registered instead of real wall-clock CURRENT_DATE, which is why this check was permanently red. Paired with a new inject_stale_delivery generator defect so the check has something genuine to catch."
            author: "Keith Moss"
            breaking: true

# --- "Proportion of records since a certain date" ---------------------------
# Scopes the same invalid-value check to only the last 24 hours of extracts,
# so a brand-new drift is caught fast rather than being diluted by months of
# clean historical data sitting in the same table. This is what turns "check
# the whole table" into "check what we've received lately" - not a separate
# feature, just the same metric computed over a filtered subset.
filter birth_registrations [recent]:
  where: extract_timestamp >= CURRENT_DATE - 1

checks for birth_registrations [recent]:
  - invalid_percent(sex):
      valid values: [M, F, X]
      warn: when > 0%
      fail: when > 1%
      name: sex validity, last 24h only
      samples limit: 5
      attributes:
        check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.sex.invalid_percent_recent_soda
        name: Invalid values, recent supplies only
        category: conformity
        introduced_date: "2026-01-15"
        description: >
          A few unrecognised values are tolerated; a sustained rise fails, checked
          against the most recent supplies only so a newly-introduced value is
          caught early.
        failure_indicates: >
          The source system has started emitting a value that was never agreed in the
          contract, usually a new code introduced upstream without notice.
        changelog: []
