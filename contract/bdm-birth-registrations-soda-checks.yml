# SodaCL checks for the BDM birth-registrations feed, demonstrating a
# traffic-light (warn/fail) threshold model on top of the same feed described
# in bdm-birth-registrations-contract.yaml.
#
# This is real Soda Core syntax (warn:/fail: blocks with `when <condition>`),
# confirmed against current Soda docs and third-party integration guides.
# The exact keywords for scoping a check to "records since a date" (the
# `filter` block below) are a documented SodaCL concept but I haven't
# independently executed this file - Soda Core isn't pip-installable in this
# environment (see the tts-repo README from earlier in this thread for why).
# Run `soda scan` against this yourself to confirm before treating it as
# final, same caveat as the ODCS contract.
#
# Usage (once you have Soda Core set up):
#   pip install soda-core-postgres   # or whichever source connector you need
#   soda scan -d birth_registrations -c configuration.yml bdm-birth-registrations-soda-checks.yml

# --- Data drift: a row count that's structurally "fine" but wrong ----------
# (a doubled or truncated file passes every column-level check; only a
# volume check catches it - same rule as the ODCS contract's rowCount rule,
# now with a real amber tier instead of one flat threshold)
checks for birth_registrations:
  - row_count:
      warn: when < 500
      fail:
        when < 100
        when > 20000

  # --- Column rename / type change: missing_count on a required column ----
  # A silent rename makes this column disappear from the source query
  # entirely, which Soda surfaces as 100% missing - an immediate fail, no
  # amber tier needed since there's no acceptable partial-rename state.
  - missing_count(date_of_birth):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  # --- Full-triplication pass (2026-09-15, plans/qa-pipeline.md) -----------
  # Every check below already exists in the ODCS contract (nullValues/
  # invalidValues/duplicateValues/type: sql), and most already exist in
  # dbt's schema.yml too - added here so Soda implements the same rule set
  # rather than only the handful of hand-picked "traffic light demo"
  # checks. Same warn>0/fail>5 buffer as date_of_birth above for every
  # contract column with a near-zero-tolerance nullValues rule (mustBe: 0,
  # or mustBeLessThan a small integer), rather than a bespoke band per
  # column - date_of_birth already established that pattern in this file.
  - missing_count(registration_number):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - duplicate_count(registration_number):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - missing_count(child_given_names):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(child_family_name):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  # mustBeLessThan: 2 in the contract (up to 1 null tolerated, 2+ fails) -
  # a tighter, explicit threshold rather than the generic 0/5 buffer above.
  - missing_count(place_of_birth_suburb):
      warn: when > 0
      fail: when > 1
      samples limit: 5

  - missing_count(date_registered):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  - missing_count(extract_timestamp):
      warn: when > 0
      fail: when > 5
      samples limit: 5

  # These two mirror the contract's own explicit, wider tolerances
  # (mustBeLessThan: 5%/severity: warning, mustBeLessThan: 30%/severity:
  # info) rather than the 0/5-count buffer above - both properties are
  # optional (required: false) with a real, non-zero expected null rate
  # (single-parent registrations), same rationale as place_of_birth_
  # facility's missing_percent check below. SodaCL has no "info" severity,
  # so the info-tier rule below only sets warn (there's nothing stricter
  # than "worth a look" to escalate it to).
  - missing_percent(registering_parent_1_name):
      warn: when > 5%
      samples limit: 5

  - missing_percent(registering_parent_2_name):
      warn: when > 30%
      samples limit: 5

  # --- The traffic-light example you asked for: sex -----------------------
  # A closed value set that downstream systems depend on. Red/amber here
  # means genuinely different responses: a handful of invalid codes might be
  # a known source-system quirk worth a dashboard flag (amber); a sustained
  # spike means BDM's source system changed its coding and every downstream
  # consumer is about to silently misclassify records (red).
  - invalid_percent(sex):
      valid values: [M, F, X]
      warn: when > 0%
      fail: when > 2%
      samples limit: 5

  # --- Null rate creeping up, with a genuine amber band --------------------
  # Unlike date_of_birth above, some null rate here is expected (home births
  # without a recorded facility) - the amber tier exists specifically to
  # catch "creeping up" before it becomes bad enough to matter operationally.
  - missing_percent(place_of_birth_facility):
      warn: when > 15%
      fail: when > 35%
      samples limit: 5

  # --- source_system_record_id: uniqueness + format ------------------------
  # BDM's internal record ID - a duplicate means a re-extract landed twice;
  # an unexpected format means an upstream ID-scheme change, same rationale
  # as registration_number's own checks.
  - duplicate_count(source_system_record_id):
      warn: when > 0
      fail: when > 3
      samples limit: 5

  - invalid_percent(source_system_record_id):
      valid regex: '^SRC-[0-9]{9}$'
      warn: when > 0%
      fail: when > 1%
      samples limit: 5

  # --- Text field format/junk checks ----------------------------------------
  # A name should be letters, spaces, periods and hyphens only - same rule
  # as the ODCS contract's matching invalidValues rules on these 5 columns
  # (see that file's own comment for why this is a character-set check,
  # not a dictionary of known junk words: DuckDB's regex engine - the same
  # one Soda's `valid regex` compiles down to here - is RE2, which has no
  # lookahead support at all, so "reject any value containing a digit or
  # symbol" is as precise as this check can get).
  - invalid_percent(child_given_names):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - invalid_percent(child_family_name):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  # Closed value set (generator/names_au.py's SUBURBS pool, 51 real WA
  # suburb names) rather than a character-set regex - see the ODCS
  # contract's matching invalidValues rule for the full rationale.
  - invalid_percent(place_of_birth_suburb):
      valid values: ["Fremantle", "Subiaco", "Joondalup", "Rockingham", "Mandurah", "Midland", "Armadale", "Cannington", "Morley", "Cockburn Central", "Scarborough", "Victoria Park", "Bunbury", "Albany", "Geraldton", "Kalgoorlie", "Broome", "Karratha", "Port Hedland", "Busselton", "Northam", "Narrogin", "Esperance", "Collie", "Mount Lawley", "Leederville", "Wembley", "Innaloo", "Success", "Baldivis", "Ellenbrook", "Butler", "Balga", "Girrawheen", "Maddington", "Gosnells", "Kwinana", "Hamilton Hill", "Beaconsfield", "South Perth", "Bentley", "Willetton", "Riverton", "Karrinyup", "Currambine", "Clarkson", "Yanchep", "Byford", "Waroona", "Manjimup", "Margaret River"]
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - invalid_percent(registering_parent_1_name):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  - invalid_percent(registering_parent_2_name):
      valid regex: '^[A-Za-z][A-Za-z. -]*$'
      warn: when > 0%
      fail: when > 3%
      samples limit: 5

  # --- Date-of-birth range (item 28's decision) -----------------------------
  # Same rule as the ODCS contract's matching type: sql check on
  # date_of_birth - see plans/qa-pipeline.md #26 (the bug found in the
  # independent aggregate's copy of this same condition) and #28 (the
  # decision to add this here and to dbt specifically so a PK-yielding
  # tool exists for it, since datacontract-cli's type: sql rules never
  # expose one). Selects date_of_birth itself alongside the PK - not just
  # registration_number - per #29's own lesson: a "failed rows" check
  # costs nothing extra to also return the column that explains why a row
  # failed, unlike most of this file's other business-rule checks below,
  # which only ever return a bare PK.
  - failed rows:
      fail query: |
        SELECT registration_number, date_of_birth
        FROM birth_registrations
        WHERE date_of_birth < DATE '1900-01-01' OR date_of_birth > CURRENT_DATE
      name: date_of_birth is within a plausible range

  # --- Registration/birth date ordering ---------------------------------
  # Same rule as the ODCS contract's matching type: sql check on
  # date_registered (a cross-field consistency rule, not a format check -
  # ODCS's "consistency" dimension). A registration date earlier than the
  # birth date indicates a corrupt or misjoined record.
  - failed rows:
      fail condition: date_registered < date_of_birth
      name: date_registered is not earlier than date_of_birth

  # --- Extract timestamp ordering -------------------------------------------
  # A "failed rows" check with a custom fail condition - real SodaCL, not a
  # column metric, so run_soda_real.py routes this custom-named check to
  # the extract_timestamp column explicitly (it has no natural `column`
  # of its own to report). Same rule as the ODCS contract's matching
  # type: sql check on extract_timestamp.
  - failed rows:
      fail condition: extract_timestamp < date_registered OR extract_timestamp > date_registered + INTERVAL '1' DAY
      name: extract timestamp is logically ordered after date_registered

  # --- Multiple-birth sibling match -----------------------------------------
  # A self-join "failed rows" check via a custom fail query - real SodaCL.
  # Flags every is_multiple_birth record with no matching sibling row (same
  # birth event). See daily_batch.py's generator fix: previously this flag
  # had no sibling logic behind it, so this would have failed on every
  # flagged row, every run, by construction. Routed to the is_multiple_birth
  # column explicitly, same reason as the check above.
  - failed rows:
      fail query: |
        SELECT a.registration_number
        FROM birth_registrations a
        WHERE a.is_multiple_birth = true
          AND NOT EXISTS (
            SELECT 1 FROM birth_registrations b
            WHERE b.is_multiple_birth = true
              AND b.registration_number != a.registration_number
              AND b.date_of_birth = a.date_of_birth
              AND b.place_of_birth_facility IS NOT DISTINCT FROM a.place_of_birth_facility
              AND b.registering_parent_1_name IS NOT DISTINCT FROM a.registering_parent_1_name
          )
      name: multiple birth records have a matching sibling

  # --- Freshness / relative-date check ---------------------------------------
  # Another "failed rows" check via a custom fail query, real SodaCL - but
  # unlike every other check in this file (which counts VIOLATING rows),
  # this one's healthy state is "at least one row exists" - so the query
  # itself flips that back into "0 or 1 failing rows" (a single synthetic
  # row when the inner EXISTS finds nothing) rather than needing a new
  # check shape. Same rule as the ODCS contract's matching type: sql check
  # on date_of_birth - see that file's own comment for the honest
  # limitation this shares with the [recent] filter below (real wall-clock
  # CURRENT_DATE vs. this fixture's fixed Sept 2026 dates). Routed to the
  # date_of_birth column explicitly, same reason as the two checks above.
  - failed rows:
      fail query: |
        SELECT 1 WHERE NOT EXISTS (
          SELECT 1 FROM birth_registrations WHERE date_of_birth >= CURRENT_DATE - INTERVAL '7' DAY
        )
      name: recent birth dates present (freshness)

# --- "Proportion of records since a certain date" ---------------------------
# Scopes the same invalid-value check to only the last 24 hours of extracts,
# so a brand-new drift is caught fast rather than being diluted by months of
# clean historical data sitting in the same table. This is what turns "check
# the whole table" into "check what we've received lately" - not a separate
# feature, just the same metric computed over a filtered subset.
filter birth_registrations [recent]:
  where: extract_timestamp >= CURRENT_DATE - 1

checks for birth_registrations [recent]:
  - invalid_percent(sex):
      valid values: [M, F, X]
      warn: when > 0%
      fail: when > 1%
      name: sex validity, last 24h only
      samples limit: 5
