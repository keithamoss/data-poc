# ---------------------------------------------------------------------
# WHICH CALENDAR EACH COLLECTION IS ON. A dataset that names none takes
# its collection's - thirty datasets naming one calendar thirty times is
# thirty chances to disagree.
collections:
  - id: civil-registration
    calendar: daily
    # WHICH PERIOD A ROUND'S FILES GO INTO (REQ-PIPE-320): stated on the
    # collection, never a dataset, from the collection's first round.
    files_go_to_period:
      versions:
        - effective_from: "2026-06-18"
          value: 0
          changelog:
            - date: "2026-10-30"
              author: REQ-PIPE-320
              change: >-
                Birth Registrations' files go into the period they arrive in - the day's own. Stated from its first round, so nothing moves.
  - id: child-protection
    calendar: quarterly
    # WHICH PERIOD A ROUND'S FILES GO INTO (REQ-PIPE-320): stated on the
    # collection, never a dataset, from the collection's first round.
    files_go_to_period:
      versions:
        - effective_from: "2015-01-01"
          value: 1
          changelog:
            - date: "2026-10-30"
              author: REQ-PIPE-320
              change: >-
                Child Protection's files are not yet linked when they arrive, so each round's files go into the NEXT period, whose linkage release they become (REQ-GEN-325). Stated from its first round, so its whole synthetic history is at one value.
    # STATED ONCE FOR THE COLLECTION (REQ-PIPE-181): every Child Protection
    # dataset takes its due time and grace from here unless it states its own.
    participation_defaults:
      versions:
        # TEN EARLIER YEARS (REQ-GEN-207), EIGHT SINCE REQ-GEN-238 - see the
        # quarterly calendar above.
        - effective_from: "2015-01-01"
          expected_time: "09:00"
          grace: 8h
          changelog:
            - date: "2026-10-15"
              author: REQ-GEN-207
              change: >-
                Child Protection owes supplies from 2013-01-01, ten years earlier -
                the synthetic history grows at its old end. The same due time and
                grace as the version after it.
            - date: "2026-10-26"
              author: REQ-GEN-238
              change: >-
                Owed from 2015-01-01 rather than 2013-01-01 - the two oldest grown
                years are dropped, because the scenarios that stayed on Child
                Protection need only eight.
        - effective_from: "2023-01-01"
          expected_time: "09:00"
          grace: 8h
          changelog:
            - date: "2026-10-11"
              author: REQ-PIPE-181
              change: >-
                Moved up from each Child Protection dataset's own participation,
                unchanged - 09:00 with 8 hours' grace, as every one of them stated.
  - id: emergency-department
    calendar: quarterly
    # WHICH PERIOD A ROUND'S FILES GO INTO (REQ-PIPE-320): stated on the
    # collection, never a dataset, from the collection's first round.
    files_go_to_period:
      versions:
        - effective_from: "2013-01-01"
          value: 0
          changelog:
            - date: "2026-10-30"
              author: REQ-PIPE-320
              change: >-
                Emergency Department's files arrive already linked, so they go into the period they arrive in. Stated from its first round, so nothing moves.
    # REQ-QAC-231: owed from the first quarter its synthetic history holds
    # (REQ-GEN-232), due 09:00 with 8 hours' grace as Child Protection.
    participation_defaults:
      versions:
        - effective_from: "2013-01-01"
          expected_time: "09:00"
          grace: 8h
          changelog:
            - date: "2026-10-18"
              author: REQ-GEN-205
              change: >-
                Emergency Department owes supplies from 2013-01-01, for its correction
                scenarios (TS-57 to TS-61). The same due time and grace as the
                version after it.
        - effective_from: "2023-01-01"
          expected_time: "09:00"
          grace: 8h
          changelog:
            - date: "2026-10-18"
              author: REQ-QAC-231
              change: >-
                Emergency Department owes a supply every quarter from 2023-01-01,
                due at 09:00 with 8 hours' grace.

# ---------------------------------------------------------------------
# EACH DATASET'S PARTICIPATION, as effective-dated versions. A version
# carries the dataset's expected time of day and its grace allowance (how
# long after the expected time a supply still counts as on time), and may
# override its calendar's claim window. It may say which of its calendar's
# periods the dataset owes, under `participates:` - delivery months by full
# name, or `all` - with a `reason:` when it owes only some. Saying nothing
# owes every period. The FIRST version's effective_from is the date the
# dataset began owing supplies; there is no separate owes_from.
#
# EVERY VERSION RESTATES WHAT ITS PREDECESSOR STATED, so a version always
# reads as complete on its own and a value is never silently dropped.
datasets:
  - id: birth-registrations
    participation:
      versions:
        # FORTY MORE, AS AN EARLIER VERSION AGAIN (REQ-GEN-196 criterion 20).
        # FIVE MORE (post-build-review #172) - see the daily calendar above.
        # THE EVENING-BEFORE ERA (REQ-GEN-044, Keith, 2026-10-15): twelve
        # earlier days in which the supply for day D is due at 22:00 on D-1.
        - effective_from: "2026-06-18"
          expected_time: "22:00"
          days_before: 1
          grace: 1h
          changelog:
            - date: "2026-10-16"
              author: REQ-GEN-044
              change: >-
                Birth Registrations owes a supply from 2026-06-18, each due at
                22:00 the evening before its day - the evening-before era the
                scenarios TS-3c, TS-3d and TS-10 need. From 2026-06-30 it is
                due at 14:00 on the day, as before.
        - effective_from: "2026-06-30"
          expected_time: "14:00"
          # Restated since the evening-before version above states 1: every
