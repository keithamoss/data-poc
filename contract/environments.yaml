# THE ENVIRONMENTS THIS DATA ASSET IS DEPLOYED INTO.
#
# CONFIGURATION, NOT STATE, which is why this file is committed and why
# it does NOT say which one you are. The list declares how the system
# behaves and is the same for everybody who checks the repository out;
# the answer to "which of these am I" is a property of one deployment,
# so it comes from the MOTHMAN_ENVIRONMENT variable beside the database
# DSN it belongs with. Putting the answer in a file would mean either
# committing one deployment's identity for everyone, or gitignoring the
# list and losing the review that makes it configuration at all.
#
# WHY IT EXISTS (Keith, 2026-09-27): the dashboard is built where the
# data is, once GitHub Actions stops being allowed to reach a database.
# A dashboard built here and a dashboard built from somebody's
# development environment are then different artifacts that look
# identical, so each has to say which environment produced it - "this
# dashboard here is physically separate to a dashboard from my
# development or production or another user".
#
# An id is a bare identifier because it reaches a schema name, a file
# name and a URL. `publishes: true` marks the one environment whose
# build is the published one; the rest build for their own readers.
#
# `confirm_changes: true` makes a person TYPE the environment's id before
# any change they make to the database by hand from the terminal - no y/N,
# and no flag skips it (REQ-PIPE-093 criteria 4 to 8). Keyed off this
# property, never off the word "production", because a second data asset
# is a second deployment of this same file. The pipeline's own unattended
# writes never ask (criterion 9).
#
# `ticketing: true` is the only thing that turns ticketing on (criterion
# 10) - never GITHUB_REPOSITORY, which GitHub Actions sets on every run.
# The repository tickets go to is a fact about the data asset, so it is
# contract/data-asset.yaml's `ticket_repository`, and an environment that
# turns ticketing on where none is named is refused before it connects.
#
# `ci` WAS ADDED 2026-09-28, and the alternative is worth recording
# because it looked cheaper: labelling a GitHub Actions runner `sandbox`.
# That is a lie of exactly the kind this list exists to prevent - the
# sandbox entry describes "an agent session's container", which a runner
# is not, and the error you get for an unset variable says the reason
# plainly: a build that guesses is a build that can be labelled as
# somewhere it is not. A runner is a real, distinct place a build can
# come from, so it gets its own entry.
environments:
  - id: local
    label: Local development
    description: >
      A developer's own checkout and their own database. Builds a
      dashboard to look at, and never publishes.
    publishes: false
    confirm_changes: false
    ticketing: false

  - id: sandbox
    label: Claude Code sandbox
    description: >
      An agent session's container. Data is synthetic and the database
      does not survive the container, so a build here describes a
      moment rather than a system of record.
    publishes: false
    confirm_changes: false
    ticketing: false

  - id: ci
    label: Continuous integration
    description: >
      A GitHub Actions runner, with a PostgreSQL service container that
      exists for the length of one job. It generates its own synthetic
      supplies so the test suite has something to drive, and publishes
      nothing - the publisher runs where the data is (REQ-PIPE-092), and a
      runner has no route to any real database.
    publishes: false
    confirm_changes: false
    ticketing: false

  - id: production
    label: Production
    description: >
      The deployment whose build is the published dashboard. One per
      data asset - the asset is a deployment's identity rather than a
      row in the data, so a second asset is a second deployment of this
      same configuration, not another entry here.
    publishes: true
    confirm_changes: true
    ticketing: true

  # REQ-PIPE-093 criterion 16: a test worker's own scratch database. Set
  # ONLY by the test suite's fixtures, so a worker is never labelled as
  # the CI runner or the sandbox it happens to run in.
  - id: test
    label: Test suite
    description: >
      A test worker's own scratch database, created and dropped by the
      suite. Publishes nothing, asks nothing, tickets nothing.
    publishes: false
    confirm_changes: false
    ticketing: false
