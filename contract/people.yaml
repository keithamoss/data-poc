# Real people who work on this data asset, and which real datasets/
# agencies they're responsible for - running-thoughts.md #2 ("data-
# asset-level people/roles config"), scoped via AskUserQuestion with
# Keith, 2026-09-18: drives real GitHub ticket assignment
# (qa_tools/common/ticket_sync.py's `--assignee`, qa_tools/common/
# people.py's own resolver) and a small "Owned by" indicator on the
# dashboard's agency/dataset headers. Sits alongside contract/data-
# asset.yaml, but this file is genuinely per-dataset/agency-capable
# (that one is deliberately data-asset-wide only, one value for the
# whole system - Thread C's own correction, see that file's header) -
# both real, deliberate forks, resolved with Keith before building.
#
# Shipped EMPTY at first - this session didn't know Keith's real email
# or full name and wouldn't guess at personal details, even small ones.
# Filled in 2026-09-19 once Keith gave his own real details directly
# (name/nickname/github/roles/scope, all via AskUserQuestion rounds) -
# his `registry-services` (Birth Registrations/RBDM) assignment is real.
# The other entries below are Monty Python-named placeholders (his own
# explicit ask, same round) standing in for colleagues not yet named for
# real - fictional people, fictional example.com emails, deliberately
# no `github:` so they can never be real-assigned to a real ticket, only
# shown in the dashboard's "Owned by" badge. Every consumer of this file
# (ticket_sync.py, that badge) still degrades to "no assignee" gracefully
# when a scope has no matching entry, same treatment every other
# optional embedded feed on this page already gets.
#
# Schema:
#
# people:
#   - email: keith@example.com   # the same real identity qa_tools/common/git_identity.py's
#                                 # get_run_by() already stamps into every real QA run as
#                                 # `run_by` - this is the stable key `assignments:` below
#                                 # references a person by, not a separate made-up id.
#     name: Keith Amoss          # a real display name.
#     nickname: Keith            # optional - shown in the dashboard's own "Owned by" badge
#                                 # instead of the full name when set.
#     placeholder: true          # OPTIONAL, default false. A stand-in for a colleague not
#                                 # yet named for real (REQ-GHUB-082 criterion 29). A
#                                 # placeholder is SHOWN - the dashboard's "Owned by" badge
#                                 # reads better with a name than with a gap - and can do
#                                 # nothing: it raises no filing decision and is assigned no
#                                 # GitHub ticket. `mothman check`'s people gate requires a
#                                 # `github:` on everybody who is NOT one, so a real person
#                                 # added without a username fails the build rather than
#                                 # silently being unable to act.
#     github: keithamoss         # a real GitHub username - required for real ticket
#                                 # assignment (`gh issue create --assignee`), optional
#                                 # otherwise (a person can be listed/shown without ever
#                                 # being assignable to a ticket).
#     roles: [qa, manager]       # one or more of the roles DECLARED under `roles:` below
#                                 # (REQ-GHUB-171 criterion 1) - a new role is one new line
#                                 # there, and a typo'd one fails the people gate.
#
# assignments:
#   - data_asset: data-asset-1   # EXACTLY ONE LEVEL (REQ-GHUB-171 criterion 2): the whole
#     person: keith@example.com  # data asset (`data_asset:`, its data_asset_id), an agency
#     role: manager              # (`agency:`) or a dataset (`dataset:`). The manager at
#                                 # data-asset level is the ASSET MANAGER, accountable for
#                                 # the whole asset; a manager at agency level is that
#                                 # agency's own. The gate fails without a real asset manager.
#   - agency: registry-services
#     person: keith@example.com  # `person` references a real people[].email above.
#     role: qa
#   - dataset: cp-clients        # A dataset-level entry OVERRIDES its whole agency's entries
#     person: keith@example.com  # outright for that one dataset (never merged with the
#     role: peer_review          # agency-level list) - qa_tools/common/people.py's own
#                                 # assignees_for() docstring has the full reasoning.
#
# Multiple people can be assigned to the same scope, in different (or
# the same) roles - a real ticket gets assigned to everyone currently
# responsible for that dataset/agency, not just one arbitrarily-picked
# role.

# The roles a person may hold or be assigned (REQ-GHUB-171 criterion 1).
roles:
  - qa
  - peer_review
  - manager

people:
  - email: fpycnkgvmt@privaterelay.appleid.com
    name: Keith Moss
    nickname: K$
    github: keithamoss
    roles: [qa, manager]
  - email: brian.cohen@example.com
    name: Brian Cohen
    nickname: Brian
    roles: [qa]
    placeholder: true
  - email: reg@example.com
    name: Reg
    nickname: Reg
    roles: [peer_review]
    placeholder: true
  - email: arthur.pendragon@example.com
    name: Arthur, King of the Britons
    nickname: Arthur
    roles: [manager]
    placeholder: true
  # THE SCRIPTED HISTORY'S ACTOR (REQ-GEN-135). Raises the person decisions a
  # synthetic history plays back, and nothing else: no GitHub username, never
  # assigned, refused on every route outside scripted playback, and only on an
  # asset that declares itself synthetic.
  # Its NAME is an ordinary fictional one on purpose (REQ-GEN-135 criterion 12:
  # the dataset pages show a scripted decision exactly as any person's, never
  # labelled); its EMAIL is what names it as synthetic in the log and the
  # terminal (NFR, auditability).
  - email: scripted-history@synthetic.invalid
    name: Robin Hale
    nickname: Robin
    roles: [qa]
    synthetic: true

assignments:
