              # value (one row per distinct duplicated value), so an
              # unconfigured fail_calc (dbt-core's own default, "count(*)")
              # counts distinct BAD VALUES, not duplicate ROWS - see the
              # accepted_values tests' own comments elsewhere in this file
              # for the identical reasoning, which this test just never
              # got despite describing it. Confirmed via dbt-core's own
              # source (dbt/artifacts/resources/v1/config.py's
              # `fail_calc: str = "count(*)"` default) and a real warehouse
              # (cp_run_10_2026-09-14: 20 distinct duplicated values, 40
              # total rows across those groups - this fixture's duplicate
              # injection always creates simple pairs, so "distinct values"
              # and "total rows" differed by exactly 2x, not a coincidence
              # once you know the cause).
          - not_null:
              meta:
                check_id: data-asset-1.child-protection-family-support.child-protection.cp-notifications.notification_id.not_null_dbt
