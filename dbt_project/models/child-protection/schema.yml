version: 2

# Child Protection's dbt checks (REQ-QAC-241: each collection's dbt files
# sit in a folder of their own). The general notes on dbt generic-test
# syntax, and on why singular tests carry their metadata in a top-level
# `tests:` block, are in dbt_project/models/civil-registration/schema.yml.
#
# The `relationships` test this file lacked (see the comment this replaces)
# now exists below, on the 6 Child Protection staging models - real dbt
# generic-test syntax (`relationships: {to: ref('...'), field: ...}`),
# confirmed by actually running `dbt test` against a real per-run CP
# warehouse (qa_tools/tools/stage.py). All 7 still pass 0/0 on
# every CLEAN run - child_protection.py's own generation logic never
# produces a dangling FK by construction - and generator/dirty.py's
# placement/investigation presets still ALSO reassign a placement's
# carer_id to a still-real (just non-Approved) carer, and null an
# investigation's end_date, as their own separate business-rule failure
# modes. But these 7 relationships tests are no longer untestable-by-
# design on amber/red runs: plans/qa-pipeline.md #27's dangling-FK pass
# (2026-09-15, Keith's call, reversing the 2026-09-13 scoping decision
# this comment used to describe) added a genuine "points at a row that
# doesn't exist at all" injector to every one of these 7 columns, so a
# dirty run now exercises real referential-integrity failures here too,
# not just the business rules layered on top of them (see contract/
# child-protection-contract.yaml's matching SQL-rule versions of these
# same 7 checks for the fuller account of why they're a genuine backstop
# against a dropped join or truncated parent extract).
#
# The three cross-table business rules approved alongside these FKs
# (escalation completeness, placement/carer approval compliance,
# closed-case investigation hygiene) are dbt SINGULAR tests instead of
# generic ones - each is a row-level cross-table SELECT with no reusable
# "column vs column" shape, which is exactly what tests/*.sql is for. All
# three pass cleanly (0 violations) on every clean run, by construction -
# child_protection.py only assigns Approved carers to a placement and only
# closes a case once its investigations have concluded - and dirty.py's
# amber/red-only presets are what reintroduce a controlled, real violation
# count. See tests/escalation_completeness.sql, tests/placement_carer_approval.sql,
# tests/closed_case_investigation_hygiene.sql - each header documents the
# same real numbers already found and explained in the contract file,
# rather than repeating them here.

tests:
  - name: escalation_completeness
    config:
      meta:
        check_id: data-asset-1.child-protection-family-support.child-protection.cp-notifications.notification_id.escalation_completeness_dbt
        reads_columns: ["cp_notifications.notification_id", "cp_notifications.outcome", "cp_investigations.notification_id", "cp_investigations.investigation_id"]
        reads_tables: [cp_investigations]
        name: Escalation completeness
        category: completeness
        introduced_date: "2023-01-15"
        description: >
          Every notification escalated to an investigation must have that investigation recorded.
        failure_indicates: >
          self-evident
        changelog: []
  - name: closed_case_investigation_hygiene
    config:
      meta:
        check_id: data-asset-1.child-protection-family-support.child-protection.cp-investigations.investigation_id.closed_case_investigation_hygiene_dbt
        reads_columns: ["cp_investigations.investigation_id", "cp_investigations.cp_client_id", "cp_investigations.end_date", "cp_clients.cp_client_id", "cp_clients.case_status"]
        reads_tables: [cp_clients]
        name: Closed-case hygiene
        category: consistency
        introduced_date: "2023-01-15"
        description: >
          An investigation must not still be open once its client's case has been closed.
        failure_indicates: >
          self-evident
        changelog: []
  - name: placement_carer_approval
    config:
      meta:
        check_id: data-asset-1.child-protection-family-support.child-protection.cp-placements.carer_id.placement_carer_approval_dbt
        reads_columns: ["cp_placements.placement_id", "cp_placements.carer_id", "cp_carers.carer_id", "cp_carers.approval_status"]
        reads_tables: [cp_carers]
        name: Carer approval compliance
        category: consistency
        introduced_date: "2023-01-15"
        description: >
          A placement's carer must hold an approved status.
        failure_indicates: >
          self-evident
        changelog: []

