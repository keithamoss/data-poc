                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: date_of_birth
        description: >
          not_null is the plain nullValues rule; accepted_range replaces
          tests/cp_client_date_of_birth_range.sql (2026-09-15, dbt_utils
          switch - see plans/qa-pipeline.md). Lower bound only, no
          max_value - matching what the CP contract's own reverse-gap
          rule and Soda's matching check actually enforce, not silently
          adding stricter coverage than either has (see the contract's
          own comment on this - dirty.py never injects a future
          date_of_birth for this table, only implausibly old ones).
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.child-protection-family-support.child-protection.cp-clients.date_of_birth.not_null_dbt
                category: completeness
                introduced_date: "2023-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
          - dbt_utils.accepted_range:
              min_value: "DATE '1900-01-01'"
              meta:
                check_id: data-asset-1.child-protection-family-support.child-protection.cp-clients.date_of_birth.accepted_range_dbt
                name: Date of birth in a plausible range
                category: conformity
                introduced_date: "2023-01-15"
                description: >
                  This value must be a plausible real date, neither in the future nor absurdly old.
                failure_indicates: >
                  self-evident
                changelog: []
              config:
                # Carries forward tests/cp_client_date_of_birth_range.
                # sql's own two-tier config (warn_if = '>10', error_if =
                # '>20') - a real bug caught during verification: without
                # this, an unconfigured accepted_range hard-fails on any
                # violation (same default-error_if=">0" quirk item 30
                # already found for not_null), which disagreed with
                # Soda's own matching check (still warn>10/fail>20) on 2
                # of this fixture's 10 runs (7 and 5 violations, both
                # amber-appropriate, both wrongly read as "fail" before
                # this fix). Matches Keith's own framing when this check
                # was first scoped: up to 10 bad dates is tolerable.
                warn_if: ">10"
                error_if: ">20"

      - name: sex
        tests:
          - accepted_values:
              values: ['M', 'F', 'X']
              meta:
                check_id: data-asset-1.child-protection-family-support.child-protection.cp-clients.sex.accepted_values_dbt
                category: conformity
                introduced_date: "2023-01-15"
                description: >
                  A few unrecognised values are tolerated; a sustained rise fails.
                failure_indicates: >
                  The source system has started emitting a value that was never agreed in the
                  contract, usually a new code introduced upstream without notice.
                changelog: []
              config:
                fail_calc: "coalesce(sum(n_records), 0)"
                warn_if: ">0"
                error_if: ">15"

      - name: suburb
        tests:
