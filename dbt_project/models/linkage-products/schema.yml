# Linkage Products' dbt models (REQ-QAC-330, REQ-PIPE-296). Linkage Keys'
# checks are Soda's (contract/department-of-health/linkage-products-soda-checks.yml);
# each geocoding table's three year checks are dbt's (REQ-QAC-297), one shared
# macro behind three thin generic tests. The prose follows
# docs/check-authoring-rules.md.
version: 2

models:
  - name: stg_linkage_keys
    description: One row per linked source record, per quarterly linkage release.
  - name: stg_geo_cp_clients
    description: One row per Client Register record and census year in force, per quarterly geocoding release.
    columns:
      - name: census_year
        tests:
          - missing_set_members:
              key_columns: [id_1]
              member_setting: census_years
              meta:
                check_id: data-asset-1.department-of-health.linkage-products.geo-cp-clients.census_year.missing_set_members_dbt
                name: Census year present for every record
                category: completeness
                introduced_date: "2013-01-01"
                description: >
                  Every record must have a row for each census year in force for the period; one missing year for one record fails.
                failure_indicates: >
                  Either the geocoder did not process a census edition's boundaries for some records, or the records were added to the source after the geocoder last ran for that year.
                technical_note: >
                  One of three checks over the same rule - exactly one row per record for each census year in force - each counting one kind of violation, so a missing, a repeated and an unexpected year are separate alarms. The set in force is the one declared for the period, so a supply is judged against the set agreed for its own period after the set widens.
                changelog:
                  - date: "2017-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2016 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
                  - date: "2022-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2021 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
                  - date: "2027-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2026 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
          - duplicated_set_members:
              key_columns: [id_1]
              member_setting: census_years
              meta:
                check_id: data-asset-1.department-of-health.linkage-products.geo-cp-clients.census_year.duplicated_set_members_dbt
                name: Each census year once per record
                category: uniqueness
                introduced_date: "2013-01-01"
                description: >
                  A record must have no more than one row for the same census year; a single repeat fails.
                failure_indicates: >
                  The geocoding release was loaded twice, or the geocoder placed one record twice for the same census edition.
                technical_note: >
                  One of three checks over the same rule - exactly one row per record for each census year in force - each counting one kind of violation, so a missing, a repeated and an unexpected year are separate alarms. The set in force is the one declared for the period, so a supply is judged against the set agreed for its own period after the set widens.
                changelog:
                  - date: "2017-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2016 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
                  - date: "2022-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2021 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
                  - date: "2027-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2026 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
          - unexpected_set_members:
              key_columns: [id_1]
              member_setting: census_years
              meta:
                check_id: data-asset-1.department-of-health.linkage-products.geo-cp-clients.census_year.unexpected_set_members_dbt
                name: Only agreed census years
                category: conformity
                introduced_date: "2013-01-01"
                description: >
                  Every row must carry a census year in force for the period; a single year outside it, or none, fails.
                failure_indicates: >
                  The geocoder has started delivering a census edition nobody agreed for the period, or a row was released without its year.
                technical_note: >
                  One of three checks over the same rule - exactly one row per record for each census year in force - each counting one kind of violation, so a missing, a repeated and an unexpected year are separate alarms. The set in force is the one declared for the period, so a supply is judged against the set agreed for its own period after the set widens.
                changelog:
                  - date: "2017-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2016 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
                  - date: "2022-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2021 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
                  - date: "2027-08-01T00:00:00Z"
                    description: "The set of census years in force widens to add 2026 from this date; supplies for periods before it are still judged against the earlier set (REQ-QAC-300)."
                    author: "Keith Moss"
                    breaking: true
