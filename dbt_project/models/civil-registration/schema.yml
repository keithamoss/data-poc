version: 2

# Real dbt generic-test syntax, run for real by `dbt test` (dbt-core 1.12 +
# dbt-duckdb) via qa_tools/tools/run_dbt.py.
#
# Several things below aren't what a plausible-looking first draft of this
# file assumed - each only found by actually running `dbt test`:
#
# 1. error_if/warn_if with a "%" suffix (e.g. ">2%") is NOT real dbt-core
#    syntax. It's spliced verbatim into `{{ fail_calc }} {{ error_if }}`
#    (dbt-core's own default__get_test_sql macro), producing literally
#    invalid SQL like `count(*) >2%`. A genuine percentage-of-rows
#    threshold needs `fail_calc` overridden to compute the percentage
#    itself - and fail_calc can't reference the model via `{{ ref(...) }}`
#    either: dbt's generic-test config parser explicitly rejects custom
#    macros in a config value, only bare Jinja-free SQL.
# 2. `config.severity` isn't a display label layered on top of warn_if/
#    error_if - dbt/task/test.py's own status logic only ever reaches
#    "fail" when severity is (the default) "error"; `severity: warn` caps
#    every run of a test at warn/pass forever, no matter what error_if
#    says. So neither test below sets `severity` at all.
# 3. A confirmed dbt-duckdb reliability bug (not this project's SQL):
#    dbt-core's own reported `failures` for a percentage-based `fail_calc`
#    was reproducibly wrong - 0 instead of the true row count - on some
#    runs, while the identical compiled SQL executed directly via DuckDB's
#    own Python API against the same file always gave the right answer.
#    This survived removing every layer of arithmetic (rounding, casting,
#    plain division, even a bare unmodified `count(*)`), disabling partial
#    parsing, forcing `--store-failures`, and substituting SUM for COUNT -
#    none of it was the cause, and no SQL-level explanation was found
#    despite extensive isolation. The two tests below use absolute
#    row-count thresholds instead of a computed percentage as a result,
#    and qa_tools/tools/run_dbt.py independently re-verifies both tests'
#    result via a direct query against the same warehouse dbt just tested,
#    rather than trust a demonstrated-unreliable number.
#
# See README.md's "known simplifications and honest disagreements" for the
# fuller account of all three.

# Singular tests (tests/*.sql) get their own check-lifecycle metadata via
# this top-level `tests:` block (dbt's "data test properties" - config
# keyed by the test's own file/function name, not nested under a model)
# rather than a {{ config(meta={...}) }} macro call inside the .sql file
# itself - keeps every check's lifecycle metadata parseable as plain YAML
# by qa_tools/common/check_lifecycle.py the same way every generic test
# already is, rather than needing a second, Jinja-aware parser for one
# category of check. A real, pre-existing gap found 2026-09-16 while
# wiring check_id into the dashboard: check_lifecycle.py's dbt parser
# only ever walked models[].tests/models[].columns[].tests, so every
# singular test (this file's own multiple_birth_sibling, plus Child
# Protection's 3 cross-table business-rule tests) had NO check_id
# anywhere and was silently invisible to check_lifecycle.validate() -
# not failing the gate, just never seen by it at all. See
# plans/qa-pipeline.md's own entry for the full account.
#
# Writing the reader-facing prose (description/failure_indicates/
# technical_note): docs/check-authoring-rules.md is the standing
# authoring standard - read it before adding or editing any of the
# three. The lifecycle gate only checks that failure_indicates is
# present; nothing enforces the wording rules.
tests:
  - name: multiple_birth_sibling
    config:
      meta:
        check_id: data-asset-1.registry-services.civil-registration.birth-registrations.is_multiple_birth.multiple_birth_sibling_dbt
        reads_columns: ["birth_registrations.registration_number", "birth_registrations.is_multiple_birth", "birth_registrations.date_of_birth", "birth_registrations.place_of_birth_facility", "birth_registrations.registering_parent_1_name"]
        name: Multiple-birth sibling match
        category: consistency
        introduced_date: "2026-01-15"
        description: >
          Every record flagged as a multiple birth must have a matching sibling in the same supply.
        failure_indicates: >
          self-evident
        changelog: []
  - name: recency
    config:
      meta:
        check_id: data-asset-1.registry-services.civil-registration.birth-registrations.recency_dbt
        reads_columns: ["birth_registrations.date_of_birth", "birth_registrations.date_registered"]
        name: Recent births present
        category: timeliness
        introduced_date: "2026-09-15"
        description: >
          Each supply must contain recent records rather than only old ones.
        failure_indicates: >
          self-evident
        changelog:
          - date: "2026-09-17T00:00:00Z"
            description: "Rebuilt as a singular test (tests/recency.sql) anchored to this run's own date_registered instead of real wall-clock CURRENT_DATE - the dbt_utils.recency macro had no way to parametrize its 'now', which is why this check was permanently red. Paired with a new inject_stale_delivery generator defect so the check has something genuine to catch."
            author: "Keith Moss"
            breaking: true

models:
  - name: stg_birth_registrations
    description: >
      One row per birth registration, across all loaded runs
      (run_id/run_date identify which run a row came from). dirty_severity
      was dropped by REQ-GEN-043: it is generator bookkeeping, and a
      pipeline reading it is filing from a declaration rather than from
      what arrived.
    # Model-level tests (2026-09-15, dbt_utils switch - see plans/qa-
    # pipeline.md) - dbt_utils.expression_is_true/recency both operate
    # across the model as a whole (a cross-field comparison; a max()
    # aggregate), not one column, the same reason these previously lived
    # as singular tests rather than under a `columns:` entry.
    tests:
      - dbt_utils.expression_is_true:
          meta:
            check_id: data-asset-1.registry-services.civil-registration.birth-registrations.expression_is_true_dbt
            reads_columns: ["birth_registrations.date_of_birth", "birth_registrations.date_registered"]
            name: Registered on or after birth
            category: consistency
            introduced_date: "2026-09-15"
            description: >
              A registration must not be dated earlier than the birth it records.
            failure_indicates: >
              The record is corrupt, or two different registrations have been joined together into one.
            changelog: []
          expression: "date_registered >= date_of_birth"
          # Replaces tests/date_registered_after_birth.sql. Same rule as
          # the ODCS contract's matching type: sql check on date_registered
          # and the Soda checks file's matching `failed rows` check - a
          # registration date earlier than the birth date indicates a
          # corrupt or misjoined record.
      # dbt_utils.recency lived here 2026-09-15 through Phase 5f
      # (2026-09-17, plans/qa-pipeline.md #61) - moved BACK to a singular
      # test (dbt_project/tests/recency.sql, see its own comment for the
      # full rationale): dbt_utils.recency's "now" is always dbt.current_
      # timestamp(), with no way to anchor it against this run's own
      # date_registered instead of real wall-clock time, which is why
      # this check was permanently red. Same check_id preserved (a
      # redefinition, not a retirement) - see the singular test's own
      # schema.yml entry below for its changelog entry.
    columns:
      - name: registration_number
        description: BDM's unique registration identifier.
        tests:
          - unique:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.registration_number.unique_dbt
                category: uniqueness
                introduced_date: "2026-01-15"
                description: >
                  This value must be unique.
                failure_indicates: >
                  self-evident
                changelog: []
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.registration_number.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
          - matches_regex:
              pattern: '^BDM-[0-9]{9}$'
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.registration_number.matches_regex_dbt
                category: conformity
                introduced_date: "2026-01-15"
                description: >
                  This value must be in the expected format.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: child_given_names
        description: >
          Full-triplication pass (2026-09-15, plans/qa-pipeline.md) -
          previously untested in dbt, despite having both a nullValues and
          an invalidValues rule in the ODCS contract and a matching Soda
          invalid_percent check.
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.child_given_names.not_null_dbt
                category: completeness
                introduced_date: "2026-09-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
          - matches_regex:
              pattern: '^[A-Za-z][A-Za-z. -]*$'
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.child_given_names.matches_regex_dbt
                category: conformity
                introduced_date: "2026-09-15"
                description: >
                  This value must be in the expected format.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: child_family_name
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.child_family_name.not_null_dbt
                category: completeness
                introduced_date: "2026-09-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
          - matches_regex:
              pattern: '^[A-Za-z][A-Za-z. -]*$'
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.child_family_name.matches_regex_dbt
                category: conformity
                introduced_date: "2026-09-15"
                description: >
                  This value must be in the expected format.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: sex
        description: Closed value set - M, F, or X.
        tests:
          - accepted_values:
              values: ['M', 'F', 'X']
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.sex.accepted_values_dbt
                category: conformity
                introduced_date: "2026-01-15"
                description: >
                  A few unrecognised values are tolerated; a sustained rise fails.
                failure_indicates: >
                  The source system has started emitting a value that was never agreed in the
                  contract, usually a new code introduced upstream without notice.
                changelog: []
              config:
                # accepted_values' own main_sql (see dbt-core's
                # test_accepted_values macro) already groups invalid rows by
                # value into one row per distinct bad value with an
                # `n_records` count column - so count(*) here would count
                # distinct invalid VALUES, not invalid ROWS (e.g. 1 if every
                # invalid row happens to share one bad code). sum(n_records)
                # is the real row count, confirmed by comparing against this
                # project's own equivalent engine's row-level count.
                fail_calc: "coalesce(sum(n_records), 0)"
                warn_if: ">0"
                error_if: ">30"
              # two-tier: any invalid value at all raises a warning; once
              # invalid rows exceed ~30 (this project's clean/amber/red
              # fixture never puts an amber run above 20 or a red run below
              # 58 - see README.md), the test result itself escalates to
              # error - mirrors the Soda check's warn>0%/fail>2% bands as
              # an absolute row count, not a true percentage: dbt-core's
              # own generic-test SQL (any arithmetic on fail_calc - even
              # plain constant division, with no custom macros involved)
              # reproducibly returned a wrong "failures" value on this
              # dbt-duckdb version once the true failing-row count was
              # small - confirmed by comparing dbt's own reported number
              # against the same compiled SQL executed directly via
              # DuckDB's own Python API, which always gave the right
              # answer. See the not_null test below and README.md's
              # known-disagreements section for the fuller account.

      - name: date_of_birth
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.date_of_birth.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
          - dbt_utils.accepted_range:
              min_value: "DATE '1900-01-01'"
              max_value: "CURRENT_DATE"
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.date_of_birth.accepted_range_dbt
                name: Date of birth in a plausible range
                category: conformity
                introduced_date: "2026-09-15"
                description: >
                  This value must be a plausible real date, neither in the future nor absurdly old.
                failure_indicates: >
                  self-evident
                changelog: []
              # Replaces tests/bdm_date_of_birth_range.sql (item 28's
              # decision, plans/qa-pipeline.md). Same rule as the ODCS
              # contract's matching type: sql check and the Soda checks
              # file's matching `failed rows` check.

      - name: place_of_birth_suburb
        description: >
          Closed value set - generator/names_au.py's SUBURBS pool (51 real
          WA suburb names), not a name-shaped-string regex - see
          contract/bdm-birth-registrations-contract.yaml's matching rule.
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.place_of_birth_suburb.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
          - accepted_values:
              values: ["Fremantle", "Subiaco", "Joondalup", "Rockingham", "Mandurah", "Midland", "Armadale", "Cannington", "Morley", "Cockburn Central", "Scarborough", "Victoria Park", "Bunbury", "Albany", "Geraldton", "Kalgoorlie", "Broome", "Karratha", "Port Hedland", "Busselton", "Northam", "Narrogin", "Esperance", "Collie", "Mount Lawley", "Leederville", "Wembley", "Innaloo", "Success", "Baldivis", "Ellenbrook", "Butler", "Balga", "Girrawheen", "Maddington", "Gosnells", "Kwinana", "Hamilton Hill", "Beaconsfield", "South Perth", "Bentley", "Willetton", "Riverton", "Karrinyup", "Currambine", "Clarkson", "Yanchep", "Byford", "Waroona", "Manjimup", "Margaret River"]
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.place_of_birth_suburb.accepted_values_dbt
                category: conformity
                introduced_date: "2026-01-15"
                description: >
                  A few unrecognised values are tolerated; a sustained rise fails.
                failure_indicates: >
                  The source system has started emitting a value that was never agreed in the contract, usually a new code introduced upstream without notice.
                changelog: []
              config:
                # Same two-tier fail_calc override as the sex test above -
                # accepted_values' own main_sql groups by distinct invalid
                # value, so count(*) alone would count distinct bad VALUES,
                # not bad ROWS. Same dbt-duckdb reliability precaution too:
                # an absolute row-count threshold, not a computed percentage.
                fail_calc: "coalesce(sum(n_records), 0)"
                warn_if: ">0"
                error_if: ">30"

      - name: date_registered
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.date_registered.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: registering_parent_1_name
        description: >
          Nullable, optional - contract's nullValues rule tolerates up to
          5% null (severity: warning, no error tier). warn_if below is an
          absolute count derived from that 5% against this fixture's
          typical ~1800-2000 row totals (observed natural null rate today:
          ~2%, comfortably under it) - a round number chosen to sit clear
          of normal variation, same calibration approach as place_of_
          birth_facility's not_null test below, not a per-run recompute.
          error_if is set explicitly, not left to dbt-core's own default -
          confirmed live that an unconfigured error_if defaults to ">0",
          which would hard-fail this test on every run's ordinary ~2%
          natural null rate rather than only warning on it.
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.registering_parent_1_name.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value is often empty for good reason; the check only fails if that becomes much more common.
                failure_indicates: >
                  self-evident
                changelog: []
              config:
                warn_if: ">90"
                error_if: ">200"
          - matches_regex:
              pattern: '^[A-Za-z][A-Za-z. -]*$'
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.registering_parent_1_name.matches_regex_dbt
                category: conformity
                introduced_date: "2026-01-15"
                description: >
                  This value must be in the expected format.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: registering_parent_2_name
        description: >
          Nullable, optional - contract tolerates up to 30% null (severity:
          info, no error tier - single-parent registrations are legitimately
          common). Same calibration approach as registering_parent_1_name
          above (observed natural null rate today: ~26%) - see that
          property's description for why error_if is set explicitly.
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.registering_parent_2_name.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value is often empty for good reason; the check only fails if that becomes much more common.
                failure_indicates: >
                  self-evident
                changelog: []
              config:
                warn_if: ">550"
                error_if: ">700"
          - matches_regex:
              pattern: '^[A-Za-z][A-Za-z. -]*$'
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.registering_parent_2_name.matches_regex_dbt
                category: conformity
                introduced_date: "2026-01-15"
                description: >
                  This value must be in the expected format.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: is_multiple_birth
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.is_multiple_birth.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []

      - name: place_of_birth_facility
        description: Nullable - home births have no facility.
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.place_of_birth_facility.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value is often empty for good reason; the check only fails if that becomes much more common.
                failure_indicates: >
                  self-evident
                changelog: []
              config:
                warn_if: ">300"
                error_if: ">600"
              # mirrors missing_percent(place_of_birth_facility)'s warn/fail
              # bands from the Soda checks file, as an absolute row-count
              # threshold rather than a true percentage - the sex test's
              # comment above explains why: dbt-core's real fail_calc
              # arithmetic proved unreliable on this dbt-duckdb version.
              # 300/600 sit clear of this fixture's actual clean (38-57),
              # amber (424/437), and red (769) null counts (see README.md).

      - name: source_system_record_id
        description: BDM's internal record ID.
        tests:
          - unique:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.source_system_record_id.unique_dbt
                category: uniqueness
                introduced_date: "2026-01-15"
                description: >
                  This value must be unique.
                failure_indicates: >
                  self-evident
                changelog: []
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.source_system_record_id.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
          # matches_regex on this column retired 2026-09-17 - see
          # dbt_project/schema-retired.yml's own copy of this test for the
          # full retirement metadata (retired_as_of/retired_reason). First
          # real check_id ever retired via this mechanism (Phase 5b,
          # plans/publishing-and-history.md) - picked deliberately: this
          # is BDM's own internal re-extraction-trace ID, not part of the
          # feed's real business data, so retiring format validation on it
          # is genuinely low-stakes.

      - name: extract_timestamp
        tests:
          - not_null:
              meta:
                check_id: data-asset-1.registry-services.civil-registration.birth-registrations.extract_timestamp.not_null_dbt
                category: completeness
                introduced_date: "2026-01-15"
                description: >
                  This value must never be empty.
                failure_indicates: >
                  self-evident
                changelog: []
