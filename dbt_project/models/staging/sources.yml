version: 2

# The raw table this project's pipeline/load.py actually creates
# (birth_registrations, in data/warehouse.db) - declared as a dbt source
# so stg_birth_registrations.sql below is a genuine staging-layer model
# (source -> typed/cleaned staging view), not a check running on raw
# input directly.
sources:
  - name: raw
    description: >
      Runs loaded straight from the generator's CSVs, tagged with
      run_id/run_date. One row per birth registration
      record, undifferentiated across runs.
    tables:
      - name: birth_registrations

      # Child Protection collection (qa_tools/cp/build_cp_warehouses.py) -
      # one snapshot's worth of all 6 tables per DuckDB file, same "raw"
      # schema convention birth_registrations uses. See
      # generator/generate_cp_runs.py for how these snapshots are built.
      - name: cp_clients
      - name: cp_notifications
      - name: cp_investigations
      - name: cp_placements
      - name: cp_carers
      - name: cp_case_workers
