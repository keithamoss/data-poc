              # (cp_run_10_2026-09-14: 20 distinct duplicated values, 40
              # total rows across those groups - this fixture's duplicate
              # injection always creates simple pairs, so "distinct values"
              # and "total rows" differed by exactly 2x, not a coincidence
              # once you know the cause).
