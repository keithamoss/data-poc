version: 2

# Real dbt generic-test syntax, run for real by `dbt test` (dbt-core 1.12 +
# dbt-duckdb) via real_tools/run_dbt_real.py, and separately by
# engines/dbt_test_engine.py's DuckDB-equivalent evaluator.
#
# Several things below aren't what a plausible-looking first draft of this
# file assumed - each only found by actually running `dbt test`:
#
# 1. error_if/warn_if with a "%" suffix (e.g. ">2%") is NOT real dbt-core
#    syntax. It's spliced verbatim into `{{ fail_calc }} {{ error_if }}`
#    (dbt-core's own default__get_test_sql macro), producing literally
#    invalid SQL like `count(*) >2%`. A genuine percentage-of-rows
#    threshold needs `fail_calc` overridden to compute the percentage
#    itself - and fail_calc can't reference the model via `{{ ref(...) }}`
#    either: dbt's generic-test config parser explicitly rejects custom
#    macros in a config value, only bare Jinja-free SQL.
# 2. `config.severity` isn't a display label layered on top of warn_if/
#    error_if - dbt/task/test.py's own status logic only ever reaches
#    "fail" when severity is (the default) "error"; `severity: warn` caps
#    every run of a test at warn/pass forever, no matter what error_if
#    says. So neither test below sets `severity` at all.
# 3. A confirmed dbt-duckdb reliability bug (not this project's SQL):
#    dbt-core's own reported `failures` for a percentage-based `fail_calc`
#    was reproducibly wrong - 0 instead of the true row count - on some
#    runs, while the identical compiled SQL executed directly via DuckDB's
#    own Python API against the same file always gave the right answer.
#    This survived removing every layer of arithmetic (rounding, casting,
#    plain division, even a bare unmodified `count(*)`), disabling partial
#    parsing, forcing `--store-failures`, and substituting SUM for COUNT -
#    none of it was the cause, and no SQL-level explanation was found
#    despite extensive isolation. The two tests below use absolute
#    row-count thresholds instead of a computed percentage as a result,
#    and real_tools/run_dbt_real.py independently re-verifies both tests'
#    result via a direct query against the same warehouse dbt just tested,
#    rather than trust a demonstrated-unreliable number.
#
# See README.md's "known simplifications and honest disagreements" for the
# fuller account of all three.
#
# The `relationships` test this file lacked (see the comment this replaces)
# now exists below, on the 6 Child Protection staging models - real dbt
# generic-test syntax (`relationships: {to: ref('...'), field: ...}`),
# confirmed by actually running `dbt test` against a real per-run CP
# warehouse (real_tools/build_cp_warehouses.py). All 7 pass on every run,
# dirty or clean: generator/dirty.py's placement/investigation presets
# reassign a placement's carer_id to a still-real (just non-Approved)
# carer, and null an investigation's end_date - neither ever points a FK
# column at a row that doesn't exist, so referential integrity itself
# always holds even on a dirty run (see contract/child-protection-
# contract.yaml's matching SQL-rule versions of these same 7 checks for
# the fuller account of why they're still a genuine backstop against a
# dropped join or truncated parent extract).
#
# The three cross-table business rules approved alongside these FKs
# (escalation completeness, placement/carer approval compliance,
# closed-case investigation hygiene) are dbt SINGULAR tests instead of
# generic ones - each is a row-level cross-table SELECT with no reusable
# "column vs column" shape, which is exactly what tests/*.sql is for. All
# three pass cleanly (0 violations) on every clean run, by construction -
# child_protection.py only assigns Approved carers to a placement and only
# closes a case once its investigations have concluded - and dirty.py's
# amber/red-only presets are what reintroduce a controlled, real violation
# count. See tests/escalation_completeness.sql, tests/placement_carer_approval.sql,
# tests/closed_case_investigation_hygiene.sql - each header documents the
# same real numbers already found and explained in the contract file,
# rather than repeating them here.

models:
  - name: stg_birth_registrations
    description: >
      One row per birth registration, across all loaded runs
      (run_id/run_date/dirty_severity identify which run a row came from).
    columns:
      - name: registration_number
        description: BDM's unique registration identifier.
        tests:
          - unique
          - not_null

      - name: sex
        description: Closed value set - M, F, or X.
        tests:
          - accepted_values:
              values: ['M', 'F', 'X']
              config:
                # accepted_values' own main_sql (see dbt-core's
                # test_accepted_values macro) already groups invalid rows by
                # value into one row per distinct bad value with an
                # `n_records` count column - so count(*) here would count
                # distinct invalid VALUES, not invalid ROWS (e.g. 1 if every
                # invalid row happens to share one bad code). sum(n_records)
                # is the real row count, confirmed by comparing against this
                # project's own equivalent engine's row-level count.
                fail_calc: "coalesce(sum(n_records), 0)"
                warn_if: ">0"
                error_if: ">30"
              # two-tier: any invalid value at all raises a warning; once
              # invalid rows exceed ~30 (this project's clean/amber/red
              # fixture never puts an amber run above 20 or a red run below
              # 58 - see README.md), the test result itself escalates to
              # error - mirrors the Soda check's warn>0%/fail>2% bands as
              # an absolute row count, not a true percentage: dbt-core's
              # own generic-test SQL (any arithmetic on fail_calc - even
              # plain constant division, with no custom macros involved)
              # reproducibly returned a wrong "failures" value on this
              # dbt-duckdb version once the true failing-row count was
              # small - confirmed by comparing dbt's own reported number
              # against the same compiled SQL executed directly via
              # DuckDB's own Python API, which always gave the right
              # answer. See the not_null test below and README.md's
              # known-disagreements section for the fuller account.

      - name: date_of_birth
        tests:
          - not_null

      - name: date_registered
        tests:
          - not_null

      - name: is_multiple_birth
        tests:
          - not_null

      - name: place_of_birth_facility
        description: Nullable - home births have no facility.
        tests:
          - not_null:
              config:
                warn_if: ">300"
                error_if: ">600"
              # mirrors missing_percent(place_of_birth_facility)'s warn/fail
              # bands from the Soda checks file, as an absolute row-count
              # threshold rather than a true percentage - the sex test's
              # comment above explains why: dbt-core's real fail_calc
              # arithmetic proved unreliable on this dbt-duckdb version.
              # 300/600 sit clear of this fixture's actual clean (38-57),
              # amber (424/437), and red (769) null counts (see README.md).

  - name: stg_cp_clients
    description: One row per child with a Child Protection casework history, per snapshot.
    columns:
      - name: cp_client_id
        tests:
          - unique
          - not_null

  - name: stg_cp_notifications
    description: One row per notification, per snapshot.
    columns:
      - name: notification_id
        tests:
          - unique:
              config:
                warn_if: ">0"
                error_if: ">10"
              # mirrors the contract's duplicateValues rule on this column -
              # apply_cp_notifications_presets' near-duplicate injection is
              # the only thing that ever makes this fail. Absolute
              # row-count threshold, not a true percentage, for the same
              # dbt-duckdb fail_calc-reliability reason as sex/
              # place_of_birth_facility above.
          - not_null
      - name: cp_client_id
        tests:
          - relationships:
              to: ref('stg_cp_clients')
              field: cp_client_id
      - name: assigned_worker_id
        tests:
          - relationships:
              to: ref('stg_cp_case_workers')
              field: worker_id

  - name: stg_cp_investigations
    description: One row per investigation opened from an escalated notification, per snapshot.
    columns:
      - name: investigation_id
        tests:
          - unique
          - not_null
      - name: notification_id
        tests:
          - relationships:
              to: ref('stg_cp_notifications')
              field: notification_id
      - name: cp_client_id
        tests:
          - relationships:
              to: ref('stg_cp_clients')
              field: cp_client_id
      - name: lead_worker_id
        tests:
          - relationships:
              to: ref('stg_cp_case_workers')
              field: worker_id

  - name: stg_cp_placements
    description: One row per out-of-home-care placement, per snapshot.
    columns:
      - name: placement_id
        tests:
          - unique
          - not_null
      - name: cp_client_id
        tests:
          - relationships:
              to: ref('stg_cp_clients')
              field: cp_client_id
      - name: carer_id
        tests:
          - relationships:
              to: ref('stg_cp_carers')
              field: carer_id

  - name: stg_cp_carers
    description: One row per approved (or in-approval) carer, per snapshot.
    columns:
      - name: carer_id
        tests:
          - unique
          - not_null

  - name: stg_cp_case_workers
    description: One row per case worker, per snapshot.
    columns:
      - name: worker_id
        tests:
          - unique
          - not_null
