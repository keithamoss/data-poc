# Retired dbt checks (plans/publishing-and-history.md Thread D, Keith's
# call 2026-09-16: a check_id, once introduced, is permanently unique -
# it must never be changed or deleted, even once retired). Deliberately
# OUTSIDE dbt_project/models/ (dbt's own `model-paths`, default
# ["models"]) - verified for real that dbt's parser completely ignores
# any yml file sitting outside its configured paths, so this file is
# never scanned/executed by a real `dbt build`, only ever read by
# qa_tools/common/check_lifecycle.py (which reuses parse_dbt_check_
# metadata() unchanged, just pointed at this second path) - the same
# reason Soda's/the contract's/Evidently's own `-retired` sibling files
# exist (see each one's own header comment).
#
# Retiring a check means MOVING its whole meta/attributes/customProperties
# block from the live, tool-executed file into this one - never editing
# its check_id, never deleting it outright. Add `retired_as_of`/
# `retired_reason` to the meta block when you do (both required together -
# see check_lifecycle.py's CheckMetadata). Same nested shape as the real
# schema.yml: `models: [{name, tests: [...], columns: [{name, tests}]}]`
# for generic tests, top-level `tests: [{name, config: {meta}}]` for
# singular tests.
version: 2
models:
  - name: stg_birth_registrations
    columns:
      - name: source_system_record_id
        tests:
          - matches_regex:
              pattern: '^SRC-[0-9]{9}$'
              meta:
                check_id: data-asset-1.registry-services.birth-registrations.stg_birth_registrations.source_system_record_id.matches_regex_dbt
                introduced_date: "2026-01-15"
                retired_as_of: "2026-09-17"
                retired_reason: >
                  source_system_record_id is BDM's internal re-extraction-trace
                  ID, not part of the feed's real business data - no downstream
                  consumer reads it. Format validation on a field nothing
                  downstream relies on isn't worth keeping as an active gate;
                  the not_null test on this column stays active.
                description: "Catches upstream internal-ID-format changes before they reach consumers as silent garbage."
                changelog:
                  - date: "2026-09-17T00:00:00Z"
                    description: "Retired - low-value check on an internal-only trace field, no downstream consumer."
                    author: "Keith Moss"
                    breaking: false
tests: []
