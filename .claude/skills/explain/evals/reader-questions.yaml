# The reader questions docs-critic is given for every eval page, standing in
# for the brief's questions a real run would carry. Every eval page is a
# version of the same periods-and-slots page, so one set serves them all.
questions:
  - What is a period, and where do its dates come from?
  - What is a slot, and how many does a dataset get?
  - When is a Child Protection table due in a given period?
  - Why does the carers table show as a gap on 1 August 2026?
  - Why does the case workers table have no slot in some periods?
  - Why is there one slot per table rather than one per collection?
