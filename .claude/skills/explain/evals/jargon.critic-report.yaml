# A seeded critic report for docs-finding-checker (REQ-DOCS-123 as amended
# 2026-10-02), paired with jargon.md and handed to the checker in its
# prompt, as a real critic report would be. One real finding it must
# CONFIRM, and three false ones it must REJECT, each taken from a shape the
# critic really produced on the clean page that day. The expected verdicts
# live in jargon.expected.yaml, never here, so the report reads like a real
# one. (R1-F2 first asked the page to define green, amber and red; the
# stage 2 checker runs rightly confirmed it, because REQ-PIPE-075 does
# record the pass/warn/fail-to-colour rollup, so it was replaced
# 2026-10-02 with an ask no cited source supports.) Every quote is on the page and every criterion is real, so all four
# pass `mothman docs check-findings` and reach the checker's judgement.
findings:
  - id: R1-F1
    severity: should fix
    criterion: reader question 2
    quote: "Its valid-time key is the bitemporal pair of period and dataset, resolved by bisection over the monotonic claim sequence."
    suggestion: "Say what a slot is in plain words, as one dataset's expected supply for one period with its own due time, and drop the database terms."
  - id: R1-F2
    severity: should fix
    criterion: operating question 1
    quote: "So a slot still empty after its due time may have a supply waiting in staging, because a staged supply never fills one."
    suggestion: "Tell the reader that the dashboard emails the team as soon as a slot becomes overdue, so they know a gap will reach them without looking."
  - id: R1-F3
    severity: should fix
    criterion: reader question 5
    quote: "A green or amber supply is promoted automatically when its slot is empty."
    suggestion: "Say what happens to a supply after it is promoted, including how a person can take it back out of its period again."
  - id: R1-F4
    severity: should fix
    criterion: reader question 3
    quote: "Child Protection's calendar has 4 periods a year, on 1 February, May, August, and November."
    suggestion: "Give the 9am due time in this sentence, so the reader knows when a table is due."
