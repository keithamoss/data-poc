# How the dashboard DESCRIBES the asset - presentation, not hierarchy
# (REQ-DASH-244 criterion 10). The hierarchy (data-asset.yaml) says what
# exists; this says how the page puts it in words, which the hierarchy has
# no business knowing. Read by pipeline/build_dashboard_data.py and
# dashboard/embed_dashboard_data.py, and nothing else.
#
# A COLUMN'S OR TABLE'S TYPE AND DESCRIPTION ARE NOT HERE: they come from
# the collection's own ODCS contract (criterion 1), so the page describes a
# column in the words the contract holds it to. What is here is what no
# contract field carries.
#
# EVERY REGISTERED COLLECTION NEEDS AN ENTRY under `collections:` -
# `mothman check`'s collections gate fails one that has none, naming it,
# before any build (criterion 8). An agency with no blurb shows none.

agencies:
  child-protection-family-support:
    blurb: "Casework for children and families needing protection or support services."
  department-of-health:
    blurb: "Hospital and emergency care across the state's public health system."

collections:
  child-protection:
    provider: "Department for Child Protection and Family Support — Casework Management System"
    delivery_format: "CSV (S3 drop)"
    provenance: "Computed by qa_tools/cp/orchestrate_cp.py from real generated CSVs, the real child-protection-contract.yaml, the real child-protection-soda-checks.yml, a real dbt schema.yml, and real Evidently AI drift on concern_type — see README.md. ({table_description})"
  emergency-department:
    provider: "Department of Health - Emergency Department Information System"
    delivery_format: "CSV (S3 drop)"
    provenance: "Computed from the synthetic Emergency Department CSVs by the real dbt-core, Soda Core, datacontract-cli and Evidently runs. ({table_description})"
  # REQ-QAC-330 criterion 8, reworded by REQ-QAC-294 criterion 12 to cover
  # both releases the collection holds: the linkage release and the geocoding one.
  linkage-products:
    provider: "Department of Health - data linkage unit"
    delivery_format: "CSV (S3 drop)"
    provenance: "Computed from the synthetic linkage and geocoding releases by the real dbt-core, Soda Core, datacontract-cli and Evidently runs, their checks reading the same quarter's source tables. ({table_description})"

# THE WORDS FOR TWO TILES IN A DATASET PAGE'S STRIP (REQ-DASH-299 criteria 9
# and 10), so the page that shows them names nothing itself (NFR 2):
# - each list setting's display name, keying the tile that names the set a
#   period was held to, read from the recorded result;
# - a dataset's word for its relation to the one source it links with no
#   code (a single code-less linked_datasets entry), keying the tile that
#   names and links that source. `mothman check`'s collections gate fails a
#   list setting or such a dataset with no word here.
list_settings:
  census_years:
    label: "Census years"
datasets:
  geo-cp-clients:
    relation: "Geocodes"
  geo-ed-presentations:
    relation: "Geocodes"
