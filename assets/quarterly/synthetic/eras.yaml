# QUARTERLY ASSET'S SYNTHETIC ERAS (REQ-GEN-371): every amber and
# replacement setting version that exists only to stage the synthetic history -
# back-dated, named a synthetic era, or the version ending one - moved here
# from data-asset.yaml with its level, date, value and changelog. Read merged
# with data-asset.yaml into one timeline per setting (asset_model/eras.py), and
# frozen as its versions are there. A real deployment has no synthetic/
# folder, so it reads data-asset.yaml alone.

amber_setting:
  versions:
    # BEFORE THE GROWN QUARTERS' FIRST CLAIM WINDOW OPENS (REQ-GEN-207
    # criterion 5): Child Protection's history starts 2013-Q1, so a supply
    # from then on meets a setting in force. The value the next version carries.
    - effective_from: "2013-01-01"
      value: promote
      changelog:
        - date: "2026-10-15"
          author: REQ-GEN-207
          change: "the synthetic history grows ten years earlier - amber promotes itself, as in the version after it."
    # SYNTHETIC ERAS (REQ-GEN-136 criterion 14): switched at dates inside the
    # generated history so one history shows the behaviour before, during and
    # after - and back-dated, which only a synthetic asset may do. Each
    # scenario needing a setting is placed inside its era (criterion 15).
    # NO ORDINARY AMBER LANDS IN THIS ERA ANY MORE (REQ-GEN-184 criterion 9,
    # 2026-10-11): one would wait for a person nobody scripted. So "the era's
    # own amber supplies show it" below is history - only TS-43 and TS-78
    # show hold.
    # TWO DAYS EARLIER FOR TS-78 (REQ-GEN-199; Keith, 2026-10-13): a version
    # ADDED beside the frozen 2026-09-01 one, never an edit of it. The
    # 2026-09-01 version below still says hold, so the era runs unbroken.
    - effective_from: "2026-08-30"
      value: hold
      changelog:
        - date: "2026-10-13"
          author: Keith (REQ-GEN-199)
          change: "synthetic era starts two days earlier - amber waits for a person from 30 August, so TS-78's two held supplies fall inside it."
    - effective_from: "2026-09-01"
      value: hold
      changelog:
        - date: "2026-09-01"
          author: not recorded - converted from a plain-string entry by REQ-PIPE-112
          change: "synthetic era - amber waits for a person (TS-43, parked; the era's own amber supplies show it)."
    - effective_from: "2026-09-10"
      value: promote-and-acknowledge
      changelog:
        - date: "2026-09-10"
          author: not recorded - converted from a plain-string entry by REQ-PIPE-112
          change: "synthetic era - amber promotes and asks for an acknowledgement (TS-44 and TS-45, parked; the era's own amber supplies show it)."
    - effective_from: "2026-09-18"
      value: promote
      changelog:
        - date: "2026-09-18"
          author: not recorded - converted from a plain-string entry by REQ-PIPE-112
          change: "synthetic era ends - amber promotes itself again."

replacement_setting:
  versions:
    # BEFORE THE GROWN QUARTERS (REQ-GEN-207 criterion 5) - as amber_setting.
    - effective_from: "2013-01-01"
      value: never
      changelog:
        - date: "2026-10-15"
          author: REQ-GEN-207
          change: "the synthetic history grows ten years earlier - a filled slot waits for a person, as in the version after it."
    # SYNTHETIC ERA (REQ-GEN-136 criteria 7, 14 and 15): a green resend replaces
    # the promoted supply for four days, then never again.
    - effective_from: "2026-09-18"
      value: green
      changelog:
        - date: "2026-09-18"
          author: not recorded - converted from a plain-string entry by REQ-PIPE-112
          change: "synthetic era - a green resupply replaces the promoted supply (TS-46, parked; the era's own resends show it)."
    - effective_from: "2026-09-22"
      value: never
      changelog:
        - date: "2026-09-22"
          author: not recorded - converted from a plain-string entry by REQ-PIPE-112
          change: "synthetic era ends - a filled slot waits for a person again."

collections:
  child-protection:
    # SYNTHETIC ERA FOR THIS COLLECTION ONLY (REQ-GEN-273 criterion 4;
    # Keith, 2026-10-25, answer 4a): a green resupply replaces a promoted
    # supply in 2017-Q2 and 2017-Q3 - from 2017-Q2's claim window to
    # 2017-Q4's - so TS-81 (S1 green) and TS-82 (S1 red) can show the
    # package gate replacing one inside a package, then never again.
    # Before it, the asset level's 'never' applies. ADDED, back-dated,
    # which only a synthetic asset may do (REQ-PIPE-123 criterion 1).
    replacement_setting:
      versions:
        - effective_from: "2017-04-17"
          value: green
          changelog:
            - date: "2026-10-25"
              author: REQ-GEN-273
              change: "synthetic era - a green resupply replaces the promoted supply in 2017-Q2 and 2017-Q3, so TS-81 and TS-82 show the package gate replacing one inside a package."
        - effective_from: "2017-10-18"
          value: never
          changelog:
            - date: "2026-10-25"
              author: REQ-GEN-273
              change: "synthetic era ends - a filled slot waits for a person again, as at the asset level."
