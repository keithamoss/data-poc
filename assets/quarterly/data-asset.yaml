# Data-asset-level configuration - genuinely global (the whole system,
# every agency/collection/dataset), not attached to any one dataset's
# own contract. `data_asset_id` is the same "data-asset-1" placeholder
# literal already baked into every check_id across all 4 tools' check
# definitions (a real name can replace it later, everywhere it appears,
# without changing the check_id scheme itself - see
# plans/publishing-and-history.md Thread D). This file is the one place
# that placeholder is declared, not repeated as a hardcoded string per
# dataset's own config.
#
# Corrected 2026-09-16 (Keith's call): `as_of_offset_days` previously
# lived as dataset-level `customProperties` on this repo's Child
# Protection ODCS contract only (`contract/child-protection-
# contract.yaml`), reasoned from that one collection's own quarterly
# cadence. Wrong attachment point - Keith's explicit correction: this
# is data-asset-level config, genuinely global. ONE offset applies to
# every dataset's "as of" view, not a different value derived from each
# dataset's own refresh cadence.
#
# Removed entirely, 2026-09-17 (plans/qa-pipeline.md Phase 5j, Keith's
# own call, a proper brainstorm not just a number tweak): a flat global
# day-count was never the right shape for "is this dataset's most
# recent data still current" - a quarterly dataset's real ~92-day gap
# between deliveries made this trip constantly even when nothing was
# wrong (CP read "no data" on the plain default view for roughly
# two-thirds of every quarter). Replaced by real, per-dataset,
# computable cadence config - each dataset's participation in
# contract/calendar.yaml since REQ-PIPE-110 - "no data" now means
# "nothing has landed yet in the CURRENT expected cycle," not "the
# latest delivery is more than N days old." See that plan file's own
# entry for the full design history (including the earlier "grow the
# offset" / "revisit global-vs-per-dataset" options this superseded).

data_asset_id: quarterly
# ---------------------------------------------------------------------
# THE DATA ASSET'S OWN TIMEZONE (REQ-PIPE-048) - read from here and
# nowhere else.
#
# Until 2026-09-23 this was a hardcoded `AWST_OFFSET = timedelta(hours=8)`
# in pipeline/cadence.py, and every wall-clock computation in the repo
# leaned on it. An offset is not a timezone: it is one zone's answer for
# one moment, and a second asset in a daylight-saving jurisdiction would
# need a rule, not a number.
#
# An IANA name, not an offset, for that reason. Western Australia does
# not observe daylight saving, so today the two happen to agree - which
# is exactly why this is worth fixing now rather than when they stop
# agreeing.
#
# Changing this does NOT reinterpret anything already stored: every
# instant recorded in the qa schema carries its own offset, so it keeps
# the meaning it was written with. That is the whole reason the offset
# is stored alongside the value rather than inferred from here at read
# time.
#
# VERSIONED (REQ-PIPE-112): what that does not cover is an instant
# COMPUTED from config - a due time is a wall-clock time on a date, and
# reading it in today's zone for a date in 2024 would silently re-judge
# the past. So each version is effective-dated, in force from the start
# of its own effective_from in its own zone, and every reader asks for
# the zone in force on the date or at the instant it is about. A date no
# version covers is an error, never the nearest version. The first
# version starts before any supply this asset holds.
timezone:
  versions:
    - effective_from: "1970-01-01"
      zone: Australia/Perth
      changelog:
        - date: "2026-09-23"
          author: REQ-PIPE-048
          change: The asset's own zone, replacing a hardcoded +08:00 offset in pipeline/cadence.py.
        - date: "2026-10-11"
          author: REQ-PIPE-112
          change: Expressed as an effective-dated version; zone and meaning unchanged.

# WHICH SLOTS GET A TICKET (REQ-PIPE-083 criterion 21).
#
# `needs-action` - the default - opens a ticket for a slot that is
# amber, red, overdue, late, held, or awaiting a person's decision
# because automatic promotion did not apply. `all` opens one for every
# slot in every period.
#
# THE DEFAULT IS NOT A TIMIDITY. At two datasets `all` is a tidy idea;
# the scale this is a PoC for is ~30 datasets on a quarterly asset and a
# daily feed beside it, where `all` means a ticket per dataset per
# period whether or not anything ever needed a person - which is how a
# team learns that the queue is mostly noise and stops reading it. The
# whole point of the queue is that everything in it wants somebody.
#
# DATA-ASSET-LEVEL, not per dataset, because it is a statement about how
# this team works rather than about any one supplier.
ticket_policy: needs-action

# WHERE TICKETS GO (REQ-PIPE-093 criterion 12): a fact about this data
# asset, one per deployment. An environment turns ticketing on
# (contract/environments.yaml); this says which repository it opens them in.
# Never taken from GITHUB_REPOSITORY, which names whichever repository a
# workflow happens to run in.
ticket_repository: keithamoss/data-poc

# THE POSTGRESQL MAJOR THIS ASSET TARGETS (REQ-PIPE-146). Asserted every time
# a connection opens - a server on a different major is refused, naming both -
# and every PostgreSQL image tag in .devcontainer/docker-compose.yml and
# .github/workflows/test.yml must name it (the hierarchy gate checks). Any
# minor is accepted, silently: minors are bug and security fixes.
#
# THE ANCHOR IS AURORA POSTGRESQL 16 LTS. Aurora's available engines lag
# upstream, so the number is whatever Aurora offers and everything else
# follows it. A fact about the asset's deployment, so it lives here rather
# than in a repository-wide .postgres-version.
postgres_major: 16

# THIS ASSET'S HISTORY IS SYNTHETIC - generated by this repository's own
# generators, so it may be deleted and regenerated (REQ-PIPE-144
# criterion 43; REQ-GEN-135 criterion 8). The ONLY thing that lets
# `mothman env reset-synthetic` delete anything: an asset that does not
# say this is treated as real, and the reset refuses. A real deployment
# never sets it.
synthetic: true

# THIS ASSET'S SNAPSHOT ARCHIVE STARTS HERE (REQ-DASH-373 criterion 4, key
# SETTLED by Keith 2026-11-01): dashboard/snapshots/quarterly/ holds every
# publish from this date. The archive taken before the asset split showed
# both assets' results on one page and was deleted that day, at Keith's call;
# git history still holds it. The snapshots panel's empty state names it.
snapshots_from: 2026-11-21

# THE ASSET'S NAME FOR A READER (REQ-PIPE-354 criterion 2, SETTLED by Keith
# 2026-11-01), in the dashboard's masthead and title.
display_name: Quarterly data asset

# WHERE THIS ASSET'S DASHBOARD IS PUBLISHED (REQ-PIPE-255 criterion 8,
# REQ-PIPE-257 criterion 8; one Cloudflare Pages project per asset,
# REQ-PIPE-354 criterion 3; names chosen by Keith 2026-11-21). Configuration,
# not secrets: the API token and the account id are environment variables
# (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) and never committed.
# access_domain IS A PLACEHOLDER until Keith's Cloudflare Zero Trust team
# exists (Keith, 2026-11-21): every publish checks that the site redirects to
# it before uploading, so with the placeholder every publish is refused and
# nothing can be made public by accident. docs/dashboard-hosting.md says how
# to set it.
hosting:
  pages_project: data-poc-quarterly
  production_branch: main
  address: https://data-poc-quarterly.pages.dev
  access_domain: CHANGE-ME.cloudflareaccess.com

# WHAT MOVED TO THE DAILY ASSET IN THE SPLIT (REQ-PIPE-354 criteria 6 and 7):
# a pre-split link to Birth Registrations opens a one-line notice saying where
# it went, rather than the not-found page. Names carried here - this asset
# never reads the daily asset's configuration.
moved_to:
  - id: registry-services
    name: Registry Services
    asset_name: Daily data asset
    address: https://data-poc-daily.pages.dev
  - id: civil-registration
    name: Civil Registration
    asset_name: Daily data asset
    address: https://data-poc-daily.pages.dev
  - id: birth-registrations
    name: Birth Registrations
    asset_name: Daily data asset
    address: https://data-poc-daily.pages.dev


# WHAT HAPPENS TO AN AMBER SUPPLY (REQ-PIPE-122). One setting, three
# values, strictest first:
#   hold                     - never promoted automatically; it waits,
#                              staged, for a person to promote or reject
#   promote-and-acknowledge  - promoted into an unfilled slot, and a
#                              person is asked to acknowledge they looked
#   promote                  - promoted into an unfilled slot, nothing asked
# Stated here for the whole asset and, optionally, on a collection or a
# dataset in the hierarchy below - the nearest level that states one
# wins. NO DEFAULT: an asset that says nothing is refused.
#
# EFFECTIVE-DATED VERSIONS, like a calendar's. A version whose date has
# passed is FROZEN - change the setting by adding a new version dated
# today or later. Every automatic promotion records the value, the level
# and the version it acted under, so the past is read from that record
# and never recomputed from this file.
# THE SYNTHETIC HISTORY'S ERAS of this setting and the replacement setting
# below live in synthetic/eras.yaml (REQ-GEN-371), read merged with these
# versions as one timeline per setting.
amber_setting:
  versions:
    - effective_from: "2023-01-01"
      value: promote
      changelog:
        - date: "2023-01-01"
          author: not recorded - converted from a plain-string entry by REQ-PIPE-112
          change: "amber promotes itself into an unfilled slot - unchanged from before the setting existed (REQ-PIPE-075)."

# WHETHER A RESUPPLY MAY REPLACE AN ALREADY-PROMOTED SUPPLY AUTOMATICALLY
# (REQ-PIPE-123). One of:
#   never           - a supply filed into a filled slot waits for a person
#   green           - a green resupply replaces the promoted one, which
#                     moves to superseded (reversible: un-supersede it)
#   green-or-amber  - a green or amber one does
# The same mechanism as amber_setting above: asset, collection or dataset,
# nearest wins, effective-dated, the past frozen, and no default. CI
# refuses green-or-amber wherever the amber setting is hold.
replacement_setting:
  versions:
    - effective_from: "2023-01-01"
      value: never
      changelog:
        - date: "2023-01-01"
          author: not recorded - converted from a plain-string entry by REQ-PIPE-112
          change: "a filled slot waits for a person - unchanged from before the setting existed (REQ-PIPE-075 criterion 4)."


# ---------------------------------------------------------------------
# THE HIERARCHY, stated once (REQ-QAC-039).
#
# Until 2026-09-23 this lived as literals in TWELVE Python files - four
# copy-pasted BDM tool scripts, a hand-maintained table-to-dataset map
# in cp_common.py, plus ticket_sync.py, acceptance_sync.py,
# github_links.py, the two orchestrators and two build scripts. Every
# consumer that needed a piece of the tree took its own copy, and
# ticket_sync.py's own comment had already noted it was the FOURTH and
# that consolidating was overdue.
#
# It lives HERE, rather than in a new file or derived by scanning the
# dataset contracts, because this file already exists for genuinely
# data-asset-level config, and because REQ-PIPE-049's named delivery
# calendars land here too - so the asset's shape and its schedule sit
# together, and a dataset naming a calendar resolves through one file
# (Keith, 2026-09-23).
#
# WHERE THE IDS CAME FROM, and why the contracts were changed to match
# rather than the other way round (Keith, same conversation): these ids
# are already baked into every check_id, every qa_results/ path and
# every dashboard URL. The dataset contracts disagreed - BDM declared
# `id: bdm-birth-registrations` against the code's `birth-registrations`,
# and CP declared `domain: child-and-family-safety`, which matched
# NEITHER its collection (`child-protection`) nor its agency. Changing
# the code would have churned committed history for nothing; the
# contract fields were read by nothing load-bearing, so they were
# corrected instead.
#
# `table:` is the replacement for cp_common.py's hand-maintained
# TABLE_DATASET_ID/TABLE_DATASET_NAME pair. A dataset maps to exactly
# one logical table - by construction under the supply model, not by
# today's accident (plans/supply-model.md Thread F) - so the mapping
# belongs beside the dataset rather than in a dict somebody maintains.
hierarchy:
  agencies:

    - id: child-protection-family-support
      name: Department for Child Protection and Family Support
      short: cpfs
      collections:
        - id: child-protection
          name: Child Protection
          short: cp                # REQ-PIPE-240 - see civil-registration above.
          run_prefix: cp_run_
          contract: child-protection-family-support/child-protection-contract.yaml
          delivery_boundary: directory   # REQ-PIPE-057 - see above.
          datasets:
            - id: cp-clients
              name: Client Register
              table: cp_clients
              # REQ-PIPE-058 - see birth-registrations above.
              # WIDENED FOR THIS SYNTHETIC ASSET'S DEMONSTRATION of a
              # contested Child Protection table (REQ-PIPE-202; Keith,
              # 2026-10-13): cp_clients.csv or cp_clients_<suffix>.csv, so
              # two of its files in one delivery are a contested pair, as
              # Birth Registrations' can be. NOT advice for a real Child
              # Protection supply - there, a stray suffixed file sent beside
              # the extract would contest the table and turn the three
              # tables that read cp_client_id red until a person settles
              # it. The ODCS contract's keyPattern is a transport value and
              # stays exact. The other five Child Protection patterns are
              # exact on purpose.
              arrival_pattern: 'cp_clients(_[^/]+)?\.csv'
            - id: cp-notifications
              name: Notifications
              table: cp_notifications
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_notifications\.csv'
            - id: cp-investigations
              name: Investigations
              table: cp_investigations
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_investigations\.csv'
            - id: cp-placements
              name: Placements
              table: cp_placements
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_placements\.csv'
            - id: cp-carers
              name: Carer Register
              table: cp_carers
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_carers\.csv'
            - id: cp-case-workers
              name: Case Workers
              table: cp_case_workers
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cp_case_workers\.csv'

    - id: department-of-health
      name: Department of Health
      short: doh                 # REQ-PIPE-248 - see registry-services above.
      collections:
        - id: emergency-department
          name: Emergency Department
          short: ed                # REQ-PIPE-240 - see civil-registration above.
          run_prefix: ed_run_
          contract: department-of-health/emergency-department-contract.yaml
          delivery_boundary: directory   # REQ-PIPE-057 - see above.
          datasets:
            - id: ed-presentations
              name: ED Presentations
              table: ed_presentations
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'ed_presentations\.csv'
        # REQ-QAC-348: a SYNTHETIC test collection, made to exercise annual
        # participation - one dataset owed only in the August round
        # (calendar.yaml). It stands in for no real supply.
        - id: cancer
          name: Cancer
          short: can               # REQ-PIPE-240 - see civil-registration above.
          run_prefix: can_run_
          contract: department-of-health/cancer-contract.yaml
          delivery_boundary: directory   # REQ-PIPE-057 - see above.
          datasets:
            - id: cancer-notifications
              name: Cancer Notifications
              table: cancer_notifications
              # REQ-PIPE-058 - see birth-registrations above.
              arrival_pattern: 'cancer_notifications\.csv'
        # REQ-QAC-330: the data asset's linkage product, an asset-level dataset in a
        # collection of Department of Health's own, which produces it. One file a
        # quarter, on the quarterly calendar at files_go_to_period 0
        # (contract/calendar.yaml). The geocoding datasets join this collection later
        # (REQ-QAC-294), so nothing assumes linkage-keys is its only dataset.
        - id: linkage-products
          name: Linkage Products
          short: lp                # REQ-PIPE-240 - see civil-registration above.
          run_prefix: lp_run_
          contract: department-of-health/linkage-products-contract.yaml
          delivery_boundary: directory   # REQ-PIPE-057 - see above.
          # THE CENSUS YEARS EVERY GEOCODING DATASET OWES (REQ-QAC-300): one
          # entry of the generic container of list-valued settings, read by the
          # amber setting's own mechanism - effective-dated, nearest level wins,
          # past frozen. A supply is judged against the version in force on its
          # period's ROUND DATE. Each version adds the census whose data the ABS
          # first released in the quarter before (Keith, 2026-10-31, Q10 b).
          list_settings:
            census_years:
              versions:
                - effective_from: "2013-01-01"
                  value: [2011]
                  changelog:
                    - date: "2026-11-01"
                      author: REQ-QAC-300
                      change: Adds 2011 from 2013-01-01, the first period any geocoding dataset owes - the 2011 census's data was first released by the ABS in 2012, so it is in every geocode of the synthetic history.
                - effective_from: "2017-08-01"
                  value: [2011, 2016]
                  changelog:
                    - date: "2026-11-01"
                      author: REQ-QAC-300
                      change: Adds 2016 from 2017-Q3 (round 2017-08-01), the first round after the ABS's first release of the 2016 census's data in late June 2017.
                - effective_from: "2022-08-01"
                  value: [2011, 2016, 2021]
                  changelog:
                    - date: "2026-11-01"
                      author: REQ-QAC-300
                      change: Adds 2021 from 2022-Q3 (round 2022-08-01), the first round after the ABS's first release of the 2021 census's data in late June 2022.
                - effective_from: "2027-08-01"
                  value: [2011, 2016, 2021, 2026]
                  changelog:
                    - date: "2026-11-01"
                      author: REQ-QAC-300
                      change: Adds 2026 from 2027-Q3 (round 2027-08-01), the first round after the ABS's first release of the 2026 census's data, expected mid-2027 - census night was in August 2026.
          datasets:
            - id: linkage-keys
              name: Linkage Keys
              table: linkage_keys
              arrival_pattern: 'linkage_keys\.csv'
              # WHAT IT LINKS, AND HOW EACH IS IDENTIFIED (REQ-QAC-330 criterion 5):
              # the one place every reader learns what a linkage product covers.
              # Each code is the supplier's own, deliberately unlike any name here
              # (Keith, 2026-10-28), so the dataset column is checked by its
              # expected values and nothing works by matching a hierarchy name.
              linked_datasets:
                - dataset: cp-clients
                  code: DOC_CLIENTS
                  id_columns: [cp_client_id]
                - dataset: ed-presentations
                  code: EDDC_PRESENTATION
                  id_columns: [presentation_id]
            # THE GEOCODING RELEASE (REQ-QAC-294 criterion 1): one dataset per
            # geocoded source, each a linked dataset with NO code (criterion 2) -
            # exactly one entry, the source it geocodes and the ordered source
            # columns id_1 onward hold. With no dataset column, a row cannot say
            # which source it is about, so a code-less dataset links one source.
            - id: geo-cp-clients
              name: Client Register Geocodes
              table: geo_cp_clients
              arrival_pattern: 'geo_cp_clients\.csv'
              linked_datasets:
                - dataset: cp-clients
                  id_columns: [cp_client_id]
            - id: geo-ed-presentations
              name: ED Presentations Geocodes
              table: geo_ed_presentations
              arrival_pattern: 'geo_ed_presentations\.csv'
              linked_datasets:
                - dataset: ed-presentations
                  id_columns: [presentation_id]
