# THE MOVE MAP (REQ-TEST-366): every file the asset split moves or divides,
# from its old path to its new path or paths, and the former data_asset_id
# (REQ-QAC-344). Read by qa_tools/common/moved_paths.py, and only for the push
# that carries the move - one whose diff base holds no assets/ folder. The
# next push deletes this file, every line of code that reads it and the check
# id transform (REQ-TEST-366 criterion 3).
#
# A divided file has one `to` per asset; read at the base for one asset it is
# cut to that asset's part, by the member ids listed under `assets` - an
# agency, collection, dataset, calendar or declared correction of another
# asset is that asset's, everything else is both assets'.
former_data_asset_id: data-asset-1
assets:
  daily:
    agencies: [registry-services]
    collections: [civil-registration]
    datasets: [birth-registrations]
    calendars: [daily]
    change_references: [REQ-GEN-205-WINDOW]
  quarterly:
    agencies: [child-protection-family-support, department-of-health]
    collections: [child-protection, emergency-department, linkage-products]
    datasets: [cp-clients, cp-notifications, cp-investigations, cp-placements, cp-carers, cp-case-workers, ed-presentations, linkage-keys, geo-cp-clients, geo-ed-presentations]
    calendars: [quarterly]
    change_references: [REQ-GEN-205, REQ-PIPE-181, REQ-GEN-218]
moves:
  - from: contract/data-asset.yaml
    to: [assets/daily/data-asset.yaml, assets/quarterly/data-asset.yaml]
  - from: contract/calendar.yaml
